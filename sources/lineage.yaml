  - id: crosssum-in
    curation: curated
    origin: derived
    collections:
      - xl-sum-bbc
    parents: []
    effort: indicgenbench-translation
    domains:
      - news
    notes: 'CrossSum pairs BBC articles with summaries across XL-Sum''s language services. IndicGenBench
      had the English summaries of 700 English pairs translated into its languages and, for 9 languages
      it does not name, took 100/100/500 pairs from CrossSum itself. CrossSum carries 10 of IndicGenBench''s
      29 languages, so for those 10 the effort behind the summaries is not stated (the override). IndicGenBench''s
      CrossSum-IN, FLORES-IN, XQuAD-IN and XorQA-IN translations share one effort: its card describes
      one annotator pool per language across the datasets.'
    overrides:
      - languages:
          - ben
          - guj
          - hin
          - mar
          - nep
          - pan
          - pus
          - tam
          - tel
          - urd
        effort: null
        sources:
          - url: https://arxiv.org/pdf/2404.16816
            shows: '"CrossSum already contains data for 9 of our 29 target languages; for these languages
              we sample 100/100/500 examples from the original dataset"'
            accessed: '2026-11-03'
            http_status: 200
            content_sha256: dd07c6ffc29ed98d61640395601a2931edb43f051f782549274cbb5a9e41d8d3
          - url: https://raw.githubusercontent.com/csebuetnlp/CrossSum/main/README.md
            shows: 'the language table''s header row lists bn, gu, hi, mr, np, ps, pa, ta, te and ur
              among CrossSum''s languages: "Language (ISO 639-1-Code) | am | ar | az | bn | my | zh-CN
              | zh-TW | en | fr | gu | ha | hi | ig | id | ja | rn | ko | ky | mr | np | om | ps | fa
              | pcm | pt | pa | ru | gd | sr | sr | si | so | es | sw | ta | te | th | ti | tr | uk
              | ur | uz | vi | cy | yo"'
            accessed: '2026-11-03'
            http_status: 200
            content_sha256: bd911faf378b29dbfb1faa5abf8464b01c39802db884d0fb00a2aa7070b70e72
    sources:
      - url: https://arxiv.org/pdf/2404.16816
        shows: '"a dataset for crosslingual summarization, which in turn is derived from XL-Sum"; "We
          sample 700 English article-summary pairs (100 each from train/dev and 500 from test) and ask
          human translators to translate the English summary into the target Indic languages"'
        accessed: '2026-11-03'
        http_status: 200
