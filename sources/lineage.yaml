components:
  - id: flores-plus
    curation: curated
    origin: original
    collections:
      - flores-200
    parents: []
    effort: flores-200-translation
    domains:
      - wikinews
      - wikijunior
      - wikivoyage
    notes: One translation effort is recorded for every FLORES-200 language. The FLORES-101 and NLLB translations
      are both Meta-commissioned professional translations of the same sentences; merging them can only
      make a pair more dependent, never less. Suites that import FLORES-200 (SEA-HELM, AfroBench) use
      this record. A language whose only FLORES+ text has its own OLDI data card, behind the Hub gate,
      carries no effort (the override). A language that only gained a second variety with its own card
      (cat, khk, lmo, mni, nya, oci, tso) keeps the FLORES-200 effort for the variety FLORES-200 translated.
    overrides:
      - languages:
          - apd
          - arg
          - ast
          - ccp
          - chv
          - cmn
          - dar
          - fil
          - frp
          - kaa
          - kjh
          - lij
          - lld
          - mfe
          - mhr
          - myv
          - nob
          - seh
          - tyv
          - udm
          - uzs
          - vmw
          - wuu
          - yue
          - zgh
        effort: null
        sources:
          - url: https://huggingface.co/datasets/openlanguagedata/flores_plus
            shows: '"The datasets for some language varieties have individual datacards describing their
              creation. These can be found in the dataset_cards directory."'
            accessed: '2026-11-02'
            http_status: 200
            content_sha256: 9a32fd3840e9b6b28c1896b1f78b0c7ad8a79e24ae90d617cc6206b31dbf8bd9
          - url: https://huggingface.co/api/datasets/openlanguagedata/flores_plus/tree/main/dataset_cards
            shows: the dataset_cards directory lists "apd_Arab.md", "arg_Latn.md", "ast_Latn.md", "ccp_Cakm.md",
              "chv_Cyrl.md", "cmn_Hans.md", "cmn_Hant.md", "dar_Cyrl.md", "fil_Latn.md", "frp_Latn.md",
              "kaa_Latn.md", "kjh_Cyrl.md", "lij_Latn.md", "lld_Latn.md", "mfe_Latn.md", "mhr_Cyrl.md",
              "myv_Cyrl.md", "nob_Latn.md", "seh_Latn_MZ.md", "tyv_Cyrl.md", "udm_Cyrl.md", "uzs_Arab.md",
              "vmw_Latn.md", "wuu_Hans.md", "yue_Hant.md" and "zgh_Tfng.md"; fetching a card itself returns
              HTTP 401 (gated), so who produced these texts is not stated anywhere readable
