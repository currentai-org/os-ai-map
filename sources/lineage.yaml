# Component lineage: where each evaluation component's items come from, so the depth ladder can
# tell independent corroboration from dependent evidence (R-2026-11-02-h, -i, -j, -u). One cited
# record per component, never per suite that imports it. Pairwise statuses are derived by
# build/lineage.py. Schema: docs/schemas/lineage.schema.json. Normative: docs/reference/capability.md,
# "Component lineage". Filled by the lineage audit; until a component has an entry, every pair it is
# in is unverified unless dependence is already known, and `build.validate` says how many are missing.
version: 1
collections:
  - id: flores-200
    description: 'FLORES-200''s sentences: the English sentences FLORES-101 sampled in equal amounts from
      Wikinews, Wikijunior and Wikivoyage for its dev and devtest splits, and every translation aligned
      to them by sentence id. FLORES+ continues this set.'
    sources:
      - url: https://huggingface.co/datasets/openlanguagedata/flores_plus
        shows: '"The original English sentences were sampled in equal amounts from Wikinews (an international
          news source), Wikijunior (a collection of age-appropriate non-fiction books), and Wikivoyage
          (a travel guide)"; "FLORES+ is based on FLORES-200"'
        accessed: '2026-11-02'
        http_status: 200
        content_sha256: 9a32fd3840e9b6b28c1896b1f78b0c7ad8a79e24ae90d617cc6206b31dbf8bd9
