components:
  - id: flores-plus
    curation: curated
    origin: original
    collections:
      - flores-200
    parents: []
    effort: flores-200-translation
    domains:
      - wikinews
      - wikijunior
      - wikivoyage
    notes: One translation effort is recorded for every FLORES-200 language. The FLORES-101 and NLLB translations
      are both Meta-commissioned professional translations of the same sentences; merging them can only
      make a pair more dependent, never less. Suites that import FLORES-200 (SEA-HELM, AfroBench) use
      this record. A language whose only FLORES+ text has its own OLDI data card, behind the Hub gate,
      carries no effort (the override). A language that only gained a second variety with its own card
      (cat, khk, lmo, mni, nya, oci, tso) keeps the FLORES-200 effort for the variety FLORES-200 translated.
    overrides:
      - languages:
          - apd
          - arg
          - ast
          - ccp
          - chv
          - cmn
          - dar
          - fil
          - frp
          - kaa
          - kjh
          - lij
          - lld
          - mfe
          - mhr
          - myv
          - nob
          - seh
          - tyv
          - udm
          - uzs
