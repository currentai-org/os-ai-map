      - url: https://huggingface.co/datasets/openlanguagedata/flores_plus
        shows: '"The data consists of translations primarily from English into over 200 language varieties";
          "FLORES+ is based on FLORES-200"'
        accessed: '2026-11-02'
        http_status: 200
        content_sha256: 9a32fd3840e9b6b28c1896b1f78b0c7ad8a79e24ae90d617cc6206b31dbf8bd9
      - url: https://arxiv.org/abs/2207.04672
        shows: '"a human-translated benchmark, Flores-200"'
