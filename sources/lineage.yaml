  - id: include-benchmark
    curation: curated
    origin: original
    collections:
      - include-local-exams
    parents: []
    effort: include-local-exams
    notes: INCLUDE-base samples INCLUDE's pool, which joins exams INCLUDE collected itself with six published
      benchmarks (existing data is 39.8% of INCLUDE and 31.7% of INCLUDE-base, with no per-language share
      published). The overrides name the published benchmark a language's pool contains, so a pair is dependent
      wherever overlap cannot be ruled out. Arabic, Persian and Turkish carry the parent benchmark's own text,
      so those are parents. Albanian, French, German, Italian, Lithuanian, Polish and Portuguese are the languages
      the paper says hold both existing and newly collected data that no single-language benchmark covers, so
      their existing data is EXAMS. Whether EXAMS also feeds INCLUDE's other EXAMS languages is not stated.
