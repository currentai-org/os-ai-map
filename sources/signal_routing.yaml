# Which machine signal is authoritative for which scoring dimension. Read by Layer-2
# research (via build/check_routing.py) before spending an LLM on a dimension a cached,
# dated source can already answer.
# Ruling: docs/reference/adoption.md, "Routing is by artifact kind, not by product".
# Ruling: docs/reference/adoption.md, "Abstain rather than substitute".

version: 2
verified_on: '2026-07-28'

# Where each artifact kind's facts live. `key` is the join column back to the
# registry; a source with no key cannot be used until a bridge exists.
sources:
  github:
    artifact_key: github
    table: currentai.signal_github.artifact_state
    key: product_slug
    evidence_url: https://github.com/{repo}
    bridged: true
  huggingface_model:
    artifact_key: huggingface_model
    table: currentai.signal_huggingface.artifact_state
    key: product_slug
    filter: artifact_kind = 'huggingface_model'
    evidence_url: https://huggingface.co/{artifact_id}
    bridged: true
  huggingface_dataset:
    artifact_key: huggingface_dataset
    table: currentai.signal_huggingface.artifact_state
    key: product_slug
    filter: artifact_kind = 'huggingface_dataset'
    evidence_url: https://huggingface.co/datasets/{artifact_id}
    bridged: true
  pypi:
    artifact_key: pypi
    table: currentai.signal_packages.downloads
    key: product_slug
    filter: artifact_kind = 'pypi'
    evidence_url: https://pypistats.org/packages/{package}
    bridged: true
  npm:
    artifact_key: npm
    table: currentai.signal_packages.downloads
    key: product_slug
    filter: artifact_kind = 'npm'
    evidence_url: https://www.npmjs.com/package/{package}
    bridged: true
    bridge_note: >
      BRIDGED 2026-09-13 by `signal_packages.downloads`, which fetches 18 months of npm
      history. 17 npm artifacts are now measured; the observation layer carries them as
      `artifact_kind = 'npm'` rather than mislabelled as PyPI.

      KEPT because the reason it existed is worth not losing. While unbridged, 11 of the
      then-13 npm products recorded `usage_volume` - a DOWNLOAD COUNT on a registry nothing
      in the pipeline could read, `mcp-typescript-sdk` and `openclaw` at level 5. An
      unbridged route does not produce a capped band; it produces an unfalsifiable one,
      because there is no computed figure for the recorded one to disagree with. Those
      records are now falsifiable, which is the point of bridging rather than a side effect.
      An earlier version of this note said they "fall through to the stars scale and its cap
      of 3", corrected 2026-08-13; that was the more comfortable reading and it was wrong.
  crates:
    artifact_key: crates
    table: currentai.signal_packages.downloads
    key: product_slug
    filter: artifact_kind = 'crates'
    evidence_url: https://crates.io/crates/{package}
    bridged: true
    bridge_note: >
      BRIDGED 2026-09-13 by `signal_packages.downloads`, which fetches 90 days of crates.io
      history. One product (`yomo`) declares a crates package, and it is declared
      `not_primary_channel` — the crate is a Rust SDK for a Go runtime — so it is excluded
      from the banded sum and falls through to its next route. The route is live regardless;
      the exclusion is a curation fact applied one layer up.
  semanticscholar:
    artifact_key: arxiv
    table: currentai.signal_semanticscholar.paper_citations
    key: product_slug
    evidence_url: https://www.semanticscholar.org/paper/{paper_id}
    bridged: true
  artificialanalysis:
    table: currentai.signal_artificialanalysis.model_evaluations
    key: null
    evidence_url: https://artificialanalysis.ai/models/{aa_slug}
    bridged: false
    bridge_note: >
      Keyed on `aa_slug`, with no product_slug column. A product -> aa_slug
      bridge must exist before capability can be routed here. Until then this
      source is declared but unusable, and capability stays hand-authored.
  lmarena:
    table: currentai.signal_lmarena.text_leaderboard
    key: null
    evidence_url: https://lmarena.ai/leaderboard
    bridged: false
    bridge_note: >
      Keyed on `model_name` as published by the arena, which does not match our
      slugs. Same bridge problem as artificialanalysis.

# Ordered routes per dimension. First route whose artifact the product actually
# has, wins. `governs` records what the value is a fact ABOUT, so a license
# attached to code is never read as a license attached to weights.
dimensions:

  license:
    question: Which license governs the artifact being scored?
    # `abstain_values`: the authoritative "no answer" values for this SOURCE.
    # `evidence_policy.yaml` owns the separate question of whether a DOCUMENT is
    # admissible. build/serialize_rubric.py reads these into registry.evidence_abstentions.
    routes:
    - source: huggingface_model
      column: license
      governs: weights
      confidence: high
      abstain_values: [other, cc]
      abstain_note: >
        `other` is the Hub's escape hatch for "read the repo", and bare `cc` names
        a license family with no version and no terms. Both are an absence of
        information, not evidence of a permissive or a restrictive license. 12 of
        147 live Hub rows carry one, including 4 base models.
    - source: huggingface_dataset
      column: license
      governs: dataset
      confidence: high
      abstain_values: [other, cc]
    - source: github
      column: license_spdx_id
      governs: code
      confidence: high
      abstain_values: [NOASSERTION]
      abstain_note: >
        GitHub could not classify the LICENSE file. It is an absence of
        information, not evidence of a non-standard license. 25 products hit
        this. Leave it to research.
    never:
    - route: github license -> the weights dimension
      because: >
        Measured wrong for 6 of 6 models where the two disagreed. The code repo
        license is a fact about the code, not the weights.
    normalization:
    - GPLv3 -> GPL-3.0, AGPLv3 -> AGPL-3.0, case-insensitive
    - strip a leading `app=` / `code=` / `model=` qualifier
    - '`assumed-X` keeps tier X but caps confidence at medium'

    # `huggingface:` maps a Hub license SLUG to its published name; naming only, no
    # tier assigned. Ruling: docs/reference/openness.md, "The license scale".
    aliases:
      huggingface:
        apache-2.0: Apache-2.0
        mit: MIT
        bsd-3-clause: BSD-3-Clause
        gemma: Gemma-License
        llama2: Llama-2-Community-License
        llama3: Llama-3-Community-License
        llama3.1: Llama-3.1-Community-License
        llama3.2: Llama-3.2-Community-License
        llama4: Llama-4-Community
        bigcode-openrail-m: BigCode-OpenRAIL-M
        odc-by: ODC-By-1.0
        cc0-1.0: CC0-1.0
        cc-by-4.0: CC-BY-4.0
        cc-by-sa-4.0: CC-BY-SA-4.0
        cc-by-nc-sa-4.0: CC-BY-NC-SA-4.0
        etalab-2.0: Etalab-Open-License-2.0

      # `recorded:` canonicalizes the name a human typed into a `components` string,
      # the same naming problem one layer over from `huggingface:` above; neither
      # assigns a tier. Ruling: docs/reference/openness.md, "The license scale".
      recorded:
        # `shieldgemma` needs its own entry here: `recorded_license_aliases()` does not
        # read the `huggingface:` table above, even though that alias already exists.
        gemma: Gemma-License
        gemma-terms-of-use: Gemma-License
        glm-4: GLM-4-License
        llama-2-community: Llama-2-Community-License
        llama-3-community: Llama-3-Community-License
        llama-3.1-community: Llama-3.1-Community-License
        llama-3.2-community: Llama-3.2-Community-License
        nvidia-nemotron-open-model-license: NVIDIA-Open-Model-License
        # `internlm` describes its license descriptively rather than by name; it names
        # InternLM's "Free Commercial License". Aliased rather than left as a tier
        # example, since that generic phrase in an `examples` list would be a
        # per-product override wearing a license's clothes.
        custom weights license: InternLM-Free-Commercial-License

  weights:
    question: Are the trained weights downloadable and runnable locally?
    routes:
    - source: huggingface_model
      columns: [is_gated, gated_mode, is_private, is_disabled, used_storage_bytes]
      governs: weights
      derivation: >
        open when the repo is public, not disabled, and carries weight files;
        gating is recorded in value_detail rather than closing the dimension,
        since a click-through gate is not the same as withheld weights.
      confidence: high
    unroutable_note: >
      A model distributed outside the Hub has no signal here. Research it.

  code:
    question: Is the source released, and is the project still alive?
    routes:
    - source: github
      columns: [is_archived, is_disabled, pushed_at, html_url]
      governs: code
      derivation: >
        Presence and liveness only. Whether the code constitutes a full training
        pipeline versus inference-only is a judgment the API cannot make, so this
        route informs `code` but does not settle it.
      settles_dimension: false
      confidence: high

  adoption:
    question: How widely is this actually used?
    # Ruling: docs/reference/adoption.md, "Authority is declared, not inferred".
    routes:
    - source: pypi
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
    - source: huggingface_model
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
    - source: huggingface_dataset
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
    - source: semanticscholar
      column: citation_count
      signal_type: usage_volume
      authority: authoritative
      applies_to_categories: [benchmark_eval_data]
      confidence: high
      note: >
        For a benchmark, citations measure reach better than downloads: the
        question is how many papers evaluate against it.
    - source: npm
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
      note: >
        BRIDGED 2026-09-13 by signal_packages.downloads, which fetches 18 months of npm
        history; 17 npm artifacts are measured. This route now resolves to an observation
        rather than leaving a declaring product unmeasured.

        It was declared as an authoritative usage route while unbridged so that a product
        declaring an npm package selected it and was left UNMEASURED rather than falling
        through to the fallback stars route — an unbridged authoritative instrument must
        not be scored on a weaker signal. That reasoning is kept because it is why the
        route existed before it could measure anything; what changed is only that it now
        can. It still ranks after the other download channels.
    - source: crates
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
      note: >
        BRIDGED 2026-09-13, same shape as the npm route: signal_packages.downloads fetches
        90 days of crates.io history. One product declares a crates package and it is
        declared not_primary_channel, so it is excluded from the banded sum and falls
        through to its next route — a curation fact applied one layer up, not a property
        of this route. Declared, while unbridged, so a crates-only product was unmeasured
        on its authoritative route rather than scored on stars.
    - source: null
      signal_type: active_users
      authority: authoritative
      hand_authored: true
      confidence: medium
      note: >
        No machine route, and there will not be one: the figure is a vendor MAU/WAU
        disclosure read by a person from an earnings call, a launch post or a press
        report. The scale is declared anyway, for the same reason the stars scale is -
        an instrument without a declared vocabulary is an instrument whose labels
        nobody can check.
      # Ruling: docs/reference/adoption.md, "The active-users scale, declared 2026-08-13".
      # requires_evidence: no artifact backs a hand-read disclosure, so the claim must be
      # re-checkable and age instead — the same reasoning as reported_traction below.
      requires_evidence: [accessed, content_sha256]
      unit: monthly active users of the surface the product is, or that it powers
      bands:
      - {level: 5, above: 10000000, reach: '>10M users'}
      - {level: 4, above: 1000000, reach: 1M-10M users}
      - {level: 3, above: 100000, reach: 100K-1M users}
      - {level: 2, above: 10000, reach: 10K-100K users}
      - {level: 1, above: -1, reach: <10K users}
      attribution_note: >
        A model scores on the surface it powers (`gpt-5` on ChatGPT), which the score's
        note must say out loud. What the scale will NOT accept silently is a figure
        that is not an active count: an all-time or cumulative user total, a device
        installed base, a paid-seat count. Those are the `active_users` form of the
        under-coverage error in docs/reference/adoption.md - a substitution wearing a
        measurement's label - and the score must either find an active figure or say
        in its note which quantity it actually banded on.
    - source: github
      column: stargazers_count
      signal_type: stars_fallback
      authority: fallback
      confidence: low
      note: >
        Last resort, and explicitly last. Stars measure attention, not use, and
        the rubric already ranks this below every real usage signal.
      # Ruling: docs/reference/adoption.md, "Two scales are per instrument, not per type".
      cap: 3
      cap_because: >
        Stars measure attention, not use, so a stars-derived band may never claim
        the top two levels however large the count. The corpus already respects
        this: no stars_fallback product records 4 or 5.
      bands:
      - {level: 3, above: 10000, reach: '>10K stars'}
      - {level: 2, above: 1000, reach: 1K-10K stars}
      - {level: 1, above: -1, reach: <1K stars}
    - source: null
      signal_type: reported_traction
      authority: fallback
      hand_authored: true
      confidence: low
      note: >
        The instrument of last resort before abstention: a credible vendor or third-party
        claim about standing, with no count behind it. Used where the product has no
        countable artifact at all - a hosted API, a closed model, a feature inside a
        cloud platform.
      # Ruling: docs/reference/adoption.md, "`reported_traction` records a word, never a
      # number" and "The instrument is itself a claim, and it needs backing".
      requires_evidence: [accessed, content_sha256]
      vocabulary: [niche, broad, mass-market]
      vocabulary_note: >
        `reach` is OPTIONAL on this instrument and omitting it is the honest default -
        15 records already do. A word is worth recording only where it says something
        the level does not, which is usually the shape of the traction rather than its
        size: `osprey` at 446 GitHub stars but in production at Discord is `niche` in a
        way that matters. Three strays were folded in on 2026-08-13 rather than
        admitted as new words - `enterprise` (snorkel-flow, nemo-data-designer) and
        `early / niche` (datology-ai) all became `niche`, since the level beside them
        already carried the distinction they were reaching for.
    aggregation:
    - rule_id: sum_usage_across_artifacts
      method: sum
      scope: artifacts
      applies_to_instrument: usage_volume
      note: >
        A model family ships several SKUs. The map's unit is the family, so
        downloads sum across its artifacts rather than taking the largest.
    - rule_id: sum_stars_across_artifacts
      method: sum
      scope: artifacts
      applies_to_instrument: stars_fallback
      note: >
        A product may ship several repositories, and the map's unit is the family, so a
        stars-fallback band sums stargazers across the product's repos within the winning
        route — the same reason usage_volume sums. This is not new semantics: the deployed
        per-source compatibility model computes SUM(stargazers_count) across a product's
        repos, docs/reference/adoption.md declares the map's unit is the product family, and
        recorded assessments already band the sum (bigcodebench sums its two repositories).
        The stars cap still applies through the band set, whose levels stop at 3, so summing
        cannot lift a stars figure above the attention ceiling.

  capability:
    question: How good is it, measured independently?
    routes:
    - source: artificialanalysis
      column: artificial_analysis_intelligence_index
      applies_to_categories: [base_pretrained, finetuned_chat]
      blocked_by: bridge
    - source: lmarena
      column: rating
      applies_to_categories: [finetuned_chat]
      blocked_by: bridge
    - source: semanticscholar
      column: citation_count
      applies_to_categories: [benchmark_eval_data]
      confidence: medium
      note: >
        Citations are a reach signal, not a quality one. Usable as corroboration
        for a benchmark's standing, not as the capability score itself.
    status: >
      Effectively unroutable, and more permanently than "until the bridge lands"
      suggests. The two external anchors are unbridged AND both rank models, so
      neither can say anything about a training framework, a sandbox or a
      dataset tool. No category has calibrated 1-5 thresholds either. MLPerf
      Training was checked on 2026-08-08 as the obvious candidate for the
      software categories and rejected: it names exactly 1 of our 27
      finetuning_code slugs across five rounds, its `framework` field is free
      text describing the submitter's container rather than the library under
      test, and 117 of 119 v6.0 rows are closed division, which by rule holds
      the software constant. It measures hardware.
      What actually places many bands is a comparison to a peer in the same
      category, so that is recorded rather than routed: capability.relative_to
      and capability.relation, gated by build/check_capability.py. See
      docs/reference/evidence-and-freshness.md, "What a capability confirmation attests to".

# Dimensions with no machine signal at all, listed so their absence is a
# recorded decision rather than an oversight.
research_only:
  data:
    why: >
      Whether a pretraining corpus is released, or reconstructible from released
      scripts, is not exposed by any API. A dataset card describing sources does
      not answer it.
  checkpoints:
    why: Intermediate checkpoints on HF branches are not surfaced in the Hub API summary.
  governance:
    why: Who controls the roadmap is a question about an organization, not an artifact.
