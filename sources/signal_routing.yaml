# Which machine signal is authoritative for which scoring dimension.
#
# Layer-2 research uses this to answer what it can from cached, dated,
# traceable sources before spending an LLM on anything. It is the difference
# between a refresh that is cheap and defensible and one that quietly
# corrupts good data.
#
# ## Routing is by ARTIFACT KIND, not by product
#
# This is the whole reason the file exists. A model's code repository and its
# weights routinely carry different licenses, and the code repo is the wrong
# answer for the weights dimension.
#
# Measured on 2026-07-28 against the 239 products with a GitHub license signal:
# 175 agreed exactly with the recorded value, 5 differed only in formatting,
# 25 returned NOASSERTION, and 13 genuinely disagreed. In every model case
# among those 13, Hugging Face agreed with the recorded value and GitHub was
# the outlier — glm-5-2 (recorded MIT, HF mit, GitHub Apache-2.0), lucie-7b
# (recorded Apache-2.0, HF apache-2.0, GitHub GPL-3.0), and likewise mimo-v2-5-pro,
# zephyr and tulu-3.
#
# So a naive "refresh license from GitHub" pass would have overwritten six
# correct model scores with the wrong license, each change looking like a
# well-sourced improvement. Route by artifact kind and that class of error
# cannot occur.
#
# ## Abstain rather than substitute
#
# When the authoritative signal for a dimension is missing or unusable, the
# rule is to produce NO evidence and leave the dimension to research. Falling
# through to a less authoritative signal is how the failure above happens.

version: 1
verified_on: '2026-07-28'

# Where each artifact kind's facts live. `key` is the join column back to the
# registry; a source with no key cannot be used until a bridge exists.
sources:
  github:
    artifact_key: github
    table: currentai.signal_github.repo_state
    key: product_slug
    evidence_url: https://github.com/{repo}
    bridged: true
  huggingface_model:
    artifact_key: huggingface_model
    table: currentai.signal_huggingface.hub_state
    key: product_slug
    filter: artifact_kind = 'huggingface_model'
    evidence_url: https://huggingface.co/{artifact_id}
    bridged: true
  huggingface_dataset:
    artifact_key: huggingface_dataset
    table: currentai.signal_huggingface.hub_state
    key: product_slug
    filter: artifact_kind = 'huggingface_dataset'
    evidence_url: https://huggingface.co/datasets/{artifact_id}
    bridged: true
  pypi:
    artifact_key: pypi
    table: currentai.signal_pypi.package_downloads
    key: product_slug
    evidence_url: https://pypistats.org/packages/{package}
    bridged: true
  npm:
    artifact_key: npm
    table: null
    key: null
    evidence_url: https://www.npmjs.com/package/{package}
    bridged: false
    bridge_note: >
      13 products declare an npm package and no signal model reads the npm registry. npm
      download counts are a direct analogue of the pypi route, so this is a missing model
      rather than a missing method. Declared here so the gap is a backlog entry rather than
      an invisible one.

      CORRECTED 2026-08-13. This note used to say those products "fall through to the stars
      scale and its cap of 3", which is not what happened and was the more comfortable
      reading. 11 of the 13 record `usage_volume` - they claim a DOWNLOAD COUNT on a registry
      nothing in the pipeline can read, `mcp-typescript-sdk` and `openclaw` at level 5. An
      unbridged route does not produce a capped band; it produces an unfalsifiable one,
      because there is no computed figure for the recorded one to disagree with.
      `build/check_instrument.py` now gates the general case.
  crates:
    artifact_key: crates
    table: null
    key: null
    evidence_url: https://crates.io/crates/{package}
    bridged: false
    bridge_note: >
      One product (`yomo`) declares a crates package. Same shape as npm: crates.io publishes
      download counts and no model reads them.
  semanticscholar:
    artifact_key: arxiv
    table: currentai.signal_semanticscholar.paper_citations
    key: product_slug
    evidence_url: https://www.semanticscholar.org/paper/{paper_id}
    bridged: true
  artificialanalysis:
    table: currentai.signal_artificialanalysis.model_evaluations
    key: null
    evidence_url: https://artificialanalysis.ai/models/{aa_slug}
    bridged: false
    bridge_note: >
      Keyed on `aa_slug`, with no product_slug column. A product -> aa_slug
      bridge must exist before capability can be routed here. Until then this
      source is declared but unusable, and capability stays hand-authored.
  lmarena:
    table: currentai.signal_lmarena.text_leaderboard
    key: null
    evidence_url: https://lmarena.ai/leaderboard
    bridged: false
    bridge_note: >
      Keyed on `model_name` as published by the arena, which does not match our
      slugs. Same bridge problem as artificialanalysis.

# Ordered routes per dimension. First route whose artifact the product actually
# has, wins. `governs` records what the value is a fact ABOUT, so a license
# attached to code is never read as a license attached to weights.
dimensions:

  license:
    question: Which license governs the artifact being scored?
    # `abstain_values` is the authoritative list of values that mean "this source
    # has no answer for this column". It lives here, on the route, because
    # abstention is a fact about a SOURCE, and this file is what owns source
    # semantics. `evidence_policy.yaml` owns the separate question of whether a
    # DOCUMENT is admissible. Keeping the two apart is deliberate: an earlier draft
    # declared NOASSERTION in both files, which is exactly the drift this bridge
    # exists to prevent. build/serialize_rubric.py reads these into the
    # registry.evidence_abstentions table, so the warehouse never hardcodes them.
    routes:
    - source: huggingface_model
      column: license
      governs: weights
      confidence: high
      abstain_values: [other, cc]
      abstain_note: >
        `other` is the Hub's escape hatch for "read the repo", and bare `cc` names
        a license family with no version and no terms. Both are an absence of
        information, not evidence of a permissive or a restrictive license. 12 of
        147 live Hub rows carry one, including 4 base models.
    - source: huggingface_dataset
      column: license
      governs: dataset
      confidence: high
      abstain_values: [other, cc]
    - source: github
      column: license_spdx_id
      governs: code
      confidence: high
      abstain_values: [NOASSERTION]
      abstain_note: >
        GitHub could not classify the LICENSE file. It is an absence of
        information, not evidence of a non-standard license. 25 products hit
        this. Leave it to research.
    never:
    - route: github license -> the weights dimension
      because: >
        Measured wrong for 6 of 6 models where the two disagreed. The code repo
        license is a fact about the code, not the weights.
    normalization:
    - GPLv3 -> GPL-3.0, AGPLv3 -> AGPL-3.0, case-insensitive
    - strip a leading `app=` / `code=` / `model=` qualifier
    - '`assumed-X` keeps tier X but caps confidence at medium'

    # Hugging Face publishes a license SLUG, not the license name a rubric's tier
    # examples use. Without this map `gemma` and `llama3.1` match no tier and the
    # signal reads as ABSENT while it is in fact present and use-restricting -
    # which is the failure that overstates openness. 12 of the 47 base models
    # depend on an alias to route their license at all.
    #
    # These are aliases only. They say what a slug is CALLED, which is a fact
    # about the Hub. They deliberately do NOT say what tier it belongs to, which
    # is a judgment each category's `scoring_recipe` makes for itself. A slug that
    # aliases to a name absent from the category's license_tier examples abstains,
    # and that abstention is the signal to extend the rubric rather than to guess.
    aliases:
      huggingface:
        apache-2.0: Apache-2.0
        mit: MIT
        bsd-3-clause: BSD-3-Clause
        gemma: Gemma-License
        llama2: Llama-2-Community-License
        llama3: Llama-3-Community-License
        llama3.1: Llama-3.1-Community-License
        llama3.2: Llama-3.2-Community-License
        llama4: Llama-4-Community
        bigcode-openrail-m: BigCode-OpenRAIL-M
        odc-by: ODC-By-1.0
        cc0-1.0: CC0-1.0
        cc-by-4.0: CC-BY-4.0
        cc-by-sa-4.0: CC-BY-SA-4.0
        cc-by-nc-sa-4.0: CC-BY-NC-SA-4.0
        etalab-2.0: Etalab-Open-License-2.0

      # The same problem one layer over: the name a HUMAN typed into a
      # `components` string. The Hub table above canonicalizes what a source
      # publishes; this canonicalizes what the repo recorded. Both are facts about
      # naming and neither assigns a tier.
      #
      # Left unmapped these read as an ABSENT license while the license is present
      # and use-restricting, which is the direction of error that overstates
      # openness - the same failure the Hub aliases exist to prevent. It went
      # unnoticed while one category had a rubric, because the pilot happened to
      # write the canonical name most of the time. Porting the rubric to a second
      # category surfaced eight products whose license mapped to no tier, four of
      # them nothing more than a spelling.
      #
      # `Gemma-Terms-of-Use` is Google's published name; `Gemma-License` is the
      # repo's shorthand and the name the Hub alias already produces, so the
      # shorthand wins for consistency with the signal. `glm-4` is a Hub-style
      # slug that base_pretrained had adopted as a tier example; the license name
      # is `GLM-4-License`, so that example moves and the slug becomes an alias.
      recorded:
        # `shieldgemma` records the bare family name. The alias already existed two tables
        # up under `huggingface:`, which `recorded_license_aliases()` does not read, so the
        # product abstained on a lookup miss rather than on anything about its license.
        gemma: Gemma-License
        gemma-terms-of-use: Gemma-License
        glm-4: GLM-4-License
        llama-2-community: Llama-2-Community-License
        llama-3-community: Llama-3-Community-License
        llama-3.1-community: Llama-3.1-Community-License
        llama-3.2-community: Llama-3.2-Community-License
        nvidia-nemotron-open-model-license: NVIDIA-Open-Model-License
        # `internlm` records the second half of its compound license descriptively rather
        # than by name. The license it describes has one: InternLM's "Free Commercial
        # License", academic use free and commercial use free after an application form.
        # Aliased rather than left to a tier example, because a phrase this generic sitting
        # in a rubric's `examples` list is a per-product override wearing a license's
        # clothes. If a second product ever records the same words for a different license,
        # the fix is to make both of them name theirs.
        custom weights license: InternLM-Free-Commercial-License

  weights:
    question: Are the trained weights downloadable and runnable locally?
    routes:
    - source: huggingface_model
      columns: [is_gated, gated_mode, is_private, is_disabled, used_storage_bytes]
      governs: weights
      derivation: >
        open when the repo is public, not disabled, and carries weight files;
        gating is recorded in value_detail rather than closing the dimension,
        since a click-through gate is not the same as withheld weights.
      confidence: high
    unroutable_note: >
      A model distributed outside the Hub has no signal here. Research it.

  code:
    question: Is the source released, and is the project still alive?
    routes:
    - source: github
      columns: [is_archived, is_disabled, pushed_at, html_url]
      governs: code
      derivation: >
        Presence and liveness only. Whether the code constitutes a full training
        pipeline versus inference-only is a judgment the API cannot make, so this
        route informs `code` but does not settle it.
      settles_dimension: false
      confidence: high

  adoption:
    question: How widely is this actually used?
    # `authority` is declared here rather than inferred from the instrument, because it is
    # a routing decision and not a property the instrument name can be trusted to carry.
    # A usage_volume count and a hand-read active-user disclosure are both `authoritative`
    # - each measures use directly; stars and a bare traction claim are `fallback`, the last
    # resorts before abstention. `hand_authored` and `confidence` stay orthogonal: whether a
    # figure was read by a person, and how much to trust it, are separate questions from
    # whether the route is authoritative for the dimension.
    #
    # ROUTE PRECEDENCE is monotonic in authority: the five `authoritative` routes come first,
    # in list order, then the two `fallback` routes — the last resorts before abstention. So a
    # hand-read `active_users` disclosure (authoritative) precedes the `stars_fallback` route,
    # correcting a prior ordering where the authoritative hand-authored route sat AFTER the
    # fallback stars route. Within the authoritative download channels the order is the ADR-001
    # precedence `pypi > huggingface > stars`, so `pypi` leads the two Hugging Face routes.
    routes:
    - source: pypi
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
    - source: huggingface_model
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
    - source: huggingface_dataset
      column: downloads_30d
      signal_type: usage_volume
      authority: authoritative
      confidence: high
    - source: semanticscholar
      column: citation_count
      signal_type: usage_volume
      authority: authoritative
      applies_to_categories: [benchmark_eval_data]
      confidence: high
      note: >
        For a benchmark, citations measure reach better than downloads: the
        question is how many papers evaluate against it.
    - source: null
      signal_type: active_users
      authority: authoritative
      hand_authored: true
      confidence: medium
      note: >
        No machine route, and there will not be one: the figure is a vendor MAU/WAU
        disclosure read by a person from an earnings call, a launch post or a press
        report. The scale is declared anyway, for the same reason the stars scale is -
        an instrument without a declared vocabulary is an instrument whose labels
        nobody can check.
      # Declared 2026-08-13, on Carl's ruling, from the 23 products recording this
      # instrument. All 23 carried a real user figure and 22 wore a label off the
      # DOWNLOAD vocabulary, which nothing had ever declared applied here. So the
      # labels were unfalsifiable rather than wrong: `character-ai` had invented
      # `10M-100M`, which no scale offered, and nobody could say so.
      #
      # SAME THRESHOLDS AS THE DOWNLOAD SCALE, which is a decision and not an
      # inheritance. The alternative considered was one order higher throughout, so
      # that ChatGPT at ~900M weekly actives and Poe at ~18M monthly actives did not
      # both land at 5. That was rejected: a level has to mean one magnitude across the
      # whole map, or `adoption` stops being comparable between a package and an app,
      # and the top band holding a wide range is the ordinary cost of a five-point
      # scale rather than a defect in this instrument. 19 of the 23 sit at level 5,
      # and that is the map saying these are all mass-market surfaces, which they are.
      #
      # The labels carry `users` even so - in fact especially so, since the thresholds
      # now match. An unsuffixed `>10M` is ambiguous between two live scales at
      # identical boundaries, and that ambiguity is the whole reason a download
      # vocabulary could colonize this instrument unnoticed. The suffix is what makes
      # the two scales tellable apart when their numbers do not differ.
      #
      # No cap. Unlike stars, this measures use directly; it is unmeasurable by
      # machine, which is a question about confidence rather than about ceiling.
      # Same reasoning as reported_traction below: no artifact can back a hand-read MAU
      # disclosure, so the claim has to be re-checkable and has to age instead.
      requires_evidence: [accessed, content_sha256]
      unit: monthly active users of the surface the product is, or that it powers
      bands:
      - {level: 5, above: 10000000, reach: '>10M users'}
      - {level: 4, above: 1000000, reach: 1M-10M users}
      - {level: 3, above: 100000, reach: 100K-1M users}
      - {level: 2, above: 10000, reach: 10K-100K users}
      - {level: 1, above: -1, reach: <10K users}
      attribution_note: >
        A model scores on the surface it powers (`gpt-5` on ChatGPT), which the score's
        note must say out loud. What the scale will NOT accept silently is a figure
        that is not an active count: an all-time or cumulative user total, a device
        installed base, a paid-seat count. Those are the `active_users` form of the
        under-coverage error in docs/reference/adoption.md - a substitution wearing a
        measurement's label - and the score must either find an active figure or say
        in its note which quantity it actually banded on.
    - source: github
      column: stargazers_count
      signal_type: stars_fallback
      authority: fallback
      confidence: low
      note: >
        Last resort, and explicitly last. Stars measure attention, not use, and
        the rubric already ranks this below every real usage signal.
      # The stars scale lives HERE rather than in sources/rubrics/<type>.yaml,
      # because it is a property of the INSTRUMENT rather than of the product
      # type. A dataset's downloads run an order below a package's, which is why
      # those bands are per type; a star is a star whatever it was given to.
      # Declaring it once on the route that produces it is also the only way to
      # avoid four copies of a scale that must not drift.
      #
      # Thresholds set 2026-08-10 from the medians the corpus already used: the
      # 71 stars_fallback products with a live GitHub row sit at medians of ~93,
      # ~1,733 and ~15,801 stars for levels 1, 2 and 3. The ranges overlap badly
      # - 20,901 stars recorded at 2 against 77 recorded at 3 - so this scale is
      # a decision that tightens a loose convention rather than a description of
      # one.
      cap: 3
      cap_because: >
        Stars measure attention, not use, so a stars-derived band may never claim
        the top two levels however large the count. The corpus already respects
        this: no stars_fallback product records 4 or 5.
      bands:
      - {level: 3, above: 10000, reach: '>10K stars'}
      - {level: 2, above: 1000, reach: 1K-10K stars}
      - {level: 1, above: -1, reach: <1K stars}
    - source: null
      signal_type: reported_traction
      authority: fallback
      hand_authored: true
      confidence: low
      note: >
        The instrument of last resort before abstention: a credible vendor or third-party
        claim about standing, with no count behind it. Used where the product has no
        countable artifact at all - a hosted API, a closed model, a feature inside a
        cloud platform.
      # Declared 2026-08-13, on Carl's ruling, after measuring what the 110 records
      # carrying this instrument actually said. 68 of them wore a NUMERIC download
      # label, and those labels turned out to be perfectly collinear with the level
      # they sat next to: `100K-1M` was level 3 on all 33 of its records, `1M-10M` was
      # level 4 on all 23, `10K-100K` was level 2 on all 7. The label carried no
      # information the level did not already carry.
      #
      # Worse, it carried information that was false. `amazon-nova` read `1M-10M` under
      # a note saying "no standalone per-model user count published"; `aws-neuron` read
      # `100K-1M` under "no download/user count is published for Neuron". A reader sees
      # a numeric band and concludes somebody counted something. Nobody did. So the
      # numeric vocabulary is not merely redundant here, it is a measurement claim the
      # instrument is defined by NOT being able to make.
      #
      # NO LEVEL MAPPING, deliberately, which is what makes this a `vocabulary` rather
      # than `bands`. The qualitative words are the LESS collinear half of the corpus -
      # `niche` ran 85% level 3, `broad` 80% level 4, `mass-market` 67% level 5 - so
      # they carry residual signal a bands table would flatten by forcing agreement.
      # A word here says what kind of standing was claimed. The level says how much.
      #
      # The three words are hardware's, which already declares `qualitative: true` with
      # an empty bands list and has used exactly these since before this route existed.
      # Sharing them rather than minting a parallel set is the same reasoning as
      # declaring any scale once.
      # What this instrument must have instead of an artifact. It claims no count, so
      # nothing can recompute it; the only thing that can keep it honest is that the claim
      # is re-checkable and AGES. A digest gives both - `check_refetch` re-fetches a sample
      # and reports drift, and drift on a vendor claim page is informative rather than
      # noise: it means the claim may have moved and should be re-read.
      #
      # This is the price of the instrument, and it exists so that switching TO
      # reported_traction is not free. Without it, a `usage_volume` record with nothing
      # countable behind it could satisfy check_instrument by relabelling itself into the
      # one instrument with no scale at all, which would move an unverifiable claim
      # somewhere even less checked. Measured 2026-08-13: 95 of 110 records fall short.
      requires_evidence: [accessed, content_sha256]
      vocabulary: [niche, broad, mass-market]
      vocabulary_note: >
        `reach` is OPTIONAL on this instrument and omitting it is the honest default -
        15 records already do. A word is worth recording only where it says something
        the level does not, which is usually the shape of the traction rather than its
        size: `osprey` at 446 GitHub stars but in production at Discord is `niche` in a
        way that matters. Three strays were folded in on 2026-08-13 rather than
        admitted as new words - `enterprise` (snorkel-flow, nemo-data-designer) and
        `early / niche` (datology-ai) all became `niche`, since the level beside them
        already carried the distinction they were reaching for.
    aggregation:
    - rule_id: sum_usage_across_artifacts
      method: sum
      scope: artifacts
      applies_to_instrument: usage_volume
      note: >
        A model family ships several SKUs. The map's unit is the family, so
        downloads sum across its artifacts rather than taking the largest.

  capability:
    question: How good is it, measured independently?
    routes:
    - source: artificialanalysis
      column: artificial_analysis_intelligence_index
      applies_to_categories: [base_pretrained, finetuned_chat]
      blocked_by: bridge
    - source: lmarena
      column: rating
      applies_to_categories: [finetuned_chat]
      blocked_by: bridge
    - source: semanticscholar
      column: citation_count
      applies_to_categories: [benchmark_eval_data]
      confidence: medium
      note: >
        Citations are a reach signal, not a quality one. Usable as corroboration
        for a benchmark's standing, not as the capability score itself.
    status: >
      Effectively unroutable, and more permanently than "until the bridge lands"
      suggests. The two external anchors are unbridged AND both rank models, so
      neither can say anything about a training framework, a sandbox or a
      dataset tool. No category has calibrated 1-5 thresholds either. MLPerf
      Training was checked on 2026-08-08 as the obvious candidate for the
      software categories and rejected: it names exactly 1 of our 27
      finetuning_code slugs across five rounds, its `framework` field is free
      text describing the submitter's container rather than the library under
      test, and 117 of 119 v6.0 rows are closed division, which by rule holds
      the software constant. It measures hardware.
      What actually places many bands is a comparison to a peer in the same
      category, so that is recorded rather than routed: capability.relative_to
      and capability.relation, gated by build/check_capability.py. See
      docs/reference/evidence-and-freshness.md, "What a capability confirmation attests to".

# Dimensions with no machine signal at all, listed so their absence is a
# recorded decision rather than an oversight.
research_only:
  data:
    why: >
      Whether a pretraining corpus is released, or reconstructible from released
      scripts, is not exposed by any API. A dataset card describing sources does
      not answer it.
  checkpoints:
    why: Intermediate checkpoints on HF branches are not surfaced in the Hub API summary.
  governance:
    why: Who controls the roadmap is a question about an organization, not an artifact.
