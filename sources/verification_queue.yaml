# Axes a verification pass reached and could not settle, with the reason and the date — the
# queue for an axis a re-read opened and could not close (a category's `scoring_recipe.deferred`
# covers what the ladder cannot read at all). Read by build/check_freshness.py,
# build/sweep_status.py and build/axis_assessments.py.
# Ruling: docs/reference/evidence-and-freshness.md, "A hold is a claim about now, not a record
# of history".
version: 1

# Ruling: docs/reference/evidence-and-freshness.md, "A null axis can earn a `last_verified`,
# and should".

held:
  algolia-ai-search:
    adoption:
      because: >-
        The AI Search page still carries its 18,000-customer and query-volume figures, but none of
        them derives the recorded 1M-10M reach: the customer count sits far below it, the query
        figures far above it, and the two query figures disagree with each other by three orders of
        magnitude. Algolia has no registry artifact behind usage_volume. Settling it needs an
        instrument re-read, such as reported_traction on the customer count.
      since: '2026-09-28'
  apify:
    adoption:
      because: >-
        No freshly fetched source supports the level 3 band: apify.com publishes no account, run or
        API-call count, and the Crawlee repository could not be read from this pass. Settling it needs
        a countable channel, such as a declared crawlee or apify-client package.
      since: '2026-09-28'
  daytona-sandbox:
    adoption:
      because: >-
        The daytona PyPI package's trailing-month downloads are 8,836,896 (pypistats, 2026-09-29),
        below the 10,000,000 line for adoption level 5 and inside the level 4 (1M-10M) band. A
        maintainer decision to move adoption to level 4 / 1M-10M, or a later reading back above
        10,000,000, would settle it.
      since: '2026-09-29'
  exa-search-api:
    adoption:
      because: >-
        PyPI downloads of the declared exa-py package band at level 4, while the record carries 3
        on the vendor's developer count. A change of instrument and level is settled by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  firecracker:
    adoption:
      because: >-
        The recorded usage_volume band (level 5) and the applicable github.stargazers_count route
        (level 3) disagree in the adoption reconciliation queue. Settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  firecrawl:
    adoption:
      because: >-
        The record bands on GitHub stars, but the declared firecrawl-py package now has a PyPI download
        signal, which takes precedence. Switching the instrument is settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  google-cloud-run:
    adoption:
      because: >-
        The recorded adoption of usage_volume at level 5 (>10M) for Google Cloud Run rests on no
        absolute count. The only fresh source, Google's Next '26 Cloud Run blog, gives relative
        growth plus a Replit figure of over 1 million live projects. A maintainer decision to
        re-record it as reported_traction and re-band it would settle this, as would a
        Google-published count of active Cloud Run users, services or requests above 10M.
      since: '2026-09-29'
  gvisor:
    adoption:
      because: >-
        The recorded usage_volume band (level 5) and the applicable github.stargazers_count route
        (level 3) disagree in the adoption reconciliation queue. Settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  kata-containers:
    adoption:
      because: >-
        The recorded reported_traction band (level 3) and the applicable github.stargazers_count
        route (level 2) disagree in the adoption reconciliation queue. Settled by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  ollama:
    adoption:
      because: >-
        The recorded usage_volume band (level 4) and the applicable github.stargazers_count route
        (level 3) disagree in the adoption reconciliation queue. Settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  openpcc:
    adoption:
      because: >-
        The recorded reported_traction band (level 2) and the applicable github.stargazers_count
        route (level 1) disagree in the adoption reconciliation queue. Settled by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
    openness:
      because: >-
        The openpcc compute node repository confidentsecurity/confidentcompute is licensed
        FSL-1.1-ALv2 (competition_restricted), not Apache-2.0, so the recorded Apache-2.0-only
        license component and the 5 / open_source score need a maintainer re-rate under the software
        ladder (agent-qa is the FSL-1.1-ALv2 precedent). A ruling on whether the compute node's
        license governs the product score would settle it.
      since: '2026-09-29'
  openrlhf:
    adoption:
      because: >-
        The recorded band and the applicable route measure different instruments, so the levels neither
        agree nor disagree. The instrument choice is settled with the other route disagreements after
        the 5 Oct reconciliation.
      since: '2026-09-28'
  peft:
    adoption:
      because: >-
        The declared peft package measures a lower band on PyPI downloads than the one recorded, close
        to the band edge. The change is settled by the adoption re-band after the 5 Oct reconciliation,
        which re-bands only products that disagree on two consecutive scheduled runs.
      since: '2026-09-28'
  perplexity-sonar-api:
    adoption:
      because: >-
        Level 4 rests on an aggregator-reported consumer audience figure that no cited, fetchable
        source carries. Settling it needs a primary Perplexity disclosure of users or API volume.
      since: '2026-09-28'
    openness:
      because: >-
        No fetchable page carries the API's license or terms. The docs home establishes nothing about
        license or source, and the terms page was not reachable from this pass.
      since: '2026-09-28'
  predibase:
    capability:
      because: >-
        Both cited capability sources are Wayback captures (docs.predibase.com and predibase.com)
        and both fetches failed with connection resets after 6 attempts each, including a second retry;
        the live docs.predibase.com and predibase.com return HTTP 403. No fresh, digested read of
        Predibase's own documentation is possible, so the capability value cannot be re-confirmed.
        The prior fetch failures say nothing about whether the feature claims are true.
      since: '2026-09-28'
  pysyft:
    adoption:
      because: >-
        The record bands at level 2 on GitHub stars, while PyPI downloads of the declared syft package,
        which take precedence, band at level 1. Switching the instrument and level is settled by the
        adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  replit-agent-code-execution-api:
    adoption:
      because: >-
        The only countable artifact, replit-code-exec on PyPI, shows 8 downloads in the last month
        (pypistats sha256 081ea0daa16e70571e393a285994099c56fc55d3990b8e70aa15490cf436c26b,
        re-fetched unchanged on 2026-09-29). That falls in software band level 1 (<10K). The
        recorded level 4 (1M-10M) rests only on a Google Cloud quote about over 1 million live
        Replit projects platform-wide. A maintainer needs to decide whether to re-band to level 1 on
        package downloads or keep an explicitly declared platform proxy with a matching signal_type
        and note.
      since: '2026-09-29'
  sandbox-runtime:
    adoption:
      because: >-
        The recorded usage_volume band (level 4) and the applicable github.stargazers_count route
        (level 2) disagree in the adoption reconciliation queue. Settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  swift:
    adoption:
      because: >-
        The declared ms-swift package measures one band lower on PyPI downloads than recorded. The
        change is settled by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled
        observation run.
      since: '2026-09-28'
  unsloth:
    openness:
      because: >-
        The core-gated dimension has no fresh support: https://unsloth.ai/pricing (the only source
        establishing it) returned HTTP 403 on all attempts, as did www.unsloth.ai/pricing, unsloth.ai/pricing/
        and unsloth.ai; a 403 says nothing about whether the gate is true. Source and license were
        re-read and still hold (Apache-2.0 core, AGPL-3.0 Studio, public repo), but the axis cannot
        be re-dated without the pricing read. Side observation: the README now says "We support Multi
        GPU setups" and the public docs carry Multi-GPU and DDP pages, while the docs page says official
        multi-GPU support is still to be announced, which is consistent with the recorded gate and
        does not contradict it.
      since: '2026-09-28'
  webcontainers:
    adoption:
      because: >-
        The recorded reported_traction band (level 3) and the applicable github.stargazers_count
        route (level 2) disagree in the adoption reconciliation queue. Settled by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
