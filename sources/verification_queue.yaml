# Axes a verification pass reached and could not settle, with the reason and the date — the
# queue for an axis a re-read opened and could not close (a category's `scoring_recipe.deferred`
# covers what the ladder cannot read at all). Read by build/check_freshness.py,
# build/sweep_status.py and build/axis_assessments.py.
# Ruling: docs/reference/evidence-and-freshness.md, "A hold is a claim about now, not a record
# of history".
version: 1

# Ruling: docs/reference/evidence-and-freshness.md, "A null axis can earn a `last_verified`,
# and should".

held:
  boltz:
    adoption:
      since: '2026-09-23'
      because: >-
        Bands on GitHub stars while its declared package is the documented way to obtain the
        checkpoints. The Hub repositories report zero because the package fetches them directly,
        which is the argument for measuring the package, and the category now declares that
        route (#536). currentai.signal_packages.downloads reads 42,564 trailing-30-day PyPI
        downloads of `boltz`, which bands at 2 — the level it already carries, so this is an
        instrument correction rather than a move. Held rather than applied because a
        usage_volume band wants the `derived_from` binding the adoption reconciliation
        produces, and pypistats returns 429 to a hand fetch.
  uma:
    adoption:
      since: '2026-09-23'
      because: >-
        Bands level 1 on Hugging Face downloads of a manually gated repository, while
        `fairchem-core`, the declared package that loads the checkpoints, reads 56,993
        trailing-30-day PyPI downloads in currentai.signal_packages.downloads — a band of 2.
        Gating suppresses the Hub count rather than measuring low use, and the category now
        declares the package route (#536). Held rather than applied for the same reason as
        `boltz`: the binding belongs to the reconciliation, not to a hand edit.
