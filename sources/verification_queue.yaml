# Axes a verification pass reached and could not settle, with the reason and the date — the
# queue for an axis a re-read opened and could not close (a category's `scoring_recipe.deferred`
# covers what the ladder cannot read at all). Read by build/check_freshness.py,
# build/sweep_status.py and build/axis_assessments.py.
# Ruling: docs/reference/evidence-and-freshness.md, "A hold is a claim about now, not a record
# of history".
version: 1

# Ruling: docs/reference/evidence-and-freshness.md, "A null axis can earn a `last_verified`,
# and should".

held:
  algolia-ai-search:
    adoption:
      because: >-
        The AI Search page still carries its 18,000-customer and query-volume figures, but none of
        them derives the recorded 1M-10M reach: the customer count sits far below it, the query figures
        far above it, and the two query figures disagree with each other by three orders of magnitude.
        Algolia has no registry artifact behind usage_volume. Settling it needs an instrument re-read,
        such as reported_traction on the customer count.
      since: '2026-09-28'
  amazon-bedrock-evaluations:
    adoption:
      because: >-
        Level 3 (reported_traction, Bedrock platform footprint) has no cited primary figure behind
        it: neither the product page nor the GA post carries any usage, customer or job-count number.
        Settling it needs a fetchable AWS-published Bedrock platform reach figure (customer count
        or similar) cited as the reach evidence, or a human decision on the band.
      since: '2026-09-29'
  apify:
    adoption:
      because: >-
        No freshly fetched source supports the level 3 band: apify.com publishes no account, run or
        API-call count, and the Crawlee repository could not be read from this pass. Settling it needs
        a countable channel, such as a declared crawlee or apify-client package.
      since: '2026-09-28'
  common-corpus:
    adoption:
      because: >-
