# Axes a verification pass reached and could not settle, with the reason and the date — the
# queue for an axis a re-read opened and could not close (a category's `scoring_recipe.deferred`
# covers what the ladder cannot read at all). Read by build/check_freshness.py,
# build/sweep_status.py and build/axis_assessments.py.
# Ruling: docs/reference/evidence-and-freshness.md, "A hold is a claim about now, not a record
# of history".
version: 1

# Ruling: docs/reference/evidence-and-freshness.md, "A null axis can earn a `last_verified`,
# and should".

held:
  algolia-ai-search:
    adoption:
      because: >-
        The AI Search page still carries its 18,000-customer and query-volume figures, but none of
        them derives the recorded 1M-10M reach: the customer count sits far below it, the query
        figures far above it, and the two query figures disagree with each other by three orders of
        magnitude. Algolia has no registry artifact behind usage_volume. Settling it needs an
        instrument re-read, such as reported_traction on the customer count.
      since: '2026-09-28'
  alia-40b:
    capability:
      because: Its comparison is relative_to apertus, whose capability is held for a joint re-band in this
        run, so the peer was not confirmed. Settled with the apertus, eurollm and luciole re-band.
      since: '2026-09-29'
  apertus:
    adoption:
      because: The 27 Sep scheduled observation run measured this product's Hugging Face downloads and did
        not record an agreement with the stored level, so nothing re-established the band. It is settled
        by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
    capability:
      because: On the Artificial Analysis Intelligence Index Apertus 70B Instruct scores 5 against 10 for
        Llama 4 Maverick, which supports 2 one below llama rather than 3 at llama. eurollm records relative_to
        apertus at, and luciole's new card places it level with EuroLLM-22B, so the move needs a joint re-band
        of apertus, eurollm, luciole and alia-40b.
      since: '2026-09-29'
  apify:
    adoption:
      because: >-
        No freshly fetched source supports the level 3 band: apify.com publishes no account, run or
        API-call count, and the Crawlee repository could not be read from this pass. Settling it needs
        a countable channel, such as a declared crawlee or apify-client package.
      since: '2026-09-28'
  docling:
    adoption:
      because: >-
        PyPI downloads of the declared docling package now measure one band lower than the record
        carries. The change is settled by the adoption re-band after the 5 Oct reconciliation, dated
        from a scheduled observation run.
      since: '2026-09-28'
  exa-search-api:
    adoption:
      because: >-
        PyPI downloads of the declared exa-py package band at level 4, while the record carries 3
        on the vendor's developer count. A change of instrument and level is settled by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  firecrawl:
    adoption:
      because: >-
        The record bands on GitHub stars, but the declared firecrawl-py package now has a PyPI download
        signal, which takes precedence. Switching the instrument is settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  glm:
    adoption:
      because: The 27 Sep scheduled observation run measured this product's Hugging Face downloads and did
        not record an agreement with the stored level, so nothing re-established the band. It is settled
        by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
    openness:
      because: GLM-5.3 (released 2026-08-25) supersedes the governing GLM-5.2 and ships under a custom GLM-5.3
        License instead of MIT, under which a model-as-a-service operator above USD 10 billion in revenue
        needs a Z.ai security review before commercial use, and code reads as partial (inference only).
        Moving the governing release is an identity decision and the license name is not yet in the pretrained
        ladder. Settled by that decision plus a ladder entry (build-rubric); the score is 3 either way.
      since: '2026-09-29'
  gpt-4o:
    adoption:
      because: The level rests on ChatGPT's weekly active users, but OpenAI retired GPT-4o from ChatGPT
        on 13 February 2026 and it remains only in the API, so that figure no longer measures GPT-4o. Settled
        by a GPT-4o-specific API usage figure, or an editorial ruling on whether the axis reads its historical
        reach.
      since: '2026-09-29'
  inflection:
    adoption:
      because: 'The <10K placement is doubtful: the Pi app is live and maintained with more than a million
        lifetime Play installs, and Inflection reports billions of conversations. Neither is a monthly figure,
        so no band can be read. Settled by a disclosed or third-party monthly-active-user figure for Pi
        or the Inflection API.'
      since: '2026-09-29'
  kimi:
    openness:
      because: The weights now ship under the Kimi K3 License (LICENSE replaced 2026-09-02), which requires
        a licensee running a model-as-a-service business with more than $20 million in revenue over twelve
        months to sign a separate agreement with Moonshot before commercial use. That reads as a use-bounded
        license, but the name is not yet listed in the pretrained ladder's license tiers, so the recorded
        license component cannot be corrected in a refresh. Settled by adding the license to the ladder
        (build-rubric) and then recording it; the score is 3 either way.
      since: '2026-09-29'
  llama:
    adoption:
      because: The 27 Sep scheduled observation run measured this product's Hugging Face downloads and did
        not record an agreement with the stored level, so nothing re-established the band. It is settled
        by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  luciole:
    capability:
      because: Luciole-23B-Base's card now compares it with EuroLLM-22B and shows it level in English and
        about 8 points ahead in French, while eurollm is scored 3 and luciole 2. Settled by a joint re-band
        of luciole, eurollm, apertus and alia-40b.
      since: '2026-09-29'
  marin:
    adoption:
      because: The 27 Sep scheduled observation run measured this product's Hugging Face downloads and did
        not record an agreement with the stored level, so nothing re-established the band. It is settled
        by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  minimax:
    openness:
      because: The M3 LICENSE grants non-commercial use by default, and commercial use needs attribution,
        notice and prior written authorization above $20 million in yearly revenue, which is use-bounded;
        the recorded minimax-community name is tiered permissive_non_osi in the ladder. Settled by a ladder
        entry for the M3 license (build-rubric); the score is 3 either way.
      since: '2026-09-29'
  openrlhf:
    adoption:
      because: >-
        The recorded band and the applicable route measure different instruments, so the levels neither
        agree nor disagree. The instrument choice is settled with the other route disagreements after
        the 5 Oct reconciliation.
      since: '2026-09-28'
  peft:
    adoption:
      because: >-
        The declared peft package measures a lower band on PyPI downloads than the one recorded, close
        to the band edge. The change is settled by the adoption re-band after the 5 Oct reconciliation,
        which re-bands only products that disagree on two consecutive scheduled runs.
      since: '2026-09-28'
  perplexity-sonar-api:
    adoption:
      because: >-
        Level 4 rests on an aggregator-reported consumer audience figure that no cited, fetchable
        source carries. Settling it needs a primary Perplexity disclosure of users or API volume.
      since: '2026-09-28'
    openness:
      because: >-
        No fetchable page carries the API's license or terms. The docs home establishes nothing about
        license or source, and the terms page was not reachable from this pass.
      since: '2026-09-28'
  predibase:
    capability:
      because: >-
        Both cited capability sources are Wayback captures (docs.predibase.com and predibase.com)
        and both fetches failed with connection resets after 6 attempts each, including a second retry;
        the live docs.predibase.com and predibase.com return HTTP 403. No fresh, digested read of
        Predibase's own documentation is possible, so the capability value cannot be re-confirmed.
        The prior fetch failures say nothing about whether the feature claims are true.
      since: '2026-09-28'
  pysyft:
    adoption:
      because: >-
        The record bands at level 2 on GitHub stars, while PyPI downloads of the declared syft package,
        which take precedence, band at level 1. Switching the instrument and level is settled by the
        adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  qwen:
    adoption:
      because: The 27 Sep scheduled observation run measured this product's Hugging Face downloads and did
        not record an agreement with the stored level, so nothing re-established the band. It is settled
        by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
    openness:
      because: Qwen3.8 (August 2026) supersedes the governing Qwen3.6 and ships under Qwen's own licenses
        (Qwen Community License 1.0, Qwen3.8-Max License), which require a separate license for model-as-a-service
        and AI work assistant businesses. Moving the governing release is an identity decision and neither
        license name is in the pretrained ladder. Settled by that decision plus a ladder entry (build-rubric);
        the score is 3 either way.
      since: '2026-09-29'
  reka-core:
    adoption:
      because: The only source is the April 2024 launch page, which names partners but no usage, and Reka's
        current API models page lists only reka-flash and reka-edge, so Core's availability is itself in
        doubt. Settled by a current Reka statement on Core's availability and any usage figure.
      since: '2026-09-29'
  swift:
    adoption:
      because: >-
        The declared ms-swift package measures one band lower on PyPI downloads than recorded. The
        change is settled by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled
        observation run.
      since: '2026-09-28'
  unsloth:
    openness:
      because: >-
        The core-gated dimension has no fresh support: https://unsloth.ai/pricing (the only source
        establishing it) returned HTTP 403 on all attempts, as did www.unsloth.ai/pricing, unsloth.ai/pricing/
        and unsloth.ai; a 403 says nothing about whether the gate is true. Source and license were
        re-read and still hold (Apache-2.0 core, AGPL-3.0 Studio, public repo), but the axis cannot
        be re-dated without the pricing read. Side observation: the README now says "We support Multi
        GPU setups" and the public docs carry Multi-GPU and DDP pages, while the docs page says official
        multi-GPU support is still to be announced, which is consistent with the recorded gate and
        does not contradict it.
      since: '2026-09-28'
  yi:
    adoption:
      because: The frozen reconciliation baseline measures Yi's Hugging Face downloads at level 1 against
        the recorded 2 (a tier_change), and the 27 Sep scheduled run recorded no agreement. It is settled
        by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
