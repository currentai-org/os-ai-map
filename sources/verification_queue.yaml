# Axes a verification pass reached and could not settle, with the reason and the date — the
# queue for an axis a re-read opened and could not close (a category's `scoring_recipe.deferred`
# covers what the ladder cannot read at all). Read by build/check_freshness.py,
# build/sweep_status.py and build/axis_assessments.py.
# Ruling: docs/reference/evidence-and-freshness.md, "A hold is a claim about now, not a record
# of history".
version: 1

# Ruling: docs/reference/evidence-and-freshness.md, "A null axis can earn a `last_verified`,
# and should".

held:
  algolia-ai-search:
    adoption:
      because: >-
        The AI Search page still carries its 18,000-customer and query-volume figures, but none of
        them derives the recorded 1M-10M reach: the customer count sits far below it, the query
        figures far above it, and the two query figures disagree with each other by three orders of
        magnitude. Algolia has no registry artifact behind usage_volume. Settling it needs an
        instrument re-read, such as reported_traction on the customer count.
      since: '2026-09-28'
  amazon-q-developer:
    openness:
      because: The recorded components read the product as closed source under a proprietary license, but
        the aws/amazon-q-developer-cli repository is public under MIT and Apache-2.0, though now receiving
        only security fixes after the move to the closed Kiro CLI. Whether the open client changes the source
        and license components is an update-product decision, and the axis stays undated until it is made.
      since: '2026-09-29'
  apify:
    adoption:
      because: >-
        No freshly fetched source supports the level 3 band: apify.com publishes no account, run or
        API-call count, and the Crawlee repository could not be read from this pass. Settling it needs
        a countable channel, such as a declared crawlee or apify-client package.
      since: '2026-09-28'
  autogen:
    adoption:
      because: PyPI downloads of autogen-agentchat now band at level 3 (100K-1M a month), one below the
        recorded level 4. The change is settled by the adoption re-band after the 5 Oct reconciliation,
        dated from a scheduled observation run.
      since: '2026-09-29'
  claude-code:
    adoption:
      because: The record bands on a reported-traction figure at level 4, while the applicable route measures
        GitHub stars at level 3. The instrument choice is settled with the other route disagreements by
        the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  cline:
    adoption:
      because: The record bands on VS Code Marketplace installs at level 4, while the applicable route measures
        GitHub stars at level 3. The instrument choice is settled with the other route disagreements by
        the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  codex-cli:
    adoption:
      because: The record bands on a reported-traction figure at level 4, while the applicable route measures
        GitHub stars at level 3. The instrument choice is settled with the other route disagreements by
        the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  exa-search-api:
    adoption:
      because: >-
        PyPI downloads of the declared exa-py package band at level 4, while the record carries 3
        on the vendor's developer count. A change of instrument and level is settled by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  firecrawl:
    adoption:
      because: >-
        The record bands on GitHub stars, but the declared firecrawl-py package now has a PyPI download
        signal, which takes precedence. Switching the instrument is settled by the adoption re-band
        after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-28'
  gemini-cli:
    capability:
      because: 'The record places Gemini CLI level with OpenHands, but no fresh source compares the two:
        the fetched pages list tools, MCP support and the GitHub Action, while OpenHands now runs Gemini
        CLI as one pluggable agent and publishes a benchmark lead. The relation needs re-judging against
        a source that compares them.'
      since: '2026-09-29'
  github-copilot:
    adoption:
      because: The TechCrunch figure still bands at the top level, but the article counts all-time users,
        while the record labels the signal as active users. Relabeling the signal is a curation decision,
        and the axis stays undated until it is made.
      since: '2026-09-29'
    openness:
      because: github.com/features/copilot, the page establishing the hosted-only, proprietary reading,
        returned HTTP 403 from this pass. The Copilot Chat extension (microsoft/vscode-copilot-chat) is
        MIT-licensed while the service and the Copilot CLI are proprietary, so whether the open client changes
        the source component is an update-product decision to make alongside a readable vendor page.
      since: '2026-09-29'
  hermes-agent:
    adoption:
      because: The record bands on a usage figure at level 4, while the applicable route measures GitHub
        stars at level 3. The instrument choice is settled with the other route disagreements by the adoption
        re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
  llama-index:
    capability:
      because: The fetched README credits agent building, OCR and structured extraction to the commercial
        LlamaParse platform rather than the open framework, so the evidence on file no longer shows the
        framework's own breadth at the recorded band. It needs a re-read of the framework documentation
        to settle.
      since: '2026-09-29'
  openfn:
    adoption:
      because: The record bands on a reported-traction figure at level 3, while the applicable route measures
        GitHub stars at level 1. The instrument choice is settled with the other route disagreements by
        the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation run.
      since: '2026-09-29'
    capability:
      because: The fresh pages show an integration and workflow-automation platform (adaptors, a visual
        builder, an AI assistant for building workflows, monitoring and access control) but none of the
        agent runtime, retrieval or model management that placed it level with Dify. The relation needs
        re-judging.
      since: '2026-09-29'
  openhands:
    adoption:
      because: The record bands on GitHub stars alongside a funding round, and stars could not be re-read
        from this pass. PyPI downloads of openhands-ai are now readable, so whether to switch the instrument
        is settled by the adoption re-band after the 5 Oct reconciliation, dated from a scheduled observation
        run.
      since: '2026-09-29'
  openrlhf:
    adoption:
      because: >-
        The recorded band and the applicable route measure different instruments, so the levels neither
        agree nor disagree. The instrument choice is settled with the other route disagreements after
        the 5 Oct reconciliation.
      since: '2026-09-28'
  peft:
    adoption:
      because: >-
        The declared peft package measures a lower band on PyPI downloads than the one recorded, close
