# Axes a verification pass reached and could not settle, with the reason and the date — the
# queue for an axis a re-read opened and could not close (a category's `scoring_recipe.deferred`
# covers what the ladder cannot read at all). Read by build/check_freshness.py,
# build/sweep_status.py and build/axis_assessments.py.
# Ruling: docs/reference/evidence-and-freshness.md, "A hold is a claim about now, not a record
# of history".
version: 1

# Ruling: docs/reference/evidence-and-freshness.md, "A null axis can earn a `last_verified`,
# and should".

held:
  a2ui:
    adoption:
      because: The initial level was set on 2026-10-19 from a hand-read count of npm downloads of @a2ui/web_core
        plus PyPI downloads of a2ui-agent-sdk, which sets a level but earns no date. The axis waits for the
        first scheduled reconciliation that measures the same level. That run's re-dating PR dates the axis and
        releases this hold.
      since: '2026-10-19'
      settled_by: scheduled_reconciliation
  agentops:
    openness:
      because: 'The core-gated reading (no enterprise directory or license-key check in app/) rests on a
        repository tree listing that cannot be re-fetched: the GitHub API returns 403 through this environment''s
        proxy. Settling it needs a fetchable raw file or listing of the app/ tree.'
      since: '2026-09-29'
  airi:
    capability:
      because: The README lists Memory as an unchecked roadmap item (only in-browser database support is ticked).
        On vision, it names computer vision among fields the project is recruiting for and links a devlog on
        pure-vision progress for its Factorio-playing agent, but its capability roadmap has no vision item for
        the companion app. The value's persistent memory and vision input, and the note's vision claim, no longer
        read from the cited source and need re-deriving against the documentation site.
      since: '2026-10-07'
  albumentations:
    adoption:
      because: The initial level was set on 2026-11-12 from a hand-read count of PyPI downloads of
        albumentationsx, which sets a level but earns no date. The axis waits for the first scheduled
        reconciliation that measures the same level. That run's re-dating PR dates the axis and releases this
        hold.
      since: '2026-11-12'
      settled_by: scheduled_reconciliation
  algolia-ai-search:
    adoption:
      because: >-
        The AI Search page still carries its 18,000-customer and query-volume figures, but none of
        them derives the recorded 1M-10M reach: the customer count sits far below it, the query figures
        far above it, and the two query figures disagree with each other by three orders of magnitude.
        Algolia has no registry artifact behind usage_volume. Settling it needs an instrument re-read,
        such as reported_traction on the customer count.
      since: '2026-09-28'
  alia-40b:
    capability:
      because: 'Re-read on 2026-11-15, no published evaluation places the released ALIA-40b beside Apertus, EuroLLM, Luciole
        or a Llama model on one ranked suite. The base card still reports 5-shot results for ALIA-40b alone and defers
        comparisons with other baselines to a forthcoming technical report, and an arXiv search finds no such report;
        the ALIA-40b-instruct-2606 card and the undeclared ALIA-40b-fc-2607 card also report ALIA alone, and Artificial
        Analysis lists no ALIA model. EuroEval has evaluated the ALIA-40b base checkpoint but leaves it unranked, with
        no summarization, math, code or reasoning results and the evaluated revision unstated: on the tasks it shares
        with other base models it leads Luciole-23B-Base on 24 of 28 across English, Spanish, Catalan, French, German
        and Italian, leads EuroLLM-22B-2512 on 4 of 6 in English and trails it on 15 of 22 elsewhere. The one_below apertus
        comparison was removed because no published evaluation supports it (R-2026-11-12-n). Settled by the ALIA-40b technical
        report, or another table that evaluates ALIA-40b beside one of those peers on the same benchmarks, shots and metric.'
      since: '2026-09-29'
  alphagenome:
    openness:
      because: >-
        The data component (open; training TFRecords for all 12 modalities published in the
        alphagenome-datasets GCS bucket) is undercut by the data loader's own repository,
        google-deepmind/alphagenome_research, whose License and Disclaimer section defaults
        any material not individually named under Training Data, Evaluation Data or Training
        and Evaluation Data to CC-BY-NC-4.0. Several of the bucket's twelve modality folders
        (PROCAP, RNA_SEQ, and the three SPLICE_SITE/SPLICE_JUNCTIONS folders) have no named
        carve-out in that text, so by the README's own default clause they may fall under the
        non-commercial license rather than being openly reusable. Settling it needs a
        per-modality mapping from the publisher (or the data loader's own documentation) saying
        which license governs each of the twelve folders the bucket serves.
      since: '2026-11-25'
