# What counts as evidence, and what counts as an absence of information. Read by
# build/serialize_rubric.py and build/declaration_version.py.
# Ruling: docs/reference/evidence-and-freshness.md, "Two evidence grades: dataset and
# document".
version: 1
verified_on: '2026-07-28'

# A value with no re-derivation path is not evidence. A rejected observation is still
# recorded, with its reason, so the gap is queryable rather than invisible.
admission:
  # `boilerplate_shows`: phrases that were filler in the first pass and assert nothing.
  boilerplate_shows:
  - verification source
  boilerplate_note: >
    Declared as the shortest phrase that matches all 199 rows. The full string is
    'flagship phase-C verification source'; matching on the fragment catches the
    same set with no over-reach. Add a phrase here only after counting how many
    rows it hits and confirming none of them are real.

  # Ruling: docs/reference/evidence-and-freshness.md, "Why `shows` has no minimum length".
  require_nonempty_shows: true

# Ruling: docs/reference/evidence-and-freshness.md, "Abstention values live on the route,
# not here". What stays here is the abstention policy that is NOT source-specific:
abstentions:
  # A null value is an abstention from every source; it needs no per-source interpretation.
  null_is_abstention: true

  # Ruling: docs/reference/evidence-and-freshness.md, "Abstention values live on the route,
  # not here".
  usable_http_status: [200]

# Ruling: docs/reference/openness.md, "A compound license resolves on all of its parts";
# docs/reference/identity.md, "Most-restrictive across SKUs, and where it stops".
partial_coverage:
  rule: abstain
  why: >
    max(restrictiveness) over a subset can only fall, so partial coverage biases
    a family toward permissive. It overstates openness, which is the worst
    direction for this map to be wrong in. Measured on qwen-2-5: Qwen2.5-72B
    reports `other` and Qwen2.5-7B reports apache-2.0, so scoring from the SKUs
    that answered would move the family from 2/restricted to 3/open_weights on
    the strength of the SKU that is not the restrictive one. The recipe's
    multi_sku_rule states that per-SKU licenses come from the Hub and are
    therefore derivable rather than judged; for this family they are not.
