# Contradictions a person looked at and ruled are not defects, with the observation each ruling
# was made against. Read by build/check_contradictions.py.
#
# A settlement is bound to what was OBSERVED, not just to the product, so it expires the moment
# the world says something different. `settles` carries the observed value the ruling covers --
# `archived` for a repository whose product outlived it, an SPDX id for a license a classifier
# reports differently for a reason the record already explains. If the observation changes, the
# key no longer matches and the sweep raises it again, which is the difference between settling a
# question and silencing it.
#
# This exists because the alternative is worse. Without it the only way to clear a finding is to
# record an `end_of_life` or change a license, so a product that legitimately outlived its
# archived repository would return to the queue every week until somebody wrote something untrue
# to make it stop.
#
# A ruling needs a reason. A bare entry is a place for a real contradiction to hide.
#
# ## Two classes of ruling, and the second one must not read like the first
#
# Most entries say the finding is NOT a defect: the record was right and the observation does not
# contradict it. Those carry no `class`.
#
# A few say the opposite -- the finding is real and the schema cannot represent the answer. Those
# carry `class: representation-gap`, and the distinction is load-bearing. Filed as an ordinary
# settlement, a confirmed unresolved case would leave the queue looking exactly like a vindicated
# record, which is the silencing this file exists to prevent. `build/check_contradictions.py`
# prints them on every run for that reason: they are suppressed from the queue and not from view,
# and each one is a standing argument for changing the schema rather than a closed question.
version: 1
settled:
  - leg: retirement
    product_slug: atropos
    artifact: NousResearch/atropos
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Archived 2026-07-04 under "This repository has been archived and is no longer maintained.
      No further updates, bug fixes, or security patches will be made." The notice is scoped to
      the repository, names no successor and gives no date on which the framework stops working,
      and the environments it publishes remain usable as they stand. Note the PyPI package named
      `atropos` is an unrelated sequencing-read trimmer, not this product, so it is not evidence
      either way.
  - leg: retirement
    product_slug: bigcodebench
    artifact: bigcode-project/bigcodebench
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      The archived repository is the harness, and the sibling bigcode-evaluation-harness the
      record already names stays active. The benchmark is still distributed and still run, so the
      archive ends one repository rather than the product.
  - leg: retirement
    product_slug: ccnet
    artifact: facebookresearch/cc_net
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Archived by the owner on 2023-10-31, and the repository says nothing beyond the archive
      banner - the "no longer maintained" in this record is our own gloss rather than a quoted
      statement from Meta. The pipeline is still published as cc-net 1.0.0 on PyPI, pointing at
      this repository, so nothing has been withdrawn and no product-side end has been announced.
      This is the finding the issue guessed would be an end_of_life; it is not, for want of
      anything product-side that declares one.
  - leg: retirement
    product_slug: codecontests
    artifact: google-deepmind/code_contests
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Repository archived, dataset live. deepmind/code_contests is still served on Hugging Face
      under CC BY 4.0 and still downloadable in full. For a dataset the repository is the release
      vehicle rather than the product.
  - leg: retirement
    product_slug: cruxeval
    artifact: facebookresearch/cruxeval
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Repository archived, dataset live. cruxeval-org/cruxeval is still served on Hugging Face and
      still downloaded - 16,051 in the month before this ruling - with the leaderboard and sample
      explorer still reachable.
  - leg: retirement
    product_slug: google-coral-dev-board
    artifact: google-coral/libedgetpu
    settles: archived
    class: representation-gap
    ruled_on: '2026-09-22'
    read_by: Carl Cervone, 2026-09-22, from the PCN linked below
    source: https://www.mouser.com/PCN/Coral_CORAL_DEV_BOARD(4G)__SOM(4G)_EOL_Notice.pdf
    note: >-
      NOT a vindicated record. The one finding of the ten where the product really did end, kept
      here because the schema cannot represent the answer rather than because the answer is no.
      Google's EOL notice for the Coral Dev Board (4G) and its SoM, linked above, is dated July
      2024 and gives the end of life as "2024" - the maintainer read it and reports no month or
      day; the page is served behind a bot wall and could not be fetched for a digest.
      Independently, coral.ai's product pages now redirect to a developer page that sells no
      hardware, and distributors list the board discontinued and out of stock. `end_of_life.date`
      is a full ISO date meaning the last day the product works as the announcement states it, and
      a year cannot be narrowed to a day without inventing one; the field's own description rules
      out substituting the announcement's date. This says only that the CITED notice supplies a
      year - another announcement may give a day, and finding one closes this properly. It is also
      the case to cite if the field is ever widened, though a wider date would still not settle
      when a discontinued board stops working, which is a different question from when it stopped
      being sold.
  - leg: retirement
    product_slug: granite-code-instruct
    artifact: ibm-granite/granite-code-models
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Deprecated and superseded, but not ended. The model card carries "DEPRECATION WARNING" and
      "NOT RECOMMENDED FOR USE IN NEW PROJECTS", directs new work to the mainline Granite family
      whose code capabilities supersede it, and says the model is kept "strictly for
      historical/scientific purposes". The weights are still published and still downloadable, and
      IBM gives no date on which they stop being served, so there is no end_of_life date to
      record. The second finding the issue guessed would be an end_of_life.
  - leg: retirement
    product_slug: granite-geospatial
    artifact: ibm-granite/granite-geospatial-biomass
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      The archived repository carries getting-started notebooks rather than training code, and the
      checkpoints are published separately. The record already says so; the archive ends the
      companion repository, not the model.
  - leg: retirement
    product_slug: hh-rlhf
    artifact: anthropics/hh-rlhf
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Repository archived, dataset live. Anthropic/hh-rlhf is still served on Hugging Face and
      still downloaded - 38,179 in the month before this ruling - and is still the training set
      behind models published this year. The archived repository held the loader, not the data.
  - leg: retirement
    product_slug: llm-guard
    artifact: protectai/llm-guard
    settles: archived
    ruled_on: '2026-09-21'
    note: >-
      Archived 2026-07-09 under "THIS PROJECT HAS BEEN ARCHIVED", continuing "This project and its
      associated models on Hugging Face are no longer under active development or maintained."
      That ends maintenance rather than availability: llm-guard 0.3.16 is still on PyPI and still
      installs, and no shutdown date is announced. The strongest of the ten for a future
      end_of_life, and the one to re-read if the packages or the models are ever withdrawn.
