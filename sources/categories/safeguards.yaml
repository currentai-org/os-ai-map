name: safeguards
display_name: Safety & Guardrails
description: 'Tools whose job is to detect, filter, or constrain unsafe model inputs and outputs, or to
  stress-test AI systems for harm: guardrail models (safety/content classifiers, jailbreak detectors),
  guardrail libraries, and AI red-teaming / safety-evaluation tooling.'
strapline: 'Open guardrail models and libraries are strong here, but the commercial safety tier consolidated
  fast: the category-defining startups were all acquired in under two years.'
weights:
  adopt: 0.5
  cap: 0.5
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
  derived_from:
    method: per-type extends over the shared ladders; evidence transcribed into the keys the
      ladders read, then verified
    scores_reproduced: 26
    scores_total: 26
    scores_deferred: 0
    verified_on: '2026-08-12'
    checker: build/check_rubric.py
  note: >-
    Was 0/26. Sixteen products were not disagreeing with the ladders at all - they recorded the
    deciding evidence under keys the ladders do not read, or in prose. Eleven software products
    recorded `self-host:yes;service:none`, which is `core-gated:ungated` said another way; five
    hosted services recorded `service:proprietary ...(no self-host)`, which is `source:closed`
    plus `license:proprietary`. Transcribing those moved no score, and none of it was research.
    Two more were license-lookup misses with settled precedent: a bare `gemma` alias, and a
    vendor-prefixed OpenRAIL-M that #117 already governs.

    Four more resolved when the universal license scale landed: `aegis-guard`, `llama-guard`,
    `llama-prompt-guard` and `shieldgemma` were all recorded 3 against ladders that capped a
    bounded commercial licence at 2, and the scale sets that tier to 3. Four hand-authored
    scores already agreeing with the scale was part of the evidence for it.

    Four more were scored 4 where the evidence supported 3, and all four dropped to 3.
    `qwen3guard`, `granite-guardian` and `gpt-oss-safeguard` were the same `data:not-released`
    case, and the ruling was that the rung is right as written - Apache-2.0 weights with no
    released training recipe is a 3, which is how every comparable model here is scored.
    `wildguard` had a different cause and was settled by reading the project rather than by
    judgment. Its `data:open` is correct, the WildGuardMix corpus really is public, but the
    `allenai/wildguard` repo ships an inference package with no trainer and the card sends
    readers to the paper appendix for training details, so `code` is `partial` and the 4-rung
    still fails. Open data on its own does not carry the rung.

    The last one, `llamafirewall`, needed a decision about which artifact a bundled product is
    scored on, and the owner gave it on 2026-08-12: a product is scored on the artifact it
    ships, not on what it can load. The harness is MIT in its own LICENSE file and the bundled
    Prompt Guard 2 and Llama Guard are separate products here with their own scores, so
    transcribing `source` and `license` off the `framework` and `self-host` keys reproduces the
    recorded 5 without leaving the Llama Community License unscored. The rule is written down in
    docs/guides/openness-spectrum.md.

products:
- aegis-guard
- openguardrails
- zentropi-cope
- qwen3guard
- wildguard
- llama-prompt-guard
- llamafirewall
- harmbench
- giskard
- deepteam
- perspective-api
- llama-guard
- shieldgemma
- granite-guardian
- gpt-oss-safeguard
- nemo-guardrails
- guardrails-ai
- llm-guard
- pyrit
- garak
- osprey
- coop
- openai-moderation
- azure-content-safety
- bedrock-guardrails
- lakera-guard
comments: 'Osprey and Coop are Trust & Safety operational tooling — a real-time rules engine and a moderation/review
  console — that orchestrate AI safety signals rather than acting as guardrail models themselves. Folded
  into this category for now, but they are strong candidates for a future stand-alone Trust & Safety
  operations category.'
