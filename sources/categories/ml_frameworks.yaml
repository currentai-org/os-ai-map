name: ml_frameworks
display_name: Core ML frameworks & libraries
description: "Foundational libraries the rest of the stack is built on."
strapline: The most open layer in the map. Every core library the stack imports (PyTorch,
  the Hugging Face stack, the tokenizers and file formats) ships under an OSI license. Here
  openness is the default, not the exception.
weights:
  adopt: 0.6
  cap: 0.4
products:
- pytorch
- tensorflow
- jax
- keras
- flax
- transformers
- hf-datasets
- diffusers
- accelerate
- gradio
- safetensors
- tokenizers
- huggingface-hub
- optimum
- sentencepiece
- onnx
- triton
- deepspeed
- openvino
- ggml
- pysyft
- feluda
scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, verified against the hand-authored scores
    scores_reproduced: 20
    scores_total: 22
    verified_on: '2026-07-30'
    checker: build/check_rubric.py
  # Held back rather than scored. The shared ladder has no `otherwise` rule, so
  # these already abstain; declaring them here records WHY, and keeps the
  # reproduction count honest by excluding them from it rather than counting
  # them as passes.
  deferred:
    pysyft:
      because: >-
        source or core-gated is not recorded in a form the ladder can read; needs a read of
        the repo and pricing page
    feluda:
      because: >-
        source or core-gated is not recorded in a form the ladder can read; needs a read of
        the repo and pricing page
comments: 'Horizontal dependencies the model/inference/fine-tuning/UI rows are built on
  top of: DL frameworks, the HF library stack, file formats, and optimization/runtime
  libraries. Software openness vocabulary. Dedup note: peft/trl/torchtune/axolotl/
  llama-factory/unsloth/megatron-lm stay in finetuning_code; vllm/sglang/tensorrt-llm/
  onnx-runtime/text-generation-inference stay in inference_code. Proposed in issue #11.'
