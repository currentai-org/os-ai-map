name: storage
display_name: Storage & Retrieval
description: 'Data stores, indexes, file systems, and versioned data layers built for persisting and retrieving training, inference, and retrieval-augmented-generation data.'
strapline: Openness holds across the layer, with 24 of 27 products publishing a complete,
  OSI-licensed system. The three exceptions are instructive rather than incidental. Elasticsearch and
  Meilisearch both keep a separately licensed portion inside the public repository, x-pack under the
  Elastic License and an Enterprise Edition under BUSL, rather than selling a service alongside a
  complete core; Pinecone publishes no source at all. Adoption is harder to read here than almost
  anywhere on the map, because most of these products ship as servers and the PyPI name that matches
  them usually belongs to a client library.
weights:
  adopt: 0.6
  cap: 0.4
