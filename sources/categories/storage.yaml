name: storage
display_name: Storage & Retrieval
description: 'Data stores, indexes, file systems, and versioned data layers built for persisting and retrieving training, inference, and retrieval-augmented-generation data.'
strapline: Openness holds across the layer, with 36 of 39 products publishing a complete,
  OSI-licensed system. The three exceptions are instructive rather than incidental. Elasticsearch and
  Meilisearch both keep a separately licensed portion inside the public repository, x-pack under the
  Elastic License and an Enterprise Edition under BUSL, rather than selling a service alongside a
  complete core; Pinecone publishes no source at all. RediSearch offers the identical default-triple-license
  choice as Elasticsearch (a non-OSI branch alongside AGPL-3.0), but carries no gated directory inside the
  published repository, so it lands in the open majority rather than beside them. Adoption is harder to
  read here than almost anywhere on the map, because most of these products ship as servers and the PyPI
  or npm name that matches them usually belongs to a client library.
