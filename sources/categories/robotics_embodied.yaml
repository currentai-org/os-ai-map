name: robotics_embodied
display_name: Robotics & embodied AI
description: Robot policy models, simulators and robot-learning frameworks, robot-interaction
  datasets and open robot hardware designs, whose purpose is an agent acting in, or being
  simulated in, the physical world.
strapline: The leading simulators and the largest pooled robot dataset are open, but the most general robot model is closed, and half the open policies withhold the robot data they learned from.
weights:
  adopt: 0.4
  cap: 0.6
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
    dataset: dataset
    hardware: hardware
  note: 'Per-type map over the four shared ladders, because the roster holds all four product types and none
    of them climbs another''s ladder. The policy models are `model` rather than `pretrained`: every VLA starts
    from a pretrained vision-language backbone or is trained on pooled robot data on top of one, so none is
    a base model trained from raw data. The hardware rows sit under `form_factor: board`, recorded with a detail
    saying each is a complete robot built from a published design: the ladder''s design and toolchain questions
    (are the design files reusable, does the stack build from source) are the right questions of a robot arm
    or humanoid, while `board` was written for a PCB, and a robot-body value is a shared-rubric change left
    to the maintainer. Weighted 0.4 adoption to 0.6 capability because the adoption channels differ by type
    (PyPI installs for simulators, 30-day Hub downloads for policies and datasets, stars for hardware and for
    products whose channel reports no count).


    CAPABILITY is read per product type, because a VLA, a simulator, a dataset and a robot body share no quantity.
    Each type has its own top and every comparison stays inside the type.

    Models, embodiment generality: 1 a single-task or single-robot policy; 2 a multi-task policy on one embodiment
    family (smolvla, pretrained on community datasets filtered by embodiment type and evaluated on SO-100/SO-101);
    3 pretraining on pooled data from several robots, single-arm control (openvla, octo); 4 cross-embodiment
    pretraining AND released bimanual or humanoid control (gr00t, pi0, rdt); 5 all of that plus a separate
    embodied-reasoning model and whole-body humanoid control (gemini-robotics, the top, with gr00t the top
    open model one below it).

    Software, simulation throughput and fidelity: 1 CPU rigid-body simulation with basic rendering (pybullet);
    2 CPU contact physics with a robot-learning surface of tasks, controllers and teleoperation (none promoted);
    3 one of GPU-batched parallel simulation or rendered camera and sensor simulation (carla on Unreal Engine;
    robosuite, whose MuJoCo tasks carry photorealistic rendering); 4 both, GPU-parallel simulation with rendered
    camera sensors (genesis, maniskill, and mujoco, whose MuJoCo Warp build ray-traces cameras across parallel
    worlds); 5 that plus a second physics backend and a library of ready-to-train tasks for common robots (isaac-lab,
    the top). lerobot abstains: it simulates nothing, it is the real-robot collect-train-deploy loop, and placing
    it on a simulator''s quantity would be a comparison nobody can check.

    Datasets, episodes times embodiments: 3 tens of thousands of real trajectories on one platform (droid);
    4 around a million trajectories from one maker''s robots, or hundreds of thousands across several simulated
    embodiments (agibot-world, nvidia-physical-ai-dataset); 5 a million-plus trajectories pooled across twenty-plus
    embodiments and institutions (open-x-embodiment, the top).

    Hardware, morphology: 1 a desktop or expressive robot with no manipulator; 2 a single arm (so-101); 3 a
    bimanual rig (openarm); 4 a mobile manipulator (none promoted yet; LeKiwi is in the registry); 5 a full
    humanoid (berkeley-humanoid-lite, the top).


    DISTRIBUTION, counted 2026-09-27 over the 21 banded products (lerobot abstains): 5 has 4, 4 has 8, 3 has
    6, 2 has 2, 1 has 1. The widest rung, 4, holds 8 of 21 (38%), above a third, so it was reviewed. It is
    the clustering case, not a loose definition, and the count mostly adds four unrelated per-type rungs together:
    within types 4 holds 3 of 7 software, 3 of 7 models and 2 of 4 datasets. Each per-type 4 is a have-or-have-not
    test on the release. For software it is GPU-parallel simulation AND rendered cameras, which genesis, maniskill
    and mujoco (through MuJoCo Warp''s batch ray tracer) each document and carla and robosuite, one environment
    per process, do not. For models it is a released bimanual or humanoid policy: gr00t, pi0 and rdt ship one,
    while OpenVLA''s card rules out unseen embodiments and ships single-arm control and Octo ships single-arm
    policies. Inside each rung the differences are scale and data mix, which vendor cards do not order. The
    independent verification pass moved mujoco 3 to 4, robosuite 2 to 3 and smolvla 3 to 2 on evidence the
    first draft had missed, and the distribution above is after those moves.


    ASSET AND RUNTIME LICENSES are read the same way across the software. A license on content the product
    ships is one of its license parts (ManiSkill''s CC BY-NC assets, CARLA''s CC-BY assets), and both are deferred
    on those strings. A proprietary component the product depends on but does not ship is not (Isaac Lab''s
    BSD code runs on Isaac Sim, whose Omniverse Kit runtime and 3D assets are NVIDIA''s; Isaac Sim is a separate
    registry row), and it is recorded on the source detail and the note, as the sweep ruled for Isaac Sim itself.
    Whether that dependency should cap Isaac Lab is part of the same maintainer ruling.'
  deferred:
    gr00t:
      because: The N1.x base checkpoints and GR00T-H-N1.7 are under the NVIDIA Open Model License, which the
        model tier names, but the declared GR00T-H, the N1.6 humanoid release its own card calls 'non-commercially
        usable', and NVIDIA's Assemble_Trocar task fine-tune are under the NVIDIA OneWay Noncommercial License,
        whose section 3.3 limits use to non-commercial research or evaluation. No tier names that string and
        the family's most restrictive distributed SKU governs, so the lookup abstains. Recorded 2/restricted
        on the tier the text describes (commercial_forbidden). The ruling on the string is the maintainer's;
        so is whether superseded GR00T-H should leave the family, which would make the line 3/open_weights.
    maniskill:
      because: The code and environments are Apache-2.0, but the README puts the bundled assets under CC BY-NC
        4.0, and the software tiers name no non-commercial license. A software product whose shipped tasks
        cannot be used commercially is closest to competition_restricted by that tier's own definition (a license
        that forbids a class of use), so it is recorded 2/source_available; the ruling on NC-licensed assets
        inside an OSI-licensed simulator is the maintainer's.
    carla:
      because: CARLA's code is MIT and its README puts the assets under 'the CC-BY License' with no version.
        The software tiers name CC-BY-4.0 but not an unversioned CC-BY, so the lookup abstains rather than
        guess a version. Recorded 3/source_available, where CC-BY-4.0 would land (permissive_non_osi); the
        Unreal Engine dependency under Epic's own terms is recorded on the source detail and is a second question
        for the same ruling.
    pybullet:
      because: 'Bullet is under the zlib license (PyPI classifier ''License :: OSI Approved :: zlib/libpng
        License''), which is OSI-approved, but the software osi tier lists names literally and has never been
        asked to name zlib. Recorded 5/open_source, where an osi license with public, ungated source lands;
        adding Zlib to the osi examples is a shared-rubric change and the maintainer''s.'
