name: robotics_embodied
display_name: Robotics & embodied AI
description: Robot policy models, simulators and robot-learning frameworks, robot-interaction
  datasets and open robot hardware designs, whose purpose is an agent acting in, or being
  simulated in, the physical world.
weights:
  adopt: 0.4
  cap: 0.6
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
    dataset: dataset
    hardware: hardware
  note: >-
    Per-type map over the four shared ladders, because the roster holds all four product
    types and none of them climbs another's ladder. The policy models are `model` rather than
    `pretrained`: every VLA in the seed starts from a pretrained vision-language backbone and
    is trained on robot data on top of it, so none is trained from raw data. The hardware
    ladder was written for edge boards and modules, and a robot arm or humanoid published as
    CAD, a bill of materials and firmware answers its design and toolchain questions but not
    its form-factor one; the promotion PR decides whether the ladder needs a robot-body rung
    or the rows sit under `board`. Weighted 0.4 adoption to 0.6 capability because the
    instruments differ by type (PyPI installs for the simulators, 30-day Hub downloads for
    the policies and datasets, stars alone for most hardware), so adoption compares poorly
    across the roster. License strings the shared tiers do not yet name (NVIDIA Open Model
    License, NVIDIA OneWay Noncommercial, OpenMDW-1.1, the Galaxea G0 community licenses, the
    Isaac Sim additional-materials license) go to the maintainer's license-rulings issue, and
    the products carrying them are deferred at promotion rather than scored by analogy.
