comments: >-
  Created 2026-10-09 as a preliminary category by maintainer ruling R-2026-10-09-a, on the
  agent-authorization sweep in docs/sweeps/2026-10-09-agent-authorization/ (#878, issue #723).
  Membership test: is the product's primary function to decide, prove or delegate what an AI agent
  may do, and on whose authority, before the action runs, and is the product built for agents? Built
  for agents means its own README or documentation leads with agents, not that it lists them among
  its use cases. An open standard passes the same test when a standards body's working group holds
  it, which is why AuthZEN 1.0 (OpenID Foundation), ID-JAG (IETF OAuth WG) and WIMSE AIMS (IETF
  WIMSE WG) are seeded; an individual Internet-Draft has no standing in the IETF process and does
  not pass. ADJACENT, NOT HERE (R-2026-10-09-b): general-purpose identity and authorization systems
  that ship an agent or MCP feature, among them Open Policy Agent, OpenFGA, SpiceDB, Cedar, Cerbos,
  Keycloak, Pomerium, Casdoor, Logto, Better Auth and ThunderID. They are authorization software
  that happens to support agents, and admitting them would bury the agent-native cluster inside
  mature IAM infrastructure. One enters only if its product identity itself becomes agent-first,
  read from what the project now leads with, not from a new docs page. Neighbors. agent_protocols
  (R-2026-10-09-c): the line is functional. Protocols govern how agents communicate and
  interoperate; this category governs authority, delegation, identity and policy. The authorization
  section of a wire protocol stays part of that protocol (MCP's authorization spec is part of
  `model-context-protocol`, A2A's security scheme part of `agent2agent-protocol`), and so does agent
  payment authorization (x402, AP2; R-2026-10-08-h). A library that implements only the
  authorization half of a protocol (MCP Auth, Workers OAuth Provider) is here; an MCP server
  framework with auth as one feature (FastMCP, golf) or a stdio-to-remote bridge that handles the
  client side of OAuth (mcp-remote) stays there, and so does an agent-communication framework whose
  identity layer serves its transport (Bindu, R-2026-10-09-g). Gateways (R-2026-10-09-d): MCP and
  agent gateways (agentgateway, IBM ContextForge, Docker MCP Gateway, Obot, Jarvis Registry,
  casbin-gateway, OctoBus) stay parked until a gateway-specific pass. A gateway that enforces
  authorization is not thereby an authorization product, any more than a connector that uses OAuth
  is. Closed services (R-2026-10-09-f, consistent with #863): an open client or SDK whose decision
  is made by a closed hosted service (Auth0's AI SDKs, AgentSafe, Quirna, Ziffer, permit-mcp) is not
  an open authorization product and waits for a closed-product pass. Kontext was kept because its
  policy is evaluated locally, though setup needs a token from its hosted dashboard.
  agent_tools_connectors: credential custody inside an adapter stays there, where that ladder
  already rewards it (Composio, Arcade, Open Connector, Pipedream, Nango). A standalone
  authorization server, policy point or approval gate that adapts no system is here; Clawvisor is
  the edge case, since it injects credentials but adapts nothing. safeguards: that category decides
  by content, whether an input or output is harmful; this one decides by authority, whether this
  principal may take this action. Prompt-injection and content guardrails stay there (Arcjet,
  Invariant, agentshield, LlamaFirewall). agent-governance-toolkit moved here from the safeguards
  registry under R-2026-10-09-e, because its README leads with the per-action policy decision, agent
  identity and the decision record, and states that it does not work at the prompt.
  orchestration_agents keeps the permission prompts built into a harness or framework; a plugin
  whose only job is to add permission enforcement to one harness (pi-permission-system) is here.
  assurance_evidence keeps evidence about systems handed to an outside party; a record of an
  authorization decision emitted by the product that made it is part of this category's function.
  agent_memory: Halofy also keeps durable context, but its README leads with identity, policy and
  audit, so it is seeded here. Seed roster in sources/registry/agent_authorization.yaml: the 21
  agent-specific accepted candidates and the three standards from the sweep's rows.yaml, plus
  agent-governance-toolkit. PROMOTED 2026-11-20 (record:
  docs/sweeps/2026-11-20-agent-authorization-promotion/). Twenty-eight head products: 24 of the 25
  seed rows, and the closed-product pass R-2026-10-09-f deferred, which adds the leading closed
  agent surfaces to mark the frontier (ADR-005): Auth0 for AI Agents (Okta), Microsoft Entra Agent
  ID, Amazon Bedrock AgentCore Identity and Aembit IAM for Agentic AI. Each is scored as the hosted
  service; their open SDKs are recorded as clients in openness context, as R-2026-10-09-f says an
  open SDK does not make an open authorization product. Aembit took the fourth place over Keycard,
  which leads as purely with agent authorization but was not generally available, and over Descope
  and Stytch, customer-identity platforms that add an agent feature and so fail the built-for-agents
  test. Okta Cross App Access is the ID-JAG protocol already seeded as a standard. Amazon Bedrock
  AgentCore Policy (Cedar allow or deny on each tool call at the AgentCore Gateway) is a separate
  surface a later pass could add. REJECTED: phantasm (edwinkys/phantasm), no commit since
  2024-11-25. POLICY AND TENANCY: which team's agents may reach which models and tools is an
  authorization question, and this category answers it where deciding it is the product's primary
  function, as for Halofy (an organization-wide access layer resolving each agent to a namespace and
  role) and Cordum. LLM and MCP gateways that enforce per-team access as one feature stay parked
  under R-2026-10-09-d, and general-purpose IAM stays adjacent under R-2026-10-09-b; neither moves
  because a tenancy page exists.
