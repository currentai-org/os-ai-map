name: agent_authorization
display_name: Agent identity & authorization
description: Software and standards that determine who an agent may act as, what authority it may
  exercise, and what resources and actions it may access or delegate.
strapline: Open supply, thin adoption. The most complete agent-authorization products publish their code,
  led by Microsoft's Agent Governance Toolkit, Tenuo and Caracal, while the hyperscalers' agent-identity services
  issue identities and narrow delegation but leave the per-action decision to something else. Only Cloudflare's
  Workers OAuth Provider is downloaded at scale, and it authenticates MCP clients rather than deciding what an
  agent may do.
weights:
  adopt: 0.6
  cap: 0.4
scoring_recipe:
  version: 1
  extends: software
  note: >-
    Inherits the shared software ladder unchanged. Every row is a library, a server, a sidecar or a
    specification, and whether its code or text is published is the same question it is for the
    agent-interop categories beside it. Several vendors here pair an open engine with a hosted
    dashboard or control plane, and the hosted service never lifts or lowers the open release
    (identity.md, "An open satellite around a closed core"): read the repository that makes the
    authorization decision. An open client whose decision is made by a closed hosted service reads
    source closed and is not seeded here (R-2026-10-09-f). Weighted 0.6 adoption to 0.4 capability,
    as agent_protocols and agent_tools_connectors are: most rows ship a PyPI, npm or crates.io
    package, so adoption reads on the same instruments, and capability has no ladder of its own yet.
    The 2026-10-09 sweep record sketches one quantity for the promotion PR to test through
    build-rubric: how many of five parts a product implements (identity issued to the agent
    instance, a per-action decision against policy, delegation narrowed across hops, human approval
    before a consequential action, and a verifiable record of the decision), with the per-action
    decision required for band 3 and above. CAPABILITY, as adopted at promotion on 2026-11-20: the
    band is the number of five parts the product implements itself, each one it has or has not, read
    from its README, documentation or specification text. (A1) agent identity: issues or verifies an
    identity for the agent itself (a credential, DID, workload identity, or signed token or key
    bound to the agent or agent instance), distinct from the user's. (A2) per-action decision:
    evaluates each tool call or action against policy before it runs, and allows or denies it. (A3)
    delegation narrowed across hops: passes authority from a user to an agent, or agent to agent,
    with scope that can only narrow (attenuated tokens or warrants, token exchange with reduced
    scope, on-behalf-of chains). (A4) human approval: pauses a consequential action until a human
    approves it. (A5) verifiable decision record: a tamper-evident record of each decision (signed
    receipts, a hash-chained or signed audit log), not plain logs. Band 3 or above requires A2: a
    product without a per-action decision is capped at 2. A specification is read for the parts it
    defines itself. TOP ANCHOR: `agent-governance-toolkit`, which implements all five in published
    MIT code (did:mesh agent identities, a policy check on every call, scope chains that only
    narrow, require_approval gates, a Merkle hash-chained audit log). The other 5s are recorded
    `at`, the 4s `one_below` and the 3s `two_below` it, except `aembit-iam-for-agentic-ai`, also
    `two_below`, which in turn is the nearer peer for the 2s that issue identities and narrow
    delegation without deciding per action (`workers-oauth-provider`, `microsoft-entra-agent-id`,
    `amazon-bedrock-agentcore-identity`). The other 2s and 1s are recorded against the nearest 2 or
    3 that shares their shape. DISTRIBUTION, counted 2026-11-20 over 28 banded products: 5 holds 6,
    4 holds 5, 3 holds 6, 2 holds 7, 1 holds 4. The widest rung is a quarter of the category, so no
    rung triggered the width review.
  deferred:
    grantex:
      because: >-
        Grantex moved its server, portal and specification text from Apache-2.0 to the
        Orchestrum Personal Use License 1.0 on 2026-10-21, which lets only an individual use them for
        personal purposes and requires written permission for any organization. No tier names it.
        The recorded 2/source_available reads it as `noncommercial`; adding it to that tier's
        examples is a shared license ruling for a maintainer.
    authzen-authorization-api:
      because: >-
        The Final Specification carries the OpenID Foundation's copyright license (royalty-free, to
        reproduce, prepare derivative works from and distribute it solely for developing and
        implementing specifications, with attribution), which no tier names. The recorded
        3/source_available reads it as `permissive_non_osi`. Whether a standards body's
        purpose-limited copyright grant is permissive, and on which tier, is a shared ruling for a
        maintainer; it reaches every specification on the map that a standards body other than
        the IETF publishes.
    identity-assertion-authz-grant:
      because: >-
        An IETF working-group draft, under BCP 78 and the IETF Trust Legal Provisions: the text may
        be copied and distributed unmodified but not modified outside the IETF process, and its
        code components are under the Revised BSD License. No tier names the Legal Provisions. The
        recorded 2/source_available reads them as no-derivatives; `permissive_non_osi` at 3 is the
        alternative. A shared ruling for a maintainer, and the first IETF document on the map.
    wimse-ai-identity-management:
      because: >-
        The same license question as identity-assertion-authz-grant: the IETF Trust Legal
        Provisions map to no license tier, so the ladder abstains, and the recorded
        2/source_available reads them as no-derivatives on the same reasoning.
