name: base_pretrained
display_name: Base / pretrained models
description: "Foundation models trained from scratch."
strapline: The frontier is open-weights, not open source. Only a handful of families ship the full pipeline;
  the rest withhold data or licenses.
weights:
  adopt: 0.3
  cap: 0.7

# Machine-readable rubric for this category. Drives layer-2: the evidence
# checklist tells the research stage what to hunt for, the formula turns stored
# evidence into a score. Not hand-designed — reverse-engineered from the 47
# hand-authored scores in sources/scores/ on 2026-07-28 and verified to reproduce
# all 47 exactly (build/check_rubric.py). Changing it should produce an
# explainable diff, so change the rubric rather than editing scores directly.
#
# The openness ladder no longer lives here. It was lifted verbatim into
# sources/rubrics/pretrained.yaml on 2026-09-10 so a second from-scratch category can
# inherit the same questions, and `extends: pretrained` below is what pulls it back in.
# Change the questions, the license tiers or the formula THERE. What stays here is what
# is genuinely per-category: the adoption instrument, the capability anchor, the
# confidence rule, and this category's own `derived_from` record.
scoring_recipe:
  version: 1
  extends: pretrained
  derived_from:
    method: reverse-engineered from hand-authored scores, then verified
    verified_on: '2026-07-28'
    checker: build/check_rubric.py

  adoption:
    # Signal choice follows openness: a closed model has no artifact to measure,
    # so the axis falls back to reported figures. 29 of 47 are usage_volume,
    # 14 reported_traction, 3 active_users, 1 stars_fallback.
    signal_preference:
    - signal_type: usage_volume
      source: Hugging Face downloads, summed across the family's shipped SKUs
      machine_signal: signal_huggingface.artifact_state
    - signal_type: active_users
      source: vendor-disclosed MAU or seat counts
    - signal_type: reported_traction
      source: >
        Credible third-party or vendor-reported reach where no artifact exists.
        Directional only — set confidence to medium at best.
    - signal_type: stars_fallback
      source: GitHub stars, last resort
      machine_signal: signal_github.artifact_state
    bands:
    - {level: 1, reach: <10K}
    - {level: 2, reach: 10K-100K}
    - {level: 3, reach: 100K-1M}
    - {level: 4, reach: 1M-10M}
    - {level: 5, reach: '>10M'}
    reach_is_monthly: true
    note: >
      Bands are monthly figures. Sum across the family's SKUs, base and instruct,
      because the map's unit is the model family, not a single repo.

  capability:
    # 46 of 47 are already benchmark-based, so this axis has a real anchor.
    basis: benchmark
    anchor:
      primary: Artificial Analysis Intelligence Index v5.0.1
      machine_signal: signal_artificialanalysis.model_evaluations
      version_rule: >
        Every comparison names the exact evaluated model, its reasoning effort, the
        index version and the date read, and reads its peers on the same version.
        Scores from different major versions are never compared or converted, and
        a model's v4 score falling or going missing on v5 does not move its band
        on its own. A size-class rank places a model among others of similar size,
        not on a common scale, so it is evidence for the comparison and never a
        band threshold (R-2026-10-09-p, R-2026-11-12-l).
      fallback: >
        Published pretraining-suite average (ARC/HellaSwag/WinoGrande/PIQA and
        similar) where the model is absent from Artificial Analysis. A fallback
        comparison needs genuinely comparable evaluations with explicit sources;
        scores from different suites or incomparable model variants are not
        equated, and where the evidence is insufficient the band stays held.
      secondary: >
        AA-LCR (Artificial Analysis Long Context Reasoning) is optional secondary
        evidence of long-context capability. Version 5 of the index no longer
        includes it in the composite, so it is cited beside the index rather than
        as part of it, and it never sets or moves the composite band on its own.
    comparison_method: >
      How a capability band is placed against peers (R-2026-11-13-a; method in
      docs/briefs/2026-11-12-capability-3-4-boundary.md). A family is scored on its
      strongest eligible release, not necessarily its newest, and which releases are
      eligible is settled on the product record before any comparison is read.
      Comparisons prefer releases at the same training stage (base with base,
      instruct with instruct, reasoning with reasoning); a cross-stage comparison
      can support a judgment but cannot by itself establish parity, and a family is
      neither penalized for shipping no reasoning release nor assumed to match one.
      A band moves on evidence that is sufficient and reproducible across the
      capabilities that matter for the category, judged on independence,
      comparability, breadth and uncertainty rather than on a count of benchmark
      families. Results that share one evaluation method are not independent of
      each other, though different tasks within one suite can still add breadth.
      Language capability counts only where it is measured on the same
      table, and the number of languages a card lists is metadata. Reference
      models are provisional examples, not thresholds: mistral-large on the index
      for 4, and phi for 3 on post-trained suites; the olmo-base and marin pair is
      for analysis only, and vendor-placed 4s at low confidence are not references.
      Capability confidence describes the band, not the precision of the evidence
      under it. Every tier change still goes to the maintainer with its evidence
      before it is committed.
    bands: null
    bands_status: >
      NOT YET CALIBRATED. The Artificial Analysis index cannot yet place the
      boundary between 3 and 4 on its own: no product settled at 3 has a v5.0.1
      score. Bands are placed by comparison under comparison_method, and the
      calibration is declared only once that method has settled several boundary
      cases. Until then capability stays hand-authored and the layer-2 scorer must
      not write it.

  # Confidence stops being a per-file judgment call and becomes derived.
  confidence_rule:
    high: a direct measured signal or a primary source states the fact outright
    medium: a proxy signal, or a reported figure that could not be independently confirmed
    low: inferred from indirect evidence, or the source is older than 90 days

