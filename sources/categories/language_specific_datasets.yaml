comments: >-
  Proposed in issue #686. Membership test: is the dataset defined by the languages it serves
  rather than by its task or scale? A general multilingual crawl that happens to include a
  language (FineWeb-2, CulturaX, MADLAD-400, OSCAR, Common Corpus) stays in
  training_synthetic_datasets, and Aya Collection stays there too. A dataset assembled for a
  language or a region belongs here, whichever modality it is: pretraining text, speech or
  instruction data; an evaluation set built the same way belongs in language_specific_eval_sets,
  under the same language test. The language has to be underrepresented in AI data, and that
  is read from the per-language classification (docs/reference/language-classification.md,
  currentai.language_representation.classification; R-2026-10-30-d, R-2026-11-10-j), not from a
  list: a product is in when any language it targets is below the high written-material class
  at both ends of its interval, out when every target language is high at both ends, and
  otherwise the purpose test decides alone. A dataset that fails this half goes to
  training_synthetic_datasets or benchmark_eval_data, as IndoNLU did for Indonesian
  (R-2026-11-11-b). The 2026-11-11 membership review
  (docs/sweeps/2026-11-10-language-membership-review.md) applied it to every product and seed:
  Korean, which the earlier list of excluded languages named, is below the line, so KMMLU
  joined language_specific_eval_sets (R-2026-11-11-e); TMMLU+, CMMLU, ChineseWebText and
  Carolina target high languages and stay out; and the LatamGPT Corpus waits on a check of its
  Indigenous-language content (R-2026-11-11-f).
  Language-targeted evaluation sets lived here until 2026-11-08 and now live in
  language_specific_eval_sets, scored by the depth ladder (R-2026-11-07-b); the purpose test that
  follows still decides which many-language sets are language-targeted at all. The line for a many-language set is its purpose: FLORES+, Belebele, SIB-200
  and FLEURS were built to give underrepresented languages a test set and belong here, while
  a general benchmark machine- or human-translated into the major languages (Global-MMLU)
  is defined by its task and stays in benchmark_eval_data. The same purpose test separates
  Glot500-c, assembled from existing low-resource sources, from a crawl such as GlotCC,
  which sits with MADLAD-400. A benchmark suite that redistributes other datasets is the
  product, and the datasets it carries are not separate rows: AfroBench carries IrokoBench,
  AfriSenti, MasakhaNER, MasakhaNEWS, MasakhaPOS, AfriQA, MAFAND-MT, SALT, Uhura and
  InjongoIntent, IndicXTREME carries IndicSentiment, and SEACrowd carries NusaX and PhoMT. A suite's
  record describes its members, including the training splits several of them ship. The
  exception is a global set a regional suite borrows a slice of - AfroBench's African
  slices of Belebele, FLORES+ and SIB-200 - which stays its own product. Speech data is in
  scope; speech models are not (issue #602). Catalogs such as ATLAS (AI Singapore) and Lanfrica are discovery
  sources for this category, not products in it.
