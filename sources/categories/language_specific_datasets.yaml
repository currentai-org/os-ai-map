name: language_specific_datasets
display_name: Language-specific datasets
description: "Datasets assembled to make an underrepresented language, or a set of related
  underrepresented languages, usable for AI: pretraining text, speech, instruction and
  dialogue data. Evaluation sets built for the same languages live in Language-specific
  evaluation sets, and general multilingual corpora that happen to include a language live in
  Training & Synthetic Datasets."
strapline: >-
  No open corpus for an underrepresented language comes near English scale. The largest here,
  Sangraha, holds about a quarter of a trillion tokens in 22 Indian languages and English, against
  FineWeb's 18.5 trillion in English alone. Coverage is regional as well: Indic and Southeast Asian languages
  have open text, speech and instruction data, the Indigenous Americas small parallel
  corpora, and the Pacific nothing of its own. The largest labeled low-resource speech collection,
  Meta's MMS recordings, is withheld.
weights:
  adopt: 0.3
  cap: 0.7
scoring_recipe:
  version: 1
  note: |-
    Inherits the shared dataset ladder for openness. This PR extended the shared license tiers
    with four clear-cut names (cc-by-nc-4.0 and cc-by-nc-sa-3.0 as noncommercial, cc-by-2.5 and
    cc-by as open_data); custom, community-governed and no-derivatives licenses were left for a
    maintainer's ruling and their products are deferred below.

    Capability is one ladder for every modality, because the category's question is what a
    language has, not what kind of file it is. The rungs are stated as facts a reader can check
    against the cited pages. 5: no other open row in this category covers the same languages in
    the same modality at comparable scale, the resource is documented, and its publisher or a
    paper names a model or benchmark built on it. 4: documented and used downstream by name, but
    a peer here is larger or broader for the same languages; or the largest for its languages
    with only community fine-tunes listed on the Hub. A single-task set (NER, sentiment, hate
    speech, transliteration) tops out at 4. 3: documented, with no downstream model or benchmark
    beyond its own paper's experiments; or superseded by the same publisher's newer release; or
    a narrow single-task set. 2: thin documentation, or machine-generated, machine-translated or
    re-hosted content. 1: a fragment. Closed corpora are judged on the same facts as their
    owners describe them. Roots carry no relative_to; every other band names a same-modality
    peer where one exists.

    Size caps then bound every band by how much data a corpus holds, measured against the
    largest English and Chinese datasets of the same kind, one order of magnitude per step.
    Pretraining text: 5 needs a trillion tokens (FineWeb and DCLM scale), 4 a hundred billion, 3
    ten billion, 2 one billion, and anything smaller is 1. Speech, counted in transcribed hours:
    5 needs a hundred thousand (Emilia and YODAS scale), 4 ten thousand, 3 a thousand, 2 a
    hundred. Parallel text, in sentence pairs: 5 needs a billion, 4 a hundred million, 3 ten
    million, 2 one million. A product's band is the lower of what the rungs above give it and
    what its size allows; a cap never raises a band. Words are counted as tokens, which
    understates token counts, and a size known only in bytes is estimated at four bytes a token;
    each estimate says so in the product's capability value. Evaluation sets, the SEACrowd hub
    and task annotations such as NCHLT carry no cap, because their size is a count of items
    rather than a measure of how much of a language they hold, and ArabicMMLU already
    outnumbers English MMLU. Instruction data carries its own cap, set out below. The caps are the category's central finding rather than a
    penalty: no open corpus here reaches the scale a frontier English or Chinese model is
    trained on, and the only one that does, Sarvam-2T, is withheld.

    Since 2026-11-11 the caps measure each language against its own resources rather than
    against English alone (R-2026-10-30-k, R-2026-11-11-h). The resource profile is read from
    the per-language classification, currentai.language_representation.classification
    (docs/reference/language-classification.md): official status, at least a million speakers,
    and a large body of written material, each yes, no or unresolved. A single-language
    product's thresholds are divided by a multiplier set by how many of the three are confirmed
    yes. Text and parallel text: 1, 10, 100 and 1,000 for three, two, one and none. Speech: 1,
    10, 30 and 100. Three confirmed is the reference profile and keeps the English-scale
    yardstick. An unresolved axis earns no relaxation: the cap uses the least relaxed profile
    the evidence allows, and the more generous reading is recorded in the product's evidence. A
    product declaring more than one language keeps the unrelaxed caps, because a total over
    several languages says nothing about any one of them (M2). A relaxed cap still never raises
    a band above what the rungs give, and a peer comparison names a product judged on the same
    yardstick, or the band carries no relative_to and is justified from the rungs. The scored
    proposal and the rung reading of each product that moved are in
    docs/sweeps/2026-11-11-language-yardstick-implementation-proposal.md.

    Instruction data has been capped since 2026-11-11 by example count on two tracks, and a
    set's cap is the higher of the two (R-2026-11-11-o). The general-scale track counts every
    example, of any provenance, against NVIDIA's Nemotron-Post-Training-Dataset-v1 (25,659,642
    examples): 5 needs ten million, 4 a million, 3 a hundred thousand, 2 ten thousand. The
    human-authored track counts only pairs whose instruction and response people verifiably
    wrote, against databricks-dolly-15k (15,011 pairs written by people on both sides, a
    directly comparable reference rather than the largest human-written set): 5 needs ten
    thousand, 4 a thousand, 3 a hundred, 2 ten. Authorship decides the track, not human
    contact (R-2026-11-11-n): recast task data, dictionaries and templated text, translations
    reviewed by people, and model output count only on the general-scale track, and a set's
    human-authored pairs that it imported from another set are marked as imported. Each
    instruction set's capability value states its count by provenance. The language
    yardsticks above relax none of them: WangchanThaiInstruct and CIDAR name Thai and Arabic,
    which have the reference profile, and the rest are multilingual. Typhoon-S stays a
    boundary case outside the cap. At adoption no instruction set's score moved: the cap binds
    none, and WangchanThaiInstruct's 35,014 paper-verified pairs reach the human-authored
    track's top step, so its rungs, not its size, set its 4. The counts and the four options
    compared are in docs/sweeps/2026-11-11-instruction-cap-dry-run.md.

    Distribution at promotion (97 banded): 6 at 5, 16 at 4, 36 at 3, 25 at 2, 14 at 1. The six
    at 5 are all evaluation sets, which carry no size cap. The widest rung, 3, holds 36 of 97,
    over the one-third review trigger; it is where the caps put most national corpora and speech
    collections of a few thousand hours, which is the category's shape rather than loose
    wording, and two review passes and the caps moved bands in both directions before this
    count. Top rows per modality: Sangraha (pretraining text), Common Voice (speech), BPCC
    (parallel text), FLORES+ (evaluation), WangchanThaiInstruct (instruction data).

    On 2026-11-08 the 22 evaluation sets moved to language_specific_eval_sets with depth-ladder
    bands (R-2026-11-07-b), so the distribution above, taken at promotion, is history. The 75
    that remain: 10 at 4, 27 at 3, 24 at 2, 14 at 1, none at 5. The six at 5 were all evaluation
    sets, and no corpus here reaches 5 under the size caps.
    The language-adjusted caps of 2026-11-11 moved nine single-language corpora up (Icelandic
    Gigaword, Korpus Malti, CorpusNós, Latxa, Nepali Text Corpus, the Khmer ASR Cultural
    Dataset, Kazakh Speech Corpus 2, the Northern Sámi web corpus and ViXSD): 12 at 4, 31 at 3,
    21 at 2, 11 at 1. Rung 3 now holds 31 of 75, over the one-third review trigger, because the
    caps that held national corpora at 1 and 2 against English now let most of them reach the
    rungs' 3; the rungs, not size, are what separate them there.

    The category carries three corpora held back from open release - Meta's unreleased MMS
    recordings, Sarvam-2T, and Te Hiku Media's te reo Māori corpus, which is granted on request
    under a community license - for the same reason benchmark_eval_data carries lab-internal
    evals: they are the frontier the open rows are measured against. A closed row is a corpus a
    frontier lab or national program built and withheld, or one its community governs. Items
    sold from a vendor or consortium catalog (the LDC, ELRA, LDC-IL, Appen, Defined.ai, Karya)
    are the closed long tail ADR-005 declines, and a catalog's product line (every IARPA Babel
    pack) is a bundle rather than a product.

    Weighted 0.3 adoption to 0.7 capability because download counts for a low-resource corpus
    are small by construction: the population that could download it is small, so adoption
    measures the language before it measures the dataset. Five products carry no adoption
    reading, each a dated abstention whose cited page shows there is nothing to count: the three
    held-back corpora, UberText (served as plain files), and Common Voice (its Mozilla Data
    Collective page shows no download figure). Seven are banded on GitHub stars, read through
    the ungh.cc mirror of the GitHub API: the six releases published only on GitHub, and
    AfroBench, whose member datasets are marked not_primary_channel because their downloads are
    not runs of the suite.
  extends: dataset
