        metadata, the repository and the paper were read - while the files download without a
        gate. The ladder has no rung that tests the unstated tier on its own, so it declines;
        the record carries 3/gated on the openhermes-2-5 precedent, because files nobody has
        licensed are not open and not closed.
    indicxtreme:
      because: >-
        A suite of per-task repositories whose licenses differ: IndicCOPA and IndicQA are CC-
        BY-4.0, Naamapadam CC0, and IndicXParaphrase and IndicSentiment state none. The unstated
        members leave the whole value unmapped, so the ladder declines; 3/gated follows the
        openhermes-2-5 precedent for downloadable, unlicensed data.
    jojajovai:
      because: >-
        No license is stated anywhere the publisher could state one - the card, the API
