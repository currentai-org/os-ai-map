    khayyam-challenge:
      because: >-
        CC-BY-ND-4.0 names no tier on the shared ladder, and whether no-derivatives data is open
        is a shared-rubric ruling not taken here. The manual gate adds noncommercial, academic-
        only terms, so the record carries 2/restricted, where a noncommercial license would put
