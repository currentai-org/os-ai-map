name: classic_ml_cv
display_name: Classic ML & computer vision
description: >-
  Libraries and pretrained model lines for machine learning outside the LLM stack: classical and
  gradient-boosted estimators, classical NLP pipelines, time-series forecasters, tabular AutoML and
  tabular foundation models, and computer-vision libraries, backbones and perception models.
weights:
  adopt: 0.6
  cap: 0.4
scoring_recipe:
  version: 1
  extends:
    model: pretrained
    software: software
  derived_from:
    method: >-
      Shared ladders inherited per product type. Promotion of the first tranche (2026-09-26/27)
      reproduced 14 of 16 hand-authored openness scores; the other two were deferred on license
      strings the shared tiers did not name. The second tranche (2026-09-27, 34 products)
      reproduced except for five further deferrals, again all on license strings. The #739 rulings
      placed five of those seven strings, and those products now compute; dino and
      segment-anything stay deferred.
    checker: build/check_rubric.py
  note: >-
    TWO LADDERS for openness. Libraries, toolkits and hosted APIs are typed `software` and climb
    the shared software ladder. Vision backbones, perception model lines and tabular foundation
    models are typed `model` and climb `pretrained`, not the fine-tune `model` ladder: each is
    pretrained from scratch, so the questions about releasing the pretraining data and the
    training pipeline apply to it unchanged. A row is typed by what the vendor ships as the
    product - a pip-installable library that bundles checkpoints (Ultralytics, timm, AutoGluon,
    MediaPipe, InsightFace) is software; a checkpoint line whose code exists to run the weights
    (DINO, Segment Anything, Depth Anything, RT-DETR, BiRefNet, BRIA RMBG, TabPFN) is a model.
    Model lines are scored on their current release, recorded as `governing_release`.

    WEIGHTS SHIPPED BESIDE SOFTWARE. For a software product, separately distributed model
    weights affect openness when they are required for the product's ordinary advertised
    capability or are downloaded automatically or by default by the software. Optional
    model-zoo artifacts do not govern the software's openness; their restrictions are still
    recorded. Applied: insightface is governed by its non-commercial model packs, because the
    default FaceAnalysis() flow downloads buffalo_l, so the restricted packs are part of the
    ordinary product surface; detectron2 stays governed by its Apache-2.0 framework, because its
    CC-BY-SA-3.0 model zoo is optional output of the training framework, recorded under
    `context`; dlib stays governed by BSL-1.0, because the face-recognition capability it is
    credited for runs on the public-domain 5-point landmark model and recognition network,
    which the user downloads by hand, and the non-commercial 68-point landmark model is recorded
    under `context` without governing.

    CAPABILITY is read as one quantity: how much of the prediction task the product does for
    you. Each rung is a capability the product either has or lacks, checkable against its docs
    and repository tree. The rungs are ordered, not nested: rungs 1 to 3 build on one another
    (operations, then one learner family, then many learners), but rung 4 is reached by a
    pretrained model that predicts on the user's own input without training, which need not be
    a toolkit of learners at all (tabpfn, google-cloud-vision and birefnet are not), and rung 5 by
    automating model search and fitting for the user, which need not bundle a pretrained model
    (h2o-3, flaml and pycaret do not). A product is placed on the highest rung whose capability
    it documents.
      1  PRIMITIVES. Supplies the operations a model is built from or run on, and fits no
         predictor of its own (opencv: its classical learners moved to opencv_contrib at HEAD, and
         its dnn module runs networks trained elsewhere; scikit-image; supervision, which works on
         other libraries' detections).
      2  ONE LEARNER FAMILY, well engineered (xgboost, lightgbm, catboost, prophet, pmdarima,
         umap, hdbscan, the imbalance-aware ensembles of imbalanced-learn), or a thin convenience
         layer over part of a toolkit (textblob over nltk).
      3  A TOOLKIT of many learners or a model zoo, with the pipelines, evaluation or training
         recipes to compare and fit them; choosing among them is left to the user (scikit-learn,
         statsmodels, sktime, spacy, nltk, timm, rf-detr, and in this tranche cuml, river, gensim,
         stanza, gluonts, statsforecast, torchvision, detectron2, fastai, rt-detr).
      4  PRETRAINED, AND DOES THE USER'S OWN TASK WITH NO TRAINING STEP: a new table, or any
         image, gets a prediction from the shipped model directly (tabpfn, tabicl,
         google-cloud-vision, ultralytics, whose package runs the open-vocabulary YOLO-World and
         YOLOE detectors and SAM 3 on labels the user names). The prediction qualifies when the
         user chooses the target at inference - a text phrase, a point, an enrolled identity, a
         new table or series (segment-anything, dino through dino.txt, insightface, dlib's face
         recognizer, mediapipe's interactive segmenter, kornia's bundled SAM, darts' foundation
         forecasters) - or when the product exists to deliver a class-agnostic depth map or
         foreground mask (depth-anything, birefnet, rmbg). A shipped model counts whether the
         vendor trained it or bundles another project's, as ultralytics' SAM 3 already did. A
         model zoo whose only such model is incidental to a label-bound catalog, such as
         torchvision's RAFT optical flow, is not placed here on that model. A checkpoint that
         handles only its training label space - COCO's 80 classes for rf-detr and rt-detr - does
         not qualify: a new label set means a training run, which is rung 3. An earlier draft of
         the first tranche put ultralytics at 3 on its fixed-class YOLO models; the independent
         verifier found the open-vocabulary models in its tree and docs, and it moved to 4.
      5  AUTOMATED END TO END: searches, fits and ensembles or trains models for the user's own
         task without machine-learning work on their side (autogluon, the TOP ANCHOR, which also
         embeds rung-4 tabular models; amazon-rekognition, whose Custom Labels trains detectors by
         AutoML inside the same service; h2o-3's AutoML; flaml; pycaret's compare_models; monai's
         Auto3DSeg for 3D segmentation; pyod's ADEngine for outlier detection). The first-tranche
         wording also required a rung-5 product to embed rung-4 models; that clause described the
         two products then on the rung rather than the capability, and it is dropped here.
    The seed note's statement that model rows sit at rung 4 by construction is withdrawn: rf-detr
    and rt-detr are model rows at rung 3, on the definition above.

    Every non-root band records `relative_to`/`relation` against a same-category peer:
    scikit-learn two_below autogluon; statsmodels, sktime, spacy, nltk, timm, cuml and river at
    scikit-learn; ultralytics at google-cloud-vision; rf-detr one_below ultralytics; xgboost one_below scikit-learn; prophet one_below
    sktime; opencv one_below xgboost; tabpfn one_below autogluon; tabicl at tabpfn;
    amazon-rekognition at autogluon; google-cloud-vision one_below amazon-rekognition; lightgbm,
    catboost, imbalanced-learn, umap and hdbscan at xgboost; pmdarima at prophet; textblob
    one_below nltk; gensim at nltk; stanza at spacy; gluonts and statsforecast at sktime; darts
    at tabpfn; torchvision, detectron2 and fastai at timm; rt-detr at rf-detr; supervision and
    scikit-image at opencv; dino, segment-anything, depth-anything, birefnet, insightface,
    mediapipe and kornia at ultralytics; dlib at insightface; rmbg at birefnet; h2o-3, flaml, pycaret, monai and pyod at
    autogluon.

    DISTRIBUTION REVIEW (capability.md, "Writing the rungs"), counted 2026-09-27 over the 50
    banded products after the second tranche: rung 1 = 3, rung 2 = 9, rung 3 = 17, rung 4 = 14,
    rung 5 = 7. Rung 3 holds 17/50 = 34%, just above the one-third trigger (it was 7/16 = 44% after
    the first tranche). Wording as it stands: "a toolkit of many learners or a model zoo, with the
    pipelines, evaluation or training recipes to compare and fit them; choosing among them is left
    to the user". Reading: the products genuinely CLUSTER rather than the wording generalizing.
    Evidence: each of the seventeen documents a catalog of learners or checkpoints (cuML's 50+
    GPU algorithms, River's online-learning modules, Gensim's topic and embedding models,
    Stanza's 80-language pipelines, GluonTS' and StatsForecast's model tables, torchvision's and
    Detectron2's model zoos, fastai's learners, RT-DETR's COCO checkpoints) and none documents
    predicting on a user-chosen target untrained or searching models automatically, which is
    what separates 4 and 5. The independent verifier of this tranche moved dlib and kornia up
    to 4 on their bundled face-recognition and SAM models, and darts followed on its foundation
    forecasters; sktime, placed at 3 in the first tranche, documents running foundation models
    too, and is left for re-review rather than moved inside a promotion. The first tranche's
    expectation that promoting single-learner and primitive libraries would widen rungs 1 and 2
    held for rung 2, which went from 2 products to 9; rung 1 went from 1 to 3. The tabular/vision split stays open: the
    ladder discriminated both halves in both tranches, so nothing here requires it yet.

    Weighted 0.6 adoption to 0.4 capability, as ml_frameworks and document_conversion are,
    because the adoption instrument is unusually strong here (monthly PyPI and Hugging Face
    downloads on nearly every row) and the capability axis is weak.

    LICENSE STRINGS NEEDING A RULING before a product carrying one can reproduce go to a single
    maintainer license-rulings issue rather than being decided here. #739 placed the Prior Labs
    TabPFN weights licenses and Roboflow's PML-1.0 in `commercial_forbidden`, LGPL-2.1 and BSL-1.0
    (Boost, kept distinct from BSL-1.1) in `osi`, and InsightFace's model license in the software
    ladder's `noncommercial` tier. Still deferred below: the DINOv3 License and the SAM License
    (SAM 3 and 3.1). FSL-1.1-MIT, which
    the seed note expected pycaret to need, governs only PyCaret 4.0's pre-releases; the current
    stable release, 3.3.2, is MIT, so pycaret computes, and FSL-1.1-MIT will need a ruling when 4.0
    ships as a stable release. Still in the registry and expected to defer when promoted: the
    Sapiens2 License, the TabFM Non-Commercial License, the Stable AI LimiX code and weights
    licenses, the EXAONE AI Model License NC, Apple's apple-amlr sample-code license, and the
    NVIDIA Source Code License.
  deferred:
    dino:
      because: >-
        DINOv3, the current release, is under Meta's DINOv3 License (last updated 2025-08-19),
        which grants use, redistribution and modification with no commercial restriction but bars
        trade-controlled, military, nuclear, espionage and weapons uses and lets Meta change the
        terms; every DINOv3 checkpoint on the Hub carries it behind a manual access gate. The name
        is in no pretrained tier, so the lookup abstains. The recorded 4/open_weights is the
        `permissive_non_osi` reading (a conduct restriction that caps neither commerce nor scale),
        which with the documented-not-released corpus and the open pretraining code reaches 4,
        hand-assigned pending the maintainer's ruling. DINOv2 is Apache-2.0 but superseded, and
        the current release governs.
    segment-anything:
      because: >-
        SAM 3 and SAM 3.1, the current releases, are under Meta's SAM License (last updated
        2025-11-19), the same agreement as the DINOv3 License with SAM Materials in place of DINO
        Materials: commercial use allowed, trade-controlled, military, nuclear, espionage and
        weapons uses barred, terms changeable by Meta. The name is in no pretrained tier, so the
        lookup abstains. The recorded 3/open_weights is the `permissive_non_osi` reading, which
        with fine-tuning-only code falls through to the open-weights rung, hand-assigned pending
        the maintainer's ruling. SAM and SAM 2 are Apache-2.0 but superseded, and the current
        release governs.
