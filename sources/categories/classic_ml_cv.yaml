strapline: >-
  Outside the LLM stack, the libraries are open almost all the way down: nearly every classical-ML, forecasting, NLP and vision library here publishes its whole source under an OSI license, and only Ultralytics, H2O-3 and InsightFace keep models or features back for paying customers. The restrictions sit on pretrained weights instead - non-commercial checkpoints from TabPFN, Depth Anything, BRIA and InsightFace, RF-DETR's platform-only large models, and Meta's own DINOv3 and SAM licenses - and on the hosted vision APIs from Google and AWS.
comments: >-
  Proposed in issue #600; created as one category (not split) on the 2026-09-26 new-category
  decisions. Litmus: does the product fit, run or ship a prediction model - or the vision
  primitives one is built from - that a data scientist would use before any LLM is involved? It
  passes only if its reason for fame predates the LLM stack or runs orthogonal to it. The scope
  test inside that is "does it fit or run a model": tabular AutoML (AutoGluon, FLAML, H2O-3,
  PyCaret, TPOT, auto-sklearn) and time-series estimator libraries are in because they fit
  models, and CV primitives (OpenCV, scikit-image, Kornia, Albumentations, supervision) are in
  because a vision model cannot be built without them and nothing else on the map owns them.
  Exclusions, by neighbor. ml_frameworks keeps the deep-learning frameworks every layer imports
  (PyTorch, TensorFlow, JAX, Keras, PyTorch Lightning, Paddle) and Feluda for now; timm,
  torchvision and fastai sit here because they are vision-first libraries, not frameworks the
  stack imports. embeddings_retrieval keeps contrastive image-text encoders (CLIP, OpenCLIP,
  SigLIP, and Perception Encoder when it is seeded) because their reason for fame is retrieval;
  general vision backbones (DINO, timm) are owned here, ruled on issue #600 on 2026-09-25, and
  timm's hosted SigLIP and CLIP checkpoints are mirrors that count for neither. multimodal_models
  takes text-prompted and open-vocabulary vision (Grounding DINO, Falcon Perception, CLIPSeg,
  LocateAnything). document_conversion takes OCR and layout or table detection (Table
  Transformer, PP-DocLayout, PaddleX's document pipelines). scientific_ai_models takes
  domain-trained backbones (pathology UNI, CONCH and Virchow, geospatial Prithvi, MedSAM);
  MONAI and TorchGeo are here because they are general toolkits for a domain rather than models
  trained on its instruments. media_generation takes image and video generation. robotics_embodied
  takes robot perception stacks and world_models takes action-conditioned video models; depth,
  tracking and segmentation models with no action or world state stay here. ml_orchestration
  takes hyperparameter search (Optuna, Hyperopt), on the Katib precedent: tuning fits no model.
  evaluation_code takes explainability (SHAP, LIME, Captum, InterpretML), which explains a model
  and fits none; the responsible_ai_measurement proposal (#30) that might have taken them was
  parked. dataset_processing_tools takes data curation (FiftyOne, beside label-studio and
  cleanlab). inference_code and deployment take serving (Roboflow Inference). edge_hardware
  holds boards, not libraries, so MediaPipe is here.
  Contested rulings. The Segment Anything line moved here from the scientific_ai_models tail on
  the 2026-09-26 decisions, since SAM is a general image-segmentation model rather than one
  trained on instrument data; sam2 and SAM 3 fold into the one `segment-anything` row, whose
  most restrictive license is SAM 3's custom SAM License. DataRobot is held out as a closed
  comparator until its surface is pinned (its platform page now leads with agentic products);
  Google Cloud Vision and Amazon Rekognition are the closed comparators seeded. OpenMMLab is
  represented by MMDetection alone while the toolboxes are dormant; MMCV, MMSegmentation,
  MMPretrain and MMPose are parked. The academic YOLO releases (v9, v10, v12) are parked as
  single release-named papers from different labs; Ultralytics is the product line.
  Albumentations points at AlbumentationsX, the live AGPL successor, and the archived MIT
  package's downloads are a note, not adoption. timm's adoption is PyPI only, because the HF
  `timm/` namespace mirrors other vendors' weights. SAP RPT-1 OSS is held as-is and checked at
  promotion for being an open satellite of a closed SAP service. Pretrained time-series
  forecasters (Chronos and its kind) are the forecasting analogue of the tabular foundation
  models and are in scope in principle, but wait for a follow-up sweep; skrub stays as feature
  engineering for scikit-learn. Checkpoints of a line fold into the line (Mitra and TabPFN-mix
  into AutoGluon, Depth Anything V1-V3 into one row), and community fine-tunes, ONNX
  conversions and legacy architecture checkpoints (ResNet, ViT, ConvNeXt, DeiT) are not
  products. Org slugs for rows published from a personal account (lyuwenyu, Peterande, yzhao062,
  lmcinnes) or a moved org (lightgbm-org) keep the account slug until promotion writes the org
  files.
  PROMOTION, first tranche (2026-09-26/27): sixteen products chosen for adoption and for one or
  more rows per sub-area - tabular (scikit-learn, xgboost, statsmodels), AutoML (autogluon),
  tabular foundation models (tabpfn, tabicl), NLP (spacy, nltk), time series (sktime, prophet),
  vision libraries (opencv, timm, ultralytics), a vision model line (rf-detr) and the two closed
  comparators (google-cloud-vision, amazon-rekognition). The other 65 rows stay in the registry
  for add-product. Identity calls made at promotion: autogluon declares the autogluon.core package
  rather than the autogluon meta-package, because every AutoGluon module depends on core and the
  meta-package alone undercounts installs; opencv keeps opencv-python although that wheel is built
  from the opencv/opencv-python packaging repository; timm's adoption is PyPI only; tabicl
  declares the tabicl package though its PyPI record carries no project URL back to the repository
  (the authors named on it are the repository's authors); lightgbm stays under the lightgbm-org
  account slug until it is promoted. No row was rejected at promotion.
  PROMOTION, second tranche (2026-09-27): thirty-four more rows, chosen by the round-2 triage for
  adoption and to fill the sub-areas the first tranche left thin - gradient boosting (lightgbm,
  catboost), imbalanced, outlier, embedding and clustering methods (imbalanced-learn, pyod, umap,
  hdbscan), GPU and online learning (cuml, river), AutoML (h2o-3, flaml, pycaret), NLP (gensim,
  stanza, textblob), forecasting (darts, statsforecast, pmdarima, gluonts), vision libraries
  (torchvision, detectron2, kornia, supervision, scikit-image, mediapipe, fastai, dlib,
  insightface, monai) and model lines (dino, segment-anything, depth-anything, rt-detr, birefnet,
  rmbg). Identity calls made at this promotion: model lines declare the checkpoints whose
  downloads make up their band, and depth-anything's depth-anything-3 PyPI package is declared
  not_primary_channel because the checkpoints come from the Hub; cuml declares both CUDA wheels
  (cuml-cu12, cuml-cu13) and not the placeholder `cuml` package; detectron2 declares no package,
  since the PyPI name is registered with no files, and bands on stars; rt-detr is scored on
  RT-DETRv4, which its repository names the newest member of the family although it is published
  from a separate RT-DETRs account; rmbg is scored on RMBG-2.0, which BRIA's own video model card
  names its still-image model; pycaret is scored on 3.3.2, the current stable release, while the
  FSL-1.1-MIT relicense applies to 4.0 pre-releases only. Account slugs (lightgbm-org, lyuwenyu,
  yzhao062, lmcinnes, zhengpeng7, sloria, davisking) were kept as they are, since no fetched page
  attributes those projects to an institution. No row was rejected at this promotion.
