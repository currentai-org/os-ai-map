name: benchmark_eval_data
display_name: Benchmark / eval datasets
description: "Benchmark datasets used to evaluate models."
strapline: Open problems, gated answers. Many benchmarks publish the questions but hold back the test
  split.
weights:
  adopt: 0.6
  cap: 0.4
scoring_recipe:
  version: 1
  derived_from:
    method: shared dataset ladder, widened by this category, then verified against the
      hand-authored scores
    verified_on: '2026-08-12'
    checker: build/check_rubric.py
  note: >-
    Second DATASET category. The shared ladder as first written could not read this category
    at all - 0 of 27 - for two reasons, neither of which was that the questions differed:
    the card key is spelled `datasheet` here, and `gate` assumed publication, which a
    held-out or internal eval set does not have. Widening `gate` into `availability` and
    adding the `answers` dimension fixed both, and training_synthetic_datasets reproduces
    identically before and after.

    Nine products were deferred at the outset and most were recording defects rather than
    open questions - a license inside a compound key, a gate written as a sentence, a bare
    `cc` naming no terms. Two have since resolved on a card read: `mt-bench` and `livebench`
    each recorded a license and an answer state and nothing about their documentation or
    access, and the top rung asks for a card deliberately. Both document themselves in the
    repository rather than on a Hub card - FastChat's llm_judge README for one, a full
    datasheets-for-datasets questionnaire for the other - and recording that reproduces the
    5/open both already carried.

    Five more closed on 2026-08-12. Three were pure transcription and moved no score:
    `gaia`'s license was recorded nowhere and is recorded as unstated now that a read has
    established nobody has granted anything, `humanitys-last-exam`'s MIT was buried inside a
    `questions+answers:` compound, and `compar-ia-datasets` recorded its gate as a sentence
    where `terms-acceptance+contact-info` is the token. `swe-bench-verified` moved 4 to 5 on
    the owner's ruling that a repository license governs over a distribution point that
    states none. `math` moved 2 to 1: recording the DMCA takedown as `access:closed` lands it
    on the rung for data that is not distributed, which is a step below the gated rung the
    hand-authored score had assumed.

    Two were left and neither was a recording defect. `livecodebench`, which has no published
    license at all, now reproduces on the `unstated` rung at 2/restricted: a free download without
    a grant is not open, and not closed either. `multipl-e` records the repository's
    BSD-3-with-ML-restriction under the same repository-governs ruling, applied here to a
    distribution point that states a conflicting license (the Hub's MIT) rather than none, and
    the #753 ruling scores it on that reading. It stayed deferred until #753 widened the dataset ladder's
    `use_bounded` tier to cover a purpose bound as well as a user bound; it now computes
    3/restricted, down from the hand-assigned 4/open. Nothing is deferred here now.

    A tenth, `gpqa`, was corrected rather than deferred: it recorded 4/gated, a pair no rung
    produces, and the ladder's answer of 3 is what the other nine gated corpora on the map
    already carry. The producible-pair check caught it, which is what that check is for - the
    pair was unfalsifiable until a ladder existed to falsify it.

  extends: dataset
