name: benchmark_eval_data
display_name: Benchmark / eval datasets
description: "Benchmark datasets used to evaluate models."
strapline: Open problems, gated answers. Many benchmarks publish the questions but hold back the test
  split.
weights:
  adopt: 0.6
  cap: 0.4
scoring_recipe:
  version: 1
  derived_from:
    method: shared dataset ladder, widened by this category, then verified against the
      hand-authored scores
    scores_reproduced: 25
    scores_total: 27
    scores_deferred: 2
    verified_on: '2026-08-12'
    checker: build/check_rubric.py
  note: >-
    Second DATASET category. The shared ladder as first written could not read this category
    at all - 0 of 27 - for two reasons, neither of which was that the questions differed:
    the card key is spelled `datasheet` here, and `gate` assumed publication, which a
    held-out or internal eval set does not have. Widening `gate` into `availability` and
    adding the `answers` dimension fixed both, and training_synthetic_datasets reproduces
    identically before and after.

    Nine products were deferred at the outset and most were recording defects rather than
    open questions - a license inside a compound key, a gate written as a sentence, a bare
    `cc` naming no terms. Two have since resolved on a card read: `mt-bench` and `livebench`
    each recorded a license and an answer state and nothing about their documentation or
    access, and the top rung asks for a card deliberately. Both document themselves in the
    repository rather than on a Hub card - FastChat's llm_judge README for one, a full
    datasheets-for-datasets questionnaire for the other - and recording that reproduces the
    5/open both already carried.

    Five more closed on 2026-08-12. Three were pure transcription and moved no score:
    `gaia`'s license was recorded nowhere and is recorded as unstated now that a read has
    established nobody has granted anything, `humanitys-last-exam`'s MIT was buried inside a
    `questions+answers:` compound, and `compar-ia-datasets` recorded its gate as a sentence
    where `terms-acceptance+contact-info` is the token. `swe-bench-verified` moved 4 to 5 on
    the owner's ruling that a repository license governs over a distribution point that
    states none. `math` moved 2 to 1: recording the DMCA takedown as `access:closed` lands it
    on the rung for data that is not distributed, which is a step below the gated rung the
    hand-authored score had assumed.

    Two are left and neither is a recording defect. `livecodebench` has no published license
    at all and now records 3/gated on the curation rule that a free download without a grant
    is not open; the ladder declares no rung for the `unstated` tier, so it abstains rather
    than agreeing. `multipl-e` records the repository's BSD-3-with-ML-restriction under the
    same repository-governs ruling, and this ladder has no tier for a license that permits
    redistribution while bounding what the corpus may be used FOR. Both are rubric gaps
    rather than open questions about the products.

    A tenth, `gpqa`, was corrected rather than deferred: it recorded 4/gated, a pair no rung
    produces, and the ladder's answer of 3 is what the other nine gated corpora on the map
    already carry. The producible-pair check caught it, which is what that check is for - the
    pair was unfalsifiable until a ladder existed to falsify it.

  extends: dataset
  deferred:
    livecodebench:
      because: >-
        Researched and genuinely unstated. The bare `cc` names no terms - CC-BY and CC-BY-NC
        are both `cc` and sit two tiers apart - and a read on 2026-08-12 could not find the
        variant anywhere the project publishes it: the card front matter, the Hub API
        cardData and tags, the sibling `code_generation` and `test_generation` corpora, the
        repository LICENSE (MIT, and it covers the lcb_runner harness rather than the
        problems), the 217-line repository README, ERRATA.md, the project site and
        leaderboard, and the paper. The repo discussions never raise it. The problems are
        collected from LeetCode, AtCoder and Codeforces, which is a plausible reason no
        variant has been committed to. The curation call that followed dropped the record from
        4/open to 3/gated on the same rule applied to `openhermes-2-5`: files that download
        freely without a grant are not open, and not closed either. The deferral stands
        because the ladder has nothing to say either way - the only rungs that read a tier
        test `noncommercial`, `deferred_to_components` and `open_data`, so an `unstated`
        corpus with an open download matches nothing and the formula abstains. Giving
        `unstated` a rung is a rubric change, not a per-product fix.
    multipl-e:
      because: >-
        No longer a recording defect. The owner's ruling of 2026-08-12 is that where a
        repository license and a distribution-point license differ, the repository license
        governs, so the modified BSD-3 that used to sit under a `caveat:` key is now recorded
        under `license` and the MIT on the HF artifact is carried as its detail. The
        repository LICENSE is headed "BSD 3-Clause License with Machine Learning Restriction"
        and its clause 4 reads "The contents of this repository may not be used as training
        data for any machine learning model, including but not limited to neural networks."
        That is what keeps it deferred: this ladder's tiers turn on redistribution and on
        commercial use, and it declares none for a license that permits both while bounding
        what you may use the corpus FOR. `model.yaml` has the word for it, `use_bounded`, and
        the dataset ladder does not. So the tier lookup abstains, the walk blocks on the first
        rung that tests a tier, and the recorded 4 stands rather than being replaced by a
        number nobody derived. Extending the dataset ladder with a use-bounded tier is the fix
        and it is a rubric change.
  capability:
    basis: feature_matrix
    question: Does this benchmark still separate frontier models?
    dimensions:
      headroom:
        question: How much room is left between the best reported score and the ceiling?
        evidence: A published frontier figure on this benchmark, or a successor's measured
          comparison against it.
      contamination_control:
        question: Does the design defend its headroom, by holding answers back or by replacing
          items over time?
        evidence: A held-out or private split, a documented rotation or version cadence, or a
          canary string on the published artifact.
      checkable_scoring:
        question: Is an answer graded against ground truth or executed tests rather than by a
          judge model?
        evidence: The scoring procedure as the project documents it.
      distinct_dimension:
        question: Does it measure something no cheaper instrument already covers?
        evidence: What the project states it tests, read against the other benchmarks on this
          roster.
    anchor:
      primary: the benchmark's own reported frontier ceiling
      machine_signal: none - requires research. `semanticscholar` routes adoption here and
        corroborates capability without settling it.
    bands: null
    bands_status: >-
      Hand-authored against the rungs below, on embeddings_retrieval's precedent. The four
      dimensions do not combine by counting: GAIA is a 5 on one domain and MT-Bench a 4 with
      judge scoring and no contamination control, so an attribute count reproduces neither.
      Headroom leads and the other three say whether it will last. The layer-2 scorer must not
      write this axis.
    note: >-
      Written on 2026-09-11 under issue #319, which ruled that a benchmark's difficulty and
      contamination resistance IS a capability and that the category could not hold both
      positions at once - four products banded on exactly that, and 28 abstaining at the time
      of the ruling on the grounds that a dataset is not capable. The rungs below are read off
      the four bands that already existed rather than invented beside them.

      5 - still separates frontier models AND the design defends that: answers held out or
      the item set replaced over time, and an answer is checkable without a judge. livebench
      (monthly rotation, judge-free, top models under 70%), gaia (300 answers private, one
      checkable answer, 15% against 92% for humans) and humanitys-last-exam (private holdout)
      hold this rung.
      4 - a real discriminator on a dimension nothing cheaper reaches, with one structural
      weakness: judge-based scoring, a small item set, or partial saturation. mt-bench is the
      anchor - 80 multi-turn questions and an LLM judge, still the instrument for a dimension
      multiple choice cannot reach.
      3 - harder than the classic it replaced and still separating, but static and published
      in full, so its headroom is being spent rather than defended.
      2 - plateaued. Frontier scores cluster near the ceiling, its own successors say so, and
      it survives as a reporting convention rather than as a discriminator.
      1 - saturated, or shown not to measure what it claims: frontier accuracy is at the
      ceiling, or published work shows the score moves on rewrites that preserve the problem.

      Three rules settle the calls the rungs alone leave open, and each one came out of
      reading the four existing bands rather than out of scoring a product.
      (a) Saturation is a fact about the benchmark, not a caveat about it. Recording "now
      largely saturated" in prose while abstaining on the axis is the inconsistency #319
      names; a saturated benchmark is a 1 or a 2 and the note says why.
      (b) Openness does not enter the band. gaia and humanitys-last-exam are gated
      specifically to hold answers back, and that is what earns them the top rung on this
      axis. The openness axis records the cost separately.
      (c) Gating is not contamination control on its own. livecodebench is gated over an
      unstated license and math under a DMCA takedown; neither withholds answers to defend a
      score.

      Distribution after the first five bands (issue #319 calibration slice): 9 of 32 scored,
      4/2/1/1/1 across levels 5/4/3/2/1. The top rung is 44 percent of what is scored, which
      is not yet a distribution to judge - the 23 still unscored are mostly the saturated
      classics this rubric puts on levels 1 to 3, so re-count once they land rather than
      rewording against a slice.
