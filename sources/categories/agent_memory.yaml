comments: >-
  Proposed in issue #846 and created 2026-10-08 as a preliminary category, by the maintainer's
  decision on that issue, so that the cluster the #413 sweep parked under the resolution-ledger
  boundary `agent-memory-and-context-stores` has a home. Membership test: is the product's job to
  decide what an agent remembers and recalls across sessions (extracting facts or episodes from
  interactions, consolidating and updating them, forgetting, and serving the result back as
  context), rather than storing whatever it is handed or running the agent? The memory policy is
  what qualifies; the store under it does not. Neighbors. storage keeps the databases and indexes
  these products are built on (Qdrant, pgvector, Chroma, Redis as a database): a vector store with a
  "memory" page in its docs is still storage, and a memory server a database vendor ships as its own
  product (Redis Agent Memory Server, before Redis deprecated it) belongs here. orchestration_agents
  keeps the frameworks and harnesses that plan and execute; a framework's built-in memory module is
  part of that framework, not a row here, and Letta, the MemGPT line, stays a head product there by
  the #855 ruling, which this category does not reopen. A memory toolkit published by a framework's
  vendor as its own package (LangMem) is here. embeddings_retrieval keeps the models that produce
  vectors and relevance scores a memory layer calls. search_retrieval keeps retrieval from live
  external surfaces (web search, crawling); recalling what the agent itself was told is memory,
  fetching what the world says is search. agent_tools_connectors and agent_protocols keep the
  adapters and protocols an agent calls: an MCP server whose function is persistent memory is a
  surface of the memory product behind it, and a generic MCP memory adapter with no memory policy of
  its own stays with the connectors. Code and repository indexes built for coding agents (code
  graphs, codebase context servers) are a boundary case the ledger also parked under this cluster;
  they decide what a coding agent can look up about a codebase rather than what it remembers from
  its own work, and they are to be ruled on when their ledger entries are re-ruled, not admitted by
  the existence of this category. Seed: mem0, whose ledger entry was re-ruled in the creating PR,
  plus the rows of the first discover-candidates sweep. PROMOTED 2026-11-20 (record:
  docs/sweeps/2026-11-20-agent-memory-promotion/). Twenty-four head products. Eleven repositories
  held under the #413 boundary were re-ruled into the category on the promotion's own read of each
  README: Graphiti, Zep (whose repository is now its examples; Zep is scored as the hosted service),
  Supermemory, Honcho, memU, Hindsight, EverOS, Memvid, MemPalace, agentmemory and Engram, plus
  MemOS, whose #413 entry had filed it as authored agent content. From outside both the seed and the
  ledger came Memori, ReMe, MemoryOS, LightMem and the two hyperscaler services, Amazon Bedrock
  AgentCore Memory and Vertex AI Agent Engine Memory Bank, which with Zep and Supermemory mark the
  closed frontier. The membership test as applied: the product itself decides something beyond
  storage, by extracting, consolidating or forgetting memories or by assembling what a new session
  loads; a store the agent writes notes into, however well organized, is not here. REJECTED, with
  reasons: redis-agent-memory-server, deprecated by Redis (its README says it "is not the supported
  production path"; its successor, Redis Agent Memory, is a closed product needing a license key and
  is not added); memary, no commit since 2024-10; contextos, a three-star single-author prototype
  with no LICENSE file; basicmachines-co/basic-memory, a Markdown knowledge base reached over MCP
  whose notes the assistant writes, with no extraction, consolidation or forgetting of its own, so
  it sits with the generic memory adapters; unicity-aos/capsule-memory, a read-only module of the
  Astrid agent OS that injects a memory file into the system prompt; getmetal/motorhead, whose
  README marks it deprecated. MIRIX (Mirix-AI/MIRIX) is left out because its README leads with a
  multi-agent personal assistant, though it ships a self-hosted memory backend; it is a boundary
  question for a maintainer. Still held by their #413 entries and not ruled here: the code and
  repository indexes named above, mksglu/context-mode (keeps tool output out of the context window,
  which is context management rather than memory), holaboss-ai/holaOS (an agentic workspace), and
  the archived byterover-cli and gsd-2. Letta stays in orchestration_agents: its scored artifact is
  now Letta Code, an agent harness, so the #855 placement still describes it.
