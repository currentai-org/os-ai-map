name: agent_memory
display_name: Agent memory & context stores
description: Software that gives an agent persistent memory across sessions, deciding what to store,
  consolidate, update and forget about facts, episodes and users, and serving it back as context.
strapline: 'The open engines match the hosted ones on what they do. Graphiti, MemOS, Hindsight and MemoryOS
  perform the whole remember, consolidate, recall and forget cycle in published code, as Zep and Supermemory do
  behind an API, but adoption sits with Mem0, whose open library withholds graph memory and decay for its hosted
  platform.'
weights:
  adopt: 0.6
  cap: 0.4
scoring_recipe:
  version: 1
  extends: software
  note: >-
    Inherits the shared software ladder unchanged. A memory layer is a library or a server, and
    whether its own code is published is the same question it is for the storage and agent-tooling
    categories beside it. The vendors here commonly pair an open SDK or self-hostable engine with a
    managed platform, and the hosted service never lifts or lowers the open release (identity.md,
    "An open satellite around a closed core"): read the repository that ships the memory logic, not
    the cloud product's client. Where a vendor publishes only a client for a closed API, that client
    is the satellite and the product reads source closed.
    Weighted 0.6 adoption to 0.4 capability, as storage and the agent-interop categories are:
    nearly every candidate ships a PyPI or npm package, so adoption is measurable on the same
    instruments, and capability is the thinner read.
    CAPABILITY counts how much of the remember, consolidate, recall and forget cycle the product
    performs itself, as opposed to leaving it to the host agent or the store beneath it. Five
    parts, each one a product has or has not, read from its README and documentation: (P1) recall,
    serving stored memories back as context through a retrieval call scoped to a user, agent or
    session; (P2) extraction, deriving memories itself from raw interactions (messages,
    transcripts, documents, tool traces) rather than storing only what the host passes in; (P3)
    consolidation, updating what is stored when new information arrives (merging duplicates,
    resolving contradictions, rewriting summaries or profiles, reflecting over episodes), where an
    LLM-decided update or delete of a conflicting memory counts; (P4) time-aware forgetting, the
    product itself retiring or weakening memories as they age or are superseded in time, through
    temporal validity windows with invalidation or decay of memory strength with age, where a fixed
    retention period or time to live the developer configures does not count and neither does a
    delete the caller invokes; (P5) structured memory, organizing memory into more than one typed
    store or a structured graph (episodic, semantic and procedural memory, a profile plus events,
    an entity-relation graph) and retrieving across them. The band is the number of parts present,
    and band 3 or above requires P2: a product that stores only what it is handed is capped at 2,
    however well it organizes it. TOP ANCHOR: `graphiti`, which performs all five in published
    Apache-2.0 code (LLM extraction from episodes, deduplication and invalidation of contradicted
    facts, bi-temporal validity windows, a graph of entities, facts, episodes and communities). The
    other 5s are recorded `at graphiti`, the 4s `one_below graphiti`; `lightmem` (3) is recorded
    against `langmem`, and the three 2s against `lightmem`, the nearer peer.
    WIDE-RUNG REVIEW (capability.md, "Writing the rungs"), counted 2026-11-20 over 24 banded
    products: 5 holds 9, 4 holds 11, 3 holds 1, 2 holds 3, 1 holds 0. Both 5 (38%) and 4 (46%) are
    above a third. The first count put twelve at 5, because P4 read "expiry or TTL policies" and
    admitted any retention period a developer configures; it was reworded to the time-aware
    reading above, which moved cognee, amazon-bedrock-agentcore-memory and
    vertex-ai-agent-engine-memory-bank to 4 and was re-counted. What remains is a cluster, not a
    loose definition: the 4s share a specific design (an LLM extracts facts or episodes, a
    consolidation pass merges and corrects them, and typed stores or profiles hold the result) that
    Mem0's add/update/delete pipeline popularized and that LangMem, ReMe, EverOS, Honcho, Memori,
    Memobase, memU, Memvid and both hyperscaler services each document; what separates the 5s from
    them is exactly one checkable capability, a notion of when a memory stopped being true or
    relevant (Graphiti's and Zep's validity windows, Hindsight's observation invalidation, MemOS's
    and MemoryOS's heat decay, agentmemory's decay curve, LongMemory's bitemporal facts, Mem0
    Platform's decay, Supermemory's expiring temporary facts). Splitting the 4s further would need
    a distinction their documentation does not support.
    SKU SPLITS. `mem0`'s capability is read from Mem0 Platform, the tier Mem0 sells, while its
    openness is read from the repository: the open library is ADD-only and carries no graph or
    decay, and alone would band 3 (P1, P2, P4). Both notes say which tier they read.
  deferred:
    memu:
      because: >-
        memU's LICENSE.txt is headed Apache License 2.0, but section 2's copyright grant is
        rewritten in MIT wording and other clauses are reworded, so it is a modified text no tier
        names. The vendor calls it Apache-2.0 throughout (README badge, FAQ, npm license field),
        which would read 5/open_source; the recorded 3/source_available reads it, by analogy with
        Crawl4AI-Attribution-License, as permissive but not OSI-approved. Whether a reworded Apache
        text is `osi` or `permissive_non_osi` is a shared license-tier ruling for a maintainer.
