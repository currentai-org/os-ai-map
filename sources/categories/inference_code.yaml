name: inference_code
display_name: Inference code
description: "Engines and runtimes that serve model inference."
strapline: 'Open engines, closed clouds. The self-hosted serving engines are OSI-licensed; the managed hardware-vendor inference is not.'
weights:
  adopt: 0.5
  cap: 0.5
products:
- llama-cpp
- text-generation-inference
- onnx-runtime
- lmdeploy
- llamafile
- max
- groq-inference
- cerebras-inference
- fireworks-inference
- together-inference-engine
- aws-neuron
- google-cloud-tpu-inference
- apple-core-ml-runtime
- sambanova-cloud
- qualcomm-ai-engine-direct
- vllm
- sglang
- tensorrt-llm
- localai
- ds4
scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, verified against the hand-authored scores
    scores_reproduced: 10
    scores_total: 20
    verified_on: '2026-07-30'
    checker: build/check_rubric.py
  # Held back rather than scored. The shared ladder has no `otherwise` rule, so
  # these already abstain; declaring them here records WHY, and keeps the
  # reproduction count honest by excluding them from it rather than counting
  # them as passes.
  deferred:
    text-generation-inference:
      because: >-
        source or core-gated is not recorded in a form the ladder can read; needs a read of
        the repo and pricing page
    max:
      because: >-
        `Modular-Community-License` appears in no tier's examples. Read 2026-07-30: it licenses
        per discrete device and grants a limited redistribution right over certain components
        only, which is competition_restricted in substance - but recording that means adding it to
        the tier list. The deciding rule reads `source` alone, but check_rubric resolves a license
        tier before applying the formula, so it abstains. Adding the license to a tier is a rubric
        change, held for Phase 1.
    aws-neuron:
      because: >-
