comments: 'Proposed in issue #9; seeded from the 2026-09-26 sweep (docs/sweeps/2026-09-26-multimodal_models.md).
  Membership test: is this a separately named vision or omni model line whose reason for fame is visual or
  audio-visual understanding, so that listing it as a text LLM would mischaracterize it? A natively multimodal
  general model answers no and stays in its family row in base_pretrained or finetuned_chat: Qwen3.5 and later,
  Gemma 3 and 4, Llama 3.2 Vision and Llama 4, Kimi K2.5 and K3, GLM-5.x, DeepSeek-V4, MiniMax-M3, Inkling,
  Phi-4-multimodal, ERNIE-4.5-VL and Muse Glimmer. A vendor sub-line with its own name and repo that answers
  a different question from the family gets its own row here, following the nemotron-embed and embeddinggemma
  precedent: qwen-vl, glm-v, kimi-vl, paligemma, minicpm-v and minicpm-o, nemotron-vl and nemotron-omni. qwen-vl
  keeps its row although the line has shipped no chat checkpoint since 2025-10-31; its successor is the mapped
  qwen family, which the product record says in prose at promotion. Scope is understanding VLMs (image, document,
  multi-image, video, and GUI or computer-use models, which are weights you download), omni models (audio and
  video in, text or speech out), and the four unified understanding-and-generation models janus, bagel, emu
  and sensenova-u, which this category owns by the 2026-09-26 ruling that media_generation agreed to. Exclusions,
  by neighbor. base_pretrained and finetuned_chat keep the general LLM families above. document_conversion
  keeps OCR-first and document-parsing VLMs (dots.ocr, DeepSeek-OCR, olmOCR, PaddleOCR-VL, MinerU2.5, chandra,
  HunyuanOCR, GOT-OCR2 and the rest), because its question is how much of a document survives, which a general
  VLM ladder does not measure. embeddings_retrieval keeps contrastive and embedding vision-language models
  (CLIP, OpenCLIP, SigLIP, ColPali, ModernVBERT, the Nemotron embed-VL and rerank-VL models, Perception Encoder):
  the test is whether the output is a vector or a relevance score rather than text. classic_ml_cv keeps vision
  backbones, video encoders and detection or segmentation models; Florence-2 and InternVideo sit here on their
  chat and prompt-driven checkpoints, and the InternVideo encoders belong there. media_generation keeps models
  whose headline output is a synthesized image, video or 3D asset (BLIP3o, diffusiongemma). speech_audio keeps
  speech-first ASR, TTS and speech-to-speech models, and ruled chat-first audio LLMs and omni models out, so
  omni lives here. robotics_embodied and world_models keep vision-language-action and embodied-reasoning models
  (MolmoAct, Cosmos-Reason, Isaac, HY-Embodied) and the world models (Cosmos, V-JEPA 2); embodied-reasoning
  VLMs with no action head (RynnBrain, Hy-Embodied VLM, UnifoLM-ER) are held for a follow-up sweep and not
  seeded here. inference_code and evaluation_code keep the runtimes and harnesses (vLLM-Omni, MLX-VLM, lmms-eval,
  VLMEvalKit). orchestration_agents keeps agent apps built on a GUI model (UI-TARS-desktop, OmniParser); the
  model stays here. scientific_ai_models takes domain models such as MedGemma. No closed row is seeded: the
  strongest closed VLMs are the general frontier models finetuned_chat already carries (gpt-5, gemini-pro,
  claude-sonnet), and a vendor''s closed API tier (Qwen-VL-Max, GLM-4v-Plus, Qwen3.5-Omni, Holo3-122B) is a
  SKU of its open row. Three rows need a governing-release call at promotion because one line spans two licenses
  or an open and a closed tier: qwen-omni (Qwen3.5-Omni is proprietary), moondream (Moondream 2 is Apache-2.0,
  3.x carries a custom license) and pixtral (12B Apache-2.0, Large under the Mistral Research License). Capability,
  for the promotion PR: no single leaderboard orders the set. OpenCompass''s Open VLM Leaderboard stops at
  2025-09-17 and has nothing for the GUI or omni rows, and MMMU''s test answers have been public since 2026-02-12.
  The proposed quantity is breadth of grounded understanding, each rung nesting the one below: single-image
  perception; documents and multi-image; video and long context; acting on what it sees (grounded actions or
  native tool calls from visual input); omni in (audio and video understood natively, text out); omni in with
  streaming speech out. A benchmark average breaks ties within a rung where one exists. First promotion, 2026-09-27:
  22 of the 47 seeded rows were promoted, chosen for adoption and to cover every sub-type (image and document,
  video, GUI and computer use, omni, unified). The other 25 stay registry rows for add-product. emu was held
  back although it is in scope: Emu3.5 leads with world modeling and generation, and neither its card nor its
  repository gives an understanding benchmark to place it with. No closed row was added, per the seed ruling.
  Second tranche, 2026-09-27: idefics, lfm-vl, north-vision, deepseek-vl and cambrian promoted from the registry,
  and blip re-read on its current release, xGen-MM (BLIP-3); the other 20 rows stay registry rows. perception-lm
  promoted 2026-09-28 on the #753 ruling, which accepted its thin adoption. Its checkpoints carry the FAIR
  Noncommercial Research License, placed in the model ladder''s commercial_forbidden tier by analogy with the
  #739 vendor non-commercial ruling, so it computes 2/restricted although Meta releases its own video data and training code.
  It is read on the one release there is, the 1B, 3B and 8B checkpoints of April 2025, and the Perception Encoder
  models from the same repository stay out of the row.'
