name: multimodal_models
display_name: Multimodal models
description: Vision-language and omni models whose headline capability is understanding images, documents, screens, video or audio and answering in text, speech or actions, released as a model line separate from the vendor's general LLM.
strapline: Open weights are the rule and the recipe is the exception. Every model here downloads, most under
  Apache 2.0 or MIT, but only Molmo and LLaVA publish the data and code to rebuild theirs.
weights:
  adopt: 0.3
  cap: 0.7
scoring_recipe:
  version: 1
  note: 'Inherits the shared fine-tuned model ladder unchanged. Most of the roster is a vision stack trained
    onto someone else''s language model - Holo on Qwen3.5 and Qwen3.6, Fara on Qwen3.5, MiniCPM-V on Qwen3.5-0.8B,
    Molmo2 on Qwen3 or OLMo, LLaVA-OneVision-2 on Qwen3, BAGEL and VideoLLaMA3 on Qwen2.5 - so the data
    question that fits is the one this ladder asks: what the publisher released for the stage it trained,
    not the base model''s pretraining corpus. Weighted 0.3 adoption to 0.7 capability, as base_pretrained
    and finetuned_chat are, because Hub downloads here are dominated by one family (Qwen-VL) and by small
    models pulled into pipelines (Florence-2-base, BLIP captioning, SmolVLM2-500M), so adoption ranks distribution
    before it ranks the model. OPENNESS READING RULES, applied at the first promotion (2026-09-27) and corrected
    to the #720 ruling. The current release governs openness. The API-only exclusion works across the SKUs
    of one release and never across releases. So the full UI-TARS-1.5, a tier of the release ui-tars is
    scored on, is left out, and Holo3-122B, a hosted size of the earlier Holo3 release, does not bear on
    holo, whose current release Holo3.1 ships every size as downloadable weights. qwen-omni''s current release,
    Qwen3.5-Omni, is API-only while Qwen3-Omni stays downloadable; it was deferred until #753 ruled that it is
    scored 1/closed on the current release, with Qwen3-Omni in context and the note and the open line''s lag left
    to a separate availability attribute under #727. UI-TARS-2
    is newer than UI-TARS-1.5 but has only a technical report, with no weights and no named API model found,
    so ui-tars stays on UI-TARS-1.5, since identity.md excludes unshipped releases. SECOND TRANCHE (2026-09-27),
    same rules. blip is read on xGen-MM v1.5 (BLIP-3), the line''s current understanding release; BLIP3-o
    and BLIP3o-NEXT are image generation and belong toward media_generation, and xGen-MM-Vid, a separate
    CC-BY-NC-4.0 video model on the v1.5 architecture, is recorded under components.context rather than
    taken as the most restrictive SKU, because it is neither a size nor a quantization of the flagship and
    does not substitute for it; for the same reason it does not raise blip''s capability. cambrian is read
    on Cambrian-P (2026-05), fine-tuned from Cambrian-S; its checkpoints carry no card or license tag and
    take the Apache-2.0 LICENSE of the repository that releases them. Its pose supervision needs raw ScanNet,
    ScanNet++ and ARKitScenes copies the scripts do not fetch, so its data is partial and it computes 3;
    Cambrian-S alone, whose mixture downloads, would compute 5, but it is not the current release. deepseek-vl
    is read on DeepSeek-VL2, the last VL-named release; DeepSeek''s later vision models are DeepSeek-V4
    family checkpoints and stay with the deepseek row, as a natively multimodal general model does. idefics
    stays on Idefics3, which nothing has replaced under that name (SmolVLM is its own row), and lfm-vl on
    LFM2.5-VL. Older generations with a different license are named in the product''s comments rather than
    scored. `data: open` only where the publisher releases the post-training mixture itself or scripts that
    fetch all of it (Molmo2 Data with scripts/download_datasets.py; LLaVA-OneVision-2-Data with the carried-forward
    1.5 sets); a mixture assembled from named third-party sets plus some of the publisher''s own is `partial`
    (SmolVLM2, VideoLLaMA3, InternVL3.5, Nemotron, Cambrian-P, whose pose supervision needs raw scans the
    release does not fetch, Idefics3, whose added sets are not yet pushed, and xGen-MM, whose three large
    Salesforce sets are published without the instruction mixture); a mixture described without a release
    is `described`. `code: open` means the publisher''s own training scripts and configs for the scored
    release (Molmo2, LLaVA-OneVision-2, InternVL3.5 CascadeRL, VideoLLaMA3, BAGEL, xGen-MM''s fine-tuning
    code on the LAVIS xgen-mm branch, Cambrian-S and Cambrian-P, PaliGemma''s big_vision transfers); a fine-tuning
    toolkit for users without the publisher''s own recipe is `partial` (qwen-vl-finetune, MiniCPM-V finetune/),
    as is inference and serving code alone; no code at all is `closed`. CAPABILITY is breadth of grounded
    understanding, read as the highest rung the product''s own card, repository or paper documents. The
    rungs are ordered but not strictly cumulative: a computer-use model need not read video. 5 OMNI IN:
    audio and video understood natively together with images and text; top anchor qwen-omni, which also
    answers in streaming speech. 4 ACTS ON WHAT IT SEES: completes tasks in a live GUI or computer environment,
    reported on an online agent benchmark (OSWorld, AndroidWorld, WindowsAgentArena, WebVoyager, Online-Mind2Web),
    however low the score; grounding-only results such as ScreenSpot or OSWorld-G do not qualify on their
    own; root ui-tars, one_below qwen-omni. 3 VIDEO AND MULTI-IMAGE: native video understanding alongside
    multi-image and document input; root minicpm-v, two_below qwen-omni. 2 DOCUMENTS ON ONE IMAGE: OCR-grade
    reading of whole documents, charts and tables with question answering over them, one image at a time;
    boxes, points and region OCR alone stay at 1; root moondream, one_below minicpm-v. Several images at
    once without video stays here (idefics, north-vision, lfm-vl, deepseek-vl, blip): the next step up is
    video, not a second image. 1 SINGLE-IMAGE PERCEPTION: captioning, question answering and prompted detection,
    boxes and region OCR on one image; root florence-2, two_below minicpm-v. Capability is the maximum across
    a product''s releases (docs/reference/identity.md), which is why videollama is at 5 on VideoLLaMA2.1-AV''s
    audio-visual input. Image generation by the unified models (janus, bagel) is recorded in `value` and
    does not raise the band, because it is a second quantity. A benchmark average breaks ties only within
    a rung: OpenCompass stops at 2025-09-17 and has nothing for the GUI or omni rows, and MMMU''s test answers
    have been public since 2026-02-12. Distribution after perception-lm''s promotion, 28 banded: 5 -> 4, 4 -> 7,
    3 -> 7, 2 -> 7, 1 -> 3; the widest rungs are 7 of 28 (25%), under the one-third review trigger. perception-lm
    sits at 3, at minicpm-v, on documents, charts and video with the repository''s multi-image training input. blip
    moved from 1 to 2 on xGen-MM''s interleaved multi-image input, with medium confidence because no document
    benchmark is reported. Custom weights licenses the shared tiers do not name are deferred and listed for
    the maintainer''s license-rulings issue; none is deferred now. Apart from FAIR-Noncommercial-Research,
    added for perception-lm, no edit to sources/rubrics/ is made or implied here.'
  extends: model
