scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, verified against the hand-authored scores
    verified_on: '2026-08-30'
    checker: build/check_rubric.py
  # Nothing is deferred here any more. `model-context-protocol` was the last one, and it
  # closed on a recording fix rather than on the rubric change it appeared to be waiting
  # for: its CC-BY-4.0 documentation license was recorded inside the `license` compound,
  # where most-restrictive-wins applied a license covering the project's PROSE to the
  # artifact you run, and demoted it to 3/source_available. `autogen` had the identical
  # facts recorded the other way - MIT under `license`, CC-BY-4.0 under a separate `docs:`
  # key the ladder does not read - and kept its 5. MCP now matches autogen and reproduces
  # at 5/open_source.
comments: 'Qdrant, Milvus and Pinecone left this category on 2026-08-18 for storage, which took the roster
  from 32 to 29. They had been placed here because agents call them for retrieval, but they are vector databases,
  and their direct peers - Chroma, LanceDB, Vearch, Infinity, HelixDB, Zvec - sit in storage. Two capability
  recipes banding the same kind of product meant their bands could not be compared in the published map. The
  three anchored a self-contained comparison cluster among themselves, so nothing left here points at them
  and no band in this category moved; the reproduction count fell by exactly the three products that left.
  What is left is the protocol and hosted-tool layer this category is actually about.


  `docling`, `marker`, `mineru` and `markitdown` left on 2026-09-16 for document_conversion, taking the roster
  from 34 to 30. They were the document-converter group #430 identified as incoherent here: this category''s
  anchor was `docling`, whose capability value is document-conversion breadth, and most of the roster converts
  nothing. The evidence that they belong together elsewhere was already in the corpus - `olmocr`, in dataset_processing_tools,
  records a capability value benchmarking it directly against Marker and MinerU, so the map measured them as
  peers while filing them in two categories. All five now sit in one.'
