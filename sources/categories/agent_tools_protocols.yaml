name: agent_tools_protocols
display_name: Agent tools & protocols
description: "Tools, protocols, and retrieval for agents."
strapline: Open protocols, closed search. The protocol layer is almost entirely open - MCP, the SDKs
  and the servers around them - and every product here that publishes no source at all is a hosted search
  or retrieval API. Between the two sits a group whose repository is public but whose terms are not open,
  either because the engine behind the service stays private or because the license appends conditions to
  the open one it borrows from.
