name: dataset_processing_tools
display_name: Dataset Processing Tools
description: 'Software that builds training corpora: extraction, filtering, deduplication, decontamination,
  and synthetic-data generation pipelines. This category is the tooling; the corpora themselves live in
  Training & synthetic datasets, and the human-data supply platforms live in Human Data & RLHF.'
strapline: The open curation stack is real but unconsolidated. datatrove and NeMo Curator build corpora
  at the benchmark frontier, but the open tools see only modest adoption and none has broken away. The
  closed automated-curation software here is no more mature.
