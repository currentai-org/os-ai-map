name: dataset_processing_tools
display_name: Dataset Processing Tools
description: 'Software that builds training corpora: extraction, filtering, deduplication, decontamination,
  and synthetic-data generation pipelines. This category is the tooling; the corpora themselves live in
  Training & synthetic datasets.'
strapline: The open curation stack is real but unconsolidated. datatrove and NeMo Curator build corpora
  at the benchmark frontier, but the open tools see only modest adoption and none has broken away. The
  closed automated-curation software here is no more mature.
weights:
  adopt: 0.6
  cap: 0.4
products:
- datatrove
- distilabel
- nemo-curator
- olmocr
- dolma-toolkit
- datamap-rs
- duplodocus
- decon
- marin-framework
- smallpond
- bigcode-dataset
- ungoliant
- the-pile-pipeline
- txt360-pipeline
- snorkel-flow
- nemo-data-designer
- datology-ai
- dclm
- data-juicer
- ccnet
- redpajama-data
scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, verified against the hand-authored scores
    scores_reproduced: 19
    scores_total: 21
    verified_on: '2026-07-30'
    checker: build/check_rubric.py
  # Held back rather than scored. The shared ladder has no `otherwise` rule, so
  # these already abstain; declaring them here records WHY, and keeps the
  # reproduction count honest by excluding them from it rather than counting
  # them as passes.
  deferred:
    txt360-pipeline:
      because: >-
        the license is recorded as prose - `Apache-2.0 asserted in README only, no LICENSE file in
        repo` - so the tier lookup reads a sentence rather than a license name. Confirmed
        2026-07-30: the repo still ships no LICENSE file and the GitHub license endpoint 404s. The
        deciding rule reads `source` alone, but check_rubric resolves a license tier before
        applying the formula, so it abstains. Adding the license to a tier is a rubric change,
        held for Phase 1.
    nemo-data-designer:
      because: >-
        the 2026-08-11 evidence sweep recorded the missing keys and they contradict the score on
        file. NVIDIA's own NeMo microservices docs state "The service is built on the open-source
        NVIDIA NeMo Data Designer library" and link to github.com/NVIDIA-NeMo/DataDesigner, which
        is Apache-2.0, installs with `pip install data-designer`, and ships the whole generation
        framework rather than a client for a hosted service. So `source` is public and the license
        is OSI, rung 0 no longer fires, and the recorded 1/closed cannot be reproduced at either
        value of core-gated - the product is somewhere in {4, 5}. The prior 1/closed rested on a
        single TechCrunch article and carried no last_verified. core-gated is deliberately still
        unrecorded, because closing it needs a read of what, if anything, the NeMo Platform
        withholds from the published library. Score, class and the product description left
        untouched for a human.
comments: 'The software that produces the training_synthetic_datasets row (Columbia model-components layer;
  MOF ''Data Preprocessing Code''). Scoped to data-processing software; human-data / RLHF labor marketplaces (Scale, Surge, Mercor) are
  out of scope -- per the Columbia framework their output is data (the datasets category) and their labor
  is an upstream transparency axis, not a stack component. Software openness vocabulary. Proposed in issue #85. TxT360 pipeline scored source_available:
  its README asserts Apache-2.0 but the repo ships no LICENSE file.'
