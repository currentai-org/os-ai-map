name: dataset_processing_tools
display_name: Dataset Processing Tools
description: 'Software that builds training corpora: extraction, filtering, deduplication, decontamination,
  and synthetic-data generation pipelines.'
strapline: Open tools built the open corpora. datatrove, the Dolma toolkit, and NeMo Curator are fully
  open source and produced most of the mature open datasets, yet each sees only modest adoption and none
  has broken away. The closed frontier's own data pipelines stay unpublished, so its corpora can be downloaded
  but not reproduced.
