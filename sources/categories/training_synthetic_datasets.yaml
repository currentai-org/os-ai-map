name: training_synthetic_datasets
display_name: Training & synthetic datasets
description: "Corpora for pre-training and post-training models. This category is the datasets themselves; the software that builds them lives in Dataset Processing Tools."
strapline: Open training data is a monoculture. The only mature fully-open corpora —
  FineWeb-Edu, DCLM, and Dolma 3 — are filtered Common-Crawl English web text; open
  multilingual, preference, and reasoning data lag well behind. Meanwhile the frontier's
  own recipe — its proprietary and licensed data and exact mix — stays invisible.
weights:
  adopt: 0.5
  cap: 0.5
disclosure_gap: true
scoring_recipe:
  version: 1
  derived_from:
    method: reverse-engineered from hand-authored scores, then verified
    scores_reproduced: 37
    scores_total: 38
    scores_deferred: 1
    verified_on: '2026-08-11'
    checker: build/check_rubric.py
  note: >-
    First DATASET category, and the source the shared ladder was derived from. Chosen over
    benchmark_eval_data because its recorded evidence is the cleanest in the map: 38 of 38
    name a license and almost every value is a controlled token rather than a sentence. Not one
    of its deferrals was ever a case of the ladder finding the product hard. Eight were declared
    at the outset: five recorded their evidence in clauses the components parser discards, one
    was the only non-commercial license on the ladder, one records no license at all, and one
    hid the fact that decides it inside a parenthetical.

    Seven have since resolved and none of the seven needed research. `personahub` resolved on
    2026-08-01, when the universal license scale gave the non-commercial tier a rung at 2 - it
    had been the one place this ladder declined to decide. The five parser cases resolved on
    2026-08-11 by promoting the discarded clauses to keys: `dataset card present` became
    `dataset_card:present` and `ungated` became `access:ungated`, which is the same evidence
    under a name the ladder reads. No score moved.

    One is left, `openhermes-2-5`, and it is the one that needed an answer rather than a key.
    The answer came back on 2026-08-12 and it is that there is no license: not in the card
    front matter, not in the card body, not as a file in the repository, not on the Hub API.
    The deferral stands, and what it now records is a finding rather than a question. Whether
    a corpus nobody has licensed can carry 5/open is a curation call.

  extends: dataset
  deferred:
    openhermes-2-5:
      because: >-
        Researched and genuinely unstated, so the deferral stands on a finding rather than on
        an open question. A read on 2026-08-12 checked everywhere the publisher could state
        terms: the card front matter carries language, pretty_name and tags and no `license:`
        key; the 126-line body runs from the constituent source list through the sharegpt
        format description to the citation with no terms section and no occurrence of the word
        "license"; the repository holds only .gitattributes, README.md and openhermes2_5.json,
        so no LICENSE file ships with the data; and the Hub API returns no license and no
        `license:` tag. The `commonly cited as permissive` detail was a third-party reading and
        has been dropped. Nobody has granted anything, so the `unstated` tier is correct and
        the recorded 5/open is not supportable on the license. Moving it is a curation call,
        not a research one.
