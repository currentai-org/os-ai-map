scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, checked against the hand-recorded scores
    verified_on: '2026-09-02'
    checker: build/check_rubric.py
  note: >-
    The roster is software-only, so it inherits the shared software ladder unchanged; nothing in the
    evidence suggested a semantic mismatch. Four license bodies had to be read rather than trusted:
    aimet, torchao, cutlass and composable-kernel all report NOASSERTION because their LICENSE
    bodies open with a vendor copyright line, and all four are verbatim BSD-3-Clause or MIT.
    arm-compute-library reports no license at all because it follows the REUSE convention with no
    root LICENSE file. tensorrt is the one product that does not reach the OSI rungs, and not
    because of its license: its optimizing builder is a prebuilt binary the repository links
    against, so `source` is `partial` and the formula settles it on that alone.

    Capability is a category feature matrix rather than a benchmark. It banded on how much of the
    model-to-hardware transformation pipeline a product performs until issue #434, which is a
    compiler's yardstick: a kernel library performs none of that pipeline by construction, so no
    kernel library on the roster could score above 3 and several of the most load-bearing pieces of
    software in the category sat at 2. #434 ruled that evidence against the matrix before it is
    evidence against the products, and ruled the yardstick be fixed with the roster left whole.

    The matrix asks the same two questions of all three populations the roster holds - compilers and
    converters, quantizers and optimizers, kernel and primitive libraries:

      * how much of the category's surface the product covers. For a compiler that is framework
        inputs, hardware backends and the passes between them; for an optimizer, how many techniques
        over how many classes of model; for a kernel library, how many operator families over how
        many hardware generations and vendors.
      * how much of the stack depends on it. Whether named engines, frameworks and compilers call
        this product for the job, or whether it is one of several ways to do one job.

      5  At the top of BOTH: the whole path from a framework graph to a target, across more than
         one vendor's backends, through the product's own optimizer and code generator. No kernel
         library reaches it, and that is a claim about surface rather than about layer - supplying
         one layer's primitives covers less of the category's surface than covering the whole path
         does.
      4  At the top of ONE, with real coverage on the other. Either the whole path narrowed to one
         vendor's targets or one class of model, or an operator surface that the stack's own named
         engines and frameworks call for the job. tensorrt and flash-attention are the two shapes.
      3  Real coverage, at the top of neither. A single optimization family applied across classes
         of model; or an operator set whose named consumers are its own vendor's stack, one
         framework's users, or nobody the documentation names.
      2  Narrow on both. A single-pass graph utility, or kernels for one operator variant on one
         hardware generation, usually purpose-built for one model family.

    The 3/4 line is the one that has to be reproducible, because it is where the three populations
    meet and where the old yardstick did its damage. It is decided by WHO CALLS THE PRODUCT, read
    off the product's own documentation rather than asserted: an operator library reaches 4 when
    engines and frameworks outside its own vendor name it as the implementation they use, and sits
    at 3 when its named consumers are its vendor's own stack or one framework's users. oneDNN's
    README names ONNX Runtime, OpenVINO, PaddlePaddle, PyTorch and TensorFlow; MIOpen's names ROCm.
    That is the difference, and it is checkable in one read.

    apache-tvm is the top anchor and every other band is recorded against it or against the tensorrt
    rung below it, so `check_capability` can check the arithmetic.

    Six bands moved with the rewrite, all of them kernel libraries the old yardstick had capped:
    flash-attention, cutlass, onednn and flashinfer 3 -> 4, composable-kernel and liger-kernel
    2 -> 3. flashmla re-anchors from one_below to two_below flash-attention to hold its own band at
    2. Nothing else moved and the category's stage did not: Stage 3, L = 0, B = 4.00, one gap, and
    that gap stays `adoption`. Which is #434's other finding - what holds this layer back is that
    the adoption instruments cannot see a library that is built from source rather than installed
    from a package (#426).

    Five bands that did NOT move were re-argued against the new 3/4 test rather than left standing
    on the retired one, because a band whose stated reason has been withdrawn is not a band anyone
    can check: arm-compute-library, miopen, onemath, composable-kernel and liger-kernel each now
    say which named consumers put them below the line. onemath is the one to re-read on the next
    coverage pass - its README names the backends it dispatches DOWN to and nothing that calls it,
    and an interface layer is the shape most likely to be called without being credited.

    Round 2 (2026-09-02) promoted 18 of 21 registry candidates and added two named licenses to the
    shared software ladder rather than a new tier: `Apache-2.0-WITH-LLVM-exception` (cuda-tile) joins
    the `osi` tier's examples on the LLVM Foundation's own reading that the exception widens the
    Apache-2.0 grant and caps nothing; `NXAI-Community-License` (mlstm-kernels) joins
    `competition_restricted`'s examples on the same revenue-threshold shape n8n-Enterprise-License and
    Modular-Community-License already cover there. Both were measured before adding and moved only
    the one product each was added for. 18 new bands were placed: 6 at 4 (one_below apache-tvm), 5 at
    3 and 7 at 2, all against the apache-tvm or tensorrt anchor exactly as round 1's bands were.
comments: >-
  Columbia infrastructure category. Includes model conversion, graph and tensor compilation,
  quantization, pruning, and compiler-adjacent kernel libraries. Complete serving engines remain in
  inference_code, general ML libraries in ml_frameworks, and firmware and device drivers in
  edge_hardware. Seeded from Good AI List Infrastructure / Model optimization and Kernels on
  2026-08-18 and triaged in full the same day: 21 of 25 seeded rows were promoted and four rejected
  on the boundary - tiny-cuda-nn (a small neural-network framework for graphics workloads, not a
  model-optimization tool), torch2trt (a thin converter with no release channel and no commit since
  2024-08), llm-awq (the paper's reference implementation, superseded in production by
  llm-compressor, which is on the roster) and litert, whose own README leads with "Google's
  on-device runtime" and which the boundary excludes as a complete inference engine. Five
  replacements were added: xla, mlc-llm, gptqmodel, cutlass and composable-kernel. ONNX, OpenVINO,
  Optimum, Triton and GGML stay in ml_frameworks and ONNX Runtime and TensorRT-LLM stay in
  inference_code; several of them would arguably read better here, but moving a product out of a
  published category recalibrates capability in both and is a taxonomy decision to take on its own
  rather than inside this build. litert is the one rejected candidate that plausibly belongs
  elsewhere on the map, in inference_code or edge_hardware.

  Round 2, seeded per issue #434 and triaged 2026-09-02: 18 of 21 registry candidates were promoted
  (torch-tensorrt, cuda-tile, nvidia-tensor-ir, taco, finch-jl, freetensor, auto-round, miopen,
  onemath, humming, flash-sparse-attention, flashmla, flashkda, flashqla, block-sparse-attention,
  cula, mlstm-kernels, attention-gym) and three rejected on the boundary. nccl and uccl are
  collective-communication and P2P networking libraries (GPU allreduce/broadcast, KV-cache and RL
  weight transfer) - they move data between accelerators rather than lowering, converting,
  quantizing or optimizing a trained model or tensor program, and neither supplies the compute
  primitives (GEMM, convolution, attention) a compiler targets, so neither fits this category or its
  kernel-library population at any tier. rocalution is AMD's iterative sparse-linear-system solver
  library (CG, GMRES-family Krylov methods) for general HPC and scientific-computing workloads on
  ROCm hardware - it is not tied to trained-model or tensor-program optimization the way the roster's
  other math libraries (oneMath, onednn, arm-compute-library) are, so it stays out on the same
  general-purpose-adjacent reasoning that excluded redis and tidb in round 1. Two identity
  corrections against the registry's own guesses: FlashQLA's org is alibaba-cloud, not a separate
  `qwen` org - the map already rosters Qwen products under alibaba-cloud - and Torch-TensorRT's org
  is pytorch-foundation, not a bare `pytorch`, matching the existing PyTorch Foundation roster.
  MIOpen's own README carries a retirement notice pointing at the consolidated ROCm/rocm-libraries
  monorepo; it is promoted anyway on the precedent already set by composable-kernel, which the
  roster already carries through the identical ROCm migration.
