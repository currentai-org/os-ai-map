name: scientific_ai_models
display_name: Scientific AI models
description: Models trained on instrument, measurement, or scientific-simulation data rather than human-authored text, images, or speech.
strapline: Downloadable weights are the norm here and complete releases are rare. Only a handful
  publish the training corpus and the code that consumed it alongside the weights.
weights:
  adopt: 0.3
  cap: 0.7

scoring_recipe:
  version: 1
  extends: pretrained
  derived_from:
    method: >-
      Shared from-scratch openness ladder, inherited. The capability feature count was
      calibrated on the first ten promoted products and then applied unchanged to the
      remaining twenty-four; the wording was not revised after seeing them, so the whole
      34-product roster is the derivation set rather than the original ten.
    inherited_from: base_pretrained
    verified_on: '2026-09-10'
    checker: build/check_rubric.py

  # SHARED-LADDER TIER ADDITIONS MADE DURING THIS PROMOTION - SIGNED OFF 2026-09-11.
  #
  # docs/workflows/promote-category.md step 7 says a license the shared tier does not name should
  # leave the product DEFERRED with a substantive reason, because extending a shared tier reaches
  # every category that inherits it and is a maintainer's ruling rather than part of a promotion.
  # That is not what happened. Five names were added to sources/rubrics/pretrained.yaml so the
  # walk would score rather than abstain:
  #
  #   CC-BY-4.0, CC-BY-SA-4.0     -> permissive_non_osi   (dofa, weathernext, neuralgcm)
  #   FAIR-Chemistry-License-v1   -> permissive_non_osi   (uma)
  #   ASL                         -> commercial_forbidden (mace)
  #   AlphaFold-3-Model-...-Use   -> commercial_forbidden (alphafold)
  #
  # Each cites a ruling the ladder already contains, and the blast radius was measured before the
  # edit: no base_pretrained product records any of these names, and all 32 of its scores
  # reproduce unchanged. The measurement was never the point though - whose call it is, is.
  # The call was delegated to an external reviewer and made on 2026-09-11: all six mappings
  # upheld, and the FAIR-Chemistry contradiction resolved by correcting `use_bounded` rather
  # than by moving the licence. The ruling is recorded at the head of `license_tier` in
  # sources/rubrics/pretrained.yaml, which is where a later reader will look for it.
  #
  # One rubric self-contradiction surfaced while making the uma call and is NOT resolved here:
  # permissive_non_osi's definition says an acceptable-use policy "caps neither commerce nor
  # reach", while use_bounded's definition lists "or an acceptable-use policy" as a bound. Issue
  # #117 governs and permissive_non_osi is the reading applied. Filed as issue #538, with the
  # finding that uma is the first product where the two tiers give different answers - the other
  # eight AUP-licensed products reach 3 down either route, so nobody had to choose before.
  # RESOLVED for this ladder on 2026-09-11: `use_bounded` no longer lists an acceptable-use
  # policy as a bound. sources/rubrics/model.yaml still carries the original wording and is
  # left to #538.

  adoption:
    signal_preference:
    # A model whose documented way to obtain the weights is a package is measured on that
    # package. The Hub is the default channel for a model, not the definition of one, and a
    # product distributed elsewhere otherwise lands on the wrong instrument rather than on a
    # wider error bar: `uma` read level 1 against a gated Hub repo while `fairchem-core`
    # drew 57K installs a month, and `boltz` read stars because its Hub repos report zero --
    # the package fetches checkpoints directly. The model and software download bands are
    # numerically identical, so this selects an instrument and recalibrates nothing.
    # Ruling on #536. The package must be DECLARED on the product and be the documented
    # install path; a client, a wrapper or an SDK for a hosted service fails the
    # measurement-population test in docs/reference/adoption.md exactly as it does elsewhere.
    - signal_type: usage_volume
      source: package downloads where the declared package is the documented way to obtain
        the weights
      machine_signal: signal_packages.downloads
    - signal_type: usage_volume
      source: Hugging Face downloads, summed across the product line's shipped checkpoints
      machine_signal: signal_huggingface.artifact_state
    - signal_type: active_users
      source: vendor-disclosed active users or installations
    - signal_type: reported_traction
      source: >
        Credible vendor or third-party reach where no governed artifact count exists.
        Directional only; set confidence to medium at best.
    - signal_type: stars_fallback
      source: GitHub stars, last resort
      machine_signal: signal_github.artifact_state
    bands:
    - {level: 1, reach: <10K}
    - {level: 2, reach: 10K-100K}
    - {level: 3, reach: 100K-1M}
    - {level: 4, reach: 1M-10M}
    - {level: 5, reach: '>10M'}
    reach_is_monthly: true
    note: >
      The numeric bands match the existing model and software scales. Issue #536 tracks
      routing a model to the channel that actually distributes it, including PyPI and Zenodo;
      this category does not settle that corpus-wide methodology question.

  capability:
    basis: feature_matrix
    attributes:
      adaptation_pathway:
        question: Does the publisher document a concrete way to adapt or fine-tune the model?
        evidence: Training or fine-tuning code, configuration, notebook, or documented API.
      multi_instrument:
        question: Does one model accept measurements from more than one instrument or modality?
        evidence: The publisher's input specification or model documentation.
      generative:
        question: Can the model generate or simulate scientifically meaningful outputs rather than only predict a fixed target?
        evidence: The publisher's task definition and documented output surface.
      multi_scale:
        question: Does one model operate across more than one spatial, temporal, molecular, or resolution scale?
        evidence: The publisher's input or output specification, or documented checkpoints at distinct sampling
          resolutions. Evaluation results alone do not establish multi-scale capability when the resolution is
          reached only through transfer or downstream fine-tuning.
    anchor:
      primary: documented scientific adaptation surface
      machine_signal: none — requires research
    bands:
    - {level: 1, attributes: 0}
    - {level: 2, attributes: 1}
    - {level: 3, attributes: 2}
    - {level: 4, attributes: 3}
    - {level: 5, attributes: 4}
    note: >
      Count only attributes stated directly by a primary product source. A long task list is
      not an adaptation pathway, several variables from one data system are not multiple
      instruments, masked reconstruction is not a scientifically meaningful generated output,
      and parameter sizes are not scientific scales.

      Seven rulings settle the close calls, and they are rules rather than habits. (a) to (c) came
      out of the promotion, (d) to (f) out of re-verification, and (g) out of the capability
      consistency audit reviewed in #1079 (R-2026-11-16-b); each is applied to the whole roster rather
      than only to the product that prompted it.
      (a) A resolution span counts as multi_scale even where the smaller member is motivated by
      compute, so weathernext's 0.25-degree and 1-degree Mini count the way neuralgcm's
      0.7/1.4/2.8-degree checkpoints do; a parameter count alone still does not.
      (b) An adaptation pathway must be executable, not merely described: weathernext's notebook
      reaches a gradient step and counts, while neuralgcm's shipped training configs do not,
      because their entry point imports an unpublished package and cannot run.
      (c) A single checkpoint carrying heads over several data systems is multi_instrument, which
      is why uma and mace-mh both count and a family of one-checkpoint-per-domain does not.
      (d) A deterministic forecast is prediction, not generation. Producing a future state from a
      current one does not earn `generative`; a probabilistic or ensemble output does, which is
      why weathernext and neuralgcm count while aifs, pangu-weather, climax, aurora, prithvi-wxc
      and surya do not. Added on re-verification, when three of those six had been credited for
      plain forecasting and three had been declined for it.
      (e) A longer window at the same granularity is extent, not scale. `multi_scale` needs more
      than one sampling resolution, which is why weathernext's 0.25 and 1 degree, neuralgcm's
      three resolutions and lunar's 1 m and 100 m count, while evo-2's 8K-to-1M base context,
      presto's 1-24 monthly timesteps and aifs's 13 pressure levels do not.
      (f) `multi_instrument` asks what the model ACCEPTS. Output diversity does not earn it -
      alphagenome takes DNA sequence and emits many assay tracks - and neither does a label
      source, which is why granite-geospatial's GEDI lidar is excluded.
      (g) `multi_scale` reads the sampling resolution of the data a model is specified to take in or
      put out: ground sampling distance, grid spacing, bin width or cadence. It is met by one
      checkpoint whose documented input specification supports samples at multiple native sampling
      resolutions, with the necessary resolution information supplied to the model, so data at more
      than one resolution enter at their own; by one checkpoint whose documented outputs come at more
      than one resolution; or by checkpoints at different resolutions in the product's own release,
      under (a). It is not met by how the model represents data internally (pixel- and token-level
      streams, local and global attention, patch, window or pyramid levels), by sources resampled to
      one grid before they enter, by coverage, window length or forecast lead time, which are extent
      under (e), or by a resolution the model meets only in a transfer test or after fine-tuning on a
      downstream dataset, which is adaptation and is counted there. Counting a transfer or fine-tuned
      result would reward the availability of evaluations rather than a documented intrinsic
      capability. So clay (ground sampling distance carried into the model with each sensor),
      nasa-ibm-lunar-foundation-model (NAC and WAC tiles at native resolution, footprint as input) and
      alphagenome (outputs at 1, 128 and 2,048 bp) count, as do weathernext, neuralgcm, climax and
      aurora-weather on checkpoints at different grid spacings; terramind (pixel and token streams
      over inputs co-registered at 10 m, its 1 m NAIP result a transfer test), prithvi-eo (pretrained
      on 30 m data, 0.1-15 m reached by fine-tuning), dofa (chips resized to one size, only
      wavelength enters the model), prithvi-wxc and pangu-weather (coverage and lead time),
      surya-heliophysics (attention ranges at one native resolution), and presto and
      alphaearth-foundations (sources resampled to one grid) do not.

      Distribution over the full 34 after R-2026-11-16-b: 3/11/16/4/0 across levels 1/2/3/4/5,
      or 9/32/47/12/0 percent. It has moved with each evidence pass - 35 percent on level 2 after the
      first pass, 38 percent on level 3 after the second, 44 percent once rulings (d), (e) and (f)
      were applied to the whole roster rather than to the products that prompted them, 47 percent
      after R-2026-11-16-a moved alphagenome and surya-heliophysics onto level 3 and clay onto level 4,
      and level 3 stayed at 47 percent when R-2026-11-16-b moved terramind to 4, prithvi-eo and scgpt
      to 3, prithvi-wxc and geneformer to 2, and pangu-weather to 1. Each move followed evidence, and
      no product has ever been moved to improve the shape. No product currently meets all four
      attributes, so level 5 is empty. That is acceptable, and no substitute is introduced to keep
      the rung occupied.

      On the rung distribution: the widest rung here is level 3, with 16 of 34 products (47
      percent). Measured on 2026-11-16 across the 34 published categories with a banded roster, 29 put
      more than a third of their products on one rung and the median widest rung is 47 percent, so
      this category sits at the median - though being normal across the map is context, not evidence
      that this rubric is right. capability.md asks which of two cases a wide rung is: a definition
      that generalized, or products that genuinely cluster. This is the second. The fat middle is
      where the observed attribute combinations fall rather than a loose definition: bands come from
      a four-boolean count, and the products that record two or three of the four outnumber those
      recording none, one or all four. Rewording cannot move that, because there is no wording to
      loosen - the count is deterministic from the recorded value. A fifth attribute or a weighting
      could, and that is a rubric edit rather than anything this roster should force.

      Bands are placed by the attribute count, which is deterministic from the recorded value, so
      relative_to is recorded where a peer in the same domain corroborates the placement rather than
      as the instrument itself. No product is a category-wide reference. The Earth-observation
      products compare with clay (dofa, presto, granite-geospatial, alphaearth-foundations,
      nasa-ibm-lunar-foundation-model), clay sits at terramind, and prithvi-eo stays one_below
      terramind; surya-heliophysics is one_below nasa-ibm-lunar-foundation-model, which differs from
      it only on multi_scale; the weather models compare with weathernext; the protein models compare
      with openfold, boltz or esm-3; evo-2 sits at alphagenome; mattergen sits at uma. terramind,
      weathernext, alphagenome and openfold record no comparison: terramind is the peer clay points
      at, weathernext is the only weather model at level 4, and no genomics or protein product remains
      at level 4 for alphagenome or openfold to point at.

  confidence_rule:
    high: a primary source states the fact directly or publishes the measured result
    medium: a proxy or publisher summary supports the judgment without a direct measurement
    low: inferred from indirect evidence, or the source is older than 90 days

products:
- prithvi-eo
- terramind
- clay
- aurora-weather
- prithvi-wxc
- surya-heliophysics
- esm-2
- evo-2
- alphagenome
- mattergen
- granite-geospatial
- dofa
- presto
- alphaearth-foundations
- weathernext
- climax
- neuralgcm
- aifs
- pangu-weather
- nasa-ibm-lunar-foundation-model
- esm-3
- alphafold
- openfold
- boltz
- chai
- rfdiffusion
- geneformer
- scgpt
- uce
- mattersim
- uma
- mace
- orb
- gnome
comments: >
  Proposed in issue #533. The boundary is the data, not whether the product is a reusable
  backbone: task models, simulators, generative design tools, and forecast services belong when
  they learn from instrument, measurement, or scientific-simulation output. General-purpose
  text, natural-image, speech, and video models stay in neighboring categories; software
  harnesses such as PhysicsNeMo, Earth-2 Studio, and anemoi-core are not model products. The
  registry roster is now empty: all 34 candidates were promoted on 2026-09-10 and verified
  against primary sources. Capability counts four
  evidence-backed attributes rather than downstream task names, which keeps documentation style
  from masquerading as model breadth.
