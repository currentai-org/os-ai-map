name: federated_learning
display_name: Federated learning
description: >-
  Software that trains, evaluates or queries a shared model across data holders who never pool
  their raw data, moving model updates, aggregates or queries between silos instead of datasets.
strapline: Openness is high, and the adoption leader is open core. Fourteen of nineteen products
  publish a complete OSI-licensed system, but Flower, which draws about two thirds of the category's monthly
  PyPI installs, reserves OIDC login, audit logging and its Helm charts for Flower Enterprise, and Google publishes
  only the device half of its production cross-device platform. Capability splits on reach. Only NVIDIA FLARE
  documents HPC and mobile paths together with federated training measured up to 72 billion parameters, while
  four of the nineteen simulate federations they do not deploy.
weights:
  adopt: 0.5
  cap: 0.5
scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, not yet verified against hand-authored scores
    checker: build/check_rubric.py
  note: 'Inherits the shared software ladder unchanged. Every product is typed software. Two license records
    needed the body rather than the label: Fed-BioMed''s GitHub label reads "other" over a short notice
    granting Apache-2.0 by SPDX identifier, and vantage6''s PyPI record says MIT against an Apache-2.0 LICENSE,
    so the score follows the LICENSE. Flower is open core, because its own documentation
    marks OIDC login, audit logging and the Helm charts as Flower Enterprise features, so it records core-gated:
    gated and lands on 4. p2pfl is the second open-core record: its plan table withholds "Advanced features"
    from the free Community plan for an Enterprise plan still marked as launching soon, which reads as gated
    on the Flower precedent. nebula-dfl names a proprietary Enterprise Edition whose features its own
    commercial FAQ lists as to be determined, over an AGPL-3.0 tree with no enterprise path, which reads as
    ungated under the acceptance standard, so it lands on 5. Both readings are the ones the #753 brief
    proposed, and the maintainer promoted both rows on them. The Federated Compute Platform records source: partial, because Google has not
    published the production server and has removed the reference one, and it lands on 2. No promoted product
    is deferred.


    Capability is one quantity, federation reach: how far outside a single machine a product runs a federated
    job, and under what trust. 5 is everything in 4 plus reach past the data-center silo in the open product
    (a current mobile or edge SDK, or an HPC scheduler launcher), plus federated training validated at multi-billion
    parameters. 4 is a cross-silo deployment runtime: a coordinator and per-party services that each organization
    starts in its own environment, admitting only identified parties (node keys, certificates, an authentication
    service, a party whitelist, or the owner''s approval of each collaborator), with deployment tooling
    for those services and at least one privacy mechanism beyond plain aggregation (secure aggregation,
    homomorphic encryption, MPC, differential privacy or a TEE). 3 is a real federation across machines
    over a network that lacks rung 4''s party-identity layer, or covers only one side of the federation
    or a single model family, or issues party certificates without rung 4''s per-organization services or
    deployment tooling. nebula-dfl lacks the per-organization services: one operator''s controller deploys
    every participant and issues all of their certificates. p2pfl lacks the deployment tooling: its mutual
    TLS admits only certificate-holding peers, but it leaves certificate distribution to the operator and
    ships no deployment tooling for the nodes. 2 is simulation first, where federations are emulated on a machine or cluster
    the researcher controls and the product itself calls real deployment out of scope or unfinished, or
    a client for one federated workload that leaves the federation runtime to another product. No product
    in the first tranche sits at 1. nvidia-flare is the top anchor: a Slurm launcher, an Android and iOS
    SDK, and FedAvg measured up to 72B parameters. flower sits one below it, because its Android SDK is
    marked incompatible with current releases and its Slurm guide runs through the hosted SuperGrid. Every
    other band is recorded against flower, plato-fl (3), fedjax (2), or, for syfthub, pysyft.


    Distribution, counted 2026-09-28 over 19 banded products: one at 5, eight at 4, five at 3, five at
    2 and none at 1. Rung 4 holds 8 of 19 (42%), above the one-third review trigger, with the wording given
    above. This is the clustering case, not a loose definition. Each of the eight was checked against all
    three parts of rung 4 (party identity, deployment tooling and a privacy mechanism), and the wording
    demonstrably excludes working networked frameworks: plato-fl and fedtree each run real federations and
    each lacks the identity layer, so they sit at 3. Inside rung 4, the difference is breadth of privacy
    stack against breadth of operations: Rhino''s governance and customer-managed keys, FATE''s MPC, Fed-BioMed''s
    homomorphic secure aggregation, Flower''s SecAgg+. The vendors'' own feature lists cannot order those.
    The weights are even because declared installs concentrate in Flower, about two thirds of the category''s
    monthly PyPI installs: leaning on adoption would mostly measure Flower, and leaning on capability would
    reward platforms that few people deploy.'
products:
- nvidia-flare
- flower
- fate
- vantage6
- fed-biomed
- appfl
- pysyft
- apheris-networks
- rhino-fcp
- plato-fl
- fedtree
- nebula-dfl
- p2pfl
- federated-compute-platform
- tensorflow-federated
- fedjax
- pfl-research
- pfllib
- syfthub
comments: >-
  Proposed in issue #574; seeded preliminary 2026-09-26 (sweep record
  docs/sweeps/2026-09-26-federated-learning.md). Membership test: does the raw data stay with
  its owner for the whole run of training, evaluation or querying, with only model updates,
  aggregates or queries leaving the silo? The test was widened from the brief's "training
  data" so that federated evaluation, federated analytics and federated retrieval pass on
  their stated function: syfthub (federated RAG) and the federated-statistics surfaces of
  vantage6 and Rhino FCP fail a training-only test and pass this one.


  CONTESTED RULINGS. Two head products move in at PROMOTION, not at the seed: pysyft from
  ml_frameworks ("data science on data that remains in someone else's server"), rebanded here,
  and syfthub from orchestration_agents, which is the move the widened litmus exists to admit.
  Both stay in their current rosters until the promotion PR moves them, because a slug lives in
  one tier and one category at a time. Flower is one product: flwr-datasets ships in the same
  repository as a partitioning utility for Flower users and is not declared, since its
  installs are Flower's own population counted twice. FedML and Substra are tail rows, not
  first-tranche promotions: FedML's README now leads with TensorOpera's generative-AI cloud and
  its last release is from early 2025, and Substra's core SDK has not moved since late 2024
  while its FL library substrafl still does. OpenFL announces its own end of life and points
  users to Flower; it stays a tail row until a date or an archive lands. Privacy-computing
  platforms with an FL layer beside MPC (SecretFlow, PrimiHub) are in: they pass the litmus
  and no other category owns them. FedTree (federated GBDT) stays here rather than in
  classic_ml_cv, because federation is the product and the tree learner is the payload.
  FeatureCloud's "app store" is a catalog of federated apps, not a model hub, so it stays here
  rather than in model_hubs. FedScale and PFLlib call themselves platform plus benchmark; the
  runtime is the product. Apheris Networks and Rhino FCP are the only closed rows (the ADR-005
  best-in-class comparators); HPE Swarm Learning, which needs a license server and ships for
  non-commercial use despite Apache-2.0 text in its repository, is closed long tail and parked.
  Scaleout Edge (formerly FEDn) is parked: its open repository is now only the client SDK of a
  gated platform, and declaring it would lift the platform's openness.


  EXCLUSIONS, by neighbor. Differential-privacy, homomorphic-encryption and MPC primitive
  libraries with no federation runtime have no category and are out. FL benchmarks and
  leaderboards (FL-bench, blades, VFLAIR) belong to evaluation_code or benchmark_eval_data. FL
  datasets (MedMNIST, and flwr-datasets if it is ever split out) belong to
  dataset_processing_tools or the dataset categories. Cloud reference architectures
  (GoogleCloudPlatform/federated-learning) belong to deployment or are not products. General
  distributed-training frameworks with no data-locality guarantee stay in ml_frameworks or
  ml_orchestration. A privacy-measurement or DP-accounting tool belongs to
  assurance_evidence, not here.


  OUT OF SCOPE entirely, because data locality is not what they are for: volunteer and
  decentralized inference (Petals, exo), decentralized training networks (hivemind, Prime
  Intellect, Gensyn), chain SDKs (Bittensor) and compute marketplaces. They pool compute, not
  protect data; a volunteer-inference runtime that belongs anywhere belongs in inference_code.


  FIRST TRANCHE, promoted 2026-09-27: 17 head products, each re-verified live that day. Fifteen
  came from the registry. pysyft (from ml_frameworks) and syfthub (from orchestration_agents)
  moved in and were rebanded against this category's matrix: pysyft stays at 4, now recorded at
  flower, and syfthub stays at 2, now two below pysyft instead of one below openrag. The tranche
  covers production cross-silo (nvidia-flare, flower, fate, vantage6, fed-biomed, appfl), research
  runtimes (plato-fl, fedtree), cross-device (federated-compute-platform), simulation
  (tensorflow-federated, fedjax, pfl-research, pfllib), remote computation and federated query
  (pysyft, syfthub), and the two closed comparators (apheris-networks, rhino-fcp). Twenty-one rows
  stay in the registry. FedML and Substra are held out of the first tranche by decision, and
  OpenFL by its announced end of life. SecretFlow waits on two things: a fetch confirming its Ant
  Group affiliation, and a gating statement, because its tree shows no enterprise path but no
  party says nothing is withheld. NEBULA's README names a proprietary Enterprise Edition beside
  its AGPL Community Edition. P2PFL's pricing page withholds "Advanced features" from the free
  tier for an Enterprise plan still marked as launching soon. Both need a gating reading before
  they can be scored, so the decentralized sub-type is not in this tranche. FeatureCloud's open
  repository is the CLI and controller for the featurecloud.ai service, which leaves its source
  value unsettled. FederatedScope was drafted and pulled back: its core-gated value rested on a
  tree with no enterprise path, which the acceptance standard does not accept alone, and no
  statement from Alibaba was reachable, because federatedscope.io's certificate does not match its
  host. MetisFL (Clear BSD) and FL4Health (Vector Institute License) wait on the license-rulings
  issue. Flame, FedLab, PaddleFL, Fedlearner, PrimiHub, FedScale, XFL, GFL, FLGo, EasyFL and FLSim
  (iQua) remain candidates for later add-product promotions.


  DECENTRALIZED SUB-TYPE, promoted 2026-09-28 on the #753 ruling, which accepted thin adoption for both and
  adopted the brief's gating readings: nebula-dfl (ungated, 5/open_source) and p2pfl (gated, 4/open_core), each
  re-verified live that day. Both run real federations between machines and both sit at 3, one below flower,
  for the reasons given in the rung definitions. NEBULA's physical deployment provisions Raspberry Pi nodes over
  a Tailscale network from a separate physical-deployment branch, beside the local-process and Docker-container
  modes its user guide offers.
