name: language_specific_eval_sets
display_name: Language-specific evaluation sets
description: "Evaluation sets built to test AI in an underrepresented language, or a set of related
  underrepresented languages: benchmarks and shared-task test sets for text and speech, published
  to measure models rather than to train them. Training data for the same languages lives in
  Language-specific datasets, and general benchmarks, including ones translated into many
  languages, live in Benchmark / eval datasets."
weights:
  adopt: 0.3
  cap: 0.7
strapline: >-
  The deepest evaluation sets here test one language at a time. Four large native exams, for Arabic,
  Turkish, Kazakh and Persian, reach the top band, while the broadest multilingual sets, FLORES+ and
  Belebele, sit at 3, and suites assembled from other sets' data fall further once only independent
  evidence is allowed to back them: SEA-HELM to 2, AfroBench and AmericasNLP to 1. Five sets have no
  band yet, two of them for speech, which has no measurement model.
scoring_recipe:
  version: 2
  extends: dataset
  note: |-
    Inherits the shared dataset ladder for openness, as language_specific_datasets does. An
    evaluation set is a dataset, and the ladder already asks the questions it raises: whether it
    can be downloaded and on what terms, under which license, whether its answers are released,
    and whether a card describes it. benchmark_eval_data reads held-out and answer states through
    the same ladder.

    Capability is the depth ladder, computed by build/depth_ladder.py and recorded as
    `basis: evaluation_depth` (R-2026-11-08-b). It is the one capability band on the map that the
    build computes; build/validate.py fails a record whose band differs from what the ladder
    computes from its evidence. docs/reference/capability.md, "The depth ladder", is normative, and
    the rulings it applies are R-2026-11-02-b to -u and R-2026-11-03-a to -i. In short:

    - Each target language's qualifying items on the official evaluation split give a band per
      task on the count ladder: 100, 400, 1,600 and 6,400 items start bands 2 to 5. One component
      sets each task band; components are never summed.
    - A suite's own items count in full (capability.own_components). An imported component counts
      at most one band above the best independent evidence beside it, under the lineage registry's
      independence test, so a suite cannot inherit another set's depth without corroboration.
    - The set's band is the median over its target languages, with unmeasured languages filled at
      0 and at 5; it stands only where both agree. Where it does not stand, the score is null and
      the record says why.

    Every band is provisional: a ceiling read from item counts, not an estimated confidence
    interval, until a task family's estimation method is approved (R-2026-11-02-f). Beside the band
    the payload publishes the face-value band, the best original band, task count, completeness,
    whether the corroboration cap binds and why, the evidence status, and the band with unverified
    lineage treated as independent (R-2026-11-02-o).

    An unresolved set keeps no interim score. Its overall score is adoption alone, labeled
    `overall_basis: adoption_only`; it takes no tier, is never mature, and stays out of the stage,
    so an unresolved capability reads neither as zero nor as maturity (R-2026-11-08-a).

    No relative_to: a computed band is not placed against a peer.

    The calibration that set this baseline, and the bands it computed for all 22 sets, is
    docs/sweeps/2026-11-03-depth-calibration-full-roster.md, accepted as R-2026-11-07-a. The
    interim same-language peer ladder (R-2026-10-30-g) that version 1 of this recipe described was
    never adopted and is retired. The score-change diff at publication, with the stage impact on
    both categories, is docs/sweeps/2026-11-08-depth-ladder-publication.md.
products:
- afrobench
- americasnlp-shared-task-data
- arabicmmlu
- belebele
- darijammlu
- fleurs
- flores-plus
