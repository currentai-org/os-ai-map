name: human_data_rlhf
display_name: Human Data & RLHF
description: 'Commercial platforms that supply human-generated training data: labeling, preference and
  RLHF data, expert and domain data, and human evaluation. Distinct from the corpus-building software in
  Dataset Processing Tools; these are human-in-the-loop data-supply services.'
strapline: Training-data supply is a closed market. Frontier labs source their RLHF, preference, and expert
  data from a handful of well-funded human-data platforms such as Scale, Surge, and Mercor, and there is
  no open-source equivalent to any of them.
weights:
  adopt: 0.6
  cap: 0.4
products:
- scale-data-engine
- surge-ai
- mercor
- turing
comments: 'Human-in-the-loop data-supply services, split out of dataset_processing_tools after the issue
  #85 red team: these are labor marketplaces, not corpus-building software, so a marketplace''s closedness
  is a different thing from an unpublished pipeline. The category has zero open members by nature, so the
  stage engine reports a low stage with an openness gap; read the gap, not the stage label. Software openness
  vocabulary.'
