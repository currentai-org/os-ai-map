name: media_generation
display_name: Image, video, 3D & music generation
description: Models that synthesize images, video, 3D assets, or music and sound effects from a prompt
  or condition, and the apps, engines and libraries built specifically to run, compose or serve them.
strapline: 'Open weights reach the frontier in some media and not in others. On the public arenas an open model
  sits among the three best for video (MiniMax H3) and for 3D (TRELLIS), while closed services hold the top places
  for images and music. The licenses are the sharp edge: twelve of the twenty-nine models ship under community,
  research or non-commercial terms the shared license scale does not yet name, or bundle components that do, three
  of them excluded from the EU entirely, and three open lines - Wan, Qwen-Image and Hunyuan3D - now keep their strongest
  release hosted-only. The software that runs these models is open source throughout.'
weights:
  adopt: 0.4
  cap: 0.6
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
  note: "Two ladders for openness, per product type, following document_conversion and safeguards: generation models\
    \ climb the shared model ladder and the apps, UIs, engines and libraries that run them climb the shared software\
    \ ladder. The closed comparators are typed `model` and settle at 1/closed on `weights: closed`. Many weights\
    \ here ship under custom community licenses. None is added to a shared tier from this category: each goes to\
    \ the one maintainer license-rulings issue, and the product carrying it is in `deferred:` below with a hand-assigned\
    \ score until that ruling lands.\n\nCLOSED FRONTIER ON AN OPEN LINE (the #720 ruling, 2026-09-27). The current\
    \ release governs openness, as identity.md says; the API-only exclusion works across SKUs within a release,\
    \ never across releases. wan (Wan 3.0 current and API-only; Wan 2.2 distributed, Apache-2.0), qwen-image (Qwen-Image\
    \ 3.0 current and API-only; Qwen-Image-2.1 distributed, Qwen Research License) and hunyuan-3d (Hunyuan3D 3.0\
    \ current and API-only; Hunyuan3D 2.1 distributed, Tencent Hunyuan 3D Community License) record the current\
    \ release in `components` and `governing_release`, the prior distributed release under `components.context`\
    \ and in their sources, and leave `openness.score` null: the ladder computes 1/closed from the current release,\
    \ and how the map shows availability separately from openness - the open line one generation behind its vendor's\
    \ closed frontier - awaits a maintainer ruling. That gap is the finding, not bookkeeping. Tiers inside one release\
    \ are unaffected: FLUX.2 [pro]/[flex]/[max] and Stable Audio 3 Large are API-only SKUs of a release whose other\
    \ SKUs are distributed, so the most restrictive DISTRIBUTED SKU still governs flux and stable-audio.\n\nCAPABILITY,\
    \ MODELS: ONE READING, WITHIN A MODALITY. No single quantity orders image, video, 3D and audio together: the\
    \ public arenas are separate per modality and an Elo in one is not commensurable with an Elo in another. Each\
    \ model is read on its modality's board by its best-placed SKU across all of its releases, closed ones included,\
    \ because capability combines as the max across a tier's releases (score.schema.json, `governing_release`) while\
    \ openness follows the current release: image on the Artificial Analysis Text to Image Arena overall board (163\
    \ entries); video on the Artificial Analysis Text to Video Arena without-audio board (86 entries, the wider\
    \ of its two boards); music on AA-Music-Instrumental v1.1 (19 entries); 3D on the 3D Arena image-to-3D render\
    \ board (24 entries), the only live 3D arena, vote-driven and undated, which the seed feared would be too thin\
    \ and which instead lists every 3D product promoted here but one. All read 2026-09-26; the second tranche's\
    \ five models re-read the same boards on 2026-09-27.\n  5  inside the overall top three of its modality's board,\
    \ closed models included.\n  4  not top three, but the highest-placed open-weights entry on the board, or a\
    \ closed entry placed above every open-weights entry.\n  3  in the upper half of the board overall.\n  2  on\
    \ the board, in its lower half.\n  1  released, with no entry on its modality's board (portrait animation and\
    \ lip-sync, song generation with vocals, video-to-audio sound effects, video models the video boards do not\
    \ list, and a 3D model ranked only on the topology board).\nAnchors: gpt-image (image), minimax-hailuo (video),\
    \ suno (music) and trellis (3D) are the roots at 5; every other model records `relative_to` a peer in its own\
    \ modality. Distribution over 29 models: 6 at 5, 3 at 4, 7 at 3, 6 at 2, 7 at 1; the widest rungs are 3 and\
    \ 1, at 7 of 29 (24%) each, under the one-third review trigger. The second tranche (2026-09-27) added triposr\
    \ at 2 (20th of 24 on the 3D render board) and four models at 1: open-sora and stable-video-diffusion, which\
    \ neither video board lists, latentsync, a lip-sync model beside liveportrait, and mmaudio, a video-to-audio\
    \ model the music board does not rank. Two readings to know: Midjourney's current V8 models had no arena entry,\
    \ so it is read on V7; and a board position is a snapshot of a vote-driven ranking, which the next refresh re-reads\
    \ rather than trusts.\n\nCAPABILITY, SOFTWARE: the breadth of what it can drive, as capabilities it has or has\
    \ not.\n  5  runs image, video, audio and 3D generation models and composes them in one workflow graph.\n  4\
    \  runs three of those modalities.\n  3  runs two modalities (in practice image and video).\n  2  runs several\
    \ model families within one modality.\n  1  runs one model family.\nRoot comfyui (5). Distribution over 7: 1\
    \ at 5, 1 at 4, 1 at 3, 3 at 2, 1 at 1. diffsynth-studio, added in the second tranche, is the first product\
    \ at 4: it runs image, video and music models but no 3D model. The widest rung is 3 of 7 (43%), above the review\
    \ trigger. Wording as stated above; the reading is that the products genuinely share the capability rather than\
    \ that the rung is loose: invokeai, nunchaku and audiocraft each run several families of exactly one modality\
    \ locally, and the capability that separates them from stable-diffusion-cpp - running a second modality - is\
    \ checkable against their own supported-model lists (invokeai lists Wan only as a hosted API call, recorded\
    \ as not running it). Splitting the rung by family count would record a distinction the evidence does not order."
  deferred:
    wan:
      because: 'Closed frontier on an open line, held under the #720 ruling. The current release, Wan 3.0, is API-only
        and the ladder computes 1/closed from it; the prior release, Wan 2.2, remains distributed under Apache-2.0,
        and both are recorded (the prior one under components.context and in the sources). openness.score is left
        null rather than hand-set because how the map models availability separately from openness - the open line
        one generation behind the vendor''s closed frontier - awaits a maintainer ruling from the #720 review. This
        is a gap signal, not bookkeeping.'
    flux:
      because: 'The weights license abstains: the most restrictive distributed FLUX checkpoints carry Black Forest
        Labs'' own FLUX Non-Commercial License (v2.1, beside v2.0 and the FLUX.1 [dev] v1.1.1), which prohibits
        revenue-generating use and is sold separately for commercial use. That is the commercial_forbidden tier''s
        definition, but the tier names licenses literally and does not list these. Hand-scored 2/restricted, the
        rung the tier would produce. The license strings go to the maintainer license-rulings issue.'
    stable-diffusion:
      because: 'The weights license abstains: SD3, SD3.5 and SDXL-Turbo carry the Stability AI Community License
        (free, commercial use included, below USD 1M annual revenue; the license terminates above it), and SDXL
        carries CreativeML Open RAIL++-M. The first reads as the use_bounded tier and the second as permissive_non_osi
        under #117, but neither string is named. Hand-scored 3/open_weights on the more restrictive half. One SD3
        Medium repository''s metadata still says a non-commercial research license, which the ruling should settle.'
    stable-audio:
      because: 'The weights license abstains: every distributed Stable Audio checkpoint carries the Stability AI
        Community License (free below USD 1M annual revenue, enterprise license above), which reads as use_bounded
        but is not named in the tier. Hand-scored 3/open_weights, the same reading as stable-diffusion; one ruling
        on the string settles both.'
    qwen-image:
      because: 'Closed frontier on an open line, held under the #720 ruling. The current release, Qwen-Image 3.0,
        is API-only and the ladder computes 1/closed from it; the prior release, Qwen-Image-2.1, remains distributed
        under the Qwen Research License Agreement (non-commercial; the earlier releases are Apache-2.0), and both
        are recorded (the prior one under components.context and in the sources). openness.score is left null rather
        than hand-set because how the map models availability separately from openness - the open line one generation
        behind the vendor''s closed frontier - awaits a maintainer ruling from the #720 review. This is a gap signal,
        not bookkeeping.'
    ltx:
      because: 'The weights license abstains: LTX-2.5 carries the LTX-2.x Community License and LTX-2 and 2.3 the
        LTX-2 Community License, both free for commercial use below USD 10M annual revenue with a paid license above
        it, and LTX-Video 0.9.6+ the LTXV Open Weights License 0.X with the same threshold. That is the use_bounded
        tier''s definition, but none of the three strings is named. Hand-scored 3/open_weights.'
    hunyuan-video:
      because: 'The weights license abstains: the Tencent Hunyuan Community License permits commercial use with
        a 100M-MAU bound, which alone would read as use_bounded, but it also excludes the European Union, the United
        Kingdom and South Korea from the grant entirely. No tier addresses a territorial exclusion, and whether
        it lowers the tier is a shared-rubric ruling. Hand-scored 3/open_weights on the commercial test; the territorial
        question could move it to 2.'
    hunyuan-3d:
      because: 'Closed frontier on an open line, held under the #720 ruling. The current release, Hunyuan3D 3.0,
        is API-only and the ladder computes 1/closed from it; the prior release, Hunyuan3D 2.1, remains distributed
        under the Tencent Hunyuan 3D Community License, which also excludes the EU, UK and South Korea, and both
        are recorded (the prior one under components.context and in the sources). openness.score is left null rather
        than hand-set because how the map models availability separately from openness - the open line one generation
        behind the vendor''s closed frontier - awaits a maintainer ruling from the #720 review. This is a gap signal,
        not bookkeeping.'
    minimax-hailuo:
      because: 'The weights license abstains: the MiniMax H3 Community License excludes the European Union, the
        United Kingdom, the Republic of Korea and the United States, and requires written authorization above USD
        20M yearly revenue. It is a different string from the `minimax-community` license the permissive_non_osi
        tier already names, and the US exclusion makes it materially narrower. Hand-scored 3/open_weights on the
        commercial test; the territorial ruling for hunyuan-video decides this one more sharply.'
    liveportrait:
      because: 'The license is a compound the tier cannot resolve: the LivePortrait code and weights are MIT, but
        the weight tree bundles InsightFace face-detection models licensed ''for non-commercial research purposes
        only'', and the LICENSE says commercial users must replace them. Whether a bundled, replaceable third-party
        component governs a model''s tier is a shared-rubric question. Hand-scored 3/open_weights on the product''s
        own MIT weights; a ruling that the bundle governs would make it 2/restricted.'
    open-sora:
      because: The weights license is a compound the tier cannot resolve, the liveportrait case. Open-Sora 2.0's
        own weights and training code are Apache-2.0, but its checkpoint repository redistributes FLUX.1 [dev] under
        the FLUX.1 [dev] Non-Commercial License, which the text-to-video pipeline uses for its first frame, and
        a HunyuanVideo VAE under the Tencent Hunyuan Community License, which excludes the EU, UK and South Korea.
        Whether a bundled third-party component governs a model's tier is a shared-rubric question. Hand-scored
        3/open_weights on the product's own Apache-2.0 weights, the rung the ladder gives open weights with a described
        but unreleased corpus; a ruling that the bundle governs would make it 2/restricted.
    stable-video-diffusion:
      because: 'The weights license abstains: every SVD checkpoint''s LICENSE.md is now the Stability AI Community
        License (free below USD 1M annual revenue, an enterprise license above), the string stable-diffusion and
        stable-audio are deferred on, while the card metadata still names it stable-video-diffusion-community and
        stable-video-diffusion-1-1-community. The governing release, SVD-XT 1.1, also keeps a click-through that
        asks for non-commercial or research use only, a stale form the ruling should settle. Hand-scored 3/open_weights,
        the same reading as stable-audio; the older SVD non-commercial license in Stability-AI/generative-models
        no longer ships with any checkpoint.'
    latentsync:
      because: 'The weights license abstains: the LatentSync checkpoints declare openrail++ (CreativeML OpenRAIL++-M)
        in their card metadata and ship no license file. OpenRAIL++-M reads as permissive_non_osi under #117 (use-based
        restrictions only), the reading already recorded for SDXL under stable-diffusion, but the tier names BigCode-OpenRAIL-M
        and not this string. Hand-scored 3/open_weights, the rung the ladder would give that tier with a described
        but unreleased corpus.'
