name: media_generation
display_name: Image, video, 3D & music generation
description: Models that synthesize images, video, 3D assets, or music and sound effects from a prompt
  or condition, and the apps, engines and libraries built specifically to run, compose or serve them.
strapline: 'Open weights reach the frontier in some media and not in others. On the public arenas an open model
  sits among the three best for video (MiniMax H3) and for 3D (TRELLIS), while closed services hold the top places
  for images and music. The licenses are the sharp edge: nine of the twenty-four models ship under community, research
  or non-commercial terms the shared license scale does not yet name, three of them excluded from the EU entirely,
  and three open lines - Wan, Qwen-Image and Hunyuan3D - now keep their strongest release hosted-only. The software
  that runs these models is open source throughout.'
weights:
  adopt: 0.4
  cap: 0.6
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
  note: "Two ladders for openness, per product type, following document_conversion and safeguards: generation models\
    \ climb the shared model ladder and the apps, UIs, engines and libraries that run them climb the shared software\
    \ ladder. The closed comparators are typed `model` and settle at 1/closed on `weights: closed`. Many weights\
    \ here ship under custom community licenses. None is added to a shared tier from this category: each goes to\
    \ the one maintainer license-rulings issue, and the product carrying it is in `deferred:` below with a hand-assigned\
    \ score until that ruling lands.\n\nGOVERNING RELEASE (PROPOSAL, 2026-09-26 decision record, flagged for the\
    \ maintainer): on a line whose newest release is closed, the newest DISTRIBUTED release governs openness and\
    \ capability, and the closed flagship is named in the product's comments rather than scored. It is applied,\
    \ and recorded in `openness.governing_release`, on wan (Wan 2.2; Wan 2.5-3.0 are API-only), qwen-image (Qwen-Image-2.1;\
    \ 2.0 and 3.0 are API-only) and hunyuan-3d (Hunyuan3D 2.1; 2.5 and 3.x are API-only), and in the same form on\
    \ flux, stable-diffusion and stable-audio, whose strongest tiers are API-only. Under identity.md's current-release\
    \ reading, wan, qwen-image and hunyuan-3d would each score 1/closed on openness and their capability would read\
    \ the closed flagship.\n\nCAPABILITY, MODELS: ONE READING, WITHIN A MODALITY. No single quantity orders image,\
    \ video, 3D and audio together: the public arenas are separate per modality and an Elo in one is not commensurable\
    \ with an Elo in another. Each model is read on its modality's board, by its best-placed SKU whose weights are\
    \ distributed (for a closed product, its best-placed SKU): image on the Artificial Analysis Text to Image Arena\
    \ overall board (163 entries); video on the Artificial Analysis Text to Video Arena without-audio board (86\
    \ entries, the wider of its two boards); music on AA-Music-Instrumental v1.1 (19 entries); 3D on the 3D Arena\
    \ image-to-3D render board (24 entries), the only live 3D arena, vote-driven and undated, which the seed feared\
    \ would be too thin and which instead lists every 3D product promoted here but one. All read 2026-09-26.\n \
    \ 5  inside the overall top three of its modality's board, closed models included.\n  4  not top three, but\
    \ the highest-placed open-weights entry on the board, or a closed entry placed above every open-weights entry.\n\
    \  3  in the upper half of the board overall.\n  2  on the board, in its lower half.\n  1  released, with no\
    \ entry on its modality's board (portrait animation, song generation with vocals, and a 3D model ranked only\
    \ on the topology board).\nAnchors: gpt-image (image), minimax-hailuo (video), suno (music) and trellis (3D)\
    \ are the roots at 5; every other model records `relative_to` a peer in its own modality. Distribution over\
    \ 24 models: 5 at 5, 3 at 4, 6 at 3, 7 at 2, 3 at 1; the widest rung is 7 of 24 (29%), under the one-third review\
    \ trigger. Two readings to know: Midjourney's current V8 models had no arena entry, so it is read on V7; and\
    \ a board position is a snapshot of a vote-driven ranking, which the next refresh re-reads rather than trusts.\n\
    \nCAPABILITY, SOFTWARE: the breadth of what it can drive, as capabilities it has or has not.\n  5  runs image,\
    \ video, audio and 3D generation models and composes them in one workflow graph.\n  4  runs three of those modalities.\n\
    \  3  runs two modalities (in practice image and video).\n  2  runs several model families within one modality.\n\
    \  1  runs one model family.\nRoot comfyui (5). Distribution over 6: 1 at 5, 1 at 3, 3 at 2, 1 at 1; nothing\
    \ at 4. The widest rung is 3 of 6 (50%), above the review trigger. Wording as stated above; the reading is that\
    \ the products genuinely share the capability rather than that the rung is loose: invokeai, nunchaku and audiocraft\
    \ each run several families of exactly one modality locally, and the capability that separates them from stable-diffusion-cpp\
    \ - running a second modality - is checkable against their own supported-model lists (invokeai's video support\
    \ is a hosted API call, recorded as not running it). Splitting the rung by family count would record a distinction\
    \ the evidence does not order."
  deferred:
    flux:
      because: 'The weights license abstains: the most restrictive distributed FLUX checkpoints carry Black Forest
        Labs'' own FLUX Non-Commercial License (v2.1, beside v2.0 and the FLUX.1 [dev] v1.1.1), which prohibits
        revenue-generating use and is sold separately for commercial use. That is the commercial_forbidden tier''s
        definition, but the tier names licenses literally and does not list these. Hand-scored 2/restricted, the
        rung the tier would produce. The license strings go to the maintainer license-rulings issue.'
    stable-diffusion:
      because: 'The weights license abstains: SD3, SD3.5 and SDXL-Turbo carry the Stability AI Community License
        (free, commercial use included, below USD 1M annual revenue; the license terminates above it), and SDXL
        carries CreativeML Open RAIL++-M. The first reads as the use_bounded tier and the second as permissive_non_osi
        under #117, but neither string is named. Hand-scored 3/open_weights on the more restrictive half. One SD3
        Medium repository''s metadata still says a non-commercial research license, which the ruling should settle.'
    stable-audio:
      because: 'The weights license abstains: every distributed Stable Audio checkpoint carries the Stability AI
        Community License (free below USD 1M annual revenue, enterprise license above), which reads as use_bounded
        but is not named in the tier. Hand-scored 3/open_weights, the same reading as stable-diffusion; one ruling
        on the string settles both.'
    qwen-image:
      because: 'The weights license abstains: Qwen-Image-2.1, the newest distributed release, carries the Qwen Research
        License Agreement (''FOR NON-COMMERCIAL PURPOSES ONLY''), while every earlier Qwen-Image release is Apache-2.0.
        The research license is commercial_forbidden by definition but not named in the tier. Hand-scored 2/restricted.
        It also rests on the governing-release proposal in the note: under a current-release reading the product
        would be 1/closed on Qwen-Image 3.0.'
    ltx:
      because: 'The weights license abstains: LTX-2.5 carries the LTX-2.x Community License and LTX-2 and 2.3 the
        LTX-2 Community License, both free for commercial use below USD 10M annual revenue with a paid license above
        it, and LTX-Video 0.9.6+ the LTXV Open Weights License 0.X with the same threshold. That is the use_bounded
        tier''s definition, but none of the three strings is named. Hand-scored 3/open_weights.'
    hunyuan-video:
      because: 'The weights license abstains: the Tencent Hunyuan Community License permits commercial use with
        a 100M-MAU bound, which alone would read as use_bounded, but it also excludes the European Union, the United
        Kingdom and South Korea from the grant entirely. No tier addresses a territorial exclusion, and whether
        it lowers the tier is a shared-rubric ruling. Hand-scored 3/open_weights on the commercial test; the territorial
        question could move it to 2.'
    hunyuan-3d:
      because: 'The weights license abstains for the same reason as hunyuan-video: the Tencent Hunyuan 3D 2.0/2.1
        Community License has a 1M-MAU bound and excludes the European Union, the United Kingdom and South Korea.
        Hand-scored 3/open_weights pending the territorial ruling. It also rests on the governing-release proposal:
        under a current-release reading it would be 1/closed on the API-only Hunyuan3D 3.x.'
    minimax-hailuo:
      because: 'The weights license abstains: the MiniMax H3 Community License excludes the European Union, the
        United Kingdom, the Republic of Korea and the United States, and requires written authorization above USD
        20M yearly revenue. It is a different string from the `minimax-community` license the permissive_non_osi
        tier already names, and the US exclusion makes it materially narrower. Hand-scored 3/open_weights on the
        commercial test; the territorial ruling for hunyuan-video decides this one more sharply.'
    liveportrait:
      because: 'The license is a compound the tier cannot resolve: the LivePortrait code and weights are MIT, but
        the weight tree bundles InsightFace face-detection models licensed ''for non-commercial research purposes
        only'', and the LICENSE says commercial users must replace them. Whether a bundled, replaceable third-party
        component governs a model''s tier is a shared-rubric question. Hand-scored 3/open_weights on the product''s
        own MIT weights; a ruling that the bundle governs would make it 2/restricted.'
