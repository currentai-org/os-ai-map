comments: 'Created preliminary 2026-09-26 under #603. Seed roster in sources/registry/media_generation.yaml; the
  candidate sweep, parked list and open questions are in docs/sweeps/2026-09-26-media_generation.md. The rulings
  below are proposals from the 2026-09-26 decision record, for the maintainer to confirm at review.


  LITMUS. Is the product''s primary output a synthesized image, video, 3D asset or non-speech audio asset, or is
  the product purpose-built to produce one? The test is the product''s own job, not what it can be used for.


  ONE CATEGORY, MODALITY RECORDED PER PRODUCT. Image, video, 3D and music each have supply enough for a category
  of their own, and the split was declined because it would scatter the shared tooling (ComfyUI runs all four).
  Models and the software that runs them are separate products here, on separate ladders.


  EXCLUSIONS, BY NEIGHBOR. Speech synthesis, recognition and voice conversion go to speech_audio; music and sound
  effects stay here, and ElevenLabs'' music surface is parked as closed long tail because its speech product is
  speech_audio''s comparator. Understanding VLMs, and unified understanding-and-generation models (Janus, BAGEL,
  Emu, SenseNova-U), go to multimodal_models; a generation- or editing-first model (OmniGen, Ming-Image) stays here.
  Action-conditioned environment models (Cosmos, HunyuanWorld / HY-World, action-conditioned game world models)
  go to world_models even where their SKUs rank on the image and video arenas. General LLM runtimes stay in inference_code:
  vllm-omni is an artifact of `vllm` and SGLang''s diffusion path sits under `sglang`. The core library `diffusers`
  stays in ml_frameworks. LoRA and checkpoint trainers go to finetuning_code: OneTrainer and ai-toolkit are there
  already, and kohya sd-scripts, musubi-tuner, SimpleTuner and diffusion-pipe are proposed there as a follow-up,
  not seeded here. Chat UIs and API gateways stay in ui_api, which holds no media app. Agentic video-production
  pipelines built over third-party models (OpenMontage, Pixelle-Video, ViMax) go to orchestration_agents. The Stable
  Diffusion safety checker stays in safeguards. SAM 3D Objects is here as image-to-3D generation; the Segment Anything
  segmentation family is classic_ml_cv''s.


  CONTESTED RULINGS. (1) Media apps and UIs (ComfyUI, AUTOMATIC1111, Forge, InvokeAI, Fooocus, SD.Next, SwarmUI)
  live here, not in ui_api. (2) Engines purpose-built for diffusion or video generation (stable-diffusion.cpp, xDiT,
  LightX2V, FastVideo, DiffSynth-Studio, Nunchaku) live here, not in inference_code or compilers; `nunchaku` moved
  in from the compilers registry at seed. (3) Adapters and derivative checkpoints are not products: Civitai LoRAs
  and merges, ControlNet and its kin, ComfyUI custom-node packs, and Chroma, the hardest case, a FLUX.1-schnell
  derivative retrained at a new size. (4) Portrait animation and lip-sync (LivePortrait, LatentSync) are in, because
  the output is synthesized video; restoration and upscaling (SeedVR2) are out. (5) Vendor modality lines get their
  own products beside the vendor''s LLM (qwen-image, glm-image, ernie-image, the hunyuan-* media lines, minimax-hailuo,
  minimax-music), as qwen3-embedding sits beside qwen. LongCat is two products, image and video, split by modality
  as Hunyuan is. Stability AI is five: stable-diffusion, stable-video-diffusion, stable-audio, stable-fast-3d and
  spar3d, since SF3D and SPAR3D are different models rather than sizes; stable-audio-tools is the engine and a sixth,
  software product. (6) TripoSR is attributed to VAST (vast-ai), whose research group wrote it, although its weights
  sit on Stability AI''s Hub account. (7) ByteDance''s non-Seed research teams (FoundationVision''s Infinity, LatentSync)
  use the parent-company slug bytedance-seed-volcano-engine rather than a second ByteDance slug. (8) Closed comparators
  under ADR-005: Midjourney stays as the best-known closed image service though it sat outside the fetched arena
  top 25; Runway gets a second look before promotion. Sora is not seeded: OpenAI shut its API on 2026-09-24.


  THE CLOSED FLAGSHIP ON AN OPEN LINE - A PROPOSAL, FLAGGED FOR THE MAINTAINER. Three vendors that anchored open
  generation now ship their newest release closed while older generations stay downloadable: Wan 2.5 to 3.0 are
  API-only, Hunyuan3D 2.5 to 3.1 are API-only, and Qwen-Image 3.0 is closed while Qwen-Image-2.1 moved to a non-commercial
  research licence. Proposed rule: the newest DISTRIBUTED release governs a product''s openness, and the closed
  flagship is written into that product''s comments rather than scored. identity.md says the current release governs
  openness and excludes API-only tiers only within a release''s SKUs; this carries that exclusion up to the choice
  of governing release. It decides whether `wan` scores open, so it wants an explicit ruling before promotion rather
  than a quiet default.


  PROMOTED 2026-09-27 (first tranche of 30, from live fetches on 2026-09-26/27; research trail on the branch claude/research-media_generation
  and the promotion PR). Chosen for representativeness: the adoption leaders of each modality, the closed frontier
  comparators ADR-005 asks for, and every sub-type - image (7), video including portrait animation (8), 3D (4),
  music (5) and software (6: apps, engines, a library). The other 62 seeded rows stay in sources/registry/media_generation.yaml
  for add-product.


  RUNWAY, DECIDED UNDER ADR-005: the `runway-gen` row is removed rather than parked. Runway Gen-4.5 places 19th
  on the Artificial Analysis without-audio video board, below Seedance 2.0 and level with Veo 3.1, and publishes
  no countable adoption channel, so it sits below ADR-005''s line (capability under 4, adoption unmeasurable). Video''s
  closed frontier is already represented by Veo and Seedance, and Runway''s own API resells Veo, Seedance, Wan and
  Hailuo, which makes it more a platform than a distinct model surface. Kling stays a registry row on the same reasoning
  and can be promoted if a gap statement needs it.


  ADDED FROM THE REGISTRY FOR THE MATRIX: `lyria` was promoted beside `suno` because music needed a peer between
  the closed frontier and the open models for the capability comparisons to be expressible; the open models alone
  sit three places below Suno.


  NOT PRODUCTS HERE, CONFIRMED AT PROMOTION: Gemini Omni Flash (Google presents it as a separate Gemini model family
  and its default for video, not part of Veo) and Magenta RealTime (Google''s open Lyria-family model, a separate
  open-weight release) are not folded into `veo` and `lyria`; both are follow-up candidates. Hosted flagships on
  open lines (Wan 2.5-3.0, Qwen-Image 2.0/3.0, Hunyuan3D 2.5/3.x, FLUX.2 [pro]/[flex]/[max], Stable Audio 3 Large,
  Hailuo 02/2.3) are named in their product''s comments and not scored, under the governing-release proposal in
  the recipe note.'
