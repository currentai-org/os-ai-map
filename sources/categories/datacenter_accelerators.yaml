name: datacenter_accelerators
display_name: Datacenter AI accelerators
description: "Chips, cards and rack systems for training and serving AI models in the datacenter, sold or rented as silicon."
strapline: >-
  Closed silicon all the way down. No datacenter accelerator publishes its design, so the most any vendor
  offers is a public datasheet and a part you can buy or rent, and the frontier chips from NVIDIA, AMD,
  Google and Cerebras are no more open than the rest. The open part of this layer is software: Tenstorrent's
  Apache-2.0 stack is the nearest thing to an open accelerator, and the open designs that exist (NVDLA,
  Gemmini, Vortex) stop short of the datacenter.
weights:
  adopt: 0.2
  cap: 0.8
scoring_recipe:
  version: 1
  note: >-
    Inherits the shared hardware ladder unchanged. Every row is scored as `form_factor:
    chipset`, because identity here is the silicon generation: the PCIe card, OAM module,
    server and rack a vendor builds on one generation are that generation's SKUs rather than
    separate artifacts, and none of them publishes a board design, so the board rungs would
    only ever answer `schematics: none`. The chipset rung asks exactly the two questions this
    set can answer - is there a public datasheet, and can an outside party obtain the part -
    and that is where the category's openness story lives. No datacenter part in the seed
    publishes design files, and every one of them is closed silicon, so the open stacks some
    vendors ship (Tenstorrent's Apache-2.0 tt-metal, NVIDIA's MIT/GPL kernel modules, AMD's
    ROCm) are recorded as `toolchain` and read by no rung, as they are for the edge chipsets.

    Expect deferrals at promotion rather than forced scores. A cloud-only generation (AWS
    Trainium and Inferentia, most of Google's TPU volume) can be rented but not bought. The
    #753 ruling settled it in sources/rubrics/hardware.yaml: rentable silicon counts as
    buyable, recorded as `retail: rentable`, when anyone can provision an instance or slice of
    the silicon itself at a published price. A hosted API in front of the silicon is not that,
    and belongs to inference_code. Several Chinese generations have no
    vendor datasheet at all (their specs rest on press coverage), which answers `brief` or
    abstains and defers the same way.

    Weighted 0.2 adoption to 0.8 capability because adoption abstains for every row: there is
    no download channel for silicon, the hardware ladder declares no numeric bands, and the
    only citable proxies (cloud availability, MLPerf submission) cover under half the seed
    and are not comparable. Capability is peak dense low-precision throughput per package
    (FP8 where published, the precision recorded beside the number), memory as the
    tiebreaker; expect abstentions where a vendor publishes no figure.

    How `datasheets` is read here (first tranche, 2026-09-27). `public` means the vendor
    publishes, without registration, a technical document for the part beyond its marketing
    pages: a datasheet with a specification table, an architecture white paper, an ISA or
    hardware reference, or developer documentation of the hardware. `brief` means product
    pages, brochures, a product brief or announcements only. The test is what the documents
    contain, not what they are titled: SambaNova's brochure gives no chip power or interfaces,
    IBM publishes no throughput figure for Spyre, and Qualcomm's only fetchable
    document is a two-page product brief. `restricted` is recorded where the vendor itself says
    the part goes only to a select group of customers (d-Matrix Corsair); a rent-only part
    (Ironwood, Trainium3) records `retail: rentable`, which reads as buyable.

    Capability, per unit sold - one package, or one card where the card is the smallest thing
    sold (d-Matrix Corsair and Qualcomm Cloud AI 100 Ultra) - read on dense throughput at 8-bit
    or lower precision, or half a vendor's sparse figure, or the lowest precision the vendor
    publishes when it names no 8-bit figure:
    5 = at least 4 PFLOPS, the frontier (anchor `nvidia-blackwell`: 5 PFLOPS dense FP8 and 279 GB
    HBM3E per Blackwell Ultra GPU; `amd-instinct-mi350`, `google-tpu-ironwood` and
    `cerebras-wse-3` at it). 4 = 1.5 to 4 PFLOPS (`aws-trainium3`, `intel-gaudi-3` one below the
    anchor; `d-matrix-corsair` at `intel-gaudi-3`). 3 = 0.4 to 1.5 PFLOPS (`tenstorrent-blackhole`,
    `furiosa-rngd`, `sambanova-sn40l`, `qualcomm-cloud-ai-100`, `huawei-ascend-950` and
    `moore-threads-mtt-s5000`, each one below `intel-gaudi-3`, the nearer evidenced peer). The two
    second-tranche rows sit near the top of the rung: the Ascend 950 at 804 TFLOPS FP8 in the
    Atlas 350 card as sold, and 1,034 TFLOPS for the 950DT's top version in Huawei's white paper,
    which Huawei announced for the fourth quarter of 2026 and which would not change the band; the
    S5000 at up to 1,000 TFLOPS dense, a figure Moore Threads' annual report gives without a
    precision, read as its 8-bit figure because FP8 is the lowest precision the report names, press
    coverage of the same disclosure says FP8, and the product page puts the card at about
    three-quarters of a 989 TFLOPS FP16 baseline; a 16-bit reading would imply about 2 PFLOPS at 8
    bits, above Gaudi 3's FP8. The 989 TFLOPS on the S5000 product page is a footnoted comparator
    baseline, dense FP16 at 3.35 TB/s, and not the S5000's own figure. 2 = below 0.4 PFLOPS; empty in this tranche (Inferentia2's 190 TFLOPS
    cFP8 would land here). 1 is unused. `ibm-spyre` abstains: IBM publishes its
    128 GB of LPDDR5 but no throughput figure. Memory decides nothing on its own; notes name it where it cuts against the
    throughput, as for Cerebras' 44 GB of on-wafer SRAM and Corsair's 2 GB of performance memory.

    Distribution review (docs/reference/capability.md, "Writing the rungs"): of 13 banded
    products (second tranche, 2026-09-27), 5 holds 4 (31%), 4 holds 3 (23%) and 3 holds 6 (46%),
    so only 3 is above a third. The wording is a number, not an outcome, so it cannot be satisfied
    incidentally; this is the clustering case. The four 5s are the three frontier GPU/TPU
    generations and a wafer, all at or above 4.6 PFLOPS; the six 3s run from 0.5 to 1 P(FL)OPS
    and are the four inference cards whose vendors publish no higher figure plus the two Chinese
    training-and-inference parts, which reach about 1 PFLOPS at 8 bits, well short of Gaudi 3's
    1.7. The 4 rung between them, which Trainium3, Gaudi 3 and Corsair sit on, keeps the two
    clusters apart by a factor of about 1.6 to 1.8 in throughput on each side.
  extends: hardware
  deferred:
    d-matrix-corsair:
      because: 'd-Matrix says Corsair "is being made available to select, qualified customers",
        which is `retail: restricted` and so `availability: gated`, and the chipset rung does not
        match. Its documentation is public. The recorded 3/documented is the lowest pair this
        ladder can emit; the ladder has deliberately no `restricted` rung (issue #133).
        `schematics`, `toolchain` and `blobs` are unrecorded too, but no chipset rung reads
        them, so answering them would not change the outcome.'
    sambanova-sn40l:
      because: 'SambaNova publishes a brochure and a product-page table but no datasheet giving
        the chip power or interfaces, so `datasheets` reads `brief`, and no retail listing was
        found, so `retail` is unrecorded. The chipset rung needs both `public` and `buyable`. The
        recorded 3/documented is the lowest pair this ladder can emit.'
    qualcomm-cloud-ai-100:
      because: 'The only Qualcomm document that could be fetched is a two-page product brief
        (`datasheets: brief`), and the HPE store listing for the card returned HTTP 403 on all six
        attempts by build.fetch_source on 2026-09-27, so `retail` is unrecorded rather than guessed. The chipset rung needs both. The
        recorded 3/documented is the lowest pair this ladder can emit.'
    ibm-spyre:
      because: 'IBM publishes announcements, a research blog and a product page giving the
        card''s 128 GB of LPDDR5 and 75 W power, but no throughput figure for Spyre, so `datasheets` reads `brief` even though the card is orderable
        as an option for IBM z17, LinuxONE 5 and Power11 systems. The chipset rung needs
        `public`. The recorded 3/documented is the lowest pair this ladder can emit.
        `schematics`, `toolchain` and `blobs` are unrecorded too, but no chipset rung reads
        them, so answering them would not change the outcome.'
    moore-threads-mtt-s5000:
      because: 'Moore Threads describes the S5000 on a product page and an architecture page, and
        gives the card''s own throughput, memory and interconnect only in its 2025 annual report,
        with no precision named; no document gives the card''s power or interfaces, the product
        page''s only TFLOPS figures are comparator baselines, and its documentation center covers
        the S4000 but not the S5000. So `datasheets` reads `brief`, and the chipset rung needs
        `public`. The card is sold as modules, servers and clusters (`retail: open_market`). The
        recorded 3/documented is the lowest pair this ladder can emit. `schematics`, `toolchain`
        and `blobs` are unrecorded too, but no chipset rung reads them, so answering them would
        not change the outcome.'
products:
- nvidia-blackwell
- amd-instinct-mi350
- google-tpu-ironwood
- cerebras-wse-3
- aws-trainium3
- intel-gaudi-3
- d-matrix-corsair
- tenstorrent-blackhole
- furiosa-rngd
- sambanova-sn40l
- qualcomm-cloud-ai-100
- huawei-ascend-950
- moore-threads-mtt-s5000
- ibm-spyre
comments: >-
  Proposed in issue #599, seeded 2026-09-26 as a sibling of edge_hardware rather than a
  rename of it: the two sets have different capability quantities (TOPS per watt and runnable
  model size at the edge, per-package FP8 and memory here) and different openness stories
  (edge boards can publish design files; no datacenter part does). Litmus: is it a chip,
  board or system you rack or rent as silicon, distinct from the API that fronts it? Identity
  is the generation (google-tpu-ironwood, aws-trainium3), seeded at the generation each
  vendor line had generally available or shipping; next and prior generations are SKUs of
  the line and wait to be swapped in or out by the same rule. A mid-cycle refresh sharing an
  architecture collapses into one row: Blackwell and Blackwell Ultra, WSE-3 and WSE-3 Turbo,
  ATOM and ATOM-Max. A system sold only as a system (Positron Atlas, whose Archer
  accelerators are not sold alone) is pitched at the system.

  Exclusions, by neighbor. Inference APIs that front this silicon stay in inference_code
  (groq-inference, cerebras-inference, sambanova-cloud, google-cloud-tpu-inference), as do
  vendor SDKs (aws-neuron); compilers stay in compilers (xla, composable-kernel) and triton in
  ml_frameworks; anything served through a hosted endpoint rather than rented as an instance
  of the silicon belongs to inference_code or deployment. Edge and embedded parts (M.2 and
  mPCIe cards, SBCs, low-watt NPUs) stay in edge_hardware, and Axelera Europa, a 45 W PCIe
  card sold "robot to rack", goes there with axelera-metis-aipu rather than here. Captive
  silicon no outsider can rack or rent (Meta MTIA, Microsoft Maia 200, OpenAI's Broadcom
  part) fails the litmus and is parked until one is rentable as an instance; IBM Spyre is
  admitted because it can be bought, even though only inside an IBM system. HPC-first
  silicon (NextSilicon Maverick-2), photonic interconnect (Lightmatter Passage) and open
  accelerator RTL (NVDLA, Gemmini, Vortex) are out.

  ADR-005: merchant parts with a public datasheet are likely to score 3/documented and sit
  outside the closed-product population the principle governs; the cloud-only rows are the
  likely closed ones, and of those Trainium3 and Ironwood are frontier comparators.
  Inferentia2 is the trim candidate at promotion if the principle is applied strictly. All
  22 GA generations are kept at seed. Adoption abstains category-wide; see the recipe note.

  The finding worth keeping: the only genuinely open accelerator designs are RTL projects
  (NVDLA, Gemmini, Vortex), and none of them reaches datacenter silicon. The closest thing to
  an open datacenter accelerator today is Tenstorrent's open software stack on closed
  silicon. Sweep record: docs/sweeps/2026-09-26-datacenter-accelerators.md.

  First tranche promoted 2026-09-27: twelve rows, chosen to cover merchant GPUs (NVIDIA, AMD,
  Intel), the wafer (Cerebras), the open-stack card (Tenstorrent), the inference cards
  (FuriosaAI, SambaNova, Qualcomm, d-Matrix), the rent-only frontier comparators ADR-005 needs
  (Ironwood, Trainium3) and the system-bundled part (IBM Spyre). Six score on the chipset rung
  and six are deferred; see scoring_recipe.deferred. Ten rows stay in the registry.
  `aws-inferentia2` is the ADR-005 trim: a prior-generation closed inference part beside
  Trainium3, left as a signal-only row rather than promoted. `rebellions-atom` waits because
  Rebellions now ships RebelRack on its next generation, Rebel100, so the row is due a swap
  rather than a promotion. `positron-atlas`, `huawei-ascend-950`, `moore-threads-mtt-s5000` and
  the five rows resting on search excerpts or name-only vendor pages (`cambricon-mlu590`, `kunlunxin-p800`,
  `t-head-zhenwu-m890`, `metax-c500`, `biren-br100`) wait for a vendor specification that could
  be fetched. No row was rejected at promotion.

  Second tranche promoted 2026-09-27: `huawei-ascend-950` and `moore-threads-mtt-s5000`, the
  Chinese domestic sub-segment the head lacked. The Ascend 950's blocker cleared because Huawei
  now publishes an Ascend 950 NPU architecture white paper with a per-version specification table
  and an Atlas 350 specification page, and sells the card; it scores on the chipset rung. The
  S5000's own figures are in Moore Threads' annual report rather than any datasheet, so it is
  deferred on `datasheets: brief` like SambaNova. Moore Threads' product menu and annual report
  still name the S5000 its flagship datacenter card; a successor swaps in when it ships. Eight
  rows stay in the registry.
