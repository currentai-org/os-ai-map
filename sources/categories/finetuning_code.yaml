name: finetuning_code
display_name: Fine-tuning code
description: "Libraries and platforms for fine-tuning models."
strapline: Open libraries, closed platforms. The training code is open; the managed fine-tuning services
  are not.
weights:
  adopt: 0.5
  cap: 0.5
products:
- trl
- peft
- axolotl
- llama-factory
- unsloth
- torchtune
- openrlhf
- verl
- swift
- litgpt
- nemo-rl
- openai-fine-tuning-api
- amazon-bedrock-custom-models-fine-tuning
- vertex-ai-tuning
- mosaic-ai-model-training
- azure-openai-fine-tuning
- together-fine-tuning
- fireworks-fine-tuning
- mistral-fine-tuning-api
- predibase
- openpipe
- lamini
- anyscale-fine-tuning
- snowflake-cortex-fine-tuning
- atropos
- tinker
- megatron-lm
- miles
- areal
- xtuner
- ai-toolkit
- onetrainer
scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, verified against the hand-authored scores
    verified_on: '2026-07-30'
    checker: build/check_rubric.py
  # No deferrals. unsloth was the last one, closed on 2026-08-12 by taking the recorded
  # `core-gated: gated` at its word and moving the score to 4/open_core.
comments: >-
  mosaic-ai-model-training stays on the roster although Databricks has ended the service: its
  Foundation Model Fine-tuning page says the feature "has reached end of life (EoL) and is no
  longer supported" (read 2026-09-30). It is kept as a record of what the category offered, a
  managed full fine-tuning service that returned the trained weights to the customer. Databricks
  points users to AI Runtime, a general serverless GPU environment rather than a managed
  fine-tuning service, so there is no like-for-like successor to alias the slug onto. The
  product record declares end_of_life as 2026-09-11, the day the page was last updated. Databricks
  publishes no date the service stopped, so that date is an upper bound rather than the shutdown
  day; a maintainer accepted the past date for this record on #807.
