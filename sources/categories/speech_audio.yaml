name: speech_audio
display_name: Speech & audio
description: Models and speech-first engines whose headline capability is speech itself - recognition
  (ASR), synthesis (TTS), speech-to-speech conversation, and the diarization and voice-activity
  components around them.
strapline: >-
  The most accurate English speech recognizers are all proprietary: the nine services at the top of
  the Open ASR Leaderboard, with the best open model, Qwen3-ASR, tenth. In synthesis the only
  open-weights voice in the Artificial Analysis arena's top ten forbids commercial use, and the most
  downloaded open voice, Kokoro, ranks 48th of 91. The engines that run speech on your own hardware,
  from whisper.cpp to sherpa-onnx and Piper, are open source.
weights:
  adopt: 0.4
  cap: 0.6
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
  derived_from:
    method: per-type extends over the shared model and software ladders; evidence recorded under the
      keys each ladder reads at promotion, and every recorded score reproduces
    checker: build/check_rubric.py
  note: |-
    Per-type extends, as ruled on #602 on 2026-09-25: models (open weights and the closed API
    comparators) climb the shared model ladder, and the speech-first engines and pipeline
    components climb the shared software ladder. No pretrained, dataset or hardware ladder is needed.
    The first tranche (22 products, promoted 2026-09-27) needed no deferral: every license it carries
    is already named by a shared tier, CC-BY-4.0 and the NVIDIA Open Model License as
    permissive_non_osi and CC-BY-NC-4.0 as commercial_forbidden on the model ladder, GPL-3.0 as osi on
    the software ladder. The custom texts the sweep met are deferred at each product's own promotion
    rather than scored by extending a shared tier here. The second tranche (17 products, 2026-09-27)
    defers two: xtts (Coqui Public Model License 1.0.0) and higgs-audio (Boson Higgs TTS 3 Research and
    Non-Commercial License), both in `deferred:` below with the hand score the tier's definition would
    give. Two licenses the sweep expected to defer did not need it once read: moonshine's current
    streaming release is MIT and only its superseded legacy models carry the Moonshine AI Community
    License, and omnivoice's card body names CC-BY-NC, which commercial_forbidden lists. The Fish Audio
    Research, bilibili Model Use and BreezeBlue licenses belong to rows still in the registry.

    Openness is read on the product's current release, the one its score names in governing_release.
    The most restrictive license applies only across the distributed SKUs within that release, meaning
    the sizes and quantizations of one model. A superseded release that is still downloadable, or a
    research checkpoint published apart from the release, does not lower the score; it is recorded under
    components.context as history. Two products are read this way. canary is scored on Canary 1B v2
    (CC-BY-4.0), and the 2024 canary-1b, still published under CC-BY-NC-4.0, is recorded as superseded.
    moshi is scored on its v0.1 release (CC-BY-4.0), and the gated CC-BY-NC-4.0 checkpoint
    kyutai/moshika-rl-seamless, which Kyutai published with a separate interactivity-alignment paper, is
    recorded as a research artifact. Both sit at 3. The second tranche reads six more products this way.
    moonshine is scored on Moonshine Streaming (MIT); the 2025 non-English non-streaming models under the
    Moonshine AI Community License are a superseded release (Korean and Ukrainian have no streaming
    replacement yet; that license caps free use at USD 1M revenue, use_bounded in reading, which would
    give the same 3). zonos is scored on ZONOS2 (2026-06,
    downloadable, Apache-2.0) with Zonos v0.1 as history. wav2vec is scored on the wav2vec 2.0 and HuBERT
    releases, and the 2021 CC-BY-NC VoxPopuli checkpoints, published with a separate dataset paper, are a
    research release. higgs-audio is scored on Higgs Audio v3, with the v2 community-licensed model as
    superseded. granite-speech is scored on Granite Speech 5.0: its CC-BY-NC-SA-4.0 turboctc-nc model is
    the same 470M architecture trained on more data, and its card sends commercial users to the Apache-2.0
    turboctc model, so it is a substitutable alternative (the Hermes precedent in identity.md), not a SKU
    a user cannot avoid; the Apache-2.0 model governs. seamless-m4t records SeamlessExpressive, released
    beside v2 under the more restrictive Seamless Licensing Agreement, as a separate model; v2's own
    CC-BY-NC-4.0 already sets 2. API-only tiers are excluded within a release: MOSS-Transcribe-Diarize Pro,
    served only in MOSI's playground, does not lower moss-transcribe-diarize. None of the promoted products
    is a closed frontier on an open line.

    CAPABILITY. No single quantity orders recognition, synthesis, conversation and engines, so the
    rungs are read per type against one five-step scale, and every band except the anchor names a
    same-category peer with relative_to/relation.

    Models are read on the current public board for their task, by position: the Hugging Face Open
    ASR Leaderboard (English short-form, average WER, the 25-09-2026 version of 71 rows) for
    recognizers; the Artificial Analysis speech-to-text table (WER, 58 rows) for a recognizer absent
    from that board; the Artificial Analysis TTS leaderboard (Elo, 91 rows) for synthesizers. A family
    is read by its best-placed declared checkpoint. 5: in the top ten of its board, or holds a real-time
    full-duplex spoken conversation. 4: ranks 11-30. 3: ranks 31-60; or a synthesizer absent from the
    arena whose card reports zero-shot cloning results on a shared public test set (Seed-TTS-eval), since
    absence from a board is not evidence about quality. 2: ranks 61 or lower; or a recognizer or speech
    translator absent from both ASR boards (added 2026-09-27 for the second tranche). The Open ASR
    Leaderboard runs submitted open checkpoints on public test sets, so a recognizer's absence from it
    says more than a synthesizer's absence from a listening arena whose entries the arena picks, and
    card-reported results on other sets earn no more than this rung; moonshine's own average on the
    board's sets would place it 62nd, which agrees. 1: no board presence and a single narrow task, for a
    model no clause above places. Positions on boards of different lengths are not the same fraction, which is why
    the band edges are ranks rather than percentiles and why each product's basis_detail names its board.

    Engines are read on what they run and train. 5: trains as well as serves speech models across
    recognition and synthesis, including checkpoints at rung 4 or above. 4: serves more than one speech
    task (among ASR, TTS, diarization, VAD) with streaming, on servers, phones, embedded boards and the
    web; or trains as well as serves across recognition and synthesis with none of its own checkpoints
    at rung 4 or above (added 2026-09-27 for speechbrain, which rung 5 would otherwise take). 3: runs one speech task end to end (a recognizer, a synthesizer or diarization). 2: a single
    pipeline component that produces no transcript or speech of its own (voice activity detection).
    1: unused.

    Top anchor: moshi (5), the only model here that listens and speaks at once. Board roots under it:
    qwen-asr (5, the best open-weights row on the Open ASR Leaderboard) for recognition,
    elevenlabs-tts (4) for synthesis, nemo (5) for engines.

    Distribution at promotion (22 banded): 3 at 5, 6 at 4, 10 at 3, 3 at 2, none at 1. The widest rung,
    3, holds 10 of 22, over the one-third review trigger. Its wording as it stands is the rank band
    31-60 for models, one-task engines for software, and the unrated-synthesizer clause. Read against
    the products, this is clustering rather than loose wording: the rung holds two recognizers placed
    mid-table on their boards (whisper 53rd of 71, deepgram-nova tied 48th of 58), Kokoro at 48th in the
    arena, the three synthesizers the arena does not rate (cosyvoice, f5-tts, voxcpm), and four one-task
    engines (faster-whisper, whisper-cpp, pyannote-audio, piper). The unrated clause is the part a
    reviewer should watch: it puts three synthesizers level with Kokoro on their own reported results,
    while chatterbox (71st) and qwen-tts (the arena's "Qwen3 TTS" row, 81st) sit a rung lower on
    listening tests. The asymmetry is recorded rather than hidden, and a board placement for any of the
    three replaces the clause for that product.

    Distribution after the second tranche (39 banded): 4 at 5, 10 at 4, 15 at 3, 8 at 2, 2 at 1. The
    17 new bands: personaplex 5 (full duplex, at moshi); granite-speech (20th), moss-transcribe-diarize
    (21st) and higgs-audio (its v3 STT model 14th) at 4 under qwen-asr, and speechbrain at 4 under nemo;
    vibevoice at 3 (its ASR model 49th, at whisper), omnivoice and zonos at 3 (unrated clause for the
    current release, at kokoro; ZONOS2 reports seed-tts eval in charts, and v0.1 is 74th), vosk and
    whisperx at 3 (one-task engines, two under nemo); wav2vec, mms, seamless-m4t and moonshine at 2 (the
    new absent-recognizer clause, one under whisper), xtts (82nd) at 2 under kokoro; melotts and sesame-csm at 1 (unrated synthesizers with no shared-test-set results,
    two under kokoro). Rung 3 again holds more than a third, 15 of 39, and the reading above holds: of
    its five additions, four are the one-task-engine and unrated-synthesizer shapes already there and
    the fifth, vibevoice, is a mid-table recognizer like whisper. The rung
    that moved most is 2, from 3 to 8, and all four absent recognizers land there on the clause added
    this tranche; a board entry for any of them replaces it.
  deferred:
    xtts:
      because: 'The weights license abstains: XTTS-v2 and XTTS-v1 carry the Coqui Public Model License
        1.0.0, which "allows only non-commercial use of a machine learning model and its outputs". That
        is the commercial_forbidden tier''s definition, but the tier names licenses literally and does not
        list this one. Hand-scored 2/restricted, the rung the tier would produce. Coqui has shut down, so
        no relicense is coming; the string goes to the maintainer license-rulings issue.'
    higgs-audio:
      because: 'The weights license abstains on two counts. Higgs TTS 3, the current text-to-speech
        release, carries the Boson Higgs TTS 3 Research and Non-Commercial License (commercial use needs a
        separate written license, with a free grant for monetized creator content), which no tier names;
        the v3 speech-to-text checkpoints are Apache-2.0. Hand-scored 2/restricted on the TTS license,
        the more restrictive reading. Whether a family''s TTS member and its ASR member are SKUs of one
        release, so that the most restrictive governs, is the same maintainer ruling voxtral waits on; if
        they are not, this entry may need splitting rather than rescoring. The superseded v2 model''s Boson
        Higgs Audio 2 Community License (a 100,000 annual-active-user bound) goes to the license-rulings
        issue with it.'
