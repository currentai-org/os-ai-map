name: assurance_evidence
display_name: Assurance & compliance evidence
description: 'Tools whose main output is machine-readable evidence about an AI system, model, dataset or
  generated content, produced for a party outside the operating team: an auditor, a regulator, an acquirer
  or a downstream deployer.'
strapline: The tools that produce evidence about AI systems are mostly open source, but most of the evidence
  they produce is self-attested. Documentation generators, compliance-as-code tools and watermark detectors
  hand a reader records to take on trust or to validate only for form, and so do the closed governance suites
  from IBM and Credo AI, the least open products here. Signing, tamper-evident logs, GPU attestation and zero-knowledge
  proofs let a third party check without the operator. Two of the three provers, EZKL and DeepProve, publish
  their source without an open license; the open one, ZKML, has had no commit to its main branch since August
  2023.
weights:
  adopt: 0.4
  cap: 0.6
products:
- nvtrust
- ezkl
- deepprove
- zkml
- c2pa-sdk
- model-signing
- halo-record
- compliance-trestle
- croissant
- trustmark
- invisible-watermark
- owasp-aibom-generator
- venturalitica
- content-seal
- ibm-watsonx-governance
- credo-ai
- ai-verify
- compl-ai
- validmind-library
- verifywise
- mlte
- synthid-text
scoring_recipe:
  version: 1
  extends: software
  derived_from:
    method: shared software ladder, checked against the hand-recorded scores of the first tranche
    checker: build/check_rubric.py
  note: "Capability here is ONE quantity: how independently a third party can check the evidence a\ntool produces,\
    \ without trusting the operator who produced it. Banded 2026-09-26 against the\nfirst 21 promoted products;\
    \ zkml, the second tranche, was placed on 2026-09-27. nvtrust is the top anchor; every other band records\
    \ relative_to\nnvtrust, or compliance-trestle for the bottom rung, so check_capability holds the arithmetic.\n\
    \n  5  VERIFIES THE EXECUTION. Hardware attestation or a cryptographic proof binds the evidence\n     to\
    \ the computation that ran: GPU attestation signed by the device (nvtrust) and\n     zero-knowledge proofs\
    \ of inference (ezkl, deepprove, zkml). Trust moves to the hardware vendor\n     or the proof system, never\
    \ the operator.\n  4  SIGNED OR TAMPER-EVIDENT. A signature, or a hash chain anchored to a witness or timestamp\n\
    \     authority the operator does not control, lets a third party confirm offline that the\n     evidence\
    \ is unaltered and who issued or checkpointed it, but not that what it asserts is\n     true (model-signing,\
    \ c2pa-sdk, halo-record). halo-record reaches this rung through its\n     witness and RFC 3161 anchoring;\
    \ its bare chain alone would not.\n  3  STANDARD FORMAT, CHECKABLE WITHOUT THE OPERATOR. The evidence follows\
    \ a published schema\n     or an open decoding method, so anyone can validate or read it with independent\
    \ tooling;\n     its content is still the operator's claim and signing is not the product's normal output\n\
    \     (compliance-trestle's detached DSSE signing is a beta command) (compliance-trestle OSCAL,\n     croissant,\
    \ owasp-aibom-generator CycloneDX, venturalitica OSCAL, and the open-detector\n     watermarks trustmark,\
    \ invisible-watermark, content-seal).\n  2  GENERATED, SELF-ATTESTED. The tool generates reports, documentation\
    \ or test results in its\n     own format, or a detector only the key holder can run, and the reader takes\
    \ it on trust\n     (mlte, ai-verify, compl-ai, validmind-library, verifywise, synthid-text, and the closed\n\
    \     suites ibm-watsonx-governance and credo-ai).\n  1  TEMPLATE. A checklist or document a person fills\
    \ in. Empty in this tranche: the ISO 42001\n     template repositories are parked in the sweep record as\
    \ not being tools.\n\nTRUST TAG. Rungs 1-3 are the self-attested (SA) rows and 4-5 the independently verifiable\
    \ (IV)\nones; each product repeats its tag in its own comments.\n\nWATERMARKING is read on this same quantity,\
    \ not as a second one (sweep open item 1). The\nquestion the category asks of a watermark is who can check\
    \ it: an open decoder anyone can run\nputs a mark on rung 3 beside the schema tools, and a detector that\
    \ needs the embedder's keys\n(synthid-text) puts it on rung 2. Robustness is a property of whether the\
    \ mark survives, which\nis recorded in value and note but does not move the band. No watermark reaches\
    \ rung 4: a mark\ncarries an identifier or a statistical signal, not a signature. TrustMark's link to a\
    \ signed\nC2PA manifest is the manifest's evidence, and c2pa-sdk carries it.\n\nDISTRIBUTION (22 banded):\
    \ 5 -> 4, 4 -> 3, 3 -> 7, 2 -> 8, 1 -> 0. Rung 2 is the widest at 8\nof 22 (36%), above the one-third review\
    \ trigger. Reviewed 2026-09-26, and unchanged by zkml,\nwhich joins rung 5 (relative_to nvtrust, at) and\
    \ leaves rung 2 as it was: the definition turns on\nwhether a third party needs the operator's cooperation\
    \ or trust, which is not satisfiable\nincidentally - each of the eight emits evidence in its own format\
    \ or behind its own key, and\nnone validates against a published schema. The width is a fact about the\
    \ field (the #93\nfinding that the independently verifiable leg is thin), not loose wording, so it stays.\n\
    \nONE LADDER for openness: every row is typed `software` and inherits the shared software ladder.\nContent\
    \ Seal ships model weights inside one suite; if a watermark model is ever split into its\nown `model` row,\
    \ `extends` becomes the per-type map `{model: model, software: software}`."
  deferred:
    ezkl:
      because: 'The repository grants no license at all: no LICENSE or COPYING file in the full tree, no license
        field in Cargo.toml or pyproject.toml, and only a contributor CLA covering incoming code. The software
        tier has no entry for `none-declared`, so the walk blocks on the first rung that reads a tier; the
        recorded 2/source_available is the hand reading (public source, no grant to run or reuse it). Whether
        `none-declared` joins `proprietary` or needs its own tier is a shared-rubric ruling for the license-rulings
        issue.'
    deepprove:
      because: Lagrange's own license grants a revocable right to use the software internally for testing and
        evaluation, or unmodified with Lagrange's platform. That is a use-bounded proprietary grant over published
        source, which reads as competition_restricted in spirit, but the tier names licenses literally and
        `Lagrange-License` is not among them, so the walk blocks. The recorded 2/source_available is the hand
        reading. The GitHub label (apache-2.0) and the workspace Cargo.toml (`MIT OR Apache-2.0`) both contradict
        the LICENSE body, which is taken as governing; the maintainer should confirm that reading.
    content-seal:
      because: The suite is MIT and Apache-2.0 except two members, Stable Signature and radioactive-watermark,
        which are CC-BY-NC-4.0. A compound license resolves on its most restrictive part, and the software
        ladder has no tier for a non-commercial license (`CC-BY-NC-4.0` is named only on the model and dataset
        ladders), so the walk blocks. The recorded 2/source_available is the hand reading. Adding a non-commercial
        tier to the software ladder, or splitting the NC members out of the suite, is the fix.
comments: |
  Proposed in issue #93; seeded 2026-09-26 from the sweep in
  docs/sweeps/2026-09-26-assurance-evidence.md, under the rulings in that session's decision
  record. First tranche promoted 2026-09-26: 21 head products chosen for coverage of every
  sub-type (compliance-as-code, documentation, signing, provenance, watermarking, attestation,
  proofs) and the two closed comparators. The other seven stay registry rows for add-product:
  air-blackbox, opencomplai, data-provenance-collection, aicert, zkml, verifyml, markllm.
  Second tranche 2026-09-27: zkml, as a thin gap fill. It is the only zero-knowledge inference
  prover here under an OSI license (ezkl grants no license, deepprove permits evaluation only),
  and it was taken despite main being idle since 2023-08: the gap it fills is an open prover at
  rung 5, not an active one. The other six stay in the registry: markllm overlaps synthid-text's
  open text watermarking, data-provenance-collection overlaps croissant and is idle, aicert and
  verifyml are abandoned, and air-blackbox and opencomplai are small and new.

  LITMUS. Is the product's main artifact evidence that a third party consumes? Yes means here.
  TIE-BREAKER (from #93). When one artifact is both a control and its evidence, classify by what
  reaches the outside party. A tool that enforces a policy and also logs that it did so belongs to
  whichever neighbor owns the enforcement, unless the log is the thing it is built to hand over.

  EXCLUSIONS, one per neighbor:
  - safeguards: runtime policy enforcement, guardrails, content filters and red-teaming.
    agent-governance-toolkit stays there: it enforces agent policy first, and its compliance
    mappings are secondary. AI Verify's LLM red-team sibling, Moonshot, would go there too.
  - evaluation_code (and benchmark_eval_data): capability or quality benchmarking for builders.
    compl-ai and ai-verify are here, not there, under the tie-breaker: what reaches the outside
    party is a conformity report mapped to regulation, not a benchmark score. Reverse this only if
    the map decides to keep every benchmark runner together.
  - telemetry_observability: operator-facing traces and metrics. halo-record is here because its
    hash-chained records are built for the customer to verify, not for the operator to read.
  - deployment: confidential-compute runtimes whose main product is a deployment surface. dstack
    goes there (a follow-up, not seeded here); attestation verifiers such as nvtrust stay here.
    nvtrust is promoted as NVIDIA's attestation tooling across both repositories: NVAT
    (NVIDIA/attestation-sdk) is the declared successor of the nvTrust Python guest tools, whose
    nv-attestation-sdk package reached end of support on 2026-09-15 and is not declared.
    The ruling is about the artifact, not the stack.
  - model_hubs, and huggingface-hub in ml_frameworks: hosting models, datasets and model cards.
    Hubs serve Croissant; the croissant row is the format and its library. The Hub client's
    ModelCard API is one module of huggingface-hub, not a product.
  - speech_audio and media_generation: generating media. Watermarking generated media is here.
  - Out of scope entirely: general, non-AI software supply chain (in-toto, cdxgen, SPDX tooling)
    and document templates with no tool behind them (the ISO 42001 toolkits).

  CONTESTED RULINGS:
  - C2PA and watermarking are here. #30 (responsible_ai_measurement) was parked, and its
    watermarking rows came here with C2PA: both answer "where did this content come from" for an
    outside party. synthid-text moved in from the safeguards tail: a watermark embedder and
    detector filters no unsafe input or output.
  - Content Seal is one row, because Meta markets one suite. The row declares no package:
    AudioSeal's downloads belong to one member, and declaring it would assert the suite's numbers.
    Stable Signature, one member, is CC-BY-NC-4.0 inside an MIT suite.
  - ezkl (no license grant; CLA only) and deepprove (proprietary evaluation-only license, which
    the GitHub label misreports as Apache-2.0) are listed as source-available rows, not held. How
    thin the independently verifiable leg is is itself the #93 finding.
  - validmind-library is here: it automates model documentation for model-risk validators, and is
    the open library of a closed platform.
  - The closed comparators are the GRC suites, ibm-watsonx-governance and credo-ai. Other closed
    governance platforms are parked as the long tail.
  - Regula is parked until its PyPI name ships a distribution; read its LicenseRef-DRL-1.1
    component then.

  TRUST TAG. Every row is self-attested (SA: an auditor reads it and takes it on trust) or
  independently verifiable (IV: a signature, attestation or proof a third party checks without
  trusting the operator). The registry has no field for it, so it is recorded here, per row:
  - IV: model-signing, nvtrust, c2pa-sdk, halo-record, ezkl, deepprove, aicert, zkml.
  - SA: compliance-trestle, ai-verify, mlte, croissant, owasp-aibom-generator, compl-ai,
    validmind-library, verifywise, venturalitica, air-blackbox, opencomplai,
    data-provenance-collection, verifyml, ibm-watsonx-governance, credo-ai.
  - SA (watermarking): content-seal, invisible-watermark, trustmark, markllm, synthid-text. A
    detector reports a statistical signal, and SynthID-Text's detector also needs the embedder's
    watermarking keys, so the check trusts the operator. Revisited at promotion and kept: an
    open decoder makes a mark checkable (capability 3), but no mark is a signed claim.
  A promoted product repeats its tag in its own comments.
