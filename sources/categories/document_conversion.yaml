name: document_conversion
display_name: Document conversion & OCR
description: 'Software and services that turn documents into text or structured output a model can consume:
  PDF, Office, HTML, email and scanned images into Markdown, JSON or layout-preserving formats, including
  the OCR and layout-analysis engines underneath them.'
weights:
  adopt: 0.6
  cap: 0.4
products:
- docling
- paddleocr
- chandra
- marker
- mineru
- markitdown
- nanonets-ocr
- dots-ocr
- olmocr
- surya
- tesseract
- deepseek-ocr
- lightonocr
- google-document-ai
- azure-document-intelligence
- mistral-ocr
- textract
- adobe-pdf-extract
- mathpix
- reducto
scoring_recipe:
  version: 1
  extends:
    model: model
    software: software
  derived_from:
    method: shared software ladder, not yet verified against hand-authored scores
    checker: build/check_rubric.py
  note: "Capability here is ONE quantity, and it nests: how much of a document survives the conversion.\n\
    \n  3  TEXT survives. Characters and their positions come out; reading order, tables and document\n\
    \     structure do not, and whatever consumes the output has to recover them.\n  4  STRUCTURE survives.\
    \ Reading order, tables and forms come through into Markdown, JSON or an\n     equivalent the consumer\
    \ can use directly. Contains band 3.\n  5  MEANING survives. The output carries typed entities the\
    \ consumer defines - an invoice total,\n     a custom document type trained on a customer's own\
    \ forms - not only where things sit on the\n     page. Contains band 4.\n\nTWO THINGS DELIBERATELY\
    \ EXCLUDED, both of which an earlier draft banded on and both of which are a\nsecond quantity rather\
    \ than more of this one. INPUT BREADTH: how many document kinds a product can\ndo this for is not\
    \ how much of one survives, which is why `paddleocr` is not at 5 for covering a\nhundred languages\
    \ and `docling` is not at 5 for the widest format list. PIPELINE POSITION: whether\nthe output feeds\
    \ a human or another program does not change how much survived, which is why\n`surya` is not below\
    \ the converters for being the engine one of them runs on - an earlier draft\nput it at 3 on that\
    \ reasoning, contradicting its own recorded value in the line above.\n\nTHE DISTRIBUTION IS BAD\
    \ AND IT IS REPORTED RATHER THAN ENGINEERED AWAY: 3 at band 3, 15 at band 4, 2 at band 5, so the\
    \ middle band\nholds 75% of the roster. That is poor discrimination by `capability.md`'s own diagnostic,\
    \ and the\nhonest reading is that this axis separates this category weakly: almost everything here\
    \ recovers\nstructure into Markdown or JSON, and the two ends are narrow - character-level extraction\
    \ below,\ncustomer-defined entity extraction above. Within the middle the real differences are input\
    \ breadth\nand structure depth, which trade off against each other and which the available evidence\
    \ - vendor\nfeature lists - cannot order. Manufacturing rungs to spread the count would encode a\
    \ distinction\nthe evidence does not carry. A shared benchmark would fix this and there is not one,\
    \ for the reason\nbelow.\n\nWHY NO BENCHMARK LADDER. Three document-conversion benchmarks circulate\
    \ and each is led by whoever\npublishes it: olmOCR-Bench is AI2's and olmOCR wins it, 82.4 against\
    \ MinerU's 75.2; OmniDocBench is\nOpenDataLab's, who also make MinerU, which wins that one at 93.04\
    \ against olmOCR's 85.74. A ladder\nresting on either would encode the choice of benchmark rather\
    \ than measure the products. Scores are\ncited on individual records as corroboration with the home-field\
    \ problem stated.\n\nTWO LADDERS for openness, not one. `extends` is the per-type form `{model:\
    \ model, software:\nsoftware}` that `safeguards` already uses, and the line between them is checkable\
    \ rather than\neditorial: a product that publishes an installable package is software - you install\
    \ a library and\ncall it - and a product that publishes only weights is a model, because what you\
    \ use is the\nweights. `olmocr`, `chandra`, `surya` and `paddleocr` ship packages; `deepseek-ocr`,\
    \ `dots-ocr`,\n`lightonocr` and `nanonets-ocr` do not. It matters: the software ladder abstains\
    \ on an unrecorded\ndimension while the model ladder asks about the training recipe, so `deepseek-ocr`\
    \ scores 3 rather\nthan 5 despite MIT on both code and weights - the corpus and the pipeline are\
    \ not published, and a\npermissive licence does not substitute for a published recipe."
  deferred:
    chandra:
      because: 'Datalab ships Apache-2.0 code with model weights under a modified OpenRAIL-M licence
        - free below USD 2M funding or revenue and not usable competitively with Datalab''s own API.
        That is the competition_restricted tier''s definition stated almost word for word, and the tier
        already holds `AI-Pubs-Open-RAIL-M-Modified`, the sibling licence on `marker` from the same
        vendor. It abstains only because the tier decides by literal name and this string is not in
        the list. Adding it is the same move that added MinerU-Open-Source-License and marker''s own
        licence, and it wants the measurement those additions record: which other products the name
        would reach.'
    surya:
      because: 'The LICENSE TIER abstains: the weights carry a Datalab modified OpenRAIL-M that the
        shared software tier does not name, exactly as `chandra` does, so the lookup returns no tier
        and the walk stops at the first rung that tests one. A second question rides along and is why
        this one is not simply `chandra`''s twin: the README badge names OpenRAIL-M and states no threshold,
        while Datalab''s published recognition weights on Hugging Face carry CC-BY-NC-SA-4.0 - NonCommercial,
        a materially different grant that would tier lower again. Naming the licence in the tier fixes
        the abstention; reading which weights Surya actually ships decides which name to add.'
    nanonets-ocr:
      because: 'The Hugging Face card declares no licence in its metadata, so there is no grant to tier,
        and the model ladder tests the tier before reaching its fallthrough rung. Recorded as `none-declared`
        so the lookup reads a name rather than a sentence. This is the same open question `livecodebench`
        and `txt360-pipeline` sit on one ladder over: a tier for unstated licences is a rubric change,
        not a per-product fix. It closes the moment Nanonets declares one.'
comments: 'Created preliminary 2026-09-16 under #430, which ruled that a document-converter bucket must
  be

  separated from wire protocols and tool servers. The evidence that they are one group rather than

  two is already in the corpus: `olmocr` sits in `dataset_processing_tools` and its capability value

  benchmarks it directly against Marker and MinerU, which sit in `agent_tools_protocols`. The corpus

  treats them as peers and files them in two categories.


  At promotion this category takes `docling`, `marker`, `mineru` and `markitdown` from

  `agent_tools_protocols`, and `olmocr` from `dataset_processing_tools`. That resolves the second

  half of #605 differently from the way #605 proposes it - #605 suggests moving the four converters

  into `dataset_processing_tools`, and the reason not to is that that category''s capability bands

  already span two instruments (corpus quality for `datatrove` and `nemo-curator`, operator breadth

  for `data-juicer` and `decon`) and its `scoring_recipe.note` carries no written rungs at all.

  Moving four more products in on a third instrument would relocate the defect #430 exists to fix.


  BOUNDARY. This category is the conversion step itself. `dataset_processing_tools` keeps corpus

  construction - filtering, deduplication, decontamination, synthetic generation - and a pipeline

  that happens to call a converter stays there. The test is what the product''s own job is, not what

  it can be used for.'
strapline: 'Conversion is where the open stack still competes and the closed stack still sells. Six
  of the twenty products publish their source outright and three more publish weights, but the only
  two that carry a document''s MEANING rather than its layout - typed entities, models trained on a
  customer''s own forms - are both hyperscaler services, and the seven closed products publish no countable
  channel at all, so a third of this category''s adoption is unmeasurable rather than low. The licences
  are the sharp edge: two of the strongest open converters ship permissive code with model weights under
  revenue-capped terms, which is why four records here sit below their code.'
