name: onetrainer
display_name: OneTrainer
type: software
description: OneTrainer is a training application for diffusion models, supporting full fine-tuning, LoRA and embeddings
  across Stable Diffusion 1.5 through 3.5, SDXL, FLUX.1, FLUX.2, Qwen Image, PixArt, Sana and Hunyuan Video. It
  includes masked training, EMA, aspect-ratio bucketing and multi-resolution training, and runs from either a GUI
  or a CLI.
github:
- url: https://github.com/Nerogar/OneTrainer
comments: Verified 2026-08-31 via the repository LICENSE and README.
