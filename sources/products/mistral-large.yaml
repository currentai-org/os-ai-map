name: mistral-large
display_name: Mistral Large 3
type: model
aliases:
- mistral-large-2
- mistral-large-3
description: 'Mistral Large 3 is Mistral AI''s first mixture-of-experts model since Mixtral and its current
  open-weights flagship, released December 2, 2025 under Apache 2.0 with 41B active and 675B total parameters,
  a 256K context window, and native text-and-image multimodal support, trained from scratch on 3,000 H200 GPUs.
  It debuted at #2 on the LMArena OSS non-reasoning leaderboard and sits alongside the smaller dense Ministral
  3 variants and the Mistral Vibe CLI in the broader Mistral 3 stack. It succeeds the retired Mistral Large
  2 (March 2025) as Europe''s flagship open-weights frontier model.'
huggingface_model:
- url: https://huggingface.co/mistralai/Mistral-Large-Instruct-2407
- url: https://huggingface.co/mistralai/Mistral-Large-3-675B-Base-2512
- url: https://huggingface.co/mistralai/Mistral-Large-3-675B-Instruct-2512
comments: Mistral Large 3 (mistral-large-3-25-12), announced 2 Dec 2025. Sparse MoE, 41B active / 675B total
  params. Base + instruct released; reasoning variant announced but not shipped as of mid-2026. Consolidated
  on 2026-07-29 from mistral-large-2; openness follows mistral-large-3, the release that currently governs.
  See docs/reference/identity.md. The LMArena placement is the launch-day figure from Mistral's own post, not
  a current leaderboard read. Adoption is low because the flagship is consumed through the API rather than
  downloaded, and the map bands on the declared checkpoints.
