name: mistral-large
display_name: Mistral Large 3
type: model
aliases:
- mistral-large-2
- mistral-large-3
description: 'Mistral AI''s first mixture-of-experts model since Mixtral and the current open-weights flagship,
  released December 2, 2025 under Apache 2.0. 41B active / 675B total parameters, 256K context, native multimodal
  support (text + images). Trained from scratch on 3000 H200 GPUs. Debuted at #2 on the LMArena OSS non-reasoning
  leaderboard. Combined with Ministral 3 (smaller dense variants) and Mistral Vibe CLI in the broader Mistral 3
  stack. Runs at the compute cost of a ~41B dense model while accessing the capacity of a 675B one, Europe''s flagship
  open-weights frontier model and the direct successor to the retired Mistral Large 2 (March 2025).'
huggingface_model:
- url: https://huggingface.co/mistralai/Mistral-Large-Instruct-2407
- url: https://huggingface.co/mistralai/Mistral-Large-3-675B-Base-2512
- url: https://huggingface.co/mistralai/Mistral-Large-3-675B-Instruct-2512
comments: Mistral Large 3 (mistral-large-3-25-12), announced 2 Dec 2025. Sparse MoE, 41B active / 675B total
  params. Base + instruct released; reasoning variant announced but not shipped as of mid-2026. Consolidated
  on 2026-07-29 from mistral-large-2; openness follows mistral-large-3, the release that currently governs.
  See docs/guides/identity.md. The LMArena placement is the launch-day figure from Mistral's own post, not
  a current leaderboard read. Adoption is low because the flagship is consumed through the API rather than
  downloaded, and the map bands on the declared checkpoints. Verified 2026-08-13 via the Mistral 3 launch
  post and the Mistral-Large-3-675B-Base-2512 HF model card.
