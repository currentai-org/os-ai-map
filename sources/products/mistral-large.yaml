description: Mistral Large 3 is Mistral AI's first mixture-of-experts model since Mixtral, with 41B active
  and 675B total parameters, a 256K context window and native text-and-image input. Trained from scratch on
  3,000 H200 GPUs and released in December 2025 in base and instruct form, it sits alongside the smaller dense
  Ministral 3 models and succeeds Mistral Large 2. A reasoning variant announced at launch has not been released.
