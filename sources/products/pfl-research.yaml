name: pfl-research
display_name: pfl-research
type: software
description: Apple's Python framework for private federated learning simulations. Researchers run fast simulations
  across processes, GPUs and machines, with local and central differential privacy mechanisms built in and benchmark
  suites over realistic datasets.
github:
- url: https://github.com/apple/pfl-research
pypi:
- url: https://pypi.org/project/pfl/
comments: The PyPI package is `pfl`; its project URLs name apple/pfl-research. Apple states that the framework is
  not intended for third-party federated learning deployments.
