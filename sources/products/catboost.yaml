name: catboost
display_name: CatBoost
type: software
description: Gradient-boosted decision tree library from Yandex, known for handling categorical features natively
  and for ordered boosting, which reduces overfitting on small data. It trains on CPU or GPU for classification,
  regression and ranking, takes text and embedding features, and exports models to ONNX, CoreML, PMML and several
  runtime languages.
github:
- url: https://github.com/catboost/catboost
