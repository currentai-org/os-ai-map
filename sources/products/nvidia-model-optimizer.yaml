name: nvidia-model-optimizer
display_name: NVIDIA Model Optimizer
type: software
description: NVIDIA Model Optimizer is a library of model-optimization techniques - quantization, pruning, neural
  architecture search, distillation, sparsity and speculative decoding - composed through Python APIs. It takes
  Hugging Face, PyTorch or ONNX models and exports optimized checkpoints for downstream deployment stacks including
  TensorRT-LLM, TensorRT and vLLM.
github:
- url: https://github.com/NVIDIA/Model-Optimizer
pypi:
- url: https://pypi.org/project/nvidia-modelopt/
