description: SEA-IFEval tests whether language models follow instructions whose constraints a program can check,
  such as starting with a given phrase or writing a set number of sections, in Southeast Asian languages. AI Singapore
  adapted the English IFEval prompts and had native speakers translate them by hand, 105 prompts per language. It
  is SEA-HELM's instruction-following task and is published on its own on the Hub.
