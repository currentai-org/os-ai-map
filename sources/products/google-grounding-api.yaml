name: google-grounding-api
display_name: Google Grounding API
type: software
description: Grounding with Google Search is Google's managed capability for grounding Gemini model responses
  in real-time Google Search results, offered on the Gemini Enterprise Agent Platform (formerly Vertex AI).
  A companion option, Grounding with Agent Search, grounds responses in an organization's own website data
  or documents instead. The capability is tightly integrated with the Gemini models and is the platform's search-augmented
  generation path.
