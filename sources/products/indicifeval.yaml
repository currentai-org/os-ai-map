description: IndicIFEval tests whether language models follow instructions whose constraints a program can check,
  such as a word count, a required keyword or an output format, in 14 Indic languages. It has two parts. IndicIFEval-Trans
  adapts 490 prompts from the English IFEval benchmark to Indian contexts, machine-translates them, and has native
  speakers mark each translation correct or incorrect. IndicIFEval-Ground holds new prompts that Gemini 2.5 wrote
  from Indic web text, kept only where native speakers judged them clear and correct. AI4Bharat released it in 2026
  with its evaluation harness.
