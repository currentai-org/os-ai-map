description: 'LLM360 / MBZUAI''s K2-V2 (70B dense), released Dec 2025: a 360-open, reasoning-enhanced
  LLM. Fully reproducible — Apache-2.0 weights plus the complete TxT360 pretraining, midtraining and SFT
  data, training code and checkpoints. Supersedes the 65B K2 Chat.'
github:
- url: https://github.com/LLM360/k2v2_train
huggingface_model:
- url: https://huggingface.co/LLM360/K2-V2
- url: https://huggingface.co/LLM360/K2-V2-Instruct
comments: Apache-2.0; open weights + open TxT360 data + open training code + checkpoints. Outperforms
  Qwen2.5-72B and approaches Qwen3-235B; strongest fully-open model by parameter scale, though OLMo 3
  leads on fully-open evals.
