name: qwen-coder
display_name: Qwen3-Coder
type: model
aliases:
- qwen2-5-coder-instruct
- qwen3-coder
description: Qwen3-Coder is a line of open-weight models for agentic coding, tool calling and repository-scale
  code work. It spans Qwen3-Coder-Next, an 80B mixture-of-experts model with 3B active parameters built for
  coding agents and local development, and the larger Qwen3-Coder-480B-A35B-Instruct, with 35B of its 480B
  parameters active; both have a native context of 256K tokens. The earlier Qwen2.5-Coder checkpoints from
  Alibaba's Qwen team belong to the same line.
huggingface_model:
- url: https://huggingface.co/Qwen/Qwen2.5-Coder-32B-Instruct
- url: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct
- url: https://huggingface.co/Qwen/Qwen3-Coder-30B-A3B-Instruct
- url: https://huggingface.co/Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
- url: https://huggingface.co/Qwen/Qwen3-Coder-Next
- url: https://huggingface.co/Qwen/Qwen3-Coder-Next-Base
comments: Scored as one line across the Qwen2.5-Coder, Qwen3-Coder and Qwen3-Coder-Next releases. The Qwen3-Coder-Next
  model card gives no release date; its repository was created on 2026-01-30.
