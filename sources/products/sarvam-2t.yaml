name: sarvam-2t
display_name: Sarvam-2T
type: dataset
description: 'Sarvam-2T is Sarvam AI''s Indic pretraining corpus of about 2 trillion tokens across ten Indian
  languages: Bengali, Gujarati, Hindi, Kannada, Malayalam, Marathi, Oriya, Punjabi, Tamil and Telugu. Most
  of it was produced with synthetic data generation rather than web crawling, and the languages are split almost
  evenly except for Hindi. Sarvam used it to train its Sarvam-1 model.'
