name: graphiti
display_name: Graphiti
type: software
description: Graphiti builds temporal knowledge graphs for AI agents from conversations and business data, extracting
  entities and facts with a language model and giving each fact a window of validity, so that outdated facts are
  invalidated rather than deleted. Applications query the graph with combined semantic, keyword and graph search
  on Neo4j, FalkorDB or Amazon Neptune. Zep develops it as the open framework inside its hosted service.
