name: cleanlab
display_name: Cleanlab
type: software
description: cleanlab is a Python library that finds problems in machine-learning datasets using the outputs of a model trained
  on them. Its Datalab interface flags label errors, outliers, near duplicates and other issues in text, image, audio and
  tabular data, and the package also trains noise-robust classifiers and scores annotator quality when several people labeled
  the same data. It implements confident learning, a published method for estimating label noise.
