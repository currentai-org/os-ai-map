name: flash-attention
display_name: FlashAttention
type: software
description: FlashAttention is the reference implementation of IO-aware exact attention, computing attention without
  materializing the full attention matrix and so cutting memory traffic rather than approximating the result. The
  repository carries FlashAttention and FlashAttention-2 alongside the papers describing them, with Hopper-specific
  kernels in a separate tree.
