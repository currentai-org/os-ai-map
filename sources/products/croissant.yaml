name: croissant
display_name: Croissant
type: software
description: Croissant is MLCommons' metadata format for machine-learning datasets, combining a dataset's metadata,
  file descriptions, record structure and default ML semantics in one JSON-LD file built on schema.org. The
  mlcroissant Python library validates and loads Croissant files, and a Responsible AI extension records provenance,
  collection and bias information. Major dataset hubs publish Croissant descriptions.
comments: 'Scored as the format and its reference library, not the hubs that serve it. Tagged self-attested:
  a validator checks the structure, not the truth of what it records.'
github:
- url: https://github.com/mlcommons/croissant
pypi:
- url: https://pypi.org/project/mlcroissant/
