name: open-connector
display_name: OpenConnector
type: software
description: 'Open-source connector gateway: connect a user''s app accounts once, then expose a shared catalogue
  of over a thousand providers and their prebuilt actions to agents over SDK, CLI, MCP, HTTP or OpenAPI, with
  credential encryption and token refresh behind the runtime boundary.'
github:
- url: https://github.com/oomol-lab/open-connector
comments: The licence file is `LICENSE.txt` - a citation of `LICENSE` 404s, which is the kind of dead link
  a corpus should not carry. The npm package reads zero downloads for the window because the primary distribution
  is a GHCR Docker image, so adoption bands on stars. The provider count differs between the repository description
  (1500+) and the README body (1,000+) because the badges read a live catalogue endpoint; neither number is
  pinned here.
