name: droid
display_name: DROID
type: dataset
description: 'DROID (Distributed Robot Interaction Dataset) is a large in-the-wild robot manipulation dataset recorded
  by 50 collectors in North America, Asia and Europe on copies of one Franka-based robot platform: about 76,000
  trajectories and 350 hours across 564 scenes and 86 tasks. It is distributed through TensorFlow Datasets and Cloud
  Storage, with a LeRobot-format copy on the Hugging Face Hub.'
github:
- url: https://github.com/droid-dataset/droid
huggingface_dataset:
- url: https://huggingface.co/datasets/lerobot/droid_1.0.1
comments: Neither the DROID repository nor its website states a license. The Hub copy declared here is LeRobot's
  conversion, which labels itself Apache-2.0 on its own authority.
