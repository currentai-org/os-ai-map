name: mistral-small
display_name: Mistral Small
type: model
description: Mistral Small is a line of open-weight models from Mistral AI. Mistral Small 4 is a 119-billion-parameter
  mixture of experts with about 6.5 billion parameters active per token. It merges Mistral's instruct, reasoning
  (previously Magistral) and Devstral coding models into one, with reasoning switched on per request, image input
  and a 256k-token context window.
huggingface_model:
- url: https://huggingface.co/mistralai/Mistral-Small-4-119B-2603
comments: Mistral serves this release through its API as mistral-small-2603 (version 26.03).
