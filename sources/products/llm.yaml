name: llm
display_name: LLM (Datasette)
type: software
description: Command-line tool and Python library for prompting large language models. It provides one CLI
  and API across remote providers such as OpenAI, Anthropic and Gemini and across local models, with a plugin
  architecture for new backends. Prompts and responses are logged to a local SQLite database, and it supports
  embeddings and templated prompts. Part of Simon Willison's Datasette ecosystem.
github:
- url: https://github.com/simonw/llm
pypi:
- url: https://pypi.org/project/llm
comments: The canonical repository sits under a personal account rather than a Datasette organization. Verified
  2026-08-13 via the simonw/llm repository and the llm.datasette.io documentation.
