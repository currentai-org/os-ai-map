name: arabicweb24
display_name: ArabicWeb24
type: dataset
description: ArabicWeb24 is a pretraining corpus of Arabic web text from a custom crawl, processed with the
  datatrove library; the card gives more than 28 billion tokens for the fully cleaned and deduplicated version.
  A second version skips the sentence deduplication step, and the processing code and small ablation models
  trained on both versions are released alongside. LightOn built it with INSAT.
huggingface_dataset:
- url: https://huggingface.co/datasets/lightonai/ArabicWeb24
comments: The card headline says more than 39 billion tokens while its body says more than 28 billion for the
  cleaned version; the description uses the body figure.
