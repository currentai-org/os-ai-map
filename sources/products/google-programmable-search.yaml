name: google-programmable-search
display_name: Google Programmable Search
type: software
description: JSON API that returns web and image search results from a Programmable Search Engine - a Google-hosted
  index scoped to sites the customer configures, or to the whole web. Results follow the OpenSearch 1.1 specification.
comments: This is the long-standing Custom Search JSON API rather than the Gemini grounding tool, which is
  a different Google product already on the map as `google-grounding-api`.
