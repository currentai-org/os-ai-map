name: pangu-weather
display_name: Pangu-Weather
type: model
description: Pangu-Weather is Huawei Cloud's 3D transformer for medium-range global weather forecasting, released as four ONNX checkpoints with lead times of 1, 3, 6, and 24 hours that are chained to build longer forecasts. The repository provides inference scripts and algorithm pseudocode; ECMWF has run the published models in its own charts.
github:
- url: https://github.com/198808xc/Pangu-Weather
arxiv:
- url: https://arxiv.org/abs/2211.02556
comments: The repository carries no LICENSE file, so GitHub reports none; the grant over the trained parameters is stated in the README instead. Verified 2026-09-10 via the repository README, the GitHub license endpoint, and the GitHub API.
