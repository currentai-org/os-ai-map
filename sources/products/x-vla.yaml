name: x-vla
display_name: X-VLA
type: model
description: 'X-VLA is a 0.9B vision-language-action model from Tsinghua University''s Institute for AI Industry Research
  (AIR) and Shanghai AI Laboratory, built on Florence-2. One transformer serves many robot bodies: each data source gets its
  own small set of learned prompt embeddings. It is released as a pretrained foundation checkpoint with fine-tunes for WidowX,
  Google Robot, LIBERO, RoboTwin 2.0 and dual-arm cloth folding, and LeRobot supports it natively.'
github:
- url: https://github.com/2toinf/X-VLA
huggingface_model:
- url: https://huggingface.co/2toINF/X-VLA-Pt
- url: https://huggingface.co/2toINF/X-VLA-Libero
- url: https://huggingface.co/2toINF/X-VLA-RoboTwin2
- url: https://huggingface.co/2toINF/X-VLA-SoftFold
- url: https://huggingface.co/2toINF/X-VLA-WidowX
- url: https://huggingface.co/2toINF/X-VLA-Google-Robot
arxiv:
- url: https://arxiv.org/abs/2510.10274
comments: The code and checkpoints are published under the lead author's accounts, which the project page links. LeRobot's
  own conversions of the checkpoints are not counted toward this entry.
