name: nemotron-asr
display_name: Nemotron ASR
type: model
description: NVIDIA's streaming speech recognition models, branded under Nemotron rather than Parakeet. Nemotron
  3.5 ASR is a 600M-parameter cache-aware FastConformer-RNNT model that transcribes 40 language-locales from one
  checkpoint, with punctuation, capitalization and configurable chunk sizes down to 80ms; Nemotron ASR Streaming
  is its English-only predecessor.
huggingface_model:
- url: https://huggingface.co/nvidia/nemotron-3.5-asr-streaming-0.6b
- url: https://huggingface.co/nvidia/nemotron-speech-streaming-en-0.6b
comments: The multilingual model is released under OpenMDW-1.1 and the English one under the NVIDIA Open Model License,
  which sit in the same license tier. Trained and served with NeMo. NVIDIA's batch-first recognizers are parakeet
  and canary; the Nemotron language models are nemotron.
