name: wangchanx-flan
display_name: WangchanX-FLAN
type: dataset
description: WangchanX-FLAN is a FLAN-style instruction-tuning mixture centered on Thai, combining about 3.6
  million examples converted from more than two dozen existing datasets for summarization, translation, question
  answering, classification and text generation. Sources range from ThaiSum, the scb-mt-en-th-2020 parallel
  corpus and Wisesight sentiment to English sets such as UltraChat, FLAN v2 and xP3x. VISTEC-depa AI Research
  Institute of Thailand assembled it, and the build script is public.
huggingface_dataset:
- url: https://huggingface.co/datasets/airesearch/WangchanX-FLAN-v6.1
