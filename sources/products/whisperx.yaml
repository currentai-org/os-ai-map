name: whisperx
display_name: WhisperX
type: software
description: A transcription pipeline around Whisper that adds accurate word-level timestamps through wav2vec 2.0 forced
  alignment, speaker labels through pyannote.audio diarization, and voice-activity-based batching on the faster-whisper
  backend, for up to 70 times real-time transcription.
github:
- url: https://github.com/m-bain/whisperX
pypi:
- url: https://pypi.org/project/whisperx/
arxiv:
- url: https://arxiv.org/abs/2303.00747
comments: It composes faster-whisper, wav2vec 2.0 alignment models and pyannote.audio, all separate entries here; the
  diarization model it downloads sits behind a Hugging Face user agreement.
