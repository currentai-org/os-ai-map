name: nasa-ibm-lunar-foundation-model
display_name: NASA-IBM Lunar Foundation Model
type: model
description: The NASA-IBM Lunar Foundation Model is a ViT-B encoder-decoder pretrained on SomBench, about two
  million lunar tile bundles spanning 11 modalities at two spatial scales, LROC NAC at roughly 1 m/px and WAC
  at roughly 100 m/px. It adapts TerraMind's masked-token recipe to the Moon, tokenizing acquisition geometry
  as context and training both resolution families together. Downstream adaptation runs through TerraTorch,
  with configs for crater detection, Irregular Mare Patch segmentation and ice prospectivity.
github:
