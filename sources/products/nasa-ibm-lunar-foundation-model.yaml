name: nasa-ibm-lunar-foundation-model
display_name: NASA-IBM Lunar Foundation Model
type: model
description: A ViT-B encoder-decoder pretrained from scratch on SomBench, roughly two million co-registered lunar tile bundles spanning 11 modalities at two spatial scales, LROC NAC at about 1 m/px and LROC WAC at about 100 m/px. It adapts TerraMind's masked-token recipe to the Moon by tokenizing acquisition geometry as explicit context and training both resolution families in one mixed-batch loop, and downstream adaptation runs through TerraTorch with runnable configs for crater detection, Irregular Mare Patch segmentation and ice prospectivity.
github:
- url: https://github.com/NASA-IMPACT/NASA-IBM-Lunar-Foundation-Model
huggingface_model:
- url: https://huggingface.co/nasa-ibm-ai4science/NASA-IBM-Lunar-Foundation-Model
huggingface_dataset:
- url: https://huggingface.co/datasets/nasa-ibm-ai4science/Sombench-pretraining-data
comments: GitHub's license endpoint reports NOASSERTION, but the repository LICENSE body is Apache-2.0 and both READMEs and the model card say the same. The companion repository states that pretraining code is not included, and the published SomBench dataset repo is a sample of the corpus rather than the corpus. Verified 2026-09-10 via the Hugging Face API, the model card, and the GitHub repository.
