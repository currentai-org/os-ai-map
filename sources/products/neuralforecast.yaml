name: neuralforecast
display_name: NeuralForecast
type: software
description: NeuralForecast is Nixtla's library of neural forecasting models, from recurrent networks, N-BEATS and NHITS to
  transformer models such as TFT, PatchTST and iTransformer, all trained and run through one fit-and-predict interface. It
  handles exogenous variables and probabilistic forecasts, and each model has an Auto version that tunes its settings on Ray
  or Optuna. The interface is shared with Nixtla's StatsForecast and MLForecast.
github:
- url: https://github.com/Nixtla/neuralforecast
pypi:
