name: mujoco-playground
display_name: MuJoCo Playground
type: software
description: MuJoCo Playground is Google DeepMind's suite of robot environments, reinforcement learning tasks and hardware
  workflows built on MuJoCo and MuJoCo Warp. It covers large-batch RL training on the GPU with state and camera observations,
  teleoperation, system identification against logged hardware trajectories, and zero-shot deployment of the same policy to
  real robots such as the SO-101 arm.
github:
- url: https://github.com/google-deepmind/mujoco_playground
pypi:
