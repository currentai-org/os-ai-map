name: google-tpu-ironwood
display_name: Google TPU Ironwood (TPU7x)
type: hardware
description: Google TPU Ironwood, listed as TPU7x in Google Cloud, is Google's seventh-generation Tensor Processing
  Unit for training and inference. Each chip pairs two TensorCores and four SparseCores with 192 GB of HBM, and
  chips are joined by Google's inter-chip interconnect into large pods. It is offered as Google Cloud TPU capacity.
