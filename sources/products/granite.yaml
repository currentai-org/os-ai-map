comments: Openness follows Granite 4.2, the current release, which is post-trained from the Granite 4.1 base
  checkpoints. Adoption is read across the declared 4.0, 4.1 and 4.2 checkpoints. The speech, vision, guardian
  and switch models are separate lines and are not declared here.
