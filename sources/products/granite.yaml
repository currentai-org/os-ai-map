name: granite
display_name: Granite
type: model
description: IBM's Granite family of enterprise language models, published under Apache-2.0. Granite 4.1, released
  in April 2026, added dense 3B, 8B and 30B models trained from scratch, with base and instruct checkpoints,
  and Granite 4.2 followed in August 2026, post-training those bases for reasoning, tool use and instruction
  following. The October 2025 Granite 4.0 line of hybrid Mamba-2/transformer models, from 3B up to a 32B mixture
  of experts, remains available.
