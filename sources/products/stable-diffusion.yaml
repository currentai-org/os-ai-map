name: stable-diffusion
display_name: Stable Diffusion
type: model
description: Stable Diffusion is Stability AI's line of latent diffusion models for text-to-image generation, from
  SDXL and its Turbo distillations to the multimodal-diffusion-transformer Stable Diffusion 3 and 3.5 models in
  Medium, Large and Large Turbo sizes. Stability's newer Stable Image Core and Ultra models are offered through
  its API and Amazon Bedrock.
