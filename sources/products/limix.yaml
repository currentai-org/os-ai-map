name: limix
display_name: LimiX
type: model
description: LimiX is a family of foundation models for tabular and other structured data from Stable AI. One pretrained
  model handles classification, regression and missing-value imputation on a new table in a single forward pass, reading
  the table's rows as context instead of training on them. The current LimiX-2 has 400M parameters and is pretrained
  on synthetic data drawn from structural causal models.
