name: metaflow
display_name: Metaflow
type: software
description: Python framework from Netflix for building and operating machine-learning and AI systems. A flow
  is a class of steps; decorators attach resources, retries and checkpoints to each step, and @batch or @kubernetes
  send that step to AWS Batch or a Kubernetes cluster to run. Metaflow tracks every run, its artifacts and
  its models, and can resume a failed flow from the step that failed.
github:
- url: https://github.com/Netflix/metaflow
pypi:
- url: https://pypi.org/project/metaflow/
comments: Outerbounds, founded by Metaflow's creators, sells a managed platform beside it.
