description: Write HTML. Render video. Built for agents. HyperFrames is an open-source framework for turning HTML,
  CSS, media, and seekable animations into deterministic MP4 videos. Use it locally with the CLI, from AI coding
  agents with skills, or as the rendering core behind hosted authoring workflows.
