name: milvus
display_name: Milvus
type: software
description: Cloud-native vector database built for approximate nearest-neighbor search at billion scale. It
  supports hybrid search combining vector similarity with scalar filtering, BM25 full-text search, and index
  types from HNSW through DiskANN. It is an LF AI & Data graduate project, with Zilliz Cloud as the managed
  offering, and is aimed at production RAG systems that need to scale.
github:
- url: https://github.com/milvus-io/milvus
pypi:
- url: https://pypi.org/project/pymilvus
  not_primary_channel: The Python client for querying a running Milvus cluster. Its installs can vary
    independently of server deployments, so its downloads measure the client rather than the database.
artifact_exceptions:
  pypi_repo_mismatch: pymilvus is the Python client, published from milvus-io/pymilvus; the product is the
    vector database at milvus-io/milvus. The client's downloads are not a measure of server deployments,
    which is why the artifact is declared not_primary_channel.
