name: molmo
display_name: Molmo
type: model
description: Molmo is Ai2's family of open vision-language models, released with their training data and code. Molmo2
  understands single images, several images and video, and answers by pointing at objects or tracking them across
  frames as well as in text. Its checkpoints pair Qwen3 or OLMo language models with a SigLIP 2 vision encoder,
  and every dataset was built without distilling from closed models.
github:
- url: https://github.com/allenai/molmo2
huggingface_model:
- url: https://huggingface.co/allenai/Molmo2-8B
- url: https://huggingface.co/allenai/Molmo2-4B
- url: https://huggingface.co/allenai/Molmo-7B-D-0924
arxiv:
- url: https://arxiv.org/abs/2601.10611
comments: Ai2's robot-action MolmoAct models are a separate line. The model cards note that some of the third-party
  datasets Molmo was trained on are limited to non-commercial research use.
