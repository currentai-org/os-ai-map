name: microsoft-copilot
display_name: Microsoft Copilot
type: software
description: Microsoft's Copilot chat surface on Windows, the web and mobile, and embedded across Microsoft
  365 in Word, Excel, Teams and Outlook. It runs over OpenAI and Microsoft models and grounds answers in Microsoft
  Graph content across those applications. Proprietary, with no source release; Copilot Studio agents are a
  separate product.
comments: Scored as the chat surface rather than the agent builder. Verified 2026-08-13 via the Microsoft 365
  Copilot admin usage documentation.
