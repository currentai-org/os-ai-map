name: microsoft-copilot
display_name: Microsoft Copilot
type: software
description: Microsoft's consumer/enterprise Copilot chat surface on Windows, web, mobile, and embedded
  across Microsoft 365 (Word, Excel, Teams, Outlook). 15M paid M365 Copilot seats and 33M active users
  as of Q2 FY2026, though usage share has slipped vs ChatGPT and Gemini.
comments: Microsoft Copilot consumer + M365 Copilot chat assistant surfaces (Windows, Edge, M365, Bing, mobile).
  Verified 2026-08-13 via the Microsoft 365 Copilot Chat admin usage documentation. Business of Apps has restated
  its headline to 218M active users, replacing the ~420M all-surfaces figure the description carries. Proprietary
  chat UI over OpenAI + Microsoft models; human-in-the-loop assistant (Copilot Studio agents are a separate
  product). Scored as the chat-UI surface.
