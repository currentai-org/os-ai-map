name: cambrian
display_name: Cambrian
type: model
description: Cambrian is a family of open multimodal models from New York University's VisionX lab, built around a vision-centric
  study of how image encoders shape multimodal models. Cambrian-S extends the line to video and spatial reasoning on Qwen2.5
  language models, and Cambrian-P adds per-frame camera tokens so that one model answers spatial questions about a video and
  estimates the camera's pose.
