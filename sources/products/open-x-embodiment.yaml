name: open-x-embodiment
display_name: Open X-Embodiment
type: dataset
description: 'Open X-Embodiment is a pooled robot-learning dataset assembled in a collaboration of 21 institutions
  and published by Google DeepMind: more than a million real robot trajectories from 22 robot embodiments, from
  single arms to bimanual robots, covering 527 skills. Every constituent dataset is converted to the RLDS episode
  format and served through TensorFlow Datasets and a public Cloud Storage bucket.'
github:
- url: https://github.com/google-deepmind/open_x_embodiment
arxiv:
- url: https://arxiv.org/abs/2310.08864
