name: triposr
display_name: TripoSR
type: model
description: TripoSR is a feed-forward transformer that reconstructs a textured 3D mesh from a single image in under
  a second, built on the Large Reconstruction Model design. VAST (Tripo AI) developed it with Stability AI and trained
  it on a curated subset of Objaverse.
github:
- url: https://github.com/VAST-AI-Research/TripoSR
huggingface_model:
- url: https://huggingface.co/stabilityai/TripoSR
arxiv:
- url: https://arxiv.org/abs/2403.02151
comments: The weights are hosted on Stability AI's Hugging Face account and the code on VAST's GitHub account; the map
  attributes the model to VAST, whose research group wrote it. TripoSR fills the permissive image-to-3D slot beside TripoSG,
  its MIT-licensed successor from the same group. Released March 2024; no later TripoSR release exists.
