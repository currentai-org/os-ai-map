name: open-webui
display_name: Open WebUI
type: software
description: Self-hosted, extensible web interface for chatting with any OpenAI-compatible endpoint or a local
  Ollama model. It includes retrieval-augmented generation across nine vector databases, voice and image handling,
  a Pipelines plugin system, and enterprise access control through RBAC, LDAP, SCIM and SSO.
github:
- url: https://github.com/open-webui/open-webui
pypi:
- url: https://pypi.org/project/open-webui
comments: The license is a BSD-derived variant carrying a branding-retention clause above a small-deployment
  threshold, which is why the openness axis does not read it as OSI-approved. Verified 2026-08-13 via the open-webui
  repository and its LICENSE.
