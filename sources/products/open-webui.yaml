name: open-webui
display_name: Open WebUI
type: software
description: Extensible web interface for chatting with any OpenAI-compatible endpoint or a local Ollama model,
  deployed on infrastructure the operator runs. It includes retrieval-augmented generation across nine vector
  databases, voice and image handling, a Pipelines plugin system, and enterprise access control through RBAC,
  LDAP, SCIM and SSO.
