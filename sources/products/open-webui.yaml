name: open-webui
display_name: Open WebUI
type: software
description: Open WebUI is an extensible web interface for chatting with Ollama models or any OpenAI-compatible
  endpoint, deployed on infrastructure the operator runs. It includes retrieval-augmented generation over a
  choice of vector databases, voice and image handling, plugin support through Pipelines, tools, MCP and OpenAPI
  servers, and enterprise access control through RBAC, LDAP, SCIM and SSO.
