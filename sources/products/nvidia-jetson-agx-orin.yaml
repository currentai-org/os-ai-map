name: nvidia-jetson-agx-orin
display_name: NVIDIA Jetson AGX Orin
type: hardware
description: NVIDIA's high-end edge-AI system-on-module, delivering up to 275 sparse INT8 TOPS from a 2048-core
  Ampere GPU with 64 tensor cores alongside a 12-core Arm Cortex-A78AE CPU. It ships in 32GB and 64GB LPDDR5
  variants on a 699-pin module and is the top of the Jetson Orin family, aimed at robotics and autonomous machines.
github:
- url: https://github.com/OE4T/meta-tegra
  not_primary_channel: The community OpenEmbedded/Yocto BSP layer for Jetson, not an NVIDIA repository, not
    the module itself. Its star count measures attention to that repository rather than units in use, so it
    is not a channel the product ships through; adoption is read from reported traction instead.
