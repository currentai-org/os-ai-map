name: jina-reader
display_name: Jina Reader
type: software
description: Jina Reader is a service and open-source codebase that converts a web page into markdown for language
  models when a URL is prefixed with r.jina.ai. It reads HTML, PDF and Microsoft Office documents and captions
  images. A companion endpoint, s.jina.ai, searches the web and returns the results as markdown.
github:
- url: https://github.com/jina-ai/reader
