name: content-seal
display_name: Content Seal (Meta Seal)
type: software
description: Content Seal is Meta's suite of invisible watermarking research code across audio, image, video
  and text. It collects AudioSeal, Video Seal and Pixel Seal, Watermark Anything, Stable Signature, TextSeal
  and related work on generation-time and in-model watermarking, each with released models and detectors. Meta
  states that the image version it deploys in production is a separate proprietary implementation.
comments: 'Treated as one suite, so the most restrictive member license governs. Tagged self-attested: members
  ship open detectors, but a mark is a statistical signal, not a signed claim.'
