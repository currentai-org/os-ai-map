name: axon
display_name: Axon
type: software
description: Local observability tool for LangChain and OpenTelemetry-instrumented AI agents. A single CLI-launched
  server ingests OTLP trace data and serves a real-time React dashboard with transcript, waterfall, tree and
  raw span views, writing everything to a local SQLite database. No cloud account is required and no trace
  data leaves the machine it runs on.
github:
- url: https://github.com/langchain-tracer/Axon
npm:
- url: https://www.npmjs.com/package/@axon-ai/cli
comments: The CLI, backend and dashboard packages it bundles all ship in the same MIT-licensed repository
  and run entirely on the developer's machine. Verified 2026-09-02 via the langchain-tracer/Axon repository.
