name: dofa
display_name: DOFA
type: model
description: DOFA (Dynamic One-For-All) is a wavelength-conditioned Earth-observation foundation model from the Technical University of Munich's Chair of Data Science in Earth Observation. A dynamic hypernetwork, inspired by neural plasticity, generates patch-embedding weights from the wavelengths of whatever bands are supplied, so a single checkpoint accepts Sentinel-1 SAR, Sentinel-2, NAIP RGB, Gaofen multispectral, and hyperspectral imagery with any number of channels.
github:
- url: https://github.com/zhu-xlab/DOFA
huggingface_model:
- url: https://huggingface.co/earthflow/DOFA
comments: The repository is MIT but the distributed checkpoints on Hugging Face carry CC-BY-4.0, which is the license that governs the weights. Verified 2026-09-10 via the repository README and LICENSE, the Hugging Face model repository and API, and the arXiv abstract.
