name: kubeflow-pipelines
display_name: Kubeflow Pipelines
type: software
description: Platform for building and running portable machine-learning workflows on Kubernetes. A pipeline
  is composed in Python from components whose inputs and outputs are typed ML artifacts - Model, Dataset, Metrics,
  ClassificationMetrics - and each component runs as a container step with an accelerator type and limit set
  on it. Runs, their artifacts and their lineage are tracked in ML Metadata.
github:
- url: https://github.com/kubeflow/pipelines
pypi:
- url: https://pypi.org/project/kfp/
comments: 'Built on Argo Workflows, which is excluded from this category: the difference is the typed ML artifact
  system in the KFP SDK, which Argo has no equivalent of.'
