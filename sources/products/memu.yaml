name: memu
display_name: memU
type: software
description: memU gives coding agents one personal memory shared across sessions, agents and devices. A scheduled
  task slices each host's session logs into jobs, the agent distills them under memU's instructions into Markdown
  memory and skill files, and memU indexes the result and retrieves relevant files before later tasks. It ships
  adapters for Codex, Claude Code, Cursor, OpenClaw and Hermes Agent. NevaMind AI builds it.
