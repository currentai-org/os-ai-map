name: furiosa-rngd
display_name: FuriosaAI RNGD
type: hardware
description: FuriosaAI RNGD, pronounced "renegade", is an inference accelerator built on FuriosaAI's tensor contraction
  processor architecture, with 48 GB of HBM3 on a 180 W PCIe card meant for air-cooled datacenters. It supports
  BF16, FP8, INT8 and INT4, and ships as single cards and in eight-card NXT RNGD servers.
