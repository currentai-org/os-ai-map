name: gemini-cli
display_name: Gemini CLI
type: software
description: Gemini CLI is Google's open-source terminal coding agent, bringing Gemini models into the shell
  for coding, debugging and task automation. It ships built-in tools for Google Search grounding, file operations,
  shell commands and web fetch, and extends through MCP and GEMINI.md system-prompt files. Since June 2026
  it serves paid Gemini API keys and Gemini Code Assist Standard and Enterprise organizations, while free individual
  users and Google AI Pro and Ultra subscribers moved to its Antigravity CLI.
github:
- url: https://github.com/google-gemini/gemini-cli
npm:
- url: https://www.npmjs.com/package/@google/gemini-cli
