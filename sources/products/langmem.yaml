name: langmem
display_name: LangMem
type: software
description: LangMem is a Python library that lets agents extract, consolidate and search long-term memories from
  their conversations, either through memory tools the agent calls during a chat or through a background manager
  that runs afterward. Its memory types include semantic facts and user profiles, episodic examples and procedural
  memory, where it rewrites the agent's own prompt. LangChain builds it, with native support for LangGraph's memory
  store.
github:
