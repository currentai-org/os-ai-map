name: minimax-hailuo
display_name: MiniMax Hailuo
type: model
description: MiniMax Hailuo is MiniMax's video generation line. Its downloadable model, MiniMax H3, is a 33B single-stream
  transformer that generates 4 to 15 second clips with 32 kHz stereo audio from text, first and last frames, or
  up to nine reference images, three video clips and three audio clips. The Hailuo 02 and 2.3 models, and the H3
  2K regeneration and context modules, are served only through MiniMax's app and API.
github:
