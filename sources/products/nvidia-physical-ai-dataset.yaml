name: nvidia-physical-ai-dataset
display_name: NVIDIA Physical AI Dataset
type: dataset
description: 'NVIDIA''s GR00T X-Embodiment Sim dataset, the most downloaded release in its Physical AI robotics
  collection, holds simulated trajectories used to post-train GR00T N1: bimanual Panda arms, the GR1 humanoid at
  tabletop tasks, single-arm kitchen manipulation and Unitree G1 loco-manipulation, published on the Hugging Face
  Hub.'
huggingface_dataset:
- url: https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-GR00T-X-Embodiment-Sim
comments: Scoped to the GR00T X-Embodiment Sim release. NVIDIA publishes about twenty other Physical AI robotics
  datasets, several of them under a non-commercial license, and none of them is scored here.
