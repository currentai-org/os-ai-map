name: vixsd
display_name: Vuk'uzenzele isiXhosa Speech Dataset (ViXSD)
type: dataset
description: The Vuk'uzenzele isiXhosa Speech Dataset (ViXSD) is about 10 hours of read isiXhosa speech in
  which eight native speakers, four men and four women, narrate articles from the Vuk'uzenzele corpus. Each
  of its 395 recordings comes with a transcript and speaker metadata on age, accent and linguistic background.
  Lelapa AI released it as the proof of concept for its community-centered Esethu Framework and license.
huggingface_dataset:
- url: https://huggingface.co/datasets/lelapa/Vukuzenzele_isiXhosa_Speech_Dataset_ViXSD
arxiv:
- url: https://arxiv.org/abs/2502.15916
