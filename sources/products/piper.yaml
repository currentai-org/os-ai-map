name: piper
display_name: Piper
type: software
description: A fast, local neural text-to-speech engine that embeds espeak-ng for phonemization, with a large catalog
  of downloadable voices and documented voice training. Its README lists Home Assistant and the NVDA screen reader
  among its users.
