name: scikit-image
display_name: scikit-image
type: software
description: Image-processing library for Python built on NumPy and SciPy, covering color conversion, exposure,
  filtering, morphology, feature detection, segmentation, geometric transforms, registration, restoration and
  measurement. It is a consensus-based community project governed by a steering council, widely used in scientific
  imaging.
github:
- url: https://github.com/scikit-image/scikit-image
pypi:
