description: Edge AI inference accelerator from Axelera AI in the Netherlands, built on a quad-core digital
  in-memory-compute architecture. Each Metis chip delivers up to 214 TOPS at about 15 TOPS per watt and is
  sold as M.2 modules, PCIe cards and single-board computers. The Voyager SDK supports more than 100 models.
