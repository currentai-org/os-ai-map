name: axelera-metis-aipu
display_name: Axelera Metis AIPU
type: hardware
description: Edge AI inference accelerator from Axelera AI in the Netherlands, built on a quad-core digital
  in-memory-compute architecture. Each Metis chip delivers up to 214 TOPS at about 15 TOPS per watt and is
  sold as M.2 modules, PCIe cards and single-board computers. The Voyager SDK supports more than 100 models.
github:
- url: https://github.com/axelera-ai-hub/voyager-sdk
  not_primary_channel: The Voyager SDK repository, the software toolkit for the accelerator, not the accelerator
    itself. Its star count measures attention to that repository rather than units in use, so it is not a channel
    the product ships through; adoption is read from reported traction instead.
