name: browser-tools-mcp
display_name: BrowserTools MCP
type: software
description: 'MCP server that lets a coding agent read what is happening in the user''s own Chrome session: console
  output, network requests, screenshots and Lighthouse audits for performance, accessibility and SEO. A DevTools
  extension attaches to the browser the user is already signed into rather than launching a fresh automated one,
  and the local connector listens only on loopback and strips credentials from what it captures.'
