name: afrobench
display_name: AfroBench
type: dataset
description: AfroBench is an evaluation suite for large language models covering 64 African languages, 15 tasks
  and 22 datasets. It carries AfriMMLU, AfriXNLI, AfriMGSM, AfriSenti, MasakhaNER, MasakhaNEWS, MasakhaPOS,
  AfriQA, MAFAND-MT, SALT, Uhura, InjongoIntent, NaijaRC, NollySenti, NTREX African and AfriADR, with lm-evaluation-harness
  configs and a public leaderboard. It is published from the McGill-NLP GitHub organization, with its data
  in a Masakhane collection.
github:
- url: https://github.com/McGill-NLP/AfroBench
huggingface_dataset:
- url: https://huggingface.co/datasets/masakhane/afrimmlu
- url: https://huggingface.co/datasets/masakhane/afrixnli
- url: https://huggingface.co/datasets/masakhane/afrimgsm
- url: https://huggingface.co/datasets/masakhane/afrisenti
- url: https://huggingface.co/datasets/masakhane/masakhaner-x
- url: https://huggingface.co/datasets/masakhane/masakhanews
- url: https://huggingface.co/datasets/masakhane/masakhapos
- url: https://huggingface.co/datasets/masakhane/afriqa-gold-passages
- url: https://huggingface.co/datasets/masakhane/mafand
- url: https://huggingface.co/datasets/masakhane/uhura-arc-easy
- url: https://huggingface.co/datasets/masakhane/InjongoIntent
- url: https://huggingface.co/datasets/masakhane/ntrex_african
- url: https://huggingface.co/datasets/masakhane/AfriADR
- url: https://huggingface.co/datasets/Sunbird/salt
arxiv:
- url: https://arxiv.org/abs/2311.07978
comments: Belebele, FLORES, SIB-200, MMMLU and XL-Sum are in the suite but are separate entries, so their repositories
  are not listed or counted here. NaijaRC and NollySenti sit in a personal Hugging Face namespace and are also
  left out.
