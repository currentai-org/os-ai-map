name: aembit-iam-for-agentic-ai
display_name: Aembit IAM for Agentic AI
type: software
description: Aembit IAM for Agentic AI decides which AI agents, acting for which users, may reach which MCP servers
  and tools. A managed authorization server issues OAuth 2.1 tokens under Aembit access policies, and an MCP Identity
  Gateway in the customer's environment checks every request against policy and exchanges credentials on the agent's
  behalf, so the agent never holds them. Aembit, a workload identity company, builds it.
