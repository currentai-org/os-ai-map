name: nvidia-ngc-catalog
display_name: NVIDIA NGC Catalog
type: software
description: NVIDIA's curated catalog of GPU-optimized containers, pretrained models, Helm charts and resources,
  published by NVIDIA and admitted third-party vendors such as Meta, Google and Mistral AI. Public entries
  download without sign-in through the web catalog, the NGC CLI or the API, as numbered versions. DGX and NVIDIA
  AI Enterprise customers also get a private registry for their own models.
