name: mcpb
display_name: MCP Bundles
type: software
description: 'A packaging format for local MCP servers: a zip archive carrying the server and a manifest describing
  it, so a desktop application can install one in a single click. Ships the bundle specification, a CLI that
  builds bundles, and the loader desktop clients use to verify them.'
github:
- url: https://github.com/modelcontextprotocol/mcpb
npm:
- url: https://www.npmjs.com/package/@anthropic-ai/mcpb
comments: Two things a reader will otherwise trip over. The project is mid-rename from DXT (Desktop Extensions)
  to MCPB (MCP Bundles) - the CLI and the npm package both moved, and the GitHub description still says Desktop
  Extensions - and its README still points at the old `anthropics/mcpb` URLs rather than the `modelcontextprotocol`
  org it now lives in. It is also the least recently pushed record in this category, at 2026-05-26. Verified
  2026-09-17 via the GitHub API, the README, the LICENSE body and the npm download API.
