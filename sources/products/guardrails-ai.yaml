name: guardrails-ai
display_name: Guardrails AI
type: software
description: Guardrails AI is a framework for input and output guards on LLM applications, with a hub of pre-built
  validators covering PII, toxicity, prompt injection and output format. It wraps a model call in guards that
  detect risks and enforce structured output, running as a self-hosted Python library.
github:
- url: https://github.com/guardrails-ai/guardrails
