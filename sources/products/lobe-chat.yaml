name: lobe-chat
display_name: Lobe Chat
type: software
description: Chat framework supporting OpenAI, Claude, Gemini, Ollama, Azure and DeepSeek among others, with
  knowledge bases, vision and text-to-speech, an MCP skill marketplace, agent groups and memory. It offers
  one-click deployment for self-hosting alongside a hosted tier. The repository has been rebranded from lobe-chat
  to lobehub.
github:
- url: https://github.com/lobehub/lobehub
comments: The licensing changed during 2026, so the openness axis follows the current LICENSE rather than the
