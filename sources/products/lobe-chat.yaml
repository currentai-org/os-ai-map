name: lobe-chat
display_name: Lobe Chat
type: software
description: Open chat framework supporting OpenAI, Claude, Gemini, Ollama, Azure and DeepSeek among others,
  with knowledge bases, vision and text-to-speech, an MCP skill marketplace, agent groups and memory. It offers
  one-click deployment for self-hosting alongside a hosted tier. The repository has been rebranded from lobe-chat
  to lobehub.
github:
- url: https://github.com/lobehub/lobehub
comments: The licensing terms moved during 2026 from an OSI-approved license to a non-OSI community license
  requiring a commercial grant to distribute derivative works; the openness axis follows the current terms.
  Verified 2026-08-13 via the lobehub repository and its LICENSE.
