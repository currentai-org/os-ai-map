name: liveportrait
display_name: LivePortrait
type: model
description: LivePortrait is a portrait-animation model from Kuaishou's Kling research team that turns a single
  still image of a face, human or animal, into video driven by the expressions and head pose of a reference clip.
  It uses implicit keypoints with stitching and retargeting control rather than diffusion, which makes it fast enough
  for real-time use, and supports video-to-video editing and regional control.
github:
- url: https://github.com/KlingAIResearch/LivePortrait
huggingface_model:
