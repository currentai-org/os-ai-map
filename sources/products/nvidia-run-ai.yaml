name: nvidia-run-ai
display_name: NVIDIA Run:ai
type: software
description: Enterprise platform for AI workloads and GPU orchestration. It pools GPU capacity across public
  clouds, private clouds, hybrid environments and on-premise data centres, allocates it dynamically including
  fractionally, and places AI workloads against quotas set per team.
comments: NVIDIA describes the open KAI Scheduler as 'based on NVIDIA Run:ai'; KAI now lives in its own GitHub
  organization and is scored separately on this map, so the open component is not credited to this record.
  The product page is dynamic and returned a different digest on two fetches an hour apart, so a re-fetch will
  read as drift.
