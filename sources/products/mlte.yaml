name: mlte
display_name: MLTE
type: software
description: MLTE (Machine Learning Test and Evaluation) is a framework and Python package for testing ML models
  against requirements agreed with stakeholders. Teams record requirements, collect evidence from measurements,
  and assemble it into reports, with an optional web interface and backend that store the artifacts. Its authors
  describe the framework in a 2023 IEEE/ACM paper.
comments: 'Tagged self-attested: its reports are generated by the team being evaluated.'
