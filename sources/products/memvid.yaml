name: memvid
display_name: Memvid
type: software
description: Memvid packages an agent's memory into a single portable .mv2 file holding content frames, full-text
  and vector indexes and a time index, so retrieval runs locally without a database server. An enrichment step extracts
  entity facts called memory cards and records how each value changes over time. Memvid, Inc. builds it as a Rust
  core with Python, Node.js and command-line packages.
