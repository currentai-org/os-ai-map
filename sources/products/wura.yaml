name: wura
display_name: WURA
type: dataset
description: WURA is a pretraining corpus of whole web and news documents in 16 African languages plus Arabic,
  English, French and Portuguese. Its builders audited mC4 for thirteen African languages to strip low-quality
  text and crawled additional verified news sources, keeping headlines and source URLs with each document.
  Castorini released it alongside the AfriTeVa V2 models it was built to train.
github:
- url: https://github.com/castorini/AfriTeVa-keji
huggingface_dataset:
- url: https://huggingface.co/datasets/castorini/wura
