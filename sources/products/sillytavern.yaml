description: Self-hosted chat front end for character and roleplay use, forked from TavernAI in 2023. It runs
  on Node.js and connects to many backends including KoboldAI, OpenAI, Claude and Mistral, with deep prompt
  engineering, lorebooks, group chats, image generation, text-to-speech, extensions and a visual-novel mode.
