name: common-corpus
display_name: Common Corpus
type: dataset
languages: [ara, deu, eng, fra, ita, jpn, kor, lat, nld, pol, rus, spa, zho]
description: Multilingual pretraining dataset of roughly 2.27 trillion tokens, assembled by PleIAs with partners
  including the AI Alliance from uncopyrighted or openly licensed content only. It is organized into six curated
  collections - public-domain books, government documents, academic content, code, semantic data and web text
  - with document-level provenance and toxicity filtering. Its card reports 33 languages with more than 1 billion
  tokens each.
huggingface_dataset:
- url: https://huggingface.co/datasets/PleIAs/common_corpus
lineage:
  derived_from:
  - public domain and openly licensed sources
  trains:
  - Pleias models
