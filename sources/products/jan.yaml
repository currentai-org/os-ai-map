name: jan
display_name: Jan
type: software
description: Jan is a cross-platform desktop app for running open-weights models entirely offline, with a chat
  interface, custom assistants, Projects with indexed files and MCP connectors. It also connects to cloud providers
  such as OpenAI and Anthropic, and serves a local OpenAI-compatible API on localhost:1337. Menlo Research
  builds it.
