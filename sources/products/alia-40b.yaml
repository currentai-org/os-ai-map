name: alia-40b
display_name: ALIA-40b
type: model
version_in_identity: BSC ships this as ALIA-40b; the size is the model's name
description: ALIA-40b is a 40.4B-parameter decoder-only transformer pretrained from scratch by the Barcelona
  Supercomputing Center on the MareNostrum 5 supercomputer, funded by Spain's Ministry for Digital Transformation
  and the Civil Service. It was trained on 9.37 trillion tokens across 35 European languages and 92 programming
  languages, oversampling Spanish, Catalan, Galician and Basque, and has 48 layers, a 32,768-token context
  and a 256,000-token vocabulary.
huggingface_model:
  - url: https://huggingface.co/BSC-LT/ALIA-40b
  - url: https://huggingface.co/BSC-LT/ALIA-40b-instruct-2606
github:
  - url: https://github.com/langtech-bsc/alia
comments: The record carries the current instruct build, ALIA-40b-instruct-2606, beside the base checkpoint.
  Openness is read on the base release. The earlier Salamandra family is not separately scored.
