name: canary
display_name: Canary
type: model
description: NVIDIA's multitask speech recognition and translation models. Canary 1B v2 transcribes 25 European
  languages and translates between English and 24 of them; Canary-Qwen-2.5B pairs the Canary encoder with a Qwen
  language model for English transcription.
huggingface_model:
- url: https://huggingface.co/nvidia/canary-1b-v2
- url: https://huggingface.co/nvidia/canary-qwen-2.5b
- url: https://huggingface.co/nvidia/canary-1b-flash
- url: https://huggingface.co/nvidia/canary-180m-flash
comments: The current checkpoints (1B v2, the Flash models and Canary-Qwen-2.5B) are CC-BY-4.0. The original canary-1b
  from 2024, superseded by them, was released under CC-BY-NC-4.0; openness follows the current line.
