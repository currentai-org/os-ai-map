name: azure-document-intelligence
display_name: Azure AI Document Intelligence
type: software
description: Managed document-processing service on Azure, formerly Form Recognizer, that converts documents
  into markdown or structured JSON with layout, tables, selection marks and key-value pairs, and supports custom
  models trained on a customer's own forms.
comments: Formerly named Form Recognizer; the product page carries the current name. Verified 2026-09-16 via
  the Azure product page.
