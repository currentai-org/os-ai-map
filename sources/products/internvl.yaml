name: internvl
display_name: InternVL
type: model
description: InternVL is Shanghai AI Laboratory's open vision-language model family, released by OpenGVLab from
  InternVL 1.5 through InternVL3.5 in sizes from 1B to 241B. InternVL3.5 handles single and multi-image input, documents
  and video, and adds GUI interaction and embodied-agent tasks, with a Flash variant for faster inference. Its multimodal
  preference data and reinforcement-learning code are published alongside the weights.
github:
