name: hunyuan
display_name: Hunyuan (Tencent Hy)
type: model
description: Hunyuan is Tencent's large language model line, released under the Tencent Hy name since
  2026. Hy3 is a 295B-parameter mixture-of-experts model with 21B active parameters and a 256K-token context,
  and Hy4 preview scales the design to 770B total and 49B active parameters with a one-million-token context.
  Both ship as instruct checkpoints with FP8 variants, aimed at coding, agent and office work.
