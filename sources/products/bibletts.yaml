name: bibletts
display_name: BibleTTS
type: dataset
description: BibleTTS is a text-to-speech corpus of studio-quality, single-speaker Bible readings at 48kHz,
  with up to 86 hours of aligned speech per language. OpenSLR hosts aligned audio and text for six languages,
  Akuapem Twi, Asante Twi, Ewe, Hausa, Lingala and Yoruba, and the paper covers four more without alignment.
  Researchers from Masakhane and Coqui built it from Biblica's open.bible recordings.
github:
- url: https://github.com/masakhane-io/bibleTTS
arxiv:
- url: https://arxiv.org/abs/2207.03546
comments: There is no Hugging Face copy; the data is distributed through OpenSLR resource 129.
