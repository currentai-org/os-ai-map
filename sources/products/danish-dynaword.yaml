name: danish-dynaword
display_name: Danish Dynaword
type: dataset
description: Danish Dynaword is a continually updated Danish pretraining corpus of more than 9 billion tokens,
  assembled only from openly licensed sources across legal text, parliament records, news, books, conversation,
  social media and the web, including the Bornholm and South Jutland dialects. Each source has its own datasheet,
  and contributors add new ones through a tested submission process. Danish Foundation Models maintains it.
huggingface_dataset:
- url: https://huggingface.co/datasets/danish-foundation-models/danish-dynaword
arxiv:
- url: https://arxiv.org/abs/2508.02271
