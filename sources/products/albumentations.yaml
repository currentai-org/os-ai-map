name: albumentations
display_name: Albumentations
type: software
description: Albumentations is a Python library of image augmentations for training computer-vision models, with more than
  70 transforms that apply consistently to images, masks, bounding boxes and keypoints. Its current line, AlbumentationsX,
  continues the MIT-licensed albumentations package, which is no longer maintained, under AGPL-3.0, and Albumentations LLC
  also sells a commercial license to the same code.
github:
- url: https://github.com/albumentations-team/AlbumentationsX
pypi:
- url: https://pypi.org/project/albumentationsx
