name: bielik
display_name: Bielik
type: model
description: Bielik is an open language model for Polish from the SpeakLeash Foundation, developed with the support
  of the ACK Cyfronet AGH computing center. Bielik 11B v3 extends Mistral 7B v0.2 to 11 billion parameters by duplicating
  layers, continues pretraining on Polish, English and other European languages, and is then instruction-tuned,
  preference-trained and refined with reinforcement learning.
