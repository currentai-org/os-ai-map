name: imbalanced-learn
display_name: imbalanced-learn
type: software
description: Resampling library for classification on imbalanced data, built on the scikit-learn estimator
  interface. It provides over-sampling (SMOTE and its variants, ADASYN), under-sampling (NearMiss, Tomek links,
  edited nearest neighbours), combined methods and imbalance-aware ensembles such as balanced random forests
  and RUSBoost. It is a scikit-learn-contrib project run by volunteer maintainers.
github:
- url: https://github.com/scikit-learn-contrib/imbalanced-learn
pypi:
- url: https://pypi.org/project/imbalanced-learn
