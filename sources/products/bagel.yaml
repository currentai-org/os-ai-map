name: bagel
display_name: BAGEL
type: model
description: BAGEL is ByteDance Seed's unified multimodal model, a decoder-only mixture-of-transformers with 7B
  active and 14B total parameters that both understands images and generates and edits them. It was pretrained on
  interleaved text, image, video and web data and extends to free-form visual manipulation and multiview synthesis.
  ByteDance publishes the training code.
github:
- url: https://github.com/ByteDance-Seed/Bagel
huggingface_model:
- url: https://huggingface.co/ByteDance-Seed/BAGEL-7B-MoT
arxiv:
- url: https://arxiv.org/abs/2505.14683
