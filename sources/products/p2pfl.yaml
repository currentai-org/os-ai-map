name: p2pfl
display_name: P2PFL
type: software
description: P2PFL is a Python library for decentralized federated learning, in which peers exchange model
  updates over a peer-to-peer network with gossip protocols instead of reporting to a central server. The same
  code runs as an in-memory or Ray simulation or across machines over gRPC, where mutual TLS admits only nodes
  holding certificates from a shared authority. It trains PyTorch, TensorFlow/Keras and JAX models and can
  add local differential privacy to outgoing updates.
github:
- url: https://github.com/p2pfl/p2pfl
pypi:
- url: https://pypi.org/project/p2pfl/
