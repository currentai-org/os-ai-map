name: roboflow-universe
display_name: Roboflow Universe
type: software
description: Roboflow Universe is Roboflow's public catalog of computer vision datasets that its users share, with
  models trained on them listed alongside. Each dataset version records its train, validation and test split and
  the preprocessing and augmentation applied. A version can be forked into another workspace or downloaded in the
  annotation format a training framework expects, through the web, an HTTP API or the roboflow Python package.
comments: The universe.roboflow.com pages refused automated fetches, so this entry is read from Roboflow's documentation
  and product page. Models listed on Universe are not scored separately.
