name: fedtree
display_name: FedTree
type: software
description: Federated learning system for gradient-boosted decision trees from Xtra Computing (MLSys 2023). It
  trains horizontal or vertical federated GBDTs as a standalone simulation or with separate distributed server and
  party binaries, on multi-core CPUs and GPUs, with homomorphic encryption, secure aggregation and differential
  privacy.
github:
- url: https://github.com/Xtra-Computing/FedTree
pypi:
