name: qualcomm-ai-hub-models
display_name: Qualcomm AI Hub Models
type: software
description: Qualcomm's catalog of machine learning models optimized for Snapdragon and other Qualcomm devices,
  browsable at aihub.qualcomm.com and installable as the qai-hub-models package. A CLI and Python API browse
  the catalog and fetch deployable assets per runtime and precision, and demos run locally in PyTorch. Compiling
  and profiling on real devices goes through the hosted Qualcomm AI Hub Workbench.
github:
- url: https://github.com/qualcomm/ai-hub-models
pypi:
- url: https://pypi.org/project/qai-hub-models/
comments: Qualcomm AI Hub Workbench, the hosted compile and profiling service, has no entry of its own; the
  features that depend on it are why the openness reading is open core. The package metadata still links quic/ai-hub-models,
  an earlier name of the same repository.
