name: character-ai
display_name: Character.AI
type: software
description: Consumer chat product built around user-created character personas, dialogue roleplay and conversational
  entertainment. Users define a character's persona and backstory, then hold extended conversations with it.
  The product runs on Character.AI's own models alongside licensed third-party ones, and is proprietary with
  no self-hosted option.
comments: Character.AI publishes no product page of its own that covers this, so the record rests on a third-party
  profile. Verified 2026-08-13 via the Business of Apps Character.AI statistics page.
