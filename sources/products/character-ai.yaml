name: character-ai
display_name: Character.AI
type: software
description: Consumer chat product centered on user-created character personas, dialogue roleplay, and
  conversational entertainment. ~20M MAU and ~6M daily visitors with two hours/day average engagement,
  one of the stickiest consumer AI surfaces; founders' team was acqui-hired by Google in 2024 but the
  product continues to operate.
comments: Character.AI consumer companion/roleplay chat app (web + mobile). Verified 2026-08-13 via the Business
  of Apps Character.AI statistics page. Proprietary chat UI over its own models + (post-Google-deal) licensed
  models; human-in-the-loop character chat. Business of Apps now reports 45M active users for September 2025
  and 75M+ downloads, replacing the ~20M MAU and ~28M mid-2024 peak this record was written against.
