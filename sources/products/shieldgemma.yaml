name: shieldgemma
display_name: ShieldGemma
type: model
description: Google DeepMind's content-safety classifier built on Gemma 2, shipped in 2B, 9B and 27B sizes.
  It predicts policy violations in English across four harm categories (sexually explicit, dangerous content,
  hate, harassment) for both prompts and responses, answering yes or no.
huggingface_model:
- url: https://huggingface.co/google/shieldgemma-2b
comments: The weights download only after an access request that requires agreeing to Google's usage license.
