name: apify-mcp-server
display_name: Apify mcp server
type: software
description: The Apify MCP server enables your AI agents to extract data from social media, search engines, maps,
  e-commerce sites, or any other website using thousands of ready-made scrapers, crawlers, and automation tools
  available on the Apify Store. The Apify Model Context Protocol (MCP) server at **mcp.apify.com** enables your
  AI agents to extract data from social media, search engines, maps, e-commerce sites, and any other website using
  thousands of ready-made scrapers, crawlers, and automation tools from Apify Store. It supports OAuth, allowing
  you to connect from clients like Claude.ai or Visual Studio Code using just the URL.
