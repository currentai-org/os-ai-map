name: hexabot
display_name: Hexabot
type: software
description: Automation and agent builder from Hexastack for multi-channel, multilingual conversational assistants.
  Flows are modeled visually or as YAML workflows with typed runtime contracts, memory and MCP integration
  points, and extensions add further capabilities.
github:
- url: https://github.com/hexabot-ai/Hexabot
npm:
- url: https://www.npmjs.com/package/@hexabot-ai/widget
  not_primary_channel: The embeddable chat widget a site drops into a page, not the self-hosted platform
    the product is. Hexabot ships as a Docker compose stack of the api, frontend and cli packages; installs
    of the widget count sites embedding a bot, which is a different population from deployments of Hexabot.
comments: The self-hosted community edition runs without a license key.
