name: wangchan-thai-instruct
display_name: WangchanThaiInstruct
type: dataset
description: WangchanThaiInstruct is a human-authored Thai instruction dataset for both instruction tuning
  and evaluation, covering four professional domains (medical, finance, retail and legal) and seven task types
  from summarization to multiple-choice QA. Annotators, domain experts and researchers wrote and checked it
  through a multi-stage quality-control process, and it has about 40,000 rows split into train and test sets.
  It is published by the VISTEC-depa AI Research Institute of Thailand.
huggingface_dataset:
- url: https://huggingface.co/datasets/airesearch/WangchanThaiInstruct
arxiv:
- url: https://arxiv.org/abs/2508.15239
