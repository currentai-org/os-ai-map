name: pi-coding-agent
display_name: Pi
type: software
description: Pi is a terminal coding agent built as a minimal, extensible harness. It ships read, write, edit and
  bash tools, works across many model providers with mid-session switching, and runs interactively, in print or
  JSON mode, over RPC or through a TypeScript SDK. Sub-agents, plan mode and permission controls are left to extensions,
  skills and installable Pi packages. Mario Zechner created Pi, and Earendil now owns and develops it.
comments: Read against earendil-works/pi; the old badlogic/pi-mono URL redirects there, as shittycodingagent.ai
  does to pi.dev. The earlier npm names are declared beside the current one, because existing installs still pull
  the deprecated @mariozechner/pi-coding-agent.
github:
- url: https://github.com/earendil-works/pi
npm:
- url: https://www.npmjs.com/package/@earendil-works/pi-coding-agent
- url: https://www.npmjs.com/package/@mariozechner/pi-coding-agent
- url: https://www.npmjs.com/package/@mariozechner/coding-agent
  not_primary_channel: The coding agent's first package name, published for four releases in October 2025 before
    the project moved to @mariozechner/pi-coding-agent. Nothing installs it now, so it is kept as a record of the
    name and left out of the download sum.
