name: rf-detr
display_name: RF-DETR
type: model
description: Real-time transformer object detector from Roboflow, released in sizes from Nano to 2XL with instance-segmentation
  and keypoint variants. The published sizes were found by neural architecture search, and the detection and segmentation
  heads were pretrained on Objects365 pseudo-labeled with SAM2. The rfdetr package fine-tunes and runs the checkpoints,
  and the two largest detection sizes ship separately under Roboflow's platform license.
github:
- url: https://github.com/roboflow/rf-detr
pypi:
