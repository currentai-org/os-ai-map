name: github-copilot-ide
display_name: GitHub Copilot (IDE)
type: software
description: AI pair-programmer integrated into VS Code, JetBrains, Neovim, and Visual Studio, offering
  inline code completion, chat, and code review against multiple model backends (OpenAI, Anthropic, Google).
  Differentiator is enterprise distribution via GitHub and tight IDE integration; ~4.7M paid subscribers
  and ~$1B ARR as of early 2026.
comments: GitHub Copilot (GitHub / Microsoft), proprietary in-IDE AI coding assistant (inline suggestions,
  chat, agent mode) across VS Code/JetBrains/etc. Closed counterpart in ui_api. Verified 2026-08-13 via the
  GitHub Copilot product page; the product page now also fronts a desktop app, a CLI and third-party agents
  over MCP.
