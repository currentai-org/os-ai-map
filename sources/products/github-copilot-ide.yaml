name: github-copilot-ide
display_name: GitHub Copilot (IDE)
type: software
description: AI pair-programmer built into VS Code, JetBrains, Neovim and Visual Studio, offering inline completion,
  chat, agent mode and code review against OpenAI, Anthropic and Google model backends. It is distributed through
  GitHub with enterprise administration, and is proprietary with no source release or self-hosted option.
comments: The product page now also fronts a desktop app, a CLI and third-party agents reached over MCP. Verified
  2026-08-13 via the GitHub Copilot product page.
