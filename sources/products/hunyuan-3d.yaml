name: hunyuan-3d
display_name: Hunyuan3D
type: model
description: Hunyuan3D is Tencent's family of image-to-3D models that generate a shape with one diffusion model
  and paint its texture with a second. The downloadable releases run from Hunyuan3D 2.0 and its mini and multi-view
  variants to Hunyuan3D 2.1, which adds a physically based material model and releases its training code. Hunyuan3D
  2.5 and the 3.x models are served only through Tencent Cloud and the Hunyuan3D site.
github:
