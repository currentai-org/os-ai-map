comments: 'The current release, Hunyuan3D 3.0, is hosted-only, and Hunyuan3D 2.5 was released as a technical
  report without weights; Hunyuan3D 2.1 remains downloadable under Tencent''s regional community license. It
  scores 1/closed on the current release, and the older open line trails it. A separate availability attribute
  that would record that gap is tracked in #727.'
