comments: The current release, Hunyuan3D 3.0, is hosted-only, and Hunyuan3D 2.5 was released as a technical report
  without weights; Hunyuan3D 2.1 remains downloadable under Tencent's regional community license. The openness reading
  follows the current release and is held for a ruling on how the map shows an open line one generation behind its
  vendor's closed flagship.
