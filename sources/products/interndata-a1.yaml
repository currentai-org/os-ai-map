name: interndata-a1
display_name: InternData-A1
type: dataset
languages: [eng]
description: 'InternData-A1 is a simulated robot manipulation dataset from Shanghai AI Laboratory: over 630k trajectories
  and 7,433 hours across four single- and dual-arm embodiments (Franka, AgileX Split ALOHA, ARX Lift-2 and an AgiBot robot),
  70 tasks and 227 scenes, generated by a physics-validated motion-planning pipeline and published in LeRobot format for pretraining
  vision-language-action policies.'
huggingface_dataset:
- url: https://huggingface.co/datasets/InternRobotics/InternData-A1
arxiv:
- url: https://arxiv.org/abs/2511.16651
comments: Scoped to InternData-A1. The InternRobotics organization also publishes InternData-M1 (a separate simulated dataset)
  and InternData-N1 (navigation), which are distinct releases and not part of this row. The card calls the dataset hybrid
  synthetic-real, but only the simulation data is released; the real-world post-training data is listed as to be released.
  The Hub card metadata carries no license field; the terms are in the gate text.
