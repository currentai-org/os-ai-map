name: marker
display_name: Marker
type: software
description: Document conversion pipeline that turns PDFs, images, Office documents and EPUB into Markdown, JSON
  and HTML, running layout analysis, table and equation recognition and OCR through a stack of purpose-trained models.
  Published by Datalab alongside a hosted API and an on-premises offering.
github:
- url: https://github.com/datalab-to/marker
pypi:
- url: https://pypi.org/project/marker-pdf
comments: The repository carries two licenses, Apache-2.0 over the code and a modified AI Pubs Open RAIL-M over
  the model weights the pipeline requires. Verified 2026-08-30 via the GitHub API, both LICENSE bodies and the pypistats
  API.
