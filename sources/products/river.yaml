name: river
display_name: River
type: software
description: Python library for online machine learning, where models learn from one observation at a time
  on streaming data instead of from a fixed dataset. It covers linear models, trees and forests, naive Bayes,
  nearest neighbors, clustering, anomaly and drift detection, recommendation, time-series forecasting, bandits
  and ensembles, with streaming metrics and preprocessing. It came from the merger of creme and scikit-multiflow.
github:
- url: https://github.com/online-ml/river
