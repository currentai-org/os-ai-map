name: morphic
display_name: Morphic
type: software
description: 'Answer engine with a generative interface: answers render source-credited inline components such
  as images, grids and headings from a streamed JSON specification rather than plain markdown. It supports
  several model providers and search backends, with chat history, shareable result URLs, file upload and guest
  mode, and deploys with Docker.'
