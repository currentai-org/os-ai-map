name: comma
display_name: Comma v0.1
type: model
description: Comma v0.1 is a 7B base model trained on 2 trillion tokens drawn entirely from the Common Pile
  v0.1, an 8TB corpus of public domain and openly licensed text, and released with the paper that describes
  that corpus. It exists to test whether competitive models can be trained without unlicensed data, and performs
  comparably to budget-matched models such as Llama 2 7B.
github:
- url: https://github.com/r-three/common-pile
