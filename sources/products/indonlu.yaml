name: indonlu
display_name: IndoNLU
type: dataset
description: IndoNLU is a benchmark for Indonesian natural language understanding with twelve tasks, from emotion
  and sentiment classification to part-of-speech tagging, named-entity recognition, keyphrase extraction, textual
  entailment and extractive QA. The task data comes from social media, reviews, news and Wikipedia, some of
  it labeled by Indonesian linguists. It shipped with the Indo4B pretraining corpus and the IndoBERT models,
  from a collaboration including Institut Teknologi Bandung, Universitas Indonesia, Gojek and Prosa.AI.
github:
