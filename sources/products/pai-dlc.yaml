name: pai-dlc
display_name: Alibaba Cloud PAI-DLC
type: software
description: Managed distributed training service in Alibaba Cloud's Platform for AI. Jobs are submitted as
  typed distributed training workloads - PyTorch, TensorFlow and others - onto resource quotas backed by GPU
  instances, and the service manages their queued, running and terminal states for the life of the run.
comments: Managed Alibaba Cloud service with no self-hostable implementation. Verified 2026-09-15 via the Alibaba
  Cloud PAI-DLC overview.
