name: stable-fast-3d
display_name: Stable Fast 3D
type: model
description: Stable Fast 3D (SF3D) is Stability AI's image-to-3D model. Built on TripoSR, it reconstructs a textured
  mesh from a single image with UV unwrapping, removes baked-in lighting and predicts material parameters, so the asset
  can be relit and dropped into a game engine while keeping TripoSR's speed.
github:
- url: https://github.com/Stability-AI/stable-fast-3d
huggingface_model:
- url: https://huggingface.co/stabilityai/stable-fast-3d
arxiv:
- url: https://arxiv.org/abs/2408.00653
comments: Released July 2024; the repository was last updated in January 2025. SPAR3D, Stability's later point-cloud-guided
  image-to-3D model, is a separate product. The weights sit behind an automatically approved click-through on Hugging
  Face.
