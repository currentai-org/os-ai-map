name: roblox-voice-safety-classifier
display_name: Roblox Voice Safety Classifier
type: model
description: Roblox Voice Safety Classifier scores short voice-chat clips for policy violations, working on the audio itself
  rather than a transcript. Version 3 takes 16 kHz clips of up to 30 seconds and scores eight categories, including harassment,
  discrimination, sexual content, profanity, requests for personal information and disruptive audio, in 30 languages. It is
  a 320M-parameter transformer distilled from a larger model Roblox trained on its own voice chat.
huggingface_model:
- url: https://huggingface.co/Roblox/voice-safety-classifier-v3
- url: https://huggingface.co/Roblox/voice-safety-classifier-v2
- url: https://huggingface.co/Roblox/voice-safety-classifier
comments: Versions 1 and 2 stay on Hugging Face as their own repositories and are counted here as earlier releases. The Roblox/voice-safety-classifier
  GitHub repository that also carried them says it is no longer updated.
