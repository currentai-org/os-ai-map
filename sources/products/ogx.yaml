name: ogx
display_name: OGX
type: software
description: 'Open agentic API server from Meta, launched as Llama Stack in 2024 and rebranded in 2026 as OGX.
  It is not an inference engine: it composes and routes to inference backends such as vLLM, Ollama and Bedrock,
  alongside vector stores, safety, tools and file storage, behind OpenAI- and Anthropic-compatible APIs, with
  unified interfaces for agents, fine-tuning and evaluation.'
comments: The rebrand carried continuous commit history across the rename, so this is the same project rather
  than a fork. Verified 2026-08-13 via the ogx-ai/ogx repository and the project's rename announcement.
