name: qwenpaw
display_name: QwenPaw
type: software
description: QwenPaw is a self-hosted personal assistant from the AgentScope team. It connects to multiple chat
  channels, supports MCP tools and plugins, keeps persistent memory across conversations, and offers a terminal
  UI alongside a desktop application. It installs from PyPI, a shell script, Docker, or a hosted deployment on Alibaba
  Cloud, the AgentScope platform or ModelScope.
