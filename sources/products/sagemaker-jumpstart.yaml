name: sagemaker-jumpstart
display_name: Amazon SageMaker JumpStart
type: software
description: Model catalog in Amazon SageMaker AI that onboards publicly available and proprietary foundation
  models from third-party providers and partners, alongside built-in algorithms. Models can be fine-tuned,
  evaluated and deployed to SageMaker endpoints from Studio or the Python SDK. Administrators create private
  hubs that curate a subset of the public catalog and add their own versioned models, notebooks and datasets.
comments: Bedrock Marketplace deploys onto SageMaker endpoints and is read as the same registry behind a second
  storefront, so it has no entry of its own.
