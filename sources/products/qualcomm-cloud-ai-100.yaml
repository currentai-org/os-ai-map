name: qualcomm-cloud-ai-100
display_name: Qualcomm Cloud AI 100 (incl. Ultra)
type: hardware
description: Qualcomm Cloud AI 100 is a line of inference accelerator cards for datacenter servers; the Ultra model
  puts 64 AI cores, 576 MB of SRAM and 128 GB of LPDDR4x on one 150 W PCIe card. Qualcomm pitches it at serving
  models of up to about 100 billion parameters on a single card, programmed through the Cloud AI SDK.
github:
