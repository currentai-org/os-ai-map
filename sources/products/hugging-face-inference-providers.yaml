name: hugging-face-inference-providers
display_name: Hugging Face Inference Providers
type: software
description: Hugging Face Inference Providers routes requests for models on the Hugging Face Hub to partner inference
  services, among them Cerebras, Groq, Fireworks, Together and Scaleway, through one API and one Hugging Face token.
  A router at router.huggingface.co exposes an OpenAI-compatible chat endpoint, and requests can name a provider
  or let the router choose one by speed or by price. Hugging Face bills provider rates with no markup.
