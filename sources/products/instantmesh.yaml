name: instantmesh
display_name: InstantMesh
type: model
description: InstantMesh is Tencent ARC Lab's image-to-3D model. A multi-view diffusion model first draws several views
  of the object in a single image, and a sparse-view reconstruction model then turns them into a textured 3D mesh, the
  whole run taking about ten seconds.
github:
- url: https://github.com/TencentARC/InstantMesh
huggingface_model:
- url: https://huggingface.co/TencentARC/InstantMesh
arxiv:
- url: https://arxiv.org/abs/2404.07191
comments: Released April 2024; the repository was last updated in January 2025 and no later InstantMesh release exists.
  The multi-view stage is a fine-tuned Zero123++ v1.2, whose base pipeline the inference script downloads from SUDO AI's
  Hugging Face account.
