name: sold
display_name: SOLD (Sinhala Offensive Language Dataset)
type: dataset
description: SOLD is a Sinhala offensive language dataset of 10,000 Twitter posts labeled by hand as offensive
  or not, with rationales marking the words behind each offensive label. Its companion SemiSOLD adds more than
  145,000 Sinhala tweets scored by classifiers trained on SOLD. The Sinhala-NLP group released both with an
  experiment codebase.
github:
- url: https://github.com/Sinhala-NLP/SOLD
huggingface_dataset:
- url: https://huggingface.co/datasets/sinhala-nlp/SOLD
- url: https://huggingface.co/datasets/sinhala-nlp/SemiSOLD
arxiv:
- url: https://arxiv.org/abs/2212.00851
