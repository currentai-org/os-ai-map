name: mem0
display_name: Mem0
type: software
description: Mem0 adds long-term memory to AI agents and assistants. It extracts facts from conversations with a
  language model, stores them with embeddings, and returns the relevant ones by user, agent or session before the
  next model call. Developers run it as a Python or TypeScript library, a self-hosted server, or the hosted Mem0
  Platform, all built by the company of the same name.
