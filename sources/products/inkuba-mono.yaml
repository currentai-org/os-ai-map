name: inkuba-mono
display_name: Inkuba-Mono
type: dataset
description: Inkuba-Mono is a monolingual text corpus for Hausa, Yoruba, Swahili, isiZulu and isiXhosa, about
  1.7 billion tokens compiled from public repositories on Hugging Face, GitHub and Zenodo. Swahili contributes
  about a billion tokens and Yoruba the fewest. Lelapa AI assembled it to pretrain its InkubaLM small language
  model.
huggingface_dataset:
- url: https://huggingface.co/datasets/lelapa/Inkuba-Mono
arxiv:
- url: https://arxiv.org/abs/2408.17024
