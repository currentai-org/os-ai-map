name: ace-step
display_name: ACE-Step
type: model
description: ACE-Step is an open music generation model family from the ACE Studio and StepFun collaboration that
  writes full songs, vocals included, from lyrics and a style prompt. ACE-Step 1.5 pairs a diffusion transformer,
  up to 4B parameters in its XL variants, with a language model that plans the song, and supports cover generation,
  repainting, completion and LoRA training.
