description: IndicSentiment tests sentiment classification of product reviews in 13 Indian languages. Annotators
  wrote reviews of real products in English, each discussing a chosen set of aspects so that the sentiment is not
  one-sided, and the reviews were then translated by hand into every language. It is one of the new test sets in
  the IndicXTREME benchmark and is published on its own on the Hub.
