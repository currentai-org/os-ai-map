name: supermemory
display_name: Supermemory
type: software
description: Supermemory extracts facts from conversations and documents into a graph of memories that it updates,
  extends and expires as new information arrives, and keeps a profile of each user that an agent can load in one
  call. Applications reach it through a hosted API, a downloadable local server, an MCP server and plugins for coding
  agents. The Supermemory team builds it.
comments: Read as the memory engine behind Supermemory's API. The public supermemoryai/supermemory repository holds
  the MCP server, plugins, framework wrappers and documentation around that engine, not the engine itself.
github:
- url: https://github.com/supermemoryai/supermemory
npm:
- url: https://www.npmjs.com/package/supermemory
pypi:
- url: https://pypi.org/project/supermemory
artifact_exceptions:
  pypi_repo_mismatch: The supermemory package is the official Python SDK for Supermemory's API, generated and published
    from supermemoryai/python-sdk; the product's declared repository is the vendor's main public repository, supermemoryai/supermemory.
