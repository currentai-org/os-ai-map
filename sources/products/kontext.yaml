name: kontext
display_name: Kontext
type: software
description: Kontext places a local daemon between coding agents such as Claude Code, Codex and Cursor and the tools
  they call, evaluating Cedar policy before supported actions run and recording each decision in a hash-linked ledger.
  Policies are written and rolled out from a hosted workspace, starting in observe mode before they enforce. Kontext,
  a Munich company, builds it.
github:
- url: https://github.com/kontext-security/kontext
