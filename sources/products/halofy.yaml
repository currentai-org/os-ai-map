name: halofy
display_name: Halofy
type: software
description: Halofy is a self-hostable kernel that governs what organizational context AI agents may read and write.
  Agents reach it over MCP or HTTP with credentials the server resolves into a namespace, actor and role, every
  read and write passes the same access checks, and each outcome, denials included, lands in an append-only audit
  log. It also stores durable context and issues signed erasure certificates. Halofy builds it.
github:
