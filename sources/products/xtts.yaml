name: xtts
display_name: XTTS
type: model
description: 'Coqui''s voice-cloning text-to-speech model: XTTS-v2 clones a voice from a six-second sample and speaks
  it in 17 languages, including across languages, with streaming output. It runs on the Coqui TTS engine, now maintained
  by Idiap as the coqui-tts package.'
huggingface_model:
- url: https://huggingface.co/coqui/XTTS-v2
- url: https://huggingface.co/coqui/XTTS-v1
arxiv:
- url: https://arxiv.org/abs/2406.04904
comments: 'Coqui, the company, has shut down: its website no longer resolves and the original repository is unmaintained,
  so XTTS-v2 is its last release.'
