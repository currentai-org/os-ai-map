name: openhands
display_name: OpenHands
type: software
description: Autonomous coding agent, formerly OpenDevin, that writes code, runs commands, browses the web
  and calls APIs to complete software-engineering tasks end to end. It executes inside a sandboxed runtime,
  works with many model providers by letting users supply their own API key, and ships an SDK for building
  on the agent directly.
github:
- url: https://github.com/OpenHands/OpenHands
  not_primary_channel: The product's source repository. Its star count measures attention to the code rather
    than use of the product, so it is not the channel adoption is read from; the band rests on reported traction.
