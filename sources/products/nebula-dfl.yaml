name: nebula-dfl
display_name: NEBULA
type: software
description: NEBULA is a platform for decentralized federated learning, formerly called Fedstellar, developed
  at the University of Murcia with armasuisse and the University of Zurich. A web frontend and a controller
  set up a federation on star, ring, mesh or custom topologies and deploy it as local processes, Docker containers
  or physical devices, with a core running on each participant. It adds differential privacy through Opacus,
  simulated attacks with reputation-based defenses, and trustworthiness metrics.
github:
- url: https://github.com/CyberDataLab/nebula
pypi:
- url: https://pypi.org/project/nebula-dfl/
comments: The slug carries a `-dfl` suffix, as the PyPI package does, because the bare name is a common word.
