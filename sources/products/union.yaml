name: union
display_name: Union.ai
type: software
description: Commercial AI runtime built on Flyte, deployed into the customer's own cloud rather than hosted
  by the vendor. It runs the same typed Python workflows Flyte does, adds managed control-plane services around
  them, and keeps data and models inside the customer's infrastructure.
comments: The commercial product beside Flyte, from the same organization; both are on this map, as ray and
  anyscale-fine-tuning already are.
