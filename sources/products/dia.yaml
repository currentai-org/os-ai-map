name: dia
display_name: Dia
type: model
description: 'Nari Labs'' dialogue text-to-speech models, which turn a transcript tagged with two speakers into English conversation,
  including nonverbal sounds such as laughter and coughing. Dia2, in 1B and 2B sizes, streams: it starts speaking before the
  whole text arrives and can be conditioned on earlier audio, up to two minutes per generation. The first Dia, a 1.6B model,
  generates the dialogue in one pass.'
