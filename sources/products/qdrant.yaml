name: qdrant
display_name: Qdrant
type: software
description: Qdrant is a vector database and similarity search engine written in Rust. It stores vectors with
  JSON payloads that queries can filter on, and supports dense, sparse and multivector search, hybrid queries
  and quantization. Teams run it self-hosted from a Docker image or use the managed Qdrant Cloud service.
github:
- url: https://github.com/qdrant/qdrant
pypi:
- url: https://pypi.org/project/qdrant-client
  not_primary_channel: The Python client for querying a running Qdrant server. Its installs can vary
    independently of server deployments, so its downloads measure the client rather than the database.
artifact_exceptions:
  pypi_repo_mismatch: qdrant-client is the Python client, published from qdrant/qdrant-client; the product
    is the vector database at qdrant/qdrant. The client's downloads are not a measure of server deployments,
    which is why the artifact is declared not_primary_channel.
