name: compliance-trestle
display_name: Compliance Trestle
type: software
steward: cncf
description: Compliance Trestle creates, validates and governs compliance documentation in NIST's OSCAL format,
  the machine-readable standard for control catalogs, profiles, component definitions and assessment results.
  It is built to run as a CI/CD pipeline over compliance artifacts kept in git, splitting large OSCAL documents
  into reviewable pieces. It is part of the OSCAL Compass project.
comments: 'Tagged self-attested: OSCAL documents validate against a public schema, but their content is the
  operator''s claim. A detached signing command exists as a beta feature.'
github:
- url: https://github.com/oscal-compass/compliance-trestle
pypi:
- url: https://pypi.org/project/compliance-trestle/
