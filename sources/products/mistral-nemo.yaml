name: mistral-nemo
display_name: Mistral NeMo
type: model
description: Mistral NeMo is a 12B-parameter language model that Mistral AI built with NVIDIA, released
  in July 2024 as base and instruct checkpoints with a 128K-token context window. It introduced Mistral's
  Tekken tokenizer, was trained for function calling and multilingual use, and was designed as a drop-in
  replacement for Mistral 7B.
huggingface_model:
- url: https://huggingface.co/mistralai/Mistral-Nemo-Instruct-2407
- url: https://huggingface.co/mistralai/Mistral-Nemo-Base-2407
comments: Mistral retired the hosted open-mistral-nemo API on July 31, 2026 and names Ministral 3 8B as
  its replacement. The open weights remain on Hugging Face, and this entry scores them.
