name: flaml
display_name: FLAML
type: software
description: Microsoft's fast AutoML and hyperparameter-tuning library. Given training data and a task type,
  its AutoML class searches across learners such as LightGBM, XGBoost, CatBoost, random forests, linear models
  and time-series models and their hyperparameters within a time budget, using cost-aware search methods, and
  can stack the results. Its tune module runs the same search over any user function.
github:
- url: https://github.com/microsoft/FLAML
