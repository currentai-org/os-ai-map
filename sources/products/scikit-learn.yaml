name: scikit-learn
display_name: scikit-learn
type: software
description: Python library of classical machine-learning estimators - linear and kernel models, support vector
  machines, trees and ensembles including gradient boosting, nearest neighbors, clustering, decomposition and outlier
  detection - under one fit and predict interface, with pipelines, model selection, metrics and preprocessing around
  them. A consensus-governed community project, first released by INRIA researchers in 2010.
