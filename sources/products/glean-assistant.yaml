name: glean-assistant
display_name: Glean Assistant
type: software
description: Glean Assistant is an enterprise AI assistant that answers questions, drafts documents and slide
  decks, and carries out multi-step work grounded in company data. It retrieves across a large set of enterprise
  connectors while enforcing each user's source-system permissions, and its Model Hub routes requests across
  open and proprietary LLMs. Sub-agents, skills and actions automate work across connected systems. Glean sells
  it as a hosted service.
comments: Agentic skills touch orchestration_agents, but the product is a human-driven assistant grounded in
  company data, so it stays in ui_api under the category litmus.
