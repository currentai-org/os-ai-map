name: glean-assistant
display_name: Glean Assistant
type: software
description: Enterprise assistant that grounds answers, drafts, slides and task execution in company context,
  retrieving over the Glean Enterprise Graph across enterprise connectors and respecting each user's permissions.
  A model hub routes across several frontier LLMs, and sub-agents and skills carry out multi-step work. It
  runs as single-tenant SaaS.
comments: Agentic skills touch orchestration_agents, but the product is a human-driven assistant grounded in
  company data, so it stays in ui_api under the category litmus. Verified 2026-08-13 via the Glean Assistant
  product page.
