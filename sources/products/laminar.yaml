name: laminar
display_name: Laminar
type: software
description: Observability platform built for AI agents, providing tracing, evaluation and analytics for agentic
  workflows with an emphasis on debugging multi-step runs. It has a Rust backend and a TypeScript UI, deploys
  from the repository's docker-compose files, and makes traces, spans, metrics and events queryable with SQL.
github:
- url: https://github.com/lmnr-ai/lmnr
pypi:
- url: https://pypi.org/project/lmnr
comments: The lmnr PyPI package is an OpenTelemetry auto-instrumentation SDK for the Laminar platform, so its
  download count does not band the product - a client whose install population varies independently of platform
  use measures its own users, per the measurement-population rule in docs/reference/adoption.md. The earlier
  reading here, that the count was mirror-inflated, was withdrawn on 2026-09-14 under issue 448; the figure
  is not disputed, it simply counts something else.
