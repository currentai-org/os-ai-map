name: wikipedia
display_name: Wikipedia
type: dataset
description: Cleaned article text from the Wikipedia dumps in more than 300 languages, one subset per language,
  published as Parquet in the wikimedia namespace on Hugging Face. The current release is a single dump
  from November 2023. Wikipedia text is a small but widely reused component of pretraining mixtures.
