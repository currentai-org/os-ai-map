name: dvc
display_name: DVC
type: software
description: DVC (Data Version Control) versions datasets and models by keeping their contents in external storage
  and their version metadata in Git, so a repository records which data produced which result. It also defines pipelines
  as a dependency graph and tracks experiment runs and metrics against them. A command-line tool and a VS Code extension
  are the two interfaces.
