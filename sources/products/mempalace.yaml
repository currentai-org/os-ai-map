name: mempalace
display_name: MemPalace
type: software
description: MemPalace stores an AI assistant's conversation history and project files as verbatim text and retrieves
  them with semantic search, without summarizing or extracting. It files content into wings for people and projects,
  rooms for topics and drawers for the original chunks, keeps a temporal knowledge graph in SQLite, and reaches
  agents through an MCP server and auto-save hooks for coding tools. Its contributors maintain it as a community
  project.
