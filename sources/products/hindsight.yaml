name: hindsight
display_name: Hindsight
type: software
description: Hindsight is an agent memory server that extracts facts, entities, relationships and time references
  from what an agent retains, consolidates them into evidence-backed observations and standing mental models, and
  answers recall and reflect queries through semantic, keyword, graph and temporal search. It runs from a Docker
  image, a Python package or an embedded bundle, with clients in several languages and a built-in MCP endpoint.
  Vectorize builds it.
github:
- url: https://github.com/vectorize-io/hindsight
pypi:
