name: midjourney
display_name: Midjourney
type: model
description: Midjourney is an independent research lab's image generation service, used through its website and
  Discord. Its models generate images from text and image prompts with style and mood references, and the service
  adds image editing and an image-to-video mode that animates still images into short clips.
comments: The arena lists Midjourney's V6 and V7 models; its newer V8 models had no arena entry when read.
