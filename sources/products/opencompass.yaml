name: opencompass
display_name: OpenCompass
type: software
description: Evaluation platform covering more than a hundred datasets across open and API models, with both
  objective scoring and subjective arena-style comparison. Its dataset list includes many Chinese-language
  benchmarks, and multimodal evaluation runs through the integrated VLMEvalKit. The project is developed at
  Shanghai AI Laboratory.
github:
- url: https://github.com/open-compass/opencompass
  not_primary_channel: The product's source repository. Its star count measures attention to the code rather
    than use of the product, so it is not the channel adoption is read from; the band rests on reported traction.
