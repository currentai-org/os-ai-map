name: opencompass
display_name: OpenCompass
type: software
description: Evaluation platform covering more than a hundred datasets across knowledge, reasoning, coding,
  science, language, long context and safety, run against open and API models through Hugging Face, LMDeploy,
  vLLM or hosted APIs. Evaluation methods include rule-based and LLM-as-judge scoring, and multimodal evaluation
  runs through the integrated VLMEvalKit.
github:
- url: https://github.com/open-compass/opencompass
  not_primary_channel: The product's source repository. Its star count measures attention to the code rather
    than use of the product, so it is not the channel adoption is read from; the band rests on reported traction.
