name: detectron2
display_name: Detectron2
type: software
description: Meta AI's library for object detection, segmentation and other visual recognition tasks, the successor
  to Detectron and maskrcnn-benchmark. It implements Faster and Mask R-CNN, RetinaNet, keypoint, panoptic and
  DensePose models among others, with a model zoo of COCO, LVIS and Cityscapes baselines and training tools
  that many research projects build on. It installs from source or from Linux wheels Meta hosts, not from PyPI.
github:
- url: https://github.com/facebookresearch/detectron2
