name: emilia-protocol
display_name: EMILIA Protocol
type: software
description: EMILIA Protocol is an open protocol and reference implementation for checking an AI agent's authority
  at the point where a consequential tool call would run. Its Gate binds each request to a mandate the owner defines,
  can require a passkey approval tied to the exact action, and refuses changed, replayed or unapproved calls. Signed
  receipts let a third party verify each decision offline. EMILIA Protocol, Inc. builds it.
github:
- url: https://github.com/emiliaprotocol/emilia-protocol
npm:
- url: https://www.npmjs.com/package/@emilia-protocol/gate
- url: https://www.npmjs.com/package/@emilia-protocol/verify
