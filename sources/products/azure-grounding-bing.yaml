name: azure-grounding-bing
display_name: Grounding with Bing Search (Microsoft Foundry)
type: software
description: 'Agent tool in Microsoft Foundry Agent Service that grounds a model''s answer in live Bing results.
  The developer never sees the search results: the agent formulates queries, Bing returns results to the model,
  and the model''s answer comes back with URL citations.'
comments: 'Product identity needs care here and the seeded URL made it worse. `/azure/ai-foundry/agents/how-to/tools/bing-grounding`
  200s but redirects to a page marked (classic), for agents that are deprecated and retire on 2027-03-31 -
  a naive liveness check passes while landing on a deprecation notice. The grounding SERVICE is not retiring:
  on the current agents API it is one of three siblings, alongside a Web Search tool that needs no Bing resource
  of your own and a preview Bing Custom Search. The platform was renamed from Azure AI Foundry to Microsoft
  Foundry.'
