name: icelandic-gigaword-corpus
display_name: Icelandic Gigaword Corpus
type: dataset
description: The Icelandic Gigaword Corpus (IGC) is a tagged and lemmatized corpus of Icelandic drawn from
  news media, parliamentary speeches back to 1911, laws, court judgments, journals, social media, books and
  Wikipedia. Its 2022 version holds about 2.4 billion running words, extended by yearly releases. A JSONL release
  of the openly licensed subcorpora, about 1.46 billion words, serves model training. The Árni Magnússon Institute
  for Icelandic Studies builds it.
huggingface_dataset:
- url: https://huggingface.co/datasets/arnastofnun/IGC-2024
