name: catalog-catalan-corpus
display_name: CATalog
type: dataset
description: CATalog is a Catalan pretraining corpus of about 17.45 billion words drawn from 26 sources, including
  filtered Common Crawl snapshots, news media, forums, digital libraries and public institutions. Every document
  carries a heuristic quality score from the CURATE pipeline, so users can filter at their own threshold instead
  of a fixed cut. The Language Technologies Unit at the Barcelona Supercomputing Center builds it for Projecte
  AINA.
huggingface_dataset:
- url: https://huggingface.co/datasets/projecte-aina/CATalog
