name: pi-permission-system
display_name: pi-permission-system
type: software
description: pi-permission-system is an extension for the Pi coding agent that checks every tool call, bash command,
  MCP target, skill and special operation against allow, ask or deny rules before it runs. Rules sit in global,
  project and per-agent files, where a project file may tighten a global deny but never relax it, and ask prompts
  from subagents are forwarded to the main session for a person to answer. MasuRii maintains it.
github:
- url: https://github.com/MasuRii/pi-permission-system
npm:
- url: https://www.npmjs.com/package/pi-permission-system
