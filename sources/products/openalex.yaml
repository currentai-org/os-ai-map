name: openalex
display_name: OpenAlex
type: software
description: Free catalog of the world's scholarly research, run by the nonprofit OurResearch, covering hundreds
  of millions of works with their authors, institutions, sources and funders. Its REST API searches works by keyword
  or by meaning, sorts them by relevance, and links each open-access work it holds a copy of to the full text as
  a PDF and as structured XML. The data is released under CC0, and the whole database can be downloaded as a free
  snapshot.
github:
- url: https://github.com/ourresearch/openalex-elastic-api
- url: https://github.com/ourresearch/openalex-walden
comments: Casual use of the API needs no key. A free key raises the daily allowance to $1 of usage, and heavier
  use is paid as you go or through annual plans; the help center says the data is free and what is sold is serving,
  freshness and support. The full-text cache covers open-access works only, and the PDFs keep their original copyright.
  The openalex.org website runs on the same public API, and its home page is a JavaScript application that points
  programmatic callers to help.openalex.org.
