name: azure-ai-model-inference
display_name: Azure AI Model Inference
type: software
description: Managed inference service exposing OpenAI models, open-weights models such as Llama, Mistral and
  Phi, and Microsoft's own models through one OpenAI-compatible REST endpoint. The endpoint switches between
  model deployments and applies content filtering, rate limiting and keyless authentication. Deployments run
  either serverless per token or on provisioned dedicated capacity.
comments: The beta Azure AI Inference SDK is deprecated and retires 26 August 2026 in favor of the OpenAI /v1
  API; the retirement banner is on the endpoints page. Verified 2026-08-13 via the Microsoft Foundry Models
  endpoints documentation.
