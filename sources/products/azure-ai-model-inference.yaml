name: azure-ai-model-inference
display_name: Azure AI Model Inference
type: software
description: Managed inference service that gives access to OpenAI models and open-weights models such as DeepSeek
  and Llama through a single endpoint per Azure resource. Each model is a named deployment with its own content
  filtering and rate limiting configuration, and requests authenticate with an API key or keylessly through
  Microsoft Entra ID. Deployments are billed per token, on reserved provisioned capacity, or as discounted
  batch jobs.
