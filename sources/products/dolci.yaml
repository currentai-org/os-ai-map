name: dolci
display_name: Dolci
type: dataset
languages: [acq, amh, apc, arb, ars, ary, arz, ben, ceb, dan, deu, ell, eng, eus, fil, fin, fra, gle, guj,
  hat, hau, hin, hun, ibo, ind, ita, jav, jpn, kan, kir, kor, kur, lit, mal, mar, mlg, msa, mya, nep, nld,
  nso, nya, pan, pes, pol, por, pus, rus, sin, sna, snd, som, spa, sqi, srp, sun, swa, swe, tam, tel, tha,
  tur, ukr, urd, vie, wol, xho, yor, zho, zul]
description: Ai2's post-training data suite for Olmo 3, with separate mixes for supervised fine-tuning, DPO
  preference tuning and reinforcement learning with verifiable rewards (RLVR) across the Instruct and Think
  variants. The mixes combine existing sets such as OpenThoughts 3, FLAN v2, OpenAssistant, Aya, Tulu 3 persona
  data and WildChat with new Ai2 prompts for precise instruction following, Python algorithms, logic puzzles
  and tool use.
huggingface_dataset:
- url: https://huggingface.co/datasets/allenai/Dolci-Instruct-SFT
lineage:
  derived_from:
  - OpenThoughts3-1.2M
  - flan-collection
  - oasst1
  - wildchat-1m
  - Tulu 3 persona sets
  - Aya dataset
  curated_with:
  - open-instruct
  trains:
  - olmo-instruct
comments: A family record covering the Dolci-Instruct and Dolci-Think SFT, DPO and RL sets.
