name: vals-ai
display_name: Vals AI
type: software
description: Independent benchmarking service that runs evaluations over finance, law, healthcare, coding,
  math, education, cybersecurity and games, and publishes composite indices alongside a leaderboard of frontier
  models. Vals says its scores are based on privately held test sets, kept private so models cannot be trained
  to them, and it has open sourced the infrastructure that runs the evaluations.
