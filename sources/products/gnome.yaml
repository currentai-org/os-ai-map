name: gnome
display_name: GNoME
type: model
description: GNoME is Google DeepMind's Graph Networks for Materials Exploration effort for inorganic-crystal discovery, released as a database of more than 520,000 materials within 1 meV per atom of the convex hull, alongside model definitions for the GNoME and NequIP architectures and Colab notebooks for exploring the data. The repository publishes architectures and discovered structures rather than trained weights.
github:
- url: https://github.com/google-deepmind/materials_discovery
comments: The Apache-2.0 label covers the notebooks and code; the database is CC BY-NC 4.0 and no trained checkpoint is distributed. Verified 2026-09-10 via the GitHub API and the repository README.
