name: agentops
display_name: AgentOps
type: software
description: Python SDK for AI agent monitoring and LLM cost tracking. It tracks multi-step agent sessions,
  tool calls, and costs across frameworks including CrewAI, Agno, OpenAI Agents SDK, LangChain, and Autogen,
  with setup in two lines of code. A self-hostable dashboard and API backend is available alongside the hosted
  app.
