name: dino
display_name: DINO (DINOv2, DINOv3)
type: model
description: Meta's self-supervised vision backbones, trained without labels to produce general image features.
  DINOv3, the current release, spans ViT models from 21 million to 7 billion parameters and ConvNeXt models,
  trained on 1.7 billion curated web images, with a satellite-imagery variant. Meta also publishes heads that
  turn the features into classification, depth, detection and segmentation, and dino.txt for text-prompted
  zero-shot tasks. DINOv2 was the Apache-licensed predecessor.
