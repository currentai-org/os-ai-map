name: anythingllm
display_name: AnythingLLM
type: software
description: All-in-one desktop and Docker application for private chat over local documents, combining retrieval-augmented
  generation, no-code agents with web browsing, and support for 40+ LLM providers including local Ollama. The
  desktop build bundles an embedder and vector database so it runs without configuration; the Docker build
  adds multi-user permissioning and embeddable widgets.
