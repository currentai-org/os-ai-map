name: espnet
display_name: ESPnet
type: software
description: An end-to-end speech processing toolkit built on PyTorch, with reproducible recipes that run from data preparation
  to evaluation for speech recognition, text-to-speech, speech translation, enhancement and separation, diarization, spoken
  language understanding and more. A command line transcribes, translates, synthesizes and enhances audio with published models,
  including the OWSM models for multilingual recognition and translation.
github:
- url: https://github.com/espnet/espnet
pypi:
- url: https://pypi.org/project/espnet
