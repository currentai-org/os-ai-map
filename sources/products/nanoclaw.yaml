name: nanoclaw
display_name: Nanoclaw
type: software
description: A lightweight alternative to OpenClaw that runs in containers for security. Connects to WhatsApp, Telegram,
  Slack, Discord, Gmail and other messaging apps,, has memory, scheduled jobs, and runs directly on Anthropic's
  Agents SDK. An AI assistant that runs agents securely in their own containers. Lightweight, built to be easily
  understood and completely customized for your needs.
