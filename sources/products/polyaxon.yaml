name: polyaxon
display_name: Polyaxon
type: software
description: Platform for running and tracking machine-learning workloads on Kubernetes. Operations are submitted
  to queues that route them to an agent managing a namespace or a whole cluster, with quotas, priorities and
  concurrency limits applied on the way. Polyaxon Community Edition carries the core platform; queues, RBAC
  and retention are part of the commercial editions.
github:
- url: https://github.com/polyaxon/polyaxon
pypi:
- url: https://pypi.org/project/polyaxon/
comments: The queue and scheduling documentation is marked as part of the commercial offering, so the capability
  band describes the product as sold rather than Community Edition alone. Verified 2026-09-15 via the repository,
  the enterprise license-key documentation and the PyPI download API.
