name: cula
display_name: cuLA
type: software
description: cuLA (CUDA Linear Attention) provides hand-tuned CUDA kernels, written in CuTe DSL and CUTLASS C++, for linear
  attention variants including GLA, KDA, GDN and Lightning Attention, targeting NVIDIA Hopper and Blackwell GPUs. It shares
  its interface with the flash-linear-attention library as an early-stage standalone precursor to a planned integration.
github:
- url: https://github.com/inclusionAI/cuLA
comments: Verified 2026-09-02 via the GitHub API and the LICENSE body.
