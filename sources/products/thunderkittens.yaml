name: thunderkittens
display_name: ThunderKittens
type: software
description: ThunderKittens is a CUDA-embedded framework of tile primitives for writing deep-learning kernels, built
  on the premise that kernels expressed over register and shared-memory tiles reach hand-written performance with
  far less code. Because it embeds in CUDA rather than replacing it, authors can drop to raw CUDA where the abstraction
  runs out. Stanford's Hazy Research group develops it.
github:
- url: https://github.com/HazyResearch/ThunderKittens
