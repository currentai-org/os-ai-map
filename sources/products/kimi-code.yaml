name: kimi-code
display_name: Kimi Code CLI
type: software
description: Kimi Code CLI — The Starting Point for Next-Gen Agents. Kimi Code CLI is an AI coding agent that runs
  in your terminal — it can read and edit code, run shell commands, search files, fetch web pages, and choose the
  next step based on the feedback it receives. It works out of the box with Moonshot AI’s Kimi models and can also
  be configured to use other compatible providers.
