name: c2pa-sdk
display_name: C2PA SDK (Content Authenticity Initiative)
type: software
description: 'The Content Authenticity Initiative''s open-source SDK for C2PA Content Credentials: it writes,
  signs and validates the cryptographically signed manifests that record where a piece of media came from and
  how it was edited, including whether AI generated it. The core is a Rust library, with Python bindings and
  a command-line tool built on it.'
comments: 'The Rust library and its Python bindings are treated as one product. Tagged independently verifiable:
  a reader validates the manifest''s signature against a trust list.'
github:
- url: https://github.com/contentauth/c2pa-rs
- url: https://github.com/contentauth/c2pa-python
pypi:
- url: https://pypi.org/project/c2pa-python/
crates:
- url: https://crates.io/crates/c2pa
