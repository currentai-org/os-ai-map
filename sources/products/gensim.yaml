name: gensim
display_name: Gensim
type: software
description: Python library for topic modeling, document indexing and similarity retrieval over large text
  corpora, streaming data so memory use does not grow with corpus size. It implements LDA, LSI, HDP and NMF
  topic models, word2vec, doc2vec and fastText embeddings, and similarity search, with a downloader for pretrained
  word vectors such as GloVe and fastText. It is in stable maintenance mode.
github:
- url: https://github.com/piskvorky/gensim
pypi:
- url: https://pypi.org/project/gensim
