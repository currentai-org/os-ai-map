name: ibm-spectrum-lsf
display_name: IBM Spectrum LSF
type: software
description: Commercial workload manager and job scheduler for distributed high-performance computing. Jobs
  declare what they need in LSF's own submit schema - a GPU count, mode, model and memory, or a resource requirement
  string naming physical GPUs and interconnect - and LSF's scheduler places each job on hosts whose advertised
  resources satisfy it, autoscaling onto cloud capacity where a site has configured it.
comments: 'IBM publishes LSF''s documentation on ibm.com/docs, which returns HTTP 403 to this repository''s
  fetcher on every header combination while serving curl normally - a TLS-level block rather than a policy,
  and the site is client-rendered besides. The evidence here is drawn from IBM-published sources that are reachable:
  the product page on ibm.com/products, and IBM''s own lsf-python-api examples on GitHub.'
