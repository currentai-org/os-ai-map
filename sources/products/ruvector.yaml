name: ruvector
display_name: RuVector
type: software
description: RuVector is a High Performance, Real-Time, Self-Learning Ai, Vector GNN, Memory DB built in Rust. RuVector
  is a Rust native memory substrate for agents that need to remember across sessions. It combines local semantic
  embeddings, persistent vector retrieval, graph relationships, explicit feedback learning, memory lifecycle controls,
  and optional shared memory.
