name: cuda-tile
display_name: CUDA Tile IR
type: software
description: CUDA Tile IR is NVIDIA's MLIR-based intermediate representation and compiler infrastructure for CUDA kernel
  optimization, providing a tile dialect, Python bindings and a bytecode format for expressing and lowering tile-based tensor
  computations that target NVIDIA tensor core units.
github:
- url: https://github.com/NVIDIA/cuda-tile
