description: IBM watsonx.governance is a closed AI governance product for inventorying models and agents, documenting
  them, assessing risk and capturing compliance evidence against policies and regulatory obligations. It is
  sold as SaaS on IBM Cloud and as enterprise software, and connects to IBM OpenPages for wider risk and compliance
  work.
comments: 'A closed comparator for the governance suites. Tagged self-attested: the evidence is the operator''s
