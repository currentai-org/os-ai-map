name: thai-exam
display_name: ThaiExam
type: dataset
description: 'ThaiExam is a Thai knowledge benchmark of multiple-choice questions taken from real examinations
  in Thailand: the grade-12 O-NET, the Investment Consultant licensing exam, TGAT, TPAT-1 and A-Level. It holds
  590 questions in total, and each exam includes five worked examples for few-shot prompting. The Typhoon team
  built it to evaluate the Typhoon Thai language models.'
huggingface_dataset:
- url: https://huggingface.co/datasets/typhoon-ai/thai_exam
arxiv:
- url: https://arxiv.org/abs/2312.13951
