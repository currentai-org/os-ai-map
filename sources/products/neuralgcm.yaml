name: neuralgcm
display_name: NeuralGCM
type: model
description: NeuralGCM is a hybrid machine-learning and physics atmospheric model from Google Research that couples learned parameterizations to the Dinosaur dynamical core. It runs weather forecasts and multi-decade climate simulations from ERA5 states, and ships deterministic checkpoints at three horizontal resolutions plus a stochastic one.
github:
- url: https://github.com/neuralgcm/neuralgcm
pypi:
- url: https://pypi.org/project/neuralgcm
comments: The repository README points to the documentation site, which is where the checkpoints, data preparation, and the limits of the released training code are described. Verified 2026-09-10 via the NeuralGCM documentation, repository, and GitHub API.
