name: yylo
display_name: YYLO
type: software
description: Command-line orchestrator for coding agents that runs each task in a dedicated
  branch and worktree, with typed task, validation, merge, and release-readiness boundaries
  and receipt-backed repository changes. It delegates model work to the coding agent the user
  installs and configures, ships repeatable command workflows, and distributes as the @yylo/cli
  npm package.
github:
- url: https://github.com/yylo-dev/yylo
npm:
- url: https://www.npmjs.com/package/@yylo/cli
comments: Verified 2026-09-13 via the yylo-dev/yylo repository, its LICENSE, and the npm
  registry download API.
