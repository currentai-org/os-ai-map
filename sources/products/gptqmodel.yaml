name: gptqmodel
display_name: GPT-QModel
type: software
description: GPT-QModel is a quantization toolkit for large language models with hardware-accelerated kernels for
  NVIDIA CUDA, AMD ROCm, Huawei Ascend NPUs, Intel XPUs and x86 and Apple CPUs. Quantized checkpoints load through
  Hugging Face Transformers, vLLM and SGLang. It continues the GPTQ line of post-training quantization work.
