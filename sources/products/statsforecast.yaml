name: statsforecast
display_name: StatsForecast
type: software
description: Nixtla's library of fast statistical forecasting models, compiled with numba and able to fit millions
  of series on Spark, Dask or Ray. It implements automatic ARIMA, ETS, CES and Theta selection, MSTL and TBATS
  for multiple seasonalities, GARCH, intermittent-demand models such as Croston and ADIDA, and baselines, about
  35 models in all. Nixtla's closed TimeGPT forecasting service is a separate product.
github:
- url: https://github.com/Nixtla/statsforecast
pypi:
- url: https://pypi.org/project/statsforecast
