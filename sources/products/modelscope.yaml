name: modelscope
display_name: ModelScope
type: software
description: Alibaba's hosted model community at modelscope.cn, with an international edition at modelscope.ai.
  Account holders publish models, datasets and Studio apps into repositories with public, internal or private
  visibility, versioned by branch, tag and commit. The hub serves downloads over git and an OpenAPI surface
  that the official modelscope-hub client and CLI wrap.
comments: Scored as the hosted hub. The open modelscope library and modelscope-hub client connect to it; neither
  contains the hub's server.
