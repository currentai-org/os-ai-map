name: perception-lm
display_name: Perception LM
type: model
description: Perception LM (PLM) is Meta FAIR's family of vision-language models for detailed image and video
  understanding, in 1B, 3B and 8B sizes that pair the Perception Encoder with Llama 3.2 and Llama 3.1 language
  models. It answers questions about images, documents, charts and video, including fine-grained and spatio-temporally
  grounded questions about what happens in a clip. Meta released it with its human-labeled video training data
  and the PLM-VideoBench benchmark.
huggingface_model:
- url: https://huggingface.co/facebook/Perception-LM-8B
- url: https://huggingface.co/facebook/Perception-LM-3B
- url: https://huggingface.co/facebook/Perception-LM-1B
arxiv:
- url: https://arxiv.org/abs/2504.13180
comments: 'The GitHub repository, facebookresearch/perception_models, is not declared: it also releases the
  Perception Encoder vision models, a separate entry under Apache-2.0 whose license does not cover the PLM
  checkpoints.'
