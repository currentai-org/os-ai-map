name: indic-rag-suite
display_name: Multilingual Indic RAG Suite
type: dataset
languages: [asm, ben, eng, guj, hin, kan, kas, mai, mal, mar, mni, nep, ori, pan, sat, tam, tel, urd]
description: The Multilingual Indic RAG Suite is a synthetic question-answering dataset of about 21.4 million examples
  in 17 Indian languages and English, built for retrieval-augmented generation. Llama 3.3 70B wrote each question,
  answer and reasoning trace from a Wikipedia paragraph, which is kept in the row with its title and URL. AI4Bharat
  publishes it on Hugging Face as one configuration per language.
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/Indic-Rag-Suite
