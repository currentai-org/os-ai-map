name: mimo-vl
display_name: MiMo-VL
type: model
description: MiMo-VL is Xiaomi's 7B vision-language model line, joining a native-resolution vision encoder to the MiMo-7B
  language model. It answers questions about images, documents and video and reasons step by step, with a switch that turns
  the long reasoning off. The 2508 release, the current one, ships as SFT and RL checkpoints and raised the line's image and
  video benchmark scores.
