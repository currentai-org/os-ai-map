name: local-studio
display_name: Local Studio
type: software
description: Control panel for VLLM, Sglang, llama.cpp, exllamav3. Local Studio is a local-first workstation for
  running, managing, and using self-hosted LLM backends. One machine can launch models, watch GPU/runtime state,
  chat with OpenAI-compatible endpoints, and run agent sessions against local or remote controllers. Version 2.0
  unifies day-to-day operation around Status, Workbench, Configure, and Usage instead of separate model, integration,
  and server surfaces.
github:
