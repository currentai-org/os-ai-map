name: hunyuanvideo-foley
display_name: HunyuanVideo-Foley
type: model
description: HunyuanVideo-Foley is Tencent's model for generating sound effects and ambient audio that match a video, guided
  by an optional text prompt. It was trained on a curated 100,000-hour text, video and audio collection and produces 48 kHz
  audio synchronized to what happens on screen. Tencent published it in August 2025, adding a smaller XL model that runs in
  8 GB of video memory in September.
github:
- url: https://github.com/Tencent-Hunyuan/HunyuanVideo-Foley
huggingface_model:
- url: https://huggingface.co/tencent/HunyuanVideo-Foley
arxiv:
- url: https://arxiv.org/abs/2508.16930
comments: Released under the Tencent Hunyuan Community License, which does not apply in the European Union, the United Kingdom
  or South Korea and needs a separate license above 100 million monthly active users. It loads Google's SigLIP 2 and LAION's
  CLAP encoders, both Apache 2.0. HunyuanVideo, Tencent's video generation line, is a separate entry.
