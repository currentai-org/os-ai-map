name: permit0
display_name: Permit0
type: software
description: Permit0 is a policy engine that decides AI agent actions before they run. It maps each tool call onto
  a published taxonomy of agent actions, scores it against risk rules, and allows it, blocks it or sends it to a
  person, writing each verdict to a signed audit chain. It hooks into Claude Code and OpenClaw, and ships an email
  pack for Gmail and Outlook.
github:
- url: https://github.com/permit0-ai/permit0
