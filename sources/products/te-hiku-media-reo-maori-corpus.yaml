name: te-hiku-media-reo-maori-corpus
display_name: Te Hiku Media te reo Māori corpus
type: dataset
description: Te Hiku Media's te reo Māori corpus is a labeled speech collection that the iwi broadcaster uses
  to build Māori speech recognition. It combines decades of archived radio interviews with native speakers,
  many now deceased, and sentences read aloud by the public through the Kōrero Māori site. Te Hiku Media keeps
  the data under Māori stewardship.
