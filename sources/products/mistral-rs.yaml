name: mistral-rs
display_name: mistral.rs
type: software
description: mistral.rs is an LLM inference engine written in Rust, exposing OpenAI-compatible and Anthropic-compatible
  endpoints from one binary. It carries paged attention, prefix caching, ISQ and UQFF quantization and multimodal
  support. It is not affiliated with Mistral AI.
github:
- url: https://github.com/EricLBuehler/mistral.rs
comments: The Rust and prebuilt-binary distribution is primary, so the PyPI wrapper is not declared as an artifact.
  Verified 2026-08-31 via GitHub, the LICENSE body and the repository README.
