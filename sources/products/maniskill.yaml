name: maniskill
display_name: ManiSkill
type: software
description: ManiSkill is a GPU-parallel robot simulation and training framework built on the SAPIEN engine. It
  renders RGB-D and segmentation observations at tens of thousands of frames per second on one GPU, lets every parallel
  environment hold a different scene, and ships manipulation, mobile-manipulation and humanoid tasks with real-to-sim
  environments for evaluating real-world policies.
github:
- url: https://github.com/mani-skill/ManiSkill
pypi:
- url: https://pypi.org/project/mani-skill
artifact_exceptions:
  pypi_repo_mismatch: The mani-skill package declares https://github.com/haosulab/ManiSkill, the repository's address
    before it moved to mani-skill/ManiSkill; same repository, stale metadata.
comments: The repository moved from haosulab/ManiSkill to mani-skill/ManiSkill; the PyPI metadata still points at
  the old address.
