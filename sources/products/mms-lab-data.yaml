name: mms-lab-data
display_name: MMS-lab data
type: dataset
description: MMS-lab is Meta's labeled speech corpus of New Testament readings in 1,107 languages, built for
  the Massively Multilingual Speech project. Recordings from Faith Comes By Hearing, goto.bible and bible.com
  were force-aligned with their texts chapter by chapter and filtered for quality, and nearly every recording
  has a single speaker. Meta trained its MMS recognition and synthesis models on it.
arxiv:
