name: veo
display_name: Veo
type: model
description: Veo is Google DeepMind's video generation model line, which generates video with native audio from
  text and image prompts. It is served through the Gemini API and Google's Flow filmmaking tool in standard, Fast
  and Lite tiers, with 4K output and portrait formats.
comments: Gemini Omni Flash, which Google presents as a separate Gemini model family and its default for video in
  the Gemini API, is not part of this entry.
