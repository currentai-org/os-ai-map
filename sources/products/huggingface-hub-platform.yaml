name: huggingface-hub-platform
display_name: Hugging Face Hub
type: software
description: Hosted platform at huggingface.co where any account holder publishes models, datasets and Spaces
  apps as Git repositories, versioned with commits, branches and tags. Full-text search indexes model and dataset
  cards, and an HTTP API with a published OpenAPI specification lets other tools list, create and download
  repositories by name. Hugging Face runs it with free public hosting and paid Team and Enterprise plans for
  private collaboration.
comments: Scored as the hosted Hub. The huggingface_hub Python client is a separate entry in ML frameworks,
  and Spaces, the app-hosting surface, is a separate entry in deployment.
