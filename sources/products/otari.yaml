name: otari
display_name: Otari
type: software
description: Open, self-hosted OpenAI-compatible LLM gateway from Mozilla AI. It puts one endpoint in front
  of 40+ providers with virtual API keys, budget enforcement and usage tracking, and ships server-side model-agnostic
  tools including sandboxed code execution in a Docker-isolated Python REPL. Built on Mozilla AI's any-llm,
  with a hosted platform running on the same core.
github:
- url: https://github.com/mozilla-ai/otari
