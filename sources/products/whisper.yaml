name: whisper
display_name: Whisper
type: model
description: OpenAI's open-weight speech recognition and translation model family, from tiny to large-v3 and the
  faster large-v3-turbo. It transcribes about 99 languages and translates speech into English, and it is the base
  that most open speech engines were first built to run.
github:
- url: https://github.com/openai/whisper
pypi:
- url: https://pypi.org/project/openai-whisper/
huggingface_model:
- url: https://huggingface.co/openai/whisper-large-v3-turbo
- url: https://huggingface.co/openai/whisper-large-v3
comments: The large-v3 checkpoints carry Apache-2.0 on the Hub and large-v3-turbo carries MIT, the same license
  as the openai/whisper code. OpenAI's hosted transcription models are a separate product, openai-speech.
