name: sesame-csm
display_name: CSM (Conversational Speech Model)
type: model
description: 'Sesame''s Conversational Speech Model: a speech generator with a Llama backbone and a small audio decoder
  producing Mimi codes, which conditions on the preceding conversation, text and audio, to speak with context-appropriate
  prosody. The released CSM-1B is a base model without a fixed voice.'
github:
- url: https://github.com/SesameAILabs/csm
huggingface_model:
- url: https://huggingface.co/sesame/csm-1b
comments: The repository has not been pushed to since May 2025; only the smallest of the three sizes Sesame trained is
  released.
