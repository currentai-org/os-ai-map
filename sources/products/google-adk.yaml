name: google-adk
display_name: Google Agent Development Kit (ADK)
type: software
description: Google's Agent Development Kit (ADK) is a code-first Python framework for building, evaluating
  and deploying AI agents. Agents carry instructions and tools, compose into multi-agent hierarchies,
  and run inside a graph-based workflow runtime with routing, loops, retries, shared state and human-in-the-loop
  steps. Tools can be Python functions, OpenAPI specs or MCP servers. Tuned for Gemini but model-agnostic,
  it has sibling versions in Java, Kotlin, Go and TypeScript.
github:
- url: https://github.com/google/adk-python
pypi:
