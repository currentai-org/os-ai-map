name: omi
display_name: omi
type: software
description: AI that sees your screen, listens to your conversations and tells you what to do. Omi captures your
  screen and conversations, transcribes in real-time, generates summaries and action items, and gives you an AI
  chat that remembers everything you've seen and heard. Works on desktop, phone and wearables. Fully open source.
