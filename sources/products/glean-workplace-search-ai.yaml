name: glean-workplace-search-ai
display_name: Glean Workplace Search AI
type: software
description: AI-powered workplace search across enterprise tools, returning permissions-aware results with
  generative answers. It combines an Enterprise Graph of company content with a Personal Graph of each user's
  context, and runs hybrid retrieval across connectors including Slack, Teams, Zoom, ServiceNow, Zendesk and
  GitHub. The search layer underpins Glean Assistant.
comments: Scored here as the human-facing search product rather than the assistant built on it. Verified 2026-08-13
  via the Glean product overview page.
