name: glean-workplace-search-ai
display_name: Glean Workplace Search AI
type: software
description: Glean Workplace Search AI is enterprise search that returns permissions-aware results and generative
  answers across a company's connected tools. An Enterprise Graph maps relationships across company content,
  and a large connector library brings in data from workplace applications. The search layer also powers Glean
  Assistant.
comments: Scored here as the human-facing search product rather than the assistant built on it.
