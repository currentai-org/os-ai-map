name: gemini-robotics
display_name: Gemini Robotics
type: model
description: 'Gemini Robotics is Google DeepMind''s family of closed robot foundation models: Gemini Robotics 2,
  a vision-language-action model that turns vision and language into motor control; Gemini Robotics ER 2, an embodied-reasoning
  model for spatial planning offered through the Gemini API; and On-Device 2, a lightweight version that runs locally
  on the robot.'
comments: The action model is available to a trusted-tester program; only the embodied-reasoning model is on the
  public API. No weights are distributed.
