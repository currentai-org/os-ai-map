name: tinyllama-chat
display_name: TinyLlama-1.1B-Chat-v1.0
type: model
aliases:
- tinyllama-1-1b-chat-v1-0
description: A 1.1B instruction-tuned chat model from the TinyLlama project, built on the Llama architecture and
  trained on 3T tokens for ~90 days on 16 A100-40G GPUs. It became the canonical sub-2B open chat baseline for edge
  and local-inference research, and is still one of the most-pulled chat checkpoints on the Hub two years
  after release.
huggingface_model:
- url: https://huggingface.co/TinyLlama/TinyLlama-1.1B-Chat-v1.0
comments: 1.1B chat model (Llama 2 architecture), DPO-aligned finetune of TinyLlama-1.1B (pretrained on 3T tokens).
  Released 2023/early-2024; v1.0. The card publishes no benchmark table, so capability rests on size and
  architecture rather than a score. Verified live 2026-08-13 via the HF model card.
