description: TinyLlama-1.1B-Chat-v1.0 is a 1.1B-parameter chat model that uses the Llama 2 architecture and
  tokenizer. It was fine-tuned on UltraChat and aligned with DPO on UltraFeedback, starting from a TinyLlama
  base pretrained on three trillion tokens.
huggingface_model:
- url: https://huggingface.co/TinyLlama/TinyLlama-1.1B-Chat-v1.0
comments: Supervised on UltraChat 200k and aligned on UltraFeedback. The card publishes no benchmark table,
  so capability is read from size and architecture rather than a score.
