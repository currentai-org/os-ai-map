name: le-chat
display_name: Le Chat
type: software
description: Mistral's consumer and enterprise assistant at chat.mistral.ai, offering web search, deep research
  across web and internal sources, file and canvas handling for documents, spreadsheets and presentations,
  and image generation. It runs primarily on Mistral's own models, and an on-premises deployment is offered
  to enterprises.
comments: Mistral renamed Le Chat to Vibe during 2026 and folded it into a single product alongside a coding
  agent, on the same URL and login. The slug here still reads le-chat; the rename is an identity question rather
  than an evidence one. Verified 2026-08-14 via Mistral's rename notice, the Vibe Work documentation and the
  Vibe product page.
