name: le-chat
display_name: Le Chat
type: software
description: Mistral's consumer and enterprise chat product at chat.mistral.ai, running primarily on Mistral's
  own models, with Flash Answers, web search and image generation. An on-premises deployment option is offered
  to enterprises. The chat product itself is proprietary, distinct from the model weights Mistral publishes.
comments: All three axes cite a single February 2025 press brief, which carries a download milestone and nothing
  about the license, source or feature set. Openness and capability are held for re-sourcing. Verified 2026-08-13
  via the TechCrunch Le Chat launch report.
