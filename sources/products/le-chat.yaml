name: le-chat
display_name: Le Chat
type: software
description: Le Chat is Mistral's assistant at chat.mistral.ai for individuals, teams and enterprises, offering
  web search with citations, deep research across the web and connected tools, file and canvas handling for
  documents, spreadsheets and presentations, image generation and voice input. Enterprise customers can deploy
  it on-premises, in a private cloud or on Mistral Cloud.
comments: Mistral now brands this product Vibe (Vibe for work), at the same URL and login; the entry keeps
  the Le Chat name.
