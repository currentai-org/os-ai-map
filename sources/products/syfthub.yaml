name: syfthub
display_name: SyftHub
type: software
description: SyftHub is a registry where people publish AI models and data sources as endpoints, and others find
  them, see what each one costs and requires, and query them from a web app, a Python SDK or an MCP server. Its
  retrieval aggregator sends a question to each chosen source on its owner's own Syft Space node and combines only
  the passages that come back into one answer. OpenMined builds it.
github:
- url: https://github.com/OpenMined/syfthub
pypi:
- url: https://pypi.org/project/syfthub-sdk/
comments: The earlier syft-hub-sdk repository holds a retired SDK. The current Python SDK is developed in this
  repository and publishes as syfthub-sdk.
