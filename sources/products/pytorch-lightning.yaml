name: pytorch-lightning
display_name: PyTorch Lightning
type: software
description: PyTorch Lightning is a training abstraction over PyTorch. Its Trainer and Fabric interfaces move the
  same model code between CPU, CUDA and Apple Silicon GPUs, TPUs, multi-GPU and multi-node runs without changing
  the model, and expose distributed strategies including DDP, FSDP and DeepSpeed together with mixed precision.
