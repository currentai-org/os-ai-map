name: surya-heliophysics
display_name: Surya
type: model
description: Surya is a NASA-IBM heliophysics foundation model trained on aligned observations from the Solar Dynamics Observatory's AIA and HMI instruments. Its spatiotemporal transformer works at the instruments' native image resolution and supports solar forecasting, segmentation, solar-wind prediction, spectral modeling, and parameter-efficient downstream adaptation.
