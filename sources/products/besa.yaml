name: besa
display_name: Besa
type: software
description: Besa is a TypeScript library that admits or refuses each consequential AI-agent action, such as a deploy,
  a deletion or a payment, against a signed contract bound to that exact action. Delegations can only narrow a parent's
  authority, and every allowed or denied call leaves signed evidence another party can verify. It runs in-process,
  as MCP middleware or as a self-hosted verifier, and is published by the developer dorigjo.
github:
- url: https://github.com/dorigjo/besa
npm:
- url: https://www.npmjs.com/package/@dorigjo/besa
