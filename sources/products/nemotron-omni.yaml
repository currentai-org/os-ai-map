name: nemotron-omni
display_name: Nemotron Nano Omni
type: model
description: Nemotron Nano Omni is NVIDIA's omni-modal reasoning model, a 30B-total, 3B-active mixture-of-experts
  that understands video, audio, images and text and answers in text. It reads video with its soundtrack, transcribes
  speech with word-level timestamps, parses long documents and drives computer interfaces, with tool calling in
  a 256K context. NVIDIA ships BF16, FP8 and NVFP4 builds.
