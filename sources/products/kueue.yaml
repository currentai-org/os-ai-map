name: kueue
display_name: Kueue
type: software
description: Kubernetes-native job queueing from the Kubernetes SIG, deciding when a job waits, when it is
  admitted so its pods may be created, and when it is preempted. Quotas and fair sharing are expressed per
  tenant over ResourceFlavors that describe heterogeneous hardware, and Topology-Aware Scheduling can pin a
  whole PodSet to nodes inside one rack or block.
github:
- url: https://github.com/kubernetes-sigs/kueue
comments: Ships as container images and a Helm chart with no package channel, so adoption bands on stars. Verified
  2026-09-15 via the repository, its recursive tree and the Kueue documentation.
