name: hdbscan
display_name: HDBSCAN
type: software
description: Density-based clustering library implementing HDBSCAN*, which finds clusters of varying density
  and labels noise points, with little parameter tuning. It also provides robust single linkage, GLOSH outlier
  scores, soft clustering, prediction for new points and branch detection inside clusters. It is a scikit-learn-contrib
  project with a scikit-learn interface.
github:
- url: https://github.com/scikit-learn-contrib/hdbscan
pypi:
- url: https://pypi.org/project/hdbscan
