name: nemo
display_name: NVIDIA NeMo Speech
type: software
description: 'NVIDIA''s PyTorch toolkit for training, fine-tuning and serving speech models: recognition, synthesis,
  speaker tasks and speech LLMs. It is the framework behind NVIDIA''s Parakeet, Canary and Magpie TTS models and
  installs as nemo-toolkit.'
github:
- url: https://github.com/NVIDIA-NeMo/Speech
pypi:
- url: https://pypi.org/project/nemo-toolkit/
comments: The repository moved from NVIDIA/NeMo to NVIDIA-NeMo/Speech, and NVIDIA/NeMo resolves to it; LLM training
  now lives in NeMo RL and Megatron-LM.
