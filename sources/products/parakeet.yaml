name: parakeet
display_name: Parakeet
type: model
description: NVIDIA's FastConformer transducer and CTC speech recognition models. The current Parakeet TDT 0.6B
  v3 transcribes 25 European languages with word-level timestamps and runs thousands of times faster than real time
  on a GPU; earlier checkpoints are English-only.
huggingface_model:
- url: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3
- url: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v2
- url: https://huggingface.co/nvidia/parakeet-ctc-1.1b
comments: Most checkpoints are CC-BY-4.0; five newer ones, parakeet-unified-en and the multitalker streaming model
  among them, use the NVIDIA Open Model License, which sits in the same license tier. Trained and served with NeMo
  Speech.
