description: Run agents like Hermes, LangChain Deep Agents, and OpenClaw more securely inside NVIDIA OpenShell with
  managed inference. NVIDIA NemoClaw is an open source reference stack for running supported AI agents more safely
  inside NVIDIA OpenShell sandboxes. It provides guided onboarding, managed inference, network policy, managed integrations,
  snapshots, and lifecycle operations through the NemoClaw CLI and its agent-specific aliases.
