name: stanza
display_name: Stanza
type: software
description: The Stanford NLP Group's Python library for linguistic analysis in many languages. Its neural
  pipeline does tokenization, multi-word token expansion, lemmatization, part-of-speech and morphological tagging,
  dependency and constituency parsing, named-entity recognition, sentiment and coreference, with pretrained
  models for about 80 languages trained on Universal Dependencies treebanks. Every module can be retrained
  on the user's data, and it also gives Python access to the Java CoreNLP toolkit.
github:
- url: https://github.com/stanfordnlp/stanza
pypi:
- url: https://pypi.org/project/stanza
