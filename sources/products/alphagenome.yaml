name: alphagenome
display_name: AlphaGenome
type: model
description: AlphaGenome is Google DeepMind's genomic sequence model for predicting gene expression, splicing, chromatin features, contact maps, and variant effects. It accepts sequences up to one million base pairs and produces most outputs at single-base-pair resolution through an API, a precomputed Atlas, and a gated downloadable checkpoint.
github:
- url: https://github.com/google-deepmind/alphagenome
huggingface_model:
- url: https://huggingface.co/google/alphagenome-all-folds
comments: The repository documents both API and local-checkpoint surfaces; the downloadable model remains subject to separate non-commercial terms. Verified 2026-09-10 via the Hugging Face API, model terms, and Google DeepMind repository.
