name: aifs
display_name: AIFS
type: model
description: AIFS is the European Centre for Medium-Range Weather Forecasts' data-driven forecasting system, a graph-neural-network encoder and decoder around a sliding-window transformer processor. AIFS Single v1.0 is the first operationally supported version, runs four times daily beside ECMWF's physics-based model, and ships its checkpoint alongside the Anemoi pretraining and fine-tuning configurations that produced it.
