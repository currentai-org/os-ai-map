name: dagu
display_name: Dagu
type: software
description: Self-hostable workflow orchestrator for teams whose main work isn't orchestration. Declarative YAML
  over your scripts, SSH commands, containers, etc; keep workflows separate from business logic. One binary, no
  database, runs on limited H/W resources. Alternative to Airflow / Cron / Job Scheduler.
github:
- url: https://github.com/dagucloud/dagu
