name: lfm-vl
display_name: LFM-VL
type: model
description: LFM-VL is Liquid AI's family of small vision-language models for on-device use, from 450M to 3B parameters, built
  on its LFM2 hybrid language models. The models read text and images, including several images at once, and handle OCR, document
  comprehension, object grounding and screen understanding. Liquid AI ships them with GGUF, ONNX and MLX builds for local
  inference.
