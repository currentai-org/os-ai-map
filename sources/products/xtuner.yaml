name: xtuner
display_name: XTuner
type: software
description: XTuner is a training engine for large mixture-of-experts models. Version 1 targets dropless MoE training
  at up to 1T parameters, long-sequence training through memory optimization rather than sequence parallelism, and
  FSDP-based throughput for MoE models above the 200B scale. It is maintained by Shanghai AI Laboratory.
