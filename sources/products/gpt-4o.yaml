name: gpt-4o
display_name: GPT-4o
type: model
version_in_identity: OpenAI markets GPT-4o as a distinct product, not a version of GPT
description: 'GPT-4o is OpenAI''s 2024 multimodal model, taking text and image input with a 128K context window
  and an October 2023 knowledge cutoff. It remains a live model in OpenAI''s API, without released weights,
  and is not deprecated there: only its first snapshot, from May 2024, is scheduled for removal, on October
  23, 2026. OpenAI withdrew GPT-4o from ChatGPT in February 2026.'
