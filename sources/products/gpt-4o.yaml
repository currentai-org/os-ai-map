name: gpt-4o
display_name: GPT-4o
type: model
version_in_identity: OpenAI markets GPT-4o as a distinct product, not a version of GPT
description: GPT-4o is OpenAI's 2024 multimodal foundation model, handling text, image and audio natively with
  a 128K context window and an October 2023 knowledge cutoff. It is served only through OpenAI's API, with
  no released weights. OpenAI removed it from ChatGPT in February 2026 after the GPT-5 line replaced it as
  the default, and it remains available to API developers.
