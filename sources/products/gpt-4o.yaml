description: 'GPT-4o is OpenAI''s 2024 multimodal model, taking text and image input with a 128K context window
  and an October 2023 knowledge cutoff. It is still served through OpenAI''s API, without released weights,
  but is deprecated there: its remaining snapshots are scheduled for removal on January 14, 2027, with GPT-6
  Luna named as the replacement, and the May 2024 snapshot is already shut down. OpenAI withdrew GPT-4o from
  ChatGPT in February 2026.'
