name: privatemode
display_name: Privatemode
type: software
description: Confidential-computing AI inference service from Edgeless Systems. Prompts are encrypted on the
  device and processed inside hardware-based Trusted Execution Environments on confidential VMs with Nvidia
  GPUs, so data stays encrypted during inference and the provider cannot read it; end-to-end remote attestation
  makes the guarantee checkable. It serves third-party open-weights models behind a chat interface and an OpenAI-
  and Anthropic-compatible API, aimed at regulated industries.
github:
- url: https://github.com/edgelesssys/privatemode-public
  not_primary_channel: The product's public component repository; people use the hosted service rather than
    the code. Its star count measures attention to the code rather than use of the product, so it is not the
    channel adoption is read from; the band rests on reported traction.
