name: include-benchmark
display_name: INCLUDE
type: dataset
description: INCLUDE is a multilingual knowledge and reasoning benchmark of four-option multiple-choice questions
  taken from local academic, professional and licensing exams in 44 languages. Because the questions come from
  each region's own exams rather than translated English tests, many probe regional knowledge. A smaller lite
  subset covers the same languages. It was built by EPFL and Cohere Labs researchers.
huggingface_dataset:
- url: https://huggingface.co/datasets/CohereLabs/include-base-44
- url: https://huggingface.co/datasets/CohereLabs/include-lite-44
arxiv:
- url: https://arxiv.org/abs/2411.19799
