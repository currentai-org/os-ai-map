name: smol
display_name: SMOL
type: dataset
description: SMOL is a Google suite of professionally translated training data for machine translation into
  more than 200 low-resource languages. It combines SmolSent, sentences picked for broad vocabulary coverage;
  SmolDoc, whole documents chosen for topic coverage, with factuality ratings; and the GATITOS word and phrase
  lexicon. Volunteers have added translations for further languages since the first release.
huggingface_dataset:
- url: https://huggingface.co/datasets/google/smol
arxiv:
- url: https://arxiv.org/abs/2502.12301
- url: https://arxiv.org/abs/2303.15265
