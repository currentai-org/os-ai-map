name: rt-detr
display_name: RT-DETR
type: model
description: Real-time end-to-end object detector family built on the DETR transformer design, which removes
  the non-maximum-suppression step that YOLO-style detectors need. The line began at Baidu and Peking University
  with RT-DETR and RT-DETRv2; RT-DETRv4, the newest member, distills features from a DINOv3 vision foundation
  model into small detectors. Checkpoints are trained on COCO, some pretrained on Objects365, and full training
  code ships for each version.
github:
- url: https://github.com/lyuwenyu/RT-DETR
huggingface_model:
- url: https://huggingface.co/PekingU/rtdetr_v2_r18vd
- url: https://huggingface.co/PekingU/rtdetr_r101vd_coco_o365
