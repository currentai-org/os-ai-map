name: cohere-embed
display_name: Cohere Embed
type: model
description: Cohere Embed is Cohere's family of embedding models, which turn text, images and mixed text-and-image
  inputs such as PDF pages into vectors in one shared space. The models support more than 100 languages, a
  128k-token context and Matryoshka output dimensions. They are sold through Cohere's Embed endpoint, Amazon
  SageMaker and Microsoft Foundry.
