name: traccia
display_name: Traccia
type: software
description: Traccia is an open-source Python SDK for OpenTelemetry-based tracing, evaluation and governance
  across AI agents and LLM applications, with automatic instrumentation for OpenAI, Anthropic and Gemini, guardrail
  detection, and EU AI Act and HIPAA-oriented evidence records. It exports traces as OTLP to any collector
  with no account required, while its prompt registry and persisted evaluation features connect to the separate,
  commercial Traccia platform at app.traccia.ai.
github:
- url: https://github.com/traccia-ai/traccia-py
pypi:
- url: https://pypi.org/project/traccia
comments: The scored product is the SDK, not the hosted platform, and all three axes describe the SDK. The
  published Apache-2.0 repository is the whole of what ships; the hosted app.traccia.ai platform is a separate
  product for the prompt registry and experiment persistence, not a withheld part of the SDK itself. The traccia
  PyPI package is declared as a measurement artifact because it is the SDK - installing it installs the scored
  product - and its PyPI project URLs point back at traccia-ai/traccia-py. Had the hosted platform been the
  scored product, the same package would have been a client and could not have been declared.
