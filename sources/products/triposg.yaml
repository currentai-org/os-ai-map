name: triposg
display_name: TripoSG
type: model
description: TripoSG is VAST's 1.5B-parameter rectified-flow transformer that generates a 3D mesh from a single
  image, decoding a signed distance field trained on two million curated image-SDF pairs. A distilled TripoSG-scribble
  variant generates shapes from a sketch and a text prompt for quick prototyping.
github:
- url: https://github.com/VAST-AI-Research/TripoSG
huggingface_model:
- url: https://huggingface.co/VAST-AI/TripoSG
- url: https://huggingface.co/VAST-AI/TripoSG-scribble
arxiv:
- url: https://arxiv.org/abs/2502.06608
comments: The repository's triposg directory carries code derived from Tencent's FlashVDM under Tencent's own community
  license, beside the MIT root license.
