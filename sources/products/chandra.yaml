name: chandra
display_name: Chandra
type: software
description: Document OCR and layout model from Datalab that converts PDFs and images into Markdown, HTML and
  JSON while preserving structure - reading order, tables, forms, handwriting and mathematical notation. It
  is the successor model to the same team's Marker pipeline and is served both as open weights and as a hosted
  API.
github:
- url: https://github.com/datalab-to/chandra
pypi:
- url: https://pypi.org/project/chandra-ocr/
comments: The code and the weights carry different licences; see the openness note.
