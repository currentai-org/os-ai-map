name: vertex-ai-gen-ai-evaluation-service
display_name: Vertex AI Gen AI Evaluation Service
type: software
description: Google Cloud's managed service for scoring generative-AI outputs, part of the Gemini Enterprise
  Agent Platform, using adaptive rubrics that generate per-prompt pass/fail tests, static rubrics, computation-based
  metrics such as ROUGE and BLEU, and custom Python function metrics. It covers models and agents, works with
  any model callable through LiteLLM, and builds evaluation datasets from uploaded files, production logs or
  synthetic data.
