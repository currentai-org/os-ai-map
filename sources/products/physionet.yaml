name: physionet
display_name: PhysioNet
type: software
description: PhysioNet is a publishing platform for de-identified biomedical and clinical data, run by the MIT Laboratory
  for Computational Physiology with NIH funding. Researchers submit databases, software and models that content
  editors review before publication. Each published version is fixed, most data is open while sensitive clinical
  records need credentialed access, and files download by versioned path over the web or from S3.
github:
- url: https://github.com/MIT-LCP/physionet-build
