name: agent2agent-protocol
display_name: Agent2Agent Protocol
type: software
steward: agentic-ai-foundation
description: Agent2Agent Protocol is an open protocol for communication and interoperability between opaque
  agentic applications. Where MCP connects agents to tools, A2A connects agents to other agents, defining task
  delegation, status updates and result passing between autonomous systems. Contributed by Google and hosted
  by the Linux Foundation, it has reference SDKs in Python, Go, JavaScript, Java, .NET and Rust, and integrations
  in Azure AI Foundry, Copilot Studio and Amazon Bedrock AgentCore.
github:
- url: https://github.com/a2aproject/A2A
pypi:
- url: https://pypi.org/project/a2a-sdk
npm:
- url: https://www.npmjs.com/package/@a2a-js/sdk
comments: The protocol has no package of its own, so its two most-installed reference SDKs are declared
  here as the channels adoption is read from, the same way ag-ui declares its SDK packages.
