name: bedrock-guardrails
display_name: Amazon Bedrock Guardrails
type: software
description: Amazon Bedrock Guardrails is a managed AWS service of configurable policies covering denied topics,
  content and word filters, PII redaction, prompt-attack detection, contextual-grounding checks and Automated
  Reasoning checks, applied to any Bedrock model. Through the ApplyGuardrail API the same policies can screen
  models hosted outside Bedrock, though the guardrail itself runs at AWS.
