name: mace
display_name: MACE
type: model
description: MACE is ACEsuit's equivariant message-passing framework for machine-learning interatomic potentials, shipping a full data-preprocessing, training, and fine-tuning pipeline alongside a series of pretrained foundation models covering 89 elements. The foundation checkpoints span inorganic materials, organic molecules, electrostatics, and cross-domain models, and are released under different licences from the code.
github:
- url: https://github.com/ACEsuit/mace
pypi:
- url: https://pypi.org/project/mace-torch
comments: The repository is MIT, but the checkpoints are not — the newer foundation models ship under the Academic Software Licence, and the README says as much. Verified 2026-09-10 via the GitHub API, the repository README and LICENSE body, and the ASL text.
