name: spacy
display_name: spaCy
type: software
description: Python and Cython library for production natural language processing, running pipelines for tokenization,
  part-of-speech tagging, dependency parsing, named entity recognition, text classification, lemmatization and entity
  linking across more than 70 languages. It ships trained pipelines, a training system for custom ones and transformer
  support. Built by Explosion, which sells the separate Prodigy annotation tool and consulting.
github:
- url: https://github.com/explosion/spaCy
pypi:
- url: https://pypi.org/project/spacy
