name: x402
display_name: x402
type: software
description: x402 is an open standard for internet-native payments built on the HTTP 402 Payment Required
  status code. A server answers an unpaid request with its payment terms, the client signs a payment and
  retries, and a facilitator verifies and settles it, so APIs and content can charge AI agents and other
  clients per request without accounts or API keys. The repository holds the specification and reference
  SDKs for TypeScript, Python and Go. Coinbase created it, and the x402 Foundation now stewards it.
github:
- url: https://github.com/x402-foundation/x402
pypi:
- url: https://pypi.org/project/x402/
npm:
- url: https://www.npmjs.com/package/@x402/core
comments: 'The protocol has no package of its own, so its reference SDKs are declared as the channels
  adoption is read from: x402 on PyPI and @x402/core on npm.'
