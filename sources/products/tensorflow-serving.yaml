name: tensorflow-serving
display_name: TensorFlow Serving
type: software
description: TensorFlow Serving is a serving system for machine learning models in production, handling the inference
  side of the lifecycle with a batching scheduler and gRPC and HTTP endpoints. It integrates with TensorFlow models
  out of the box and can be extended to serve other model types.
github:
- url: https://github.com/tensorflow/serving
pypi:
- url: https://pypi.org/project/tensorflow-serving-api
comments: The `tensorflow-serving-api` package names this project by its homepage rather than its repository, so
  a repository-link check does not establish ownership; its author is Google Inc. and its summary is "TensorFlow
  Serving Python API". Verified 2026-08-31 via GitHub, the LICENSE body, the repository README and the PyPI project
  metadata.
