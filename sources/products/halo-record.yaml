name: halo-record
display_name: Halo Record
type: software
description: 'Halo Record keeps a tamper-evident audit trail of what an AI agent did: every tool call, model
  call, data access and approval becomes a record in an append-only, hash-chained log, rendered as a self-verifying
  report a customer can check. Checkpoints can be anchored to an outside witness or an RFC 3161 timestamp authority.
  The package is the reference implementation of an open record format.'
comments: 'Tagged independently verifiable, with the limit its own documentation states: the chain alone cannot
  catch the party running the recorder unless a checkpoint was shared.'
github:
- url: https://github.com/bkuan001/halo-record
pypi:
- url: https://pypi.org/project/halo-record/
