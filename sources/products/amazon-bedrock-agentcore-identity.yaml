name: amazon-bedrock-agentcore-identity
display_name: Amazon Bedrock AgentCore Identity
type: software
description: Amazon Bedrock AgentCore Identity registers each AI agent as a workload identity and keeps the OAuth
  tokens and API keys it needs in a token vault, away from agent code. Agents reach AWS resources and services such
  as Slack or GitHub as themselves or on a user's behalf, including through an on-behalf-of exchange that scopes
  a token down to one downstream resource. It is one of AWS's AgentCore services.
