name: agent-client-protocol
display_name: Agent Client Protocol
type: software
description: A protocol for connecting any editor to any agent. The Agent Client Protocol (ACP) standardizes communication
  between _code editors_ (interactive programs for viewing and editing source code) and _coding agents_ (programs
  that use generative AI to autonomously modify code).
