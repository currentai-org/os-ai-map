name: agent-client-protocol
display_name: Agent Client Protocol
type: software
description: Open protocol standardizing how a code editor talks to a coding agent, so any editor can drive
  any agent over one JSON-RPC interface. Published by Zed with a Rust schema crate and a TypeScript library
  alongside the specification.
github:
- url: https://github.com/agentclientprotocol/agent-client-protocol
crates:
- url: https://crates.io/crates/agent-client-protocol
comments: 'It sits beside MCP rather than competing with it: MCP standardizes how an agent reaches tools; this
  standardizes how an editor reaches an agent.'
