name: 101-billion-arabic-words
display_name: 101 Billion Arabic Words
type: dataset
description: The 101 Billion Arabic Words Dataset is a pretraining corpus of Arabic web text, mixing Modern
  Standard Arabic and dialects, for training and fine-tuning language models. Arabic content was extracted
  from Common Crawl WET files, then cleaned and deduplicated, yielding about 101 billion words in 33 million
  documents. It is curated by the Clusterlab team.
huggingface_dataset:
- url: https://huggingface.co/datasets/ClusterlabAi/101_billion_arabic_words_dataset
arxiv:
- url: https://arxiv.org/abs/2405.01590
