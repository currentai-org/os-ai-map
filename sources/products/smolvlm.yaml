name: smolvlm
display_name: SmolVLM
type: model
description: SmolVLM is Hugging Face's family of small vision-language models, from 256M to 2.2B parameters, built
  on the Idefics3 architecture for on-device use. The models caption, answer questions about and transcribe text
  from interleaved images, and SmolVLM2 adds video. Hugging Face publishes the training code in its smollm repository.
