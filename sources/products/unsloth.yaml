name: unsloth
display_name: Unsloth
type: software
description: Unsloth is a fine-tuning library that trains language, diffusion, speech and embedding models
  with custom Triton kernels for faster training and lower VRAM use. Supported methods include LoRA, QLoRA,
  full fine-tuning, pretraining, GRPO reinforcement learning and DPO preference tuning, and trained models
  export to formats including GGUF. Unsloth runs as code through Unsloth Core, or through the Unsloth Studio
  web UI and a desktop app.
github:
- url: https://github.com/unslothai/unsloth
pypi:
- url: https://pypi.org/project/unsloth
