name: mangosteen
display_name: Mangosteen
type: dataset
languages: [tha]
description: Mangosteen is an open Thai pretraining corpus of about 47 billion tokens. Most of it is Thai Common
  Crawl and FineWeb2 text passed through a Dolma pipeline adapted for Thai, with rule-based language identification,
  revised quality filters and filters for gambling and adult content. About 1.5 billion tokens come from curated
  non-web sources such as Wikipedia, Royal Gazette texts, OCR-extracted books and CC-licensed YouTube subtitles.
  VISTEC and AI Singapore researchers built it for the WangchanLION v3 model.
huggingface_dataset:
- url: https://huggingface.co/datasets/aisingapore/WangchanLION-Web
- url: https://huggingface.co/datasets/aisingapore/WangchanLION-Curated
arxiv:
- url: https://arxiv.org/abs/2507.14664
comments: AI Singapore publishes the corpus on the Hub as WangchanLION-Web and WangchanLION-Curated. The cleaning
  pipeline and the full list of curated sources are in the vistec-AI/Mangosteen repository on GitHub.
