name: ag-ui
display_name: AG-UI Protocol
type: software
description: Open event-based protocol standardizing how an AI agent connects to a user-facing application.
  Agent backends emit one of about sixteen standard event types over any transport, and front ends consume
  them through community SDKs in eight languages.
github:
- url: https://github.com/ag-ui-protocol/ag-ui
pypi:
- url: https://pypi.org/project/ag-ui-protocol
npm:
- url: https://www.npmjs.com/package/@ag-ui/core
comments: 'The fourth specification on this map and the one that completes the set its own README describes:
  "MCP gives agents tools / A2A allows agents to communicate with other agents / AG-UI brings agents into user-facing
  applications". Born from CopilotKit''s partnership with LangChain and CrewAI, and its MIT copyright line
  names no holder.'
