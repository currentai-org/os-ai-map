name: mlrun
display_name: MLRun
type: software
description: Open-source MLOps platform for building and running continuous machine-learning and generative-AI
  applications. Functions are declared in Python and executed as jobs on Kubernetes, with pipelines, a feature
  store, artifact and model tracking, and real-time serving graphs over the same objects. It is the open core
  beneath Iguazio's commercial platform.
github:
- url: https://github.com/mlrun/mlrun
pypi:
- url: https://pypi.org/project/mlrun/
comments: Iguazio, acquired by McKinsey, sells a managed platform beside the open project.
