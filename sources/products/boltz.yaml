name: boltz
display_name: Boltz
type: model
description: Boltz is a family of biomolecular interaction models. Boltz-1 predicts the structure of biomolecular
  complexes, and Boltz-2 jointly models complex structure and binding affinity, reporting a log10(IC50) value
  alongside a binder-versus-decoy probability. It runs from a YAML specification of the complex, optionally
  pulling MSAs from a ColabFold server.
github:
- url: https://github.com/jwohlwend/boltz
