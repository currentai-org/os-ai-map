name: boltz
display_name: Boltz
type: model
description: Boltz is a family of biomolecular interaction models. Boltz-1 was the first fully open-source model to approach AlphaFold 3 accuracy, and Boltz-2 jointly models complex structure and binding affinity, reporting a log10(IC50) value alongside a binder-versus-decoy probability. It runs from a YAML specification of the complex, optionally pulling MSAs from a ColabFold server.
github:
- url: https://github.com/jwohlwend/boltz
pypi:
- url: https://pypi.org/project/boltz
comments: Code and weights are both MIT, and the training corpus, preprocessing pipeline and training configs are published for Boltz-1; the equivalents for Boltz-2 are announced as coming but have not shipped. Verified 2026-09-10 via the GitHub API, the README, the LICENSE body, and the training documentation.
