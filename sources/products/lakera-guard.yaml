name: lakera-guard
display_name: Lakera Guard
type: software
description: Lakera Guard is a real-time API that screens LLM application and agent traffic for prompt injection,
  jailbreaks, data leakage, harmful content and off-policy tool use. Check Point, which acquired Lakera, now
  sells it as AI Guardrails, the runtime layer of its AI Agent Security product, alongside workforce-AI security
  and red teaming. It runs as a hosted service or a licensed self-hosted container.
