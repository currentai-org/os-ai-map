name: grantex
display_name: Grantex
type: software
description: Grantex is a delegated authorization protocol and server for AI agents, modeled on OAuth. Each agent
  gets its own verifiable identity, and a person or organization grants it scoped, expiring, revocable authority
  that services verify before acting. Sub-agents receive strict subsets of their parent's scopes, and the auth service
  keeps an audit trail. Orchestrum Technologies builds it, with SDKs for TypeScript, Python and Go.
