name: lakefs
display_name: lakeFS
type: software
description: lakeFS turns an object store into a Git-like repository, giving a data lake branches, commits and atomic
  merges without copying the underlying objects. It exposes an S3-compatible API over AWS S3, Azure Blob Storage
  and Google Cloud Storage, so Spark, Hive and similar frameworks read and write versioned data unchanged. Treeverse
  develops it.
github:
- url: https://github.com/treeverse/lakeFS
