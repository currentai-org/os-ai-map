name: zentropi-cope
display_name: Zentropi CoPE
type: model
description: Zentropi's Content Policy Evaluator (CoPE-A, 9B, built on Gemma-2-9B with LoRA) is a steerable,
  policy-conditioned content-labeling model. Rather than a fixed taxonomy, it evaluates content against a supplied
  natural-language policy and returns a binary label, with training coverage across harm areas such as hate
  speech, sexual content, self-harm, harassment and toxicity.
huggingface_model:
- url: https://huggingface.co/zentropi-ai/cope-a-9b
  not_primary_channel: The adapter repository. The model ships as a LoRA adapter merged into a Gemma base and
    is distributed through the ROOST Model Community, so downloads of this repository are not how it is used.
comments: Described in arXiv 2512.18027.
