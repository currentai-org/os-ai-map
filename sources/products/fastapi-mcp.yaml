name: fastapi-mcp
display_name: FastAPI-MCP
type: software
description: 'Turns an existing FastAPI application into an MCP server: every endpoint becomes an MCP tool,
  keeping the request and response schemas and the endpoint documentation, and reusing the app''s own FastAPI
  dependencies for authentication.'
github:
- url: https://github.com/tadata-org/fastapi_mcp
pypi:
- url: https://pypi.org/project/fastapi-mcp
comments: 'Maintenance is worth noting beside the download figure: the repository has 12,008 stars and 2.7
  million downloads a month, and its last push was 2025-11-24, roughly ten months before this reading. It is
  not archived and the package still installs. Verified 2026-09-17 via the GitHub API, the repository README
  and the PyPI download API.'
