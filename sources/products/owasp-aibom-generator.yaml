name: owasp-aibom-generator
display_name: OWASP AIBOM Generator
type: software
description: The OWASP AIBOM Generator produces AI Bills of Materials in CycloneDX 1.6 JSON for models hosted
  on Hugging Face, extracting metadata from model cards, configurations and repository files. It scores how
  complete each bill of materials is and suggests what is missing, and is listed in the CycloneDX Tool Center.
  It runs under the OWASP GenAI Security Project, with a hosted instance for trying it.
comments: 'Tagged self-attested: the bill of materials validates against the CycloneDX schema, but repeats
  what the model''s publisher declared.'
github:
- url: https://github.com/GenAI-Security-Project/aibom-generator
