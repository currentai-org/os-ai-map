name: tokenizers
display_name: Tokenizers
type: software
description: Tokenizers is a library providing fast implementations of modern tokenization algorithms including
  Byte-Pair Encoding, WordPiece, and Unigram. It is written in Rust with bindings for Python and Node.js, and
  emphasizes high-throughput training and inference. Maintained by Hugging Face, it is a direct dependency
  of the Transformers library.
github:
- url: https://github.com/huggingface/tokenizers
pypi:
- url: https://pypi.org/project/tokenizers/
