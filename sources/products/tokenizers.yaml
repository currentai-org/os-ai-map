name: tokenizers
display_name: Tokenizers
type: software
description: Tokenizers is a library providing fast implementations of modern tokenization algorithms
  including Byte-Pair Encoding, WordPiece, and Unigram. It is written in Rust with bindings for Python,
  Node.js, and Ruby, and emphasizes high-throughput training and inference. Maintained by Hugging Face,
  it underpins tokenization in the Transformers library and many production NLP pipelines.
github:
- url: https://github.com/huggingface/tokenizers
pypi:
- url: https://pypi.org/project/tokenizers/
comments: Verified live 2026-06-22 via primary sources. LICENSE body is verbatim Apache License 2.0; full
  Rust/Python source public.
