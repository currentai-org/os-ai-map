name: letta
display_name: Letta
type: software
description: Agent harness for long-lived agents that keep persistent memory and rewrite their own memory
  blocks, skills and prompts as they work. Letta Code runs as a terminal interface, a desktop app and
  an App Server that applications reach through the Letta Agent SDK, and its agents can run on schedules,
  call subagents and answer in Slack, Telegram or Discord. Letta, the team behind MemGPT, builds it.
comments: Read against letta-ai/letta-code, where Letta's current source lives. The original letta-ai/letta
  repository now holds only a pointer to it, and the retired Python server sits on an archive branch.
github:
- url: https://github.com/letta-ai/letta-code
