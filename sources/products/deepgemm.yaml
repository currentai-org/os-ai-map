name: deepgemm
display_name: DeepGEMM
type: software
description: DeepGEMM is a tensor-core kernel library for FP8, FP4 and BF16 GEMMs, fused mixture-of-experts
  with overlapped communication, and MQA scoring, in one CUDA codebase. Kernels compile at runtime through
  a JIT module, so installation performs no CUDA compilation, though running it needs the CUDA Toolkit and
  an NVIDIA SM90 or SM100 GPU. It borrows concepts from CUTLASS and CuTe without relying heavily on their templates.
github:
- url: https://github.com/deepseek-ai/DeepGEMM
