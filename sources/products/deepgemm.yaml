name: deepgemm
display_name: DeepGEMM
type: software
description: DeepGEMM is a tensor-core kernel library gathering the computation primitives modern large language
  models depend on - FP8, FP4 and BF16 GEMMs, fused mixture-of-experts with overlapped communication, and MQA scoring
  - into one CUDA codebase. Kernels compile at runtime through a lightweight JIT module, so installation needs no
  CUDA toolchain. It borrows concepts from CUTLASS and CuTe without depending on their templates.
github:
- url: https://github.com/deepseek-ai/DeepGEMM
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
