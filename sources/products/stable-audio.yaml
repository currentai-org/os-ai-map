name: stable-audio
display_name: Stable Audio
type: model
description: Stable Audio is Stability AI's family of diffusion models that generate music and sound effects from
  text. The Stable Audio 3 generation ships Small Music, Small SFX and Medium models that produce clips of up to
  two and six minutes and support editing and continuation, alongside the earlier Stable Audio Open models. The
  largest Stable Audio 3 model is not publicly downloadable; Stability offers it through its API and enterprise
  self-hosting.
