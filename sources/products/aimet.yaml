name: aimet
display_name: AIMET
type: software
description: AIMET (AI Model Efficiency Toolkit) quantizes and compresses trained models to cut the compute and
  memory they need on edge devices such as phones and laptops. It works on PyTorch and ONNX models and combines
  post-training techniques with fine-tuning that recovers accuracy lost to quantization. Qualcomm Innovation Center
  develops it.
github:
- url: https://github.com/qualcomm/aimet
pypi:
- url: https://pypi.org/project/aimet-torch/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
