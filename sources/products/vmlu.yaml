name: vmlu
display_name: VMLU
type: dataset
description: VMLU is a Vietnamese benchmark suite for language models from Zalo AI and JAIST. Its core multiple-choice
  set has 10,880 questions across 58 subjects in STEM, humanities, social sciences and professional fields,
  drawn from school, university and national graduation examinations, spanning elementary school to professional
  study. The suite also adds reading-comprehension, discrete-reasoning and dialogue sets, and scores submissions
  on a public leaderboard at vmlu.ai.
github:
