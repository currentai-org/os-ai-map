name: sandbox-runtime
display_name: sandbox-runtime
type: software
description: The Anthropic Sandbox Runtime enforces filesystem, network and unix-socket restrictions on arbitrary
  local processes without a container. It uses bubblewrap on Linux and sandbox-exec on macOS, with an alpha
  Windows backend that runs processes under a dedicated restricted account, and routes network traffic through
  a filtering proxy. A CLI named srt and a matching library apply it to agents, local MCP servers and shell
  commands. Anthropic develops it for Claude Code and ships it as a research preview.
github:
- url: https://github.com/anthropics/sandbox-runtime
npm:
