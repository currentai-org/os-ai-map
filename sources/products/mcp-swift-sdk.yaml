name: mcp-swift-sdk
display_name: MCP Swift SDK
type: software
description: The official Swift SDK for the Model Context Protocol. Client and server across tools, resources
  and prompts, with stdio, Streamable HTTP and in-process transports, implemented against the 2025-11-25 revision.
github:
- url: https://github.com/modelcontextprotocol/swift-sdk
comments: Swift Package Manager resolves from the repository, so there is no download registry to cite and
  adoption bands on stars. The repository was last pushed 2026-05-07, the stalest of the official SDK family,
  which is consistent with its targeting the 2025-11-25 revision rather than the current one. Verified 2026-09-17
  via the GitHub API, the README and the LICENSE body.
