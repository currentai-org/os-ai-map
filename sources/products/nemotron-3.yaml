comments: 'The Nemotron 3 family: Nano (30B total / 3B active hybrid MoE), Super (120B / 12B active hybrid
  Mamba-Transformer MoE, 1M context, 11 Mar 2026 at GTC) and Ultra (550B / 55B active, 3 Jun 2026). Designed
  for agentic/conversational use. Held a duplicate record in base_pretrained until 2026-07-29; the two were
  merged here because the family distributes post-trained weights only. The sole -Base repo on the Hub is
  nvidia/nemotron-3-8b-base-4k, created 2023-11-14 with a single download, which is the earlier 8B
  generation and not this family. Per the #114 convention, the observable artifact decides the category.
  BF16 originals are declared above; the NVFP4/FP8/GGUF quantizations are the same weights repackaged. An
  earlier note recorded the instruct repo as gated/401 -- all three resolve ungated as of 2026-07-29.'
