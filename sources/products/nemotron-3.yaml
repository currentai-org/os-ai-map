name: nemotron-3
display_name: Nemotron 3
type: model
description: 'NVIDIA''s first-party open-weight instruction-tuned model family for agentic reasoning,
  post-trained with SFT + RL on top of Nemotron Base. Current SKUs are Nemotron 3 Nano (30B total / 3B
  active hybrid MoE, March–April 2026) and Nemotron 3 Super (120B / 12B active Mamba-Transformer MoE,
  March 11, 2026); Nemotron 3 Ultra (550B total / 55B active) shipped 3 June 2026. Differentiates on (a)
  open training data and recipes published alongside the weights, (b) 1M-token context with strong RULER
  scores (Super 91.8 @ 1M), and (c) being NVIDIA''s reference post-trained line for NeMo and NIM, optimized
  end-to-end against NVIDIA hardware. Adoption signal (Hub, 2026-07-29): ~994K monthly downloads on Nano
  BF16, 855K on Super BF16 and 339K on Ultra BF16, plus free hosting on OpenRouter and build.nvidia.com.'
