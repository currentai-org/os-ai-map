name: lancedb
display_name: LanceDB
type: software
description: LanceDB is an embedded retrieval database for multimodal data, storing vectors, full text and the underlying
  records together on top of the Lance columnar format. It runs in the application process with no separate server,
  indexes on GPU as well as CPU, and reads and writes directly against object storage. Python, TypeScript, Java
  and Rust bindings ship from the same repository.
