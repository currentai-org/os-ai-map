name: intel-gaudi-3
display_name: Intel Gaudi 3
type: hardware
description: Intel Gaudi 3 is a datacenter AI accelerator built from two compute dies with matrix engines and programmable
  tensor cores, 128 GB of HBM2e and 24 integrated 200 Gb Ethernet ports for scale-out without a separate network
  card. It ships as an OAM module and as the HL-338 PCIe card, in OEM servers and on IBM Cloud.
