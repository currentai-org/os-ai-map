name: openclaw
display_name: OpenClaw
type: software
description: Local-first personal AI assistant that runs an agent gateway answering on the messaging channels
  people already use, including WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Teams and Matrix. Companion
  apps cover macOS, iOS, Android, Windows and Linux, a browser Control UI handles chat and configuration, and
  skills and plugins extend the agent. The gateway is model-agnostic and routes to hosted, subscription-backed
  or local LLM backends.
github:
