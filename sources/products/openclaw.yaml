name: openclaw
display_name: OpenClaw
type: software
description: Local-first personal AI assistant. It runs an agent gateway that answers on messaging channels
  people already use, including WhatsApp, Telegram, Slack, Discord, Signal, iMessage, Teams and Matrix, with
  companion apps for macOS, iOS and Android, a live Canvas interface and a skills and extensions SDK. The gateway
  is model-agnostic and routes to a chosen LLM backend.
github:
- url: https://github.com/openclaw/openclaw
npm:
- url: https://www.npmjs.com/package/openclaw
comments: GitHub declines to classify this repository, so the openness axis reads the LICENSE body directly.
