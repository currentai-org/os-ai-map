description: Platform-agnostic library of composable pipeline blocks for large-scale text data processing
  (reading, filtering, deduplication, tokenization) that runs unchanged across local, Slurm, and cloud
  backends. The reference pretraining-data pipeline behind the FineWeb family.
github:
- url: https://github.com/huggingface/datatrove
pypi:
- url: https://pypi.org/project/datatrove
comments: Hugging Face datatrove; repo active (v0.9.0, 2026-03-04), Apache-2.0 confirmed live 2026-07-21.
  Built FineWeb, FineWeb-Edu, FineWeb-2, and FineMath; the de-facto open pretraining-data processing pipeline.
