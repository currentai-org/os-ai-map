name: pralekha
display_name: Pralekha
type: dataset
description: Pralekha is a parallel corpus and benchmark of whole documents covering 11 Indic languages and
  English, with more than 3 million aligned document pairs, 1.5 million of them English-Indic. The documents
  are Press Information Bureau releases and Mann Ki Baat radio scripts, and unalignable documents sampled from
  Sangraha are mixed in to test cross-lingual document alignment. AI4Bharat built it, with train, dev and test
  splits for translating whole documents.
github:
