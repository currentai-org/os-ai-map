name: mcp-kotlin-sdk
display_name: MCP Kotlin SDK
type: software
description: The official Kotlin SDK for the Model Context Protocol, maintained in collaboration with JetBrains.
  Client and server, all three primitives, and four transports including WebSocket.
github:
- url: https://github.com/modelcontextprotocol/kotlin-sdk
comments: 'Three sources disagree about the licence and the record follows the file: the README badge reads
  Apache-2.0, Maven Central records the artefact as MIT, and the LICENSE in the tree is the project''s dual
  transition text that GitHub classifies as NOASSERTION. Maven Central publishes no download counts, so adoption
  bands on stars. Verified 2026-09-17 via the GitHub API, the README and the LICENSE body.'
