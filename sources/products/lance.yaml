name: lance
display_name: Lance
type: software
description: Lance is a columnar table format for multimodal data that keeps random access fast enough to train
  and query directly against stored rows, rather than requiring a scan-oriented layout. Vector indexes, full-text
  indexes and dataset versioning are part of the format, and it interoperates with Pandas, DuckDB, Polars, PyArrow,
  Ray and Spark. LanceDB is built on top of it.
github:
- url: https://github.com/lance-format/lance
pypi:
- url: https://pypi.org/project/pylance/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
