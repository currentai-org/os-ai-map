name: ernie
display_name: ERNIE 5.1
type: model
aliases:
- ernie-5-1
description: ERNIE 5.1 is Baidu's fifth-generation flagship model, released in May 2026, a mixture-of-experts
  design with elastic depth, width and sparsity, aimed at text generation, reasoning, agentic tool use and
  creative writing. Baidu positions it on cost efficiency, with roughly a third of the total parameters and
  half the active parameters of the previous generation.
comments: ERNIE 4.5 was released openly; the 5.x line is API-only and Baidu's Hugging Face organization lists
  no 5.x repository.
