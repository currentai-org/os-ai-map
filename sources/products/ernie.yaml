name: ernie
display_name: ERNIE 5.1
type: model
aliases:
- ernie-5-1
description: ERNIE 5.1 is Baidu's fifth-generation flagship language model, launched in May 2026 with stronger
  text capabilities than its predecessor. It is offered only as a hosted model, through Baidu's ERNIE site
  and the Baidu Qianfan platform.
comments: Scored on Baidu's flagship line, currently the API-only ERNIE 5.1. ERNIE 5.5 Flash Base, an open-weight
  base model Baidu published separately on Hugging Face in October 2026, is a different line and is not scored
  here. ERNIE 4.5 was released openly.
