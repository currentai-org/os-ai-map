description: ERNIE 5.1 is Baidu's fifth-generation flagship language model, launched in May 2026 with stronger
  text capabilities than its predecessor. It is offered as a hosted model through Baidu's ERNIE site, the Baidu
  Qianfan platform and OpenRouter.
comments: ERNIE 4.5 was released openly. ERNIE 5.5 Flash Base, a pretraining checkpoint published on Hugging
  Face under its own license, is newer than the 5.1 flagship this entry is scored on.
