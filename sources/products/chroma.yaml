name: chroma
display_name: Chroma
type: software
description: Chroma is a retrieval database for AI applications, storing embeddings with their documents and metadata
  behind a four-function API. It runs embedded in a Python or JavaScript process, as a self-hosted server, or on
  the vendor's hosted service, and the core is implemented in Rust with a Kubernetes deployment path in the repository.
  Hybrid and full-text search sit beside vector search.
