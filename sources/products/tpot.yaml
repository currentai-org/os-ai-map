name: tpot
display_name: TPOT
type: software
description: TPOT, the Tree-based Pipeline Optimization Tool, is an AutoML library that uses genetic programming to search
  over scikit-learn pipelines of preprocessing steps, feature selectors and models, and returns the best pipeline it finds
  for a classification or regression task. Version 1.0 folded in the rewritten TPOT2, adding multi-objective search and configurable
  search spaces. It is developed at Cedars-Sinai; the original version came from the University of Pennsylvania.
