name: zvec
display_name: Zvec
type: software
description: Zvec is an in-process vector database that embeds directly into an application rather than running
  as a server, supporting flat, HNSW, HNSW-RaBitQ and sparse indexes with group-by retrieval. Alibaba Group developed
  and uses it internally.
