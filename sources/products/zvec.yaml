name: zvec
display_name: Zvec
type: software
description: Zvec is an in-process vector database that embeds directly into an application rather than running
  as a server, supporting flat, HNSW, HNSW-RaBitQ, IVF and sparse indexes with native full-text and hybrid
  search. Alibaba Group developed and uses it internally.
github:
- url: https://github.com/alibaba/zvec
pypi:
- url: https://pypi.org/project/zvec/
