name: lm-studio
display_name: LM Studio
type: software
description: LM Studio is a desktop application for discovering, downloading and running large language models
  locally on macOS, Windows and Linux. It provides a chat interface, a Hugging Face model browser, an OpenAI-compatible
  local server, an MCP client, and llama.cpp and Apple MLX runtimes. The same core ships as llmster, a headless
  daemon for servers and continuous integration, alongside TypeScript and Python SDKs and the lms command-line
  tool. Element Labs builds it.
github:
- url: https://github.com/lmstudio-ai
