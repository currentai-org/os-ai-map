name: lm-studio
display_name: LM Studio
type: software
description: Desktop app for discovering, downloading and running local models, with a chat interface, a model
  browser, an OpenAI-compatible local server, a headless mode and native Apple MLX support. The application
  is closed-source proprietary freeware; only the command-line tool and the JavaScript and Python SDKs are
  published as source.
github:
- url: https://github.com/lmstudio-ai
comments: The application terms permit free use at home and at work but forbid modification, reverse-engineering
  and redistribution. Verified 2026-08-13 via the LM Studio application terms and product site.
