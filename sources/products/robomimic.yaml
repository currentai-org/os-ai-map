name: robomimic
display_name: robomimic
type: software
description: robomimic is a framework for robot learning from demonstration. It pairs released datasets of human and machine-generated
  manipulation demonstrations with imitation-learning and offline reinforcement learning algorithms, including BC-RNN, BC-Transformer,
  IQL and Diffusion Policy, and with tools for configuring, sweeping and reproducing training runs. It is part of the ARISE
  Initiative and uses robosuite as its simulator.
github:
- url: https://github.com/ARISE-Initiative/robomimic
