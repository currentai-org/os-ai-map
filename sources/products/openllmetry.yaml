name: openllmetry
display_name: OpenLLMetry
type: software
description: OpenTelemetry-based instrumentation library for LLM applications. It automatically instruments
  applications built with LangChain, LlamaIndex, the OpenAI SDK, and other popular frameworks, and exports
  telemetry data to any OTel-compatible backend, such as Jaeger, Grafana or Datadog. The 'OpenTelemetry for
  LLMs' approach is standards-based and vendor-neutral, shipping standard OTel instrumentations for LLM providers
  and vector databases alongside the Traceloop SDK.
github:
- url: https://github.com/traceloop/openllmetry
pypi:
- url: https://pypi.org/project/opentelemetry-instrumentation-openai
