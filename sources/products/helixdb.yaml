name: helixdb
display_name: HelixDB
type: software
description: HelixDB is a graph database written in Rust on object storage that holds entities, relationships,
  embeddings and text in one transactional engine, with native vector search and BM25 full-text search. It
  targets knowledge graphs and agent memory. Queries are built with SDKs for Rust, TypeScript, Python and Go
  and sent to a running instance as JSON requests, and it runs as a local server, embedded in a process, or
  on the managed Helix Cloud.
github:
- url: https://github.com/HelixDB/helix-db
