name: helixdb
display_name: HelixDB
type: software
description: HelixDB is a graph-vector database written in Rust that holds relational records, graph edges and embeddings
  in one store, aimed at knowledge graphs and agent memory. Queries are written in its own query language and compiled,
  and it persists to object storage. SDKs for several languages ship in the repository.
