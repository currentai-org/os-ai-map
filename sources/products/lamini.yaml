name: lamini
display_name: Lamini
type: software
description: Lamini is a platform that orchestrates GPUs for LLM fine-tuning, inference and agentic pipelines,
  reached through a Python client, a REST API and a web UI. Its Memory Tuning feature trains efficient LoRA
  adapters aimed at reducing hallucinations on factual tasks. The platform is offered as a pay-as-you-go hosted
  service, as dedicated GPUs on Lamini's infrastructure, or as a self-managed deployment in a customer's own
  environment, including air-gapped ones.
