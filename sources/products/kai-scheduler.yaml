name: kai-scheduler
display_name: KAI Scheduler
type: software
description: Kubernetes-native scheduler for AI workloads at large scale. It schedules whole PodGroups rather
  than individual pods, supports hierarchical queues with fair-share over time, bin-packing and spread placement,
  topology-aware scheduling, and separates workload priority from preemptibility. It runs alongside other schedulers
  on the same cluster rather than replacing them.
github:
- url: https://github.com/kai-scheduler/KAI-Scheduler
comments: Originated at Run:ai and was published by NVIDIA; the repository now lives in its own kai-scheduler
  organization rather than under NVIDIA, and the github.com/NVIDIA/KAI-Scheduler path redirects there. Scored
  as its own product, separately from the closed NVIDIA Run:ai platform. Verified 2026-09-15 via the repository
  and its recursive tree.
