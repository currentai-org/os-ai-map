name: pyrit
display_name: PyRIT
type: software
description: The Python Risk Identification Tool (PyRIT) is an open framework from the Microsoft AI Red Team
  that automates red-teaming of generative AI systems. It orchestrates adversarial prompts, single- and multi-turn
  attack strategies and scoring to surface harms and vulnerabilities at scale, against targets from hosted
  model APIs to custom HTTP endpoints. A command-line scanner and a local GUI sit alongside the Python library.
github:
- url: https://github.com/microsoft/PyRIT
