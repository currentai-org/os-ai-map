name: executorch
display_name: ExecuTorch
type: software
description: ExecuTorch is PyTorch's stack for running models on device, from phones, laptops and browsers
  down to microcontrollers. Models captured with torch.export are lowered to a .pte file for each target and
  run by a C++ runtime that links only the operators a deployment needs, with backends from Apple, Arm, Qualcomm,
  MediaTek, Samsung, Intel, NVIDIA and others.
github:
- url: https://github.com/pytorch/executorch
  not_primary_channel: The product's source repository; the runtime ships bundled inside other apps. Its star
    count measures attention to the code rather than use of the product, so it is not the channel adoption
    is read from; the band rests on reported traction.
