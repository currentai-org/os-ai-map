name: executorch
display_name: ExecuTorch
type: software
description: ExecuTorch is PyTorch's runtime for deploying models on device, from smartphones to microcontrollers,
  with a base footprint of around 50KB. Models are exported to a .pte file and loaded by a lightweight C++ runtime,
  with backends across a dozen hardware vendors.
github:
- url: https://github.com/pytorch/executorch
