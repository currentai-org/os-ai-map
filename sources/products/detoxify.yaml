name: detoxify
display_name: Detoxify
type: software
description: Detoxify is a Python library and a set of trained models that score text for toxicity, insults, threats, obscenity
  and identity attacks. Its three models were trained on the Jigsaw toxic-comment challenges, and the multilingual model covers
  seven languages. Unitary built it, and the repository also holds the training code and configurations.
github:
- url: https://github.com/unitaryai/detoxify
pypi:
- url: https://pypi.org/project/detoxify/
