name: flux
display_name: FLUX
type: model
description: FLUX is Black Forest Labs' family of rectified-flow transformer models for text-to-image generation
  and image editing. The open-weight releases span FLUX.1 [dev] and [schnell] with their Kontext, Krea, Fill, Redux,
  Depth and Canny variants, the 32B FLUX.2 [dev], and the smaller FLUX.2 [klein] models that run on consumer GPUs.
  The strongest tiers, FLUX.2 [pro], [flex] and [max], are served only through the vendor's API.
