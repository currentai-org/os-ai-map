name: moss-transcribe-diarize
display_name: MOSS-Transcribe-Diarize
type: model
description: 'OpenMOSS''s end-to-end model for long multi-speaker recordings: in one pass over up to 90 minutes of audio
  it transcribes, labels who spoke when, and adds timestamps and acoustic events, in more than 50 languages. It pairs
  a Whisper-style encoder with a small Qwen3-style decoder.'
