- url: https://huggingface.co/ByteDance-Seed/Seed-OSS-36B-Base
comments: ByteDance's open-weight counterpart to the closed doubao-seed line, and the openness contrast between
  the two is the org-page signal. The model card still marks the technical report as coming soon.
