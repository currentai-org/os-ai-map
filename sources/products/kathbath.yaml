name: kathbath
display_name: Kathbath
type: dataset
description: Kathbath is a speech recognition corpus of 1,684 hours of labeled speech in 12 Indian languages,
  recorded by 1,218 contributors in 203 districts. Contributors read aloud sentences drawn from IndicCorp text,
  collected through the Karya crowdsourcing platform, and the corpus includes clean and noisy test sets. AI4Bharat
  built it as the data behind IndicSUPERB, its benchmark of six speech tasks.
github:
- url: https://github.com/AI4Bharat/IndicSUPERB
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/Kathbath
arxiv:
