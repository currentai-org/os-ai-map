name: stella
display_name: Stella
type: model
description: Stella is a family of English text-embedding models from the NovaSearch team, built by further
  training Alibaba's gte-large-en-v1.5 and gte-Qwen2-1.5B-instruct. The 400M and 1.5B checkpoints were
  trained with Matryoshka representation learning, so each can emit vectors from 512 up to 8,192 dimensions,
  and the publishers recommend inputs of up to 512 tokens. The 1.5B model later served as the starting
  point for NovaSearch's Jasper embedder.
huggingface_model:
- url: https://huggingface.co/NovaSearch/stella_en_1.5B_v5
- url: https://huggingface.co/NovaSearch/stella_en_400M_v5
arxiv:
- url: https://arxiv.org/abs/2412.19048
