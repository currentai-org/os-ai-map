name: monocle
display_name: Monocle
type: software
description: OpenTelemetry-native tracing SDK for GenAI applications and agents, built under the Linux
  Foundation AI & Data umbrella. It ships a metamodel mapping agents, prompts, tools and vector operations
  to standardized OTLP span attributes, framework adapters for LangChain, LlamaIndex, Haystack and Google ADK,
  and a companion trace-assertion testing library, monocle-test-tools. Traces export as OTLP to any
  collector or backend, with no hosted service of its own.
github:
- url: https://github.com/monocle2ai/monocle
pypi:
- url: https://pypi.org/project/monocle_apptrace
comments: A Linux Foundation AI & Data project with no commercial tier or hosted platform; everything the
  SDK does ships in the published, Apache-2.0 repository. Verified 2026-09-02 via the monocle2ai/monocle
  repository.
