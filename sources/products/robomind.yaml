name: robomind
display_name: RoboMIND
type: dataset
description: RoboMIND is a real-world robot manipulation dataset from the Beijing Innovation Center of Humanoid Robotics (X-Humanoid),
  recorded by teleoperation on several robot bodies. Version 1 has about 107k trajectories on a Franka arm, a UR5e arm, an
  AgileX dual-arm robot and the Tien Kung humanoid; RoboMIND 2.0 scales to 310k trajectories and over 1,000 hours on six embodiments,
  with tactile and mobile-manipulation data.
huggingface_dataset:
- url: https://huggingface.co/datasets/x-humanoid-robomind/RoboMIND
arxiv:
- url: https://arxiv.org/abs/2412.13877
- url: https://arxiv.org/abs/2512.24653
comments: Version 1 (now 1.2) is on the Hugging Face Hub behind an automatic contact-details gate. RoboMIND 2.0 is published
  only on ModelScope (X-Humanoid/RoboMIND2.0 and its per-robot sub-repositories), whose README links back to version 1 on
  the Hub and on ModelScope as RoboMIND 1.0, so both are one line. Both are Apache-2.0.
