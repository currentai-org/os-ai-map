name: syft-space
display_name: Syft Space
type: software
description: Syft Space is an application a data owner runs to make a document collection answerable without
  handing it over. It indexes the documents in a local or remote vector database, pairs them with a model from
  OpenAI, Anthropic, Ollama, vLLM or another provider, and serves the pair as an endpoint with its own access
  rules, rate limits and pricing. Endpoints can be listed on SyftHub, and only answers leave the owner's machine.
  OpenMined builds it.
github:
- url: https://github.com/OpenMined/syft-space
