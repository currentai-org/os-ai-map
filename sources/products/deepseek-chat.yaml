name: deepseek-chat
display_name: DeepSeek Chat
type: software
description: Hosted consumer chat product from DeepSeek, at chat.deepseek.com and in iOS and Android apps,
  fronting the company's own model family with long-context handling, file reading and agent capabilities.
  The chat product itself is a proprietary free service with no source release, distinct from the model weights.
comments: The underlying DeepSeek model weights are open and scored separately under base_pretrained; this
  record covers the chat product. Verified 2026-08-13 via the DeepSeek product site.
