name: scgpt
display_name: scGPT
type: model
description: scGPT is the Wang lab's generative transformer pretrained on 33 million human cells for single-cell multi-omic analysis. It publishes a whole-human checkpoint alongside brain, blood, heart, lung, kidney, and pan-cancer checkpoints, with fine-tuning examples and tutorials for batch integration, cell-type annotation, genetic perturbation prediction, and gene regulatory network inference.
github:
- url: https://github.com/bowang-lab/scGPT
comments: Checkpoints are distributed as public Drive folders rather than on the Hugging Face Hub, which the repository still lists as an open to-do. Verified 2026-09-10 via the GitHub API, the repository README and LICENSE, and the scGPT documentation.
