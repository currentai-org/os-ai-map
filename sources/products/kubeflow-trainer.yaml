name: kubeflow-trainer
display_name: Kubeflow Trainer
type: software
description: Kubernetes operator for distributed model training and LLM fine-tuning. A TrainJob is a first-class
  resource describing the trainer, its dataset and model initializers and the number of nodes, and the operator
  materializes it as a JobSet of pods across the cluster. Runtimes ship for PyTorch, DeepSpeed and MPI-based
  training.
github:
- url: https://github.com/kubeflow/trainer
comments: 'Adoption bands on stars rather than on the `kubeflow` PyPI package: that package is the umbrella
  Kubeflow SDK covering several components, so its downloads measure a different population than this product.
  Verified 2026-09-15 via the repository and its recursive tree.'
