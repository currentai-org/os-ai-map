name: htcondor
display_name: HTCondor
type: software
description: High-throughput workload manager from the University of Wisconsin-Madison's Center for High Throughput
  Computing, and one of the schedulers large research GPU fleets run on. Jobs declare what they need in HTCondor's
  own submit language - request_GPUs, require_gpus, gpus_minimum_capability, gpus_minimum_memory - and HTCondor
  matches each job to a machine whose advertised resources satisfy it.
github:
- url: https://github.com/htcondor/htcondor
comments: 'The htcondor PyPI package is the Python bindings rather than the scheduler, so adoption bands on
  stars rather than on that package''s downloads: the bindings measure a different population than cluster
  deployments. Verified 2026-09-16 via the repository, its recursive tree and the HTCondor submit documentation.'
