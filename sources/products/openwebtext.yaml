name: openwebtext
display_name: OpenWebText
type: dataset
languages: [eng]
description: OpenWebText is an open re-creation of WebText, the corpus OpenAI used to train GPT-2. Aaron
  Gokaslan and Vanya Cohen of Brown University gathered the web pages linked from Reddit submissions,
  kept the English ones, removed near-duplicates and very short documents, and ended with about 38GB of
  text from 8,013,769 documents. It went into the pretraining mix of RoBERTa and DeBERTa and is the corpus
  nanoGPT uses to reproduce the smallest GPT-2.
huggingface_dataset:
- url: https://huggingface.co/datasets/Skylion007/openwebtext
lineage:
  derived_from:
  - web pages linked from Reddit submissions
  trains:
  - roberta
  - deberta
