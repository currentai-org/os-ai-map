name: sangraha
display_name: Sangraha
type: dataset
description: 'Sangraha is a pretraining text corpus of about 251 billion tokens across 22 Indic languages and
  English. It joins three parts: text from human-verified websites, OCR of Indic PDFs and transcribed videos
  and podcasts; perplexity-filtered text from existing multilingual corpora; and English Wikimedia machine-translated
  into 14 languages and romanized. AI4Bharat built it with Setu, its open cleaning and deduplication pipeline.'
