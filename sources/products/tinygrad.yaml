name: tinygrad
display_name: tinygrad
type: software
description: tinygrad is a deep learning framework from tiny corp, pitched between PyTorch and micrograd in size.
  It pairs a tensor library with autograd and nn, optim and dataset modules for training, and its own IR and compiler
  fuse and lower kernels that a JIT captures and replays. The whole compiler is meant to be read and changed, and
  it runs on CPU, OpenCL, Metal, CUDA, AMD, NVIDIA, Qualcomm and WebGPU backends.
github:
- url: https://github.com/tinygrad/tinygrad
pypi:
- url: https://pypi.org/project/tinygrad/
comments: The README recommends installing from source, so PyPI downloads undercount use. tiny corp also sells the
  tinybox, a deep learning computer, which is a separate product and not scored here.
