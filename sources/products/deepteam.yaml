name: deepteam
display_name: DeepTeam
type: software
description: DeepTeam is a red-teaming framework for LLM systems from Confident AI that simulates adversarial
  attacks, including jailbreaking, prompt injection and multi-turn exploitation. It ships more than fifty vulnerability
  checks and twenty attack methods mapped to the OWASP Top 10 for LLMs and for Agents, NIST AI RMF and MITRE
  ATLAS, alongside seven runtime guardrails. The framework runs locally and is built on Confident AI's DeepEval
  evaluation framework.
github:
- url: https://github.com/confident-ai/deepteam
