name: chren
display_name: ChrEn
type: dataset
description: ChrEn is a Cherokee-English parallel corpus of about 14,000 sentence pairs for machine translation
  of an endangered language, with in-domain and out-of-domain splits and about 5,000 Cherokee monolingual sentences
  for semi-supervised training. Pairs come from published books and articles, and a Cherokee Old Testament
  set was added later. Shiyue Zhang, Benjamin Frey and Mohit Bansal at UNC released it.
github:
- url: https://github.com/ZhangShiyue/ChrEn
arxiv:
- url: https://arxiv.org/abs/2010.04791
