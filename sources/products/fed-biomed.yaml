name: fed-biomed
display_name: Fed-BioMed
type: software
description: Collaborative learning framework for biomedical research from Inria and Université Côte d'Azur. Hospitals
  run Fed-BioMed nodes that hold and manage their datasets through a node GUI, and a researcher component sends
  PyTorch or scikit-learn training plans to them for federated learning or federated analytics, with Joye-Libert
  or low-overhead masking secure aggregation.
github:
- url: https://github.com/fedbiomed/fedbiomed
pypi:
- url: https://pypi.org/project/fedbiomed/
