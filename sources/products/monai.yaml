name: monai
display_name: MONAI
type: software
description: PyTorch framework for deep learning on medical images, part of the PyTorch Ecosystem. It supplies
  medical-imaging transforms, losses and metrics, a large set of network architectures (UNet, UNETR, SwinUNETR,
  SegResNet, VISTA3D and more), training workflows and model bundles, and Auto3DSeg, which analyzes a dataset,
  trains several segmentation algorithms and ensembles them with minimal user input. It began at NVIDIA and
  King's College London and is steered by an advisory board drawn from its member institutions.
github:
