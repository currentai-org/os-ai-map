name: mmaudio
display_name: MMAudio
type: model
description: MMAudio generates sound effects and ambient audio synchronized to a video clip, a text prompt, or both,
  trained jointly on audio-visual and audio-text data. The model is small (157M parameters in the paper) and produces
  an eight-second clip in about a second. It came out of the University of Illinois Urbana-Champaign with Sony AI and
  was presented at CVPR 2025.
github:
- url: https://github.com/hkchengrex/MMAudio
huggingface_model:
- url: https://huggingface.co/hkchengrex/MMAudio
arxiv:
- url: https://arxiv.org/abs/2412.15322
comments: 'Gap fill: video-to-audio (Foley and sound-effect) generation had no head product; the music models here generate
  songs and instrumentals from text, not sound synchronized to picture. MMAudio is the most-starred of the four seeded
  sound-effect rows (ThinkSound, HunyuanVideo-Foley and FoleyCrafter stay in the registry). Its adoption signal is thin:
  the Hub reports zero downloads for a repository that holds .pth files without a config.json, which the Hub''s download
  counter does not count. The code is MIT; the checkpoints are CC-BY-NC 4.0.'
