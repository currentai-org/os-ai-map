name: idefics
display_name: Idefics
type: model
description: Idefics is Hugging Face's line of open vision-language models, which take interleaved sequences of images and
  text and answer in text. Idefics3-8B pairs a SigLIP image encoder with Llama 3.1 8B Instruct and was built to improve OCR,
  document understanding and visual reasoning over Idefics2. Hugging Face trained it on open datasets it also publishes, including
  The Cauldron and Docmatix.
huggingface_model:
- url: https://huggingface.co/HuggingFaceM4/Idefics3-8B-Llama3
- url: https://huggingface.co/HuggingFaceM4/idefics2-8b
arxiv:
- url: https://arxiv.org/abs/2408.12637
comments: Idefics3 is released under Apache 2.0 although its language model is Meta's Llama 3.1 8B Instruct, and the card
  does not address the Llama license. SmolVLM, a separate entry, continues the architecture.
