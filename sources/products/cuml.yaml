name: cuml
display_name: cuML
type: software
description: NVIDIA's GPU-accelerated machine-learning library in the RAPIDS suite, with scikit-learn-style
  estimators for clustering, regression, classification, dimensionality reduction, nearest neighbors and time
  series - more than fifty algorithms, including GPU versions of UMAP and HDBSCAN. Its cuml.accel mode runs
  existing scikit-learn, UMAP and HDBSCAN code on the GPU with no code changes, and it scales across GPUs and
  nodes with Dask.
github:
- url: https://github.com/NVIDIA/cuml
pypi:
- url: https://pypi.org/project/cuml-cu12
- url: https://pypi.org/project/cuml-cu13
