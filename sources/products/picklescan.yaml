name: picklescan
display_name: picklescan
type: software
description: picklescan is a command-line scanner that flags Python Pickle files which call dangerous functions, such as eval,
  when loaded. It reads local files, directories, URLs, zip archives and PyTorch checkpoints, scans a Hugging Face model by
  name, and returns ClamAV-style exit codes for use in scripts. Matthieu Maitre maintains it.
github:
- url: https://github.com/mmaitre314/picklescan
pypi:
- url: https://pypi.org/project/picklescan/
