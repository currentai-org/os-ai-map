name: annoy
display_name: Annoy
type: software
description: Annoy (Approximate Nearest Neighbors Oh Yeah) is a C++ library with Python bindings for approximate
  nearest neighbour search over random projection trees, built so that indexes are static files memory-mapped into
  a process. Many processes share one index without loading it each, which is what it was built for at Spotify.
github:
- url: https://github.com/spotify/annoy
