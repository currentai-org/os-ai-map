name: flyte
display_name: Flyte
type: software
description: Kubernetes-native orchestrator for machine-learning and data workflows, written as typed Python
  tasks. Flyte's control plane, Propeller, walks the workflow graph and emits one pod per task against the
  resources that task declared, caching results and passing typed artifacts between steps. Plugin task types
  cover PyTorch, Spark, Ray and Dask training jobs alongside plain containers.
github:
- url: https://github.com/flyteorg/flyte
pypi:
- url: https://pypi.org/project/flyte/
- url: https://pypi.org/project/flytekit/
comments: Union.ai, founded by Flyte's creators, sells a managed platform beside it and hosts the project's
  documentation.
