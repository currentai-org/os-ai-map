name: tabfm
display_name: TabFM
type: model
description: 'TabFM is a tabular foundation model from Google Research that classifies or regresses on a new table without
  a training step: the user''s labeled rows are read as context and predictions for new rows come from a single forward
  pass. It handles mixed numeric and categorical columns and is pretrained only on synthetic tables. The tabfm package
  wraps it in scikit-learn-style estimators with JAX and PyTorch backends.'
github:
- url: https://github.com/google-research/tabfm
pypi:
- url: https://pypi.org/project/tabfm
huggingface_model:
