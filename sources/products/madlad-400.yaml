description: Document-level multilingual web corpus derived from Common Crawl and covering 419 languages, built
  by Google researchers and hosted by the Allen Institute for AI. It ships in a noisy variant filtered only
  by language identification and a clean quality-filtered variant of roughly 3 trillion tokens, with a focus
  on low-resource languages. It underpins the MADLAD-400 machine-translation models.
