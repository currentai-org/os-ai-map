name: qwen-omni
display_name: Qwen-Omni
type: model
description: Qwen-Omni is Alibaba's omni-modal model line, which takes text, images, audio and video as input
  and answers in text or in streaming natural speech. Its current release, Qwen3.5-Omni, is served only through
  Alibaba Cloud's API. The earlier Qwen3-Omni, a mixture-of-experts Thinker-Talker model with Instruct, Thinking
  and audio Captioner checkpoints, and Qwen2.5-Omni before it remain downloadable.
github:
- url: https://github.com/QwenLM/Qwen3-Omni
huggingface_model:
- url: https://huggingface.co/Qwen/Qwen3-Omni-30B-A3B-Instruct
- url: https://huggingface.co/Qwen/Qwen3-Omni-30B-A3B-Thinking
- url: https://huggingface.co/Qwen/Qwen2.5-Omni-7B
arxiv:
- url: https://arxiv.org/abs/2509.17765
comments: 'The current release, Qwen3.5-Omni, is hosted-only, while Qwen3-Omni and Qwen2.5-Omni remain downloadable
  under Apache 2.0. It scores 1/closed on the current release, and the older open line trails it. A separate
  availability attribute that would record that gap is tracked in #727.'
