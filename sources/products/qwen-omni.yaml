name: qwen-omni
display_name: Qwen-Omni
type: model
description: Qwen-Omni is Alibaba's open-weight omni-modal model line, which takes text, images, audio and video
  as input and answers in text or in streaming natural speech. Qwen3-Omni uses a mixture-of-experts Thinker-Talker
  design and ships Instruct, Thinking and audio Captioner checkpoints; Qwen2.5-Omni came before it. Its newer Qwen3.5-Omni
  tier is served only through Alibaba Cloud's API.
