name: faster-whisper
display_name: faster-whisper
type: software
description: A reimplementation of OpenAI's Whisper on the CTranslate2 inference engine, up to four times faster
  than the reference code at the same accuracy and using less memory, with 8-bit quantization on CPU and GPU. It
  is the transcription backend of many other tools, WhisperX among them.
github:
