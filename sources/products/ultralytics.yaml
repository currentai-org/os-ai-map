name: ultralytics
display_name: Ultralytics YOLO
type: software
description: Python package and CLI for training, validating and deploying the YOLO family of real-time vision models
  - YOLOv8, YOLO11 and YOLO26 - across detection, instance and semantic segmentation, depth estimation, classification,
  pose, oriented boxes and tracking. The same package downloads the pretrained checkpoints and exports them to deployment
  formats. Built by Ultralytics, which also sells an enterprise license and a hosted platform.
github:
- url: https://github.com/ultralytics/ultralytics
pypi:
- url: https://pypi.org/project/ultralytics
