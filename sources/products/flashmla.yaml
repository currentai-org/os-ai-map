name: flashmla
display_name: FlashMLA
type: software
description: FlashMLA is DeepSeek's library of optimized attention kernels for serving its own models on NVIDIA
  Blackwell GPUs and Huawei Ascend NPUs. It carries sparse (DeepSeek Sparse Attention) prefill and decoding
  kernels over FP8 or FP4 KV caches, a dense multi-head attention prefill kernel, and a fused kernel for the
  small operations around attention. Support for Hopper GPUs and earlier DeepSeek models was dropped from the
  main line.
github:
- url: https://github.com/deepseek-ai/FlashMLA
