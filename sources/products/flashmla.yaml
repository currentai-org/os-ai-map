name: flashmla
display_name: FlashMLA
type: software
description: FlashMLA is DeepSeek's library of optimized attention kernels powering DeepSeek-V3 and DeepSeek-V3.2-Exp, including
  dense and sparse (DeepSeek Sparse Attention) multi-head latent attention kernels for both the prefill and decoding stages,
  with FP8 KV-cache support for the sparse decoding path.
