name: nltk
display_name: NLTK
type: software
description: The Natural Language Toolkit, a suite of Python modules for tokenization, stemming, tagging, chunking,
  parsing, classification, language modeling and semantic reasoning, with interfaces to more than 50 corpora and
  lexical resources such as WordNet. It supports research and development in natural language processing, and is
  a community project led by Steven Bird since 2001.
