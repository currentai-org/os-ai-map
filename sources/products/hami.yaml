name: hami
display_name: HAMi
type: software
description: Heterogeneous GPU sharing and scheduling for Kubernetes, hosted by the CNCF. HAMi registers each
  accelerator in a cluster with its split count, memory limit and core limit, and its own scheduler decides
  which node and which devices a pod receives, recording the decision on the pod. It covers NVIDIA GPUs alongside
  Cambricon MLUs and other vendors' accelerators.
github:
- url: https://github.com/Project-HAMi/HAMi
