name: ai-verify
display_name: AI Verify
type: software
description: AI Verify is an AI governance testing framework and toolkit that tests classification and regression
  models against internationally recognized principles and produces reports for stakeholders, alongside process
  checklists. It runs inside an enterprise's own environment, and its test algorithms can run as separate Python
  modules. The AI Verify Foundation, set up by Singapore's IMDA, maintains it.
comments: 'Tagged self-attested: the organization testing its own model produces the report.'
