name: ai-verify
display_name: AI Verify
type: software
description: AI Verify is an AI governance testing framework and toolkit that runs standardized tests on classification
  and regression models against internationally recognized principles, with plugins that include a process
  checklist. It runs inside an enterprise's own environment, and its test algorithms can run as separate Python
  modules. The AI Verify Foundation, a subsidiary of Singapore's IMDA, maintains it.
comments: 'Tagged self-attested: the organization testing its own model produces the report.'
