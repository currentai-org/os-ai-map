name: kimi-code-cli
display_name: Kimi Code CLI
type: software
description: Kimi Code CLI is a terminal coding agent that reads and edits code, runs shell commands, searches files
  and fetches web pages. It uses Moonshot AI's Kimi models by default and can be pointed at Anthropic, OpenAI-compatible
  and Gemini providers, dispatches coder, explore and plan sub-agents, and works inside Zed and JetBrains
  over the Agent Client Protocol. Moonshot AI builds it in TypeScript as the successor to its Python Kimi CLI.
comments: Read against MoonshotAI/kimi-code. The archived MoonshotAI/kimi-cli repository holds the Python predecessor
  under Apache-2.0, which is why some listings give this tool that license; its PyPI package is declared as a record
  of the old name.
github:
- url: https://github.com/MoonshotAI/kimi-code
npm:
- url: https://www.npmjs.com/package/@moonshot-ai/kimi-code
pypi:
- url: https://pypi.org/project/kimi-cli/
  not_primary_channel: The archived Python Kimi CLI that this tool replaced, a separate codebase with no further
    releases. Its downloads install the predecessor rather than Kimi Code CLI, so it is kept as a record of the
    name and left out of the download sum.
