description: IndicCOPA tests commonsense causal reasoning in 18 Indian languages. Each of its 500 questions gives
  a premise and asks which of two alternatives is its cause or effect. AI4Bharat had translators render the English
  COPA test set by hand, shuffling premises and choices before translation to avoid bias. It is one of the new test
  sets in the IndicXTREME benchmark and is published on its own on the Hub.
