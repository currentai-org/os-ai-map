name: lerobot
display_name: LeRobot
type: software
description: LeRobot is Hugging Face's PyTorch library for learning robot policies from real-world data. It records
  teleoperated demonstrations into a standard dataset format hosted on the Hugging Face Hub, trains imitation-learning,
  reinforcement-learning and vision-language-action policies such as ACT, Diffusion Policy, SmolVLA, pi0 and GR00T,
  and drives low-cost arms through to humanoids.
github:
- url: https://github.com/huggingface/lerobot
pypi:
- url: https://pypi.org/project/lerobot
