name: meta-ai
display_name: Meta AI
type: software
description: Meta's consumer AI assistant, embedded in WhatsApp, Instagram, Facebook and Messenger alongside
  a standalone web app at meta.ai and native mobile apps. It plans multi-step tasks and connects to email and
  calendar applications. Meta builds and operates the service, and the underlying model weights are use-restricted
  rather than openly licensed.
comments: Meta's own newsroom replaced the earlier third-party citations for identity and features, after every
  Meta legal host tried returned an error.
