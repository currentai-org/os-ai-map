name: command-r
display_name: Command R+
type: model
description: Cohere's enterprise foundation model line, currently anchored by Command A+ (released May
  20, 2026), a 218B-parameter sparse MoE (25B active) with native citation generation, W4A4 lossless
  quantization, and the company's first fully Apache 2.0 licensed frontier model. Runs on a single B200
  or two H100s. Positioned for sovereign AI and enterprise RAG with native support for 48 languages and
  explicit grounding spans linking every factual claim to source documents. Earlier Command R+ (104B,
  2024) is the predecessor; with Command A+ the line has flipped from API-only to open-weights.
huggingface_model:
- url: https://huggingface.co/CohereLabs/command-a-plus-05-2026-bf16
- url: https://huggingface.co/CohereLabs/c4ai-command-r-v01
comments: Correctly an instruct model, belongs in finetuned_chat (was miscategorized as base elsewhere).
  Openness and capability are both still scored on the 2024 c4ai-command-r-plus checkpoint (CC-BY-NC,
  gated) while the description and the declared artifacts follow Command A+ (Apache 2.0, ungated). Both
  axes are flagged for rescoring on the governing release; adoption already reads it. Verified live 2026-08-13
  via the Command A+ and Command R+ model cards.
