name: command-r
display_name: Command R+
type: model
description: Command A+ is Cohere's enterprise language model, a 218B-parameter sparse mixture-of-experts (25B
  active) with vision input, conversational tool use and native citation generation through grounding spans
  that link claims to source documents. It supports 48 languages and a 128K context window, and runs on a single
  B200 or two H100 GPUs with W4A4 quantization. It succeeds the 104B Command R+ of 2024.
huggingface_model:
- url: https://huggingface.co/CohereLabs/command-a-plus-05-2026-bf16
- url: https://huggingface.co/CohereLabs/c4ai-command-r-v01
comments: Scored against Command A+ rather than the earlier Command R and Command R+ checkpoints.
