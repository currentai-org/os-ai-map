name: compl-ai
display_name: COMPL-AI
type: software
description: 'COMPL-AI is a compliance-centered evaluation framework for large language models: a technical
  interpretation of the EU AI Act paired with an open benchmarking suite, now 29 benchmarks, that covers the
  Act''s technical requirements. It is built on the Inspect evaluation framework and publishes results on a
  public leaderboard. ETH Zurich, INSAIT and LatticeFlow AI maintain it.'
comments: Placed here rather than in evaluation code because its output is a report mapped to the EU AI Act.
  Tagged self-attested.
