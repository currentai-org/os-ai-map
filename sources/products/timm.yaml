name: timm
display_name: timm (PyTorch Image Models)
type: software
description: PyTorch library of image models, layers, optimizers, schedulers, augmentations and reference training
  and validation scripts, spanning more than 100 architecture families from ResNet and EfficientNet to ViT, ConvNeXt
  and MobileNetV4, with over 700 pretrained weights. Created by Ross Wightman and maintained under Hugging Face.
github:
- url: https://github.com/huggingface/pytorch-image-models
pypi:
- url: https://pypi.org/project/timm
