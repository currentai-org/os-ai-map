name: laobench
display_name: LaoBench
type: dataset
description: 'LaoBench is a benchmark for testing language models in Lao, with more than 17,000 expert-curated
  items across three areas: culturally grounded knowledge, K-12 curriculum questions, and translation among
  Lao, Chinese and English. Experts wrote the items, and an agent-assisted pipeline verified them. It comes
  in an open subset and a held-out subset scored through a controlled service. BAAI publishes it.'
huggingface_dataset:
- url: https://huggingface.co/datasets/BAAI/LaoBench
arxiv:
- url: https://arxiv.org/abs/2511.11334
comments: The Hugging Face card carries only metadata; the description and scale come from the LaoBench paper.
