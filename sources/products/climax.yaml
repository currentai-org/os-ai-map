name: climax
display_name: ClimaX
type: model
description: ClimaX is Microsoft's foundation model for weather and climate, pretrained on five CMIP6 climate-simulation datasets and adapted to global forecasting, regional forecasting, and climate projection. The release documents the corpus download and preprocessing pipeline, the pretraining run, and per-task fine-tuning configurations, and publishes checkpoints at two grid resolutions.
