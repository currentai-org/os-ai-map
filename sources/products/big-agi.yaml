name: big-agi
display_name: Big-AGI
type: software
description: Big-AGI is a browser-based chat workspace that connects to more than twenty model providers, local servers
  such as Ollama and LocalAI, and any OpenAI-compatible endpoint. Its Beam feature sends one prompt to several models
  and merges their answers, and it adds voice calls, image generation, personas and attachments. The open-source edition
  self-hosts with Docker; a hosted edition with a paid Pro tier runs at big-agi.com.
