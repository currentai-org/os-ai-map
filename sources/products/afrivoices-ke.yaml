name: afrivoices-ke
display_name: AfriVoices-KE
type: dataset
description: AfriVoices-KE is a speech dataset of about 3,000 hours in five Kenyan languages, Dholuo, Kikuyu,
  Kalenjin, Maasai and Somali, recorded on smartphones by 4,777 native speakers. About 750 hours are scripted
  readings across eleven domains and the rest is spontaneous speech prompted by text and images, checked by
  human reviewers. The Kenyan arm of the African Next Voices project publishes one repository per language.
huggingface_dataset:
- url: https://huggingface.co/datasets/Anv-ke/Dholuo
- url: https://huggingface.co/datasets/Anv-ke/kikuyu
- url: https://huggingface.co/datasets/Anv-ke/Kalenjin
- url: https://huggingface.co/datasets/Anv-ke/Maasai
- url: https://huggingface.co/datasets/Anv-ke/Somali
arxiv:
- url: https://arxiv.org/abs/2604.08448
comments: The Hugging Face repositories carry no dataset card, so the license and composition are taken from
  the paper.
