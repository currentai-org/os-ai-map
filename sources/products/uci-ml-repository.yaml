name: uci-ml-repository
display_name: UCI Machine Learning Repository
type: software
description: The UCI Machine Learning Repository is the University of California, Irvine's collection of datasets
  donated for machine learning research, kept since 1987. Librarians approve each donation, which then receives
  a DOI and a CC BY 4.0 license, and datasets from elsewhere can be linked. A public JSON API and the ucimlrepo
  Python package fetch a dataset by ID or name into pandas with its variable descriptions.
comments: Scored as the hosted repository. The ucimlrepo client is open source, and the repository's public GitHub
  account otherwise holds an issue tracker.
