name: agent-governance-toolkit
display_name: Agent Governance Toolkit
type: software
steward: linux-foundation
description: Agent Governance Toolkit intercepts an AI agent's tool calls, messages and delegations in application
  code and checks each against policy before it runs, allowing it, denying it or holding it for human approval.
  It gives each agent a decentralized identifier bound to a key, narrows authority along delegation chains and writes
  decisions to a hash-chained audit log, with SDKs for Python, TypeScript, .NET, Rust and Go. Microsoft builds it.
github:
- url: https://github.com/microsoft/agent-governance-toolkit
