name: skyvern
display_name: Skyvern
type: software
description: Automate browser based workflows with AI. Skyvern automates browser-based workflows using LLMs and
  computer vision. It provides a Playwright-compatible SDK that adds AI functionality on top of playwright, as well
  as a no-code workflow builder to help both technical and non-technical users automate manual workflows on any
  website, replacing brittle or unreliable automation solutions.
