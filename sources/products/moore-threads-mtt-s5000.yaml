name: moore-threads-mtt-s5000
display_name: Moore Threads MTT S5000
type: hardware
description: Moore Threads MTT S5000 is a general-purpose GPU for training and serving large models, built on the PH100 chip
  and Moore Threads' "PingHu" architecture, with native FP8 and full precision up to FP64. It ships as air- and liquid-cooled
  OAM modules, in eight-GPU SGX5000 servers and in KUAE clusters, and is programmed through the MUSA software stack with PyTorch,
  vLLM and SGLang support.
