name: flower
display_name: Flower
type: software
description: Federated learning framework from Flower Labs. The same app runs in its simulation engine or on its
  deployment runtime, where a SuperLink coordinates SuperNodes that each organization runs next to its own data
  over TLS with node authentication. It ships SecAgg and SecAgg+ secure aggregation and differential privacy, and
  works with PyTorch, TensorFlow, JAX, MLX and Hugging Face.
github:
- url: https://github.com/flwrlabs/flower
pypi:
- url: https://pypi.org/project/flwr/
comments: 'One product: `flwr-datasets`, a partitioning utility published from the same repository, is not declared,
  because its installs are Flower''s own users counted a second time. Flower Enterprise features (OIDC account login,
  audit logging and the Helm charts) and the hosted SuperGrid service are Flower Labs'' paid layer.'
