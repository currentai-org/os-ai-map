name: openvla
display_name: OpenVLA
type: model
description: OpenVLA is a seven-billion-parameter open vision-language-action model. It fine-tunes the Prismatic
  VLM (DINOv2 and SigLIP vision encoders with a Llama 2 language model) on 970k manipulation episodes from Open
  X-Embodiment, and controls robot arms seen in that mixture from a camera image and a language instruction.
github:
- url: https://github.com/openvla/openvla
huggingface_model:
- url: https://huggingface.co/openvla/openvla-7b
arxiv:
- url: https://arxiv.org/abs/2406.09246
comments: GitHub marks the openvla repository as a fork of TRI-ML/prismatic-vlms, the codebase it grew from; it
  is OpenVLA's own repository. It has had no commits since March 2025.
