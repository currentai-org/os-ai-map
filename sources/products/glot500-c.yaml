name: glot500-c
display_name: Glot500-c
type: dataset
description: Glot500-c is a multilingual pretraining text corpus covering 511 mostly low-resource languages,
  assembled from more than 150 existing monolingual and parallel datasets plus crawls of multilingual websites.
  The public release leaves out sources that cannot be redistributed, and each sentence records its source
  dataset. LMU Munich's Center for Information and Language Processing built it to train the Glot500-m model.
github:
- url: https://github.com/cisnlp/Glot500
huggingface_dataset:
- url: https://huggingface.co/datasets/cis-lmu/Glot500
arxiv:
- url: https://arxiv.org/abs/2305.12182
