name: clearml
display_name: ClearML
type: software
description: End-to-end machine-learning platform covering experiment management, data management, pipelines
  and remote execution. Tasks are enqueued and a ClearML Agent running on a worker machine pulls them, reproduces
  the original environment in a container and runs the code. The Python SDK is Apache-2.0; the server the platform
  runs on is licensed under the Server Side Public License.
github:
- url: https://github.com/clearml/clearml
pypi:
- url: https://pypi.org/project/clearml/
comments: The product spans three repositories - clearml the SDK, clearml-server and clearml-agent - and the
  openness score follows the most restrictive license among them.
