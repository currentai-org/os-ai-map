name: alphaearth-foundations
display_name: AlphaEarth Foundations
type: model
description: AlphaEarth Foundations is Google DeepMind's embedding field model for Earth observation. It assimilates spatial, temporal, and measurement context from Landsat, Sentinel-1, Sentinel-2, and other sources into a 64-dimensional embedding for every 10-meter pixel of terrestrial land and shallow coastal water, published as annual Satellite Embedding layers in Google Earth Engine covering 2017 onward.
arxiv:
- url: https://arxiv.org/abs/2507.22291
comments: What Google DeepMind released is the embedding dataset, not the model. There is no checkpoint, no implementation, and no license over weights, so the product is scored closed even though its outputs are freely usable. Verified 2026-09-10 via the arXiv abstract, the DeepMind announcement, and the Earth Engine catalog entry.
