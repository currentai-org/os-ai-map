name: argilla
display_name: Argilla
type: software
description: Argilla is a collaboration tool for building and curating datasets with human feedback. A self-hosted server
  and web interface let domain experts label records for classification, extraction, retrieval and preference data, with model
  suggestions and semantic search, while a Python SDK defines datasets and moves them to and from the Hugging Face Hub. It
  is the human-feedback companion to distilabel.
github:
- url: https://github.com/argilla-io/argilla
pypi:
- url: https://pypi.org/project/argilla/
comments: The original authors have moved on. The maintainers publish bug fixes but no new features, and are looking for contributors
  to take the project forward.
