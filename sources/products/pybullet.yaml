name: pybullet
display_name: PyBullet
type: software
description: PyBullet is the Python interface to the Bullet Physics SDK, a real-time collision-detection and rigid-body
  simulation library used for robotics, reinforcement learning and VR. It loads robots from URDF, ships example
  gym-style environments and robot models, and renders through a basic OpenGL viewer. The C++ SDK is maintained
  by Erwin Coumans in the bullet3 repository.
github:
- url: https://github.com/bulletphysics/bullet3
pypi:
- url: https://pypi.org/project/pybullet
comments: The repository's last push was in October 2025 and its newest GitHub release is from 2022, while PyPI
  carries a January 2025 build.
