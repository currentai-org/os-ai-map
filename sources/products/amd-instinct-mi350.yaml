name: amd-instinct-mi350
display_name: AMD Instinct MI350 Series
type: hardware
description: AMD Instinct MI350 Series is a datacenter GPU generation on AMD's CDNA 4 architecture, comprising the
  air-cooled MI350X and the liquid-cooled MI355X. Each GPU carries 288 GB of HBM3E and adds MXFP6 and MXFP4 formats
  for inference. The parts ship as eight-GPU OAM platforms in OEM servers and are programmed through AMD's ROCm
  software stack.
