name: weave
display_name: Weave
type: software
description: Toolkit for developing and monitoring AI applications from Weights & Biases, providing tracing,
  evaluation and dataset management for LLM applications. Functions are traced with a decorator, and it builds
  on the same platform as W&B's experiment tracking. The published package requires a Weights & Biases account
  to send traces to.
github:
- url: https://github.com/wandb/weave
pypi:
- url: https://pypi.org/project/weave
comments: The published repository carries the SDK and a trace-server library but not the web service that
  fronts it, which its own architecture diagram places in W&B's closed core repository; the openness score
  follows that. Verified 2026-08-13 via the wandb/weave README.
