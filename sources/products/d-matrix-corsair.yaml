name: d-matrix-corsair
display_name: d-Matrix Corsair
type: hardware
description: d-Matrix Corsair is an inference accelerator built on digital in-memory compute, in which matrix arithmetic
  happens inside the SRAM that holds the weights. Each PCIe card carries two packages of four chiplets, 2 GB of
  this performance memory and up to 256 GB of LPDDR5 capacity memory, and computes natively in block floating-point
  (MX) formats.
