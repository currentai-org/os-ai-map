name: litellm
display_name: LiteLLM
type: software
description: Python SDK and proxy server exposing one OpenAI-format API across a large set of LLM providers
  including Bedrock, Azure, Vertex, Anthropic, Cohere and vLLM. The proxy translates calls to the chat-completions
  and responses endpoints and adds routing, fallbacks, virtual keys, guardrails and spend tracking, which is
  what makes it usable as an organization-wide gateway.
github:
- url: https://github.com/BerriAI/litellm
pypi:
- url: https://pypi.org/project/litellm/
comments: The published tree is the whole gateway, with an enterprise directory carved out under separate terms
  and a license check enforced in the proxy. Verified 2026-08-15 via the BerriAI/litellm repository and its
  documentation site.
