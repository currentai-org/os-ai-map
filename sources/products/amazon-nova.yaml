name: amazon-nova
display_name: Amazon Nova Pro
type: model
aliases:
- amazon-nova-pro
description: Amazon Nova is a family of multimodal foundation models that Amazon serves through Amazon Bedrock.
  The scored release, Nova Pro, is an understanding model with a 300K context window that takes text, images
  and video. The second generation, Nova 2, adds Lite, Sonic speech-to-speech and multimodal embeddings models
  with up to 1 million tokens of context, and lists Pro and Omni tiers in preview.
comments: Scores Nova Pro v1, a multimodal understanding model with a 300K context, still in service under
  Nova 2.
