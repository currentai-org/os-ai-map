name: modernbert
display_name: ModernBERT
type: model
description: ModernBERT is an encoder-only language model from Answer.AI and LightOn that brings BERT's
  design up to date, with rotary position embeddings, alternating local and global attention and a native
  context of 8,192 tokens. It was pretrained on 2 trillion tokens of mostly English text and code and
  comes in Base (149M parameters) and Large (395M) sizes. Like BERT, it is meant to be fine-tuned for
  classification, retrieval and similar tasks rather than to generate text.
github:
- url: https://github.com/AnswerDotAI/ModernBERT
