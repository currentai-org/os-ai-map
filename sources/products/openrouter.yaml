name: openrouter
display_name: OpenRouter
type: software
description: 'Commercial API gateway that exposes 400+ models from 60+ providers (OpenAI, Anthropic, Google,
  Meta, DeepSeek, plus open-weights hosts) behind a single OpenAI-compatible endpoint with automatic failover
  and unified billing. The largest closed-source LLM aggregator by revenue: ~$50M annualized revenue and reportedly
  raising $120M at a $1.3B valuation (CapitalG-led) in early 2026.'
comments: OpenRouter unified LLM API gateway/router. Verified 2026-08-13 via the OpenRouter homepage; the homepage
  now reads 200T+ monthly tokens, 10M+ global users, 400+ models and 70+ providers, against the 100T/8M/60+
  this record was scored on - the adoption band is escalated on that. Routes/aggregates API calls behind one
  OpenAI-compatible API; not a chat UI but a routing gateway, squarely the ui_api gateway slot alongside the
  LiteLLM anchor. Proprietary hosted service.
