name: reka-core
display_name: Reka Core
type: model
description: Reka Core is Reka AI's multimodal foundation model, announced in April 2024, natively processing
  text, images, video and audio with a 128K context window and delivered through an API or on-premises and
  on-device deployment. Reka has since published open weights for its smaller Flash and Edge models, but not
  for Core.
