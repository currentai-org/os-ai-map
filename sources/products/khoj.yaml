name: khoj
display_name: Khoj
type: software
description: Self-hostable personal assistant that answers over your own documents and the web. It chats with
  cloud or local models, runs semantic search over PDF, Markdown, org-mode, Word and Notion content, builds
  agents with their own knowledge bases, schedules automations and performs deep research. Clients cover the
  browser, Obsidian, Emacs, desktop, mobile and WhatsApp.
github:
- url: https://github.com/khoj-ai/khoj
pypi:
- url: https://pypi.org/project/khoj
comments: The paid hosted tier was retired on 15 April 2026 and users are directed to self-host, so no feature
  gating remains in the shipping product. Verified 2026-08-13 via the khoj-ai/khoj repository and the Khoj
  Cloud sunset notice.
