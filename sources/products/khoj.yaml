name: khoj
display_name: Khoj
type: software
description: Khoj is a personal assistant that answers over the user's own documents and the web, run on infrastructure
  the operator controls. It chats with cloud or local models, runs semantic search over PDF, Markdown, org-mode,
  Word and Notion content, builds custom agents, schedules automations and performs deep research. Clients
  cover the browser, Obsidian, Emacs and a desktop app.
