name: korpus-malti
display_name: Korpus Malti
type: dataset
description: Korpus Malti is a general corpus of written Maltese spanning 19 genres, from parliamentary debates,
  court proceedings and laws to the press, blogs, theses, literature and Wikipedia. Version 4.0, the data used
  to train the BERTu model, holds about 466 million tokens in 20.8 million sentences. The Maltese Language
  Resource Server team at the University of Malta curates it.
huggingface_dataset:
- url: https://huggingface.co/datasets/MLRS/korpus_malti
arxiv:
- url: https://arxiv.org/abs/2205.10517
