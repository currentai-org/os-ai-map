name: mujoco
display_name: MuJoCo
type: software
description: MuJoCo (Multi-Joint dynamics with Contact) is Google DeepMind's physics engine for articulated bodies
  in contact, used throughout robotics and reinforcement-learning research. The C core runs on the CPU with an OpenGL
  viewer and Python bindings, and the product line includes MJX, a JAX reimplementation, and MuJoCo Warp, a GPU
  build maintained with NVIDIA, for batched simulation on accelerators.
