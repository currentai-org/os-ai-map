name: azure-ai-foundry-models
display_name: Microsoft Foundry Models
type: software
description: The model catalog in Microsoft Foundry, listing models from Microsoft, Azure OpenAI, Anthropic,
  DeepSeek, Meta, Mistral, Cohere, NVIDIA and a Hugging Face collection. Entries are either sold and hosted
  by Azure or provided by partners and community publishers, and are deployed as serverless APIs or on managed
  compute. The catalog carries version and lifecycle information per model, and users can request additions.
comments: This entry is the model catalog only; Foundry's observability surface is a separate entry. The older
  ai-foundry documentation path now redirects to a Foundry (classic) page.
