name: azure-ai-foundry-models
display_name: Microsoft Foundry Models
type: software
aliases:
- azure-ai-model-inference
description: The model catalog in Microsoft Foundry, listing models from Microsoft, Azure OpenAI, Anthropic,
  DeepSeek, Meta, Mistral, Cohere, NVIDIA and a Hugging Face collection. Entries are either sold and hosted
  by Azure or provided by partners and community publishers, and are deployed as serverless APIs or on managed
  compute. The catalog carries version and lifecycle information per model, and users can request additions.
comments: 'This entry is the model catalog only; Foundry''s observability surface is a separate entry. The
  older ai-foundry documentation path now redirects to a Foundry (classic) page. It also absorbs the retired
  Azure AI Model Inference entry: Microsoft''s model inference overview now redirects into the Foundry Models
  documentation, which describes the same access to models from many providers through a single endpoint and
  set of credentials as a Foundry Models feature.'
