description: Llama-3.1-8B-Instruct is an instruction-tuned 8-billion-parameter Llama 3.1 model for chat and
  assistant workflows, post-trained with supervised fine-tuning and reinforcement learning with human feedback
  on Meta's Llama 3.1 base. It supports a 128K-token context window. Weights are gated behind a manual access
  request rather than an open download.
