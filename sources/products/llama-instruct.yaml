name: llama-instruct
display_name: Llama-3.1-8B-Instruct
type: model
aliases:
- llama-3-1-8b-instruct
description: Instruction-tuned 8B Llama 3.1 model for chat and assistant workflows, post-trained with SFT and DPO
  on Meta's Llama 3.1 base. The 128K context window and Llama Community License made it the default open instruct
  checkpoint for production chat deployments. Still the most-downloaded Llama variant on Hugging Face. Weights
  are gated behind a manual access request rather than an open download.
huggingface_model:
- url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
comments: Llama 3.1 8B Instruct, released 23 Jul 2024. 8B dense, 128k context, SFT+RLHF post-trained chat model.
  The repo is gated `manual`, so openness was read from the model card and the license body rather than a
  download. Verified live 2026-08-13 via the HF model card.
