name: airi
display_name: AIRI
type: software
description: 'AIRI is a self-hosted AI companion platform from Moeru AI. It pairs a character-driven chat persona
  with speech synthesis and recognition, vision input, persistent memory and MCP tool access, and ships in three
  form factors: a browser build, a desktop build and a mobile build. It connects to many model providers through
  the xsAI client library.'
