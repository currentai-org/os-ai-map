name: glm
display_name: GLM-5.2
type: model
aliases:
- glm-4
- glm-4-6
- glm-4-9b
- glm-5-1
- glm-5-2
description: Z.ai's flagship open-weights frontier model (mid-June 2026, successor to GLM-5.1), built for long-horizon
  agentic and coding tasks. A sparse MoE (~753B total params) with a 1M-token context, introducing 'IndexShare'
  sparse attention (~2.9x FLOP cut at 1M context) and improved speculative decoding. Positioned as a leading open-weights
  coding model.
github:
- url: https://github.com/zai-org/GLM-5
huggingface_model:
- url: https://huggingface.co/zai-org/GLM-4.6
- url: https://huggingface.co/THUDM/glm-4-9b
- url: https://huggingface.co/zai-org/GLM-5.1
- url: https://huggingface.co/zai-org/GLM-5.2
comments: MIT-licensed open weights (HF model card + LICENSE, (c) Zhipu AI 2026). ~753B-param MoE, 1M context.
  Consolidated on 2026-07-29 from glm-4, glm-4-6, glm-4-9b, glm-5-1; openness follows glm-5-2, the release
  that currently governs. See docs/reference/identity.md. GLM-5.2 has pulled away sharply since July and now
  supplies most of the family's downloads, so the adoption band, which was set on the GLM-4 generation, is
  a level low and flagged for review. Verified 2026-08-13 via the GLM-5.2 LICENSE file, its HF model card
  and the zai-org/GLM-5 repository.
