- url: https://huggingface.co/zai-org/GLM-5.2
comments: MIT-licensed open weights (HF model card + LICENSE, (c) Zhipu AI 2026). ~753B-param MoE, 1M context.
  ~191k HF downloads/month and 3.32k likes as of July 2026 (up sharply from ~666 when days old at the June
  audit). Consolidated on 2026-07-29 from glm-4, glm-4-6, glm-4-9b, glm-5-1; openness follows glm-5-2, the
  release that currently governs. See docs/guides/identity.md.
