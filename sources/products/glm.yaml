name: glm
display_name: GLM-5.3
type: model
aliases:
- glm-4
- glm-4-6
- glm-4-9b
- glm-5-1
- glm-5-2
description: 'Z.ai''s flagship open-weights frontier model family, built for long-horizon agentic and coding
  tasks. GLM-5.3, the current release, is a post-trained update of the GLM-5.2 base: a sparse MoE of about
  744B total parameters (40B active) with a 1M-token context, using the ''IndexShare'' sparse attention introduced
  in GLM-5.2. A smaller GLM-5.3-Flash ships beside it on a newly trained base with hybrid sparse and linear
  attention.'
github:
- url: https://github.com/zai-org/GLM-5
huggingface_model:
- url: https://huggingface.co/zai-org/GLM-4.6
- url: https://huggingface.co/zai-org/glm-4-9b
- url: https://huggingface.co/zai-org/GLM-5.1
- url: https://huggingface.co/zai-org/GLM-5.2
comments: GLM-5.3's weights ship under Z.ai's custom GLM-5.3 License, where GLM-5.2 and GLM-5.3-Flash use plain
  MIT. Consolidated on 2026-07-29 from glm-4, glm-4-6, glm-4-9b, glm-5-1 and glm-5-2; openness follows GLM-5.3,
  the release that currently governs. See docs/reference/identity.md. The GLM-5.3 checkpoints are not yet among
  the declared artifacts, so the adoption reading still sums GLM-4 through GLM-5.2.
