description: GLM is Z.ai's open-weights model family, built for long-horizon agentic and coding tasks. GLM-5.3,
  the current release, takes a 1M-token context, and its predecessor GLM-5.2 is a mixture-of-experts model
  with 753B total and 40B active parameters. A smaller GLM-5.3-Flash ships beside it as a separately trained
  model.
