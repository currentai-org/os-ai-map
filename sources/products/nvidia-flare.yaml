name: nvidia-flare
display_name: NVIDIA FLARE
type: software
description: NVIDIA's federated learning runtime and SDK. A provisioned server and client sites run jobs that keep
  each site's data local; it ships a simulator for research, Kubernetes and Slurm launchers for production and HPC
  sites, a mobile SDK for Android and iOS devices, homomorphic encryption, differential privacy and confidential-computing
  options, and federated fine-tuning of large language models.
github:
- url: https://github.com/NVIDIA/NVFlare
pypi:
