name: cordum
display_name: Cordum
type: software
description: Cordum is a self-hosted control plane that puts a policy decision in front of AI agents' actions, returning
  allow, deny, require-approval, throttle or constrained verdicts before a tool call, job or workflow runs. It holds
  flagged actions for an operator's approval bound to a hash of the exact action, issues delegation tokens that
  narrow scope between agent identities, and keeps a hash-chained audit log. Cordum Inc. builds it.
github:
- url: https://github.com/cordum-io/cordum
