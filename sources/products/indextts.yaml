name: indextts
display_name: IndexTTS
type: model
description: Bilibili's zero-shot text-to-speech model, which clones a voice from a single reference clip. IndexTTS-2.5 speaks
  Chinese, English, Japanese, Spanish and Arabic, carries a voice across languages, controls emotion separately from timbre,
  sets speaking speed, and accepts pinyin, CMU phoneme or kana hints for pronunciation.
github:
- url: https://github.com/index-tts/index-tts
