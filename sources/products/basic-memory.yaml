name: basic-memory
display_name: Basic Memory
type: software
description: Basic Memory keeps the knowledge an AI assistant and its user share as Markdown files on disk, indexing
  each note's observations and wiki-style relations into a knowledge graph that MCP clients such as Claude, Codex
  and Cursor can search, read and extend. It runs locally with full-text and semantic search, and Basic Machines
  also sells a hosted cloud version with sync across devices.
