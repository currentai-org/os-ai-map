name: langsmith
display_name: LangSmith
type: software
description: Observability and testing platform from the LangChain team, providing tracing, datasets, evaluations,
  a prompt hub and annotation queues, alongside deployment and sandbox infrastructure for agents. It integrates
  tightly with the LangChain ecosystem and instruments any application through OpenTelemetry SDKs, and is offered
  as managed cloud, a customer-managed cloud (BYOC) option, or a self-hosted enterprise deployment.
pypi:
- url: https://pypi.org/project/langsmith
