name: aria
display_name: Aria
type: model
description: Aria is Rhymes AI's open multimodal mixture-of-experts model, pretrained natively on mixed text, image
  and video input. It has 25.3B total parameters with 3.9B active per token and a 64K-token multimodal context,
  and is aimed above all at video and document understanding. Base checkpoints with 8K and 64K context and a dialog-tuned
  Aria-Chat are released alongside it.
github:
- url: https://github.com/rhymes-ai/Aria
