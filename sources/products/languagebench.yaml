name: languagebench
display_name: languagebench
type: software
description: Auto-updating multilingual leaderboard and evaluation harness that tracks how well frontier
  language models perform in the world's languages, with a deliberate focus on low-resource ones. It runs
  seven tasks — translation both directions, classification, MMLU, ARC, TruthfulQA and MGSM — over a curated
  list of about forty hosted models via OpenRouter, drawing on FLORES+, Global-MMLU, AfriMMLU, AfriMGSM and
  Uhura-TruthfulQA and machine-translating the English-only sets where no native version exists. Results
  publish to a Hugging Face Space with a global proficiency map, and to two Hugging Face datasets holding
  the aggregated and per-sample tables.
github:
- url: https://github.com/datenlabor-bmz/evals-for-every-language
huggingface_dataset:
- url: https://huggingface.co/datasets/fair-forward/evals-for-every-language-results
- url: https://huggingface.co/datasets/fair-forward/evals-for-every-language-results-detailed
arxiv:
- url: https://arxiv.org/abs/2507.08538
comments: Named the AI Language Proficiency Monitor in the 2025 paper and renamed languagebench since; the
  repository keeps the older evals-for-every-language name and the Space resolves under both. Built by the
  BMZ Data Lab with GIZ's FAIR Forward programme and DFKI. Verified 2026-09-10 via the repository, its
  license endpoint, the README, the Hugging Face Space and dataset APIs, and the arXiv abstract.
