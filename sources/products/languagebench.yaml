name: languagebench
display_name: languagebench
type: software
description: Languagebench is an auto-updating multilingual leaderboard and harness that tracks frontier language
  models across the world's languages, with a deliberate focus on low-resource ones. It runs seven tasks -
  bidirectional translation, classification, MMLU, ARC, TruthfulQA and MGSM - over about forty models via OpenRouter,
  drawing on FLORES+, Global-MMLU, AfriMMLU, AfriMGSM and Uhura-TruthfulQA and machine-translating English-only
  sets where none exists. Results publish to a Hugging Face Space with a global proficiency map, plus two datasets
  of aggregated and per-sample tables.
github:
- url: https://github.com/datenlabor-bmz/evals-for-every-language
huggingface_dataset:
- url: https://huggingface.co/datasets/fair-forward/evals-for-every-language-results
- url: https://huggingface.co/datasets/fair-forward/evals-for-every-language-results-detailed
arxiv:
- url: https://arxiv.org/abs/2507.08538
comments: Named the AI Language Proficiency Monitor in the 2025 paper and renamed languagebench since; the
  repository keeps the older evals-for-every-language name and the Space resolves under both. Built by the
  BMZ Data Lab with GIZ's FAIR Forward programme and DFKI.
