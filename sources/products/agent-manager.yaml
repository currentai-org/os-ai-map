name: agent-manager
display_name: agent-manager
type: software
description: Terminal UI that runs coding-agent CLIs side by side, each in its own persistent tmux session
  on a private tmux server. It launches the user's own installed CLI unmodified, shows every session's
  live status in one foldable project tree, answers a session without attaching to it, revives or forks
  a session on its own conversation, and opens a full-file diff review whose line comments go back to
  the agent as one prompt. It supports Claude Code, Codex, OpenCode, Grok Build, Gemini CLI, Pi, Command
  Code, Hermes Agent and Muse Code, and ships as a Go binary for macOS, Linux and Windows under WSL2.
github:
- url: https://github.com/YoanWai/agent-manager
