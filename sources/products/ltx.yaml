name: ltx
display_name: LTX
type: model
description: LTX is Lightricks' family of diffusion-transformer video models. The current LTX-2 line, up to the
  22B LTX-2.5, generates synchronized video and audio in one model from text, image, video or audio input, with
  native output at 1024 by 1536 and a 4K upscaling path; the earlier LTX-Video models were built for speed. Lightricks
  also publishes a trainer for LoRA and full fine-tuning.
