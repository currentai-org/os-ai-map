name: isaac-sim
display_name: Isaac Sim
type: software
description: Isaac Sim is NVIDIA's robotics simulation platform, built on Omniverse, for developing, testing, training and
  deploying robots in simulated environments. It imports robots from URDF, MJCF and CAD, simulates them with GPU-accelerated
  physics, renders RTX cameras, lidar and radar alongside physics-based sensors, and provides synthetic data generation, a
  ROS bridge and the simulation that Isaac Lab trains on.
github:
- url: https://github.com/isaac-sim/IsaacSim
pypi:
- url: https://pypi.org/project/isaacsim/
artifact_exceptions:
  pypi_repo_mismatch: The isaacsim package on PyPI is NVIDIA's metapackage for installing Isaac Sim with pip; it declares
    no repository URL, and its documentation link is the Isaac Sim documentation site that this repository's README points
    to.
comments: Building or running Isaac Sim needs the Omniverse Kit SDK and NVIDIA's 3D assets, which are proprietary and come
  under a separate NVIDIA license. The pip packages install prebuilt binaries under that license too.
