name: textblob
display_name: TextBlob
type: software
description: Python library with a simple API for common text-processing tasks - noun-phrase extraction, part-of-speech
  tagging, sentiment analysis, classification, tokenization, n-grams, inflection, lemmatization, spelling correction
  and WordNet lookup. It builds on NLTK and on parts of the pattern library, and its classifiers wrap NLTK's
  naive Bayes and decision-tree learners.
github:
- url: https://github.com/sloria/TextBlob
pypi:
- url: https://pypi.org/project/textblob
