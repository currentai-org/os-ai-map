name: lightpanda
display_name: Lightpanda
type: software
description: Headless browser written in Zig for agent and automation workloads, implementing the DOM and a JavaScript
  runtime through V8 without rendering pixels, so pages are executed rather than drawn. Speaks the Chrome DevTools
  Protocol, so Playwright and Puppeteer clients drive it in place of Chrome.
github:
- url: https://github.com/lightpanda-io/browser
