name: mineru
display_name: MinerU
type: software
description: Document extraction pipeline that converts PDFs and Office documents into LLM-ready Markdown and JSON,
  preserving reading order and handling multi-column layouts, tables, formulas and scanned pages through OCR. Published
  by OpenDataLab and distributed as a Python package, a Docker image and a hosted web application.
github:
- url: https://github.com/opendatalab/MinerU
pypi:
- url: https://pypi.org/project/mineru
comments: OpenDataLab is a project identity under Shanghai AI Laboratory, whose contact address the GitHub org publishes
