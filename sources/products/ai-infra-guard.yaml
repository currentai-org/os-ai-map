name: ai-infra-guard
display_name: AI-Infra-Guard
type: software
description: AI-Infra-Guard (A.I.G) is a self-hosted red-teaming platform for AI systems from Tencent Zhuque Lab. It scans
  AI infrastructure for known vulnerabilities, audits MCP servers, agent skills and running agents, and runs jailbreak and
  safety evaluations against models served through OpenAI-compatible APIs. The platform runs as a web service in Docker, and
  each scanner is also published as its own Python package.
github:
