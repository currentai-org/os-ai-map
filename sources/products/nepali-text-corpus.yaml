name: nepali-text-corpus
display_name: Nepali Text Corpus
type: dataset
description: The Nepali Text Corpus is a monolingual Nepali pretraining corpus of about 6.4 million articles,
  27.5 GB as CSV, collected from Nepali news websites, blogs and other online sources. IRIIS Research assembled
  it to pretrain Nepali BERT, RoBERTa and GPT-2 models, and its paper puts it at about 2.4 times the size of
  earlier Nepali corpora.
huggingface_dataset:
- url: https://huggingface.co/datasets/IRIIS-RESEARCH/Nepali-Text-Corpus
arxiv:
- url: https://arxiv.org/abs/2411.15734
