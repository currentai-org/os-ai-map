name: dots-ocr
display_name: dots.ocr
type: model
description: Multilingual document-parsing model that performs layout detection and content recognition in
  a single vision-language model rather than a pipeline of separate stages, switching task by prompt. It emits
  layout blocks with their reading order and the text inside them.
github:
- url: https://github.com/studio-dots-ai/dots.ocr
comments: 'The GitHub API reports the repository under studio-dots-ai; it is commonly cited under a rednote-hilab
  path that does not resolve, and the LICENSE body carries a rednote-hilab copyright line, so the project moved
  organizations. Typed `model` rather than `software`: it publishes no installable package, so what you use
  is the weights, which is the same release shape as deepseek-ocr and the line this category draws between
  the two ladders. Verified 2026-09-16 via the repository and its recursive tree.'
huggingface_model:
- url: https://huggingface.co/rednote-hilab/dots.ocr
