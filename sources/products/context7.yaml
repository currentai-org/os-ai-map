type: software
description: Documentation retrieval service that supplies agents and coding assistants with current, version-correct
  library documentation and code examples, addressed over a hosted MCP endpoint or a CLI. The MCP server, CLI and
  SDK are published; the API backend, parsing engine and crawling engine that produce the index are not.
