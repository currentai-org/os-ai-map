name: sentencepiece
display_name: SentencePiece
type: software
description: SentencePiece is an unsupervised text tokenizer and detokenizer that implements subword units
  (Byte-Pair Encoding and unigram language model) directly from raw text, without language-specific pre-tokenization.
  It treats input as a stream of Unicode characters, enabling a language-independent, end-to-end pipeline
  useful for languages without clear word boundaries. It is developed and maintained by Google.
github:
- url: https://github.com/google/sentencepiece
pypi:
- url: https://pypi.org/project/sentencepiece/
comments: Verified live 2026-06-22 via primary sources. LICENSE body is verbatim Apache License 2.0; full
  C++/Python source public.
