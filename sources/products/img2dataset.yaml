name: img2dataset
display_name: img2dataset
type: software
description: img2dataset turns large lists of image URLs, with optional captions, into training-ready image datasets. It downloads,
  resizes and packages images into webdataset tar shards, parquet or TFRecord, and scales from one machine to Spark or Ray
  clusters. It skips images whose servers send noai-style X-Robots-Tag opt-out headers unless told otherwise, and was used
  to download the LAION image-text datasets.
github:
