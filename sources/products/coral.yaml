name: coral
display_name: Coral
type: software
description: 'One SQL interface over APIs, files, and live sources — built for agents. Agents make fewer, more precise
  tool calls with Coral than they do with per-source MCP servers, CLI tools, or API wrappers. For agent read tasks,
  SQL has a structural advantage when a question needs more than one API call: it avoids paginating through large
  results, returns tabular rows instead of sprawling JSON, brings back only the columns you asked for, and correlates
  across sources in a single statement.'
