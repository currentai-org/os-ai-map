name: torch-mlir
display_name: Torch-MLIR
type: software
description: Torch-MLIR brings PyTorch programs into the MLIR compiler ecosystem. It imports models through
  torch.fx or ONNX into its own torch dialect, normalizes them, and lowers them to the Linalg-on-Tensors,
  TOSA and StableHLO dialects, which downstream compilers such as IREE then compile for hardware. The
  project is an LLVM incubator project.
github:
- url: https://github.com/llvm/torch-mlir
pypi:
- url: https://pypi.org/project/torch-mlir/
