name: unity-mcp
display_name: MCP for Unity
type: software
description: 'MCP server that lets an AI assistant work inside the Unity Editor: creating scenes and GameObjects,
  editing C# scripts, managing assets, running tests, profiling and building. A Unity package added to the project
  pairs with a Python server that any MCP client can connect to, and tool groups for areas such as VFX, animation
  and UI can be switched on as needed. Coplay, which started the project, has joined Aura, which now maintains it.'
github:
- url: https://github.com/CoplayDev/unity-mcp
pypi:
- url: https://pypi.org/project/mcpforunityserver/
