name: honcho
display_name: Honcho
type: software
description: Honcho is a memory service for stateful agents that stores the messages exchanged between users and
  agents, reasons over them in the background to derive conclusions about each participant, and serves representations,
  session summaries and search results back as context. It runs as a FastAPI server, self-hosted or managed, with
  Python and TypeScript SDKs and plugins for coding agents. Plastic Labs builds it.
github:
- url: https://github.com/plastic-labs/honcho
