name: llm-compressor
display_name: LLM Compressor
type: software
description: LLM Compressor applies quantization and sparsification to large language models for deployment with
  vLLM, covering weight, activation, KV-cache and attention quantization along with transforms such as SmoothQuant
  and GPTQ. It reads and writes Hugging Face models, saves in the compressed-tensors format vLLM loads, and supports
  distributed and disk-offloaded compression of models too large for one device.
github:
- url: https://github.com/vllm-project/llm-compressor
pypi:
