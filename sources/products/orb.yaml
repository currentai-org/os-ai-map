name: orb
display_name: Orb
type: model
description: Orb is Orbital Materials' family of pretrained interatomic potentials for atomic simulations, covering inorganic crystals through the orb-v2 and orb-v3 series and molecular systems through OrbMol. The models predict energies, forces and stresses, expose a per-atom confidence head, integrate with ASE and TorchSim, and can be finetuned on a custom dataset with the packaged script.
github:
- url: https://github.com/orbital-materials/orb-models
pypi:
- url: https://pypi.org/project/orb-models
comments: Checkpoints are loaded through the orb_models.forcefield.pretrained module rather than declared as a Hub artifact. Verified 2026-09-10 via the GitHub API, the repository README, MODELS.md and LICENSE body.
