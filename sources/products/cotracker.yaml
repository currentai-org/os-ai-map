name: cotracker
display_name: CoTracker
type: model
description: 'CoTracker is Meta AI''s transformer model for tracking points through video: given any pixels in a
  frame, picked by hand or sampled on a grid, it follows them jointly across the clip. CoTracker3, the current version,
  comes in online and offline variants and was trained on synthetic Kubric video, then fine-tuned on real videos
  with pseudo-labels. It loads through torch.hub.'
github:
- url: https://github.com/facebookresearch/co-tracker
