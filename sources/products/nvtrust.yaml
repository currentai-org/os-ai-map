name: nvtrust
display_name: NVIDIA Attestation SDK (nvTrust)
type: software
description: NVIDIA's attestation tooling for confidential computing on its GPUs and NVSwitches. It collects
  hardware evidence from a GPU running in confidential-computing mode and verifies it, locally or through NVIDIA's
  remote attestation service, so a relying party can confirm what hardware and firmware ran a workload. The
  C++ SDK and nvattest CLI (NVAT) succeed the Python guest tools of the original nvTrust repository.
comments: 'Scored as both repositories: NVAT is the maintained successor, and the nvTrust Python SDK reached
  end of support on 2026-09-15, so its PyPI package is not declared. Tagged independently verifiable: the evidence
  is signed by the GPU and checked against NVIDIA''s certificate chain, not the operator''s word.'
github:
- url: https://github.com/NVIDIA/nvtrust
- url: https://github.com/NVIDIA/attestation-sdk
