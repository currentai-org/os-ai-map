description: SEACrowd collects and standardizes datasets for Southeast Asian languages behind one Python library,
  `seacrowd`, whose dataloaders return text, speech and vision-language corpora in shared schemas with license
  and citation metadata attached. The hub covers nearly 1,000 languages of the region across three modalities
  and ships benchmark bundles such as SEACrowd-VL. It is a grassroots research community effort modeled on
  NusaCrowd.
github:
- url: https://github.com/SEACrowd/seacrowd-datahub
pypi:
- url: https://pypi.org/project/seacrowd/
arxiv:
- url: https://arxiv.org/abs/2406.10118
comments: Scored as the hub and its library. The datasets it loads keep their own publishers and licenses,
  and the Hugging Face mirrors under the SEACrowd account are loaders for those datasets rather than new releases.
