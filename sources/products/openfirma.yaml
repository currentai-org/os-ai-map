name: openfirma
display_name: OpenFirma
type: software
description: OpenFirma puts a local sidecar between AI agents and the outside world and checks every outbound call
  against Cedar policies before it leaves. An authority issues short-lived capability tokens to each agent, the
  sidecar injects credentials only into an allowed call, and every decision is written as a signed audit event.
  Firma AI builds it in Rust.
github:
- url: https://github.com/Firma-AI/openfirma
