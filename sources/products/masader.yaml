name: masader
display_name: Masader
type: software
description: Masader is a public catalog of Arabic text and speech datasets, describing each with more than two
  dozen attributes such as dialect, domain, source, annotation method and license, and linking to where its publisher
  hosts it. New entries are submitted through a form and added by the maintainers. It began in the BigScience workshop
  and is maintained by the ARBML community.
github:
- url: https://github.com/ARBML/masader
