name: qwen
display_name: Qwen Base
type: model
aliases:
- qwen-2-5
- qwen-3-6
- qwen-3-7-max
- qwen-3-8
- qwen3
description: Alibaba's pretrained Qwen base models, published for fine-tuning and research rather than chat.
  The current base generation is Qwen3.5, released in February 2026 in five sizes from 0.8B to a 35B mixture
  of experts with 3B active parameters. Qwen has published no base checkpoints for Qwen 3.6 or 3.8, whose open-weight
  models ship post-trained only.
huggingface_model:
