- url: https://huggingface.co/Qwen/Qwen3.5-9B-Base
- url: https://huggingface.co/Qwen/Qwen3.5-4B-Base
- url: https://huggingface.co/Qwen/Qwen3.5-2B-Base
- url: https://huggingface.co/Qwen/Qwen3.5-0.8B-Base
comments: Covers Qwen's base checkpoints only. The post-trained models are in qwen-instruct, the same split
  as llama and llama-instruct; the aliases for the Qwen 3.6 to 3.8 releases point here from before that split.
