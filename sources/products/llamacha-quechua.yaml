name: llamacha-quechua
display_name: Llamacha monolingual Quechua corpus
type: dataset
description: Monolingual-Quechua-IIC is a Southern Quechua text corpus for training language models, collected
  mainly from the southern region of Peru and combined with the Quechua portions of Wikipedia and OSCAR. Its
  authors used it to train QuBERT, a BERT model for Quechua, and tested that on named-entity recognition and
  part-of-speech tagging. The Llamacha group released it.
huggingface_dataset:
- url: https://huggingface.co/datasets/Llamacha/monolingual-quechua-iic
