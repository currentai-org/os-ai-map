name: mcp-go-sdk
display_name: MCP Go SDK (official)
type: software
description: The official Go SDK for the Model Context Protocol, maintained in collaboration with Google. Implements
  client and server, all three primitives and every standard transport, against the current specification revision.
github:
- url: https://github.com/modelcontextprotocol/go-sdk
comments: Not to be confused with `mcp-go`, which is mark3labs' independent Go implementation and is also on
  this map. This SDK's own README names it - "notably mcp-go, originally authored by Ed Zynda... continue to
  be viable alternatives" - so the two are siblings rather than a duplicate, and the display names carry the
  distinction.
