name: insightface
display_name: InsightFace
type: software
description: Open-source face-analysis project covering face detection, alignment, recognition and attributes,
  known for the ArcFace recognition loss and the RetinaFace and SCRFD detectors. The insightface Python package
  runs its pretrained model packs through ONNX Runtime and downloads the default buffalo_l pack on first use;
  the repository also holds training code for detection and recognition. The library code is MIT-licensed,
  and the pretrained models are for non-commercial research, with commercial model licenses sold separately.
github:
- url: https://github.com/deepinsight/insightface
pypi:
- url: https://pypi.org/project/insightface
