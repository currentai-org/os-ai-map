name: roblox-sentinel
display_name: Roblox Sentinel
type: software
description: Roblox Sentinel is a Python library for detecting very rare kinds of harmful text, such as grooming, across a
  run of messages from one source rather than one message at a time. It compares each message with small sets of harmful and
  ordinary examples by embedding similarity, then combines the results for that source, by default with skewness, to surface
  candidates for human review. Roblox built it for its own chat moderation.
github:
- url: https://github.com/Roblox/Sentinel
comments: Sentinel installs from its repository and is not published to PyPI. The sentinel package there is an unrelated project.
