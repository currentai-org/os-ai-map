name: mcp-auth
display_name: MCP Auth
type: software
description: MCP Auth is a library that adds the authorization half of the Model Context Protocol to an MCP server.
  It verifies the JWT access tokens an OAuth or OpenID Connect provider issues, checking issuer, audience, expiry
  and the scopes a server or a tool requires, and serves the discovery metadata MCP clients use to find where to
  sign in. Node.js and Python SDKs come from Silverhand, the company behind Logto.
