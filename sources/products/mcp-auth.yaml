name: mcp-auth
display_name: MCP Auth
type: software
description: MCP Auth is a library that adds the authorization half of the Model Context Protocol to an MCP server.
  It verifies the JWT access tokens an OAuth 2.0 or OpenID Connect provider issues, checking signature, issuer,
  audience, expiry and the scopes a server or a single tool requires, and serves the discovery metadata MCP clients
  use to find where to sign in. Node.js and Python SDKs are published by Silverhand, the company behind Logto.
github:
- url: https://github.com/mcp-auth/js
- url: https://github.com/mcp-auth/python
pypi:
