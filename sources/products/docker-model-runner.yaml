name: docker-model-runner
display_name: Docker Model Runner
type: software
description: Docker Model Runner pulls, runs and serves AI models with Docker's tooling, from Docker Hub, any OCI
  registry or Hugging Face. It serves models over OpenAI- and Ollama-compatible APIs, uses llama.cpp by default
  with vLLM and Diffusers as alternative engines, and packages GGUF and Safetensors files as OCI artifacts. It ships
  inside Docker Desktop and Docker Engine, and as a standalone dmr binary.
github:
- url: https://github.com/docker/model-runner
comments: Docker Desktop, which bundles Model Runner on macOS and Windows, is proprietary, but the runner, its CLI
  and the standalone binary are all in the Apache-2.0 repository. The 2026-09-26 model_hubs sweep routed it to a
  runtime category. It is filed here rather than in deployment, beside Ollama, because deployment bands capability
  on isolation strength and this is a model server.
