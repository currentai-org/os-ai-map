name: lumo
display_name: Proton Lumo
type: software
description: Privacy-focused AI assistant from Proton with zero-access encryption, a no-logs policy and a ghost
  mode that discards conversations on close. It runs open-weights models in Proton's European data centers
  rather than sending prompts to third-party providers, and requires no account. Web and mobile clients are
  published as source; the backend service, routing layer and model serving are not.
github:
- url: https://github.com/ProtonLumo/ios-lumo
- url: https://github.com/ProtonLumo/android-lumo
comments: 'Proton markets Lumo as fully open source, which the record does not support: only the clients are
  public, and the iOS client is a web view around lumo.proton.me. Verified 2026-08-13 via the ProtonLumo iOS
  client repository and Proton''s Lumo announcements.'
