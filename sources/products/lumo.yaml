name: lumo
display_name: Proton Lumo
type: software
description: Privacy-focused AI assistant from Proton with zero-access encryption, a no-logs policy and a ghost
  mode that discards conversations on close. It runs open-weights models in Proton's European data centers
  rather than sending prompts to third-party providers, and requires no account.
github:
- url: https://github.com/ProtonLumo/ios-lumo
- url: https://github.com/ProtonLumo/android-lumo
comments: Proton's own account of Lumo's openness and the axis's reading differ in scope, so the axis carries
  the evidence. Verified 2026-08-13 via the ProtonLumo iOS client repository and Proton's Lumo announcements.
