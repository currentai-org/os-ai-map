name: rulesync
display_name: Rulesync
type: software
description: A Utility CLI for AI Coding Agents. A Node.js CLI tool that automatically generates configuration files
  for various AI development tools from unified AI rule files. Features selective generation, comprehensive import/export
  capabilities, and supports major AI development tools with rules, commands, MCP, ignore files, subagents and skills.
