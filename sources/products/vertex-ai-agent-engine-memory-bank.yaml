name: vertex-ai-agent-engine-memory-bank
display_name: Vertex AI Agent Engine Memory Bank
type: software
description: Vertex AI Agent Engine Memory Bank generates long-term memories from an agent's conversations, using
  a language model to extract facts on configured topics and to consolidate them with existing memories, updating
  or deleting those that new information contradicts. Memories are isolated per user, recalled by similarity search,
  kept as facts or structured profiles, and can expire on a time to live. Google runs it as a Google Cloud service.
comments: Google's documentation now calls this Agent Platform Memory Bank, part of the Gemini Enterprise Agent
  Platform, and the old cloud.google.com/vertex-ai Memory Bank pages redirect into that documentation. The slug
  keeps the Vertex AI name the corpus uses for Google's other Vertex products.
