name: llm-guard
display_name: LLM Guard
type: software
description: LLM Guard is a security toolkit for LLM interactions from Protect AI, providing input and output
  scanners for prompt injection, PII and data leakage, secrets, toxicity, bias and harmful content, with detection
  and sanitization. It runs as a self-hosted Python library or is deployed as an API.
github:
- url: https://github.com/protectai/llm-guard
pypi:
