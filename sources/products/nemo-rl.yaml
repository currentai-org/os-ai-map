name: nemo-rl
display_name: NeMo-RL
type: software
description: NeMo-RL is NVIDIA's library for reinforcement-learning post-training of language and vision-language
  models, re-architected from the earlier NeMo Aligner. It implements GRPO, GSPO, DAPO, PPO, DPO, SFT, on-policy
  distillation and reward modeling on DTensor or Megatron Core backends, and runs from a single GPU to multi-node
  clusters. NeMo Customizer is a separate managed fine-tuning microservice alongside it.
github:
- url: https://github.com/NVIDIA-NeMo/RL
comments: NeMo-RL ships from source or NVIDIA's NGC container; the PyPI listing is not used for installation.
