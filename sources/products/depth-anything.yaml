name: depth-anything
display_name: Depth Anything
type: model
description: Depth-estimation model line from ByteDance Seed and the University of Hong Kong. Depth Anything
  3, the current release, predicts consistent depth and camera pose from one image or many, with or without
  known poses, using a plain DINO-style transformer, and ships any-view, metric-depth, monocular and nested
  checkpoints from Small to Giant. Depth Anything V1 and V2 remain widely used for single-image depth.
github:
- url: https://github.com/ByteDance-Seed/Depth-Anything-3
huggingface_model:
- url: https://huggingface.co/depth-anything/DA3-LARGE
- url: https://huggingface.co/depth-anything/DA3-LARGE-1.1
- url: https://huggingface.co/depth-anything/DA3-GIANT
- url: https://huggingface.co/depth-anything/DA3NESTED-GIANT-LARGE-1.1
- url: https://huggingface.co/depth-anything/DA3METRIC-LARGE
- url: https://huggingface.co/depth-anything/DA3MONO-LARGE
pypi:
- url: https://pypi.org/project/depth-anything-3
  not_primary_channel: An install convenience for the inference code. The checkpoints are fetched from the
    Hub, where nearly all of the line's downloads are counted, and the package's own downloads are a small
    fraction of them.
