name: anthropic-internal-coding-evals
display_name: Anthropic Internal Coding Evals
type: dataset
description: Anthropic Internal Coding Evals are coding evaluation sets Anthropic uses internally to benchmark
  Claude models during development. One of them is the take-home exam Anthropic sets for performance-engineering
  candidates, which it also runs new models against.
comments: Distinct from the public benchmarks Anthropic also reports, such as SWE-bench Verified and Aider
  Polyglot.
