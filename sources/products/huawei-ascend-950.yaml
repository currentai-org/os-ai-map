name: huawei-ascend-950
display_name: Huawei Ascend 950 (950PR/950DT)
type: hardware
description: 'Huawei Ascend 950 is an AI processor whose two versions share one chip design and differ in the high-bandwidth
  memory packaged with it: the 950PR, with up to 128 GB, for the prefill stage of inference and recommendation, and the 950DT,
  with up to 144 GB at 4 TB/s, for decoding and training. It supports FP8, MXFP8, MXFP4 and Huawei''s HiF8 formats and links
  chips over Huawei''s UnifiedBus interconnect. The 950PR ships in the Atlas 350 PCIe card, and the 950DT is announced for
  Atlas 950 SuperPoD systems.'
