name: huawei-ascend-950
display_name: Huawei Ascend 950 (950PR/950DT)
type: hardware
description: 'Huawei Ascend 950 is an AI processor built on one compute die that Huawei pairs with two kinds of its own high-bandwidth
  memory: the 950PR, with up to 128 GB, for the prefill stage of inference and recommendation, and the 950DT, with up to 144
  GB at 4 TB/s, for decoding and training. It supports FP8, MXFP8, MXFP4 and Huawei''s HiF8 formats, links chips over Huawei''s
  UnifiedBus interconnect, and ships as the Atlas 350 PCIe card and in Atlas 950 SuperPoD systems.'
