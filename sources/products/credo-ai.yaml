name: credo-ai
display_name: Credo AI Governance Platform
type: software
description: Credo AI is a closed AI governance platform for registering AI agents, models and applications,
  assessing their risk and tracking compliance. Pre-built policy packs map requirements from the EU AI Act,
  NIST AI RMF, ISO 42001 and other frameworks to controls, and the platform generates audit-ready evidence
  and audit trails. It is sold as a hosted service.
comments: 'A closed comparator for the governance suites. Tagged self-attested: its evidence is generated inside
  the vendor''s platform.'
