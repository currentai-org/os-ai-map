name: lm-evaluation-harness
display_name: lm-evaluation-harness
type: software
description: Unified framework for evaluating language models across more than 60 academic benchmarks with
  hundreds of subtasks, including MMLU, ARC, GSM8K and HellaSwag, driven by a single config-based CLI. It was
  the backend behind the Hugging Face Open LLM Leaderboard and has been used in hundreds of papers to report
  reproducible benchmark numbers.
github:
- url: https://github.com/EleutherAI/lm-evaluation-harness
pypi:
