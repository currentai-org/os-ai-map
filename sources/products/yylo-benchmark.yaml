name: yylo-benchmark
display_name: YYLO Benchmark
type: software
description: YYLO Benchmark is a trusted-host experiment runner that compares models, harnesses and configurations
  on reviewed coding-agent cases. Each independent attempt starts in a fresh repository of pre-solution files,
  and retained outputs are later assessed by command checks, LLM judges or human reviewers, optionally against
  frozen checklists that yield a deterministic loss. Results stay separate, with no automatic winner. It ships
  as the @yylo/benchmark npm package from JUNO AI INC.
github:
- url: https://github.com/yylo-dev/yylo-benchmark
npm:
- url: https://www.npmjs.com/package/@yylo/benchmark
