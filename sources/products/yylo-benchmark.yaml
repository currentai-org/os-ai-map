name: yylo-benchmark
display_name: YYLO Benchmark
type: software
description: Benchmark harness for coding agents that runs every candidate attempt in a dedicated fresh
  repository with private home, temp, cache, and config roots behind a selective filesystem sandbox, and
  retains one hash-verified evidence chain linking the plan, attempt, workspace receipt, post-execution
  repository manifest, terminal, and evaluation IDs. Recovery, doctor, and report fail closed unless the
  complete chain verifies. It offers isolated v2 attempts plus an explicitly authorized governed-workflow
  lane, and distributes as the @yylo/benchmark npm package.
github:
- url: https://github.com/yylo-dev/yylo-benchmark
npm:
- url: https://www.npmjs.com/package/@yylo/benchmark
