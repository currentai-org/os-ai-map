name: bubblewrap
display_name: bubblewrap
type: software
description: bubblewrap (bwrap) is a small Linux tool that lets unprivileged users build sandboxes from kernel user
  namespaces. Each sandbox starts from an empty mount namespace on a tmpfs hidden from the host, with optional PID,
  IPC, network and UTS namespaces and seccomp filters. Rather than shipping a security policy of its own, it leaves
  the policy to whatever calls it, which is how Flatpak and Anthropic's Sandbox Runtime use it. The project lives
  in the containers GitHub organization.
github:
- url: https://github.com/containers/bubblewrap
  not_primary_channel: bubblewrap reaches users through Linux distribution packages and the tools that bundle
    it, such as Flatpak, not through the repository, so its star count does not measure how widely it is installed.
    Adoption rests on reported traction instead.
