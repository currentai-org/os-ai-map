name: scale-data-engine
display_name: Scale Data Engine
type: software
description: 'Scale AI''s full-stack commercial platform for building model training data: data curation,
  multimodal annotation and labeling, RLHF/preference data, red-teaming, and ML-assisted synthetic labeling.
  Historically a core data supplier to frontier labs.'
comments: Scale AI Data Engine / GenAI Platform, proprietary SaaS + services; no source-available core.
  Confirmed 2026-07-21. Meta took a ~49% non-voting stake (June 2025, ~$14.3B, ~$29B valuation); some
  labs (Google, OpenAI) reportedly pulled back afterward to protect data neutrality.
