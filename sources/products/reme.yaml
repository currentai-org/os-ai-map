name: reme
display_name: ReMe
type: software
description: ReMe keeps an agent's long-term memory as ordinary Markdown files, distilling conversations and resources
  into daily notes and consolidating them on a schedule into a linked knowledge base of facts, preferences and procedures.
  Agents reach it through a Python API, CLI, HTTP, MCP or plugins for hosts such as QwenPaw, Hermes Agent and OpenClaw.
  The AgentScope team builds it; it grew out of MemoryScope.
github:
- url: https://github.com/agentscope-ai/ReMe
pypi:
- url: https://pypi.org/project/reme-ai
