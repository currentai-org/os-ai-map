name: nchlt
display_name: NCHLT named-entity corpora
type: dataset
description: 'The NCHLT text corpora are foundational text resources for South African languages: monolingual
  corpora with subsets annotated for tokenization, morphology and part of speech, used to build tokenizers,
  lemmatizers and taggers. The Hugging Face entry loads the named-entity annotated corpora for nine languages,
  from Afrikaans to isiZulu, from the SADiLaR repository. A North-West University curator maintains the entry.'
huggingface_dataset:
- url: https://huggingface.co/datasets/nwu-ctext/nchlt
comments: Scored as the Hugging Face loader for the named-entity annotated corpora; the other NCHLT corpora
  on SADiLaR are not separately listed.
