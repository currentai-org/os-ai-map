name: opentinker
display_name: OpenTinker
type: software
description: 'OpenTinker trains language-model agents with supervised fine-tuning and reinforcement learning as
  a service: a client defines environments and objectives, and a server-side scheduler runs jobs on shared GPUs,
  with many LoRA adapters sharing one base model. Training runs on verl, with examples for math, vision-language
  geometry, ALFWorld, Android World and Gomoku agents. It was built at the University of Illinois Urbana-Champaign,
  independently of Thinking Machines, whose closed Tinker API its paper cites as motivation.'
