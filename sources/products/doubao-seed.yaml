name: doubao-seed
display_name: Doubao Seed 2.0
type: model
aliases:
- doubao-seed-2-0
description: ByteDance's closed-weight Seed 2.0 model line, released on 14 February 2026 as Pro, Lite and Mini
  general-purpose agent models plus a dedicated Code model. It covers multimodal understanding, reasoning and
  agentic tasks, and is served through the Doubao consumer app and the Volcano Engine API.
comments: Scores the Seed 2.0 Pro flagship; the later Seed 2.1 family is not covered by this entry.
