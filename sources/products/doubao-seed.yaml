description: ByteDance's closed-weight Seed model line, served through the Doubao consumer app and the Volcano
  Engine API. Seed 2.0, released on 14 February 2026, shipped Pro, Lite and Mini general-purpose agent models
  plus a dedicated Code model. The Seed2.1 family that followed, in Pro and Turbo, is the current release and
  is aimed at general agents and code engineering.
comments: Capability reads the Seed2.1 Pro flagship.
