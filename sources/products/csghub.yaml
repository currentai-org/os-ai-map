name: csghub
display_name: CSGHub
type: software
description: Self-hostable platform for managing large-model assets, positioned by OpenCSG as a private, on-premise
  counterpart to Hugging Face Hub. Users upload and version models, datasets, code, prompt and MCP repositories
  and application Spaces through a web UI, git, a CLI or the CSGHub SDK, backed by a Git server with Git LFS
  and object storage. Its API is compatible with Hugging Face clients, and it can synchronize repositories
  from remote hubs.
github:
- url: https://github.com/OpenCSGs/csghub
- url: https://github.com/OpenCSGs/csghub-server
comments: Scored as the self-hosted software, frontend and server together. OpenCSG also runs a hosted instance,
  which is not what this entry measures.
