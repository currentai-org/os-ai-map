description: IN22 is a machine translation test set for English and all 22 scheduled Indian languages, n-way parallel
  so that any pair of its languages can be evaluated. IN22-Gen holds 1,024 sentences from Wikipedia and Indian web
  sources across 13 domains, and IN22-Conv holds 1,503 sentences from English conversations written for the set.
  In-house translators translated every sentence without machine translation. AI4Bharat built it with the BPCC corpus
  and the IndicTrans2 models.
