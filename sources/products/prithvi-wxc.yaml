description: Prithvi WxC is a NASA-IBM weather and climate foundation model trained on 160 MERRA-2 variables. Its 2.3-billion-parameter architecture combines masked reconstruction with forecasting, accepts flexible time intervals, and has separate base and rollout checkpoints plus downstream adaptations for regional forecasting and climate processes.
