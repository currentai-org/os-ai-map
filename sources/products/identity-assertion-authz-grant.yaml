name: identity-assertion-authz-grant
display_name: Identity Assertion JWT Authorization Grant
type: software
description: Identity Assertion JWT Authorization Grant (ID-JAG) is an IETF OAuth working group draft that lets
  an application, such as an AI agent acting for a user, obtain an access token for another application's API through
  the identity provider both already trust for single sign-on. It profiles OAuth 2.0 Token Exchange and the JWT
  authorization grant into a pattern informally called Cross-App Access.
comments: Read against revision 06. An Internet-Draft is a work in progress that is revised, replaced or left to
  expire, so a later revision may change what it defines.
github:
- url: https://github.com/oauth-wg/oauth-identity-assertion-authz-grant
