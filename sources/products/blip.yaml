name: blip
display_name: BLIP
type: model
description: BLIP is Salesforce's family of vision-language models for image captioning, visual question answering
  and image-text matching. BLIP-2 connects a frozen image encoder to a frozen language model, OPT or Flan-T5, through
  a lightweight querying transformer, and InstructBLIP adds instruction tuning. The models are trained and run with
  Salesforce's LAVIS library.
github:
- url: https://github.com/salesforce/LAVIS
huggingface_model:
- url: https://huggingface.co/Salesforce/blip2-opt-2.7b
- url: https://huggingface.co/Salesforce/blip-image-captioning-base
- url: https://huggingface.co/Salesforce/blip-vqa-base
arxiv:
- url: https://arxiv.org/abs/2301.12597
comments: Scored on BLIP-2. The InstructBLIP checkpoints built on Vicuna carry an unspecified license, the LAVIS
  repository is archived, and Salesforce's later xGen-MM (BLIP-3) models are not part of this entry.
