name: blip
display_name: BLIP
type: model
description: BLIP is Salesforce's family of vision-language models for captioning, visual question answering
  and image-text matching. BLIP-2 connects a frozen image encoder to a frozen language model through a lightweight
  querying transformer, and InstructBLIP adds instruction tuning. xGen-MM, also called BLIP-3, continues the
  line with Phi-3-based models that read interleaved images and text; BLIP-3-Video is a separate video model
  that Salesforce built on it.
github:
- url: https://github.com/salesforce/LAVIS
huggingface_model:
- url: https://huggingface.co/Salesforce/xgen-mm-phi3-mini-instruct-interleave-r-v1.5
- url: https://huggingface.co/Salesforce/blip2-opt-2.7b
- url: https://huggingface.co/Salesforce/blip-image-captioning-base
- url: https://huggingface.co/Salesforce/blip-vqa-base
arxiv:
- url: https://arxiv.org/abs/2408.08872
- url: https://arxiv.org/abs/2301.12597
comments: The LAVIS repository, which holds the BLIP, BLIP-2 and xGen-MM training code on separate branches,
  is archived and names no successor. BLIP-3-Video and Salesforce's image-generation models BLIP3-o and BLIP3o-NEXT
  are not part of this entry.
