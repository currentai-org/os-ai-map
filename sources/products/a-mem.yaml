name: a-mem
display_name: A-MEM
type: software
description: A-MEM is a Python memory library for LLM agents that stores each memory as a note with model-generated
  keywords, tags and context, links it to related notes in ChromaDB, and revises the context of older notes as new
  ones arrive, after the Zettelkasten method. It implements the A-MEM paper and installs from source. The AGI Research
  group publishes it with the paper's authors.
comments: Read against agiresearch/A-mem. The first author's WujiangXu/A-mem-sys carries the same package with added
  model backends, and the paper's experiments live in WujiangXu/AgenticMemory.
github:
- url: https://github.com/agiresearch/A-mem
arxiv:
- url: https://arxiv.org/abs/2502.12110
