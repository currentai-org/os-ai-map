name: saami-web
display_name: Northern Sámi web corpus
type: dataset
description: The Northern Sámi web corpus is a crawl of about 33,000 web documents in Northern Sámi, seeded
  from the external links of the Sámi Wikipedia and continued breadth-first through pages that GlotLID identified
  as Northern Sámi and whose robots.txt allowed crawling. Text was extracted with Trafilatura and fuzzy-deduplicated
  document by document. The Language Technology Group at the University of Oslo publishes it.
huggingface_dataset:
- url: https://huggingface.co/datasets/ltg/saami-web
