name: mlx
display_name: MLX
type: software
description: MLX is an array framework for machine learning on Apple silicon, from Apple machine learning research.
  It offers a NumPy-like Python API plus C++, C and Swift APIs, higher-level mlx.nn and mlx.optimizers packages
  following PyTorch conventions, composable function transformations for automatic differentiation and vectorization,
  lazy evaluation, dynamic graph construction and a unified memory model across CPU and GPU.
