name: parallel-search
display_name: Parallel Search API
type: software
description: Search API that takes a natural-language objective rather than keywords and returns ranked URLs
  with compressed excerpts of their content, sized for a model's context. One of six separately priced APIs
  Parallel Web Systems sells.
pypi:
- url: https://pypi.org/project/parallel-web
comments: 'The seeded documentation path was a beta URL that now 404s; the API is out of beta at `/v1/search`
  and the docs redirect to `/search/search-quickstart`. Scored as the Search API SKU alone: the Responses API,
  which returns cited answers, is a separate line item at ten to fifty times the price, and the usage block
  of a search response names its own SKU as `sku_search`.'
