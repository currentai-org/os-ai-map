name: zenodo
display_name: Zenodo
type: software
description: Zenodo is a general-purpose research repository run by CERN, where anyone can deposit datasets alongside
  papers, software and other research outputs. Each record gets a DOI, files can be versioned under it, and a REST
  API handles deposit and retrieval. It was launched with OpenAIRE as a catch-all repository for EU-funded research
  and runs on the open-source InvenioRDM platform in CERN's data centre.
github:
- url: https://github.com/zenodo/zenodo-rdm
comments: Scored for its role as a dataset repository. Zenodo accepts every kind of research artifact, and datasets
  are one record type among them.
