name: mmdetection
display_name: MMDetection
type: software
description: MMDetection is OpenMMLab's PyTorch toolbox for object detection, instance segmentation and panoptic
  segmentation, built from interchangeable modules on the MMEngine and MMCV libraries. Its model zoo covers two-stage,
  one-stage and transformer detectors such as Faster R-CNN, RTMDet and DINO, along with open-vocabulary detectors
  such as GLIP and MM-Grounding-DINO, an open reproduction of Grounding DINO that finds objects named in a text
  prompt.
github:
- url: https://github.com/open-mmlab/mmdetection
pypi:
- url: https://pypi.org/project/mmdet/
