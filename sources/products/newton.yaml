name: newton
display_name: Newton
type: software
description: Newton is a GPU-accelerated, differentiable physics engine for robotics simulation, built on NVIDIA Warp with
  MuJoCo Warp as its primary backend and further solvers for articulated bodies, cloth, soft bodies and granular material.
  It loads URDF, MJCF and USD models and renders ray-traced camera images across many parallel worlds. Newton was initiated
  by Disney Research, Google DeepMind and NVIDIA and is a Linux Foundation project.
github:
- url: https://github.com/newton-physics/newton
pypi:
- url: https://pypi.org/project/newton
comments: 'The PyPI package newton carries no project_urls, because the repository pyproject.toml declares none. It is this
  project: the package name, authors (Newton Developers), summary and license match the repository pyproject.toml, the long
  description is the repository README, and the documentation installs it with pip install newton. The first upload, 0.1.1a2
  in August 2025, already carried the project README.'
