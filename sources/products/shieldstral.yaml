name: shieldstral
display_name: Shieldstral
type: model
description: Mistral AI's 3B-parameter multimodal safety classifier, built on Ministral 3 3B with a Pixtral vision
  encoder. Rather than predicting a fixed set of moderation categories, it answers one yes-or-no question written
  in natural language about a prompt, a response, a prompt-response pair or an image, and returns a continuous safety
  score from a single forward pass. It covers twelve languages and fits on a single 16GB GPU.
huggingface_model:
- url: https://huggingface.co/mistralai/Shieldstral-1.0-3B
arxiv:
