name: gpt-4-1
display_name: GPT-4.1
type: model
version_in_identity: same, GPT-4.1 is its own product line
description: GPT-4.1 is an instruction-tuned language model that OpenAI released in April 2025 through its
  API only, aimed at coding and long-context work with a 1,047,576-token context window. OpenAI's main production
  line has since moved to newer GPT-5 series models, and it recommends GPT-4.1 as a lower-latency choice for
  tasks that do not need reasoning.
