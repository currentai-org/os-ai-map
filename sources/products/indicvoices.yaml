name: indicvoices
display_name: IndicVoices
type: dataset
description: IndicVoices is a speech corpus of read, extempore and conversational audio in all 22 scheduled
  Indian languages, recorded from about 51,000 speakers in more than 400 districts. More than 23,000 hours
  have been recorded, and about half of them transcribed by people under published guidelines. AI4Bharat collected
  it with its open Kathbath and Shoonya tools and trained its 22-language IndicASR model on it.
github:
- url: https://github.com/AI4Bharat/IndicVoices
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/IndicVoices
arxiv:
- url: https://arxiv.org/abs/2403.01926
comments: Hour and speaker totals grow with each release; the card figures are used here, and they are well
  above the paper's.
