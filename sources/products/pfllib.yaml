name: pfllib
display_name: PFLlib
type: software
description: Personalized federated learning library and benchmark, built to be beginner-friendly. It implements
  traditional and personalized federated algorithms over heterogeneous-data scenarios, simulates hundreds of clients
  on a single GPU, includes privacy-evaluation attacks, and maintains a public leaderboard.
