name: deepseek-vl
display_name: DeepSeek-VL
type: model
description: DeepSeek-VL is DeepSeek's line of vision-language models, released separately from its general chat models. DeepSeek-VL2
  is a mixture-of-experts model in three sizes, from 1.0B to 4.5B activated parameters, that answers questions about images,
  reads documents, tables and charts, and grounds objects with bounding boxes across a few images per conversation.
github:
- url: https://github.com/deepseek-ai/DeepSeek-VL2
huggingface_model:
- url: https://huggingface.co/deepseek-ai/deepseek-vl2
- url: https://huggingface.co/deepseek-ai/deepseek-vl2-small
- url: https://huggingface.co/deepseek-ai/deepseek-vl2-tiny
arxiv:
- url: https://arxiv.org/abs/2412.10302
comments: DeepSeek has shipped no VL-named model since DeepSeek-VL2. Its later vision models, such as DeepSeek-V4-Flash-Vision-Exp,
  belong to the DeepSeek-V4 family and are part of the deepseek entry.
