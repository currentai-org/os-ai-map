name: trellis
display_name: TRELLIS
type: model
description: TRELLIS is Microsoft's family of 3D asset generation models built on structured 3D latents. The original
  models turn a text or image prompt into radiance fields, 3D Gaussians or textured meshes; TRELLIS.2, a 4B model,
  generates meshes with PBR materials from a single image at voxel resolutions up to 1536 cubed and can texture
  an existing mesh from a reference image.
