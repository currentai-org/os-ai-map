name: miles
display_name: Miles
type: software
description: Miles is a reinforcement learning framework for post-training large language and vision-language models.
  It pairs SGLang for rollout generation with Megatron-LM for training and offers a PyTorch FSDP2 backend as an
  alternative, with rollout and training workers decoupled so runs can be fully asynchronous. It is a fork of slime,
  maintained by RadixArk.
