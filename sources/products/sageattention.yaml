name: sageattention
display_name: SageAttention
type: software
description: SageAttention is a quantized attention implementation that replaces the attention operator with 8-bit
  and INT4 arithmetic, using outlier smoothing and per-thread quantization to hold accuracy. It is applied as a
  drop-in substitution in language, image and video models, and the repository carries the SageAttention, SageAttention2
  and SageAttention2++ implementations described in the papers.
