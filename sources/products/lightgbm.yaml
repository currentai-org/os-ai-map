name: lightgbm
display_name: LightGBM
type: software
description: Gradient-boosted decision tree library built for speed and memory efficiency, with histogram-based
  tree learning, leaf-wise growth, GPU training and distributed learning. It handles regression, classification
  and learning-to-rank from Python, R, C and a command line. Created at Microsoft, it moved in March 2026 to
  the lightgbm-org account under the same maintainers.
github:
- url: https://github.com/lightgbm-org/LightGBM
