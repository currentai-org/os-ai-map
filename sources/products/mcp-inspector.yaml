name: mcp-inspector
display_name: MCP Inspector
type: software
steward: agentic-ai-foundation
description: MCP Inspector is a developer tool for testing and debugging MCP servers. One npm package and one
  binary run three clients, a React web UI with a Node backend, a scriptable CLI for automation and CI, and
  an Ink terminal UI. It handles OAuth and stores client secrets in the OS keychain where one is available.
github:
- url: https://github.com/modelcontextprotocol/inspector
npm:
- url: https://www.npmjs.com/package/@modelcontextprotocol/inspector
