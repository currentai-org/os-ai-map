name: evidently
display_name: Evidently
type: software
description: Open-source framework to evaluate, test and monitor ML and LLM-powered systems, over both tabular
  and text data. Reports and Test Suites compute and gate on more than 100 built-in metrics, from data drift
  detection to LLM-as-judge scoring, and a Monitoring UI service visualizes those metrics and test results over
  time. The full monitoring dashboard is self-hostable; Evidently Cloud is a separate hosted product adding
  dataset and user management, alerting and no-code evals on top of the same open core.
github:
- url: https://github.com/evidentlyai/evidently
pypi:
- url: https://pypi.org/project/evidently
comments: Ruled into telemetry_observability rather than evaluation_code in the resolution ledger (2026-09-01,
  pull request 451 review) on product shape - continuous monitoring is Evidently's first-class surface and
  evaluation one workflow inside it, unlike a benchmark-runner or model-ranking harness. Verified 2026-09-02
  via the evidentlyai/evidently repository.
