name: torchgeo
display_name: TorchGeo
type: software
description: TorchGeo is a PyTorch domain library for geospatial data, modeled on torchvision. It provides remote-sensing
  datasets, samplers that draw patches by geographic location, transforms, and model weights pretrained on multispectral satellite
  imagery such as Sentinel-2, so a model can take more bands than RGB. Lightning data modules and tasks for classification,
  regression and semantic segmentation make published results reproducible.
github:
- url: https://github.com/torchgeo/torchgeo
pypi:
- url: https://pypi.org/project/torchgeo
