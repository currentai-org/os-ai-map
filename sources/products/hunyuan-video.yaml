name: hunyuan-video
display_name: HunyuanVideo
type: model
description: HunyuanVideo is Tencent's family of diffusion-transformer video generation models. The original 13B
  text-to-video model and its image-to-video variant were followed by HunyuanVideo 1.5, an 8.3B model with a 3D
  causal VAE that generates at 480p and 720p and upscales to 1080p with a few-step super-resolution network. Tencent
  publishes the weights with inference code and, for 1.5, a full training pipeline.
