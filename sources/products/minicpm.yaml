name: minicpm
display_name: MiniCPM
type: model
description: OpenBMB's on-device model family, spanning MiniCPM3-4B through the MiniCPM4/4.1 8B hybrid-reasoning
  generation to the current MiniCPM5 models at 1B and 2B. The line pairs small dense models with efficiency
  research, such as trainable sparse attention (InfLLM-V2) and quantized end-side inference, to run capable
  models on phones and edge hardware.
