name: liteparse
display_name: LiteParse
type: software
description: LiteParse is a local document parser with a Rust core that extracts text with its position on the page and
  reconstructs layout into Markdown, JSON or plain text. It reads PDFs through PDFium, converts Office files and images
  first, runs Tesseract or a plug-in OCR server on scanned pages, and renders page screenshots for agents. LlamaIndex
  publishes it for Python, Node.js, Rust and the browser.
