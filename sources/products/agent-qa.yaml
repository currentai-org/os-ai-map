name: agent-qa
display_name: Agent QA
type: software
description: Agent that tests web and mobile apps from tests written in natural language. It plans and
  carries out each action, re-observes the interface and tries another path when a step fails, and keeps
  memory from earlier runs to reuse proven actions. It ships a CLI, a dashboard, MCP and agent skills, and
  runs on the model the user brings.
github:
- url: https://github.com/vostride/agent-qa
npm:
- url: https://www.npmjs.com/package/agent-qa
