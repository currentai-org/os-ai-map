name: omnigent
display_name: Omnigent
type: software
description: 'Omnigent is an open-source AI agent framework and meta-harness: orchestrate Claude Code, Codex, Cursor,
  Pi, and custom agents — swap harnesses without rewriting, enforce policies and sandboxing, and collaborate in
  real time from any device. Omnigent is an open-source **meta-harness** that gives you a common orchestration layer
  over Claude Code, Codex, Cursor, OpenCode, Hermes, Pi, and the agents you write yourself: swap or combine harnesses
  without rewriting, enforce policies and sandboxing, and collaborate in real time from any device — terminal, browser,
  phone, or the native desktop app.'
