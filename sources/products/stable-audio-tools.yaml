name: stable-audio-tools
display_name: stable-audio-tools
type: software
description: stable-audio-tools is Stability AI's open training and inference library for audio generation models. It trains
  and runs latent diffusion models such as Stable Audio Open, the Dance Diffusion waveform models and the audio autoencoders
  they decode with, from JSON model and dataset configurations, with LoRA fine-tuning and a Gradio interface for trying a
  trained model.
github:
- url: https://github.com/Stability-AI/stable-audio-tools
pypi:
- url: https://pypi.org/project/stable-audio-tools/
comments: Scored as the library. The Stable Audio weights it loads are their own entry, stable-audio, under Stability's community
  license; the newer Stable Audio 3 models ship their own pipeline in a separate repository.
