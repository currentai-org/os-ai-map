name: areal
display_name: AReaL
type: software
description: AReaL is a reinforcement learning system for training reasoning and agentic language models. It uses
  a fully asynchronous training paradigm that decouples rollout generation from policy updates, and supports FSDP
  and Megatron training backends with vLLM and SGLang inference backends. It was developed by the AReaL Team at
  Tsinghua IIIS and Ant Group.
