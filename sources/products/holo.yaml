name: holo
display_name: Holo
type: model
description: Holo is H Company's family of vision-language models for computer-use agents, fine-tuned from Qwen
  bases to read screens and act on web, desktop and mobile interfaces. The current Holo3.1 release comes in 0.8B,
  4B, 9B and 35B-A3B sizes with native function calling and FP8, NVFP4 and GGUF builds. H Company's larger Holo3-122B
  model is available only through its API.
huggingface_model:
- url: https://huggingface.co/Hcompany/Holo-3.1-35B-A3B
- url: https://huggingface.co/Hcompany/Holo-3.1-4B
- url: https://huggingface.co/Hcompany/Holo2-4B
comments: Scored on Holo3.1. Some earlier Holo sizes carry a non-commercial or Qwen Research license rather than
