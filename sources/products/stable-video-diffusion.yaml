name: stable-video-diffusion
display_name: Stable Video Diffusion
type: model
description: Stable Video Diffusion is Stability AI's latent diffusion model that turns a single still image into a short
  video clip. The original SVD generates 14 frames and SVD-XT 25 frames at 576x1024; SVD-XT 1.1, released in February
  2024, is a fine-tune of SVD-XT for more consistent output.
github:
- url: https://github.com/Stability-AI/generative-models
huggingface_model:
- url: https://huggingface.co/stabilityai/stable-video-diffusion-img2vid-xt
- url: https://huggingface.co/stabilityai/stable-video-diffusion-img2vid
- url: https://huggingface.co/stabilityai/stable-video-diffusion-img2vid-xt-1-1
arxiv:
- url: https://arxiv.org/abs/2311.15127
comments: 'Stable Video 3D (SV3D) and Stable Video 4D (SV4D, SV4D 2.0 of May 2025) are built on SVD but generate orbital
  and multi-view video of an object rather than a clip from an image, so they are not part of this entry; the category
  already treats Stability AI''s 3D models as separate products. The generative-models repository is shared with Stable
  Diffusion and publishes SVD inference only. Dormant: no SVD release since February 2024, but the two 2023 checkpoints
  still draw about 330K downloads a month.'
