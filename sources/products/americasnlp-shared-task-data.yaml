name: americasnlp-shared-task-data
display_name: AmericasNLP shared-task data
type: dataset
description: The AmericasNLP shared-task data pairs Spanish with ten Indigenous languages of the Americas,
  including Aymara, Bribri, Asháninka, Guarani, Wixarika, Nahuatl, Otomí, Quechua, Shipibo-Konibo and Rarámuri,
  for machine translation. Training sets gather existing parallel corpora, while development and test sets
  were translated by hand for the task. The AmericasNLP workshop organizers publish it with each shared task.
