name: lamindb
display_name: LaminDB
type: software
description: LaminDB is an open-source data management library for traceable, multimodal AI and life-sciences
  data. It queries, traces and governs datasets across diverse storage formats and locations through a Django-ORM
  registry, tracking lineage, branching and versioning over files, tables and arrays without a separate server.
