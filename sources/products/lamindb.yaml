name: lamindb
display_name: LaminDB
type: software
description: LaminDB is an open-source data management library for traceable, multimodal AI and life-sciences
  data. It queries, traces and governs datasets across diverse storage formats and locations through a Django-ORM
  registry, tracking lineage, branching and versioning over files, tables and arrays without a separate server.
github:
- url: https://github.com/laminlabs/lamindb
pypi:
- url: https://pypi.org/project/lamindb/
comments: lamindb on PyPI is the library itself - there is no separate server - and its metadata points back at
  laminlabs/lamindb, so it is the measurement identity and adoption bands on its downloads. Verified 2026-09-02
  via the GitHub API, the PyPI metadata and the LICENSE body.
