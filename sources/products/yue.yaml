name: yue
display_name: YuE
type: model
description: YuE is an open song-generation model from the Multimodal Art Projection (M-A-P) research community. It turns
  lyrics and a style prompt into a complete song with vocals and accompaniment. Its second generation, YuE2, released
  in September 2026, first writes a readable score of melody and chords that a person or an agent can edit, then renders
  48 kHz stereo audio from it.
github:
- url: https://github.com/multimodal-art-projection/YuE
huggingface_model:
- url: https://huggingface.co/m-a-p/YuE2-3B
- url: https://huggingface.co/m-a-p/YuE2-Vae
- url: https://huggingface.co/m-a-p/YuE-s1-7B-anneal-en-cot
- url: https://huggingface.co/m-a-p/YuE-s2-1B-general
arxiv:
- url: https://arxiv.org/abs/2609.33757
comments: YuE2 is the current release. The original YuE of January 2025, a 7B and 1B two-stage pair, stays on the Hub
  and on the repository's YuE-v1 branch. The YuE2 weights are licensed CC BY-NC 4.0 with an added permission that lets
  individual creators sell what they make; a company needs a separate commercial license. The code is Apache 2.0.
