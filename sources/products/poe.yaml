name: poe
display_name: Poe
type: software
description: Multi-model chat aggregator from Quora, giving access to many providers' models plus image, video
  and audio generators from one interface, on a points-based unified pricing model. Alongside the providers'
  own assistants it carries bots that users build and publish themselves, which is what distinguishes it from
  a single-vendor chat surface.
comments: The figures the adoption reading was first based on are no longer on the page behind them; the reading
  was re-derived on the only sourceable active-user figure.
