name: vietnamese-curated-dataset
display_name: Vietnamese Curated Dataset
type: dataset
description: 'Vietnamese Curated Dataset is a pretraining text corpus of about 12.2 million Vietnamese documents
  assembled from existing open sources: the Vietnamese subsets of C4 and OSCAR 23.01, Vietnamese Wikipedia
  and the Binhvq news corpus. Viettel Solutions cleaned it with NVIDIA NeMo Curator, applying Unicode normalization,
  exact deduplication, and heuristic and classifier-based quality filtering.'
huggingface_dataset:
- url: https://huggingface.co/datasets/VTSNLP/vietnamese_curated_dataset
