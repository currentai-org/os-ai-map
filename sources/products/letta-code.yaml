name: letta-code
display_name: Letta Code
type: software
description: Stateful agents that are like people, with memory, identity, and the ability to learn and adapt. Letta
  Code is a stateful agent harness for creating agents that are more like people than tools. Letta Code agents have
  memory, identity, and a sense of experience over time. They learn and evolve over long horizons through rewriting
  their own memory, skills, prompts, and even the harness itself (through mods).
