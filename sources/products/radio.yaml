name: radio
display_name: C-RADIO
type: model
description: C-RADIO is NVIDIA Research's commercially licensed line of RADIO vision backbones, which distill several
  teacher models into one Vision Transformer producing both image-level and dense features. C-RADIOv4 learns from SigLIP2,
  DINOv3 and SAM3, and adaptors reproduce each teacher's features, including text-aligned embeddings for zero-shot classification.
  The models load through PyTorch Hub or Hugging Face Transformers.
github:
- url: https://github.com/NVlabs/RADIO
huggingface_model:
- url: https://huggingface.co/nvidia/C-RADIOv4-SO400M
- url: https://huggingface.co/nvidia/C-RADIOv4-H
- url: https://huggingface.co/nvidia/C-RADIOv3-H
- url: https://huggingface.co/nvidia/C-RADIOv3-L
- url: https://huggingface.co/nvidia/C-RADIOv3-B
