name: brave-search-api
display_name: Brave Search API
type: software
description: 'Search API over Brave''s own web index, sold as one plan covering three endpoints: Web Search
  for human-readable results, LLM Context for pre-extracted page chunks aimed at models, and the specialized
  news, video, image, place, autosuggest and spellcheck endpoints.'
comments: 'The documentation serves two path prefixes and the nav''s own links use the one the obvious URL
  does not: `/app/documentation/web-search/get-started` is live, while `/app/documentation/pricing` 404s and
  `/documentation/pricing` is 200. Brave''s AI Answers endpoint is NOT part of this product - it is a separately
  activated plan at its own price - which is why this record bands where it does. Worth recording for anyone
  using this data: the API terms forbid using search results to "create, evaluate, train, re-train, fine-tune,
  benchmark or otherwise improve artificial intelligence models". Verified 2026-09-17 via the API documentation,
  the pricing page and the terms of service.'
