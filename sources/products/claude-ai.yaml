name: claude-ai
display_name: Claude.ai
type: software
description: Anthropic's consumer chat product (web, desktop, mobile) for interacting with Claude Sonnet/Opus
  models, with Projects, Artifacts (live-rendered code/docs), and Computer Use. ~30M monthly active users
  and adding 1M+ daily signups as of March 2026, third-largest US mobile chatbot.
comments: Claude.ai (Anthropic) consumer chat app, web + macOS/Windows + iOS/Android. Proprietary/closed UI
  scored as the closed counterpart. Verified 2026-08-13 via the Claude product overview page. Uses Claude Opus/Sonnet/Haiku.
  Anthropic still publishes no consumer MAU figure of its own, so the adoption axis still rests on an aggregator
  estimate.
