name: qwen-vl
display_name: Qwen-VL
type: model
description: Qwen-VL is Alibaba's vision-language model line, from Qwen-VL and Qwen2-VL through Qwen2.5-VL to Qwen3-VL,
  released in dense and mixture-of-experts sizes with Instruct and Thinking editions. Qwen3-VL reads images, documents
  in 32 OCR languages and hours-long video in a 256K context, grounds objects in 2D and 3D, and operates desktop
  and phone interfaces. Its successor is the natively multimodal Qwen3.5 family.
github:
- url: https://github.com/QwenLM/Qwen3-VL
