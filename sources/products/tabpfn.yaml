name: tabpfn
display_name: TabPFN
type: model
description: 'Tabular foundation model from Prior Labs that predicts on a new classification or regression table
  in a single forward pass, with no training or hyperparameter search: the fitted dataset is read in context. It
  is pretrained only on synthetic tables drawn from a prior. The tabpfn package runs the checkpoints locally and
  adds fine-tuning, and a hosted API and enterprise edition are sold separately.'
github:
- url: https://github.com/PriorLabs/TabPFN
pypi:
- url: https://pypi.org/project/tabpfn
huggingface_model:
- url: https://huggingface.co/Prior-Labs/tabpfn_3
arxiv:
- url: https://arxiv.org/abs/2605.13986
