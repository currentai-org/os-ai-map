name: federatedscope
display_name: FederatedScope
type: software
description: Federated learning platform from Alibaba. One configuration runs either in standalone mode, which simulates
  participants on one device, or in distributed mode, where each participant is its own process on its own machine.
  It covers graph and personalized federated learning, differential privacy and privacy-attack tooling, and a separate
  LLM branch for federated fine-tuning of language models.
github:
- url: https://github.com/alibaba/FederatedScope
comments: 'No package is declared: `federatedscope` returns 404 on pypi.org. The LICENSE is Apache-2.0 followed
  by notices for bundled third-party code, so it has to be read past the first page. FederatedScope-LLM lives on
  a branch of this repository and is part of this record. The repository was last pushed 2024-08-10.'
