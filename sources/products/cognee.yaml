name: cognee
display_name: Cognee
type: software
description: Cognee gives AI agents persistent memory by turning documents, code and conversations into a knowledge
  graph with embeddings, then answering recall queries from that graph or from short-term session memory. An improve
  step distills sessions into lasting lessons and settles conflicting facts. It runs locally as a Python library,
  API server or MCP server, and Topoteretes, the company behind it, also offers Cognee Cloud.
github:
- url: https://github.com/topoteretes/cognee
