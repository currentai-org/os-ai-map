name: qwen-instruct
display_name: Qwen 3.8
type: model
aliases:
- qwen2-5-14b-instruct
description: 'Alibaba''s post-trained Qwen chat models. The current release, Qwen 3.8 from August 2026, ships
  three open-weight models that think by default and can answer directly on request: a dense 27B under Apache-2.0,
  Qwen3.8-Flash-Next, a 125B mixture of experts with 6B active parameters, and the 2.4-trillion-parameter Qwen3.8-2.4T-A95B,
  which is also the base of the hosted Qwen3.8-Max. From Qwen 3.5 on, Alibaba publishes its chat checkpoints
  under the plain release name rather than as Instruct models.'
