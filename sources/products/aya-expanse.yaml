name: aya-expanse
display_name: Aya Expanse
type: model
description: Aya Expanse is a family of multilingual chat models from Cohere Labs, Cohere's research lab,
  released in October 2024 at 8B and 32B parameters. It covers 23 languages and was built by combining
  data arbitrage, multilingual preference training and model merging. Cohere's later Tiny Aya and Aya
  Vision models are separate lines.
