name: videollama
display_name: VideoLLaMA
type: model
description: VideoLLaMA is Alibaba DAMO Academy's video-language model line, which answers questions about video
  and images in text. VideoLLaMA3 builds on Qwen2.5 language models in 2B and 7B sizes, samples video at a configurable
  frame rate and is trained in four stages from vision-encoder adaptation to video-centric fine-tuning. VideoLLaMA2.1-AV
  adds audio-visual input.
github:
- url: https://github.com/DAMO-NLP-SG/VideoLLaMA3
huggingface_model:
- url: https://huggingface.co/DAMO-NLP-SG/VideoLLaMA3-7B
- url: https://huggingface.co/DAMO-NLP-SG/VideoLLaMA3-2B
arxiv:
- url: https://arxiv.org/abs/2501.13106
comments: The repository's README calls the service a research preview for non-commercial use, while the LICENSE
  file and every checkpoint carry Apache 2.0; the entry reads the license, not the README.
