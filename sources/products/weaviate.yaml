name: weaviate
display_name: Weaviate
type: software
description: Weaviate is an open-source vector database that stores objects and vectors together, combining vector
  search with structured filtering, keyword and hybrid search behind a GraphQL and REST API. It runs embedded for
  development, self-hosted as a Docker or Kubernetes cluster, or on the vendor's hosted service, with optional
  modules that call out to embedding and reranking models.
github:
- url: https://github.com/weaviate/weaviate
pypi:
- url: https://pypi.org/project/weaviate-client/
comments: weaviate-client on PyPI is the Python client for a self-hosted or hosted Weaviate instance, not the
  server, so its downloads are not attributed to this product. Verified 2026-09-02 via the GitHub API and the
  LICENSE body.
