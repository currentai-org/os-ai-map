name: lyria
display_name: Lyria
type: model
description: Lyria is Google DeepMind's music generation model line, which produces full-length songs with vocals
  and instrumental clips from text prompts. It is served through the Gemini API and in Google products including
  Gemini, YouTube Shorts and Flow, alongside a real-time variant for interactive generation.
comments: Magenta RealTime, which Google describes as its open Lyria model, is a separate open-weight release and
  is not part of this entry.
