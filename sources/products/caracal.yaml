name: caracal
display_name: Caracal
type: software
description: Caracal is a self-hosted authorization service that gives AI agents short-lived, signed mandates instead
  of credentials. A policy service decides each request before it runs, a gateway injects the real upstream credential
  at call time, delegated mandates can only narrow, and every decision lands in a tamper-evident audit chain. Garudex
  Labs builds it, with TypeScript, Python and Go SDKs.
