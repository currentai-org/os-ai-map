name: eurollm
display_name: EuroLLM
type: model
description: EuroLLM is an open-weights multilingual LLM family from a European consortium led by Unbabel and
  DeepSPIN at Instituto Superior Técnico, under the UTTER Horizon Europe project. The 22B flagship, plus 9B
  and 1.7B siblings, is trained from scratch on ~4 trillion tokens across the EU's 24 official languages plus
  11 more, on the MareNostrum5 supercomputer under a EuroHPC grant. Released under Apache-2.0 with base and
  instruct variants, per-phase Megatron-Core checkpoints, the EuroWeb and EuroBlocks datasets, and an eval
  harness; the full pretraining corpus and training recipe are not released.
