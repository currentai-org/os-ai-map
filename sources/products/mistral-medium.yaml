name: mistral-medium
display_name: Mistral Medium
type: model
description: Mistral AI's flagship open-weight model. Mistral Medium 3.5 is a dense 128-billion-parameter model
  that handles instruction following, reasoning and coding in one set of weights, with a 256k-token context window,
  image input and reasoning effort set per request. It replaced Magistral and Mistral Medium 3.1 in Le Chat and
  Devstral 2 in the Vibe coding agent.
