name: afrivoice
display_name: Afrivoice
type: dataset
description: Afrivoice is a family of speech datasets, mostly recorded by speakers describing photographs aloud,
  with transcriptions for all or part of the audio. Releases cover Kinyarwanda, Swahili, five Ethiopian languages,
  a set including Shona, Lingala, Wolof and Somali, and a batch for Kirundi, Ndau, Ndebele, Oshiwambo and Gamo,
  about 15,000 hours across the current releases. Digital Umuganda collects and publishes it.
