name: memos
display_name: MemOS
type: software
description: MemOS is a memory operating system for LLM agents that extracts structured memories from conversations,
  documents and tool traces, organizes them as graph-based textual, preference and activation memory in composable
  memory cubes, and schedules updates, merging and forgetting in the background. It runs as a self-hosted REST service
  or as a local memory plugin for OpenClaw, Hermes Agent and DeepSeek Harness. MemTensor builds it.
