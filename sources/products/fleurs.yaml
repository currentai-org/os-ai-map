name: fleurs
display_name: FLEURS
type: dataset
languages: [afr, amh, ara, asm, ast, azj, bel, ben, bos, bul, cat, ceb, ces, ckb, cmn, cym, dan, deu, ell,
  eng, est, fas, fin, fra, ful, gle, glg, guj, hau, heb, hin, hrv, hun, hye, ibo, ind, isl, ita, jav, jpn,
  kam, kan, kat, kaz, kea, khm, kir, kor, lao, lav, lin, lit, ltz, lug, luo, mal, mar, mkd, mlt, mon, mri,
  msa, mya, nld, nob, npi, nso, nya, oci, orm, ory, pan, pol, por, pus, ron, rus, slk, slv, sna, snd, som,
  spa, srp, swe, swh, tam, tel, tgk, tgl, tha, tur, ukr, umb, urd, uzb, vie, wol, xho, yor, yue, zul]
description: FLEURS is an n-way parallel speech benchmark in 102 languages, made by recording people reading
  the FLORES sentences aloud. Each language has roughly ten hours of training speech plus separate development
  and test speakers, and it supports speech recognition, spoken language identification, speech translation
  and retrieval. Google built it as the speech counterpart of FLORES.
