name: oldi-seed
display_name: OLDI Seed
type: dataset
languages: [ace, ary, arz, bam, ban, ben, bho, bjn, bug, crh, dik, dzo, eng, fra, fur, fuv, gug, hne, ita,
  kas, knc, lij, lim, lmo, ltg, mag, mni, mri, nqo, nus, pbt, prs, scn, shn, spa, srd, szl, taq, vec, zgh]
description: OLDI Seed is a parallel corpus of 6,193 English Wikipedia sentences translated into several dozen
  low-resource languages, meant to kick-start machine translation where no large training set exists. It extends
  the NLLB-Seed data that Meta commissioned from professional translators for No Language Left Behind. The
  Open Language Data Initiative now maintains it and adds community translations.
huggingface_dataset:
- url: https://huggingface.co/datasets/openlanguagedata/oldi_seed
arxiv:
- url: https://arxiv.org/abs/2207.04672
