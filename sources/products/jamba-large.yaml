name: jamba-large
display_name: Jamba 1.5 Large
type: model
aliases:
- jamba-1-5-large
description: 'AI21-Jamba-1.5-Large (ai21labs/AI21-Jamba-1.5-Large on HF), hybrid SSM-Transformer (Mamba+Attention)
  MoE, 398B total / 94B active, 256K context, instruction-tuned chat model with tool use / grounded-RAG / JSON mode.
  Announced 22 Aug 2024 under the Jamba Open Model License. Stale: superseded
  by Jamba 1.6 (Mar 2025) and the Jamba2/Jamba Reasoning 3B generation now headlined on ai21.com/jamba. Recategorized
  from base_pretrained -> finetuned_chat: this is the instruct/chat SKU (post-trained for downstream chat/agentic
  use), not a raw base model.'
huggingface_model:
- url: https://huggingface.co/ai21labs/AI21-Jamba-1.5-Large
comments: Recategorized from base_pretrained -> finetuned_chat; this is the instruct/chat SKU, not a raw base
  model. The repo is gated `auto`, so openness was read from the model card and the license body rather than
  a download. Verified 2026-08-13 via the HF model card, the Jamba Open Model License body and the AI21 release
  blog.
