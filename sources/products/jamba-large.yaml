name: jamba-large
display_name: Jamba 1.5 Large
type: model
aliases:
- jamba-1-5-large
description: Jamba 1.5 Large is a hybrid Mamba-Transformer mixture-of-experts chat model from AI21 Labs, with
  398B total and 94B active parameters and a 256K-token context window. It is instruction-tuned for chat and
  agentic use, with tool use, grounded generation and JSON mode. AI21 announced it in August 2024, and its
  Hugging Face card lists Jamba-Large-1.7 as the newer version.
huggingface_model:
- url: https://huggingface.co/ai21labs/AI21-Jamba-1.5-Large
comments: The repository is gated with automatic approval, so openness was read from the model card and license
  text rather than a download.
