name: z-image
display_name: Z-Image
type: model
description: Z-Image is a 6B-parameter single-stream diffusion transformer for text-to-image generation from Alibaba's
  Tongyi-MAI lab. Z-Image-Turbo is a distilled version that generates in eight steps and fits in 16 GB of GPU memory,
  with photorealistic output and bilingual English and Chinese text rendering; the undistilled Z-Image base model
  supports full classifier-free guidance for fine-tuning.
