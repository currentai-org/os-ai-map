name: zenml
display_name: ZenML
type: software
description: Framework for writing machine-learning and agent pipelines once and running them on whichever
  infrastructure stack is configured underneath. A stack names an orchestrator, an artifact store and the rest
  of the components; ZenML containerizes the pipeline code and hands execution to that orchestrator, which
  may be Airflow, Kubeflow, SageMaker, Vertex, AzureML, Databricks, Tekton, Kubernetes or a SkyPilot VM.
github:
- url: https://github.com/zenml-io/zenml
pypi:
- url: https://pypi.org/project/zenml/
comments: ZenML Pro is a separate closed control plane, self-hostable but distributed as private container
  images. Kitaru, the agent-replay product, is priced separately and is not this record.
