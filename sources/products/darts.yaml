name: darts
display_name: Darts
type: software
description: Time-series forecasting and anomaly-detection library from Unit8 with one fit/predict interface
  over many model kinds - baselines, statistical models such as ARIMA, ETS, Theta and TBATS, regression models
  on scikit-learn, LightGBM, XGBoost and CatBoost, deep models such as N-BEATS, N-HiTS, TFT, TiDE and TSMixer,
  and pretrained foundation models such as Chronos-2 and TimesFM that forecast without training. It adds backtesting,
  ensembling, conformal prediction and covariate support.
github:
- url: https://github.com/unit8co/darts
pypi:
- url: https://pypi.org/project/darts
