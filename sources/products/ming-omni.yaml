name: ming-omni
display_name: Ming-Omni
type: model
description: 'Ming-Omni is inclusionAI''s omni model line: it takes images, text, video and audio and answers in text, speech
  or generated images. Ming-flash-omni 2.0, the current release, is a mixture-of-experts model with 100B total and 6B active
  parameters on the Ling-2.0 architecture, and generates speech, sound and music in one pipeline with voice cloning, alongside
  image generation and editing. inclusionAI is Ant Group''s AI lab.'
github:
- url: https://github.com/inclusionAI/Ming
