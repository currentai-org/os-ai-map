name: rdt
display_name: RDT (Robotics Diffusion Transformer)
type: model
description: RDT is Tsinghua University's line of bimanual robot foundation models. RDT-1B is a one-billion-parameter
  diffusion transformer pretrained on more than a million multi-robot episodes; RDT2 adapts Qwen2.5-VL-7B into a
  vision-language-action model trained on over ten thousand hours of data from a handheld gripper, and deploys zero-shot
  on bimanual UR5e and Franka arms it was not trained on.
