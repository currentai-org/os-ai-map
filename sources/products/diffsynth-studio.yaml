name: diffsynth-studio
display_name: DiffSynth-Studio
type: software
description: DiffSynth-Studio is the ModelScope team's Python engine for running and training diffusion models. It supports
  inference and full or LoRA training for image models (FLUX, Qwen-Image, Z-Image and others), video models (Wan, LTX-2,
  MiniMax H3) and audio models (ACE-Step, YuE2, MiniMax-Music3), and powers ModelScope's hosted generation service.
github:
- url: https://github.com/modelscope/DiffSynth-Studio
pypi:
- url: https://pypi.org/project/diffsynth/
comments: The PyPI package diffsynth is published by "ModelScope Team", carries the repository README as its description,
  and is the package the README's PyPI badge points to; its metadata names no repository URL. The README recommends a
  source install. A third engine beside stable-diffusion.cpp and Nunchaku, and the only one here that trains as well
  as runs models.
