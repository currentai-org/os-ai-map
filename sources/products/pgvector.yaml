name: pgvector
display_name: pgvector
type: software
description: pgvector is a Postgres extension that adds vector types and similarity search to the database, supporting
  exact and approximate nearest neighbour queries over single-precision, half-precision, binary and sparse vectors
  with L2, inner-product, cosine, L1, Hamming and Jaccard distances. Vectors live in ordinary tables, so joins,
  transactions and point-in-time recovery apply to them.
github:
- url: https://github.com/pgvector/pgvector
