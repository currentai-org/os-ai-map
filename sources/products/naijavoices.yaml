name: naijavoices
display_name: NaijaVoices
type: dataset
description: NaijaVoices is a speech dataset of about 1,800 hours of speech paired with expert-curated text
  in Igbo, Hausa and Yoruba, roughly 600 hours per language, from more than 5,000 speakers with a balanced
  age range. Each row carries the audio, transcript, language, speaker ID, gender and age bracket. The NaijaVoices
  community project collected it and also publishes a compressed copy of the same data.
