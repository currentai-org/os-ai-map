name: hnswlib
display_name: hnswlib
type: software
description: hnswlib is a header-only C++ implementation of Hierarchical Navigable Small World graphs for approximate
  nearest neighbour search, with Python bindings and support for insertions, updates and filtered queries. Several
  vector databases embed it as their graph index.
