name: invokeai
display_name: InvokeAI
type: software
description: InvokeAI is a locally run image-generation application with a layered canvas for painting, inpainting
  and outpainting, a gallery, and a node-based workflow editor. It runs the Stable Diffusion, FLUX, Qwen-Image,
  Z-Image and other image families on the user's own hardware and can call a few hosted models through their APIs.
  The project is now maintained by its community after the company behind it closed its hosted service.
