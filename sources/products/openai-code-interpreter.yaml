name: openai-code-interpreter
display_name: OpenAI Code Interpreter
type: software
description: Writes and runs Python inside an OpenAI-managed sandbox container, exposed as a tool on the Responses,
  Chat Completions and Assistants APIs so a model can compute, analyze attached files, and retry code that
  fails. Containers come in 1, 4, 16 and 64 GB memory tiers, are billed per 20-minute session, and expire after
  20 minutes without use. OpenAI describes each container only as a sandboxed virtual machine, naming no isolation
  technology, and distributes no runtime.
