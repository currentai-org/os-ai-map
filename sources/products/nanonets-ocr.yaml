name: nanonets-ocr
display_name: Nanonets OCR
type: model
description: Document-parsing models from Nanonets released as open weights alongside the company's hosted
  intelligent-document-processing platform. The models convert documents to structured markdown, recognising
  tables, equations, signatures, checkboxes and watermarks as tagged elements rather than flattening them into
  text.
huggingface_model:
