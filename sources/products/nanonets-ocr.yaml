name: nanonets-ocr
display_name: Nanonets OCR
type: model
description: Document-parsing models from Nanonets released as open weights alongside the company's hosted
  intelligent-document-processing platform. The models convert documents to structured markdown, recognising
  tables, equations, signatures, checkboxes and watermarks as tagged elements rather than flattening them into
  text.
huggingface_model:
- url: https://huggingface.co/nanonets/Nanonets-OCR2-3B
comments: The Hugging Face card declares no licence in its metadata, so the openness walk stops at the tier
  test and the published 3/open_weights is hand-assigned - see the openness note. Nanonets sells a hosted platform
  beside the open weights. Verified 2026-09-16 via the Hugging Face model API.
