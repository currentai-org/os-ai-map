description: MiMo-V2.6-Pro is Xiaomi's flagship mixture-of-experts model, with about 1.02 trillion total and
  42 billion active parameters. Xiaomi publishes the weights under MIT, along with a fork of verl that reproduces
  its agentic RL recipe on a distilled 9B model, and a dataset of RL environments for code, cybersecurity,
  general, visual and music tasks.
