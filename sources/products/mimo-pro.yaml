name: mimo-pro
display_name: MiMo-V2.6-Pro
type: model
aliases:
- mimo-v2-5-pro
- mimo-v2-6-pro
description: MiMo-V2.6-Pro is Xiaomi's flagship mixture-of-experts model, with about 1.02 trillion total and
  42 billion active parameters and a one-million-token context. It takes text, image, video and audio input
  and targets coding, agent and cybersecurity work, trained in one reinforcement-learning run that mixes those
  domains. Xiaomi publishes the weights together with the agentic RL training code and environments.
