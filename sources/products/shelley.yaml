name: shelley
display_name: Shelley
type: software
description: 'Shelley is a web-based coding agent from Bold Software, the company behind exe.dev, built to be used
  from a phone as easily as from a desktop. It runs several conversations at once, takes screenshots, audio and
  screen recordings as input, drives a browser through the Chrome DevTools Protocol, and can hand work to subagents.
  It ships as a single Go binary that works with hosted or local models, and it has no built-in authorization or
  sandbox: the user supplies both.'
github:
- url: https://github.com/boldsoftware/shelley
comments: Built for exe.dev virtual machines but runs anywhere. It grew out of Bold Software's earlier coding agent,
  Sketch. A release is cut automatically on every commit to main, and contributions require a CLA.
