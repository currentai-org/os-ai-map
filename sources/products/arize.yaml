name: arize
display_name: Arize
type: software
description: Observability and evaluation platform for AI agents and LLM applications, covering tracing, evaluations,
  experiments and production issue detection. It includes an embedded AI engineering agent called Alyx and
  a GenAI trace datastore called adb. It is built by the same team as Phoenix and is offered as SaaS or, on
  the Enterprise tier, self-hosted.
comments: Arize AX, the commercial platform, is the entity scored here; Phoenix, built by the same team, has
  its own separate entry.
