name: snowflake-cortex-fine-tuning
display_name: Snowflake Cortex Fine-Tuning
type: software
description: Snowflake Cortex Fine-Tuning is a fully managed function inside Snowflake Cortex AI that applies
  parameter-efficient fine-tuning (PEFT) to a short, fixed list of supported base models, such as Llama 3.1
  8B. Training data comes from tables in the customer's account, and both training and inference run on Snowflake
  compute rather than a third-party platform, billed per token in credits.
