name: figshare
display_name: Figshare
type: software
description: Figshare is a research repository where researchers deposit datasets alongside figures, papers, software and
  other outputs, each published with a DataCite DOI. Items keep numbered versions, and a REST API covers creating, uploading,
  publishing and fetching them. The public figshare.com repository is free for individual researchers, and Digital Science
  sells the same software to institutions and publishers as hosted repositories.
comments: Scored for its role as a dataset repository. Figshare accepts many kinds of research output, and datasets are one
  item type among them.
