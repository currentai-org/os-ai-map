name: tensorflow-federated
display_name: TensorFlow Federated
type: software
description: Google's open framework for machine learning and other computations on decentralized data. It provides
  a language for expressing federated computations, a Federated Learning API with aggregators, and a single-machine
  simulation runtime for experiments; production execution at Google runs those computations through separate infrastructure.
