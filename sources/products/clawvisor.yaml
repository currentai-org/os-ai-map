name: clawvisor
display_name: Clawvisor
type: software
description: Clawvisor is a gateway between AI agents and the services they act on, built so that agents never hold
  credentials. An agent declares a task, the user approves its scope once, and Clawvisor checks every request against
  that task, injecting credentials, holding out-of-scope calls for approval and logging each one. Clawvisor, Inc.
  runs it as a hosted service and publishes the gateway for self-hosting.
github:
- url: https://github.com/clawvisor/clawvisor
