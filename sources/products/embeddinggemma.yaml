name: embeddinggemma
display_name: EmbeddingGemma
type: model
description: EmbeddingGemma is Google DeepMind's family of compact embedding models for on-device search and
  retrieval. EmbeddingGemma 2, built on Gemma 4, maps text, code, images, video and audio into one 768-dimension
  vector space, truncatable to 512, 256 or 128 dimensions, at an 8K-token context, and loads its vision and
  audio encoders only when needed. The first generation was a 308M-parameter text-only model built on Gemma
  3.
huggingface_model:
- url: https://huggingface.co/google/embeddinggemma-2
- url: https://huggingface.co/google/embeddinggemma-300m
- url: https://huggingface.co/google/embeddinggemma-300m-qat-q8_0-unquantized
arxiv:
