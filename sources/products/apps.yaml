name: apps
display_name: APPS
type: dataset
description: 'APPS is a benchmark for Python code generation: 10,000 coding problems split evenly between train
  and test, at introductory, interview and competition difficulty, drawn from open-access coding challenge
  sites and shipped with 131,777 test cases and Python solutions. Published at NeurIPS 2021, it ranges from
  simple one-line solutions to substantial algorithmic challenges.'
github:
- url: https://github.com/hendrycks/apps
huggingface_dataset:
- url: https://huggingface.co/datasets/codeparrot/apps
arxiv:
- url: https://arxiv.org/abs/2105.09938
