description: AfriMGSM is a set of grade-school math word problems in 17 African languages, translated from the English
  MGSM problems by professional translators, with Swahili taken from MGSM itself. It is one of the three sets of IrokoBench,
  published by Masakhane with its own card, and AfroBench runs it as its math task.
