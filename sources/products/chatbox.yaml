name: chatbox
display_name: Chatbox
type: software
description: Chatbox is a desktop, mobile and web client for chatting with language models from OpenAI, Anthropic, Google,
  Azure and other providers, or with local models through Ollama. It stores conversations on the user's device and adds
  a prompt library, image generation, document analysis and team sharing of API keys. The open repository is the Community
  Edition; the vendor's official builds come from a private Pro codebase it syncs with.
github:
