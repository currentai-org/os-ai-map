name: vertex-ai-model-garden
display_name: Model Garden (Gemini Enterprise Agent Platform)
type: software
description: Google Cloud's model catalog on Gemini Enterprise Agent Platform, formerly Vertex AI, listing
  Google's own models, partner models such as Anthropic's Claude, and open models including Gemma, Llama, Mistral
  and popular Hugging Face repositories. Each entry can be tested, tuned and deployed to a managed endpoint
  in one click or through the SDK, CLI or REST API, and customers can deploy their own weights into their project.
comments: Kept under its Vertex AI slug. Google's pages now call the platform Gemini Enterprise Agent Platform
  and the catalog Model Garden, and the old Vertex AI documentation URLs redirect there.
