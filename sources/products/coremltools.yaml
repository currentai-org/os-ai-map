name: coremltools
display_name: Core ML Tools
type: software
description: Core ML Tools converts trained models from PyTorch and TensorFlow, and from non-neural libraries such
  as scikit-learn, XGBoost and LibSVM, into Apple's Core ML format. Beyond conversion it reads, writes and optimizes
  Core ML models, applying quantization, palettization and pruning, and verifies conversions by running predictions
  on macOS.
