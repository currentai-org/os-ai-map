name: llava
display_name: LLaVA
type: model
description: LLaVA is the open vision-language model line that began with visual instruction tuning and continued
  through LLaVA-NeXT and LLaVA-OneVision. The current LLaVA-OneVision-2 is an 8B model on a Qwen3 base that handles
  single images, multi-image sets and long video, and is released with its data, vision encoders, training code
  and logs. Hugging Face maintains transformers conversions of the earlier releases.
github:
- url: https://github.com/LLaVA-VL/LLaVA-NeXT
- url: https://github.com/EvolvingLMMs-Lab/LLaVA-OneVision-2
huggingface_model:
- url: https://huggingface.co/lmms-lab-encoder/LLaVA-OneVision-2-8B-Instruct
- url: https://huggingface.co/lmms-lab/LLaVA-OneVision-1.5-8B-Instruct
- url: https://huggingface.co/llava-hf/llava-1.5-7b-hf
comments: Scored on LLaVA-OneVision-2. Its weights sit under the lmms-lab-encoder account and its data under mvp-lab,
  and older checkpoints built on Llama 2, Llama 3 or Vicuna carry those bases' licenses.
