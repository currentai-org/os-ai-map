name: llava
display_name: LLaVA
type: model
description: LLaVA is the open vision-language model line that began with visual instruction tuning and continued
  through LLaVA-NeXT and LLaVA-OneVision. The current LLaVA-OneVision-1.5 reads native-resolution images, documents
  and charts on a Qwen3 base, and is published with its mid-training and instruction data, training framework and
  logs. Hugging Face maintains transformers conversions of the earlier releases.
github:
- url: https://github.com/LLaVA-VL/LLaVA-NeXT
- url: https://github.com/EvolvingLMMs-Lab/LLaVA-OneVision-1.5
huggingface_model:
- url: https://huggingface.co/lmms-lab/LLaVA-OneVision-1.5-8B-Instruct
- url: https://huggingface.co/lmms-lab/llava-onevision-qwen2-7b-ov
- url: https://huggingface.co/llava-hf/llava-1.5-7b-hf
comments: Scored on LLaVA-OneVision-1.5. Older checkpoints built on Llama 2, Llama 3 or Vicuna carry those bases'
  licenses, and a LLaVA-OneVision-2 successor is announced in the training repository but was not checked here.
