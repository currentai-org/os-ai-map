name: claude-sonnet
display_name: Claude Sonnet
type: model
description: Claude Sonnet is Anthropic's mid-tier Claude model, positioned between Haiku (small, high-volume)
  and Opus (complex, judgment-heavy work), and aimed at everyday coding, agent and knowledge-work tasks. The
  name is applied to whichever generation is currently shipping rather than to one fixed release, from Sonnet
  4.6 through Sonnet 5 to Sonnet 5.5. Weights are closed, and the model is available through the Anthropic
  API, cloud platforms and the Claude apps.
