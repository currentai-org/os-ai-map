name: dstack
display_name: dstack
type: software
description: Control plane for GPU provisioning and orchestration across any GPU cloud, Kubernetes cluster
  or on-premise fleet. A run declares the resources it needs - including NVIDIA, AMD, Google TPU or Tenstorrent
  accelerators - and dstack provisions a fleet to satisfy it, places development environments, training tasks
  and inference services onto it, and tears it down after.
github:
- url: https://github.com/dstackai/dstack
pypi:
- url: https://pypi.org/project/dstack/
comments: dstack Sky is a hosted offering beside the open control plane.
