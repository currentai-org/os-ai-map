name: robosuite
display_name: robosuite
type: software
description: robosuite is a modular simulation framework and benchmark for robot learning built on the MuJoCo physics
  engine. It provides manipulation tasks, a range of robot embodiments including humanoids, composite and whole-body
  controllers, and teleoperation devices for collecting demonstrations. It comes from Stanford's SVL and is maintained
  with UT Austin and NVIDIA under the ARISE Initiative.
github:
- url: https://github.com/ARISE-Initiative/robosuite
