name: afrihate
display_name: AfriHate
type: dataset
description: AfriHate is a hate speech and abusive language dataset of tweets in 15 African languages, including
  Algerian and Moroccan Arabic, Amharic, Hausa, Nigerian Pidgin, Swahili, Yoruba and isiZulu. Native speakers
  familiar with the local culture labeled each tweet as hate, abusive or normal. The accompanying paper reports
  classification baselines from fine-tuned encoders such as AfriBERTa to prompted LLMs such as Llama 3.1 and
  Gemma 2.
github:
- url: https://github.com/afrihate/afrihate
huggingface_dataset:
- url: https://huggingface.co/datasets/afrihate/afrihate
arxiv:
- url: https://arxiv.org/abs/2501.08284
