name: f5-tts
display_name: F5-TTS
type: model
description: A flow-matching diffusion-transformer text-to-speech model for zero-shot voice cloning in English and
  Chinese, released with its training and fine-tuning code. The project is led by SJTU X-LANCE researchers under
  the SWivid account.
github:
- url: https://github.com/SWivid/F5-TTS
pypi:
- url: https://pypi.org/project/f5-tts/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/SWivid/F5-TTS
comments: The code is MIT; the pretrained weights are CC-BY-NC-4.0 because they were trained on the Emilia dataset.
