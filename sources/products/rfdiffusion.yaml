name: rfdiffusion
display_name: RFdiffusion
type: model
description: RFdiffusion is a diffusion model for de novo protein design from the Institute for Protein Design, built on RoseTTAFold's architecture and trained parameters. It generates unconditional monomers, scaffolds functional motifs, designs binders against a target with specified hotspot residues, builds symmetric oligomers, and partially rediffuses an existing backbone to diversify it.
github:
- url: https://github.com/RosettaCommons/RFdiffusion
