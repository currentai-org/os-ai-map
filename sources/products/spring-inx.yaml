name: spring-inx
display_name: SPRING-INX
type: dataset
description: SPRING-INX is a speech recognition corpus of about 2,000 hours of manually transcribed speech
  in ten Indian languages, from Assamese and Bengali to Punjabi and Tamil. Agencies recorded monologues and
  mock conversations across at least ten domains under common guidelines, and a KL University team checked
  quality. SPRING Lab at IIT Madras releases it per language, with ESPnet baseline recipes.
