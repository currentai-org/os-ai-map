name: muse-glimmer
display_name: Muse Glimmer
type: model
description: Muse Glimmer is a 30-billion-parameter open-weight model from Meta Superintelligence Labs, distilled
  from Muse Spark and built to run agentic tasks locally on consumer hardware. A dense transformer with a 1.8-billion-parameter
  vision encoder, it reads text and images, writes text, holds a 131k-token context and takes a reasoning strength
  set per request. Meta also publishes 4-bit GGUF and ExecuTorch builds and a speculative-decoding drafter.
huggingface_model:
- url: https://huggingface.co/meta-models/Muse-Glimmer-30B
- url: https://huggingface.co/meta-models/Muse-Glimmer-30B-GGUF
- url: https://huggingface.co/meta-models/Muse-Glimmer-30B-ExecuTorch-PTE
- url: https://huggingface.co/meta-models/Muse-Glimmer-30B-assistant
  not_primary_channel: An auxiliary speculative-decoding checkpoint that speeds up generation beside the main
    weights. It cannot provide the model's capability on its own, so it is not a distribution of the product and
    is left out of the download figure. The GGUF and ExecuTorch builds carry their own drafter files.
comments: Scored apart from Muse Spark, the larger Meta model it is distilled from, which has its own entry.
