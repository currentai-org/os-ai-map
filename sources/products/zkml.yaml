name: zkml
display_name: ZKML (ddkang)
type: software
description: ZKML (ddkang) compiles a TensorFlow Lite model into a Halo2 zero-knowledge circuit and proves that
  an inference ran on that model, so a verifier can check the output without re-running the model or trusting whoever
  ran it. It is a Rust library with Python converters for models and inputs, and proves with either KZG or IPA commitments.
  Daniel Kang publishes it from a personal GitHub account, with the paper that describes the method.
comments: 'Tagged independently verifiable. The only zero-knowledge inference prover on the map under an OSI license,
  and dormant: no tagged release and no commit to its main branch since August 2023, so the entry is read against
  the repository head.'
github:
- url: https://github.com/ddkang/zkml
crates:
- url: https://crates.io/crates/zkml
  not_primary_channel: 'A 0.0.1 placeholder published once in February 2023: a single-file binary crate with no
    library target. The README installs by cloning and building the repository, so crate downloads do not count
    users of the prover.'
arxiv:
- url: https://arxiv.org/abs/2210.08674
