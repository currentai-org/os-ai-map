name: nunchaku
display_name: Nunchaku
type: software
description: Nunchaku is an inference engine for diffusion models quantized to 4-bit weights and activations with
  SVDQuant, a low-rank method that keeps image quality close to the full-precision model while cutting memory several
  times over. It runs INT4 and NVFP4 builds of FLUX.1, Qwen-Image, SANA, Z-Image and PixArt, and plugs into ComfyUI
  through a companion node pack. It began in MIT HAN Lab.
github:
- url: https://github.com/nunchux-ai/nunchaku
arxiv:
- url: https://arxiv.org/abs/2411.05007
comments: The PyPI project named nunchaku is an unrelated data-segmentation library; this engine ships as wheels
  on its GitHub releases, so no package is declared.
