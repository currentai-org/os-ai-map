name: ui-tars
display_name: UI-TARS
type: model
description: UI-TARS is ByteDance Seed's GUI agent model, which takes screenshots as its only input and returns
  mouse, keyboard and touch actions for desktop, browser and phone interfaces. The released checkpoints are the
  2B, 7B and 72B SFT and DPO models and UI-TARS-1.5-7B, built on a Qwen2.5-VL base. The UI-TARS-desktop application
  that drives it is a separate project.
github:
- url: https://github.com/bytedance/UI-TARS
huggingface_model:
- url: https://huggingface.co/ByteDance-Seed/UI-TARS-1.5-7B
- url: https://huggingface.co/ByteDance-Seed/UI-TARS-72B-DPO
arxiv:
- url: https://arxiv.org/abs/2501.12326
comments: The strongest UI-TARS-1.5 model and UI-TARS-2 are not downloadable; UI-TARS-1.5 is offered to researchers
  on request, and the scores here are read from the released 7B.
