name: afridocmt
display_name: AfriDocMT
type: dataset
description: AfriDocMT is a translation dataset of whole documents in which 334 health and 271 information
  technology news documents were translated by people from English into Amharic, Hausa, Swahili, Yoruba and
  isiZulu. It ships in both document and sentence form, with train, dev and test splits for each domain. Its
  builders were funded by the Lacuna Fund, and Masakhane hosts the release.
huggingface_dataset:
- url: https://huggingface.co/datasets/masakhane/AfriDocMT
arxiv:
- url: https://arxiv.org/abs/2501.06374
