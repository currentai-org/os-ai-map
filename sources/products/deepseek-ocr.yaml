name: deepseek-ocr
display_name: DeepSeek-OCR
type: model
description: Vision-language model from DeepSeek that treats a page image as a compressed carrier of text,
  converting document images into linearised markdown-like output. It was released as a study in optical context
  compression - how far a page of text can be represented by vision tokens rather than text tokens - and the
  OCR capability is the demonstration of it.
github:
- url: https://github.com/deepseek-ai/DeepSeek-OCR
