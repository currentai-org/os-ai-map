name: claude-fable
display_name: Claude Fable
type: model
aliases:
- claude-fable-5
description: Claude Fable is Anthropic's Mythos-class tier, built for demanding reasoning, long-horizon agentic
  coding, knowledge work, vision and scientific research. Fable 5, made generally available in June 2026, is
  the same underlying model as Claude Mythos 5, wrapped in safeguards that route sensitive cybersecurity, biology,
  chemistry and distillation requests to a less capable Claude model, with a one-million-token context window
  and up to 128K output tokens. Fable 5.1 is the current release.
comments: Designated a Covered Model, which carries 30-day mandatory data retention.
