name: claude-fable
display_name: Claude Fable 5
type: model
aliases:
- claude-fable-5
description: Claude Fable 5 is a Mythos-class Anthropic model made generally available in June 2026. It is
  the same underlying model as Claude Mythos 5, wrapped in safeguards that route sensitive cybersecurity, biology,
  chemistry and distillation requests to a less capable Claude model. It is built for long-horizon agentic
  coding, knowledge work, vision and scientific research, with a one-million-token context window and up to
  128K output tokens.
comments: Designated a Covered Model, which carries 30-day mandatory data retention.
