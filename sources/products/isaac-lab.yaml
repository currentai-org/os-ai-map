name: isaac-lab
display_name: Isaac Lab
type: software
description: Isaac Lab is NVIDIA's GPU-accelerated framework for robot learning, covering reinforcement learning,
  imitation learning and motion planning. It ships more than thirty ready-to-train environments wired to RL libraries
  such as RSL RL, SKRL and Stable Baselines, runs on Isaac Sim's PhysX physics and RTX rendering, and is adding
  the open Newton engine as a second physics backend.
github:
- url: https://github.com/isaac-sim/IsaacLab
pypi:
- url: https://pypi.org/project/isaaclab
artifact_exceptions:
  pypi_repo_mismatch: The isaaclab package on PyPI declares no repository URL; its documentation link is isaac-sim.github.io/IsaacLab,
    the documentation site of this repository, so the package is the product.
comments: Isaac Lab needs Isaac Sim to run, and Isaac Sim's runtime components are proprietary NVIDIA software.
  Isaac Sim is a separate candidate and is not part of this entry.
