name: fate
display_name: FATE (Federated AI Technology Enabler)
type: software
description: Industrial federated learning framework hosted by the Linux Foundation. Parties deploy their own FATE
  clusters, from docker-compose or KubeFATE on Kubernetes, and exchange encrypted intermediate values through a
  routing layer, with secure-computation protocols built on homomorphic encryption and multi-party computation,
  for horizontal and vertical federated learning. FATE-Flow schedules the multi-party jobs.
github:
- url: https://github.com/FederatedAI/FATE
pypi:
- url: https://pypi.org/project/pyfate/
comments: '`pyfate` is the package FATE''s own standalone deployment guide recommends installing; `fate-client`
  and `fate-flow` are separate components and are not declared. FATE-LLM is a separate FederatedAI repository and
  is treated as a SKU of this record, not a second product. The core repository was last pushed 2024-11-19. The
  organization is kept as `federatedai`, not LF AI & Data, because the README says "hosted by Linux Foundation"
  without naming LF AI & Data.'
