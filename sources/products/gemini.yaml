description: Google's consumer Gemini chat app on the web, Android and iOS, and embedded across Google Workspace.
  It offers a live voice mode, Deep Research, and image and video generation, and is integrated with Search's
  AI Mode. The app surface is proprietary, with no source release.
comments: The model SKUs behind the app are scored separately; this record covers the app surface. Verified
