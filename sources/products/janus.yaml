name: janus
display_name: Janus
type: model
description: Janus is DeepSeek's family of unified models that both understand images and generate them from text
  in one autoregressive transformer. It separates visual encoding for the two jobs, SigLIP for understanding and
  a discrete image tokenizer for generation. Janus-Pro comes in 1B and 7B sizes on DeepSeek-LLM bases, and JanusFlow
  swaps in rectified flow for generation.
