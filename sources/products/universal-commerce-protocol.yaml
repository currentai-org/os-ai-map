name: universal-commerce-protocol
display_name: Universal Commerce Protocol (UCP)
type: software
description: The Universal Commerce Protocol (UCP) is an open standard for agentic commerce, giving AI agents and apps,
  businesses and payment providers one language for catalog search, carts, checkout, identity linking and orders. A business
  declares the capabilities it supports in a profile that platforms discover, and serves them over REST, MCP or A2A.
  Google and Shopify founded it, and a council of member companies governs it.
github:
- url: https://github.com/universal-commerce-protocol/ucp
pypi:
- url: https://pypi.org/project/ucp-sdk
npm:
- url: https://www.npmjs.com/package/@ucp-js/sdk
comments: The specification repository holds the schemas and documentation; the official Python and JavaScript SDKs live
  in sibling repositories of the same GitHub organization, and their two packages are declared here as the channels an
  implementation installs. Payments build on the Agent Payments Protocol (AP2), which is listed separately.
