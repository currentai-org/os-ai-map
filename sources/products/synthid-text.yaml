name: synthid-text
display_name: SynthID-Text
type: software
description: 'SynthID-Text is Google DeepMind''s reference implementation of the text watermarking method published
  in Nature: it biases token sampling during generation so the output carries a statistical watermark, and
  detects it with a weighted-mean or a trained Bayesian detector. It integrates with Hugging Face Transformers
  for Gemma and GPT-2 models, and the authors state it is not intended for production use.'
comments: 'Tagged self-attested: detection needs the watermarking keys the generator used, so only the key
  holder can check.'
github:
- url: https://github.com/google-deepmind/synthid-text
pypi:
- url: https://pypi.org/project/synthid-text/
