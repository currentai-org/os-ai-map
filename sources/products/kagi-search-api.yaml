name: kagi-search-api
display_name: Kagi Search API
type: software
description: Search API over Kagi's own index. The v1 API has two paths - `/search`, which returns ranked references,
  and `/extract`, which returns page markdown - and `/search` can run the extraction inline so one call returns
  results with their page content.
comments: The help page the vendor links is a stub that does not describe the interface; the machine-readable
  OpenAPI document at kagi.com/api/docs/_spec/openapi.yaml is what this record was read from, and the two official
  pages disagree with each other on both HTTP method and auth scheme for `/search`. FastGPT, Enrichment and
  the Universal Summarizer are separate v0 products at their own prices and are not scored here; the Summarizer
  is documented as not yet available in v1.
