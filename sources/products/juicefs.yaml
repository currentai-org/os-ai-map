name: juicefs
display_name: JuiceFS
type: software
description: JuiceFS is a POSIX-compatible distributed file system that stores file data in object storage such
  as Amazon S3 while keeping metadata in a separate database engine - Redis, MySQL or TiKV among them. Training
  and analytics jobs mount it and read cloud storage as files without code changes. Juicedata develops it.
github:
- url: https://github.com/juicedata/juicefs
