name: mcp-toolbox-for-databases
display_name: MCP Toolbox for Databases
type: software
description: MCP server from Google that connects agents, IDEs and applications to databases. Started with a prebuilt
  configuration, it gives an MCP client ready-made tools for exploring schemas and running SQL against Google Cloud
  databases such as BigQuery, AlloyDB, Spanner and Cloud SQL, and against PostgreSQL, MySQL, MongoDB, Snowflake
  and others. Defined in a tools.yaml file, it serves custom tools built on fixed queries, with connection pooling,
  IAM authentication and OpenTelemetry tracing. It was first released as Gen AI Toolbox for Databases.
github:
- url: https://github.com/googleapis/mcp-toolbox
npm:
- url: https://www.npmjs.com/package/@toolbox-sdk/server
