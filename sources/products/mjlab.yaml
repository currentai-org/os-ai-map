name: mjlab
display_name: mjlab
type: software
description: mjlab is a GPU-accelerated robot learning framework that pairs Isaac Lab's manager-based API, in which environments
  are composed from modular observation, reward and event terms, with MuJoCo Warp physics. It ships reference tasks for humanoid
  velocity tracking, motion imitation and manipulation, batched RGB-D camera, raycast, contact and tactile sensors, and multi-GPU
  training, and it installs with a single command.
