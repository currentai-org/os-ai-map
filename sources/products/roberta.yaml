name: roberta
display_name: RoBERTa
type: model
description: 'RoBERTa is Facebook AI''s retraining of BERT: the same encoder-only architecture, trained
  longer, on larger batches and on about 160GB of English text, without BERT''s next-sentence task and
  with masks that change on every pass over the data. Released in 2019 through the fairseq toolkit in
  Base (125M parameters) and Large (355M) sizes, it is built to be fine-tuned for classification, tagging
  and question answering rather than to generate text.'
huggingface_model:
- url: https://huggingface.co/FacebookAI/roberta-base
- url: https://huggingface.co/FacebookAI/roberta-large
arxiv:
- url: https://arxiv.org/abs/1907.11692
comments: XLM-RoBERTa, the multilingual model trained with the same recipe, was released separately and
  is not counted here.
