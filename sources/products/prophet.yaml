name: prophet
display_name: Prophet
type: software
description: Time-series forecasting procedure from Meta's Core Data Science team that fits an additive model of
  non-linear trend, yearly, weekly and daily seasonality and holiday effects, in R and Python over a shared Stan
  core. It produces automated forecasts with uncertainty intervals that analysts can tune by hand. Since v1.4.0
  it is in maintenance mode, taking bug fixes but no new features.
github:
- url: https://github.com/facebook/prophet
pypi:
- url: https://pypi.org/project/prophet
