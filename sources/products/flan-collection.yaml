name: flan-collection
display_name: FLAN Collection (v2)
type: dataset
description: Google Research's instruction-tuning compilation drawing on P3, Super-NaturalInstructions and
  chain-of-thought data, which trained Flan-T5 and Flan-PaLM. It remains a building block for later instruction
  mixes, including the Tulu 3 SFT mixture and Olmo 3's Dolci.
github:
- url: https://github.com/google-research/FLAN
huggingface_dataset:
- url: https://huggingface.co/datasets/ai2-adapt-dev/flan_v2_converted
lineage:
  derived_from:
  - P3
  - Super-NaturalInstructions
  - chain-of-thought collections
  trains:
  - tulu
  - olmo-instruct
  - marin
comments: The recipe repository is the primary artifact; the widely used Hugging Face conversion carries a
  card documenting the conversion rather than the tasks.
