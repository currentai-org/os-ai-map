name: lightmem
display_name: LightMem
type: software
description: LightMem is a Python memory framework for LLM agents that compresses incoming dialogue, segments it
  by topic, has a language model extract memory entries, and later updates or deletes conflicting entries in an
  offline pass. It retrieves through Qdrant, FAISS or BM25, runs with hosted or local models and includes an MCP
  server. Zhejiang University's NLP group, ZJUNLP, builds it.
comments: The repository also hosts the group's related memory methods and benchmark scripts; this entry reads the
  LightMem library, which installs from source because the README still marks the PyPI install as coming soon.
github:
- url: https://github.com/zjunlp/LightMem
arxiv:
- url: https://arxiv.org/abs/2510.18866
