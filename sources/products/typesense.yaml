name: typesense
display_name: Typesense
type: software
description: Typesense is an in-memory search engine offering typo-tolerant full-text search with faceting, filtering,
  geosearch and vector and hybrid search, positioned as a self-hostable alternative to hosted search APIs. It is
  written in C++ and runs as a single binary or clustered, with a hosted service and paid support sold beside it.
