name: lahaja
display_name: Lahaja
type: dataset
description: Lahaja is a Hindi speech recognition benchmark of 12.5 hours of read and extempore speech from
  132 speakers across 83 districts of India, built to test models on regional accents. Each clip carries verbatim
  and normalized transcripts with the speaker's native language, district and occupation. AI4Bharat built it
  and released four NeMo baseline models with it.
github:
- url: https://github.com/AI4Bharat/Lahaja
