name: mlc-llm
display_name: MLC LLM
type: software
description: MLC LLM compiles large language models for native execution across a wide range of consumer and server
  hardware, then runs them on its own MLCEngine. Compilation targets Vulkan, CUDA, ROCm, Metal, OpenCL, WebGPU and
  WASM, covering Linux, Windows, macOS, iOS, Android and the browser. The project builds on Apache TVM's compilation
  stack.
