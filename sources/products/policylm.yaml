name: policylm
display_name: PolicyLM
type: model
description: 'PolicyLM is Musubi''s 1.7B-parameter moderation classifier: given a message and a policy written as
  short plain-language categories, it returns a score from 0 to 1 for every category in one pass, without generating
  text. A built-in mode scores against NVIDIA''s 23-category Aegis 2.0 taxonomy instead. It is meant for user content
  such as chat messages and posts, was evaluated in 19 languages, and runs on a single 24 GB GPU or a CPU.'
huggingface_model:
- url: https://huggingface.co/musubilabs/policylm-1.7b
comments: A ROOST Model Community partner model.
