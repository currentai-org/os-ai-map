name: gemma
display_name: Gemma 4
type: model
aliases:
- gemma-2
- gemma-3
- gemma-4
description: Gemma 4 is Google DeepMind's open-weight model family, built from the same research as Gemini
  3. It spans E2B and E4B edge models, an encoder-free 12B unified model, a 26B-A4B mixture-of-experts model
  and a 31B dense model, all taking text and image input, with audio on the three smallest. Context windows
  reach 256K tokens, and the models support more than 140 languages.
