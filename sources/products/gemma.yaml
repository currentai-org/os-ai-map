comments: Unlike CodeGemma/Gemma 3, which use the Gemma Terms of Use, the Gemma 4 SKUs are ungated and the
  license link resolves to Apache 2.0. Training data and recipe not released. Consolidated on 2026-07-29
  from gemma-2, gemma-3; openness follows gemma-4, the release that currently governs. See
  docs/guides/identity.md. The Google Cloud post cited for the capability band is an availability
  announcement and carries no ranking, so the Arena claim in that record has no live source behind it.
  Verified 2026-08-13 via the gemma-4-31B-it model card and the Gemma releases page.
