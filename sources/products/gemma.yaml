- url: https://huggingface.co/google/gemma-4-26B-A4B-it
comments: Apache-2.0 (OSI) - unlike CodeGemma/Gemma 3, which use the Gemma Terms of Use. Training data and recipe
  not released. ~8.4M monthly downloads on gemma-4-31b-it. Benchmark claims (LMArena) are vendor-reported. Consolidated
  on 2026-07-29 from gemma-2, gemma-3; openness follows gemma-4, the release that currently governs. See sources/slug_aliases.yaml.
