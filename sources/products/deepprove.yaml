name: deepprove
display_name: DeepProve
type: software
description: DeepProve is a zero-knowledge proof system for neural-network inference that proves full transformer
  forward passes, with GPT-2, Gemma 3 and Llama 2 confirmed end to end, as well as MLP and CNN models. It uses
  sumchecks and logup GKR rather than arithmetic circuits to keep proving time sublinear in model size. Lagrange
  Labs publishes it as a Rust workspace.
comments: Tagged independently verifiable. The repository label reports Apache-2.0, but the LICENSE body is
  Lagrange's own evaluation-only agreement.
github:
- url: https://github.com/Lagrange-Labs/deep-prove
