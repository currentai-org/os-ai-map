name: kimi-vl
display_name: Kimi-VL
type: model
description: Kimi-VL is Moonshot AI's mixture-of-experts vision-language model, activating 2.8B parameters in its
  language decoder behind the native-resolution MoonViT encoder. It reads images, documents, multi-image sets and
  long video in a 128K context, and locates and operates interface elements on screen. The Thinking variants add
  long chain-of-thought reasoning; the line is separate from the general Kimi models.
