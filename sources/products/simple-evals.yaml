name: simple-evals
display_name: simple-evals
type: software
description: OpenAI's lightweight reference library for evaluating language models, open sourced for transparency
  about the accuracy numbers it publishes alongside new models. It bundles implementations of MMLU, MATH, GPQA,
  DROP, MGSM, HumanEval, SimpleQA, BrowseComp and HealthBench, emphasizing the zero-shot, chain-of-thought
  setting, each with its upstream license listed. The library is deprecated and will no longer be updated for
  new models or benchmark results.
github:
- url: https://github.com/openai/simple-evals
