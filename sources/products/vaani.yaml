name: vaani
display_name: Project Vaani
type: dataset
description: Project Vaani is a speech corpus of spontaneous, image-prompted speech from about 156,000 speakers
  in 165 Indian districts, spanning some 105 languages. It holds over 31,000 hours of audio, about 2,000 hours
  of it transcribed, together with the roughly 289,000 prompt images. IISc Bangalore and ARTPARK run the project
  with funding from Google, and also publish a transcribed-only subset and a Hindi speech-recognition benchmark.
