name: cosyvoice
display_name: CosyVoice
type: model
description: Alibaba's multilingual voice generation line (CosyVoice, CosyVoice 2 and Fun-CosyVoice 3), with zero-shot
  voice cloning and instruction control over dialect, emotion and speed in 9 languages and more than 18 Chinese
  dialects. The repository ships inference, training and deployment code.
github:
- url: https://github.com/QwenAudio/CosyVoice
huggingface_model:
- url: https://huggingface.co/FunAudioLLM/Fun-CosyVoice3-0.5B-2512
- url: https://huggingface.co/FunAudioLLM/CosyVoice2-0.5B
comments: The repository moved from FunAudioLLM/CosyVoice to QwenAudio/CosyVoice; both names resolve to the same
  repository. Code and weights are Apache-2.0.
