name: north-vision
display_name: North Micro Vision
type: model
description: North Micro Vision is Cohere's 2.4B-parameter vision-language model, part of its North family of purpose-built
  models. It reads interleaved text and images at native resolution and handles question answering, captioning, grounding,
  OCR, charts and documents in several languages. The vision encoder is trained from SigLIP 2 and the language model is Cohere's
  own.
