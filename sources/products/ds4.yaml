name: ds4
display_name: ds4
type: software
description: ds4 (DwarfStar 4) is a native local LLM inference engine by antirez (Salvatore Sanfilippo), optimized
  first for DeepSeek V4 Flash and deliberately narrow rather than a general GGUF runner. It also runs DeepSeek
  V4.1 Flash, GLM 5.x and Qwen3.8 Flash Next. The C/CUDA/Objective-C engine draws on llama.cpp/GGML kernels
  and quantization formats, adding model loading, prompt rendering, tool calling, and KV state streaming to
  RAM and SSD. It ships an HTTP server with OpenAI-style and Anthropic-style endpoints and a coding agent.
github:
- url: https://github.com/antirez/ds4
comments: The project has no tagged releases and is built from source, so the entry is read against the repository
  head rather than a release.
