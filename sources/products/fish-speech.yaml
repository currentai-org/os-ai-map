name: fish-speech
display_name: Fish Speech
type: model
description: Fish Audio's open text-to-speech models and the Fish Speech code that runs them. Drama 3, a mixture-of-experts
  model with 35B parameters of which 3B are active per token, clones voices from reference clips, follows natural-language
  direction and inline tags for emotion, revises a take from a spoken note, voices multi-character scenes and edits existing
  speech by infilling. The previous generation, S2-Pro, is a 4B model with faster inference.
github:
- url: https://github.com/fishaudio/fish-speech
huggingface_model:
- url: https://huggingface.co/fishaudio/drama-3
- url: https://huggingface.co/fishaudio/s2-pro
arxiv:
- url: https://arxiv.org/abs/2610.18010
comments: The int4 build in Fish Audio's Hub namespace is an unofficial community quantization and is not declared; the older
  Fish Speech 1.x and OpenAudio S1 checkpoints are not declared either.
