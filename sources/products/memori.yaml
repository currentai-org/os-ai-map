name: memori
display_name: Memori
type: software
description: Memori adds long-term memory to LLM applications by wrapping the model client, extracting facts, preferences,
  skills and agent-trace events from each conversation in the background and injecting the relevant ones into later
  prompts. Memories are kept in the developer's own SQL or document database or in Memori Cloud, linked by a graph
  of subject-predicate-object triples. Memori Labs builds it.
comments: The repository was GibsonAI/memori before the project moved to Memori Labs, and memorisdk is the SDK's
  earlier PyPI name.
