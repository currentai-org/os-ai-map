name: beavertails
display_name: BeaverTails
type: dataset
languages: [eng]
description: BeaverTails is a collection of question-answer pairs labeled for harm, built at Peking University for
  research on making language models safer. Each pair records whether the answer is safe and which of 14 harm categories
  it falls under, from privacy violation to self-harm, and one pair can carry several. The Hub release holds a round
  of about 330,000 pairs and a 30,000-pair round, each split into training and test sets, for training and testing
  moderation classifiers.
comments: Its card asks that it not be used to train dialogue agents. It is filed with evaluation sets because the
  release is labeled classification data with held test splits.
huggingface_dataset:
- url: https://huggingface.co/datasets/PKU-Alignment/BeaverTails
arxiv:
- url: https://arxiv.org/abs/2307.04657
