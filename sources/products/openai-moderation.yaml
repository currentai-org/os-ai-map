name: openai-moderation
display_name: OpenAI Moderation API
type: software
description: OpenAI's Moderation API is a free hosted endpoint that classifies text and images against OpenAI's
  content-policy categories, including hate, harassment, self-harm, sexual content and violence. It does not
  classify audio. Moderation scores can also be requested inline with a Responses or Chat Completions generation
  instead of through a separate call.
