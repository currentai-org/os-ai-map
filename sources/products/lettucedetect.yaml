name: lettucedetect
display_name: LettuceDetect
type: software
description: LettuceDetect checks whether an AI answer is supported by the source material it was given and marks
  the exact passages that are not. Small encoder models run locally for fast checks, and a 2B generative model also
  labels each unsupported passage by type. It covers retrieval-augmented answers, coding-agent responses and tool
  output, and KR Labs publishes it as a Python package with an optional web API.
comments: Described in arXiv 2502.17125. The code, tool-output and agent models released in June 2026 are described
  in arXiv 2607.00895.
