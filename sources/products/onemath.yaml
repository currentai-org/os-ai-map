name: onemath
display_name: oneMath
type: software
description: oneMath is the UXL Foundation's open implementation of the oneMath specification, a cross-vendor math library
  exposing one interface for BLAS, LAPACK, FFT, RNG and sparse routines and dispatching to a vendor backend - oneMKL, NVIDIA
  cuBLAS, AMD rocBLAS and others - per target device. It began as oneMKL Interfaces before the UXL Foundation renamed the
  project.
github:
- url: https://github.com/uxlfoundation/oneMath
comments: Verified 2026-09-02 via the GitHub API and the LICENSE body.
