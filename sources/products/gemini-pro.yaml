name: gemini-pro
display_name: Gemini Pro
type: model
description: Gemini Pro is Google DeepMind's higher-capability Gemini tier, the counterpart to Gemini Flash,
  taking text, image, video, audio and PDF input with a 1M-token input window and a thinking mode. The name
  is applied to whichever generation currently ships rather than to one fixed release. Weights are closed,
  and the tier is offered through the Gemini API, Google AI Studio and the Gemini app.
comments: Google still labels the current Pro, Gemini 3.1 Pro, as Preview, and the scores read that checkpoint.
