name: bitsandbytes
display_name: bitsandbytes
type: software
description: 'bitsandbytes provides k-bit quantization for PyTorch, reducing the memory a model needs for inference
  and training. Three pieces carry that: 8-bit optimizers using block-wise quantization, the LLM.int8() mixed-precision
  inference path that isolates outlier features, and the 4-bit NF4 quantization QLoRA fine-tuning is built on.'
