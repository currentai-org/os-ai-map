name: mila-suicide-prevention-guardrail
display_name: Mila Suicide Prevention Guardrail
type: model
description: Mila Suicide Prevention Guardrail is a BERT-based classifier that reads a chatbot's reply and flags
  it when the reply enables, encourages or endorses suicide, self-injury or disordered eating, following the MLCommons
  AILuminate definition of that harm. It checks English assistant responses one at a time, not user messages, and
  is small enough to run on a CPU. Mila's AI Safety Studio built it with ROOST.
huggingface_model:
- url: https://huggingface.co/mila-ai4h/Mila-Suicide-Prevention-Output-Guardrail
comments: A ROOST Model Community partner model. Mila documents it as an early beta, meant to run alongside other
  safeguards rather than on its own.
