name: kubeflow-hub
display_name: Kubeflow Hub (Model Registry)
type: software
steward: cncf
description: Kubeflow component, formerly called Model Registry, where teams register models, model versions
  and their artifacts through a REST API and Python client and track them from experimentation to production.
  The registry stores metadata and the URI of each artifact in S3 or an OCI registry, and its client can upload
  a local model and register it in one call. A companion catalog lets users browse models from external sources
  such as Hugging Face before registering them. The component is still marked alpha.
github:
- url: https://github.com/kubeflow/hub
