name: goose
display_name: Goose
type: software
steward: agentic-ai-foundation
description: Goose is a general-purpose on-machine AI agent, written in Rust and available as a desktop app,
  a CLI and an API. It connects to more than seventy extensions over the Model Context Protocol, works with
  over fifteen providers, and supports ACP so an existing model subscription can be used. Founded by Block,
  it is now stewarded by the Agentic AI Foundation at the Linux Foundation.
github:
