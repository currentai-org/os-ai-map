description: Falcon 3 is TII's open-weights model family from Abu Dhabi, spanning 1B to 10B parameters. It
  comes from a single large pretraining run on the 7B model over 14 trillion tokens of web, code, STEM, curated
  and multilingual data, extended by depth up-scaling for reasoning. TII has since released the Falcon-H1 family
  on the same Hugging Face organization.
