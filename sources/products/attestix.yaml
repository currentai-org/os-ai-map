name: attestix
display_name: Attestix
type: software
description: Attestix gives AI agents their own signed identities, with W3C decentralized identifiers and verifiable
  credentials, and lets one agent delegate a subset of its capabilities to another through UCAN-style tokens. It
  also keeps a hash-chained audit trail and drafts EU AI Act evidence, running as a Python library, CLI, MCP server
  or REST API, with offline verifiers in several languages. VibeTensor builds it.
github:
- url: https://github.com/VibeTensor/attestix
