name: omnivoice
display_name: OmniVoice
type: model
description: 'A massively multilingual zero-shot text-to-speech model from the k2-fsa (Next-gen Kaldi) project: it clones
  a voice or designs one from a description in more than 600 languages, at up to 40 times faster than real time.'
github:
- url: https://github.com/k2-fsa/OmniVoice
pypi:
- url: https://pypi.org/project/omnivoice/
  not_primary_channel: The inference package, which loads its weights from the k2-fsa/OmniVoice repository on the Hub,
    so its installs are already counted among that repository's downloads.
huggingface_model:
- url: https://huggingface.co/k2-fsa/OmniVoice
arxiv:
- url: https://arxiv.org/abs/2604.00688
comments: The model's license is stated only in the card's prose, and without a version number.
