name: harvard-dataverse
display_name: Harvard Dataverse
type: software
description: Harvard Dataverse is a free research data repository, open to researchers anywhere, run by Harvard's
  Institute for Quantitative Social Science on the open-source Dataverse software. Depositors publish datasets that
  are versioned under DOIs and downloadable through a web interface and an API. Tabular files from Stata, SPSS,
  R, Excel and CSV are ingested with variable-level metadata, and dataset metadata exports as Croissant, DDI and
  DataCite.
github:
- url: https://github.com/IQSS/dataverse
comments: Scored as the Harvard installation. The Dataverse software also runs many other institutions' repositories,
  which are not entries here.
