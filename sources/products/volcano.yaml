name: volcano
display_name: Volcano
type: software
description: Batch scheduling system for Kubernetes, hosted by the CNCF, aimed at AI, machine learning and
  big-data workloads that Kubernetes' default scheduler handles poorly. Volcano adds gang scheduling, queues
  with fair-share and preemption, and GPU-aware placement, so a distributed training job either gets all the
  accelerators it asked for or waits rather than deadlocking on a partial allocation.
github:
- url: https://github.com/volcano-sh/volcano
comments: Ships as container images and Helm charts with no package-registry channel, so adoption bands on
  stars. Verified 2026-09-15 via the repository and its recursive tree.
