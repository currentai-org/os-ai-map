name: atlaset
display_name: Atlaset
type: dataset
description: Atlaset is a Moroccan Darija text corpus for pretraining and training language models, about 155
  million tokens in its training split. It combines dozens of existing sources, including social media comments,
  news summaries, Wikipedia, YouTube subtitles, and translated instruction sets such as ShareGPT and FLAN,
  each listed with its row count. Abdelaziz Bounhar curated it, and AtlasIA publishes it.
huggingface_dataset:
- url: https://huggingface.co/datasets/atlasia/Atlaset
