name: khayyam-challenge
display_name: Khayyam Challenge
type: dataset
description: The Khayyam Challenge, also called PersianMMLU, tests language models on 20,192 four-choice questions
  in Persian from 38 tasks drawn from Persian examinations, from lower primary to upper secondary school. The
  questions are original rather than translated and carry metadata such as human response rates, difficulty
  ratings, and descriptive answers. The RAIA Center publishes it.
huggingface_dataset:
- url: https://huggingface.co/datasets/raia-center/khayyam-challenge
arxiv:
- url: https://arxiv.org/abs/2404.06644
comments: The Hub README is empty; the description follows the paper and the gating terms.
