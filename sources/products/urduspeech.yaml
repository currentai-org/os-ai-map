name: urduspeech
display_name: UrduSpeech
type: dataset
description: UrduSpeech is an Urdu speech corpus of 156 hours in 71,792 utterances, split into standard Pakistani
  Urdu, Urdu-English code-switching and Pakistani-accented English. Audio comes from YouTube and Pakistan Television
  archives across 12 categories such as news, drama and poetry, then transcribed and tagged with 12 paralinguistic
  attributes through an LLM pipeline built on Gemini 2.5 Pro. ASLP-lab built it, with a separate 9-hour benchmark
  corrected by native speakers.
huggingface_dataset:
- url: https://huggingface.co/datasets/ASLP-lab/UrduSpeech
arxiv:
- url: https://arxiv.org/abs/2605.17846
