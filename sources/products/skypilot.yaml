name: skypilot
display_name: SkyPilot
type: software
description: Framework for running AI workloads on whatever compute is available - Kubernetes, Slurm, more
  than twenty clouds, or on-premise machines - behind one interface. A task declares its accelerators and how
  many nodes it needs; SkyPilot finds capacity that satisfies it, provisions the cluster, reserves the nodes
  for the job and exposes their ranks and addresses to the running code.
github:
- url: https://github.com/skypilot-org/skypilot
pypi:
- url: https://pypi.org/project/skypilot/
comments: SkyPilot Platform is a separate commercial product announced alongside a seed round; the open project
  is not a reduced edition of it. Verified 2026-09-15 via the repository, its recursive tree and the PyPI download
  API.
