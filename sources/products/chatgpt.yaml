name: chatgpt
display_name: ChatGPT
type: software
description: OpenAI's consumer ChatGPT product, distributed as an app over a chat interface. It generates original
  images from a description and transforms existing ones, and offers an advanced voice mode. Custom GPTs let
  a user tailor ChatGPT to a specific use case with instructions, attached knowledge documents and connections
  to third-party services.
comments: The usage report this record cited enumerates none of the product's features, so these come from
  OpenAI's own app listing and developer documentation. The model SKUs are scored separately. Verified 2026-08-14
  via OpenAI's ChatGPT App Store listing and its Custom GPTs documentation.
