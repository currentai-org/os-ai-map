name: feast
display_name: Feast
type: software
description: 'Feast is a feature store that keeps one definition of a feature and serves it from two places: an
  offline store for building training sets with point-in-time correctness, and an online store for low-latency retrieval
  at inference. Materialization moves values between them, and a registry holds the definitions. Python, Java and
  Go components ship from the repository.'
