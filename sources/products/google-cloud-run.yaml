name: google-cloud-run
display_name: Google Cloud Run
type: software
description: Runs any OCI container image as a fully managed Google Cloud service, autoscaling from zero and
  billing either per request or for full instance time. Google offers individual Cloud Run instances for long-running
  background agents in preview, and a sandbox mode, also in preview, lets a service run untrusted or generated
  code in an isolated environment. Isolation comes from a choice of two execution environments, one built on
  gVisor and one on Linux microVMs.
