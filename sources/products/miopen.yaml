name: miopen
display_name: MIOpen
type: software
description: MIOpen is AMD's library of high-performance machine learning primitives for ROCm, covering convolution, RNN,
  pooling, batch normalization and related deep learning kernels - the same role cuDNN plays for NVIDIA. AMD develops it
  as part of the ROCm stack; the project is being folded into the consolidated ROCm/rocm-libraries monorepo, and this repository
  is kept as a retired, read-only mirror during that migration.
github:
