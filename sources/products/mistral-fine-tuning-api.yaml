name: mistral-fine-tuning-api
display_name: Mistral Fine-Tuning API
type: software
description: Mistral Fine-Tuning API is Mistral's managed service for training custom versions of its own models,
  offering LoRA-based supervised fine-tuning for text and vision models plus a Classifier Factory for classification
  tasks. Supported base models include Mistral Small, Mistral Large, Codestral, Mistral NeMo, Ministral and
  Pixtral. Mistral's documentation files the service under deprecated, legacy features. A separate open-source
  SDK, mistral-finetune, covers self-hosted training.
