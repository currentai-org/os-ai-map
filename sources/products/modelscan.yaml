name: modelscan
display_name: ModelScan
type: software
description: ModelScan checks machine-learning model files for code that would run when the model is loaded, an attack known
  as model serialization. It reads Pickle, H5, Keras and SavedModel files without loading them, covering models from PyTorch,
  TensorFlow, Keras, scikit-learn and XGBoost, and ranks what it finds by severity. Protect AI publishes it as a command-line
  tool and Python package.
github:
- url: https://github.com/protectai/modelscan
pypi:
- url: https://pypi.org/project/modelscan/
