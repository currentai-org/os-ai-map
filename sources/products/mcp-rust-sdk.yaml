name: mcp-rust-sdk
display_name: MCP Rust SDK
type: software
description: The official Rust SDK for the Model Context Protocol, published as the `rmcp` crate. Implements
  client and server against the current specification revision, with a deliberate decision not to ship the
  legacy two-endpoint HTTP+SSE transport.
github:
- url: https://github.com/modelcontextprotocol/rust-sdk
crates:
- url: https://crates.io/crates/rmcp
comments: The crate is `rmcp` rather than the repository name, which is why the adoption record cites crates.io
  under that name. Verified 2026-09-17 via the GitHub API, the README, the LICENSE body and the crates.io API.
