comments: SANA-WM, the family's camera-controlled world model, belongs with world models and is not part of this entry,
  and the repository's Sol engine branch, which accelerates other vendors' video models, is not scored here either. The
  code base moved to Apache 2.0 in January 2025. Every SANA model uses Google's Gemma 2 2B as its text encoder, and SANA-Video
  2.0 decodes with the LTX-2.3 video autoencoder.
