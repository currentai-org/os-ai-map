name: sana
display_name: SANA
type: model
description: SANA is NVIDIA's family of efficient diffusion models for image and video generation. The image models,
  SANA, SANA-1.5 and the few-step SANA-Sprint, generate images up to 4K and are small enough that the 0.6B model runs
  on a 16 GB laptop GPU. SANA-Video 2.0, released in August 2026, generates eight-second 720p clips from text or from
  text and an image.
