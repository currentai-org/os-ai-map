name: seaexam
display_name: SeaExam
type: dataset
description: SeaExam is a multiple-choice benchmark from DAMO-NLP-SG, the group behind SeaLLMs, for testing
  language models in Indonesian, Thai, Vietnamese, Chinese and English. It combines real human exam questions
  adapted from M3Exam, standardized to four shuffled options, with 2,850 MMLU questions machine-translated
  using Google Translate. Its companion SeaBench adds open-ended multi-turn and instruction-following questions
  in Indonesian, Thai and Vietnamese, and both feed the SeaExam leaderboard.
github:
- url: https://github.com/DAMO-NLP-SG/SeaExam
huggingface_dataset:
- url: https://huggingface.co/datasets/SeaLLMs/SeaExam
- url: https://huggingface.co/datasets/SeaLLMs/SeaBench
