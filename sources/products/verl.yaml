name: verl
display_name: verl
type: software
description: verl (Volcano Engine Reinforcement Learning) is a post-training library for large language models,
  built on the HybridFlow hybrid-controller architecture. It targets RLHF and reasoning RL on math and code
  tasks, implements PPO, GRPO, RLOO, GSPO, and DAPO, and runs on FSDP or Megatron-LM with vLLM and SGLang rollout.
  ByteDance Seed started the project; the verl community maintains it.
github:
- url: https://github.com/verl-project/verl
pypi:
- url: https://pypi.org/project/verl
comments: The repository moved from volcengine/verl to the verl-project organization; the original path is
  still used for evidence.
