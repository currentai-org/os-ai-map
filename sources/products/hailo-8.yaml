name: hailo-8
display_name: Hailo-8
type: hardware
description: Edge AI inference accelerator from Hailo, delivering up to 26 TOPS at roughly 2.5W typical power.
  It is sold in M.2, mPCIe and PCIe card form factors with integrated memory and no external DRAM, and supports
  TensorFlow, TensorFlow Lite, Keras, PyTorch and ONNX through the Hailo Dataflow Compiler and the HailoRT
  runtime.
github:
- url: https://github.com/hailo-ai/hailort
  not_primary_channel: The HailoRT runtime library repository, not the accelerator itself. Its star count measures
    attention to that repository rather than units in use, so it is not a channel the product ships through;
    adoption is read from reported traction instead.
