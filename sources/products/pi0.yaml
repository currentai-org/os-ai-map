name: pi0
display_name: π0 (openpi)
type: model
description: π0 is Physical Intelligence's line of vision-language-action models, released with training and inference
  code in the openpi repository. It spans π0, a flow-matching VLA, π0-FAST, an autoregressive variant using the
  FAST action tokenizer, and π0.5, which generalizes better to new environments. Base checkpoints are pretrained
  on over ten thousand hours of robot data.
github:
- url: https://github.com/Physical-Intelligence/openpi
comments: Checkpoints download from a public Google Cloud Storage bucket rather than the Hugging Face Hub. The Hub
  copies under the lerobot account are LeRobot's ports and are not counted here.
