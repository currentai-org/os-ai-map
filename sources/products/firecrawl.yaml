name: firecrawl
display_name: Firecrawl
type: software
description: Firecrawl is a web scraping and crawling API built for LLM consumption, turning a URL into clean
  markdown or structured data while handling JavaScript rendering, pagination and anti-bot measures. It offers
  scrape, crawl, map, search, batch and agent-extract endpoints. Firecrawl can run as a self-hosted deployment
  or as a hosted service.
github:
- url: https://github.com/firecrawl/firecrawl
