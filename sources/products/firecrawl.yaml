name: firecrawl
display_name: Firecrawl
type: software
description: Web scraping and crawling API built for LLM consumption, turning a URL into clean markdown or
  structured data while handling JavaScript rendering, pagination and anti-bot measures. It offers scrape,
  crawl, map, search, batch and agent-extract endpoints, and runs either on infrastructure you operate or as
  a hosted service.
github:
- url: https://github.com/firecrawl/firecrawl
pypi:
- url: https://pypi.org/project/firecrawl-py
comments: The self-hosted build cannot take screenshots or run page actions - both need Fire-engine, which
  is closed and ships in no public repo. That is the gate the openness score rests on. Verified 2026-08-13
  via GitHub and the self-hosting guide.
