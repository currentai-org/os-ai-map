name: plato-fl
display_name: Plato
type: software
description: Research framework for federated learning. Experiments run from a configuration file on one machine
  or in Docker, and the server can also be deployed on a public cloud behind HTTPS with clients connecting from
  elsewhere. It includes LoRA fine-tuning of Hugging Face language models and a homomorphic-encryption secure-aggregation
  example.
github:
- url: https://github.com/TL-System/plato
pypi:
- url: https://pypi.org/project/plato-learn/
comments: The slug carries an `-fl` suffix because the bare name is a generic word.
