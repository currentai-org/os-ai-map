name: plato-fl
display_name: Plato
type: software
description: Research framework for federated learning from the University of Toronto. Experiments run from a configuration
  file on one machine, in Docker or on a Slurm cluster, and the server can also be deployed on a public cloud behind
  HTTPS with clients connecting from elsewhere. It includes LoRA fine-tuning of Hugging Face language models, split
  learning and homomorphic-encryption examples.
github:
- url: https://github.com/TL-System/plato
pypi:
- url: https://pypi.org/project/plato-learn/
comments: The slug carries an `-fl` suffix because the bare name is a generic word.
