description: Phi-4 is Microsoft's 14B dense small language model, announced in December 2024 and fully released
  the following month. It was trained on 9.8 trillion tokens of heavily curated and synthetic data, with a
  recipe that centers on data quality and uses synthetic data throughout training. The line has since been
  extended with mini, multimodal, reasoning and reasoning-vision variants.
