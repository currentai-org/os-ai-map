name: iree
display_name: IREE
type: software
description: IREE is an MLIR-based compiler and runtime that lowers machine learning models to a unified intermediate
  representation, targeting datacenter hardware at one end and mobile and edge constraints at the other. Input comes
  from PyTorch, JAX, TensorFlow and ONNX; output targets include CPU, CUDA, ROCm, Vulkan and SPIR-V. The project
  is hosted by the LF AI & Data Foundation.
