name: colossal-ai
display_name: Colossal-AI
type: software
description: Colossal-AI is a PyTorch library for large-scale distributed training and fine-tuning. It combines data, pipeline,
  sequence and several forms of tensor parallelism with the ZeRO optimizer and heterogeneous memory management, and ships
  applications on top of them, among them ColossalChat, an RLHF pipeline, and fine-tuning recipes for large open models. HPC-AI
  Tech builds it and runs a GPU cloud with Colossal-AI preinstalled.
