name: sea-lion
display_name: SEA-LION
type: model
description: SEA-LION (Southeast Asian Languages In One Network) is AI Singapore's family of language models for
  Southeast Asia, funded by the National Research Foundation Singapore. The current release, SEA-LION v4.8, adapts
  NVIDIA's Nemotron 3 models to English and seven regional languages, from Burmese and Tamil to Thai and Vietnamese,
  through continued pretraining and post-training, in 30B and 120B mixture-of-experts sizes. Earlier v4 releases
  were built on Qwen3 32B and Gemma 3 27B.
