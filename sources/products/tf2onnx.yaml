name: tf2onnx
display_name: tf2onnx
type: software
description: tf2onnx converts TensorFlow, Keras, TensorFlow.js and TFLite models into ONNX, from the command line
  or a Python API, mapping framework operations onto ONNX operator sets. It is the ONNX project's TensorFlow-side
  converter and sits under the ONNX organization.
github:
- url: https://github.com/onnx/tensorflow-onnx
pypi:
- url: https://pypi.org/project/tf2onnx/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
