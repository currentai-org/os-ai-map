name: pocket-tts
display_name: Pocket TTS
type: model
description: Kyutai's small text-to-speech model, about 100M parameters, built to run faster than real time on two laptop
  CPU cores, with streaming output and voice cloning from a short sample. It speaks English and several other European languages,
  installs as a Python package with a command line and a server, and runs in the browser through community ports. The repository
  also carries the code to train new voices and languages.
github:
- url: https://github.com/kyutai-labs/pocket-tts
huggingface_model:
- url: https://huggingface.co/kyutai/pocket-tts
- url: https://huggingface.co/kyutai/pocket-tts-without-voice-cloning
pypi:
- url: https://pypi.org/project/pocket-tts
arxiv:
- url: https://arxiv.org/abs/2509.06926
