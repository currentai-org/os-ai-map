name: llama-prompt-guard
display_name: Llama Prompt Guard 2
type: model
description: Llama Prompt Guard 2 is Meta's compact classifier for prompt injection and jailbreaks, labeling
  prompts as benign or malicious. It is part of LlamaFirewall and was evaluated in eight languages. Of its
  two sizes, the 86M model classifies a 512-token prompt in about 92 ms on an A100, and the 22M model cuts
  latency by about three quarters at some cost in recall.
huggingface_model:
- url: https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M
