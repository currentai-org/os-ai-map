name: eagle
display_name: Eagle
type: model
description: 'Eagle is NVIDIA Research''s family of vision-language models, built around data-centric post-training
  recipes. Eagle 2.5, the current release, pairs a SigLIP2 vision encoder with Qwen2.5-7B-Instruct and is trained
  for long-context input: up to 512 video frames, high-resolution images and multi-page documents. Eagle models
  also serve as the vision-language backbone of NVIDIA''s GR00T robot models.'
