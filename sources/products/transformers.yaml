name: transformers
display_name: Transformers
type: software
description: Transformers is a model-definition framework for machine learning across text, vision, audio,
  video and multimodal models, covering both inference and training. It provides a unified API to load and
  run pretrained checkpoints from the Hugging Face Hub, and its model definitions are reused by training frameworks,
  inference engines and adjacent libraries such as llama.cpp and mlx. Hugging Face maintains it.
github:
- url: https://github.com/huggingface/transformers
pypi:
- url: https://pypi.org/project/transformers/
