name: invisible-watermark
display_name: invisible-watermark
type: software
description: invisible-watermark is a Python library and command-line tool that embeds and decodes invisible
  watermarks in images using frequency-domain methods (DWT-DCT and DWT-DCT-SVD) or the RivaGAN neural encoder.
  The fast default method suits embedding on the fly, while the other two are several times slower on a CPU.
  The maintainers describe it as experimental and warn that decoding is not guaranteed.
comments: 'Tagged self-attested: decoding needs no key, but nothing ties the mark to whoever embedded it. Last
  pushed in 2023.'
github:
- url: https://github.com/ShieldMnt/invisible-watermark
pypi:
- url: https://pypi.org/project/invisible-watermark/
