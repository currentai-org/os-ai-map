name: habitat
display_name: Habitat
type: software
description: 'Habitat is Meta''s platform for embodied-AI research: Habitat-Sim, a 3D simulator that renders RGB-D and semantic
  camera views of scanned indoor scenes at thousands of frames per second with Bullet rigid-body physics, and Habitat-Lab,
  the library that defines navigation, rearrangement, instruction-following and question-answering tasks and trains agents
  on them. It is the navigation and home-environment simulator of the category.'
github:
- url: https://github.com/facebookresearch/habitat-sim
- url: https://github.com/facebookresearch/habitat-lab
pypi:
- url: https://pypi.org/project/habitat-lab
comments: Both READMEs now open with "Beyond v0.3.4 this project is no longer receiving official active development or maintenance
  by Meta internal teams", so the last releases (Habitat-Sim 0.3.3, Habitat-Lab 0.3.4) are the current ones. Habitat-Sim itself
  installs from the aihabitat conda channel, which reports only an all-time count; the PyPI habitat-sim name holds a single
  2023 development upload and is not declared. The scanned scene datasets it is usually run on (HM3D, Matterport3D, Gibson)
  are separate downloads under their owners' terms.
