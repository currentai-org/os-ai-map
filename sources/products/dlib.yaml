name: dlib
display_name: dlib
type: software
description: C++ toolkit of machine-learning algorithms and supporting tools, with Python bindings, maintained
  by Davis King. It provides support vector machines, relevance vector machines, kernel methods, structural
  SVMs, clustering and a deep-learning API, and is best known for its face detection, facial landmark and face
  recognition models. The trained models are published separately, mostly in the public domain.
