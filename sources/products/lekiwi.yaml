name: lekiwi
display_name: LeKiwi
type: hardware
description: 'LeKiwi is a low-cost, 3D-printable mobile manipulator: an SO-101 arm on a three-wheel omnidirectional base with
  a Raspberry Pi 5 and cameras, designed by SIGRobotics at the University of Illinois with Hugging Face contributors and driven
  by the LeRobot library. The repository publishes STL files, a URDF and a bill of materials, about $480 for the full robot,
  and Seeed Studio sells a kit.'
github:
- url: https://github.com/SIGRobotics-UIUC/LeKiwi
comments: The arm is The Robot Studio's SO-101 (the so-101 row); LeKiwi adds the base and a modified follower-arm mount.
