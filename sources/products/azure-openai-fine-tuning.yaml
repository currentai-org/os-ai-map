name: azure-openai-fine-tuning
display_name: Azure OpenAI Fine-Tuning
type: software
description: Azure OpenAI Fine-Tuning is Microsoft's managed fine-tuning service inside Microsoft Foundry,
  covering OpenAI models and open-weight models such as Llama, Qwen, Ministral and gpt-oss. It supports supervised
  fine-tuning, direct preference optimization, and reinforcement fine-tuning, with per-epoch checkpoints and
  optional automatic deployment. Jobs run under Foundry role-based access controls.
comments: Openness was read from Microsoft's Product Terms, since the service publishes no license file; the
  reverse-engineering and weight-exfiltration restriction there covers Foundry Models generally, not fine-tuning
  specifically.
