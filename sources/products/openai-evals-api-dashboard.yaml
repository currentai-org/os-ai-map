name: openai-evals-api-dashboard
display_name: OpenAI Evals API & Dashboard
type: software
description: 'Managed evaluation product inside the OpenAI platform: an Evals API and a dashboard that let
  developers define eval datasets, run them against OpenAI models, third-party models or custom endpoints,
  grade with built-in or custom graders, and inspect results across versions.'
comments: Read-only from 31 October 2026 and shut down on 30 November 2026; the deprecations page points users
  to Promptfoo and the Evals guide to Datasets. Distinct from the openai/evals repository, a separate record.
