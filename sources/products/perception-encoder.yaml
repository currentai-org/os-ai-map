name: perception-encoder
display_name: Perception Encoder
type: model
description: Meta FAIR's family of contrastively trained vision encoders. The PE Core models are CLIP-style image and video
  encoders with a matching text encoder, for zero-shot classification and retrieval, in sizes from T/16 to G/14, the smaller
  ones distilled from the largest. Meta describes them as outperforming SigLIP 2 on image benchmarks and InternVideo2 on video.
github:
- url: https://github.com/facebookresearch/perception_models
huggingface_model:
- url: https://huggingface.co/facebook/PE-Core-L14-336
- url: https://huggingface.co/facebook/PE-Core-G14-448
- url: https://huggingface.co/facebook/PE-Core-B16-224
- url: https://huggingface.co/facebook/PE-Core-S16-384
- url: https://huggingface.co/facebook/PE-Core-T16-384
arxiv:
- url: https://arxiv.org/abs/2504.13181
comments: Only the PE Core checkpoints are declared. PE Lang and PE Spatial, tuned for language models and dense prediction,
  and the audio-visual PE-AV models come from the same repository but are not retrieval models; the Perception LM checkpoints
  are a separate entry.
