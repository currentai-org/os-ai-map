name: vukuzenzele
display_name: Vuk'uzenzele corpus
type: dataset
description: The Vuk'uzenzele corpus is text from South Africa's government magazine Vuk'uzenzele, extracted
  from its PDF editions in all 11 official languages. It ships as a monolingual set with train, test and eval
  splits and as a sentence-aligned parallel set of more than 60,000 pairs across 55 language combinations,
  aligned with LASER embeddings. The Data Science for Social Impact group (DSFSI) prepared it.
github:
- url: https://github.com/dsfsi/vukuzenzele-nlp
huggingface_dataset:
- url: https://huggingface.co/datasets/dsfsi/vukuzenzele-monolingual
- url: https://huggingface.co/datasets/dsfsi/vukuzenzele-sentence-aligned
arxiv:
- url: https://arxiv.org/abs/2303.03750
