name: rasa
display_name: Rasa
type: dataset
description: Rasa is an expressive text-to-speech corpus covering the 22 officially recognized languages of
  India, with a female and a male voice per language and about 1,145 hours in total. Its 48 kHz recordings
  mix neutral Wikipedia readings, speech in the six Ekman emotions, voice-assistant style commands, conversation,
  news reading and book narration. AI4Bharat built it, and the method appeared at Interspeech 2024.
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/Rasa
comments: The card cites an Interspeech 2024 paper but links no arXiv entry, so none is listed.
