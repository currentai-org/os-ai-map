name: vosk
display_name: Vosk
type: software
description: 'Alpha Cephei''s offline speech recognition toolkit built on Kaldi: a streaming recognizer for 20+ languages
  with small models for phones and Raspberry Pi boards and large ones for servers, speaker identification, and bindings
  for Python, Java, Node.js, C#, Go, Rust and more.'
github:
- url: https://github.com/alphacep/vosk-api
pypi:
- url: https://pypi.org/project/vosk/
comments: The last PyPI release is from December 2022 although the repository is still updated; most downloadable models
  are Apache-2.0, and a few carry AGPL, LGPL or non-commercial terms.
