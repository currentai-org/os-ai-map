name: weathernext
display_name: WeatherNext
type: model
description: WeatherNext is Google DeepMind's global medium-range weather and tropical-cyclone forecasting line. One repository now hosts WeatherNext 2, the WeatherNext Cyclones checkpoints and their lightweight Mini variants, together with the earlier GraphCast and GenCast models republished as WeatherNext Graph and WeatherNext Gen, plus a demo notebook that runs forecasts, tracks cyclones, and takes a training step.
github:
- url: https://github.com/google-deepmind/weathernext
comments: The repository absorbed the former google-deepmind/graphcast, so GraphCast and GenCast are versions of this product line rather than separate products. Verified 2026-09-10 via the DeepMind repository and GitHub API.
