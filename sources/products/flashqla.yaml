name: flashqla
display_name: FlashQLA
type: software
description: FlashQLA is a linear attention kernel library from the Qwen team, built on TileLang, applying operator fusion
  to the forward and backward passes of Gated DeltaNet (GDN) chunked prefill. It serves as a backend for the flash-linear-attention
  library's GDN operators through the standard FLA API.
