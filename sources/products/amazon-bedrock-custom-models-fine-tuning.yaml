name: amazon-bedrock-custom-models-fine-tuning
display_name: Amazon Bedrock Custom Models / Fine-Tuning
type: software
description: Amazon Bedrock Custom Models is AWS's managed service for customizing Bedrock foundation models,
  covering supervised fine-tuning, reinforcement fine-tuning and distillation from a teacher model into a student
  model. Reinforcement fine-tuning grades responses through reward functions written as AWS Lambda functions
  rather than labeled examples, and reports training metrics in real time.
