name: paradedb
display_name: ParadeDB
type: software
description: ParadeDB is a Postgres extension that adds a custom index for full-text search with BM25 scoring,
  vector search, filtering and aggregations directly inside Postgres, so application data and search live in one
  database rather than two systems kept in sync.
