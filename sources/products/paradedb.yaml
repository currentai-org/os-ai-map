name: paradedb
display_name: ParadeDB
type: software
description: ParadeDB is a Postgres extension that adds a custom index for full-text search with BM25 scoring,
  vector search, filtering and aggregations directly inside Postgres, so application data and search live in one
  database rather than two systems kept in sync.
github:
- url: https://github.com/paradedb/paradedb
comments: Distinct from pgvector, already on this roster - pgvector adds vector search to Postgres, ParadeDB adds
  a separate BM25 full-text and vector index (the pg_search extension) with aggregation support. Verified
  2026-09-02 via the GitHub API and the LICENSE body.
