name: camel
display_name: CAMEL
type: software
description: CAMEL is a Python framework for building and studying multi-agent systems, from pairs of
  role-playing agents to larger agent societies and workforces. It provides chat agents with stateful
  memory, toolkits, retrieval, storage and model integrations, and is used for synthetic data generation,
  task automation and world simulation. CAMEL-AI.org, a community research group, builds it; its 2023
  paper introduced the role-playing approach.
