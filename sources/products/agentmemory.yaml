name: agentmemory
display_name: agentmemory
type: software
description: agentmemory records what coding agents do through hooks and plugins for tools such as Claude Code,
  Codex and Cursor, condenses those observations into session summaries, facts and lessons, and serves them back
  to later sessions through keyword, vector and graph search. It runs as a local server with MCP and REST interfaces
  and a live viewer, built on the iii engine. Rohit Ghumare maintains it.
github:
- url: https://github.com/rohitg00/agentmemory
npm:
