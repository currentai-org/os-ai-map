name: mediapipe
display_name: MediaPipe
type: software
description: Google's framework and ready-made solutions for on-device machine learning on Android, iOS, the
  web and Python. Its Tasks APIs run pretrained models for face detection and landmarks, hand and pose landmarks,
  gesture recognition, holistic tracking, object detection, image classification, embedding and segmentation,
  interactive segmentation, audio and text classification and language detection, and it adds on-device LLM
  inference. Some solutions can be retrained with the Model Maker tool, which is no longer actively maintained.
github:
- url: https://github.com/google-ai-edge/mediapipe
pypi:
