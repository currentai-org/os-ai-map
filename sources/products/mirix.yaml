name: mirix
display_name: MIRIX
type: software
description: MIRIX is a memory server for LLM agents in which dedicated memory agents extract core, episodic, semantic,
  procedural, resource and knowledge-vault memories from conversations and tool traces, merge and correct them in
  Auto-Dream passes, and serve them back through keyword, embedding and optional graph search. The server self-hosts
  with Docker or runs as a hosted API, and agents reach it through a Python client. MIRIX AI builds it.
comments: Read against the memory server on the main branch. The desktop personal assistant the repository first
  shipped is deprecated and kept on its desktop-agent branch, and is not scored.
github:
