name: gigabrain
display_name: GigaBrain
type: model
description: GigaBrain is GigaAI's line of vision-language-action models for robot manipulation. GigaBrain-0.7, the current
  release, is a 3.5B model whose three-part design combines scene understanding, prediction and action, pretrained on more
  than 37,000 hours of real-robot, handheld-gripper, egocentric, simulated and world-model-generated data. It ships with training
  configurations for AgileX, AgiBot and GigaAI's own Maker H01 robots.
