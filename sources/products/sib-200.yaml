description: SIB-200 is a topic classification benchmark in 205 languages and dialects, built by labeling the
  English FLORES-200 sentences with seven topics such as science, travel and politics and carrying the labels
  across to every aligned translation. Train, validation and test splits exist for every language. It was created
  by David Adelani and colleagues, with annotators recruited through Masakhane.
