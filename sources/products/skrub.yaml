name: skrub
display_name: skrub
type: software
description: skrub is a Python library that prepares dataframes for machine learning with scikit-learn. Its TableVectorizer
  turns mixed numeric, categorical, date and text columns into features, with encoders such as GapEncoder, MinHashEncoder
  and StringEncoder for high-cardinality strings, and tabular_pipeline wraps that into a ready baseline. TableReport explores
  a table interactively. Development is supported by Inria and :probabl.
