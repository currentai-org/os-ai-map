name: strix
display_name: Strix
type: software
description: Open-source AI penetration testing tool to find and fix your app’s vulnerabilities. Strix are autonomous
  AI penetration testing agents that act just like real hackers - they run your code dynamically, find vulnerabilities,
  and validate them through actual proofs-of-concept. Built for developers and security teams who need fast, accurate
  security testing without the overhead of manual pentesting or the false positives of static analysis tools.
