name: berkeley-humanoid-lite
display_name: Berkeley Humanoid Lite
type: hardware
description: Berkeley Humanoid Lite is an open-source bipedal humanoid robot from UC Berkeley's Hybrid Robotics
  lab, built for under $5k in parts from 3D-printed cycloidal gearboxes and widely available parts. The project
  publishes the CAD and robot descriptions, the low-level C controller over CAN, and Isaac Lab environments for
  training locomotion policies that transfer from simulation to the hardware.
github:
- url: https://github.com/HybridRobotics/berkeley-humanoid-lite
