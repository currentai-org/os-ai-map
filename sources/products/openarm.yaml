name: openarm
display_name: OpenArm
type: hardware
description: OpenArm is an open-source seven-degree-of-freedom humanoid arm for physical AI research in contact-rich
  settings, sold as a complete bimanual system for $6,500 or built from the published design. Enactic, a Tokyo robotics
  company, publishes the CAD alongside CAN control, ROS 2, teleoperation, MuJoCo and Isaac Lab packages and a dataset
  toolkit.
github:
- url: https://github.com/enactic/openarm
comments: The CAD files live on Google Drive, which the project names as the source of truth, with snapshots mirrored
  to GitHub releases of the openarm_hardware repository.
