name: label-studio
display_name: Label Studio
type: software
description: Label Studio is a data labeling tool for preparing and correcting training data. Its web interface labels text,
  images, audio, video, HTML and time series, with labeling screens configured from a tag library and exports to common model
  formats such as JSON and COCO. Connected ML backends can pre-label tasks for review. HumanSignal builds it and sells Starter
  Cloud and Enterprise editions beside the free Community Edition.
github:
- url: https://github.com/HumanSignal/label-studio
