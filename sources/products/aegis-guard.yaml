name: aegis-guard
display_name: Aegis AI Content Safety
type: model
description: Aegis AI Content Safety is NVIDIA's content-safety classifier, now also called Llama Nemotron
  Safety Guard Defensive. It is a parameter-efficient tune of Meta's LlamaGuard-7b, built on Llama 2 7B and
  trained on NVIDIA's Aegis dataset across 13 critical risk categories. Although it was trained only to classify
  user prompts, it can also label responses through the same template, and it ships beside a permissive variant.
