description: 'The Bloom Library datasets turn the community-written storybooks on SIL''s Bloom Library into
  four multilingual resources: text for language modeling, image captioning, visual storytelling, and aligned
  speech. They cover more than 350 languages across over 30 families, many with only a few stories each. SIL
  Global builds Bloom, the book-authoring software behind the library.'
