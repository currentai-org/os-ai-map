name: torchtitan
display_name: TorchTitan
type: software
description: TorchTitan is a PyTorch-native platform for pretraining and post-training generative models at scale. One readable
  codebase takes a model from pretraining through supervised fine-tuning to reinforcement learning, composing FSDP2, tensor,
  pipeline, context and expert parallelism through DeviceMesh and DTensor, with float8 and FP4 training and recipes for open
  model families. The PyTorch team develops it in the pytorch organization.
