description: Mozilla Common Voice is a crowdsourced corpus of transcribed read speech in hundreds of languages,
  built for training and evaluating speech recognition. Volunteers record sentences on the Common Voice platform
  and other volunteers validate each clip; a smaller spontaneous-speech collection sits beside the scripted
  one. Releases are distributed per language through Mozilla Data Collective. The Mozilla Foundation runs the
  project.
