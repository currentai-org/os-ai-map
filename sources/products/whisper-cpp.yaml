name: whisper-cpp
display_name: whisper.cpp
type: software
description: A dependency-free C/C++ port of Whisper on the ggml tensor library, with integer quantization and GPU
  backends including Metal, CUDA and Vulkan. It runs on desktops, servers, iOS, Android, WebAssembly and the Raspberry
  Pi.
github:
- url: https://github.com/ggml-org/whisper.cpp
comments: There is no official Python package. The converted models on the Hub (ggerganov/whisper.cpp) report no
  download count, so adoption reads GitHub stars.
