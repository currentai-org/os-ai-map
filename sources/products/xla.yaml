name: xla
display_name: XLA
type: software
description: XLA (Accelerated Linear Algebra) is a machine learning compiler that takes models from PyTorch, TensorFlow
  and JAX and optimizes them for execution on CPUs, GPUs and ML accelerators. It sits inside those frameworks rather
  than being invoked directly, so the repository is aimed at compiler contributors and at integrators adding front
  ends or hardware backends.
