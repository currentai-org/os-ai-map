name: kornia
display_name: Kornia
type: software
description: Differentiable computer-vision library for PyTorch, with more than 1,200 operators for geometry
  and camera models, feature detection and matching, filtering, color, augmentation and losses that run batched
  on GPUs inside training graphs. It also ships builders for ported pretrained models such as LoFTR, LightGlue,
  DISK, SAM, YuNet and RT-DETR, a zoo now frozen for expansion. It is a non-profit project funded by sponsorship.
github:
- url: https://github.com/kornia/kornia
pypi:
- url: https://pypi.org/project/kornia
