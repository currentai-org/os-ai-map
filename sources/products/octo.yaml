name: octo
display_name: Octo
type: model
description: 'Octo is an open generalist robot policy from UC Berkeley''s Robotic AI and Learning Lab and collaborators:
  a transformer diffusion policy trained on 800k trajectories from Open X-Embodiment. It accepts several camera
  views and either a language instruction or a goal image, and its modular attention lets it be fine-tuned to new
  sensors, action spaces and robot bodies with a small dataset.'
