description: Gemini 3.5 Flash is Google's Flash-tier Gemini model, released in May 2026 as the first Gemini
  3.5 model. It is a thinking and agentic instruct model with configurable thinking budgets that trade reasoning
  depth for latency, available through the Gemini app, AI Mode in Search, Antigravity, the Gemini API and enterprise
  products. Google now labels it a legacy Flash model.
