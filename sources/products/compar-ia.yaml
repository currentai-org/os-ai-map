name: compar-ia
display_name: Compar:IA
type: software
description: Blind model-comparison arena created by the French government's betagouv and DINUM with the Ministry
  of Culture. A user types a prompt, two anonymous models reply, and the user votes; the identities and each
  model's estimated energy cost are revealed afterward. Its purpose is building large non-English human-preference
  datasets. It deploys with Docker on a single server, and another instance, AI-arenaen, runs in Denmark.
github:
- url: https://github.com/betagouv/ComparIA
  not_primary_channel: The product's source repository; people use the hosted arena rather than the code. Its
    star count measures attention to the code rather than use of the product, so it is not the channel adoption
    is read from; the band rests on reported traction.
