name: helm
display_name: HELM
type: software
description: 'Holistic Evaluation of Language Models: a Python framework for reproducible evaluation of foundation
  models, organized around scenarios, adapters and metrics, and covering accuracy, efficiency, bias and toxicity.
  It ships a web leaderboard UI in the same repository and maintains boards spanning text, vision-language,
  text-to-image, medical and audio evaluation, plus an enterprise benchmark.'
github:
- url: https://github.com/stanford-crfm/helm
pypi:
- url: https://pypi.org/project/crfm-helm
comments: 'HELM entered maintenance mode on 1 June 2026: the leaderboards stay available, but no new features
  or leaderboard evaluations are being added.'
