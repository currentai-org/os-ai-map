name: sptag
display_name: SPTAG
type: software
description: SPTAG (Space Partition Tree And Graph) is a Microsoft Research and Bing library for large-scale
  approximate nearest neighbour search, combining kd-tree or balanced k-means tree partitioning with a relative
  neighbourhood graph. It supports online insertion and deletion and a distributed search mode across machines.
github:
- url: https://github.com/microsoft/SPTAG
pypi:
- url: https://pypi.org/project/sptag/
comments: Distinct from diskann - a different Microsoft Research ANN algorithm family (tree-plus-graph rather
  than Vamana), maintained independently. Verified 2026-09-02 via the GitHub API and the LICENSE body.
