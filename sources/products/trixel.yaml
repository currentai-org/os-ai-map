name: trixel
display_name: TRIXEL
type: software
description: >
  Autonomous AI agent operating system — runs entirely on local LLMs with
  cloud fallback. Combines an MCP proxy (28+ server orchestration), LiteRT
  local inference (Gemma-4-E2B, Qwen), Swarm multi-agent orchestrator, graph
  memory (Neo4j), file ops, and built-in evaluation framework into a single
  CLI-driven agent runtime. Designed for ofﬂine-capable, cost-controlled
  AI automation with no API key dependency for core functions.
github:
- url: https://github.com/nicki/trixel
comments: 'MIT licensed. Agent OS layer: orchestrates 28+ MCP servers, runs local LLM inference via LiteRT (Gemma-4-E2B), provides structured decision logging, and automated self-evaluation.'