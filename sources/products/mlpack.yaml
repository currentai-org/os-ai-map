name: mlpack
display_name: mlpack
type: software
description: mlpack is a header-only C++ machine learning library with bindings for Python, R, Julia, Go and the command line.
  It implements classifiers and regressors such as random forests, AdaBoost, Hoeffding trees and logistic and softmax regression,
  along with clustering, nearest-neighbor search over many tree types, dimensionality reduction and neural networks, plus
  cross-validation and hyperparameter tuning. NumFOCUS fiscally sponsors the project, which runs under an open governance
  model.
github:
- url: https://github.com/mlpack/mlpack
