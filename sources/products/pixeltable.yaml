name: pixeltable
display_name: Pixeltable
type: software
description: Pixeltable is a unified multimodal backend for AI data apps. It stores images, video, audio,
  documents and structured data in one table interface, indexes embeddings, and runs models and transformations
  from computed columns declared on insert, in place of separately gluing together blob storage, a vector
  database and an orchestrator.
github:
- url: https://github.com/pixeltable/pixeltable
