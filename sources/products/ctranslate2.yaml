name: ctranslate2
display_name: CTranslate2
type: software
description: CTranslate2 is a C++ and Python inference engine for Transformer models that speeds them up and cuts their memory
  use on CPUs and GPUs through weight quantization, layer fusion and batch reordering. It runs converted encoder-decoder,
  decoder-only and encoder-only models, including Whisper, NLLB, T5 and Llama-family models, and is the engine behind faster-whisper.
  It is part of the OpenNMT project.
github:
- url: https://github.com/OpenNMT/CTranslate2
pypi:
