name: pysyft
display_name: Syft / PySyft
type: software
description: PySyft is OpenMined's library for privacy-preserving data science on data that stays with its
  owner. A data scientist submits computations that the data owner approves and runs on private data, over
  cloud storage the organizations already use, such as Google Drive, with sandboxed job execution, per-collaborator
  approval and an optional Trusted Execution Environment package.
github:
- url: https://github.com/OpenMined/PySyft
pypi:
- url: https://pypi.org/project/syft/
