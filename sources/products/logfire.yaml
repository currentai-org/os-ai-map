name: logfire
display_name: Pydantic Logfire
type: software
description: AI and application observability platform from the Pydantic team, built on OpenTelemetry, providing
  agent and LLM tracing, prompt management with versioning and rollout, live evaluations, datasets and
  experiments, and SQL querying over recorded traces, metrics and logs. The Python, TypeScript and Rust SDKs
  are open source and can export to any OpenTelemetry-compatible backend; the Logfire platform itself - the
  UI and the server that records and displays the data - is closed source, with self-hosting available only
  under a purchased enterprise license.
github:
- url: https://github.com/pydantic/logfire
pypi:
- url: https://pypi.org/project/logfire
comments: The repository's own README states this directly - "This repo contains the Python SDK for logfire
  and documentation; the server application for recording and displaying data is closed source" - and its
  "Open-Source and Closed-Source Boundaries" section confirms the platform (UI and backend) is closed, self-hostable
  only under a paid enterprise license. Verified 2026-09-02 via the pydantic/logfire repository.
