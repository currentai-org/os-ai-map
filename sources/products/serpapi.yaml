name: serpapi
display_name: SerpApi
type: software
description: Scrapes search engine results pages and returns them as structured JSON. One metered product covers
  roughly 130 engines - Google, Bing, Baidu, DuckDuckGo, Amazon, Walmart, Yandex, YouTube and the rest - with
  organic results, answer boxes, knowledge graph, local packs and ads parsed into fields.
pypi:
- url: https://pypi.org/project/google-search-results
comments: 'SerpApi operates no index of its own: what it sells is scraping and parsing of other people''s search
  engines, which is why its openness record has no index to be closed about and its terms carry a "U.S. Legal
  Shield" offering up to $2 million of coverage for scraping search engine data. The Python client is published
  under the unrelated-looking name `google-search-results` while the npm client is plain `serpapi`, so a package
  lookup on the product''s own name lands on the JavaScript one. Verified 2026-09-17 via the SerpApi Google
  Search API page and the SerpApi pricing page.'
