name: gpt4all
display_name: GPT4All
type: software
description: Cross-platform desktop app from Nomic AI for running LLMs locally on ordinary laptops, without
  an API key or a GPU. It bundles a chat interface, LocalDocs for retrieval over private files, an OpenAI-compatible
  local API server and a Python client, with Nomic Vulkan acceleration where a GPU is available.
