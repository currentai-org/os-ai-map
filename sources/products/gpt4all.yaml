name: gpt4all
display_name: GPT4All
type: software
description: Free, cross-platform desktop app from Nomic AI for running LLMs privately on everyday laptops with
  no API or GPU required. Includes a chat UI, LocalDocs (private RAG over your files), an OpenAI-compatible local
  API server, and a Python client, with Nomic Vulkan GPU acceleration.
github:
- url: https://github.com/nomic-ai/gpt4all
comments: MIT. ~77k stars. Reduced maintenance - last notable release Feb 2025, community reports of stalled
  development through 2025 (no official deprecation). Verified 2026-08-13 via the nomic-ai/gpt4all repository;
  the repo has had no push since 27 May 2025, so the stall is now over a year old.
