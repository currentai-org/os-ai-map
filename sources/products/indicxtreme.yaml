name: indicxtreme
display_name: IndicXTREME
type: dataset
description: IndicXTREME is a natural language understanding benchmark of nine tasks across 20 Indian languages,
  grouping 105 evaluation sets for classification, structure prediction, question answering and sentence retrieval.
  AI4Bharat created new sets, among them IndicCOPA, IndicQA, IndicXParaphrase and IndicSentiment, and folded
  in Naamapadam, IndicXNLI, MASSIVE and FLORES. It was released with IndicBERT v2 to test zero-shot multilingual
  transfer.
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/IndicCOPA
- url: https://huggingface.co/datasets/ai4bharat/IndicQA
- url: https://huggingface.co/datasets/ai4bharat/IndicXParaphrase
- url: https://huggingface.co/datasets/ai4bharat/IndicSentiment
- url: https://huggingface.co/datasets/ai4bharat/naamapadam
comments: Listed are the AI4Bharat-hosted task repositories; the IndicXNLI, MASSIVE and FLORES tasks belong
  to other publishers and are not counted here.
