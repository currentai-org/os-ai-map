name: gemini-embedding
display_name: Gemini Embedding
type: model
description: Google's embedding line on the Gemini API and Vertex AI. The latest model is gemini-embedding-2,
  which Google describes as its first natively multimodal embedder, mapping text, images, video, audio and
  PDFs into one space; gemini-embedding-001, the text-only predecessor with 100-plus languages, Matryoshka
  dimensions down from 3,072 and a 2,048-token input, remains available.
arxiv:
- url: https://arxiv.org/abs/2605.27295
