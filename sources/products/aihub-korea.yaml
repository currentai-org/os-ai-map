name: aihub-korea
display_name: AI-Hub
type: software
description: AI-Hub is South Korea's national platform for AI training data, run by the National Information Society Agency
  (NIA) for the Ministry of Science and ICT. It publishes datasets built by companies and research groups under the government's
  data programme, in fields from Korean language and vision to healthcare and transport, alongside data other institutions
  contribute. Korean nationals apply to download each dataset, through the website or the aihubshell command-line tool.
