name: k2
display_name: K2
type: model
aliases:
- k2-v2
description: LLM360 and MBZUAI's K2 model line. K2-V2, a 70B dense model released in December 2025 as a reasoning-enhanced
  LLM the project calls 360-open, ships its weights alongside the complete TxT360 pretraining, mid-training
  and SFT data, the training code and intermediate checkpoints, so the run is reproducible; it superseded the
  65B K2 Chat. K2 Horizon, released in September 2026 under Apache-2.0 in sizes up to a 375B-parameter mixture
  of experts with 23B active, is the current flagship.
