name: ollama-library
display_name: Ollama Library
type: software
description: The model registry at ollama.com that the Ollama runner pulls from and pushes to. Ollama curates
  the official library namespace, and any account holder who registers a public key can push models to a namespace
  of their own. Models are addressed as namespace/model:tag, with each tag naming a specific version, and pull
  counts and tag lists are shown per model.
comments: Scored as the registry service. The MIT-licensed runner is a separate entry in deployment and contains
  the client side of push and pull, not the registry server.
