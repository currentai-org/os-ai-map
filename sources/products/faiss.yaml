name: faiss
display_name: Faiss
type: software
description: Faiss is a library for similarity search and clustering of dense vectors, carrying the widest set of
  index structures in common use - flat, IVF, product quantization, HNSW and their composites - with GPU implementations
  of the most useful ones. It is written in C++ with Python bindings and includes evaluation and parameter-tuning
  code. Meta's Fundamental AI Research group develops it, and other vector stores build on it.
github:
- url: https://github.com/facebookresearch/faiss
pypi:
- url: https://pypi.org/project/faiss-cpu/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
