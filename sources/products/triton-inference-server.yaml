name: triton-inference-server
display_name: Triton Inference Server
type: software
description: Triton Inference Server serves models from many frameworks, including TensorRT, PyTorch, ONNX, OpenVINO, Python
  and RAPIDS FIL, over HTTP/REST and gRPC. It runs several models at once with dynamic and sequence batching, chains them
  into ensembles, and works on NVIDIA GPUs, x86 and ARM CPUs and AWS Inferentia. NVIDIA develops it and publishes release
  containers on NGC.
github:
- url: https://github.com/triton-inference-server/server
