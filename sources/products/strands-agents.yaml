name: strands-agents
display_name: Strands Agents
type: software
description: Strands Agents is an SDK for building and running AI agents in Python and TypeScript, with
  the agent loop running in the developer's own process rather than on a hosted control plane. It provides
  tools and structured output, MCP, multi-agent patterns, memory and sessions, streaming, guardrails,
  tracing and evaluations, and supports Amazon Bedrock, Anthropic, OpenAI, Gemini and other model providers.
  Amazon builds it, along with a preassembled harness agent in the same repository.
github:
- url: https://github.com/strands-agents/harness-sdk
pypi:
- url: https://pypi.org/project/strands-agents/
