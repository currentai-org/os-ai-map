name: uce
display_name: UCE
type: model
description: UCE is the Stanford SNAP lab's universal cell embedding model, a self-supervised transformer that maps single-cell transcriptomes from many tissues and species into one latent space. It ships 4-layer and 33-layer pretrained checkpoints and an evaluation script that embeds an AnnData dataset directly, with no labeling, training, or fine-tuning step.
github:
- url: https://github.com/snap-stanford/UCE
comments: The repository is an inference implementation; the pretraining corpus and the model's behavior are documented in the Nature paper rather than in the README. Verified 2026-09-10 via the GitHub API, the repository README and LICENSE, and the published paper.
