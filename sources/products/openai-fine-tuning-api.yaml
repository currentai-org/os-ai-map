name: openai-fine-tuning-api
display_name: OpenAI Fine-Tuning API
type: software
description: 'The OpenAI Fine-Tuning API trains custom versions of OpenAI''s hosted models on OpenAI''s own
  infrastructure, covering supervised fine-tuning, vision fine-tuning and direct preference optimization. Jobs
  run against gpt-4.1 family and gpt-4o snapshots. OpenAI is winding the platform down: new sign-ups have stopped,
  job creation ends in January 2027, and fine-tuned models serve until their base models are deprecated.'
comments: Openness was read from the OpenAI Services Agreement, since the service publishes no repository or
  license file.
