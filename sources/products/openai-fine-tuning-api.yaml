name: openai-fine-tuning-api
display_name: OpenAI Fine-Tuning API
type: software
description: 'The OpenAI Fine-Tuning API trains custom versions of OpenAI''s hosted models on OpenAI''s own
  infrastructure. Its documentation currently covers supervised fine-tuning and direct preference optimization
  on the gpt-4.1 family and vision fine-tuning on gpt-4o. Reinforcement fine-tuning of o4-mini was offered
  earlier, and those fine-tuned o4-mini models were shut down on October 23, 2026. OpenAI is winding the platform
  down: new sign-ups have stopped, existing customers can create new jobs until January 6, 2027, and fine-tuned
  models serve until their base models are deprecated.'
comments: Openness was read from the OpenAI Services Agreement, since the service publishes no repository or
  license file.
