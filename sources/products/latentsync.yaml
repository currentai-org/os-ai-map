name: latentsync
display_name: LatentSync
type: model
description: 'LatentSync is ByteDance''s audio-conditioned latent diffusion model for lip-sync: given a video of a face
  and a speech track, it regenerates the mouth region so the lips match the audio, supervised by a SyncNet model released
  with it. The current release, LatentSync 1.6, is trained on 512x512 video.'
github:
- url: https://github.com/bytedance/LatentSync
huggingface_model:
- url: https://huggingface.co/ByteDance/LatentSync-1.6
- url: https://huggingface.co/ByteDance/LatentSync-1.5
arxiv:
- url: https://arxiv.org/abs/2412.09262
comments: 'Lip-sync had no head product: LivePortrait animates a portrait from a driving video, while LatentSync edits
  an existing video to match new speech. The code is Apache-2.0; the Hub checkpoints carry only an openrail++ tag in
  their card metadata, with no license file.'
