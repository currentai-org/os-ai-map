name: segment-anything
display_name: Segment Anything (SAM)
type: model
description: Meta's promptable segmentation model line for images and video. SAM 3, the current generation,
  detects, segments and tracks every instance of a concept named by a short text phrase or shown by an example,
  as well as objects picked with points, boxes and masks; SAM 3.1 adds faster multi-object tracking. The earlier
  SAM and SAM 2 releases, Apache-licensed, segment from visual prompts only.
github:
- url: https://github.com/facebookresearch/sam3
huggingface_model:
- url: https://huggingface.co/facebook/sam3
- url: https://huggingface.co/facebook/sam3.1
