name: onnx-simplifier
display_name: ONNX Simplifier
type: software
description: ONNX Simplifier rewrites an ONNX graph into an equivalent, smaller one by folding constant subgraphs
  and removing the redundant operations exporters emit. It runs as a command-line tool or a Python call and ships
  npm and Rust bindings beside the Python package.
github:
- url: https://github.com/onnxsim/onnxsim
pypi:
- url: https://pypi.org/project/onnxsim/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
