name: ubertext
display_name: UberText
type: dataset
description: UberText 2.0 is a corpus of modern Ukrainian of about 3.27 billion tokens in 8.59 million texts,
  spanning news from 38 websites, fiction, public Telegram channels, the Ukrainian Wikipedia and Supreme Court
  decisions. It is offered for direct download in several processing layers, from cleaned text to sentence-split
  and tokenized files. Dmytro Chaplynskyi and the lang-uk community build it.
