name: memobase
display_name: Memobase
type: software
description: Memobase is a memory backend for chat applications that builds a structured profile and an event timeline
  for each user from buffered conversations, and returns them as context for the next prompt. Developers choose
  the profile topics it tracks. It runs as a self-hosted server on Postgres and Redis, with Python, TypeScript and
  Go clients and an MCP server, and is built by MemoDB.
