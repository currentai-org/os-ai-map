name: doubao
display_name: Doubao
type: software
description: ByteDance's consumer AI assistant, for questions, study help, and work tasks such as summarizing
  material, analyzing data, writing code and generating documents and presentations. It edits images from a
  spoken instruction and generates images and video, and takes voice input and photographs as well as text.
  A work-task mode runs multi-step jobs and scheduled tasks.
comments: doubao.com serves a client-rendered shell, so the record is described from ByteDance's own App Store
  listing rather than the website. Verified 2026-08-16 via Doubao's App Store listing.
