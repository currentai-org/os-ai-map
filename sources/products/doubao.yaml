name: doubao
display_name: Doubao
type: software
description: ByteDance's consumer AI chat app, on doubao.com and in iOS and Android apps, running on the Doubao
  model family via Volcano Engine. It handles text, image, audio and video natively and offers a full-duplex
  voice mode that streams recognition, reasoning and speech concurrently for interruptible conversation. It
  is distributed as a compiled client for desktop and mobile.
comments: ByteDance publishes no English product page beyond a download link, and doubao.com serves a client-rendered
  shell whose only text is the product name, so no primary document establishes the feature set. Held for a
  primary read. Verified 2026-08-13.
