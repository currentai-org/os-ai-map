name: doubao
display_name: Doubao
type: software
description: ByteDance's consumer AI chat app, on doubao.com and in iOS and Android apps, running on the Doubao
  model family via Volcano Engine. It handles text, image, audio and video natively and offers a full-duplex
  voice mode that streams recognition, reasoning and speech concurrently for interruptible conversation. Distribution
  is a compiled client with no source release.
comments: ByteDance publishes no English product page beyond a download link, so identity rests on a tertiary
  source. Verified 2026-08-13 via the Wikipedia article on Doubao and ByteDance's own desktop download page.
