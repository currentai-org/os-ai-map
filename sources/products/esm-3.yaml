name: esm-3
display_name: ESM-3
type: model
description: ESM-3 is a generative masked language model that reasons jointly over protein sequence, structure and function, each represented as a track of discrete tokens at both input and output. Prompted with partial inputs on any combination of tracks, it iteratively unmasks positions to design or complete a protein. The 1.4B esm3-sm-open-v1 checkpoint is the downloadable tier; the 7B and 98B models are served through the hosted platform API.
github:
- url: https://github.com/Biohub/esm
huggingface_model:
- url: https://huggingface.co/biohub/esm3-sm-open-v1
comments: The original EvolutionaryScale namespace now redirects to biohub, and the destination model card carries no license metadata field. The MIT grant comes from the card body and the repository LICENSE.md, under a Chan Zuckerberg Biohub copyright. Verified 2026-09-10 via the Hugging Face API, the model card, and the esm repository.
