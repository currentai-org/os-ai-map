name: orpheus-tts
display_name: Orpheus TTS
type: model
description: Canopy Labs' text-to-speech model built on a 3B Llama backbone, which generates speech as audio tokens the way
  a language model generates text. The finetuned English model offers eight voices, takes inline tags for laughs, sighs and
  other sounds, and streams with about 200 ms latency; the pretrained model, trained on more than 100,000 hours of English
  speech, clones a voice from example text and audio pairs. A research release adds models for other languages.
github:
- url: https://github.com/canopyai/Orpheus-TTS
huggingface_model:
- url: https://huggingface.co/canopylabs/orpheus-3b-0.1-ft
- url: https://huggingface.co/canopylabs/orpheus-3b-0.1-pretrained
