name: perplexity
display_name: Perplexity
type: software
description: Search-grounded consumer chat product that answers questions with cited sources. It routes over
  models from several providers including OpenAI, Anthropic and Meta, and adds guided deep research, a voice
  mode, and an assistant that drafts messages and makes bookings. It ships as a mobile app that syncs across
  devices, and is scored separately from the Perplexity API.
comments: perplexity.ai serves a client-rendered shell, so the consumer surface is described from Perplexity's
  own App Store listing rather than its website. Verified 2026-08-16 via Perplexity's App Store listing.
