name: perplexity
display_name: Perplexity
type: software
description: Search-grounded consumer chat product that answers questions from live web results with inline
  citations, available on the web and in mobile apps. It routes over models from several providers, and the
  consumer surface is scored separately from the Perplexity API.
comments: perplexity.ai serves a client-rendered shell whose only text is the product name, so no primary consumer-product
  document could be read; openness and capability rest on the API documentation, which covers a narrower surface
  than this record. Held for a primary read. Verified 2026-08-14.
