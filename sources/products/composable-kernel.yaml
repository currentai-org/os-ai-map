name: composable-kernel
display_name: Composable Kernel
type: software
description: Composable Kernel provides a programming model and template library for performance-critical machine
  learning kernels, decomposing GEMM, convolution and attention operations into tile-level pieces that recombine
  and fuse. It targets AMD GPUs through ROCm and includes a code generator for instance selection. AMD develops
  it in the ROCm/rocm-libraries monorepo, with the standalone ROCm/composable_kernel repository kept as a read-only
  mirror.
github:
- url: https://github.com/ROCm/rocm-libraries
- url: https://github.com/ROCm/composable_kernel
comments: The rocm-libraries repository holds many AMD libraries, so any figure read from it measures the whole
  monorepo unless it is scoped to the composable_kernel path.
