name: paligemma
display_name: PaliGemma
type: model
description: PaliGemma is Google's vision-language model built from the SigLIP vision encoder and Gemma language
  models, designed to be fine-tuned for specific tasks. PaliGemma 2 comes in 3B, 10B and 28B sizes at 224 to 896
  pixel resolution and outputs captions, answers, text read from images, bounding boxes and segmentation codes.
  Google releases pretrained, task-transfer and mixed-task checkpoints.
