name: sea-pile
display_name: SEA-PILE
type: dataset
description: SEA-PILE is AI Singapore's pretraining corpus for Southeast Asian languages. Its v2 release holds
  about 120 billion tokens of web text in Vietnamese, Indonesian, Tamil, Malay, Thai, Tagalog, Khmer, Lao and
  Burmese, extracted from 24 CommonCrawl snapshots, deduplicated per snapshot and filtered with heuristics
  and perplexity scoring developed with native speakers. The earlier v1 release is the cleaned mC4 portion
  of the data behind the first SEA-LION models.
huggingface_dataset:
- url: https://huggingface.co/datasets/aisingapore/SEA-PILE-v2
- url: https://huggingface.co/datasets/aisingapore/SEA-PILE-v1
arxiv:
- url: https://arxiv.org/abs/2504.05747
comments: The card for v2 says the public repository holds only the initial open release; the larger pool cited
  for later SEA-LION models is internal.
