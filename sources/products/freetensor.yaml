name: freetensor
display_name: FreeTensor
type: software
description: FreeTensor is a compiler and embedded Python DSL for writing and optimizing loop-based tensor programs, supporting
  dynamic tensor shapes, OpenMP and CUDA parallelization, explicit loop and memory-layout transformations, and reverse-mode
  automatic differentiation, compiling down to native code.
