name: federated-compute-platform
display_name: Federated Compute Platform
type: software
description: Google's libraries for running federated programs and computations in the cross-device setting. The
  repository holds the client-side code and the service and data-format definitions that run in production in Google's
  federated learning infrastructure, and a client for confidential federated computations that verifies TEE-hosted
  server applications by remote attestation. The production server is not published.
github:
- url: https://github.com/google-parfait/federated-compute
comments: At Google, the computations this code runs are written in TensorFlow Federated and compiled into
  deployable artifacts; TensorFlow Federated is its own record on the map.
