name: flores-plus
display_name: FLORES+
type: dataset
description: FLORES+ is a multilingual machine translation benchmark of sentences sampled from Wikinews, Wikijunior
  and Wikivoyage and translated from English into more than 200 language varieties, with dev and devtest splits
  aligned across every language. It continues Meta's FLORES-200, and a separate blind test set stays with Meta.
  The Open Language Data Initiative maintains it and accepts community fixes and new languages.
huggingface_dataset:
- url: https://huggingface.co/datasets/openlanguagedata/flores_plus
arxiv:
- url: https://arxiv.org/abs/2106.03193
