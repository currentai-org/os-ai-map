name: bpcc
display_name: Bharat Parallel Corpus Collection
type: dataset
description: The Bharat Parallel Corpus Collection (BPCC) is an English-Indic parallel text corpus of about
  230 million sentence pairs covering all 22 scheduled Indian languages. Most pairs are mined from the web
  or drawn from corpora such as Samanantar and NLLB, while BPCC-Human holds about 2.2 million human-translated
  pairs, including new Wikipedia and everyday-use sets. AI4Bharat released it to train IndicTrans2, together
  with back-translated data.
github:
- url: https://github.com/AI4Bharat/IndicTrans2
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/BPCC
arxiv:
- url: https://arxiv.org/abs/2305.16307
comments: The IN22 test sets released with BPCC live in their own repositories and are not scored here. The
  IndicTrans2 README says newer BPCC-Seed releases are published on the AI4Bharat website.
