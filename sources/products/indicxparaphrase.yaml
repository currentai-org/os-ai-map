description: IndicXParaphrase tests paraphrase detection in 10 Indian languages. AI4Bharat machine-translated 1,001
  English sentences with IndicTrans, had annotators check and correct every translation, and had them write one
  paraphrase and one non-paraphrase for each sentence, so the same sentences appear in every language. It is one
  of the new test sets in the IndicXTREME benchmark and is published on its own on the Hub.
