name: nemotron
display_name: Nemotron 3
type: model
aliases:
- nemotron-3
description: Nemotron 3 is NVIDIA's open-weight family of instruction-tuned models for agentic reasoning, post-trained
  with supervised fine-tuning and reinforcement learning on Nemotron base models. It spans Nano (30B total,
  3B active), Super (120B total, 12B active) and Ultra (550B total, 55B active) mixture-of-experts models,
  with a 1M-token context window on Super and Ultra. NVIDIA publishes training data and recipes with the weights,
  and the line is its reference for NeMo and NIM, tuned for NVIDIA hardware.
huggingface_model:
- url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
- url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
- url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
comments: The declared BF16 checkpoints are the reference; the NVFP4, FP8 and GGUF builds are the same weights
  repackaged.
