name: memoryos
display_name: MemoryOS
type: software
description: MemoryOS manages a personalized agent's memory the way an operating system manages storage, moving
  dialogue from a short-term queue into mid-term topic segments and promoting often revisited segments into a long-term
  user profile and knowledge base. It ships as a Python library, an MCP server, a ChromaDB variant and a playground.
  BAI-LAB at the Beijing University of Posts and Telecommunications builds it.
comments: The memoryos package on PyPI is MemTensor's MemOS, a different project; this entry declares memoryos-pro,
  the name the README installs.
github:
- url: https://github.com/BAI-LAB/MemoryOS
