name: flashinfer
display_name: FlashInfer
type: software
description: FlashInfer is a kernel library and generator for LLM inference, exposing unified APIs for attention,
  GEMM and mixture-of-experts operations over several backend implementations including FlashAttention-2 and -3,
  cuDNN, CUTLASS and TensorRT-LLM. Kernels are compiled just in time for the shapes a workload actually uses.
github:
- url: https://github.com/flashinfer-ai/flashinfer
pypi:
- url: https://pypi.org/project/flashinfer-python/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
