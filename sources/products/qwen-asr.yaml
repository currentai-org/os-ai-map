name: qwen-asr
display_name: Qwen3-ASR
type: model
description: Alibaba's Qwen3-ASR speech recognition models (1.7B and 0.6B), built on the Qwen3 audio stack. They
  identify the language and transcribe 30 languages and 22 Chinese dialects, and a companion forced-alignment model
  predicts timestamps.
github:
- url: https://github.com/QwenLM/Qwen3-ASR
pypi:
- url: https://pypi.org/project/qwen-asr/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/Qwen/Qwen3-ASR-1.7B
- url: https://huggingface.co/Qwen/Qwen3-ASR-0.6B
