name: flash-sparse-attention
display_name: Flash Sparse Attention
type: software
description: Flash-Sparse-Attention is a trainable sparse attention kernel library from HKUST(GZ)'s Data Intelligence and
  Analytics Lab, combining Flash Attention's memory efficiency with sparse and gated attention for long-sequence Transformer
  training and inference, including grouped-query attention, paged attention and fused-quant low-precision computation.
