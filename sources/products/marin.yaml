name: marin
display_name: Marin
type: model
description: Marin is a fully open foundation-model line (Marin 8B Base and Instruct, Marin 32B Base) trained
  in JAX with the Levanter framework, with bit-for-bit reproducible training. Code, data mixtures, experiments,
  hyperparameters and training logs are published alongside the weights, and every experiment is tracked as
  a public GitHub issue. The project originated at Stanford's Center for Research on Foundation Models.
github:
- url: https://github.com/marin-community/marin
