name: marin
display_name: Marin
type: model
description: Stanford CRFM's Marin, a fully-open 'open lab' foundation model (Marin 8B Base/Instruct and
  32B Base), built in JAX/Levanter with bit-for-bit reproducibility. Code, data, experiments, hyperparameters
  and training logs are all documented and released.
github:
- url: https://github.com/marin-community/marin
huggingface_model:
- url: https://huggingface.co/marin-community/marin-8b-base
- url: https://huggingface.co/marin-community/marin-8b-instruct
comments: ~12.7T-token training run with full data/code/logs and bit-reproducible training. Fully open
  but below OLMo 3 on fully-open evals; modest adoption. The distinguishing move is procedural rather
  than about the artifacts - every experiment is tracked as a public GitHub issue, so the record of how
  the model was reached is open as well as the recipe. Verified 2026-08-13 via the Marin announcement
  post, the marin-8b-base HF model card and the marin-community/marin repository.
