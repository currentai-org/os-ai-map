name: gaia
display_name: GAIA (General AI Assistants)
type: dataset
description: 'GAIA is a benchmark for general AI assistants: 466 real-world questions across three difficulty
  levels that require reasoning, multimodality, web browsing and tool use. Answers to 300 of them are withheld
  to power a submission-scored leaderboard, leaving a fully public development split.'
huggingface_dataset:
- url: https://huggingface.co/datasets/gaia-benchmark/GAIA
arxiv:
- url: https://arxiv.org/abs/2311.12983
