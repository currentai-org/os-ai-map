name: trustmark
display_name: TrustMark
type: software
description: 'TrustMark is Adobe''s open-source image watermarking method for the Content Authenticity Initiative:
  it hides an identifier in an image of any resolution that survives resharing, screenshots and JPEG compression,
  and decodes or removes it again. The identifier can point to a C2PA manifest kept elsewhere, and the method
  is on the C2PA list of approved watermarks. Implementations exist in Python, JavaScript and Rust.'
comments: 'Tagged self-attested: anyone can decode the mark with the open decoder, but the mark carries an
  identifier, not a signature.'
github:
- url: https://github.com/adobe/trustmark
pypi:
- url: https://pypi.org/project/trustmark/
