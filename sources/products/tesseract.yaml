name: tesseract
display_name: Tesseract OCR
type: software
description: Long-standing open-source OCR engine, originally developed at HP and maintained since 2006 with
  Google's support. It recognises text in over a hundred languages with an LSTM-based engine, and outputs plain
  text, hOCR, ALTO, TSV and PDF. It remains the default OCR dependency for a large amount of other software
  rather than a document-conversion product in its own right.
github:
- url: https://github.com/tesseract-ocr/tesseract
comments: No package channel this map routes - it is distributed as source and distribution packages, and the
  popular pytesseract PyPI package is a third-party wrapper rather than the product - so adoption is read from
  stars.
