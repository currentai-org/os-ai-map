name: public-ai-inference-utility
display_name: Public AI Inference Utility
type: software
description: The Public AI Inference Utility is a nonprofit hosted inference service that gives developers an OpenAI-compatible
  API to open models from public institutions, among them Switzerland's Apertus, AI Singapore's SEA-LION and Poland's
  Bielik. A gateway routes each request to vLLM servers running on compute donated by partners such as AWS, Exoscale
  and the Jülich Supercomputing Centre. The same models are offered through Hugging Face as an inference provider,
  and the developer portal and gateway code are published under the MIT license.
github:
- url: https://github.com/forpublicai/platform.publicai.co
  not_primary_channel: The developer portal and API gateway, not the hosted service the product is. Its star count
    measures attention to the gateway code rather than use of the service, so adoption rests on reported traction.
