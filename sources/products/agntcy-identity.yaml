name: agntcy-identity
display_name: AGNTCY Identity
type: software
description: AGNTCY Identity issues and verifies identities for AI agents, MCP servers and multi-agent systems.
  Each gets a unique identifier, generated as a W3C decentralized identifier or brought from an identity provider
  such as Okta or an A2A agent card, plus signed badges holding verifiable credentials. An issuer CLI and a node
  backend ship together. It is part of AGNTCY, a Linux Foundation project.
github:
- url: https://github.com/agntcy/identity
pypi:
- url: https://pypi.org/project/agntcy-identity-sdk
