name: featherless
display_name: Featherless
type: software
description: Featherless is a serverless inference service that runs open-weight models, many of them drawn from
  Hugging Face, behind a single API. Its library runs to tens of thousands of models, including community fine-tunes
  for role-play, creative writing and individual languages. Plans are flat monthly subscriptions with unlimited
  tokens rather than per-token billing. The company, formerly Recursal.AI, was founded by co-leads of the RWKV model
  architecture project.
