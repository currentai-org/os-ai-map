description: 'InjongoIntent is an intent-detection test in 16 African languages: each item is a request such as freezing
  a bank account or playing music, to be sorted into one of forty intents. Native speakers wrote the requests in their
  own languages rather than translating them from English. Masakhane publishes it with its own paper, and AfroBench runs
  it as its intent task.'
