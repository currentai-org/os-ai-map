name: liger-kernel
display_name: Liger Kernel
type: software
description: Liger Kernel is a set of Triton kernels for large language model training, replacing fused operations
  such as RMSNorm, RoPE, SwiGLU and cross-entropy, and adding memory-efficient post-training loss functions for
  DPO and ORPO. It patches into Hugging Face model classes so existing training scripts pick it up without restructuring.
  LinkedIn develops it.
