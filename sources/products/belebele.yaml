description: Belebele is a multiple-choice reading comprehension benchmark in 122 language variants, with 900
  questions per variant written about short FLORES-200 passages. Every question has four answers, one correct,
  and the set is fully parallel so scores compare directly across languages. Annotators wrote the questions
  in English under quality checks before translation. Meta FAIR released it.
