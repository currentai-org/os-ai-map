name: duck-ai
display_name: Duck.ai
type: software
description: DuckDuckGo's anonymous AI chat surface, on the web and inside the DuckDuckGo browser, letting
  users chat with third-party models without an account. It strips personal metadata including the IP address
  before prompting a provider, and conversations are not used for training. The proxy sits in front of model
  APIs DuckDuckGo does not operate.
comments: The available models change by tier and are listed on a separate help page rather than here, because
  the list is volatile. Verified 2026-08-13 via DuckDuckGo's Duck.ai privacy help page and its chat-models
  help page.
