name: pytorch-hub
display_name: PyTorch Hub
type: software
description: Index of pretrained PyTorch models at pytorch.org/hub. A publisher adds
  a hubconf.py to its own GitHub repository and opens a pull request to pytorch/hub
  with a model page; once merged, the model is listed on the site and torch.hub.load
  fetches the code from the publisher's repository and the weights from wherever the
  publisher hosts them. The hub stores no weights itself. The PyTorch Foundation maintains
  the index, and the loader ships inside PyTorch.
comments: The submission repository has had no push since April 2024 and the site
  still calls the hub a beta release. The repository carries no license grant, so
  its pages can be read but not freely reused; the torch.hub loader is part of pytorch
  and is licensed with it.
github:
- url: https://github.com/pytorch/hub
