description: OSCAR-2301 is a multilingual web corpus extracted from the November/December 2022 Common Crawl
  snapshot and distributed by language in original and deduplicated versions, covering 151 languages. Its documents
  carry KenLM-based adult content detection and precomputed locality-sensitive hashes for near deduplication.
