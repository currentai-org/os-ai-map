name: openinference
display_name: Openinference
type: software
description: OpenTelemetry Instrumentation for AI Observability. OpenInference is a set of conventions and plugins
  that is complimentary to OpenTelemetry to enable tracing of AI applications. OpenInference is natively supported
  by Arize Phoenix and Arize AX, but can be used with any OpenTelemetry-compatible backend as well.
github:
- url: https://github.com/Arize-ai/openinference
