name: supervision
display_name: supervision
type: software
description: Roboflow's model-agnostic toolkit for working with computer-vision results. It converts detections
  and segmentations from Ultralytics, Transformers, MMDetection, Roboflow Inference and other libraries into
  one format, then draws annotations, filters and tracks detections, counts objects in zones, slices large
  images for inference, loads and converts datasets and computes metrics.
github:
- url: https://github.com/roboflow/supervision
pypi:
- url: https://pypi.org/project/supervision
