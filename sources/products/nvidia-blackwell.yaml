name: nvidia-blackwell
display_name: NVIDIA Blackwell (B200/B300, GB200/GB300 NVL72)
type: hardware
description: NVIDIA Blackwell is a datacenter GPU generation for training and serving AI models, built from two
  reticle-sized dies in one package with HBM3E memory and fifth-generation NVLink. It ships as B200 and the Blackwell
  Ultra B300 in eight-GPU HGX servers, and paired with Grace CPUs in the liquid-cooled GB200 and GB300 NVL72 racks
  that join 72 GPUs in one NVLink domain.
