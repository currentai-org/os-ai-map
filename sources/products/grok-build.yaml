name: grok-build
display_name: Grok Build
type: software
description: Grok Build is a terminal coding agent that edits files, runs shell commands and searches the web from
  a full-screen TUI, headless scripts, or editors over the Agent Client Protocol. It adds parallel subagents, plan
  mode, an opt-in OS-level sandbox, MCP, skills, plugins and hooks, and can run other providers' models beside its
  default Grok models. SpaceXAI develops it internally and publishes the source as a periodically synced mirror.
comments: Read against xai-org/grok-build, whose README and LICENSE name SpaceXAI while the docs, installer and API
  sit on x.ai, so the entry stays under xAI. The npm package is named in the vendor's enterprise docs rather than
  the README.
github:
- url: https://github.com/xai-org/grok-build
npm:
- url: https://www.npmjs.com/package/@xai-official/grok
