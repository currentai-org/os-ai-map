description: An Obsidian plugin that embeds Claude Code/Codex as an AI collaborator in your vault. An Obsidian plugin
  that embeds AI coding agents (Claude Code, Codex, Grok, Opencode, Pi, and more to come) in your vault. Your vault
  becomes the agent's working directory — file read/write, search, bash, and multi-step workflows all work out of
  the box. Visit claudian.md to learn more.
