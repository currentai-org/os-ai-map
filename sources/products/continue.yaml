name: continue
display_name: Continue
type: software
description: Open-source AI code assistant for VS Code and JetBrains, offering inline completion, chat, edit
  and agent modes against any model backend including OpenAI, Anthropic, Gemini, Ollama and vLLM. It differs
  from Copilot in being model-agnostic and self-hostable, and from Cursor in living inside an existing IDE.
  Cursor acquired the project, and the open-source codebase remains available.
github:
- url: https://github.com/continuedev/continue
comments: The repository ships an enterprise license key gating managed device policy; the rest of the tree
  is open. Verified 2026-08-13 via the continuedev/continue repository, the VS Code Marketplace listing and
  continue.dev.
