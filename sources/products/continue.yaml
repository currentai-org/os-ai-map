name: continue
display_name: Continue
type: software
description: AI code assistant for VS Code and JetBrains, offering inline completion, chat, edit and agent
  modes against any model backend including OpenAI, Anthropic, Gemini, Ollama and vLLM. It differs from Copilot
  in being model-agnostic and from Cursor in living inside an existing IDE rather than replacing it. Cursor
  acquired the project in 2026.
github:
- url: https://github.com/continuedev/continue
comments: The repository ships an enterprise key gating managed device policy, which the openness axis weighs.
  Verified 2026-08-13 via the continuedev/continue repository, the VS Code Marketplace listing and continue.dev.
