name: dolma
display_name: Dolma
type: dataset
description: Dolma is an open pretraining corpus of roughly 3 trillion tokens drawn from Common Crawl
  web text, academic publications, code, books, and encyclopedic material. It was created by the Allen
  Institute for AI (AI2) and used to train the OLMo family of models. The release includes the corpus
  plus an open source toolkit for replicating and curating the data.
github:
- url: https://github.com/allenai/dolma
huggingface_dataset:
- url: https://huggingface.co/datasets/allenai/dolma
lineage:
  derived_from:
  - Common Crawl
  - pes2o
  - Project Gutenberg
  - Wikipedia
  curated_with:
  - Dolma toolkit
  trains:
  - OLMo 1/2
  - olmoe-instruct
  - marin
  - rwkv
comments: Verified live 2026-06-22 via primary sources. Permissively licensed (ODC-BY), ungated download
  with a full dataset card and replication toolkit.
