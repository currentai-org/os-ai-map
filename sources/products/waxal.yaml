name: waxal
display_name: WAXAL
type: dataset
description: 'WAXAL is a speech corpus for Sub-Saharan African languages in two parts: about 1,250 hours of
  transcribed natural speech for speech recognition in 19 languages, and single-speaker recordings of phonetically
  balanced scripts for text-to-speech in 17 languages. Partners including Makerere University, the University
  of Ghana and Digital Umuganda collected the audio. Google Research publishes it.'
huggingface_dataset:
- url: https://huggingface.co/datasets/google/WaxalNLP
arxiv:
- url: https://arxiv.org/abs/2602.02734
