name: mathpix
display_name: Mathpix
type: software
description: Document-conversion service specialising in scientific and mathematical content. It converts PDFs,
  images and handwriting into LaTeX, Markdown, DOCX and HTML, and is the reference tool for documents whose
  value is in the equations rather than the prose.
