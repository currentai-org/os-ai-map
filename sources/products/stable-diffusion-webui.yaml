name: stable-diffusion-webui
display_name: Stable Diffusion web UI (AUTOMATIC1111)
type: software
description: Stable Diffusion web UI is a browser interface for generating and editing images with Stable Diffusion
  models, built on the Gradio library and known by its author's handle, AUTOMATIC1111. It covers text-to-image and
  image-to-image, inpainting and outpainting, LoRA and embedding loading, checkpoint merging and upscaling, and
  is extended through a large ecosystem of third-party extensions.
github:
- url: https://github.com/AUTOMATIC1111/stable-diffusion-webui
comments: The repository is not archived, but its last release predates the newer image families that forks and
  successors such as Forge support.
