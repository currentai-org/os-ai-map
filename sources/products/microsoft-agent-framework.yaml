name: microsoft-agent-framework
display_name: Microsoft Agent Framework
type: software
description: Microsoft Agent Framework is a framework for building AI agents and multi-agent workflows
  in Python and .NET, with a Go version in a separate repository. Its workflows are graphs that run agents
  in sequence, concurrently, by handoff or as a group, with checkpointing, streaming, human-in-the-loop
  steps and time-travel. Middleware, OpenTelemetry tracing, agents declared in YAML and a developer UI
  come with it, and it works with Microsoft Foundry, Azure OpenAI, OpenAI and other providers.
github:
- url: https://github.com/microsoft/agent-framework
pypi:
- url: https://pypi.org/project/agent-framework-core/
comments: The agent-framework package the README installs is a bundle whose only requirement is agent-framework-core,
  so the core package is the one declared and counted.
