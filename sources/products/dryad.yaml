name: dryad
display_name: Dryad
type: software
description: Dryad is a non-profit repository for research data from all fields, where every submitted dataset is
  checked by Dryad's curators before it is published. Published datasets carry DataCite metadata and a DOI, keep
  their versions, and can be listed and downloaded through a REST API. Publishing carries a charge unless an institution,
  journal or funder sponsors it, and downloads are free.
github:
