name: open-sora
display_name: Open-Sora
type: model
description: Open-Sora is HPC-AI Tech's open video-generation model family. The current release, Open-Sora 2.0, is an
  11B-parameter model for text-to-video and image-to-video at up to 768px, trained for about USD 200K with the checkpoints
  and training code both published. Text-to-video runs as a text-to-image-to-video pipeline that uses FLUX.1 [dev] for
  the first frame.
github:
- url: https://github.com/hpcaitech/Open-Sora
huggingface_model:
- url: https://huggingface.co/hpcai-tech/Open-Sora-v2
- url: https://huggingface.co/hpcai-tech/OpenSora-STDiT-v3
- url: https://huggingface.co/hpcai-tech/OpenSora-VAE-v1.2
arxiv:
- url: https://arxiv.org/abs/2503.09642
- url: https://arxiv.org/abs/2412.20404
comments: 'Gap fill: the video models here are either closed or ship weights with at most inference or fine-tuning code;
  Open-Sora is the one video line that publishes its Apache-2.0 checkpoints together with the pretraining code. The training
  data itself is not released. Adoption is thin (under 4K Hub downloads a month across the family) despite 29.8K GitHub
  stars. The Open-Sora-v2 repository also redistributes the FLUX.1 [dev] and HunyuanVideo VAE weights its pipeline uses,
  under their own licenses. HPC-AI Tech''s hosted Video Ocean product says it runs on "a superior model"; no newer Open-Sora
  release is named, so 2.0 is taken as current.'
