name: genesis
display_name: Genesis
type: software
description: Genesis is a simulation platform for robotics and embodied AI that combines a multi-physics engine
  (rigid bodies, cloth, fluids, coupled solvers), its own photorealistic renderer Nyx alongside a ray tracer, and
  the Quadrants compiler, which lowers Python kernels to CUDA, ROCm, Metal, Vulkan and CPU. It runs many heterogeneous
  environments in parallel and is developed by Genesis-Embodied-AI.
