name: mcp-java-sdk
display_name: MCP Java SDK
type: software
description: The official Java SDK for the Model Context Protocol, maintained in collaboration with Spring
  AI. Synchronous and asynchronous client and server over stdio, Server-Sent Events and Streamable HTTP, validated
  against the MCP conformance suite.
github:
- url: https://github.com/modelcontextprotocol/java-sdk
comments: Maven Central publishes no download counts and the legacy Solr index returns nothing for this group,
  so adoption bands on stars. Unlike its siblings this repository carries a plain MIT licence rather than the
  project's dual transition file.
