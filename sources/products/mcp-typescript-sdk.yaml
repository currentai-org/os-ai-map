name: mcp-typescript-sdk
display_name: MCP TypeScript SDK
type: software
description: Official TypeScript SDK for the Model Context Protocol, running on Node.js, Bun and Deno. It publishes
  separate server and client packages covering tools, resources and prompts, Streamable HTTP and stdio transports
  and auth helpers, plus thin middleware packages for Express, Fastify, Hono and Node.js HTTP.
