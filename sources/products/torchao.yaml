name: torchao
display_name: TorchAO
type: software
description: TorchAO is PyTorch's native architecture-optimization library, applying quantization and sparsity to
  models for both training and serving. It covers float8 and MX-format training, quantization-aware training, and
  int4 and int8 post-training quantization with dtype extensions that compose with torch.compile.
