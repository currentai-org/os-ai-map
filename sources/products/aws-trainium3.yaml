name: aws-trainium3
display_name: AWS Trainium3
type: hardware
description: AWS Trainium3 is Amazon Web Services' fourth-generation AI chip and its first on a 3 nm process, built
  for training and serving large models. Each device carries 144 GiB of HBM, and up to 144 devices join over NeuronLink
  in a Trn3 UltraServer. It is available only as EC2 Trn3 capacity, programmed through the Neuron SDK.
