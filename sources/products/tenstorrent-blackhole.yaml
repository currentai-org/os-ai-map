name: tenstorrent-blackhole
display_name: Tenstorrent Blackhole
type: hardware
description: Tenstorrent Blackhole is an AI processor combining a grid of Tensix compute cores with 16 general-purpose
  RISC-V cores and 32 GB of GDDR6, with Ethernet links for joining chips into larger meshes. It ships as the p100
  and p150 PCIe cards, sold from Tenstorrent's own store and programmed through its open-source software stack.
