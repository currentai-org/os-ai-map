name: presidio
display_name: Presidio
type: software
description: Presidio finds and removes personal information such as names, phone numbers, credit card numbers and locations
  in text, images and structured data. It combines named-entity recognition, regular expressions, checksums and context rules
  with optional outside models, and can redact, mask, replace or encrypt what it finds. Microsoft created it, and the community
  organization Data Privacy Stack now maintains it.
github:
- url: https://github.com/data-privacy-stack/presidio
pypi:
- url: https://pypi.org/project/presidio-analyzer/
