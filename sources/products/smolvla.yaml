name: smolvla
display_name: SmolVLA
type: model
description: SmolVLA is Hugging Face's compact vision-language-action model, about 450 million parameters, trained
  on community-collected datasets from affordable robot arms. It takes multi-view images, robot state and an optional
  instruction and outputs continuous action chunks by flow matching, trains on a single GPU, and runs on consumer
  GPUs or CPUs through the LeRobot library.
huggingface_model:
- url: https://huggingface.co/lerobot/smolvla_base
arxiv:
- url: https://arxiv.org/abs/2506.01844
