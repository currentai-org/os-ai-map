name: milu
display_name: MILU
type: dataset
description: MILU (Multi-task Indic Language Understanding Benchmark) is an evaluation set of about 80,000
  multiple-choice questions in 10 Indic languages and English, spanning 8 domains and 41 subjects. Its questions
  come largely from regional and state examinations, about a quarter of them translated, and cover India-specific
  topics such as local history, arts and law. AI4Bharat publishes it with an lm-evaluation-harness setup for
  running it.
