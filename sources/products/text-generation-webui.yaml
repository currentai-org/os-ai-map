name: text-generation-webui
display_name: TextGen (text-generation-webui)
type: software
description: TextGen is a local application for running large language models, usable as a desktop window or a browser
  interface. It loads models through llama.cpp, ik_llama.cpp, Transformers, ExLlamaV3 and TensorRT-LLM, serves OpenAI-
  and Anthropic-compatible endpoints with tool calling and MCP servers, and adds LoRA training and a diffusers image-generation
  tab. The project, by the developer oobabooga, was long known as text-generation-webui.
github:
- url: https://github.com/oobabooga/textgen
comments: The repository was renamed from oobabooga/text-generation-webui to oobabooga/textgen; the slug keeps the older
  name.
