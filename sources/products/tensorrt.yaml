name: tensorrt
display_name: TensorRT
type: software
description: 'TensorRT is NVIDIA''s SDK for compiling trained networks into optimized inference engines for NVIDIA
  GPUs, applying layer fusion, kernel selection and explicit quantization. This repository holds the open-source
  components: the ONNX parser, the plugin library, the Python bindings and samples. The optimizing builder itself
  ships as a prebuilt binary release that the repository links against.'
