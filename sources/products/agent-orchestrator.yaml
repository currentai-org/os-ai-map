description: Agent IDE that enables you to manage fleets of coding agents. It comes with an agentic orchestrator
  that plans tasks, spawns agents, and autonomously handles CI fixes, merge conflicts, and code reviews. Give every
  coding task its own agent, workspace, and feedback loop. Plan and delegate larger outcomes with a project-aware
  orchestrator. Follow every worker, pull request, CI run, and review in a live Kanban.
