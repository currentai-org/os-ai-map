name: l3cube-mahacorpus
display_name: L3Cube-MahaCorpus
type: dataset
description: L3Cube-MahaCorpus is a Marathi monolingual text corpus of 24.8 million sentences and 289 million
  tokens scraped from news and other websites. Combined with existing sources it forms a 752-million-token
  Marathi corpus, on which L3Cube Pune trained its MahaBERT, MahaAlBERT and MahaRoBERTa models and MahaFT word
  embeddings. Both versions are Google Drive downloads linked from the MarathiNLP repository.
github:
- url: https://github.com/l3cube-pune/MarathiNLP
arxiv:
- url: https://arxiv.org/abs/2202.01159
