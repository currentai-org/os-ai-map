name: kencorpus
display_name: Kencorpus
type: dataset
description: 'Kencorpus is a text and speech corpus for Swahili, Dholuo and Luhya (Lumarachi, Logooli and Lubukusu),
  gathered from communities, schools, media and publishers: 4,442 texts of about 5.6 million words and 177
  hours of spontaneous speech. Companion sets add part-of-speech tags, Swahili question answering, translation
  into Swahili and a Swahili speech recognition set. The Kencorpus project publishes it.'
huggingface_dataset:
- url: https://huggingface.co/datasets/Kencorpus/KenCorpus_text
- url: https://huggingface.co/datasets/Kencorpus/KenCorpus_audio
- url: https://huggingface.co/datasets/Kencorpus/KenSpeech
- url: https://huggingface.co/datasets/Kencorpus/KenTrans
- url: https://huggingface.co/datasets/Kencorpus/KenPOS
- url: https://huggingface.co/datasets/Kencorpus/KenSwQuAD
