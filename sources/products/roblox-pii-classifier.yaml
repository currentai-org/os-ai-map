name: roblox-pii-classifier
display_name: Roblox PII Classifier
type: model
description: Roblox PII Classifier flags chat messages that ask for or share personal information, such as phone numbers,
  social media handles and credentials, and messages that try to move a user to another platform. Version 2 reads each message
  together with the surrounding multi-user conversation, which helps it catch bypass attempts like phonetic spelling and implicit
  references. Roblox built it by fine-tuning the 560M-parameter XLM-RoBERTa-Large encoder for its own chat moderation.
huggingface_model:
- url: https://huggingface.co/Roblox/roblox-pii-classifier-v2
- url: https://huggingface.co/Roblox/roblox-pii-classifier
comments: A ROOST Model Community partner model. Version 1 stays on Hugging Face as its own repository and is counted here
  as an earlier release of the same product.
