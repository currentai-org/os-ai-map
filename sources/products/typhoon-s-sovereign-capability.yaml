name: typhoon-s-sovereign-capability
display_name: Typhoon-S sovereign capability dataset
type: dataset
description: The Typhoon-S sovereign capability dataset holds the Thai training and test files behind the region-specific
  part of the Typhoon-S post-training study. Legal-domain files derive from NitiBench and WangchanX-Legal-ThaiCCL-RAG,
  split into reinforcement-learning, pretraining, supervised and agent sets, and general-domain files derive
  from MIRAGE. The release totals about 30,000 rows in Thai and English and comes from the Typhoon team.
huggingface_dataset:
- url: https://huggingface.co/datasets/typhoon-ai/typhoon-s-sovereign-capability-dataset
arxiv:
- url: https://arxiv.org/abs/2601.18129
