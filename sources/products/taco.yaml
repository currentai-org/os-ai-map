name: taco
display_name: TACO
type: software
description: TACO (the Tensor Algebra Compiler) is a C++ library and code generator, developed at MIT CSAIL and Adobe, that
  compiles sparse and dense tensor algebra expressions into native code competitive with hand-optimized kernels, using novel
  sparse iteration-space compiler techniques.
