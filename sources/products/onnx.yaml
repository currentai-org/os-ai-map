name: onnx
display_name: ONNX
type: software
description: ONNX (Open Neural Network Exchange) is an open standard format and specification for representing
  machine learning models, defining an extensible computation graph model plus built-in operators and
  standard data types. It enables interoperability so models can move between frameworks like PyTorch,
  TensorFlow, and scikit-learn. It is governed under the Linux Foundation as part of LF AI & Data.
github:
- url: https://github.com/onnx/onnx
pypi:
- url: https://pypi.org/project/onnx/
comments: Verified live 2026-06-22 via primary sources. Apache-2.0 license body confirmed; full source
  public on GitHub.
