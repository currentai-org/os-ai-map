name: onnx
display_name: ONNX
type: software
description: ONNX (Open Neural Network Exchange) is an open standard format and specification for representing
  machine learning models, defining an extensible computation graph model plus built-in operators and standard
  data types. It enables interoperability so models can move between frameworks, tools, runtimes and compilers.
  It is governed under the Linux Foundation as part of LF AI & Data.
github:
- url: https://github.com/onnx/onnx
