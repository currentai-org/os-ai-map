name: chai
display_name: Chai
type: model
description: Chai-1 is Chai Discovery's multi-modal model for molecular structure prediction, giving unified predictions over proteins, small molecules, DNA, RNA, glycosylations and modified residues. It runs from a FASTA file with optional MSAs and templates, and uniquely accepts user-specified experimental restraints, inter-chain contacts and covalent bonds at several resolutions, to guide the folding of a complex.
github:
