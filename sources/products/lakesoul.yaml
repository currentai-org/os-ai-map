name: lakesoul
display_name: LakeSoul
type: software
description: LakeSoul is a cloud-native lakehouse table format and storage framework with a Rust-native metadata
  and file-IO core, ACID transactions, upsert semantics, schema evolution, automated compaction and fine-grained
  access control, shared identically across Spark, Flink, Presto, Ray, Daft and PyArrow bindings. Its Vortex file
  format can store multimodal data and vector embeddings alongside tabular data.
