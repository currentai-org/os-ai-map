name: luciole
display_name: Luciole
type: model
description: Luciole is Linagora and OpenLLM-France's fully open French-English model family and the successor
  to Lucie, released at 1B, 8B and 23B in base and instruct forms. The weights ship with a 4.65-trillion-token
  training dataset drawn from openly licensed corpora, the training pipeline and training checkpoints. Base
  models are pretrained on about 5 trillion tokens, roughly 42 percent English and 30 percent French alongside
  six other languages.
