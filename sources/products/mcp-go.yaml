name: mcp-go
display_name: MCP Go
type: software
description: MCP Go is a Go implementation of the Model Context Protocol, letting developers build servers
  and clients that expose resources, tools and prompts to LLM applications. It handles protocol compliance
  and message routing, supports stdio, SSE and streamable HTTP transports plus OAuth-protected resources, and
  implements an earlier revision of the Model Context Protocol specification, with backward compatibility to
  an even earlier revision. Maintained by Mark III Labs.
github:
