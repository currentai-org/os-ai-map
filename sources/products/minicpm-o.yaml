name: minicpm-o
display_name: MiniCPM-o
type: model
description: MiniCPM-o is OpenBMB's omni-modal model line for live, full-duplex interaction on phones and other
  devices. MiniCPM-o 4.5, a 9B model built from SigLIP2, Whisper-medium, CosyVoice2 and Qwen3-8B, watches video
  and listens to audio at the same time as it answers in text and speech, and can clone a voice from a short reference
  clip. It shares a repository with MiniCPM-V.
