name: chatterbox
display_name: Chatterbox
type: model
description: 'Resemble AI''s open text-to-speech family: zero-shot voice cloning with an emotion-exaggeration control,
  the original English model, Turbo and Nano variants, and Chatterbox Multilingual V3 across 23 languages. Every
  output carries Resemble''s Perth watermark.'
github:
- url: https://github.com/resemble-ai/chatterbox
pypi:
- url: https://pypi.org/project/chatterbox-tts/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/ResembleAI/chatterbox
comments: Code and weights are MIT. Resemble's hosted Chatterbox HD is a separate, closed product.
