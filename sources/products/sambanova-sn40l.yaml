name: sambanova-sn40l
display_name: SambaNova SN40L RDU
type: hardware
description: SambaNova SN40L is a reconfigurable dataflow unit (RDU) for inference that maps a model's operations
  onto the chip as a dataflow graph rather than running kernels one at a time. It uses a three-tier memory of on-chip
  SRAM, 64 GB of HBM2E and up to 512 GB of DDR5 to hold many models at once, and ships in SambaRack systems.
