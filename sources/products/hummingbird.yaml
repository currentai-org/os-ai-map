name: hummingbird
display_name: Hummingbird
type: software
description: Hummingbird compiles trained traditional machine learning models - decision-tree ensembles, linear
  models and featurizers from scikit-learn, LightGBM and XGBoost - into tensor computations, so they execute on
  the same neural-network runtimes and hardware as deep models. Microsoft develops it.
