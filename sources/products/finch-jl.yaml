name: finch-jl
display_name: Finch.jl
type: software
description: Finch.jl is a Julia-to-Julia compiler for sparse and structured multidimensional arrays. It lets users write
  high-level array programs that Finch transforms behind the scenes into fused, customized sparse kernels, generalizing
  sparse tensor compiler techniques to a wider range of array formats.
