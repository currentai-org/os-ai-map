name: latxa-corpus
display_name: Latxa Corpus
type: dataset
description: Latxa Corpus is a deduplicated monolingual Basque collection for language model pretraining, combining
  the EusCrawl web crawl, official gazettes, Basque Parliament transcripts, academic journals, Wikipedia and
  the Basque portions of CulturaX, HPLT, FineWeb2 and Colossal OSCAR. The version behind the first Latxa models
  held 4.2 billion tokens in 4.3 million documents. HiTZ and the IXA group at the University of the Basque
  Country build it.
github:
- url: https://github.com/hitz-zentroa/latxa
huggingface_dataset:
- url: https://huggingface.co/datasets/HiTZ/latxa-corpus-v2
- url: https://huggingface.co/datasets/HiTZ/latxa-corpus-v1.1
arxiv:
- url: https://arxiv.org/abs/2403.20266
comments: The entry covers both published versions, v1.1 and v2, as one product line.
