name: arm-compute-library
display_name: Arm Compute Library
type: software
description: Arm Compute Library is a collection of low-level machine learning and computer vision functions optimized
  for Arm Cortex-A and Neoverse CPUs and Mali GPUs, using NEON and OpenCL. Frameworks and runtimes link it as their
  Arm kernel backend. Arm develops and releases it with prebuilt binaries alongside the source.
github:
- url: https://github.com/ARM-software/ComputeLibrary
