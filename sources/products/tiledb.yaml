name: tiledb
display_name: TileDB
type: software
description: TileDB, also called TileDB Embedded, is an embeddable C++ storage engine for dense and sparse multi-dimensional
  arrays, which it also uses to store dataframes. Data is stored in compressed tiles on local disk or on S3, Google Cloud
  Storage and Azure, with parallel I/O, versioning and time travel, and it is reached through C, C++, Python, R, Java, Go
  and C# APIs and integrations with Spark, Dask and GDAL. Its maker, TileDB, Inc., trades as Tile.ai and sells a separate
  enterprise data platform under that name.
github:
- url: https://github.com/TileDB-Inc/TileDB
pypi:
- url: https://pypi.org/project/tiledb/
artifact_exceptions:
  pypi_repo_mismatch: The tiledb package is TileDB-Py, the first-party Python API published from TileDB-Inc/TileDB-Py. Its
    build copies the TileDB core library into the wheel unless told to use an existing one, so installing it installs the
    engine itself.
