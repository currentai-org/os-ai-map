name: venturalitica
display_name: Venturalitica SDK
type: software
description: 'The Venturalitica SDK brings compliance checks into model training: it maps controls to EU AI
  Act articles 9 to 15, gathers evidence such as data lineage, metrics and a bill of materials during a run,
  and writes it as OSCAL. Checks run locally, with an optional strict mode for CI pipelines. It accompanies
  a 2026 preprint on machine-readable compliance evidence.'
comments: 'Tagged self-attested: the OSCAL output validates against a public schema, but its content is collected
  by the operator.'
github:
- url: https://github.com/Venturalitica/venturalitica-sdk
pypi:
- url: https://pypi.org/project/venturalitica/
