name: inkuba-instruct
display_name: Inkuba-Instruct
type: dataset
description: Inkuba-Instruct is an instruction-tuning dataset for Hausa, Yoruba, Swahili, isiZulu and isiXhosa,
  built by recasting existing task datasets such as MAFAND-MT, MasakhaNER, MasakhaPOS, AfriQA, SIB-200, MasakhaNEWS
  and AfriSenti into instruction, input and output records. It spans translation, named-entity recognition,
  part-of-speech tagging, question answering, topic classification and sentiment. Lelapa AI released it with
  the InkubaLM paper.
huggingface_dataset:
- url: https://huggingface.co/datasets/lelapa/Inkuba-instruct
arxiv:
- url: https://arxiv.org/abs/2408.17024
comments: Only the train and dev splits are public; the card says the test split will follow later.
