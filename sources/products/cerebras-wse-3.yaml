name: cerebras-wse-3
display_name: Cerebras WSE-3
type: hardware
description: 'Cerebras WSE-3 is a wafer-scale AI processor: one 46,225 mm² silicon wafer carrying 900,000 AI cores
  and 44 GB of on-wafer SRAM, rather than a chip cut from a wafer. It is sold inside Cerebras systems, the CS-3
  and the rack-scale CS-4, whose WSE-3 Turbo is a higher-clocked refresh of the same wafer.'
