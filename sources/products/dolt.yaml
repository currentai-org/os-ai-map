name: dolt
display_name: Dolt
type: software
description: 'Dolt is a SQL database with version control built into the storage engine: tables are committed, branched,
  merged, pushed and pulled the way Git handles files, and the history is queryable through system tables and functions.
  It speaks the MySQL wire protocol, so existing clients connect unchanged, and it ships a Git-style command line
  beside the server. DoltHub develops it.'
