name: opendataloader-pdf
display_name: OpenDataLoader PDF
type: software
description: OpenDataLoader PDF converts PDFs into Markdown, HTML and JSON with a bounding box and type for every element,
  using a deterministic Java engine for reading order, headings, lists and tables. A hybrid mode sends complex pages
  to a local Docling-based backend for borderless tables, OCR, formulas and chart descriptions, and the tool can also
  tag untagged PDFs for accessibility. Hancom develops it, with Python, Node.js and Java packages.
