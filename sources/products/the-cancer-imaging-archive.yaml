name: the-cancer-imaging-archive
display_name: The Cancer Imaging Archive (TCIA)
type: software
description: The Cancer Imaging Archive (TCIA) de-identifies and publishes cancer-related medical images, mostly in DICOM,
  together with supporting clinical data, annotations and analysis results. Research groups apply to publish collections,
  which an advisory group reviews before TCIA's team curates and releases them, each with a DataCite DOI and a version history.
  The National Cancer Institute funds it, and the Frederick National Laboratory for Cancer Research manages it.
