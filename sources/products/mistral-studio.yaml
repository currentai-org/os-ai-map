name: mistral-studio
display_name: Mistral Studio
type: software
description: Mistral Studio, formerly La Plateforme, is Mistral AI's platform for running its models through an
  API. The API reference covers chat completion, fill-in-the-middle code completion, embeddings, classifiers, OCR,
  speech transcription and synthesis, and batch jobs, alongside endpoints for agents, workflows and observability.
  Beyond the hosted API, Mistral sells hybrid, dedicated and self-hosted deployments of the platform.
comments: The ratings cover the model API. Studio's agent-building, workflow and evaluation tools sit on top of
  it and are not assessed here.
