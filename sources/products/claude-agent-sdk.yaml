name: claude-agent-sdk
display_name: Claude Agent SDK
type: software
description: Python library that puts Claude Code's agent loop inside an application. It starts the Claude
  Code command-line binary as a subprocess and exposes its built-in file, shell and search tools, permission
  controls, sessions, hooks and subagents through Python calls, with custom tools written as Python functions
  served as in-process MCP servers. Anthropic publishes the wrapper and bundles the Claude Code binary
  in each platform wheel.
comments: Scored as the package a developer installs, the Python wrapper and the bundled Claude Code binary
  together. Claude Code itself is a separate entry.
github:
- url: https://github.com/anthropics/claude-agent-sdk-python
pypi:
- url: https://pypi.org/project/claude-agent-sdk/
