name: lindsea
display_name: LINDSEA
type: dataset
languages:
- ind
- tam
description: LINDSEA is a linguistic diagnostic for language models in Indonesian and Tamil. Linguists and native
  speakers wrote its items from scratch to probe syntax, such as agreement and word order, and pragmatics, such
  as presupposition and implicature. AI Singapore introduced it in the BHASA paper, and it now runs as SEA-HELM's
  linguistic diagnostics, published as two Hub repositories.
