name: linkup
display_name: Linkup
type: software
description: Web search API for agents. One `/search` route takes a natural-language query and returns, at
  the caller's election, ranked sources with content snippets, a cited natural-language answer, or JSON matching
  a supplied schema; `/fetch` renders a named URL to markdown and `/research` runs the same pipeline asynchronously
  for long-form questions.
pypi:
- url: https://pypi.org/project/linkup-sdk
github:
- url: https://github.com/LinkupPlatform
comments: 'The registry flagged this as an MIT SDK in front of a closed index and that is exactly right: the
  LinkupPlatform organization publishes thirty repositories, all of them SDKs, MCP servers, plugins or benchmark
  harnesses, and the one repository that sounds like the core - `ranking` - carries no licence and describes
  itself as "probably temporary". Verified 2026-09-17 via the Linkup search endpoint overview and the Linkup
  pricing page.'
