name: oxdeai
display_name: OxDeAI
type: software
description: OxDeAI is an execution-time authorization library for AI agents. A deterministic policy engine decides
  each proposed action and, when it allows it, issues a signed single-use authorization bound to that exact action,
  which an enforcement gateway checks before the tool runs. The TypeScript packages also keep a hash-chained audit
  log and support single-hop delegation with narrower scope. Ange Yobo maintains it.
github:
- url: https://github.com/oxdeai/oxdeai
npm:
- url: https://www.npmjs.com/package/@oxdeai/core
- url: https://www.npmjs.com/package/@oxdeai/guard
