name: comfyui
display_name: ComfyUI
type: software
description: 'ComfyUI is a node-graph application and local engine for running generative media models: a workflow
  wires loaders, samplers, encoders and decoders together, and the same graph can be reused, shared or served through
  its local API. It runs image, image-editing, video, audio and 3D generation models side by side. Comfy Org maintains
  it and sells a separate hosted version.'
github:
- url: https://github.com/Comfy-Org/ComfyUI
