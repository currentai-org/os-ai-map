name: vertex-ai-pipelines
display_name: Vertex AI Pipelines
type: software
description: Serverless managed service for running machine-learning pipelines on Google Cloud. Pipelines are
  defined with the Kubeflow Pipelines or TFX SDK and executed without the user managing orchestration infrastructure,
  with runs schedulable on a recurring basis and artifact lineage tracked in ML Metadata.
comments: Google's documentation renamed this to Agent Platform Pipelines during 2026 and the cloud.google.com/vertex-ai/docs/pipelines
  path now redirects to a gemini-enterprise-agent-platform URL. The slug keeps the name the corpus already
  uses for Google's other Vertex products; the rename is a corpus-wide question rather than this record's.
  Verified 2026-09-15 via the Vertex AI Pipelines documentation.
