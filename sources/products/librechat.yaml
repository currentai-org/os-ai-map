name: librechat
display_name: LibreChat
type: software
description: LibreChat is a self-hosted web chat application that puts models from providers such as Anthropic,
  AWS, OpenAI and Azure behind one interface. It adds agents with MCP tool support, a sandboxed code interpreter,
  artifacts, web search and multi-user sign-in through OAuth2, SAML or LDAP. ClickHouse acquired the project
  in 2025 and now stewards it.
github:
