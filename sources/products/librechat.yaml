name: librechat
display_name: LibreChat
type: software
description: Self-hosted chat interface with native support for OpenAI, Anthropic, Google, Mistral and local
  model backends, plus multi-user authentication, agents, a code interpreter and prompt sharing. It aims at
  a faithful reproduction of the ChatGPT interaction model with enterprise authentication and role-based access,
  which suits org-wide deployments. ClickHouse acquired the project in 2025.
github:
