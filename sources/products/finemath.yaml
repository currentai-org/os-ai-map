name: finemath
display_name: FineMath
type: dataset
description: FineMath is a classifier-filtered mathematical web corpus extracted from Common Crawl by Hugging
  Face. It is released in two quality tiers, FineMath-3+ at 34 billion tokens and FineMath-4+ at 9.6 billion
  tokens, alongside a similarly filtered English portion of InfiMM-WebMath. It is part of the SmolLM2 and SmolLM3
  pretraining mixtures and one of the sources in the Dolma 3 pool behind Olmo 3.
huggingface_dataset:
- url: https://huggingface.co/datasets/HuggingFaceTB/finemath
lineage:
  derived_from:
  - Common Crawl
  curated_with:
  - datatrove
  trains:
  - smollm
  - apertus
  - marin
  - olmo
