name: kalahi
display_name: Kalahi
type: dataset
languages:
- fil
description: Kalahi tests whether language models answer the way a Filipino would in everyday cultural situations.
  It holds 150 prompts written by native Filipino speakers, each with responses a Filipino would find relevant or
  irrelevant, across topics such as family, food, beliefs and social customs. AI Singapore built it with native
  speakers, published it with its own paper, and runs a multiple-choice version inside SEA-HELM.
