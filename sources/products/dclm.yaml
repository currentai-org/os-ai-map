name: dclm
display_name: DCLM pipeline
type: software
description: 'The DataComp-LM toolkit and competition harness: a standardized Common Crawl pool, open_lm
  training recipes, a 50+ task eval suite, and the reference curation pipeline that produces DCLM-baseline.'
github:
