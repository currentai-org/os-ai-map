name: terramind
display_name: TerraMind
type: model
description: TerraMind is an any-to-any generative Earth-observation model developed by IBM, ESA Phi-Lab, and Forschungszentrum Juelich. It processes six satellite and terrain modalities, learns both pixel- and token-scale representations, and can generate missing modalities or supply embeddings for fine-tuned downstream models through TerraTorch.
