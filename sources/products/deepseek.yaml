description: DeepSeek-V4-Pro is DeepSeek's 1.6T-parameter mixture-of-experts model, with 49B parameters active
  per token, a one-million-token context and a hybrid attention design that combines Compressed Sparse Attention
  with Heavily Compressed Attention. It was pretrained on more than 32T tokens and ships as base and instruct
  checkpoints, alongside the smaller V4-Flash and the multimodal V4.1-Flash.
