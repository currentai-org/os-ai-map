name: replit-agent-code-execution-api
display_name: Replit Agent / Code Execution API
type: software
description: Runs untrusted and model-generated code, primarily Python, through a stateless API on Replit's
  cloud development platform. Each call executes inside an ephemeral unprivileged container created on Replit
  Autoscale Deployments and sandboxed by omegajail, returning whatever the code prints.
comments: The public self-serve client was archived read-only in 2025, so the entry is read from that client
  and Replit's original blog post rather than a maintained repository. The deployment-relevant artifact is
  the code-execution sandbox, not the agent that calls it.
