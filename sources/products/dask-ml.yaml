name: dask-ml
display_name: Dask-ML
type: software
description: Dask-ML scales machine learning in Python across cores and clusters with Dask. It provides parallel versions
  of common scikit-learn estimators, preprocessing and model selection, including incremental and Hyperband hyperparameter
  search, and wrappers that let scikit-learn, XGBoost and LightGBM models train or predict on Dask arrays and dataframes.
  It is maintained within the Dask project.
github:
- url: https://github.com/dask/dask-ml
