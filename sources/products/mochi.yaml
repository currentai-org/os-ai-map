name: mochi
display_name: Mochi
type: model
description: Mochi 1 is Genmo's 10B-parameter text-to-video diffusion model, built on its Asymmetric Diffusion Transformer
  architecture and trained from scratch. It generates 480p clips and is tuned for photorealistic rather than animated
  styles. Genmo publishes an inference harness with context parallelism and a LoRA fine-tuning trainer that runs
  on a single 80 GB GPU.
