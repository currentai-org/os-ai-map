name: omnigen
display_name: OmniGen
type: model
description: OmniGen is VectorSpaceLab's line of all-in-one image generation models. OmniGen2, released in June 2025, handles
  text-to-image generation, instruction-based editing and in-context generation that places given subjects into a new scene,
  by pairing the Qwen2.5-VL vision-language model with a separate image decoder. The team also published its training datasets
  and an in-context generation benchmark.
github:
- url: https://github.com/VectorSpaceLab/OmniGen2
huggingface_model:
- url: https://huggingface.co/OmniGen2/OmniGen2
huggingface_dataset:
- url: https://huggingface.co/datasets/OmniGen2/X2I2
arxiv:
- url: https://arxiv.org/abs/2506.18871
comments: OmniGen v1 (October 2024, MIT) sits on a separate Hub account, Shitao/OmniGen-v1, and is not counted here.
  OmniGen2's own transformer and code are Apache 2.0, but the checkpoint bundles Qwen2.5-VL-3B-Instruct under Alibaba's Qwen
  Research License, which allows research and evaluation only. The EditScore reward models from the same team are not part
  of this entry.
