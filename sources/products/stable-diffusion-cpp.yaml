name: stable-diffusion-cpp
display_name: stable-diffusion.cpp
type: software
description: stable-diffusion.cpp is a C and C++ inference engine for diffusion image and video models, built on
  the ggml tensor library and run from a command line or an embedded web interface. It reads safetensors and GGUF
  weights and targets CPUs and CUDA, Vulkan, Metal, OpenCL and SYCL devices. Supported models range from the Stable
  Diffusion line through FLUX and Qwen-Image to the Wan, LTX and HunyuanVideo video models.
github:
- url: https://github.com/leejet/stable-diffusion.cpp
comments: The only Python package for it on PyPI is a third-party binding from a different author and repository,
  so it is not declared here.
