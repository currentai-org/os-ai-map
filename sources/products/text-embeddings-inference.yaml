name: text-embeddings-inference
display_name: Text Embeddings Inference
type: software
description: Text Embeddings Inference (TEI) is Hugging Face's Rust server for deploying open embedding, reranking
  and sequence-classification models such as Qwen3-Embedding, GTE, E5 and BGE. It batches requests dynamically by
  token count, runs optimized model code built on Flash Attention, Candle and cuBLASLt, loads Safetensors and ONNX
  weights, and exposes HTTP and gRPC APIs with OpenTelemetry tracing and Prometheus metrics. It ships as Docker
  images for CPUs and recent NVIDIA GPU generations, with AMD Instinct and Apple Silicon builds as well.
github:
- url: https://github.com/huggingface/text-embeddings-inference
comments: Releases through v1.2.0 shipped under Hugging Face's own HFOIL 1.0 license; v1.2.3 and later are Apache-2.0,
  which is what the entry reads.
