name: diffrhythm
display_name: DiffRhythm
type: model
description: DiffRhythm is a song generation model line from ASLP Lab at Northwestern Polytechnical University. It writes
  a complete song, vocals and accompaniment together, from lyrics and a style prompt or reference clip. DiffRhythm 2, released
  with Xiaomi in October 2025, generates semi-autoregressively in blocks to keep the singing aligned with the lyrics.
github:
- url: https://github.com/ASLP-lab/DiffRhythm2
- url: https://github.com/ASLP-lab/DiffRhythm
huggingface_model:
- url: https://huggingface.co/ASLP-lab/DiffRhythm2
- url: https://huggingface.co/ASLP-lab/DiffRhythm-1_2
- url: https://huggingface.co/ASLP-lab/DiffRhythm-1_2-full
- url: https://huggingface.co/ASLP-lab/DiffRhythm-base
- url: https://huggingface.co/ASLP-lab/DiffRhythm-full
arxiv:
- url: https://arxiv.org/abs/2510.22950
- url: https://arxiv.org/abs/2503.01183
comments: The first DiffRhythm (March 2025) and its 1.2 update remain on the Hub with training code. DiffRhythm 2
  was developed with Xiaomi and ships inference code only; it loads the separately published MuQ-MuLan style encoder.
