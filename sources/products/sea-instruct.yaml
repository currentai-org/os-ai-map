name: sea-instruct
display_name: SEA-Instruct
type: dataset
description: SEA-Instruct is an instruction-tuning dataset from AI Singapore for Southeast Asian languages
  and contexts, pairing prompts filtered from open data and AI Singapore's own synthetic prompts with model-generated
  responses. Qwen3 models tagged prompts and drafted answers and DeepSeek-V3.1 revised them, and the release
  keeps only prompts rated excellent, coherent and natural. It spans English, Chinese and ten regional languages,
  each row tagged for domain, task, complexity and cultural knowledge.
huggingface_dataset:
- url: https://huggingface.co/datasets/aisingapore/SEA-Instruct-2602
