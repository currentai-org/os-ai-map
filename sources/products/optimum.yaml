name: optimum
display_name: Optimum
type: software
description: Optimum is an extension of Transformers, Diffusers, TIMM, and Sentence-Transformers that
  provides tools to optimize training and inference on targeted hardware. It supports accelerators and
  runtimes including ONNX Runtime, OpenVINO, Intel Gaudi, AWS Trainium/Inferentia, and NVIDIA TensorRT-LLM,
  and handles model export and quantization. It is maintained by Hugging Face.
github:
- url: https://github.com/huggingface/optimum
pypi:
- url: https://pypi.org/project/optimum/
comments: Verified 2026-08-13 via GitHub and the LICENSE body.
