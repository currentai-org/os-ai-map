name: huggingface-hub
display_name: huggingface_hub
type: software
description: huggingface_hub is the official Python client for the Hugging Face Hub, enabling programmatic
  downloading and uploading of files, repository management, running inference, and search across models,
  datasets, and Spaces. It serves as the integration layer that other ML libraries use to host and retrieve
  content on the Hub. It is maintained by Hugging Face.
github:
- url: https://github.com/huggingface/huggingface_hub
pypi:
- url: https://pypi.org/project/huggingface-hub/
comments: Verified live 2026-06-22 via primary sources. LICENSE body is verbatim Apache License 2.0; full
  source public.
