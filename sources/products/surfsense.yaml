name: surfsense
display_name: SurfSense
type: software
description: Desktop app that answers questions over a user's own documents, with cited hybrid retrieval, and
  turns them into summaries, slide decks, reports, flashcards, quizzes and podcasts. Parsing, indexing and
  generation run on the user's machine with a local model or any OpenAI-compatible API. The repository also
  holds the earlier Docker web stack, now community-supported. It is positioned as a local alternative to NotebookLM.
github:
- url: https://github.com/MODSetter/SurfSense
