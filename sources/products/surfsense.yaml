name: surfsense
display_name: SurfSense
type: software
description: Self-hostable AI research assistant, positioned against NotebookLM, Perplexity and Glean. It connects
  a model to a personal or team knowledge base plus external sources and answers over them with hybrid retrieval,
  reachable through one REST API or an MCP server. Operators bring their own model, embedding and reranker
  choices, including local ones, and run it on their own infrastructure.
github:
- url: https://github.com/MODSetter/SurfSense
comments: The connector count and per-feature depth come from the maintainer's README and were not independently
  checked. Licensing has since split, placing the connector directory under a source-available license, and
  the openness axis is held on that. Verified 2026-08-13 via the MODSetter/SurfSense repository.
