name: surfsense
display_name: SurfSense
type: software
description: AI research assistant that connects a model to a personal or team knowledge base plus external
  sources and answers over them with hybrid retrieval, reachable through one REST API or an MCP server. Operators
  bring their own model, embedding and reranker choices, including local ones, and run it on their own infrastructure.
  It is positioned against NotebookLM, Perplexity and Glean.
github:
- url: https://github.com/MODSetter/SurfSense
comments: The connector count and per-feature depth come from the maintainer's README and were not independently
  checked. Licensing has since split across the tree, and the openness axis is held on that. Verified 2026-08-13
  via the MODSetter/SurfSense repository.
