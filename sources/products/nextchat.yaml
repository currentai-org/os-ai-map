name: nextchat
display_name: NextChat
type: software
description: Lightweight, cross-platform ChatGPT/Gemini/Claude web client that runs as a single Next.js
  app deployable to Vercel in one click. Picked for its minimalism and easy personal deployment when full-fat
  frontends like Open WebUI are overkill; ~88k GitHub stars makes it the single most-starred OSS chat
  UI repo by raw count.
comments: v2.16.1 latest release (~mid-2025; release notes cite OpenAI o3/o4-mini + Claude 3.7 support); MIT
  core. Verified 2026-08-13 via the ChatGPTNextWeb/NextChat repository; still no release since July 2025, so
  the freshness flag stands and the gap is now over a year. Cross-platform (web/desktop/mobile) chat client;
  Enterprise Edition adds permissions/RAG.
