name: nextchat
display_name: NextChat
type: software
description: Lightweight cross-platform chat client for OpenAI, Gemini and Claude, packaged as a single Next.js
  app that deploys to Vercel in one click. It runs on the web, desktop and mobile, supports plugins, vision,
  MCP and artifacts, and offers an Enterprise Edition that adds permissions, team management and an internal
  knowledge base.
