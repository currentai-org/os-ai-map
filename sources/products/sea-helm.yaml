name: sea-helm
display_name: SEA-HELM
type: dataset
description: 'SEA-HELM (Southeast Asian Holistic Evaluation of Language Models) is AI Singapore''s evaluation
  suite for large language models in Southeast Asian languages. It groups tasks under five pillars: classic
  NLP tasks, LLM-specific tasks such as instruction following and multi-turn chat, linguistic diagnostics,
  culture, and safety. Test sets combine native datasets, human translations and new handcrafted sets such
  as Kalahi. The suite absorbed the earlier BHASA benchmark and feeds the SEA-HELM leaderboard.'
