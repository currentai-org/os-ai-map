name: clarin-vlo
display_name: CLARIN Virtual Language Observatory
type: software
description: The CLARIN Virtual Language Observatory (VLO) is a faceted search portal over descriptions of language resources
  held by the centers of the CLARIN research infrastructure. It harvests
  the centers' metadata records over OAI-PMH, converts them to the CMDI metadata standard and indexes them in Solr, so that
  people can filter resources by language, type and availability before going to the center that holds them.
github:
- url: https://github.com/clarin-eric/VLO
