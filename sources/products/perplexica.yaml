name: perplexica
display_name: Perplexica
type: software
description: Self-hostable answer engine offering the answer-with-sources experience with a bundled SearXNG
  metasearch layer, so queries stay on the operator's own machine. It works with local or cloud models from
  Ollama, OpenAI, Anthropic, Gemini, Groq or any OpenAI-compatible endpoint, and offers web, academic, discussion,
  image and video search modes plus file-upload retrieval.
github:
