name: h2o-3
display_name: H2O-3
type: software
description: H2O.ai's open-source, in-memory, distributed machine-learning platform, running on the JVM with
  Python and R clients. It offers GLM, GAM, gradient boosting, XGBoost, random forests, deep learning, SVMs,
  stacked ensembles, isolation forests, k-means and PCA, and H2O AutoML, which trains, tunes and stacks a set
  of models within a time or model budget. Models export as MOJO and POJO artifacts for deployment. H2O.ai
  sells a commercial H2O-3 Secure edition alongside it.
