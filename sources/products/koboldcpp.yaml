name: koboldcpp
display_name: KoboldCpp
type: software
description: KoboldCpp runs GGUF language models on a personal computer as a single executable with a built-in web interface
  for chat, story writing and roleplay. Built on llama.cpp, it runs on CPU or GPU, also generates images, video, speech and
  music with compatible models, transcribes audio, and exposes KoboldAI-, OpenAI- and Ollama-compatible APIs for other apps.
