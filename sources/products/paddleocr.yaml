description: OCR and document-parsing toolkit from Baidu's PaddlePaddle project, covering text detection and
  recognition in more than a hundred languages plus table, formula and seal recognition, and a document-parsing
  pipeline that emits Markdown and JSON. PaddleOCR-VL is its vision-language parsing model.
