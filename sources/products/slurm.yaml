name: slurm
display_name: Slurm
type: software
description: Workload manager for Linux clusters, and a long-standing scheduler for HPC and GPU training. Jobs
  request generic resources with --gres or --gpus, and Slurm's controller allocates whole nodes or specific
  GPUs to a job, enforces the allocation, and runs the job's steps inside it. Multi-node allocations are granted
  together, which is what all-or-nothing training jobs need.
github:
- url: https://github.com/SchedMD/slurm
comments: Maintained by SchedMD. The GitHub API reports NOASSERTION because the COPYING file opens with a SLURM
  LICENSE AGREEMENT preamble before naming the GNU General Public License; the body is GPL.
