name: longmemory
display_name: LongMemory
type: software
description: LongMemory is a self-hosted memory engine that records what an agent learns as an immutable, time-stamped
  graph of entities, claims and relationships, then recalls it in strict, historical or associative modes within
  a token budget. One TypeScript engine runs as a library, CLI, HTTP and MCP server, dashboard and VS Code extension.
  CaviraOSS builds it, and it was previously published as OpenMemory.
comments: Read against the repository's main branch, which holds the rewritten Hydrograph engine; the longmemory
  package on npm still ships the earlier OpenMemory code under the new name.
github:
- url: https://github.com/CaviraOSS/LongMemory
npm:
- url: https://www.npmjs.com/package/longmemory
