name: ncnn
display_name: ncnn
type: software
description: ncnn is a neural network inference runtime optimized for mobile, embedded and desktop deployment, with
  no third-party dependency in its core. It ships pnnx for converting PyTorch and ONNX models into its own format,
  and targets general neural network inference rather than LLM serving specifically.
