name: deberta
display_name: DeBERTa
type: model
description: DeBERTa is Microsoft's encoder-only language model, which keeps each word's content and position
  apart inside attention. Its third version, DeBERTaV3, replaces masked-word prediction with ELECTRA-style
  replaced-token detection and comes in XSmall to Large sizes, plus mDeBERTaV3 Base, a multilingual model
  covering 102 languages. Earlier DeBERTa and DeBERTaV2 checkpoints remain available. It is built to be
  fine-tuned for classification and question answering rather than to generate text.
