name: naijarc
display_name: NaijaRC
type: dataset
languages:
- hau
- ibo
- yor
description: NaijaRC is a multiple-choice reading comprehension test in Hausa, Igbo and Yoruba, built from the comprehension
  passages and questions of past West African senior school examinations in those languages. Its authors published it
  with its own paper and evaluate models on it without training on it, and AfroBench runs it as one of its reading comprehension
  tasks.
huggingface_dataset:
