name: dlrover
display_name: DLRover
type: software
description: Distributed deep-learning training system from Ant Group, built to keep large training jobs running.
  It manages elastic training on Kubernetes - scaling workers up and down during a run, detecting and replacing
  failed nodes, and resuming from checkpoints - so that a job survives the failures that would otherwise restart
  it.
github:
- url: https://github.com/intelligent-machine-learning/dlrover
pypi:
- url: https://pypi.org/project/dlrover/
