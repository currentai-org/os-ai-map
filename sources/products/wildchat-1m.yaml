description: WildChat-1M is a corpus of real user conversations with ChatGPT, drawn from about one million
  conversations gathered by offering online users free access to GPT-3.5 and GPT-4. It covers 68 detected languages
  and records timestamps, hashed IP addresses, country and state, the OpenAI model used, and moderation scores.
  The public release omits conversations flagged as toxic or as containing sensitive information, and is published
  by the Allen Institute for AI on Hugging Face.
huggingface_dataset:
- url: https://huggingface.co/datasets/allenai/WildChat-1M
lineage:
