type: dataset
languages: [afr, ara, aze, bel, ben, bos, bul, cat, ces, cym, dan, deu, ell, eng, epo, est, eus, fas, fin,
  fra, gle, guj, heb, hin, hrv, hun, hye, ind, isl, ita, jpn, kat, kaz, kor, lat, lav, lit, lug, mar, mkd,
  mon, mri, msa, nld, nno, nob, pol, por, ron, rus, slk, slv, sna, som, sot, spa, sqi, srp, swa, swe, tam,
