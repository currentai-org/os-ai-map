name: alphafold
display_name: AlphaFold
type: model
description: AlphaFold is Google DeepMind's biomolecular structure prediction line. AlphaFold 3, the current tier, predicts the joint structure of complexes of proteins, nucleic acids, ligands, ions and modified residues from sequence together with genetic-search and template inputs. The inference source is Apache-2.0 in both generations, but the model parameters are licensed separately, and separately in each generation.
github:
- url: https://github.com/google-deepmind/alphafold
comments: The slug covers the product line at the tier DeepMind ships, which is AlphaFold 3 in google-deepmind/alphafold3; the declared repository is the AlphaFold 2 codebase the line began with, and it is still the more widely starred of the two. Verified 2026-09-10 via both GitHub repositories, the AlphaFold 3 weights terms of use, and the AlphaFold 2 README.
