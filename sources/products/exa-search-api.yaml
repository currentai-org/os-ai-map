name: exa-search-api
display_name: Exa Search API
type: software
description: Exa Search API is a hosted neural search service, formerly known as Metaphor, that matches queries
  on meaning rather than keywords and ranks results by semantic similarity. A single search request can return
  links along with page text, highlights or a schema-shaped summary for each result. Exa is offered as a semantic
  alternative to keyword-based search APIs.
pypi:
- url: https://pypi.org/project/exa-py
  not_primary_channel: The Python client SDK for Exa's hosted search API. Its installs count applications that
    call the API, which can vary independently of the API's use, so it does not measure the product.
