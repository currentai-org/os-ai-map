name: bert
display_name: BERT
type: model
description: BERT (Bidirectional Encoder Representations from Transformers) is Google's encoder-only language
  model, pretrained by masking words and predicting the next sentence on English Wikipedia and BookCorpus.
  Released from 2018 in Base (110M parameters) and Large (340M) sizes, cased and uncased, with later multilingual
  and Chinese checkpoints, it is built to be fine-tuned for classification, tagging and question answering
  rather than to generate text.
