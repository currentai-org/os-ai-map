name: kaggle-models
display_name: Kaggle Models
type: software
description: Model hub inside Kaggle, Google's data science platform, where users and organizations publish
  models as variations per framework and size, each variation versioned as file snapshots. Models are private
  until published, searchable and sortable by downloads or votes, and downloadable by handle through the kagglehub
  library and the Kaggle CLI. TensorFlow Hub moved here in 2023, and tfhub.dev links redirect to it.
comments: kaggle.com served a browser challenge to every fetch, so this entry is read from Kaggle's own CLI
  and client documentation. TensorFlow Hub was never a separate entry on the map.
