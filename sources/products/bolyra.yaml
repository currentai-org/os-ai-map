name: bolyra
display_name: Bolyra
type: software
description: Bolyra is a gateway and verifier that checks each AI-agent tool call before it reaches an MCP server.
  It verifies the agent's credential, applies per-tool policy, rejects replays and signs a receipt for every allow
  or deny. An optional zero-knowledge tier lets agents prove credentials and one-way narrowed delegations without
  revealing them. ZKProva Inc. builds it.
