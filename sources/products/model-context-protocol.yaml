name: model-context-protocol
display_name: Model Context Protocol
type: software
description: Model Context Protocol is an open standard for connecting AI agents to external tools and data
  sources, defining how an agent discovers, authenticates with and invokes a tool over JSON-RPC. Anthropic
  announced it in November 2024 and donated it to the Linux Foundation's Agentic AI Foundation in December
  2025. The specification, schema and documentation live in one repository, with official SDKs in separate
  repositories for languages including Python, TypeScript, C#, Java, Go, Rust and Ruby.
