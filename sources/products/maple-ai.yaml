name: maple-ai
display_name: Maple AI
type: software
description: End-to-end encrypted AI chat assistant. Conversations are encrypted on the device and processed
  inside hardware-isolated Trusted Execution Environments, on AWS Nitro Enclaves with Nvidia GPU TEEs, so the
  operator cannot read them; remote attestation lets users check the running build against published source.
  It serves open-weights models and ships as web, iOS, Android and desktop apps, built on the OpenSecret confidential-computing
  platform.
github:
- url: https://github.com/OpenSecretCloud/Maple
comments: The consumer service at trymaple.ai is paid; openness here describes the code and architecture rather
  than free usage. Verified 2026-08-13 via Maple's model guide and its first-year retrospective.
