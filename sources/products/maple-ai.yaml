name: maple-ai
display_name: Maple AI
type: software
description: End-to-end encrypted AI chat assistant. Conversations are encrypted on the device and processed
  inside hardware-isolated Trusted Execution Environments, so the operator cannot read them; remote attestation
  lets users check the running build against published source. It serves open-weights models and ships as apps
  for major platforms, built on the OpenSecret confidential-computing platform.
github:
- url: https://github.com/MaplePrivacyLabs/Maple
comments: Scored on the open-source code and architecture; the hosted service has a free plan and paid tiers.
