description: Context Graph for AI Native SDLC. Potpie turns your codebase and software development lifecycle into
  a living context graph for AI agents. It indexes code, structure, decisions, source history, team knowledge and
  engineering workflows, so agents can answer questions, plan changes, debug failures, and write code with project-specific
  context.
