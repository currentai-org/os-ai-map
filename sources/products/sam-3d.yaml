name: sam-3d
display_name: SAM 3D Objects
type: model
description: SAM 3D Objects is Meta's model for turning an object in a single photograph into a full 3D shape with texture
  and layout. It was built for real-world pictures where objects are cluttered or partly hidden, and was released in
  November 2025 together with SAM 3D Body, a separate model for human body meshes.
github:
- url: https://github.com/facebookresearch/sam-3d-objects
huggingface_model:
- url: https://huggingface.co/facebook/sam-3d-objects
arxiv:
- url: https://arxiv.org/abs/2511.16624
comments: SAM 3D Body recovers human body meshes, which is reconstruction rather than generation, so it is not part of
  this entry; the Segment Anything segmentation models are a separate product. Encoder weights were added in June 2026.
