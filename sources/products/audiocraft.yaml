name: audiocraft
display_name: AudioCraft
type: software
description: AudioCraft is Meta's PyTorch library for audio generation research, carrying both inference and training
  code. It hosts MusicGen and MAGNeT for text-to-music, AudioGen for text-to-sound, JASCO for chord- and melody-conditioned
  music, the EnCodec neural codec, Multi Band Diffusion decoding and the AudioSeal watermark. The model weights
  it loads are published separately under their own terms.
github:
- url: https://github.com/facebookresearch/audiocraft
pypi:
- url: https://pypi.org/project/audiocraft/
comments: Scored as the library. The MusicGen weights it loads are their own entry, and their non-commercial terms
  are recorded there.
