name: openai-web-search
display_name: OpenAI Web Search
type: software
description: Built-in tool in the OpenAI Responses API that lets a model search the live web during a call
  and return an answer with inline citations to the pages it used.
comments: 'A tool inside an API rather than a standalone search endpoint, billed per tool call. The documented
  URL moved: platform.openai.com/docs/guides/tools-web-search now redirects to developers.openai.com.'
