name: opencv
display_name: OpenCV
type: software
description: 'Open Source Computer Vision Library: C++ image and video processing, feature detection, camera calibration,
  stereo, stitching and object detection routines with Python, Java and JavaScript bindings, plus a dnn module that
  runs ONNX, TensorFlow and TFLite networks. The opencv-python wheels on PyPI are built from a separate packaging
  repository. Maintained by the non-profit Open Source Vision Foundation.'
