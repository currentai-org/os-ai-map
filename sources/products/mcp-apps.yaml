name: mcp-apps
display_name: MCP Apps
type: software
description: An extension to the Model Context Protocol, with its own dated specification and SDK, letting
  a tool declare a `ui://` resource carrying an HTML interface that the host renders in a sandboxed iframe
  and communicates with bidirectionally.
github:
- url: https://github.com/modelcontextprotocol/ext-apps
npm:
- url: https://www.npmjs.com/package/@modelcontextprotocol/ext-apps
comments: An extension specification rather than an implementation of the core protocol, which is why its capability
  abstains. It versions separately from core MCP - its stable revision is 2026-01-26 - and it depends on the
  core SDKs at ^2.0.0. Verified 2026-09-17 via the GitHub API, the README, the LICENSE body and the npm download
  API.
