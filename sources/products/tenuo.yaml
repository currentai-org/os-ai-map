name: tenuo
display_name: Tenuo
type: software
description: 'Tenuo authorizes AI agent tool calls with warrants: signed, expiring grants that name the tools an
  agent may call, the argument values it may pass and the key that must sign each call. A warrant can be handed
  to another agent or service only in narrower form, and it is verified locally before the action runs. Tenuo, Inc.
  builds it as a Rust core with Python and TypeScript libraries.'
