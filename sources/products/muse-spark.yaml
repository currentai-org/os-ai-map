name: muse-spark
display_name: Muse Spark
type: model
description: Muse Spark is a multimodal language model line from Meta Superintelligence Labs, launched on April
  8, 2026 as the first in the Muse series. The hosted releases, currently Muse Spark 1.3, power the Meta AI app
  and website and Meta's other apps and AI glasses, and reach developers through the Meta Model API. On October
  15, 2026 Meta published Muse Spark Open, an 816-billion-parameter mixture-of-experts model with 42 billion
  active parameters that shares Muse Spark 1.3's base model, as downloadable weights under the Muse Model License.
