name: muse-spark
display_name: Muse Spark
type: model
description: Muse Spark is a closed-weight multimodal language model from Meta Superintelligence Labs, launched
  on April 8, 2026 as the first in the Muse series. It powers the Meta AI app and website and extends to WhatsApp,
  Instagram, Facebook, Messenger and AI glasses, and Meta offers it to developers through the Meta Model API.
  Later releases in the line, such as Muse Spark 1.3, continue under the same product name.
