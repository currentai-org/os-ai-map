name: presto
display_name: Presto
type: model
description: Presto, the Pretrained Remote Sensing Transformer, is a lightweight self-supervised model from NASA Harvest for remote-sensing pixel timeseries. It consumes between one and twenty-four monthly timesteps of Sentinel-1 SAR, Sentinel-2 optical, ERA5 meteorology, SRTM topography, Dynamic World classes, and latitude and longitude, and exposes an encoder whose pooled embeddings are fine-tuned for downstream classification and regression.
github:
- url: https://github.com/nasaharvest/presto
comments: The pretrained weights ship inside the MIT repository as data/default_model.pt rather than on a model hub, so the adoption band is read from GitHub stars. Verified 2026-09-10 via the repository README, LICENSE, and contents listings.
