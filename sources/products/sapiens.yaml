name: sapiens
display_name: Sapiens
type: model
description: Sapiens is Meta's family of high-resolution vision transformers for images of people, pretrained on a billion
  human images. The current generation, Sapiens2, spans 0.1B to 5B parameters and ships task checkpoints for whole-body
  pose with 308 keypoints, 29-part body segmentation, surface normals, pointmaps and human matting, along with fine-tuning
  code for each task.
