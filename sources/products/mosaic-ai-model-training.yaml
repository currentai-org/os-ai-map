name: mosaic-ai-model-training
display_name: Mosaic AI Model Training
type: software
description: Mosaic AI Model Training was Databricks' managed service for full fine-tuning and continued pre-training
  of Meta Llama 3.1 to 3.3 models, driven from the databricks_genai SDK or a web UI. Training jobs read data
  from Unity Catalog and registered the resulting weights back to it, so customers kept the trained checkpoint.
  Databricks has ended support for the service and recommends its AI Runtime environment instead.
comments: Databricks' own pages call this capability Foundation Model Fine-tuning, part of Databricks Model
  Training; neither page uses the name Mosaic AI Model Training.
