name: mosaic-ai-model-training
display_name: Mosaic AI Model Training
type: software
description: Mosaic AI Model Training was Databricks' managed service for fine-tuning and continued pre-training
  of Meta Llama 3.1, 3.2 and 3.3 models, driven from the databricks_genai SDK or a web UI. Training jobs read
  data from Unity Catalog and registered the resulting model back to it, with checkpoints saved to MLflow,
  so customers kept control of the trained model. Databricks has ended support for the service and recommends
  its AI Runtime environment instead.
comments: Databricks' own pages call this capability Foundation Model Fine-tuning, part of Databricks Model
  Training; neither page uses the name Mosaic AI Model Training.
end_of_life:
  date: '2026-09-11'
  source: https://docs.databricks.com/aws/en/large-language-models/foundation-model-training/
  shows: The warning on the page says Foundation Model Fine-tuning "has reached end of life (EoL) and is no
    longer supported." and that the databricks_genai package and the fine-tuning "UI are no longer available."
    The page is marked last updated on "Sep 11, 2026" and names no day the service stopped, so the end fell
    on or before that date; it is when the page was last edited, not an announced shutdown day.
  accessed: '2026-09-30'
