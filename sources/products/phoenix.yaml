name: phoenix
display_name: Phoenix
type: software
description: Phoenix is an AI observability and evaluation toolkit from Arize AI that provides tracing, datasets
  and experiments, prompt management with a playground, and LLM evaluation. It instruments applications through
  OpenTelemetry, with integrations for LlamaIndex and LangChain, and deploys via Docker or a Helm chart.
github:
- url: https://github.com/Arize-ai/phoenix
pypi:
