description: AfriXNLI tests whether a model can tell if one sentence entails, contradicts or is neutral to another, in
  16 African languages. Professional translators translated part of the English XNLI set into 15 of them; its Swahili
  comes from XNLI itself. It is one of the three sets of IrokoBench, published by Masakhane with its own card, and AfroBench
  runs it as its inference task.
