name: openpai
display_name: OpenPAI
type: software
description: Cluster management and resource scheduling platform for AI, originally from Microsoft Research.
  Users submit deep-learning jobs to a shared GPU cluster; OpenPAI schedules them with HiveD, a scheduler extender
  that models each tenant as a virtual cluster and guarantees not just a GPU count but the topology those GPUs
  sit in, so an eight-GPU job that must run inside one node gets a placement that satisfies it.
github:
- url: https://github.com/microsoft/pai
comments: The HiveD scheduler is vendored at src/hivedscheduler and also published separately as microsoft/hivedscheduler.
