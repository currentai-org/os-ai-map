name: openai-agents-sdk
display_name: OpenAI Agents SDK
type: software
description: Python framework for building agents and multi-agent workflows, in which agents carry instructions,
  tools and guardrails and hand tasks to one another. It adds sessions that keep conversation history,
  human-in-the-loop approvals, tracing, sandbox agents that work inside an isolated workspace, and realtime
  and voice agents. Models can come from the OpenAI APIs or from other providers. OpenAI builds it, alongside
  a separate JavaScript and TypeScript version.
github:
- url: https://github.com/openai/openai-agents-python
pypi:
- url: https://pypi.org/project/openai-agents/
