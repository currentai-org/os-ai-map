description: SEA-MTBench tests how language models hold a two-turn conversation in Southeast Asian languages, judged
  by a stronger model against a fixed baseline. AI Singapore translated and localized the English MT-Bench questions
  by hand, 58 per language, and uses the ThaiLLM leaderboard's MT-Bench Thai for Thai. It is SEA-HELM's multi-turn
  chat task and is published on its own on the Hub.
