name: infinity
display_name: Infinity
type: software
description: Infinity is a database built for LLM applications that indexes dense vectors, sparse vectors, tensors
  and full text in one engine and fuses them into a single hybrid query. Multi-vector tensor reranking sits alongside
  BM25 and HNSW retrieval, and structured data is queried in the same system. It is written in C++20 and self-hosted.
github:
- url: https://github.com/infiniflow/infinity
