name: infinity
display_name: Infinity
type: software
description: Infinity is a database built for LLM applications that indexes dense vectors, sparse vectors,
  tensors and full text in one engine and fuses them into a single hybrid query. Results can be reranked with
  reciprocal rank fusion, weighted sum or ColBERT-style tensor rerankers, and structured data is queried in
  the same system. It is self-hosted.
github:
- url: https://github.com/infiniflow/infinity
