name: kaggle-datasets
display_name: Kaggle Datasets
type: software
description: Kaggle Datasets is the public dataset catalog on Kaggle, Google's data science platform. Users and
  organizations publish datasets with per-file descriptions and column schemas, add new versions, and choose a license.
  The catalog is searchable by file type, license, tag and size, and the Kaggle CLI and the kagglehub library download
  a dataset by owner and name or load a file straight into a dataframe.
comments: Kaggle served a browser challenge to every page fetch, so this entry is read from Kaggle's own CLI and
  client documentation. Kaggle's model hub is the separate entry Kaggle Models.
