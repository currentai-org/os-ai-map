name: vertex-ai-tuning
display_name: Vertex AI Tuning
type: software
description: Vertex AI Tuning is Google Cloud's managed tuning service for Gemini models, offering supervised
  fine-tuning, preference tuning from human feedback, and a preview reinforcement fine-tuning method, with
  continuous tuning, checkpoints and function-calling tuning. Datasets can be as small as about 100 examples.
  Tuned models stay on Google Cloud, since Google does not release Gemini weights.
comments: Google's documentation now redirects the Vertex AI tuning guide to a "Gemini Enterprise Agent Platform"
  section; this entry still describes the same managed Gemini tuning feature.
