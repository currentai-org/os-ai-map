name: deepseek-r1
display_name: DeepSeek-R1
type: model
description: DeepSeek-R1 is a reasoning model, released in January 2025, that uses large-scale GRPO reinforcement
  learning to develop chain-of-thought before answering. It is a 671B-parameter mixture-of-experts model with
  37B active parameters and a 128K context window, post-trained on DeepSeek-V3-Base and released alongside
  1.5B to 70B distilled variants. The DeepSeek-V4 family has since followed it.
