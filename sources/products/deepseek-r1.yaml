name: deepseek-r1
display_name: DeepSeek-R1
type: model
description: Previous-generation reasoning-first model (January 2025) using large-scale GRPO RL to develop
  chain-of-thought before answering. 671B MoE plus 1.5B–70B distilled variants. Superseded by DeepSeek-R2
  (April 2026), which inverts the architecture thesis; R2 is a 32B dense MIT model that runs on a single
  24GB consumer GPU and reaches 92.7% AIME 2025. R1 is still by some distance the most-downloaded open
  reasoning model on the Hub.
huggingface_model:
- url: https://huggingface.co/deepseek-ai/DeepSeek-R1
- url: https://huggingface.co/deepseek-ai/DeepSeek-R1-0528
comments: DeepSeek-R1 (671B total / 37B active MoE, 128K context), reasoning model RL+SFT post-trained on DeepSeek-V3-Base
  (cold-start data + RL + SFT pipeline; R1-Zero is pure-RL variant); arXiv 2501.12948, released 2025-01-22.
  The earlier record put monthly downloads at 4.3M; the card now reads 8.3M, so the figure was dropped from
  the description rather than re-pinned. Verified 2026-08-13 via the HF model card.
