name: fastvlm
display_name: FastVLM
type: model
description: FastVLM is Apple's family of vision-language models built to answer quickly on high-resolution images.
  Its FastViTHD hybrid vision encoder emits fewer visual tokens and cuts encoding time, which shortens the wait
  for the first token of an answer. The models come in 0.5B, 1.5B and 7B sizes, the largest on Qwen2-7B, with exports
  for Apple Silicon and a demo iOS app that runs them on device.
