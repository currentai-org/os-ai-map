name: wimse-ai-identity-management
display_name: AI Identity Management System (WIMSE)
type: software
description: AI Identity Management System (AIMS) is an IETF WIMSE working group draft that sets out how to authenticate
  and authorize AI agents by composing existing standards rather than defining new protocols. Each agent gets a
  WIMSE or SPIFFE workload identifier with cryptographically bound credentials, OAuth 2.0 carries delegated authority,
  and the draft covers human approval, transaction tokens and tamper-evident audit records.
comments: Read against revision 01. An Internet-Draft is a work in progress that is revised, replaced or left to
  expire, so a later revision may change what it defines.
github:
- url: https://github.com/ietf-wg-wimse/draft-ietf-wimse-aims
