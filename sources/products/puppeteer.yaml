name: puppeteer
display_name: Puppeteer
type: software
description: JavaScript library that drives Chrome or Firefox over the DevTools Protocol or WebDriver BiDi.
  It serves as the browser-control layer that several higher-level agent automation tools are built on top
  of.
github:
- url: https://github.com/puppeteer/puppeteer
npm:
- url: https://www.npmjs.com/package/puppeteer
comments: 'Included as the browser-control layer itself rather than as an agent product: `playwright-mcp`,
  `browser-use` and `steel-browser` all sit on this class of library, and a map that scores the adapters without
  the thing they adapt reads as though it appeared from nowhere.'
