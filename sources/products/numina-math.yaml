name: numina-math
display_name: NuminaMath
type: dataset
languages: [eng]
description: NuminaMath is a family of math post-training datasets from Project Numina. NuminaMath-CoT pairs about
  860,000 problems, from Chinese high-school exercises to olympiad competitions, with chain-of-thought solutions;
  NuminaMath-TIR adds about 72,000 solutions that reason by writing and running Python code; and NuminaMath 1.5
  revises the collection to about 900,000 problems with answer, problem-type and question-type metadata. Models
  trained on it won the first AI Mathematical Olympiad Progress Prize.
comments: One entry covers the CoT, TIR and 1.5 releases.
huggingface_dataset:
- url: https://huggingface.co/datasets/project-numina/NuminaMath-CoT
- url: https://huggingface.co/datasets/project-numina/NuminaMath-TIR
- url: https://huggingface.co/datasets/project-numina/NuminaMath-1.5
