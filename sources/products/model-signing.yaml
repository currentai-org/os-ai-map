name: model-signing
display_name: OpenSSF Model Signing
type: software
description: 'OpenSSF Model Signing signs machine-learning models and verifies those signatures, so a user
  can check a model''s integrity and provenance for themselves rather than trusting whoever trained it. It
  signs with Sigstore''s keyless flow, with public keys or certificates, or through PKCS #11 devices, and emits
  a Sigstore bundle following the OpenSSF Model Signing specification. It is developed under the Sigstore project.'
comments: 'Tagged independently verifiable: a signature over the model''s file digests checks offline or against
  Sigstore''s transparency log.'
github:
- url: https://github.com/sigstore/model-transparency
pypi:
- url: https://pypi.org/project/model-signing/
