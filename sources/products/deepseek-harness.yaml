name: deepseek-harness
display_name: DeepSeek Harness
type: software
description: DeepSeek Harness (dsh) is an agent harness that reads and edits workspace files, runs commands, delegates
  work to sub-agents and keeps a plan. It runs as a local Web UI, a desktop app, a headless command, an Agent Client
  Protocol server or behind TypeScript and Python SDKs. Everything from the agent loop to tools, model adapters and
  sandboxing is a plugin on the Cordis framework. DeepSeek develops it, and it is in developer preview.
comments: Read against the master branch. The Python SDK on PyPI bundles its own copy of the dsh command and is not
  declared here, so its installs are not in the adoption figure.
github:
- url: https://github.com/deepseek-ai/deepseek-harness
npm:
- url: https://www.npmjs.com/package/@deepseek-ai/dsh
