name: so-101
display_name: SO-101 arm
type: hardware
description: SO-101 is a low-cost, 3D-printable six-degree-of-freedom robot arm designed by The Robot Studio with
  Hugging Face, sold as a leader and follower pair for teleoperated data collection with the LeRobot library. The
  repository publishes STEP and STL files for every part, and a two-arm kit costs about $230 in parts or ships ready-made
  from several vendors.
github:
- url: https://github.com/TheRobotStudio/SO-ARM100
comments: The same repository also carries the previous generation, SO-100, which is not a separate entry.
