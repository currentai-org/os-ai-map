name: confer
display_name: Confer
type: software
description: End-to-end encrypted AI chat assistant from Confer Labs. Prompts are encrypted on the device and
  sent over Noise-protocol pipes into a Trusted Execution Environment on a confidential VM, processed by open-weights
  models, then re-encrypted before leaving; history is encrypted with passkey-derived keys. Remote attestation,
  reproducible builds and an append-only transparency log are what make the claim checkable.
github:
- url: https://github.com/ConferLabs/confer-proxy
  not_primary_channel: The product's server-side component repository; people use the hosted service rather
    than the code. Its star count measures attention to the code rather than use of the product, so it is not
    the channel adoption is read from; the band rests on reported traction.
