name: ovis
display_name: Ovis
type: model
description: Ovis (Open VISion) is a multimodal model line, first published by Alibaba's AIDC-AI team and now under
  the ATH-MaaS account, built on an architecture that structurally aligns visual and textual embeddings. Ovis2.6,
  the current release, moves the language backbone to a mixture-of-experts model with about 3B active parameters,
  reads images up to 2880×2880 pixels in a 64K-token context, and can crop and rotate an image while it reasons
  about it.
