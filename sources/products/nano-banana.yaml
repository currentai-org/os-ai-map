name: nano-banana
display_name: Nano Banana (Gemini Image)
type: model
description: Nano Banana is Google's name for Gemini's native image generation and editing models, served through
  the Gemini app, Google products and the Gemini API. The line spans a premium Pro model, a general Flash model
  with 4K output and a low-cost Lite model, and it generates and edits images conversationally from text, image
  or video input.
