name: ddgs
display_name: DDGS
type: software
description: Metasearch library that runs one query against ten public web search services - Bing, Brave, DuckDuckGo,
  Google, Grokipedia, Mojeek, Startpage, Yandex, Yahoo and Wikipedia - and returns their results in one list.
  Ships a CLI, an optional FastAPI server and an optional MCP server, all run by the caller with no account
  and no key.
github:
- url: https://github.com/deedy5/ddgs
pypi:
- url: https://pypi.org/project/ddgs
comments: 'Formerly `duckduckgo_search`; DuckDuckGo is now one backend of ten, so the DuckDuckGo framing the
  name still carries is wrong and the display name follows the repository. `deedy5` is an individual GitHub
  account rather than an organization. Two things worth knowing before this is read as an ordinary MIT library:
  what it does to Bing, Google, Brave and Startpage is scraping those engines have not sanctioned, and the
  README''s entire disclaimer is the single line "This library is for educational purposes only" - which sits
  in the README and not in the LICENSE, so it does not narrow the MIT grant. Verified 2026-09-17 via the GitHub
  API, the README and the LICENSE.md body.'
