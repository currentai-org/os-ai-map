name: silero-vad
display_name: Silero VAD
type: software
description: A small pretrained voice activity detector that processes a 30 ms audio chunk in under a millisecond
  on one CPU thread. It ships as PyTorch and ONNX models with a Python package and runs wherever ONNX Runtime does,
  including the browser.
