name: khmer-speech-dataset
display_name: Khmer ASR Cultural Dataset
type: dataset
description: Khmer ASR Cultural Dataset is a speech corpus of about 728 hours of Khmer read by native speakers,
  paired with transcripts, for training speech recognition and related models. Twelve speakers from Cambodia
  (five women, seven men) recorded sentences written around 61 cultural topics and 1,749 subtopics, averaging
  eight seconds per clip, with speaker gender, age group and origin city attached. Digital Divide Data built
  and published it.
huggingface_dataset:
- url: https://huggingface.co/datasets/Digital-Divide-Data/khmer-speech-dataset
