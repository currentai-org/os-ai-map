name: pixart
display_name: PixArt
type: model
description: PixArt is a family of open text-to-image diffusion transformers from the PixArt-alpha research team. PixArt-α
  (2023) was followed by PixArt-Σ (Sigma, 2024), which uses a T5 text encoder and builds on its predecessor's weights
  to generate images at up to 4K resolution.
