- url: https://huggingface.co/PixArt-alpha/PixArt-XL-2-1024-MS
- url: https://huggingface.co/PixArt-alpha/PixArt-XL-2-512x512
arxiv:
- url: https://arxiv.org/abs/2403.04692
comments: 'Dormant: no release since the PixArt-Σ 2K checkpoint of April 2024, and both repositories were last updated
  in October 2024. Diffusers supports the models natively.'
