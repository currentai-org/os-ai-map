name: nemotron-embed
display_name: Nemotron Embed
type: model
description: Nemotron Embed is NVIDIA's text embedding line for retrieval-augmented generation. The Nemotron-3-Embed
  release ships 1B and 8B bidirectional encoders with average pooling and 2048-dimension output, in BF16 and
  NVFP4 builds, and the preceding generation, llama-embed-nemotron-8b and llama-nemotron-embed-1b-v2, is still
  distributed. The line is tuned for multilingual and cross-lingual retrieval and evaluated on RTEB, MMTEB
  retrieval and the text split of ViDoRe-V3.
huggingface_model:
- url: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-BF16
- url: https://huggingface.co/nvidia/Nemotron-3-Embed-8B-BF16
- url: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-NVFP4
- url: https://huggingface.co/nvidia/llama-embed-nemotron-8b
- url: https://huggingface.co/nvidia/llama-nemotron-embed-1b-v2
comments: The Hub's license tag reads `other` for every Nemotron Embed checkpoint; the terms are in each generation's
  own license text.
