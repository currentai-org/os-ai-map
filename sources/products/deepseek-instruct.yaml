name: deepseek-instruct
display_name: DeepSeek-V4-Pro / V4-Flash
type: model
aliases:
- deepseek-v4-pro-v4-flash
description: DeepSeek-V4-Pro and V4-Flash are open-weight mixture-of-experts language models with a one-million-token
  context window. V4-Pro has 1.6T total parameters (49B active) and V4-Flash has 284B (13B active). Both are
  published on Hugging Face by DeepSeek.
huggingface_model:
- url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro
- url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash
comments: Declares both instruct checkpoints, V4-Pro and V4-Flash, and sums their downloads for adoption. The
  deepseek record in base_pretrained declares the same two alongside the V3 and base checkpoints.
