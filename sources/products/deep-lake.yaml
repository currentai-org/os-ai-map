name: deep-lake
display_name: Deep Lake
type: software
description: 'Deep Lake is a database for AI built on a storage format designed for deep-learning access patterns,
  holding embeddings alongside the audio, text, video, image, DICOM and PDF records they were derived from. It serves
  two jobs from one store: vector and metadata retrieval for LLM applications, and dataset management and streaming
  for training. Activeloop develops it, with a C++ core, a Postgres integration and Python bindings in the repository.'
