name: aksharantar
display_name: Aksharantar
type: dataset
languages: [asm, ben, brx, doi, guj, hin, kan, kas, kok, mai, mal, mar, mni, nep, ori, pan, san, snd, tam,
  tel, urd]
description: Aksharantar is a transliteration corpus of about 26 million word pairs between English romanization
  and 21 Indic languages written in 12 scripts. Most pairs were mined from monolingual and parallel corpora
  such as IndicCorp and Samanantar, and human annotators added transliterated words and named entities, plus
  a test set of 103,000 pairs. AI4Bharat built it alongside the IndicXlit transliteration model.
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/Aksharantar
arxiv:
- url: https://arxiv.org/abs/2205.03018
