name: d-fine
display_name: D-FINE
type: model
description: D-FINE is a real-time object detector in the DETR family that recasts bounding-box regression as fine-grained
  refinement of distributions over box edges, and adds a localization self-distillation step that costs nothing
  extra at inference. It comes in Nano to X sizes, trained on COCO or pretrained on Objects365, with training code
  and configs for fine-tuning on custom datasets.
github:
- url: https://github.com/Peterande/D-FINE
huggingface_model:
- url: https://huggingface.co/ustc-community/dfine-xlarge-obj365
- url: https://huggingface.co/ustc-community/dfine-xlarge-coco
- url: https://huggingface.co/ustc-community/dfine-large-coco
- url: https://huggingface.co/ustc-community/dfine-xlarge-obj2coco
arxiv:
- url: https://arxiv.org/abs/2410.13842
comments: The Hugging Face checkpoints are Transformers conversions published under a University of Science and
  Technology of China account; the repository's own checkpoints download from GitHub release assets.
