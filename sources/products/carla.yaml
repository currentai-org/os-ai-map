name: carla
display_name: CARLA
type: software
description: CARLA is an open-source simulator for autonomous driving research, built on Unreal Engine, for developing,
  training and validating driving systems. It supplies open urban maps, buildings and vehicles, configurable sensor
  suites and environmental conditions, and a Python API for controlling every actor. It is developed at the Computer
  Vision Center of the Universitat Autònoma de Barcelona.
github:
- url: https://github.com/carla-simulator/carla
pypi:
- url: https://pypi.org/project/carla
  not_primary_channel: The Python client API that talks to a separately built or downloaded CARLA server; installing
    it is not running the simulator.
comments: The pip package named carla is the Python client for a separately run CARLA server, so its installs are
  not counted as use of the simulator.
