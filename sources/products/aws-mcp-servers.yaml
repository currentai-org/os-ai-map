name: aws-mcp-servers
display_name: AWS MCP Servers
type: software
description: AWS's own suite of MCP servers - 58 of them across infrastructure, data, machine learning, developer
  tooling, messaging and cost - each exposing one AWS service to an agent over stdio, using the caller's existing
  AWS credentials.
github:
- url: https://github.com/awslabs/mcp
comments: 'Each server publishes its own PyPI distribution (`awslabs.core-mcp-server` and so on) rather than
  one package for the suite, so there is no single artifact to band and adoption rests on stars. Worth knowing
  for a later re-read: the README announces the Agent Toolkit for AWS as "the successor to the MCP servers,
  plugins, and skills available on AWS Labs", while saying this repository "continues to work and accept contributions".'
