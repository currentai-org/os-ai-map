name: florence-2
display_name: Florence-2
type: model
description: Florence-2 is Microsoft's prompt-based vision foundation model, in 0.23B and 0.77B sizes, that performs
  captioning, object detection, phrase grounding, dense region captioning and OCR from short task tokens. It was
  trained on FLD-5B, a set of 5.4 billion annotations over 126 million images, and fine-tuned variants cover downstream
  tasks.
huggingface_model:
- url: https://huggingface.co/microsoft/Florence-2-large
- url: https://huggingface.co/microsoft/Florence-2-base
- url: https://huggingface.co/microsoft/Florence-2-large-ft
arxiv:
- url: https://arxiv.org/abs/2311.06242
