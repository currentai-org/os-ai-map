name: fara
display_name: Fara
type: model
description: Fara is Microsoft's family of computer-use agent models, which look at webpages and act by scrolling,
  typing and clicking at predicted coordinates without accessibility trees. Fara1.5 comes in 4B, 9B and 27B sizes
  built on Qwen3.5 and trained on data from the FaraGen1.5 pipeline, and can pause to ask the user before irreversible
  actions. Fara-7B was the first release.
