name: openml
display_name: OpenML
type: software
description: OpenML is an open platform for sharing machine learning datasets together with the tasks, pipelines
  and experiment runs built on them. Anyone can upload a dataset from a dataframe; OpenML stores it in a uniform
  format under an ID and version, computes its data characteristics, and serves it to Python, R and Java clients.
  It is run as a community project represented by the not-for-profit Open Machine Learning Foundation.
github:
- url: https://github.com/openml/OpenML
comments: Scored as the hosted platform at openml.org. Its PHP backend is in maintenance mode while a Python rewrite
  of the server is developed in a separate repository.
