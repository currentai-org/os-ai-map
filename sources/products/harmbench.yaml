name: harmbench
display_name: HarmBench
type: software
description: HarmBench is a standardized evaluation framework for automated red-teaming of large language models.
  It runs one pipeline that scores attack methods against target models, or models against attacks, so red-team
  attacks and defenses can be compared on equal terms and developed together. Its initial release covered 18
  attack methods and 33 target models and defenses. It is built by the Center for AI Safety.
github:
- url: https://github.com/centerforaisafety/HarmBench
