name: perplexity-sonar-api
display_name: Perplexity Sonar API
type: software
description: Perplexity's Sonar API is a search-augmented LLM API that combines real-time web search with model
  reasoning to produce answers with citations. Where a search API returns raw results, Sonar returns a synthesized,
  cited answer, and Perplexity's developer platform also offers a separate Search API for raw ranked results.
  It is offered alongside Perplexity's consumer product.
