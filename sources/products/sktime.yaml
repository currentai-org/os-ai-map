name: sktime
display_name: sktime
type: software
description: Python library with one scikit-learn-style interface across time-series learning tasks - forecasting,
  classification, regression, clustering, anomaly and changepoint detection - and tools for pipelining, ensembling,
  tuning and reduction between them. It interfaces statsmodels, Prophet, PyOD and other libraries alongside its
  own estimators. A consensus-governed community project, with support services sold by a separate company.
github:
- url: https://github.com/sktime/sktime
pypi:
- url: https://pypi.org/project/sktime
