name: eomt
display_name: EoMT
type: model
description: EoMT (Encoder-only Mask Transformer) is an image segmentation model that turns a plain Vision Transformer
  into a segmenter without adapters or decoders, by passing segmentation queries through the encoder alongside the image
  patches. Built on DINOv2 or DINOv3 backbones, it handles semantic, instance and panoptic segmentation and is available
  in Hugging Face Transformers. It comes from the Mobile Perception Systems Lab at Eindhoven University of Technology.
