name: promptlayer
display_name: PromptLayer
type: software
description: PromptLayer is a prompt management and monitoring platform that logs LLM API requests with their
  prompts, responses, cost and latency. It provides a prompt registry with versioning and a no-code editor,
  traces including OpenTelemetry ingestion, and evaluations over datasets. It is reached over an API key, with
  an open-source client library and a self-hosted option on the Enterprise plan.
github:
- url: https://github.com/MagnivOrg/prompt-layer-library
pypi:
- url: https://pypi.org/project/promptlayer
