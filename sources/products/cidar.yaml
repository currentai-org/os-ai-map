name: cidar
display_name: CIDAR
type: dataset
description: CIDAR (Culturally Relevant Instruction Dataset for Arabic) holds 10,000 Arabic instruction and
  response pairs for tuning language models. About 9,109 come from the Alpagasus set translated into Arabic
  with ChatGPT and about 891 are native Arabic grammar questions from Al Jazeera's Ask the Teacher site; about
  12 reviewers corrected every pair for cultural fit. ARBML publishes it with two 100-item evaluation sets.
github:
- url: https://github.com/ARBML/CIDAR
huggingface_dataset:
- url: https://huggingface.co/datasets/arbml/CIDAR
- url: https://huggingface.co/datasets/arbml/CIDAR-EVAL-100
- url: https://huggingface.co/datasets/arbml/CIDAR-MCQ-100
arxiv:
- url: https://arxiv.org/abs/2402.03177
comments: The two companion evaluation sets, CIDAR-EVAL-100 and CIDAR-MCQ-100, are part of the same release
  and are counted with the main set.
