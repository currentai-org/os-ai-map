name: claude-haiku
display_name: Claude Haiku
type: model
description: Claude Haiku is Anthropic's small, fast tier, built for high-volume, low-latency coding and chat
  where cost and speed matter more than peak reasoning. It sits beneath Sonnet and Opus, and the name persists
  across successive generations rather than pinning to one release. Weights are closed, and it is available
  through the Anthropic API and the Claude apps.
comments: Tier entry covering successive Haiku generations; Haiku 4.5 is the release scored.
