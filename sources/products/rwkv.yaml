name: rwkv
display_name: RWKV
type: model
description: RWKV is an open-weights model family whose architecture runs as a recurrent network at inference
  yet trains in parallel like a transformer, giving linear-time inference, constant memory with no KV cache
  and effectively unbounded context. The RWKV-7 Goose generation, which includes the G1 models, adds dynamic
  state evolution that its paper argues gives it more expressive power than standard attention.
