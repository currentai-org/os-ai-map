name: openguardrails
display_name: OpenGuardrails
type: software
description: OpenGuardrails publishes an open safety and manipulation-detection model, a 3.3B quantized LLM
  covering content safety, prompt injection, jailbreak, code-interpreter abuse and data leakage across 119
  languages. The project also maintains OGR, an Apache-2.0 vendor-neutral protocol for agent safety with reference
  runtimes, Python and JavaScript SDKs, gateway and sandbox integrations, and a detector benchmark. The same
  team sells a commercial runtime built on the protocol, as SaaS or a licensed private deployment.
