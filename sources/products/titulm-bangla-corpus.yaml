name: titulm-bangla-corpus
display_name: TituLM Bangla corpus
type: dataset
description: The TituLM Bangla corpus is a Bangla pretraining text corpus of about 20 billion tokens in 31
  million documents. Most of it is Common Crawl text extracted with Trafilatura and filtered on 20 quality
  signals, and the rest is English news machine-translated into Bangla plus romanized Bangla, both produced
  with a fine-tuned NLLB model. Hishab released it alongside its TituLLMs Bangla language models.
huggingface_dataset:
- url: https://huggingface.co/datasets/hishab/titulm-bangla-corpus
arxiv:
- url: https://arxiv.org/abs/2502.11187
