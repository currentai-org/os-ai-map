name: pmdarima
display_name: pmdarima
type: software
description: Python equivalent of R's auto.arima, which searches ARIMA and seasonal ARIMA orders for a time
  series automatically. Around that search it adds stationarity and seasonality tests, differencing, Box-Cox
  and Fourier transformers, pipelines and time-series cross-validation, with a scikit-learn-style interface
  over statsmodels.
github:
- url: https://github.com/alkaline-ml/pmdarima
