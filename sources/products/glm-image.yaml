name: glm-image
display_name: GLM-Image
type: model
description: GLM-Image is Z.ai's open image generation model, released in January 2026. A 9B autoregressive generator built
  from GLM-4-9B lays out the image as visual tokens and a 7B diffusion decoder renders them, which makes it strong at legible
  text inside images and at knowledge-heavy prompts such as posters and diagrams. The same model edits images, transfers styles
  and keeps subjects consistent across images.
github:
- url: https://github.com/zai-org/GLM-Image
huggingface_model:
- url: https://huggingface.co/zai-org/GLM-Image
comments: The weights are MIT-licensed and the repository code Apache 2.0; the vision tokenizer and encoder weights it carries
  come from X-Omni under Apache 2.0. Z.ai also serves GLM-Image through its API. CogView, Z.ai's earlier image line, is not
  part of this entry.
