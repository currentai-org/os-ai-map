description: IndicQA is a reading-comprehension test in 11 Indian languages. Annotators wrote questions in each
  language about Wikipedia paragraphs on Indian history, culture and public figures, and marked the answer span
  in the paragraph; some questions have no answer in the text. AI4Bharat created it for the IndicXTREME benchmark
  and publishes it on its own on the Hub.
