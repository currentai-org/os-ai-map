name: cutlass
display_name: CUTLASS
type: software
description: CUTLASS is a collection of C++ template abstractions for implementing matrix-matrix multiplication
  and related computations at every level of the CUDA parallelization hierarchy. Tiling sizes, data types and algorithmic
  policy are template parameters, so kernels are specialized and tuned rather than hand-written. Compilers and kernel
  libraries build their GEMM paths on it.
