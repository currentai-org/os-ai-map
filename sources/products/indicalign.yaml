name: indicalign
display_name: IndicAlign
type: dataset
description: IndicAlign is an instruction-tuning and safety-alignment collection of about 74.7 million prompt-response
  pairs in 14 Indic languages. It pools translated and romanized English sets such as Dolly and OpenAssistant,
  instruction pairs built from IndoWordNet entries, crowd-sourced Anudesh prompts, Wikipedia-grounded conversations
  generated with Llama 2, and toxic prompts paired with refusals. AI4Bharat released it with Sangraha as part
  of IndicLLMSuite.
github:
- url: https://github.com/AI4Bharat/IndicLLMSuite
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/indic-align
arxiv:
