name: mistral-vibe
display_name: Mistral Vibe
type: software
description: Mistral Vibe is a terminal coding agent that reads and edits files, runs shell commands, searches
  code and delegates work to subagents. It runs interactively, as a non-interactive command for scripts, or inside
  editors through the Agent Client Protocol, and extends through MCP servers, skills and hooks. Mistral's hosted
  models are the default, though local models and other compatible API keys also work. Mistral AI develops it.
comments: Mistral's site sells this as Vibe for code, inside the Vibe product that replaced Le Chat, which keeps
  its own entry. The optional Rust terminal client's Cargo manifest says "Proprietary", but the repository's only
  license file is Apache-2.0, and the entry reads that.
github:
- url: https://github.com/mistralai/mistral-vibe
pypi:
- url: https://pypi.org/project/mistral-vibe/
