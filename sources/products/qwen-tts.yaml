name: qwen-tts
display_name: Qwen3-TTS
type: model
description: 'Alibaba''s Qwen3-TTS open text-to-speech models (1.7B and 0.6B) built on a 12 Hz speech tokenizer:
  three-second voice cloning, preset custom voices and voice design from a text description, in 10 languages.'
github:
- url: https://github.com/QwenLM/Qwen3-TTS
pypi:
- url: https://pypi.org/project/qwen-tts/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-Base
- url: https://huggingface.co/Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
