name: moshi
display_name: Moshi
type: model
description: 'Kyutai''s speech-text foundation model and full-duplex spoken dialogue system: it listens and speaks
  at the same time, with about 200 ms of practical latency, using the Mimi streaming audio codec. Released as the
  Moshiko and Moshika voices for PyTorch, MLX and Rust.'
github:
- url: https://github.com/kyutai-labs/moshi
pypi:
- url: https://pypi.org/project/moshi/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/kyutai/moshiko-pytorch-bf16
- url: https://huggingface.co/kyutai/moshika-pytorch-bf16
- url: https://huggingface.co/kyutai/moshiko-candle-q8
arxiv:
- url: https://arxiv.org/abs/2410.00037
comments: Weights are CC-BY-4.0; the Python code is MIT and the Rust backend Apache-2.0. One gated research checkpoint,
  moshika-rl-seamless, is CC-BY-NC-4.0 and is not in the release the README lists.
