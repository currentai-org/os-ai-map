name: depth-pro
display_name: Depth Pro
type: model
description: 'Depth Pro is Apple''s monocular depth model: from a single image it produces a metric depth map, with
  absolute scale, and estimates the camera''s focal length without needing camera metadata. A multi-scale Vision
  Transformer built on DINOv2 encoders does the work, and the repository''s model is a re-trained reference implementation
  close to, but not matching, the paper''s. A Transformers-format checkpoint is also on the Hugging Face Hub.'
github:
- url: https://github.com/apple-aiml-research/ml-depth-pro
huggingface_model:
- url: https://huggingface.co/apple/DepthPro-hf
- url: https://huggingface.co/apple/DepthPro
arxiv:
- url: https://arxiv.org/abs/2410.02073
