name: aegis-agentguard
display_name: Aegis (AgentGuard)
type: software
description: Aegis is a pre-execution firewall for AI agents' tool calls. An SDK hook or proxy sends each call to
  a self-hosted gateway that classifies it, checks it against policy, and allows it, blocks it or holds it for a
  reviewer in the Compliance Cockpit. Allowed calls carry Ed25519-signed receipts and enter a Merkle transparency
  log. Aojie (Justin) Yuan built it at USC's FORTIS Lab.
github:
- url: https://github.com/Justin0504/Aegis
