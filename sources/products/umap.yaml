name: umap
display_name: UMAP
type: software
description: Uniform Manifold Approximation and Projection, a non-linear dimension reduction method used for
  visualization in the way t-SNE is and for general embedding of high-dimensional data. The umap-learn package
  implements it with a scikit-learn interface and adds supervised and semi-supervised embedding, densMAP, AlignedUMAP
  for data that changes over time, and Parametric UMAP, which trains a neural network to learn the mapping.
github:
- url: https://github.com/lmcinnes/umap
pypi:
- url: https://pypi.org/project/umap-learn
