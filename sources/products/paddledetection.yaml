name: paddledetection
display_name: PaddleDetection
type: software
description: PaddleDetection is an object detection development kit on Baidu's PaddlePaddle framework, covering
  object detection, instance segmentation, keypoint detection and multi-object tracking. Its model zoo holds the
  PP-YOLOE and PicoDet detector families, RT-DETR and DEIM models among more than 300 pretrained models, and it
  ships ready-made pipelines such as PP-Human for pedestrian analysis and PP-Vehicle for traffic scenes.
github:
- url: https://github.com/PaddlePaddle/PaddleDetection
comments: The paddledet package on PyPI was last updated in February 2023 and is several releases behind the repository,
  so it is not declared.
