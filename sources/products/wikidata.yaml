name: wikidata
display_name: Wikidata
type: dataset
description: The structured knowledge base behind Wikipedia, built by volunteers as items, properties and
  statements with references, and labeled in hundreds of languages. The Wikimedia Foundation publishes full
  dumps every week as JSON and as RDF in Turtle and N-Triples, along with a smaller truthy dump of
  best-ranked facts. Language-model work uses it for knowledge grounding, entity linking and verbalized
  training text.
