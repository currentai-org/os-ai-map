name: you-com-search-api
display_name: You.com Web Search API
type: software
description: Web search API returning structured results for AI applications. Results carry keyword snippets
  by default, and an extraction mode on the same endpoint returns the whole page as markdown or the passages
  that address the query. One of six separately metered APIs You.com sells.
pypi:
- url: https://pypi.org/project/youdotcom
github:
- url: https://github.com/youdotcom-oss
comments: Scored as the Web Search API alone, which is what the slug names. You.com meters six separate APIs
  on one account - Web Search at $5 per 1,000 calls, full-page extraction as a $1 per 1,000 pages add-on, Contents,
  Answer, Research and Finance Research each at their own price - and the Answer API's cited answers belong
  to a different line item. The documentation HTML is a JavaScript shell; the `.md` variant of each page is
  what was read.
