name: norwegian-colossal-corpus
display_name: Norwegian Colossal Corpus
type: dataset
description: The Norwegian Colossal Corpus (NCC) is a Norwegian pretraining corpus, mainly Bokmål and Nynorsk,
  drawn from books and newspapers digitized by the National Library, government reports, parliament collections,
  public-sector websites and Wikipedia, with each document tagged by source type and year. Newspapers distributed
  under the Språkbank agreement were withdrawn at the request of media houses, leaving about 4.6 billion words.
  The National Library of Norway AI Lab builds it.
github:
- url: https://github.com/NbAiLab/notram
huggingface_dataset:
- url: https://huggingface.co/datasets/NbAiLab/NCC
arxiv:
- url: https://arxiv.org/abs/2104.09617
