name: cogvideo
display_name: CogVideo
type: model
description: CogVideo is Z.ai's line of open text-to-video and image-to-video diffusion models. Its current generation,
  CogVideoX1.5 (November 2024), generates 5- or 10-second clips at up to 1360x768 from a prompt or a starting image;
  the earlier CogVideoX-2B and 5B models remain available.
github:
- url: https://github.com/zai-org/CogVideo
huggingface_model:
- url: https://huggingface.co/zai-org/CogVideoX1.5-5B
- url: https://huggingface.co/zai-org/CogVideoX1.5-5B-I2V
- url: https://huggingface.co/zai-org/CogVideoX-5b
- url: https://huggingface.co/zai-org/CogVideoX-5b-I2V
- url: https://huggingface.co/zai-org/CogVideoX-2b
arxiv:
- url: https://arxiv.org/abs/2408.06072
comments: No CogVideo model has followed CogVideoX1.5, and the repository was last updated in November 2025. CogVideoX-2B
  is Apache 2.0; every 5B checkpoint, including both CogVideoX1.5 models, ships under the CogVideoX License, which allows
  free commercial use after registering with Z.ai, up to one million visits a month.
