name: openlake
display_name: OpenLake
type: software
description: 'OpenLake is a distributed storage engine for LLM inference and GPU training, built in Rust on io_uring
  and aimed at small-I/O throughput and sub-millisecond reads. Two surfaces sit on the same engine: an offload pool
  that spills KV cache off GPU nodes, and a petabyte-scale S3-compatible object store. A vLLM connector ships in
  the repository.'
