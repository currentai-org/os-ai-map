name: pycaret
display_name: PyCaret
type: software
description: Low-code machine-learning library that wraps scikit-learn, XGBoost, LightGBM, CatBoost and other
  libraries behind a few calls. After a setup step it trains and ranks every applicable model with one function,
  then tunes, blends, evaluates and deploys the chosen pipeline, for classification, regression, clustering,
  anomaly detection and time-series forecasting. The 4.0 line in development adds a web control plane and moves
  the engine to the Functional Source License.
github:
- url: https://github.com/pycaret/pycaret
