name: determined-ai
display_name: Determined
type: software
description: Machine-learning platform for distributed training, hyperparameter search and experiment tracking
  on a cluster it manages itself. An experiment configuration names slots_per_trial, and Determined's scheduler
  allocates that many GPUs - spanning whole agent machines where the number requires it - so every trial starts
  with all its resources at once. Searchers run many trials against one configuration.
github:
- url: https://github.com/determined-ai/determined
pypi:
- url: https://pypi.org/project/determined/
comments: 'Acquired by HPE, where it ships as Machine Learning Development Environment. The open repository''s
  last push is 2025-03-20 and docs.determined.ai no longer resolves in DNS - two separate observations, recorded
  as such: a documentation site going away is not itself evidence the project is abandoned. Capability is cited
  against the in-tree documentation, which is reachable.'
