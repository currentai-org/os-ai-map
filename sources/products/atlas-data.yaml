name: atlas-data
display_name: ATLAS
type: software
description: ATLAS is AI Singapore's catalog of datasets for underrepresented languages, centered on Southeast Asia,
  which researchers search and filter by language, modality, license and task. Contributors import a dataset from
  its Hugging Face card or upload files of up to 5 GB, and the ATLAS team reviews each submission before it is published
  with its own dataset ID. An MCP server gives agents read-only search over the catalog. AI Singapore, a national
  programme hosted by Nanyang Technological University, builds and runs it.
comments: Added at Current AI's request in October 2026, with AI Singapore credited as its source. It catalogs datasets
  rather than models; model_hubs records the ruling that admits it.
