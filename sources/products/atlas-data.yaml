name: atlas-data
display_name: ATLAS
type: software
description: ATLAS is AI Singapore's catalog of datasets for underrepresented languages, centered on Southeast Asia.
  It describes each dataset by language, modality, license and task, imports dataset cards from Hugging Face, and
  publishes contributions after a human review. A chat search and a read-only MCP API let people and agents query
  the catalog, and coverage maps show which languages still lack data.
comments: Scored as the hosted catalog at atlas-data.ai.
