name: minicpm-v
display_name: MiniCPM-V
type: model
description: MiniCPM-V is OpenBMB's line of small vision-language models built to run on phones and other edge devices.
  The models read single images, several images at once and video, and the current MiniCPM-V 4.6 pairs a SigLIP2-400M
  encoder with a Qwen3.5-0.8B language model and supports tool calling. The line is separate from OpenBMB's text
  MiniCPM models and shares its repository with the omni-modal MiniCPM-o.
