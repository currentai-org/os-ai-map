name: usearch
display_name: USearch
type: software
description: USearch is a single-file similarity search and clustering engine implementing HNSW over user-defined
  metrics, including spatial, binary and probabilistic distances. The C++ header compiles into bindings for a dozen
  languages and runs on desktop, mobile, WebAssembly and inside SQLite. Unum develops it.
