name: kokoro
display_name: Kokoro
type: model
description: An 82-million-parameter open-weight text-to-speech model with dozens of preset voices across English,
  Spanish, French, Hindi, Italian, Japanese, Brazilian Portuguese and Mandarin. Small enough to run on a CPU, it
  is widely deployed in local apps and commercial APIs.
github:
- url: https://github.com/hexgrad/kokoro
pypi:
- url: https://pypi.org/project/kokoro/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/hexgrad/Kokoro-82M
comments: Maintained by the individual developer hexgrad; the kokoro Python package is the inference library.
