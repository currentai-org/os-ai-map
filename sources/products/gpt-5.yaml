version_in_identity: same, and the o-series sits beside it rather than under it
description: GPT-5 is OpenAI's general-purpose model line, launched in August 2025 and continued through GPT-5.2,
  GPT-5.4 and GPT-5.5 (April 2026), with low-latency Instant variants and the coding-focused GPT-5.3-Codex.
  The models are served through the OpenAI API and ChatGPT. GPT-5.6 and the GPT-6 family have since followed.
comments: OpenAI's launch post could not be retrieved, so the capability figures are vendor-reported and unchecked
  against it.
