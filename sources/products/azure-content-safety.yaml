name: azure-content-safety
display_name: Azure AI Content Safety
type: software
description: Microsoft's content-safety service on Azure offers hosted APIs that moderate text and images across
  hate, sexual, violence and self-harm categories. It also provides Prompt Shields against direct and indirect
  prompt injection, groundedness detection, protected-material detection for copyrighted text and code, a task-adherence
  check for AI agents, and custom categories trained from examples. Preview containers run a subset of these
  checks outside Azure.
