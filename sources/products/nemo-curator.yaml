name: nemo-curator
display_name: NeMo Curator
type: software
description: 'GPU-accelerated toolkit for curating LLM training data across text, image, video, and audio:
  extraction, language ID, exact/fuzzy/substring deduplication, quality classification, and synthetic data
  generation. NVIDIA uses it for the Nemotron-4 pretraining data (8+ trillion tokens of multilingual web data)
  and the Nemotron-CC curation pipeline.'
github:
- url: https://github.com/NVIDIA-NeMo/Curator
pypi:
- url: https://pypi.org/project/nemo-curator
