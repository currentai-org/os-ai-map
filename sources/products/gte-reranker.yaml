name: gte-reranker
display_name: GTE Reranker
type: model
description: 'The reranking half of Alibaba''s GTE family: two cross-encoders that score query-document pairs
  for a retrieval pipeline rather than emit vectors. gte-reranker-modernbert-base is a 149M English model on
  a ModernBERT base reporting BEIR 56.19, LoCo 90.68 and CoIR 79.99 at 8,192 tokens. gte-multilingual-reranker-base
  is a 306M encoder-only reranker covering more than 70 languages at the same context, which its card describes
  as a 10x inference speedup over decoder-based rerankers.'
huggingface_model:
- url: https://huggingface.co/Alibaba-NLP/gte-reranker-modernbert-base
- url: https://huggingface.co/Alibaba-NLP/gte-multilingual-reranker-base
comments: Scope is the two reranker checkpoints in the Alibaba-NLP account. The gte-rerank service on Alibaba
  Cloud is a separate hosted product that the cards note is not identical to the open weights.
