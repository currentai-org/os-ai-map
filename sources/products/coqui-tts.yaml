name: coqui-tts
display_name: Coqui TTS
type: software
description: A Python library for training and running text-to-speech and voice-conversion models, among them XTTS, VITS,
  Tacotron and a range of vocoders, with pretrained voices and support for Meta's MMS models in about 1,100 languages. Idiap
  Research Institute maintains it as the coqui-tts package, a fork of Coqui's original repository, which is no longer maintained.
github:
- url: https://github.com/idiap/coqui-ai-TTS
pypi:
- url: https://pypi.org/project/coqui-tts
