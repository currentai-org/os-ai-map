name: uzu
display_name: Uzu
type: software
description: Uzu is a high-performance on-device inference engine for Apple platforms, running models locally on
  iOS and macOS against unified memory so that inference needs no network round trip and no per-token cost. It ships
  Python, TypeScript and Swift bindings in-repo.
github:
- url: https://github.com/trymirai/uzu
comments: The Rust and Swift distribution is primary, so the PyPI wrapper is not declared as an artifact. Verified
  2026-08-31 via GitHub, the LICENSE body and the repository README.
