name: gr00t
display_name: Isaac GR00T
type: model
description: Isaac GR00T is NVIDIA's open foundation model line for generalist robots, from GR00T N1 to N1.7. Current
  releases are three-billion-parameter vision-language-action models pretrained across robot embodiments for humanoid
  and bimanual manipulation, published with the code to train them and a guide to fine-tuning one onto a new robot.
