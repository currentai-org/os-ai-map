name: aistore
display_name: AIStore
type: software
description: AIStore is a distributed storage cluster built for AI workloads, presenting an S3-compatible object
  interface over local drives while also operating directly on remote cloud buckets. It scales out linearly, runs
  with or without Kubernetes, and offloads ETL and batch transformation into the storage layer so training jobs
  read transformed data in place. NVIDIA develops it.
