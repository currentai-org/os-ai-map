name: openmanus
display_name: OpenManus
type: software
description: OpenManus is an open reimplementation of the Manus autonomous agent, built by members of the MetaGPT
  team as a general agent that needs no invite code. It performs tasks through tools and browser automation,
  supports MCP, and adds a data-analysis agent. It is framed as a product run from a clone rather than a reusable
  library.
