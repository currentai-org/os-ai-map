comments: SkyReels V4 has no published weights. SkyReels V3 (January 2026; reference-to-video, video extension and talking-avatar
  models) and V2 (April 2025) remain downloadable under the Skywork Community License. The SkyReels-A1 and A2 portrait-animation
  models are a separate series and are not part of this entry.
