name: skyreels
display_name: SkyReels
type: model
description: SkyReels is Skywork AI's line of video generation models. The current release, SkyReels V4, described in
  February 2026, generates video and synchronized audio together from text, image, video and audio prompts at up to 1080p
  and 15 seconds, and also handles inpainting and editing. Earlier generations, through SkyReels V3, were published with
  weights.
