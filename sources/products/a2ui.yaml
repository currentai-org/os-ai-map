name: a2ui
display_name: A2UI
type: software
description: A2UI (Agent-to-User Interface) is an open protocol that lets an AI agent describe an interface as declarative
  JSON, which the client draws from its own catalog of trusted components instead of running code the agent wrote. Its
  repository holds the specification, renderers for Lit, Angular and React, and agent SDKs for Python and Dart, and messages
  travel over A2A or AG-UI. Google created it, with contributions from CopilotKit.
github:
- url: https://github.com/a2ui-project/a2ui
pypi:
- url: https://pypi.org/project/a2ui-agent-sdk
npm:
- url: https://www.npmjs.com/package/@a2ui/web_core
comments: 'Read against a2ui-project/a2ui, the home the project site, the contributing guide and every package''s metadata
  now name; the older google/A2UI path serves the same tree. Two packages are declared: the shared web core that every
  A2UI web renderer installs, and the Python agent SDK. The renderer packages and a2ui-core are left undeclared because
  each depends on, or is a dependency of, one of those two.'
