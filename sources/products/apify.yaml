name: apify
display_name: Apify
type: software
description: Apify is a web scraping and automation platform with a marketplace of tens of thousands of pre-built
  scrapers, called Actors, that target specific websites. It provides cloud infrastructure for running them
  at scale, proxy management and anti-bot handling, plus an MCP server that exposes Actors to agent clients.
  Crawlee, Apify's open-source crawling framework, is offered alongside the managed platform.
