name: segformer
display_name: SegFormer
type: model
description: SegFormer is a semantic segmentation model line from NVIDIA Research that pairs a hierarchical Transformer
  encoder, in sizes B0 to B5, with a lightweight all-MLP decoder. The encoders are pretrained on ImageNet-1K and
  the released checkpoints are fine-tuned on ADE20K and Cityscapes, with training and evaluation code built on MMSegmentation.
  NVIDIA's checkpoints are also on the Hugging Face Hub in Transformers format.
