name: hasher-matcher-actioner
display_name: Hasher-Matcher-Actioner
type: software
description: Hasher-Matcher-Actioner (HMA) is Meta's open-source service for finding copies of known harmful images
  and videos. It turns uploaded media into hashes, matches them against banks of previously identified content,
  and connects those banks to industry hash-sharing programs such as those run by NCMEC, GIFCT and StopNCII. HMA
  runs as a Docker container with a REST API and a PostgreSQL database, or as a Python library.
comments: Version 2.0, a full rewrite that replaced the original AWS-only deployment in March 2024, runs on any
  infrastructure that can run Docker. Its code lives in Meta's ThreatExchange repository beside the PDQ and TMK
  hashing algorithms and the python-threatexchange library, and its images are published to GitHub's container registry.
github:
- url: https://github.com/facebook/ThreatExchange
  not_primary_channel: The ThreatExchange monorepo, which also holds the PDQ, TMK and vPDQ hashing algorithms and
    the python-threatexchange library. Its star count covers all of those projects rather than HMA alone, so it
    is not the channel adoption is read from.
