name: galileo
display_name: Galileo
type: software
description: Galileo, now called Splunk Agent Observability, is an AI observability and reliability platform
  that combines offline evaluation, online production guardrails and tracing. Its Luna-2 small judge models
  detect hallucinations, tool errors and policy violations, and the vendor says customized evaluations can
  monitor all production traffic at a fraction of the cost of a large judge model. It deploys as SaaS, into
  a customer VPC, or on-premises.
