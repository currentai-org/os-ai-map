name: deepspeed
display_name: DeepSpeed
type: software
steward: pytorch-foundation
description: DeepSpeed is a deep-learning optimization library for efficient distributed training and inference
  of very large models. It provides ZeRO memory optimization, ZeRO-Infinity, 3D parallelism, Ulysses sequence
  parallelism and mixture-of-experts support, and has been used to train models such as BLOOM (176B) and Megatron-Turing
  NLG (530B). It integrates with Hugging Face Transformers, Accelerate and PyTorch Lightning.
github:
- url: https://github.com/deepspeedai/DeepSpeed
pypi:
- url: https://pypi.org/project/deepspeed/
