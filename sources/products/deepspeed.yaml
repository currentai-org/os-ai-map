name: deepspeed
display_name: DeepSpeed
type: software
description: DeepSpeed is a deep-learning optimization library for efficient distributed training and
  inference of very large models. It provides system-level innovations including ZeRO memory optimization,
  ZeRO-Infinity, 3D parallelism, and mixture-of-experts support, and has powered training of models like
  BLOOM (176B) and Megatron-Turing NLG (530B). It is maintained by Microsoft and integrates with Hugging
  Face Transformers, PyTorch Lightning, and others.
github:
