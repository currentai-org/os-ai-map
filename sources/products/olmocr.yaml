name: olmocr
display_name: olmOCR
type: software
description: Converts PDFs and images to clean markdown/text using a 7B vision-language model, handling
  equations, tables, and handwriting. Emits Dolma-format documents; used in the Dolma 3 PDF-extraction
  path.
