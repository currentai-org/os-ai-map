name: google-cloud-vision
display_name: Google Cloud Vision API
type: software
description: Google Cloud's hosted image-analysis API, answering REST and RPC calls with Google's pretrained models
  for labels, object localization, OCR and dense document text, faces, landmarks, logos, image properties and SafeSearch
  ratings. It is billed per feature per image. Custom models are a separate Google Cloud product, AutoML Vision,
  rather than part of this API.
