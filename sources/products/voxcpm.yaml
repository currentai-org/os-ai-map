name: voxcpm
display_name: VoxCPM
type: model
description: OpenBMB's tokenizer-free diffusion-autoregressive text-to-speech line. VoxCPM2 has 2 billion parameters,
  covers 30 languages at 48 kHz, and adds voice design and controllable voice cloning; full and LoRA fine-tuning
  are supported.
github:
- url: https://github.com/OpenBMB/VoxCPM
pypi:
- url: https://pypi.org/project/voxcpm/
  not_primary_channel: The inference package, which loads its weights from the Hugging Face repositories declared
    here, so installs of it are already counted among those repositories' downloads.
huggingface_model:
- url: https://huggingface.co/openbmb/VoxCPM2
