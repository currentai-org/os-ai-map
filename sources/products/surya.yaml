name: surya
display_name: Surya
type: software
description: OCR, layout analysis and reading-order engine from Datalab covering more than ninety languages.
  It detects text lines, classifies layout blocks, orders them for reading, and recognises tables - and it
  is the engine underneath the same team's Marker document pipeline rather than a competing end-to-end converter.
github:
- url: https://github.com/datalab-to/surya
pypi:
- url: https://pypi.org/project/surya-ocr/
comments: The code and the weights carry different licences; see the openness note. It is the engine Marker
  runs on, which is why the two are scored as separate products rather than one.
