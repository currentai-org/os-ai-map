name: searxng
display_name: SearXNG
type: software
description: SearXNG is a privacy-respecting metasearch engine that aggregates results from many search services
  without tracking or profiling users, and a community-run successor to the older searx project. It predates
  the LLM era and does no inference itself, but exposes a JSON API and runs on self-hosted infrastructure.
  Answer engines and RAG stacks such as Open WebUI, Perplexica, Morphic and LibreChat integrate it as a web-search
  provider.
github:
