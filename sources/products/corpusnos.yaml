name: corpusnos
display_name: CorpusNós
type: dataset
description: CorpusNós is a Galician pretraining corpus of about 1.9 billion tokens in 7.9 million documents,
  covering books, research articles, press and blogs, government texts, encyclopedic data, web crawls and translation
  corpora. It is split into public data and material obtained through transfer agreements with rights holders.
  Proxecto Nós builds it within the Spanish ILENIA program.
huggingface_dataset:
- url: https://huggingface.co/datasets/proxectonos/corpusnos
