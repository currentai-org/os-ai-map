name: musicgen
display_name: MusicGen
type: model
description: MusicGen is Meta's transformer model that generates instrumental music from a text description, and
  in its melody variants from a text description guided by a reference melody. It comes in 300M, 1.5B and 3.3B sizes
  with mono and stereo builds, plus style-conditioned and stem-separated variants, and runs through Meta's AudioCraft
  library.
