name: xdit
display_name: xDiT
type: software
description: xDiT is an inference engine that spreads image and video diffusion transformers across several GPUs or machines
  so that large models generate faster. It combines sequence parallelism, PipeFusion pipelining, classifier-free-guidance
  parallelism and a parallel VAE with caching and compilation speedups, and wraps Diffusers pipelines for FLUX, Qwen-Image,
  Wan, HunyuanVideo, LTX and other families. It installs from PyPI as xfuser.
github:
- url: https://github.com/xdit-project/xDiT
pypi:
- url: https://pypi.org/project/xfuser/
