name: voyage-rerank
display_name: Voyage Rerank
type: model
description: 'Voyage AI’s cross-encoder reranking line, led by rerank-3 and rerank-3-lite, with rerank-2.5
  and rerank-2.5-lite still served as older models: given a query and up to 1,000 candidate documents from
  a first-stage retriever, they return relevance scores that reorder the shortlist. All four carry a 32,000-token
  limit on query plus any single document, and the rerank-2.5 pair is multilingual and accepts a natural-language
  instruction attached to the query to steer relevance.'
comments: Voyage's docs list rerank-3 and rerank-3-lite as the current recommendation and place rerank-2.5
  and rerank-2.5-lite under older models, so the capability reading here comes from the previous generation.
