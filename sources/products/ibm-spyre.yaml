name: ibm-spyre
display_name: IBM Spyre Accelerator
type: hardware
description: IBM Spyre is an AI accelerator chip with 32 accelerator cores on a 75 W PCIe card, built to run inference
  beside the data held on IBM's own servers. It is sold as an adapter for IBM z17 and LinuxONE 5 mainframes, up
  to 48 cards per system, and for Power11 servers, up to 16.
