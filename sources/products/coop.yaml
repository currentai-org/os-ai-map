name: coop
display_name: Coop
type: software
description: Coop is a self-hosted review and moderation console from the nonprofit ROOST, run with Docker
  Compose. It provides review queues, routing, automated enforcement rules, analytics, and REST/GraphQL APIs,
  plus a child-safety workflow with HMA hash matching, NCMEC CyberTipline reporting, and OpenAI Moderation
  and Google Content Safety integrations. It orchestrates AI safety signals rather than being a guardrail model
  itself. Musubi offers a hosted version.
github:
- url: https://github.com/roostorg/coop
  not_primary_channel: The product's source repository. Its star count measures attention to the code rather
    than use of the product, so it is not the channel adoption is read from; the band rests on reported traction.
