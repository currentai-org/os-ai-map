name: xgboost
display_name: XGBoost
type: software
description: Optimized gradient-boosted decision tree library for classification, regression, ranking and survival
  analysis, running on a single machine, on GPUs, and distributed across Kubernetes, Spark, Dask and Ray. Bindings
  cover Python, R, the JVM and several other languages. It began as a University of Washington research project
  and is governed by a project management committee.
