name: vespa
display_name: Vespa
type: software
description: Vespa is a serving platform that stores, indexes and retrieves vectors, tensors, text and structured
  data in one system, and evaluates ranking models over the results at query time. Retrieval combines approximate
  nearest neighbour search with lexical matching and filtering, and inference runs inside the serving path rather
  than beside it. The repository builds and runs the whole system.
