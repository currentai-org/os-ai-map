name: zep
display_name: Zep
type: software
description: Zep is a hosted context and memory service for AI agents. It turns each user's messages, documents
  and business data into a temporal context graph and returns a prompt-ready context block for the next turn, with
  user and thread management, access policies, retention rules and connectors to company systems. Zep runs it in
  its own cloud or a customer's, built on its open Graphiti framework.
comments: Scored as the hosted service. Graphiti, the open graph framework inside it, is a separate entry.
pypi:
- url: https://pypi.org/project/zep-cloud
npm:
- url: https://www.npmjs.com/package/@getzep/zep-cloud
