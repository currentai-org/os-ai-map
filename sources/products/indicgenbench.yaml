name: indicgenbench
display_name: IndicGenBench
type: dataset
description: IndicGenBench is a benchmark of generation tasks for large language models in 29 Indic languages
  across 13 scripts, covering cross-lingual summarization, machine translation, and multilingual and cross-lingual
  question answering. It extends CrossSum, FLORES, XQuAD and XorQA by having people translate their English
  examples into each target language, which makes the test data multi-way parallel. Google Research releases
  it as four task sets.
github:
- url: https://github.com/google-research-datasets/indic-gen-bench
huggingface_dataset:
- url: https://huggingface.co/datasets/google/IndicGenBench_flores_in
- url: https://huggingface.co/datasets/google/IndicGenBench_xquad_in
- url: https://huggingface.co/datasets/google/IndicGenBench_xorqa_in
- url: https://huggingface.co/datasets/google/IndicGenBench_crosssum_in
