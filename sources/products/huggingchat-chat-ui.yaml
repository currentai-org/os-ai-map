name: huggingchat-chat-ui
display_name: HuggingChat / chat-ui
type: software
description: Chat UI is a SvelteKit and MongoDB chat interface built and maintained by Hugging Face, and the
  codebase behind HuggingChat at huggingface.co/chat. It connects to any OpenAI-compatible endpoint, such as
  Hugging Face Inference Providers, Ollama, llama.cpp or OpenRouter, and discovers the available models automatically.
  It supports MCP tool calling, image input, optional OpenID login, and an Omni router that picks a model by
  request type.
github:
- url: https://github.com/huggingface/chat-ui
comments: The original HuggingChat was retired on 1 July 2025 and relaunched as HuggingChat Omni, which routes
  across providers rather than serving one endpoint.
