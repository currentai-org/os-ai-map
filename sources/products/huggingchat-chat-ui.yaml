name: huggingchat-chat-ui
display_name: HuggingChat / chat-ui
type: software
description: SvelteKit chat interface built and maintained by Hugging Face, and the codebase behind HuggingChat
  at huggingface.co/chat. It routes across open-weights models from several inference providers, exposes an
  OpenAI-compatible API, supports MCP tools and multimodal input, and has first-class support for text-generation-inference
  endpoints.
github:
- url: https://github.com/huggingface/chat-ui
comments: The original HuggingChat was retired on 1 July 2025 and relaunched as HuggingChat Omni, which routes
  across providers rather than serving one endpoint. Verified 2026-08-13 via the huggingface/chat-ui repository
  and huggingface.co/chat.
