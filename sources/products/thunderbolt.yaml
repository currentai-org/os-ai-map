name: thunderbolt
display_name: Thunderbolt
type: software
description: Thunderbolt is an AI client for web, desktop and mobile that offers chat, search, research and
  reusable automations, with support for MCP servers and Agent Client Protocol agents. It connects to Anthropic,
  OpenAI, Mistral, Fireworks or any OpenAI-compatible model, including local Ollama and llama.cpp, and organizations
  run it on their own infrastructure. MZLA Technologies, the Mozilla Foundation subsidiary behind Thunderbird,
  builds it as a sovereign alternative to hosted enterprise assistants.
github:
- url: https://github.com/thunderbird/thunderbolt
comments: The project documentation says the software is in active development and not yet intended for production
  use.
