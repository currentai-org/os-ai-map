name: thunderbolt
display_name: Thunderbolt
type: software
description: Self-hosted AI client from MZLA Technologies, the Mozilla Foundation subsidiary behind Thunderbird,
  positioned as a sovereign alternative to hosted enterprise assistants. It provides chat, search, research
  and task automation across web and native apps on Linux, Windows, macOS, iOS and Android, integrating Anthropic,
  OpenAI, Mistral, OpenRouter and local Ollama models. Organizations run their own infrastructure rather than
  renting access.
github:
- url: https://github.com/thunderbird/thunderbolt
comments: The README still warns that the project is early and mid-security-audit. Verified 2026-08-13 via
  the thunderbird/thunderbolt repository and Phoronix's launch report.
