name: everos
display_name: EverOS
type: software
description: EverOS is a local-first memory library and server for agents that writes conversations, files and agent
  trajectories to Markdown, extracts episodes, atomic facts, user profiles and reusable agent skills from them,
  and indexes the result in SQLite and LanceDB for retrieval. A background reflection pass merges related episodes
  and archives the fragments it replaces. EverMind builds it, and it was formerly called EverMemOS.
