name: cendol-collection
display_name: Cendol Collection
type: dataset
description: Cendol Collection is the instruction-tuning data IndoNLP used to train the Cendol family of language
  models for Indonesian and the country's local languages. Version 1 holds task-specific prompts built from
  NLP datasets for sentiment analysis, translation, summarization and question answering. Version 2 adds general-knowledge
  and human-centric prompts used for the Cendol-Chat models. Both are described in the Cendol paper.
github:
- url: https://github.com/IndoNLP/cendol
huggingface_dataset:
- url: https://huggingface.co/datasets/indonlp/cendol_collection_v2
- url: https://huggingface.co/datasets/indonlp/cendol_collection_v1
arxiv:
- url: https://arxiv.org/abs/2404.06138
comments: Both dataset cards are copies of the Cendol model card and say little about how the prompts were
  assembled; the description relies on the model card's account of the two training stages.
