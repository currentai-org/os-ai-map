name: kazakh-speech-corpus-2
display_name: Kazakh Speech Corpus 2
type: dataset
description: Kazakh Speech Corpus 2 (KSC2) provides about 1,200 hours of transcribed Kazakh speech in over
  600,000 utterances for speech recognition. It merges the earlier Kazakh Speech Corpus and Kazakh Text-To-Speech
  2 with recordings from TV, radio, the Senate, and podcasts, and includes Kazakh-Russian code-switching. The
  Institute of Smart Systems and Artificial Intelligence (ISSAI) at Nazarbayev University releases it with
  an ESPnet training recipe.
github:
- url: https://github.com/IS2AI/Kazakh_ASR
huggingface_dataset:
- url: https://huggingface.co/datasets/issai/Kazakh_Speech_Corpus_2
