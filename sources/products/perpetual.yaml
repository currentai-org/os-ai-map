name: perpetual
display_name: Perpetual
type: software
description: 'Perpetual is a gradient boosting machine with a Rust core and Python and R bindings that replaces hyperparameter
  tuning with a single budget parameter: raising the budget fits a stronger model in one run. It covers classification,
  regression and ranking, and builds in causal-effect estimation, continual learning, calibrated prediction intervals
  and drift monitoring, with export to XGBoost and ONNX formats.'
