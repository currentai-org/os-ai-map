name: ngboost
display_name: NGBoost
type: software
description: NGBoost implements natural gradient boosting, a boosting method that predicts a full probability distribution
  for each example rather than a single value. Built on scikit-learn, it lets the user choose the distribution, the proper
  scoring rule and the base learner, and returns predictive distributions alongside point predictions. It comes from the Stanford
  ML Group.
github:
- url: https://github.com/stanfordmlgroup/ngboost
pypi:
