name: gluonts
display_name: GluonTS
type: software
description: Probabilistic time-series forecasting library from AWS, focused on deep-learning models in PyTorch
  with older MXNet implementations. It ships estimators such as DeepAR, Temporal Fusion Transformer, PatchTST,
  TiDE, N-BEATS, WaveNet and DeepVAR, plus tree-based and statistical wrappers, along with dataset loaders
  and evaluation tools. AWS's pretrained Chronos forecasters live in a separate repository.
github:
- url: https://github.com/awslabs/gluonts
pypi:
- url: https://pypi.org/project/gluonts
