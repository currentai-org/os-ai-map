name: rhino-fcp
display_name: Rhino Federated Computing Platform
type: software
description: Rhino Federated Computing's platform for federated statistics, federated learning and federated inference
  on data that stays behind each custodian's firewall. Custodians connect data across clouds and on-premises sites;
  custom code runs next to the data in secure containers under role-based access control, with differential privacy,
  k-anonymization, homomorphic encryption, customer-managed keys and audit logs.
comments: Closed, and on the map as an ADR-005 best-in-class comparator for this category. The `rhino-health` Python
  SDK on PyPI is a proprietary client for the platform, not the platform, so it is not declared.
