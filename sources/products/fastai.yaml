name: fastai
display_name: fastai
type: software
description: High-level deep-learning library on PyTorch from fast.ai, built for training strong models in
  a few lines. Its Learner API covers image classification and segmentation, text, tabular data and recommendation,
  with transfer learning from pretrained torchvision and timm backbones, a learning-rate finder, one-cycle
  training and callbacks, and it underpins fast.ai's free deep-learning course.
github:
- url: https://github.com/fastai/fastai
