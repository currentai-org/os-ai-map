description: HiDream is HiDream.ai's line of image generation and editing models. The open releases are HiDream-I1
  (April 2025) and the E1 editing models, then HiDream-O1-Image in May 2026, an 8-billion-parameter model that
  works directly on pixels and handles text-to-image, editing and subject-driven generation, with faster Dev
  variants and a prompt refiner.
