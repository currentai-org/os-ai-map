comments: HiDream-O1-Image-1.5 has no published weights; HiDream.ai's own site announces it, and its Hub account and GitHub
  README stop at the O1-Image models. HiDream-O1-Image, its Dev variants and the earlier I1 and E1 models remain downloadable
  under the MIT license. HiDream.ai's video and 3D research releases are not part of this entry.
