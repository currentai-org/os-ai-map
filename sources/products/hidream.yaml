name: hidream
display_name: HiDream
type: model
description: HiDream is HiDream.ai's line of image generation and editing models. The open releases are HiDream-I1 (April
  2025) and the E1 editing models, then HiDream-O1-Image in May 2026, a text-to-image model with faster Dev variants and a
  prompt refiner. The current HiDream-O1-Image-1.5, from June 2026, is offered only as a hosted model.
