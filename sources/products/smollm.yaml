description: SmolLM3 is Hugging Face's fully open 3B small language model, released in base and instruct form
  in July 2025. Trained on about 11 trillion tokens, it supports a 128K context window, six languages and dual-mode
  reasoning. The full engineering blueprint, covering architecture, data mixtures and the training and post-training
  recipe, is published, and the line supersedes SmolLM2.
