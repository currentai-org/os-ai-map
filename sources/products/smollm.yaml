name: smollm
display_name: SmolLM3
type: model
aliases:
- smollm3
description: Hugging Face's fully-open 3B small-model line (base + Instruct), released Jul 2025. Trained on ~11T
  tokens with a 128K context window and 6-language multilingual support; dual-mode reasoning. The full engineering
  blueprint (architecture, data mixtures, training and post-training recipe) is published. Supersedes SmolLM2.
github:
- url: https://github.com/huggingface/smollm
huggingface_model:
- url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B
comments: HuggingFace's "engineering blueprint" framing and fully public pretraining data put a 3B model in
  the same openness tier as much larger fully-open lines like OLMo and Pythia.
