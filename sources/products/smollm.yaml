name: smollm
display_name: SmolLM3
type: model
aliases:
- smollm3
description: Hugging Face's fully-open 3B small-model line (base + Instruct), released Jul 2025. Trained on ~11T
  tokens with a 128K context window and 6-language multilingual support; dual-mode reasoning. The full engineering
  blueprint (architecture, data mixtures, training and post-training recipe) is published. Supersedes SmolLM2.
github:
- url: https://github.com/huggingface/smollm
huggingface_model:
- url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B
comments: Public data mixtures and training recipe. Outperforms Llama-3.2-3B and Qwen2.5-3B and stays
  competitive with 4B Qwen3/Gemma3; light enough to run on-device. Hugging Face calls the release an
  "engineering blueprint" and the pretraining used public datasets throughout, which is what puts a 3B model
  in the same openness tier as OLMo and Pythia. Verified 2026-08-13 via the SmolLM3 release post, the
  SmolLM3-3B model card and the huggingface/smollm repository.
