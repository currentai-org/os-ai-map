name: african-ultrachat
display_name: African UltraChat
type: dataset
description: African UltraChat is a multi-turn chat dataset of about 55,000 conversations in 11 African languages,
  among them Amharic, Hausa, Igbo, Kinyarwanda, Swahili, Yoruba and isiZulu, with a small test split. Each
  record holds a user prompt and the exchange of user and assistant messages, tagged by language. Masakhane
  publishes it.
huggingface_dataset:
- url: https://huggingface.co/datasets/masakhane/african-ultrachat
comments: The card carries only a license and a language list, so how the conversations were produced is not
  documented.
