comments: Scored on HunyuanImage 3.0. Tencent's hosted HunyuanImage 3.5 Preview is not yet established as its
  successor, so it is left for a later review. The earlier HunyuanImage 2.1 remains on the Hub; HunyuanVideo,
  Hunyuan3D and HunyuanVideo-Foley are separate entries.
