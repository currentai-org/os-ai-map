name: hunyuan-image
display_name: HunyuanImage
type: model
description: HunyuanImage is Tencent's line of image generation models. HunyuanImage 3.0, released in September 2025, is an
  80-billion-parameter mixture-of-experts model that generates images inside a single autoregressive model that also reads
  images, and its Instruct version (January 2026) adds prompt reasoning and image editing. The current release, HunyuanImage
  3.5 Preview from September 2026, is offered only as a hosted model.
