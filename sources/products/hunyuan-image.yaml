comments: The HunyuanImage 3.0 checkpoints, including the January 2026 Instruct and distilled Instruct models, and the
  earlier HunyuanImage 2.1 remain on the Hub. HunyuanVideo, Hunyuan3D and HunyuanVideo-Foley are separate entries.
