name: samvaad-hi
display_name: Samvaad-Hi
type: dataset
description: Samvaad-Hi is an instruction-tuning dataset of about 100,000 multi-turn conversations in English,
  Hindi and Hinglish written with an Indian context. Each record is a list of user and assistant messages in
  chat format. Sarvam AI publishes it, and its one-line card does not say how the conversations were produced.
huggingface_dataset:
- url: https://huggingface.co/datasets/sarvamai/samvaad-hi-v1
comments: The card is one sentence, so how the conversations were written or generated is not documented.
