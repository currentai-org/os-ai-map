description: Uhura-ARC-Easy is a multiple-choice science test in six African languages, made by professional translators
  from a subset of the English ARC-Easy grade-school questions. It is the science half of the Uhura benchmark, published
  by Masakhane with its own card and paper, and AfroBench runs it as one of its knowledge tasks.
