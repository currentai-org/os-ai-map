name: infomaniak-ai-services
display_name: Infomaniak AI Services
type: software
description: Infomaniak AI Services serves open models through an OpenAI-compatible API from data centers in Switzerland.
  Its catalog pairs large language models such as Qwen3.5, Kimi K2.6, Mistral Small 4, Gemma 4 and Apertus with
  embedding, re-ranking and Whisper transcription models, billed by the token or the minute. Infomaniak says prompts
  are neither stored nor used for training, and that the energy powering the service is recovered to heat homes.
