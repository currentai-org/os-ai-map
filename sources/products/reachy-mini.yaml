name: reachy-mini
display_name: Reachy Mini
type: hardware
description: Reachy Mini is an expressive desktop robot for building and testing AI apps. Its head rides on
  a six-degree-of-freedom Stewart platform above a rotating body, with two moving antennas, a wide-angle camera,
  a four-microphone array and a speaker, and it has no arm or gripper. Pollen Robotics sells it as a kit in
  a Wireless version with an onboard Raspberry Pi CM4 and a Lite version driven over USB from a computer, programmed
  through Python and JavaScript SDKs.
github:
- url: https://github.com/pollen-robotics/reachy_mini
comments: 'The SDK''s PyPI package, `reachy-mini`, is not declared: hardware carries no download scale on the
  map, and the same package runs the robot''s MuJoCo simulation, which needs no robot.'
