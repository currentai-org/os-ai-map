name: gpt-oss-safeguard
display_name: gpt-oss-safeguard
type: model
description: OpenAI's safety reasoning model, built on gpt-oss, with a policy-writing guide OpenAI prepared
  with ROOST. Rather than emitting a fixed label, it reasons over a safety policy supplied at call time and
  returns a reasoned decision, with low, medium or high reasoning effort. It ships in 20b and 120b sizes.
huggingface_model:
- url: https://huggingface.co/openai/gpt-oss-safeguard-20b
