name: latitude-llm
display_name: Latitude
type: software
description: Self-healing AI agent platform providing telemetry-based tracing of multi-turn sessions, tool
  calls and execution paths, automatic clustering of failing traces into tracked signals, coding-agent dispatch
  that writes and opens a fix from sample failures, and regression replay against real failing traces to verify
  the fix held. Self-hostable at any scale on Docker Compose, a Kubernetes Helm chart, or Railway, alongside a
  hosted cloud with usage-based billing.
github:
