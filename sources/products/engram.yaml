name: engram
display_name: Engram
type: software
description: 'Engram gives coding agents a persistent project memory: the agent saves bug fixes, decisions and session
  summaries through MCP tools, and Engram stores them in a local SQLite database with full-text search, scoped to
  the current project. It ships as a single Go binary with a CLI, HTTP API, terminal interface and optional self-hosted
  cloud sync. Alan Buscaglia builds it under his Gentleman Programming name.'
github:
