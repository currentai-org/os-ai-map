name: validmind-library
display_name: ValidMind Library
type: software
description: The ValidMind Library is a Python toolkit that runs validation tests on models and automates model
  documentation for risk and compliance review. It works with any Python model and sends its test results and
  documentation artifacts to the ValidMind Platform, a cloud-hosted service where validators review them. Optional
  PII detection keeps sensitive data out of logged results.
comments: 'Scored as the open client of a closed platform: the library runs tests, but the documentation it
  feeds is assembled on ValidMind''s hosted service. Tagged self-attested.'
github:
- url: https://github.com/validmind/validmind-library
pypi:
- url: https://pypi.org/project/validmind/
