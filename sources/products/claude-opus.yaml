name: claude-opus
display_name: Claude Opus
type: model
aliases:
- claude-opus-4-7
- claude-opus-4-x
description: Claude Opus is Anthropic's heavy-reasoning tier, tuned for long-running agentic coding, knowledge
  work and long-horizon planning across large codebases. The tier runs from the Opus 4.x line through Opus
  5 to Opus 5.5, the current release, which Anthropic recommends as the starting model for most workloads.
  It is available through the Anthropic API and claude.ai, and earlier releases through Amazon Bedrock and
  Google Cloud's Vertex AI.
comments: Capability reads Opus 5.5; the openness record still names the Opus 4.x line as its governing release.
