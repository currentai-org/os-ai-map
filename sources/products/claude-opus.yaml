name: claude-opus
display_name: Claude Opus 4.x
type: model
aliases:
- claude-opus-4-7
- claude-opus-4-x
description: Claude Opus is Anthropic's heavy-reasoning tier, tuned for sustained agentic coding and long-horizon
  planning across large codebases. This entry covers the Opus 4.x line through Opus 4.8, which is available
  through the Anthropic API, Amazon Bedrock, Google Cloud's Vertex AI and claude.ai. Anthropic has since released
  Opus 5 and Opus 5.5.
comments: Opus 4.7 is also scored separately as a base-pretrained model; this record covers the Opus 4.x line
  as a finetuned chat model.
