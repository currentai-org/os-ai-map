description: Elasticsearch is a distributed search and analytics engine that indexes documents for full-text retrieval
  and stores dense vectors for approximate nearest neighbour and hybrid search. It underpins retrieval-augmented
  generation alongside its older logging, metrics and security-analytics uses, and runs as a clustered data store
  with sharding and replication.
