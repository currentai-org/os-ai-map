name: monai-model-zoo
display_name: MONAI Model Zoo
type: software
description: Collection of medical imaging models packaged as MONAI Bundles, each bundling weights, training
  configuration and inference code under its own license. Researchers and institutions contribute bundles by
  reviewed pull request, every bundle version is archived and indexed, and monai.bundle.download fetches a
  named bundle from Project MONAI's hosting on NGC or Hugging Face. Project MONAI, started by NVIDIA and King's
  College London, maintains it.
github:
- url: https://github.com/Project-MONAI/model-zoo
