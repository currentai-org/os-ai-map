name: hedc4
display_name: HeDC4
type: dataset
description: HeDC4 (Hebrew Deduplicated and Cleaned Common Crawl Corpus) is a Hebrew pretraining corpus built
  by cleaning and approximately deduplicating Common Crawl text. Released as a 47.6 GB file of 910,000 documents,
  it was introduced to train the HeRo and LongHeRo Hebrew encoder models. HeNLP publishes it, with Vitaly Shalumov
  and Harel Haskey as authors.
huggingface_dataset:
- url: https://huggingface.co/datasets/HeNLP/HeDC4
arxiv:
- url: https://arxiv.org/abs/2304.11077
