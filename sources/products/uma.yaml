name: uma
display_name: UMA
type: model
description: UMA is Meta FAIR's family of Universal Models for Atoms, trained on roughly half a billion DFT structures compiled from five chemical-domain datasets and routed at inference by a task embedding covering molecules, inorganic materials, catalysis, MOFs, and molecular crystals. Weights are distributed through a gated Hugging Face repository and run through the fairchem library's ASE calculator and multi-GPU simulation interfaces.
github:
- url: https://github.com/facebookresearch/fairchem
huggingface_model:
- url: https://huggingface.co/facebook/UMA
pypi:
- url: https://pypi.org/project/fairchem-core
comments: Access is gated on manual approval and requires registering a full legal name and organization, which is a conduct and identity condition rather than a commercial bound. Verified 2026-09-10 via the Hugging Face API, the fairchem README, LICENSE and UMA documentation, and the UMA paper.
