name: auth0-for-ai-agents
display_name: Auth0 for AI Agents
type: software
description: Auth0 for AI Agents adds agent authorization to the Auth0 identity platform. A Token Vault stores and
  refreshes users' OAuth tokens so an agent can call Google, Slack or GitHub on a user's behalf, asynchronous authorization
  asks the user to approve a sensitive action over CIBA, and Auth0 FGA checks tool calls and retrieved documents
  against the user's permissions. Agents can also hold their own identities. Okta builds it.
comments: Auth0's documentation now groups these features under AI Identity for B2B. The entry covers the agent-specific
  features, not the Auth0 platform as a whole.
npm:
- url: https://www.npmjs.com/package/@auth0/ai
pypi:
- url: https://pypi.org/project/auth0-ai
