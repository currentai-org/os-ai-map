name: granite-geospatial
display_name: Granite Geospatial
type: model
description: Granite Geospatial is IBM's family of Earth-observation models built on a Swin-B backbone pretrained with masked image modeling over Harmonized Landsat and Sentinel-2 imagery. The declared biomass member replaces the pretraining decoder with a UPerNet regression head and is fine-tuned against GEDI L4A lidar labels drawn from 15 biomes, predicting above-ground biomass from HLS L30 optical composites through TerraTorch.
github:
- url: https://github.com/ibm-granite/granite-geospatial-biomass
huggingface_model:
- url: https://huggingface.co/ibm-granite/granite-geospatial-biomass
comments: The companion GitHub repository is archived and carries getting-started notebooks rather than training code, so the checkpoint and its TerraTorch configuration are the whole distributed surface. Verified 2026-09-10 via the Hugging Face model card, the Hugging Face API, and the IBM Granite repository.
