name: apache-tvm
display_name: Apache TVM
type: software
description: Apache TVM is a machine learning compilation framework that lowers models from high-level descriptions
  into deployable modules for CPUs, GPUs and accelerators. Compiler pipelines are written and customized in Python,
  and the project targets LLVM, CUDA, ROCm, Metal, OpenCL, SPIR-V and WebGPU among others. It is developed under
  the Apache Software Foundation's committer model.
