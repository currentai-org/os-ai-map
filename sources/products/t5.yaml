name: t5
display_name: T5
type: model
description: T5 (Text-to-Text Transfer Transformer) is Google's encoder-decoder language model that treats
  every task, from translation and summarization to classification, as turning input text into output
  text. It was released in 2019 with the C4 web corpus it was pretrained on, in five sizes from Small
  (60M parameters) to 11B, and Google later published experimental T5 1.1 checkpoints trained on C4 alone.
  It is used mainly as a base for fine-tuning.
