name: arcade
display_name: Arcade.dev
type: software
description: 'Runtime that lets agents act in their users'' accounts: it runs the OAuth flow for each end user,
  keeps the tokens in an encrypted vault, renews them, and injects them into tool calls so neither the client nor
  the model sees them. It serves a catalog of prebuilt MCP servers for business systems through scoped MCP gateways,
  with access rules and audit logs, and its open-source framework, arcade-mcp, builds custom servers that run standalone
  or deploy onto the platform. The platform runs as Arcade Cloud or is installed into a customer''s own cluster.'
comments: Scored as the hosted Arcade platform, not as the arcade-mcp framework (R-2026-11-12-i). The platform's
  Engine, token vault and gateways are not published, so it is closed, matching Composio, whose MIT SDKs are
  likewise clients of a closed hosted service. arcade-mcp is a real MIT framework that runs MCP servers without
  the platform; it would be assessed as its own product rather than raising this one. The declared artifacts
  are the framework's, and adoption is read from its downloads, as Composio's is read from its SDK.
github:
- url: https://github.com/ArcadeAI/arcade-mcp
pypi:
- url: https://pypi.org/project/arcade-mcp/
