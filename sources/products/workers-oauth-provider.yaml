name: workers-oauth-provider
display_name: Workers OAuth Provider
type: software
description: Workers OAuth Provider is a TypeScript library that makes a Cloudflare Worker an OAuth 2.1 authorization
  server and resource server for HTTP APIs and remote MCP servers. It registers clients through pre-registration,
  Client ID Metadata Documents or dynamic registration, issues and validates audience-bound tokens, and supports
  token exchange for narrower tokens. Cloudflare builds it.
github:
- url: https://github.com/cloudflare/workers-oauth-provider
npm:
- url: https://www.npmjs.com/package/@cloudflare/workers-oauth-provider
