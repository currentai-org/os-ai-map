name: redisearch
display_name: RediSearch
type: software
description: RediSearch is Redis's own query and indexing module, adding secondary indexing, full-text search,
  vector similarity search and aggregations on top of Redis. It ships as a loadable Redis module built from this
  repository rather than a separate service, inheriting Redis's storage and clustering.
github:
- url: https://github.com/RediSearch/RediSearch
comments: Promoted alongside pgvector, already on this roster - a general-purpose store's search/vector module
  rather than a standalone retrieval system - and distinguished from plain Redis, which stays excluded from this
  category as too general-purpose. Verified 2026-09-02 via the GitHub API and the LICENSE body.
