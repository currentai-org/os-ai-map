name: mlstm-kernels
display_name: mLSTM Kernels
type: software
description: mLSTM Kernels (Tiled Flash Linear Attention) provides fast, chunkwise-parallel Triton kernels for the mLSTM
  used in xLSTM, with JAX and PyTorch native implementations and Triton integrations for both. NXAI, the xLSTM team's company,
  distributes it under its own restrictive community license rather than an OSI-approved one.
