name: ramalama
display_name: RamaLama
type: software
description: 'RamaLama runs and serves AI models inside OCI containers, so the host needs no AI-specific setup:
  it detects the GPU and pulls a matching accelerated image for CUDA, ROCm, Intel, Ascend, Moore Threads, Vulkan
  or Apple Silicon. Models come from Hugging Face, ModelScope, Ollama or any OCI registry and are handled like container
  images, and they run in rootless containers with no network access by default. Its commands also serve a REST
  API, convert models to OCI images, build RAG data and benchmark models.'
github:
- url: https://github.com/containers/ramalama
pypi:
- url: https://pypi.org/project/ramalama/
comments: Maintained in the containers GitHub organization alongside Podman. Fedora packages it, and a macOS installer
  and an install script are offered as well, so PyPI is only one of several channels.
