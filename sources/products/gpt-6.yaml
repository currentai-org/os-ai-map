name: gpt-6
display_name: GPT-6
type: model
version_in_identity: OpenAI markets GPT-6 as its own flagship family, distinct from the GPT-5 line, with Astra,
  Sol and Luna as its tiers
description: 'GPT-6 is OpenAI''s flagship model family, released in September 2026 in three tiers: Astra, the
  most capable, for complex reasoning, coding and computer use; Sol, which balances capability and cost and
  has been updated as GPT-6.1 Sol; and Luna, for high-volume work. All three take text and image input with
  a context window of about one million tokens. They are served through OpenAI''s API and ChatGPT, without
  downloadable weights.'
