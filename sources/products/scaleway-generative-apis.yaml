name: scaleway-generative-apis
display_name: Scaleway Generative APIs
type: software
description: Scaleway Generative APIs is a serverless service that runs open-weight models behind OpenAI-compatible
  endpoints, billed per million tokens. The catalog covers chat, code and vision models such as GLM-5.3, Qwen3.5,
  Gemma 4, gpt-oss-120b and Mistral Medium 3.5, along with embedding, OCR and Whisper transcription models, with
  structured outputs, function calling and batch processing. Scaleway, a French cloud provider, hosts every model
  in a data center in Paris.
