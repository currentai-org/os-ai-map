name: lightly
display_name: Lightly
type: software
description: LightlySSL, published as the lightly package, is a PyTorch library for self-supervised pretraining of computer-vision
  backbones on unlabeled images. It implements about two dozen methods, among them SimCLR, MoCo, BYOL, DINO, DINOv2, MAE and
  iBOT, from shared losses, heads and transforms, and also trains the LeWM latent world model. Lightly, a spin-off from ETH
  Zurich, builds it.
