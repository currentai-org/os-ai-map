name: armada
display_name: Armada
type: software
description: Multi-cluster batch queuing system for high-throughput workloads on Kubernetes, built at G-Research
  for quantitative research and machine-learning jobs. Armada holds a queue in front of many Kubernetes clusters,
  applies per-queue fair share across them, and decides which cluster each job is sent to, so a fleet of clusters
  behaves as one pool.
github:
- url: https://github.com/armadaproject/armada
comments: Ships as container images and Helm charts with no package channel, so adoption bands on stars. Verified
  2026-09-15 via the repository and its recursive tree.
