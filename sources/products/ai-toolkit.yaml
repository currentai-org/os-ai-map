name: ai-toolkit
display_name: AI Toolkit
type: software
description: AI Toolkit is a training suite for fine-tuning diffusion models, covering image, instruction-edit,
  video and audio model families including FLUX.1, FLUX.2, Qwen-Image and Wan. It trains LoRA and LyCORIS adapters,
  ships a web UI for configuring and monitoring runs, and provides recipes for running on RunPod and Modal.
