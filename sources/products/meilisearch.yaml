name: meilisearch
display_name: Meilisearch
type: software
description: Meilisearch is a search engine exposed as an HTTP API, offering typo-tolerant full-text search with
  faceting, filtering and geosearch, and semantic and hybrid search over embeddings it can generate itself. It is
  written in Rust and runs as a single binary or on the vendor's hosted service. Meili SAS develops it.
