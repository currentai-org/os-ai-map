name: indicvoices-r
display_name: IndicVoices-R
type: dataset
description: IndicVoices-R is a text-to-speech corpus of 1,704 hours from 10,496 speakers across the 22 scheduled
  Indian languages. AI4Bharat built it by restoring recordings from the IndicVoices speech recognition collection
  with demixing, dereverberation and enhancement models, then filtering for clarity. Each 48 kHz clip carries
  verbatim and normalized transcripts and speaker metadata, and a benchmark tests speaker generalization.
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/indicvoices_r
arxiv:
- url: https://arxiv.org/abs/2409.05356
