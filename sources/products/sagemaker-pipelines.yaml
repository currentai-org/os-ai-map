name: sagemaker-pipelines
display_name: Amazon SageMaker AI Pipelines
type: software
description: Managed workflow orchestration service for machine learning on AWS. A pipeline is built from typed
  steps - training, processing, tuning, model registration - authored in the SageMaker Python SDK or a visual
  editor, and each step names the instance type it runs on. SageMaker provisions, scales and shuts down the
  compute for the pipeline and for the jobs it orchestrates.
comments: Managed AWS service with no self-hostable implementation.
