name: smugri-data
display_name: SMUGRI data
type: dataset
description: 'SMUGRI data is a news-based monolingual text collection for seven low-resource Finno-Ugric languages:
  Komi, Udmurt, Moksha, Erzya, Mansi, Khanty and Livvi Karelian, about 130,000 rows in all. It accompanies
  a paper on machine translation for these languages presented at the 24th Nordic Conference on Computational
  Linguistics. TartuNLP at the University of Tartu publishes it.'
huggingface_dataset:
- url: https://huggingface.co/datasets/tartuNLP/smugri-data
comments: The card names the languages and the news origin only; the outlets and collection method were not
  found on any page read.
