name: ggml
display_name: GGML
type: software
description: GGML is a low-level C tensor library for machine learning with no third-party dependencies, zero
  runtime memory allocations, integer quantization support, automatic differentiation, and optimizers. It runs
  cross-platform and is the tensor backend behind llama.cpp and whisper.cpp. It is maintained by ggml.ai, the
  company founded by Georgi Gerganov and now part of Hugging Face; much active development now occurs in the
  dependent llama.cpp and whisper.cpp repos.
github:
- url: https://github.com/ggml-org/ggml
