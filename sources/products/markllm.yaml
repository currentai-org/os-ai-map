name: markllm
display_name: MarkLLM
type: software
description: MarkLLM is a Python toolkit for embedding watermarks in the text a language model generates and for
  detecting them. It puts many published methods behind one interface, among them KGW, Unigram, SynthID-Text and
  the publicly verifiable UPV, and adds visualizations of how each method marks tokens and pipelines that test detection
  rates, robustness to edits and paraphrase, and text quality. The THU-BPM research group develops it, and it was
  published as an EMNLP 2024 demo paper.
comments: 'Tagged self-attested: most of its detectors need the key the generator used, so only the key holder can
  check a mark.'
github:
- url: https://github.com/THU-BPM/MarkLLM
