name: prime-rl
display_name: prime-rl
type: software
description: prime-rl is a framework for asynchronous reinforcement learning on language models at large scale, using
  FSDP2 for training and vLLM for inference. It covers SFT, RL and evaluation in one stack, trains on multi-turn and
  agentic tasks written as verifiers environments, and is designed to train mixture-of-experts models above a trillion
  parameters across more than 1,000 GPUs under Slurm. Prime Intellect develops it.
github:
