name: indiccorp-v2
display_name: IndicCorp v2
type: dataset
description: IndicCorp v2 is a monolingual pretraining text corpus of about 20.9 billion tokens in 24 languages
  from four language families, reaching low-resource languages such as Bodo, Khasi and Santali. AI4Bharat curated
  it to train its IndicBERT v2 encoder models, and released it with IndicXTREME, a human-supervised benchmark
  of nine language-understanding tasks.
github:
- url: https://github.com/AI4Bharat/IndicBERT
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/IndicCorpV2
arxiv:
- url: https://arxiv.org/abs/2212.05409
