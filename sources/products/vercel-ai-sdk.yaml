name: vercel-ai-sdk
display_name: Vercel AI SDK
type: software
description: The AI SDK is a TypeScript toolkit for building AI applications and agents, with one interface
  for calling models from OpenAI, Anthropic, Google and many other providers. It covers text and structured-output
  generation, tool calling, a ToolLoopAgent class for agents that call tools in a loop, and UI hooks that
  stream chat and tool results into React, Svelte and Vue apps. Vercel builds it.
github:
- url: https://github.com/vercel/ai
npm:
- url: https://www.npmjs.com/package/ai
