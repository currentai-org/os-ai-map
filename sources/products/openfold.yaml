name: openfold
display_name: OpenFold
type: model
description: OpenFold is a trainable PyTorch reproduction of AlphaFold from the AQLab consortium. Unlike the reference implementation it ships training as well as inference code, its own from-scratch trained parameters, and OpenProteinSet, some 400,000 MSAs and PDB70 template hit files hosted on the Registry of Open Data on AWS. OpenFold3 extends the line to an all-atom AlphaFold 3-class model.
github:
- url: https://github.com/aqlaboratory/openfold
huggingface_model:
- url: https://huggingface.co/OpenFold/OpenFold3
comments: The OpenFold3 Hugging Face repository is Apache-2.0 but auto-gated behind a name-and-affiliation form, so its download counter reads zero and cannot carry the adoption signal. Verified 2026-09-10 via the GitHub API, the repository README and original README, the training documentation, the Hugging Face API, and the AWS open-data registry entry.
