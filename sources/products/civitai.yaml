name: civitai
display_name: Civitai
type: software
description: 'Community hub at civitai.com where users upload and download image-generation model files: checkpoints,
  LoRAs, textual inversions, VAEs, ControlNets and upscalers, each published as a model with one or more versions.
  A public REST API lists and searches models and resolves versions by file hash without a token. Civit AI
  publishes the site''s Next.js code under Apache-2.0.'
github:
- url: https://github.com/civitai/civitai
comments: Scored on the published site code. Whether civitai.com runs exactly that code was not verified, and
  the README says several services it depends on are private.
