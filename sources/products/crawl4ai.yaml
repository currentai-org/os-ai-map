name: crawl4ai
display_name: Crawl4AI
type: software
description: Open-source web crawler and scraper built for LLM pipelines, turning pages into clean Markdown or structured
  JSON for retrieval and agent use. Runs on a managed headless browser with session reuse, hooks and proxy rotation,
  and ships CSS, XPath, regex and LLM-driven extraction strategies, a Docker deployment and a CLI.
github:
- url: https://github.com/unclecode/crawl4ai
pypi:
- url: https://pypi.org/project/crawl4ai
comments: The LICENSE is Apache-2.0 with an appended attribution requirement that binds public use as well as redistribution,
  so the GitHub API's Apache-2.0 label understates the terms. Verified 2026-08-30 via the GitHub API, the LICENSE
  body and the pypistats API.
