name: crawl4ai
display_name: Crawl4AI
type: software
description: Open-source web crawler and scraper built for LLM pipelines, turning pages into clean Markdown or structured
  JSON for retrieval and agent use. Runs on a managed headless browser with session reuse, hooks and proxy rotation,
  and ships CSS, XPath, regex and LLM-driven extraction strategies, a Docker deployment and a CLI.
