name: microsoft-entra-agent-id
display_name: Microsoft Entra Agent ID
type: software
description: Microsoft Entra Agent ID gives AI agents identities of their own in Microsoft Entra ID, created from
  agent identity blueprints that serve as templates for fleets of agents. An agent signs in as itself with client
  credentials or acts for a signed-in user through an on-behalf-of token exchange, and Conditional Access, identity
  governance and sign-in logs apply to it as they do to people. Microsoft builds it.
