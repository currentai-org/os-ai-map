name: inkling
display_name: Inkling
type: model
description: Inkling is Thinking Machines Lab's line of open-weight, natively multimodal mixture-of-experts
  models that take text and image input. The first generation, released July 15, 2026, has 975 billion total
  and 41 billion active parameters, a one-million-token context and a 276B Small sibling with 12B active. Inkling
  2 Small, the second generation, has 594 billion total and 17 billion active parameters and was trained natively
  in NVFP4.
