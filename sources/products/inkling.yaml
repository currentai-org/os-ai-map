name: inkling
display_name: Inkling
type: model
description: Inkling, released July 15, 2026, is Thinking Machines Lab's first open-weight foundation model,
  a natively multimodal mixture of experts with 975 billion total and 41 billion active parameters. Each token
  is routed to six of 256 experts plus two shared ones, with hybrid local and global attention, a one-million-token
  context and 45 trillion training tokens. A 276B Small sibling with 12B active parameters is part of the same
  family.
