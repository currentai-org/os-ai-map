name: wav2vec
display_name: wav2vec 2.0 / HuBERT
type: model
description: 'Meta''s self-supervised speech encoders: wav2vec 2.0 and HuBERT learn speech representations from unlabeled
  audio and are fine-tuned into English recognizers with a CTC head. They remain a common starting point for speech fine-tuning
  and forced alignment.'
huggingface_model:
- url: https://huggingface.co/facebook/wav2vec2-base-960h
- url: https://huggingface.co/facebook/wav2vec2-base
- url: https://huggingface.co/facebook/wav2vec2-large-960h-lv60-self
- url: https://huggingface.co/facebook/hubert-large-ls960-ft
- url: https://huggingface.co/facebook/hubert-base-ls960
arxiv:
- url: https://arxiv.org/abs/2006.11477
comments: The fairseq repository that holds the training recipes is archived; the checkpoints are still served from the
  Hub.
