name: tabicl
display_name: TabICL
type: model
description: Tabular foundation model from Inria's Soda team that classifies and regresses on a new table by in-context
  learning, with no training or tuning step and a scikit-learn interface. TabICLv2 is pretrained on millions of
  synthetic datasets, and the repository releases the synthetic data generator and the pretraining code alongside
  inference. Published at ICML 2026.
