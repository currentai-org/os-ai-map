description: Run multiple AI models against the same research, design, or coding task. Surface disagreements before
  you ship. Every AI model has blind spots. Claude Octopus supports ten external provider integrations — Codex,
  Antigravity CLI, Copilot, Qwen, Ollama, Perplexity, OpenRouter, OrcaRouter, OpenCode, and Grok — alongside the
  built-in Claude Code host, with consensus gates that flag disagreements before you ship.
