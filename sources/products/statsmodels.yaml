name: statsmodels
display_name: statsmodels
type: software
description: 'Python library for statistical modeling and inference: linear, generalized linear, mixed and robust
  regression, discrete-choice models, survival analysis, multivariate methods and a large time-series suite from
  ARIMA and SARIMAX to state-space, VAR and Markov-switching models. It reports standard errors, tests and diagnostics
  alongside every fit. Maintained by the statsmodels developers as a community project.'
github:
- url: https://github.com/statsmodels/statsmodels
