name: llama-parse
display_name: LlamaParse
type: software
description: LlamaParse is LlamaIndex's hosted document-parsing API, which runs layout-aware OCR over PDFs, scans, spreadsheets,
  forms, tables and charts and returns Markdown, text or JSON for language-model pipelines. It offers several parsing
  tiers priced in credits, with private-cloud deployment for enterprise customers. Its Python and TypeScript clients
  are open source; the parsing service is not.
