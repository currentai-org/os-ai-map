name: intel-neural-compressor
display_name: Intel Neural Compressor
type: software
description: Intel Neural Compressor is a Python library that applies model-compression techniques across PyTorch,
  TensorFlow and JAX, covering static and dynamic quantization, SmoothQuant, weight-only quantization, quantization-aware
  training and mixed precision. Low-bit formats including the MX and NVFP4 families are supported experimentally,
  with an auto-tune workflow.
github:
- url: https://github.com/intel/neural-compressor
pypi:
