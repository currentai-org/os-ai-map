name: intel-neural-compressor
display_name: Intel Neural Compressor
type: software
description: Intel Neural Compressor is a Python library that applies model-compression techniques across PyTorch,
  TensorFlow and ONNX Runtime, covering static and dynamic quantization, SmoothQuant, weight-only quantization,
  quantization-aware training, mixed precision and pruning. Low-bit formats down to INT4 and the MX and NVFP4 families
  are supported, with automatic accuracy-driven tuning.
github:
- url: https://github.com/intel/neural-compressor
pypi:
- url: https://pypi.org/project/neural-compressor/
comments: Verified 2026-08-18 via the GitHub API and the LICENSE body.
