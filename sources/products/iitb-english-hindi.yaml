name: iitb-english-hindi
display_name: IIT Bombay English-Hindi corpus
type: dataset
description: The IIT Bombay English-Hindi corpus is a parallel corpus of about 1.49 million sentence pairs
  for machine translation, with a companion monolingual Hindi corpus. It compiles existing public corpora such
  as OPUS subsets and HindEnCorp with material the Center for Indian Language Technology collected, including
  Indian government websites. It has served as the English-Hindi data for the Workshop on Asian Translation
  shared tasks since 2016.
github:
- url: https://github.com/cfiltnlp/IITB-English-Hindi-PC
huggingface_dataset:
