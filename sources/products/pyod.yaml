name: pyod
display_name: PyOD
type: software
description: Outlier and anomaly detection library with more than sixty detectors behind one fit/predict API,
  covering tabular data, time series, graphs and, through foundation-model embeddings, text, images and audio.
  Version 3 adds ADEngine, which profiles a dataset, picks and runs detectors and assesses the results, and
  an agent skill and MCP server that drive it from natural-language requests. It is led by Yue Zhao with an
  advisory committee.
