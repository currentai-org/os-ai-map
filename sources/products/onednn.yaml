name: onednn
display_name: oneDNN
type: software
description: oneDNN is a cross-platform performance library of deep-learning building blocks - convolutions, matrix
  multiplications, normalizations and fused primitives - implementing the oneAPI specification for the component.
  It is optimized for x86-64, AMD64 and 64-bit Arm CPUs and for Intel GPUs, and frameworks call it as their CPU
  kernel layer. The UXL Foundation hosts the project.
github:
- url: https://github.com/uxlfoundation/oneDNN
