name: amazon-bedrock-agentcore-memory
display_name: Amazon Bedrock AgentCore Memory
type: software
description: 'Amazon Bedrock AgentCore Memory is a managed AWS service that keeps an agent''s conversation events
  as short-term memory and runs memory strategies over them to extract long-term records: facts, user preferences,
  session summaries and episodes. New information is consolidated into existing records, and the agent recalls them
  by semantic search within an actor''s or session''s namespace. AWS offers it as one of the Amazon Bedrock AgentCore
  services.'
