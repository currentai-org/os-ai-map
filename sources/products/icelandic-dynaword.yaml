name: icelandic-dynaword
display_name: Icelandic Dynaword
type: dataset
description: 'Icelandic Dynaword is a continually updated Icelandic pretraining corpus of more than 2.6 billion
  tokens, gathered only from openly licensed sources: the open subcorpora of the Icelandic Gigaword Corpus,
  Wikipedia and its sister projects, the official state gazette and out-of-copyright books. Each document carries
  model-generated quality and content annotations. Danish Foundation Models maintains it, applying the approach
  of Danish Dynaword.'
huggingface_dataset:
- url: https://huggingface.co/datasets/danish-foundation-models/icelandic-dynaword
