name: updesh
display_name: Updesh
type: dataset
description: Updesh is a synthetic instruction-tuning dataset of about 9.5 million examples in 13 Indian languages
  and English. Its reasoning part translates Orca-AgentInstruct and OrcaMath tasks with Llama 3.1 405B, and
  its generative part builds multi-hop questions, dialogues, summaries and similar tasks from language-specific
  Wikipedia with Qwen3-235B. Microsoft Research built it to post-train smaller models for Indian languages.
huggingface_dataset:
- url: https://huggingface.co/datasets/microsoft/Updesh_beta
arxiv:
- url: https://arxiv.org/abs/2509.21294
