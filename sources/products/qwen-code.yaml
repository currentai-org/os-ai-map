name: qwen-code
display_name: Qwen Code
type: software
description: Qwen Code is a coding agent from Alibaba's Qwen team that runs in the terminal and through editor plugins,
  a desktop app, a browser UI and chat apps. It works with the OpenAI, Anthropic, Gemini and Qwen APIs or a local
  model, and ships sub-agents, agent teams, MCP, plan mode and SDKs for three languages. The project began as a
  fork of Google's Gemini CLI and now develops on its own.
comments: The root LICENSE names Google LLC beside Qwen as copyright holder, carried over from Gemini CLI 0.8.2,
  the code the project was forked from. Qwen Code stopped syncing with upstream at its 0.1 release, so the two
  are read as separate products.
github:
- url: https://github.com/QwenLM/qwen-code
npm:
- url: https://www.npmjs.com/package/@qwen-code/qwen-code
