name: hatchet
display_name: Hatchet
type: software
description: An orchestration engine for background tasks, AI agents, and durable workflows. Hatchet is a platform
  for orchestrating background tasks, AI agents, and durable workflows at scale. It supports applications written
  in Python, TypeScript, Go and Ruby, and can be used as a service through Hatchet Cloud or self-hosting. Hatchet
  provides a full platform for queuing, automatic retries, durability, real-time monitoring, alerting, and logging.
