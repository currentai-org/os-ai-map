name: agibot-world
display_name: AgiBot World
type: dataset
description: AgiBot World is AgiBot's large-scale robot manipulation dataset, collected on a fleet of mobile dual-arm
  robots with dexterous hands and visual-tactile sensors. The Beta release holds about one million trajectories
  from a hundred robots across more than a hundred replicated real-life scenarios, with the curated Alpha subset
  and a 2026 release beside it.
github:
- url: https://github.com/OpenDriveLab/AgiBot-World
huggingface_dataset:
- url: https://huggingface.co/datasets/agibot-world/AgiBotWorld-Beta
- url: https://huggingface.co/datasets/agibot-world/AgiBotWorld-Alpha
- url: https://huggingface.co/datasets/agibot-world/AgiBotWorld2026
comments: The code and data are published through the OpenDriveLab repository. The Alpha and Beta releases are gated
  on the Hub; the 2026 release is not.
