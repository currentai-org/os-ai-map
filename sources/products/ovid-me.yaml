name: ovid-me
display_name: OVID-ME
type: software
description: OVID-ME is a TypeScript policy decision point that enforces the mandate in an AI sub-agent's signed
  OVID token at every tool call, evaluating it as a Cedar policy before the call runs. It can prove at issuance
  that a child's mandate is a subset of its parent's, logs every decision and exposes an AuthZEN-compatible API.
  The clawdreyhepburn account publishes it beside the OVID token library and Carapace.
github:
- url: https://github.com/clawdreyhepburn/ovid-me
npm:
- url: https://www.npmjs.com/package/@clawdreyhepburn/ovid-me
