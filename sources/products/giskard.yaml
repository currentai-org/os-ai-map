name: giskard
display_name: Giskard
type: software
description: Giskard is a Python library from Giskard AI for testing and red-teaming LLM and agentic systems,
  rewritten for dynamic, multi-turn testing of agents. Its vulnerability scan automatically probes an application
  for prompt injection, harmful output and hallucination, and Giskard Checks runs scenario-based evaluations,
  including multi-turn agent validation. The scan ships in the giskard-scan package alongside knowledge-base
  and RAG evaluation.
github:
- url: https://github.com/Giskard-AI/giskard-oss
comments: The repository is now Giskard-AI/giskard-oss, and links to the old Giskard-AI/giskard path redirect
  there.
