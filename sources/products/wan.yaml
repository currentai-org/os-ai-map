name: wan
display_name: Wan
type: model
description: Wan is Alibaba's family of video generation models, covering text-to-video, image-to-video, first-and-last-frame
  interpolation, speech-driven video, character animation and the VACE editing model. The downloadable Wan 2.1 and
  2.2 releases range from a 1.3B model to a 27B mixture-of-experts at up to 720p, with a 5B model that runs on a
  consumer GPU. Newer releases, Wan 2.5 through 3.0, are served only through Alibaba Cloud Model Studio.
