name: wan
display_name: Wan
type: model
description: Wan is Alibaba's family of video generation models. Its current release, Wan 3.0, generates clips of
  up to 30 seconds with sound from text and up to 20 reference assets and supports instruction-based editing, and
  is served only through Alibaba Cloud Model Studio. The earlier Wan 2.1 and 2.2 releases, from a 1.3B model to
  a 27B mixture-of-experts at up to 720p, remain downloadable.
