name: naab
display_name: naab
type: dataset
description: naab is a cleaned Farsi text corpus for pretraining language models, with about 130 GB, 250 million
  paragraphs, and 15 billion words. It merges existing Persian corpora, OSCAR-fa, the formerly private AGP
  corpus, Telegram channels, and LSCP, and a raw version (naab-raw) and the preprocessing code are published
  beside it. Sharif University of Technology's Speech and Language Processing Lab builds it.
huggingface_dataset:
- url: https://huggingface.co/datasets/SLPL/naab
- url: https://huggingface.co/datasets/SLPL/naab-raw
arxiv:
- url: https://arxiv.org/abs/2208.13486
