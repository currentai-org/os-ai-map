name: zarr
display_name: Zarr
type: software
description: Zarr is a storage format for chunked, compressed N-dimensional arrays, and zarr-python is its Python implementation.
  Arrays can live in memory, on disk, in a zip file or on object storage such as S3, are split into chunks along any dimension
  and encoded with a choice of compressors, and can be read and written concurrently from many threads or processes. The format
  is an open, versioned specification with implementations in about ten languages.
