name: geneformer
display_name: Geneformer
type: model
description: Geneformer is the Theodoris lab's transformer model pretrained on human single-cell transcriptomes to make context-aware predictions in network biology. It ships 10M, 104M, and 316M-parameter checkpoints plus a cancer-tuned variant, and the same repository carries the tokenizer, the DeepSpeed pretraining example, fine-tuning notebooks, embedding extraction, and in silico perturbation code.
huggingface_model:
- url: https://huggingface.co/ctheodoris/Geneformer
comments: The weights, the code package, and the Genecorpus training data are all distributed from Hugging
  Face; there is no separate GitHub repository.
