name: private-gpt
display_name: PrivateGPT
type: software
description: PrivateGPT is an API layer for building private AI applications against local or self-hosted models.
  It exposes a messages API with streaming and token counting, file and artifact ingestion, retrieval with citations
  and agentic RAG, built-in tools mirroring the Claude API, custom tools and MCP connectors, structured access to
  databases and CSV files, and embeddings. It works with any OpenAI-compatible model server.
