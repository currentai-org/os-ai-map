name: chatbot-arena
display_name: Chatbot Arena
type: software
description: Hosted arena that ranks language models on blind pairwise human preference, turning crowd votes
  into an Elo-style leaderboard. Where a harness scores a model against fixed tasks, this scores it against
  another model as judged by whoever is at the keyboard. Formerly LMSYS Chatbot Arena and then LMArena, it
  now runs as Arena at arena.ai.
