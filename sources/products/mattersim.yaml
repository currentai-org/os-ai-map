name: mattersim
display_name: MatterSim
type: model
description: MatterSim is Microsoft's deep-learning atomistic model for bulk materials, acting as a machine-learning force field across the periodic table for temperatures from 0 to 5000 K and pressures up to 1000 GPa. It ships 1M- and 5M-parameter M3GNet checkpoints in the repository, with a fine-tuning script for adapting the model to a custom dataset or a higher level of theory.
github:
- url: https://github.com/microsoft/mattersim
comments: The pretrained checkpoints ship inside the repository and through the mattersim PyPI package; more advanced versions are held back behind Azure Quantum Elements. Verified 2026-09-10 via the GitHub API, the repository README, and the model card.
