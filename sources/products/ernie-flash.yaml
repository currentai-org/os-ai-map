name: ernie-flash
display_name: ERNIE Flash
type: model
description: ERNIE Flash is Baidu's line of smaller, efficient ERNIE models. Its open release, ERNIE 5.5 Flash
  Base, published on Hugging Face in October 2026, is a mixture-of-experts base model with 280B total and 14B
  active parameters, pretrained from scratch and released at the end of pretraining so developers can continue
  training it. The post-trained ERNIE 5.5 Flash Preview is offered only as a hosted model.
huggingface_model:
- url: https://huggingface.co/baidu/ERNIE-5.5-Flash-Base
- url: https://huggingface.co/baidu/ERNIE-5.5-Flash-Base-BF16
comments: Scored on ERNIE 5.5 Flash Base, the open pretraining checkpoint. The API-only ERNIE 5.5 Flash Preview
  is left out of the openness reading, and Baidu's flagship line is the separate ernie entry.
