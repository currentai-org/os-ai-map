name: xinference
display_name: Xinference
type: software
description: Xinference is a platform for serving open models on anything from a laptop to a multi-machine cluster. It runs
  language, embedding, reranking, image, audio and video models on engines including vLLM, SGLang, llama.cpp, Transformers
  and MLX, behind OpenAI- and Anthropic-compatible APIs, and adds a web interface for deploying and managing them. It comes
  from the Xorbits project.
github:
- url: https://github.com/xorbitsai/inference
pypi:
- url: https://pypi.org/project/xinference/
