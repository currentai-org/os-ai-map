name: qwen3guard
display_name: Qwen3Guard
type: model
description: Qwen3Guard is Alibaba's family of safety moderation models built on Qwen3, in 0.6B, 4B and 8B
  sizes, that classify prompts and responses as safe, controversial or unsafe across 119 languages. A streaming
  variant classifies each token as it is generated, for real-time moderation. The models run on vLLM, SGLang
  and Hugging Face Transformers.
huggingface_model:
- url: https://huggingface.co/Qwen/Qwen3Guard-Gen-8B
