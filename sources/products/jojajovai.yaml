name: jojajovai
display_name: Jojajovai
type: dataset
description: Jojajovai is a Guarani-Spanish parallel corpus of about 30,000 sentence pairs gathered from eight
  sources, among them news, blogs, books and the AmericasNLP data, each split into training, development and
  test sets. Native speakers annotated a test sample for Guarani dialect, including Jopara, and for translation
  correctness. Researchers at Universidad de la República in Uruguay built it with partners in Paraguay, Brazil
  and Spain.
github:
- url: https://github.com/pln-fing-udelar/jojajovai
comments: The LREC 2022 paper the README cites was not opened here, so collection details rest on the README.
