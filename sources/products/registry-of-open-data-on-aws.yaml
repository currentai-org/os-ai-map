name: registry-of-open-data-on-aws
display_name: Registry of Open Data on AWS
type: software
description: The Registry of Open Data on AWS is a catalog of public datasets that government agencies, researchers
  and companies make available in AWS storage. Data providers propose entries as YAML files by pull request, and
  AWS's open data team decides what is listed. Each entry names the S3 buckets or other resources that hold the
  data, which anyone can read without an AWS account, and the Open Data Sponsorship Program pays storage costs for
  sponsored datasets.
github:
- url: https://github.com/awslabs/open-data-registry
