name: shrutilipi
display_name: Shrutilipi
type: dataset
description: Shrutilipi is a labeled speech recognition corpus of more than 6,400 hours in 12 Indian languages,
  from Bengali and Hindi to Sanskrit and Urdu. Its audio and sentence transcripts were mined from All India
  Radio news bulletins by aligning broadcast audio with the published bulletin text. AI4Bharat built it, and
  the paper reports 4.95 million sentences.
huggingface_dataset:
- url: https://huggingface.co/datasets/ai4bharat/Shrutilipi
arxiv:
- url: https://arxiv.org/abs/2208.12666
