name: za-african-next-voices
display_name: ZA African Next Voices
type: dataset
description: 'ZA African Next Voices, also called Swivuriso, is a speech recognition dataset of about 3,000
  hours of scripted and unscripted speech in seven South African languages: isiZulu, isiXhosa, Sesotho, Setswana,
  Xitsonga, isiNdebele and Tshivenda. Topics span agriculture, health, finance and general subjects, with speaker-disjoint
  splits. The South Africa Next Voices team publishes it under the dsfsi-anv Hugging Face organization, alongside
  a compressed copy.'
huggingface_dataset:
- url: https://huggingface.co/datasets/dsfsi-anv/za-african-next-voices
- url: https://huggingface.co/datasets/dsfsi-anv/za-african-next-voices-compressed
arxiv:
- url: https://arxiv.org/abs/2512.02201
