name: matrixhub
display_name: MatrixHub
type: software
description: Self-hosted model registry that works as a drop-in private replacement for Hugging Face Hub in
  inference infrastructure. Pointing HF_ENDPOINT at it lets the hf CLI, vLLM, SGLang and Dynamo download and
  upload models, and repositories are reachable over Git, Git LFS and HTTP with project-scoped permissions
  and version management. It can cache public Hugging Face models on first request, on local or NFS storage.
  Most of its maintainers work at DaoCloud, and the project describes itself as community-led.
github:
- url: https://github.com/matrixhub-ai/matrixhub
