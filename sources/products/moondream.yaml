name: moondream
display_name: Moondream
type: model
description: Moondream is M87 Labs' small vision-language model line, built to run quickly on local hardware. Moondream
  3.1, a 9B mixture-of-experts model with 2B active parameters, answers questions, writes captions, and returns
  points and bounding boxes as structured output, with an optional reasoning mode. The earlier Moondream 2 is a
  2B model.
github:
- url: https://github.com/m87-labs/moondream
huggingface_model:
- url: https://huggingface.co/moondream/moondream3.1-9B-A2B
- url: https://huggingface.co/vikhyatk/moondream2
comments: Scored on Moondream 3.1, whose custom license forbids reselling general-purpose hosted Moondream inference.
  Moondream 2 is still published under Apache 2.0.
