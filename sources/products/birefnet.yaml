name: birefnet
display_name: BiRefNet
type: model
description: High-resolution dichotomous image segmentation model that separates a foreground object from its
  background, widely used for background removal and matting. Its Bilateral Reference design refines a coarse
  mask with high-resolution image patches and gradient cues. Checkpoints cover general use, a lighter model,
  2K inputs, matting, portraits, camouflaged and salient objects, with training code in the repository.
