name: fineweb
display_name: FineWeb
type: dataset
languages: [eng]
description: FineWeb is an English pretraining dataset of more than 18.5 trillion tokens of cleaned and deduplicated
  text derived from Common Crawl snapshots dating back to 2013. It is distributed as Parquet in date-based
  subsets, and its processing pipeline was built with the datatrove library. Hugging Face's FineWeb team releases
  it.
huggingface_dataset:
- url: https://huggingface.co/datasets/HuggingFaceFW/fineweb
lineage:
  derived_from:
  - Common Crawl
  curated_with:
  - datatrove
