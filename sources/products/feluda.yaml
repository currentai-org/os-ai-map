name: feluda
display_name: Feluda
type: software
description: Feluda is a configurable engine by Tattle for analysing multilingual, multimodal content
  (images, text, video), built around a modular 'operators' plugin architecture. It supports vector embeddings,
  hash-based search, text extraction from images, and entity extraction. It is open infrastructure for
  analysing misinformation and social-media content, particularly in Indian-language contexts.
