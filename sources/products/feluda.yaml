name: feluda
display_name: Feluda
type: software
description: Feluda is a configurable engine by Tattle for analyzing multilingual, multimodal content (images,
  text, video), built around a modular 'operators' plugin architecture. It supports vector embeddings, hash-based
  search, text extraction from images, and entity extraction. It was built for analyzing social-media content,
  particularly in Indian-language contexts.
github:
- url: https://github.com/tattle-made/feluda
