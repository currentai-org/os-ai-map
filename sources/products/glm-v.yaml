name: glm-v
display_name: GLM-V
type: model
description: GLM-V is Z.ai's vision-language reasoning line, from GLM-4.1V-Thinking through GLM-4.5V to GLM-4.6V
  and the 9B GLM-4.6V-Flash, trained with reinforcement learning on curriculum-sampled tasks. The models read long
  documents and video, ground objects with boxes, operate phone, desktop and web interfaces, and GLM-4.6V adds native
  function calling over images in a 128K context. The line is separate from Z.ai's GLM text models.
github:
- url: https://github.com/zai-org/GLM-V
huggingface_model:
- url: https://huggingface.co/zai-org/GLM-4.6V
- url: https://huggingface.co/zai-org/GLM-4.6V-Flash
- url: https://huggingface.co/zai-org/GLM-4.1V-9B-Thinking
arxiv:
- url: https://arxiv.org/abs/2507.01006
comments: The older glm-4v-9b model, under the more restrictive GLM-4 license, is a predecessor and not part of
  this entry.
