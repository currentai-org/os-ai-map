name: vantage6
display_name: vantage6
type: software
description: Privacy-preserving federated analysis infrastructure from IKNL. A central HQ server, an authentication
  service, an algorithm store and a web UI coordinate nodes that each data holder runs in Docker beside its own
  data; algorithms travel to the nodes as containers, and the network runs federated learning, federated statistics
  or MPC algorithms.
github:
- url: https://github.com/vantage6/vantage6
pypi:
- url: https://pypi.org/project/vantage6/
comments: The repository's LICENSE is the Apache License 2.0, while the PyPI record for `vantage6` reports MIT.
  The score follows the LICENSE body; both are OSI, so the disagreement does not move the score. `vantage6-client`
  is not declared.
