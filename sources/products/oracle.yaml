name: oracle
display_name: Oracle
type: software
description: Ask the oracle when you're stuck. Invoke GPT-5 Pro with a custom context and files. Oracle is a CLI
  and MCP server that bundles a prompt with the files you select, sends that context to an AI model through an API
  or a signed-in browser, and stores the result as a session. It is for developers and coding agents that need a
  second-model review grounded in the actual project.
