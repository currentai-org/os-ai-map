name: ezkl
display_name: EZKL
type: software
description: EZKL turns a neural network exported to ONNX into a zero-knowledge circuit and proves that an
  inference was run on that model, without revealing the inputs or weights the prover chooses to keep private.
  Proofs use the Halo2 proof system and verify in a browser, on a device or on-chain in the Ethereum Virtual
  Machine. Zkonduit maintains it as a Rust library with Python bindings, and publishes a JavaScript engine
  package on npm.
comments: 'Tagged independently verifiable: a verifier checks the proof itself. The repository carries no license
  grant, so the code can be read but not freely reused.'
github:
- url: https://github.com/zkonduit/ezkl
pypi:
- url: https://pypi.org/project/ezkl/
npm:
- url: https://www.npmjs.com/package/@ezkljs/engine
