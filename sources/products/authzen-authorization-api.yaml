name: authzen-authorization-api
display_name: AuthZEN Authorization API
type: software
description: The AuthZEN Authorization API is an OpenID Foundation specification for how a policy enforcement point
  asks a policy decision point whether a subject may perform an action on a resource, and for searching which subjects,
  resources or actions a policy permits. The OpenID AuthZEN working group publishes it, with draft profiles that
  map Model Context Protocol tool calls onto the same request.
github:
- url: https://github.com/openid/authzen
