name: apheris-networks
display_name: Apheris Networks
type: software
description: Apheris's federated networks and the Compute Gateway that runs them. Each data custodian deploys the
  Gateway into its own environment from Apheris's Helm chart; the Gateway polls the Apheris orchestrator, checks
  every computation against the custodian's asset policies and privacy controls, and runs federated statistics or
  federated training, with NVIDIA FLARE as the main federation framework. Apheris runs industry networks for drug
  discovery on it, such as the AI Structural Biology network of pharmaceutical companies.
comments: Closed, and on the map as an ADR-005 best-in-class comparator for this category. The installable `apheris-cli`
  package is a client for submitting jobs to the product, not the product, so it is not declared.
