name: vercel-sandbox
display_name: Vercel Sandbox
type: software
description: Vercel Sandbox runs untrusted or agent-generated code in a Firecracker microVM with its own filesystem
  and network, started from a Vercel-managed Linux image or a custom OCI image in the Vercel Container Registry.
  Sandboxes persist by default, resuming where they stopped, and can be snapshotted, given root and system
  privileges, or split per agent by Linux user. JavaScript and Python SDKs and a CLI drive it, and each sandbox
  runs in a Vercel region the caller chooses.
