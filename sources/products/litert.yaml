name: litert
display_name: LiteRT
type: software
description: LiteRT is Google's on-device runtime for machine learning and generative AI, and the successor to TensorFlow
  Lite. It runs converted PyTorch, TensorFlow and JAX models on Android, iOS, the web, desktop and IoT devices,
  choosing a CPU, GPU or NPU accelerator automatically, with NPUs from Google Tensor, Qualcomm, MediaTek, Intel
  and others behind one API. LiteRT-LM, which runs language models on device, is built on it.
github:
- url: https://github.com/google-ai-edge/LiteRT
pypi:
- url: https://pypi.org/project/ai-edge-litert/
- url: https://pypi.org/project/tflite-runtime/
comments: TensorFlow Lite was renamed LiteRT, and the .tflite model format carries over. LiteRT-LM, the language-model
  layer built on this runtime, is its own product on the map.
