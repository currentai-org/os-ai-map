name: oxen
display_name: Oxen
type: software
description: Oxen is a data version control system built for large repositories of files, from training data and
  model weights to game assets. It mirrors git's workflow (init, add, commit, push, pull) while handling millions
  of files and terabytes of data, with a Rust core (`liboxen`), a CLI, Python bindings, and a self-hostable Oxen
  Server for remotes.
github:
- url: https://github.com/Oxen-AI/Oxen
pypi:
