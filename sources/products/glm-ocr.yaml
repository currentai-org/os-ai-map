name: glm-ocr
display_name: GLM-OCR
type: model
description: Z.ai's compact multimodal OCR model for complex documents, pairing a CogViT visual encoder with a small
  GLM language decoder at 0.9B parameters. It parses pages into Markdown with tables and formulas, and extracts
  fields into a JSON schema the caller supplies. The official SDK adds PP-DocLayoutV3 layout analysis in front of
  the model.
github:
- url: https://github.com/zai-org/GLM-OCR
huggingface_model:
- url: https://huggingface.co/zai-org/GLM-OCR
arxiv:
- url: https://arxiv.org/abs/2603.10910
comments: Weights are MIT and the SDK is Apache-2.0. A separate product from the GLM language models and from glm-v,
  the GLM vision-language line, though it is built on the GLM-V architecture.
