name: snowflake-arctic
display_name: Snowflake Arctic
type: model
description: Snowflake Arctic is a 480B-parameter language model that pairs a 10B dense transformer with
  a residual mixture-of-experts layer of 128 experts, activating 17B parameters per token. Snowflake's
  AI research team trained it from scratch and released base and instruct checkpoints in April 2024, tuned
  for SQL generation, coding and instruction following.
github:
- url: https://github.com/Snowflake-Labs/snowflake-arctic
huggingface_model:
- url: https://huggingface.co/Snowflake/snowflake-arctic-instruct
- url: https://huggingface.co/Snowflake/snowflake-arctic-base
comments: Arctic has had no new release since April 2024. Snowflake's later Arctic-named models are embedding,
  text-to-SQL and speculative-decoding checkpoints, and Arctic Embed is its own entry.
