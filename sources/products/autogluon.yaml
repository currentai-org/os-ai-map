name: autogluon
display_name: AutoGluon
type: software
description: Automated machine-learning library that trains, tunes and stack-ensembles models for tabular prediction,
  time-series forecasting and multimodal image, text and tabular tasks from a few lines of code. Its tabular predictor
  fits gradient-boosted trees, neural networks and tabular foundation models such as Mitra, TabICL and TabPFN side
  by side, and its forecaster includes Chronos. Developed at Amazon, which also offers it as a managed service.
github:
- url: https://github.com/autogluon/autogluon
pypi:
- url: https://pypi.org/project/autogluon.core
