name: internvideo
display_name: InternVideo
type: model
description: InternVideo is Shanghai AI Laboratory's line of video understanding models, built by its OpenGVLab team. InternVideo3,
  the current release, is an 8B chat model on a Qwen3-VL backbone whose compressed attention cache lets it follow hour-long
  videos of up to 2,048 frames. While it reasons over a video it can call tools such as temporal grounding, speech recognition
  and web search, and check its own answer.
github:
- url: https://github.com/OpenGVLab/InternVideo
huggingface_model:
- url: https://huggingface.co/yanziang/InternVideo3-8B-Instruct
- url: https://huggingface.co/OpenGVLab/InternVideo2_5_Chat_8B
arxiv:
- url: https://arxiv.org/abs/2606.12195
- url: https://arxiv.org/abs/2501.12386
comments: The InternVideo2 and InternVideo-Next video encoders in the same repository are vision backbones rather than chat
  models and are not part of this entry. InternVideo3's weights sit under a team member's Hugging Face account, which the
  official repository links.
