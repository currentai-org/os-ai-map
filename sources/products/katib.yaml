name: katib
display_name: Kubeflow Katib
type: software
description: Kubernetes-native hyperparameter tuning and neural architecture search. An Experiment declares
  the search space, objective and algorithm; Katib's controllers create Trials, run them in parallel up to
  a declared limit, collect the objective metric from each and stop the Experiment when the goal or the trial
  budget is reached. It is framework-agnostic and tunes whatever the trial runs.
github:
- url: https://github.com/kubeflow/katib
comments: Ships as a Kubernetes controller with no package channel, so adoption bands on stars. Verified 2026-09-15
  via the repository and its recursive tree.
