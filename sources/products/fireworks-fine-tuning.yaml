name: fireworks-fine-tuning
display_name: Fireworks Fine-Tuning
type: software
description: Fireworks Fine-Tuning trains open-weight models such as Qwen, DeepSeek and Kimi through a Training
  API for custom Python loops on Fireworks-managed GPUs. Serverless Training runs LoRA SFT, DPO, ORPO, reinforcement
  learning and distillation on shared GPUs, and Dedicated Training adds full-parameter training on provisioned
  capacity. Trained adapters deploy to Fireworks on-demand deployments, merged into the base model or as multi-LoRA
  adapters, and select base models also serve on serverless. Managed SFT and DPO jobs no longer accept new
  work.
