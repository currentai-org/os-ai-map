name: fireworks-fine-tuning
display_name: Fireworks Fine-Tuning
type: software
description: Fireworks Fine-Tuning trains open-weight models such as Qwen, DeepSeek and Kimi on Fireworks-managed
  GPUs through its Training API, which runs custom Python training loops. Serverless Training runs LoRA supervised
  fine-tuning, DPO, reinforcement learning and distillation on shared GPUs, and Dedicated Training adds ORPO
  and full-parameter training on provisioned capacity. Managed SFT and DPO jobs are paused, and Fireworks directs
  users to migrate them to the Training API. Trained adapters deploy to Fireworks on-demand deployments, merged
  into the base model or as multi-LoRA adapters, and select base models also serve on serverless.
