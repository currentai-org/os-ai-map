name: fireworks-fine-tuning
display_name: Fireworks Fine-Tuning
type: software
description: Fireworks Fine-Tuning runs managed supervised, DPO and ORPO preference, and reinforcement fine-tuning
  on open-weight models such as Llama, Mistral, Qwen and DeepSeek, producing LoRA adapters that can warm-start
  from a prior checkpoint. A Training API adds custom Python training loops on Fireworks-managed GPUs, with
  full-parameter training on dedicated capacity. Trained models are served only from Fireworks on-demand deployments,
  either merged into the base model or as multi-LoRA adapters sharing hardware.
