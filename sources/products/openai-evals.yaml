name: openai-evals
display_name: OpenAI Evals
type: software
description: Framework for evaluating language models and the systems built on them, published in 2023 with
  a registry of community-contributed benchmarks as an early open framework for eval-driven development. It
  supports custom eval authoring and model-graded grading, and runs against private data as well as the bundled
  registry.
github:
- url: https://github.com/openai/evals
comments: Development has effectively stopped, with no push since April 2026. Bundled eval datasets are carved
  out of the repository terms.
