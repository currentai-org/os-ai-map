name: amazon-rekognition
display_name: Amazon Rekognition
type: software
description: AWS's managed image and video analysis service, with pretrained APIs for labels, text, faces, face
  search and liveness, celebrities, content moderation and protective equipment. Custom Labels trains classifiers
  and detectors for a customer's own objects from as few as ten images with automated machine learning, inside the
  same service. It runs only as a hosted AWS API.
