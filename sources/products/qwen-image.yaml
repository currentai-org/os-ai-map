comments: The current release, Qwen-Image 3.0, is hosted-only; Qwen-Image-2.1 remains downloadable under a non-commercial
  research license and the earlier releases under Apache 2.0. The openness reading follows the current release and
  is held for a ruling on how the map shows an open line one generation behind its vendor's closed flagship.
