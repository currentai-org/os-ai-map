name: qwen-image
display_name: Qwen-Image
type: model
description: Qwen-Image is Alibaba's Qwen family of image generation and editing models, built on a 20B multimodal
  diffusion transformer and designed for complex text rendering and precise editing. The downloadable line runs
  from the original 20B Qwen-Image and its Edit, Layered and 2512 updates to Qwen-Image-2.1, a unified generation-and-editing
  model that takes up to ten reference images. Qwen-Image 2.0 and 3.0 are served only through Alibaba Cloud Model
  Studio.
