name: qwen-image
display_name: Qwen-Image
type: model
description: Qwen-Image is Alibaba's Qwen family of image generation and editing models, designed for complex text
  rendering and precise editing. Its current release, Qwen-Image 3.0, is served only through Alibaba Cloud Model
  Studio. The downloadable line runs from the original 20B Qwen-Image and its Edit, Layered and 2512 updates to
  Qwen-Image-2.1, a unified generation-and-editing model that takes up to ten reference images.
