name: torchvision
display_name: torchvision
type: software
description: PyTorch's computer-vision library, with popular datasets, image and video transforms, vision operators,
  and model architectures with pretrained weights for classification, semantic and instance segmentation, object
  detection, keypoint detection, video classification and optical flow. Reference training scripts reproduce
  each model. It is part of the PyTorch project under the PyTorch Foundation.
