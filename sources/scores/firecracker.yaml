adoption:
  level: 5
  reach: '>10M'
  signal_type: usage_volume
  confidence: high
  note: 'Underpins AWS Lambda and AWS Fargate, among the highest-volume serverless platforms in the world
    (trillions of invocations), plus downstream use in Kata Containers, Flintlock and E2B. Production reach
    far exceeds the >10M band, and the 36,040 GitHub stars only corroborate it. One caveat travels with
    the level: there is no countable artifact behind it. Firecracker ships as a statically linked Rust binary
    from GitHub releases rather than as a package on any registry, and its PyPI namesake is not its distribution
    channel, so the band rests on reported AWS platform volume - trillions of Lambda executions monthly
    and tens of millions of Fargate containers weekly - rather than on a download count.'
  last_verified: '2026-08-13'
  sources:
  - url: https://github.com/firecracker-microvm/firecracker
    shows: developed at AWS; powers AWS Lambda and AWS Fargate; integrated into Kata Containers and Flintlock
    accessed: '2026-06-04'
