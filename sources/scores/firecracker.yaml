capability:
  score: 5
  basis: feature_matrix
  value: isolation:hardware-virtualized microVM (KVM), strongest isolation tier; cold-start:~125ms boot,
    <5MiB memory overhead per microVM; language/runtime breadth:runs any OCI/container or function workload
    (kernel-level, language-agnostic); scale:powers Lambda/Fargate fleets
  confidence: high
  note: Firecracker combines hardware-virtualized isolation with container-like startup speed and density,
    and it is the microVM underneath AWS Lambda and Fargate and managed sandboxes such as E2B. That pairing
    of isolation strength, startup speed and proven scale is what the rest of the category is compared against.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/firecracker-microvm/firecracker
    shows: lightweight microVMs combining hardware virtualization security with container speed; minimal
      memory footprint/attack surface
    accessed: '2026-06-04'
  - url: https://raw.githubusercontent.com/firecracker-microvm/firecracker/main/README.md
    shows: The VMM "uses the Linux Kernel Virtual Machine (KVM) to create and run microVMs", excludes "unnecessary
      devices and guest-facing functionality to reduce the memory footprint and attack surface area", and
      targets "secure, multi-tenant container and function-based services". Language-agnostic at the kernel
      level rather than tied to a runtime.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 5f9d595c536442234bc0d96f68e7e90db412b9d5d82c14db02872e24c75bc46b
