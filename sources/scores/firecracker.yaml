  note: Firecracker is the microVM engine behind AWS Lambda and Fargate, and is also embedded in Kata Containers,
    Flintlock and E2B. It ships as a binary from GitHub releases rather than a package on any registry,
    so adoption here is read from the scale of the platforms it powers rather than from a download count.
