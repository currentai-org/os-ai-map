capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: MCP server/client SDK feature breadth'
  value: 'of the Model Context Protocol at version 2025-11-25: both roles, the full primitive set, and all
    three transports - "MCP-Go supports stdio, SSE and streamable-HTTP transport layers"'
  relative_to: mcp-python-sdk
  relation: at
  confidence: medium
  note: 'Both roles, the full primitive set and all three transports, which is band 4 - the same coverage as
    the Python SDK, in Go. It also implements task capabilities beyond the primitive set, which is surface
    the ladder does not read because the bands are the spec''s own dimensions. Band 5 is out of reach on this
    evidence rather than on a judgement: it needs the optional features the cited spec version defines for
    the roles implemented - sampling, roots and elicitation - and none of the documentation read here enumerates
    them. Closing that is a documentation read, not a product change. Its README enumerates support through
    the 2025-11-25 specification, backward compatible to 2024-11-05. The newest published version is 2026-07-28,
    so this record cannot reach band 5 on the version leg alone, whatever its optional-feature coverage - which
    is a real distinction between it and the two official SDKs above, and the reason to record the version
    at all.'
