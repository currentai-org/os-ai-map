  confidence: high
  note: FineWeb-Edu raises MMLU and ARC well above unfiltered FineWeb, and matches the MMLU score of the
    Matrix corpus with almost 10x fewer tokens. SmolLM2 and SmolLM3 both use it as a core web component
    alongside DCLM.
  last_verified: '2026-09-29'
  sources:
