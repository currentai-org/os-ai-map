  value: Programmable rails for I/O moderation, dialog/topic control, retrieval filtering, and tool-use
    control via Colang; multi-provider.
  confidence: medium
  note: Beyond checking inputs and outputs, it applies rails to retrieved content and tool calls, and its
    Colang language scripts whole dialog flows, which goes further than scanners that only inspect individual
    messages.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/NVIDIA/NeMo-Guardrails
    shows: README describes programmable guardrails for LLM applications, with dialog rails operating on
      canonical-form messages via the Colang Guide, fact-checking and output moderation over retrieval pipelines,
      keeping an assistant on topic, and deciding whether an action should be executed - that is I/O moderation,
      dialog control, retrieval filtering and tool-use control.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 44efd86e89b427836a7bfac706a5625812cb1bbac87ff3e425f52415c7115bcb
  - url: https://docs.nvidia.com/nemo/guardrails/
    shows: The NVIDIA docs overview says "Input, retrieval, dialog, execution, and output rails run at different
      stages of an LLM interaction" and that "Colang defines conversational flows, guardrail logic, and
      event-driven behavior." Its use cases cover content safety, jailbreak detection, topic control ("Control
      what topics the bot can and cannot discuss"), PII masking and agentic security ("Execute rails that
      validate tool inputs and outputs before and after invocation"), and it lets teams "Combine built-in
      guardrails, NVIDIA safety models, community models, third-party APIs, and custom Python actions."
