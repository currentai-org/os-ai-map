  basis: feature_matrix
  basis_detail: coverage and downstream use for massively multilingual labeled speech
  value: About 44,700 hours of New Testament readings in 1,107 languages, recorded by people and force-aligned
    to text, documented in the MMS paper, and used to train Meta's MMS recognition and synthesis models.
  confidence: medium
  note: MMS-lab spans more languages than any other labeled speech corpus, and Meta trained its MMS recognition
    and synthesis models for 1,107 languages on it. It is a step below Mozilla Common Voice because it is one
    narrow domain, Bible reading, mostly by a single speaker per recording, and the MMS paper found models
    trained on Common Voice did better on FLEURS.
  relative_to: common-voice
  relation: one_below
