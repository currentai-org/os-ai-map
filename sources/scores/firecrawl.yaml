capability:
  score: 4
  basis: feature_matrix
  value: '`POST /v2/search`, documented as "Search and optionally scrape search results", alongside scrape,
    batch scrape, crawl, map and browser-session endpoints on the same API'
  confidence: medium
  note: 'Firecrawl''s search endpoint finds and returns content in a single call: its own documentation
    describes it as searching and optionally scraping the results. It does not compose an answer from what
    it returns, so retrieval stops at handing back the raw content.'
  last_verified: '2026-09-17'
  sources:
  - url: https://docs.firecrawl.dev/api-reference/endpoint/search
    shows: 'The Firecrawl Search endpoint: "Search and optionally scrape search results", `POST https://api.firecrawl.dev/v2/search`
      with query, limit, sources, categories and domain filters. The same reference lists Scrape, Batch Scrape,
      Crawl, Map and Interact endpoints.'
