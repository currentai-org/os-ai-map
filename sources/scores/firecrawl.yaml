adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: Firecrawl's usage is measured by GitHub stars because neither the repository nor the pricing page
    publishes a download, request or customer count for its paid API, which sells credits instead. A star
    is not a use, so real usage is almost certainly greater than the count alone can show for a tool this
    widely integrated into agent scraping workflows, including LangChain.
