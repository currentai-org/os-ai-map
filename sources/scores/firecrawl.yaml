adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: 'Neither the repository nor the pricing page publishes a download, request-volume or customer count
    of any kind - a paid API sells credits rather than reporting usage - so there is nothing here to band
    as usage volume. The only honest signal is GitHub stars: 166,863 on the one declared repository, which
    bands at >10K stars, level 3 on the stars scale, and a stars-based signal caps the level there because
    a star is not a use. Firecrawl is widely integrated as an agent scraping tool (LangChain among others),
    so real usage is very likely higher than this band can show. The page the count comes from carries a
    live star counter, so its content will differ on any later fetch; that is expected drift on this source
    rather than a signal about the claim.'
  last_verified: '2026-08-13'
  sources:
  - url: https://github.com/mendableai/firecrawl
    shows: Repo page, 166,863 stargazers, AGPL-3.0. No download count, request count or customer count published.
    accessed: '2026-08-13'
    http_status: 200
