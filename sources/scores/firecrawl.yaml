openness:
  score: 4
  class: open_core
  components:
    license:
    - name: AGPL-3.0
      detail: OSI, self-host core
    source:
      value: public
    managed-cloud:
      value: firecrawl.dev with 'additional features' beyond OSS = open-core split
    core-gated:
      value: gated
      detail: Fire-engine is closed and its source is in no public repo - the tree ships only a client at
        apps/api/src/scraper/scrapeURL/engines/fire-engine and .env.example calls FIRE_ENGINE_BETA_URL the
        fire engine closed beta. Screenshots and page actions are unavailable in the self-hosted stack because
        both require Fire-engine
  confidence: high
  note: 'The AGPL-3.0 core is genuinely open, but a piece of the product is withheld from it, which is what
    keeps this at open core rather than open source. The gate has a name: Fire-engine, Firecrawl''s own
    scraping engine, whose source is in no public repository. What firecrawl/firecrawl publishes under apps/api/src/scraper/scrapeURL/engines/fire-engine
    is only a client - index.ts, scrape.ts, checkStatus.ts, delete.ts, brandingScript.ts - pointed at a
    URL you have to be given, and apps/api/.env.example says as much in one line: "# set if you''d like
    to use the fire engine closed beta" above FIRE_ENGINE_BETA_URL=. The self-hosting guide then spells
    out what the open build cannot do without it: screenshots and page actions are "Not available in the
    default stack. Fetch and Playwright both report no support; both require Fire-engine", Fire-engine must
    be "run and configured separately; it is not included", and the agent, browser, interact and specialty
    product, audio and video formats need Cloud or another external service. The same .env.example shows
    the pattern twice more - the product format needs "an external product-extraction service", as do the
    audio and video formats. These are features of the product itself, kept out of the published source
    behind a closed beta, so the score stays at 4. The managed cloud advertising "additional features" would
    not on its own be enough to establish a gate; the evidence here is in the code.'
