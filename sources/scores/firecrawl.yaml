product: firecrawl
openness:
  score: 4
  class: open_core
  components:
    license:
    - name: AGPL-3.0
      detail: OSI, self-host core
    source:
      value: public
    core-gated:
      value: gated
      detail: Fire-engine is closed and its source is in no public repo - the tree ships only a client at
        apps/api/src/scraper/scrapeURL/engines/fire-engine and .env.example calls FIRE_ENGINE_BETA_URL the
        fire engine closed beta. Screenshots and page actions are unavailable in the self-hosted stack because
        both require Fire-engine
    context:
      managed-cloud:
        value: firecrawl.dev with 'additional features' beyond OSS = open-core split
  confidence: high
  note: Firecrawl's AGPL-3.0 core is open, but Fire-engine, its own scraping engine, is not available in
    any public repository. The source tree includes only a client that connects to a separately provided
    endpoint, and the self-hosting guide says that screenshots, page actions, agents, browser features and
    specialty formats require either Fire-engine or Firecrawl Cloud. In other words, part of the product
    itself is withheld from the published source. That is what makes Firecrawl open core; the managed cloud's
    additional features would not be enough on their own.
