capability:
  score: 1
  basis: feature_matrix
  value: pipelines and steps written once and run on a configured stack; the orchestrator
    is a pluggable stack component - local, Docker, Kubernetes, Airflow, Kubeflow,
    SageMaker, AzureML, Databricks, Tekton, SkyPilot VM, HyperAI, Lightning AI - and
    ZenML owns none of them
  confidence: medium
  note: 'The floor of this category''s ladder, and ZenML''s own documentation is what
    puts it there: the orchestrator is ''a mandatory component in the ZenML stack''
    and is ''responsible for running your machine learning pipelines''. ZenML hands
    the whole pipeline to an orchestrator it does not own, so it places nothing and
    does not even choose a pool per unit of work. That is a statement about this one
    dimension and not about the product''s quality; the stack abstraction is the point
    of ZenML, and this axis measures the thing it deliberately delegates.'
  last_verified: '2026-09-15'
  sources:
  - url: https://docs.zenml.io/stacks/stack-components/orchestrators
    shows: 'ZenML''s orchestrator documentation: the orchestrator is ''an essential
      component in any MLOps stack as it is responsible for running your machine learning
      pipelines'' and ''a mandatory component in the ZenML stack'', with flavors listed
      for local, Docker, Kubernetes, Airflow, Kubeflow, SageMaker, AzureML, Databricks,
      Tekton, SkyPilot VM and others.'
