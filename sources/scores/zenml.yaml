capability:
  score: 3
  basis: feature_matrix
  value: pipelines and steps written once and run on a configured stack; the orchestrator is a pluggable stack
    component and is mandatory, with flavors for local and Docker execution that ZenML implements itself and
    for Airflow, Kubeflow, SageMaker, AzureML, Databricks, Tekton, SkyPilot VM, HyperAI and Lightning AI that
    hand execution to a system ZenML does not own
  confidence: medium
  note: ZenML's local and Docker orchestrators are its own code, deciding when each step runs and dispatching
    it, the same shape of decision as Kubeflow Pipelines. Its remote flavors, including Airflow, Kubeflow,
    SageMaker, AzureML, Databricks, Tekton and SkyPilot, delegate the whole pipeline to that external system
    instead, which is the point of using them.
  last_verified: '2026-09-15'
