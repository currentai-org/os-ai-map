product: zenml
openness:
  score: 4
  class: open_core
  components:
    license:
    - name: Apache-2.0
      detail: OSI
    source:
      value: public
      detail: zenml-io/zenml is the open-source server and SDK
    core-gated:
      value: gated
      detail: ZenML Pro ships as separate container images privately hosted in ZenML's
        GCP Artifact Registry and AWS ECR repositories, with access granted on request;
        the open edition is documented as having no RBAC and no workspaces or projects
  confidence: high
  note: 'Apache-2.0 source, with functionality withheld from it. ZenML''s own in-repository
    documentation states the split: the open-source edition has no role-based access
    control and no workspaces or projects, while Pro adds those plus the Model Control
    Plane, the Artifact Control Plane and run snapshots. What makes this gating rather
    than a separate product sold alongside is the packaging - Pro''s container images
    are privately hosted in ZenML''s own GCP Artifact Registry and AWS ECR repositories
    with access granted on request, and a self-hosted Pro deployment pulls them with
    an image-pull secret. That is a closed component of the deployment you run, the
    langgraph shape, rather than the langchain shape where a hosted platform sits
    beside a complete open core.'
