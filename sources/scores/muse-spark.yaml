  note: Muse Spark powers Meta AI in the Meta AI app and website and across WhatsApp, Instagram, Facebook,
    Messenger, Threads and Meta's AI glasses, and since October it also ships as the downloadable Muse
    Spark Open weights. Meta describes the reach of those surfaces as a whole and publishes no active-user
    figure for Muse Spark itself. Hugging Face downloads measure only the Open weights, one SKU of the
    line, so they do not band the product.
