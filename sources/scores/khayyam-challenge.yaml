  value: The Khayyam Challenge holds 20,192 original Persian exam questions across 38 tasks with human response
    rates, documented in a paper with no card, and the ParsBench leaderboard uses it.
  confidence: medium
  note: The Khayyam Challenge is a documented Persian knowledge benchmark of original exam questions with human
    response rates, and the ParsBench leaderboard uses it. It is a step below ArabicMMLU because it has no
    card and carries restrictive terms, which make it harder to adopt.
