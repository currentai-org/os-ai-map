  confidence: high
  note: Inkling's weights are released under Apache-2.0, but the training data and the full training pipeline
    are withheld, so it is an open-weights release rather than a fully open model. Downloading the weights
    also binds the user to Thinking Machines' Model Acceptable Use Policy, which restricts conduct such as
    weapons development and surveillance but sets no user, revenue or commercial ceiling, and which the company
    may revise. Press coverage often calls Inkling open source because of the license tag, but the data and
    training code needed to reproduce it are not public.
  last_verified: '2026-11-12'
