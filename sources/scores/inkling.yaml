    K3.1 Pro 46. Artificial Analysis outside the index: GPQA Diamond 87.2% and HLE 31.9% against Olmo 3.1
    32B Think 59.1% and 6.3%. Epoch AI runs, Inkling (xhigh) against Mistral Large 4 (high): GPQA Diamond
    88.3% vs 88.1%, OTIS Mock AIME 88.9% vs 98.3%, FrontierMath tiers 1-3 33.3% vs 58.6% (Inkling Small
    46.3%), SimpleQA Verified 40.3% vs 20.0%; Phi-4 56.1% and 13.8% on the first two. APEX-Agents 33.8%
    vs 51.6%. LMArena text, style control, 2026-11-11: Kimi K3.1 Pro 1485, Inkling 1442, Mistral Large 4
    1420, Inkling Small 1405, Phi-4 1256. Vals AI SWE-bench Verified: Inkling 77.6%, Inkling Small 82.2%,
    DeepSeek V4 Pro 77.4%, Kimi K3 93.4%, no Mistral Large 4 entry.'
  confidence: medium
  note: Inkling scores 12 and Inkling Small 13 on version 5.0.1 of Artificial Analysis's Intelligence Index,
    against 26 for Mistral Large 4, and Epoch AI's own runs and the APEX-Agents benchmark also put Mistral
    Large 4 ahead on competition math and agentic work. Inkling matches it on graduate-level science, recalls
    more facts, and rates above it in LMArena's human-preference ratings, while clearly outperforming Phi-4
    and OLMo 3.1 32B Think. Vals AI's own SWE-bench Verified run reproduces the vendor's 77.6%.
