    V4 Pro 0813 (Max) 23, ahead on seven; Kimi K3.1 Pro 46, ahead on all nine.'
  confidence: high
  note: 'On its own evaluation table Inkling beats Nemotron 3 Ultra on SWE-bench Verified (77.6 vs 70.7)
    but trails Kimi K2.6 (80.2) and DeepSeek-V4-Pro (80.6), and Thinking Machines'' launch post says Inkling
    is not the strongest overall model available, open or closed. Artificial Analysis''s independent index
    places it lower: on version 5.0.1 Inkling scores 12 and Inkling Small 13, against 23 for DeepSeek V4
    Pro and 26 for Mistral Large 4, which leads Inkling on every evaluation in the index, most widely on
    the agentic tasks.'
