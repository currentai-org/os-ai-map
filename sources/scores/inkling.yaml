capability:
  score: 4
  basis: benchmark
  basis_detail: Artificial Analysis Intelligence Index v5.0.1 and its evaluations; Vals Index v2.2 and its
    tasks; Mercor APEX-Agents; LMArena text, WebDev and Agent arenas; ARC Prize; Epoch AI benchmarking hub;
    vendor evaluation tables
  relative_to: kimi
  relation: one_below
  value: 'Governing release Inkling 2 Small (reasoning, effort 0.99), read 2026-11-13 against the settled
    MiMo-V2.6-Pro, MiniMax-M3.1-Flash, GLM-5.3 (Max), DeepSeek V4.1 Flash 1017 (Max) and Kimi K3.1 Pro and
    the provisional reference Mistral Large 4 (High). Artificial Analysis Intelligence Index v5.0.1: 30.6
    against 29.1-46.5 for the five and 26.1 for Mistral Large 4; inside the five''s range on seven of nine
    index evaluations, below all six on AutomationBench-AA (45.6%) and Terminal-Bench 4.0 (13.1%). Vals
    Index v2.2: 56.08% against 53.78-62.52% and 56.53%; above all six on Finance Agent v2.1 (67.5%) and
    HLAB-Vals-1.1 (21.7%), below all six on Code Migration v1.1 (39.5%) and Terminal-Bench 4.0 (12.6%).
    APEX-Agents pass@1, Mercor: 46.8% against 53.9-69.8% and 51.6%. LMArena, 2026-11-11 snapshot: text with
    style control 1411.8 against 1479.9-1484.7 (MiMo, GLM, Kimi) and 1420.4; WebDev 1647.1 against 1583.9-1687.2
    and 1564.5; Agent 0.025 against -0.027 to 0.049 and -0.054. ARC Prize: ARC-AGI-1 96.5% and ARC-AGI-2
    81.7% against 94.5% and 78.1% for DeepSeek V4.1 Flash 1017, the only one of the six listed. Epoch AI
    has not run Inkling 2 Small and no independent SWE-bench Verified run lists it. Historical, first generation,
    not the governing release: Artificial Analysis v5.0.1 Inkling (Xhigh) 12.5 and Inkling Small 12.9; Vals
    Index 28.96% and 27.59%; APEX-Agents Inkling 33.8%; Epoch AI''s own runs against Mistral Large 4 (High),
    GPQA Diamond 88.3% vs 88.1%, FrontierMath tiers 1-3 33.3% vs 58.6% (Inkling Small 46.3%), SimpleQA Verified
    40.3% vs 20.0%; vendor SWE-bench Verified 77.6% for Inkling at effort=0.99, reproduced by Vals AI.'
  confidence: medium
  note: Inkling 2 Small, the second generation, is the release this score describes; results for the first-generation
    Inkling and Inkling Small are kept as history only. Across independent tests it sits on the line between
    the strongest open models and the next group down. It matches or beats them on knowledge, reasoning,
    finance and legal work and in LMArena's web-development and agent arenas, but trails all of them, and
    Mistral Large 4, on terminal and agentic coding tasks and on Mercor's APEX-Agents, and it is level with
    Mistral Large 4 on the Vals Index and in LMArena text chat.
