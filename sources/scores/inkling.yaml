capability:
  score: 4
  basis: benchmark
  basis_detail: Artificial Analysis Intelligence Index v5.0.1; Vals Index v2.2; APEX-Agents; Epoch AI and
    LMArena evaluations; vendor evaluation tables
  relative_to: kimi
  relation: one_below
  value: 'Artificial Analysis Intelligence Index v5.0.1, read 2026-11-13: Inkling 2 Small 30.6, fourth among
    open-weight models; Inkling (Xhigh) 12.5; Inkling Small 12.9. Same version: Kimi K3.1 Pro 46.5, DeepSeek
    V4.1 Flash 1017 (Max) 32.6, GLM-5.3 (Max) 31.7, MiMo-V2.6-Pro 29.9, MiniMax-M3.1-Flash 29.1, Mistral
    Large 4 (High) 26.1; Inkling 2 Small leads Mistral Large 4 on seven of nine index evaluations and trails
    it on AutomationBench-AA and Terminal-Bench 4.0. Vals Index v2.2: Inkling 2 Small 56.08%, Mistral Large
    4 56.53%, MiniMax-M3.1-Flash 53.78%, MiMo V2.6 Pro 57.81%. APEX-Agents pass@1: Inkling 2 Small 46.8%,
    Inkling 33.8%, Mistral Large 4 51.6%, MiMo V2.6 Pro 54.4%. LMArena, 2026-11-11 snapshot: text 1402.6
    against Mistral Large 4 1411.3 and MiMo-V2.6-Pro 1491.6; WebDev 1647.1 against 1564.5 and 1625.0. First
    generation against Mistral Large 4 (High) in Epoch AI''s own runs: GPQA Diamond 88.3% vs 88.1%, FrontierMath
    tiers 1-3 33.3% vs 58.6% (Inkling Small 46.3%), SimpleQA Verified 40.3% vs 20.0%; Epoch has not yet
    run Inkling 2 Small. Vendor table for Inkling at effort=0.99: SWE-bench Verified 77.6%, reproduced by
    Vals AI.'
  confidence: medium
  note: 'Inkling 2 Small, the second generation, is far stronger than the first. Artificial Analysis''s
    independent index scores it 31 against 12 for Inkling and 13 for Inkling Small, fourth among open-weight
    models and ahead of Mistral Large 4 on seven of nine evaluations, though behind it on the agentic automation
    and terminal tasks. Other independent tests place it lower: it finishes just behind Mistral Large 4
    on the Vals Index and behind it on Mercor''s APEX-Agents, and on LMArena it trails the strongest open
    models in text chat while matching them in web development and agent tasks.'
