capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: Peer-to-peer training over gRPC with gossip-based model exchange; optional mutual TLS with node
    certificates signed by a shared root CA; local differential privacy applied to outgoing updates; in-memory
    and Ray simulation; PyTorch, TensorFlow/Keras and JAX models. Certificate distribution is left to
    the operator, the CLI marks launching a node and driving a remote node as coming soon, and the repository's
    only container file is a Dockerfile that opens a shell.
  confidence: medium
  note: P2PFL runs a real federation between machines, with mutual TLS so that only nodes holding certificates
    from the network's authority can join, and local differential privacy on each update. Operators distribute
    the certificates and start each node themselves, since the command-line node launcher is still marked
    as coming soon, which keeps it a step below Flower.
  relative_to: flower
  relation: one_below
  comparison:
