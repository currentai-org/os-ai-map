  basis_detail: coverage and downstream use for Maltese pretraining text
  value: About 466 million tokens of written Maltese across 19 genres, collected from pre-identified sources,
    documented in a paper with per-subset sizes, and used to train BERTu and mBERTu.
  confidence: medium
  note: Korpus Malti is the general corpus of written Maltese, drawn from 19 genres including parliament, courts,
    the press and literature, and the paper that introduced it trained the BERTu and mBERTu models on it. Its
    card describes every genre subset, and its named uses so far are encoder models.
