capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: A web frontend and controller that deploy a federation as local processes, Docker containers
    or Raspberry Pi nodes joined over a Tailscale network; the controller generates a CA and a certificate
    for every participant; DP-SGD training through Opacus; simulated attacks, reputation-based defense,
    mobility and network-condition simulation.
  confidence: medium
  note: NEBULA can run a federation across real devices as well as emulate one, and it trains with differential
    privacy. Its controller generates every participant's certificate itself, and its user guide sets
    up a federation with no step that authenticates or admits participants, which keeps it a step below
    Flower.
  relative_to: flower
  relation: one_below
  comparison:
    last_attested: '2026-09-28'
    sources:
