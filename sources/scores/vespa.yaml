  note: Vespa is deployed as a cluster from container images and RPM packages, and `pyvespa` on PyPI is
    a client for a running system rather than the product itself, so its downloads would measure the wrong
    thing. With no deployment count published, GitHub stars are the only adoption signal available, and
    a star does not confirm production use.
