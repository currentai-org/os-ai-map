    from public PyPI without a token. The guardrails-api server behind `guardrails start` carries a license,
    adapted from Elastic's, that forbids offering it to others as a hosted service, but it is an optional
    install the library does not need, so it does not limit the framework. Snowglobe, the company's simulation
    product, is marketed separately as a commercial product.
