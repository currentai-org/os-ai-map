    recorded 4, exactly the agentops shape. core-gated was left as recorded rather than transcribed, because
    recording ungated against an unexamined Apache-2.0 would manufacture a 5 on the favourable half of a
    multi-SKU license question. A human settles which SKU this slug is scored on first.'
