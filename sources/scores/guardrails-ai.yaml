product: guardrails-ai
openness:
  score: 4
  class: open_core
  components:
    license:
    - name: Apache-2.0
      detail: OSI) for the framework
      raw: Apache-2.0(OSI) for the framework
    source:
      value: public
    hub:
      value: Guardrails Hub validator registry
    commercial:
      value: hosted/enterprise tier
    core-gated:
      value: gated
  confidence: medium
  note: 'Guardrails AI''s framework and validator hub are unrestricted: one Apache-2.0 license covers the
    repository, and the once token-gated validator registry has moved to public PyPI. But guardrails-api,
    the FastAPI server that `guardrails start` launches, ships under an Elastic License adaptation that
    forbids offering the software to third parties as a hosted service, which is what keeps this at open
    core rather than open source.'
  raw: license:Apache-2.0(OSI) for the framework;source:public;hub:Guardrails Hub validator registry;commercial:hosted/enterprise
    tier;core-gated:gated
  last_verified: '2026-08-12'
  sources:
  - url: https://github.com/guardrails-ai/guardrails
    shows: Apache-2.0 framework; ~7.1k stars; Guardrails Hub validators; commercial offerings
    accessed: '2026-06-29'
  - url: https://api.github.com/repos/guardrails-ai/guardrails/git/trees/main?recursive=1
    shows: Full untruncated recursive tree, 661 entries. One license path, the root LICENSE. No ee/, enterprise/,
      commercial/ or proprietary/ directory, and no license-key module. server_ci/ carries a Dockerfile,
      fastapi-entry.sh and compose scripts for running the server yourself.
    accessed: '2026-08-12'
    http_status: 200
    content_sha256: 25bc6170f996e51ebca3d6ddc356cbf560bf89bb60a125826c73986349a418fa
    establishes:
    - source
    - core-gated
  - url: https://raw.githubusercontent.com/guardrails-ai/guardrails/main/docs/migration_guides/hub-to-public-pypi.md
    shows: The token-gated validator registry is gone. "As of Guardrails 0.11.0, Guardrails-AI-owned validators
      have moved from the private Guardrails registry (pypi.guardrailsai.com, installed via guardrails hub
      install) to public PyPI." The change table reads "Private registry pypi.guardrailsai.com (token required)"
      -> "Public PyPI (no token)".
    accessed: '2026-08-12'
    http_status: 200
    content_sha256: c335d818b052fd514021fa010d80c4524a4d0f94e8d4fcfeb325e91c67517133
    establishes:
    - core-gated
  - url: https://raw.githubusercontent.com/guardrails-ai/guardrails-api/main/LICENSE
    shows: The server package is not Apache-2.0. "THE FOLLOWING LICENSE HAS BEEN ADOPTED FROM THE ELSSTIC
      LICENSE" [sic], with the limitation "You may not provide the software to third parties as a hosted
      or managed service, where the service provides users with access to any substantial set of the features
      or functionality of the software." The repo describes itself as the "FastAPI server for hosting Guardrails
      AI in your own environment" and its 149-entry tree contains no license-key module, so the source is
      published in full - the restriction is on redistribution as a service, not on what ships.
    accessed: '2026-08-12'
    http_status: 200
    content_sha256: 552b98bc84235d75a10f486ce1b071777dd6d0e2ce12457bc7ae2f82f0a7f23b
    establishes:
    - license
