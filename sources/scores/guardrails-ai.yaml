  confidence: medium
  note: 'The evidence here does not settle cleanly on the recorded score. Nothing appears to be withheld
    from the published source: the 661-entry tree of guardrails-ai/guardrails carries a single Apache-2.0
    LICENSE and no enterprise directory, the FastAPI server ships as its own public repo with a Dockerfile
    and a compose file, and the private validator registry that once needed a token is gone - release 0.11.0
    moved every Guardrails-AI validator from pypi.guardrailsai.com to public PyPI, the vendor''s own migration
    guide tabulating "Private registry pypi.guardrailsai.com (token required)" against "Public PyPI (no
    token)". The commercial product beside it, Snowglobe, is a separate simulation product. On that reading
    the project is ungated and fully open source. What complicates it is the licence rather than the gating:
    guardrails-ai/guardrails-api, the server that the main package''s `guardrails start` launches, is not
    Apache-2.0 - its LICENSE is adopted from the Elastic License and forbids providing the software to third
    parties as a hosted or managed service, which is a competition-restricted licence and would place the
    product at source-available instead. So the evidence points to either end rather than to the middle,
    depending on which of the two SKUs the product is scored on, and that question is open.'
  raw: license:Apache-2.0(OSI) for the framework;source:public;hub:Guardrails Hub validator registry;commercial:hosted/enterprise
