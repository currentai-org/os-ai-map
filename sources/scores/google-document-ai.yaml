  value: pretrained processors for forms, invoices, receipts and identity documents plus custom processors
    trained on a customer's own document types; extraction to typed entities rather than text; human-in-the-loop
    review built into the platform
  confidence: medium
  relative_to: docling
  relation: one_above
  comparison:
    last_attested: '2026-09-16'
    sources:
    - url: https://github.com/docling-project/docling
      shows: Re-read of the peer these bands are placed against. Docling still emits Markdown, HTML and lossless
        JSON with layout and reading order preserved, which is the amount of a document surviving that the
        spacing rests on. Its input list - PDF, DOCX, PPTX, XLSX, HTML, EPUB, audio and images - is on the
        same page and is recorded here for completeness; it is NOT the property these bands are placed on,
        because the recipe excludes input breadth by name.
      accessed: '2026-09-16'
      http_status: 200
      content_sha256: 69950eb12c50e7599aa655c6329b0a0f3f9ebcb56d74fbcba0d3aa726c0785e5
  note: Google Document AI's custom processors return typed entities that a customer defines, such as an
    invoice total or a field on a form they trained the processor on, rather than just the position of text
    on the page. That is a step beyond Docling, which recovers structure faithfully but assigns no meaning
    to it.
