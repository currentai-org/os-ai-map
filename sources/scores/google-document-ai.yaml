  comparison:
    last_attested: '2026-09-29'
    sources:
    - url: https://docling-project.github.io/docling/_generated/examples/extraction/
      shows: The Information extraction example states "Docling provides the capability of extracting information,
        i.e. structured data, from unstructured documents." and that the user supplies a template "either
        as a dictionary or as a Pydantic model, and Docling will return" the extracted data; its "Using
        a dict template" example returns a bill number and a total of "3949.75" from an invoice.
      accessed: '2026-09-29'
      http_status: 200
      content_sha256: 2c7a3feb10edea4ad9304e1ae7e2d8adafc90f9e5ab0524ddeb68a6b37a3b6db
  note: Google Document AI's custom processors return typed entities that a customer defines, such as an
    invoice total or a field on a form they trained the processor on, rather than just the position of text
    on the page. Docling matches it through its template-driven extractor, which returns the fields a user
    defines without training anything on the user's own forms.
  last_verified: '2026-09-29'
