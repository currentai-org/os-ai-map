capability:
  score: 2
  basis: feature_matrix
  basis_detail: how the content was made and downstream use, for Indic question-answering data
  value: About 21.4 million question, answer and reasoning rows in 17 Indian languages and English, every one written
    by Llama 3.3 70B from a Wikipedia paragraph. Documented by its card only, with no paper, and two community models
    on the Hub list it as training data.
  confidence: medium
  note: The suite is large and covers low-resource languages such as Santali, Manipuri and Kashmiri, but every question
    and answer is model-written and nothing beyond its card describes how they were made or checked. Updesh is
    judged the same way, for the same reason.
  relative_to: updesh
  relation: at
