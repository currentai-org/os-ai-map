capability:
  score: 2
  basis: benchmark
  basis_detail: multilingual-pretrain-suite
  value: 'Luciole-23B-Base card charts (base models, one harness): English averaged normalized score about
    49 against EuroLLM-22B-2512 about 48, Mistral-Small-24B-Base-2501 about 60 and Gaperon-1125-24B about
    42; French about 42 against EuroLLM-22B about 34, Mistral-Small about 42 and Gaperon about 32; six other
    languages about 35 against EuroLLM-22B about 36 and Mistral-Small about 40. Luciole-23B-Instruct-1.1
    card chart (math, instruction following and MixEval): about 64 against EuroLLM-22B-Instruct-2512 about
    59 and Mistral-Small-3.2-24B-Instruct about 67. EuroEval generative leaderboards (independent, few-shot,
    rank score where lower is better; Luciole entries marked val): French Luciole-23B-Instruct-1.1 2.17
    against EuroLLM-22B-Instruct-2512 2.06, Apertus-v1.5-70B 1.93, Llama-3.1-8B-Instruct 2.29 and Lucie-7B-Instruct-v1.1
    2.60; English 1.95 against EuroLLM-22B-Instruct 1.80 and Apertus-v1.5-70B 1.61; behind EuroLLM-22B-Instruct
    in 23 of 24 shared European languages. Chart values are read by eye; EuroLLM-22B''s TriviaQA and Mintaka
    results on the base harness are far below every other model''s. Luciole-23B-Thinking-1.1 card charts:
    the strongest of the models charted in French, behind Qwen3-8B in English (about 65 against 71); no
    independent evaluation covers it.'
  confidence: low
  note: Luciole is a French-English family up to 23B parameters, with base, instruct and reasoning models.
    Its own cards put the 23B models ahead of EuroLLM-22B in French. The independent EuroEval leaderboards,
    whose Luciole results are validation-split only and share one method, place the 23B instruct model slightly
    behind EuroLLM-22B-Instruct in French and English and in most other European languages, and ahead of
    Lucie-7B. No independent evaluation covers the reasoning model.
  last_verified: '2026-11-12'
  sources:
  - url: https://huggingface.co/OpenLLM-France/Luciole-23B-Base
    shows: '23B multilingual base model trained on about 5 trillion tokens (English 41.9%, French 30.4%).
      Evaluation section: "For comparison, we evaluated the model against the following models, which have
      between 23B and 2B parameters and were trained on multilingual data, including French": Gaperon-1125-24B,
      EuroLLM-22B-2512 and Mistral-Small-24B-Base-2501, with results published as charts of average performance
      per language group, not as a table.'
    accessed: '2026-11-12'
