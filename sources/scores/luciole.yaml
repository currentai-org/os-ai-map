  note: Luciole is a multilingual French-English family up to 23B parameters that favors French cultural
    representation and open data rights over benchmark performance, alongside Lucie-7B and Alia-40b. Its
    23B-Base card publishes training-convergence and evaluation curves but no comparison against outside
    models, so this reading comes from scale and positioning rather than a measured benchmark.
