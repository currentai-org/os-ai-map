product: luciole
openness:
  score: 5
  class: open_source
  components:
    weights:
      value: open
      detail: Apache-2.0, safetensors on HF for 1B/8B/23B base + Instruct-1.1
    data:
      value: open
      detail: 'Luciole-Training-Dataset on HF, ~4.65T tokens, published under CC-BY-SA-4.0; each source
        keeps its own terms, and the card lists the Claire dialogue sets as non-commercial and no license
        for a few small subsets. The web share (FineWeb, FineWeb-2, DCLM, CulturaX, HPLT 2 and math web
        sets) comes from named Common Crawl and Internet Archive crawls; the card says documents may be
        copyrighted, applies robots.txt from CC-MAIN-2025-26 retroactively to FineWeb, DCLM and the math
        sets, and offers an opt-out form. FineWeb-2 and CulturaX rely on CCBot''s crawl-time robots.txt
        check, and HPLT 2''s cleaned release keeps only robots.txt-compliant pages. CulturaX follows the
        mC4 and OSCAR terms. OSCAR, assessed separately: OSCAR licenses only its packaging, and its suspended
        gate says "In France, for example, any use of OSCAR that does not fall within the framework of the
        so-called ''TDM'' or the so-called ''research'' exceptions to copyright has always been prohibited."
        That asserts a legal constraint, not a contractual field-of-use bar, and CulturaX''s redistribution
        does not cure any underlying rights limitation. The affected text is identifiable and excludable:
        CulturaX enters only as the French-only Culturax config, each row tagged source culturax, with CulturaX''s
        own mc4 or OSCAR-xxxx origin kept in its metadata. The card gives no per-source share; the Hub''s
        size listing puts that config at about 3.8% of the Hub-hosted bytes, which exclude the English web
        data, and the OSCAR-derived part of it is not stated'
    code:
      value: open
      detail: Luciole-Training pretraining + data-processing pipeline on GitHub, GPL-3.0
    checkpoints:
      value: open
      detail: intermediate + final pretraining checkpoints released
    license:
    - name: Apache-2.0
      detail: OSI
  confidence: high
  note: 'Luciole ships Apache-2.0 weights with its full training stack: the Luciole-Training-Dataset, a
    GPL-3.0 training pipeline, and checkpoints from every training phase. Unlike Lucie''s non-commercial
    corpus, the dataset is published under CC-BY-SA-4.0, which permits commercial reuse, though crawled
    web pages keep their owners'' rights and each source keeps its own terms: the card lists the bundled
    Claire dialogue sets as non-commercial, and states no license for a few others, such as the INSEE and
    YouTube subsets.'
