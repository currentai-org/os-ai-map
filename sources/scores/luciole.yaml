  basis: benchmark
  basis_detail: multilingual-pretrain-suite
  value: null
  confidence: low
  note: Luciole is a multilingual French-English family up to 23B parameters that prioritizes French cultural
    representation and open data rights over benchmark performance, in the same sovereign-model tier as
    Lucie-7B and Alia-40b. Its 23B-Base model card publishes training-convergence and evaluation curves
    but no comparison table against outside models, so this reading comes from scale and positioning rather
    than a measured benchmark.
  last_verified: '2026-08-13'
  sources:
