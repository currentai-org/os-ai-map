capability:
  score: 4
  basis: feature_matrix
  basis_detail: injection detection + latency
  value: Dedicated prompt-injection and jailbreak classifier with 0.998 AUC and 97.5% recall at 1% FPR in
    English, evaluated in 8 languages, at 92 ms per 512-token classification on an A100; narrow in scope,
    flagging known attack patterns only.
  confidence: medium
  note: Llama Prompt Guard 2 detects prompt injection and jailbreaks with high recall at a low false-positive
    rate and classifies a prompt in under 100 ms on an A100. It flags only known attack patterns, so it
    complements a full-taxonomy content guard rather than replacing it.
  last_verified: '2026-09-29'
  sources:
  - url: https://huggingface.co/meta-llama/Llama-Prompt-Guard-2-86M
    shows: The card frames the models as detecting "explicit, known attack patterns, labeling prompts as"
      benign or malicious, with a table of "AUC (English)", "Recall @ 1% FPR (English)" and "Latency per
      classification (A100 GPU, 512 tokens)" where the 86M model reads ".998", "97.5%" and "92.4 ms" and
      the 22M model "88.7%" and "19.3 ms". It states "Both Llama Prompt Guard 2 models support a 512-token
      context window" and were evaluated in "English, French, German, Hindi, Italian, Portuguese, Spanish,
      and Thai".
    accessed: '2026-09-29'
