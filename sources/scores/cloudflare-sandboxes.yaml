capability:
  score: 4
  basis: feature_matrix
  value: isolation:dual - V8 isolates (Dynamic Workers, ms start, MB memory, hardened second-layer sandbox)
    for JS/TS + container-backed Sandbox SDK for arbitrary commands/processes; cold-start:isolates start
    in a few ms (~100x faster than containers); runtime breadth:JS/TS native via isolates, broader via
    container sandbox; persistence:Durable Objects-backed state; scale:edge-global, unlimited dynamic
    workers
  confidence: medium
  note: Dynamic Workers' JavaScript and TypeScript isolates start in a few milliseconds and use a few megabytes
    of memory, but that speed does not carry over to the Sandbox SDK, which runs arbitrary code in containers
    that Cloudflare's own launch post says take hundreds of milliseconds to boot. Dynamic Workers is in
    open beta, and its only scale evidence is one customer's reported request volume rather than a published
    limit.
  last_verified: '2026-09-29'
  sources:
  - url: https://blog.cloudflare.com/dynamic-workers/
    shows: Launch post saying of containers that "containers are expensive and slow to start, taking hundreds
      of milliseconds to boot", and that platforms "can also block or intercept any network requests" from
      generated code.
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: e3c2ec0d86e9e7e3f1dd3060f1030460190bafa040c21623505e14643b71e0fe
  - url: https://blog.cloudflare.com/dynamic-workers/
    shows: Launch post stating "Dynamic Worker Loader has no such limits" on global concurrent sandboxes
      and sandbox creation rate, and "An isolate takes a few milliseconds to start and uses a few megabytes
      of memory."
