capability:
  score: 4
  basis: feature_matrix
  value: isolation:dual - V8 isolates (Dynamic Workers, ms start, MB memory, hardened second-layer sandbox)
    for JS/TS + container-backed Sandbox SDK for arbitrary commands/processes; cold-start:isolates start
    in a few ms (~100x faster than containers); runtime breadth:JS/TS native via isolates, broader via
    container sandbox; persistence:Durable Objects-backed state; scale:edge-global, unlimited dynamic
    workers
  confidence: medium
  note: 'Dynamic Workers'' JS/TS-only isolates start in milliseconds, roughly 100 times the density of containers,
    but that speed does not carry over to the general-purpose Sandbox SDK that actually runs arbitrary code:
    independent benchmarks put its cold start at several seconds. Dynamic Workers itself remains in open
    beta, with only per-customer scale evidence rather than a published limit.'
