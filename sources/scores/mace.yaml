capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: A documented finetuning path from any foundation checkpoint onto a new dataset, and in MACE-MH a single checkpoint carrying task heads across several DFT levels of theory; no generation, one scale.
  confidence: high
  note: Two attributes. Most of the family is one checkpoint per domain, and small, medium and large are sizes rather than scales - but MACE-MH is a single distributed checkpoint whose card claims "unified cross-domain capability spanning inorganic crystals, molecular systems, surface chemistry, and reactive organic chemistry with a single model" over heads for OMAT PBE, OMOL, OC20, SPICE, RGD1, MPTraj and MatPES. That is the same fact pattern the category credits UMA for, so it is credited here too.
  last_verified: '2026-09-10'
  sources:
  - url: https://raw.githubusercontent.com/ACEsuit/mace/main/README.md
    shows: Documents finetuning a foundation model with mace_run_train --foundation_model, states the pretrained models can be used directly for inference or as a starting point for fine-tuning, and describes outputs as energies, forces and stresses.
    accessed: '2026-09-10'
    http_status: 200
