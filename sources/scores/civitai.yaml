adoption:
  level: 3
  reach: niche
  signal_type: reported_traction
  confidence: low
  banded_quantity: all-time download counters of the most-downloaded models in the public API, not a monthly
    or user count
  note: Civitai's API exposes an all-time download counter on each model, and the most-downloaded checkpoints
    are in the low millions. The counters are cumulative, cover only downloads through the site, and no platform
    total is published, so the reading reflects a large community inside image generation rather than a measured
    monthly figure.
  last_verified: '2026-09-27'
  sources:
  - url: https://civitai.com/api/v1/models?limit=3&sort=Most%20Downloaded
    shows: 'Most downloaded: Realistic Vision V6.0 B1 "downloadCount":2330206, DreamShaper 1684175, Juggernaut
      XL 1650374; no total count in the metadata.'
    accessed: '2026-09-27'
    http_status: 200
    content_sha256: ef912a4ac50ffe329ddd4287fa58e7ed3fb5f0086c47e184e93799fec1a871d7
capability:
  score: 4
  basis: feature_matrix
  value: account holders upload models with multiple versions; checkpoint, LoRA, textual inversion, VAE, ControlNet
    and upscaler files; full-text search; public REST API for models, versions and hash lookup with no token
  confidence: high
  relative_to: huggingface-hub-platform
  relation: one_below
  note: Users create accounts and upload models, each with numbered versions holding the files, and the public
    API lists, searches and resolves them without a key. Everything it hosts is one class of artifact, image-generation
    weights and adapters, with no datasets, apps or Git history, so it sits a step below Hugging Face Hub.
  last_verified: '2026-09-27'
  sources:
  - url: https://developer.civitai.com/site/reference/models
    shows: '"A model represents a trained AI resource published on Civitai — a checkpoint, LoRA, textual inversion,
      VAE, ControlNet, upscaler, etc. Each model has one or more model versions containing the actual files."'
