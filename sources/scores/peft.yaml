capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: LoRA/QLoRA/AdaLoRA/LoHa/LoKr/IA3/prefix-prompt-P-tuning (adapter family); precision:
    4/8-bit quant + BF16; parallelism inherited from Accelerate. Deep within parameter-efficient methods
    but scope is adapters/PEFT only (no full-RLHF-PPO orchestration like TRL/OpenRLHF, no frontier-scale
    pretraining like Megatron-LM).'
  confidence: high
  note: 'PEFT offers reference-grade depth on parameter-efficient methods -- LoRA, QLoRA, AdaLoRA, LoHa,
    LoKr, IA3 and prefix or prompt tuning -- with 4- and 8-bit quantization, BF16, and parallelism inherited
    from Accelerate. Its scope stops at adapters: it does not orchestrate full RLHF the way TRL and OpenRLHF
    do, and it does not train at frontier scale the way Megatron-LM does.'
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/huggingface/peft/main/README.md
    shows: PEFT is "directly integrated with [Transformers]", with Diffusers "for conveniently managing
      different adapters" and Accelerate "for distributed training and inference for really big models".
      "PEFT can also be applied to training LLMs with RLHF components such as the ranker and policy". The
      table lists a 12B model as "OOM GPU" for full fine-tuning against "56GB GPU / 3GB CPU" with LoRA;
      a Stable Diffusion checkpoint is "only 8.8MB".
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: bded606f05727a975a03625a7b0b561be8b048ffacafd78874e80242d981f2d2
  - url: https://raw.githubusercontent.com/huggingface/peft/main/src/peft/utils/peft_types.py
    shows: The enum documented as "Enum class for the different types of adapters in PEFT." lists method
      identifiers including "LORA", "ADALORA", "IA3", "PROMPT_TUNING", "PREFIX_TUNING", "P_TUNING", "LOHA",
      "LOKR", "OFT", "VERA", "BOFT", "DELORA", "GRALORA" and "CARTRIDGE". All are adapter-family techniques.
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: a393961ae2189d8da372ef8a907f64c3ced760f28d7189803cde9d1d9fcacb4f
  - url: https://raw.githubusercontent.com/huggingface/peft/main/docs/source/developer_guides/quantization.md
    shows: Combines PEFT with bitsandbytes 4-bit, "AWQ", "GPTQ" and "AQLM"; QLoRA is "a method that quantizes
      a model to 4-bits and then trains it with LoRA" and "allows you to finetune a 65B parameter model
      on a single 48GB GPU!". The example sets "bnb_4bit_compute_dtype=torch.bfloat16".
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: 2cfbfd012e2ab47041af2ad83412d4e90df75f57a1e73546a1abb8568ceac88e
