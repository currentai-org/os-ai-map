capability:
  score: 4
  basis: feature_matrix
  value: Per Artificial Analysis (checked 2026-09-29), SambaNova currently serves 9 models via its API;
    the fastest is gpt-oss-120b at roughly 727 output tok/s, with Llama 3.3 70B at roughly 278 tok/s. SambaNova's
    own September 2024 SN40L benchmark reported Llama 3.1 405B at 129 output tok/s, 70B at 457 tok/s and
    8B at 1,042 tok/s, all at full 16-bit precision.
  confidence: medium
  note: SambaNova's own SN40L benchmarks and Artificial Analysis's independent measurements both show strong
    per-token throughput across the models it serves. Its served-model catalog is narrower than the largest
    multi-tenant inference clouds, which is the constraint keeping it a step behind them.
  basis_detail: Vendor SN40L throughput benchmark against named competitor silicon, corroborated by Artificial
    Analysis' independent, currently-live ranking across the models SambaNova now serves. No capability
    ladder exists for this category and no peer comparison is recorded for this product; score reflects
    specialized-hardware throughput leadership offset by a narrower served-model breadth than the largest
    multi-tenant inference clouds.
  last_verified: '2026-09-29'
  sources:
