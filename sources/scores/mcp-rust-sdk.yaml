capability:
  score: 5
  basis: feature_matrix
  value: 'of the Model Context Protocol at version 2026-07-28: both roles, the full primitive set (tools, resources,
    prompts, each linked to its 2026-07-28 spec section), stdio and Streamable HTTP transports, and the optional
    features - sampling, elicitation and roots each with their own documented section'
  confidence: high
  relative_to: mcp-go-sdk
  relation: at
  note: 'Band 5 on the same reading as the official Go SDK, and the transport question is worth stating rather
    than glossing: `rmcp` ships stdio and Streamable HTTP and deliberately does NOT ship the legacy two-endpoint
    HTTP+SSE transport from the 2024-11-05 revision, calling it a non-goal. The ladder asks for more than one
    transport rather than all of them, and declining a transport the current specification has superseded is
    coverage of that specification rather than a gap against it.'
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/modelcontextprotocol/rust-sdk/main/README.md
    shows: 'The README: "This SDK implements the stable MCP 2026-07-28 specification while remaining fully
      compatible with the 2025-11-25 release and earlier versions." Tools, Resources and Prompts each have
      a section with a 2026-07-28 spec link, as do Sampling, Elicitation and Roots. The transport table lists
      stdio, child process, Streamable HTTP server and client, and in-process; on SSE it states "There is no
      separate ''SSE transport'' to configure" and that the 2024-11-05 HTTP+SSE transport is "a deliberate
      non-goal".'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: c4f68586fc688a74a32f3177f00aa2f9d2e529f5c64326a0cfdc50eaa37679f0
