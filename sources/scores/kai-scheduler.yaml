capability:
  score: 5
  basis: feature_matrix
  value: hierarchical PodGroups for gang scheduling; bin-packing and spread placement
    policies; topology-aware scheduling; priority separated from preemptibility; time-based
    fair-share; chooses the nodes itself rather than forwarding the request
  confidence: medium
  note: KAI Scheduler decides which nodes a PodGroup lands on and admits the whole group as one allocation,
    holding the machines it reserves together rather than deferring that choice elsewhere. Volcano performs
    the same function on the same substrate.
