product: nemotron
openness:
  score: 4
  class: open_weights
  confidence: high
  components: weights:open;data:open(~40M post-training/SFT+RL samples released as Nemotron-SFT-Data/Nemotron-RL-Data;
    pretraining sets only partly released);code:open(training recipes + RL env configs);license:NVIDIA-Nemotron-Open-Model-License(permissive,commercial,non-OSI)
  note: 'Unusually open for post-trained models: NVIDIA releases weights, the post-training data and the recipes,
    but under the non-OSI NVIDIA Open Model License, so open_weights not open_source. This category scores the post-training
    data, which is genuinely released. The pretraining side is thinner than NVIDIA''s "fully open" framing suggests
    -- Nemotron-Pretraining-Specialized-v1.2 ships 53.6GB of synthetic data, but Nemotron-Pretraining-Code-v3 ships
    metadata parquet describing the code corpus rather than the corpus, so the earlier "~10T-token pretraining released"
    wording overstated it and has been narrowed. Score is unaffected: the post-training answer is what this category
    asks for.'
  sources:
  - url: https://research.nvidia.com/labs/nemotron/Nemotron-3/
    shows: Nemotron 3 Nano/Super/Ultra family; post-trained models; Nemotron-SFT-Data + Nemotron-RL-Data + training
      recipes released
    accessed: '2026-06-04'
  - url: https://developer.nvidia.com/blog/introducing-nemotron-3-super-an-open-hybrid-mamba-transformer-moe-for-agentic-reasoning/
    shows: 'NVIDIA primary blog: Nemotron 3 Super ''fully open with open weights, datasets, and recipes''; license
      = NVIDIA Nemotron Open Model License (non-OSI)'
    accessed: '2026-06-04'
  - url: https://huggingface.co/api/datasets/nvidia/Nemotron-Pretraining-Specialized-v1.2
    shows: 92 files, 53.62GB, ungated. Nemotron-Pretraining-Fact-Seeking/*.parquet and related synthetic pretraining
      sets.
    accessed: '2026-07-28'
  - url: https://huggingface.co/api/datasets/nvidia/Nemotron-Pretraining-Code-v3
    shows: 67 files, 1.20GB, ungated, all under Nemotron-Code-Metadata/*.parquet -- metadata describing the code
      corpus, not the corpus itself
    accessed: '2026-07-28'
adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: 'Corrected from 3/reported_traction to 4/usage_volume on 2026-07-29, and this is the first score on the
    map re-banded off a machine signal rather than a hand-read figure. The record previously said no hard download
    count was available because the instruct repo was gated; all three shipped repos resolve ungated at HTTP 200.
    Summing the family''s distributed SKUs, which is what the category''s adoption recipe specifies: Nano BF16 994,374
    + Super BF16 855,265 + Ultra BF16 339,360 = 2,188,999 monthly downloads, squarely in the 1M-10M band. The NVFP4/FP8/GGUF
    quantizations are excluded to avoid double counting the same weights. Also distributed free via OpenRouter (nemotron-3-super-120b-a12b:free)
    and NVIDIA build/NIM, which the band does not capture, so 4 is a floor.'
  sources:
  - url: https://research.nvidia.com/labs/nemotron/Nemotron-3/
    shows: official distribution via NVIDIA build/NIM + HF for agentic use
    accessed: '2026-06-04'
  - url: https://huggingface.co/api/models/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    shows: 994,374 downloads last month, ungated, 63.2GB of weight files, HTTP 200
    accessed: '2026-07-29'
  - url: https://huggingface.co/api/models/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    shows: 855,265 downloads last month, ungated, 247.2GB of weight files, HTTP 200
    accessed: '2026-07-29'
  - url: https://huggingface.co/api/models/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    shows: 339,360 downloads last month, ungated, 2,242.1GB of weight files, HTTP 200
    accessed: '2026-07-29'
capability:
  score: 5
  basis: benchmark:SWE-bench/AIME/GPQA/MMLU-Pro
  value: 'Nemotron 3 Super (per NVIDIA tech report): SWE-Bench Verified 60.47, AIME 2025 90.21, GPQA (no tools)
    79.23, MMLU-Pro 83.73; ~2.2x inference throughput vs GPT-OSS-120B'
  confidence: high
  note: Frontier-tier among open instruct models on the Super SKU. SWE-bench Verified 60.47 confirmed as highest
    open-weight score via NVIDIA technical report + developer blog. Nano is much smaller and would score lower,
    but the family's headline SKU defines the score.
  sources:
  - url: https://research.nvidia.com/labs/nemotron/Nemotron-3/
    shows: Nemotron 3 reasoning/agentic benchmark positioning vs GPT-OSS-20B/Qwen3
    accessed: '2026-06-04'
  - url: https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Super-Technical-Report.pdf
    shows: NVIDIA Nemotron 3 Super Technical Report (Apr 2026) with SWE-bench Verified 60.47 and full benchmark
      suite
    accessed: '2026-06-04'
