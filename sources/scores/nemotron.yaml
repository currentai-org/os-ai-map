adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: All three shipped repositories resolve ungated, and summing the family's distributed SKUs - which
    is what this category's adoption recipe asks for - the three BF16 repositories reach 2,226,055 downloads
    in the trailing 30 days (Nano 914,120; Super 870,782; Ultra 441,153), squarely in the 1M-10M band. The
    NVFP4, FP8 and GGUF quantizations are excluded to avoid counting the same weights twice. The family
    is also distributed free through OpenRouter (nemotron-3-super-120b-a12b:free) and NVIDIA build/NIM,
    which the download count does not capture, so this level is a floor.
