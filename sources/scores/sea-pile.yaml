capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Southeast Asian pretraining text
  value: About 120 billion tokens of CommonCrawl text in nine Southeast Asian languages, filtered with native-speaker
    input and documented in a detailed card, with its v1 named as the pretraining data for SEA-LION.
  confidence: medium
  note: SEA-PILE v2 offers about 120 billion tokens of filtered web text across nine Southeast Asian languages,
    more than any other open corpus for the region here, and the SEA-LION models were trained on this line
    of data. Vietnamese and Indonesian hold most of the tokens, while Khmer, Lao and Burmese have under a billion
    each.
  last_verified: '2026-09-24'
