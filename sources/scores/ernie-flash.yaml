    Flash Base ahead of the base model behind Tencent's Hy3 on almost every row, and ahead of DeepSeek's and
    Xiaomi's similar-size bases on most. The results are vendor-run and cover base models only, with no independent
    leaderboard reading, so it is placed level with Hunyuan rather than above it.
