capability:
  score: 3
  basis: feature_matrix
  basis_detail: PII detection in conversational context
  value: Multi-label detection of asking for personal information, sharing it, and directing users off-platform, scored on
    one speaker's message within a multi-user chat. On the card's F1 table v2 posts 88.82% on Roblox's PII safety-for-chat
    benchmark and 99.22% on Nemotron-PII, against 56.24% and 46.07% for Llama Guard 3 8B. Roblox reports serving v1 at a peak
    of over 200,000 queries per second.
  relative_to: llama-guard
  relation: one_below
  confidence: medium
  note: On privacy it outscores Llama Guard by a wide margin on every benchmark in Roblox's tables, and it reads the conversation
    around a message rather than the message alone. Privacy is the only harm it checks, while Llama Guard screens prompts
    and responses across fourteen hazard categories, so it sits a step below Llama Guard.
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://huggingface.co/meta-llama/Llama-Guard-3-8B
      shows: 'The peer''s model page still lists hazard categories from "S1: Violent Crimes" to "S14: Code Interpreter Abuse",
        with "S7: Privacy" among them, and says the model "provides content moderation in 8 languages". The rendered page''s
        digest differs from the one llama-guard records from 2026-09-29.'
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: e770fa767aab6f58dc57e57cd6bdab7ce7119cc53b70c04d9749be36abfc842c
  last_verified: '2026-10-19'
  sources:
  - url: https://huggingface.co/Roblox/roblox-pii-classifier-v2/raw/main/README.md
    shows: The v2 card lists three output labels, "privacy_asking_for_pii", "privacy_giving_pii" and "directing_users_off_platform",
      formats input as a target speaker "t" among other speakers, and reports expanding language coverage from 17 to 189 languages.
      Its F1 table gives 88.82% and 99.22% for v2 against 56.24% and 46.07% for LlamaGuard v3 8B on roblox-pii-safety-for-chat
      and Nemotron-PII.
