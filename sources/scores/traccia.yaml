product: traccia
openness:
  score: 5
  class: open_source
  components:
    license:
    - name: Apache-2.0
      detail: OSI, single root LICENSE
    source:
      value: public
      detail: the whole tracing product - init/observe, automatic instrumentation, all listed exporters
        (Grafana Tempo, Jaeger, Zipkin, SigNoz, console, file) - ships and runs with no account
    core-gated:
      value: ungated
      detail: prompt-registry fetch (load_prompt) and persisted evaluation experiments call the hosted
        app.traccia.ai platform, but that platform is a separate product sold beside the SDK, not a
        withheld part of the tracing SDK itself; no ee/enterprise directory exists in the repository
  confidence: medium
  note: The tracing, instrumentation and offline-evaluation core is a complete, self-contained Apache-2.0
    SDK that exports over OTLP to any collector with no account required. Two named functions - `load_prompt`
    (a prompt registry) and persisted `evaluate()` experiments - require a workspace API key against the
    hosted Traccia platform, which has no self-hostable equivalent in this repository. That is the same
    shape the ladder already resolves as ungated for `pydantic-ai`+Logfire and `langchain`+LangSmith - a
    complete open core with an optional hosted platform sold beside it, not a paid tier carved out of the
    core's own functionality. Recorded at medium confidence because, unlike those precedents, the optional
    platform is Traccia's own commercial product rather than an unrelated one.
  raw: license:Apache-2.0(OSI);source:public;core-gated:ungated(hosted platform is a separate product for
    prompt registry and experiment persistence)
