  value: 'Has: automatic multi-provider instrumentation (OpenAI/Anthropic/Gemini), tracing with token/cost
    tracking, multiple OTLP exporters, prompt management with versioning and fallback (`load_prompt`),
    offline and platform-persisted evaluation (`evaluate()` with builtin and LLM-as-judge scorers,
    experiment comparison), and guardrail/governance evidence (EU AI Act, HIPAA) that few peers in this
    category carry at all.'
  confidence: medium
  note: 'Tracing, prompt management and evaluation-with-experiments together cover every dimension this
    category grades, and the governance/compliance evidence layer is a genuine addition over the anchor.
    That puts it level with Langfuse at 4, with the caveat that the prompt and persisted-evaluation halves
    depend on the hosted platform rather than shipping fully self-contained.'
