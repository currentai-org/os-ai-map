  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: Vector, keyword and hybrid search with structured filtering, replication and sharding across a
    self-hosted or managed cluster, with optional vectorizer and reranker modules that call out to models rather
    than hosting them inside the core serving path.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Weaviate is a complete, distributed vector engine, and its optional vectorizer and reranker modules
    call out to an external or containerized model rather than hosting one inside the core serving engine,
    which is what keeps it one step below Vespa, the only system that evaluates models inside its own serving
    path.
