capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: Vector, keyword and hybrid search with structured filtering, replication and sharding across a
    self-hosted or managed cluster, with optional vectorizer and reranker modules that call out to models rather
    than hosting them inside the core serving path.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Banded on the category feature matrix as complete retrieval system, distributed or cluster-capable. Placed
    one band below the vespa anchor, on a matrix that bands on how much of the persist-index-retrieve path a
    product provides itself, at what scale and over how many retrieval modes. Weaviate's vectorizer and reranker
    modules are optional integrations that call an external or containerized model rather than the core serving
    engine hosting and evaluating one itself, which is the line the top rung holds - the same distinction that
    keeps Milvus's and Qdrant's rerank functions at this band rather than the one above.
