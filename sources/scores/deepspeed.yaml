capability:
  score: 5
  basis: feature_matrix
  value: Large-scale distributed training/inference optimization library (ZeRO, 3D parallelism, MoE).
  confidence: high
  note: DeepSpeed's ZeRO memory partitioning, 3D parallelism and mixture-of-experts support have been used
    to train models such as BLOOM (176B) and Megatron-Turing NLG (530B). It is also the distributed backend
    integrated into Hugging Face Transformers, Accelerate and Lightning.
  last_verified: '2026-09-29'
