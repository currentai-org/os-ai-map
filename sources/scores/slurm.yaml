capability:
  score: 5
  basis: feature_matrix
  value: --gres and --gpus requests consumed by Slurm's own controller to allocate specific GPUs and nodes;
    multi-node allocations granted together so a distributed job starts whole; enforcement of the allocation
    for the life of the job
  confidence: medium
  relative_to: kai-scheduler
  relation: at
  note: 'Admitted on the accelerator limb: --gres and --gpus are Slurm''s own submit-language fields and its
    controller allocates against them. Band 5 because it picks the machines and grants a multi-node allocation
    as one unit. General-purpose origins do not lower the band - the test is what the scheduler does, and what
    it does is exactly what the newer AI-specific schedulers here do.'
  last_verified: '2026-09-15'
