capability:
  score: 5
  basis: feature_matrix
  value: --gres and --gpus requests consumed by Slurm's own controller to allocate specific GPUs and nodes;
    multi-node allocations granted together so a distributed job starts whole; enforcement of the allocation
    for the life of the job
  confidence: medium
  relative_to: kai-scheduler
  relation: at
  note: --gres and --gpus are Slurm's own submit-language fields, and its controller allocates specific
    GPUs and nodes against them, granting a multi-node allocation as one unit for the life of the job. Though
    a general-purpose scheduler rather than an AI-specific one, Slurm does what the newer accelerator-focused
    schedulers do, which puts it level with KAI Scheduler.
  last_verified: '2026-09-15'
  sources:
  - url: https://slurm.schedmd.com/gres.html
    shows: Slurm's generic resource (GRES) scheduling documentation, describing --gres and GPU allocation by
      the controller. Establishes that the accelerator request is consumed by Slurm's own scheduler.
    accessed: '2026-09-15'
