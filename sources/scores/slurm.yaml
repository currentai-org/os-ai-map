    shows: 'Slurm''s quickstart: as a cluster workload manager it ''allocates exclusive and/or non-exclusive
      access to resources (compute nodes) to users for some duration of time'', and then ''provides a framework
      for starting, executing, and monitoring work (normally a parallel job) on the set of allocated nodes''.
      Establishes that the allocation is a set of nodes held for one job.'
