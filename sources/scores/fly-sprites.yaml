capability:
  score: 4
  basis: feature_matrix
  value: 'isolation: Firecracker microVM (hardware-isolated, strongest tier); cold-start: 1-12s cold,
    warm restore <1s, checkpoint/restore <1s; persistence: persistent ext4 / 100GB NVMe surviving across
    sessions (a key differentiator); language/runtime breadth: arbitrary Linux (''any code blob''); scale:
    Fly.io global infra'
  confidence: medium
  note: 'Each Sprite is a Firecracker microVM with its own kernel, isolated in hardware, with a persistent
    100 GB volume that survives sleep and moves between hosts, plus live copy-on-write checkpoints. What
    keeps it a step below the frontier is scale: the product is new and unproven against established incumbents,
    and Fly.io no longer publishes a bounded cold-start figure.'
  last_verified: '2026-08-13'
