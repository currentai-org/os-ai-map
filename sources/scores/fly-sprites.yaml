capability:
  score: 4
  basis: feature_matrix
  value: 'isolation: Firecracker microVM with its own kernel per Sprite (hardware-isolated); cold-start:
    wakes on the next request, warm Sprites resume quickly and cold ones take longer, no bounded figure
    published; checkpoints: whole-filesystem snapshots in about a second; persistence: persistent ext4 volume
    of 100 GB that survives sleep and host moves; language/runtime breadth: full Linux, install any tools;
    scale: Hero plan allows 100 concurrently running and 100 warm Sprites, cold unlimited'
  confidence: medium
  note: 'Each Sprite is a Firecracker microVM with its own kernel, isolated in hardware, with a persistent
    100 GB volume that survives sleep and moves between hosts, plus live copy-on-write checkpoints. What
    keeps it a step below the frontier is scale: the product is new and unproven against established incumbents,
    and Fly.io no longer publishes a bounded cold-start figure.'
  last_verified: '2026-09-29'
  sources:
