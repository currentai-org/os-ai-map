capability:
  score: 4
  basis: feature_matrix
  basis_detail: red-teaming scope across infrastructure, tools, agents and models
  value: Red-teaming platform combining AI infrastructure scanning by fingerprint against vulnerability rules, MCP server
    scanning, agent skill auditing, agent scanning with test prompts, OpenClaw security checks, and LLM jailbreak and safety-compliance
    evaluation against OpenAI-compatible endpoints, with a web interface, contributed rule sets and standalone command-line
    scanners.
  relative_to: garak
  relation: at
  confidence: medium
  note: AI-Infra-Guard covers ground garak does not, scanning the servers, MCP tools and agents around a model as well as
    the model itself, and its jailbreak evaluation works against any OpenAI-compatible endpoint. garak's library of probes
    is the deeper of the two on the model alone, so the two sit level.
  comparison:
