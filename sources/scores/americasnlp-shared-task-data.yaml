capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indigenous-language translation data
  value: Spanish paired with ten Indigenous languages of the Americas, with training data gathered from existing
    corpora and hand-translated dev and test sets, documented in shared-task papers, with no use found outside
    the shared tasks.
  confidence: medium
  note: The AmericasNLP data gives ten Indigenous languages of the Americas hand-translated test sets, documented
    in the shared-task papers, and the task's systems are scored on it. No use outside the shared tasks turned
    up and most training text is borrowed from other corpora, where FLORES+ underpins benchmarks and models
    well beyond one task.
  relative_to: flores-plus
  relation: two_below
