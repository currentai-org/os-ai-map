capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indigenous-language translation data
  value: Spanish paired with ten Indigenous languages of the Americas, with training data gathered from existing
    corpora and hand-translated dev and test sets, documented in shared-task papers, with no use found outside
    the shared tasks.
  confidence: medium
  note: The AmericasNLP data gives ten Indigenous languages of the Americas hand-translated test sets, documented
    in the shared-task papers, and the task's systems are scored on it. No use outside the shared tasks turned
    up and most training text is borrowed from other corpora, where FLORES+ underpins benchmarks and models
    well beyond one task.
  relative_to: flores-plus
  relation: two_below
  last_verified: '2026-09-24'
  sources:
  - url: https://aclanthology.org/2021.americasnlp-1.23/
    shows: '"participants submitted machine translation systems for up to 10 indigenous languages. Overall,
      8 teams participated with a total of 214 submissions."'
    accessed: '2026-09-24'
    http_status: 200
    content_sha256: bcb69bab05be7a8b39524165657d6571b669958fd9674a5c8e9e7fe16f8c08c3
  - url: https://raw.githubusercontent.com/AmericasNLP/americasnlp2023/main/README.md
    shows: Baseline chrF table for aym, bzd, cni, gn, hch, nah, oto, quy, shp, tar; baseline is the Helsinki-NLP
      2021 system.
    accessed: '2026-09-24'
    http_status: 200
    content_sha256: f7885a1a7f5b87fe62ea1b0167a0e941938192f303e4fa0ad6f9a45b6124ad41
  - url: https://aclanthology.org/2021.americasnlp-1.23.pdf
    shows: Table 1 gives Train, Dev and Test sizes per language (Asháninka cni 3883 883 1002; Aymara aym 6531 996
      1003; Bribri bzd 7508 996 1003; Guarani gn 26032 995 1003; Nahuatl nah 16145 672 996; Otomí oto 4889 599 1001;
      Quechua quy 125008 996 1003; Rarámuri tar 14721 995 1002; Shipibo-Konibo shp 14592 996 1002; Wixarika hch 8966
      994 1003); dev and test are "a manual translation of the Spanish version of the multilingual XNLI dataset";
      "we leveraged individual pairs of parallel sentences from AmericasNLI"; "Systems in Track 1 were allowed to
      use the development set as part of the training data"; for Otomí "the development and test sets are from the
      Ñûhmû de Ixtenco, Tlaxcala, variant (otz)" while "most texts belong to the Valle del Mezquital dialect (ote)"
      in training; Nahuatl's dev and test translations "belong to Nahuatl Central/Nahuatl de la Huasteca (Hidalgo
      y San Luis Potosí) dialects"
    accessed: '2026-11-03'
    http_status: 200
    content_sha256: ae950b2ea49b13e4f72912264e75a5e171976e5c333c0ce3db3ce96273f97b57
  - url: https://aclanthology.org/2023.americasnlp-1.23.pdf
    shows: Table 1 repeats the 2021 sizes and adds "Chatino ctp Oto-Manguean 357 499 1000"; "For this edition of the
      shared task, we use the same evaluation set and additionally introduce a new evaluation dataset, created from
      Mexican court proceedings, for Spanish–Chatino"; "Translations are jointly done by two professional translators,
      who are native San Juan Quiahije Chatino speakers"; "outside of the development set and any prohibited datasets,
      teams are allowed to collect and train on an unlimited amount of external data"
    accessed: '2026-11-03'
    http_status: 200
    content_sha256: c287a379eb59f31bd6fde71ec4b13ad9bdb12de4b33bb35676d28d71e7bf6053
