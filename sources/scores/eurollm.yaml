  class: open_weights
  components:
    weights:
      value: open
      detail: Apache-2.0, BF16 safetensors, ungated
    data:
      value: documented-not-released
      detail: EuroWeb-2512 web subset released, remaining parallel/curated/synthetic and long-context components
        documented in the report but withheld
    code:
      value: closed
      detail: only deep-spin/eurollm-eval evaluation harness is EuroLLM-specific, deep-spin/Megatron-LM-pretrain
        a generic year-stale Megatron-LM fork with no EuroLLM configs
    checkpoints:
      value: open
      detail: intermediate Megatron-Core checkpoints per pretraining phase, eurollm-22b/9b/1.7b-mcore-phase1/2/3
    license:
    - name: Apache-2.0
      detail: OSI
  confidence: high
  note: EuroLLM ships ungated Apache-2.0 BF16 weights and publishes intermediate Megatron-Core checkpoints
    for every pretraining phase, matching what OLMo and Apertus release. Only the EuroWeb-2512 web subset
    of its training data is public -- the parallel, code, math, synthetic-math, book and long-context components
    are documented but withheld -- and the only EuroLLM-specific code released is an evaluation harness,
    not the training pipeline. That mix of open weights, partly documented data and unreleased training
    code keeps it at open weights rather than open source.
  last_verified: '2026-09-04'
