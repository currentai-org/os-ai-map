capability:
  score: 5
  basis: feature_matrix
  relative_to: firecracker
  relation: at
  value: isolation:application-kernel (userspace syscall interception with rule-based defense-in-depth;
    Systrap and KVM platforms), a third approach between seccomp and full VM; cold-start:fast userspace
    startup; language/runtime breadth:Linux container workloads through a Linux-like syscall interface,
    with reduced application compatibility; scale:powers Cloud Run/GKE Sandbox
  confidence: high
  note: gVisor is an application kernel that intercepts system calls in userspace, giving many of a VM's
    security benefits at a userspace footprint and startup cost, and it is the sandbox behind Google Cloud's
    serverless containers. Firecracker reaches a comparable position through hardware virtualization; gVisor
    trades some application compatibility and per-syscall overhead for its lighter footprint.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/google/gvisor
    shows: intercepts syscalls as a userspace application kernel; VM-class security benefits at userspace
      footprint and startup
    accessed: '2026-06-04'
  - url: https://raw.githubusercontent.com/google/gvisor/master/README.md
    shows: '"gVisor takes a distinct third approach, providing many security benefits of VMs while maintaining
      the lower resource footprint, fast startup, and flexibility of regular userspace applications." Not
      a syscall filter and not a VM. Ships the OCI runtime runsc, integrating with Docker and Kubernetes.'
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: e706998ed09a98d2491cac86c636cc9a836e9595b14ba26f38cfba665654df38
