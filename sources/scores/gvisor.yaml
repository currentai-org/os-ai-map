adoption:
  level: 5
  reach: '>10M'
  signal_type: usage_volume
  confidence: high
  note: Underpins Google Cloud Run ("Powered by gVisor" on gvisor.dev) and is the sandbox layer for GKE
    Sandbox, App Engine and Cloud Functions, billions of container executions across Google Cloud. gvisor.dev/users
    states plainly that "there are millions of gVisor sandbox instances running daily", alongside named
    production users - Anthropic (code execution inside claude.ai), Cloudflare Pages builds, DigitalOcean
    App Platform, Ant Group, Modal, Beam and Docker for Mac. Reach far exceeds the >10M band, and the 19,073
    GitHub stars only corroborate it. No package is measured for this level, and that is deliberate. A PyPI
    package named `gvisor` exists and is genuinely this project’s, but gVisor is a Go application kernel
    shipped as a binary (runsc) and consumed through container runtimes, and that package sees 223 downloads
    a month - banding on it would take this record from 5 to 1 on a channel almost nobody uses. Where a
    package is not the product’s primary distribution channel, banding on it is a substitution rather than
    a measurement. The level therefore rests on documented reach rather than on a download feed, and cannot
    be recomputed from one.
  last_verified: '2026-08-13'
  sources:
