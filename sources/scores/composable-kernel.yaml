capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Tile-level templates and a code generator for GEMM instances on AMD GPUs. Vendored as a git submodule
    by PyTorch (third_party/composable_kernel) and by FlashAttention (csrc/composable_kernel), in both cases
    on the AMD path.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: Composable Kernel is vendored as a git submodule by PyTorch and FlashAttention on their AMD paths.
    It covers one layer of the kernel stack rather than the full framework-to-target compilation path, which
    keeps it one step below Apache TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/ROCm/rocm-libraries/develop/projects/composablekernel/README.md
    shows: README says "The Composable Kernel (CK) library provides a programming model for writing performance-critical"
      kernels for ML across GPUs and CPUs, structured into "Templated Tile Operators", "Instantiated Kernel
      and Invoker" and "Client API" layers, with a "CK codegen" link and gemm instance options such as "DISABLE_DL_KERNELS".
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: a32b4f9c5e8a6c2435519fce45712c7b8c7ee39782aae711ed8888eefd79f98b
