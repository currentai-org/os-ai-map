capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Tile-level templates and a codegen dispatcher for GEMM, convolution and fused attention on AMD
    GPUs. Vendored as a git submodule by PyTorch (third_party/composable_kernel) and by FlashAttention (csrc/composable_kernel),
    in both cases on the AMD path.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: Composable Kernel is vendored directly as a git submodule by both PyTorch and FlashAttention, the
    same kind of dependency evidence that places cutlass, making it the ROCm counterpart to cutlass. It
    covers one layer of the kernel stack rather than the full framework-to-target compilation path, which
    keeps it below Apache TVM.
  last_verified: '2026-08-18'
  sources:
  - url: https://github.com/ROCm/composable_kernel/blob/develop/README.md
