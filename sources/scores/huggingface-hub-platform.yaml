capability:
  score: 5
  basis: feature_matrix
  value: open upload by any account to user or organization namespaces; models, datasets and Spaces all stored
    as Git repositories with commits, branches and tags; full-text search over cards; HTTP API with an OpenAPI
    spec for listing, creating and downloading repos, plus git clone
  confidence: high
  note: Anyone with an account can publish, every model, dataset and app is a Git repository with its own history,
    branches and tags, and the same repositories are reachable by git and by a documented HTTP API. That covers
    publishing, versioning, discovery and retrieval for three kinds of artifact, which is the most complete
    registry in the category.
