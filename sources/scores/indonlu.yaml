capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for an Indonesian understanding benchmark
  value: IndoNLU has twelve Indonesian understanding tasks from crawled text labeled partly by linguists, documented
    in an AACL-IJCNLP paper, released with the IndoBERT models, and used for published Indonesian classifier
    fine-tunes.
  confidence: medium
  note: IndoNLU is documented in a paper, shipped with the IndoBERT models, and many Indonesian classifiers
    are fine-tuned on its tasks. It covers only Indonesian and only understanding tasks, while SEA-HELM tests
    Indonesian alongside other Southeast Asian languages and adds generative, cultural and safety tasks.
  relative_to: sea-helm
  relation: one_below
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2009.05387
    shows: '"we introduce the first-ever vast resource for the training, evaluating, and benchmarking on Indonesian
      natural language understanding (IndoNLU) tasks. IndoNLU includes twelve tasks"'
