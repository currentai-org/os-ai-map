capability:
  score: 3
  basis: benchmark
  basis_detail: MTEB (Multilingual, v2), mean over tasks, at 768 dimensions, family maximum (EmbeddingGemma
    2)
  value: 61.36 mean on MTEB (Multilingual, v2) at 768d for EmbeddingGemma 2, against 61.15 for EmbeddingGemma
    1; 78.68 on MTEB (Code, v1); and multimodal retrieval new with EmbeddingGemma 2, including 67.84 NDCG@5
    on MMEB v2 visual documents and 69.54 MRR@10 on MSEB retrieval, at an 8K-token context.
  confidence: high
  relative_to: harrier-oss
  relation: two_below
  note: EmbeddingGemma 2 adds image, video and audio input to a small on-device model and edges past its
    predecessor on multilingual text retrieval, 61.36 against 61.15 on MMTEB v2. That is still well behind
    Harrier-OSS's 74.3 on the same benchmark, and its 8K-token context is a quarter of Harrier-OSS's 32K.
  sources:
  - url: https://huggingface.co/google/embeddinggemma-2/raw/main/README.md
    shows: 'Overall results at 768d, EmbeddingGemma 2 against 1: "Mean(Task), Multiple | 61.36 | 61.15"
