    shows: Key Features section states dropless training of 200B MoE without expert parallelism and 600B with intra-node
      EP, 64k-sequence training on 200B MoE without sequence parallelism, DeepSpeed Ulysses support, MoE training
      up to 1T parameters, and FSDP throughput surpassing traditional 3D parallel schemes for MoE above 200B.
    accessed: '2026-08-31'
