capability:
  score: 4
  basis: feature_matrix
  value: Dropless MoE training to 1T parameters; 200B-scale MoE without expert parallelism and 600B with intra-node
    EP only; 64k-sequence training on 200B MoE without sequence parallelism, plus DeepSpeed Ulysses support with
    linearly scalable sequence length; reported FSDP training throughput above traditional 3D-parallel schemes for
    MoE above 200B; Ascend A3 Supernode and NVIDIA paths. Specialized to MoE rather than Megatron-LM's composable
    general-purpose parallelism.
  confidence: medium
  note: XTuner's README claims frontier MoE scale -- 1T parameters, 200B without expert parallelism, 64k
    sequences without sequence parallelism -- but that throughput claim is stated in the README rather than
    a published scaling study. Megatron-LM offers composable parallelism across model families with published
    weak- and strong-scaling benchmarks that XTuner, specialized to MoE, does not match.
  relative_to: megatron-lm
  relation: one_below
  comparison:
    last_attested: '2026-08-31'
    sources:
    - url: https://github.com/NVIDIA/Megatron-LM
      shows: Megatron Core still advertises composable TP, PP, DP, EP and CP with FP16, BF16, FP8 and FP4
        mixed precision, and Performance Benchmarking still reports training from 2B to 462B parameters across
        thousands of GPUs, a 462B model benchmarked on 6,144 H100 GPUs with MFU rising from 41% to 47-48%,
        and a GPT-3 of slightly more than 175 billion parameters strong-scaled from 96 to 4,608 H100 GPUs.
        The composable general-purpose parallelism and the published scaling study are what keep XTuner's
        MoE-specialized story a step behind.
      accessed: '2026-08-31'
      http_status: 200
      content_sha256: 7c7a75d3ca90f4b9e41eee29630d359164b715fc07ebd8157a6ffffdf924d454
  last_verified: '2026-08-31'
  sources:
