capability:
  score: 5
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Zero-knowledge proofs (Halo2, KZG or IPA commitments) that a TensorFlow Lite model produced a given output.
  relative_to: nvtrust
  relation: at
  confidence: medium
  note: A proof lets anyone confirm that a specific model computed a specific output without trusting the party
    that ran it, which puts ZKML beside NVIDIA's hardware attestation at the top of the category. It accepts only
    TensorFlow Lite models.
  last_verified: '2026-09-27'
  sources:
  - url: https://raw.githubusercontent.com/ddkang/zkml/main/README.md
    shows: '"zkml is a framework for constructing proofs of ML model execution in ZK-SNARKs"; "Currently, we accept
      TFLite models"; the quickstart creates params_kzg and params_ipa and proves an MNIST circuit with kzg'
