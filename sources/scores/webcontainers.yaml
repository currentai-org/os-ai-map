capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: browser/WASM sandbox (client-side, inherently isolated from host but not a server
    execution env); cold-start: instant (no server provisioning); language/runtime breadth: Node.js +
    npm ecosystem, JS/TS focused, plus arbitrary WASM (narrow vs general Linux sandboxes); persistence:
    per-session in-browser; scale: runs on the end-user''s device (no server cost, no server scale)'
  confidence: medium
  note: WebContainers runs code inside the browser tab with an instant start and no server cost, but it
    is limited to Node.js and JavaScript rather than serving as a general-purpose server-side sandbox for
    arbitrary languages. That narrower profile places it behind the microVM and container sandboxes that
    run any Linux workload.
  last_verified: '2026-09-29'
  sources:
