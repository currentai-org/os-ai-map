adoption:
  level: 3
  signal_type: reported_traction
  confidence: low
  note: WebContainers powers StackBlitz's own IDE and is embedded by named projects such as SvelteKit, Astro,
    Scrimba, egghead.io and Xata for in-browser coding. Neither StackBlitz nor webcontainers.io discloses
    a download, user or session figure, so the reading comes from those integrations alone; the npm client's
    download count is not used, since npm is not the product's own channel.
  sources:
