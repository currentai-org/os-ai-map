adoption:
  level: 3
  signal_type: reported_traction
  confidence: low
  note: WebContainers powers StackBlitz's own IDE and is embedded by named projects including SvelteKit,
    Astro, Scrimba, egghead.io and Xata for in-browser coding. Neither StackBlitz nor webcontainers.io discloses
    a download, user or session figure, so the reading comes from named integrations alone; the npm client
    package does carry a download count, but it is not established that npm is how the product is actually
    distributed, so that count is not used.
