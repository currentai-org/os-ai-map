capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: browser/WASM sandbox (client-side, inherently isolated from host but not a server
    execution env); cold-start: instant (no server provisioning); language/runtime breadth: Node.js +
    npm ecosystem, JS/TS focused, plus arbitrary WASM (narrow vs general Linux sandboxes); persistence:
    per-session in-browser; scale: runs on the end-user''s device (no server cost, no server scale)'
