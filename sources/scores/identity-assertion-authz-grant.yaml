capability:
  score: 1
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: delegation of a user's authority to an application across trust domains through token exchange, where the
    identity provider and the resource authorization server may each grant a subset of the requested scopes; no
    agent identity beyond the OAuth client ID; no per-action decision; no human approval step; no decision record
  confidence: medium
  note: ID-JAG defines how an identity provider brokers a user's authority to an agent or other application for
    another domain's API, with each hop free to grant fewer scopes than requested. It leaves actor identity to future
    extensions and says nothing about individual tool calls, approvals or decision records.
  last_verified: '2026-11-20'
  sources:
  - url: https://www.ietf.org/archive/id/draft-ietf-oauth-identity-assertion-authz-grant-06.txt
    shows: At the IdP and again at the Resource Authorization Server, "The granted scopes MAY be a subset"; section
      9.10 leaves actor_token processing to "Future profiles or extensions"; appendix A.4, "AI Agent using External
      Tools", has the agent as an OAuth client acting for users.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 1699586519ecb5333fb48ee0443f57d56e95f0b745e25b70e925fb85a6efcfc0
