      detail: OSI
  governing_release: granite-4-2
  confidence: high
  note: Granite 4.2, the current release, ships Apache-2.0 weights, ungated at every size, post-trained
    from the Granite 4.1 base models. IBM describes the 4.1 pretraining mixture by category and phase, and
    the 4.2 fine-tuning data by source type, but releases neither corpus, and its repositories carry documentation
    and usage examples rather than a training pipeline. That keeps Granite an open-weights release rather
    than a fuller open one.
