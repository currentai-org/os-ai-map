  components:
    weights:
      value: open
      detail: Apache-2.0, ungated on HF across the 4.2 line
    data:
      value: closed
      detail: the 4.1 pretraining mixture is described by category and phase and the 4.2 SFT sources by
        type, but no corpus is released
    code:
