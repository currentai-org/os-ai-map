capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Point-in-time-correct offline retrieval, online serving and materialization over pluggable offline
    and online stores, with a feature registry. Orchestrates storage rather than providing it; similarity
    retrieval is an alpha API that delegates to a separate vector store.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: Feast orchestrates point-in-time-correct offline retrieval, online serving and materialization across
    pluggable stores, with a feature registry. Its alpha vector search calls into a separate vector store
    rather than providing an index of its own, which keeps it two steps below Vespa, a complete distributed
    retrieval system.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/feast-dev/feast/master/README.md
    shows: README describes Feast as helping teams "Make features consistently available for training and
      serving" by managing an offline store, an online store and a feature server.
