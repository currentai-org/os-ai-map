  value: 'Methods: full fine-tuning, LoRA and embeddings. Model breadth: Ernie Image, Z-Image, Qwen Image, FLUX.1,
    FLUX.2 Dev and Klein, Chroma, Stable Diffusion 1.5/2.0/2.1/3.0/3.5, SDXL, Wuerstchen-v2, Stable Cascade, PixArt-Alpha/Sigma,
    Sana, Hunyuan Video and inpainting models; diffusers and ckpt formats. Training features: masked training, EMA
    with optional CPU offload, aspect-ratio bucketing, multi-resolution training, noise-schedule rescaling, TensorBoard,
    GUI and CLI. Deeper method coverage than ai-toolkit, narrower modality coverage.'
  confidence: medium
  note: 'Scored at ai-toolkit: the two are the category''s diffusion-trainer pair and trade off against each other
    rather than against the LLM tools. OneTrainer reaches further on method - full fine-tuning and embeddings, not
    only adapters - and on training technique, while ai-toolkit reaches further on modality, covering video and
    audio families OneTrainer does not. Neither has a distributed-training story, which is what holds both below
    the 4-band tools.'
