  value: 1,200+ differentiable operators for geometry, feature matching, filtering, color, enhancement,
    augmentation and losses, plus builders that load ported pretrained models (LoFTR, LightGlue, DISK,
    DeDoDe, SAM, YuNet, RT-DETR) whose zoo is frozen for expansion
  relative_to: opencv
  relation: at
  confidence: medium
  note: Kornia supplies the operations vision models are built and trained from, differentiably so they
    can sit inside a network, and fits no predictor of its own. Its pretrained models are ports of other
    projects' networks, loaded much as OpenCV's dnn module runs models trained elsewhere, and the project
    has stopped adding them.
