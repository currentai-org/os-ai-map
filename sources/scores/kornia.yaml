capability:
  score: 4
  basis: feature_matrix
  value: 1,200+ differentiable operators for geometry, feature matching, filtering, color, enhancement,
    augmentation and losses, plus builders for 14 families of pretrained models (YuNet faces, RT-DETR
    objects, SAM masks, DexiNed edges, LoFTR, LightGlue, DISK, DeDoDe) that download their weights on
    first use; the zoo is frozen for expansion
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: Kornia is mainly the operations vision models are built and trained from, written to sit inside
    a network, but it also ships ready pretrained models, including SAM, which segments whatever the user
    points at in any image with no training. Bundling that kind of model is what places Ultralytics here
    too. Kornia's models are ports of other projects' networks, and the project has stopped adding them.
