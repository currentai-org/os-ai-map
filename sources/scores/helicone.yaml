    core-gated:
      value: ungated
      detail: Apache-2.0 across the whole recursive tree with a single LICENSE, no ee/ or enterprise directory,
        no license-key or premium flag; the five services self-host from the published docker/docker-compose.yml,
        and the free-tier quotas are themselves published Apache-2.0 code governing Helicone Cloud billing
    free_text:
    - self-host supported
    - hosted Helicone Cloud with paid tiers(free=10k req/mo) = commercial SaaS layer atop OSS core
  confidence: high
  note: 'Apache-2.0 throughout, self-hostable in full, with a hosted Helicone Cloud sold beside it. A separate
    hosted product is not a gated core, and the cloud''s tiered pricing is not evidence on this dimension.
    The read behind that: the whole default branch contains exactly one LICENSE, the Apache-2.0 root file.
    There is no enterprise directory, no second license, no license-key module and no entitlement flag.
    The README''s self-host path is the published docker-compose file covering all five services - web,
    worker, jawn, Supabase and ClickHouse, plus Minio. What does exist is plan gating, and it ships as published
    Apache-2.0 code: web/lib/features.ts declares the add-on and non-free feature lists, web/lib/freeTierLimits.ts
    sets the quotas, and web/hooks/useFreeTierLimit.ts reads them. Those enforce Helicone Cloud''s billing
    plan against a hosted account, ship in the source, and are modifiable under Apache-2.0, so the thing
    that looks like a gate withholds nothing. One datum points the other way and is recorded rather than
    smoothed over: the pricing page lists SAML SSO on the Enterprise tier, and the repository contains no
    SAML, SSO, OAuth identity-provider, Okta or WorkOS implementation anywhere. That is an absence rather
    than a carve-out or a closed package, and the Enterprise tier''s other named item, on-prem deployment,
    is support for a deployment the repository already ships for free. So it meets none of the tests for
    a gated core. It is the weakest point in this record, and a later reader who disagrees has the same
    facts in front of them.'
  raw: license:Apache-2.0(OSI);source:public;core-gated:ungated(Apache-2.0 across the whole recursive tree
