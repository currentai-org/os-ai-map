  value: tracks any user-chosen or grid-sampled points through a video, jointly, online or offline, with no training;
    CoTracker3 offline scores 76.9 on TAP-Vid DAVIS
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: CoTracker follows whichever points the user picks in their own video, with no training step, much as Segment
    Anything segments whatever the user points at. It does point tracking only, where Ultralytics spans detection,
    segmentation and depth.
