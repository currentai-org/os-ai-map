capability:
  score: 3
  basis: benchmark
  basis_detail: MMLU / pretraining suite
  relative_to: llama
  relation: at
  value: Apertus-70B pretraining-eval avg 67.5% (ARC/HellaSwag/WinoGrande/XNLI/XCOPA/PIQA), ~on par with
    Llama 3.1-70B (67.3%); Apertus-70B-Instruct MMLU 69.6%, trailing Llama 3.3-70B (87.5%) and Qwen2.5-72B
    (86.6%) by ~17-20 pts.
  confidence: medium
  note: 'Mid-tier capability: competitive with the prior open generation, around the Llama 3.1-70B class,
    on pretraining benchmarks and unusually strong multilingually, but below the 2026 frontier on MMLU-style
    reasoning and knowledge. The value proposition is full openness, multilingual breadth and legal compliance
    rather than raw SOTA - the same profile as OLMo 2. Apertus 1.5 adds multimodal input (image and audio),
    a thinking mode and a 262,144-token context, and claims performance ''comparable to other models of
    similar size'', but no quantified 1.5 benchmarks have been published yet, so the score rests on the
    last citable 2509 numbers. Apertus sits level with the Llama family, both at 3, even though Llama''s
    own reading is now taken on Llama 4 Maverick rather than Llama 3.1 405B.'
  last_verified: '2026-08-13'
  sources:
