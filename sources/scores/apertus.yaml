  confidence: high
  note: 'The Apertus family''s current release is the multimodal Apertus 1.5, shipped 2026-07-24. The 1.0/2509
    release remains public with its full open stack: pretraining-data reconstruction scripts (respecting
    opt-out and robots.txt and stripping personal data), the Megatron-LM training recipe, intermediate checkpoints,
    and the technical report (arXiv 2509.14233), all Apache-2.0, which is the OLMo and Pythia full-openness
    tier. Apertus 1.5 is likewise Apache-2.0 and declares a ''fully open model: open weights + open data
    + open values + full training details including all data and training recipes'', but its own multimodal-mix
    reconstruction scripts, training pipelines and intermediate checkpoints are announced as coming in the
    weeks ahead and have not shipped. The 5 therefore rests on the family''s established practice and the
    still-public 1.0 stack rather than on the 1.5 promises. An Acceptable Use Policy accompanies the Apache-2.0
    grant, restricting conduct (illegal or abusive use) rather than commerce or scale, so the license stays
    OSI.'
