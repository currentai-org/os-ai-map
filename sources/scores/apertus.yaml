  basis_detail: MMLU / pretraining suite
  relative_to: llama
  relation: at
  value: Apertus-70B pretraining-eval avg 67.5% (ARC/HellaSwag/WinoGrande/XNLI/XCOPA/PIQA), ~on par with
    Llama 3.1-70B (67.3%); Apertus-70B-Instruct MMLU 69.6%, trailing Llama 3.3-70B (87.5%) and Qwen2.5-72B
    (86.6%) by ~17-20 pts.
  confidence: medium
  note: Apertus-70B averages 67.5% on pretraining benchmarks, matching Llama 3.1-70B's 67.3%, and is unusually
    strong multilingually. Its instruct model trails the newer frontier on reasoning, scoring 69.6% on MMLU
    against 87.5% for Llama 3.3-70B and 86.6% for Qwen2.5-72B.
