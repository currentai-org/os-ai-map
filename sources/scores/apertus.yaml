product: apertus
openness:
  score: 5
  class: open_source
  components:
    weights:
      value: open
      detail: Apache-2.0, BF16 safetensors
    data:
      value: open
      detail: full pretraining-data reconstruction scripts, github.com/swiss-ai/pretrain-data. They rebuild
        the web share from FineWeb v1.3.0, FineWeb-2, FineWeb-Edu, DCLM-Edu and FineMath, which come from
        named Common Crawl snapshots, are released under ODC-By or CC-BY-4.0 and bind users to Common Crawl's
        terms, which leave page rights with their owners. Beyond CCBot's crawl-time robots.txt check, the
        scripts drop pages whose January 2025 robots.txt blocks AI crawlers, from published domain lists.
        The README says the pipelines were built for CSCS's Alps cluster and must be adapted to another
        environment, with dependencies defined in a Dockerfile; under R-2026-11-14-f that is an environment
        dependency, not an obstacle to rebuilding the corpus. No removal route of its own; the upstream
        FineWeb form applies
    code:
      value: open
      detail: Megatron-LM training recipe + reconstruction scripts
    checkpoints:
      value: open
      detail: intermediate checkpoints on HF branches
    license:
    - name: Apache-2.0
      detail: OSI
  confidence: high
  note: Apertus 1.0 publishes its pretraining-data reconstruction scripts, Megatron-LM training recipe,
    intermediate checkpoints and technical report under Apache-2.0, as OLMo and Pythia do. The scripts rebuild
    the corpus from openly licensed Common Crawl derivatives and drop pages from sites that opt out of AI
    crawling; the pages keep their owners' rights. Its acceptable-use policy restricts conduct, not commercial
    use. Apertus 1.5, released 2026-07-24, continues training under the same license behind an automatically
    approved click-through.
  last_verified: '2026-11-14'
