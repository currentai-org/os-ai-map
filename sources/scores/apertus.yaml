  note: Apertus 1.0 publishes its pretraining-data reconstruction scripts, Megatron-LM training recipe,
    intermediate checkpoints and technical report under Apache-2.0, the same full-openness tier as OLMo
    and Pythia. An accompanying acceptable-use policy restricts conduct, not commercial use, so the license
    still counts as OSI. Apertus 1.5, released 2026-07-24, carries the same license and claims equal openness,
    but its training pipelines and checkpoints have not shipped yet, so the score reflects the still-public
    1.0 stack.
