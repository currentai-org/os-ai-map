        vs 64.8); MMLU-Pro 56.4 vs 84.8, GPQA 32.1 vs 72.1, MATH 52.9 vs 78.7. Table 30: Gemma ahead on
        9 of 12 multilingual and cultural rows, Global-MMLU 66.5 vs 84.7, INCLUDE-44 61.6 vs 78.9.'
