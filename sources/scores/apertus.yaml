capability:
  score: 3
  basis: benchmark
  basis_detail: Apertus 1.5 technical report release evaluation; EuroEval leaderboards
  relative_to: gemma
  relation: one_below
  value: 'Apertus 1.5 technical report (arXiv:2610.15542), post-trained models with thinking disabled on
    one harness: Apertus 1.5 70B against Gemma 4 31B MMLU 76.5 vs 90.5, MMLU-Pro 56.4 vs 84.8, GPQA 32.1
    vs 72.1, MATH 52.9 vs 78.7, HumanEval 70.3 vs 92.0, Global-MMLU 66.5 vs 84.7, INCLUDE-44 61.6 vs 78.9
    (Gemma ahead on 17 of 19 rows of the main table and 9 of 12 multilingual and cultural rows); behind
    Llama 3.3 70B Instruct on 17 of 19 and 10 of 12; behind OLMo 3.1 32B Instruct on 12 of 19 main-table
    rows and ahead on 10 of 12 multilingual rows; ahead of EuroLLM-22B on 17 of 19 and 11 of 12. Thinking
    mode against OLMo 3.1 32B Think: AIME 25 21.7 vs 78.8, GPQA 30.1 vs 39.7, MATH-500 73.6 vs 88.2. EuroEval
    generative leaderboards (independent, rank score, lower is better; Apertus validation split only): Apertus-v1.5-70B
    European 2.15, ahead of EuroLLM-22B-Instruct-2512 in 22 of 28 shared languages, Olmo-3.1-32B-Instruct
    in 29 of 30, Olmo-3.1-32B-Think in 16 of 21, Luciole-23B-Instruct-1.1 in all 26 and SmolLM3-3B in all
    21, behind Llama-3.3-70B-Instruct in 13 of 18; English 1.61 against Olmo-3.1-32B-Think 1.67 and EuroLLM-22B-Instruct-2512
    1.80. Artificial Analysis Intelligence Index v5.0.1 scores no Apertus model.'
  confidence: medium
  note: Apertus 1.5 70B, the family's strongest model, trails Gemma 4 31B on nearly every test in the Apertus
    team's own comparison, across knowledge, reasoning, math, code and multilingual knowledge, and trails
    Llama 3.3 70B almost as widely. It is far behind OLMo 3.1 32B Think on competition math but ahead of
    OLMo 3.1 32B on most multilingual tests. On the independent EuroEval leaderboards it leads EuroLLM-22B,
    Luciole and SmolLM3 in most European languages.
  comparison:
