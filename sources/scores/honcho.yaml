  note: GitHub stars are the only signal, because the Honcho server ships as source and a Docker Compose
    setup rather than through a package registry. The honcho-ai and @honcho-ai/sdk packages are clients
    that reach either the managed service or a self-hosted server, so their downloads count client installs
    rather than Honcho deployments and are left out. A star is not a deployment.
