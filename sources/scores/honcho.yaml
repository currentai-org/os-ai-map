capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: search, context and representations scoped to a peer, session or scope; conclusions derived from messages
    by a background deriver; dreaming that deletes outdated conclusions, resolves contradictions and draws inductive
    patterns; per-peer conclusions, peer cards and session summaries; no time-based decay or expiry
  confidence: medium
  note: Honcho extracts conclusions about each user or agent from raw messages, revisits them in periodic dream
    cycles that replace outdated facts, and serves them as peer cards, representations and summaries. Nothing in
    it retires memories because of their age.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/plastic-labs/honcho/main/README.md
    shows: The README lists conclusions extracted about a peer, representations, peer cards and session summaries,
      hybrid search scoped to peers, sessions or scopes, and a deriver worker that builds representations in the
      background.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 0099c26fb9688c48b1340c0f2add07b9659217fea0f7f11ff7a379f0c709e516
  - url: https://honcho.dev/docs/v3/documentation/features/advanced/dreaming
    shows: The dreaming page says that when a fact changes "it deletes the outdated conclusion and creates a new
      one reflecting the current state", resolves contradictions, and induces patterns across conclusions.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 12260be7566d98764faf8c5d5b1f81a6ed4175a442a27c595aae2c4f9d1e77a1
  - url: https://honcho.dev/docs/v3/documentation/core-concepts/architecture
    shows: The architecture page says the Dreamer revisits existing conclusions, "removing redundant or stale ones,
