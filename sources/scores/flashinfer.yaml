capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface engines declare a dependency on'
  value: Attention, GEMM and MoE kernels with JIT specialization over four backend implementations, aimed
    at serving stacks. Its README states it powers inference in SGLang, vLLM, MLC-LLM and ScaleLLM.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: FlashInfer provides JIT-specialized attention, GEMM and MoE kernels across four backend implementations,
    and several serving engines - SGLang, vLLM, MLC-LLM and ScaleLLM - declare it as a dependency. It covers
    several operator families rather than one, but only on NVIDIA GPUs from Turing through Blackwell, which
    keeps it one step below Apache TVM's broader hardware reach.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/flashinfer-ai/flashinfer/main/README.md
    shows: README describes FlashInfer as "a library and kernel generator for inference that delivers state-of-the-art
      performance across diverse GPU architectures" with "unified APIs for attention, GEMM, and MoE operations"
      over "FlashAttention-2/3, cuDNN, CUTLASS, and TensorRT-LLM" backends, and lists "Support for SM75
      (Turing) and later (through Blackwell)".
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 472bc506d8a67ca7d8048650b9fc8f17d75f5adbaa016b505b76bbb48a8b4fbc
  - url: https://raw.githubusercontent.com/flashinfer-ai/flashinfer/main/README.md
    shows: README lists under Adoption "FlashInfer powers inference in:" SGLang, vLLM, TensorRT-LLM, TGI,
      MLC-LLM, LightLLM, lorax and ScaleLLM, and states "FlashInfer is inspired by [FlashAttention]".
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 472bc506d8a67ca7d8048650b9fc8f17d75f5adbaa016b505b76bbb48a8b4fbc
