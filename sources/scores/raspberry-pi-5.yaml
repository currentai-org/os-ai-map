  confidence: high
  note: Raspberry Pi publishes an open kernel tree and register-level datasheets for the RP1 I/O controller,
    and anyone can buy the board. But it does not publish a schematic for the Pi 5. The documentation includes
    a mechanical drawing and two STEP files, enough to design a HAT or case around the board but not to
    reproduce the board itself. That leaves the hardware only partially documented, however open the software
    stack may be. The GPU firmware and bootloader also remain Broadcom-licensed binaries that the board
    cannot boot without.
