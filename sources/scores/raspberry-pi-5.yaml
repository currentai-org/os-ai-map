    shows: '"Broadcom BCM2712 2.4GHz quad-core 64-bit Arm Cortex-A76 CPU" with "VideoCore VII GPU" and
      "LPDDR4X-4267 SDRAM (options for 1GB, 2GB, 4GB, 8GB and 16GB)"; the feature list names no NPU and
      no TOPS figure'
