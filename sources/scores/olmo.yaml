product: olmo
openness:
  score: 5
  class: open_source
  components:
    weights:
      value: open
      detail: Apache-2.0
    data:
      value: open
      detail: Dolma 3, 9.3T tokens, all stages. Mostly Common Crawl text from 104 dumps, CC-MAIN-2013-20
        to CC-MAIN-2024-51, with the processing documented in the Olmo 3 paper and the dolma3 repository,
        released under ODC-By. Page rights are disclosed through Dolma 3's own ODC-By grant, whose section
        2.4 says the license does not cover rights in the individual contents. CCBot and Ai2's AI2Bot document
        robots.txt checks at crawl time. The cards call the corpus intended for research and educational
        use and link Ai2's Responsible Use Guidelines, which say they "govern your use of Ai2’s AI tools
        and artifacts, including models, datasets" and, except for research use, bar uses including political
        manipulation, political campaigning or lobbying, automated social media posting and profiling people
        by protected characteristics. ODC-By and Apache-2.0 remain the operative grants unless incorporation
        of the guidelines is established. No access gate applies
    code:
      value: open
      detail: training code+recipes+logs
    checkpoints:
      value: open
      detail: intermediate
    license:
    - name: Apache-2.0
      detail: OSI
  confidence: high
  note: OLMo publishes Apache-2.0 weights, the full Dolma 3 training corpus, training code and intermediate
    checkpoints, all ungated and downloadable, so the whole training run is open to inspection.
  raw: weights:open(Apache-2.0);data:open(Dolma 3, 9.3T tokens, all stages. Mostly Common Crawl text from
