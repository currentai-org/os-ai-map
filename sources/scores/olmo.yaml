  score: 4
  basis: benchmark
  basis_detail: MMLU/GPQA/reasoning
  value: OLMo 3.1 Think 32B tops Qwen3-32B on AIME 2025 (78.1 vs 70.9) but trails it on GPQA (57.5 vs 67.3)
    and MMLU (86.4 vs 88.8)
  confidence: high
  note: OLMo 3.1 Think 32B beats Qwen3-32B on AIME 2025 but trails it on GPQA and MMLU, and the line as
    a whole is competitive with Qwen2.5 and Gemma 3. It remains a step below the trillion-parameter open-weight
    models at the frontier.
  last_verified: '2026-09-29'
  sources:
  - url: https://allenai.org/blog/olmo3
    shows: 'Ai2 release post: Olmo 3-Think 32B is described as "narrowing the gap to the best open-weight
      models of similar scale" such as Qwen 3 32B "while training on roughly 6x fewer tokens"; the 12/12
      update says Olmo 3.1 32B Think "brings substantial gains across math, reasoning, and instruction-following
      benchmarks".'
