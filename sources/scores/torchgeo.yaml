capability:
  score: 3
  basis: feature_matrix
  value: geospatial datasets and samplers, transforms, model weights pretrained on Sentinel-1, Sentinel-2, Landsat
    and other sensors, and Lightning data modules and tasks for classification, regression and semantic segmentation
  relative_to: torchvision
  relation: at
  confidence: high
  note: TorchGeo bundles the datasets, pretrained backbones and training tasks to fit and compare models on satellite
    imagery, as torchvision does for ordinary photographs. Its pretrained weights are starting points for fine-tuning,
    so a prediction on a new labeling task still needs a training run.
