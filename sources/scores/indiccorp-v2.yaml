capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indic pretraining text
  value: IndicCorp v2 holds about 20.9 billion tokens across 24 Indic languages, documented in an ACL paper
    with a minimal card, and AI4Bharat trained IndicBERT v2 on it, with IndicBERT v3 and Cadence also listing
    it.
  confidence: medium
  note: AI4Bharat trained IndicBERT v2 on IndicCorp v2, and its newer IndicBERT v3 and Cadence models still
    list it as training data. The same team's newer Sangraha is about twelve times larger, which makes IndicCorp
    v2 the superseded one of AI4Bharat's two pretraining corpora.
  relative_to: sangraha
  relation: two_below
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2212.05409
    shows: 'Abstract: "we curate the largest monolingual corpora, IndicCorp, with 20.9B tokens covering 24
      languages from 4 language families".'
