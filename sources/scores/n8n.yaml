adoption:
  level: 4
  signal_type: reported_traction
  confidence: high
  note: 'About 3,265,167 downloads a month across the product''s real distribution channels, read 2026-08-12.
    Docker Hub reports 246,014,721 cumulative pulls of n8nio/n8n since 2019-06-22, which over 86 months
    averages roughly 2,871,429 a month; 393,738 come from npm  in the trailing 30 days. Bands at level 4
    (1M-10M).


    n8n is deployed overwhelmingly as a self-hosted Docker container; the npm package is a minority install
    path. Banding on the registry package ALONE gave a materially lower level, and recording it would have
    been a substitution rather than a measurement - the same error signal_routing.yaml names as ''abstain
    rather than substitute''. The Docker component is a LIFETIME AVERAGE, not a trailing-30-day figure,
    so for a growing product it understates the current rate and this level is a floor.


    INSTRUMENT CORRECTED 2026-08-14 on the owner''s ruling, with the level untouched at 4. This record
    claimed usage_volume, which claims a download count, while most of the figure behind it is a
    lifetime average of Docker pulls that nothing in the pipeline can count; the one channel that IS
    countable, npm at 393,738 in the trailing 30 days, bands at 3 on its own. So the honest instrument
    is reported_traction, and the numeric reach comes off with it, because a number here is a
    measurement claim this instrument is defined by being unable to make. No new evidence was fetched
    and none was needed - the two digested sources from 2026-08-12 already satisfy what
    reported_traction requires, and they are the same sources the band always rested on.'
