capability:
  score: 4
  basis: benchmark
  value: olmOCR v0.4.0 scores 82.4 on olmOCR-Bench, ahead of Marker 1.10.1 (76.1), MinerU 2.5.4 (75.2) and
    Mistral OCR (72.0), but behind Chandra OCR 0.1.0 (83.1) and Infinity-Parser 7B (82.5); on OmniDocBench
    v1.6 it scores 85.74, in the lower half of a board led by TeleOCR (96.91), with MinerU2.5-Pro at 95.75.
  confidence: high
  note: olmOCR's pipeline turns PDFs and images into text with reading order, tables and equations recovered,
    but it does not emit typed entities a customer defines. As corroboration, it scores 82.4 on its own
    olmOCR-Bench, ahead of MinerU's 75.2 but behind Chandra's 83.1, and 85.74 on OpenDataLab's OmniDocBench,
    where it sits in the lower half of a board led by TeleOCR at 96.91.
  last_verified: '2026-09-28'
  sources:
  - url: https://raw.githubusercontent.com/allenai/olmocr/main/README.md
    shows: The raw README lists "Support for equations, tables, handwriting, and complex formatting" and
      "Automatically removes headers and footers", and its olmOCR-Bench table gives "Chandra OCR 0.1.0*"
      at "83.1±0.9", "Infinity-Parser 7B*" at "82.5±?", olmOCR v0.4.0 at "82.4±1.1", and Marker, MinerU
      and Mistral OCR at "76.1±1.1", "75.2±1.1" and "72.0±1.1".
