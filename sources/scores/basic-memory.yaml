capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: full-text and semantic search and graph context scoped to a project; notes as entities with categorized
    observations and typed relations forming a knowledge graph; no extraction, since the assistant or user writes
    each note; no automatic consolidation or forgetting
  confidence: medium
  note: Basic Memory recalls notes by search and by following their relations, over a graph built from the categories
    and links written into each note. The assistant or the user decides what to write and when to edit it; Basic
    Memory does not extract, merge or retire memories itself.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/basicmachines-co/basic-memory/main/README.md
    shows: Each file is an Entity with Observations ("facts about them", categorized in brackets) and Relations
      (wiki-style links that form the graph); MCP tools include bm_write, bm_edit, bm_search and bm_context, and
      the example has the user ask the LLM to "Make a note".
    accessed: '2026-11-20'
    http_status: 200
