capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Full-text, vector and hybrid search over its own document and index storage, with persistence plugins for
    disk and cloud, running single-node embedded in a browser, server or edge process.
  relative_to: pgvector
  relation: at
  confidence: medium
  note: 'Orama indexes and persists documents itself across full-text, vector and hybrid retrieval modes,
    running single-node with no built-in clustering or replication. That puts it alongside pgvector: both
    provide several retrieval modes over storage they manage themselves, but neither reaches the distributed,
    cluster-capable systems at the top of the category.'
  comparison:
    last_attested: '2026-09-02'
    sources:
    - url: https://github.com/pgvector/pgvector/blob/master/README.md
      shows: README still documents exact and approximate nearest neighbour search over Postgres with no
        distribution or clustering of its own, inheriting persistence and transactions from Postgres rather than
        implementing them.
