capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: agent identities distinct from the users they serve (Agent as Principal, client credentials, private key
    JWT), Auth0 FGA checks on each tool call through the SDK tool authorizers, user-consented scoped tokens with
    on-behalf-of token exchange and Token Vault, CIBA approval before sensitive actions; no tamper-evident decision
    record
  confidence: medium
  note: 'Auth0 for AI Agents covers most of the job: agents get identities of their own, FGA can refuse a tool call
    the user is not entitled to, delegated tokens carry only what the user consented to, and CIBA holds a sensitive
    action until the user approves it on another device. What it does not produce is a signed or hash-chained record
    of each decision; its audit trail is ordinary logs.'
  relative_to: agent-governance-toolkit
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://auth0.com/ai/docs/overview
    shows: '"Secure your AI agents with user authentication, delegated authorization, human-in-the-loop controls
      with CIBA, and fine-grained authorization in RAG pipelines."'
