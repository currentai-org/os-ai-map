capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: AG-UI is a specification rather than an implementation of one, so there is nothing to measure it
    against — the same reason the Model Context Protocol, the Agent2Agent Protocol and the Agent Client
    Protocol are left unscored. It is also transport-agnostic, working over any event transport such as
    SSE, WebSockets or webhooks, so there is no fixed transport surface to measure either.
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/ag-ui-protocol/ag-ui/main/README.md
    shows: 'The README: "AG-UI is an open, lightweight, event-based protocol that standardizes how AI agents
      connect to user-facing applications", with agent backends emitting "events compatible with one of AG-UI''s
      ~16 standard event types" and the protocol working with "any event transport (SSE, WebSockets, webhooks,
      etc.)". It positions itself alongside MCP and A2A rather than as an implementation of either.'
    accessed: '2026-09-17'
