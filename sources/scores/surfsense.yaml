capability:
  score: 4
  basis: feature_matrix
  value: 'model breadth: 100+ LLMs via LiteLLM/OpenAI spec + local (Ollama/vLLM), 6000+ embedding models,
    rerankers; connectors: 27+ (SearXNG/Tavily search, Drive/OneDrive/Dropbox, Slack/Teams/Discord, Notion/Confluence/Obsidian,
    Linear/Jira, Gmail, YouTube, GitHub); RAG: hybrid semantic + full-text with rank fusion; multimodal:
    podcast/video/image generation; multi-user: real-time collab + RBAC'
  confidence: low
  note: An unusually broad connector, model and collaboration surface on paper, but per-feature depth and
    quality are unverified - almost all of it is README-sourced - and the project is far less proven than
    Open WebUI-class tools, hence 4 rather than the top and low confidence. The project has repositioned
    toward being an open web research platform for AI agents, with live data connectors to Reddit, YouTube,
    Instagram, TikTok, Amazon, Walmart, Google Maps, Google Search and Indeed reachable over one REST API
    or an MCP server, plus scheduled and event-triggered agents. The maintainers state that the knowledge
    base, cited chat, reports, podcasts, presentations, automations and collaborative chats all keep working
    and that self-hosting stays free, so nothing the score rests on has been withdrawn.
  last_verified: '2026-08-13'
