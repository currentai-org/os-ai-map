product: surfsense
openness:
  score: 2
  class: source_available
  components:
    license:
    - name: Apache-2.0
      detail: OSI, everything outside the proprietary directory
    - name: BSL-1.1
      detail: Business Source License 1.1 - surfsense_backend/app/proprietary
    source:
      value: public
      detail: github.com/MODSetter/SurfSense
    self-host:
      value: primary
      detail: Docker/Compose
    core-gated:
      value: ungated
    free_text:
    - no-feature-gated-core-found
  confidence: high
  note: The license is a two-part compound rather than the plain Apache-2.0 it is often taken for. The root
    LICENSE opens "Portions of this software are licensed as follows" and puts everything under surfsense_backend/app/proprietary/
    under the Business Source License 1.1 defined in that directory's own LICENSE, with everything outside
    it under Apache-2.0. That directory is live rather than a stub - it holds the platform and web-crawler
    code that is the live-data connector surface the product now leads on. GitHub reads the split file as
    unclassified. The most restrictive part of a compound license sets the tier, and BSL-1.1 restricts competing
    use, so public source under it lands at source-available. You can read the whole tree, and the license's
    terms do not let you run the proprietary half in production. Nothing is withheld from the published
    source - the restricted directory ships inside it - and the project still says self-hosting stays free
    and open source, with self-hosted installs running with billing off.
  raw: license:Apache-2.0(OSI, everything outside the proprietary directory)+BSL-1.1(Business Source License
    1.1 - surfsense_backend/app/proprietary);source:public(github.com/MODSetter/SurfSense);self-host:primary(Docker/Compose);no-feature-gated-core-found;core-gated:ungated
