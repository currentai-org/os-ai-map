capability:
  score: 4
  basis: benchmark
  basis_detail: vendor blind expert evaluations on the Hy3 and Hy4 preview model cards
  value: 'Hy4 preview (770B total, 49B active): in Tencent''s blind side-by-side rating of 203 engineering
    tasks by 163 internal experts it averaged 2.99, against 2.92 for GLM 5.3 and 2.94 for Kimi K3. Hy3:
    2.67 out of 4 against 2.51 for GLM-5.1 in a 270-expert blind evaluation. Public benchmark tables appear
    only as images.'
  relative_to: glm
  relation: one_below
  confidence: low
  note: Tencent's own blind evaluations put Hy4 preview level with GLM 5.3 and Kimi K3 on engineering
    work, but its public benchmark tables are published only as images, and the vendor calls the release
    an early version with known issues. Without an independent result it sits a step below GLM rather
    than beside it.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/zai-org/GLM-5.3/raw/main/README.md
