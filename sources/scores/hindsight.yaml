capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: recall within an isolated memory bank per user, agent or project; LLM extraction of facts, entities, relationships
    and time data on retain; background consolidation into observations that are refined, weakened or contradicted
    by new evidence; a recency decay on ranking with observation invalidation; world facts, experiences, observations
    and mental models linked in an entity, temporal and causal graph
  confidence: medium
  note: Hindsight performs every part of the cycle itself, from extracting facts and entities to consolidating them
    into observations, decaying older memories in ranking and retrieving across several typed stores and a graph.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/vectorize-io/hindsight/main/README.md
    shows: The README says retain "uses an LLM to extract key facts, temporal data, entities, and relationships",
      lists world facts, experiences, observations and mental models, and describes isolated banks and four parallel
      recall strategies.
