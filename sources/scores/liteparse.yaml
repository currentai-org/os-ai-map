capability:
  score: 4
  basis: feature_matrix
  value: PDF, DOCX, XLSX, PPTX and images to Markdown with headings, tables, lists, images and links, to JSON with text
    and bounding boxes, or to layout-preserved text; selective OCR through bundled Tesseract or an HTTP OCR server; complexity
    detection; page screenshots; no VLM or user-defined field extraction
  confidence: medium
  relative_to: docling
  relation: one_below
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/docling-project/docling/main/README.md
      shows: The Docling README still lists page layout, reading order and table structure recovery, formulas, chart
        understanding and VLM support, exports to Markdown, HTML and lossless JSON, and links an information-extraction
        example for user-defined fields. LiteParse recovers layout into Markdown and JSON but extracts no user-defined
        fields, which keeps it a step below.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 2ad389cb514915804303a6ac60302f06225ecb0a83b723914c03af1747a85a01
  note: LiteParse rebuilds a page's layout into Markdown with headings, tables and lists, and returns each piece of text
    with its position. It sits a step below Docling because it uses no vision-language model and returns no fields a
    user defines.
  last_verified: '2026-11-12'
  sources:
  - url: https://raw.githubusercontent.com/run-llama/liteparse/main/README.md
    shows: 'README Overview: "Fast Text Parsing: Spatial text parsing using PDFium"; "Markdown Output: Structured Markdown
      with headings, tables, lists, images, and links"; "Bounding Boxes"; OCR via bundled Tesseract or HTTP servers;
      input formats PDF, DOCX, XLSX, PPTX and images.'
    accessed: '2026-11-12'
