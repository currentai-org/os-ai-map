capability:
  score: 3
  basis: feature_matrix
  value: Propeller walks the workflow graph and emits one pod per task against declared
    Resources; typed artifacts passed between steps with caching; plugin task types
    for PyTorch, Spark, Ray and Dask; the Kubernetes scheduler chooses the node
  confidence: medium
  relative_to: kubeflow-pipelines
  relation: at
  note: Flyte's own control plane decides when each task runs and which cluster and
    project-domain it goes to, and emits the pod; the Kubernetes scheduler then picks
    the machine. That is band 3 here. It does the same thing metaflow does under this
    dimension, and the two are banded together rather than separated on a distinction
    the evidence does not carry.
  last_verified: '2026-09-15'
  sources:
