capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Flat, HNSW, HNSW-RaBitQ, IVF and sparse indexes with native full-text search and hybrid queries
    that fuse vector similarity, full-text search and structured filters, embedded in the application process.
    There is no server or cluster; several processes can read a collection at once, but writes come from
    a single process.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: Zvec offers real index breadth (flat, HNSW, HNSW-RaBitQ, IVF and sparse) plus native full-text and
    hybrid search, embedded directly in the application process. It has no server or cluster of its own,
    so it covers much less of the persist-index-retrieve path than Vespa does.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/alibaba/zvec/main/README.md
    shows: README describes an in-process library ("Pure local, no servers, no config, no fuss.") that will
      "Support dense and sparse embeddings, multi-vector queries" and offers "Native keyword-based full-text
      search" and "Multiple processes can read the same collection simultaneously; writes are single-process
      exclusive."
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: aea3d41c46926b6463fee0b1d9db799f3abdd938c3aefb6cd7ac56b538da64c8
