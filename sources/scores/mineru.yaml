  value: 'MinerU 4.0: PDF and image parsing across four quality tiers, from fast native parsing to VLM parsing,
    with tables, formulas, figures, complex layouts and OCR for scanned pages; Office, OpenDocument, EPUB,
    OFD, HTML and CSV parsed natively; one document model rendered as Markdown, HTML, LaTeX, DOCX or structured
    JSON content lists.'
  relative_to: docling
  relation: one_below
  confidence: medium
  note: MinerU parses PDFs and images into one document model that keeps tables, formulas, figures and page
    layout, rendered as Markdown, HTML or structured JSON, but stops short of Docling, which can also return
    the fields a user defines in a template. Its MinerU2.5-Pro model ranks fourth on OmniDocBench, a benchmark
    maintained by MinerU's own team.
