capability:
  score: 2
  basis: feature_matrix
  basis_detail: 'category feature matrix: single index family as a library'
  value: Random-projection-tree indexes as mmapped read-only files with several distance metrics. One index family,
    and indexes are immutable once built.
  relative_to: chroma
  relation: two_below
  confidence: medium
  note: Annoy provides one index family, random-projection-tree indexes stored as mmapped, read-only files
    with several distance metrics, and an index is immutable once it is built. Chroma covers much more of
    the same persist-index-retrieve path as a database in its own right, which is why it sits further along
    the same path.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/spotify/annoy/main/README.rst
    shows: README says Annoy "creates large read-only file-based data structures that are" mmapped so many
      processes share the data, and that "you can not add more items once the tree has been created".
    accessed: '2026-09-30'
    http_status: 200
