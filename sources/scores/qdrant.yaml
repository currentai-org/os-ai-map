product: qdrant
openness:
  score: 5
  class: open_source
  components:
    license:
    - name: Apache-2.0
      detail: OSI, engine core
    source:
      value: public
      detail: Rust
    managed-tier:
      value: Qdrant Cloud
      detail: hosted, paid + free tier
      raw: Qdrant Cloud (hosted, paid + free tier)
    core-gated:
      value: ungated
      detail: no ee/ path no second license and zero repo-wide hits for enterprise or license key. The two
        engine features the pricing table marks absent from OSS are both in the open tree - GPU indexing
        as the lib/gpu crate and resharding across four lib/collection modules with eight consensus tests
        - so what is sold is control plane rather than engine
  confidence: high
  note: 'Nothing in the engine is held back, so this scores 5. The managed Qdrant Cloud tier sitting on
    top is not a gate under this rubric, and a read of the repository and the pricing page finds no gating
    mechanism anywhere: a code search across the whole repository for `enterprise` returns zero hits and
    one for "license key" returns zero, there is a single Apache-2.0 LICENSE at the root, and there is no
    ee/, enterprise/ or second-licensed path in the tree. The pricing table is where a careless read goes
    wrong. It marks GPU Indexing and Shard Splitting as absent from the open source build, and both are
    in the open engine: GPU indexing is its own crate at lib/gpu (Cargo.toml, src/, nvidia_icd.json) beside
    segment, quantization and sparse, and resharding is implemented and consensus-tested at lib/collection/src/collection/resharding.rs,
    lib/collection/src/shards/resharding.rs, lib/collection/src/shards/shard_holder/resharding.rs and lib/collection/src/shards/transfer/resharding_stream_records.rs,
    with eight tests/consensus_tests/test_resharding*.py files. What the table actually compares is the
    managed offering: uptime SLAs, managed backup and disaster recovery against the "custom automation"
    you would run yourself, multi-AZ topology, disk encryption with customer keys, and Enterprise SSO on
    the Qdrant Cloud console. Hybrid Cloud is described as running "managed Qdrant clusters on your own
    infrastructure" - the same engine, operated by someone else. A managed service sold beside a complete
    open core is not a gate.'
  raw: license:Apache-2.0(OSI, engine core);source:public(Rust);managed-tier:Qdrant Cloud (hosted, paid
