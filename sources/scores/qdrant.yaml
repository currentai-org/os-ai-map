capability:
  score: 4
  basis: benchmark
  basis_detail: ANN-Benchmarks inclusion, with the throughput and latency headline from Qdrant's own benchmark
  relative_to: milvus
  relation: at
  value: Dense, sparse and multi-vector search including ColBERT-style late interaction, payload filtering,
    hybrid queries fused by Reciprocal Rank Fusion or Distribution-Based Score Fusion, built-in quantization,
    and horizontal sharding and replication with zero-downtime collection resizing. Vendor benchmark reports
    the highest RPS and lowest latency in almost all scenarios against Milvus, Weaviate, Elasticsearch and
    Redis at matched precision.
  confidence: medium
  note: Qdrant is a complete, distributed vector engine on par with Milvus. Its own benchmarks claim the
    highest throughput and lowest latency among comparable engines, though ANN-Benchmarks lists it without
    a ranking, and it fuses scores over supplied vectors rather than hosting and evaluating models inside
    the serving path, which is what separates the category's leaders from the rest.
  last_verified: '2026-08-18'
  sources:
  - url: https://ann-benchmarks.com/
    shows: Qdrant listed among 38 benchmarked ANN algorithms, alongside Milvus(Knowhere), faiss-ivf, scann,
      hnswlib and weaviate. Results published as interactive recall-versus-queries-per-second plots per
      dataset; no ranking table.
    accessed: '2026-08-18'
    http_status: 200
    content_sha256: c964500c5402bf9c4dc5e0c8841f58497b3009aa38937bf1bc2b1306ee912788
  - url: https://qdrant.tech/benchmarks/
    shows: Vendor benchmark, Observations section - "Qdrant achieves highest RPS and lowest latencies in
      almost all the scenarios, no matter the precision threshold and the metric we choose. It has also
      shown 4x RPS gains on one of the datasets." Compared against Milvus, Weaviate, Elasticsearch and Redis.
    accessed: '2026-08-18'
