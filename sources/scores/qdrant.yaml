adoption:
  level: 3
  reach: 100K-1M
  signal_type: usage_volume
  confidence: medium
  banded_quantity: Docker Hub pulls of the qdrant/qdrant server image averaged over the image's lifetime, a
    floor for a growing product; qdrant-client downloads count the client and are not banded
  note: Qdrant is a server. Its Python client, qdrant-client, is left out because client installs can vary
    independently of server deployments. The score comes from Docker Hub pulls of the server image averaged
    over the image's lifetime, so for a product still growing it is a floor rather than a ceiling.
