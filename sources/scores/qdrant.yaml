adoption:
  level: 5
  reach: '>10M'
  signal_type: usage_volume
  confidence: high
  note: 'Banded on downloads of the Python client: the registry reports 19,077,155 downloads of qdrant-client
    in the last month, well clear of the >10M floor that level 5 takes on this map (for scale, pydantic-ai
    sits near 31M and langgraph near 58M at the same level). That is one level above Milvus on download
    volume, and Qdrant is a leading open vector database for retrieval in RAG and agent stacks. The figure
    is for the Python client rather than the server, which is what this product declares as its countable
    artifact - a server has no download channel of its own, so its client''s downloads are the best available
    usage signal.'
  last_verified: '2026-08-13'
  sources:
  - url: https://pypistats.org/api/packages/qdrant-client/recent
    shows: last_month = 19,077,155 downloads for qdrant-client (last_week 4,271,948, last_day 681,811).
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 1a02e7e2d8e098c2eeace43ebe454d513986d5564f20dea113fb621ca0a4d08b
capability:
  score: 4
  basis: benchmark
  basis_detail: ANN-Benchmarks inclusion, with the throughput and latency headline from Qdrant's own benchmark
  relative_to: milvus
  relation: at
  value: Dense, sparse and multi-vector search including ColBERT-style late interaction, payload filtering,
    hybrid queries fused by Reciprocal Rank Fusion or Distribution-Based Score Fusion, built-in quantization,
    and horizontal sharding and replication with zero-downtime collection resizing. Vendor benchmark reports
    the highest RPS and lowest latency in almost all scenarios against Milvus, Weaviate, Elasticsearch and
    Redis at matched precision.
  confidence: medium
  note: 'Level with Milvus, which is the 4 rung on the storage feature matrix, which bands on how much of
    the persist-index-retrieve path a product provides itself, at what scale and over how many retrieval
    modes: a complete durable system, distributed by sharding and replication, covering dense, sparse and
    multi-vector retrieval with configurable score fusion. It does not reach the 5 rung, which is for a
    platform that hosts and evaluates ranking or embedding models inside the serving path; score fusion
    and late interaction over vectors the caller supplies are not that. The headline throughput comparison
    is vendor-run and published at qdrant.tech/benchmarks. ANN-Benchmarks corroborates inclusion and nothing
    more - it lists 38 algorithms, Qdrant and Milvus (Knowhere) among them, and publishes only interactive
    recall-versus-queries-per-second plots with no ranking table - hence medium confidence. Rebanded on
    this matrix when the product moved out of agent_tools_protocols; the band did not move.'
  last_verified: '2026-08-18'
  sources:
  - url: https://ann-benchmarks.com/
    shows: Qdrant listed among 38 benchmarked ANN algorithms, alongside Milvus(Knowhere), faiss-ivf, scann,
      hnswlib and weaviate. Results published as interactive recall-versus-queries-per-second plots per
      dataset; no ranking table.
    accessed: '2026-08-18'
    http_status: 200
    content_sha256: c964500c5402bf9c4dc5e0c8841f58497b3009aa38937bf1bc2b1306ee912788
  - url: https://qdrant.tech/benchmarks/
    shows: Vendor benchmark, Observations section - "Qdrant achieves highest RPS and lowest latencies in
