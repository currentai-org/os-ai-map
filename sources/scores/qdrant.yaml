adoption:
  level: 3
  reach: 100K-1M
  signal_type: usage_volume
  confidence: medium
  note: Qdrant is a server, and it runs mostly as a self-hosted Docker container. Its Python client,
    qdrant-client, is downloaded by every application that talks to a server, so it counts client installs
    rather than deployments and is left out. The level rests on Docker Hub pulls of the server image
    averaged over the image's lifetime, which understates a product still growing, so it is a floor
    rather than a ceiling.
  last_verified: '2026-09-24'
