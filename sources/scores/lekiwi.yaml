  basis_detail: morphology
  value: 'Mobile manipulator: a six-joint SO-101 arm (five joints and a gripper) on a three-wheel holonomic omni-wheel base,
    with onboard Raspberry Pi 5 and cameras.'
  confidence: high
  note: LeKiwi puts a single small arm on a base that drives in any direction, so it can move to a task instead of waiting
    for the task to be brought to the table. It has one arm and no legs, well short of a full humanoid.
