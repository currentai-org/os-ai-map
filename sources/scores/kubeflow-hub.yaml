capability:
  score: 4
  basis: feature_matrix
  value: register and version models (RegisteredModel, ModelVersion, ModelArtifact) through a REST API with
    an OpenAPI contract and a Python client; upload_artifact_and_register_model writes to S3 or an OCI registry
    and records the URI; read-only catalog federating external sources; models only
  confidence: medium
  relative_to: huggingface-hub-platform
  relation: one_below
  note: Team members register models, versions and artifacts through a documented API, and the client uploads
    the files to the deployment's own object store or OCI registry as it registers them. It tracks models only
    and keeps weights in the storage it points to rather than serving them itself, which keeps it a step below
    Hugging Face Hub.
  last_verified: '2026-09-27'
  sources:
  - url: https://raw.githubusercontent.com/kubeflow/hub/HEAD/docs/logical_model.md
    shows: RegisteredModel "Represent logically a given ML model", ModelVersion "a specific version", ModelArtifact
      "the ML model artifact"; "`uri` can be used as a general mechanism to locate the model artifact/file
      on storage."
