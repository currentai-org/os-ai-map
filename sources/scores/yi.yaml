capability:
  score: 2
  basis: benchmark
  basis_detail: MMLU/BBH/C-Eval
  value: Yi-34B base - MMLU 76.3, BBH 54.3, C-Eval 81.4. Competitive in the 2023-2024 mid-size class.
  confidence: medium
  note: Yi-34B, the original 2023 base model, scores 76.3 on MMLU, 54.3 on BBH and 81.4 on C-Eval in its
    tech report, competitive for its time but well below current DeepSeek and Qwen releases and comparable
    to Falcon 3. The Yi-1.5 model cards show base-model benchmarks only as charts, so the published figures
    are for Yi-34B rather than Yi-1.5-34B.
  last_verified: '2026-09-29'
  sources:
  - url: https://arxiv.org/html/2403.04652v1
    shows: Yi tech report full text. Table 2, "Overall performance on grouped academic benchmarks compared
      to open-source base models", gives the Yi 34B row as MMLU "76.3", BBH "54.3" and C-Eval "81.4". These
      are Yi-34B figures, not Yi-1.5-34B.
