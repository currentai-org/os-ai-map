  value: 'Yi-34B base - MMLU 76.3, BBH 54.3, C-Eval 81.4. Competitive in the 2024 mid-size class.'
  confidence: medium
  note: 'Strong for a 2024 sub-35B model but well below the 2026 frontier open models such as DeepSeek-V4
    and Qwen 3.6, which puts it alongside Falcon 3 among dated-generation families. The MMLU 76.3, BBH 54.3
    and C-Eval 81.4 figures come from Table 2 of the Yi tech report and describe Yi-34B, the original 2023
    model, rather than Yi-1.5-34B. No text source publishes those benchmarks for Yi-1.5-34B: the Hugging
    Face card carries only prose and chart images, and the 01-ai/Yi-1.5 README defers to the card. A 34B-Chat
    GSM8K figure of 90.2 that circulates elsewhere appears on none of those pages, so it is not carried
    here. The score of 2 holds on either release, since a family is scored on its strongest one and Yi-1.5
    is the stronger.'
