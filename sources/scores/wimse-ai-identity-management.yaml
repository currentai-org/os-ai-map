capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: a WIMSE identifier and cryptographically bound credentials required for every agent; resource servers required
    to decide each request from the agent and delegated-subject identities and local policy, optionally through
    an AuthZEN decision point; OAuth delegation with downscoped transaction tokens and cross-domain token exchange;
    CIBA user approval for sensitive requests; tamper-evident audit records of each authorization decision required
  confidence: low
  note: AIMS requires every agent to hold its own workload identifier and credentials, has resource servers decide
    each request against local policy, delegates authority through OAuth with downscoped transaction tokens, sends
    sensitive requests to the user for approval and requires tamper-evident audit records of each decision. It composes
    existing standards rather than defining new mechanisms, and as an informational draft it states practices, not
    a protocol.
  relative_to: agent-governance-toolkit
  relation: at
  last_verified: '2026-11-20'
  sources:
  - url: https://www.ietf.org/archive/id/draft-ietf-wimse-aims-01.txt
    shows: '"An agent participating in this framework MUST be assigned exactly one WIMSE identifier"; these identifiers
      "MUST be used by resource servers ... to determine if access to a resource should be allowed"; transaction
      tokens yield "a downscoped token that is bound to a specific transaction".'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: e841af4c870fc83770e65d9c2c3affe3f879099f5135f13fbc13bb0b750578b7
  - url: https://www.ietf.org/archive/id/draft-ietf-wimse-aims-01.txt
    shows: 'Section 10.8: an agent "can use the OpenID Client Initiated Backchannel Authentication (CIBA) protocol"
      so the user can "approve or deny the requested operation"; section 11: "Audit records MUST be tamper-evident".'
