capability:
  score: 3
  basis: feature_matrix
  value: structured JSON of a search engine results page - organic results, answer box, knowledge graph, local
    pack, news, shopping, video and ads - across roughly 130 engines; `output` can be json, the raw HTML of
    the SERP, or a markdown rendering of the same data
  confidence: high
  relative_to: serper
  relation: at
  note: 'Every SerpApi output mode renders the search engine''s own results page: the `organic_results`
    object carries title, link and snippet, and even HTML mode returns the raw Google results page rather
    than the pages behind its links. No endpoint returns a linked page''s content, which puts it level with
    Serper, the other product that resells someone else''s SERP as structured data.'
  last_verified: '2026-09-17'
  sources:
  - url: https://serpapi.com/search-api
    shows: '"Our Google Search API allows you to scrape results from the Google search page." JSON output "includes
      structured data for Organic Results, Local Results, Ad Results, the Knowledge Graph, Direct Answer boxes,
      Images Results, News Results, Shopping Results, Video Results, and more." The `output` parameter: json,
      `html` which "gives you the raw HTML results from Google", or `md`. The organic_results fields are title,
      link, displayed_link and snippet.'
    accessed: '2026-09-17'
    http_status: 200
