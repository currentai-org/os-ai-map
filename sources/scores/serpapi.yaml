adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: medium
  note: Adoption is measured by PyPI downloads of google-search-results, SerpApi's official Python client.
    A client package is normally a weak proxy for a hosted service, but it holds here because SerpApi sells
    exactly one metered product and the package exists only to call it, unlike a case such as Langfuse where
    the same kind of package also measures self-hosted use. Confidence is medium rather than high because
    the Python client is only one of several ways to call the API, and its npm counterpart adds further,
    uncounted downloads.
  last_verified: '2026-09-16'
  sources:
