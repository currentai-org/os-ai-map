    private hubs where admins add custom models, notebooks and datasets for their organization
  confidence: high
  relative_to: huggingface-hub-platform
  relation: two_below
  note: JumpStart lists open and proprietary models from dozens of providers, versions them, and deploys them
    to SageMaker endpoints from the catalog. AWS decides what enters the public hub, and custom models live
    only in an organization's private hub, so it is a curated catalog rather than an open registry like Hugging
    Face Hub.
