capability:
  score: 3
  basis: feature_matrix
  value: Human feedback collection for text classification, NER, RAG, preference tuning and text-to-image data; labeling with
    filters, AI feedback suggestions and semantic search; Python SDK with Hugging Face Hub import and export; used to curate
    the cleaned UltraFeedback preference set behind Notus. No programmatic labeling.
  confidence: medium
  note: Argilla covers human feedback for classification, extraction, retrieval and preference data, with model suggestions
    and semantic search to speed review. It sits a step below Snorkel Flow, which adds programmatic labeling and weak supervision.
  relative_to: snorkel-flow
  relation: one_below
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://docs.snorkel.ai/
      shows: The Snorkel documentation home, now at version 26.7, still describes "programmatic data labeling and weak supervision",
        an evaluation workflow, an annotation studio for subject matter experts, and administration of "users, roles, and
        permissions", with a separate "Predictive ML 25.4" line.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 35be1ef71161a146c8162e8082ff15369ffa4a36bb27fa8e822e44d8ef88b297
  last_verified: '2026-11-12'
  sources:
