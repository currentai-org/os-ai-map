  value: 'VideoLLaMA2.1-7B-AV: video with its audio track, audio alone and images in, text out (audio-visual and
    audio question answering). VideoLLaMA3: video sampled at 1 FPS up to 180 frames in the documented example, reported
    as the best 7B model on the Video-MME leaderboard as of 2025-01-24.'
