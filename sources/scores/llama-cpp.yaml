capability:
  score: 4
  basis: feature_matrix
  value: 'Backends: Metal, CUDA, HIP (AMD), MUSA (Moore Threads), Vulkan, SYCL, WebGPU, and an in-progress
    OpenVINO backend; integer quantization at 1.5/2/3/4/5/6/8-bit; a multimodal subsystem (vision models);
    an OpenAI-compatible llama-server REST API; runs any of the thousands of GGUF models hosted on Hugging
    Face. No standardized MLPerf Inference submission for the engine itself.'
  confidence: high
  note: llama.cpp is the frontier for portable, CPU and consumer-hardware inference and for quantization
    breadth, rather than the datacenter-GPU throughput frontier occupied by vLLM, SGLang and TensorRT-LLM,
    which is what keeps it a step below them.
  basis_detail: README backend/quantization matrix plus the models doc,; no benchmark submission exists
    for the engine itself
  last_verified: '2026-09-29'
