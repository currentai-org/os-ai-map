adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: medium
  note: The de facto standard local and edge inference engine. The Hugging Face Hub documents GGUF usage
    separately for llama.cpp, Ollama, LM Studio and GPT4All, which reflects how central the format has become
    across that ecosystem. No clean PyPI or download count exists for the C++ engine itself, so usage is
    inferred from that ecosystem centrality and from steadily growing GitHub stars, now 123,185, rather
    than from a direct install count; that puts it at level 4, the 1M-10M equivalent band. A widely repeated
    claim that GGUF accounts for more than 60% of all quantized models on Hugging Face is not carried here,
    because no cited source states it.
  last_verified: '2026-08-09'
