capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indic speech recognition data
  value: Shrutilipi holds more than 6,400 hours and 4.95 million sentences of All India Radio news speech in
    12 languages, with transcripts aligned automatically from published bulletins, documented in a paper that
    shows gains on IndicSUPERB, with community speech models listed as trained on it.
  confidence: medium
  note: Shrutilipi adds thousands of hours of transcribed news speech in 12 Indian languages, its paper shows
    it improves recognition on IndicSUPERB, and community speech models are trained on it. It covers one domain,
    read broadcast news, and the same team's IndicVoices supersedes it with speech from about 51,000 speakers
    in all 22 scheduled languages.
  relative_to: indicvoices
  relation: two_below
  last_verified: '2026-09-24'
  sources:
