capability:
  score: 4
  basis: feature_matrix
  basis_detail: how the content was made and downstream use, for Thai instruction data
  value: About 40,000 Thai instruction rows across four professional domains and seven task types. Its paper
    counts 35,014 pairs written by annotators and domain experts with no model-written content; the card's
    further rows are not described in the paper. Documented in an EMNLP paper, with models such as WangchanLION
    v2 trained on it.
  confidence: medium
  note: WangchanThaiInstruct is written entirely by Thai annotators and domain experts rather than translated
    or generated, it is documented in an EMNLP paper, and models such as WangchanLION v2 are trained on it.
    It covers four professional domains in one language, and the models the Hub lists as trained on it include
    quantized copies of WangchanLION v2 and a Llama 3.1 Thai fine-tune.
  last_verified: '2026-11-11'
