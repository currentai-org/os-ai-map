capability:
  score: 5
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: Provisioned server and client sites, with a dashboard; Kubernetes and Slurm job launchers; an Android and
    iOS edge SDK; homomorphic encryption, differential privacy and confidential computing on AMD SEV-SNP with NVIDIA
    GPUs (Intel TDX announced for a future release); and federated LLM fine-tuning validated from 1.7B to 72B parameters.
  confidence: high
  note: 'FLARE is the one product in the category that documents all three reaches together: production cross-silo
    sites with provisioned identities, HPC clusters through a Slurm launcher, and phones through a mobile SDK. It
    is also the only one to publish memory and timing measurements for federated LLM training up to 72 billion parameters.
    That combination makes it the category''s top anchor.'
  last_verified: '2026-09-27'
