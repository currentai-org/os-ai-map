  score: 1
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: None of the four attributes is established; the paper states that new cells are embedded with no data labelling, model training, or fine-tuning.
  confidence: high
  note: The absent adaptation pathway is a positive claim by the publisher rather than a gap in the evidence. The model emits embeddings rather than generated outputs, takes one transcriptomic modality, and operates at one scale; embedding cells from many species is coverage, not a second instrument.
  last_verified: '2026-09-10'
  sources:
