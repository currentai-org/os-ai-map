capability:
  score: 1
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: None of the four attributes is established; the paper states that new cells are embedded with no data labelling, model training, or fine-tuning.
  confidence: high
  note: 'The absent adaptation pathway is a positive claim by the publisher, not a gap in the evidence:
    UCE is built to embed new cells with no additional training or fine-tuning. It also emits embeddings
    rather than generated outputs, takes one transcriptomic modality, and works at one scale -- embedding
    cells from many species broadens coverage of that same modality rather than adding a second one.'
  last_verified: '2026-09-10'
  sources:
  - url: https://www.nature.com/articles/s41586-026-10689-z
    shows: States that UCE's universality means new cells can be embedded with no data labelling, model training or fine-tuning, and describes the output as a unified biological latent space.
