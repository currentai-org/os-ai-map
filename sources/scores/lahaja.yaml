capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for a Hindi accent test set
  value: Lahaja holds 12.5 hours of read and extempore Hindi speech from 132 speakers in 83 districts, documented
    in a paper, with no use found beyond that paper's baselines.
  confidence: medium
  note: Lahaja is a documented test set for one language and one question, how Hindi recognition copes with
    regional accents. No benchmark or model outside its paper reports on it, and Kathbath covers 12 languages
    with far more speech.
  relative_to: kathbath
  relation: one_below
  last_verified: '2026-09-24'
  sources:
