  value: distributed supervised and unsupervised learners (GLM, GAM, GBM, XGBoost, DRF, deep learning,
    SVM, RuleFit, CoxPH, stacked ensembles, isolation forest, k-means, PCA, GLRM) plus H2O AutoML, which
    trains and cross-validates a set of GBM, XGBoost, GLM, random-forest and deep-learning models and
