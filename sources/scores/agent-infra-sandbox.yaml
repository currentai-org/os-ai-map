capability:
  score: 3
  basis: feature_matrix
  value: isolation:single Docker container (process/namespace, weaker than microVM/gVisor); runtime breadth:high
    (Python+Node sandboxes, browser/VNC, shell, Jupyter, VSCode, MCP servers); persistence:workspace volume
    in the Compose example, otherwise container-local; scale:Kubernetes Deployment example (2 replicas,
    per-pod CPU and memory limits), no published concurrency limit
  confidence: medium
  note: Agent Infra Sandbox bundles a browser, shell, file service, Jupyter, an IDE and MCP servers in one
    container, a broader feature set than most sandboxes offer. Its isolation is only that of a Docker container,
    weaker than Firecracker's microVMs or gVisor, and the quick start relaxes it further by running with
    seccomp unconfined.
