  components:
    license:
    - name: Apache-2.0
      detail: OSI; covers the code
    - name: Datalab-Modified-OpenRAIL-M
      detail: the model weights, per the README's Model License badge linking to Datalab's pricing page; the
        badge states the family and not a threshold, and Datalab's published recognition weights have historically
        carried CC-BY-NC-SA-4.0, so the exact terms need a maintainer's read
    source:
      value: public
      detail: datalab-to/surya carries the engine and the weights are published
  confidence: low
  note: Apache-2.0 covers Surya's code, but the README links the weights only to an OpenRAIL-M badge on
    Datalab's pricing page, with no threshold stated publicly. Datalab's other published weights carry the
    noncommercial CC-BY-NC-SA-4.0, so, like Chandra and Marker, this public source paired with an unclear,
    competition-restricting weights license reads as source-available rather than fully open.
