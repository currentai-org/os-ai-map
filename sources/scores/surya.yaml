  note: 'Apache-2.0 covers the code. The model weights do not: the README carries a ''Model License OpenRAIL-M''
    badge linking to Datalab''s pricing page, so the thing you run is not under the code''s licence. What the
    weights terms actually SAY is unresolved here and that is why the record defers rather than scores. The
    weights terms are NOT asserted to match Chandra''s: Chandra''s README states a USD 2M threshold, Surya''s
    badge states none, and the recognition weights Datalab has published on Hugging Face carry CC-BY-NC-SA-4.0,
    which is NonCommercial and a materially different grant. An earlier draft of this record claimed the two
    were the same terms; that was unverified and is withdrawn. The pair is hand-assigned and the category defers
    it: the shared software tier lists licences by literal name and does not name this one, so the lookup abstains.
    Extending a shared tier reaches eleven categories and is a maintainer''s ruling rather than part of a promotion.'
