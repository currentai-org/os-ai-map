adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: Adoption is measured from cumulative model-pull volume across Ollama's model library, corroborated
    by GitHub stars on the engine repository. The PyPI package named ollama is a client for talking to a
    local server, not the product's primary distribution channel, so its own download count is not used
    and there is no other package to measure adoption from.
  sources:
  - url: https://api.github.com/repos/ollama/ollama
