capability:
  score: 4
  basis: feature_matrix
  value: null
  confidence: high
  note: Ollama runs models locally through a one-command CLI, an OpenAI-compatible REST API, and Python
    and JavaScript clients, with a model library spanning Llama, Qwen, Gemma, DeepSeek and gpt-oss and CLI
    launches for coding agents. No benchmark result is published for the runtime itself, so this reading
    comes from feature and model breadth rather than measured performance.
  last_verified: '2026-09-29'
  sources:
  - url: https://raw.githubusercontent.com/ollama/ollama/main/README.md
    shows: The README documents the REST API on "http://localhost:11434/api/chat", Python and JavaScript
      clients, and "ollama launch claude" plus integrations for Claude Code, Codex, Copilot CLI, DeepSeek
      Harness, Droid and OpenCode.
    accessed: '2026-09-29'
