  value: Single image in; task tokens for captions, detection, phrase grounding, region proposals and OCR. Zero-shot
    COCO caption CIDEr 135.6 and RefCOCO val 56.3 for Florence-2-large; fine-tuned VQAv2 81.7 against 86.0 for PaLI-X.
  confidence: high
  relative_to: minicpm-v
  relation: two_below
  note: Florence-2 performs a fixed set of prompted tasks on a single image, including captions, detection, grounding
    and OCR, with strong results for its size. It does not hold a conversation, read documents as a whole or take
    several images, two steps below MiniCPM-V.
