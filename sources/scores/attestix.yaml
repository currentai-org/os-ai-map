capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: Unified Agent Identity Tokens with did:key and did:web identifiers and Ed25519-signed W3C credentials;
    UCAN-style delegation tokens whose capabilities must be a subset of the parent token's; SHA-256 hash-chained
    audit trail of logged agent actions; no per-action policy decision; no human approval step
  confidence: medium
  note: Attestix issues agent identities, narrows delegated capabilities across hops and keeps a hash-chained record
    of logged actions, but it never decides whether an action may run, so it proves authority rather than enforcing
    it. It has no human approval step.
  relative_to: besa
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/VibeTensor/attestix/main/README.md
    shows: Modules include Identity ("Unified Agent Identity Tokens"), DID ("did:key, did:web"), Delegation ("UCAN-style
      capability delegation with EdDSA-signed JWT tokens") and an Audit Trail as a "Hash-chained log"; "Cryptographic
      validity is separate from issuer trust, authorization, revocation and replay policy."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 46cb950555247cb0ff239ae583d8f0331df8b6dfd8b5048d09240e3433fb9d43
