capability:
  score: 5
  basis: feature_matrix
  value: 'HiveD scheduler extender: models each tenant as a virtual cluster and guarantees GPU quantity AND
    topology, so a job needing eight GPUs inside one node is placed only where that holds; tenants may borrow
    other virtual clusters'' free capacity at lower priority'
  confidence: medium
  relative_to: kai-scheduler
  relation: at
  note: 'Banded on HiveD''s own documentation rather than on the platform''s positioning. HiveD decides which
    GPUs on which machines a job receives and guarantees the topology of that set, which is choosing the machines
    and reserving them together - band 5. That the Kubernetes bind call executes the choice does not move the
    decision: HiveD is a scheduler extender, and the extender is what decides.'
  last_verified: '2026-09-15'
  sources:
  - url: https://raw.githubusercontent.com/microsoft/hivedscheduler/master/README.md
    shows: 'HiveD''s own README: ''HiveD is a scheduler for deep learning workloads'', a Kubernetes scheduler
      extender for multi-tenant GPU clusters, whose ''killer feature'' is topology-aware resource guarantee
      - the example given is an eight-GPU job that must run within a single node and cannot be allocated by
      a scheduler that guarantees only a count.'
    accessed: '2026-09-15'
