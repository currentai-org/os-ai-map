capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Signs a model directory as a Sigstore bundle holding a DSSE envelope over per-file digests; verification
    with Sigstore identities, public keys or certificates. NVIDIA signs NGC models with it.
  relative_to: nvtrust
  relation: one_below
  confidence: high
  note: The signature lets anyone confirm a model is the one its publisher signed, without asking the publisher,
    and NVIDIA uses it to sign the models in its NGC catalog. It attests who published the weights, not how
    they were produced, which keeps it a step below NVIDIA's hardware attestation.
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/sigstore/model-transparency/main/README.md
    shows: Aims at "verifiable claims about the integrity and provenance of the resulting models, meaning users
      can check for themselves"; signing creates a Sigstore bundle with a DSSE envelope
    accessed: '2026-09-26'
    http_status: 200
    content_sha256: 9737b029c2a87aebfb039d2d68c070e4ed63ec7aecd9777fcc248f2557276842
