    contrastive training
  value: English-only 384-dimensional encoder truncating input at 256 word pieces; the multilingual sibling covers 50+ languages
    at the same short context.
  relative_to: e5
  relation: one_below
  confidence: high
  note: 'All-MiniLM is narrow and dated: the headline checkpoint is English-only, truncates at 256 word
    pieces, and is an early distillation model. It sits a step below E5, which reaches the same short context
    but publishes multilingual retrieval numbers.'
