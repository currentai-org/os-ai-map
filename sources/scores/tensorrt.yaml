  note: TensorRT applies graph-level fusion and explicit quantization, with ONNX ingest and a plugin interface
    for custom layers, compiling to NVIDIA GPU engines. That toolchain is narrowed to one vendor's hardware,
    one step below Apache TVM's multi-vendor reach.
