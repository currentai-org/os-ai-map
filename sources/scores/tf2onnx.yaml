capability:
  score: 2
  basis: feature_matrix
  basis_detail: 'category feature matrix: narrow kernel set or single-pass utility'
  value: One-directional conversion from four TensorFlow-family formats to ONNX, with ONNX graph cleanup
    passes such as transpose removal and constant folding. No hardware compilation; the --target flag selects
    runtime-specific workarounds.
  relative_to: tensorrt
  relation: two_below
  confidence: medium
  note: tf2onnx converts TensorFlow, Keras, TensorFlow.js and TFLite models to ONNX and runs ONNX-level
    graph cleanup passes such as transpose removal and constant folding. It compiles to no hardware target,
    so this single-purpose utility sits two steps below TensorRT, which fuses and quantizes for NVIDIA GPU
    engines.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/onnx/tensorflow-onnx/main/README.md
    shows: README opens "tf2onnx converts TensorFlow (tf-2.x), keras, tensorflow.js and tflite models to
      ONNX via command" line or python api, and documents "We support and test ONNX opset-14 to opset-18."
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: ed7f79675aa6b13142400521be52d50f0c5ea862d9d98b42bf44df8a8e7a3bcb
