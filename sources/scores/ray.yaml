capability:
  score: 5
  basis: feature_matrix
  value: placement groups atomically reserve bundles of resources across multiple nodes - gang scheduling -
    and Ray's own scheduler then places tasks and actors into that reservation, PACKed for locality or SPREAD
    for fault tolerance; Ray Train and Ray Tune use the placement group API so that every resource for a trial
    is available at the same time
  confidence: high
  note: 'Ray reaches the top of this category''s ladder: placement groups atomically reserve bundles of resources
    across multiple nodes and Ray''s own scheduler then places tasks and actors inside that reservation, PACKed
    for locality or SPREAD for fault tolerance. Ray''s own documentation names the all-or-nothing property
    as what distributed training needs - every resource for a trial available at the same time - which is the
    band''s requirement stated by the product itself. The band is not carried over from deployment, whose ladder
    orders on isolation strength: moving a product between categories re-opens the instrument and not just
    the number, and this axis asks how far a product''s own scheduler gets toward putting work on a machine.'
  last_verified: '2026-09-15'
  sources:
  - url: https://docs.ray.io/en/latest/ray-core/scheduling/placement-group.html
    shows: 'Ray''s placement-group documentation: placement groups ''allow users to atomically reserve groups
      of resources across multiple nodes, a concept commonly known as gang scheduling'', with tasks and actors
      then scheduled into them PACKed or SPREAD. ''Distributed Training (e.g., Ray Train and Ray Tune) uses
      the placement group APIs to enable gang scheduling. In these settings, all resources for a trial must
      be available at the same time.'''
    accessed: '2026-09-15'
    http_status: 200
    content_sha256: 29012bae87bad1b04524a8890b899d8835d6f101b663fa9e122741524630b3aa
