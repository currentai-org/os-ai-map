    ee/, commercial/ or proprietary/ path; the only Anyscale-named files are CI image definitions and release-test
    harnesses, not a closed package the open tree depends on. Anyscale’s Ray page sells infrastructure management
    - "Ray runs anywhere. Or choose Anyscale, and leave the infrastructure to us" - and claims no Ray capability
    the open project withholds. That is the langchain/otari shape, so the published source is the whole
    product and the ladder scores 5. Ray is also governed by the PyTorch Foundation rather than by Anyscale,
    which is why the managed platform can be moved out of the openness question entirely.
