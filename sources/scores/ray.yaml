  confidence: high
  note: Apache-2.0 throughout with a managed platform sold beside it, and nothing in the core held back.
    That reading rests on the repo and on Anyscale’s own page. The 11,885-entry untruncated tree of ray-project/ray@master
    carries a single governing Apache-2.0 LICENSE plus three vendored third-party ones, and no enterprise/,
    ee/, commercial/ or proprietary/ path; the only Anyscale-named files are CI image definitions and release-test
    harnesses, not a closed package the open tree depends on. Anyscale’s Ray page sells infrastructure management
    - "Ray runs anywhere. Or choose Anyscale, and leave the infrastructure to us" - and claims no Ray capability
    the open project withholds. So the published source is the whole product, and it scores at the top of
    the ladder. Ray is also governed by the PyTorch Foundation rather than by Anyscale, which is why the
    managed platform can be moved out of the openness question entirely.
