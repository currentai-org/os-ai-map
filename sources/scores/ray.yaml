  note: The PyPI download API reports 63,273,910 downloads of ray in the trailing 30 days and 15,105,708
    in the trailing week, comfortably above the >10M a month floor for level 5 - and above even the stricter
    50M floor applied to the highest-volume software records, where PyTorch sits at ~88.6M and Triton at
    ~64.7M. The trailing-week figure alone clears the floor, so the band does not turn on which window is
    read. The figure is read from the download API rather than from the rendered pepy page, and PyPI is
    the product’s declared distribution channel, so the level can be recomputed from that feed and challenged.
    Ray is the standard open distributed-compute and model-serving substrate (Ray Serve, Tune, Train, Data)
