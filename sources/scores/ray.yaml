capability:
  score: 4
  basis: feature_matrix
  value: null
  confidence: high
  note: 'General distributed-compute + model-serving framework (Ray Core, Serve, Tune, Train, Data). No
    standardized inference/training benchmark (MLPerf) applies to Ray as a whole; scored on breadth of distributed-serving
    feature coverage. Not directly comparable to single-engine inference benchmarks. It is a scheduling
    and serving substrate rather than an isolation boundary, which is why it sits at 4 and not at the microVM
    frontier this category''s 5s occupy: Ray Core plus the AI libraries (Data, Train, Tune, Serve, RLlib),
    clusters on VMs or Kubernetes, mixed CPU/GPU scheduling, and workloads spanning batch inference, model
    serving, distributed training, hyperparameter tuning, feature engineering and reinforcement learning.'
  last_verified: '2026-08-13'
  sources:
  - url: https://www.anyscale.com/product/open-source/ray
    shows: Anyscale's open-source Ray page, describing Ray Core plus the Data, Train, Tune and Serve libraries
      and deployment on VMs or Kubernetes. Establishes the feature breadth the capability band rests on.
    accessed: '2026-08-15'
    http_status: 200
    content_sha256: 19e2ccd77f49e1dd71ece2933c6e521db3fe66cf9af6e706e702e749b196a9fc
  - url: https://docs.anyscale.com/get-started/what-is-ray
    shows: '"Ray is an open source framework for building, deploying, and serving AI and ML applications
      using distributed compute resources. Ray excels when applications need to scale to many machines
      and optimizes resource utilization for workloads that require both CPUs and GPUs." Lists the
      libraries built on Ray Core (Data, Train, Tune, Serve) and the common workloads - batch inference,
      LLMs and gen AI, model serving, feature engineering, hyperparameter tuning, distributed training,
      reinforcement learning. "All Ray apps deploy as Ray clusters", on virtual machines or Kubernetes.'
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: ec01ef00a03ff45805f1a10bde79f3818f131323dc49731c5952635ed2c7f947
