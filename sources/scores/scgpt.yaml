capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Fine-tuning scripts and tutorials, and multi-omic input; perturbation output is a predicted post-perturbation
    expression profile rather than a generated one, and cell generation is still listed as to-do; one cellular
    scale.
  confidence: medium
  note: scGPT ships fine-tuning scripts and tutorials and takes multi-omic input; Tutorial_Multiomics.ipynb
    ships even though the to-do list still marks multi-omic support unfinished. Its perturbation tutorial
    predicts the expression values that follow a given perturbation, a deterministic prediction rather than
    a generated cell or distribution, and cell generation is still on that to-do list. Gene and cell representations
    are one scale, and the organ-specific checkpoints are separate models.
  last_verified: '2026-11-16'
