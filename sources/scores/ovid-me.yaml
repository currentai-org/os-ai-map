capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: verifies the signed OVID token chain that identifies each sub-agent; Cedar evaluation of every tool call
    against the mandate, with enforce, dry-run and shadow modes; subset proof that a child's mandate is narrower
    than its parent's; no human approval step, as denials escalate to the parent agent; plain append-only JSONL
    and SQLite audit log, not tamper-evident
  confidence: medium
  note: OVID-ME verifies each sub-agent's signed identity token, evaluates every tool call against the Cedar mandate
    it carries and can prove a child's mandate is narrower than its parent's. A denial escalates to the parent agent
    rather than to a person, and its audit log is an ordinary append-only file without signatures or hash chaining.
  relative_to: agent-governance-toolkit
  relation: two_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/clawdreyhepburn/ovid-me/main/README.md
    shows: The README shows OVID-ME evaluating each tool call by "Verify OVID signature chain", extracting the Cedar
      mandate and returning ALLOW or "DENY → escalate to parent"; it says "Permissions can only narrow" with a subset
      proof at issuance, and describes an "Append-only JSONL audit log + optional SQLite database".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: c8b2b9e9dbcf1c26616ff854465f6e1ce008e9ad078bcfd1e64b3deb9d269fe9
