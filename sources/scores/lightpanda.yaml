  class: open_source
  components:
    license:
    - name: AGPL-3.0
      detail: OSI, copyleft
    source:
      value: public
      detail: the repository builds the browser binary
    core-gated:
      value: ungated
      detail: the hosted Lightpanda cloud is a separate managed service, not a carve-out of the published engine
  confidence: high
  note: The repository states its own terms canonically. LICENSING.md names the default license for the project
    as AGPL-3.0-only, spelled per the SPDX License List, the LICENSE body is the AGPL-3.0 text, and the GitHub API
    reports the same spdx_id, so all three agree and nothing is appended after the license text. The repository
    builds the browser binary, and the hosted Lightpanda service is a managed offering sold beside the engine rather
    than functionality withheld from it, so the core is ungated. Placing AGPL in the OSI tier beside Apache rather
    than a rung below it is the ladder's standing rule - a copyleft obligation binds whoever redistributes and caps
    neither who may use the software nor at what scale - and it is a fact about AGPL rather than evidence about
    this product.
  raw: license:AGPL-3.0(OSI, copyleft);source:public;core-gated:ungated
