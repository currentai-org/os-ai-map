capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose engine rather than a managed browsing platform'
  value: Headless browser implementing the DOM and a JavaScript runtime through V8 without a rendering pipeline,
    driven over the Chrome DevTools Protocol so Playwright and Puppeteer clients connect to it in place of Chrome.
  relative_to: browserbase
  relation: one_below
  confidence: medium
  note: Banded one below browserbase, which provides session management, proxying, stealth and observability around
    a browser as a managed platform. Lightpanda provides the engine and the CDP surface and leaves the platform
    to the caller, and its Web API coverage is still partial. The comparison is dated to when the anchor was last
    confirmed rather than to this sweep, because a relative band is only as fresh as the record it is relative to.
  last_verified: '2026-08-13'
  sources:
  - url: https://raw.githubusercontent.com/lightpanda-io/browser/main/README.md
    shows: README documents a headless browser written in Zig implementing the DOM and a JavaScript runtime through
      V8 with no rendering, exposing the Chrome DevTools Protocol for Playwright and Puppeteer clients, and notes
      that Web API coverage is partial and in progress.
