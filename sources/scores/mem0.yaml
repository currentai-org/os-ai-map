capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: 'in the open library: LLM extraction of facts from messages; search by user, agent or run; extraction
    that only adds memories, with no update or merge of what is stored; no graph; no forgetting the library
    judges itself, only expiration dates the caller sets. Mem0 Platform, the hosted tier, adds Dream supersede
    and merge, memory decay and an entity graph, which the open release does not ship'
  confidence: medium
  note: 'Mem0''s open library extracts facts from conversations and serves them back by user, agent or session,
    but it only ever adds memories: it does not merge or correct what is stored, keeps no graph, and forgets
    only on dates the caller sets. Consolidation, decay and the entity graph are features of the hosted
    Mem0 Platform, not of the code Mem0 publishes.'
  relative_to: lightmem
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://docs.mem0.ai/core-concepts/how-it-works
    shows: '"An LLM extracts preferences, decisions, plans, and other details"; searches are scoped by user_id,
      agent_id or run_id; "The automatic extraction path is additive", and OSS retrieval "has no graph memory".'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 89cdcb17ddd6065e6c77ccd09312fba42c6890d07d1745b7e5283491f1e29cc0
  - url: https://docs.mem0.ai/platform/features/dream
    shows: Dream "synthesizes higher-order patterns, supersedes outdated facts, and merges duplicates"; Supersede
      and Merge are "Always on, all plans" of the Platform.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 491298124b064231157677d04d5d5b0511980c99ad6d316ce8d9f6ab1fd6e515
  - url: https://docs.mem0.ai/platform/features/graph-memory
    shows: '"Mem0 Platform automatically organizes your memories into a graph": entities become nodes and memories
