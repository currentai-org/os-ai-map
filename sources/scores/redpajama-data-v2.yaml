  confidence: high
  note: RedPajama-V2 publishes over 100 billion web documents from 84 Common Crawl snapshots, with quality
    signals and the scripts that rebuild it, as a public download. Its card licenses only the processing
    code, under Apache-2.0, and refers the data to Common Crawl's terms of use, which leave page rights
    with their owners. The paper describing both RedPajama releases grants the aggregated dataset under
    ODC-By, but then refers all Common Crawl-derived data, which is the whole of V2, to those same terms,
    so whether the grant reaches V2 is unclear.
