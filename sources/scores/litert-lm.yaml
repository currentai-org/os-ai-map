capability:
  score: 3
  basis: feature_matrix
  basis_detail: category feature matrix, banded against the vllm anchor
  value: Cross-platform on-device orchestration of language models over the LiteRT runtime, with GPU and
    NPU acceleration, vision and audio input and function calling, distributed as a CLI and Python, Kotlin
    and C++ APIs.
  relative_to: vllm
  relation: two_below
  confidence: medium
  note: LiteRT-LM sits two tiers below vLLM. It runs models on edge hardware rather than serving them from
    a datacenter, so it carries none of the batching, parallelism or multi-tenant serving that the higher-rated
    engines are built around.
