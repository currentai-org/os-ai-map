capability:
  score: 4
  basis: feature_matrix
  value: v1 exposes `POST /search` ("a response with a description and results references used" - url, title,
    snippet) and `POST /extract` ("Extract page content as markdown from URLs"), and `/search` takes an `extract`
    block that fetches the result pages and replaces each snippet with the page markdown
  confidence: high
  relative_to: firecrawl
  relation: at
  note: Finds and returns the content, in one call. The `extract` block on `/search` is documented as fetching
    the result pages so that "the resulting page markdown will update the value of the `snippet` field on the
    respective result item" - references plus their content, which is band 4. FastGPT composes an answer with
    references, and FastGPT is a separate v0 product at its own price, so it does not lift this record. Banded
    at brave-search-api, the same find-plus-extracted-content shape sold as one metered API.
  last_verified: '2026-09-17'
  sources:
  - url: https://kagi.com/api/docs/_spec/openapi.yaml
    shows: 'The v1 OpenAPI document. Two paths: `/search` "Perform a web search" returning searchResult objects
      of url, title and snippet, and `/extract` "Extract page content as markdown from URLs". The `/search`
      request''s `extract` property: "Configuration for extracting page content from search results. When provided,
      the API will fetch and extract the content from the specified number of result pages. The resulting page
      markdown will update the value of the snippet field on the respective result item."'
    accessed: '2026-09-17'
    http_status: 200
