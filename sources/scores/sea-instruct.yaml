  basis_detail: how the content was made, for Southeast Asian instruction data
  value: Instruction data in English, Chinese and ten Southeast Asian languages, about 7.2 million rows
    across the seven language configurations its card lists, with prompts filtered from open data or synthesized
    and responses written and revised by models, documented in a card without a paper, and used to train
    the Nemotron-SEA-LION v4.8 models.
  confidence: medium
  note: SEA-Instruct covers twelve languages with rows tagged for domain, task and cultural knowledge, and
    AI Singapore's Nemotron-SEA-LION v4.8 models are trained on it. Every response is written and revised
    by models, and some prompts are synthetic or translated from English, where Inkuba-Instruct recasts
    text and labels from existing datasets rather than generating them.
