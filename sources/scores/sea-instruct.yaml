  basis_detail: how the content was made, for Southeast Asian instruction data
  value: SEA-Instruct holds 7,196,718 conversations across seven Southeast Asian language configurations, with
    prompts filtered from open data, synthesized or translated, and every response written and revised by models.
    Documented in a card without a paper, and used to train the Nemotron-SEA-LION v4.8 models.
  confidence: medium
  note: SEA-Instruct covers twelve languages with rows tagged for domain, task and cultural knowledge, and
    AI Singapore's Nemotron-SEA-LION v4.8 models are trained on it. Every response is written and revised by
    models, and some prompts are synthetic or translated from English, where WangchanThaiInstruct is written
    entirely by people.
