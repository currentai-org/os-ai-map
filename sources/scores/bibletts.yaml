capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for African text-to-speech data
  value: BibleTTS offers up to 86 hours per language of studio-quality single-speaker Bible readings, aligned
    for six African languages, documented in an Interspeech paper, with no use found beyond the VITS models
    in that paper.
  confidence: medium
  note: BibleTTS provides studio-quality single-speaker recordings for six African languages, with a paper
    on alignment and speech synthesis baselines. Its content is limited to Bible readings, no model beyond
    its own paper uses it, and Afrivoice records far more speech across 18 languages, Lingala among them.
