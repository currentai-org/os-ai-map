capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for African text-to-speech data
  value: BibleTTS offers up to 86 hours per language of studio-quality single-speaker Bible readings, aligned
    for six African languages, documented in an Interspeech paper, with no use found beyond the VITS models
    in that paper.
  confidence: medium
  note: BibleTTS provides studio-quality single-speaker Bible readings for six African languages, with a paper
    on alignment and speech synthesis baselines, though no model beyond that paper uses it. At a few hundred
    hours of Bible text it is small beside English speech corpora of hundreds of thousands of hours, and Afrivoice
    records more varied speech across eighteen languages, Lingala among them.
