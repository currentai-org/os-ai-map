capability:
  score: 4
  basis: feature_matrix
  value: Secure, zero-copy tensor serialization format and library used cross-framework.
  confidence: high
  note: Safetensors is a storage format rather than a training or inference framework, so its scope is narrow.
    Within that scope it offers safe loading, zero-copy reads, lazy loading of individual tensors and bfloat16/fp8
    support, with loaders for five frameworks.
  last_verified: '2026-09-29'
  sources:
  - url: https://huggingface.co/docs/safetensors/main/en/index
    shows: Documentation states "Safetensors is a new simple format for storing tensors safely (as opposed
      to pickle) and that is still fast (zero-copy)" and has separate API pages for Torch, Tensorflow, PaddlePaddle,
      Flax and Numpy.
    accessed: '2026-09-29'
