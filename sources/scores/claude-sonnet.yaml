  basis: benchmark
  basis_detail: SWE-bench Verified
  value: null
  confidence: medium
  note: 'RE-DERIVED 2026-08-14 on the governing release, and the band is unchanged at 4. The axis had been
    read on Sonnet 4.6, which docs/reference/identity.md would not accept - a tier scores on the MAX across its
    releases and the tier now ships Claude Sonnet 5 (2026-06-30). Read on Sonnet 5 the answer is the same,
    and Anthropic''s own framing is why. The launch post says "Sonnet 5 narrows the gap - its performance is
    close to that of Opus 4.8, but at lower prices", calls Opus 4.8 "a more generally capable model, for
    reference", and describes Sonnet 5 as "approaching Opus 4.8''s capability levels" while outperforming it
    only "on some tasks". Close to, approaching, and better on some tasks is not level with, and the reason
    this tier sat at 4 - it is below the Opus and Fable tiers, which sit at 5 - survives the move to the
    newer release intact. The evidence for a 5 would have to be the vendor placing Sonnet at or above its own
    flagship, and the vendor does the opposite. Two limitations worth keeping. Sonnet 4.6''s headline 79.6%
    on SWE-bench Verified is in a client-rendered chart a plain fetch cannot read back, and the Sonnet 5 post
    publishes no SWE-bench figure in its fetchable body at all (only OSWorld-Verified 78.5%, 46.8% and 34.6%
    appear as plain text), so basis_detail names the benchmark the judgment tracks rather than a number this
    fetch re-derived. And SWE-bench Verified''s public leaderboard has had no submissions since 2025-12-15,
    so recent figures are vendor-reported either way. Confidence stays medium for both reasons.'
  last_verified: '2026-08-14'
  sources:
  - url: https://www.anthropic.com/news/claude-sonnet-5
    shows: 'the tier''s governing release - "Sonnet 5 narrows the gap: its performance is close to that of
