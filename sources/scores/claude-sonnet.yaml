capability:
  score: 4
  basis: benchmark
  basis_detail: SWE-bench Verified
  value: null
  confidence: medium
  note: Sonnet 4.6 posts 79.6% on SWE-bench Verified, strong for a mid-tier model but below the Opus and
    Fable tiers, which is why this sits at 4 rather than 5. Confidence is medium because SWE-bench Verified's
    public leaderboard has had no submissions since 2025-12-15, so recent figures are vendor-reported. Re-read
    2026-08-13, with one limitation worth recording - the headline 79.6% sits in a chart the launch page
    renders client-side, so a plain fetch cannot read it back. What the fetched text does carry is the
    SWE-bench Verified footnote, "Our score was averaged over 10 trials. With a prompt modification, we saw
    a score of 80.2%", which puts Sonnet 4.6 in the high seventies to eighty on that benchmark and is
    consistent with the recorded figure. The chart figure is flagged as not re-derivable from a fetch.

    The larger finding is that the axis is a release behind. The tier now ships Claude Sonnet 5 (2026-06-30),
    whose launch post says "its performance is close to that of Opus 4.8" and describes a substantial
    improvement over Sonnet 4.6 on reasoning, tool use, coding and knowledge work. identity.md takes the
    MAX across a tier's releases, and claude-opus sits at 5, so the reason given for holding this tier at
    4 - that it is below the Opus tier - no longer reads the same way. ESCALATED rather than changed, and
    no last_verified is claimed on this axis.
