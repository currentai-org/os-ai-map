      4.8 is described as "a more generally capable model, for reference"; Sonnet 5 is "approaching Opus
      4.8''s capability levels" and outperforms it "on some tasks". OSWorld-Verified figures of 78.5%, 46.8%
      and 34.6% are the only benchmark numbers in the fetchable body; no SWE-bench figure appears.'
