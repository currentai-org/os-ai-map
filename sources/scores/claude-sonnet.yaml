  note: 'Anthropic frames Sonnet 5, released 2026-06-30, as close to Opus 4.8''s capability level and ahead
    of it only on some tasks, which is why the tier sits a step below Opus and Fable rather than even with
    them. Neither Sonnet 5 nor the prior Sonnet 4.6 publishes a readable SWE-bench Verified figure: Sonnet
    4.6''s roughly 80% headline sits only in a chart, and Sonnet 5''s page gives OSWorld-Verified figures
    instead, so the score reads from the vendor''s own comparative framing rather than a stated benchmark
    result.'
  last_verified: '2026-08-14'
  sources:
