capability:
  score: 4
  basis: benchmark
  basis_detail: SWE-bench Verified
  value: null
  confidence: medium
  note: 'A tier is scored on its strongest release, and the governing release here is Claude Sonnet 5 (released
    2026-06-30). The band is 4, and Anthropic''s own framing is why. The launch post says "Sonnet 5 narrows
    the gap - its performance is close to that of Opus 4.8, but at lower prices", calls Opus 4.8 "a more
    generally capable model, for reference", and describes Sonnet 5 as "approaching Opus 4.8''s capability
    levels" while outperforming it only "on some tasks". Close to, approaching, and better on some tasks
    is not level with: this tier sits below the Opus and Fable tiers, which sit at 5. The evidence for a
    5 would have to be the vendor placing Sonnet at or above its own flagship, and the vendor does the opposite.
    Two limitations are worth keeping. Sonnet 4.6''s headline 79.6% on SWE-bench Verified sits in a chart
    that renders in the browser and cannot be read back from the page, and the Sonnet 5 post publishes no
    SWE-bench figure in its readable text at all - only OSWorld-Verified 78.5%, 46.8% and 34.6% appear as
    plain text - so the benchmark named here is the one the judgment tracks rather than a number the page
    states. And SWE-bench Verified''s public leaderboard has had no submissions since 2025-12-15, so recent
    figures are vendor-reported either way. Confidence stays medium for both reasons.'
  last_verified: '2026-08-14'
  sources:
  - url: https://www.anthropic.com/news/claude-sonnet-5
    shows: 'the tier''s governing release - "Sonnet 5 narrows the gap: its performance is close to that of
      Opus 4.8, but at lower prices. It''s a substantial improvement over its predecessor, Sonnet 4.6, on
