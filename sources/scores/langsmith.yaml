adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  note: LangSmith is the default observability platform for the LangChain ecosystem, and the vendor names
    an enterprise roster including Klarna, Lyft and Coinbase, but publishes no user, customer or download
    count. The langsmith PyPI package is excluded because it is a hard dependency of langchain-core, so
    its downloads measure LangChain installs rather than LangSmith use.
  last_verified: '2026-08-14'
  sources:
