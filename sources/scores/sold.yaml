capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Sinhala offensive language data
  value: SOLD holds 10,000 hand-labeled Sinhala tweets plus 145,000 model-labeled ones for offensive language
    detection, documented in a journal paper, with no use found beyond that paper's experiments.
  confidence: medium
  note: SOLD is a documented, hand-labeled set for a single task in one language, offensive language in Sinhala
    tweets. Nothing outside its paper builds on it, whereas AfroBench, for African languages, gathers 22 datasets
    into a suite with a public leaderboard.
  relative_to: afrobench
