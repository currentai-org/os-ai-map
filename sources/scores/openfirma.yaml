capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: PASETO capability tokens signed by the authority and naming the agent_id, verified by the sidecar; every
    outbound call classified and checked against Cedar policy before it goes out; local-execution governance tokens
    that a person approves or revokes; ECDSA-signed audit events with a hash-chain provenance anchor; no delegation
    of narrowed authority between agents
  confidence: medium
  note: OpenFirma gives each agent a signed capability token, checks every outbound call against policy before it
    runs, lets a person approve local execution, and signs every decision it records. Its authority grants each
    agent a policy-narrowed set of actions, but there is no chain for one agent to hand narrower authority to another.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/Firma-AI/openfirma/main/README.md
    shows: The README says the sidecar "validates the capability token, and checks the policy" on every outbound
      call, lists "firma token approve" for "local-execution governance tokens (HITL)", and says "every decision
      emits a signed execution event".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 19538e0fde3ce70fe191ba6d55a9c78bc5490556e989ca3ab482e0d375213502
  - url: https://firma-ai.github.io/openfirma/concepts/capabilities/
    shows: Capabilities are "PASETO v4 tokens that prove an agent was authorized"; the claims carry agent_id, the
      token is signed by the Authority and verified by the Sidecar, and issuance grants the subset of requested
      action classes that policy allows.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 80f1ea83af485673197f537a1417ccdc6bdae7f754cddb98d0086cb5c682b95e
  - url: https://firma-ai.github.io/openfirma/guides/audit-log/
    shows: The audit guide says "The audit signature is your tamper-evidence" and describes a provenance field that
      hashes the previous record into a tamper-evident chain.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 22c548472780fc5c1b50bd8e6ca14141e98924a6007ac0540e54a637ec0869fa
