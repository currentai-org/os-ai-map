capability:
  score: 4
  basis: feature_matrix
  value: ready-to-run on-device pretrained models for face detection and landmarks, hand and pose landmarks,
    gesture recognition, holistic tracking, interactive segmentation, image classification, embedding
    and segmentation, object detection, audio and text classification and language detection, plus on-device
    LLM inference, with Model Maker retraining for a few tasks
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: MediaPipe is built to be dropped into an app and used as is. Its landmark trackers and its interactive
    segmenter, which cuts out whatever object the user taps, work on any image with no training, which
    is what places it beside Ultralytics. Its object detector and classifier predict fixed benchmark classes,
    and retraining them relies on Model Maker, which Google no longer actively maintains.
  comparison:
    last_attested: '2026-09-27'
    sources:
    - url: https://ungh.cc/repos/ultralytics/ultralytics/files/main
      shows: Ultralytics tree at main still includes ultralytics/models/yolo/world/, ultralytics/models/yolo/yoloe/,
        yolo/pose/ and the sam modules - the models it runs on the user's own images without training.
      accessed: '2026-09-27'
      http_status: 200
      content_sha256: 515ea140939093404cf46845caefec209e7a5ff7ccfe4fe8a008a39c5b4c1d1a
