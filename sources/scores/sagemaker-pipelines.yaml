  value: typed ML steps - training, processing, tuning, model registration - as first-class pipeline elements;
    instance type chosen per step and provisioned by the service; visual editor, SDK, API and JSON authoring
  confidence: medium
  note: SageMaker Pipelines treats training and tuning steps as first-class types that it schedules and
