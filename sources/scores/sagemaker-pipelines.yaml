  value: typed ML steps - training, processing, tuning, model registration - as first-class
    pipeline elements; instance type chosen per step and provisioned by the service;
    visual editor, SDK, API and JSON authoring
  confidence: medium
  note: 'Admitted on the ML-job-model limb: training and tuning steps are first-class
    types it schedules and tracks. Band 4 rather than 3 because Pipelines chooses
