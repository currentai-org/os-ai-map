  score: 3
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: Unreal Engine 5 driving simulation with configurable sensor suites and environmental conditions, open urban
    maps and vehicles, Python API over every actor; one simulated world per server, no GPU-batched parallel environments.
  confidence: low
  note: CARLA renders a full city on a game engine, with configurable sensors under changing weather and light,
    which is what testing a driving stack needs. Each server runs a single world, so it has none of the parallel
    throughput of MuJoCo's or Isaac Lab's GPU builds.
  relative_to: mujoco
