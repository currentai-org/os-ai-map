capability:
  score: 3
  basis: feature_matrix
  basis_detail: feature coverage (cross-platform least-privilege agent sandboxing)
  value: Least-privilege agent sandboxing across macOS / Linux / Windows with near-zero startup, FFI bindings
    for Rust / Python / TypeScript / Go, and an agent registry. Lighter-weight than the microVM-based sandboxes
    (E2B, Firecracker), with no daemon, container or VM to set up.
  confidence: medium
  note: nono enforces least-privilege sandboxing through OS-level kernel allow-lists across Linux, macOS
    and Windows, giving each tool its own child sandbox with credential proxying, an audit log and signed
    provenance. Because the mechanism is an allow-list rather than a virtual machine, its isolation is lighter
    than the microVM-based sandboxes above it, though setup is close to instant.
  last_verified: '2026-09-29'
  sources:
  - url: https://nono.sh
    shows: Homepage lists "Kernel isolation for Linux, macOS" and Windows and states "Security-relevant
      events are hash-chained into an audit record sealed with a SHA-256 Merkle root, and the sandbox is
      destroyed when the invocation exits."
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: ab5242baa17ec930ab4098ab71f0c09409be9dcbcfd8198ca24fbe41b3d6801f
