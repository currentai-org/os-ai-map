capability:
  score: 3
  basis: feature_matrix
  basis_detail: feature coverage (cross-platform least-privilege agent sandboxing)
  value: Least-privilege agent sandboxing across macOS / Linux / Windows with near-zero startup, FFI bindings
    for Rust / Python / TypeScript / Go, and an agent registry. Lighter-weight than the microVM-based sandboxes
    (E2B, Firecracker) but with the widest local-platform coverage and lowest setup friction.
  confidence: medium
  note: 'Solid, cross-platform sandbox with very low setup friction; scored mid-range for the category --
    below the heavier microVM / OS-isolation options on hard isolation depth, but broad and easy to adopt
    locally. The mechanism is OS-level allow-lists rather than a virtual machine - the README says no daemon,
    no container, no VM and no disk space usage - which is what holds this below the microVM peers. nono.sh
    leads on kernel-level isolation for Linux, macOS and Windows with zero setup and zero latency, and lists
    per-language sandboxes for Python, Node.js and Go. The feature surface has widened since the band was
    set, with brokered per-tool child sandboxes, credential proxying with L7 endpoint policy, hash-chained
    audit records under a SHA-256 Merkle root, rollback and Sigstore provenance: real depth in a different
    direction from hard isolation, recorded here rather than treated as a reason to move the score.'
  last_verified: '2026-08-13'
  sources:
  - url: https://nono.sh
    shows: 'Kernel isolation for Linux, macOS and Windows; ephemeral micro sandboxes with zero setup and
      zero latency; per-language OS/Python/Node.js/Go sandboxes; brokered tool execution with scoped
      credentials and L7 endpoint policy; hash-chained audit log sealed with a SHA-256 Merkle root;
      undo/rollback snapshots; Sigstore provenance; registry linked'
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: adfa836384380e3230dd2c78b2efebc4226ea759ca39134d809a514210b4d542
  - url: https://raw.githubusercontent.com/nolabs-ai/nono/main/README.md
    shows: '"no daemon, no container, no VM, and no disk space usage" with a least-privilege sandbox
      enforced out of the box on macOS, Linux and Windows (WSL2); FFI bindings for Rust, Python,
      TypeScript and Go; profiles pulled from the nono registry and composable as JSON'
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 040dc4d074176f2aa875923f07e90b15a2c66748a8f293b8acb00018b8b5c8e2
