capability:
  score: 3
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: registered researchers submit projects that content editors accept, return or reject; published versions
    are fixed and updates are published as new versions; open, registered and credentialed access tiers; files fetched
    by versioned path with wget or from an S3 bucket
  confidence: medium
  relative_to: dryad
  relation: at
  note: Researchers submit a project and PhysioNet's editors decide whether it is published, after which that version
    is fixed and fetched by a versioned path over the web or from S3. Like Dryad, an editor admits each dataset,
    and the platform does not parse the files.
  last_verified: '2026-10-07'
