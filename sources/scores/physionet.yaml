capability:
  score: 3
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: registered researchers submit projects through the website, and content editors accept, return
    or reject them; there is no programmatic publishing interface; each published version is fixed and carries
    its own DOI, and updates are published as new versions; a public API lists every published version with
    its version DOI, license, resource type, access policy and topics; the LightWAVE server parses waveform
    records and returns signal descriptions and samples as JSON; open, registered and credentialed access
    tiers; files fetched by versioned path with wget or from an S3 bucket
  confidence: medium
  relative_to: dryad
  relation: one_below
  note: PhysioNet's servers read its waveform records and serve the signals back as JSON, and its API describes
    every published version with a DOI, license and access policy. Projects can only be submitted through
    the website, and with no interface for publishing programmatically it sits below Dryad and Zenodo even
    though it does more with the files than either.
  last_verified: '2026-10-07'
  sources:
  - url: https://physionet.org/about/publish/
    shows: '"submit the project to the editorial team for review"; decisions "Accept", "Resubmit" or "Reject";
      "When a project is published, its content is fixed and cannot be changed."'
