    shows: 'The README''s feature list: "Authentication built in, using your existing FastAPI dependencies",
      "Preserving schemas of your request models and response models", "Flexible deployment - Mount your MCP
      server to the same app, or deploy separately", "ASGI transport - Uses FastAPI''s ASGI interface directly".
