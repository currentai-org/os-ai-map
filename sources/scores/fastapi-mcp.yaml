capability:
  score: 1
  basis: feature_matrix
  value: 'of the Model Context Protocol, version not stated by the product: the SERVER role only, the TOOLS
    primitive only - endpoints become tools, and no resources or prompts are exposed - over FastAPI''s own
    ASGI transport'
  confidence: medium
  relative_to: mcp-inspector
  relation: two_below
  note: 'One role and one primitive, which is band 1 on this ladder. That reads harshly against 12,000 stars
    and it is what the ladder measures: spec coverage, not usefulness. Converting an existing API into tools
    is the product''s whole job and it does that well - the README''s own feature list is authentication, schema
    preservation and zero configuration, none of which is protocol surface. Banded two below mcp-inspector,
    which implements one role across the full primitive set. The README names no specification version, which
    matters less here than elsewhere: one role and one primitive is band 1 under any version of the spec.'
  last_verified: '2026-09-17'
  sources:
