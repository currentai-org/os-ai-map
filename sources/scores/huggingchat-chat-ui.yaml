adoption:
  level: 3
  signal_type: reported_traction
  confidence: medium
  banded_quantity: lifetime users of the hosted product (1M+), a vendor statement at one remove
  note: 'Hosted HuggingChat served over 1M users and over 100k assistants across its lifetime before it
    was sunset, and has since relaunched as HuggingChat Omni, live again at hf.co/chat with 132 open models
    in the picker. The chat-ui repository itself is a modest 10,885 stars and 1,659 forks, the self-host
    base being niche. Level 3 rests on the disclosed lifetime user reach of the hosted product, and the
    discontinuity and relaunch lower confidence. That figure is a vendor statement at one remove rather
    than a first-party page: neither the sunset article nor the primary sunset announcement carries a user
    count, and the number traces to Victor Mustar, Hugging Face''s Head of Product, on X - "HuggingChat
    has supported over 20 open-source models ... helped more than 1 million users, and powered over 100,000
    assistants" - relayed by trade press. It is still the only reach figure anyone has published for the
    hosted product.'
  last_verified: '2026-08-14'
  sources:
