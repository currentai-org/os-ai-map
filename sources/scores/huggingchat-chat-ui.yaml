  basis: feature_matrix
  relative_to: open-webui
  relation: one_below
  value: model breadth (115-123 open models via 15 inference providers, Omni smart-router on Arch-Router-1.5B);
    multimodal input; MCP tools; OpenAI-compatible API; multi-user (hosted). Current branch removed legacy
    provider-specific integrations and GGUF discovery
  confidence: medium
  note: Good model breadth, smart routing and MCP support, but the rebuilt v0.10 deliberately stripped the
    RAG and provider integrations present in the legacy branch, so the self-host feature surface is leaner
    than Open WebUI or LibreChat. Mid-tier for the category, one step below Open WebUI. The model picker
    now offers 132 open models.
