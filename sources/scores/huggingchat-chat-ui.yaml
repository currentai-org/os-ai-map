capability:
  score: 3
  basis: feature_matrix
  relative_to: open-webui
  relation: one_below
  value: model breadth (many models on hosted HuggingChat; any OpenAI-compatible endpoint when self-hosted,
    such as Hugging Face Inference Providers, Ollama, llama.cpp or OpenRouter); Omni router that picks a
    route by image input or active MCP tools; multimodal image input; MCP tools; voice transcription; optional
    OpenID login
  confidence: medium
  note: HuggingChat pairs broad model access, route-based model selection and MCP tool calling, but the
    self-host build has no document retrieval and connects to models only through OpenAI-compatible endpoints,
    a leaner feature surface than Open WebUI or LibreChat. That places it one step below Open WebUI in this
    category.
  last_verified: '2026-09-29'
