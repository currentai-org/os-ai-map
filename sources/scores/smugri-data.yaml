capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for Finno-Ugric pretraining text
  value: SMUGRI data holds 129,863 short news rows in seven Finno-Ugric languages, about 19 MB in memory (about
    5 million tokens, estimated; no word or token count is stated), behind a short card that cites a machine
    translation paper, and no model on Hugging Face declares it as training data.
  confidence: medium
  note: SMUGRI data gives Finno-Ugric languages such as Komi, Udmurt and Erzya a news collection with a short
    card, documented only through the machine translation paper it supports, and no model on Hugging Face declares
    it as training data. As a collection spread over several languages it is judged against English-scale corpora,
    and its few million tokens of news sit at the bottom of that scale.
  last_verified: '2026-11-12'
