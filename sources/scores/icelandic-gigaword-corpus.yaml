capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Icelandic pretraining text
  value: The Icelandic Gigaword Corpus holds about 2.4 billion running words of tagged and lemmatized Icelandic
    text written by people, about 1.46 billion of it in the open release, documented on a detailed homepage
    and card, with the IceBERT-IGC model trained on it in a published paper.
  confidence: medium
  note: The IGC is the largest documented corpus of Icelandic, built from news, parliament, law, books and
    more, and the IceBERT paper trains a model on it alone, while Icelandic Dynaword repackages its open parts.
    Its billion and a half words are far below English corpora of trillions of tokens, but it is judged against
    what Icelandic has, an official language with under a million speakers and a small written web, and on
    that scale it is large.
  last_verified: '2026-11-11'
