capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Icelandic pretraining text
  value: The Icelandic Gigaword Corpus holds about 2.4 billion running words of tagged and lemmatized Icelandic
    text written by people, about 1.46 billion of it in the open release, documented on a detailed homepage
    and card, with one community model listed as trained on it.
  confidence: medium
  note: The IGC is the largest documented corpus of Icelandic, built from news, parliament, law, books and
    more and released in yearly versions, and Icelandic Dynaword repackages its open parts. It plays the role
    for Icelandic that Danish Dynaword plays for Danish, but the only model on Hugging Face that lists it as
    training data is a community release, and a third of its text is outside the open release.
  relative_to: danish-dynaword
  relation: one_below
  last_verified: '2026-09-24'
  sources:
