capability:
  score: 2
  basis: feature_matrix
  value: Qualcomm-only publishing (internal legal approval); CLI and Python API to browse the catalog and fetch
    deployable assets by model, runtime and precision; versions through package releases; per-model pages with
    licenses; no third-party upload and no deployment service in this entry
  confidence: high
  relative_to: nvidia-ngc-catalog
  relation: at
  note: Like the NGC catalog, it hosts ready-to-run assets and serves them by name, with a CLI and API to browse
    and fetch them. Only Qualcomm publishes, and new models need internal legal approval, so it is an operator's
    own collection rather than an open registry.
