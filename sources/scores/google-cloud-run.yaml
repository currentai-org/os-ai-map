adoption:
  level: 5
  reach: '>10M'
  signal_type: usage_volume
  confidence: high
  note: Google’s own Next '26 announcement states that external active developers and apps on Cloud Run
    doubled year over year, and that Cloud Run added more new customers and apps in 2025 than in its first
    six years combined; a Replit VP is quoted there saying Replit hosts more than 1M live projects with
    Cloud Run as the primary target. Hyperscaler serverless reach is well into the >10M band. Cloud Run
    publishes no countable artifact - no package or registry entry - so the band rests on those vendor claims
    rather than on a recomputable count.
  last_verified: '2026-08-13'
  sources:
