capability:
  score: 4
  basis: feature_matrix
  value: 'isolation: container in a gVisor or Linux microVM execution environment (sandboxes for untrusted
    or AI-generated code in Preview); cold-start: scale-to-zero, GPU instances start in 5 seconds; language/runtime
    breadth: any OCI container (very broad); persistence: stateless request model + volume mounts, plus
    Preview long-running instances; scale: autoscaling from zero on a hyperscaler'
  confidence: medium
  note: Cloud Run runs any container image at hyperscaler scale, with scale to zero and GPU instances, and
    isolates it in either a gVisor-based or a Linux microVM-based execution environment. Its sandbox mode
    for untrusted or AI-generated code and its long-running instances for background agents are both still
    in preview, and independent ComputeSDK benchmarks place its start-up speed mid-field among sandbox providers.
  last_verified: '2026-09-29'
