capability:
  score: 4
  basis: feature_matrix
  value: 'isolation: container + gVisor syscall sandbox (now a dedicated `sandbox` agent tool for AI-generated
    code); cold-start: scale-to-zero with sub-second to low-second starts; language/runtime breadth: any
    OCI container (very broad); persistence: stateless request model + volume mounts; scale: 0 to thousands
    of instances autoscaling on a hyperscaler'
  confidence: medium
  note: Cloud Run runs any OCI container at hyperscaler scale, and Google has previewed both a built-in
    `sandbox` tool for running AI-generated code and long-running Cloud Run Instances for background agents.
    Its isolation is gVisor at the process and syscall level rather than a full microVM, and independent
    benchmarks measure a sub-second cold start that trails the fastest microVM-based sandboxes.
  last_verified: '2026-08-13'
