capability:
  score: 5
  basis: feature_matrix
  value: 'more than six hundred integrations reached by direct function calling or a unified MCP server, with
    built-in multi-tenant OAuth flows and secrets management: the caller addresses a linked account by an owner
    id rather than by holding the end user''s credential'
  confidence: medium
  relative_to: composio
  relation: at
  note: 'ACI''s multi-tenant authentication runs entirely in its own portal: the caller addresses a linked
    account by an owner id rather than a stored end-user token, and its own API key is the only secret the
    caller ever handles. That places it level with Composio, the other platform built the same way around
    managed OAuth and secrets.'
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/aipotheosis-labs/aci/main/README.md
    shows: 'The README: "Instead of writing separate OAuth flows and API clients for Google Calendar, Slack,
      and more, use ACI.dev to manage authentication and provide AI agents with unified, secure function calls",
      with "Multi-tenant Authentication: Built-in OAuth flows and secrets management for both developers and
      end-users" and "600+ Pre-built Integrations".'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: 335ac01919926bcee1be823fc0378ad4f56a927a72804ef92ade31cb7c167354
