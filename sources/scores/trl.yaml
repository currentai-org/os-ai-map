    content_sha256: 026f0a7f33de94ff5f056531cb6c2f35c1d6c2723c330e9e9c0ad5b25cc60bd5
  - url: https://huggingface.co/docs/trl/distributing_training
    shows: The guide says "The trainers in TRL are launched with" torchrun, scales to multiple nodes with
