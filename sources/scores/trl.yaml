capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: SFT, DPO (IPO via loss_type), KTO, GRPO, RLOO, reward modeling and distillation as stable
    trainers; PPO, ORPO, CPO, online DPO and GKD experimental; scale-out via torchrun, including multi-node,
    with DDP, DeepSpeed ZeRO and FSDP (Accelerate under the hood); PEFT LoRA/QLoRA; mixed precision bf16/fp16;
    no tensor or pipeline parallelism documented.'
  confidence: high
  note: TRL's stable trainers cover supervised fine-tuning, DPO (including the IPO loss), KTO, GRPO, RLOO,
    reward modeling and distillation, while PPO, ORPO, CPO, online DPO and GKD are still experimental. Large
    runs scale out through torchrun with DDP, DeepSpeed ZeRO or FSDP, with Accelerate underneath, and the
    documentation describes no tensor or pipeline parallelism of its own.
  last_verified: '2026-11-16'
  sources:
  - url: https://huggingface.co/docs/trl/index
    shows: The trainer overview, "organized by maturity and method type", lists AsyncGRPOTrainer, GRPOTrainer,
      RLOOTrainer, RewardTrainer, SFTTrainer, DPOTrainer, KTOTrainer and DistillationTrainer ahead of an
      "Experimental" group that holds OnlineDPOTrainer, CPOTrainer, ORPOTrainer and GKDTrainer among others.
      PPOTrainer does not appear.
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: bfd02c9d61a2eb41c85114ee9855b0ab8c589e0089565da851b383b14eaf5ca9
  - url: https://raw.githubusercontent.com/huggingface/trl/main/README.md
    shows: The README says each trainer "natively supports distributed training methods like DDP, DeepSpeed
      ZeRO, and FSDP", that TRL scales "from single GPU to multi-node clusters" through Accelerate, and
      that PEFT integration enables "training on large models with modest hardware via quantization and
      LoRA/QLoRA".
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: 9a788536f5ed9a21646040cc999a00aa79674f716744d1c799d0b20ac65d2301
  - url: https://huggingface.co/docs/trl/dpo_trainer
    shows: The DPO trainer page documents the IPO variant of the loss, noting "TRL exposes this as" its
      loss type ipo.
    accessed: '2026-11-16'
