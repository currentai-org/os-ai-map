capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: SFT, DPO/IPO/KTO/ORPO, PPO, GRPO, reward modeling; parallelism via HF Accelerate (DeepSpeed/FSDP);
    precision BF16/FP8 via Accelerate; broad method coverage but relies on Accelerate for scale rather
    than native frontier-scale parallelism like Megatron-LM (the C5 anchor).'
  confidence: high
  note: 'TRL covers a broad set of post-training methods: supervised fine-tuning, DPO, KTO and ORPO preference
    training, GRPO and other online methods, PPO, and reward modeling. It hands large-scale distributed
    training to Hugging Face Accelerate and DeepSpeed rather than implementing its own parallelism, which
    leaves it a tier behind Megatron-LM.'
  last_verified: '2026-09-28'
  sources:
  - url: https://huggingface.co/docs/trl/index
    shows: 'The stable docs index opens its trainer overview with "Below is an overview of TRL trainers,
      organized by maturity and method type" and lists GRPOTrainer, RLOOTrainer, RewardTrainer, SFTTrainer,
      DPOTrainer, KTOTrainer and DistillationTrainer as stable, with OnlineDPOTrainer, CPOTrainer, ORPOTrainer
      and GKDTrainer under Experimental. Searched the body for PPOTrainer, FP8 and BF16: none.'
    accessed: '2026-09-28'
    http_status: 200
