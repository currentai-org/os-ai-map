capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: user- and project-scoped search over memories and documents; fact extraction from conversations and files;
    updates, extensions and derived facts linked in a memory graph with contradictions resolved; automatic expiry
    of temporary facts; a static and dynamic profile per user beside the fact graph and the document store
  confidence: medium
  note: 'Supermemory performs the whole cycle itself: it extracts facts, links each new one to what it already holds
    so later facts supersede earlier ones, expires time-bound facts on its own, and serves a user profile beside
    the fact graph.'
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/supermemoryai/supermemory/main/README.md
    shows: The README says it "extracts facts, builds user profiles, handles knowledge updates and contradictions,
      forgets expired information", and that temporary facts "expire after the date passes"; memory is scoped by
      container tags.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 1b3e6d9804718bc94c6309e29a870ce6eabe3fedabb2739152ab85910a29b5f9
  - url: https://supermemory.ai/docs/concepts/graph-memory
    shows: The graph memory page describes "a living knowledge graph of facts" in which memories connect through
      updates, extends and derives relations, separate from the documents they came from.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: b2b513df87fd5ffce5c9ef57f64c7c7b50d6763c5b2b69b5ddf94bc0b0c82c41
