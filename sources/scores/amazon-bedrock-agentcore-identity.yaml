capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: agent identities as workload identities with their own ARNs in an agent identity directory, on-behalf-of
    token exchange to scoped-down tokens carrying both user and agent identity, 3LO user consent; no per-action
    policy decision, no human approval of an action, no tamper-evident decision record
  confidence: medium
  note: AgentCore Identity gives each agent an identity of its own and lets it act for a user with a token scoped
    down to one resource and bound to both identities. It decides who may hold which credential, not whether each
    tool call may run; that per-action check is sold separately as AgentCore Policy, and Identity has no approval
    step or signed decision record.
  last_verified: '2026-11-20'
  sources:
  - url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
    shows: '"Amazon Bedrock AgentCore Identity is an identity and credential management service designed specifically
      for AI agents and automated workloads." "Agent identities are implemented as workload identities with specialized
      attributes".'
