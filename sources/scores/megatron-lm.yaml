adoption:
  level: 3
  reach: 100K-1M
  signal_type: usage_volume
  confidence: high
  note: megatron-core records 223,175 PyPI downloads in the trailing 30 days, which puts reach in the 100K-1M
    band. The library is foundational to large-scale training -- Colossal-AI, Hugging Face Accelerate and
    NVIDIA NeMo all build on it or draw directly from it -- and has been used to train models from 2B to
    462B parameters across thousands of GPUs. Its user base is concentrated among large-model training teams,
    a far smaller headcount than inference tools reach, so the band reflects specialist but influential
    use rather than mass adoption.
