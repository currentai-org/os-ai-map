capability:
  score: 5
  basis: feature_matrix
  value: 'Parallelism: DP, TP, PP, CP, EP and Megatron-FSDP, composable; mixed precision FP16/BF16/FP8/FP4;
    weak-scaling benchmark to a 462B-parameter GPT on 6,144 H100 GPUs at 47–48% MFU, strong scaling of a
    ~175B GPT-3 from 96 to 4,608 H100 GPUs.'
  confidence: high
  note: Megatron-LM provides reference-grade infrastructure for large-scale transformer training, composing
    data, tensor, pipeline, context and expert parallelism with mixed precision down to FP8 and FP4. NVIDIA's
    own benchmarks reach 462B parameters across thousands of H100 GPUs, though those results were measured
    without training to convergence.
  sources:
  - url: https://raw.githubusercontent.com/NVIDIA/Megatron-LM/main/README.md
    shows: 'The README describes Megatron Core as providing "transformer building blocks, advanced parallelism
      strategies (TP, PP, DP, EP, and CP), mixed precision support (FP16, BF16, FP8, and FP4)". Under Performance
      Benchmarking: "The codebase efficiently trains models from 2B to 462B parameters across thousands
      of GPUs", and "Successfully benchmarked 462B parameter model training." on 6,144 H100 GPUs; the strong-scaling
      test takes "from 96 H100 GPUs to 4,608 GPUs" on a GPT-3 model of slightly more than 175 billion parameters.'
    accessed: '2026-09-28'
    http_status: 200
    content_sha256: 9da0af3c6ccb7fb9dae98930e369293d5872dce1ca9fc22e506d302a83d5f91f
  - url: https://developer.nvidia.com/megatron-core
    shows: 'NVIDIA product page: "Megatron Core demonstrates superlinear scaling up to 6144 H100 GPUs" on
      GPT models from 2 billion to 462 billion parameters, and "near linear scaling from 96 to 4608 H100
      GPUs" for a 177 billion parameter GPT-3 model. Feature text lists "automatic restart, fault/hang detection"
      resiliency and "FP8 mixed precision and advanced parallelism".'
    accessed: '2026-09-28'
    http_status: 200
    content_sha256: a01d49ee9e7309373a691ecc455e4a92b63f1feb90c63806a882d794e3b066b7
