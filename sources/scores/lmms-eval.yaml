capability:
  score: 4
  basis: feature_matrix
  value: 100+ multimodal tasks across image, video and audio with 30+ model families; standalone HTTP
    eval server (~7.5x throughput over v0.5); agentic task evaluation (generate_until_agentic); statistically
    grounded results (CI, paired t-test); async serving and video I/O optimization
  relative_to: lm-evaluation-harness
  relation: one_below
  confidence: medium
  note: lmms-eval offers the widest multimodal task and model coverage in the category, and lm-evaluation-harness's
    own README recommends it by name for multimodal work. It is scoped to multimodal models rather than
    serving as the cross-domain standardization reference lm-evaluation-harness provides, and it lacks a
    leaderboard-backend role, which places it alongside OpenCompass.
  comparison:
    last_attested: '2026-10-07'
    sources:
    - url: https://raw.githubusercontent.com/EleutherAI/lm-evaluation-harness/main/README.md
      shows: The lm-evaluation-harness README still describes "Over 60 standard academic benchmarks for LLMs,
        with hundreds of subtasks and variants implemented" across HF, vLLM, SGLang and API backends, while
        multimodal support remains a prototype for "text+image multimodal input, text output tasks". lmms-eval
        is the multimodal specialist one step below that broad, standardizing reference.
      accessed: '2026-10-07'
      http_status: 200
      content_sha256: 57c5cf1db6edb20393ca70851de820898bd8d10424a5a7574f9f566a6f8d70bd
