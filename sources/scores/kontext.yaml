capability:
  score: 1
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: Cedar policy evaluated locally on each supported pre-tool-use hook, but denying needs a managed
    policy fetched from the hosted workspace, so the standalone guard only records would-be decisions; an
    authorization ledger of receipts with hash links and optional Ed25519 signatures; actions attributed
    to the agent and session, with no credential issued to the agent; no delegation between agents; no human
    approval step
  confidence: medium
  note: Kontext keeps a hash-linked, optionally signed ledger of the policy decisions it reaches on an agent's
    tool calls. Run on its own, it only records what policy would have blocked, because denying a call needs
    a policy fetched from Kontext's hosted workspace. It gives the agent no identity of its own, and has
    no delegation chain or step where a person approves a held action.
  relative_to: oxdeai
  relation: two_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/kontext-security/kontext/main/README.md
    shows: The README says Kontext "evaluates policy before consequential actions run, and records the decision
      and outcome in an authorization ledger", denying in enforce mode at supported synchronous hooks.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 3e1f401c7425637bdacfbbeaa7f2974f81b8c725849a21dc67eec0e5bee40963
  - url: https://raw.githubusercontent.com/kontext-security/kontext/main/docs/guard.md
    shows: The Guard page says Ed25519 receipt signatures can be enabled with KONTEXT_GUARD_LEDGER_SIGNING=1
      and that VerifyReceipts "checks receipt hashes, previous-hash links, and local Ed25519 signatures".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 1e691f62fc17fc9e7f9d32dc8e005534225b450a0cdbe2875a12fba29f4ef3d8
  - url: https://raw.githubusercontent.com/kontext-security/kontext/main/internal/runtimehost/host.go
    shows: 'Start refuses any mode other than observe without a managed policy source: "enforce and remote
      modes require a managed Cedar policy source".'
