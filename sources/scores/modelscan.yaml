capability:
  score: 3
  basis: feature_matrix
  basis_detail: model-file scanning coverage
  value: Static scanning of serialized model files for unsafe code across Pickle (including cloudpickle, dill and joblib),
    H5, Keras V3 and TensorFlow SavedModel formats, covering PyTorch, TensorFlow, Keras, scikit-learn and XGBoost models,
    with findings ranked CRITICAL, HIGH, MEDIUM or LOW, from a command-line tool.
  relative_to: garak
  relation: one_below
  confidence: medium
  note: ModelScan catches one class of attack, malicious code hidden in a model file, before the model is loaded, across the
    main serialization formats. It does not probe a running model for jailbreaks, leakage or toxic output, which garak does
    across many model providers, so it sits a step below garak.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/NVIDIA/garak/main/README.md
      shows: The peer's README still describes garak as an "LLM vulnerability scanner" that "probes for hallucination, data
        leakage, prompt injection, misinformation, toxicity generation, jailbreaks, and many other weaknesses", combining
        static, dynamic and adaptive probes, and lists Hugging Face, Replicate, OpenAI and AWS Bedrock among the model providers
        it supports.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 640626790dc73543d58857ea0ebc7e47ccdb38cd9dd8fc56467147f7f3a5798e
  last_verified: '2026-11-12'
  sources:
  - url: https://raw.githubusercontent.com/protectai/modelscan/HEAD/README.md
    shows: The README's support table marks Pickle, Protocol Buffer (SavedModel), HD5 and Keras V3 formats as supported for
      PyTorch, TensorFlow, Keras and classic ML libraries "pickle.dump(), dill.dump(), joblib.dump(), cloudpickle.dump()",
      and ranks unsafe code as CRITICAL, HIGH, MEDIUM and LOW.
