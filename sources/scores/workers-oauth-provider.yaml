capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: a client identity for each MCP client through pre-registration, Client ID Metadata Documents or dynamic
    registration, with private_key_jwt client authentication; RFC 8693 token exchange that can only narrow scope
    or lifetime; no per-action decision (scope checks are left to the handler); no approval step beyond the sign-in
    consent page; no signed decision record
  confidence: medium
  note: Workers OAuth Provider gives each MCP client an identity of its own and lets a token be exchanged only for
    one with narrower scopes or a shorter life. Whether a given request or tool call is allowed is left to the developer's
    handler, and the library keeps no signed record of its decisions.
  relative_to: aembit-iam-for-agentic-ai
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/cloudflare/workers-oauth-provider/main/README.md
    shows: 'The handler "owns authorization beyond that: scopes, ownership, tenancy"; "the library advertises the
      required scopes but doesn''t enforce them".'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 7990cb5368714c8f6ad9223c48b66f38634e8d35fae3a0218156c5214d69918b
  - url: https://raw.githubusercontent.com/cloudflare/workers-oauth-provider/main/docs/authorization-server.md
    shows: 'Client registration "defines three ways for a client to obtain a client ID": pre-registration, CIMD
      and DCR; the provider implements none and private_key_jwt for CIMD clients.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 693e4603ac8d3564f63de3d72efff40ee650d6164458cf70eaca0ba584e8769e
  - url: https://raw.githubusercontent.com/cloudflare/workers-oauth-provider/main/docs/advanced-configuration.md
