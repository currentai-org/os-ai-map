capability:
  score: 3
  basis: feature_matrix
  value: 'Model breadth: dozens of remote and local models via plugins; embeddings; prompt templates and
    fragments; structured extraction from text and images; tool execution; SQLite logging of prompts/responses;
    Python API. CLI/library surface, not a full chat UI.'
  confidence: high
  note: Plugins give it access to many remote and local models, and it adds embeddings, tools and structured
    extraction from text and images. It is a developer command-line tool and library rather than a multi-user
    chat interface.
  last_verified: '2026-09-29'
  sources:
