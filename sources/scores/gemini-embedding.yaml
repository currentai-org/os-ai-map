adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  note: 'Google publishes no call-volume figure for Gemini Embedding, so adoption is read from distribution:
    general availability on the Gemini API and Vertex AI, a free tier alongside paid limits, and Google''s
    migration of users off the deprecated embedding-001 and text-embedding-004 models onto this line.'
  last_verified: '2026-11-16'
  sources:
  - url: https://developers.googleblog.com/en/gemini-embedding-available-gemini-api/
    shows: The developers blog post titled "Gemini Embedding now generally available in the Gemini API"
      offers "free and paid tiers", and says "We highly recommend migrating your projects to our newest
      model"; the legacy embedding-001 and text-embedding-004 models are scheduled for deprecation on August
      14, 2025 and January 14, 2026.
