capability:
  score: 4
  basis: feature_matrix
  value: KG extraction; hierarchical community detection; community summarization; Global/Local/DRIFT query modes;
    auto prompt-tuning
  confidence: medium
  note: 'GraphRAG is turnkey for knowledge-graph-based retrieval: it extracts a graph, detects communities,
    generates summaries and supports Global, Local and DRIFT query modes with automatic prompt tuning. No
    benchmark exists for this kind of technique, so it is judged on feature depth, and it is deliberately
    narrower in scope than a general agent like OpenHands, placing it a step below.'
  relative_to: openhands
  relation: one_below
