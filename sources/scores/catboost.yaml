capability:
  score: 2
  basis: feature_matrix
  value: one learner family - gradient-boosted oblivious decision trees with ordered boosting - for classification,
    regression and ranking, with native categorical, text and embedding features, GPU training and export
    to ONNX, CoreML, PMML and several runtimes
  relative_to: xgboost
  relation: at
  confidence: high
  note: CatBoost is one learner, boosted trees, like XGBoost and LightGBM. What sets it apart is how it
    treats categorical and text columns without manual encoding and how many places a trained model can
    be deployed. It does not compare or choose among other kinds of models.
