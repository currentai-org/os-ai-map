capability:
  score: 3
  basis: feature_matrix
  value: 'consumer assistant feature set: single-vendor first-party models (Muse Spark 1.1); multimodal
    (text + image gen); agentic task execution with email and calendar connections and slide generation;
    delivered through the Meta AI app, meta.ai and Meta''s messaging surfaces; consumer single-user (no
    enterprise RAG / multi-provider model hub / org-data grounding)'
  confidence: medium
  note: 'A broad-reach consumer assistant that is nonetheless narrow on the dimensions this category measures:
    one provider, consumer-only, no enterprise or organisational-data depth, so not a category frontier-definer
    on capability. The assistant now runs on Muse Spark 1.1 from Meta Superintelligence Labs rather than
    Llama 4, and it connects to email and calendar apps, generates slides and executes multi-step plans,
    so it is no longer thin on tool breadth. What still does not appear is enterprise or organisational-data
    grounding, or any third-party model choice, and that is what holds the score down.'
  last_verified: '2026-08-14'
  sources:
  - url: https://about.fb.com/news/2026/07/meta-ai-muse-spark-doesnt-just-think-it-acts/
