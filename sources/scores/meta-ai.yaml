adoption:
  level: 5
  reach: '>10M users'
  signal_type: active_users
  confidence: high
  note: 'Mark Zuckerberg stated at the May 2025 shareholder meeting that Meta AI had passed 1B monthly active
    users, and it is reported to have grown to roughly 1.2B by early 2026, with around 63% of interactions
    happening on WhatsApp - far above the >10M threshold. One caveat: a portion of those monthly actives
    reflect surfaced or embedded exposure inside WhatsApp and Instagram rather than deliberate assistant
    use, and at least one analyst (Kantrowitz) argues engaged usage is far lower than OpenAI''s. The count
    therefore belongs to the embedded surface rather than to a standalone assistant.'
  last_verified: '2026-08-13'
