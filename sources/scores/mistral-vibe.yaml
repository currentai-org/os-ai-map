capability:
  score: 4
  basis: feature_matrix
  value: terminal coding agent with read, write, edit, shell, grep and todo tools; subagent delegation through a
    task tool, with a built-in read-only explore subagent; ask, plan, accept-edits and auto-approve profiles for
    tool approval; MCP servers, skills and hooks; interactive, programmatic and Agent Client Protocol editor modes;
    Mistral models by default, with local models or other compatible API keys; sandboxing only through an experimental
    external agent server; no published benchmark result for the agent
  confidence: medium
  note: Mistral Vibe covers a full terminal coding agent with subagents, a read-only planning profile, approval
    controls, MCP and editor use through the Agent Client Protocol. It sits a step below OpenHands, which runs
    agents in a sandboxed runtime and publishes benchmark results, while Vibe runs on the user's machine and has
    no benchmark of its own.
  relative_to: openhands
  relation: one_below
  comparison:
    last_attested: '2026-10-19'
    sources:
