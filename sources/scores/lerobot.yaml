  score: null
  basis: n/a
  basis_detail: not a simulator
  value: 'Real-robot learning framework: teleoperated data collection, a Hub dataset format, training for ACT, Diffusion,
    VQ-BeT, HIL-SERL, TDMPC and VLAs including pi0, SmolVLA and GR00T N1.7, and deployment on arms and humanoids.
    It runs no physics simulation of its own.'
  confidence: medium
  note: 'The software in this category is compared on how fast and how faithfully it simulates robots. LeRobot does
    not simulate at all: it collects data on real hardware, trains policies and runs them back on the robot, so
    it has no place on that comparison and none is claimed.'
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/huggingface/lerobot/main/README.md
    shows: 'README policy table: imitation learning (ACT, Diffusion, VQ-BeT, Multitask DiT), reinforcement learning
      (HIL-SERL, TDMPC), VLAs (Pi0, Pi0Fast, Pi0.5, GR00T N1.7, SmolVLA, XVLA, EO-1, MolmoAct2, WALL-OSS, EVO1);
      "a hardware-agnostic, Python-native interface ... from low-cost arms (SO-100) to humanoids"; no physics-engine
      or simulator claim.'
