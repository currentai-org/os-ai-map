capability:
  score: 2
  basis: feature_matrix
  basis_detail: toxicity classification coverage
  value: Multi-label toxicity scoring (toxicity, severe toxicity, obscenity, threat, insult, identity attack, sexually explicit)
    from three classifiers built on BERT, RoBERTa and XLM-RoBERTa and trained on the 2018-2020 Jigsaw challenges, plus two
    smaller ALBERT variants. The multilingual model covers seven languages. Reported test-set scores are 98.64 (original),
    93.74 (unbiased) and 92.11 AUC (multilingual).
  relative_to: llama-guard
  relation: two_below
  confidence: medium
  note: Detoxify scores one kind of harm, toxic language, under seven labels, and runs on a CPU by default. It does not judge
    prompts or replies against a policy or cover hazards such as violent crime or self-harm, which Llama Guard screens across
    fourteen categories, so it sits two steps below it.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/meta-llama/Llama-Guard-3-8B
      shows: 'The peer''s model page still lists hazard categories from "S1: Violent Crimes" to "S14: Code Interpreter Abuse",
        says Llama Guard 3 classifies "both LLM inputs (prompt classification) and in LLM responses (response classification)",
        "was aligned to safeguard against the MLCommons standardized hazards taxonomy" and "provides content moderation in
        8 languages".'
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 88c4e99105de675650b8a49071b3a13ccdfaa63d9b89b5578a422e02eb2eb7cc
  last_verified: '2026-11-12'
