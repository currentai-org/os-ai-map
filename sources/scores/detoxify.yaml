      models, lists the labels toxicity, severe_toxicity, obscene, threat, insult, identity_attack and sexual_explicit, names
      bert-base-uncased, roberta-base and xlm-roberta-base as the base models, and says the multilingual model covers seven
      languages.
    accessed: '2026-11-12'
