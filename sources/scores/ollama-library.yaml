capability:
  score: 4
  basis: feature_matrix
  value: open push by any registered account to its own namespace (ollama push myuser/mymodel); model:tag versioning;
    pull and push over the runner's API; search and per-model tag lists on ollama.com; models only
  confidence: high
  relative_to: huggingface-hub-platform
  relation: one_below
  note: Anyone who registers a key can push a model to their own namespace, each tag pins a version, and the
    runner pulls by name from the registry's API. It hosts one kind of artifact, packaged models, with no datasets
    or apps and no Git history behind a tag, which keeps it a step below Hugging Face Hub.
  last_verified: '2026-09-27'
