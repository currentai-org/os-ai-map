capability:
  score: 3
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 3 of 5, provisional and count-based: the median corroborated band over its target languages,
    16 of 16 measured, across 1 task. Face value 3; best original band 3.'
  confidence: medium
  note: In every language InjongoIntent targets, its test has four hundred to sixteen hundred requests,
    all written by native speakers in the language. An item count says how much a set can test, not how
    precisely it ranks models.
  last_verified: '2026-11-18'
