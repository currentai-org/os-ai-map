capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Post-hoc watermarks for audio, image and video with released detectors, plus generation-time watermarking
    for text and images; Pixel Seal is the flagship image and video model.
  relative_to: nvtrust
  relation: two_below
  confidence: low
  note: The suite releases its detectors with its embedders, so a third party can test content for a Meta Seal
    mark without Meta. A detection is a statistical signal rather than a signed claim, two steps below NVIDIA's
    hardware attestation.
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/facebookresearch/content-seal/main/README.md
    shows: '"a comprehensive framework for invisible, robust watermarking across all modalities — audio, image,
      video, and text"; "Content Seal Image is deployed at scale for Muse Image with a custom proprietary implementation.
      We also provide open-source versions of our research models"'
