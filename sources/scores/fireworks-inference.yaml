capability:
  score: 4
  basis: benchmark
  basis_detail: ArtificialAnalysis(provider page)
  value: 'Serves 10 models on Artificial Analysis, topping out at 459 output tokens/sec (Nemotron 3.5 Lightning
    BF16), then MiniMax-M2.7 at 206 t/s and DeepSeek V4 Flash at 115 t/s; best time-to-first-token 0.93s
    (Kimi K2.6). AA notes a 448% spread between its fastest and slowest model. That peak sits below the
    wafer/LPU speed frontier on the same site''s gpt-oss-120b board - Cerebras 1,820.3, SambaNova 701.3,
    Groq 475.9 - and around the GPU-class providers, which is what places this at 4 rather than 5. Customer
    case studies: Notion ~2s -> 350ms latency (Sarah Sachs, AI Lead), Quora 3x speedup (Spencer Chan, Product
    Lead).'
  confidence: medium
  note: Top-tier GPU-based inference on Fireworks' FireAttention kernels, sitting just below the wafer-scale
    and LPU speed frontier. The band rests on Artificial Analysis's Fireworks provider page, which carries
    current figures for the ten models Fireworks serves and tops out at 459 output tokens per second. Fireworks
    does not appear on Artificial Analysis's per-model gpt-oss-120b providers board, which says something
    about that board's coverage rather than about the product; that board is still cited because it is what
    establishes where the speed frontier sits, with Cerebras at 1,820.3, SambaNova at 701.3 and Groq at
    475.9 output tokens per second.
