  banded_quantity: named high-volume production customers, not a user count
  note: A strong named-customer roster. Cursor, Vercel, Notion, Sourcegraph, UiPath, Quora, Cresta and StackBlitz
    all appear on the homepage with logos and case studies, and Fireworks serves top open models behind
    a number of high-traffic AI products. The Notion case study quotes AI lead Sarah Sachs on latency falling
    from about 2 seconds to 350 milliseconds, and the Quora one quotes product lead Spencer Chan on a 3x
    speedup in response time. No raw user count is disclosed, so the band rests on the breadth of high-volume
    production customers, which supports the 1M-10M equivalent range.
