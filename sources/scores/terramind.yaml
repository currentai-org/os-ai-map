  score: 4
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Fine-tunable; six input modalities; any-to-any generation; pixel- and token-level processing of
    inputs that are all co-registered on one 10 m grid.
  confidence: high
  note: TerraMind's model card documents configuration-driven fine-tuning through TerraTorch, six raw input
    modalities and any-to-any generation. Its dual-scale encoder-decoder processes pixel- and token-level
    data together, but those are two internal views of inputs that are all co-registered on one 10-meter
    grid, and the paper names multi-resolution input as future work, so it is not counted as working across
    scales.
  last_verified: '2026-11-16'
  sources:
  - url: https://huggingface.co/ibm-esa-geospatial/TerraMind-1.0-large/raw/main/README.md
    shows: Model card states "You can fine-tune TerraMind with a config using TerraTorch", lists raw inputs
      "S2L2A, S2L1C, S1GRD, S1RTC, DEM, RGB", states "TerraMind can perform any-to-any generation based
      on varying combinations of inputs.", and describes an architecture "simultaneously processing pixel-level
      and token-level data".
