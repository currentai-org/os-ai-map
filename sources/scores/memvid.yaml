capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: lexical, vector and time-filtered search over a memory file; memory-card extraction by rule, local-model
    or hosted-LLM engines; fact versions that update or retract earlier values, with the current state per entity;
    typed memory cards beside an entity-relation graph and the source frames; no time-based forgetting
  confidence: medium
  note: 'Memvid extracts entity facts from stored content, records when a new value replaces an older one, and keeps
    those facts as typed cards beside an entity graph and the original documents. It does not retire or expire memories
    on its own: old frames stay in the file until someone deletes them.'
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/memvid/memvid/main/README.md
    shows: The README describes "a single-file memory layer for AI agents with instant retrieval and long-term memory",
      with BM25 full-text search, HNSW vector search and a time index inside one .mv2 file.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 3a2f6a0fea87ed03b4b5a21de90a166ed005627c897a26807c33cd2fd854ce77
  - url: https://docs.memvid.com/concepts/memory-cards.md
    shows: Enrichment extracts entity-slot-value memory cards of kinds fact, preference, event, profile, relationship
      and goal, using rules, a local Phi-3.5-mini model or hosted LLMs; fact history marks later values "UPDATES
      previous" and state returns the current value.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 07563589ec3c69e14a42f28884107612da4fe3c0b41d37854bd1f42c55a88d9c
  - url: https://docs.memvid.com/introduction/the-memvid-approach
    shows: Each file carries lexical, vector, SimHash, time and Logic Mesh indexes, the last an entity-relationship
      triple store queried with memvid follow traverse.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 96bff93c64206ade31d2b28454363180a326fcec90ab9e43fe0af05a64f4313b
  - url: https://docs.memvid.com/cli/index
    shows: The CLI reference groups commands into creation, data, search (find, ask, vec-search, timeline), enrichment
      (enrich, memories, state, facts), maintenance and sessions; deletion is a delete command the user runs.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 6d2e299d5d0a2d2454656ee940d8bfcd3516f81a7812e1978c7073adcace3166
