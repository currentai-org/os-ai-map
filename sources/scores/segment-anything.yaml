      detail: SAM 3 and SAM 3.1 checkpoints on the Hub behind a manual access request
    data:
      value: documented-not-released
      detail: the SA-Co training data from Meta's data engine is described; only its evaluation benchmarks
        are released
    code:
      value: partial
      detail: inference and fine-tuning code; no pretraining pipeline
    license:
    - name: SAM-License
      detail: code and weights; commercial use allowed, with trade-control and military-use exclusions
  confidence: medium
  note: SAM 3 and SAM 3.1 come under Meta's SAM License, which permits commercial use but bars military,
    weapons and trade-controlled uses and lets Meta change the terms, and the checkpoints need an approved
    access request. Meta publishes fine-tuning code and evaluation benchmarks but not the training data
    or pretraining code. SAM and SAM 2 were Apache-2.0, but the current release governs. The SAM License
    caps neither who may use the model nor at what scale, so its tier is permissive_non_osi.
  raw: weights:open(SAM 3 and SAM 3.1 checkpoints on the Hub behind a manual access request);data:documented-not-released(the
