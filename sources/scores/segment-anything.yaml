capability:
  score: 4
  basis: feature_matrix
  value: promptable segmentation and tracking in images and video from text phrases, image exemplars,
    points, boxes and masks, segmenting every instance of an open-vocabulary concept with no training,
    plus fine-tuning code
  relative_to: ultralytics
  relation: at
  confidence: high
  note: SAM 3 segments whatever the user names or points at in their own images and video with no training,
    the same no-training capability that places Ultralytics here. Ultralytics sits here partly because
    it bundles SAM 3; the model line itself does one family of tasks, segmentation and tracking, where
    Ultralytics spans many.
  comparison:
    last_attested: '2026-09-27'
    sources:
    - url: https://ungh.cc/repos/ultralytics/ultralytics/files/main
      shows: Ultralytics tree at main still includes ultralytics/models/yolo/world/, ultralytics/models/yolo/yoloe/
        and the sam modules with sam3 builders - the models it runs on user-named labels without training.
