capability:
  score: 5
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: free deposit for researchers worldwide; datasets versioned under DOIs; native API for deposit, search and
    download; Stata, SPSS, R, Excel, CSV and TSV files ingested as tabular data with variable metadata and tab-delimited
    downloads; metadata exported as Croissant, Dublin Core, DDI, DataCite and Schema.org JSON-LD
  confidence: medium
  relative_to: openml
  relation: at
  note: Researchers anywhere can deposit data for free, and each dataset is versioned under a DOI that the API serves
    for download. Tabular files are ingested into a standard form with variable-level metadata and can be described
    in Croissant for machine learning tools, which puts it beside OpenML rather than Zenodo.
  last_verified: '2026-10-07'
