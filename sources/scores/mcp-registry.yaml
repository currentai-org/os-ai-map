  signal_type: stars_fallback
  confidence: low
  note: '7,258 GitHub stars, which the stars scale bands at level 2 - the >10K rung starts above 10,000. The
    registry is a hosted service with no published request or listing count and no package anyone installs,
    so stars are the only countable signal, and they cap at 3 by policy in any case. The figure understates
    the product: what matters about a registry is how many clients read it, and nobody publishes that.'
