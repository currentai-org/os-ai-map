capability:
  score: null
  basis: n/a
  value: null
  confidence: medium
  note: 'ABSTAINS, and for a different reason from the three specifications. This ladder measures how much
    of the client-server contract a product implements - role, primitives, transports - and a registry implements
    none of it: it is the protocol''s discovery service, listing servers rather than speaking to them. Banding
    it would mean inventing a second quantity inside a category created to hold one. It sits here because it
    is infrastructure the protocol itself defines and governs, and the category note says so.'
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/modelcontextprotocol/registry/main/README.md
    shows: 'The README: "The MCP registry provides MCP clients with a list of MCP servers, like an app store
      for MCP servers", with a publishing flow and a live API. Nothing in it implements the client or server
      role of the tool-calling protocol.'
