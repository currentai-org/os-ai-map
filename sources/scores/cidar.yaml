capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for Arabic instruction data
  value: CIDAR holds 10,000 Arabic instruction pairs, about 9,100 of them machine-translated with ChatGPT from
    Alpagasus and the rest native grammar questions, all reviewed by people, documented in an ACL Findings
    paper, with small community fine-tunes listed as trained on it.
  confidence: medium
  note: CIDAR is documented and every pair was reviewed by people for cultural fit, but most of it began as
    machine translation from English. Only small community fine-tunes use it, whereas WangchanThaiInstruct
    was written in Thai by people from the start.
  relative_to: wangchan-thai-instruct
  relation: two_below
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2402.03177
    shows: 'Abstract: "the first open Arabic instruction-tuning dataset culturally-aligned by human reviewers.
      CIDAR contains 10,000 instruction and output pairs".'
    accessed: '2026-09-24'
    http_status: 200
    content_sha256: a7009bbc131d4a80bc811cc9b60056da3de7456a1f759ee677222b3ccf5bccc8
