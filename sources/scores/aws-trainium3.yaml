  value: 2,517 TFLOPS dense MXFP8/MXFP4, 671 TFLOPS BF16, 144 GiB HBM at 4.9 TB/s per device
  confidence: high
  relative_to: nvidia-blackwell
  relation: one_below
  note: Each Trainium3 device delivers about 2.5 PFLOPS of dense MXFP8 with 144 GiB of HBM, half of Blackwell Ultra's
    dense FP8 throughput with about half its memory. AWS compensates at the system level, joining up to 144 devices
    in one UltraServer.
