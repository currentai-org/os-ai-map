capability:
  score: 3
  basis: benchmark
  basis_detail: MTEB v1 English, average over 56 datasets
  value: 64.68 average over the 56 MTEB datasets for mxbai-embed-large-v1, state of the art for BERT-large-sized
    models as of March 2024.
  confidence: high
  relative_to: granite-embedding
  relation: at
  note: mxbai-embed-large-v1 is an earlier-generation, English-only model with a 512-token window, and its
    MTEB v1 average has not been re-run on v2, so it cannot be compared with newer models on the same benchmark.
    It is placed alongside Granite Embedding, a similarly compact bi-encoder that is one generation newer
    and has a context sixteen times longer.
  last_verified: '2026-11-16'
  sources:
