    models as of March 2024.
  confidence: high
  relative_to: granite-embedding
  relation: at
  note: 'mxbai-embed-large-v1 is an earlier-generation model — English-only, a 512-token window — with an
    MTEB v1 average that has never been re-run on v2, so it cannot be measured against newer embedding models
    on the same benchmark. It is scored level with Granite Embedding, the nearest comparable peer: a similarly
    compact bi-encoder, one generation newer, with sixteen times the context.'
