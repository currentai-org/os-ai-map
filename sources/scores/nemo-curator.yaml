capability:
  score: 5
  basis: benchmark
  relative_to: dclm
  relation: at
  value: Nemotron-CC, built with NeMo Curator, has a high-quality subset that improves MMLU by 5.6 points
    over DCLM at 8B parameters and 1T tokens. The full 6.3T-token set matches DCLM on MMLU with four times
    more unique real tokens, and an 8B model trained on 15T tokens beats Llama 3.1 8B by 5 MMLU points.
  confidence: high
  note: NeMo Curator is judged through Nemotron-CC, the corpus built with it, since the toolkit has no benchmark
    of its own. The Nemotron-CC paper reports its high-quality subset improving MMLU over DCLM, which puts
    the toolkit level with DCLM.
  last_verified: '2026-09-29'
  sources:
  - url: https://arxiv.org/abs/2412.02595
    shows: 'Nemotron-CC abstract: "a high-quality subset of our data improves MMLU by 5.6 over DCLM" and
      its full dataset has "four times more unique real tokens than DCLM".'
