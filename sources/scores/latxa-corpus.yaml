capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Basque pretraining text
  value: About 4.2 billion tokens in 4.3 million documents of Basque web and institutional text in its first
    version, documented in an ACL paper and cards for both versions, and used to train every Latxa model from
    the Llama 2 to the Qwen3.5 releases.
  confidence: medium
  note: Latxa Corpus is the pretraining set behind the whole Latxa family of Basque models, from the Llama
    2 releases to the Llama 3.1 and Qwen3.5 versions, and an ACL paper and both dataset cards document its
    sources and sizes. It joins a new Basque web crawl and institutional text with the Basque parts of large
    multilingual web corpora.
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2403.20266
    shows: '"we continue pretraining on a new Basque corpus comprising 4.3M documents and 4.2B tokens"'
