  value: GPU-parallel simulation and GPU-parallel rendered RGB-D and segmentation (30,000+ FPS on a 4090), heterogeneous
    scenes per parallel environment, tasks across humanoids, mobile manipulators and single arms, real2sim evaluation
    environments. GPU simulation on Linux with NVIDIA only.
