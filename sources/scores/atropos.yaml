capability:
  score: 3
  basis: feature_matrix
  value: 'Methods: RL training environments (RLHF/RLAIF, GRPO-style) with async-first microservice design;
    broad environment coverage (dataset eval GSM8K/MMLU, games, code execution, multimodal); OpenAI-compatible
    endpoints; debugging tooling (view-run/process). Trainer-agnostic via Axolotl/Tinker.'
  confidence: medium
  note: 'Atropos ships ready-made environments for dataset evaluation, games, judge-based RLHF and RLAIF,
    multi-turn RL, code execution and multimodal tasks, and it works with any OpenAI-compatible endpoint.
    It stops short of training itself: the trainer and inference engine come from elsewhere, such as Axolotl
    or Tinker, so it enables fine-tuning rather than performing it.'
  last_verified: '2026-09-28'
  sources:
  - url: https://raw.githubusercontent.com/NousResearch/atropos/main/README.md
    shows: 'The README environment table lists "Dataset environments" with "GSM8K, MMLU, Custom HF Datasets",
      "Online environments" with "Blackjack, Taxi, Text-based games", "RLAIF and RLHF" with "LLM Judge/Reward
      Models", "Multi-Turn RL", "Code Execution" and "Multimodal". A Trainer Integrations section covers
      Axolotl and Tinker, and the diagram caption says "trainer & inference engine not included with the
      atropos package". Tooling includes "View Run (`view-run`)" and "Offline Data Generation" via atropos-sft-gen
      and atropos-dpo-gen, and "Atropos natively supports any model provider that adheres to the OpenAI
      API standard". Its results table reports "4.6x" on parallel tasks and 21% to 51.75% on simple tasks,
      self-reported. Searched the body for GRPO: none.'
    accessed: '2026-09-28'
    http_status: 200
    content_sha256: 354055bcc2f72ba94fb5c2b69741c159b89a55bd30f6e20b9b652781cafb9ff6
