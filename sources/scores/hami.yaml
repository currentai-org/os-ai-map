  value: device registration carrying split count, memory limit and core limit per accelerator; its own scheduler
    patches the placement decision onto the pod as hami.io/vgpu-node and hami.io/vgpu-devices-to-allocate;
    GPU virtualization across NVIDIA, Cambricon and other vendors
  confidence: medium
  relative_to: openpai
  relation: at
  comparison:
    last_attested: '2026-09-16'
    sources:
    - url: https://raw.githubusercontent.com/microsoft/hivedscheduler/master/doc/user-manual.md
      shows: Re-read of the peer this band is placed against. HiveD still presents as choosing which GPUs on
        which machines a job receives and guaranteeing that set's topology, without an evidenced multi-machine
        reservation - the property both products share at this band.
      accessed: '2026-09-16'
      http_status: 200
      content_sha256: b4140035b19168633fbdf15d4d2585bdd8d966c173daa4009a0c765d833c73d4
  note: HAMi registers each accelerator in its own annotation schema, and its own scheduler consumes that
    to choose both the node and the specific devices a pod receives, which is more than simple dispatching.
    Nothing cited shows it reserving a multi-machine set as a single allocation, which keeps it level with
    OpenPAI.
