capability:
  score: 3
  basis: feature_matrix
  value: seven tasks (translation from and to, classification, MMLU, ARC, TruthfulQA, MGSM) over ~42 curated
    hosted models via OpenRouter, across up to 200 languages with a 1000-language ceiling in the config;
    aggregated and per-sample results published as open datasets with bootstrap confidence intervals,
    plus a public dashboard and global proficiency map
  relative_to: euroeval
  relation: at
  confidence: medium
  note: The widest language coverage of any harness in the category — up to 200 languages against EuroEval's
    30+ — bought by a narrow task surface. Seven borrowed benchmarks at ten samples each, hosted API models
    only through a single router, no locally-run weights and no installable package, against EuroEval's
    encoders, decoders and encoder-decoders and its own reproducible dataset-creation scripts. Deep on
    one axis and thin on the rest in each direction, so level with EuroEval rather than a rung apart, and
    below the general-purpose harnesses at 4.
  comparison:
    last_attested: '2026-09-10'
    sources:
    - url: https://euroeval.com
      shows: '"EuroEval is a language-model benchmarking framework that supports evaluating all types of
        language models (encoders, decoders, encoder-decoders, base models, and instruction-tuned models)
        across 30+ European languages" — the model-class breadth EuroEval trades for languagebench''s
        language reach, which is what makes the two level rather than a rung apart.'
      accessed: '2026-09-10'
      http_status: 200
      content_sha256: 8a3a709a111bcbcfe28202d1220528bf757211e76678933012441e3f0d7c7d0f
  last_verified: '2026-09-10'
  sources:
