capability:
  score: 3
  basis: feature_matrix
  value: seven tasks (translation from and to, classification, MMLU, ARC, TruthfulQA, MGSM) over ~42 curated
    hosted models via OpenRouter, across up to 200 languages with a 1000-language ceiling in the config;
    aggregated and per-sample results published as open datasets with bootstrap confidence intervals,
    plus a public dashboard and global proficiency map
  relative_to: euroeval
  relation: at
  confidence: medium
  note: 'Languagebench covers up to 200 languages against EuroEval''s 30-plus, but its task surface is narrow:
    seven borrowed benchmarks run only against hosted models through a single router. EuroEval trades that
    language breadth for support across encoders, decoders and encoder-decoders and its own dataset-creation
    scripts, leaving the two roughly comparable, and general-purpose harnesses still cover more ground than
    either.'
  comparison:
    last_attested: '2026-09-10'
    sources:
    - url: https://euroeval.com
      shows: '"EuroEval is a language-model benchmarking framework that supports evaluating all types of language
        models (encoders, decoders, encoder-decoders, base models, and instruction-tuned models) across 30+
        European languages" — the model-class breadth EuroEval trades for languagebench''s language reach,
        which is why the two sit close together rather than clearly one ahead of the other.'
      accessed: '2026-09-10'
      http_status: 200
      content_sha256: 8a3a709a111bcbcfe28202d1220528bf757211e76678933012441e3f0d7c7d0f
  sources:
  - url: https://arxiv.org/abs/2507.08538
    shows: '"a comprehensive multilingual benchmark that systematically assesses LLM performance across
      up to 200 languages, with a particular focus on low-resource languages"; it "aggregates diverse tasks
      including translation, question answering, math, and reasoning, using datasets such as FLORES+, MMLU,
      GSM8K, TruthfulQA, and ARC"; "an open-source, auto-updating leaderboard and dashboard"; "a global
      proficiency map and trends over time"'
