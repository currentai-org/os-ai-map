    shows: '"a comprehensive multilingual benchmark that systematically assesses LLM performance across
      up to 200 languages, with a particular focus on low-resource languages"; aggregates translation,
      question answering, math and reasoning over FLORES+, MMLU, GSM8K, TruthfulQA and ARC; "an open-source,
      auto-updating leaderboard and dashboard"; a global proficiency map and trends over time'
