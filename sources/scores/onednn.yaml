capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Primitive library covering convolution, matmul, RNN, normalization and fusion across x86-64, AMD64,
    Arm64 CPUs and Intel GPUs, used as the CPU kernel layer beneath frameworks. Declared as a submodule
    in OpenVINO's own repository.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: oneDNN supplies convolution, matmul, RNN, normalization and fusion primitives across x86-64, AMD64
    and Arm64 CPUs and Intel GPUs - real operator coverage. OpenVINO declares two oneDNN submodules directly
    in its own repository, the strongest evidence of a dependency; its README's list of other frameworks
    that use it (ONNX Runtime, PaddlePaddle, PyTorch, TensorFlow) corroborates without deciding it. It supplies
    operators rather than the path from a framework graph to a target, which keeps it short of Apache TVM.
  last_verified: '2026-08-18'
  sources:
  - url: https://github.com/uxlfoundation/oneDNN/blob/main/README.md
    shows: README still documents a cross-platform performance library of deep-learning building blocks
      implementing the oneAPI specification, optimized for Intel 64, AMD64 and 64-bit Arm processors and
      Intel GPUs.
