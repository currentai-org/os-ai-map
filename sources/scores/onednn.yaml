capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Primitive library covering convolution, matmul, RNN, normalization and fusion across x86-64, AMD64,
    Arm64 CPUs and Intel GPUs, used as the CPU kernel layer beneath frameworks. Declared as submodules in
    OpenVINO's own repository.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: OpenVINO vendors oneDNN as two submodules, one pointing at an OpenVINO fork for the CPU plugin and
    one at oneapi-src/oneDNN for the GPU plugin. It supplies operators rather than the path from a framework
    graph to a target, which keeps it one step below Apache TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/uxlfoundation/oneDNN/main/README.md
    shows: README says "oneDNN project is part of the [UXL Foundation] and is an implementation" of the
      oneAPI specification, and "The library is optimized for Intel 64/AMD64 architecture based processors,"
      "Arm(R) 64-bit Architecture (AArch64)-based processors, and Intel Graphics."
