  score: 4
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Hash-chained Runtime Records of agent actions, a self-verifying HTML Runtime Report, witness anchoring
    and RFC 3161 timestamps; verification needs no hosted infrastructure.
  relative_to: nvtrust
  relation: one_below
  confidence: medium
  note: Anyone holding a checkpoint can confirm the records behind it were never altered, without trusting
    whoever produced them. The records still describe what the operator's recorder saw, so they fall a step
    short of NVIDIA's hardware attestation of the execution itself.
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/bkuan001/halo-record/main/README.md
    shows: '"Any party holding a checkpoint of the chain can verify the records behind it were never altered,
      without trusting whoever produced them"; the chain alone "is tamper-evident against everyone except the
      party operating the recorder"'
