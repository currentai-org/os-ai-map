capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Zero-copy branching, committing and merging over three object stores behind an S3-compatible API, with
    hooks and garbage collection. Versioning over storage it does not itself provide, and no indexing or retrieval.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: lakeFS provides zero-copy branching, committing and merging over three object stores behind an S3-compatible
    API, with hooks and garbage collection. It versions storage it does not itself provide and does no indexing
    or retrieval, which is why it covers much less of the persist-index-retrieve path than Vespa does.
  last_verified: '2026-08-18'
