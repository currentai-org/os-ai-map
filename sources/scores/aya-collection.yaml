  note: Aya 101 and Aya 23 are both documented as fine-tuned on the Aya Collection, and the Aya 23 paper
    reports it outperforming Gemma, Mistral and Mixtral on a wide range of tasks. The Aya Expanse paper
    reports win rates of up to 76.6% for its 8B and 32B models against Gemma 2, Qwen 2.5 and Llama 3.1,
    but no primary Aya Expanse source names this collection as its training data.
