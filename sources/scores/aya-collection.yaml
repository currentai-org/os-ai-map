  confidence: high
  note: 'The instruction collection behind Aya 101 (2024), Aya 23 and Aya Expanse, which beat Gemma 2, Qwen
    2.5 and Llama 3.1 in their size class: the Aya Expanse paper reports win rates up to 76.6%, reached
    by the 32B against Mixtral 8x22B on m-ArenaHard, and the accompanying blog post reports the 8B range
    at 60.4% to 70.6% against Gemma 2 9B, Llama 3.1 8B and Ministral 8B. Either comparison set is open models
    this collection fed, so the band holds on both readings. The weakest link is the Aya Expanse lineage
    itself: no primary source names the Aya Collection as its training data, and the attribution rests on
    the secondary write-up cited here.'
  last_verified: '2026-08-14'
  sources:
  - url: https://arxiv.org/abs/2412.04261
    shows: 'Aya Expanse paper abstract - "Aya Expanse 8B and 32B outperform leading open-weight models in
      their respective parameter classes, including Gemma 2, Qwen 2.5, and Llama 3.1, achieving up to a
      76.6% win-rate" on Arena-Hard-Auto translated into 23 languages, and "Aya Expanse 32B outperforms
      Llama 3.1 70B ... achieving a 54.0% win-rate"'
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 061c6359ac9b1a00d36b521f7179ec338370ca420d44d3b0c4254aa4b518baa0
