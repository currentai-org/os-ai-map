capability:
  score: 5
  basis: feature_matrix
  value: a catalogue of prebuilt MCP servers spanning business systems, with per-end-user OAuth run by the platform,
    tokens and API keys stored, renewed and injected at call time, and execution hosted on Arcade Cloud or the customer's
    own cluster behind scoped MCP gateways
  confidence: medium
  note: Arcade reaches many systems, runs the OAuth flow and keeps each user's tokens itself, and hosts the tools
    it calls, which puts it level with Composio. What distinguishes it from a plain MCP server is that the caller
    never handles a token.
  relative_to: composio
  relation: at
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://docs.composio.dev/getting-started/welcome
      shows: The Composio docs home (served at docs.composio.dev/docs) still offers "Smart tool search over 1,700+
        apps" and says "Composio stores and refreshes each user's credentials. Your application and model receive
        tool results, not raw OAuth tokens."
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: a5d4f10440dc209ca31e1e8fcad7f551d9fa4a3a43eb71a11e9d5b2750c1cdf7
  last_verified: '2026-11-12'
  sources:
  - url: https://docs.arcade.dev/en/get-started/about-arcade
    shows: 'The About page: "Arcade handles OAuth and manages user tokens, API keys, and secrets", with "7,500+
      agent-optimized tools across 81 MCP servers", and a central control plane with a shared registry and audit
      logs.'
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: 856ec6f0155b78aadfbb1e8231bf40d0fc50fe4362c0e904b9749bf6b13dcdb4
  - url: https://docs.arcade.dev/en/operate/deploy/architecture
    shows: 'The Engine "Runs the token vault: it takes each end user through the OAuth flow for a provider such
      as Google or Slack, stores the resulting token encrypted, renews it when a tool call finds it expired, and
      supplies it to the tool at execution time", and "Serves MCP gateways".'
    accessed: '2026-11-12'
    http_status: 200
