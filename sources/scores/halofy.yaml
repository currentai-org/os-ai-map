capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: per-agent API keys resolving namespace, actor and role server-side; namespace ACL and role checks on every
    read and write before it runs; no delegation narrowed across agents; no human approval step; append-only audit
    log that is neither hash-chained nor signed
  confidence: medium
  note: Halofy gives each agent a credential that the server resolves into its namespace and role, and checks every
    read and write of organizational context against them before it runs. It has no delegation between agents and
    no human approval step, and its audit log is append-only but not hash-chained or signed.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/halofyai/halofy/main/README.md
    shows: '"Identity is server-owned. Namespace, actor, role, and source scope come from the credential"; "credentials
      resolve actor, role, namespace, and source scope server-side before any read or write"; "Every outcome audits."'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: f9b9875257cc2d6354f7a9b67e40ccdb327459be99a896f1f39ff98df056b3d8
  - url: https://raw.githubusercontent.com/halofyai/halofy/main/docs/architecture.md
    shows: '"Syscalls take a resolved Identity, never a caller-supplied namespace or actor"; "audit_log is append-only
      by construction", a table with seq, actor, agent_id, op and result columns and no hash column.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: f1dff91e9eaa00e2608ecd7bb09ec122ca784d6ee81e3d58626c2ef656039d59
