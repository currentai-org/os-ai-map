  value: typed distributed training jobs - PyTorch, TensorFlow and other frameworks - as first-class submissions;
    resource quotas backed by GPU instances the service provisions; queued, running and terminal job states
    managed by the service
  confidence: medium
  relative_to: sagemaker-pipelines
  relation: at
  note: PAI-DLC names training job types directly - PyTorch, TensorFlow and others - rather than treating
    a job as a generic unit of work, and it tracks each job's queued, running and terminal states along
    with the resource quotas it runs against. Alibaba Cloud's documentation does not show PAI-DLC's own
    scheduler choosing which machines a job runs on, which keeps it level with Amazon SageMaker AI Pipelines
    rather than higher.
