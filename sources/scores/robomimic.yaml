capability:
  score: null
  basis: n/a
  basis_detail: not a simulator
  value: 'Learning-from-demonstration framework: imitation-learning and offline RL algorithms, released simulated and real
    manipulation datasets, and tools for training, sweeps and reproducing results. Simulation comes from robosuite, a separate
    project.'
  confidence: medium
  note: The software in this category is compared on how fast and how faithfully it simulates robots. robomimic trains policies
    from recorded demonstrations and relies on robosuite for any simulation, so it has no place on that comparison and none
    is claimed.
  last_verified: '2026-11-12'
  sources:
