product: model-context-protocol
openness:
  score: 5
  class: open_source
  components:
    source:
      value: public
      detail: spec schema and docs in one repo plus reference SDKs in separate public repos
    license:
    - name: Apache-2.0
      detail: OSI, new code/spec
    - name: MIT
      detail: OSI, legacy contributions
    docs:
      value: CC-BY-4.0
      detail: documentation other than the specifications; not read by the openness ladder, which scores
        the artifact the product ships
    governance:
      value: Linux-Foundation/AAIF
      detail: open, co-founded Anthropic/Block/OpenAI
    core-gated:
      value: ungated
      detail: spec schema and docs ship in the one LF/AAIF-governed repo and every reference SDK is a public
        modelcontextprotocol repo - there is no vendor tier to withhold anything for
  confidence: high
  note: 'An open protocol with OSI-licensed reference implementations under open foundation governance,
    and nothing in the core held back. The specification, the JSON/TypeScript schema and the docs all live
    in one repository, every reference SDK is a separate public modelcontextprotocol repo (mcp-python-sdk
    and mcp-typescript-sdk are both on this map at 5), and the Linux Foundation''s AAIF governs the project,
    so there is no vendor tier for anything to be withheld for. The LICENSE splits three ways: Apache-2.0
    for new code and specifications, CC-BY-4.0 for documentation other than the specifications, and MIT
    retained for pre-transition contributions whose authors did not consent to relicensing. Only the two
    code licenses bear on the score. A compound license is resolved on every part and takes the most restrictive
    of them, so filing the documentation license alongside the code would let a license covering the project''s
    prose govern the artifact you actually run and drag the product down to source-available. The documentation
    license is therefore recorded apart from the code licenses, the same way autogen records the identical
    situation - MIT code, CC-BY-4.0 docs, scored 5. Both code licenses are OSI-approved, so the tier holds.'
