capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: 'A wire protocol is not benchmarked; capability is not a meaningful axis per recipe. Openness
    and adoption carry the signal. GRADING POLICY - A WIRE PROTOCOL IS GRADED ON OPENNESS AND ADOPTION
    ONLY, AND ITS CAPABILITY IS NULL BY POLICY RATHER THAN BY FALLBACK. The reasoning is in docs/reference/gap-analysis.md,
    "The two nulls are not symmetric": implementation breadth is adoption wearing a capability label,
    and this product''s adoption is ALREADY banded on SDK downloads - 335M monthly PyPI downloads of
    `mcp` and 198M monthly npm downloads of @modelcontextprotocol/sdk - so scoring breadth here would
    let one instrument vote twice and make the blend (adoption + adoption) / 2. Spec maturity is genuinely
    independent of uptake, but there is no ladder for it anywhere in the four rubrics, it would be a
    fifth instrument sharing the `capability` field name with benchmark, feature_matrix and internal-eval,
    and with only two protocols on the map there is nothing to anchor a `relative_to` against. A two-product
    feature matrix against agent2agent-protocol is the only option the existing machinery could enforce,
    and it requires un-nulling A2A first. No score is invented to close the gap, which is the point
    of writing the policy down instead. What the reader should take from the null is therefore precise:
    not "nobody has got to this yet" but "there is no independent capability question to ask of a specification".
    The known cost stands and is stated rather than fixed here - build/serialize.py falls through to
    adoption alone rather than dropping the product, so this record computes a maturity of 5.0 from
    one axis. That is a serializer question, and it is not load-bearing for the category either way,
    since agent_tools_protocols has seven mature open products and six of them reach 4.5 with no null
    in the arithmetic. agent2agent-protocol has the identical shape and carries the same declaration.'
  last_verified: '2026-08-14'
  sources:
  - url: https://api.github.com/repos/modelcontextprotocol/modelcontextprotocol
    shows: Repo metadata - description "Specification and documentation for the Model Context Protocol",
      topics docs / mcp / specification / standard, 8,950 stars, homepage modelcontextprotocol.io. What
      the project ships is a specification and its schema, and no benchmark result, leaderboard entry or
      performance figure is published for it.
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 0756fabd71a36d29890ee7d2e08c29b43df3718acf2d99e45dba784e23572afe
