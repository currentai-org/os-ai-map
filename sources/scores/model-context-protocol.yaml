capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: 'A wire protocol is not benchmarked, so capability is left unscored here by policy rather than for
    want of a number: openness and adoption carry the whole signal for a specification. Two capability questions
    could be asked of a protocol and neither survives scrutiny. Breadth of implementation is adoption wearing
    a capability label, and this product''s adoption is already banded on exactly that kind of evidence
    - 335 million monthly PyPI downloads of `mcp` and 198 million monthly npm downloads of @modelcontextprotocol/sdk
    - so scoring breadth as well would let one instrument vote twice and average adoption against itself.
    Spec maturity is genuinely independent of uptake, but no rubric on this map has a ladder for it, it
    would be a fifth instrument sharing a field with benchmark, feature-comparison and internal-evaluation
    scores, and with only two protocols on the map there is nothing to anchor a comparison against. A two-product
    feature comparison against the Agent2Agent protocol is the only thing the existing machinery could enforce,
    and it would require scoring that record''s capability first. No score is invented to close the gap.
    The blank should therefore be read precisely: not "nobody has got to this yet" but "there is no independent
    capability question to ask of a specification". One cost comes with it, stated rather than papered over
    - with no capability score the maturity calculation falls through to adoption alone rather than dropping
    the product, so this record computes a maturity of 5.0 from a single axis. That does not distort the
    category, which holds seven mature open products, six of them reaching 4.5 with no blank in the arithmetic.
    The Agent2Agent protocol has the same shape and carries the same policy.'
  last_verified: '2026-08-14'
  sources:
  - url: https://api.github.com/repos/modelcontextprotocol/modelcontextprotocol
    shows: Repo metadata - description "Specification and documentation for the Model Context Protocol",
      topics docs / mcp / specification / standard, 8,950 stars, homepage modelcontextprotocol.io. What
      the project ships is a specification and its schema, and no benchmark result, leaderboard entry or
      performance figure is published for it.
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 0756fabd71a36d29890ee7d2e08c29b43df3718acf2d99e45dba784e23572afe
