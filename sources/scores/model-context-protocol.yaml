openness:
  score: 5
  class: open_source
  components:
    source:
      value: public
      detail: spec schema and docs in one repo plus reference SDKs in separate public repos
    license:
    - name: Apache-2.0
      detail: OSI, new code/spec
    - name: MIT
      detail: OSI, legacy contributions
    docs:
      value: CC-BY-4.0
      detail: documentation other than the specifications; not read by the openness ladder, which scores
        the artifact the product ships
    governance:
      value: Linux-Foundation/AAIF
      detail: open, co-founded Anthropic/Block/OpenAI
    core-gated:
      value: ungated
      detail: spec schema and docs ship in the one LF/AAIF-governed repo and every reference SDK is a public
        modelcontextprotocol repo - there is no vendor tier to withhold anything for
  confidence: high
  note: 'Open protocol with OSI-licensed reference implementations and open foundation governance; no feature-gated
    core. The record reproduces at 5/open_source, on three points. (1) `source` was recorded under the key
    `spec+reference-SDKs`, which no dimension''s `reads:` list names, so the right answer sat under a key
    the ladder never looks at and the dimension read as unanswered. It is recorded under `source`. (2) `core-gated:
    ungated`: the spec, the JSON/TypeScript schema and the docs are in the one repo, every reference SDK
    is a separate public modelcontextprotocol repo (mcp-python-sdk and mcp-typescript-sdk are already on
    the map at 5), and the project is governed by the Linux Foundation''s AAIF with no vendor tier to withhold
    anything for. (3) The LICENSE really does split three ways - Apache-2.0 for new code and specifications,
    CC-BY-4.0 for documentation other than the specifications, and MIT retained for pre-transition contributions
    whose authors did not consent to relicensing. Recording all three under `license` is the defect to avoid:
    `license_tier` resolves a compound on every part and takes the most restrictive, so a license covering
    the project''s PROSE would govern the artifact you run and pull the product down to 3/source_available.
    The documentation license sits under a `docs:` key, which the openness ladder does not read, matching
    how `autogen` records the identical situation - MIT code, CC-BY-4.0 docs, 5/open_source. The license
    dimension answers a question about the shipped artifact.'
