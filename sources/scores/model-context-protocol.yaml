adoption:
  level: 5
  reach: '>10M'
  signal_type: usage_volume
  confidence: high
  note: OpenAI uses Model Context Protocol across ChatGPT, its Agents SDK and the Responses API, Google
    DeepMind supports it in Gemini, and Microsoft's Semantic Kernel and Azure OpenAI integrate with it.
    The protocol has no package of its own, so adoption is measured by downloads of its two reference SDKs,
    `mcp` on PyPI and the TypeScript SDK's `@modelcontextprotocol/sdk` on npm, each also listed on the map
    as its own entry.
  last_verified: '2026-09-28'
  sources:
  - url: https://en.wikipedia.org/wiki/Model_Context_Protocol
    shows: The article states "Following its announcement, the protocol was adopted by major AI providers,
      including" OpenAI and Google DeepMind, says MCP "can be integrated with" Microsoft "Semantic Kernel"
      and Azure OpenAI, and records the December 2025 donation to the Agentic AI Foundation.
