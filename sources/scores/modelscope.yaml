capability:
  score: 5
  basis: feature_matrix
  value: create and upload model, dataset and studio repositories from the CLI or SDK, with public, internal
    or private visibility; revisions by branch, tag or commit; download by git or the hub OpenAPI
  confidence: medium
  relative_to: huggingface-hub-platform
  relation: at
  note: 'ModelScope covers the same cycle as Hugging Face Hub: account holders create repositories for models,
    datasets and apps, version them by branch, tag and commit, and pull them over git or an API other tools
    call. Its documentation pages render only in a browser, so the reading comes from the official client''s
    reference and the hub''s own API.'
  last_verified: '2026-09-27'
  sources:
  - url: https://pypi.org/pypi/modelscope-hub/json
    shows: Connects "models, datasets, Studio spaces, skills, and MCP servers"; "ms-hub create my-org/my-model
      --repo-type model --visibility private"; "--revision REV ... Branch, tag, or commit hash".
