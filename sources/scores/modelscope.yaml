  level: 4
  reach: broad
  signal_type: reported_traction
  confidence: low
  banded_quantity: hosted repository totals and cumulative per-model download counters from the public OpenAPI,
    not a monthly or user count
  note: The hub's public API reports how many models, datasets and apps it hosts and a cumulative download
    counter per repository, and its most-downloaded models, speech models from Alibaba's own lab, are in the
    hundreds of millions. ModelScope publishes no platform-wide or monthly figure, so the reading is a judgment
    from those counters rather than a count of users.
