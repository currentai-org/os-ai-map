capability:
  score: 4
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: Multi-physics (rigid, PBD cloth, smoke, IPC coupling), parallel and heterogeneous environments, Nyx photorealistic
    renderer plus Luisa ray tracing and Pyrender, sensors from depth camera and lidar to tactile and contact force,
    cross-vendor GPU backends. No ready-to-train task suite or sim-to-real pipeline named in the README.
  confidence: medium
  note: Genesis matches Isaac Lab on parallel simulation, physics breadth and rendered sensors, and goes further
    on hardware, running on AMD, Apple and Vulkan GPUs as well as NVIDIA. Its README offers demos rather than a
    library of ready-to-train tasks for common robots, and names no route for checking a trained policy before it
    goes to hardware.
  relative_to: isaac-lab
  relation: one_below
  last_verified: '2026-09-27'
  sources:
  - url: https://raw.githubusercontent.com/Genesis-Embodied-AI/genesis-world/main/README.md
    shows: 'README: "combines a unified multi-physics engine, a photo-realistic renderer (Nyx), and a cross-platform
      compiler (Quadrants)"; "parallel and heterogeneous environments"; "Quadrants lowers Python kernel code to
      CUDA, AMD ROCm, Apple Metal, Vulkan, x86, and ARM64"; sensor demos for depth camera, IMU, lidar, tactile and
      contact force.'
    accessed: '2026-09-27'
    http_status: 200
    content_sha256: d0d2206b9bbb9cf615798342f491f3405cf5576b9ab645b1bab0dc4bf21b9b01
