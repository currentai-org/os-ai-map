capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for African-language speech
  value: Speech recorded by people describing images, plus scripted readings, in 18 languages across five current
    releases, documented in per-release cards, with Digital Umuganda's Mbaza ASR model trained on it and WAXAL
    listing it as a source. No card states a product total; summed, the five hold 15,032.46 recorded hours,
    10,391.40 of them transcribed. The Kinyarwanda, Swahili and second multilingual releases state 3,155.64,
    3,096.87 and 2,421.29 transcribed hours; the first multilingual and Ethiopian releases give per-language
    rows only, summing to 612.90 and 1,104.70, the Ethiopian figure counting scripted readings as transcribed,
    as its card does. Older versions kept in other repositories are not added.
  confidence: medium
  note: Afrivoice gives African languages from Kinyarwanda and Swahili to Amharic and Wolof image-described
    and scripted speech across five releases, more than any other open collection for most of them, and Digital
    Umuganda's Mbaza recognizer is trained on it while Google's WAXAL corpus draws on it, though it has release
    cards but no paper. Two releases transcribe only a fraction of their audio, and all five together hold
    a small fraction of the hundreds of thousands of transcribed hours in the largest English speech corpora.
  last_verified: '2026-09-24'
  sources:
  - url: https://huggingface.co/datasets/DigitalUmuganda/Afrivoice
    shows: '"when available, the transcription of the audio file"; total and transcribed hours: Shona 574.16
      and 100.00, Lingala 517.13 and 100.98, Fulani 527.45 and 102.00, Malagasy 516.21 and 102.42, Wolof 530.74
      and 102.96, Somali 535.51 and 104.54.'
    accessed: '2026-11-12'
