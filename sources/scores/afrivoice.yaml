capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for African-language speech
  value: Speech recorded by people describing images, plus scripted readings, about 15,000 hours in 18 languages
    across five releases, documented in per-release cards, with Digital Umuganda's Mbaza ASR model trained
    on it and WAXAL listing it as a source.
  confidence: medium
  note: Afrivoice gives eighteen African languages image-described and scripted speech across five releases,
    more than any other open collection for most of them, and Digital Umuganda's Mbaza recognizer is trained
    on it while Google's WAXAL corpus draws on it, though it has release cards but no paper. Some releases
    transcribe only part of the audio, leaving a few thousand transcribed hours, far from the hundreds of thousands
    in the largest English speech corpora.
  last_verified: '2026-09-24'
  sources:
  - url: https://huggingface.co/datasets/DigitalUmuganda/Afrivoice
    shows: 'Six-language table: Shona 574.16, Lingala 517.13, Fulani 527.45, Malagasy 516.21, Wolof 530.74,
      Somali 535.51 total hours, about 100 transcribed each.'
    accessed: '2026-09-24'
    http_status: 200
