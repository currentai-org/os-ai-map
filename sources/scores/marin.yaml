  class: open_source
  components:
    weights:
      value: open
      detail: Apache-2.0
    data:
      value: open
      detail: documented mixtures. Most of the pretraining text is web crawl from Common Crawl, whose CCBot
        documents a robots.txt check. DCLM-Baseline, the main source of Marin 8B's first phases, is CC-BY-4.0
        with Common Crawl's terms bound on it. Nemotron-CC, the main web source of Marin 8B from 4.78T tokens
        on and about 97 percent of Marin 32B's main mix, is released under Common Crawl's terms of use,
        and no compilation license or other grant over it was found
    code:
      value: open
      detail: marin + Levanter, JAX
    checkpoints:
      value: open
    license:
    - name: Apache-2.0
      detail: OSI
    context:
      reproducibility:
        value: bit-for-bit
  confidence: medium
  note: Marin publishes Apache-2.0 weights together with its training code, data mixtures, experiments,
    hyperparameters and training logs, and its training runs are reproducible bit for bit. Its pretraining
    data are public third-party corpora, mostly web text from DCLM-Baseline and Nemotron-CC, which Marin
    names and mixes in published code. Nemotron-CC is distributed under Common Crawl's terms of use rather
    than an open license.
