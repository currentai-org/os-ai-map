    shows: The goals page lists "Image + PDQ" and "Video + MD5" as fully implemented, a single-box target to "fetch,
      store, index at least 10M PDQ hashes", and a multi-instance target where "1000 qps image hash + match should
      be possible". Under non-goals it says the actioning interface from HMA 1.0 is on hold for 2.0 and that vPDQ
      video lookup is not implemented.
