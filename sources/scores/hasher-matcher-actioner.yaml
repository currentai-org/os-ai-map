capability:
  score: 3
  basis: feature_matrix
  basis_detail: hash-matching coverage
  value: 'Copy detection for trust and safety teams: hashes images with PDQ and videos with MD5, matches them against
    banks of known content through an in-memory FAISS index, and fetches and shares banks with hash-exchange programs
    including NCMEC, GIFCT, StopNCII and ThreatExchange through pluggable interfaces. Ships a REST API, a CLI and
    a curation web UI, and splits into hasher, matcher and curator roles to scale out; its stated targets are 10M
    PDQ hashes on one machine and 1,000 image lookups per second across instances.'
  relative_to: coop
  relation: at
  confidence: low
  note: 'HMA covers one stage of a moderation pipeline in depth: recognizing copies of images and videos a platform
    or an industry hash list has already flagged, with the exchange connections that make those lists usable. Coop
    covers more of the workflow, with review queues, routing and reporting, and relies on HMA for its own hash matching,
    so the two sit level. HMA dropped the rules for acting on a match when it was rewritten, and it handles only
    exact and near-duplicate media, not new content.'
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://roost.tools/coop/
      shows: The peer's page still describes "An open source review and moderation platform", with review across
        any policy category, a child safety workflow adding "hash matching via HMA, NCMEC CyberTipline reporting",
        review queues with "Role-based access controls and routing rules", and automation rules. It names HMA as
        the component Coop uses for hash matching.
      accessed: '2026-10-13'
      http_status: 200
      content_sha256: 84ec21bab9e6382289b74b50fe0388335ab3b838df8d320e15365b9c29fe3364
  last_verified: '2026-10-13'
  sources:
  - url: https://cdn.jsdelivr.net/gh/facebook/ThreatExchange@main/hasher-matcher-actioner/README.md
    shows: 'The README describes the process by which "new content is evaluated against collections of known content
      (called "Banks" in HMA)": content is hashed, matched "against an index of known content", and acted on if
      it matches. It names the NCMEC Hash Sharing Program, GIFCT''s Hash-Sharing Database, StopNCII.org and Meta''s
      ThreatExchange, says custom algorithms plug in through python-threatexchange interfaces, and says HMA "is
      designed with horizontal scalability in mind".'
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: e0c47dad67c0f9561fff3c7231990372160606c3f9cbec3998d6c26c5739fb16
  - url: https://cdn.jsdelivr.net/gh/facebook/ThreatExchange@main/website/content/hma/architecture.md
    shows: The architecture page splits a scaled deployment into Hashers, which turn images into PDQ hashes, Matchers,
      which "periodically rebuild their (in-memory) FAISS indices", and Curators, which import hash lists and edit
      bank content. It says the API and CLI are built into the Python package and the API service is distributed
      as a Docker image.
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: 214c28f0273280ae473cb4e6cb1571e499764ad46e43c614d044c926f200ad94
