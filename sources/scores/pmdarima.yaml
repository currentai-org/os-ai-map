  relative_to: prophet
  relation: at
  confidence: high
  note: pmdarima fits one kind of forecasting model and automates choosing its orders, as R's auto.arima
    does. That search stays inside the ARIMA family, so it sits with single-family forecasters like Prophet
    rather than with toolkits that compare many kinds of model.
