      configuration blocks carry no credential, only `FASTMCP_LOG_LEVEL`. "The MCP servers in this repository
      are designed to support stdio only." It distinguishes AWS''s own managed remote servers, which "require
      no setup or infrastructure management on your part", as a separate offering.'
