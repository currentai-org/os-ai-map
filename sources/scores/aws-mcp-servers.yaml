capability:
  score: 3
  basis: feature_matrix
  value: 58 servers across AWS's own services, each a curated tool surface over one service, running locally
    over stdio against credentials the caller has already configured
  confidence: medium
  relative_to: playwright-mcp
  relation: at
  note: AWS MCP Servers is a catalogue of 58 servers, but each fronts one AWS service rather than many independent
    systems, and the caller configures AWS credentials before any server starts and runs every server locally
    over stdio. Managed credentials or hosted execution, which this suite has neither of, are what would
    move it to a higher tier. AWS's separately managed remote MCP server is a different product and is not
    what this record scores.
  last_verified: '2026-09-17'
