capability:
  score: 3
  basis: feature_matrix
  value: 58 servers across AWS's own services, each a curated tool surface over one service, running locally
    over stdio against credentials the caller has already configured
  confidence: medium
  relative_to: playwright-mcp
  relation: at
  note: 'Band 3, and the count of servers is the thing NOT to band on. This is a catalogue in the loose sense
    - 58 servers - but they front one vendor''s services rather than many systems, and the two conditions that
    lift a product above 3 are both absent: the caller configures the AWS credential chain before any server
    starts, and the servers run on the caller''s machine over stdio. A catalogue without managed credentials
    or hosted execution is band 3, which is the rule doing its job rather than an oversight. AWS''s separately
    managed remote MCP server is a different product and is not what this record scores.'
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/awslabs/mcp/main/README.md
    shows: 'The README: "A suite of specialized MCP servers that help you get the most out of AWS". Installation
      and Setup step 3 is "Configure AWS credentials with access to required services", and the MCP client
      configuration blocks carry no credential, only `FASTMCP_LOG_LEVEL`. "The MCP servers in this repository
      are designed to support stdio only." It distinguishes AWS''s own managed remote servers, which "require
      no setup or infrastructure management on your part", as a separate offering.'
    accessed: '2026-09-17'
