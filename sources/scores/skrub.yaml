capability:
  score: 2
  basis: feature_matrix
  value: dataframe preprocessing and feature engineering for scikit-learn - TableVectorizer, StringEncoder, LLMEncoder,
    GapEncoder, MinHashEncoder, DatetimeEncoder and SquashingScaler - with tabular_pipeline baselines and pipelines
    whose hyperparameters can be searched
  relative_to: scikit-learn
  relation: one_below
  confidence: medium
  note: skrub turns raw tables into features and assembles a baseline pipeline around a scikit-learn estimator,
    but the learners themselves come from scikit-learn. It is a convenience layer over part of that toolkit rather
    than a catalog of models of its own.
  comparison:
    last_attested: '2026-11-12'
    sources:
