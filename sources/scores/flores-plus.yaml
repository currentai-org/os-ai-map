  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for multilingual translation evaluation
  value: Human-translated benchmark of 997 dev and 1,012 devtest sentences in each of 230 language varieties,
    documented in the FLORES-101 and NLLB papers, on which FLEURS and Belebele are built and against which
    NLLB-200 was evaluated.
  confidence: medium
  note: FLORES+ is the reference translation benchmark for low-resource languages, with the same human-translated
    sentences in 230 varieties and documentation in the FLORES and NLLB papers. Meta evaluated NLLB-200 on
    it, and other benchmarks reuse its sentences, among them FLEURS for speech and Belebele for reading comprehension.
  last_verified: '2026-09-24'
