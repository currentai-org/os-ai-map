capability:
  score: 3
  basis: feature_matrix
  value: a curated tool surface over the Unity Editor - scenes and GameObjects, C# scripts, assets, tests, profiling
    and builds, with optional tool groups for VFX, animation, UI and testing - run on the developer's machine against
    the editor they have open
  confidence: medium
  note: MCP for Unity adapts one system, the Unity Editor, and needs no credentials, since the editor package and
    its server run on the developer's own machine. That puts it level with Playwright MCP; a remote deployment with
    authentication is possible, but the developer hosts it.
