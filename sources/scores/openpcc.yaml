    published separately as confidentcompute, is under the Functional Source License FSL-1.1-ALv2. That
    license forbids competing uses until each version converts to Apache-2.0, and the compute node is half
    of the standard, so the product as released is source-available. Confident Security sells a managed
    service, CONFSEC, built on the same standard.
