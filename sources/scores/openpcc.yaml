capability:
  score: 4
  basis: feature_matrix
  value: 'confidential inference on commodity CPU + GPU (NVIDIA) TEEs; integrated CPU/GPU remote attestation;
    HPKE-based encrypted client-server streaming (Two-Way); tamper-proof verifiable transparency logs; unlinkable/anonymized
    requests via Oblivious HTTP; client SDKs (Go native + C lib for Python/JS); model/provider-agnostic (prototyped
    on Intel TDX + H100 serving Llama-3 8B on vLLM)'
  confidence: medium
  note: OpenPCC's reference implementation covers encrypted streaming, TPM and GPU hardware attestation,
    unlinkable requests over Oblivious HTTP, a transparency verifier, and provider-agnostic model routing
    through Go and C-based clients. It is not scored higher because the project is young, with no documented
    production adopters and no proven scale beyond its own reference deployment.
  last_verified: '2026-09-29'
  sources:
  - url: https://raw.githubusercontent.com/openpcc/openpcc/main/README.md
    shows: The OpenPCC README scopes the reference implementation as "enforcing privacy with encrypted streaming,
      hardware attestation, and unlinkable requests", uses Oblivious HTTP so "compute providers cannot learn
      about individual user actions", configures a "transparency.DefaultVerifierConfig()" verifier, and
      routes requests with a tag "to route request to compute nodes that are running the specified model".
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: 4e62b506e6a848b7b4f98fa0d552ddea86a1d035bed74c3fe94b537b40aa588d
  - url: https://raw.githubusercontent.com/confidentsecurity/confidentcompute/main/README.md
    shows: The Confident-Compute README says compute_boot "is responsible for attesting to the TPM, GPU,
      and other hardware components" and compute_worker "is responsible for decrypting the request, sending
      it to the LLM, and encrypting the response".
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: fb14caa3ada83f783491d898b22311c6cc21520d6f0752b09def6deb9a7bf498
  - url: https://cloudsecurityalliance.org/blog/2025/11/13/introducing-openpcc
    shows: Establishes the standard and the anonymization scheme - OpenPCC "describes a system for inference
      on private or otherwise sensitive data such that inputs and outputs remain completely hidden from
      all participants", with an anonymization scheme against API timing, payment and metadata side channels,
      a whitepaper, and "a fully-featured Apache 2.0 open-source implementation written in Go". It does
      not itemize TEEs, attestation, transparency logs or client SDKs.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 0f654e87b7206fe2a7c703f7549e0ef2eecd94b0dfb3a695b93c14e26b27edd0
  - url: https://raw.githubusercontent.com/confidentsecurity/confidentcompute/main/compute-images/README.md
    shows: The compute-images README describes the hardened node image, "The `compute-base` image is the
      hardened base image used for the CONFSEC compute worker", with dm-verity, dm-crypt, dm-integrity,
      SELinux and IMA, where the "hardened security measures including SELinux enforcing, ima appraisal,
      dm-verity are only active at instance provisioning time".
