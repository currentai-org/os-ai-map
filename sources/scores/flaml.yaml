  score: 5
  basis: feature_matrix
  value: task-oriented AutoML over classification, regression, ranking, time-series forecasting and NLP
    tasks, searching learners (LightGBM, XGBoost, CatBoost, random forest, extra trees, linear models,
    k-NN, Prophet, ARIMA, SARIMAX, TFT and others) and hyperparameters within a time budget, with optional
    stacked ensembles
  relative_to: autogluon
  relation: at
  confidence: medium
  note: Given only the training data and the task, FLAML chooses the learner and its settings itself,
    which is the automation AutoGluon provides. Unlike AutoGluon it bundles no pretrained tabular model,
    and its search is tuned for low compute cost.
