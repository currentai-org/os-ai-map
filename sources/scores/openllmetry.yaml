capability:
  score: 3
  basis: feature_matrix
  value: deep OTel instrumentation(15+ LLM providers, 7 vector DBs, framework hooks), multi-destination
    export(25+ platforms); NO native prompt management, evals/LLM-as-judge, or datasets/annotation in
    the OSS layer
  confidence: high
  relative_to: langfuse
  relation: one_below
  note: OpenLLMetry is strong on tracing and integrations but is an instrumentation layer rather than a
    full evaluation, prompt and dataset suite. Its open-source layer has no native prompt management, evaluation
    or LLM-as-judge scoring, and no datasets or annotation, which puts it a step behind the broader feature
    sets of Langfuse, MLflow, Phoenix and Opik.
  last_verified: '2026-08-13'
