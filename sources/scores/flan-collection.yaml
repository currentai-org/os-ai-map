  score: 3
  basis: training_value
  basis_detail: superseded
  value: null
  confidence: high
  note: Strong historical comparative ablations (Flan 2022 beats P3/T0/SNI on the same T5-XL) and still
    a component in Tulu 3, Dolci, and Marin's mixes, but dated as a standalone chat-era recipe. The Flan
    Collection reports Flan-T5 outperforming prior work by 3-17%+ across evaluation settings, and the Dolci
    SFT card still consumes FLAN v2.
  last_verified: '2026-09-29'
  sources:
  - url: https://arxiv.org/pdf/2301.13688
    shows: 'Flan Collection paper full text. The per-collection comparison is in the body and in Figure
      1: T5-XL-LM finetuned on Flan 2022 is set against the same model finetuned on Flan 2021, P3++ and
      Super-Natural Instructions, and "P3++" is defined there as all datasets in the Public Pool of Prompts.
      The arXiv abstract page gives the 3-17%+ headline without the per-collection rows.'
    accessed: '2026-09-11'
    http_status: 200
    content_sha256: 9b7644ffbe0a2c896fdefa202c79a6020f8a2cb73f655914ff77bdc9b308f5d8
