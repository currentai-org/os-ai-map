capability:
  score: 4
  basis: feature_matrix
  basis_detail: joint detection + benchmarks
  value: Joint prompt-harm, response-harm, and refusal detection across 13 risk subcategories; the card
    reports higher F1 than Llama Guard 2 and Aegis Guard on all three tasks, parity with GPT-4, and a lead
    over GPT-4 on adversarial prompts.
  confidence: medium
  note: WildGuard judges prompt harm, response harm and refusal in a single pass, and its card reports higher
    F1 than Llama Guard 2 and Aegis Guard on all three tasks. Refusal detection is what separates it from
    harm-only classifiers, and the card reports its widest lead there.
  last_verified: '2026-09-29'
  sources:
  - url: https://huggingface.co/allenai/wildguard
    shows: The model card describes "an open one-stop moderation model that achieves three goals" covering
      harm in prompts, harm in responses and refusal evaluation, with risk categories "consisting of total
      13 subcategories". It reports that WildGuard "outperforms the strongest existing open-source baselines
      (including Llama-Guard2 and Aegis-Guard) on F1 scores across all three tasks" and "matches GPT-4 across
      tasks, and surpasses GPT-4 by up to 4.8% on adversarial prompt harmfulness".
    accessed: '2026-09-29'
