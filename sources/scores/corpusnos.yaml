capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Galician pretraining text
  value: About 1.9 billion tokens in 7.9 million Galician documents from web crawls, books, press, government
    and research text, documented in a PROPOR paper and card, and used to train the Carballo and Carvalho models.
  confidence: medium
  note: CorpusNós is the Galician pretraining corpus behind the Carballo and Carvalho models from Proxecto
    Nós, documented in a PROPOR paper and a card with per-genre counts. Part of its text comes from rights
    holders under transfer agreements, which adds books, press and research writing to the web crawls.
