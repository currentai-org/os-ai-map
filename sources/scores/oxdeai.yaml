capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: per-action allow or deny from a deterministic policy engine, issuing a signed single-use authorization
    bound to the exact action; single-hop delegation whose scope can only narrow; hash-chained, tamper-evident audit
    log; no identity issued to the agent itself; no human approval step
  confidence: medium
  note: OxDeAI decides each action before it runs, hands narrower authority to a second agent and keeps a hash-chained
    record of its decisions. Agents are named only by an identifier in the request rather than holding a credential
    of their own, and nothing waits for a person to approve an action.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/oxdeai/oxdeai/main/README.md
    shows: The README says "Every protected action needs a signed, single-use authorization for that exact action,
      verified at the execution boundary before anything runs", and that a parent authorization "can hand a narrower
      scope to another agent through a single-hop DelegationV1".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: e1cfc84b2407223d640612af76a68fc77fd9eaa382f90a4022ac6b8bd59c99b9
  - url: https://raw.githubusercontent.com/oxdeai/oxdeai/main/packages/core/README.md
    shows: The core package README lists that it "produces hash-chained, tamper-evident audit logs" and "emits signed
      AuthorizationV1 artifacts"; intents carry an agent_id string.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 726e789ae24aa276fafd6877a863eb75f2a8b43b721287f449133e86e4c33f38
  - url: https://raw.githubusercontent.com/oxdeai/oxdeai/main/docs/spec/artifacts/delegation-v1.md
    shows: The DelegationV1 specification is "Strictly narrowing - scope may only be equal to or more restrictive
      than the parent", and "Multi-hop is out of scope."
    accessed: '2026-11-20'
    http_status: 200
