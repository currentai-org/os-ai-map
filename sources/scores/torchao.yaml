  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: multi-technique optimization toolchain'
  value: Training-side (float8, MX, QAT) and serving-side (int4, int8) optimization as native PyTorch dtypes
    and tensor subclasses. Depth across techniques within one framework.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: TorchAO applies float8, MX-format and quantization-aware training on the training side and int4
    and int8 quantization on the serving side, all as native PyTorch dtypes and tensor subclasses. That
    is depth across techniques within one framework, short of the multi-framework, multi-vendor compilation
    Apache TVM covers.
  last_verified: '2026-09-30'
