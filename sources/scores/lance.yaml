capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: A storage format carrying its own vector and full-text indexes, zero-copy versioning and fast random
    access, readable by engines such as DuckDB, Polars, Spark and Ray. Storage and indexing without a serving
    layer of its own.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Lance is a columnar table format with its own vector and full-text indexes, zero-copy versioning
    and fast random access, readable by several analytical engines. It covers most of the storing-and-indexing
    job itself but ships no serving layer of its own, which keeps it one step below Vespa.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/lance-format/lance/main/README.md
    shows: README lists "Combine vector similarity search, full-text search (BM25), and SQL analytics on
      the same dataset with accelerated secondary indices." and "Automatic versioning with ACID transactions,
      time travel, tags, and branches".
