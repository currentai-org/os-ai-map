  basis_detail: coverage and downstream use for South African government text
  value: Government magazine text in all 11 official South African languages, extracted from 84 PDF editions
    with 60,000+ automatically aligned sentence pairs, documented in a paper, with PuoBERTa and translation
    models trained on it.
  confidence: medium
  note: The Vuk'uzenzele corpus covers all 11 official South African languages in government-translated text,
    is documented in a paper, and its publisher trained PuoBERTa and translation models on it. It is a single
    domain with tens of thousands of aligned sentences, much smaller than WURA's general web corpus.
