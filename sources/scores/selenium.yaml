  score: 3
  basis: feature_matrix
  value: language bindings over the W3C WebDriver specification, driving every major browser, run by the caller
    with no credential in the product
  confidence: high
  relative_to: playwright-mcp
  relation: at
  note: The bindings cover one system, with the caller supplying every credential itself, the same footing
    as Puppeteer. The README read here is written for contributors - "This README is for developers interested
    in contributing to the project" - so it documents how the project is built rather than any runtime credential
    flow, and no credential mechanism appears in it.
  last_verified: '2026-09-17'
  sources:
