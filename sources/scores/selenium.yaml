    shows: 'The README: "Selenium is an umbrella project encapsulating a variety of tools and libraries enabling
      web browser automation. Selenium specifically provides an infrastructure for the W3C WebDriver specification
      - a platform and language-neutral coding interface compatible with all major web browsers." Its Installing
      section covers Bazelisk and a JDK; no authentication section exists.'
