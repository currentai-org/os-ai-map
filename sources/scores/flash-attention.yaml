capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Exact IO-aware attention kernels for NVIDIA GPUs from Ampere through Hopper and Blackwell, with
    an AMD ROCm backend for FlashAttention-2. Its usage page names PyTorch core, DeepSpeed, Megatron-LM,
    MosaicML Composer, GPT-NeoX and PaddlePaddle among the projects that have integrated it.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: FlashAttention supplies one narrow kernel family, exact IO-aware attention on NVIDIA GPUs with an
    AMD ROCm backend, but its usage page lists PyTorch, DeepSpeed and Megatron-LM among the projects that
    integrate it. Narrow coverage with broad reliance places it one step below Apache TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/Dao-AILab/flash-attention/main/README.md
    shows: README documents "FlashAttention-3 is optimized for Hopper GPUs (e.g. H100)." and "FlashAttention-4
      is written in CuTeDSL and optimized for Hopper and Blackwell GPUs (e.g. H100, B200)." and, for AMD,
      "ROCm version has two backends." with FlashAttention-2 support.
