capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Content-addressed, git-like versioning (init, add, commit, branch, merge) purpose-built for large binary
    and tabular datasets, with a self-hostable server for remotes. Versioning depth over its own object store, no
    vector or full-text retrieval.
  relative_to: lakefs
  relation: at
  confidence: medium
  note: 'Oxen is a versioned data layer for large files, not a distributed or cluster-capable system: content-addressed,
    git-like versioning (init, add, commit, branch, merge) over its own object store, with a self-hostable
    server for remotes. Oxen adds native indexing and queries over tabular files such as CSV, Parquet and
    JSONL, while lakeFS provides versioning over external object stores without its own query layer. They
    score the same because neither is a distributed or cluster-capable complete retrieval system.'
  comparison:
    last_attested: '2026-09-25'
    sources:
    - url: https://github.com/treeverse/lakeFS/blob/master/README.md
      shows: README still documents a Git-like repository over object storage, branches that give a copy of
        the full production data without copying anything, and hooks that gate what reaches production. It
        does not document an indexing or query layer of its own.
      accessed: '2026-09-25'
      http_status: 200
      content_sha256: 9be184df7d48a99f7fadc15fd4abfa4aeaaa10e18882d34b952f56b1fa9e45b8
  last_verified: '2026-09-25'
