capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Content-addressed, git-like versioning (init, add, commit, branch, merge) purpose-built for large binary
    and tabular datasets, with a self-hostable server for remotes. Versioning depth over its own object store, no
    vector or full-text retrieval.
  relative_to: lakefs
  relation: at
  confidence: medium
  note: 'Oxen is a versioned data layer for large files, not a distributed or cluster-capable system: content-addressed,
    git-like versioning (init, add, commit, branch, merge) over its own object store, with a self-hostable
    server for remotes, but no indexing or retrieval beyond file and diff lookups. That puts it on par with
    lakeFS, another versioning-only store with the same shape.'
  comparison:
    last_attested: '2026-09-02'
    sources:
