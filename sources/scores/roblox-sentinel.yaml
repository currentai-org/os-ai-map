capability:
  score: 3
  basis: feature_matrix
  basis_detail: rare-class detection across messages
  value: 'Contrastive rare-class detection over one source''s recent messages: each message is scored by embedding similarity
    against positive and negative example sets, and six aggregation methods, skewness by default, combine the scores, with
    per-message explanations naming the nearest examples. Indexes build from text in one call, resize without re-encoding
    and save locally or to S3, and a numpy-only harness compares aggregators and settings on labeled data. Roblox credits
    it with about 1,200 reports to NCMEC in the first half of 2025.'
  relative_to: hasher-matcher-actioner
  relation: at
  confidence: low
  note: 'Like Hasher-Matcher-Actioner, Sentinel does one detection job and hands what it finds to human reviewers: HMA recognizes
    copies of media already flagged, and Sentinel finds patterns across a user''s messages that no single message reveals.
    Sentinel is a library with no service or review screen, so the two sit level.'
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://cdn.jsdelivr.net/gh/facebook/ThreatExchange@main/hasher-matcher-actioner/README.md
      shows: 'The peer''s README still calls HMA "a reference implementation for a key Trust and Safety content moderation
        capability: copy detection", matching new content against "Banks" of known content, and says "HMA can be used as a
        library, or in any deployment setup that can use docker". The digest matches the one hasher-matcher-actioner records
        from 2026-10-13.'
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: e0c47dad67c0f9561fff3c7231990372160606c3f9cbec3998d6c26c5739fb16
  last_verified: '2026-10-19'
  sources:
  - url: https://raw.githubusercontent.com/Roblox/Sentinel/main/README.md
    shows: The README describes "realtime detection of extremely rare classes of text by using contrastive learning principles",
      scoring observations "using embedding similarity" and aggregating "using statistical measures like skewness". It documents
      from_texts(), subsample(), the sentinel.simulation harness, per-text explanations, and local or "s3://" index storage.
    accessed: '2026-10-19'
