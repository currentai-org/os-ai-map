capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: one optimization family, applied broadly'
  value: Quantized attention kernels for one operator family across Ampere, Ada, Hopper and Blackwell NVIDIA
    GPUs, applied as a plug-in replacement.
  relative_to: tensorrt
  relation: one_below
  confidence: medium
  note: SageAttention replaces the attention operator with quantized 8-bit and INT4 kernels, with SageAttention3
    adding microscaling FP4 kernels for Blackwell, applied as a drop-in substitution across language, image
    and video models. It is one operator family across four GPU architectures, which places it one step
    below TensorRT.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/thu-ml/SageAttention/main/README.md
    shows: README lists "Optmized kernels for **Ampere, Ada and Hopper GPUs.**" and "INT8 quantization and
      smoothing for $QK^\top$ with support for varying granularities." and "Support `torch.compile` with
      non-cudagraphs mode and distributed inference."
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 0cc6662bcf49645b10524f51de5178ab9d83946ae89bfa502a1f16c742bd74ac
