capability:
  score: 3
  basis: feature_matrix
  basis_detail: isolation mechanism and scope read from the README, compared with Sandbox Runtime
  value: isolation:Linux namespaces (a fresh mount namespace on a hidden tmpfs, plus optional user, PID, IPC, network
    and UTS namespaces) with caller-supplied seccomp filters, no kernel or VM boundary; policy:none built in, set
    entirely by the caller's arguments; runtime breadth:any Linux process; platform:Linux only; scale:single-host
    command-line tool, no fleet or managed mode
  relative_to: sandbox-runtime
  relation: at
  confidence: medium
  note: bubblewrap isolates a process with Linux namespaces and optional seccomp filters, a boundary that shares
    the host kernel, unlike a microVM or gVisor. Its protection depends entirely on the arguments it is given, which
    places it level with Sandbox Runtime, a ready-made policy layer built on bubblewrap on Linux.
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://cdn.jsdelivr.net/gh/anthropics/sandbox-runtime/README.md
      shows: The Sandbox Runtime README describes "native OS sandboxing primitives (`sandbox-exec` on macOS, `bubblewrap`
        on Linux)" plus "proxy-based network filtering", so its Linux isolation is bubblewrap's, with filesystem
        and network policy layered on top.
      accessed: '2026-10-13'
