capability:
  score: 4
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Configurable training path; one model accepting several satellite sensors (Sentinel-2, Landsat,
    Sentinel-1 radar, NAIP, LINZ and MODIS) with ground resolution from under 0.5 m to 500 m; no documented
    scientific generation.
  relative_to: terramind
  relation: at
  confidence: high
  note: Clay documents a configurable training path and takes inputs from several satellite sensors whose
    ground resolution runs from under half a meter to 500 meters, with position encoding scaled to each
    input's resolution. Fine-tuning for generative tasks appears only as a possible downstream use, and
    no generated scientific output is documented, so generation is not counted. It sits level with TerraMind.
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/Clay-foundation/model/main/README.md
    shows: Trains with "python trainer.py fit --model ClayMAEModule --data ClayDataModule --config configs/config.yaml".
