capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: full-text search and session context scoped to the current project; exact-duplicate suppression and topic-key
    upserts that update a memory in place; memories written by the agent rather than extracted; review dates that
    flag stale memories without retiring them; one typed observation store
  confidence: medium
  note: Engram serves saved memories back by project and keeps them tidy on its own, folding repeated saves into
    one record and updating a topic in place. What to remember is written by the agent rather than extracted by
    Engram, and overdue memories are flagged for review rather than retired.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/Gentleman-Programming/engram/main/README.md
    shows: The agent contract says to "Save significant knowledge deliberately" with mem_save and to search with
      mem_search and mem_context; consolidation of observations runs after preview and explicit confirmation.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 8d559f460ff7bc9d0256ffe6486ddbcf85a2c7a47dd0d0d074d38367ed3dbc85
  - url: https://raw.githubusercontent.com/Gentleman-Programming/engram/main/docs/ARCHITECTURE.md
    shows: A topic_key turns mem_save into an upsert of the existing memory; exact dedupe prevents repeated inserts
      in a rolling window; "Overdue memories remain searchable" with state needs_review, and "Hard expiry remains
      deferred."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 13e450afe1a32640348cf56c9275caa70d25698dbfa2e1a323f31caec1431d96
