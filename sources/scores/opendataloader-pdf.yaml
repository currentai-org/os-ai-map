capability:
  score: 4
  basis: feature_matrix
  value: PDF to Markdown, HTML and JSON with bounding boxes and element types; XY-Cut++ reading order; heading hierarchy,
    lists and simple tables locally; borderless tables, OCR in 80+ languages, LaTeX formulas and chart descriptions in
    hybrid mode; auto-tagging to Tagged PDF; PDF input only
  confidence: high
  relative_to: docling
  relation: one_below
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/docling-project/docling/main/README.md
      shows: The Docling README still lists "Advanced PDF understanding incl. page layout, reading order, table structure,
        code, formulas, image classification", export to Markdown, HTML and lossless JSON, chart understanding, and links
        an information-extraction example for user-defined fields. OpenDataLoader PDF recovers the same structure but
        returns no fields a user defines, which keeps it a step below.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 2ad389cb514915804303a6ac60302f06225ecb0a83b723914c03af1747a85a01
  note: OpenDataLoader PDF keeps reading order, headings, lists and tables, and returns each element with its position
    and type. It sits a step below Docling because it returns no fields a user defines, such as an invoice total, and
    it reads PDFs only.
  last_verified: '2026-11-12'
  sources:
