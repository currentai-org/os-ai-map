capability:
  score: 4
  basis: feature_matrix
  value: 'of the Model Context Protocol, version not stated by the product: both roles - "Servers ... Clients
    ..." - the full primitive set (tools, resources, prompts) and managed transport negotiation across the
    standard transports'
  confidence: medium
  note: FastMCP implements both MCP roles and the full primitive set of tools, resources and prompts, managing
    transport negotiation for the caller - matching mcp-python-sdk, into which its 1.0 version was folded.
    What is missing is confirmation of the optional features - sampling, roots and elicitation - and a stated
    spec version, neither of which the documentation confirms.
  last_verified: '2026-09-17'
  sources:
  - url: https://gofastmcp.com/getting-started/welcome
    shows: 'The documentation''s three pillars: "Servers - Expose Python functions, data, and instructions
      as MCP tools, resources, and prompts", "Clients - Connect to any MCP server", and Apps. The overview
      states that "transport negotiation, authentication, and protocol lifecycle are managed for you", and
      the Clients section documents a Transports reference.'
