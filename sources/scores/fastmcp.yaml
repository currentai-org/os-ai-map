capability:
  score: 4
  basis: feature_matrix
  value: 'of the Model Context Protocol, version not stated by the product: both roles - "Servers ... Clients
    ..." - the full primitive set (tools, resources, prompts) and managed transport negotiation across the
    standard transports'
  confidence: medium
  note: 'Both roles, the full primitive set and more than one transport, which is band 4. Banded at mcp-python-sdk:
    FastMCP 1.0 was folded into that SDK and the standalone project covers the same dimensions. Its Apps pillar
    - interactive UIs rendered in the conversation - is surface beyond the specification, and the ladder does
    not read it, because a band here is coverage of the spec rather than of what a framework can do. Band 5
    is out of reach on this evidence rather than on a judgement: it needs the optional features the cited spec
    version defines for the roles implemented - sampling, roots and elicitation - and none of the documentation
    read here enumerates them. Closing that is a documentation read, not a product change. The documentation
    read does not name the specification version it targets, so the band rests on role, primitives and transports
    alone and band 5 is out of reach on the version leg as well as the optional-features one. Establishing
    the version is a documentation read rather than a product question.'
  last_verified: '2026-09-17'
  sources:
  - url: https://gofastmcp.com/getting-started/welcome
    shows: 'The documentation''s three pillars: "Servers - Expose Python functions, data, and instructions
      as MCP tools, resources, and prompts", "Clients - Connect to any MCP server", and Apps. The overview
      states that "transport negotiation, authentication, and protocol lifecycle are managed for you", and
      the Clients section documents a Transports reference.'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: bb0cdb563e5ef5703f5607e576f2c62632ccde5c89223e4004560718bd9f5f78
