capability:
  score: 4
  basis: feature_matrix
  value: class-agnostic foreground segmentation and matting on any image at up to 2K resolution with no
    training, with checkpoints for general use, lite, high-resolution, matting, portrait, camouflaged
    and salient objects, plus training code for new data
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: BiRefNet cuts the main subject out of any photo straight away, with no label set to retrain for,
    which is what places a model on the rung where a user's own images get a prediction directly. It does
    one task, foreground extraction, where Ultralytics spans many.
  comparison:
