capability:
  score: 4
  basis: feature_matrix
  value: terminal coding agent with read, write, edit and bash tools; many model providers with mid-session switching;
    extensions, skills, prompt templates, themes and installable Pi packages; interactive, print/JSON, RPC and TypeScript
    SDK modes; tree-structured, branchable sessions; built-in MCP through codemode; no built-in sub-agents, plan
    mode, permission system or sandbox; no published benchmark result
  confidence: medium
  note: Pi covers the core of a terminal coding agent, with many model providers, branchable sessions, built-in
    MCP and an SDK, and leaves sub-agents, plan mode and permissions to extensions by design. It sits a step below
    OpenHands, which runs agents in a sandboxed runtime and publishes benchmark results, while Pi runs with the
    user's own permissions and has no benchmark of its own.
  relative_to: openhands
  relation: one_below
  comparison:
    last_attested: '2026-10-09'
    sources:
    - url: https://raw.githubusercontent.com/OpenHands/OpenHands/main/README.md
