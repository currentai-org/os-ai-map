capability:
  score: 3
  basis: feature_matrix
  value: elastic training jobs on Kubernetes with workers scaled during a run; node failure detection and replacement;
    checkpoint-based resume so a job survives a failure
  confidence: medium
  relative_to: kubeflow-trainer
  relation: at
  comparison:
    last_attested: '2026-09-16'
    sources:
    - url: https://github.com/kubeflow/trainer
      shows: 'Re-read of the peer this comparison is placed against. kubeflow-trainer still presents as a
        Kubernetes operator whose TrainJob creates a JobSet and leaves placement to the cluster scheduler,
        which is the property the comparison turns on: both products dispatch training work and neither chooses
        the machine, so they sit level.'
      accessed: '2026-09-16'
      http_status: 200
      content_sha256: 5a902f032f3b7074963eccb990b8a69d26d6bf19df7d01f77d138570df6efccb
  note: 'DLRover treats a training run as a first-class job that it schedules, tracks and repairs: it decides
    when workers start, stop and restart, but leaves pod placement to the Kubernetes scheduler. Kubeflow
    Trainer does the same for the same substrate, so the two sit level.'
  last_verified: '2026-09-16'
  sources:
