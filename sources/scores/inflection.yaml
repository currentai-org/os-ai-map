  note: Inflection 3.0 was built for emotional intelligence and productivity rather than leaderboard performance,
    and was never a frontier model even at release. Development halted after Microsoft took most of the
    research team, and no independent benchmark has appeared since, leaving it far behind the 2026 frontier
    models.
