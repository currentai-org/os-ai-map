capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: A registry, retrieval aggregator and identity provider that send a query to data sources running on their
    owners' own Syft Space nodes and return only the matching passages; the nodes are a separate product each data
    owner deploys.
  confidence: medium
  note: SyftHub runs the coordinating side of federated retrieval itself. It lists data sources, issues short-lived
    tokens that each source checks on its own, and sends a question to every source where its data lives. The sources
    run as Syft Space nodes that their owners deploy separately, so SyftHub on its own covers one side of the federation,
    a step short of PySyft, which runs both.
  relative_to: pysyft
  relation: one_below
  comparison:
    last_attested: '2026-10-27'
    sources:
    - url: https://raw.githubusercontent.com/OpenMined/PySyft/dev/README.md
      shows: 'README: computations "are reviewed and run by data owners on private data"; "Data owners must approve each
        collaborator before any data flows"; an Enclaves package ships beside it; peers communicate "through cloud storage
        their organizations already use".'
