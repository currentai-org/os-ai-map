  score: 2
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: An SDK that loads data-source services from a network, queries each on its owner's infrastructure,
    returns only relevant snippets and has an LLM synthesize them; the federation itself runs on the separate
    SyftBox runtime.
  confidence: medium
  note: 'SyftHub federates retrieval: each source is queried where it lives and only snippets leave it,
    which nothing else on the map does. The SDK leaves the federation itself to SyftBox, which users install
    separately, so it sits two steps below PySyft, the OpenMined runtime it builds on.'
  relative_to: pysyft
