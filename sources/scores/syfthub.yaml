capability:
  score: 2
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: An SDK that loads data-source services from a network, queries each on its owner's infrastructure,
    returns only relevant snippets and has an LLM synthesize them; the federation itself runs on the separate
    SyftBox runtime.
  confidence: medium
  note: 'SyftHub federates retrieval rather than training: each source is queried where it lives and only
    snippets leave it. The SDK leaves the federation runtime to SyftBox, which it asks users to install
    and run separately, so it sits two rungs below PySyft, the OpenMined runtime it builds on. Nothing else
    on the map does federated RAG.'
  relative_to: pysyft
  relation: two_below
  last_verified: '2026-09-27'
