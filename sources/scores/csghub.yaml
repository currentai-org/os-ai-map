  value: upload and download by web UI, git, CLI and SDK; models, datasets, code, prompt and MCP repositories
    and application Spaces; Git with LFS for versioning and history; REST API compatible with Hugging Face
    clients; search; sync from remote hubs
  confidence: high
  relative_to: huggingface-hub-platform
  relation: at
  note: 'CSGHub reproduces the Hugging Face Hub model inside a private deployment: users publish models, datasets
    and app Spaces as Git repositories with LFS, keep their history, and pull them with Hugging Face''s own
    libraries. It adds prompt, code and MCP repositories, so its registry covers at least as many kinds of
    artifact as Hugging Face Hub.'
