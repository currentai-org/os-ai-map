capability:
  score: 2
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Generation-time watermarking and detection for about two dozen published text-watermark methods behind
    one interface, with mechanism visualizations and detection, robustness and quality pipelines. Most detectors
    take the hash key set at generation; UPV detects with a separate detector network instead.
  relative_to: synthid-text
  relation: at
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/google-deepmind/synthid-text/main/README.md
      shows: 'SynthID Text''s README: a Frequentist detector "which requires no training" or a Bayesian detector
        that requires training, and watermarks that depend on "the secret `key: int`" set in the configuration.'
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 4601bb5c928d211f84e48af0242bf74ad955e4fe1407074915b965b5201e73b0
  confidence: medium
  note: A MarkLLM watermark is checked by running the toolkit's detector with the key the generator used, so an
    outsider who lacks the key takes the operator's word, as with SynthID-Text. UPV, one method among many, lets
    anyone holding its detector network check a mark; the toolkit's usual output is still a detection score that
    only the key holder can reproduce.
  last_verified: '2026-11-12'
  sources:
  - url: https://raw.githubusercontent.com/THU-BPM/MarkLLM/main/README.md
    shows: The supported-algorithm table (KGW, Unigram, SWEET, UPV, EWD, SIR, X-SIR, DiPmark, Unbiased, TS, SynthID-Text,
      PF, MorphMark, SemStamp and others), the visualization tools, and "12 evaluation tools that cover detectability,
      robustness, and impact on text quality".
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: f9f5219d9e0e4e7e77ca68af6cbbdf91b44f25720bc77396c70bffbefaffb9de
