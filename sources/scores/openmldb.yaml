capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: SQL-defined feature computation shared between an offline batch engine and an online low-latency serving
    engine, deployed as a distributed, highly-available cluster with its own storage and query layer.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: OpenMLDB is a complete, highly available distributed database that computes SQL-defined features
    consistently across offline batch and online serving, with its own persistence and replication. It retrieves
    and computes features rather than hosting ranking or embedding models inside a serving path, which is
    what Vespa does and what keeps OpenMLDB one step below it.
