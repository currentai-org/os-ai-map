adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: 'Banded on the downloads of the declared client SDK: where a server has no countable channel of
    its own, its client''s downloads are the best available usage signal, and this product declares pymilvus
    on exactly that basis. The registry reports 5,976,463 downloads in the last month (1,484,328 in the
    last week, 241,978 in the last day), which lands in 1M-10M on the software scale. Qdrant is treated
    the same way, being the same shape of product and banded on qdrant-client. Milvus is the default open
    source engine for billion-scale semantic search and an LF AI & Data graduate, but the band rests on
    the count rather than on that description. Zilliz publishes no server-side deployment figure, and the
    repository''s 45,627 stars are a different instrument that cannot be read as usage volume.'
  last_verified: '2026-08-14'
