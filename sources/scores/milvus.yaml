adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: 'RE-BANDED 2026-08-14 from 3/reported_traction to 4/usage_volume, and the instrument moved with the
    level. The ruling of 2026-08-14 settles the question the 2026-08-13 pass raised and left open - where a
    server has no other countable channel, its own client SDK''s downloads band it. The product declares
    pymilvus with an artifact_exception saying in terms that "the client''s downloads are the best available
    usage signal for the server", and the pypistats API answers last_month = 5,976,463 downloads (last_week
    1,484,328, last_day 241,978), which lands in 1M-10M on the software scale in sources/rubrics/software.yaml.
    This also removes the inconsistency with qdrant, the same product shape carrying the same
    client-not-server artifact_exception, which has been banded on qdrant-client as usage_volume all along.
    Milvus is still the default open source engine for billion-scale semantic search and an LF AI & Data
    graduate; what changed is that the record now bands on a count rather than on that description. Zilliz
    still publishes no server-side deployment figure, and the repo''s 45,627 stars remain a different
    instrument that may not be banded as usage volume.'
