adoption:
  level: 3
  reach: 100K-1M
  signal_type: usage_volume
  confidence: medium
  banded_quantity: Docker Hub pulls of the milvusdb/milvus server image averaged over the image's lifetime, a
    floor for a growing product; pymilvus downloads count the client and are not banded
  note: Milvus is a server, and it runs mostly as a self-hosted Docker or Kubernetes deployment. Its Python
    client, pymilvus, is downloaded by every application that talks to a cluster, so it counts client installs
    rather than deployments and is left out. The score comes from Docker Hub pulls of the server image averaged over the image's lifetime, so for a product still growing it is a floor rather than a
    ceiling. Zilliz's own round figure for Docker pulls runs higher than the registry's count and does not
    say what it adds.
