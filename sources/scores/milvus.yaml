capability:
  score: 4
  basis: benchmark
  basis_detail: ANN-Benchmarks inclusion, with the first-party VDB Bench harness beside it
  value: Fully distributed deployment with compute and storage separated, index selection spanning HNSW,
    IVF_SQ8, IVF_PQ and DiskANN to billion scale, and BM25 full-text search beside dense vector search.
  relative_to: vespa
  relation: one_below
  confidence: high
  note: 'A complete, durable, cluster-capable retrieval system, which is the 4 rung on the storage feature
    matrix, which bands on how much of the persist-index-retrieve path a product provides itself, at what
    scale and over how many retrieval modes. One band below vespa: Milvus scales horizontally with compute
    and storage separated and combines dense vector search with BM25 full text, but the 5 rung is for a
    platform that hosts and evaluates ranking or embedding models inside the serving path, and the recorded
    evidence for Milvus does not show that. Independent ANN-Benchmarks coverage and the first-party VDB
    Bench harness are what keep the basis a benchmark rather than a feature read. Rebanded on this matrix
    when the product moved out of agent_tools_protocols, where it had been the anchor for a three-product
    vector-database cluster; the band did not move.'
  last_verified: '2026-08-18'
  sources:
