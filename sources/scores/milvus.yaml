capability:
  score: 4
  basis: benchmark
  basis_detail: ANN-Benchmarks inclusion, with the first-party VDB Bench harness beside it
  value: Fully distributed deployment with compute and storage separated, index selection spanning HNSW,
    IVF_SQ8, IVF_PQ and DiskANN to billion scale, and BM25 full-text search beside dense vector search.
  relative_to: vespa
  relation: one_below
  confidence: high
  note: Milvus is a complete, durable, cluster-capable retrieval system that scales horizontally with compute
    and storage separated, combining dense vector search with BM25 full-text search. It is one step behind
    Vespa, which also hosts and evaluates ranking or embedding models inside its serving path, something
    the evidence for Milvus does not show.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/milvus-io/milvus/master/README.md
    shows: README says Milvus has a "fully-distributed and K8s-native architecture" that can scale horizontally
      and handle "billions of vectors", offers index types including "HNSW, IVF, FLAT (brute-force), SCANN,
      and DiskANN", and supports "full text search" with BM25.
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 8fedcdc9023fcd061a54405bf0d83afb4516c7ec053b2efd22476473ce10153f
  - url: https://milvus.io/docs/architecture_overview.md
