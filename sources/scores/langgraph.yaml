      detail: the Agent Server runtime ships as the closed Elastic-2.0 langgraph-api package and self-hosting
        it needs LANGGRAPH_CLOUD_LICENSE_KEY
  confidence: high
  note: 'LangGraph''s core is MIT-licensed and self-hostable, but the Agent Server runtime that serves it
    is not: it ships as the closed-source, Elastic-2.0-licensed langgraph-api package, and self-hosting
    it requires a LangGraph Cloud license key that phones home for verification. That withheld runtime is
    what makes LangGraph open core rather than fully open, unlike LangChain, which publishes everything
    it ships.'
  last_verified: '2026-08-11'
