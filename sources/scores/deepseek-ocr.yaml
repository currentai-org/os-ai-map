  class: open_weights
  components:
    license:
    - name: MIT
      detail: OSI; the LICENSE body reads MIT License, Copyright (c) 2025 DeepSeek, and the Hugging Face card
        declares mit
    weights:
      value: open
      detail: downloadable from Hugging Face without a gate
    data:
      value: closed
      detail: the training corpus is neither published nor described
    code:
      value: closed
      detail: inference code is published; no training or data-construction pipeline is
  confidence: high
  note: MIT on both the code and the weights, and the band is 3 rather than 5 because openness here is about
    the recipe and not only the licence. The weights download without a gate and the inference code is public;
    the training corpus and the pipeline that built it are not, so the ladder's data-and-code rung is not reached
    and it lands on the fallthrough - open weights, closed recipe. A permissive licence does not substitute
    for a published recipe, which is the whole reason the model ladder checks weights and data before it checks
    the licence.
