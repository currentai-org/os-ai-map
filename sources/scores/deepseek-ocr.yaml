capability:
  score: 3
  basis: feature_matrix
  value: page image to linearised markdown-like text via optical context compression; a research release demonstrating
    vision-token compression rather than a document pipeline
  confidence: medium
  relative_to: tesseract
  relation: at
  note: Band 3, and the adoption figure is not the reason. What it emits is linearised text from a page image;
    it does not recover tables, forms or reading order into a structured format the way the converters above
    it do, and it ships no pipeline around the model. Banded at tesseract - both turn an image into text and
    leave the structure to whatever consumes it.
