capability:
  score: 1
  basis: benchmark
  basis_detail: GLUE, SuperGLUE, SQuAD and RACE results in the 2019 paper and fairseq README
  value: 'roberta.large: GLUE dev MNLI 90.2, SST-2 96.4 and CoLA 68.0, SQuAD 2.0 dev F1 89.4 and RACE
    test accuracy 83.2, state of the art on GLUE, RACE and SQuAD at release in 2019 (arXiv:1907.11692).
    A 355M-parameter encoder that does not generate text.'
  relative_to: comma
  relation: one_below
  confidence: high
  note: RoBERTa showed that BERT had been undertrained and, retrained carefully, matched or beat every
    model published after it in 2019, but it is an encoder of at most 355M parameters that cannot generate
    text. It sits a step below Comma, a 7B model that only matches 2023-era peers.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/common-pile/comma-v0.1-2t/raw/main/README.md
