  note: 'No download metric exists for the channels this server actually ships through: a Go binary, a Docker
    image and GitHub''s own hosted remote endpoint, none of which publishes a count, and there is no npm or
    PyPI package to read. Stars are therefore forced rather than chosen as the signal - 32,220 stargazers on
    the one declared repository, which bands at >10K stars, level 3, though first-party backing implies real
    usage well above that. The page the count comes from carries a live star counter, so its content will differ
    on any later fetch; that is expected drift on this source rather than a signal about the claim.'
