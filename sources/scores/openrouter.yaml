  note: 'The quantity banded here is the vendor''s own "global users" tile on the OpenRouter homepage, which
    reads 10M+ and clears the >10M threshold the top band needs. The same tiles read 200T+ monthly tokens,
    80+ providers and 500+ models. Token volume is corroborated externally at roughly 25T tokens a week,
    a run-rate near 1.5 quadrillion a year, per Menlo, and by TechCrunch on the $1.3B valuation and $113M
    raise. Two caveats on the instrument: the unit is a vendor-reported user count rather than the package
    downloads this scale is usually denominated in, though the label is the top band either way; and OpenRouter
