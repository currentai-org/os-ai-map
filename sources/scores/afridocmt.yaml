capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for African document translation data
  value: AfriDocMT holds 605 health and IT news documents translated by people from English into five African
    languages, split into 10,000 English sentences per domain, each translated into all five; no total in sentence
    pairs is stated. It is documented in a paper, with no use found beyond that paper's experiments.
  confidence: medium
  note: AfriDocMT gives five African languages whole health and IT news documents translated by people from
    English, documented in a paper, though no model or benchmark beyond its own experiments is built on it.
    Counted as sentence pairs it is minute beside the billions in the largest parallel collections, and far
    smaller than the IIT Bombay English-Hindi corpus for one pair.
  relative_to: iitb-english-hindi
  relation: one_below
