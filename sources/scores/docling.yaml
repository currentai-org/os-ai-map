capability:
  score: 4
  basis: feature_matrix
  value: parses PDF/DOCX/PPTX/XLSX/HTML/EPUB/ODF/Apple Pages/WAV/MP3/WebVTT/email/images/LaTeX and video
    -> Markdown/HTML/WebVTT/DocLang/DocTags/lossless JSON; layout + reading-order; table-structure recognition;
    formula/code extraction; image classification; chart understanding; OCR; VLM and ASR models; application-specific
    XML schemas (DocLang, USPTO patents, JATS, XBRL); MCP server; template-driven field extraction (PDF/images)
  confidence: high
  note: Docling parses PDF, Office, HTML, EPUB, audio, video and image inputs into Markdown, HTML or lossless
    JSON with layout, reading order and table structure preserved. Its extractor also returns fields a user
    defines in a dictionary or Pydantic template, such as a bill number and total, though only from PDFs
    and images.
  sources:
  - url: https://raw.githubusercontent.com/docling-project/docling/main/README.md
    shows: 'The raw README feature list: "Advanced PDF understanding incl. page layout, reading order, table
      structure, code, formulas, image classification, and more", export to "Markdown, HTML, WebVTT, DocLang",
      "Extensive OCR support for scanned PDFs and images", "Audio support with Automatic Speech Recognition
      (ASR) models", "Parsing of video files (MP4, AVI, MOV, MKV, and WebM)", "Parsing of ODF (OpenDocument
      Format) files" and "Chart understanding (Barchart, Piechart, LinePlot)".'
    accessed: '2026-09-28'
