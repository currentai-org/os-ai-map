  confidence: high
  note: 'Docling parses the widest range of input formats in the category - PDF, DOCX, PPTX, XLSX, HTML,
    EPUB, audio and images - into Markdown, HTML or lossless JSON with layout and reading order preserved.
    It recovers structure faithfully but assigns no meaning to it: extracting typed entities or running
    models trained on a customer''s own document types are capabilities it lacks.'
