capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: SFT, DPO (preference), RFT (model-grader reward signals) across the gpt-4o/gpt-4.1/o4-mini/gpt-5
    frontier line, plus preview SFT on Ministral/Qwen/Llama/gpt-oss. Managed end-to-end (data validation,
    per-epoch checkpoints, auto-deploy); Standard/Global/Developer training tiers.'
  confidence: medium
  note: 'Strong managed method coverage over frontier closed base models, plus an open-model preview lane:
    supervised fine-tuning, DPO preference tuning and reinforcement fine-tuning with model-grader reward
    signals across the gpt-4o, gpt-4.1, o4-mini and gpt-5 line, with data validation, per-epoch checkpoints
    and auto-deploy, on Standard, Global and Developer training tiers. It is a black box -- no parallelism,
    precision or scale controls, and no training benchmark behind it -- and it sits level with the OpenAI
    fine-tuning API it wraps. It stops short of the top band because the user cannot control training internals
    or scale.'
  last_verified: '2026-08-09'
  sources:
