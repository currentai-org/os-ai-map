capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: SFT, DPO (preference), RFT (model-grader reward signals) across the gpt-4o/gpt-4.1/o4-mini/gpt-5
    frontier line, plus preview SFT on Ministral/Qwen/Llama/gpt-oss. Managed end-to-end (data validation,
    per-epoch checkpoints, auto-deploy); Standard/Global/Developer training tiers.'
  confidence: medium
  note: Azure OpenAI Fine-Tuning offers supervised and preference tuning on OpenAI models such as gpt-4o,
    reinforcement fine-tuning on o4-mini, and supervised tuning of open-weight models such as Llama and
    Qwen, but exposes only batch size, learning rate and epoch count as settings. That gives it managed
    breadth rather than the deeper control over parallelism and precision that a training framework offers.
  last_verified: '2026-09-28'
  sources:
  - url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning
    shows: 'Supported-models table lists gpt-4o with methods "SFT, DPO" and o4-mini with "RFT" (gpt-5 RFT
      "gated and available by invitation only"), plus SFT on four open-weight models. The only tunable hyperparameters
      are batch_size, learning_rate_multiplier and n_epochs; searched the body for parallelism, precision,
      GPU, fp16 and bf16: none found.'
    accessed: '2026-09-28'
