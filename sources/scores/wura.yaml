  basis_detail: coverage and downstream use for African-language pretraining text
  value: Audited mC4 text and crawled news in 16 African languages plus four others, about 49 GB of whole documents,
    documented in an EMNLP paper, and used to pretrain the AfriTeVa V2 models.
  confidence: medium
  note: WURA is a documented web corpus for 16 African languages whose builders audited mC4 by hand and added
    verified news, and the AfriTeVa V2 models are pretrained on it. It is crawled text rather than new writing,
    and several languages have only tens of thousands of documents.
