adoption:
  level: 2
  reach: 10K-100K
  signal_type: usage_volume
  confidence: medium
  note: Adoption is the trailing month of downloads of the two official SDKs, @ucp-js/sdk on npm and ucp-sdk on PyPI,
    which the getting-started guide installs to build a UCP server. Businesses that implement the published schemas without
    an SDK are not counted, nor are four days npm left blank, so the figure is a lower bound on use.
  sources:
  - url: https://api.npmjs.org/downloads/point/last-month/@ucp-js/sdk
    shows: 'npm downloads point API: 50,951 downloads for @ucp-js/sdk over 2026-09-17 to 2026-10-16.'
