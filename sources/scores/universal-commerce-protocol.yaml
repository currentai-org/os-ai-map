capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: UCP is a specification, defining commerce capabilities and extensions that businesses implement and platforms
    call, so like the Agent2Agent Protocol and AG-UI it has nothing to be measured against. Neither the repository README
    nor the project site publishes a benchmark, leaderboard or performance figure for the protocol.
  last_verified: '2026-10-19'
  sources:
  - url: https://raw.githubusercontent.com/universal-commerce-protocol/ucp/main/README.md
    shows: The README says UCP defines Capabilities such as Checkout or Identity Linking that businesses implement, with
      Extensions layered on top, and that businesses "declare their supported Capabilities in a standardized profile"
      and can offer them "via REST APIs, MCP (Model Context Protocol), or A2A". Searched the body for benchmark, leaderboard,
      latency, throughput and performance, and found none of them.
    accessed: '2026-10-19'
    http_status: 200
    content_sha256: 89ab81903c30c956efa661c42f4768a7ee8d88e793390912337817cc348acb30
  - url: https://ucp.dev
    shows: The project site describes UCP as "The common language for platforms, agents, and businesses" and lists its
      capabilities as catalog, cart, checkout, identity linking and order. Searched the body for benchmark, leaderboard,
      latency and throughput, and found none of them.
    accessed: '2026-10-19'
    http_status: 200
    content_sha256: c6c8dc444fe2078842e04debd008e0e43529d80f83e81c8d4315113942c99edc
