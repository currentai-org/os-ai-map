capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: LLM extraction of entities and facts from messages and business data; duplicate merging and invalidation
    of contradicted facts; bi-temporal fact validity and retention policies that delete idle context; user graphs
    with facts, entities, episodes, observations and thread summaries; a Context Block retrieved per user and thread
  confidence: medium
  note: Zep extracts facts from each user's messages and business data, merges duplicates, invalidates facts that
    newer information contradicts and returns a prompt-ready Context Block for the next turn. It runs on the same
    temporal graph design as Graphiti and adds per-user observations, summaries and retention policies as a hosted
    service.
  last_verified: '2026-11-20'
  sources:
  - url: https://help.getzep.com/v4/how-graph-creation-works.md
    shows: An "LLM-driven pipeline" extracts entities and facts from each episode; when resolving facts, "duplicates
      merge, and contradictions invalidate older facts"; observations and thread summaries are derived over time.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 3f7ff743d7d8d652b79879f464cebf71148048b48b2fc11077c1c868a890d105
  - url: https://help.getzep.com/v4/facts.md
    shows: Each fact carries valid_at, invalid_at and expired_at timestamps, and Zep "attempts to invalidate" a
      fact that newer data contradicts.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 710199f0d884c95fecd67efdfc59ef0f577112f3d22e233c76a57c4217f3824d
  - url: https://help.getzep.com/v4/agent-memory-solution.md
    shows: '"A Zep user owns a user Context Graph. Threads group conversations for that user"; "thread.get_context"
      retrieves a Context Block for the next model request.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: d4112a833a459e5ac6c243a6c366776d33171131a0c71eccc0bda6dc06b678a3
  - url: https://help.getzep.com/v4/context-retention.md
