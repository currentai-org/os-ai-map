capability:
  score: 3
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 3 of 5, provisional and count-based: the median corroborated band over its target languages,
    14 of 14 measured, across 1 task. Face value 3; best original band 3.'
  confidence: medium
  note: In each of its 14 target languages, IndicIFEval has between 440 and 490 translated prompts that native speakers
    marked correct, and those are the items that count toward depth. Its model-generated prompts were checked as
    well, but generated items do not count. An item count says how much a set can test, not how precisely it ranks
    models.
  last_verified: '2026-11-17'
  sources:
  - url: https://arxiv.org/pdf/2602.22125
    shows: '"We use Sarvam-Translate (Sarvam, 2025) for the translations"; "In total, we arrive at 490 from the
      original 541 examples"; "We use Gemini-2.5 (Comanici et al., 2025) to generate a user prompt based on the
      provided context"; "we implement a human-in-the-loop verification process for both INDICIFEVAL-TRANS and INDICIFEVAL-GROUND
      subsets. We employ qualified, native speakers for each of the target languages as the annotators"; "For every
      prompt, annotators assessed three aspects"; Table 7, correct translations of 490: Assamese 440, Bengali 454,
      Gujarati 482, Hindi 487, Kannada 457, Malayalam 490, Marathi 483, Nepali 468, Odia 473, Punjabi 474, Sanskrit
      450, Tamil 489, Telugu 488, Urdu 486; "our annotations were produced by a single annotator".'
    accessed: '2026-11-17'
    http_status: 200
    content_sha256: 59772b5b10492168eec64da8e52c82530bc5c0accc56276e4dec5a23a91f6c3b
  - url: https://huggingface.co/datasets/ai4bharat/IndicIFEval/raw/main/README.md
    shows: '"For indicifeval-trans, every row carries exactly one of correct/incorrect (human translation-quality
      verdict)"; "To reproduce paper-reported numbers, filter to rows tagged correct"; IndicIFEval-Ground: "Synthetically
      generated instructions grounded in native Indic topics and content, manually verified by native speakers".'
    accessed: '2026-11-17'
    http_status: 200
    content_sha256: 52e84d1ce1b5121ca461e1a4845fe4b6ef76606c9cec6b60d12d2bef0bca31fb
