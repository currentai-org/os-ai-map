capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: strict, historical, associative and world-grounded recall scoped to tenant, user and project; rule-based
    extraction of entities, claims, preferences and procedures at ingest; consolidation of repeated episodes into
    semantic, procedural and reflective memories, with supersede and contradict edges; bitemporal validity that
    closes superseded facts, plus decay; typed episodic, semantic and procedural facets over an entity graph
  confidence: medium
  note: LongMemory performs every part of the cycle itself, including retiring a fact once a later statement supersedes
    it and keeping the old one for historical questions. Its extraction is rule-based rather than model-driven,
    which keeps ingest deterministic but reads less from a conversation than the language-model pipelines of Memori
    or ReMe.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/CaviraOSS/LongMemory/main/README.md
    shows: 'The README lists "Temporal truth: recorded time and valid time are separate", "Lifecycle: deterministic
      decay, explicit reinforcement, consolidation, compression, and reconsolidation" and strict, historical, associative
      and world-grounded recall modes.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 9e8a8b28039b9ace327738bad86316717466e1a4ec8745a98e9fdfc23f8c69c0
  - url: https://raw.githubusercontent.com/CaviraOSS/LongMemory/main/docs/ingest.md
    shows: Ingest step 3 parses "entities, claims, preferences, actions, procedures, emotions, reflections"; a changed
      preference creates "new --supersedes--> old" and "The handler closes the old valid-time and marks it superseded."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 7c10a3154faab1ef53692669c3fdfb7356ada8c0bd08f5fec3ac2241825e6835
  - url: https://raw.githubusercontent.com/CaviraOSS/LongMemory/main/docs/consolidation.md
    shows: Consolidation "converts clusters of raw episodic memories into higher-order semantic, procedural, reflective,
      or corrected grounded memories", linking each to its sources.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: bae72b72b739f38d5cfd2e2372b14536a50a3fc66a2fc53e0456ede4187e960f
  - url: https://raw.githubusercontent.com/CaviraOSS/LongMemory/main/docs/temporal.md
    shows: Every durable fact is stored bitemporally; strict recall "uses only current truth, so superseded facts
      are excluded", while historical recall can still reach them.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 3b122defa9f18af52ca7f2c8f829259e2e065254c5a24ae15f133433b273763f
