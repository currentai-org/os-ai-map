capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Sequence with optional MSAs, templates, embeddings and experimental restraints as inputs; no adaptation pathway, no design surface, one scale.
  relative_to: prithvi-eo
  relation: two_below
  confidence: high
  note: One attribute. Restraints are the genuinely distinctive input here and they count toward the same one - they widen what can be fed in, not what the model can be turned into, and the five sample predictions the CLI emits are samples of a prediction rather than generated designs.
  last_verified: '2026-09-10'
