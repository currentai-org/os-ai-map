capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Sequence with optional MSAs, templates, embeddings and experimental restraints as inputs; no adaptation pathway, no design surface, one scale.
  relative_to: prithvi-eo
  relation: two_below
  confidence: high
  note: Chai-1 takes sequence with optional MSAs, templates, embeddings and experimental restraints; the
    restraints widen what can be fed in rather than what the model can be adapted to do. The CLI emits five
    sample predictions of a complex, which are samples of a prediction rather than generated designs, and
    no training or fine-tuning entry point is documented.
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/chaidiscovery/chai-lab/main/README.md
    shows: '"Chai-1 uniquely offers the ability to fold complexes with user-specified" restraints as inputs;
      "This allows users to specify their own templates, MSAs, embeddings, and constraints, including support
      for specifying covalent bonds"; no fine-tuning or training documentation.'
