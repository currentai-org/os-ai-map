capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: MCP Bundles is a packaging format, not a client or server, so it implements no role, primitive or
    transport for the protocol itself. It describes how a server is shipped and installed - zip archives
    containing a local MCP server and a manifest.json, similar in spirit to a Chrome extension or a VS Code
    extension - and its only mention of the protocol is advice telling bundle authors to implement it themselves
    over stdio, a requirement it places on others rather than one it meets.
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/modelcontextprotocol/mcpb/main/README.md
    shows: 'The README: "MCP Bundles (.mcpb) are zip archives containing a local MCP server and a manifest.json
      that describes the server and its capabilities. The format is spiritually similar to Chrome extensions
      (.crx) or VS Code extensions (.vsix), enabling end users to install local MCP servers with a single click."
      It ships "the bundle specification in MANIFEST.md, a CLI tool for creating bundles ... and the code used
      by Claude for macOS and Windows to load and verify MCPB bundles", and carries the DXT-to-MCPB rename
      notice.'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: f0dd6672a09f88f71b0f9ad432185ed34876781aff94db47515648fe2267e01f
