capability:
  score: 4
  basis: feature_matrix
  basis_detail: documented provider coverage, task support and routing policies; placed against fireworks-inference,
    one of the providers it routes to
  value: 'Routes Hub models to 18 providers: Baseten, Cerebras, Cohere, DeepInfra, Fal AI, Featherless AI, Fireworks,
    Groq, HF Inference, Novita, Nscale, OVHcloud AI Endpoints, Public AI, Replicate, Scaleway, Together, WaveSpeedAI
    and Z.ai. Tasks span chat completion (LLM and VLM), feature extraction, text-to-image, text-to-video and speech-to-text.
    Requests pick the fastest provider by default, or the cheapest or a named one by model-id suffix, through an
    OpenAI-compatible endpoint.'
  relative_to: fireworks-inference
  relation: at
  confidence: medium
  note: Inference Providers runs no models itself, but it reaches the fastest specialist hosts, Fireworks among
    them, and can choose between them on each request by speed or price. What it can do is roughly what those providers
    can, so it sits alongside Fireworks rather than above the services it depends on.
