capability:
  score: 4
  basis: feature_matrix
  basis_detail: search and extract modules of the MediaWiki Action API, list=search with generator=search
    and TextExtracts, read from their documentation
  value: '`list=search` returns pages sorted by relevance by default, with titles, highlighted snippets, size, word
    count and timestamp, and selectable ranking profiles; `generator=search` feeds the same results into other modules,
    and TextExtracts'' `prop=extracts&explaintext` returns plain-text page content'
  confidence: medium
  relative_to: ddgs
  relation: at
  note: A search returns pages ranked by relevance with highlighted snippets, and the same query can run as a generator
    so that one call also returns a plain-text extract of each page found. Finding pages and returning their cleaned
    text through one interface puts it level with DDGS. It searches the wiki it is called on rather than the open
    web, which limits what it covers rather than what it does, and it composes no answer.
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://raw.githubusercontent.com/deedy5/ddgs/main/README.md
      shows: 'The DDGS README still documents `text()` returning ranked references aggregated across ten backends
        and `extract()`, "Fetch a URL and extract its content in various formats", taking a `url`: the find-then-fetch
        pairing that its score depends on. No answer-composition function is documented.'
      accessed: '2026-10-13'
      http_status: 200
      content_sha256: 4541f0854142f2c9a939fee7e8bdf3f075d73d3dcd7b52abdeb1c3d564513223
  last_verified: '2026-10-13'
  sources:
  - url: https://en.wikipedia.org/w/api.php?action=paraminfo&modules=query%2Bsearch&helpformat=wikitext&format=json
    shows: 'English Wikipedia''s own description of `list=search`: module "search", source MediaWiki, license
      GPL-2.0-or-later, "Perform a full text search." `srsearch` "Search for page titles or content matching
      this value"; `srsort` default "relevance"; `srqiprofile` ranking profiles including classic, popular_inclinks_pv
      and mlr-1024rs; `srprop` default "size|wordcount|timestamp|snippet". Examples include `action=query&generator=search&gsrsearch=meaning&prop=info`.'
    accessed: '2026-10-13'
