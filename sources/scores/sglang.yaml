capability:
  score: 5
  basis: feature_matrix
  relative_to: vllm
  relation: at
  value: null
  confidence: high
  note: In an independent H100 benchmark on Llama-3.3-70B at FP8, SGLang reached 1,920 tokens per second
    and 112ms to first token, matching vLLM's 1,850 tokens per second and 120ms; vLLM is the broader-purpose
    default, SGLang the stronger choice for shared-prefix workloads. No SGLang MLPerf submission exists,
    so this reading also weighs its feature set, RadixAttention prefix caching, a zero-overhead scheduler,
    prefill-decode disaggregation, speculative decoding and hardware support across NVIDIA, AMD, Intel,
    TPU and Ascend, putting it level with vLLM.
  basis_detail: RadixAttention prefix-KV reuse, zero-overhead CPU scheduler, prefill-decode disaggregation,
    speculative decoding, structured outputs, and broad hardware support (NVIDIA/AMD/Intel/TPU/Ascend),
    corroborated by a 2026 third-party H100 benchmark against vLLM and TensorRT-LLM.
  last_verified: '2026-08-09'
  sources:
