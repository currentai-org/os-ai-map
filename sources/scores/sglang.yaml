capability:
  score: 5
  basis: feature_matrix
  relative_to: vllm
  relation: at
  value: null
  confidence: high
  note: An independent H100 benchmark on Llama-3.3-70B put SGLang and vLLM within a few percent of each
    other on throughput and latency. vLLM remains the broader-purpose default, while SGLang is the stronger
    choice for shared-prefix workloads.
  basis_detail: RadixAttention prefix-KV reuse, zero-overhead CPU scheduler, prefill-decode disaggregation,
    speculative decoding, structured outputs, and broad hardware support (NVIDIA/AMD/Intel/TPU/Ascend),
    corroborated by a 2026 third-party H100 benchmark against vLLM and TensorRT-LLM.
  last_verified: '2026-09-29'
  sources:
  - url: https://www.spheron.network/blog/vllm-vs-tensorrt-llm-vs-sglang-benchmarks/
    shows: 'Benchmark table: vLLM "General use, broad model support" at "1,850 tok/s" and "120 ms"; SGLang
      "Shared-prefix workloads, low latency" at "1,920 tok/s" and "112 ms".'
