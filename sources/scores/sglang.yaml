capability:
  score: 5
  basis: feature_matrix
  relative_to: vllm
  relation: at
  value: null
  confidence: high
  note: An independent H100 benchmark on Llama-3.3-70B at FP8 on a single GPU recorded SGLang at 1,920 tokens
    per second and 112ms to first token, against vLLM's 1,850 tokens per second and 120ms, so SGLang matched
    or slightly exceeded vLLM on that workload, while the same write-up frames vLLM as the broader-purpose
    default and SGLang as strongest for shared-prefix workloads. The two therefore sit level with each other.
    Neither the project's GitHub page nor that write-up records an SGLang MLPerf submission, so the score
    rests on the feature set, RadixAttention prefix-KV reuse, a zero-overhead CPU scheduler, prefill-decode
    disaggregation, speculative decoding, structured outputs and hardware support across NVIDIA, AMD, Intel,
    TPU and Ascend, together with third-party benchmarks, rather than on a standardized suite.
  basis_detail: RadixAttention prefix-KV reuse, zero-overhead CPU scheduler, prefill-decode disaggregation,
    speculative decoding, structured outputs, and broad hardware support (NVIDIA/AMD/Intel/TPU/Ascend),
    corroborated by a 2026 third-party H100 benchmark against vLLM and TensorRT-LLM.
  last_verified: '2026-08-09'
  sources:
