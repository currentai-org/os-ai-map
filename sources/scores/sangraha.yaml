capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indic pretraining text
  value: About 251 billion tokens of pretraining text in 22 Indic languages and English, combining verified
    web, OCR and transcribed text, filtered existing corpora, and machine-translated Wikimedia, documented
    in a paper, with IndicBERT v3 and Pragna-1B trained on it.
  confidence: medium
  note: Sangraha is the largest open pretraining corpus for Indian languages, about twelve times IndicCorp
    v2, and AI4Bharat's IndicBERT v3 models and Soket's Pragna-1B list it as training data. About two thirds
    of its tokens are machine-translated Wikimedia text rather than writing produced in the languages themselves.
  last_verified: '2026-09-24'
  sources:
  - url: https://huggingface.co/datasets/ai4bharat/sangraha
    shows: 'Token table: Verified 64,306.1M, Synthetic 162,707.9M, Unverified 24,307.7M, total 251,321.0M;
      "Models trained or fine-tuned on" lists IndicBERT-v3-270M, Cadence, pragna-1b.'
