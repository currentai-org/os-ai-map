capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: per-call admission at the Gate against the owner's mandate; authority that local code can narrow but not
    widen; passkey human approval bound to the exact action when policy requires it; signed receipts verifiable
    offline; no agent identity of its own, relying on the customer's identity provider
  confidence: medium
  note: EMILIA's Gate checks each protected tool call against the owner's mandate, can hold it for a passkey approval
    bound to that exact action, and signs a receipt anyone can verify offline. It deliberately issues no identity
    for the agent, leaving that to the customer's existing identity provider.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/emiliaprotocol/emilia-protocol/main/README.md
    shows: The README says "EMILIA Gate checks authority before a protected tool runs", "Local code may narrow that
      authority; it cannot invent or widen it", "A policy can require a WebAuthn/passkey decision bound to the exact
      action", "A signed record can be verified offline", and "Keep your existing identity provider".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: f662bba8ec5e2d8eb240120777af7fa891e98f775efee3562ac381deb9e380fc
