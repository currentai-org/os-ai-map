  signal_type: active_users
  confidence: medium
  note: 'Core ML ships as a system framework across iOS, iPadOS, macOS, tvOS, watchOS and visionOS, confirmed
    against Apple''s MLModel availability list, and Apple''s own quarterly earnings call puts the active-device
    installed base at more than 2.5 billion. That bands at >10M users, level 5. The quantity being banded
    is an active device base rather than an active user count: someone with an iPhone and a Mac counts twice,
    and nobody is counted for using Core ML rather than for owning hardware it ships on. It is not a developer
    download count either. The figure clears the band boundary by more than two orders of magnitude, so
    the substitution does not change the level, but the scale requires a substituted quantity to be named.'
