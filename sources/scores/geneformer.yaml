capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Documented pretraining and fine-tuning path; in silico perturbation and reprogramming output shifts
    in cell or gene embeddings, a prediction rather than a generated output; one transcriptomic modality
    and one scale.
  confidence: high
  note: Geneformer documents a pretraining and fine-tuning path. Its in silico perturbation tool reports
    how deleting or overexpressing genes shifts cell or gene embeddings, a deterministic prediction rather
    than a generated cell state, expression profile or distribution. Its long list of downstream tasks is
    one capability rather than several, the three parameter sizes are sizes rather than scales, and gene-level
    and cell-level outputs are one modality.
  last_verified: '2026-11-16'
  sources:
  - url: https://huggingface.co/ctheodoris/Geneformer/raw/main/README.md
    shows: 'Documents pretraining and fine-tuning: "functions for tokenizing and collating data specific
      to single cell transcriptomics, pretraining the model, fine-tuning the model, extracting and plotting
      cell embeddings, and performing in silico pertrubation with either the pretrained or fine-tuned models".
      Applications listed include "in silico reprogramming", "in silico differentiation" and "in silico
      treatment to determine candidate therapeutic targets". Models are pretrained on "human single cell
      transcriptomes" only.'
