capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for massively multilingual pretraining text
  value: Aggregated pretraining text in 511 mostly low-resource languages, drawn from more than 150 existing
    datasets and website crawls, documented source by source in an ACL paper, and used to train the Glot500-m
    model.
  confidence: medium
  note: The Glot corpus reaches more than five hundred mostly low-resource languages, more than any other open
    pretraining corpus here, records the source, collection method and license of each part, and trained its
    builders' Glot encoder, though the public release leaves out sources that cannot be redistributed. It holds
    a few tens of billions of tokens spread over all those languages, a sliver beside English pretraining sets
    such as FineWeb that run to trillions.
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2305.12182
    shows: '"collect and clean Glot500-c, a corpus that covers these 511 languages and allows us to train Glot500-m".'
