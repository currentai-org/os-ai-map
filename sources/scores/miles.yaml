capability:
  score: 4
  basis: feature_matrix
  value: 'Architecture: SGLang rollout paired with Megatron-LM training, plus a PyTorch FSDP2 backend for training
    the HuggingFace implementation as-is; fully asynchronous RL with decoupled rollout and training workers and
    configurable on- and off-policy schedules; TP/PP/EP parallelism; FP8; in-loop weight updates over P2P RDMA at
    trillion-parameter scale (Kimi-K2.6). Frontier-scale RL infrastructure, but a narrower published method catalog
    than verl''s.'
  confidence: medium
  note: Miles runs RL post-training at trillion-parameter scale on a Megatron-LM training backend with SGLang rollout,
    and its async design and P2P RDMA weight transfer are the same class of infrastructure verl provides. It sits
    one band below verl because verl publishes a substantially wider algorithm catalogue (PPO, GRPO, RLOO, ReMax,
    REINFORCE++, GSPO, PRIME, DAPO, DrGRPO plus SFT/DPO) while Miles documents PPO and GRPO; method breadth is what
    separates the top two bands in this category.
  relative_to: verl
  relation: one_below
  comparison:
    last_attested: '2026-08-31'
    sources:
    - url: https://github.com/volcengine/verl
      shows: Key Features still lists reinforcement learning with PPO, GRPO, GSPO, ReMax, REINFORCE++, RLOO, PRIME,
        DAPO and DrGRPO, alongside supervised fine-tuning, over FSDP/FSDP2/Megatron-LM training backends with vLLM,
        SGLang and HF Transformers rollout. That catalogue is still substantially wider than the PPO and GRPO Miles
        documents, which is the spacing this band rests on.
