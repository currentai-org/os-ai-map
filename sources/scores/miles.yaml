capability:
  score: 4
  basis: feature_matrix
  value: 'Architecture: SGLang rollout paired with Megatron-LM training, plus a PyTorch FSDP2 backend for training
    the HuggingFace implementation as-is; fully asynchronous RL with decoupled rollout and training workers and
    configurable on- and off-policy schedules; TP/PP/EP parallelism; FP8; in-loop weight updates over P2P RDMA at
    trillion-parameter scale (Kimi-K2.6). Frontier-scale RL infrastructure, but a narrower published method catalog
    than verl''s.'
  confidence: medium
  note: Miles's asynchronous design and P2P RDMA weight transfer put it in the same infrastructure class
    as verl, at the same trillion-parameter scale. It sits a step below verl because verl publishes a substantially
    wider algorithm catalog, while Miles documents only PPO and GRPO.
  relative_to: verl
  relation: one_below
  comparison:
    last_attested: '2026-08-31'
    sources:
    - url: https://github.com/volcengine/verl
      shows: Key Features still lists reinforcement learning with PPO, GRPO, GSPO, ReMax, REINFORCE++, RLOO,
        PRIME, DAPO and DrGRPO, alongside supervised fine-tuning, over FSDP/FSDP2/Megatron-LM training backends
        with vLLM, SGLang and HF Transformers rollout. That catalog is still substantially wider than the
        PPO and GRPO Miles documents, which is the gap the comparison to verl relies on.
      accessed: '2026-08-31'
