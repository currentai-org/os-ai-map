capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Bangla pretraining text
  value: The corpus holds about 20 billion Bangla tokens in 31 million documents, mostly filtered Common Crawl
    with about a quarter machine-translated or romanized, documented in a card and paper, and only a small
    third-party model lists it as training data.
  confidence: medium
  note: The TituLM corpus is a large, documented Bangla pretraining set, but its sources do not say the TituLLMs
    models were trained on this release, and only a small third-party model lists it. About a quarter of its
    tokens are machine-translated or romanized, and Sangraha, a documented corpus across 22 Indic languages,
    is far larger.
  relative_to: sangraha
  relation: one_below
