  basis_detail: scientific adaptation surface
  value: A construct_finetuning_model call and a downstream-task notebook for adaptation; one model ingests Sentinel-1, Sentinel-2, ERA5, SRTM, and Dynamic World inputs together.
  relative_to: prithvi-eo
  relation: one_below
  confidence: high
  note: Presto documents fine-tuning through a construct_finetuning_model call and a downstream-task notebook,
    and one model ingests Sentinel-1, Sentinel-2, ERA5, SRTM and Dynamic World inputs together. Its encoder-decoder
    reconstructs masked inputs rather than generating outputs, and a variable number of monthly timesteps
    is one temporal scale rather than several.
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/nasaharvest/presto/main/README.md
    shows: Shows "construct_finetuning_model(num_outputs=1, regression=True)" adding a linear head for finetuning
      and a "jupyter notebook" demonstrating finetuning on downstream tasks; timesteps "can be any value
      between 1 and 24 (2 years of data)"; the encoder-decoder returns "reconstructed_x, reconstructed_dynamic_world
      = encoder_decoder(", and the inputs include Dynamic World classes and latitude and longitude.
    accessed: '2026-11-16'
