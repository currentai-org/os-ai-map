  score: 4
  basis: feature_matrix
  value: 'Methods: supervised fine-tuning and preference tuning (DPO-style) for Gemini; multimodal tuning
    across text/document/image/audio/video plus function-calling tuning; checkpoint management.'
  confidence: medium
  note: Vertex AI Tuning offers supervised, preference and reinforcement fine-tuning on Gemini models, with
    continuous tuning, checkpoints and function-calling tuning. Google exposes no controls over parallelism,
    precision or training scale and publishes no training benchmark, so it offers managed breadth rather
    than the deeper control of a training framework such as Megatron-LM.
  last_verified: '2026-11-16'
  sources:
  - url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/tune-models
    shows: 'Methods: "preference tuning builds on supervised fine-tuning by" letting you tune Gemini with
      human feedback data (pairwise chosen vs rejected responses); a "Reinforcement learning fine-tuning"
      section; "Tuning checkpoints let you save tuning progress, compare checkpoint performance"; "Continuous
      tuning lets you continue tuning an already tuned model"; and "Tune function calling". Supervised fine-tuning
      links separate pages for text, image, audio, video and document data types.'
