  value: 'Methods: supervised fine-tuning and preference tuning (DPO-style) for Gemini; multimodal tuning
    across text/document/image/audio/video plus function-calling tuning; checkpoint management.'
  confidence: medium
  note: Vertex AI Tuning offers supervised, preference and preview reinforcement fine-tuning on Gemini models,
    with continuous tuning, checkpoints and function-calling tuning. Google exposes no controls over parallelism,
    precision or training scale and publishes no training benchmark, so it offers managed breadth rather
    than the deeper control of a training framework such as Megatron-LM.
