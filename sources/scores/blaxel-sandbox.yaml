  confidence: medium
  note: 'MIT sandbox API and image hub with a proprietary managed platform. Confirmed `gated` 2026-08-12
    on a named mechanism rather than on the paid tier existing, and it is the firecrawl/composio shape rather
    than the litellm one: nothing is carved out inside the repo, but the piece that makes Blaxel a sandbox
    product is not in any repo. blaxel-ai/sandbox is 419 entries of sandbox-api - the HTTP API running inside
    a sandbox - plus about thirty Dockerfile templates under hub/, and the README calls it "Sandbox Hub
    ... a collection of development environment templates". The scheduler that allocates a micro VM, and
    the perpetual-standby and sub-25ms resume the product is sold on, appear nowhere across all 29 public
    repos in the org, which hold SDKs, plugins and forks of third-party infrastructure. Deliberately not
    decided by analogy with the other three sandbox slugs in this batch: e2b publishes the infra powering
    its cloud and beta9 publishes its whole gateway, and both moved to 5, while this one and tensorlake
    did not.'
