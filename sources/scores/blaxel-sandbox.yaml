capability:
  score: 3
  basis: feature_matrix
  value: isolation:microVM (strong); cold-start:sub-second fresh, sub-25ms resume from standby; runtime
    breadth:agent code execution; persistence:perpetual standby with full FS/memory state; scale:vendor-claimed
    billions of agent requests (unverified)
  confidence: medium
  note: 'Blaxel''s microVMs resume from standby in about 25 milliseconds with full filesystem and memory
    state intact, and the platform adds auto-suspend, batch jobs and self-hosted or VPC deployment options.
    What keeps it a step below the category''s proven microVM platforms is scale: its request-volume claims
    come from the vendor and are not independently verified.'
  last_verified: '2026-09-29'
  sources:
  - url: https://blaxel.ai/sandbox
    shows: The Blaxel sandbox product page says the runtime is built on microVMs, quoting "Every sandbox
      runs in its own microVM with no shared kernel." and "Resume from standby in 25 milliseconds with full
      memory state restored, at any time." and "connect under one second"; it lists batch jobs, volumes
      and static IPs, and its Open-source core block says "sandbox API is fully open-source." without naming
      a license or the control plane.
    accessed: '2026-09-29'
