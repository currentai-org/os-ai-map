openness:
  score: 4
  class: open_core
  components:
    license:
    - name: MIT
      detail: OSI
    source:
      value: public
      detail: sandbox API, self-hostable via Docker Compose
    managed-tier:
      value: Blaxel proprietary perpetual-standby platform
    core-gated:
      value: gated
      detail: the control plane that creates, suspends and resumes sandboxes - the perpetual-standby platform
        Blaxel sells - exists in no public repo; the MIT repo publishes only the in-sandbox HTTP API and
        a hub of image templates
  confidence: medium
  note: 'MIT sandbox API and image hub with a proprietary managed platform. The core is gated on a named
    mechanism rather than merely because a paid tier exists, and nothing is carved out inside the repository:
    the piece that makes Blaxel a sandbox product is in no repository at all. blaxel-ai/sandbox is 419 entries
    of sandbox-api - the HTTP API running inside a sandbox - plus about thirty Dockerfile templates under
    hub/, and the README calls it "Sandbox Hub ... a collection of development environment templates". The
    scheduler that allocates a micro VM, and the perpetual standby and sub-25ms resume the product is sold
    on, appear nowhere across the 29 public repos in the org, which hold SDKs, plugins and forks of third-party
    infrastructure. That is decided on what this org publishes rather than by analogy with its neighbors:
    E2B publishes the infrastructure powering its cloud and beta9 publishes its whole gateway, and both
    come out fully open, while this product and Tensorlake do not.'
