  value: Code Llama - Instruct 13B HumanEval pass@1 42.7%, MBPP pass@1 49.4%; 70B-Instruct higher at 67.8%
    HumanEval, 34B-Instruct lower at 41.5%; all 2023-era
  confidence: medium
  note: 'Code Llama Instruct is a 2023-era code model that sits well below current coding models. Its Instruct
    sizes are not monotonic: the paper gives 13B 42.7% HumanEval / 49.4% MBPP, with 70B higher at 67.8%
    and 34B lower at 41.5%.'
