  score: 4
  basis: feature_matrix
  basis_detail: reasoning + configurable policy
  value: Policy-conditioned safety reasoning (bring-your-own-policy), reasoned decisions rather than just
    scores, configurable reasoning effort; 20b and 120b.
  confidence: medium
  note: gpt-oss-safeguard reasons over a policy the user writes rather than a fixed taxonomy, so it can
    be applied to new products and categories with minimal engineering, and it exposes its reasoning. OpenAI's
    own guide notes that traditional classifiers have lower latency and cost less to run.
  last_verified: '2026-09-29'
