capability:
  score: 5
  basis: benchmark
  value: DCLM is the DataComp-LM benchmark harness, with 53 downstream evaluations. Its DCLM-baseline corpus
    trains a 7B model to 64% 5-shot MMLU on 2.6T tokens, 6.6 points above MAP-Neo, the previous open-data
    state of the art.
  confidence: high
  note: DCLM-baseline, the reference curation output of the DataComp-LM benchmark, set the open-data state
    of the art on MMLU when published.
  last_verified: '2026-09-29'
  sources:
  - url: https://arxiv.org/abs/2406.11794
    shows: 'DataComp-LM abstract: "DCLM-Baseline enables training a 7B parameter language model from scratch
      to 64% 5-shot accuracy on MMLU with 2.6T training tokens" and "6.6 percentage point improvement on
      MMLU" over MAP-Neo, evaluated on "53 downstream evaluations".'
