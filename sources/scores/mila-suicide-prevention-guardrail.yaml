capability:
  score: 2
  basis: feature_matrix
  basis_detail: single-harm response classification
  value: Binary classification of English assistant responses against one harm, suicide and self-harm as the MLCommons
    AILuminate taxonomy defines it, with a 512-token input on a 110M-parameter BERT encoder. On Mila's internal
    hand-annotated set of 494 responses it reports precision 0.908, recall 0.802 and F1 0.852 at the default threshold.
    It does not classify user prompts and gives no explanation or category breakdown.
  relative_to: llama-guard
  relation: two_below
  confidence: low
  note: The guardrail checks one thing, whether a chatbot's English reply encourages or instructs suicide or self-harm,
    and is cheap enough to run on every response. Llama Guard screens prompts and replies across fourteen hazard
    categories in eight languages, suicide and self-harm among them, so a single-harm, reply-only filter sits two
    steps below it.
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://huggingface.co/meta-llama/Llama-Guard-3-8B
      shows: 'The peer''s model page still lists hazard categories from "S1: Violent Crimes" to "S14: Code Interpreter
        Abuse", including "S11: Suicide & Self-Harm", says Llama Guard 3 can "classify content in both LLM inputs
        (prompt classification) and in LLM responses (response classification)", "was aligned to safeguard against
        the MLCommons standardized hazards taxonomy" and "provides content moderation in 8 languages". The page
        is rendered HTML and its digest differs from the one llama-guard records from 2026-09-29; the quoted claims
        read as that record describes them.'
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: 1a863c9d22382d96b35c3adb5e39dafd401eb07a5ff8c24a38ad35ca94cf5a05
