  value: Orpheus is not on the Artificial Analysis TTS leaderboard, and its README reports no results on a shared test set;
    it claims about 200 ms streaming latency, zero-shot voice cloning and emotion tags.
  confidence: medium
  note: Orpheus has no listener rating and publishes no results on a public test set, so nothing places it beside the rated
    synthesizers. It sits with MeloTTS, another popular open voice with no published evaluation.
