  value: Dense and sparse multi-head latent attention kernels for the prefill and decoding stages, purpose-built for one
    model family's attention variant (DeepSeek's MLA/DSA) rather than the general attention coverage flash-attention supplies
    across model architectures.
  relative_to: flash-attention
  relation: two_below
  confidence: medium
  note: FlashMLA and FlashAttention are both attention-kernel libraries, but FlashMLA's kernels are purpose-built
    for DeepSeek's own multi-head latent and sparse attention rather than general-purpose use across architectures.
    That places it two steps below FlashAttention.
