  note: 2,221 GitHub stars. The project ships as container images and a Helm chart and publishes no package-registry
    artifact, so no usage-volume channel exists for it and the band rests on stars, which measure attention
    rather than use. The stars route caps at level 3 for that reason. The `kubeflow` PyPI package reports 100,711
    monthly downloads but is the umbrella Kubeflow SDK rather than this product's own channel, so attributing
    it here would band on a different population.
