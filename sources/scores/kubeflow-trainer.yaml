capability:
  score: 3
  basis: feature_matrix
  value: TrainJob as a first-class training resource with trainer, dataset and model initializers and a node
    count; materializes a JobSet of pods; ships PyTorch, DeepSpeed and MPI runtimes
  confidence: medium
  relative_to: kubeflow-pipelines
  relation: at
  note: Kubeflow Trainer treats a training run as a first-class resource that it schedules and tracks, the
    same shape of decision as Kubeflow Pipelines. It creates the JobSet but leaves the choice of machine,
    and any gang-scheduling guarantee, to whichever scheduler the cluster runs, such as Volcano or Kueue,
    rather than deciding that itself.
  last_verified: '2026-09-15'
