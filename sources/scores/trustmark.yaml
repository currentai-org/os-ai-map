capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Encodes, decodes and removes image watermarks at arbitrary resolution; robust to 18 noise sources
    and JPEG compression per the paper; on the C2PA approved-watermark list.
  relative_to: nvtrust
  relation: two_below
  confidence: medium
  note: Anyone can read a TrustMark watermark with the open decoder, and it follows a method the C2PA standard
    approves, so checking for it needs nothing from the embedder. The mark carries an identifier rather than
    a signed claim, two steps below NVIDIA's hardware attestation.
  last_verified: '2026-09-26'
