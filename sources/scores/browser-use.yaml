capability:
  score: 3
  basis: feature_matrix
  value: an agent loop driving a browser - navigate, click, fill forms, extract, multi-step tasks - against
    a local Chrome profile or the vendor's cloud, with model and service keys supplied by the caller
  confidence: medium
  note: Browser Use offers a curated surface over a single browser session, authenticated with the caller's
    own API key in a `.env` file or, for signed-in sites, a Chrome profile the caller already used. The
    hosted cloud is a separate product surface, leaving its feature set level with Playwright MCP's.
  last_verified: '2026-09-17'
  sources:
