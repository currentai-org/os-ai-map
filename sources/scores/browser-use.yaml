product: browser-use
openness:
  score: 5
  class: open_source
  components:
    license:
    - name: MIT
      detail: OSI, library core fully open
    source:
      value: public
    managed-tier:
      value: Browser-Use-Cloud
      detail: proxies/stealth/captcha/hosted browsers, proprietary
    core-gated:
      value: ungated
      detail: one MIT LICENSE and no ee/ path. The pricing page prices hosted capacity only and states that
        cloud usage and the open-source browser-use Python library are separate products with different
        APIs. The four modules reading BROWSER_USE_API_KEY - browser/cloud sandbox skills and llm/browser_use
        - are published clients to that hosted product and the local agent needs no key
  confidence: high
  note: 'The core is ungated: the repo root has one MIT LICENSE and no ee/, enterprise/ or commercial/ path,
    and neither the repo nor the pricing page shows a feature gate. The pricing page prices hosted capacity
    only - Dev $29/mo for 25 concurrent sessions and 20 browser profiles, Business $299/mo, Scaleup $999/mo,
    Enterprise custom, plus pay-as-you-go credits - and states outright that "Cloud usage and the open-source
    browser-use Python library are separate products with different APIs." The one thing that could have
    gone the other way is that four library modules read BROWSER_USE_API_KEY: browser_use/browser/cloud/cloud.py,
    browser_use/sandbox/sandbox.py, browser_use/skills/service.py and browser_use/llm/browser_use/chat.py.
    Each is a published client to the separate hosted product rather than a withheld feature - SkillService
    fetches skills from the Browser Use API through the browser_use_sdk package, sandbox posts to the hosted
    sandbox, and chat.py is the ChatBrowserUse endpoint - and the local agent, browser session and tools
    run with any LLM and no key at all. Selling a separate hosted product is the langchain/LangSmith shape,
    which the rubric settles as ungated.'
  raw: license:MIT(OSI, library core fully open);source:public;managed-tier:Browser-Use-Cloud(proxies/stealth/captcha/hosted
    browsers, proprietary);core-gated:ungated(one MIT LICENSE and no ee/ path. The pricing page prices hosted
    capacity only and states that cloud usage and the open-source browser-use Python library are separate
    products with different APIs. The four modules reading BROWSER_USE_API_KEY - browser/cloud sandbox skills
    and llm/browser_use - are published clients to that hosted product and the local agent needs no key)
  last_verified: '2026-08-12'
