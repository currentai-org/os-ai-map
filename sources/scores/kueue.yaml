capability:
  score: 5
  basis: feature_matrix
  value: admits or holds a Job against ClusterQueue quota and ResourceFlavors; preempts running jobs; and under
    Topology-Aware Scheduling finds a fixed assignment of pods to nodes and injects a NodeSelector so the pods
    land on the chosen nodes, with podset-required-topology binding a whole PodSet to one rack or block
  confidence: medium
  relative_to: volcano
  relation: at
  note: 'Kueue''s Topology-Aware Scheduling does the placing, not its queueing alone: it can fix an assignment
    of pods to nodes and inject a NodeSelector, and podset-required-topology can bind a whole set to one
    rack or block. Kueue makes that placement decision itself, with Kubernetes only executing it, which
    puts it level with Volcano.'
  last_verified: '2026-09-15'
  sources:
  - url: https://kueue.sigs.k8s.io/docs/concepts/topology_aware_scheduling/
    shows: 'Kueue''s Topology-Aware Scheduling concept page: ''When the lowest level of Topology is set to
      node, TAS finds a fixed assignment of pods to nodes and injects a NodeSelector to make sure the pods
      get scheduled on the selected nodes'', and the podset-required-topology annotation requiring all pods
      within one topology domain.'
    accessed: '2026-09-15'
    http_status: 200
    content_sha256: f253677ffe43a68eceedda7352d0cd7376e76700f811897d5db373166730d2ef
