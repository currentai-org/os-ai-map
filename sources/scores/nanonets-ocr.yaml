  class: open_weights
  components:
    license:
    - name: none-declared
      detail: the Hugging Face model card returns no license field in its metadata, so the weights are published
        without a declared grant
    weights:
      value: open
      detail: downloadable from Hugging Face without a gate
    data:
      value: closed
      detail: no training corpus is published or described
    code:
      value: closed
      detail: no training or fine-tuning code is published; the hosted platform is the vendor's product
  confidence: medium
  note: 'Open weights with a closed recipe, which is the state the model ladder''s fallthrough rung describes.
    The weights download from Hugging Face without a gate; no training corpus and no training code are published.
    The licence is the interesting part and it does not change the band: the card declares none at all, so
    there is no grant to tier. That lands it in the open-ish bucket rather than the open one, which is the
    right outcome for weights nobody has attached terms to - unrecorded evidence must never count as open.
    Nanonets sells a hosted platform beside these weights; that is a separate product and not what is scored
    here. The 3/open_weights pair is HAND-ASSIGNED, not computed, and the category defers it: `none-declared`
    is in no tier, the model ladder tests the tier before it reaches the fallthrough, and replaying the walk
    returns no result at all. The 3 is the curator''s reading of the rung the record would land on once a tier
    exists for an unstated licence, and it stands until that rubric change is made. Giving an unstated licence
    a rung is a rubric change across every category that inherits the model ladder.'
  raw: license:none-declared(the Hugging Face model card returns no license field in its metadata, so the weights
