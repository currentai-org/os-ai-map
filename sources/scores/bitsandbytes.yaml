capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: one optimization family, applied broadly'
  value: 8-bit optimizers, LLM.int8() inference and 4-bit quantization for PyTorch, with multi-backend support.
    Quantization only, it neither compiles nor lowers a graph.
  relative_to: apache-tvm
  relation: two_below
  confidence: medium
  note: bitsandbytes provides 8-bit optimizers, LLM.int8() mixed-precision inference and 4-bit quantization
    for PyTorch across multiple hardware backends. It quantizes existing models rather than compiling or
    lowering a computation graph, which is what separates it from a full compiler such as Apache TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/bitsandbytes-foundation/bitsandbytes/main/README.md
    shows: README documents "k-bit quantization for PyTorch" with "8-bit optimizers uses block-wise quantization
      to maintain 32-bit performance at a small fraction of the memory cost." and "QLoRA or 4-bit quantization
      enables large language model training with several memory-saving techniques".
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 68fc2df60317162ca34ba4a1aa0ff3dbc195634391ddeff326b3b109ff7d5ea3
  - url: https://raw.githubusercontent.com/bitsandbytes-foundation/bitsandbytes/main/README.md
    shows: README accelerator table covers "NVIDIA GPU", "AMD GPU", "Intel GPU", "Intel Gaudi" and "Metal"
      plus x86-64 and aarch64 CPU, so multi-backend support is documented; the LLM.int8() entry says "separately
      treating outliers with 16-bit matrix multiplication".
