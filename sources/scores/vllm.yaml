capability:
  score: 5
  basis: benchmark
  basis_detail: MLPerf Inference v6.0 (AMD Instinct MI355X submission, April 2026)
  value: PagedAttention with continuous batching, prefix caching and chunked prefill; tensor, pipeline, data, expert
    and context parallelism for distributed inference; speculative decoding; FP8 and other quantization; multi-LoRA;
    an OpenAI-compatible API server; 200+ model architectures.
  confidence: high
  note: vLLM is the serving stack behind AMD's MLPerf Inference v6.0 submission on Instinct MI355X, covering gpt-oss-120b,
    Llama 2 70B and a multi-node Llama 3.1 405B run reported at 97-98% scaling efficiency, and the project reports
    support for 200+ model architectures on Hugging Face. It is the capability anchor for this category, the engine
    the others here are placed relative to. The feature set is recorded in `value` because an anchor other records
    are banded against has to say what it is, or "one below vllm" points at nothing.
  last_verified: '2026-08-31'
  sources:
  - url: https://rocm.blogs.amd.com/artificial-intelligence/mlperf-inference-v6.0/README.html
    shows: AMD Instinct MI355X MLPerf Inference v6.0 submission; "tuning experiments were conducted on vLLM parameters
      and used to refine the scheduler configurations", and the Llama 3.1 405B multi-node run used "an AMD MLPerf
      Stack with vLLM" at 97-98% scaling efficiency.
