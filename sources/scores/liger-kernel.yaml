capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Fused Triton kernels for a fixed list of transformer training operations, plus post-training loss implementations,
    delivered as monkey patches for Hugging Face classes.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: Liger Kernel is a set of transformer training operators rather than a single kernel, and Hugging
    Face TRL declares it as an optional liger extra in its pyproject. Its scope is a fixed list of training
    operations, which keeps it one step below Apache TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/linkedin/Liger-Kernel/main/README.md
    shows: README documents "We support losses like DPO, CPO, ORPO, SimPO, KTO, JSD, and many more." and
      says users can "Simply patch your Hugging Face model with one line of code" using RMSNorm, RoPE, SwiGLU
      and CrossEntropy kernels.
