  value: 'gemma-4-31B-it model card - MMLU Pro 85.2%, GPQA Diamond 84.3%, AIME 2026 (no tools) 89.2%,
    LiveCodeBench v6 80.0%, MMMU Pro 76.9%; multimodal on text and image across all sizes, audio native
    only on E2B/E4B/12B'
  confidence: medium
  note: Gemma 4 31B scores 19 on Artificial Analysis's Intelligence Index, well behind the highest-scoring
    open-weight releases from DeepSeek and GLM. Its model card reports 85.2% on MMLU Pro, 84.3% on GPQA
    Diamond and 80.0% on LiveCodeBench v6, and on the Arena text leaderboard it trails more than a dozen
    openly licensed models, which places it near rather than at the frontier of open models.
