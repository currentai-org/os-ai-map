capability:
  score: 4
  basis: benchmark
  basis_detail: Artificial Analysis Intelligence Index; Artificial Analysis, Epoch AI and LMArena evaluations;
    model-card evaluation table
  value: 'Artificial Analysis Intelligence Index v5.0.1, read 2026-11-13: Gemma 4 31B (Reasoning) 4, ninth
    of ten small open-weight models (class median 8); Granite 4.2 8B 5, Inkling (Xhigh) 12, Mistral Large
    4 (High) 26. Artificial Analysis evaluations outside the index: Gemma 4 31B (Reasoning) GPQA Diamond
    85.7%, HLE 23.6%, IFBench 75.6% against Olmo 3.1 32B Think 59.1%, 6.3%, 66.0%; Gemma 4 31B (Non-reasoning)
    76.3%, 11.8%, 53.5% against Phi-4 57.5%, 3.8%, 23.5%. Epoch AI runs: Gemma 4 31B at minimal reasoning
    GPQA Diamond 75.8%, OTIS Mock AIME 73.3%, against Phi-4 56.1%, 13.8% and Mistral Large 4 (high) 88.1%,
    98.3%. LMArena text, style control, 2026-11-11: Gemma 4 31B 1452, Inkling 1442, Mistral Large 4 1420,
    Olmo 3.1 32B Think 1286, Phi-4 1256; non-English prompts 1438 against Mistral Large 4 1405. gemma-4-31B-it
    model card: MMLU Pro 85.2%, GPQA Diamond 84.3%, AIME 2026 (no tools) 89.2%, LiveCodeBench v6 80.0%,
    MMMU Pro 76.9%; multimodal on text and image across all sizes, audio native only on E2B/E4B/12B'
  confidence: medium
  note: Gemma 4 31B, the family's strongest model, scores 4 on version 5.0.1 of Artificial Analysis's Intelligence
    Index, far behind Mistral Large 4 at 26, largely because it scores near zero on the index's agentic
    tasks. In Artificial Analysis's and Epoch AI's own runs of science, math and instruction-following tests
    it is well ahead of Phi-4 and OLMo 3.1 32B Think, and LMArena's human-preference ratings put it above
    Mistral Large 4, including on non-English prompts.
  last_verified: '2026-11-13'
  sources:
