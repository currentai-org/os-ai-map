capability:
  score: 4
  basis: feature_matrix
  value: '`POST /v1/search` returns web results with keyword snippets by default; `extraction_mode: full_page`
    adds `contents.markdown` or `contents.html` carrying the whole page, and `extraction_mode: highlights`
    returns the passages addressing the query instead of snippets'
  confidence: high
  relative_to: firecrawl
  relation: at
  note: You.com's Web Search endpoint accepts an extraction-mode parameter that swaps snippets for full
    page content on the same call, priced separately at $1 per 1,000 pages -- the same shape as Kagi's inline
    extract -- so one endpoint covers both discovery and content, level with Firecrawl. The Answer API composes
    a cited response but is a separate SKU at its own price.
  last_verified: '2026-09-17'
  sources:
  - url: https://you.com/docs/guides/search.md
    shows: 'The extraction table: with no `extraction` parameter each result carries "snippets - short, keyword-centered
      fragments"; with `extraction_mode: "full_page"` it carries "snippets, plus contents.markdown or contents.html
      carrying the whole page"; with `extraction_mode: "highlights"` it carries "contents.highlights - the
      passages that address your query".'
