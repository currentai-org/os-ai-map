capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: DWT-DCT, DWT-DCT-SVD and RivaGAN image watermarks, embedded and decoded by the same open library;
    the README warns decoding is not guaranteed even without attack.
  relative_to: nvtrust
  relation: two_below
  confidence: low
  note: Anyone can decode the mark with the same open library, without a key, so the check does not depend
    on the embedder. The maintainers say decoding can fail even on untouched images, and the mark proves nothing
    about who placed it, two steps below NVIDIA's hardware attestation.
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/ShieldMnt/invisible-watermark/main/README.md
    shows: default dwtDct "is fast and suitable for on-the-fly embedding"; "The algorithm cannot guarantee
      to decode the original watermarks 100% accurately even though we don't apply any attack"
    accessed: '2026-09-26'
    http_status: 200
