capability:
  score: 4
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: GPU-accelerated PhysX simulation with a Newton physics backend, RTX-rendered camera, depth, lidar, radar and acoustic
    sensors at scale, physics-based contact, IMU and joint sensors, URDF, MJCF and CAD import, synthetic data generation and
    a ROS bridge. Ready-to-train RL tasks come from Isaac Lab, a separate product.
  relative_to: isaac-lab
  relation: one_below
  confidence: medium
  note: Isaac Sim provides the GPU physics and RTX-rendered sensors that the strongest simulators here are built from, and
    it can run its scenes on the Newton engine as well as PhysX. The library of ready-to-train robot tasks lives in Isaac
    Lab, which is built on it, so Isaac Sim sits a step below.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/isaac-sim/IsaacLab/main/README.md
      shows: 'Re-read of the peer. Isaac Lab''s README still lists "Ready-to-train implementations of more than 30 environments,
        which can be trained with popular reinforcement learning frameworks" and runs physics and rendering through NVIDIA
        Isaac Sim among other backends: the task library is Isaac Lab''s, not Isaac Sim''s.'
      accessed: '2026-11-12'
