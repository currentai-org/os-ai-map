  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: providers propose entries by pull request, admitted at the discretion of the AWS Open Data team; entries
    list S3 buckets, SNS topics and other resources by ARN and region; anonymous access with `aws s3 ls --no-sign-request`;
    storage costs of sponsored datasets covered by AWS; a hosted YAML listing of all entries
  confidence: medium
  relative_to: uci-ml-repository
  relation: at
  note: Data providers add an entry by pull request, and each entry names the S3 buckets that hold the data,
    which any S3 client reads by path without an account. The registry assigns no persistent dataset identifiers
    or versions of its own, the same gap as UCI's missing versions.
