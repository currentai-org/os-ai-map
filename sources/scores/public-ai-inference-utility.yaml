capability:
  score: 3
  basis: feature_matrix
  basis_detail: hosted catalog and serving features read from the service's developer documentation
  value: OpenAI-compatible chat and completions API over a catalog of nine models (Apertus 1.5 8B and 70B with 262K
    context, SEA-LION v4 27B and 32B, Bielik 11B); vLLM servers on partner clusters behind a gateway that load-balances,
    routes and fails over between them; per-key rate limits from 100 to 10,000 requests per minute; also served
    as a Hugging Face inference provider.
  relative_to: vllm
  relation: two_below
  confidence: medium
  note: The service runs its models on vLLM, so its serving techniques are that engine's, and what it adds is routing,
    failover and per-key rate limits across clusters donated by different partners. Its catalog is a handful of
    national models of up to 70 billion parameters, and it publishes no throughput or latency figures.
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://cdn.jsdelivr.net/gh/vllm-project/vllm/README.md
      shows: 'vLLM README feature list: PagedAttention, continuous batching with chunked prefill and prefix caching,
        "Tensor, pipeline, data, expert, and context parallelism for distributed inference", speculative decoding,
        broad quantization support and "200+ model architectures".'
