capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: GRPO family, PPO, DPO and SFT with LoRA; fully asynchronous RL decoupling rollout from policy
    update; training backends FSDP and Megatron; inference backends vLLM and SGLang; TP/PP/EP and sequence parallelism;
    documented agentic and vision-language RL examples. Comparable distributed-RL breadth to OpenRLHF, with a stronger
    agentic emphasis.'
  confidence: medium
  note: 'AReaL''s support matrix lists the algorithm, model, training-backend and inference-backend axes that place
    OpenRLHF at 4: multiple RL algorithms over FSDP/Megatron training with vLLM/SGLang rollout, scaled by TP/PP/EP.
    It is scored at OpenRLHF rather than above it because the two cover the same ground from different angles -
    OpenRLHF on Ray-scheduled RLHF at 70B+, AReaL on asynchronous agentic RL - and neither reaches the method catalogue
    of verl or nemo-rl.'
  relative_to: openrlhf
  relation: at
