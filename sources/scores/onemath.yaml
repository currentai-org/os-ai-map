  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface with no dependency declaration on file'
  value: Cross-vendor BLAS, LAPACK, FFT, RNG and sparse routines dispatched to a hardware backend per device
    (oneMKL, cuBLAS, rocBLAS and others). The README names the backends it dispatches to, and no engine
    or framework built on it.
  relative_to: apache-tvm
  relation: two_below
  confidence: medium
  note: oneMath exposes one cross-vendor interface for BLAS, LAPACK, FFT, RNG and sparse routines, dispatched
    to a backend per device. That routine and vendor breadth is real, but no engine or framework is recorded
    depending on it, only the backends it calls into - which places it two steps below Apache TVM on the
    evidence available.
  last_verified: '2026-09-02'
