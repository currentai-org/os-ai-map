  note: Deep Lake combines a multimodal storage format with vector and metadata querying, dataset versioning,
    streaming into training loops, and a Postgres surface. Vespa covers more of the same persist-index-retrieve
    path across a broader range of retrieval modes, which keeps Deep Lake one step behind it.
