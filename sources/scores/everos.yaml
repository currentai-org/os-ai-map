capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: search by user, agent, app, project and session; LLM extraction of episodes, atomic facts, profiles, agent
    cases and skills from conversations; offline reflection that merges episode clusters, resolves contradictions
    by keeping the latest state and archives what it replaces, with single-file profile rewrites; user episodes
    and profiles, agent cases and skills, and a knowledge wiki as separate stores; no time-based decay or expiry
  confidence: medium
  note: EverOS extracts several kinds of memory from raw conversations, consolidates them offline into merged narratives
    and rewritten profiles, and retrieves across separate user, agent and knowledge stores. Old memories leave search
    only when a newer narrative replaces them, never because of their age.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
