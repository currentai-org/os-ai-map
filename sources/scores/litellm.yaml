  note: A unified gateway to a very large set of LLM providers in OpenAI format, with cost tracking, guardrails,
    load balancing, virtual keys and budgets, and logging. No standard benchmark applies to a gateway, so
    this is rated on breadth of provider coverage and production features. The README and docs now say 100+
    providers where the recorded feature list says 140+, so the headline count has been restated downward
    rather than grown; the score does not turn on that number.
