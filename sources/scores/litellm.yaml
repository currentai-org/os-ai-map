  note: LiteLLM is a unified gateway to a very large set of LLM providers in OpenAI format, with cost tracking,
    guardrails, load balancing, virtual keys, budgets and logging. No standard benchmark applies to a gateway,
    so this is rated on the breadth of provider coverage and production features it ships.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/BerriAI/litellm
