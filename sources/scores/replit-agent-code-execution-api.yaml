capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: omegajail unprivileged container (process/container-level, weaker than microVM);
    cold-start: not recorded - the only figure ever published for it has no surviving readable source;
    language/runtime breadth: primarily Python, customizable Docker image; persistence: stateless;
    scale: Replit Autoscale Deployments'
  confidence: medium
  note: Replit runs each execution inside an ephemeral, unprivileged container on its own Deployments infrastructure,
    sandboxed by the third-party omegajail project, as a stateless API purpose-built for AI agents with
    a swappable container image. Isolation stays at the container level rather than a microVM, the language
    focus is narrow (Python), and sandboxes carry no persistence between calls; the public client that once
    exposed this directly is archived, so the capability now lives only inside the Replit Agent surface.
  last_verified: '2026-08-14'
  sources:
