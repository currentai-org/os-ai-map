capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: omegajail unprivileged container (process/container-level, weaker than microVM);
    cold-start: not recorded - the only figure ever published for it has no surviving readable source;
    language/runtime breadth: primarily Python, customizable Docker image; persistence: stateless;
    scale: Replit Autoscale Deployments'
  confidence: medium
  note: 'Fast container-level execution tuned for agent code evaluation, but container rather than microVM
    isolation, a narrow language focus and no persistence put it mid-tier against microVM-backed peers.
    The public self-serve client (replit-code-exec) is archived and read-only, and the capability now lives
    inside the Replit Agent surface. That picture comes from two independent live channels - the archived
    README and the package’s own PyPI metadata - both describing execution inside an ephemeral unprivileged
    container created on the fly on Replit Deployments, with omegaup/omegajail as the code sandbox, a stateless
    API optimized for AI agents, Python, and the container image swappable via `evalctl`. Two claims that
    once travelled with this score are not carried, because nothing readable supports them: a ~100ms cold
    start, and a discontinued prior stateful-Repl experiment. Both came only from the Replit blog post,
    which answers 403 to every request under every header set tried and has no Wayback capture at all, so
    no surviving copy of the document states them. Losing the 100ms claim removes a point in the product’s
    favor, so if anything it argues against raising the band. The dead blog source is kept below so a later
    reader can see what was lost rather than rediscovering the 403. The 3 rests on the same three grounds
    it always did - container rather than microVM isolation, narrow language focus and no persistence.'
