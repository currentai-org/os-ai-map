capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: omegajail unprivileged container (process/container-level, weaker than microVM); cold-start:
    requests handled in as little as 100ms per the Replit blog (Python math evaluation); language/runtime
    breadth: primarily Python, customizable Docker image; persistence: stateless; scale: Replit Autoscale
    Deployments'
  confidence: medium
  note: Replit runs each execution inside an ephemeral, unprivileged container on its own Deployments infrastructure,
    sandboxed by the third-party omegajail project, as a stateless API purpose-built for AI agents with
    a swappable image. Isolation stays at the container level rather than a microVM, the language focus
    is narrow (Python), and sandboxes carry no persistence between calls.
  last_verified: '2026-09-29'
  sources:
