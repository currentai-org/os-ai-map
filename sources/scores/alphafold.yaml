capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Sequence together with genetic-search and template inputs; no adaptation pathway, no design surface, and one scale.
  relative_to: prithvi-eo
  relation: two_below
  confidence: high
  note: One readable attribute. The breadth people associate with AlphaFold 3 is breadth of entity types in a single prediction task, and the category's note is explicit that a long task list is not an adaptation pathway - the repository ships inference only, and the model predicts a fixed target rather than designing anything.
  last_verified: '2026-09-10'
  sources:
