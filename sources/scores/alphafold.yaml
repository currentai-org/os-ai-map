  note: The line ships two generations under two parameter licenses, and the multi-SKU rule resolves it on the distributed set. AlphaFold 2's parameters are CC-BY-4.0, which alone would not cap anything; AlphaFold 3's are also distributed, and their terms forbid commercial use and require that you receive them directly from Google. The most restrictive distributed license governs, so the current tier decides the score and the line sits at restricted. Scoring the line at AlphaFold 2 would be scoring a superseded product.
