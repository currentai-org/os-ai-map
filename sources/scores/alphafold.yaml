  raw: weights:open(AlphaFold 3 parameters at a published URL but only if received directly from Google; AlphaFold 2 parameters freely downloadable);data:closed(training corpus not released in either generation);code:partial(Apache-2.0 inference pipeline in both repositories; no training code);license:AlphaFold-3-Model-Parameters-Terms-of-Use(non-commercial use only; the resolved tier for the line, AlphaFold 2 parameters being CC-BY-4.0)
