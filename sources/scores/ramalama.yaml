  basis_detail: category feature matrix, banded against the vllm anchor
  value: 'Container-isolated local serving: GPU detection pulls accelerated images (CUDA, ROCm, Intel GPU, Ascend,
    MUSA, Vulkan, Asahi); llama.cpp and vLLM in containers, MLX on macOS; Hugging Face, ModelScope, Ollama and OCI
    transports; REST serving, chat, RAG, conversion to OCI images, benchmarking and perplexity; rootless containers
    with networking off; single-node.'
  relative_to: vllm
  relation: two_below
  confidence: medium
  note: RamaLama sits two tiers below vLLM, level with Docker Model Runner and Lemonade. It runs llama.cpp or vLLM
    inside a container rather than adding serving parallelism of its own; its distinguishing work is hardware detection
    and isolating the model from the host.
