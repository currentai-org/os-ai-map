capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: agent identities created from agent identity blueprints, on-behalf-of token exchange limited to the user's
    consented delegated permissions; no per-action decision (Conditional Access runs at token issuance), no human
    approval of an action, no tamper-evident decision record
  confidence: medium
  note: Agent ID gives each agent its own identity and lets it act for a user only within the permissions that user
    and the agent were granted. Its policy checks run when Entra issues or refreshes a token, so the decision about
    each individual tool call is left to the resource, and it has no approval step or signed decision record.
  last_verified: '2026-11-20'
  sources:
  - url: https://learn.microsoft.com/en-us/entra/agent-id/what-is-microsoft-entra-agent-id
    shows: '"The Microsoft Entra Agent identity platform enables developers to create and manage agent identities,
      which are specialized identity constructs built for AI agents. Agent identity blueprints serve as templates
      for creating individual agent identities".'
    accessed: '2026-11-20'
    http_status: 200
