  class: open_core
  components:
    license:
    - name: MIT
      detail: OSI, SDK/core public on GitHub
    source:
      value: public
      detail: Python + TypeScript SDKs
    managed-tier:
      value: Composio hosted platform + Rube MCP server
      detail: auth, hosted tool execution) is the commercial layer
      raw: Composio hosted platform + Rube MCP server (auth, hosted tool execution) is the commercial layer
    core-gated:
      value: gated
      detail: the execution engine is in no public repo. The MIT tree is SDKs and provider adapters only and
        toolkit execution the app catalog and managed OAuth all run on the hosted platform at backend.composio.dev
        behind a COMPOSIO_API_KEY with no self-host option documented
  confidence: high
  note: 'The SDK and core are MIT and public, while the hosted multi-app integration and auth platform is the
    proprietary tier - classic open core. The gate is not a directory but an absence: the execution engine
    is in no public repository. What is published is SDKs and provider adapters - python/composio with its
    providers/, and ts/packages/ holding core, cli, cli-local-tools, cli-keyring, providers, slim, experimental
    and the schema converters. Toolkit execution, the catalogue of more than 1000 apps and managed OAuth all
    run on Composio''s own servers: the README''s first instruction is to "Grab a COMPOSIO_API_KEY from the
    dashboard first", sessions are created against the hosted API, the docs give the REST base URL as https://backend.composio.dev/api/v3.1
    and describe Composio-managed auth as the default, and no self-hosting or on-premise option is documented
    anywhere. Nothing in the published source executes a toolkit without that platform. The finding rests on
    that evidence in the code, not on the mere fact that Composio sells a hosted platform.'
  raw: license:MIT(OSI, SDK/core public on GitHub);source:public(Python + TypeScript SDKs);managed-tier:Composio
    hosted platform + Rube MCP server (auth, hosted tool execution) is the commercial layer;core-gated:gated(the
    execution engine is in no public repo. The MIT tree is SDKs and provider adapters only and toolkit execution
    the app catalog and managed OAuth all run on the hosted platform at backend.composio.dev behind a COMPOSIO_API_KEY
    with no self-host option documented)
  last_verified: '2026-08-12'
  sources:
  - url: https://github.com/ComposioHQ/composio
    shows: MIT LICENSE, public SDK source, 1000+ toolkits, ~28.6k stars
    accessed: '2026-06-04'
  - url: https://raw.githubusercontent.com/ComposioHQ/composio/next/README.md
    shows: '"Create a session for a user, hand its tools to your agent, and let the agent take action across
      1000+ apps. Grab a COMPOSIO_API_KEY from the dashboard (dashboard.composio.dev/settings) first." Also
      offers a hosted MCP endpoint per session - "Pass mcp: true to composio.create() and point Claude, Cursor,
      or any MCP client at session.mcp.url". Every path to running a tool goes through the hosted platform
      and a key issued by it.'
    accessed: '2026-08-12'
    http_status: 200
    content_sha256: 8c723e06bec36f55f3aaff4e2933834856a87dff5f6acd94f0a091b85457d94f
    establishes:
