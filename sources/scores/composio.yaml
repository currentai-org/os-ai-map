capability:
  score: 5
  basis: feature_matrix
  value: a catalogue spanning more than 1,500 applications, with per-end-user OAuth, API keys and tokens stored
    and refreshed by the platform, and a hosted MCP endpoint per session
  confidence: medium
  note: Composio supports many different systems, manages every credential itself rather than leaving that
    to the caller, and hosts execution end to end. What earns the top score is not the size of its catalogue
    but that the platform, not the caller, carries the credentials.
  last_verified: '2026-09-17'
  sources:
  - url: https://docs.composio.dev/getting-started/welcome
    shows: 'The platform overview: "tool search over 1,500+ apps, surfaced just in time with the right scope"
      and "Auth and context, per end-user. OAuth, API keys, and tokens scoped to each user and refreshed automatically",
      with per-user connections illustrated across Slack, Gmail and Linear.'
