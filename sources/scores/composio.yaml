  - url: https://api.github.com/repos/ComposioHQ/composio/contents/ts/packages
    shows: 'The published TypeScript tree is client-side only: cli, cli-keyring, cli-local-tools, core, experimental,
      json-schema-to-effect-schema, json-schema-to-zod, providers, slim, ts-builders. The python/ tree is the
      same shape - composio plus providers. There is no server, no toolkit runtime and no auth service anywhere
      in the repository, which is the functionality the paid platform holds.'
