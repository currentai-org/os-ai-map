    product and stalled release cadence. Honest signal is modest residual OSS usage, not a live platform.
    2,830 stars on whylabs/whylogs, which bands at 1K-10K stars, level 2 on the stars scale. No download-vocabulary
    reach label is recorded, because this instrument does not offer one - a star is not a download. THE
