  signal_type: stars_fallback
  confidence: low
  note: 'The hosted SaaS has shut down, so there are no active platform users. The remaining signal is the
    open source libraries: whylabs/whylogs has 2,830 GitHub stars, which bands at 1K-10K stars and level
    2. Stars cannot carry a product above level 3, and no download-range label is recorded because stars
    have their own vocabulary - a star is not a download. The level is placed at 2 rather than 3 because
    the commercial product is dead and the release cadence has stalled: the last release was in December
    2024 and the last push to the repository was in January 2025. The honest reading is modest residual
    open source usage, not a live platform.'
