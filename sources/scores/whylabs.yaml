capability:
  score: 2
  basis: feature_matrix
  relative_to: langfuse
  relation: two_below
  value: 'whylogs(data logging/profiling, drift + data-quality monitoring, privacy-preserving) + LangKit(LLM
    text-quality/safety metrics: sentiment, toxicity, prompt-injection signals). No live tracing backend,
    no eval-experiment/prompt-mgmt platform (open sourced but unmaintained). Narrow vs anchor C4 tools.'
  confidence: medium
  note: 'As living, usable capability this is a pair of monitoring libraries rather than a full tracing,
    evaluation and prompt platform: whylogs does data logging and profiling with drift and data-quality
    monitoring, and LangKit adds LLM text-quality and safety metrics such as sentiment, toxicity and prompt-injection
    signals. There is no live tracing backend and no evaluation-experiment or prompt-management platform
    - what was open sourced is now unmaintained, with the last release in December 2024 and the last push
    in January 2025 - and the README still describes a profiling library that integrates with Spark, Airflow,
    S3 and MLflow rather than an observability platform. That is narrow enough to sit two rungs below the
    MLflow and Langfuse anchors at 4.'
  last_verified: '2026-08-13'
  sources:
  - url: https://github.com/whylabs/whylogs
    shows: 'README describes a data-logging and profiling library with integrations for AWS S3, Apache
      Airflow, Apache Spark and MLflow, designed to run "typically in a distributed environment, such as
      Ray or Apache Spark". There is no tracing backend, prompt-management or eval-experiment surface in
      it. The repository''s last push was in January 2025.'
    accessed: '2026-08-13'
    http_status: 200
