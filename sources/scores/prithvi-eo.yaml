capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Adaptation pathway and Landsat-Sentinel input at 30 m; the 0.1 m to 15 m benchmark span was reached
    by fine-tuning a model pretrained only on 30 m data; no scientific-output generation.
  relative_to: terramind
  relation: one_below
  confidence: high
  note: Prithvi-EO ships TerraTorch fine-tuning configurations and notebooks and takes Harmonized Landsat
    and Sentinel data at 30 m. Its results on tasks from 0.1 m to 15 m come from fine-tuning a model pretrained
    only on 30-meter data, which shows adaptation rather than one model taking several resolutions. Its
    documented output is reconstruction of masked inputs rather than a scientific product, which keeps it
    a step below TerraMind, with its any-to-any generation.
  last_verified: '2026-11-16'
