capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: LLM memory managers that extract memories from conversations; update, removal and consolidation of existing
    memories; semantic collections and profiles, episodic memories and procedural prompt optimization; search tools
    scoped by namespace, such as per user; no time-based expiry or decay of its own
  confidence: medium
  note: LangMem extracts memories from conversations, consolidates or removes outdated ones with an LLM, and keeps
    semantic, episodic and procedural memory in namespaces an agent can search per user. It has no time-based forgetting
    of its own and leaves expiry to the store beneath it.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/langchain-ai/langmem/main/README.md
    shows: Memory management tools let agents "record and search information during active conversations", and a
      "Background memory manager" "automatically extracts, consolidates, and updates agent knowledge".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: e1edd000d263bfea842c34273add82421340c2caf2d7b87edd285daf02156ca3
  - url: https://langchain-ai.github.io/langmem/concepts/conceptual_guide/
    shows: Memory types are semantic (collections and profiles), episodic and procedural; memory managers "update
      or remove outdated memories, and consolidate"; memories sit in multi-level namespaces such as per user. The
      guide names no expiry or decay setting.
