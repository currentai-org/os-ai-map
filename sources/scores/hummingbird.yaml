capability:
  score: 2
  basis: feature_matrix
  basis_detail: 'category feature matrix: narrow kernel set or single-pass utility'
  value: Lowers classical ML models into PyTorch, TorchScript, ONNX and TVM tensor programs. One input class, and
    the transformation is a translation rather than an optimizing compilation.
  relative_to: tensorrt
  relation: two_below
  confidence: medium
  note: Hummingbird translates classical machine-learning models such as decision trees and random forests
    into PyTorch, TorchScript, ONNX or TVM tensor programs. That is a translation into another runtime's
    format rather than the optimizing compilation TensorRT performs, and it covers one input class only.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/microsoft/hummingbird/main/README.md
    shows: README says "you can use *Hummingbird* to convert your trained traditional ML models into [PyTorch](https://pytorch.org/),
      [TorchScript](https://pytorch.org/docs/stable/jit.html), [ONNX](https://onnx.ai/), and [TVM](https://docs.tvm.ai/))"
      and that supported models include "scikit-learn](https://scikit-learn.org/stable/) Decision Trees
      and Random Forest, and also [LightGBM]".
