  note: 'Desktop Commander offers a curated toolset over a single system, the caller''s own machine, with
    no credential to broker: commands simply run under the caller''s user permissions, level with filesystem-mcp.
    Its optional Remote MCP relay only authenticates the caller''s device to itself, so execution stays
    local rather than reaching a broker credential or hosted service.'
  last_verified: '2026-09-17'
