capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: one optimization family, applied broadly'
  value: Post-training quantization (GPTQ, AWQ, GGUF, FP8 and other methods) with kernels for five accelerator
    families and loaders for three serving stacks. Wide hardware reach within one optimization family.
  relative_to: apache-tvm
  relation: two_below
  confidence: medium
  note: GPT-QModel applies post-training quantization methods including GPTQ, AWQ, GGUF and FP8, with kernels
    for five accelerator families and loaders for three serving stacks (Transformers, vLLM and SGLang).
    That is one optimization family applied broadly across hardware, not the retargetable compilation Apache
    TVM performs across its whole pipeline.
