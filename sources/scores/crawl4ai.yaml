capability:
  score: 1
  basis: feature_matrix
  basis_detail: 'category feature matrix: full crawl-to-extraction pipeline over many strategies'
  value: '`AsyncWebCrawler.arun(url=...)` fetches a URL the caller names and returns markdown, with extraction
    strategies, hooks, session reuse and proxy rotation around it; the CLI takes a URL the same way'
  confidence: high
  note: Crawl4AI's core interface, `arun`, takes a URL to fetch rather than a query to search, and its crawling
    follows links from that URL rather than searching an index. Because it never accepts a query, it covers
    only the retrieval half of a find-then-extract workflow, not the discovery half a search interface would
    add.
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/unclecode/crawl4ai/main/README.md
    shows: 'The quickstart: `async with AsyncWebCrawler() as crawler: result = await crawler.arun(url="https://www.nbcnews.com/business")`,
      and the CLI `crwl https://www.nbcnews.com/business -o markdown`. Both take a URL. No query-based search
      interface appears in the README.'
    accessed: '2026-09-17'
    http_status: 200
