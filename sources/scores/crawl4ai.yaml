openness:
  score: 3
  class: source_available
  components:
    license:
    - name: Crawl4AI-Attribution-License
      detail: Apache-2.0 text plus an appended attribution condition covering public use; not OSI
    source:
      value: public
      detail: the published repository builds the crawler, the Docker deployment and the CLI
    core-gated:
      value: ungated
      detail: a Cloud API is announced as a separate closed beta beside the library, not carved out of it
  confidence: high
  note: 'Read to the end of the LICENSE rather than to the end of the Apache boilerplate, which is where this record
    first went wrong. The file carries the stock Apache-2.0 text, then after ''END OF TERMS AND CONDITIONS'' appends
    an Attribution Requirement: all distributions, publications or PUBLIC USES must carry a set credit line, prominently,
    in a NOTICE or README for distributions, in the acknowledgments for publications, in an About or Credits section
    for websites, and in the help output for command-line tools. That is not Apache-2.0''s own NOTICE clause restated.
    Apache-2.0 section 4(d) binds redistribution of the Work; this clause binds public USE of it, which is a condition
    the Apache grant does not carry, and section 4 permits added terms only over Your own modifications rather than
    over the Work. So the composite is not the OSI-approved license the badge and the GitHub API both report. It
    is an attribution and naming requirement that caps neither who may use the software nor at what scale, which
    is the permissive_non_osi tier stated word for word, and the ladder scores a public, ungated source under that
    tier at 3/source_available. crawl4ai is the first product on the map to exercise that rung, which had been pinned
    as a dead rule. The README calls attribution ''recommended'' and then lists methods you ''must'' include; the
    LICENSE governs and it says must.'
  raw: license:Crawl4AI-Attribution-License(Apache-2.0 text plus an appended attribution condition covering public
    use; not OSI);source:public(the published repository builds the crawler, the Docker deployment and the CLI);core-gated:ungated(a
    Cloud API is announced as a separate closed beta beside the library, not carved out of it)
  last_verified: '2026-08-30'
