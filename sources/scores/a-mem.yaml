capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: semantic and agentic search over stored notes; memory evolution that links each new note to related ones
    and rewrites their context and tags; no extraction, since notes are stored as given and only annotated; no time-based
    forgetting; a single linked note store
  confidence: medium
  note: 'A-MEM''s distinguishing step is evolution: each new note makes a model revisit its neighbors, link them
    and rewrite their context. It does not decide what to remember from a conversation, though, storing whatever
    text the agent hands it, and nothing in it expires or fades over time.'
  relative_to: lightmem
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/agiresearch/A-mem/main/README.md
    shows: '"When a new memory is added to the system: Generates comprehensive notes with structured attributes
      ... Analyzes historical memories for relevant connections ... Enables dynamic memory evolution and updates";
      the API adds notes with add_note and searches with search_agentic.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 6f7185bb241d8ed5f7c0b8c4716b4f5e5cf1e9a3c630c3a1a92e54c3f5fb88b0
