capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indian-language speech synthesis
  value: 1,704 hours from 10,496 speakers in 22 Indian languages, restored from IndicVoices recordings with
    enhancement models and filtered, documented in a NeurIPS paper, and used to train AI4Bharat's IndicF5 voice
    model.
  confidence: medium
  note: IndicVoices-R turns recognition recordings into a speech synthesis corpus covering all 22 scheduled
    languages with more than ten thousand voices, and AI4Bharat's IndicF5 voice model is trained on it. It
    is derived from IndicVoices, the larger corpus it restores audio from, and its speech is enhanced field
    audio rather than studio recording.
  relative_to: indicvoices
  relation: one_below
  last_verified: '2026-09-24'
