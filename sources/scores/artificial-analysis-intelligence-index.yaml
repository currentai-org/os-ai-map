  note: 'Methodology is well documented and one component harness (Stirrup) is MIT, but the Index itself
    (pipeline, internal dataset copies, grader config) is proprietary. In this ladder open_core means an
    OSI core with functionality withheld for a paid tier, and there is no open core here, only an open periphery:
    a repo that exists while the runtime does not ship is source:partial, which the ladder scores 2/source_available.
    The methodology page is at v4.1.1 with nine evals across four unequally weighted categories (Agents
    34%, Coding 24%, Scientific Reasoning 24%, General 18%), and Stirrup backs GDPval-AA v2, AA-Briefcase
    and Harvey LAB-AA rather than a single eval, so the recorded components understate it. Neither detail
    touches `source`: Artificial Analysis still states ''We maintain internal copies of all evaluation datasets''
    and still publishes no end-to-end Index pipeline, so a repo exists while the runtime does not ship.'
