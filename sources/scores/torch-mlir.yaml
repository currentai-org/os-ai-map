capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: one optimization family, applied broadly'
  value: Imports PyTorch programs through torch.fx, TorchScript and ONNX into the MLIR torch dialect,
    normalizes them to a backend contract, and lowers them to Linalg-on-Tensors, TOSA and StableHLO. No
    code generator or hardware target of its own; downstream compilers such as IREE take it from there.
  relative_to: tensorrt
  relation: one_below
  confidence: medium
  note: 'Torch-MLIR takes models from PyTorch and ONNX into MLIR and lowers them to three of the ecosystem''s
    standard dialects, which gives other compilers a shared PyTorch front end. It stops there: the final
    compilation for a device is left to tools such as IREE, so it sits a step below TensorRT, which compiles
    and runs the model on NVIDIA hardware.'
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/NVIDIA/TensorRT/main/README.md
      shows: README still describes TensorRT as NVIDIA's SDK for high-performance deep learning inference
        on NVIDIA GPUs, with the ONNX parser and plugins in the open-source repository, which is the whole-path,
        single-vendor compiler the comparison relies on.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 0d416f7aaa429e3638a6a3f25b0a5ed944e028a815dcaa271451bcc184b20236
  last_verified: '2026-11-12'
  sources:
