capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for Kenyan language text and speech
  value: Kencorpus holds 4,442 texts (5.6 million words) and 177 hours of speech in Swahili, Dholuo and Luhya,
    with companion tagging, QA and translation sets, documented in a paper, with one community translation
    model listed as trained on it.
  confidence: medium
  note: Kencorpus gives Swahili, Dholuo and Luhya a community-sourced text and speech corpus with tagging,
    question answering and translation sets, documented in a paper, with one community translation model trained
    on it. At under two hundred hours of speech and a few million words of text it is small beside English
    corpora of hundreds of thousands of hours and trillions of tokens, and WURA's African web corpus trained
    the AfriTeVa models.
  relative_to: wura
  relation: one_below
  last_verified: '2026-09-24'
  sources:
