  score: 3
  basis: feature_matrix
  basis_detail: risk coverage
  relative_to: llama-guard
  relation: one_below
  value: 13 critical safety risk categories plus a needs-caution label, with custom categories accepted
    in the prompt; trained for English prompt classification, with response classification by template,
    and published as defensive and permissive variants beside an open safety dataset.
  confidence: low
  note: Aegis covers 13 risk categories and accepts custom categories in the prompt, but it was trained
    only to classify English prompts, labeling responses through the same template. Llama Guard 3 classifies
    prompts and responses across 14 categories in eight languages and also screens tool calls, so Aegis
    sits a step below it.
