capability:
  score: 1
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: an access evaluation request in which a subject, action, resource and context go to a decision point and
    an allow or deny comes back, with batch evaluation and subject, resource and action search; no agent identity,
    delegation chain, approval step or signed decision record in the Final Specification
  confidence: medium
  note: 'The specification defines the per-request decision itself: a subject, action, resource and context go in
    and an allow or deny comes out. The working group''s profiles for approval workflows and token-exchange delegation
    are still drafts and are not part of the Final Specification.'
  relative_to: oxdeai
  relation: two_below
  last_verified: '2026-11-20'
  sources:
  - url: https://openid.net/specs/authorization-api-1_0.html
    shows: 'Authorization API 1.0, "Status: Final", published 11 January 2026: it "enables Policy Decision Points
      (PDPs) and Policy Enforcement Points (PEPs) to communicate authorization requests and decisions", with evaluation
      and search endpoints.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: f0ee89cc4a688f9f409dc323c8342579d74c45dc776a6b04a622ba9738de82bc
