capability:
  score: 5
  basis: feature_matrix
  value: GPU kernel language and MLIR-based compiler for custom high-performance deep-learning operators.
  confidence: high
  note: Triton is the kernel-authoring layer that PyTorch's inductor compiler uses to generate code for
    NVIDIA and AMD GPUs. It targets both vendors' hardware, while CPU support is still under development.
  last_verified: '2026-09-29'
  sources:
  - url: https://cdn.jsdelivr.net/gh/triton-lang/triton@main/README.md
    shows: README compatibility section lists "NVIDIA GPUs (Compute Capability 8.0+)" and "AMD GPUs (ROCm
      6.2+)", with CPUs "Under development"; it describes "a language and compiler for writing highly efficient
      custom Deep-Learning primitives".
    accessed: '2026-09-29'
