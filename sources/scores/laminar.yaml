adoption:
  level: 3
  signal_type: reported_traction
  confidence: low
  banded_quantity: GitHub stars (~3k); the ~17M lmnr PyPI figure is treated as CI/mirror-inflated and discounted
    rather than banded
  note: 'pypistats answers last_month 34,062,990 downloads for lmnr (last_week 9,228,203, last_day 1,293,104).
    That is a level-5 figure on the download scale and it is not believed: at ~1.3M downloads a day lmnr
    outruns langfuse, a project an order of magnitude larger by stars, contributors and customers, which
    is the tell for transitive or mirror pulls of an OTel auto-instrumentation SDK. The instrument is reported_traction
    rather than usage_volume for exactly that reason: a usage_volume band claims a count somebody can recompute,
    and the only count available here is one this record disputes. Keeping the instrument while discounting
    the figure by an order of magnitude was the incoherent part. What the band rests on is the standing
    an Apache-2.0 tracing platform of this size has - a real but small user base, ~3k GitHub stars - which
    is what reported_traction is the instrument for. No `reach` word is recorded; omitting it is the honest
    default here.'
  last_verified: '2026-08-14'
  sources:
  - url: https://pypistats.org/api/packages/lmnr/recent
    shows: last_month = 34,084,386 downloads for lmnr (last_week 9,210,651, last_day 1,617,970); recorded
      as a measurement of the channel, not as the basis of the band.
