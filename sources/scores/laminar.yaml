adoption:
  level: 3
  signal_type: reported_traction
  confidence: low
  banded_quantity: GitHub stars (~3k); the ~17M lmnr PyPI figure is treated as CI/mirror-inflated and discounted
    rather than banded
  note: 'pypistats reports 34,062,990 downloads in the last month for lmnr (9,228,203 in the last week,
    1,293,104 in the last day). That is a level-5 figure on the download scale and it is not believed: at
    roughly 1.3M downloads a day lmnr would outrun Langfuse, a project an order of magnitude larger by stars,
    contributors and customers, which is the tell for transitive or mirror pulls of an OpenTelemetry auto-instrumentation
    SDK. That is why the band rests on reported traction rather than a download count - a download band
    claims a figure somebody else can recompute, and the only figure available here is one this record disputes.
    What the level does rest on is the standing of an Apache-2.0 tracing platform of this size: a real but
    small user base, around 3,000 GitHub stars.'
  last_verified: '2026-08-14'
  sources:
  - url: https://pypistats.org/api/packages/lmnr/recent
    shows: last_month = 34,084,386 downloads for lmnr (last_week 9,210,651, last_day 1,617,970); recorded
