adoption:
  level: 5
  signal_type: usage_volume
  reach: '>10M'
  confidence: medium
  banded_quantity: lmnr PyPI downloads over the trailing 30 days (17,798,110 as measured by
    currentai.signal_packages.downloads)
  note: 17,798,110 downloads for lmnr over the trailing 30 days, which bands at level 5 on the software
    download scale. Re-banded from 3 on 2026-09-14 under issue 448, and the reasoning that held it at 3
    was withdrawn rather than merely overridden, because it was wrong in two separate ways.

    First, its stated comparison does not hold. The old note argued the figure could not be real because
    lmnr would then outrun Langfuse, a much larger project. Measured on the same grain on the same day,
    Langfuse reports 24,272,571 and lmnr 17,798,110 - lmnr sits at roughly three quarters of Langfuse,
    not ahead of it. The 34M figure the old note reasoned from came from a pypistats last-month read,
    which is a different window from the trailing-30-day figure the pipeline computes.

    Second, and the reason this is a withdrawal rather than a correction, the underlying move was a
    downloads-against-stars plausibility test. build/check_channel_authority.py excludes exactly that
    and says why - it is computable and wrong, because a test that lets stars decide whether a usage
    measurement counts hands stars a veto instead of a vote. The old banded_quantity named GitHub stars
    outright, which issue 441 forbids as a basis for a level.

    Confidence is medium rather than high because lmnr is an OpenTelemetry auto-instrumentation SDK and
    some share of its installs will be transitive. That is a reason to hold confidence below high; it is
    not a reason to substitute a star count for a measurement.
  last_verified: '2026-09-14'
  sources:
  - url: https://pypistats.org/packages/lmnr
    shows: lmnr PyPI download volume, the channel this band rests on
    accessed: '2026-09-14'
  - url: https://github.com/lmnr-ai/lmnr
    shows: Apache-2.0 tracing platform, around 3,250 GitHub stars (corroborating, not the basis)
    accessed: '2026-09-14'
