capability:
  score: 3
  basis: feature_matrix
  value: 'Has: OTel-native tracing (Vercel AI SDK, Browser Use, LangChain, OpenAI/Anthropic/Gemini); evals
    (SDK+CLI, CI/CD); datasets + annotation UI; SQL query over traces; dashboards. Lighter on: prompt
    versioning/management and explicit cost tracking (not surfaced in repo).'
  confidence: medium
  relative_to: langfuse
  relation: one_below
  note: Solid coverage of OpenTelemetry-native tracing, evaluations run from the SDK, CLI and CI, datasets
    with an annotation UI, and a differentiated SQL-over-traces and dashboard layer. Prompt versioning and
    explicit cost tracking are not surfaced in the repository, which leaves it below Langfuse and MLflow
    on breadth, one rung under the anchor at 4.
  last_verified: '2026-08-13'
  sources:
  - url: https://github.com/lmnr-ai/lmnr
    shows: 'README feature checklist - "Evals. Unopinionated, extensible SDK and CLI for running evals
