capability:
  score: 3
  basis: feature_matrix
  basis_detail: voice moderation coverage
  value: Multi-label scoring of 16 kHz voice clips of up to 30 seconds against eight policy categories (asking for personal
    information, discrimination, harassment, sexual content, illegal and regulated content, dating and romance, profanity,
    disruptive audio), with language-detection heads, in 30 languages. Roblox reports 61% recall weighted by its voice-chat
    language mix at a 1% false-positive rate, and per-language recall on the card from 29.5% for Czech to 75.2% for Polish.
  relative_to: llama-guard
  relation: one_below
  confidence: low
  note: It moderates speech directly, across 30 languages, where Llama Guard reads text. Its eight fixed categories cover
    fewer harms than Llama Guard's fourteen, and on Roblox's own tables it still misses a large share of violations in most
    languages, so it sits a step below Llama Guard.
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://huggingface.co/meta-llama/Llama-Guard-3-8B
      shows: 'The peer''s model page still lists hazard categories from "S1: Violent Crimes" to "S14: Code Interpreter Abuse"
        for prompt and response classification, and says the model "provides content moderation in 8 languages". The rendered
        page''s digest differs from the one llama-guard records from 2026-09-29.'
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: e770fa767aab6f58dc57e57cd6bdab7ce7119cc53b70c04d9749be36abfc842c
