capability:
  score: 3
  basis: feature_matrix
  value: tracing (traces/spans for LLM calls, tool calls, agent decisions via Cloud Trace/OTel) + perf
    monitoring dashboard (token consumption, latency, error rates, tool calls) + quality/evaluation (integrated
    Gen AI Evaluation service incl User Simulator) + Cloud Logging. Cost/token tracking present; prompt
    management and dedicated annotation queues not evidenced as native.
  confidence: medium
  relative_to: langfuse
