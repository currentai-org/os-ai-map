capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Chunked, compressed N-dimensional array storage in memory, on disk, in zip files or on object storage such as S3,
    with concurrent reads and writes from many threads or processes and hierarchical groups. No query, vector or full-text
    index and no server or cluster mode of its own.
  relative_to: deep-lake
  relation: at
  confidence: medium
  note: Zarr stores large arrays in chunks on local disk or object storage and lets many processes read and write them at
    once, so it works as a store on its own, alongside Deep Lake. It has no query or search layer and no clustered serving,
    which the distributed systems above it provide.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/activeloopai/deeplake/main/README.md
      shows: 'Re-read of the peer. Deep Lake''s README still describes "storage for all data types" with "querying and vector
        search, data streaming while training models at scale, data versioning and lineage" and says "it is serverless", with
        no cluster or distributed serving mode: a single store, the same kind of system Zarr is.'
      accessed: '2026-11-12'
