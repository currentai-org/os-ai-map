  score: 3
  basis: benchmark
  basis_detail: self-reported CV3-Eval zero-shot WER and speaker similarity
  value: IndexTTS is not on the Artificial Analysis TTS leaderboard. The README reports zero-shot cloning on CV3-Eval in Chinese,
    English, Spanish and Japanese (Arabic on an in-house set), where IndexTTS2.5-RL averages 6.00 WER and 73.63 speaker similarity
    beside CosyVoice 3, OmniVoice, VoxCPM2 and Fish Audio S2 Pro.
  confidence: low
  note: IndexTTS has no listener rating yet, so it is placed on its own results on the public CV3-Eval test set, where its
    figures sit close to CosyVoice 3, OmniVoice and VoxCPM2.
