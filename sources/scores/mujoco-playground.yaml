capability:
  score: 4
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: Large-batch GPU RL training on MuJoCo Warp (8,192 parallel environments in the README example) with state and vision
    observations, tasks across control, manipulation and humanoid whole-body tracking, teleoperation, system identification
    and zero-shot sim-to-real deployment on SO-101 and YAM arms. MuJoCo is its only physics engine.
  relative_to: isaac-lab
  relation: one_below
  confidence: medium
  note: MuJoCo Playground trains thousands of environments in parallel on the GPU from state or camera observations and carries
    the same policy onto real hardware. Its physics all comes from MuJoCo, where Isaac Lab lets a task switch between several
    physics backends, so it sits a step below Isaac Lab.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/isaac-sim/IsaacLab/main/README.md
      shows: Re-read of the peer. Isaac Lab's README still calls it "a multi-backend framework supporting physics and rendering
        through Newton, OVRTX, OVPhysX, and NVIDIA Isaac Sim" and lists "Ready-to-train implementations of more than 30 environments"
        and "RGB/depth/segmentation cameras".
