capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: agent DIDs and signed grant tokens; built-in policy engine with OPA and Cedar backends, and scope checks
    on each token use; sub-agent grants that must be a strict subset of the parent's scopes; passkey-bound human
    consent and exact human approvals for wallet spends; hash-chained audit trail and W3C verifiable credentials
  confidence: medium
  note: 'Grantex covers every part of the chain: agents get their own identities, requests are checked against granted
    scopes and policy, delegated grants can only narrow, consequential spends can wait for an exact human approval,
    and the audit trail is hash-chained. Some of these features, such as passkey enrollment, are off by default
    on a self-hosted server.'
  relative_to: agent-governance-toolkit
  relation: at
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/mishrasanjeev/grantex/main/README.md
    shows: The README says Grantex "gives each agent a verifiable identity and scoped, time-limited, revocable authority",
      that "Sub-agent scopes must be a strict subset of the parent's scopes", that wallet policy can "require an
      exact human approval", that it supports OPA and Cedar policy backends, and lists an audit-trail example with
      "hash chain integrity verification".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: d12431e11bf6e3cd19144c449ba318d8336df78bcd255e1c6bcbc07c5e57ca5b
