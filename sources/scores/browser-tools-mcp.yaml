capability:
  score: 3
  basis: feature_matrix
  value: a curated tool surface over the user's own Chrome session - console and network logs, the selected element,
    tab listing and navigation, soft clicks and typing, screenshots, storage reads, and Lighthouse accessibility,
    performance, SEO and best-practice audits - read through a DevTools extension from a browser the user is already
    signed into
  confidence: medium
  note: 'BrowserTools MCP works on one system, the user''s browser, and brings no credentials of its own: it reads
    the session the user is already signed into, and its connector runs on the user''s machine. That puts it level
    with Playwright MCP, which drives a fresh browser instead; neither manages logins nor hosts anything.'
  relative_to: playwright-mcp
  relation: at
