capability:
  score: 4
  basis: feature_matrix
  basis_detail: defense coverage
  value: Real-time prompt-injection, jailbreak, data-leakage, content, malicious-link and agent-behavior
    screening for LLM apps and agents.
  confidence: low
  note: The Guard API screens prompts, model outputs, tool calls and tool descriptions for prompt attacks,
    data leakage, content violations, malicious links and off-policy agent behavior, with custom guardrails
    on top. Check Point now sells it as AI Guardrails, the runtime layer of its AI Agent Security product,
    which adds agent discovery and risk assessment.
  last_verified: '2026-09-29'
  sources:
  - url: https://www.lakera.ai/
    shows: AI Agent Security is described as 'Runtime protection for AI applications' with 'Real-time threat
      detection', 'Prompt attack prevention' and 'Data leakage protection'; the risks listed are prompt
      injection attacks, AI data leaks, toxic content generation, indirect prompt injection and multilingual/multimodal
      attacks, at 'sub-50 ms runtime latency'.
