  confidence: high
  note: 'Weights downloadable and freely usable commercially at any scale, corpus not released, no training
    code, so 3/open_weights. Not 2/restricted (issue #117): TII-Falcon-License-2.0 is Apache-based with
    an acceptable-use policy, and a conduct restriction caps neither who may use the model nor at what scale,
    so it sits in permissive_non_osi beside attribution requirements rather than in the capped tier beside
    Llama''s 700M-MAU ceiling. Not 4 or 5 either: the corpus and the pipeline are both closed, and the license
    is non-OSI regardless, since the OSD forbids discriminating against a field of endeavor. The Hub reports
    this license as `other`, an abstention rather than an answer, so the tier rests on TII''s published
    text.'
  last_verified: '2026-08-13'
