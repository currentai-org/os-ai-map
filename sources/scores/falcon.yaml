  note: 'Weights are downloadable and freely usable commercially at any scale, but the corpus is not released
    and there is no training code, so 3. Not 2: the TII-Falcon-License-2.0 is Apache-based with an acceptable-use
    policy, and a conduct restriction caps neither who may use the model nor at what scale, so it belongs
    with permissive non-OSI licenses and attribution requirements rather than with capped ones such as Llama''s
    700M-MAU ceiling. Not 4 or 5 either, since corpus and pipeline are both closed and the license is non-OSI
    in any case - the open-source definition forbids discriminating against a field of endeavor. Hugging
    Face reports the license as ''other'', an abstention rather than an answer, so the reading rests on
    TII''s published text.'
