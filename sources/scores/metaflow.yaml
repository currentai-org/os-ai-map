capability:
  score: 3
  basis: feature_matrix
  value: '@resources(gpu=...) as Metaflow''s own field; @batch and @kubernetes submit
    the step to AWS Batch or Kubernetes, naming the queue; per-step retries, checkpoints
    and resume; run, artifact and model tracking'
  confidence: medium
  relative_to: flyte
  relation: at
  note: The @resources(gpu=...) decorator is Metaflow's own field, not a pod spec passed through, and Metaflow
    decides when a step runs and which queue or cluster it goes to; AWS Batch or the Kubernetes scheduler
    then chooses the machine. That is the same shape of decision as Flyte, and the two sit together.
  last_verified: '2026-09-15'
  sources:
  - url: https://raw.githubusercontent.com/Netflix/metaflow/master/metaflow/plugins/resources_decorator.py
    shows: Metaflow's own ResourcesDecorator, declaring a gpu field on the step. Establishes
      that the accelerator request is expressed in Metaflow's schema.
