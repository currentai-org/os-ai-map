  basis: feature_matrix
  value: '@resources(gpu=...) as Metaflow''s own field; @batch and @kubernetes submit
    the step to AWS Batch or Kubernetes, naming the queue; per-step retries, checkpoints
    and resume; run, artifact and model tracking'
  confidence: medium
  relative_to: flyte
  relation: at
  note: 'Admitted on the accelerator limb - @resources(gpu=...) is Metaflow''s own
    decorator, not a pod spec passed through. Band 3: Metaflow decides when a step
    runs and which queue or cluster it is submitted to, and AWS Batch or the Kubernetes
    scheduler chooses the machine. Under this dimension it does what flyte does, and
    the two are banded together.'
  last_verified: '2026-09-15'
