capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: PPO, GRPO, RLOO, REINFORCE, GSPO, CISPO, SAPO and DAPO, plus SFT; training backends FSDP and Megatron,
    with 5D parallelism for MoE models on Megatron; inference through vLLM, SGLang or any OpenAI-compatible endpoint
    with weight sync; synchronous, one-step-off and fully asynchronous RL; a Tinker API backend with multi-user LoRA
    and a JAX engine for GPU and TPU; skyrl-gym environments and skyrl-agent for long-horizon agents. A narrower documented
    algorithm catalog than verl''s.'
  confidence: medium
  note: 'SkyRL covers a broad RL post-training stack: PPO, GRPO and several newer policy-optimization variants over FSDP
    or Megatron, vLLM or SGLang rollout, fully asynchronous training, and a local implementation of the Tinker API. It
    sits a step below verl, which documents a wider algorithm catalog and has been used to train frontier reasoning models.'
  relative_to: verl
  relation: one_below
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://raw.githubusercontent.com/volcengine/verl/main/README.md
      shows: The verl README still lists reinforcement learning with PPO, GRPO, GSPO, ReMax, REINFORCE++, RLOO, PRIME,
        DAPO and DrGRPO, "FSDP, FSDP2 and Megatron-LM for training", support that "Scales up to 671B models and hundreds
        of GPUs", and reports that Seed-Thinking-v1.5 was trained with verl. The body is byte-identical to the one verl's
        own capability record cites.
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: ddf49da56b709047d7641c6885c00bb43a68944aa458f03965008978d75a019d
  last_verified: '2026-10-19'
  sources:
