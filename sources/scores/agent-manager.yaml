capability:
  score: 2
  basis: feature_matrix
  value: Session supervision over user-installed coding CLIs - nine supported tools each in a persistent
    tmux session, live status in one project tree, prompts sent without attaching, revive and fork on
    the same conversation, full-file diff review with line comments returned to the agent, optional per-session
    git worktrees, and MCP tools for one agent to spawn, message and wait on another. Not an agent itself,
    and no standardized benchmark result.
