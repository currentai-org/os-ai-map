capability:
  score: 4
  basis: feature_matrix
  basis_detail: provenance, size and downstream use for African-language instruction data
  value: About 148 million training examples for Hausa, Yoruba, Swahili, isiZulu and isiXhosa, recast from
    existing translation and task datasets such as MAFAND-MT, MasakhaNER and AfriSenti, documented in the
    InkubaLM paper and a card listing every source, with community fine-tunes such as Pula-8B tuned on it.
  confidence: medium
  note: Inkuba-Instruct recasts African translation and task datasets into nearly a hundred and fifty million
    instruction examples for five languages, and its card lists every source. Those examples come from existing
    datasets rather than new writing by people, and the only models tuned on it, such as Pula-8B, are community
    fine-tunes.
  last_verified: '2026-10-30'
  sources:
