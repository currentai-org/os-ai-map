  score: 4
  basis: feature_matrix
  basis_detail: provenance and downstream use for African-language instruction data
  value: Instruction data for Hausa, Yoruba, Swahili, isiZulu and isiXhosa, recast from existing human-annotated
    task datasets such as MAFAND-MT, MasakhaNER and AfriSenti, documented in the InkubaLM paper and a card
    listing every source, with Pula-8B tuned on it.
  confidence: medium
  note: Inkuba-Instruct turns well-known African task datasets into instruction data for five languages, lists
    every source on its card, and the Pula-8B model is tuned on it. Its content is a recasting of existing
    human-annotated sets rather than new writing, and its named use is a single community model, which places
    it alongside WangchanThaiInstruct.
  relative_to: wangchan-thai-instruct
