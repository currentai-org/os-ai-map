capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: LLM extraction of user profiles and event gists from buffered chats; profile merging and re-organization
    of crowded topics; a user profile plus an event timeline with tag and time-window search; a per-user context
    API; no time-based expiry or decay of memory
  confidence: medium
  note: Memobase extracts a structured profile and an event timeline from each user's chats, merges new details
    into the profile, and returns both through a per-user context call. Nothing in it expires or fades memory over
    time; old events are only filtered out by a time window at retrieval.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://docs.memobase.io/features.md
    shows: Memobase "analyzes user interactions to build rich, structured profiles" organized by topic and subtopic;
      recent data is buffered "before being processed and integrated into the long-term user profile".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 5cc8016226c7edcfc635a38cb00ae75e4c4b9c3b49db16b8947e3af3f79aa9ea
