  basis: feature_matrix
  value: 'coverage: web/images/news/maps/shopping/video/scholar/patents/autocomplete; structured JSON output;
    ~1-2s latency; freshness=live Google index'
  confidence: medium
  note: 'Finds, and returns references. Serper resells Google''s live index as structured JSON - organic results,
    knowledge graph, related searches - and returns nothing behind the links: no extraction endpoint and no
    answer. It is the anchor the other band-3 records are placed against, which is why it carries no edge of
    its own. Its price and latency copy is not what this ladder measures.'
  last_verified: '2026-09-17'
