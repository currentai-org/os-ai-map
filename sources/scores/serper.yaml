  confidence: low
  note: Popular low-cost SERP API widely wired into agent stacks (LangChain/CrewAI tool integrations), but
    the vendor publishes no hard user or query-volume figure and no primary download or API-call count is verifiable.
    serper.dev carries price and speed copy only - "The World's Fastest and Cheapest Google Search API", "search
    results in 1-2 seconds, at an unbeatable price starting at $0.30 per 1,000 queries" - and a rate card is
    not a volume. There is no package, repository or registry artifact to band either. Declining to score adoption
    rather than rely on marketing claims.
