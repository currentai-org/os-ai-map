capability:
  score: 4
  basis: feature_matrix
  value: 'Training abstraction over PyTorch: Trainer and Fabric interfaces that move unchanged model code between
    CPU, CUDA and MPS GPUs, TPUs, multi-GPU and multi-node configurations; distributed strategies including DDP,
    FSDP and DeepSpeed; mixed precision out of the box. Structures a training loop rather than providing the tensor
    engine underneath it.'
  confidence: medium
  note: Scored 4 as a library built on a framework rather than a framework. It structures and distributes a PyTorch
    training loop, which is the same shape as accelerate at 4 in this category, and depends on PyTorch for the tensor
    engine and autograd that put pytorch at 5. Its breadth of accelerator and strategy coverage is what holds it
    at the top of that band. Stated here rather than recorded as relative_to because accelerate has not been confirmed as recently as this pass, and a comparison cannot claim a fresher verification date than its root.
  last_verified: '2026-08-31'
  sources:
  - url: https://raw.githubusercontent.com/Lightning-AI/pytorch-lightning/master/README.md
    shows: The Key features section documents switching between CPU, GPU (CUDA and MPS), TPU, multi-GPU and multi-node
      execution with no code changes via the Fabric accelerator/devices/num_nodes arguments, and distributed strategies
      DDP, FSDP and DeepSpeed with mixed precision available out of the box.
    accessed: '2026-08-31'
