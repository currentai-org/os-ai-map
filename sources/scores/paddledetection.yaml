capability:
  score: 3
  basis: feature_matrix
  value: detection, instance segmentation, keypoint detection and multi-object tracking model zoo (PP-YOLOE, PicoDet,
    RT-DETR, DEIM and others, over 300 pretrained models) with training configs, plus the PP-Human and PP-Vehicle
    pipelines
  relative_to: detectron2
  relation: at
  confidence: high
  note: PaddleDetection, like Detectron2, is a model zoo with the training tools around it, and its detectors predict
    the classes they were trained on, so a new label set needs a training run. The PP-Human and PP-Vehicle pipelines
    run without training, but only on the people and vehicles they were built for.
