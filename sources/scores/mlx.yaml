capability:
  score: 4
  basis: feature_matrix
  value: Array framework with composable function transformations (automatic differentiation, automatic vectorization,
    graph optimization), lazy evaluation, dynamic graph construction, a unified memory model letting arrays live
    in shared memory across CPU and GPU, and APIs in Python, C++, C and Swift with mlx.nn and mlx.optimizers following
    PyTorch conventions. Foundational in kind, but targets Apple silicon only.
  confidence: medium
  note: 'Scored 4 rather than 5 on reach of hardware rather than depth of design. MLX has the shape of a foundational
    framework - its own array type, composable transforms and autodiff, and an ecosystem built on it - but it runs
    on Apple silicon alone, where pytorch, tensorflow and jax at 5 are hardware-portable. openvino sets the precedent
    in this category at 4: a technically strong framework scoped to one vendor''s hardware. Stated here rather than recorded as relative_to because no candidate root has been confirmed as recently as this pass.'
  last_verified: '2026-08-31'
  sources:
  - url: https://raw.githubusercontent.com/ml-explore/mlx/main/README.md
    shows: The README's key-features list documents a NumPy-following Python API with C++, C and Swift APIs, higher-level
      mlx.nn and mlx.optimizers packages following PyTorch, composable function transformations for automatic differentiation,
      automatic vectorization and graph optimization, lazy computation, and dynamic graph construction.
