capability:
  score: 3
  basis: feature_matrix
  basis_detail: query interface and response format read from arXiv's API user manual
  value: '`/api/query` takes a fielded `search_query` (ti, au, abs, co, jr, cat, rn, all, with Boolean operators
    and a submittedDate range) or an `id_list`, sorts by relevance, lastUpdatedDate or submittedDate, and returns
    an Atom feed of entries with title, authors, abstract, categories and links to the abstract page and PDF, up
    to 2,000 per call'
  confidence: high
  relative_to: searxng
  relation: at
  note: The API returns a list of matching papers, each with its full abstract and a link to its PDF, but not the
    paper itself, so getting the text means a separate download and a PDF parser of the caller's own. Returning
    references without the content behind them puts it level with SearXNG. It composes no answer.
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://docs.searxng.org/dev/search_api.html
      shows: SearXNG's search API still documents `GET /search` and `POST /search` returning results in json, csv
        or rss format, with parameters for query, categories, language, page, time range and safe search, and no
        endpoint that fetches page content or composes an answer.
      accessed: '2026-10-13'
      http_status: 200
      content_sha256: 86521c7e3e817c0261fa6e3ce78d4bc17b5bf4499d2be8b465c73cefbd51c6b6
  last_verified: '2026-10-13'
  sources:
  - url: https://info.arxiv.org/help/api/user-manual.html
    shows: Field prefixes "ti Title au Author abs Abstract co Comment jr Journal Reference cat Subject Category
      rn Report Number id Id (use id_list instead) all All of the above"; sortBy "relevance", "lastUpdatedDate",
      "submittedDate"; max_results limited "to 30000 in slices of at most 2000 at a time"; "The <summary> element
      contains the abstract for the article"; entry links to the abstract page, the pdf and a resolved doi.
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: a4f8c339c191e35addd5a658114015f3a44000de89ec15ba633836a6c5db57b9
