capability:
  score: 4
  basis: feature_matrix
  value: terminal coding agent with file edit, shell and web search tools in a full-screen TUI; headless mode with JSON
    and streaming-JSON output; ACP agent mode over stdio or WebSocket for editors and SDKs; parallel subagents with
    optional git-worktree isolation; plan mode with plan review; ask, classifier-based auto and always-approve permission
    modes; opt-in OS-level sandbox (Landlock, Seatbelt); MCP, skills, plugins, marketplaces and hooks; SpaceXAI models
    by default, with OpenAI-compatible, Anthropic Messages and Ollama endpoints configurable; no published benchmark
    result
  confidence: medium
  note: Grok Build covers the full terminal coding agent, with parallel subagents in separate worktrees, plan mode, an
    OS-level sandbox, ACP for editors and other providers' models. It sits a step below OpenHands, which runs agents
    in containers, on VMs or in cloud backends and publishes benchmark results, while Grok Build runs on the user's
    machine with no benchmark of its own.
  relative_to: openhands
  relation: one_below
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://raw.githubusercontent.com/OpenHands/OpenHands/main/README.md
      shows: The OpenHands README leads with "Run OpenHands, Claude Code, Codex, Gemini, Pi, OpenCode, or any ACP-compatible
        agent across local, remote, and cloud backends" and offers running agents in "Docker containers, on VMs, or within
        your company infrastructure".
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: ba3c3b5c271353eb44d78feb1e1d991146a23d68c83cd3dc5351c46e369978a0
