  basis: feature_matrix
  value: 'isolation: microVM (hardware-isolated, top tier) plus secure containers; cold-start: ~200ms
    microVM spin-up; language/runtime breadth: arbitrary containers/runtimes (broad); persistence: stateful
    workloads / long-running agents supported; scale: multi-cloud, 330+ AZs, millions of containers'
  confidence: medium
  note: Northflank Sandboxes uses microVM isolation via Kata Containers and gVisor, boots in under a second,
    and can deploy inside a customer VPC; independent ComputeSDK benchmarks confirm a 0.25-second median
