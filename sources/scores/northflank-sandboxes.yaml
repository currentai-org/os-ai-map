  score: 4
  basis: feature_matrix
  value: 'isolation: microVM (hardware-isolated, top tier) plus secure containers; cold-start: microVM boot
    in under a second; language/runtime breadth: arbitrary containers/runtimes (broad); persistence: ephemeral
    or persistent sandboxes with attachable volumes, no forced time limit; scale: multi-cloud, 330+ AZs,
    millions of containers'
  confidence: medium
  note: Northflank Sandboxes runs each workload in its own microVM through Kata Containers or gVisor, boots
    a microVM in under a second, supports ephemeral or persistent sandboxes with no forced time limit, and
    can deploy inside a customer VPC. Its isolation and start-up speed match the leading sandbox platforms,
    but its evidence of scale is platform-wide rather than specific to sandboxes.
