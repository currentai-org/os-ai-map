capability:
  score: 3
  basis: feature_matrix
  value: LSTM text recognition across 100+ languages; output as plain text, hOCR, ALTO, TSV and PDF; no layout
    understanding or document-structure recovery of its own
  confidence: medium
  note: Tesseract's LSTM engine recognizes characters and their positions in plain text, hOCR, ALTO, TSV
    or PDF, but recovers no reading order, tables or document structure of its own. It remains the OCR engine
    many other document tools build their own recognition on, even though it leaves structure recovery to
    whatever wraps it.
  last_verified: '2026-09-16'
