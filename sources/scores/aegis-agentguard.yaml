capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: agent registry with per-agent status, tool scope and optional Ed25519 or shared-secret authentication;
    per-call allow, pending or block decision from a five-stage classifier and policy DSL; calls held in the Cockpit
    approval queue until a person allows or rejects them; Ed25519-signed decision receipts and an RFC 6962 Merkle
    transparency log; no delegation between agents
  confidence: medium
  note: Aegis registers agents with their own keys, decides each tool call before it runs, holds risky calls
    for a person and signs a receipt for every allowed call, all in the free build. Without a paid license
    it blocks and holds calls for one agent only and audits the rest, and it has no way to pass narrowed
    authority from one agent or user to another.
  relative_to: agent-governance-toolkit
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/Justin0504/Aegis/main/README.md
    shows: The README describes "Agent registry + identity" with "optional Ed25519 / shared-secret authentication",
      a pipeline that "Emits allow / pending / block", pending calls where "a human clicks Approve or Reject", and
      "an Ed25519-signed receipt" on every allow.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: ff49144dbb70fdadf37977454c77159834b5faf22d0d2a1d2c86323173da21c4
