    HELM, multilingual); model-backend breadth: inspect-ai/Accelerate/vLLM/SGLang/Nanotron/TGI/LiteLLM/HF
    Inference Endpoints and providers/custom; custom task and metric authoring; agentic-eval: via inspect-ai
    backend'
  confidence: high
  relative_to: lm-evaluation-harness
  relation: one_below
  last_verified: '2026-11-16'
  note: lighteval ships more than a thousand tasks, runs on many model backends including vLLM, SGLang and
    hosted endpoints, supports custom tasks and metrics, and reaches agentic evaluation through its inspect-ai
    backend. It sits a step below lm-evaluation-harness, which has been used to report results in hundreds
    of papers and is the more established reference.
