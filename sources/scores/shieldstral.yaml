capability:
  score: 4
  basis: feature_matrix
  basis_detail: steerable bring-your-own-policy, text and image
  value: Policy-adaptive yes/no classification against a natural-language policy for prompts, responses, prompt-response
    pairs and images, in twelve languages, returning a continuous score. On the card's F1 tables it posts 88.1 on
    WildGuardTest prompts against 87.3 for gpt-oss-safeguard-20b and 88.2 for Qwen3Guard-8B, and 97.7 on VLGuard
    for images.
  relative_to: gpt-oss-safeguard
  relation: at
  confidence: medium
  note: Like gpt-oss-safeguard, Shieldstral checks content against a policy the user writes rather than a fixed
    taxonomy, and on Mistral's own benchmark tables the two trade wins at a seventh of the size. Shieldstral also
    moderates images, but it answers only yes or no and gives no reasoning, so it sits level with gpt-oss-safeguard
    rather than ahead.
  comparison:
    last_attested: '2026-10-12'
    sources:
