capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for English-Indic parallel text
  value: About 230 million English-Indic sentence pairs across all 22 scheduled languages, mostly mined or
    drawn from existing corpora with 2.2 million human-translated pairs, documented in a TMLR paper, and used
    to train IndicTrans2.
  confidence: medium
  note: BPCC is the largest public parallel corpus for Indian languages, and AI4Bharat trained IndicTrans2,
    the first translation model to cover all 22 scheduled languages, on it. Most pairs are mined from the web,
    while its 2.2 million human-translated pairs give every language a checked core.
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2305.16307
    shows: 'Abstract: BPCC is "the largest publicly available parallel corpora for Indic languages. BPCC contains
      a total of 230M bitext pairs"; IndicTrans2 is "the first model to support all 22 languages".'
    accessed: '2026-09-24'
