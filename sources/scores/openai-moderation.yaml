capability:
  score: 3
  basis: feature_matrix
  basis_detail: category coverage
  value: Multi-category text (and image) moderation aligned to OpenAI's content policy; convenient but
    fixed taxonomy.
  confidence: low
  note: The endpoint scores text and images against thirteen fixed categories and accepts no custom policy,
    unlike policy-conditioned models that reason over a policy the user writes. It does not classify audio.
  last_verified: '2026-09-29'
  sources:
  - url: https://developers.openai.com/api/docs/guides/moderation.md
    shows: The guide says the omni-moderation-latest "model accepts text and image inputs. It doesn't classify
      audio." Its category table lists thirteen fixed categories, from harassment and hate through illicit,
      self-harm, sexual and violence, with "Categories marked as" text only not supporting images, and warns
      that "custom policies that rely on" category scores "may need recalibration over time"; there is no
      option for supplying a custom policy.
