  score: 3
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Creates and validates OSCAL catalogs, profiles, component definitions, SSPs and assessment artifacts;
    git-native authoring; detached DSSE signing as a beta command.
  relative_to: nvtrust
  relation: two_below
  confidence: high
  note: Its output is OSCAL, a published standard that auditors and their tools can validate independently,
    which puts it above tools that emit their own report formats. The content is still the operator's assertion,
    and signing is a beta feature, so it sits two steps below NVIDIA's hardware attestation.
