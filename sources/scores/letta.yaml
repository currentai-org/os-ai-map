capability:
  score: 4
  basis: feature_matrix
  value: self-editing memory blocks and skill learning; git-tracked context (MemFS); background memory
    consolidation (dreaming); subagents and agent-to-agent calls; hooks; permission modes; crons and schedules;
    Slack, Telegram and Discord channels; App Server with an Agent SDK; model-agnostic; no first-party
    benchmark
  confidence: medium
  note: Letta Code agents keep persistent memory, rewrite their own memory, skills and prompts, call subagents
    and run on schedules across several messaging channels. That is the same self-improving, long-running
    agent design as Hermes Agent, and like Hermes Agent it has no published benchmark result.
  relative_to: hermes-agent
  relation: at
  comparison:
    last_attested: '2026-10-07'
    sources:
