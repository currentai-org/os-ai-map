capability:
  score: 5
  basis: feature_matrix
  value: gang scheduling of a PodGroup as one all-or-nothing allocation; queues with
    fair-share, reclaim and preemption; GPU-aware placement including sharing; binds
    the pods it admits rather than deferring the node choice
  confidence: medium
  relative_to: kai-scheduler
  relation: at
  note: Volcano's own scheduler makes the placement decision for the pods in a PodGroup and admits them
    as one allocation, choosing the machines and reserving a multi-machine set together. It sits level with
    KAI Scheduler, which does the same thing, rather than above it.
  last_verified: '2026-09-15'
