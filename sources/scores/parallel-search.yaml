    shows: '"The Search API takes a natural language objective and returns relevant excerpts optimized for
      LLMs, replacing multiple keyword searches with a single call for broad or complex queries." The documented
      response is a results array of {url, title, publish_date, excerpts}, the example excerpts carrying extracted
      page text.'
