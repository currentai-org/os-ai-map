  note: Parallel's Search API returns ranked URLs with compressed excerpts of extracted page text rather
    than plain engine snippets, combining discovery and content in one call, level with Firecrawl. Composing
    a cited answer instead requires the separate, pricier Responses API ($0.01-$0.25 against Search's $0.001-$0.005),
    billed and reported as its own product.
  last_verified: '2026-09-17'
  sources:
