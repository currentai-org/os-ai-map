  note: ABSTAINS, deliberately, where a number was available. `parallel-web` records 2,631,725 PyPI downloads
    in the trailing 30 days, but that SDK covers all six of Parallel's APIs - Task, Search, Extract, Responses,
    Monitor and Find All - and this record scores the Search SKU alone. The package's population and the product's
    are not the same set, which is the measurement-population rule, and the figure is also large enough for
    a young vendor to suggest automation rather than callers. `serpapi` and `linkup` band on their SDKs because
    each sells one product; this one does not. The abstention is dated rather than left blank, on the queue's
    rule that a null somebody looked for and did not find is a confirmed axis; the page below is where it was
    looked for.
  sources:
  - url: https://parallel.ai/ai/pricing
    shows: The vendor's own pricing and product documentation, carrying rates and limits and no request, customer
      or developer count - which is what the abstention rests on.
