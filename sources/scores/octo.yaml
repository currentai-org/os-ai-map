capability:
  score: 3
  basis: feature_matrix
  basis_detail: embodiment generality
  value: Cross-embodiment diffusion policy (93M parameters for Base) trained on 800k Open X-Embodiment trajectories;
    multiple RGB cameras, language or goal-image conditioning; fine-tunable to new observations, action spaces and
    morphologies with small target datasets.
  confidence: medium
  note: Octo, like OpenVLA, learned from pooled data across many single-arm robots, and it was built to be fine-tuned
    onto new bodies and sensors. At under a hundred million parameters it has no language-model backbone, and it
    ships no bimanual or humanoid policy.
  relative_to: openvla
  relation: at
