capability:
  score: 3
  basis: feature_matrix
  value: 6 TOPS/chip, up to 24 TOPS (4-chip M.2); 4/8/16-bit weights + BFloat16; ~42M params per module
  confidence: high
  note: Four MX3 chips on the M.2 module combine for up to 24 TOPS, with support for 4, 8 and 16-bit weights
    plus BFloat16. On-chip parameter capacity limits how large a model can run, and the figures come from
    launch coverage rather than a vendor specification table.
