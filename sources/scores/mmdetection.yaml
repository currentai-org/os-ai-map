capability:
  score: 4
  basis: feature_matrix
  value: detection, instance and panoptic segmentation model zoo with training configs, plus open-vocabulary and
    grounding detectors (GLIP, Detic, Grounding DINO, MM-Grounding-DINO) that detect objects named in a text prompt
    without training; MM-Grounding-DINO Swin-T reaches 50.6 zero-shot COCO mAP
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: MMDetection runs detectors that take the object names as text at inference, so a new label set needs no
    training run, as Ultralytics does with YOLO-World and YOLOE. Most of its model zoo is still trained on fixed
    benchmark classes.
