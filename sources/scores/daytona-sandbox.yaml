capability:
  score: 4
  basis: feature_matrix
  value: isolation:dedicated kernel/filesystem/network stack per sandbox ('full composable computer'), Linux
    container by default with opt-in Linux VM, Windows VM, GPU and macOS classes; cold-start:<90ms (container
    class); language/runtime breadth:Python+TypeScript+JS; persistence:fork, pause/resume and memory snapshots
    on VM sandboxes, GPU sandboxes ephemeral; scale:elastic
  confidence: high
  note: Each Daytona sandbox gets a dedicated kernel, filesystem and network stack, and independent benchmarks
    confirm well-under-a-second cold starts for the default container class. Daytona names no microVM or
    gVisor-style isolation, so isolation is limited to OCI and Docker compatibility, and fork, pause and
    resume apply only to a separate, opt-in VM tier.
  last_verified: '2026-09-29'
  sources:
  - url: https://daytona.io/docs/en/sandboxes
    shows: Sandboxes page stating "Each sandbox runs in isolation, giving it a dedicated kernel, filesystem,
      network stack, and allocated vCPU, RAM, and disk." and "GPU sandboxes are ephemeral and support up
      to"; its runtime table lists "<90ms" for the default Linux container, and "Fork", "Pause/resume" and
      "Memory snapshots" for the Linux VM and Windows runtimes.
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: 06cc5374c81e13a84a203f9eba18d4456100df4f34c6dbc8deff5853d1264e16
