capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: Distributed vector search cluster with master, router and partition-server roles, raft-based
    replication and elastic scale-out, over IVF and HNSW indexes with scalar filtering. No full-text or
    lexical mode, and no model hosting in the serving path.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Vearch runs as a distributed cluster, splitting work across master, router and partition servers
    with raft-based replication and elastic scale-out, which makes it a complete system that scales across
    machines. Its retrieval is vector similarity plus scalar filtering, with no full-text mode and no
    model hosted in the serving path, so it sits one step below Vespa.
