capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Ukrainian pretraining text
  value: About 3.27 billion tokens in 8.59 million Ukrainian texts from news, fiction, Telegram, Wikipedia
    and court decisions, documented in a UNLP paper, with Flair, fastText, Electra and GPT-2 models built on
    it and the Malyuk corpus folding it in.
  confidence: medium
  note: UberText 2.0 is the large corpus of modern Ukrainian, documented in a paper at the Ukrainian NLP workshop,
    and lang-uk lists models built on it, among them Flair and fastText embeddings and Electra and GPT-2 models,
    while the Malyuk pretraining corpus folds it in. Its named uses are smaller models rather than a large
    language model.
  last_verified: '2026-09-24'
  sources:
