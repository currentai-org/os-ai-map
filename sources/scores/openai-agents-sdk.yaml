capability:
  score: 4
  basis: feature_matrix
  value: agents with tools and guardrails; handoffs and agents-as-tools; sessions; human-in-the-loop;
    built-in tracing; sandbox agents with resumable sandbox sessions; realtime and voice agents; function
    and MCP tools; provider-agnostic; no first-party benchmark
  confidence: medium
  note: The OpenAI Agents SDK covers multi-agent handoffs, guardrails, sessions, tracing and sandboxed
    long-running agents with a deliberately small set of primitives. It sits a step below LangGraph, whose
    graph-structured runs give finer control over flow and checkpoint their state to resume where they
    stopped. OpenAI publishes no benchmark for the SDK itself.
  relative_to: langgraph
  relation: one_below
  comparison:
    last_attested: '2026-10-07'
    sources:
