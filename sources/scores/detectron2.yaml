capability:
  score: 3
  basis: feature_matrix
  value: detection, instance, panoptic and keypoint segmentation and DensePose models (Faster R-CNN, Mask
    R-CNN, RetinaNet, Cascade R-CNN, Panoptic FPN and others) with a model zoo of COCO, LVIS, Cityscapes
    and VOC baselines and a training framework for custom datasets
  relative_to: timm
  relation: at
  confidence: high
  note: Detectron2 is a model zoo with the training framework around it, for detection and segmentation
    where timm covers image backbones. Its baselines predict the benchmark classes they were trained on,
    so a new label set needs a training run.
  comparison:
    last_attested: '2026-09-27'
    sources:
