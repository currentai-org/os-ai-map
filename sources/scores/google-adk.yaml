capability:
  score: 4
  basis: feature_matrix
  value: agents with instructions and tools; multi-agent hierarchies; graph workflow runtime with routing,
    fan-out and fan-in, loops, retry, state and nested workflows; structured task delegation between agents;
    tool confirmation for human approval; function, OpenAPI and MCP tools; model-agnostic; no first-party
    benchmark
  confidence: medium
  note: ADK pairs multi-agent hierarchies with a graph workflow runtime that handles routing, loops, retries
    and human approval. It sits a step below LangGraph, which documents durable runs that resume exactly
    where they stopped; the ADK README makes no such claim.
  relative_to: langgraph
  relation: one_below
  comparison:
    last_attested: '2026-11-12'
