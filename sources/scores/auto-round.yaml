capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: one optimization family, applied broadly'
  value: Post-training quantization of LLM and VLM weights to low bit widths, centered on sign-gradient-descent
    rounding (SignRound) with several other quantization algorithms beside it, deployable across Intel CPUs,
    XPUs and Gaudi accelerators and NVIDIA GPUs. Wide model and hardware reach within one optimization family.
  relative_to: apache-tvm
  relation: two_below
  confidence: medium
  note: AutoRound centers on sign-gradient-descent rounding and carries several other post-training quantization
    algorithms beside it, applied across a wide range of LLMs, VLMs and Intel and NVIDIA hardware. All of
    that breadth sits within one optimization family rather than a broader compilation toolchain, which
    is why it sits two steps below Apache TVM.
  last_verified: '2026-10-07'
