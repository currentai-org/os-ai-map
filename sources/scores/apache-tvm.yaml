  value: Multi-framework front ends lowered through TVM's own optimizer and code generator to LLVM, CUDA, ROCm,
    Metal, OpenCL, SPIR-V and WebGPU backends, with autotuning and quantization passes and a deployable runtime.
  confidence: medium
  note: Apache TVM lowers models from multiple frameworks through its own optimizer and code generator to
    LLVM, CUDA, ROCm, Metal, OpenCL, SPIR-V and WebGPU backends, with autotuning and quantization passes
    and a deployable runtime. No other product in this category covers as much of that compilation surface
    across as many targets, which places it at the top of the category and makes it the reference every
    other product here is measured against.
