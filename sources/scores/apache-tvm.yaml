capability:
  score: 5
  basis: feature_matrix
  basis_detail: 'category feature matrix: retargetable end-to-end compiler'
  value: Multi-framework front ends lowered through TVM's own optimizer and code generator to LLVM, CUDA,
    ROCm, Metal, OpenCL, SPIR-V and WebGPU backends, with autotuning and a deployable runtime.
  confidence: medium
  note: Apache TVM's own optimizer and code generator retarget models from multiple framework front ends
    to LLVM, CUDA, ROCm, Metal, OpenCL, SPIR-V and WebGPU backends. That is a full compilation path from
    framework model to deployable module, which the kernel libraries and quantization toolkits in this category
    do not cover.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/apache/tvm/main/README.md
    shows: README describes "Apache TVM is an open machine learning compilation framework," with "Python-first
      development that enables quick customization of machine learning compiler pipelines." and "Universal
      deployment to bring models into minimum deployable modules."
    accessed: '2026-09-30'
