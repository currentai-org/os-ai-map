adoption:
  level: 4
  reach: 1M-10M users
  signal_type: active_users
  confidence: low
  note: 'The quantity banded here is monthly active users: "over 1 million monthly active users" as of October
    2023, reported by TechCrunch on Quora''s Series B, which puts it at 1M-10M users. The widely-quoted
    18 million is installs, not users. The same sentence reads that "the Poe app had been downloaded more
    than 18 million times AND had reached over 1 million monthly active users", and the aggregators quoting
    a higher band collapsed the two into "18M MAU". A cumulative install total is not an active count, so
    it is not carried here. No first-party figure exists to replace it: poe.com/blog was read post by post
    and none carries a user, subscriber or revenue number; Quora''s own blog refuses automated access; and
    every "18M MAU" hit on the open web is a statistics aggregator citing no source, one of which carries
    an explicit "where exact figures are unavailable, we use estimates" disclaimer. Banding 18M cumulative
    installs against a scale calibrated on trailing-30-day figures would overstate in the same direction
    the aggregators already did. This band understates a live consumer product instead, which is the more
    honest of the two failures: the figure is nearly three years old, Poe has plainly grown since, and confidence
    stays low to say so.'
  last_verified: '2026-08-14'
  sources:
  - url: https://techcrunch.com/2024/01/10/quora-ai-poe-analysis/
    shows: '"By October 2023, the Poe app had been downloaded more than 18 million times and had reached
      over 1 million monthly active users." The only sourceable origin of the 18 million figure, and it
      is downloads; the MAU beside it is 1M. Also - a16z said users have created more than a million bots
      on the platform, and the paid tier is $20 per month.'
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 774828086007df1a661017c03b61bac741e577d574bb19506f61098fca66c306
  - url: https://originality.ai/blog/poe-statistics
    shows: former source of the ~18M MAU and ~$65M revenue figures. No longer carries the MAU figure.
    accessed: '2026-06-04'
  - url: https://poe.com/about
    shows: live product confirming consumer-scale aggregator surface
    accessed: '2026-06-04'
