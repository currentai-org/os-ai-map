capability:
  score: 3
  basis: feature_matrix
  basis_detail: embodiment generality
  value: Cross-embodiment pretraining on 970K Open X-Embodiment episodes; zero-shot control only for embodiment
    and domain combinations in that mixture (e.g. WidowX on BridgeV2); single-arm manipulation; the card rules out
    zero-shot transfer to unseen embodiments.
  confidence: medium
  note: OpenVLA learned from many robots in Open X-Embodiment and controls the single arms it saw there, but its
    own card says it does not carry over to a new robot without fine-tuning, and it offers nothing for bimanual
    or humanoid control.
  relative_to: gr00t
  relation: one_below
  last_verified: '2026-09-26'
  sources:
  - url: https://huggingface.co/openvla/openvla-7b/raw/main/README.md
    shows: 'Card: "can be used zero-shot to control robots for specific combinations of embodiments and domains
      seen in the Open-X pretraining mixture (e.g., for BridgeV2 environments with a Widow-X robot)"; "do not zero-shot
      generalize to new (unseen) robot embodiments".'
