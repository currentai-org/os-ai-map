capability:
  score: 4
  basis: feature_matrix
  relative_to: aws-lambda
  relation: one_below
  value: isolation:Firecracker microVM with dedicated kernel (stronger than container/gVisor); cold-start:starts
    in milliseconds; runtime breadth:high (any Linux distribution, Vercel Managed Images or custom OCI
    images from Vercel Container Registry, sudo+root, install any package, can run Docker/VPN/FUSE);
    persistence:persistent-by-default (auto-save state on stop) + explicit snapshotting + attachable
    drives; scale:managed autoscale to 10,000 concurrent sandboxes, 24h max duration, 32 vCPU / 64GB
    ceiling, single region (iad1)
  confidence: high
  note: Vercel Sandbox isolates each run in a Firecracker microVM with persistent, snapshot-capable state,
    and independent benchmarks put its cold start in the hundreds of milliseconds - short of the vendor's
    millisecond claim but still sub-second. It supports any Linux distribution or a custom OCI image, the
    same flexibility that makes AWS Lambda the frontier here, but its concurrency ceiling is far smaller
    than Lambda's and it runs in a single region, which is the tighter of the two limits and keeps it one
    step below Lambda.
  last_verified: '2026-08-14'
  sources:
  - url: https://vercel.com/docs/sandbox
    shows: '"Sandboxes run Linux images, with Ubuntu, Arch Linux, or any other Linux distribution you need";
      images come from Vercel Managed Images "or your own OCI images stored in Vercel Container Registry";
      "Each sandbox runs in a secure Firecracker microVM with its own filesystem and network"; "Sandboxes
      start in milliseconds"; system-privileged processes "such as container runtimes like Docker, VPN clients,
      and FUSE filesystem drivers"; persistence is the default with snapshotting and attachable drives alongside
      it.'
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 0c0ba060749a68551b6c2105808d57c4dbbdac425cd62f79145ab46132a475de
