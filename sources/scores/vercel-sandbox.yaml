    shows: 'ComputeSDK TTI leaderboard (independent, 100 iters/day, 2026-07-09 run): median time-to-interactive
      ~390ms sequential / ~490ms burst @100 concurrent; 9th of 19 providers'
    accessed: '2026-07-09'
