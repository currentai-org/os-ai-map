capability:
  score: 4
  basis: feature_matrix
  relative_to: aws-lambda
  relation: one_below
  value: isolation:Firecracker microVM with dedicated kernel (stronger than container/gVisor); cold-start:starts
    in milliseconds; runtime breadth:high (any Linux distribution, Vercel Managed Images or custom OCI images
    from Vercel Container Registry, root and system privileges, can run Docker/VPN/FUSE); persistence:persistent-by-default
    (auto-save state on stop) + explicit snapshotting + attachable drives; scale:managed autoscale to 10,000
    concurrent sandboxes, 24h max duration, 32 vCPU / 64GB ceiling, 19 selectable regions (default iad1)
  confidence: high
  note: Vercel Sandbox isolates each run in a Firecracker microVM with persistent, snapshot-capable state.
    Vercel says sandboxes start in milliseconds, while independent benchmarks put the cold start in the
    hundreds of milliseconds, still under a second. Its support for custom OCI images and root access is
    broad, but AWS Lambda's native language runtimes, Runtime API and longer production record keep Vercel
    Sandbox a step below Lambda.
  last_verified: '2026-09-29'
  sources:
  - url: https://vercel.com/docs/sandbox
    shows: The docs overview says "Sandboxes run Linux images, with Ubuntu, Arch Linux, or any other Linux
      distribution you need", that "Sandboxes start in milliseconds", and that system-privileged workloads
      run "such as container runtimes like Docker, VPN clients, and FUSE filesystem drivers".
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: 595dc5abf4af10d1dde10f067a020c5faed9bd75cc653525cf4fd477e2a4265f
  - url: https://vercel.com/docs/sandbox
    shows: The docs overview describes persistence as "Sandboxes that auto-save state on stop and resume
