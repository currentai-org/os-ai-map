  note: 'The npm downloads API reports 13,197,882 downloads of @vercel/sandbox over the window 2026-07-11
    to 2026-08-09, clear of the 10M floor, which bands at level 5 / >10M on the software adoption scale.
    The package is the product''s own - its registry metadata describes it as the "Software Development
    Kit for Vercel Sandbox" and points at github.com/vercel/sandbox. npm is an unbridged route (issue #163),
    so the figure is re-fetchable but NOT pipeline-recomputable; no signal model reads it, nothing computed
    can disagree with it, and a later reader must not mistake this for a computed band. Package-manager
    pulls include CI/mirror inflation and overstate distinct human users; GA status and the large Vercel
    install base corroborate genuine production use. Confidence stays medium rather than high on that inflation
    caveat.'
