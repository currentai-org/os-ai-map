capability:
  score: 4
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 4 of 5, provisional and count-based: the median corroborated band over its target languages,
    11 of 11 measured, across 1 task. Face value 4; best original band 4.'
  confidence: medium
  note: In every language IndicQA targets, its one test has sixteen hundred to sixty-four hundred questions, which
    annotators wrote in that language. An item count says how much a set can test, not how precisely it ranks models.
  last_verified: '2026-11-18'
