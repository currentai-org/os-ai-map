capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: search and conversation-based retrieval scoped to a user; memory agents that extract typed memories from
    messages and tool traces with an LLM; core-block rewriting and Auto-Dream passes that merge duplicates and resolve
    stale or conflicting entries, with LLM-decided merges on the graph; core, episodic, semantic, procedural, resource
    and knowledge-vault stores plus an optional provenance hypergraph; no forgetting of its own beyond fade and
    expiry periods the developer sets
  confidence: medium
  note: MIRIX extracts six kinds of memory from raw messages with dedicated agents, merges and corrects them in
    Auto-Dream passes, and retrieves across the typed stores and an optional graph. Its only forgetting is a fade
    and expiry period the developer sets, so nothing retires a memory because it stopped being true.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/Mirix-AI/MIRIX/main/README.md
    shows: The README lists six memory components managed by dedicated agents, an optional Neo4j provenance hypergraph
      of n-ary facts, client.add and retrieve_with_conversation calls keyed by user_id, and an Auto-Dream endpoint
      that "merges duplicates, resolves stale/conflicting entries where possible".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: f4da4a648afedb4c632c6a35392e1bd2b97c9d9a00d85430abb8c908bf164d56
  - url: https://raw.githubusercontent.com/Mirix-AI/MIRIX/main/docs/ARCHITECTURE.md
    shows: The architecture page traces POST /memory/add through a meta agent whose sub-agents "extract typed memories
      via tools", and retrieval through BM25, pgvector and fuzzy search across the core, episodic, semantic, procedural,
      resource and knowledge-vault stores.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 6191f8dd44b462c53a8a1049ac3196b559f95d4da8253cd1aa05af79742340ba
  - url: https://docs.mirix.io/architecture/memory-components/
    shows: The memory components page says core memory "Rewrites blocks when approaching capacity" and semantic
      memory "Merges duplicate concepts".
    accessed: '2026-11-20'
