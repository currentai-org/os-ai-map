capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for Moroccan Darija training text
  value: Atlaset compiles about 155 million training tokens of Moroccan Darija from dozens of existing sources,
    including social media, Wikipedia, subtitles and translated instruction sets, documented by a detailed
    card, and AtlasIA's Al-Atlas-0.5B and a Moroccan XLM-RoBERTa are trained on it.
  confidence: medium
  note: Atlaset gathers most openly available Moroccan Darija text, from social media and subtitles to translated
    instruction sets, into one documented corpus, and AtlasIA trained its Al-Atlas language model and a Moroccan
    XLM-RoBERTa on it. At under two hundred million tokens it is tiny beside English pretraining corpora of
    trillions of tokens, and small even beside naab, which merges billions of words of Farsi.
  relative_to: naab
  relation: two_below
  last_verified: '2026-09-24'
