capability:
  score: 2
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: donors submit datasets through a web form, and the repository approves them; approved datasets
    get a DOI and a CC BY 4.0 license; external datasets can be linked; public JSON API by dataset ID carrying
    variable metadata and a last-updated date but no version number; ucimlrepo fetches by ID or name into
    pandas dataframes
  confidence: medium
  relative_to: physionet
  relation: one_below
  note: UCI hosts each donated dataset, gives it a DOI and serves it by ID through a public API that the
    ucimlrepo package loads into pandas. A dataset is updated in place under the same record rather than
    kept as numbered versions, which PhysioNet does.
  last_verified: '2026-10-07'
  sources:
