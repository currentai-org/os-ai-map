capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for multilingual storybook data
  value: The Bloom Library datasets hold community-written storybooks in 363 languages, with a median of two
    stories per language, in text, captioning, storytelling and speech sets documented in an EMNLP paper, and
    their text was a small part of the BLOOM model's training data.
  confidence: medium
  note: The datasets are documented in an EMNLP paper, and their text went into the BLOOM model's training
    data as a small part of its corpus. For most of the 363 languages they hold only a couple of stories, so
    Glot500-c, which gathers more than 150 sources for 511 languages and trained the Glot500-m model, is the
    broader resource.
  relative_to: glot500-c
  relation: one_below
  last_verified: '2026-09-24'
  sources:
  - url: https://huggingface.co/datasets/sil-ai/bloom-lm
    shows: '"It includes data from 364 languages across 31 language families. There is a mean of 32 stories
      and median of 2 stories per language." "this data was used in the training of the BLOOM model".'
