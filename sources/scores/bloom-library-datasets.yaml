capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for multilingual storybook data
  value: 'The Bloom Library datasets hold community-written storybooks in 363 languages, with a median of two
    stories per language, in text, captioning, storytelling and speech sets documented in an EMNLP paper, and
    their text was a small part of the BLOOM model''s training data. The language-modeling set''s three text
    files total about 43 MB (about 11 million tokens, estimated; no token count is stated). The paper gives
    two speech figures that disagree: 428 hours of audio in its prose and 2,873 minutes (about 48 hours) in
    Table 1. This record uses Table 1''s figure, which matches the paper''s per-family and per-language counts.'
  confidence: medium
  note: The datasets gather community-written storybooks in hundreds of languages into text, captioning, storytelling
    and speech sets documented in an EMNLP paper, and their text went into the BLOOM model's training data
    as a small part of its corpus. With a couple of stories for most languages they are tiny beside English
    pretraining corpora of trillions of tokens, and a pooled corpus such as the one behind the Glot language
    model gathers far more text per language.
  relative_to: glot500-c
  relation: two_below
  last_verified: '2026-11-12'
