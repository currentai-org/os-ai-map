  note: Kimi Code CLI is MIT licensed, and its public repository holds the CLI and every package it bundles, so
    it builds and runs from published source. A Kimi Code account buys model access, and the CLI also runs against
    Anthropic, OpenAI-compatible and Gemini providers. Remote Control is limited to paid members because it relays
    through Moonshot AI's hosted service, but its client is published and the agent still runs on the user's machine.
