capability:
  score: 4
  basis: feature_matrix
  value: terminal coding agent with read, write, edit, grep, glob, media-reading and shell tools; Kimi models by
    default plus Anthropic, OpenAI-compatible, Gemini and Vertex AI providers; built-in coder, explore and plan sub-agents,
    AgentSwarm fan-out and an experimental Tower mode that runs parallel workers in separate git worktrees with
    independent review; plan mode, approval modes and lifecycle hooks; MCP, skills and plugins; ACP for Zed and
    JetBrains; interactive and single-prompt modes; resumable, forkable sessions; no sandbox; no published benchmark
    result
  confidence: medium
  note: Kimi Code CLI covers the core of a terminal coding agent and adds built-in sub-agents, an experimental mode
    that runs parallel workers in separate git worktrees with independent review, lifecycle hooks and editor integration
    over ACP. It sits a step below OpenHands, which runs agents in a sandboxed runtime and publishes benchmark results,
    while Kimi Code CLI runs with the user's own permissions and has no benchmark of its own.
  relative_to: openhands
  relation: one_below
