    prompt templates). Released UI-TARS-1.5-7B: OSWorld 27.5, ScreenSpotPro 49.6; the unreleased UI-TARS-1.5 scores
    42.5 and 61.6.'
  confidence: high
  relative_to: qwen-omni
  relation: one_below
  note: UI-TARS acts on what it sees, turning screenshots into clicks, keystrokes and phone gestures across desktop,
    web and Android. It sits a step below Qwen-Omni because it understands only images, with no audio or video input.
