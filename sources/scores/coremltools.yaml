capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: full compilation narrowed to one vendor''s targets'
  value: Multi-framework conversion plus its own optimization passes (quantization, palettization, pruning)
    and prediction-based verification on macOS, lowering to the Core ML runtime. Apple platforms only.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: Core ML Tools converts models from multiple frameworks, then applies quantization, palettization
    and pruning and verifies conversions by running predictions on macOS, lowering to the Core ML runtime.
    That pipeline is narrowed to Apple's own platforms, one step below Apache TVM's multi-vendor reach.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/apple/coremltools/main/README.md
    shows: README says "Use [Core ML Tools](https://apple.github.io/coremltools/docs-guides/source/overview-coremltools.html)
      (*coremltools*) to convert machine learning models from third-party libraries to the Core ML format."
      and lists "TensorFlow 1.x", "TensorFlow 2.x" and "PyTorch" plus "scikit-learn", "XGBoost" and "LibSVM"
      as sources, with "Read, write, and optimize Core ML models."
    accessed: '2026-09-30'
