capability:
  score: 3
  basis: feature_matrix
  value: Code-as-action agents, model-agnostic (local/OpenAI/Anthropic + others), sandboxed execution
    (E2B/Modal/Docker), MCP + LangChain tool import, multi-agent support; no first-party SWE-bench/GAIA
    headline for the framework
  confidence: medium
  note: Smolagents is strong on model-agnosticism, tool use and sandboxed code execution but deliberately
    small, with a thinner orchestration and evaluation surface than OpenHands. The only benchmark it publishes
    compares open models run as agents rather than the framework itself, so it is judged on features.
  relative_to: openhands
  relation: two_below
  last_verified: '2026-09-29'
  sources:
  - url: https://raw.githubusercontent.com/huggingface/smolagents/main/README.md
