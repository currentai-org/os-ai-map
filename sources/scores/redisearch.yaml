  value: Secondary indexing, full-text and vector similarity search, and aggregations as a Redis module, inheriting
    persistence, replication and clustering from Redis rather than implementing its own.
  relative_to: pgvector
  relation: at
  confidence: medium
  note: RediSearch adds secondary indexing, full-text search, vector similarity search and aggregations
    as a Redis module, inheriting Redis's own persistence, replication and clustering rather than providing
    its own. That puts it on par with pgvector, a search extension bolted onto a general-purpose store,
    though with a broader retrieval surface.
