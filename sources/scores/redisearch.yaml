product: redisearch
openness:
  score: 5
  class: open_source
  components:
    license:
    - name: AGPL-3.0
      detail: OSI
    source:
      value: public
    core-gated:
      value: ungated
  confidence: high
  note: LICENSE.txt states the source in this repository is available, except where a file header says otherwise,
    under the recipient's choice of the Redis Source Available License 2.0 (RSALv2, not OSI), the Server Side
    Public License v1 (SSPLv1, not OSI) or the GNU Affero General Public License v3 (AGPLv3, OSI) - the same
    default-triple-license shape as elasticsearch, and AGPL-3.0 is the tier this records. Unlike elasticsearch's
    x-pack or meilisearch's Enterprise Edition, no directory in this repository is checked to carry a header
    naming only the non-OSI branches - the coordinator/clustering code under `src/coord` (Redis's distributed
    serving layer) carries the identical triple-choice header as the rest of `src/`, so no functionality in the
    published tree is withheld from the AGPL-3.0 branch. Source is public and the core ungated.
  raw: license:AGPL-3.0(OSI);source:public;core-gated:ungated
