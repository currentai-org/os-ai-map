capability:
  score: 4
  basis: feature_matrix
  relative_to: firecracker
  relation: one_below
  value: isolation:gVisor user-space kernel (Sentry intercepts syscalls) - strong container isolation, below
    microVM but above plain containers; cold-start:optimized container stack, fast startup; runtime breadth:arbitrary
    images/dependencies (custom images, any deps, repo checkout); persistence:named/ID sandbox lookup, custom
    images; scale:reported 50,000+ concurrent sessions; timeouts default 5min up to 24h
  confidence: medium
  note: Modal Sandboxes isolate each container with gVisor's user-space kernel and support arbitrary custom
    images, named lookup, GPUs, and sessions from a five-minute default up to 24 hours. That isolation is
    a step below the microVM platforms, such as Firecracker, that lead the category, and independent ComputeSDK
    benchmarks place Modal's start-up speed mid-field.
  last_verified: '2026-09-29'
  sources:
