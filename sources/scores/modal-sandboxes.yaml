capability:
  score: 4
  basis: feature_matrix
  relative_to: firecracker
  relation: one_below
  value: isolation:gVisor user-space kernel (Sentry intercepts syscalls) - strong container isolation, below
    microVM but above plain containers; cold-start:optimized container stack, fast startup; runtime breadth:arbitrary
    images/dependencies (custom images, any deps, repo checkout); persistence:named/ID sandbox lookup, custom
    images; scale:reported 50,000+ concurrent sessions; timeouts default 5min up to 24h
  confidence: medium
  note: Modal Sandboxes isolate each container with gVisor's user-space kernel, one step below microVM isolation,
    and support arbitrary custom images, named lookup, and sessions from a five-minute default up to 24
    hours. Independent ComputeSDK benchmarks measured a 0.76-second median cold start, slower than the microVM-isolated
    platforms such as Firecracker that define the top of this category.
  last_verified: '2026-08-13'
