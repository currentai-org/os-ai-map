capability:
  score: 4
  basis: feature_matrix
  relative_to: ray
  relation: at
  value: isolation:gVisor user-space kernel (Sentry intercepts syscalls) - strong container isolation,
    below microVM but above plain containers; cold-start:optimized container stack, fast startup; runtime
    breadth:arbitrary images/dependencies (custom images, any deps, repo checkout); persistence:named/ID
    sandbox lookup, custom images; scale:reported 50,000+ concurrent sessions; timeouts default 5min up
    to 24h
  confidence: medium
  note: 'Strong, purpose-built agent sandbox: gVisor isolation, arbitrary images and high concurrency. The
    Sandboxes guide documents arbitrary custom images, named lookup and a 5-minute default lifetime extendable
    to 24 hours, and Modal’s own comparison page states gVisor isolation and 50,000+ concurrent sessions.
    It sits just below the Firecracker-microVM frontier (Lambda, Vercel) on isolation strength, so 4 - level
    with the Ray and Ollama capability anchors. Independent ComputeSDK TTI benchmarks put Modal at a 0.76s
    median cold-start, 0.82s P95, composite 92.1, 14th by median of 24 providers, against ~470ms and 13th
    of 19 on the earlier run: slower in absolute terms and unchanged in placement, still mid-field, still
    short of the sub-0.3s leaders and well clear of the multi-second tail.'
  last_verified: '2026-08-13'
