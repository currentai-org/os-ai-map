  value: Tile primitives plus self-contained kernels for GEMM, attention forward and backward and linear
    attention on Hopper and Blackwell NVIDIA GPUs, including MXFP8 and NVFP4. Several operator families,
    delivered as a header library.
  relative_to: tensorrt
  relation: one_below
  confidence: medium
  note: ThunderKittens is a header-only tile library that also ships self-contained GEMM, attention and
    linear-attention kernels for Hopper and Blackwell GPUs. That is several operator families across two
    hardware generations, but NVIDIA only, which keeps it one step below TensorRT.
