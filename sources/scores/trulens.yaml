capability:
  score: 4
  basis: feature_matrix
  value: Feedback functions and LLM-as-judge metrics (RAG triad of groundedness, context relevance and answer
    relevance; agent, MCP and summarization metrics; custom metrics from any Python function or judge prompt);
    OpenTelemetry-native instrumentation and tracing; version comparison with a leaderboard; Streamlit dashboard;
    Snowflake Cortex and LiteLLM endpoint providers.
  confidence: medium
  note: 'Evaluation-first observability: judge-scored feedback functions for RAG, agents, MCP apps and summarization,
    custom metrics, OpenTelemetry tracing and side-by-side comparison of app versions. It is narrower than
    Langfuse as a platform, with no prompt management or annotation queues in the docs, but its evaluation
    depth makes up the difference, so it sits level with it.'
  last_verified: '2026-09-29'
  relative_to: langfuse
  relation: at
  sources:
  - url: https://github.com/truera/trulens
    shows: README - feedback functions built around "the RAG Triad" (groundedness, context relevance, answer
      relevance) with links to Snowflake's RAG-triad benchmarks, and a comparison claiming TruLens leads
      on three of four ranking metrics ahead of WandB Weave, RAGAS, DeepEval and UpTrain. No AI gateway,
      prompt registry or annotation-queue feature appears.
    accessed: '2026-08-13'
