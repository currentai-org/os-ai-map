    declared as a family: every laion/CLIP-* checkpoint across the LAION-2B, LAION-5B multilingual, DataComp
    and CommonPool lines, and the CoCa checkpoints open_clip ships beside them. Copies re-hosted on other
    accounts, such as timm''s, are excluded as mirrors, so the figure is a floor on the library''s use.'
