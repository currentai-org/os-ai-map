capability:
  score: 4
  basis: feature_matrix
  basis_detail: search and full-text retrieval read from the operator's API documentation
  value: '`/works?search=` matches title, abstract, full text and keywords and returns works sorted by `relevance_score`,
    with exact, boolean, scoped and semantic variants and an optional rerank; each work carries `content_urls` to
    a cached PDF and Grobid-parsed TEI XML on `content.openalex.org`, held for 50M+ open-access works'
  confidence: medium
  relative_to: ddgs
  relation: at
  note: OpenAlex ranks works for a query by relevance and, for the more than 50 million open-access works it keeps
    a copy of, returns the full text through the same API key, both as the PDF and as structured XML parsed from
    it. Finding sources and then fetching their content puts it level with DDGS. It does not compose an answer from
    what it finds, and the full text stops at the open-access subset of the catalog.
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://raw.githubusercontent.com/deedy5/ddgs/main/README.md
      shows: 'The DDGS README still documents `text()` returning ranked references aggregated across ten backends
        and `extract()`, "Fetch a URL and extract its content in various formats", taking a `url`: the find-then-fetch
        pairing its band 4 rests on. No answer-composition function is documented.'
      accessed: '2026-10-13'
      http_status: 200
      content_sha256: 4541f0854142f2c9a939fee7e8bdf3f075d73d3dcd7b52abdeb1c3d564513223
  last_verified: '2026-10-13'
  sources:
