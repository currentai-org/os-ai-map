    shows: '"The `search` parameter finds results matching a given text search"; works search covers `title`, `abstract`,
      `fulltext` and keywords; "Search results include a `relevance_score` property and are sorted by it (descending)
      by default"; rerank reorders the top 100.'
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: a1e1806a23e7b711ba8d727ac38e3f851cc944eb5dda2491ea6eba1a4cbcbf9b
