capability:
  score: 3
  basis: feature_matrix
  value: tasks enqueued to a named queue; a ClearML Agent on a worker pulls the task, reproduces its environment
    and runs it in a container; dynamic GPU allocation assigns a queue a number of GPUs on an agent; cloud
    autoscaling adds workers
  confidence: medium
  relative_to: mlrun
  relation: at
  note: ClearML decides which queue a task joins and, with dynamic GPU allocation, how many GPUs on an agent
    that queue commands. The agent then pulls the work, so the choice of which machine runs a given task is
    made by whichever agent polls rather than by a central placement decision - the same reasoning that kept
    hatchet out of deployment, applied consistently. Band 3 rather than higher for that reason, and the enterprise-only
    GPU features are counted rather than discounted.
  last_verified: '2026-09-15'
  sources:
  - url: https://clear.ml/docs/latest/docs/clearml_agent/
    shows: 'ClearML Agent documentation describing the execution flow: ''Enqueue a task for execution on the
      queue. The agent pulls the task from the queue. The agent launches a container in which to run the task''s
      code.'''
