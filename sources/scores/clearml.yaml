capability:
  score: 3
  basis: feature_matrix
  value: tasks enqueued to a named queue; a ClearML Agent on a worker pulls the task, reproduces its environment
    and runs it in a container; dynamic GPU allocation assigns a queue a number of GPUs on an agent; cloud
    autoscaling adds workers
  confidence: medium
  relative_to: mlrun
  relation: at
  note: ClearML assigns a task to a queue and, with its enterprise dynamic GPU allocation, sets how many
    GPUs an agent on that queue may use, but the ClearML Agent itself decides which machine polls and runs
    the task. That keeps ClearML level with MLRun rather than above it.
  last_verified: '2026-09-15'
