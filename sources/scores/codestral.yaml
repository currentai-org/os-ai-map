adoption:
  level: 3
  signal_type: reported_traction
  confidence: low
  note: Codestral is integrated into IDE assistants such as Continue and Tabnine, into LlamaIndex and LangChain,
    and into Mistral's own coding stack. Mistral reports version-over-version gains in completion acceptance
    but publishes no download or user count, so this reading reflects how widely the model is embedded rather
    than a verified figure.
  sources:
  - url: https://mistral.ai/news/codestral-25-08/
    shows: '"+30% increase in accepted completions, +10% more retained code after suggestion, 50% fewer
      runaway generations"; distributed via API, VPC and on-prem; no download or user count published'
    accessed: '2026-08-13'
    http_status: 200
