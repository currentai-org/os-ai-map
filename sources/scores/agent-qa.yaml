capability:
  score: 2
  basis: feature_matrix
  value: Natural-language tests for web and mobile; self-healing execution that re-observes the UI and
    retries a failed step another way; execution memory reused across runs; CLI, dashboard, MCP and
    agent skills; bring-your-own model. No standardized benchmark result.
  confidence: medium
  note: Agent QA runs one agent loop for one task, testing applications, with memory carried between runs.
    GPT Researcher, the closest single-task agent on the map, adds a multi-agent assistant and a recursive
    deep-research workflow that produces cited reports, so Agent QA sits one band below it. Neither has
    third-party benchmark coverage.
  relative_to: gpt-researcher
  relation: one_below
  comparison:
    last_attested: '2026-09-26'
    sources:
    - url: https://raw.githubusercontent.com/assafelovic/gpt-researcher/main/README.md
      shows: README describes a multi-agent assistant built with LangGraph and a Deep Research recursive
        workflow producing detailed research reports with citations, the scope Agent QA's single QA loop
        does not have
