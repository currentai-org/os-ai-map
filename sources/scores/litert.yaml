capability:
  score: 4
  basis: feature_matrix
  basis_detail: category feature matrix, banded against the vllm anchor
  value: On-device execution with automatic accelerator selection and asynchronous execution (Compiled Model API);
    CPU through XNNPack, GPU through ML Drift over OpenCL, OpenGL, Metal and WebGPU; NPUs from Google Tensor, Qualcomm,
    MediaTek, Intel, Broadcom and Samsung S.LSI behind one API; Android, iOS, Linux, macOS, Windows, web and IoT
    targets; converter and quantizer toolchain.
  relative_to: vllm
  relation: one_below
  confidence: medium
  note: 'LiteRT sits a tier below vLLM, level with ExecuTorch, its closest peer: both run converted models on phone,
    desktop and embedded silicon, and LiteRT''s single NPU API covers a comparable spread of chip vendors. It runs
    models on a device rather than serving them with batching, parallelism and a multi-tenant API.'
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/vllm-project/vllm/main/README.md
      shows: 'vLLM README: datacenter serving with "Tensor, pipeline, data, expert, and context parallelism for
        distributed inference". LiteRT executes models on one device and has no serving layer, so it stays one step
        behind.'
