capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for African hate speech data
  value: AfriHate holds tweets in 15 African languages labeled by native speakers as hate, abusive or normal,
    documented in a paper, with three small community classifiers listed on the Hub as trained on it beyond
    its own baselines.
  confidence: medium
  note: AfriHate is a documented, native-speaker-labeled dataset for one task, hate and abuse detection, across
    15 languages. Beyond its paper's baselines, only a few small community classifiers on the Hub list it as
    training data, and it serves that one task rather than the range a general corpus covers.
  last_verified: '2026-11-08'
