  note: 4,627,937 downloads of tensorflow-serving-api in the trailing 30 days, which bands at 1M-10M, level 4 on
    the software adoption scale. The package was initially not declared because it publishes no repository link;
    ownership is established instead by its author, Google Inc., and its homepage, tensorflow.org/serving, which
    is this project's own site. The project's `tensorflow/serving` container image corroborates independently at
    80,659,067 pulls, though that figure is cumulative rather than monthly and so is cited rather than banded. 6,360
    GitHub stars would have banded this at 2 and understated a serving system that ships as an image and a client
    library rather than as a starred repository.
