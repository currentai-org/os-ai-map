capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: did:mesh agent identifiers bound to Ed25519 keys; a policy check on every tool call, message and delegation
    that allows, denies or raises GovernanceDenied; scope chains whose delegated capabilities only narrow; require_approval
    rules that hold an action for named approvers; a Merkle hash-chained audit log of decisions
  confidence: medium
  note: Agent Governance Toolkit gives each agent a decentralized identifier with its own key, checks every call
    against policy, lets delegation chains only narrow, holds chosen actions for human approval and writes decisions
    to a hash-chained audit log. Enforcement runs inside the agent's own process, so its README recommends a separate
    container per agent for isolation.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/microsoft/agent-governance-toolkit/main/README.md
    shows: '"Every tool call, message send, and delegation is intercepted in deterministic application code *before*
      the model''s intent reaches the wire"; a rule with "action: require_approval" names "approvers"; "The policy
      engine and agents share the same process boundary."'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 85a9d0ba947eff53cf5ba345b4470b563afa8d197d90a694a4d647f3906e9d25
  - url: https://raw.githubusercontent.com/microsoft/agent-governance-toolkit/main/docs/specs/AGENTMESH-IDENTITY-TRUST-1.0.md
    shows: Identity binds "a DID, Ed25519 keypair, human sponsor, capabilities, and status"; "Scope chains only
      narrow. Delegation can never grant more"; DIDs take the form did:mesh:<unique-id>.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 11bf4b09ca0ad4a8619d7ecaca9a5f42e58f5b68162b8012536460fbc06319e3
  - url: https://raw.githubusercontent.com/microsoft/agent-governance-toolkit/main/docs/specs/AUDIT-COMPLIANCE-1.0.md
    shows: Defines a "Merkle Audit Chain", "A hash-linked chain of audit entries providing cryptographic integrity
      verification"; "Audit chains MUST be tamper-evident through hash-linking."
    accessed: '2026-11-20'
    http_status: 200
