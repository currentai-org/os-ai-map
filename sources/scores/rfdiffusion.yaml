capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: De novo generation of protein backbones, conditioned on motifs, hotspot residues, symmetry or an existing structure; no adaptation pathway, one input data system, one scale.
  relative_to: esm-3
  relation: one_below
  confidence: high
  note: 'RFdiffusion documents one readable capability that most of this category lacks: it designs new
    protein backbones rather than predicting a structure for an existing sequence. Its conditioning inputs,
    motifs, hotspot residues, symmetry, an existing structure, are varied but all derive from the same PDB
    structure format, so they count as one input system rather than several.'
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/RosettaCommons/RFdiffusion/main/README.md
    shows: Lists "Motif Scaffolding", "Unconditional protein generation", "Symmetric unconditional generation
      (cyclic, dihedral and tetrahedral symmetries currently implemented, more coming!)", "Binder design"
      and design diversification by partial diffusion (sampling around a design); binder design uses "hotspot
      residues" and conditioning on "secondary structure and block adjacency"; motifs come from a `.pdb`
      file.
