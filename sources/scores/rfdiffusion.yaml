capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: De novo generation of protein backbones, conditioned on motifs, hotspot residues, symmetry or an existing structure; no adaptation pathway, one input data system, one scale.
  relative_to: prithvi-eo
  relation: two_below
  confidence: high
  note: One attribute, and it is the one most of this category lacks - RFdiffusion designs proteins that do not exist rather than predicting a structure for one that does. The conditioning inputs are varied but all derive from the same PDB structure, which the category's note says does not make them multiple instruments.
  last_verified: '2026-09-10'
  sources:
  - url: https://raw.githubusercontent.com/RosettaCommons/RFdiffusion/main/README.md
    shows: Documents unconditional monomer generation, motif scaffolding, binder design against a target with hotspot residues, symmetric oligomer design and partial diffusion of an existing backbone; conditioning comes from an input .pdb with contigs, secondary structure and block adjacency, and the repository publishes inference only.
