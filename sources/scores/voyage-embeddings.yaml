adoption:
  level: 3
  signal_type: reported_traction
  banded_quantity: MongoDB Atlas platform reach (tens of thousands of customers), plus 118,355 Hugging Face
    downloads over the trailing 30 days of voyage-4-nano (MongoDB/voyage-4-nano) — one SKU of four, and
    the only open one — rather than a usage figure for the line
  confidence: medium
  note: Voyage publishes no usage figure for its flagship tiers, which are API-only, and the only Hugging
    Face download count covers voyage-4-nano alone. Adoption is read instead from native distribution inside
    MongoDB Atlas, which acquired Voyage AI and now serves these models through its own Embedding and Reranking
    API.
  sources:
  - url: https://www.mongodb.com/company/blog/product-release-announcements/introducing-the-embedding-and-reranking-api-on-mongodb-atlas
    shows: '"Voyage AI’s models are now natively available on MongoDB Atlas via the new Embedding and Reranking
      API"; the platform is "already trusted by tens of thousands of customers, including over 75% of Fortune
      100 companies". The customer figure is Atlas''s, not the models''.'
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: 40bee0f8f709a3ba96028e649ef9add65e69015765db680964a2be6d620e60bf
  - url: https://huggingface.co/api/models/MongoDB/voyage-4-nano
    shows: MongoDB/voyage-4-nano, where the voyageai/voyage-4-nano repository now redirects, records 118,355 downloads over the trailing 30 days and 153 likes.
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: e65cfa3fdf995aa753f792999b575f835c522e929d3f6e0111870fbd790e03a9
capability:
  score: 4
  basis: benchmark
  basis_detail: RTEB, the Retrieval Embedding Benchmark, all 29 datasets
  value: voyage-4-large is the top-performing model across all 29 RTEB datasets, ahead of voyage-4 by
    1.87%, voyage-4-lite by 4.80%, Gemini Embedding 001 by 3.87%, Cohere Embed v4 by 8.20% and OpenAI
    v3 Large by 14.05%; first production embedding model on a mixture-of-experts architecture, at 40%
    lower serving cost than comparable dense models.
  relative_to: harrier-oss
  relation: one_below
  confidence: medium
  note: Voyage reports voyage-4-large ahead on RTEB, but RTEB is Voyage's own benchmark, run against publisher-chosen
    baselines, rather than an independent public leaderboard. Harrier-OSS reports 74.3 on MMTEB v2, a different
    benchmark, and Voyage's numbers describe the flagship tier, not the open voyage-4-nano checkpoint.
  last_verified: '2026-11-16'
  sources:
  - url: https://blog.voyageai.com/2026/01/15/voyage-4/
    shows: '"is the top-performing model, surpassing" the other Voyage 4 models, Gemini Embedding 001, Cohere
      Embed v4 and OpenAI v3 Large "by an average of 1.87%, 4.80%, 3.87%, 8.20%, and 14.05%, respectively"
      over "all 29 datasets in the comprehensive" RTEB; voyage-4-large is described as the first production-grade
      embedding model that uses a mixture-of-experts architecture, with "serving costs 40% lower than comparable
      dense models".'
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: b181fb65c272cba41d271dc8760c5ae89b172217e262ec58d971e465af897e78
