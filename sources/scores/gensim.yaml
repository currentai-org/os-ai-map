capability:
  score: 3
  basis: feature_matrix
  value: unsupervised text models - LDA, LSI, HDP and NMF topic models, word2vec, doc2vec and fastText
    embeddings - with TF-IDF and other transforms, streamed corpora, similarity indexes and a downloader
    for pretrained word vectors
  relative_to: nltk
  relation: at
  confidence: high
  note: Gensim is a toolkit of several text-modeling methods and the tools to train and compare them on
    the user's own corpus, in the way NLTK is for classical NLP. Its pretrained vectors are third-party
    downloads, and choosing and tuning a model stays with the user.
