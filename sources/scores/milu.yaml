capability:
  score: 4
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 4 of 5, provisional and count-based: the median corroborated band over its target
    languages, 10 of 10 measured, across 1 task. Face value 4; best original band 4.'
  confidence: medium
  note: MILU is banded on the qualifying items its sources state for each target language, and no
    corroboration cap binds, so its published band equals its face value, 4. The band is a ceiling read from
    item counts, not an estimated confidence interval.
  sources:
  - url: https://arxiv.org/abs/2411.02538
    shows: 'Abstract: "MILU spans 8 domains and 41 subjects across 11 Indic languages ... We evaluate over
