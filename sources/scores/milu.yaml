capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for an Indic knowledge benchmark
  value: MILU holds about 80,000 multiple-choice questions from regional and state exams in 10 Indic languages
    and English, about a quarter translated, documented in a NAACL paper, with no use found beyond that paper's
    evaluation of 42 models.
  confidence: medium
  note: MILU is a documented knowledge benchmark built from Indian exam questions in 11 languages, and its
    paper evaluates more than 40 models on it. No leaderboard or model report outside that paper was found,
    whereas IndicXTREME was released with the IndicBERT v2 models it tests.
  relative_to: indicxtreme
  relation: one_below
  last_verified: '2026-09-24'
