capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Southeast Asian dataset aggregation
  value: Standardized loaders for third-party text, speech and vision-language corpora in nearly 1,000 Southeast
    Asian languages, documented in a paper and per-loader datasheets, with no named model or benchmark beyond
    its own paper's experiments.
  confidence: medium
  note: SEACrowd gives the languages of Southeast Asia a single loader across text, speech and vision-language
    data, documented in a paper and per-loader datasheets. It packages other groups' datasets rather than collecting
    new ones, and no outside model or leaderboard naming it was found, where SEA-HELM backs the region's public
    leaderboard.
  relative_to: sea-helm
  relation: two_below
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2406.10118
    shows: '"providing standardized corpora in nearly 1,000 SEA languages across three modalities. Through
