capability:
  score: 4
  basis: feature_matrix
  basis_detail: throughput / rules coverage
  value: Real-time rules engine and investigation console built at Discord. Rules written in SML, a restricted
    subset of Python, evaluate every event as it arrives and can ban users, apply labels or return verdicts,
    and Python UDFs extend them with custom detection logic, including ML inference. ROOST reports it handling
    tens of millions of events a day in production at Bluesky.
  confidence: medium
  note: Osprey is a real-time rules engine and investigation console, built at Discord, where rules are
    written in SML and extended with user-defined functions. It is a general Trust and Safety engine rather
    than an AI-native guardrail, so its capability set reflects operational rule evaluation rather than
    model-specific safety detection.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/roostorg/osprey
    shows: README describes 'a safety rules engine and investigation console for real-time event processing
      at scale' where 'human-written rules evaluate each one as it arrives', with rules 'written in SML,
      Osprey's structured rule language, and extended with user-defined functions (UDFs)', originally built
      at Discord. It carries no throughput figures and no longer describes the Rust/Python worker split.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 592ab20d0b28d1642d82318e38ce104ed1c1f625d061b8669c875182556375b7
  - url: https://roost.tools/blog/introducing-osprey-v1-0-open-source-infrastructure-for-real-time-abuse-mitigation/
    shows: ROOST's V1.0 announcement says Osprey "processes over 50M events daily in production environments
      like" Bluesky and "is designed for real-time incident response", and that the refactored open source
      version "has been pulled back into" Discord.
