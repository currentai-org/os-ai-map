capability:
  score: 4
  basis: feature_matrix
  basis_detail: throughput / rules coverage
  value: High-performance real-time event-decisioning engine with a Python-flavoured rules DSL (SML) and an
    investigation console; human-written rules evaluate every event as it arrives; ROOST reports it
    processing over 50M events daily in production environments like Bluesky, and it was built at Discord.
  confidence: medium
  note: Battle-tested at Discord scale, but a single-purpose Trust and Safety rules engine rather than an
    AI-native guardrail. The only published throughput figure is ROOST's v1.0 announcement, which says Osprey
    "processes over 50M events daily in production environments like Bluesky"; the larger numbers sometimes
    attributed to it - around 2.3M rules/sec and 400M daily actions at Discord - appear on none of the sources
    cited here and nowhere in the README. The engine itself is "a safety rules engine and investigation
    console for real-time event processing at scale", with rules "written in SML, Osprey's structured rule
    language, and extended with user-defined functions (UDFs)", built at Discord. Running at that scale
    earns the 4; being single-purpose is why it is not an AI-native guardrail.
  last_verified: '2026-08-14'
  sources:
  - url: https://github.com/roostorg/osprey
    shows: README describes 'a safety rules engine and investigation console for real-time event processing
      at scale' where 'human-written rules evaluate each one as it arrives', with rules 'written in SML,
      Osprey's structured rule language, and extended with user-defined functions (UDFs)', originally built
      at Discord. It carries no throughput figures and no longer describes the Rust/Python worker split.
    accessed: '2026-08-13'
