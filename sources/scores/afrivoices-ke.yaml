capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Kenyan-language speech
  value: About 3,000 hours of scripted and spontaneous speech from 4,777 native speakers in five Kenyan languages,
    documented in a paper, with a w2v-BERT East African recognizer and a Kalenjin Whisper model trained on
    it.
  confidence: medium
  note: AfriVoices-KE gives five Kenyan languages scripted and spontaneous speech from thousands of native
    speakers with a detailed paper, and recognizers such as an East African model and a Kalenjin Whisper model
    are trained on it, though its repositories lack a full dataset card. Its roughly three thousand hours match
    its South African sibling, ZA African Next Voices, and are a small share of the hundreds of thousands in
    the largest English speech corpora.
  relative_to: za-african-next-voices
  relation: at
  last_verified: '2026-09-24'
