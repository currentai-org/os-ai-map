  value: relative and metric depth, camera pose estimation, pose-conditioned depth and 3D Gaussian rendering
    from one or many images of any scene with no training, across Small to Giant checkpoints
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: Depth Anything gives a depth map, and with several views a camera pose, for any image the user
    supplies without training, and depth has no label set that a new task would require retraining for.
    It covers the geometry tasks only, where Ultralytics spans detection, segmentation and depth together.
