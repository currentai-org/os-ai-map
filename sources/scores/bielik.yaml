capability:
  score: 3
  basis: benchmark
  basis_detail: Open LLM Leaderboard suite (paper benchmark table)
  value: Bielik-11B-v3.0-Instruct averages 72.45 on the Open LLM Leaderboard tasks in its paper, with MMLU 71.11
    and GSM8K 85.60; the same table gives Mistral-7B-Instruct-v0.2 65.71, MMLU 60.78 and GSM8K 40.03, and Meta-Llama-3-8B-Instruct
    66.87. On the Open PL LLM Leaderboard it scores 65.93.
  relative_to: mistral-7b-instruct
  relation: one_above
  confidence: medium
  note: Bielik is not listed on Artificial Analysis, so this reading comes from the paper's own English benchmark
    table. There it clearly outperforms Mistral 7B Instruct v0.2, a tune of the same base it was scaled up from,
    most of all in math, and Llama 3 8B Instruct. In Polish it scores close to open models several times its size.
  comparison:
