  note: Kimi K3's weights are ungated on Hugging Face under the Kimi K3 License, an MIT-style grant with
    two conditions. A company running a model-as-a-service business with more than $20 million in revenue
    over any 12 months must sign a separate agreement with Moonshot AI before commercial use, and a product
    with more than 100 million monthly active users or $20 million in monthly revenue must display "Kimi
    K3". Only inference and deployment code is published and no training corpus is released, so the family
    counts as open weights rather than open source.
