  note: GPT-4o was the default ChatGPT model for much of 2024 and 2025, before GPT-5. ChatGPT crossed roughly
    900 million weekly active users in February 2026 and about 1 billion in May 2026, relayed from OpenAI's
    own announcement rather than from an aggregator estimate. The level is attributed honestly to the ChatGPT
