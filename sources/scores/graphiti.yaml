capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: LLM extraction of entities and facts from episodes; entity resolution and duplicate merging; invalidation
    of contradicted facts with bi-temporal validity windows; a graph of entities, facts, episodes and communities;
    hybrid semantic, keyword and graph search scoped by group_id
  confidence: medium
  note: 'Graphiti performs the whole cycle itself: it extracts entities and facts from each episode, merges duplicates,
    invalidates facts that newer data contradicts while keeping their history, and searches the resulting graph
    within a namespace. Users, threads and serving are left to the application that embeds it, which is what Zep
    adds as a hosted service.'
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/getzep/graphiti/main/README.md
    shows: Facts have validity windows and "When information changes, old facts are invalidated — not deleted";
      the graph holds entities, facts, episodes and custom types, queried by "Hybrid Retrieval" of semantic, BM25
      and graph traversal.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 9ce191cedfc99840b78e2be24fe1be9a1f71937d62244ee72bca1d0d039069d3
