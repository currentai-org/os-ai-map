capability:
  score: 4
  basis: feature_matrix
  value: classification, regression and missing-value imputation on a new table in one forward pass without task-specific
    training; LimiX-2 reported first on TabArena, TALENT and BCCO
  relative_to: tabpfn
  relation: at
  confidence: medium
  note: LimiX predicts on an unseen table from its rows in context, with no fitting step, as TabPFN does, and also fills
    in missing values. Its authors report it ahead of TabFM and AutoGluon on public benchmarks, but it is a single model
    and does not search over or ensemble other learners.
  comparison:
    last_attested: '2026-11-12'
    sources:
