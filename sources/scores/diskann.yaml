  note: 'DiskANN declares no package: its only PyPI artifact binds the legacy C++ implementation, which
    the repository says is no longer actively developed, so its downloads would measure that frozen code
    rather than the current library. That leaves GitHub stars as the only adoption signal, and a star is
    not a use, so this reading says little about how many projects actually run DiskANN.'
