  value: GPU requests in LSF's own submit schema - SUB4_GPU_REQ with JDATA_EXT_GPU_NUM, GPU_MODE, GPU_MODEL,
    GPU_MEM, GPU_TILE and MPS options - or the equivalent resource string rusage[ngpus_physical=2:gmodel=K80#12G:nvlink=yes];
    numProcessors and maxNumProcessors bound the allocation; the scheduler places the job on hosts advertising
    matching resources
