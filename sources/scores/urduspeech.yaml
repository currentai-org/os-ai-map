capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Urdu speech data
  value: UrduSpeech holds 156 hours of Urdu, code-switched and accented speech from YouTube and television
    archives, transcribed by an LLM pipeline with a 9-hour benchmark corrected by native speakers, documented
    in a paper, with no named downstream use.
  confidence: medium
  note: UrduSpeech is a documented corpus for a language with little open speech data, and its 9-hour benchmark
    is corrected by native speakers. The rest of its transcripts come from an LLM pipeline, no model outside
    its paper names it, and IndicVoices has people transcribe its speech.
  relative_to: indicvoices
  relation: two_below
  last_verified: '2026-09-24'
  sources:
