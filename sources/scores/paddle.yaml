capability:
  score: 5
  basis: feature_matrix
  value: 'A full training-and-inference framework rather than a library on top of one: unified dynamic and static
    graphs with automatic parallelism that derives a distributed strategy from single-device tensor partitioning
    annotations; training and inference served by the same framework for large models; high-order differentiation
    for scientific computing; cross-platform deployment. Comparable in scope to TensorFlow.'
  confidence: medium
  note: 'Scored 5 on framework scope. Paddle is a foundational framework in the same sense as pytorch and tensorflow,
    which both sit at 5 here: it owns its own graph engine, distributed execution and deployment path rather than
    building on somebody else''s. Its automatic-parallelism and integrated training-inference design are the distinguishing
    claims.'
  relative_to: pytorch
  relation: at
  comparison:
    last_attested: '2026-08-31'
    sources:
    - url: https://github.com/pytorch/pytorch
      shows: The README's two-line summary still reads "Tensor computation (like NumPy) with strong GPU acceleration"
        and "Deep neural networks built on a tape-based autograd system", with a Dynamic Neural Networks section
        under it. PyTorch's 5 rests on owning the tensor engine and the autograd built on it, which is the same
        framework scope Paddle claims for its own graph engine and deployment path.
