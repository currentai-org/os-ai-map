  score: 3
  basis: feature_matrix
  value: high-level training for vision (classification, segmentation), text, tabular and collaborative-filtering
    models, with transfer learning from pretrained torchvision and timm backbones, learning-rate finding,
    one-cycle schedules and callbacks
  relative_to: timm
  relation: at
  confidence: high
  note: fastai makes it quick to fine-tune a pretrained network on the user's own labeled data across
    several domains, and ships the training recipes to do it well. The user still picks the architecture
    and supplies the training run, as with timm, so it sits with the toolkits.
