  note: 'This is a close call, and RWKV has published more than a first look suggests. What is released:
    an itemized, machine-readable index (index/train.jsonl and train.csv) naming every component dataset
    with a resolvable URL, a category and a citation - almost all of them public - plus 100k and 1M preview
    subsamples. That is real openness work, well beyond a prose description of the mixture. What is not
    released is the corpus itself, or any script that reconstructs it. The exact subsampling amounts are
    referred to as supplementary material (wiki.txt, oscar.txt) that appears neither in the dataset repository,
    nor among the arXiv ancillary files, nor in RWKV-LM, which carries model and training code but no data-preparation
    directory. No mixing proportions or per-component token counts are given, one component (OSCAR23.01)
    is itself gated, and the maintainers'' own notes still ask which of the three versions of peS2o was
    used, so the mixture is not reproducible in detail even in principle. Open data means a released dataset
    or scripts that reconstruct the corpus end to end, and neither holds here - which narrows one claim
    rather than downgrading the project, since the weights, the training code and the license are all fully
    open under Apache-2.0. This lands in a genuine gap in the openness scale: every component named and
    publicly resolvable, but the mixture not reproducible, is meaningfully more open than prose documentation
    and less than a released corpus, and the scale has no value for it. Nemotron 3''s partial release falls
    into the same gap. The evidence behind all of this: the Goose-World repository holds only the component
    index, the two preview subsamples, two READMEs and a figure, with no corpus shards; RWKV-LM is public
    and Apache-2.0 at 14,661 stars with no data-preparation directory; and rwkv-7-world is ungated apache-2.0.'
  raw: weights:open(Apache-2.0);data:documented-not-released(itemized machine-readable component index with
    resolvable links to public datasets, but no released corpus and no reconstruction pipeline);code:open(github.com/BlinkDL/RWKV-LM);license:Apache-2.0(OSI)
