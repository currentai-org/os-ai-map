  note: RWKV publishes Apache-2.0 weights and open training code, plus a machine-readable index naming every
    training-data component with a resolvable link, category and citation. But the corpus itself is not
    released, mixing proportions are withheld, one component is gated and another's version unresolved,
    so the data stays itemized but not reproducible -- open weights rather than fully open.
