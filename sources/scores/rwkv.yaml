capability:
  score: 2
  basis: benchmark
  basis_detail: MMLU on the RWKV-7 World model card, with the RWKV-7 Goose paper (arXiv:2503.14456)
  value: 'RWKV-7 World 2.9B: MMLU 54.56% (1.5B: 44.84%) on the model card; the paper claims a new 3B-scale
    SoTA on multilingual tasks and parity with the 3B SoTA in English. The larger G1 models (up to 13.3B)
    publish no benchmark table.'
  relative_to: internlm
  relation: at
  confidence: medium
  note: 'RWKV''s case is efficiency rather than absolute capability: a linear-time recurrent architecture
    that its paper shows competitive at 3B scale on far fewer training tokens. Its best published MMLU sits
    well below InternLM2.5-7B and Yi-34B, small and mid-size models from the 2023-2024 generation that this
    map places at the same level, and the G1 models that extend the line to 13.3B report only language-modeling
    results, which give no grounds for placing it higher.'
