capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indonesian instruction data
  value: 'Instruction data for Indonesian and local languages, 42,989,754 rows across its two releases: nearly
    all templated from existing NLP datasets, Wikipedia, WikiHow and poems, plus 75,055 machine-translated
    Dolly rows and 156,000 rows of repeated safety and identity prompts whose authorship is not documented.
    Documented in the Cendol paper, and used to train the Cendol Instruct and Chat models.'
  confidence: medium
  note: The collection trained IndoNLP's Cendol Instruct and Chat models, from 300 million to 13 billion parameters,
    and the Cendol paper documents it. Like WangchanThaiInstruct it has a paper and named models trained on
    it, but its task prompts are rebuilt from existing labeled datasets and its cards do not describe the contents.
  relative_to: wangchan-thai-instruct
  relation: at
  last_verified: '2026-11-11'
