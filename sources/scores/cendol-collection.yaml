capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage, size and downstream use for Indonesian instruction data
  value: About 53.5 million prompts for Indonesian and local languages by the paper's count (30.2 million
    in v1 and 12.8 million in v2 on the Hub), templated over existing NLP datasets (v1) and extended with
    general and human-centric prompts (v2), documented in the Cendol paper, and used to train the Cendol
    Instruct and Chat models.
  confidence: medium
  note: The collection trained IndoNLP's Cendol Instruct and Chat models, from 300 million to 13 billion
    parameters, and the Cendol paper documents its tens of millions of prompts. Like Inkuba-Instruct it
    rebuilds existing labeled datasets into prompts, and its Hub cards are copies of the model card that
    do not describe the contents.
  relative_to: inkuba-instruct
  relation: at
  last_verified: '2026-10-30'
