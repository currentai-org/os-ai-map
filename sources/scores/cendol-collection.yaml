capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indonesian instruction data
  value: Instruction data for Indonesian and local languages, templated over existing NLP datasets (v1) and
    extended with general and human-centric prompts (v2), documented in the Cendol paper, and used to train
    the Cendol Instruct and Chat models.
  confidence: medium
  note: The collection trained IndoNLP's Cendol Instruct and Chat models, from 300 million to 13 billion parameters,
    and the Cendol paper documents it. Like WangchanThaiInstruct it has a paper and named models trained on
    it, but its task prompts are rebuilt from existing labeled datasets and its cards do not describe the contents.
  relative_to: wangchan-thai-instruct
  relation: at
  last_verified: '2026-09-24'
