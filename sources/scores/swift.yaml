capability:
  score: 4
  basis: feature_matrix
  relative_to: megatron-lm
  relation: one_below
  value: 'Methods: full FT, LoRA/QLoRA/DoRA, SFT, GRPO family (GRPO/DAPO/GSPO/SAPO/CISPO/CHORD/RLOO/Reinforce++),
    preference (DPO/KTO/RM/CPO/SimPO/ORPO), pretraining; 600+ models; integrated quantization/eval/deploy.'
  confidence: high
  note: SWIFT covers full fine-tuning, LoRA, QLoRA and DoRA, the GRPO family of reinforcement learning methods,
    preference tuning and pretraining across more than 600 text models, with quantization, evaluation and
    deployment built into one pipeline. It borrows its large-scale parallelism from Megatron-LM through
    the Megatron-SWIFT backend rather than developing its own, which places it a step below Megatron-LM.
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/modelscope/ms-swift/main/README.md
    shows: README says ms-swift supports "training (pre-training, fine-tuning, human alignment), inference,
      evaluation, quantization, and deployment for 600+ text-only large models", lists "LoRA, QLoRA, DoRA,
      LoRA+, LLaMAPro, LongLoRA, LoRA-GA, ReFT, RS-LoRA, Adapter, LISA", the GRPO family "GRPO, DAPO, GSPO,
      SAPO, CISPO, CHORD, RLOO, Reinforce++", preference methods "DPO, KTO, RM, CPO, SimPO, ORPO", and "Megatron
      parallelism techniques such as TP, PP, CP, EP to accelerate training"; evaluation covers "100+ evaluation
      datasets" and export covers "AWQ, GPTQ, FP8, and BNB".
