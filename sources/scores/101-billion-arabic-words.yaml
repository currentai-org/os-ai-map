capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Arabic pretraining text
  value: The corpus holds about 101 billion words in 33 million documents of cleaned and deduplicated Arabic
    Common Crawl text, is documented in a paper, and ModernAraBERT is listed as trained on it.
  confidence: medium
  note: The corpus gives Arabic a large cleaned and deduplicated Common Crawl collection, documented in a paper
    whose authors call it the largest Arabic dataset available, and ModernAraBERT is trained on it. At about
    a hundred billion words it is among the largest single-language corpora outside English and Chinese, though
    still short of the trillions of tokens in FineWeb or DCLM, and like Sangraha it is a big documented corpus
    with little outside use recorded.
  relative_to: sangraha
  relation: at
  last_verified: '2026-09-24'
