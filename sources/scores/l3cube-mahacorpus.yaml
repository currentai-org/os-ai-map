capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for Marathi pretraining text
  value: 289 million tokens in 24.8 million Marathi sentences crawled from news and other sites, documented
    in a workshop paper, and used with existing sources to train the MahaBERT, MahaAlBERT and MahaRoBERTa models.
  confidence: medium
  note: MahaCorpus gives Marathi news and web sentences documented in a workshop paper, and the MahaBERT family
    of Marathi models was trained on it together with existing sources. At under three hundred million tokens
    it is far smaller than other single-language Indian corpora such as the TituLM Bangla corpus, judged on
    the same yardstick, and a tiny fraction of the trillions in English pretraining corpora.
  relative_to: titulm-bangla-corpus
