capability:
  score: 3
  basis: feature_matrix
  value: 'Methods: SFT and online RL through one token-masked trajectory path, with GAE, GRPO and per-step GRPO
    advantage estimators; many LoRA adapters sharing one base model, with a scheduler that keeps each adapter''s
    gradients, optimizer state and rollout snapshots separate; single- and multi-turn environments with tool calling,
    multi-agent training, LLM and VLM examples (math, geometry, ALFWorld, Android World, Gomoku) on models up to
    3B; training on verl. A focused agent-RL service layer comparable to OpenPipe ART, not a large-scale training
    framework.'
  confidence: medium
  note: OpenTinker trains agents with SFT and reinforcement learning in single- and multi-turn environments, letting
    many LoRA adapters share one base model with their training state kept apart, the same agent-RL ground OpenPipe's
    ART covers. Its documented examples stop at 3B-parameter models, so none of the large-scale parallel training
    of verl or Megatron-LM is shown.
  relative_to: openpipe
  relation: at
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://raw.githubusercontent.com/OpenPipe/ART/main/README.md
      shows: The ART README still describes "an open-source RL framework that improves agent reliability by allowing
        LLMs to **learn from experience**", whose server trains the model with GRPO "initializing from the latest
        checkpoint (or an empty LoRA". That is the same LoRA-based agent-RL scope OpenTinker documents.
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: ea7684d222767b85b9392dbf3dff6f9972bed7802aee7352daad33c0cd9d7773
