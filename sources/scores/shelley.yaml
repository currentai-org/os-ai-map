capability:
  score: 4
  basis: feature_matrix
  value: web and mobile coding agent with multiple simultaneous conversations; image, audio and screen-cast input;
    Chrome DevTools browser tools; subagents and asynchronous tool calls; skills and MCP; profiles that preset tools
    and system prompt; hosted or local models; CLI client for scripting; no built-in plan mode, permission system
    or sandbox; no published benchmark result
  relative_to: openhands
  relation: one_below
  confidence: medium
  note: Shelley covers what a coding agent needs and goes past a terminal agent with its web interface, multimodal
    input and browser tools. Like Pi, it runs with the user's own permissions and leaves sandboxing to the user,
    and it publishes no benchmark, so it sits a step below OpenHands, which runs agents in sandboxed backends.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/OpenHands/OpenHands/main/README.md
      shows: The OpenHands README still leads with "Run OpenHands, Claude Code, Codex, Gemini, Pi, OpenCode, or
        any ACP-compatible agent across local, remote, and cloud backends" and offers running agents "in Docker
        containers, on VMs, or within your company infrastructure". Shelley has no sandboxed backend of its own,
        so it stays one step behind.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: eca2b7026190577215e9967cc6ba69ff6ed3219d05f2a48a01d4ab590fa6a38a
  last_verified: '2026-11-12'
