  value: text detection and recognition across 100+ languages; table, formula and seal recognition; a document-parsing
    pipeline emitting Markdown and JSON; PaddleOCR-VL as the vision-language parsing model on top; PP-ChatOCRv4
    key-information extraction returning the fields a user names
  confidence: medium
  relative_to: docling
  relation: at
  comparison:
    last_attested: '2026-09-29'
    sources:
    - url: https://docling-project.github.io/docling/_generated/examples/extraction/
      shows: The Information extraction example states "Docling provides the capability of extracting information,
        i.e. structured data, from unstructured documents." and that the user supplies a template "either
        as a dictionary or as a Pydantic model, and Docling will return" the extracted data; its "Using
        a dict template" example returns a bill number and a total of "3949.75" from an invoice.
      accessed: '2026-09-29'
      http_status: 200
      content_sha256: 2c7a3feb10edea4ad9304e1ae7e2d8adafc90f9e5ab0524ddeb68a6b37a3b6db
  note: PaddleOCR's PP-ChatOCRv4 pipeline returns the fields a user names from a document, on top of a parsing
    pipeline that emits Markdown and JSON with tables, formulas and seals recovered, which matches Docling's
    template-driven extraction. Its support for more than 100 languages is not what places it here, since
    language breadth measures how many documents it can process, not how much of one survives.
