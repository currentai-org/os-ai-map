capability:
  score: 3
  basis: feature_matrix
  value: OpenAI + Anthropic + Responses API surfaces; 23 inference providers; composes vector stores,
    safety backends, tool runtimes, file/batch storage into one agentic API server
  confidence: medium
  note: Capability here is gateway and agentic-server breadth - several API surfaces, provider composition
    - rather than inference throughput. As an inference engine it would score low, because it runs no forward
    pass itself; it is scored instead on the feature set it actually offers. The multi-SDK surface now spans
    the Google GenAI SDK alongside the Anthropic one, and a versioned Skills endpoint has appeared, while
    the README no longer states the provider count of 23 and defers to the provider documentation instead.
    Neither changes the tier.
