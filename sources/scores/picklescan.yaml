capability:
  score: 2
  basis: feature_matrix
  basis_detail: Pickle file scanning coverage
  value: Detection of dangerous globals, such as eval, in Pickle files from local paths, directories, URLs, zip archives,
    PyTorch checkpoints, NumPy .npy files and Hugging Face repositories, with include and exclude filters and ClamAV-style
    exit codes.
  relative_to: garak
  relation: two_below
  confidence: medium
  note: 'picklescan does one job: it lists the dangerous imports a Pickle file would run and returns an exit code a script
    can act on. It reads only Pickle-based files and never tests a running model, which garak probes for many kinds of failure,
    so it sits two steps below garak.'
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/NVIDIA/garak/main/README.md
