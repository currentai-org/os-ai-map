  score: 3
  basis: feature_matrix
  value: 50+ GPU-accelerated algorithms across clustering (k-means, DBSCAN, HDBSCAN), regression and classification
    (linear models, random forests, SVMs, k-NN), dimensionality reduction (PCA, t-SNE, UMAP) and time
    series (ARIMA, Holt-Winters), with scikit-learn-compatible estimators, zero-code-change acceleration
    and multi-GPU scaling
  relative_to: scikit-learn
  relation: at
  confidence: high
  note: cuML covers much of scikit-learn's catalog and runs it on GPUs, often many times faster, which
    is a difference of speed and scale rather than of how much of the task it does. Choosing and tuning
    the model stays with the user.
