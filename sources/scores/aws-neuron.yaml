  score: 4
  basis: feature_matrix
  value: vLLM V1 API on Trainium/Inferentia with Expert Parallelism, disaggregated inference, speculative
    decoding; native PyTorch + JAX; compiler/runtime/profiler stack
  confidence: medium
  note: 'The score rests on the feature set: the Neuron runtime supports the vLLM V1 API on Trainium and
    Inferentia with expert parallelism for mixture-of-experts models, disaggregated inference architectures
    and speculative decoding, alongside native PyTorch and JAX and a compiler/runtime/profiler stack. That
    is a server-class inference feature set, but one locked to AWS Inferentia and Trainium hardware. No
    MLPerf Inference figure has surfaced for Neuron, so there is no benchmark result behind the score.'
  basis_detail: vLLM V1 API on Trainium/Inferentia with Expert Parallelism, disaggregated inference, speculative
    decoding; native PyTorch + JAX; compiler/runtime/profiler stack
