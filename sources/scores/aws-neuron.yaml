  confidence: high
  note: Source-available rather than closed or open. Neuron is not a managed service, since the SDK installs
    and runs on the customer's own EC2 instance, but it installs from proprietary packages and the headline
    inference path is not published. The aws-neuron-sdk repository is a documentation and issue-tracker
    repo whose compiler and neuron-runtime directories hold documentation rather than code, and AWS's own
    open-source catalog lists six public repositories with neither the Neuron Runtime nor the Neuron Compiler
    among them. What does ship as source is the GPL-2.0 Linux kernel driver, the NKI kernel library, the
    Apache-2.0 vLLM-for-Neuron integration and the MIT-0 samples, real open components arranged around a
    closed core.
