capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Hand-optimized NEON and OpenCL kernels for ML operators across Arm Cortex-A, Neoverse and Mali
    targets, with x86 also listed. A kernel library rather than a compiler.
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: Arm Compute Library provides hand-optimized NEON and OpenCL kernels for machine-learning operators,
    mainly across Arm's own Cortex-A, Neoverse and Mali hardware, with x86 also listed. OpenVINO declares
    it as a submodule and oneDNN can be built against it on Arm CPUs, which places it one step below Apache
    TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/ARM-software/ComputeLibrary/main/README.md
    shows: README describes "a collection of low-level machine learning functions optimized for Arm® Cortex®-A,
      Arm® Neoverse™ and Arm® Mali™ GPUs architectures." with "Over 100 machine learning functions for CPU
      and GPU" and "Multiple convolution algorithms (GeMM, Winograd, FFT, Direct and indirect-GeMM)".
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 9dcf9265c2a81b064ea9793379ef9d1235710a40c2d7c253e4664389ba3dc7d3
