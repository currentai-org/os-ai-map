capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Creates and validates signed C2PA manifests (Content Credentials) bound to media files; validation
    checks the signing certificate against the C2PA trust list.
  relative_to: nvtrust
  relation: one_below
  confidence: high
  note: A manifest is signed, so anyone holding the file can check that it was not altered and which certificate
    signed it, offline and without the publisher's help. What it cannot show is that the signer's claims about
    the content are true, which is the gap between this and NVIDIA's hardware attestation.
  last_verified: '2026-09-26'
  sources:
