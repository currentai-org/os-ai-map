capability:
  score: 2
  basis: feature_matrix
  value: bundles contributed by reviewed pull request; each version archived as a zip and indexed in model_info.json;
    download by name through monai.bundle.download from Project MONAI's NGC and Hugging Face hosting; browsable
    model page; MONAI Bundle format only
  confidence: medium
  relative_to: nvidia-ngc-catalog
  relation: at
  note: Like the NGC catalog, the zoo hosts versioned packages under its operator's own accounts and serves
    them by name through a download API. Contributors cannot publish directly; each bundle arrives by a pull
    request the maintainers review, so it is a curated collection rather than an open registry.
  last_verified: '2026-09-27'
  sources:
