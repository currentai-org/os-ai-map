capability:
  score: 2
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 2 of 5, provisional and count-based: the median corroborated band over its target languages,
    17 of 17 measured, across 1 task. Face value 2; best original band 2.'
  confidence: medium
  note: In every language AfriMGSM targets, its test has one to four hundred problems. Its Swahili problems
    are MGSM's own rather than translated for this set, and nothing independent in Swahili backs them, so
    Swahili counts for less. An item count says how much a set can test, not how precisely it ranks models.
  last_verified: '2026-11-18'
  sources:
  - url: https://arxiv.org/abs/2406.03368
    shows: '"we introduce IrokoBench -- a human-translated benchmark dataset for 17 typologically-diverse low-resource
      African languages covering three tasks: natural language inference~(AfriXNLI), mathematical reasoning~(AfriMGSM),
      and multi-choice knowledge-based question answering~(AfriMMLU)"'
    accessed: '2026-11-18'
    http_status: 200
    content_sha256: 53df52b2305ce9322362d95a290fc44871149d7211bf434eb8557ea8bc89f1a5
  - url: https://arxiv.org/html/2406.03368
    shows: '"The datasets were created by human translating a subset of English cross-lingual NLI (XNLI) (Conneau et
      al., 2018), English Multilingual Grade School Math (MGSM) (Shi et al., 2023), and Massive Multitask Language Understanding
      (MMLU) (Hendrycks et al., 2021a), evaluation datasets into each of the 16 languages using professional translators.";
      "we human translate the English portion of XNLI (a multilingual dataset comprising 15 languages, including Swahili)
      into the 15 African languages (excluding Swahili)"; "AfriMGSM expands the original MGSM dataset (Shi et al., 2023),
      which contains 250 QA pairs and 11 languages (including Swahili), to 15 more languages."; Table 1 gives AfriMGSM
      "17 (excl. Swahili, inc. Vai)" languages and AfriMMLU "17 (incl. French)"; "We extend our gratitude to Charles
      Riley for facilitating our connection with the Vai translator for the MGSM data translation."'
    accessed: '2026-11-18'
    http_status: 200
    content_sha256: 8d5940c1e236940dece89ef505c206ccd3f0dd8724e93d73ff7f0cac8e56e698
  - url: https://huggingface.co/datasets/masakhane/afrimgsm/raw/main/README.md
    shows: '"AFRIMGSM is an evaluation dataset comprising translations of a subset of the GSM8k dataset into 16 African
      languages."'
    accessed: '2026-11-18'
    http_status: 200
    content_sha256: 3ec663cd84a62ca7279f9c5fa79398cc207cfa2692b07a07153b37af192db257
  - url: https://datasets-server.huggingface.co/size?dataset=masakhane/afrimgsm
    shows: 'the Hub''s split sizes for masakhane/afrimgsm: 250 test questions in each language config, vai among them'
    accessed: '2026-11-18'
    http_status: 200
    content_sha256: 10674bf878a117cfa7d3f3403b29cbdbe158d840aa9a9ad5eb099fbdb3a997c0
  - url: https://arxiv.org/pdf/2210.03057
    shows: 'MGSM: "We enlisted the help of paid professional translators (two for Chinese and German, three for Russian,
      five for Thai, one for each remaining target language) for the manual translation of the 250 selected English-language
      examples from GSM8K"; Swahili is among its languages ("underrepresented languages such as Bengali and Swahili")'
    accessed: '2026-11-18'
    http_status: 200
    content_sha256: bbc7d094a65af2ac51c19daa01222ed33b3d8b9e016ffb6a016ce16b32452ad1
