capability:
  score: 1
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 1 of 5, provisional and count-based: the median corroborated band over its target languages, 10 of 11 measured, across 1 task. Face value 1; best original band 1.'
  confidence: medium
  note: In every language SEA-MTBench targets, its one test has fewer than a hundred questions, as MT-Bench itself
    does. Tamil has a split, but no source says how it was made, so it does not count. An item count says how much
    a set can test, not how precisely it ranks models.
