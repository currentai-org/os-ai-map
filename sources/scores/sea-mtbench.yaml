  signal_type: usage_volume
  confidence: high
  note: Hugging Face downloads of the repository over the trailing month. SEA-HELM declares the same repository,
    so these downloads also count toward SEA-HELM's figure, and the runs that read its separate judged copy count
    only there.
  sources:
  - url: https://huggingface.co/api/datasets/aisingapore/MultiTurn-Chat-MT-Bench
    shows: '"downloads":87 for aisingapore/MultiTurn-Chat-MT-Bench.'
