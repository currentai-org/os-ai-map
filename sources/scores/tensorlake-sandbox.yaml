    shows: Apache-2.0 license; sandbox runtime + SDK (Python + Rust); BYOC self-host
    accessed: '2026-07-09'
  - url: https://www.tensorlake.ai/
    shows: sandbox-native cloud for AI agents; run sandboxes in your own cloud account
    accessed: '2026-07-09'
