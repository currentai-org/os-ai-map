capability:
  score: 4
  basis: feature_matrix
  value: isolation:Firecracker microVM (top tier); cold-start:vendor claims sub-second creation via the
    Lattice scheduler, independently measured at 1.35s median time-to-interactive; runtime breadth:arbitrary
    agent sandboxes; persistence:snapshot/suspend/resume + durable-execution orchestration; scale:reported
    thousands of concurrent sandboxes
  confidence: medium
  note: 'Firecracker microVM isolation plus durable-execution orchestration and snapshot/resume make for
    a rich agent-runtime feature set, level with the microVM peers: tensorlake.ai leads on Firecracker isolation
    with each tool call and harness in its own microVM, snapshots with pause/fork/resume, versioned mountable
    volumes, durable serverless functions with queues, timers and retries, and cloud dev boxes. The measured
    half of that picture is in tension with the score. Independent ComputeSDK TTI benchmarks put Tensorlake
    at 1.35s median time-to-interactive, 1.44s P95, composite 86.1, 15th of 24 providers - roughly three
    times the ~460ms and 12th-of-19 reading this band was written against, and well short of the vendor’s
    own sub-second creation claim. Note that 460ms is also the number the vendor site animates in its demo,
    so the vendor claim and the leaderboard are not two independent measurements. Nothing here asserts sub-second
    latency as a measured fact: the vendor claim and the measured figure are recorded separately, which
    is what the two sources support. The 4 stands on isolation and feature depth, and whether a 1.35s time-to-interactive
    should pull it down is an open question rather than one settled here.'
  last_verified: '2026-08-14'
