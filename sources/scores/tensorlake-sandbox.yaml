  class: open_core
  components:
    license:
    - name: Apache-2.0
      detail: OSI
    source:
      value: public
      detail: SDK, tl CLI and client crates only; vendor-deployed BYOC runs in the customer's AWS/GCP/Azure
        account
    core-gated:
      value: gated
      detail: the MicroVM runtime and the Lattice cluster scheduler that creates sandboxes exist in no public
        repo - the Apache-2.0 tree publishes the SDK, the tl CLI and client crates, which authenticate to
        cloud.tensorlake.ai with an API key
    context:
      managed-tier:
        value: Tensorlake hosted cloud + proprietary Lattice scheduler
  confidence: medium
  note: Tensorlake publishes its Python SDK and the client side of its CLI under Apache-2.0, but the Firecracker
    microVM runtime and the Lattice scheduler that create sandboxes are in no public repository, and the
    CLI's filesystem and Git crates are built from private sources. Getting started requires an API key
    for Tensorlake's own cloud, and none of the company's other public repositories implement the missing
    pieces.
