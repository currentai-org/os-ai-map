openness:
  score: 4
  class: open_core
  components:
    license:
    - name: Apache-2.0
      detail: OSI
    source:
      value: public
      detail: runtime+SDK, BYOC self-host in your own AWS/GCP/Azure
    managed-tier:
      value: Tensorlake hosted cloud + proprietary Lattice scheduler
    core-gated:
      value: gated
      detail: the MicroVM runtime and the Lattice cluster scheduler that creates sandboxes exist in no public
        repo - the Apache-2.0 tree publishes the SDK, the tl CLI and client crates, which authenticate to
        cloud.tensorlake.ai with an API key
  confidence: medium
  note: 'Apache-2.0 SDK and CLI with a proprietary managed runtime. The core is gated on a named mechanism:
    not a carve-out inside the repository, but a component that is in no repository at all. The 2,350-entry
    tree is entirely client side - the Python SDK around cloud_client.py, the tl CLI, and nine crates that
    are all clients, codecs or bindings - and the README attributes sub-second creation to "Lattice, a dynamic
    cluster scheduler", along with snapshots, cloning, auto suspend/resume and live migration, none of which
    appear in any of the org’s 58 public repos. Onboarding is an API key from cloud.tensorlake.ai. One tension
    is worth stating plainly: this record describes the source as runtime plus SDK with BYOC self-hosting
    in your own AWS, GCP or Azure account, and that is not supported - the runtime is not published, and
    BYOC means the vendor’s closed control plane runs in your account rather than open self-hosting, which
    would argue for a more restrictive reading than open core. The tension is stated here rather than resolved.'
  raw: license:Apache-2.0(OSI);source:public(runtime+SDK, BYOC self-host in your own AWS/GCP/Azure);managed-tier:Tensorlake
