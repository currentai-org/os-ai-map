capability:
  score: 4
  basis: feature_matrix
  value: isolation:Firecracker microVM (top tier); cold-start:vendor claims sub-second creation via the
    Lattice scheduler, independently measured at 1.13s median time-to-interactive; runtime breadth:arbitrary
    agent sandboxes; persistence:snapshot/suspend/resume + durable-execution orchestration; scale:reported
    thousands of concurrent sandboxes
  confidence: medium
  note: 'Tensorlake has most of the features expected from a leading sandbox platform: Firecracker microVM
    isolation for every tool call, snapshots that can be paused, forked and resumed, versioned mountable
    volumes, and durable functions with queues, timers and retries. Independent ComputeSDK benchmarks put
    its median time-to-interactive at 1.13 seconds, slower than the vendor''s sub-second claim, although
    latency is not the main differentiator in this category. Scale is the bigger gap: Tensorlake reports
    thousands of concurrent sandboxes, while E2B has recorded more than a billion sandbox starts.'
  last_verified: '2026-09-29'
  sources:
  - url: https://www.tensorlake.ai/
    shows: The homepage describes "isolated Firecracker microVM sandboxes that scale from one to thousands"
      with snapshot, suspend/resume and durable orchestration, and lists "QUEUES, TIMERS, AND RETRIES" among
      the orchestration features.
