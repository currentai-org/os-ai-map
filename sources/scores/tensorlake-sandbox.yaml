  confidence: medium
  note: 'Apache-2.0 SDK and CLI with a proprietary managed runtime. Confirmed `gated` 2026-08-12 on a named
    mechanism, the firecrawl/composio shape: not a carve-out inside the repo but a component that is in
    no repo at all. The 2,350-entry tree is entirely client side - the Python SDK around cloud_client.py,
    the tl CLI, and nine crates that are all clients, codecs or bindings - and the README attributes sub-second
    creation to "Lattice, a dynamic cluster scheduler", along with snapshots, cloning, auto suspend/resume
    and live migration, none of which appear in any of the org’s 58 public repos. Onboarding is an API key
    from cloud.tensorlake.ai. Secondary finding, NOT acted on: the recorded source detail "runtime+SDK,
    BYOC self-host in your own AWS/GCP/Azure" is not supported - the runtime is not published, and BYOC
    means the vendor’s closed control plane runs in your account rather than open self-hosting, so `source`
    may belong at `partial`, which would score 2 rather than 4. Left as recorded and flagged.'
