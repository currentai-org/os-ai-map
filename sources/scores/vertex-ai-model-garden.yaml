  value: curated catalog of Google, partner and open models (including auto-added popular Hugging Face models);
    filter by provider and collection; one-click deploy to managed endpoints; SDK, CLI and REST access; customers
    deploy their own weights into their own project but do not publish to the shared catalog
  confidence: high
  relative_to: huggingface-hub-platform
  relation: two_below
  note: Model Garden gathers models from Google, partners and the open ecosystem into one catalog and deploys
    any of them to a managed endpoint. Google decides what is listed, and a customer's own weights stay in
    that customer's project rather than being published for others, so it is a curated catalog rather than
    an open registry like Hugging Face Hub.
