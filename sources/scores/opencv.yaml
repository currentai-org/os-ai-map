capability:
  score: 1
  basis: feature_matrix
  value: image processing, features, calibration, stereo, stitching, video and object-detection primitives, and
    a dnn module that runs ONNX/TensorFlow/TFLite models trained elsewhere; the classical learners (SVM, k-NN, random
    trees, boosting) have moved to opencv_contrib at HEAD
  relative_to: xgboost
  relation: one_below
  confidence: medium
  note: OpenCV supplies the building blocks of computer vision - filtering, geometry, features, video and a fast
    engine for running networks trained in other frameworks - rather than training a predictor itself. Its classical
    learners now sit in the separate contrib repository, so the main library fits no model of its own.
  last_verified: '2026-09-26'
  sources:
