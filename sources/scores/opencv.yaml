    shows: 'Tree at HEAD: modules calib, core, dnn, features, flann, geometry, highgui, imgcodecs, imgproc, objdetect,
      photo, stereo, stitching, video, videoio and others; modules/ml holds only four perf files, and modules/dnn
      has ONNX, TensorFlow and TFLite importers.'
