capability:
  score: 4
  basis: feature_matrix
  value: Composable FSDP2/HSDP/DDP, tensor (incl. async TP), pipeline (1F1B, interleaved, GPipe), context and expert parallelism;
    MXFP8 and NVFP4 training, regional torch.compile, CUDA graphs and activation checkpointing; TitanRL reinforcement learning
    with vLLM generation; recipes for Llama 3 up to 405B, Qwen3, DeepSeek V3 671B, gpt-oss and FLUX. The paper reports gains
    at 128 to 512 H100 GPUs, short of Megatron-LM's published multi-thousand-GPU runs.
  confidence: medium
  note: TorchTitan composes five kinds of parallelism with low-precision training and carries a model from pretraining through
    fine-tuning to RL, with recipes up to 671B parameters. It sits a step below Megatron-LM, whose published scaling runs
    reach thousands of GPUs while TorchTitan's paper reports 512.
  relative_to: megatron-lm
  relation: one_below
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://developer.nvidia.com/megatron-core
      shows: Redirects to NVIDIA's Megatron Core page, which still says "with GPT models ranging from 2 billion to 462 billion
        parameters, Megatron Core demonstrates superlinear scaling up to 6144 H100 GPUs" and "near linear scaling from 96
        to 4608 H100 GPUs" for a 177 billion parameter GPT-3 model.
