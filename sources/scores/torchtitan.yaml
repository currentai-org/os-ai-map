      1F1B, GPipe", "Context parallel", "Expert parallel", MXFP8 and NVFP4 training, TitanRL running "the same model definitions
      and kernels in the trainer and in vLLM generation", and supported models including Llama 3 "1B – 405B" and DeepSeek
      V3 "16B, 236B, 671B".'
