  last_verified: '2026-08-13'
  note: Vals AI is a leading independent blind-benchmark suite with deep vertical coverage, including cybersecurity,
    games and agentic evaluation such as Finance Agent v2, but its fixed, proprietary task set keeps it
    from becoming a standard others reproduce. Its Valkyrie and model-library repositories have since been
    published, but the Index remains unhostable, keeping it narrower than a general harness.
