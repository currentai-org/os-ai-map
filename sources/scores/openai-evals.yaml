capability:
  score: 3
  basis: feature_matrix
  value: Open benchmark registry + custom-eval authoring (completion-fn + eval templates); model-graded
    and exact/fuzzy-match graders. Coverage breadth modest vs lm-evaluation-harness; no built-in agentic-eval
    harness; maintenance has slowed.
  confidence: medium
  relative_to: lm-evaluation-harness
  relation: two_below
  note: OpenAI Evals pairs a registry of evals with custom-eval authoring and model-graded scoring. Its
    task coverage, backend breadth and agentic support are well behind lm-evaluation-harness.
  sources:
  - url: https://github.com/openai/evals
    shows: framework + registry of benchmarks, custom eval authoring, model-graded grading
    accessed: '2026-06-04'
  - url: https://raw.githubusercontent.com/openai/evals/main/README.md
    shows: 'README: ''We offer an existing registry of evals to test different dimensions of OpenAI models
      and the ability to write your own custom evals''; private evals over your own data supported. No agentic-eval
      harness and no multi-backend abstraction described.'
