adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: The repo is run from source rather than pip-installed, so no download count exists for it. Its 19,161
    GitHub stars and 3,052 forks are the only honest signal, and a star count caps a level at 3; 19,161
    bands at >10K stars on the stars scale, which is a separate vocabulary from downloads because a star
    is not a download. Historically influential as one of the first open eval frameworks, it has been largely
    superseded by the hosted Evals API and by newer harnesses, and the repo has gone months without a commit.
  last_verified: '2026-08-13'
  sources:
