capability:
  score: 3
  basis: feature_matrix
  value: Open benchmark registry + custom-eval authoring (completion-fn + eval templates); model-graded
    and exact/fuzzy-match graders. Coverage breadth modest vs lm-eval-harness/HELM; no built-in agentic-eval
    harness; maintenance has slowed.
  confidence: medium
  relative_to: lm-evaluation-harness
  relation: two_below
  last_verified: '2026-08-13'
  note: A solid general-purpose authoring framework - the README describes a registry of evals plus custom-eval
    authoring - but not frontier on task coverage, backend breadth or agentic-eval support next to category
    leaders such as lm-evaluation-harness, and its maintenance has slowed.
  sources:
