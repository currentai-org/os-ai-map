adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: OpenAI Evals is run from source rather than pip-installed, so no download count exists for it, leaving
    GitHub stars and forks as the only honest usage signal available, and a star is not a use. The framework
    was influential as one of the first open eval harnesses, but it has since given way to OpenAI's hosted
    Evals API and to newer harnesses, and the repository has gone months without a commit.
