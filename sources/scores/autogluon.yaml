capability:
  score: 5
  basis: feature_matrix
  value: automated training, tuning and multi-layer stack/bag ensembling for tabular, time-series and multimodal
    tasks; its tabular model zoo includes the Mitra, TabICL, TabPFN and TabDPT foundation models alongside boosted
    trees and neural networks
  confidence: high
  note: 'AutoGluon does the whole prediction task for you: it chooses and trains candidate models, including pretrained
    tabular foundation models, and stacks them into an ensemble, across tables, time series and mixed image and
    text data. It is the most complete automation in this category and the point the other products here are compared
    against.'
  last_verified: '2026-09-26'
  sources:
