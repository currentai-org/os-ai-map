adoption:
  level: 3
  signal_type: reported_traction
  confidence: medium
  last_verified: '2026-08-13'
  note: Epoch's benchmark results, FrontierMath above all, are a widely referenced capability signal cited
    across frontier-model coverage and research, and the public dashboard is a recognized source for trends.
    It is free to browse and spans roughly 60 benchmarks across Epoch-run, creator-run and developer-run
    sets, none of it accompanied by a visitor or usage count. With no standalone usage or traffic figure
    published anywhere, level 3 reflects broad authoritative reference rather than a measured number, and
    a GitHub star count was not used as a substitute.
  sources:
  - url: https://epoch.ai/benchmarks
    shows: public database of leading-model benchmark results positioned as authoritative AI-capability
      tracker
    accessed: '2026-06-04'
  - url: https://epoch.ai/benchmarks
    shows: Free public dashboard letting a reader 'explore trends in AI capabilities across time, by benchmark,
      or by model', spanning roughly 60 benchmarks in three groups. No traffic, visitor or usage figure
      is published on it.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 05cf0f548e1d61fe4914055c2aca1febbac1bf4f476328bab38e86573d048367
capability:
  score: 4
  basis: feature_matrix
  value: 'Benchmark coverage: 7+ hard frontier benchmarks (FrontierMath Tiers 1-4, GPQA Diamond, SWE-bench
    Verified, SimpleQA Verified, MATH L5, OTIS Mock AIME, Chess Puzzles); model-backend breadth = all
    major frontier labs; reproducibility via contamination-resistant held-out math; agentic eval = coding
    (SWE-bench) but primarily static-task scoring.'
  confidence: medium
  relative_to: lm-evaluation-harness
  relation: one_below
  last_verified: '2026-08-13'
  note: 'Strong on hard, frontier benchmark coverage and trusted standardized results, especially in math.
    It is not a general agentic-eval harness, and the held-out design limits self-serve reproducibility,
    so it lands at 4 - authoritative, but not a frontier-defining general harness in the way lm-evaluation-harness
    is. The Epoch-run set is wider than the list recorded here: eleven benchmarks, adding MirrorCode, Earthborne
    Rangers and Mystery Game Puzzles, and splitting FrontierMath into Tier 4 (v2) and Tiers 1-3 (v2).'
  sources:
  - url: https://epoch.ai/benchmarks
    shows: 'operated benchmarks list: FrontierMath, GPQA Diamond, SWE-bench Verified, SimpleQA Verified,
      MATH Level 5, OTIS Mock AIME, Chess Puzzles'
