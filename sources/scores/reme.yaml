capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: line-level search over Markdown memory with BM25, optional embeddings and wikilink expansion; language-model
    distillation of conversations and resources into daily notes; scheduled consolidation that creates, corroborates,
    refines or corrects long-term digest nodes; daily and digest layers holding facts, preferences and procedures
    linked by wikilinks; no time-based forgetting of memories
  confidence: medium
  note: ReMe distills conversations into daily notes and later folds them into long-term pages, correcting a page
    when new material contradicts it. Memories never expire or fade by age; only raw resource folders can be given
    a retention period.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
