  value: users or organizations publish models (ownerSlug); variations per framework (TensorFlow, PyTorch,
    JAX, TFLite and others) each with versioned snapshots; search and sort by downloads, votes or recency;
    download and upload by handle through kagglehub and the CLI
  confidence: medium
  relative_to: huggingface-hub-platform
