capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Vietnamese pretraining text
  value: The corpus holds about 12.2 million Vietnamese documents (65.5 GB) re-filtered from C4, OSCAR, Wikipedia
    and a news corpus with NeMo Curator, documented by its card and an NVIDIA blog post, and Llama3-ViettelSolutions-8B
    is trained on it.
  confidence: medium
  note: The corpus re-filters existing web, OSCAR, Wikipedia and news text into a cleaner Vietnamese pretraining
    set, documented by its card and an NVIDIA technical post, and Viettel Solutions trained its Llama-based
    Vietnamese model on it. At roughly fifteen billion tokens, estimated from its size on disk, it is far below
    the trillions of tokens in English pretraining corpora, and it adds no new text, where SEA-PILE draws fresh
    crawl text for Vietnamese and eight other languages.
  relative_to: sea-pile
  relation: one_below
  last_verified: '2026-09-24'
