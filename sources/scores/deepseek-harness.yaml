capability:
  score: 4
  basis: feature_matrix
  value: agent harness that reads and edits files, runs commands, delegates to sub-agents and keeps a plan; plan
    mode, skills, MCP servers as native tools and LSP; DeepSeek plus built-in third-party providers and custom OpenAI-
    or Anthropic-compatible endpoints; Web UI, desktop app, headless, ACP and TypeScript/Python SDK modes; read-only,
    workspace-write or unrestricted sandboxing on bwrap, Landlock, Seatbelt and Windows restricted tokens, with approval
    prompts; SSH remote execution; scheduled follow-ups; every part a Cordis plugin; developer preview with no security
    audit; no published benchmark result
  confidence: medium
  note: DeepSeek Harness covers what a coding agent is expected to do, with sub-agents, plan mode, MCP, many model
    providers and an SDK, and adds per-platform process sandboxing and approval prompts that limit what the agent
    can touch. It sits a step below OpenHands, which publishes benchmark results, because it is still a developer
    preview with no published benchmark result and no security audit.
  relative_to: openhands
  relation: one_below
  comparison:
