capability:
  score: 1
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: CPU rigid-body dynamics and collision with URDF loading and example RL environments; GPU support only as
    experimental OpenCL for collision and rigid bodies; OpenGL demo rendering.
  confidence: medium
  note: PyBullet simulates rigid robots on the CPU and is easy to script, which made it a common first simulator
    for reinforcement learning. Its contact modeling is simpler than MuJoCo's, GPU support never left the experimental
    stage, and it renders only a basic viewer.
  relative_to: robosuite
  relation: two_below
  last_verified: '2026-09-26'
  sources:
