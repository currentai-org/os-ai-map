capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Southeast Asian model evaluation
  value: Evaluation suite across eleven Southeast Asian languages in five groups of tasks, mixing native datasets,
    human translations and handcrafted sets such as Kalahi, documented in a paper, and backing the SEA-HELM
    leaderboard.
  confidence: medium
  note: SEA-HELM tests eleven Southeast Asian languages across classic NLP tasks, chat, instruction following,
    linguistics, culture and safety, the widest open suite for the region, and it backs a public leaderboard.
    Much of its content is sampled from existing datasets such as FLORES, XL-Sum and NusaX.
  last_verified: '2026-09-24'
