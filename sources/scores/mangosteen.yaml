capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Thai pretraining text, bounded by the size cap
  value: 'About 47.4 billion Thai tokens: 45.9 billion of filtered Common Crawl and FineWeb2 text and 1.5 billion
    from curated non-web sources, documented in a paper and two cards, and used to train WangchanLION v3. Thai has
    the reference resource profile, so ten billion tokens is the size cap''s step to 3 and a hundred billion the
    step to 4.'
  confidence: medium
  note: 'Mangosteen is the largest open Thai pretraining corpus here, several times the Thai share of SEA-PILE,
    it is documented in a paper that releases its cleaning pipeline, and WangchanLION v3 was trained on it. Its
    size keeps it at 3: Thai is measured on the same yardstick as English, and forty-seven billion tokens is well
    short of the hundred billion the next step needs.'
  last_verified: '2026-11-17'
  sources:
  - url: https://arxiv.org/abs/2507.14664
    shows: 'Abstract: "We introduce Mangosteen: a 47 billion-token Thai corpus built through a Thai-adapted Dolma
      pipeline"; "an 8B-parameter SEA-LION model continually pre-trained on Mangosteen then surpasses SEA-LION-v3
      and Llama-3.1 by about four points on Thai benchmarks".'
    accessed: '2026-11-17'
    http_status: 200
