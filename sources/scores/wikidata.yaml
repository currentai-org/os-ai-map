capability:
  score: 3
  basis: training_value
  basis_detail: downstream
  value: null
  confidence: medium
  note: Google's KELM work turned the whole English Wikidata graph into natural text and showed that adding it
    to a retrieval model's corpus improved open-domain question answering and the LAMA knowledge probe.
    KEPLER built its Wikidata5M pretraining set from it. Those gains are for knowledge-intensive tasks rather
    than general pretraining, and no major open pretraining mix lists Wikidata as a component.
  last_verified: '2026-11-13'
  sources:
  - url: https://arxiv.org/abs/2010.12688
    shows: 'KELM abstract: "we verbalize the entire English Wikidata KG" and augmenting a retrieval language
      model''s corpus with it gives "significant improvements" on open domain QA and the LAMA probe'
    accessed: '2026-11-13'
    http_status: 200
