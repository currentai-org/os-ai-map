adoption:
  level: 5
  reach: '>10M users'
  signal_type: active_users
  banded_quantity: wikidata.org monthly unique devices (16.0M, October 2026), Wikimedia's proxy for users,
    not a count of dump downloads or query-service clients
  confidence: medium
  note: Adoption is read from Wikimedia's count of unique devices visiting wikidata.org each month, which
    the Foundation uses as its proxy for users. It counts people browsing the knowledge base, not the
    developers and model builders who take the weekly dumps or query it by machine, since neither the dump
    server nor the query service publishes a usage count. Even the cookie-only part of the estimate, which
    leaves out one-time visitors, clears a million devices.
  last_verified: '2026-11-13'
  sources:
  - url: https://wikimedia.org/api/rest_v1/metrics/unique-devices/www.wikidata.org/all-sites/monthly/20260901/20261031
    shows: 'Wikimedia Analytics API: 17,205,785 unique devices for wikidata.org in September 2026 and
      15,978,531 in October 2026, of which 7,613,207 were counted by cookie alone'
    accessed: '2026-11-13'
    http_status: 200
    content_sha256: 48a4d68efd2c6c6502098be68fd285b434511fd48ccba79f69688292a0f48a81
