  score: 1
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: catalogue of Arabic NLP and speech datasets with more than 25 metadata attributes each (dialect, domain,
    source, form, annotation style, license, link); entries submitted through a form and added by maintainers; each
    entry links to where its dataset is hosted; a web service serves the catalogue
  confidence: medium
  relative_to: uci-ml-repository
  relation: one_below
  note: Masader describes Arabic text and speech datasets in detail, from dialect and domain to license,
    and links each one to where its publisher hosts it. It stores none of the data, while the UCI repository
    hosts the datasets donated to it and serves them by ID.
  last_verified: '2026-10-07'
