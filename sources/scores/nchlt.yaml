capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for South African annotated text
  value: The Hugging Face entry loads the expert-annotated NCHLT named-entity corpora for nine South African
    languages, cited to an LREC paper with an empty card, and dsfsi/PuoBERTa is listed as trained on it.
  confidence: medium
  note: The NCHLT corpora are an established resource for South African languages, described in an LREC paper,
    and PuoBERTa lists them among its training data. The Hugging Face entry exposes only the named-entity subset
    through a loader with an empty card, so it offers far less text than WURA, a documented African web corpus
    that trained the AfriTeVa V2 models.
  relative_to: wura
  relation: two_below
  last_verified: '2026-09-24'
