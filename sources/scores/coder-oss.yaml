capability:
  score: 3
  basis: feature_matrix
  value: isolation:workspace-level (Terraform-provisioned VMs/containers/k8s pods on user infra) - depends
    on the backing infra template, not a hardened ephemeral microVM sandbox; cold-start:workspace provisioning
    (seconds-minutes), not ms; runtime breadth:any (IaC-defined, full dev environments); persistence:persistent
    long-lived workspaces; scale:org-scale self-hosted
  confidence: medium
  note: Strong as a persistent governed dev-environment platform, but a poor fit for what this category
    asks - safely running arbitrary agent-generated code in an ephemeral sandbox. Isolation and cold-start
    depend on the Terraform template backing the workspace rather than on a purpose-built sandbox, so 3.
    It belongs more with dev environments than with the agent sandboxes around it. Coder Agents runs the
    agent loop in the control plane so that no model credentials sit in the workspace, but that is governance
    rather than isolation strength or cold-start, so the band holds at 3.
  last_verified: '2026-08-13'
