capability:
  score: 3
  basis: feature_matrix
  value: isolation:workspace-level (Terraform-provisioned VMs/containers/k8s pods on user infra) - depends
    on the backing infra template, not a hardened ephemeral microVM sandbox; cold-start:workspace provisioning
    (seconds-minutes), not ms; runtime breadth:any (IaC-defined, full dev environments); persistence:persistent
    long-lived workspaces; scale:org-scale self-hosted
  confidence: medium
  note: Coder OSS is a persistent, governed dev-environment platform, with each workspace a Terraform-provisioned
    VM, container or Kubernetes pod, so isolation and cold start depend on the backing template rather than
    a purpose-built sandbox. Coder Agents runs the agent loop in the control plane rather than the workspace,
    which is a governance feature rather than an isolation improvement.
  last_verified: '2026-08-13'
