capability:
  score: 4
  basis: feature_matrix
  value: isolation:pluggable secure runtimes - gVisor (runsc), Kata QEMU (full VM), Kata Firecracker (microVM),
    Kata CLH, with runc as fallback, selected once at server level; optional Fast Sandbox backend runs template-backed
    Firecracker microVMs on Kubernetes; cold-start:vendor-published figures only, secure-runtime startup
    overhead ~10-50ms gVisor, ~125ms Kata Firecracker, ~500ms Kata QEMU, and Fast Sandbox serial create
    p50 97ms from single-host runs, no independent measurement; language/runtime breadth:Python/TS/Kotlin-Java/Go/C#
    SDKs, unified sandbox API, MCP server (Claude Code/Cursor); persistence:file ops, pause/resume and snapshots
    (OCI rootfs commit on Kubernetes); scale:K8s
  confidence: medium
  note: 'OpenSandbox ships working, not merely proposed, support for pluggable secure runtimes: gVisor,
    three Kata Containers backends and plain runc as fallback. It does not install those runtimes itself,
    so the microVM tier depends on infrastructure the operator supplies, and its cold-start figures are
    the project''s own planning estimates rather than an independent measurement.'
  last_verified: '2026-09-29'
  sources:
