capability:
  score: 4
  basis: feature_matrix
  value: 'isolation:pluggable secure runtimes - gVisor (runsc), Kata QEMU (full VM), Kata Firecracker
    (microVM), Kata CLH, with runc as fallback, selected once at server level; cold-start:vendor planning
    estimates only (~550ms gVisor, ~625ms Kata/Firecracker), no independent measurement;
    language/runtime breadth:Python/TS/Go/Java SDKs, unified sandbox API, MCP server (Claude Code/Cursor);
    persistence:file ops; scale:K8s'
  confidence: medium
  note: 'OpenSandbox ships working, not merely proposed, support for pluggable secure runtimes: gVisor,
    three Kata Containers backends and plain runc as fallback. It does not install those runtimes itself,
    so the microVM tier depends on infrastructure the operator supplies, and its cold-start figures are
    the project''s own planning estimates rather than an independent measurement.'
  last_verified: '2026-08-14'
  sources:
