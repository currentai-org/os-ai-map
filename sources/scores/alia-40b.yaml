capability:
  score: 2
  basis: feature_matrix
  basis_detail: scale + multilingual pretraining (full benchmarks pending technical report)
  value: 40.4B params, decoder-only, 9.37T pretraining tokens, 35 European languages + 92 programming languages;
    mid-tier and below the 2026 frontier. The card reports 5-shot results for this model alone on BSC's
    own harness (English ARC-Challenge 59.4, ARC-Easy 86.5, PIQA 81.7) and defers comparisons with other
    models to a forthcoming technical report; the Salamandra technical report (arXiv:2502.08489) evaluates
    only an intermediate 40B checkpoint.
  confidence: low
  note: ALIA-40B is a serious 40B multilingual base model, but it is smaller than Apertus-70B and below
    the 2026 frontier on reasoning and knowledge. It targets Iberian and European-language coverage rather
    than state-of-the-art capability.
  sources:
  - url: https://huggingface.co/BSC-LT/ALIA-40b
    shows: '40,433,885,184 total parameters, pre-trained on 9.37 trillion tokens covering 35 European languages
      and 92 programming languages. Evaluation section: results for ALIA-40b alone on BSC''s own lm-evaluation-harness
      tasks, "All results reported below are on a 5-shot setting" (English arc_easy 86.5, arc_challenge
      59.4, openbookqa 38.4, piqa 81.7, social_iqa 53.8), and "A full list of results compared to other
      baselines ... will soon be available in the technical report"; no other model appears in its tables.'
