adoption:
  level: 1
  reach: <10K
  signal_type: usage_volume
  confidence: medium
  note: A publicly funded sovereign model - Spain's national LLM, built by BSC on MareNostrum 5 - with strong
    institutional and policy interest but modest raw volume. The single declared artifact BSC-LT/ALIA-40b
    returns 475 Hugging Face downloads in the trailing 30 days and 88 likes, which bands at level 1 (<10K)
    on the model adoption scale. The niche multilingual focus - Spanish, Spain's co-official languages and
    35 European languages - keeps adoption below Apertus's level. Counted across the wider ALIA Kit (instruct,
    GGUF, Salamandra) the total would be higher, but the base model alone sits in the low band.
  last_verified: '2026-08-13'
