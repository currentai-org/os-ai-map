capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: per-action ALLOW, DENY, REQUIRE_APPROVAL, THROTTLE and ALLOW_WITH_CONSTRAINTS verdicts from the
    Safety Kernel; human approvals bound to the action hash, with a single approver in the unlicensed Community
    tier; SHA-256 hash-chained audit log with optional HMAC; agent identities are an Enterprise entitlement,
    and the Ed25519-signed delegation tokens whose scope can only narrow are issued only between those identities
  confidence: medium
  note: Cordum decides each action against policy before it runs, holds risky actions until a person approves
    that exact action, and chains its audit records so tampering shows. Agent identities need a paid Enterprise
    license, and so does delegation in practice, because its narrowing tokens pass only between those identities.
  relative_to: agent-governance-toolkit
  relation: two_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/cordum-io/cordum/main/README.md
    shows: Policy evaluation "yields ALLOW, DENY, REQUIRE_APPROVAL, THROTTLE or ALLOW_WITH_CONSTRAINTS";
      an approval whose action_hash differs is rejected; "Agent identities, which carry the risk tier that
      agent_risk_tiers rules match, require an Enterprise license."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 9fba7f859d1b5f170fd5e3b1f4fd9928e8b06b8b068c90c0faefd2c7d1f3a78f
  - url: https://raw.githubusercontent.com/cordum-io/cordum/main/core/licensing/tiers.go
    shows: 'The Community tier, which runs without a license file, sets "ApprovalMode: ApprovalModeSingle"
      and "Audit: true"; "AgentIdentity: true" appears only under PlanEnterprise.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 9efd24729ac7b4448f671796ad53159e1034b95eba1235965742228c6f6a8415
  - url: https://raw.githubusercontent.com/cordum-io/cordum/main/core/controlplane/gateway/handlers_agents.go
    shows: Creating, reading, updating and deleting agent identities each first call requireFeatureEntitlement(w,
      agentIdentityFeature, "agent identity requires an Enterprise license").
