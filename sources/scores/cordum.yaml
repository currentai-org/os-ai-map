    http_status: 200
    content_sha256: db6399f0cc0cf03f0f7a8b3062e435126925220c1cb8174c55e187ab6effa638
  - url: https://raw.githubusercontent.com/cordum-io/cordum/main/docs/auth/delegation.md
    shows: Delegation tokens "let one agent identity delegate a reduced, time-bounded scope to another agent
      identity"; issuance and verification "enforce scope monotonicity" and reject chains deeper than CORDUM_DELEGATION_MAX_DEPTH.
    accessed: '2026-11-20'
    http_status: 200
