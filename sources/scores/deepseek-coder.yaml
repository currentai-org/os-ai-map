  note: DeepSeek releases the inference code under MIT, and the weights download without a gate, but the
    DeepSeek Model License's Attachment A bars military, illegal and discriminatory use and binds derivatives
    to the same restriction. That limits conduct rather than commerce, keeping the model at open weights
    rather than restricted, though the unpublished training data keeps it short of fully open.
