capability:
  score: 3
  basis: feature_matrix
  value: a curated tool surface over databases - prebuilt schema-exploration and SQL tools for Google Cloud and
    other engines, plus custom tools defined as fixed queries, semantic search or NL2SQL in tools.yaml - against
    connection settings and credentials the caller supplies, on a server the caller runs
  confidence: medium
  note: MCP Toolbox exposes one kind of system, a database, through prebuilt or custom tools, and the connection
    details and credentials are the caller's to set in environment variables or tools.yaml. It hosts nothing and
    holds no logins on anyone's behalf, which keeps it level with Postgres MCP Pro however many engines it can reach.
  relative_to: postgres-mcp
  relation: at
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/crystaldba/postgres-mcp/main/README.md
      shows: The Postgres MCP Pro README still passes DATABASE_URI to the server as an environment variable the
        caller sets, with "--access-mode=unrestricted" or restricted governing what it may execute.
