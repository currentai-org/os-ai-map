  note: Arduino publishes the UNO Q's schematics and gerbers under CC-BY-SA 4.0, and the App Lab and App
    Bricks source that runs on it under GPL-3.0 and MPL-2.0. The Dragonwing QRB2210's boot firmware stays
    closed, but its GPU drivers are open source, so the only proprietary piece is the boot chain rather
    than the software stack that runs on the board.
