capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for South African speech
  value: About 3,000 hours of scripted and unscripted speech recorded and transcribed by people in seven South
    African languages, documented in a paper and card, with Whisper and w2v-BERT recognizers trained on it.
  confidence: medium
  note: ZA African Next Voices gives seven South African languages scripted and unscripted speech transcribed
    by people, five hundred hours each for five of them, with a paper on its design, and its publishers' Whisper
    models and a community isiZulu recognizer are trained on it. Its roughly three thousand hours are more
    than any other open set here offers these languages, yet a small share of the hundreds of thousands behind
    the largest English speech corpora.
  last_verified: '2026-09-24'
