capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Khmer speech
  value: About 728 hours of Khmer read from written prompts by 12 native speakers with curated transcripts,
    documented in a detailed card without a paper, with a community Qwen3-ASR Khmer recognizer whose card names
    it as training data.
  confidence: medium
  note: The corpus dwarfs OpenSLR's earlier Khmer set of under four hours, pairing prompted readings with curated
    transcripts, and a community Qwen recognizer names it as its training data. Its seven hundred hours from
    twelve speakers are judged against what Khmer has, an official language with over a million speakers and
    a small written web, and on that scale it sits one step below the larger Kazakh Speech Corpus 2.
  relative_to: kazakh-speech-corpus-2
  relation: one_below
  last_verified: '2026-11-11'
