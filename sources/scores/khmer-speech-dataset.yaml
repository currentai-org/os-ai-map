capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Khmer speech
  value: About 728 hours of Khmer read from written prompts by 12 native speakers with curated transcripts,
    documented in a detailed card without a paper, with a community Qwen3-ASR Khmer recognizer whose card names
    it as training data.
  confidence: medium
  note: The corpus dwarfs OpenSLR's earlier Khmer speech-text set of under four hours, pairing prompted readings
    with curated transcripts, and community Khmer recognizers are trained on it, one of them naming it as its
    training data. At about seven hundred hours from twelve speakers reading prepared sentences it is small
    beside English speech corpora of hundreds of thousands of hours. Its band is measured against what Khmer
    has, an official language with more than a million speakers and a small written web, and on that yardstick
    it sits one below the larger Kazakh Speech Corpus 2.
  relative_to: kazakh-speech-corpus-2
  relation: one_below
  last_verified: '2026-11-11'
