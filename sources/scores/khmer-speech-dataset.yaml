capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Khmer speech
  value: About 728 hours of Khmer read from written prompts by 12 native speakers with curated transcripts,
    documented in a detailed card without a paper, with community Qwen3-ASR and Whisper Khmer models trained
    on it.
  confidence: medium
  note: At about 728 hours, the corpus dwarfs the only earlier Khmer speech-text set its card names, OpenSLR
    42 with under four hours, and community Khmer recognizers are trained on it. All of it comes from twelve
    speakers reading prepared sentences, unlike IndicVoices, whose spontaneous speech comes from tens of thousands
    of speakers.
  relative_to: indicvoices
  relation: one_below
  last_verified: '2026-09-24'
