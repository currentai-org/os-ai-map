    wind-down; no FP8/FP4 or newer-method additions; behind actively-developed peers and the Megatron-LM
    anchor.'
  confidence: medium
  note: The feature set -- SFT, knowledge distillation, DPO, PPO and GRPO, quantization-aware training,
    FSDP2, scaling from a single device through multi-device to multi-node, and integrations with the Hugging
    Face Hub and Weights & Biases -- has not changed since development wound down, and no newer method or
    precision mode such as FP8 or FP4 has been added. Memory efficiency remains its focus. That leaves it
    competent but behind actively developed peers and well behind Megatron-LM, which is what the middle
    band reflects.
