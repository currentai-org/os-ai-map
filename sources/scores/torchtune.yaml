capability:
  score: 3
  basis: feature_matrix
  value: 'Methods: SFT, knowledge distillation, DPO/PPO/GRPO, QAT; parallelism: single-device, multi-device,
    multi-node, FSDP2; memory-efficiency focus; integrations (HF Hub, W&B). Capability frozen at 2025
    wind-down; no FP8/FP4 or newer-method additions; behind actively-developed peers and the Megatron-LM
    anchor.'
  confidence: medium
  note: torchtune provides recipes for supervised fine-tuning, knowledge distillation, DPO, PPO, GRPO and
    quantization-aware training, with FSDP2 for multi-device and multi-node training. It documents no FP8
    or FP4 training and is no longer maintained, which leaves it behind actively developed libraries such
    as TRL and well behind Megatron-LM.
  last_verified: '2026-09-28'
