capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for Southern Quechua pretraining text
  value: The corpus holds Southern Quechua text gathered mainly in southern Peru plus the Quechua parts of
    Wikipedia and OSCAR, about 373 MB, documented in a DeepLo paper with a mostly template card, and used only
    for its authors' own QuBERT and RoBERTa models.
  confidence: medium
  note: The corpus gives Southern Quechua text gathered mainly in southern Peru plus the Quechua parts of Wikipedia
    and OSCAR, and its authors trained QuBERT and a Quechua RoBERTa on it, though no other model uses it and
    its card leaves sources largely undescribed. At under a hundred million tokens it is tiny beside English
    pretraining corpora of trillions of tokens, and a pooled multilingual corpus such as Glot's gathers more.
  relative_to: glot500-c
  relation: two_below
  last_verified: '2026-09-24'
  sources:
