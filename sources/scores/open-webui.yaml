  components:
    license:
    - name: Open-WebUI-License
      detail: 'BSD-3-Clause-based + non-OSI branding clause: branding may not be removed above 50 end-users/30d
        without enterprise license or written permission'
    source:
      value: public
    enterprise-tier:
      value: commercial license to remove branding
  confidence: high
  note: A branding-retention clause caps free removal of Open WebUI's branding at 50 end-users per 30 days,
    above which an enterprise license or written permission is required, so the license fails the Open Source
    Definition despite its BSD-3-Clause origins. Open WebUI is widely marketed as open source, but that
    use restriction makes it source-available rather than open source.
