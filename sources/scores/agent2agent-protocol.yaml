  note: Adoption is measured as combined downloads of the protocol's two most-installed reference SDKs,
    `a2a-sdk` on PyPI and `@a2a-js/sdk` on npm, the channels an A2A implementation installs. The protocol
    has no package of its own. The Linux Foundation's count of supporting organizations and the cloud
    integrations it names corroborate a broad footprint.
