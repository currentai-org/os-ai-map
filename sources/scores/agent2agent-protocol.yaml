adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: supporting organizations (150+) and shipped integrations, a breadth count rather than
    a usage figure
  note: For a protocol, adoption is measured as breadth rather than as a usage count, because no per-user
    figure is published anywhere. The Linux Foundation reports supporting organizations grown from more
    than 50 to over 150, including AWS, Cisco, Google, IBM, Microsoft, Salesforce, SAP and ServiceNow, with
    Azure AI Foundry, Copilot Studio and Amazon Bedrock AgentCore Runtime integrating the protocol, in-production
    use at Microsoft, AWS, Salesforce, SAP and ServiceNow, embedding into Google Cloud, and five production-ready
    SDK languages. Breadth across the three major clouds plus enterprise production puts effective downstream
    reach in the 1-10M band, though this is a count of organizational support rather than a measured per-user
    figure.
  last_verified: '2026-08-13'
