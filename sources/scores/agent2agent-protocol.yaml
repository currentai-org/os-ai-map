capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: 'A2A is a wire protocol for agent interoperability, and a protocol is not benchmarked, so capability
    is deliberately left unscored: openness and adoption-breadth carry the whole signal. The repository
    publishes a specification, architecture decision records, governance documents and reference SDKs, and
    no benchmark, leaderboard or measured performance number for the protocol appears there or anywhere
    the project points - what was looked for and not found is a published score of any kind ranking A2A
    against a peer. The blank is a policy rather than a gap waiting to be filled, and no score is invented
    to close it. The reason is that neither capability question one might ask of a protocol survives scrutiny.
    Breadth of implementation is adoption wearing a capability label, and this record''s adoption is already
    banded on exactly that - more than 150 supporting organizations by the Linux Foundation''s count - so
    scoring breadth here would let one instrument vote twice. Spec maturity is genuinely independent of
    uptake, but no rubric on this map has a ladder for it, and with only two protocols on the map there
    is nothing to anchor a comparison against. One cost comes with the blank and is stated rather than papered
    over: with no capability score the maturity calculation falls through to adoption alone, so this record
    computes its maturity from a single axis. The Model Context Protocol has the same shape and carries
    the same policy.'
  last_verified: '2026-08-14'
  sources:
  - url: https://github.com/a2aproject/A2A
    shows: Repo page - specification, ADRs, governance and reference SDK links. Described as an open protocol
      and spec, not a runtime. No benchmark result, leaderboard entry or performance figure published.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 1165fc1e34756203cf564d09b228b277c3efedb7a0a62a30fac58cb0067a6bd1
