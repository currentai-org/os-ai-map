capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: 'A2A is a wire protocol for agent interoperability; per the recipe, capability is not a meaningful
    axis for a protocol. The signal lives in openness and adoption-breadth. Abstention re-confirmed 2026-08-13:
    the repository still publishes a specification, ADRs, governance documents and reference SDKs, and no
    benchmark, leaderboard or measured performance number for the protocol appears on it or anywhere the
    project points. What was looked for and not found is a published score of any kind that ranks A2A against
    a peer. SEE ALSO the load-bearing-null note on model-context-protocol: a null capability does not abstain
    the way a null adoption does, so this record also computes its maturity from adoption alone. The same
    ruling should cover both.

    DECLARED 2026-08-14, on the owner''s ruling, and it does cover both. GRADING POLICY - A WIRE PROTOCOL
    IS GRADED ON OPENNESS AND ADOPTION ONLY, AND ITS CAPABILITY IS NULL BY POLICY RATHER THAN BY FALLBACK.
    No score is invented. The reasoning is recorded in full on model-context-protocol and in
    docs/guides/gap-analysis.md, "The two nulls are not symmetric": implementation breadth is adoption
    wearing a capability label, and this record''s adoption is already banded on exactly that - the count
    of supporting organizations, 150+ per the Linux Foundation - so scoring breadth here would let one
    instrument vote twice. The known cost stands and is stated rather than fixed here: serialize.py falls
    through to adoption alone for a null capability, so this record computes its maturity from one axis.
    Re-read 2026-08-14 and the premise holds. The repository still publishes a specification, ADRs,
    governance documents and reference SDKs, and no benchmark, leaderboard or measured performance figure
    for the protocol appears on it or anywhere the project points.'
  last_verified: '2026-08-14'
  sources:
  - url: https://github.com/a2aproject/A2A
    shows: Repo page - specification, ADRs, governance and reference SDK links. Described as an open protocol
