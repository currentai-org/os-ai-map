adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: supporting organizations (150+) and shipped integrations, a breadth count rather than a
    usage figure
  note: Because A2A is a protocol, adoption here is measured as organizational breadth rather than user
    volume, since no usage figure is published. The Linux Foundation reports growth to more than 150 supporting
    organizations, including AWS, Cisco, Google, IBM, Microsoft, Salesforce, SAP and ServiceNow, plus production
    integrations in Azure AI Foundry, Copilot Studio and Amazon Bedrock AgentCore Runtime.
