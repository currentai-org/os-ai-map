capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for Danish pretraining text
  value: About 9.8 billion tokens in 7.4 million documents of openly licensed Danish text, documented in a
    paper and a datasheet per source, and used to train Danish Foundation Models' open 7B decoder and Gemma
    3 comparison models.
  confidence: medium
  note: Danish Dynaword gathers openly licensed Danish text with a paper and a datasheet for each source, takes
    new sources through a tested submission process, and trained Danish Foundation Models' open seven-billion-parameter
    decoder and a set of Gemma comparison models. At just under ten billion tokens it holds over four times
    as much as comparable openly licensed Danish releases, but remains small beside English pretraining corpora
    that run to trillions.
  last_verified: '2026-09-24'
