capability:
  score: 3
  basis: feature_matrix
  basis_detail: documented catalog breadth and plan limits; no independent throughput measurement found; placed
    against fireworks-inference
  value: One API over a library the homepage gives as 40,000+ models (30,000+ on the about page), spanning frontier
    open models such as DeepSeek V4 Pro, GLM 5.3, Kimi K3 and gpt-oss-120b and many community fine-tunes. Flat monthly
    plans with unlimited tokens; the $25 chat plan allows context up to 32K, and the plan listing also offers context
    up to 256K.
  relative_to: fireworks-inference
  relation: one_below
  confidence: low
  note: Featherless offers an unusually wide library, including niche community fine-tunes, but no independent benchmark
    of its speed is published. Its cheapest plan also caps context at 32K tokens, where Fireworks serves long-context
    models at measured speeds.
  comparison:
    last_attested: '2026-10-13'
    sources:
