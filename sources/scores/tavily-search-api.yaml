capability:
  score: 4
  basis: feature_matrix
  value: '`POST /search` with `include_raw_content` for the page text behind each result and `include_answer`
    for a generated answer over them, plus extract, crawl, map and research endpoints on the same API'
  confidence: medium
  note: Tavily's search call can return the page text behind each result directly, through include_raw_content,
    and include_answer returns a composed answer in the same response. But nothing in that response attributes
    the answer to the sources beside it, so the answer arrives without citations, which puts it level with
    Firecrawl.
  last_verified: '2026-09-17'
