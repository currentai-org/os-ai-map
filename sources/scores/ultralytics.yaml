capability:
  score: 4
  basis: feature_matrix
  value: one package training and running detection, instance and semantic segmentation, depth estimation, classification,
    pose, oriented boxes and tracking over a zoo of YOLOv8, YOLO11 and YOLO26 checkpoints, plus the open-vocabulary
    YOLO-World and YOLOE detectors and SAM 3 segmentation
  relative_to: google-cloud-vision
  relation: at
  confidence: medium
  note: Ultralytics covers most image-perception tasks from one training and inference interface, with pretrained
    checkpoints for each. Its fixed-class YOLO models need a training run for new object classes, but the same package
    runs the open-vocabulary YOLO-World and YOLOE detectors and SAM 3, which detect or segment what the user names
    in their own images with no training. It does not search for or train a model automatically.
  last_verified: '2026-09-26'
  sources:
  - url: https://docs.ultralytics.com/
    shows: 'Docs landing: "YOLO is a family of real-time computer vision models for object detection, instance segmentation,
      semantic segmentation, depth estimation, classification, pose estimation, oriented bounding boxes, and tracking,
      available through one Python package and CLI."'
