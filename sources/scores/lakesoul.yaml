capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: ACID transactions, upsert and schema evolution over a Rust-native metadata and file-IO core with
    automated disaggregated multi-level compaction and RBAC, read and written by six distributed compute engines,
    with a vector-capable file format.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: LakeSoul is a distributed lakehouse with its own metadata management, transaction log and compaction
    service, ACID transactions and schema evolution, shared across six compute engines. Its file format
    supports vector retrieval only as a file-format capability, not as a ranking or embedding model running
    inside a serving path, which is what Vespa provides and what keeps LakeSoul one step below it.
  comparison:
    last_attested: '2026-09-02'
    sources:
