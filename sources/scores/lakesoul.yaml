capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: ACID transactions, upsert and schema evolution over a Rust-native metadata and file-IO core with
    automated disaggregated multi-level compaction and RBAC, read and written by six distributed compute engines,
    with a vector-capable file format.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Banded on the category feature matrix as complete retrieval system, distributed or cluster-capable. Placed
    one band below the vespa anchor, alongside juicefs - LakeSoul owns its own metadata management, transaction
    log and compaction service rather than versioning storage it does not provide, which distinguishes it from
    lakefs and dvc at the band below. It supports vector retrieval as a file-format capability rather than hosting
    a ranking or embedding model in a serving path, so it does not reach the top rung.
  comparison:
    last_attested: '2026-09-02'
    sources:
