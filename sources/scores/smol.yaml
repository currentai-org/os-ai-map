capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for low-resource translation data
  value: 'SMOL''s paper counts 6.1 million translated tokens in 124 languages at release: about 76,000 sentence
    pairs in SmolSent and about 27,000 translated documents in SmolDoc, with no total in sentence pairs. The
    card now lists 221 languages and an April 2026 expansion without new totals. It is documented in two papers,
    with no named model or benchmark found beyond its own paper''s experiments.'
  confidence: medium
  note: SMOL gives a long list of low-resource languages professionally translated sentences and documents,
    documented in two papers, though no model or benchmark beyond its own experiments is known to be built
    on it. Its papers and card count tokens, sentences and documents but never sentence pairs, and what they
    do count is minute beside the billions of pairs in the largest parallel collections and smaller than the
    IIT Bombay English-Hindi corpus for a single language pair.
  relative_to: iitb-english-hindi
  relation: one_below
  last_verified: '2026-09-24'
