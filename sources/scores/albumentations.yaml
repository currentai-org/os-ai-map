  value: more than 70 pixel-level and spatial augmentations applied jointly to images, masks, bounding boxes and
    keypoints and composed into pipelines; fits no model
  relative_to: opencv
  relation: at
  confidence: high
  note: Albumentations supplies the augmentation step of a vision training pipeline and fits no model of its own,
    as OpenCV supplies image operations and leaves its learners to a separate contrib repository. Training is left
    to the framework that consumes its output.
