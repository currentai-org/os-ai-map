  note: StarCoder2 publishes its weights, its full training corpus (The Stack v2) and the self-alignment
    pipeline behind the instruct checkpoint. Its BigCode-OpenRAIL-M license restricts what the model can
    be used for rather than who can use it commercially, and because that license is not OSI-approved, it
    stays at open weights rather than a fully open release.
