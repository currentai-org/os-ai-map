  confidence: high
  note: 'The most open artifact in this category by evidence: weights, the full training corpus (The Stack
    v2) and the self-align pipeline are all published. Held to 4 rather than 5 because BigCode-OpenRAIL-M
    is not OSI-approved - its behavioral-use clauses discriminate against fields of endeavor, which the
    OSD forbids - and rule 5 of the ladder reserves the top score for an OSI license. The class is open_weights
    rather than open_source because 4/open_source is a pair this ladder cannot emit. Issue #117 tiers RAIL
    as a conduct restriction, which is what keeps a fully-open pipeline off the 2/restricted floor it would
    otherwise have hit on the license alone.'
