    license:
    - name: BigCode-OpenRAIL-M
      detail: open but RAIL behavioral-use restrictions, not OSI
  confidence: high
  note: 'The most open artifact in this category by evidence: the weights, the full training corpus (The
    Stack v2) and the self-align pipeline are all published. Held to 4 rather than 5 because BigCode-OpenRAIL-M
    is not OSI-approved - its behavioral-use clauses discriminate against fields of endeavor, which the
    Open Source Definition forbids - and the top score is reserved for an OSI license. The class reads open
    weights rather than open source because a 4 cannot be paired with the open-source class. Those RAIL
    clauses restrict conduct rather than commerce, which is what keeps a fully open pipeline off the restricted
    floor it would otherwise hit on the license alone.'
