product: starcoder2
openness:
  score: 4
  class: open_weights
  components:
    weights:
      value: open
    data:
      value: open
      detail: self-oss-instruct-sc2-exec-filter-50k + 7 documented intermediate datasets
    code:
      value: open
      detail: starcoder2-self-align pipeline on GitHub
    base-data:
      value: open
      detail: The Stack v2
    license:
    - name: BigCode-OpenRAIL-M
      detail: open but RAIL behavioral-use restrictions, not OSI
  confidence: high
  note: StarCoder2 publishes its weights, its full training corpus (The Stack v2) and the self-alignment
    pipeline behind the instruct checkpoint, more than most comparable models disclose. Its BigCode-OpenRAIL-M
    license restricts what the model can be used for rather than who can use it commercially, and because
    that license is not OSI-approved, it stays at open weights rather than a fully open release.
  raw: weights:open;data:open(self-oss-instruct-sc2-exec-filter-50k + 7 documented intermediate datasets);code:open(starcoder2-self-align
