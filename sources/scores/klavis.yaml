capability:
  score: 5
  basis: feature_matrix
  value: a hosted catalogue of more than a hundred prebuilt MCP servers with OAuth performed for the end user
    and the resulting grant held by the platform, plus Strata, a self-hostable aggregator exposing many tools
    through one server
  confidence: medium
  relative_to: composio
  relation: at
  note: 'Many systems, credentials the platform obtains and holds, execution it hosts: band 5. The flow is
    the platform''s rather than the caller''s - the create-server call returns `oauthUrls` for the user to
    complete and Klavis keeps the grant, which is why its own documentation warns not to share the resulting
    token. The open-source half, Strata run locally, has no OAuth step at all; the band reads the product as
    sold, and the record says which half does what.'
  last_verified: '2026-09-17'
  sources:
  - url: https://www.klavis.ai/docs/quickstart.md
    shows: 'The hosted quickstart: the create-server response carries "oauthUrls: Authorization links for services
      that require OAuth authentication" and "apiKeyUrls", and the worked code opens them - `webbrowser.open(oauth_url)`
      then "Press Enter after completing {server_name} OAuth authorization". It warns "DO NOT share your access
      token or direct URL publicly as they provide access to your connected accounts and data". The Open Source
      tab covers local Strata - `strata add`, stdio mode - with no OAuth step.'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: c642566be6894fc9f1f845b6055e6e4ceb111ad5fcdacbcb28df35a222ba2c26
