  confidence: high
  note: 'Apache-2.0 over real, useful software - the MCP servers and the Strata aggregator - with the part
    the product is SOLD on kept back. What makes Klavis a platform rather than a collection of servers is that
    it performs OAuth for the end user and holds the grant, and its own documentation puts that on the hosted
    side: the Open Source tab covers local Strata with no authentication step at all, while the UI and API
    paths return `oauthUrls` the platform mints. That is functionality withheld from the published tree rather
    than a managed convenience beside a complete core, which is the litellm shape and lands at 4/open_core.
    An earlier draft of this record scored 5 by reading the published servers as the whole product, which left
    its openness and its capability describing two different things.'
