  confidence: high
  note: 'Klavis publishes real, useful software under Apache-2.0 - the MCP servers and the Strata aggregator
    - but withholds the part the product is sold on: OAuth performed for the end user, with the resulting
    grant held and brokered by the platform. The open-source path, local Strata, documents no authentication
    step at all; that OAuth brokering exists only on the hosted side, per Klavis''s own docs. That gap between
    what ships and what the product does makes this an open-core release rather than a fully open one.'
