    shows: 'The README: "MCP Integrations - 100+ prebuilt integrations out-of-the-box, with OAuth support",
      with a cloud-hosted option at klavis.ai and self-hosting via `ghcr.io/klavis-ai/github-mcp-server` and
      `pipx install strata-mcp`.'
    accessed: '2026-09-17'
