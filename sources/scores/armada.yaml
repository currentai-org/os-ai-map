capability:
  score: 3
  basis: feature_matrix
  value: a queue in front of many Kubernetes clusters; per-queue fair share applied across the fleet; decides
    which cluster a job is sent to; the receiving cluster's scheduler places the pods
  confidence: medium
  relative_to: kubeflow-pipelines
  relation: at
  note: Armada decides which cluster a job goes to and in what order, then leaves pod placement to that
    cluster's own scheduler, the same shape of decision as Kubeflow Pipelines. Reaching across many clusters
    is breadth, not depth, so it does not add the finer-grained placement a deeper scheduler performs.
  last_verified: '2026-09-15'
