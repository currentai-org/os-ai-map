  basis_detail: coverage and downstream use for Arabic pretraining text
  value: ArabicWeb24 holds more than 28 billion tokens of cleaned Arabic text from a custom web crawl, documented
    by a detailed card and blog posts, with no model found beyond its publisher's own ablation models.
  confidence: medium
  note: ArabicWeb24 is a documented Arabic web corpus released with its processing code. No model outside LightOn's
    own ablations is known to be trained on it, unlike 101 Billion Arabic Words, which ModernAraBERT uses,
    or naab for Farsi, a larger documented corpus merged from many sources.
