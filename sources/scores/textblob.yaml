capability:
  score: 2
  basis: feature_matrix
  value: a simplified API over NLTK and pattern for noun phrases, POS tagging, lexicon-based sentiment,
    tokenization, n-grams, inflection, lemmatization, spelling correction and WordNet, with naive Bayes
    and decision-tree text classifiers
  relative_to: nltk
  relation: one_below
  confidence: medium
  note: TextBlob makes a handful of NLTK's tools easy to call and adds two ready text classifiers. It
    is a convenience layer over a narrower slice of what NLTK itself provides, so it sits a step below
    it.
  comparison:
    last_attested: '2026-09-27'
