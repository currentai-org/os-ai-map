capability:
  score: 4
  basis: feature_matrix
  relative_to: vllm
  relation: one_below
  value: TurboMind + PyTorch engines; persistent/continuous batching, blocked KV cache, weight-only +
    kv (AWQ/W4A16) quantization, tensor parallelism, broad LLM + VLM architecture coverage; vendor-reported
    4-bit inference ~2.4x FP16
  confidence: medium
  note: The feature set is the TurboMind and PyTorch engines, persistent and continuous batching, a blocked
    KV cache, AWQ/W4A16 weight-only and KV-cache quantization, tensor parallelism, broad LLM and VLM architecture
    coverage, and a vendor-reported 2.4x speedup for 4-bit inference over FP16. It sits one tier below vLLM,
    which holds the top capability score in this category. The README's own claim of up to 1.8x higher request
    throughput than vLLM is a vendor self-benchmark; the placement rests instead on vLLM's independent MLPerf
    submission and its broader architecture coverage.
  last_verified: '2026-08-09'
