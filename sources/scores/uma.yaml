adoption:
  level: 1
  reach: <10K
  signal_type: usage_volume
  confidence: medium
  note: >-
    83 downloads in the trailing 30 days for the declared Hub repository, with manual gating
    suppressing the count. fairchem-core is also declared and draws far more, but it is not
    banded here for a reason rather than by omission: the package is the library that serves
    every fairchem model, so its download population is not UMA's population, and
    docs/reference/adoption.md requires a package to be the product's own primary channel before
    it may band the head product. The Hub repository is UMA's own channel; the gate is what
    suppresses it.
