capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: One model consuming five distinct DFT levels of theory, selected at inference by a task embedding; no documented adaptation path, no generation, one scale.
  confidence: high
  note: One attribute. The five tasks are separate data systems with different functionals and pseudopotentials rather than variables of one, which is what makes this multi-instrument. The publisher's headline claim is that no fine-tuning is needed, and no fine-tuning recipe is documented, so the adaptation attribute is not counted.
  last_verified: '2026-09-10'
  sources:
  - url: https://raw.githubusercontent.com/facebookresearch/fairchem/main/docs/core/uma.md
    shows: States UMA is trained on five different DFT datasets with different levels of theory, learns a per-task embedding, and requires the user to select a task at inference; tabulates the functional and pseudopotentials for each.
    accessed: '2026-09-10'
    http_status: 200
    content_sha256: 072f4d1e77358dfd7ad3e1d5c97318a6b4848c566510c5b5b2db26b09d839c62
