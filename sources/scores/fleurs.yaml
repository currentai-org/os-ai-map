  basis_detail: coverage and downstream use for multilingual speech evaluation
  value: Speech recorded by people reading 2,009 FLORES sentences in 102 languages, about 10 to 12 hours per
    language, documented in its paper, and used in Meta's MMS paper to compare its recognizer against Whisper.
  confidence: medium
  note: FLEURS gives 102 languages the same read sentences, so speech recognition, language identification
    and speech translation can be compared across all of them. It is documented in its paper, and Meta's MMS
    work reports its word error rates against Whisper on it.
