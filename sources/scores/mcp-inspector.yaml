capability:
  score: 3
  basis: feature_matrix
  value: 'of the Model Context Protocol, version not stated by the product: the CLIENT role only, exercising
    the full primitive set of a server under test, through three surfaces - a web UI, a scriptable CLI and
    a terminal UI - from one binary'
  confidence: medium
  note: MCP Inspector implements the client role only, exercising a server's full primitive set through
    three surfaces - a web UI, a CLI and a terminal UI - from one binary. What keeps it a step below SDKs
    such as the MCP Python SDK is the missing server role, not any missing feature, and the README does
    not state which specification version it targets.
  last_verified: '2026-09-17'
  sources:
