    shows: 'The README: "A developer tool for inspecting Model Context Protocol (MCP) servers", shipping as
      one package with three client surfaces - a Vite and React web app, "a scriptable command-line client
      for automation, CI, and fast agent feedback loops", and an Ink terminal UI - all run through one `mcp-inspector`
      binary. It inspects servers; it does not implement one.'
