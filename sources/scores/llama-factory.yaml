capability:
  score: 4
  basis: feature_matrix
  relative_to: megatron-lm
  relation: one_below
  value: 'Methods: full FT, LoRA, QLoRA, plus preference/RL tuning; 100+ LLM/VLM architectures; CLI +
    web UI; multimodal (VLM) support. Broad model coverage and a no-code WebUI distinguish it; parallelism
    present but headline scale below Megatron-LM anchor.'
  confidence: medium
  note: Breadth rather than scale. The project describes itself as unified efficient fine-tuning of more
    than 100 LLMs and VLMs, and covers LoRA, QLoRA and full tuning alongside DPO and PPO, multimodal models,
    a command line and the LLaMA Board no-code web UI. It sits one band below Megatron-LM, which demonstrates
    frontier-scale parallelism -- a 462B-parameter model across 6,144 H100 GPUs -- that LLaMA-Factory does
    not claim.
  last_verified: '2026-08-09'
  sources:
  - url: https://github.com/hiyouga/LLaMA-Factory
    shows: '"Unified Efficient Fine-Tuning of 100+ LLMs"; README lists LoRA, QLoRA, full-tuning, DPO and
      PPO, multimodal support and the "LLaMA Board" web UI'
    accessed: '2026-08-09'
    http_status: 200
