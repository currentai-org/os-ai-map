adoption:
  level: 2
  reach: 10K-100K
  signal_type: usage_volume
  confidence: medium
  note: 'PyPI downloads of the llamafactory package spiked and then returned to their earlier level rather
    than collapsing: 14,311 in February, 27,761 in March and 30,043 in April, then 233,960 in May and 779,461
    in June, falling back to 100,640 in July and 21,867 over the trailing 30 days. Steady state on either
    side of the spike is 20-30K a month, which puts reach in the 10K-100K band. Stars and forks kept growing
    throughout, and the project stands at 73,939 stars, so this is a healthy project with modest package
    installs rather than a fading one. One undercount is known but cannot be quantified: the project is
    commonly run from a git clone and its web UI rather than installed from PyPI, and GitHub releases capture
    almost none of that either, at 5,242 asset downloads across 30 releases. No available signal measures
    the clone channel.'
  last_verified: '2026-08-09'
