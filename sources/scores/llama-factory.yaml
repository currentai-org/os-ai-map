capability:
  score: 4
  basis: feature_matrix
  relative_to: megatron-lm
  relation: one_below
  value: 'Methods: full FT, LoRA, QLoRA, plus preference/RL tuning; 100+ LLM/VLM architectures; CLI +
    web UI; multimodal (VLM) support. Broad model coverage and a no-code WebUI distinguish it; parallelism
    present but headline scale below Megatron-LM anchor.'
  confidence: medium
  note: 'LlamaFactory''s fine-tuning support spans more than 100 LLM and VLM architectures with LoRA, QLoRA
    and full fine-tuning, DPO and PPO, multimodal models, a CLI and the no-code LLaMA Board web UI: breadth
    rather than scale. Megatron-LM has trained a 462B-parameter model across 6,144 H100 GPUs, a frontier-scale
    parallelism LlamaFactory does not claim.'
  last_verified: '2026-08-09'
  sources:
