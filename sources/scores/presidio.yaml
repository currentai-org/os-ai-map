capability:
  score: 3
  basis: feature_matrix
  basis_detail: personal-data detection and de-identification coverage
  value: Predefined and custom recognizers for personal data built on named-entity recognition, regular expressions, rule-based
    logic and checksums with context, in multiple languages; connectors for outside PII models including transformers, GLiNER,
    Azure AI Language and LLM-based extraction; de-identification by redaction, masking, replacement, encryption and synthetic
    surrogates; modules for text, images including DICOM, and structured data.
  relative_to: llama-guard
  relation: one_below
  confidence: medium
  note: Presidio finds and strips personal information across text, images and tables, with far more control over what counts
    as personal data than a general safety classifier gives. Privacy is the only risk it handles, while Llama Guard screens
    prompts and replies across fourteen hazard categories, so it sits a step below it.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/meta-llama/Llama-Guard-3-8B
      shows: 'The peer''s model page still lists hazard categories from "S1: Violent Crimes" to "S14: Code Interpreter Abuse",
        says Llama Guard 3 classifies "both LLM inputs (prompt classification) and in LLM responses (response classification)",
        "was aligned to safeguard against the MLCommons standardized hazards taxonomy" and "provides content moderation in
        8 languages".'
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 88c4e99105de675650b8a49071b3a13ccdfaa63d9b89b5578a422e02eb2eb7cc
  last_verified: '2026-11-12'
  sources:
