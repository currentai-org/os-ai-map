    shows: The README lists "Predefined or custom PII recognizers leveraging Named Entity Recognition, regular expressions,
      rule based logic and checksum with relevant context in multiple languages", "Options for connecting to external PII
      detection models" and a "Module for redacting PII text in images (standard image types and DICOM medical images)".
    accessed: '2026-11-12'
