capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Content-addressed dataset and model versioning against Git, with pipeline definitions and experiment
    tracking over cloud and network storage such as S3, Azure, Google Cloud and SSH. No storage or index
    of its own.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: DVC versions datasets and models against Git and orchestrates pipelines and experiment tracking
    across many storage backends, but it stores nothing and serves no queries itself. That keeps it two
    steps below Vespa, a complete distributed retrieval system.
  last_verified: '2026-09-30'
