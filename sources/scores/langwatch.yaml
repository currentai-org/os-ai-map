  note: 'An explicit open core: an Apache-2.0 platform, MIT SDKs, and an enterprise directory under a commercial
    license. The gating is read directly from the repository and does not rest on LangWatch selling a hosted
    tier. The NOTICE file names the split component by component - "platform/app/ee/ LangWatch Enterprise
    License (platform/app/ee/LICENSE.md)" against MIT for sdks/typescript, sdks/python and mcp/typescript,
    with everything else Apache-2.0. That license says the enterprise directory "implements the enterprise
    capabilities of LangWatch, including single sign-on, SCIM provisioning, audit logging, gateway webhooks,
    licensing, billing, and back-office tooling" and that "each verifies a license at runtime before it
    can be used". A runtime license check on shipped features answers this dimension directly. The enterprise
    license now also names governance, managed providers, event sourcing and webhooks alongside the SCIM,
    audit-log and billing modules.'
