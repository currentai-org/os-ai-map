adoption:
  level: 2
  reach: 1K-10K stars
  signal_type: stars_fallback
  confidence: low
  note: 'No download or active-user figure is published for LangWatch, so the only honest signal is GitHub
    stars: 3,486 on the one declared repository, which bands at 1K-10K stars and level 2. Stars are a weaker
    instrument than downloads and cannot carry a product above level 3 on their own, and they have their
    own vocabulary rather than a download range, because a star is not a use. The count is read from the
    repository API and recorded with its digest; it drifts between reads, and drift on a star count is expected
    rather than a problem.'
  last_verified: '2026-08-13'
  sources:
