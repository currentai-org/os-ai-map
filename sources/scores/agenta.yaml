  note: 'MIT core with a commercially licensed enterprise half in the same repository, self-hostable either
    way. The gating is read directly from the repository and does not rest on Agenta Cloud existing. The
    root LICENSE splits the repo: "All content that resides under any ''ee/'' directory of this repository,
    if such directories exist, are licensed under the license defined in ''ee/LICENSE''", and everything
    else is MIT Expat. ee/LICENSE is the Agenta Enterprise License, under which the software "may only be
    used in production, if you (and any entity that you represent) have agreed to, and are in compliance
    with, the Agenta Subscription Terms of Service ... and otherwise have a valid Agenta Enterprise License";
    copying and modifying for development and testing is allowed without a subscription, and "it is forbidden
    to copy, merge, publish, distribute, sublicense, and/or sell the Software". The carve-out is real code
    rather than a stub: the api tree splits into api/oss and api/ee, and web/ee and services/ee exist alongside.
    Self-hostable and gated are both true of the same repository - the MIT half genuinely runs on your own
    hardware, and the enterprise half is the part you may not run in production without paying.'
