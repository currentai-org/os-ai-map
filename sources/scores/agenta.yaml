capability:
  score: 3
  basis: feature_matrix
  relative_to: openhands
  relation: two_below
  value: 'Agenta 2.0, an agent workspace - no-code agent and automation building by chat; multiplayer
    workspace with a shared folder per agent; 1000+ integrations via built-ins or MCP servers; reusable
    skills; human approval and per-tool permissions; background agents on a schedule or an event;
    per-agent isolated sandboxes; version history; harness choice across Claude Code, Codex and Pi with
    your own model subscription. Tracing covers every model and tool call, with requests, tokens, latency
    and estimated cost. No evaluator catalogue, no datasets or experiments, and no prompt management.'
  confidence: medium
  note: Agenta covers the workspace basics for building and running agents but has dropped the evaluator
    catalogue, prompt management and observability-standard support it once offered. That leaves it two
    tiers below OpenHands, the category's broadest platform, with no published benchmark to place it more
    precisely.
  last_verified: '2026-08-14'
  sources:
  - url: https://agenta.ai/docs/
    shows: '"Agenta is a workspace where you and your team build agents and automations."; features
      listed are a shared multiplayer workspace, a shared folder per agent, "1000+ Integrations" via
      built-ins or MCP servers, reusable skills, human approval and permissions, background agents on a
      schedule or event, "Tracing and usage. Inspect every model and tool call.", and version history.
      No evaluator catalogue, no prompt-management section, no OTel/OpenLLMetry/OpenInference claim.'
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 5d642d3f7328864865f1909a64ea2e386d38adfa8a14f9138cfc90c672f770bb
