  governing_release: llama-4-scout-maverick
  confidence: high
  note: Llama 4's weights download from Hugging Face once a user accepts Meta's Llama 4 Community License
    and submits a contact form. The license caps commercial use at 700 million monthly active users and
    requires derivatives to carry the Llama name, and its acceptable-use policy withholds the multimodal
    models from individuals and companies based in the EU. That cap still permits commercial use, unlike
    Mistral's Non-Production terms or CC-BY-NC, which forbid it outright.
