  note: 'Llama 4 Maverick is the strongest released member of the family and so sets the score: Artificial
    Analysis puts it at 14 on the v4.1.1 Intelligence Index, ranked #26 of 44 and below the median of 18
    for open-weight non-reasoning models of similar size. Llama 4 Scout scores 10 on the same index, and
    Behemoth was never released. Artificial Analysis has recalibrated the index, so numbers carried over
    from earlier versions of it are not comparable with these; on the current scale the family sits below
    its peer median, which is what a 3 records.'
