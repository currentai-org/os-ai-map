  value: 'Governing release Llama 4 Maverick (17B active, 400B total parameters), the instruct model, which
    has no reasoning mode; read 2026-11-15. Meta has released no newer Llama model and Behemoth is unreleased.
    Artificial Analysis Intelligence Index v5.0.1 scores no Llama model (Maverick, Scout, Llama 3.1 Instruct
    405B and Llama 3.3 Instruct 70B read Unknown). Artificial Analysis evaluations outside the index, non-reasoning
    against non-reasoning: Maverick GPQA Diamond 67.1%, HLE 4.9%, IFBench 43.0%, LiveCodeBench 39.7%, tau2-bench
    17.8% against Phi-4 (phi, 3) 57.5%, 3.8%, 23.5%, 23.1%, 0.0% and Gemma 4 31B (Non-reasoning) (gemma,
    4) 76.3%, 11.8%, 53.5%, tau2-bench 65.5%. Epoch AI runs: Maverick GPQA Diamond 67.0%, OTIS Mock AIME
    20.6%, MATH Level 5 73.0% against Phi-4 56.1%, 13.8%, 64.9%, GPT-4o (2024-11-20) (gpt-4o, 3) 47.9%,
    6.3%, 49.8%, Gemma 4 31B at minimal reasoning 75.8%, 73.3% and Mistral Large 4 (high) (mistral-large,
    4) 88.1%, 98.3%. LMArena text, style control, 2026-11-11: Maverick 1327, GPT-4o (2024-08-06) 1336, Phi-4
    1256, Gemma 4 31B 1452, Mistral Large 4 1420; non-English prompts 1311 against Phi-4 1233, Gemma 4 31B
    1438 and Mistral Large 4 1405. Across training stages only: Olmo 3.1 32B Think (olmo, 4) GPQA Diamond
    59.1%, HLE 6.3%, IFBench 66.0%, LiveCodeBench 69.5%, LMArena 1286. Base checkpoints: Apertus-70B card
    six-task average Llama 4 Scout 67.9 against Apertus-70B 67.5 and SmolLM3-3B 61.6; Olmo 3 32B base card
    Llama 3.1 70B math 62.0, code 36.3, MC STEM 80.1 against Olmo 3 32B 61.6, 40.0, 74.5; Meta''s card puts
    the Maverick base ahead of Scout on MMLU (85.5 vs 79.6), MMLU-Pro (62.9 vs 58.2) and MATH (61.2 vs 50.3).'
  confidence: medium
  note: Llama 4 Maverick is the family's strongest released model; the larger Behemoth was never released,
    and version 5 of Artificial Analysis's Intelligence Index does not score any Llama model. In Artificial
    Analysis's and Epoch AI's own runs of science, math, coding and instruction-following tests, Maverick
    is ahead of Phi-4 and GPT-4o and well behind Gemma 4 31B and Mistral Large 4. LMArena's human-preference
    ratings agree, placing it close to GPT-4o, above Phi-4 and far below the other two.
  last_verified: '2026-11-15'
