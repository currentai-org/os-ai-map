    use still permits it, and the scale places that a step above one that forbids commerce outright - CC-BY-NC
    or Mistral''s Non-Production terms, which sit at 2. Meta''s cap is a bound rather than a prohibition,
    which is why this lands at 3, the same place every other bounded-commercial license on the map lands.'
