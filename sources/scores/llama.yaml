  basis: benchmark
  basis_detail: Artificial Analysis Intelligence Index
  value: 'Llama 4 Maverick: AA Intelligence Index 14 (v4.1.1), ranked #26/44, ''below average among
    other open weight non-reasoning models of similar size'' (median 18). The strongest released
    member of the tier - Llama 4 Scout scores 10 on the same index, and Behemoth is unreleased.'
  confidence: medium
  note: >-
    MAX ACROSS THE TIER'S RELEASES, per docs/guides/identity.md. This record previously cited
    Llama 3.1 405B, a mid-2024 release the slug still covers but which is not its best, and it
    cited an index number - 17 - that no longer exists on Artificial Analysis's scale: the index
    was recalibrated, and 14 on v4.1.1 is not a decline from 17 but a different measurement. Both
    faults pointed the same way, and neither was visible from inside the record, since a stale
    number and a live one look alike.
    The SCORE is unchanged at 3, which is the point of re-deriving rather than adjusting: the
    tier's standing against its peers did not move. It was below the peer median before (17
    against 23) and it is below the peer median now (14 against 18), on a comparison set that has
    grown from 43 models to 44.
