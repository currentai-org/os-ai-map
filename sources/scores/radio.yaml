capability:
  score: 4
  basis: feature_matrix
  value: image-level and dense features distilled from SigLIP2, DINOv3 and SAM3, with adaptors that reproduce each teacher,
    including SigLIP2 text encoding for zero-shot classification on labels the user writes (83.09% ImageNet zero-shot
    top-1 for C-RADIOv4-H)
  relative_to: dino
  relation: at
  confidence: medium
  note: Like DINOv3, C-RADIO is mainly a backbone that other models build on, and its SigLIP2 adaptor classifies images
    against whatever labels the user types with no training. Dense tasks such as segmentation still need a trained head.
  comparison:
    last_attested: '2026-11-12'
