      value: hosted Otari.ai platform on the same core
  confidence: high
  note: 'An Apache-2.0 self-hostable gateway (github.com/mozilla-ai/otari) with a hosted Otari.ai platform
    running on the same core. Reading it as open core by analogy with LiteLLM does not hold: LiteLLM''s
    open-core status rests on a separately licensed enterprise directory inside its repository, and Otari
    has nothing of the kind. What it has is a published Apache-2.0 core, self-hosting via Docker Compose,
    and a hosted platform on that same core - hosting convenience is not gating, and a hosted platform is
    not on its own evidence of a commercial tier. The README ecosystem table says as much: Otari is the
    proxy server otari.ai deploys, and it can be run standalone or connected to the platform.'
