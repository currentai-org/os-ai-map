capability:
  score: 4
  basis: feature_matrix
  value: 40 TOPS INT4 / 20 TOPS INT8; runs LLMs & VLMs via direct DDR interface
  confidence: high
  note: The DDR interface lets the Hailo-10H run LLMs, VLMs and Stable Diffusion locally, confirmed independently
    by both AAEON/UP and Geniatech since hailo.ai itself is unfetchable. That puts it a step above the Hailo-8,
    which is CNN/vision-only and bounded by on-die memory.
  last_verified: '2026-08-14'
