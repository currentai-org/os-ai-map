capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for an Indic generation benchmark
  value: IndicGenBench holds four generation tasks human-translated from English benchmarks into 29 Indic languages,
    documented in a paper and README, with no use found beyond that paper's model evaluations.
  confidence: medium
  note: IndicGenBench is documented and reaches 29 Indic languages with human translations. No leaderboard
    or model report built on it outside its own paper was found, whereas IndicXTREME was released with the
    IndicBERT v2 models it evaluates.
  relative_to: indicxtreme
  relation: one_below
  last_verified: '2026-09-24'
  sources:
  - url: https://arxiv.org/abs/2404.16816
    shows: 'Abstract: "the largest benchmark for evaluating LLMs on user-facing generation tasks across a diverse
      set 29 of Indic languages covering 13 scripts".'
    accessed: '2026-09-24'
    http_status: 200
    content_sha256: 979f9f83362039e3e0f3ee506579aee534e54722c086553ccf66d257055a37b4
  - url: https://arxiv.org/pdf/2404.16816
    shows: 'CrossSum-IN: "We sample 700 English article-summary pairs (100 each from train/dev and 500 from test)
      and ask human translators to translate the English summary into the target Indic languages"; "CrossSum
      already contains data for 9 of our 29 target languages; for these languages we sample 100/100/500 examples
      from the original dataset". FLORES-IN: "where the same source English sentences are translated by humans
      into the target 200 languages"; "It contains data in 22 of our 29 target languages; we extend this by
      collecting human translations for the remaining 7 new languages"; "We collect translations for all 997
      dev and 1012 devtest sentences, yielding 2009 sentences per language". XQuAD-IN: "we use the 240 passages
      and 1190 QA pairs from XQuAD as our test set"; "We additionally selected 20 passages and 100 QA pairs from
      the original SQuAD v1.1 training and development sets each to create our training and development set";
      "For all the 280 passages and 1390 QA pairs we collect professional human translations in 12 Indic languages".
      XorQA-IN: "we select the 302 Bengali and 237 Telugu examples"; "dev set as our test data"; "to create our
      training (100) and development (500) set"; "We collect data for 28 Indic languages"; "We do not collect
      translations for Nepali." Table 1 gives 14.5k, 29.3k, 14.3k and 15.1k test instances; Table 9 gives each
      task''s languages'
    accessed: '2026-11-03'
    http_status: 200
    content_sha256: dd07c6ffc29ed98d61640395601a2931edb43f051f782549274cbb5a9e41d8d3
  - url: https://raw.githubusercontent.com/google-research-datasets/indic-gen-bench/main/README.md
    shows: '"the ''dev'' and ''test'' split of flores_in corresponds to the ''dev'' and ''devtest'' split of the
      original flores dataset"; "`split`: one of `{train, dev, test}`"'
    accessed: '2026-11-03'
    http_status: 200
    content_sha256: 2b36a3735001317d99551905243bf8b6b1165876f0511c52e34880a7a892bea1
  - url: https://raw.githubusercontent.com/csebuetnlp/CrossSum/main/README.md
    shows: 'the language table''s header row, "Language (ISO 639-1-Code) | am | ar | az | bn | my | zh-CN | zh-TW
      | en | fr | gu | ha | hi | ig | id | ja | rn | ko | ky | mr | np | om | ps | fa | pcm | pt | pa | ru | gd
      | sr | sr | si | so | es | sw | ta | te | th | ti | tr | uk | ur | uz | vi | cy | yo": of IndicGenBench''s
      29 languages, CrossSum has bn, gu, hi, mr, np, ps, pa, ta, te and ur'
