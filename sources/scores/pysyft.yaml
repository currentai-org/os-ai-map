capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: 'Peer-to-peer computation on private data across organizations: data owners approve each collaborator
    and each job, jobs run in sandboxed environments on the owner''s side over a file-based transport (Google
    Drive today), background services handle notifications and auto-approval, and syft-enclave runs jobs
    in Trusted Execution Environments deployed with Docker and Terraform.'
  confidence: medium
  relative_to: flower
  relation: at
  note: 'PySyft runs real computations across organizations without moving data: each data owner approves
    the collaborator and the job, the job runs on the owner''s side, and an enclave package adds TEE execution.
    That is Flower''s rung in this category. Its transport is shared cloud storage rather than a federation
    server, and it documents no aggregation of model updates at scale, mobile reach or HPC launcher.'
  last_verified: '2026-09-27'
  sources:
