capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: 'Peer-to-peer computation on private data across organizations: data owners approve each collaborator
    and each job, jobs run in sandboxed environments on the owner''s side over a file-based transport (Google
    Drive today), background services handle notifications and auto-approval, and syft-enclave runs jobs
    in Trusted Execution Environments deployed with Docker and Terraform.'
  confidence: medium
  relative_to: flower
  relation: at
  note: 'PySyft runs computations across organizations without moving the data: each owner approves the
    collaborator and the job, the job runs on the owner''s side, and an enclave package adds trusted-hardware
    execution. That matches Flower''s reach, though the work travels over shared cloud storage rather than
    through a federation server.'
  last_verified: '2026-09-27'
  sources:
  - url: https://pypi.org/pypi/syft/json
    shows: 'PyPI `syft` 0.10.0 (uploaded 2026-08-26): "PySyft : privacy-preserving data science over file-based
      transports"; "PySyft lets data scientists submit computations which are run by data owners on private
      data"; "Peer-to-peer with explicit auth — Data owners must approve each collaborator before any data
      flows"; "Isolated job execution".'
