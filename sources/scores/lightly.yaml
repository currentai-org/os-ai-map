capability:
  score: 3
  basis: feature_matrix
  value: about 25 self-supervised pretraining methods - MoCo, SimCLR, BYOL, SwaV, SimSiam, Barlow Twins, DINO, DINOv2,
    VICReg, MAE, iBOT, SimMIM, MSN, AIM, LeJEPA and others - plus the LeWM world model, with PyTorch, PyTorch Lightning
    and distributed examples for each
  relative_to: timm
  relation: at
  confidence: medium
  note: LightlySSL is a toolkit of self-supervised training methods with recipes to pretrain and compare backbones,
    as timm is a zoo of architectures with training scripts. It ships no model that predicts on a user's own task
    without training; choosing and running a method is left to the user.
