    and AGPL-3.0 is the tier this records. It then carves out the x-pack directory as Elastic License 2.0 alone,
    and that directory is present in the repository. Functionality withheld from the open terms inside the published
    source is what the ladder calls a gated core, the same shape as litellm's enterprise directory rather than a
    separate hosted service sold beside a complete core.
