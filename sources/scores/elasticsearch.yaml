adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: 77,824 GitHub stars, which lands in the >10K stars band of the stars scale, level 3. The `elasticsearch`
    package on PyPI is the Python client (elasticsearch-py), not the server, so its 52.8M monthly downloads measure
    client installs and cannot be attributed to this product. Elastic publishes no server deployment count, so the
    stars scale applies and caps the band at 3 despite the size of the install base.
