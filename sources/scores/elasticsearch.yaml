capability:
  score: 5
  basis: feature_matrix
  basis_detail: 'category feature matrix: distributed retrieval platform with ranking and inference'
  value: Full-text, dense-vector, sparse and hybrid retrieval, and an in-tree inference and machine-learning
    stack that hosts models and evaluates reranking inside the query path, over a sharded and replicated
    cluster.
  relative_to: vespa
  relation: at
  confidence: medium
  note: Elasticsearch hosts and evaluates its own ranking and embedding models inside the serving path through
    its in-tree inference and ml plugins, as Vespa does. That sets it apart from vector databases, which
    fuse or filter retrieval scores but do not host a model themselves.
  last_verified: '2026-09-30'
