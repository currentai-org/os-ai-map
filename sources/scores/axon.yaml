capability:
  score: 2
  basis: feature_matrix
  relative_to: langfuse
  relation: two_below
  value: 'Has: local OTLP trace ingestion, real-time dashboard with transcript/waterfall/tree/raw span
    views, SQLite storage. No prompt management, no evaluation, no LLM-as-judge, no datasets, no cost
    tracking, no framework integrations beyond ingesting LangChain/OpenLLMetry OTLP output.'
  confidence: high
  note: 'A trace viewer and nothing more: a single-purpose local dashboard for inspecting OTLP spans
    already emitted by another instrumentation library. It has no evaluation, prompt management, dataset
    or cost-tracking surface at all, which is narrower than even the openllmetry/monocle instrumentation
    layers in this category - those at least emit and route traces across many providers, where Axon only
    visualizes what is handed to it. Two rungs below the Langfuse anchor at 4.'
  comparison:
    last_attested: '2026-09-02'
    sources:
