capability:
  score: 5
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: 'GPU and NVSwitch attestation: hardware-signed evidence of the device, firmware and confidential-computing
    mode, verified locally or by NVIDIA''s remote attestation service, with Rego policies over the resulting
    claims.'
  confidence: high
  note: A relying party checks evidence the GPU itself signs, against NVIDIA's certificate chain, so the claim
    about what ran does not depend on trusting the operator. That is the strongest check in this category,
    shared only with the zero-knowledge provers, and the trust it asks for moves to the hardware vendor.
  last_verified: '2026-09-27'
  sources:
  - url: https://raw.githubusercontent.com/NVIDIA/nvtrust/main/guest_tools/attestation_sdk/README.md
    shows: The SDK supports "Local and Remote GPU Attestation" and "Local and Remote NVSwitch Attestation";
      requires an H100 or later GPU that supports Confidential Computing
