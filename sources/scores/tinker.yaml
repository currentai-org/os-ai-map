capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: LoRA adapter training plus sampling, for supervised and reinforcement learning; open-weight
    models from 4B dense to multi-trillion-parameter MoE (Inkling 975B, Kimi-K3.1-Pro 2.8T total parameters,
    Nemotron-3-Ultra 550B); the API exposes gradient, weight-update and sampling calls while Tinker runs
    the work on managed GPU clusters.'
  confidence: medium
  note: 'Tinker runs LoRA training and sampling on open-weight models from 4B dense up to Kimi-K3.1-Pro
    at 2.8 trillion total parameters, with the user''s own code controlling the training loop and Tinker
    scheduling the work across managed GPU clusters. Training uses LoRA adapters: the models page names
    create_lora_training_client as the way to start a run, and the documentation describes no full-parameter
    alternative.'
  last_verified: '2026-11-16'
  sources:
  - url: https://thinkingmachines.ai/tinker/
    shows: The FAQ says "LoRA matches the learning performance of full fine-tuning" and that the API provides
      "simple functions to compute gradients, update the weights, and sample outputs from the trained model".
      The feature list reads "Managed GPU clusters" and "Open weights, dense and MoE, from 4B to 1T parameters";
      the models page lists larger entries. Its only mention of full fine-tuning is that LoRA comparison.
