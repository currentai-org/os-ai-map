capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: LoRA training + sampling for RL/eval; broad model breadth (1B-550B incl. large MoE
    like Qwen3-235B-A22B, DeepSeek, Nemotron); abstracts distributed multi-GPU training behind 4-function
    API. Largest demonstrated: 550B-class MoE fine-tuning.'
  confidence: medium
  note: Tinker hides distributed multi-GPU training behind four functions and supports LoRA training and
    RL sampling on open-weight models, up to very large mixture-of-experts checkpoints. The service is LoRA-only,
    with no full fine-tuning or full RL stack, which keeps it behind frameworks such as Megatron-LM and
    verl that train entire models at scale.
  last_verified: '2026-09-28'
  sources:
  - url: https://thinkingmachines.ai/tinker/
    shows: 'FAQ states "Tinker is a flexible API for efficiently fine-tuning open source models with LoRA."
      and argues that "LoRA matches the learning performance of full fine-tuning". The supported-models
      list runs from "Qwen3.5-4B" up to "Nemotron-3-Ultra-550B-A55B-BF16". Searched the body for a full
      fine-tuning or full RL stack offering: the only full fine-tuning mention is that LoRA comparison.'
