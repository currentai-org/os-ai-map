  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: NVIDIA Model Optimizer applies six optimization families - quantization, pruning, neural architecture
    search, distillation, sparsity and speculative decoding - to Hugging Face, PyTorch and ONNX models,
    exporting checkpoints for TensorRT-LLM, TensorRT, vLLM and SGLang. That breadth of technique sits one
    step below the retargetable, multi-vendor compilation Apache TVM performs across its whole pipeline.
