capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: SFT, DPO (preference), RFT (reinforcement fine-tuning). LoRA-adapter outputs with warm-start
    continued training; serves resulting adapters on dedicated deployments. Open base-model catalog.'
  confidence: medium
  note: 'Strong managed method coverage over open base models: supervised fine-tuning, DPO preference tuning
    and reinforcement fine-tuning, producing LoRA adapters that can be warm-started for continued training
    and served on dedicated deployments. It is a black box, oriented to LoRA outputs with limited scale
    and precision control and no training benchmark behind it, so it is capped below the open-source libraries
    that define scale. Demonstrated scale is slightly narrower than Together''s, with no confirmed 100B+
    full fine-tuning claim, but matching depth on reinforcement fine-tuning keeps it level with the other
    services that offer it.'
  last_verified: '2026-08-09'
  sources:
  - url: https://docs.fireworks.ai/fine-tuning/fine-tuning-models
    shows: Lists SFT, DPO/ORPO, and reinforcement fine-tuning as the managed fine-tuning methods, producing
      a LoRA model; documents --warm-start-from to continue training from a previous LoRA checkpoint instead
      of a base model.
    accessed: '2026-08-09'
    http_status: 200
    content_sha256: c4483c16da58f2730d440ad77a90766717888b7cf86a71fa584dbd437086d189
  - url: https://docs.fireworks.ai/fine-tuning/deploying-loras.md
    shows: States that fine-tuned LoRA models, whether created on Fireworks or imported, can only be deployed
      to on-demand (dedicated) deployments, and that serverless deployment is not supported for LoRA models;
      describes live-merge (matches base-model latency) and multi-LoRA (shares one deployment across several
      fine-tunes, at some per-adapter throughput overhead) as the two deployment options.
