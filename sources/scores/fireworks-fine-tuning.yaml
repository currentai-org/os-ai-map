capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: SFT, DPO and ORPO preference, and reinforcement fine-tuning producing LoRA adapters with
    warm-start continued training; a Training API for custom training loops on Fireworks-managed GPUs, with
    full-parameter training on dedicated capacity by request; adapters served from dedicated deployments.
    Open base-model catalog.'
  confidence: medium
  note: Fireworks offers managed supervised, preference and reinforcement fine-tuning that produces LoRA
    adapters, plus a Training API for custom training loops, with full-parameter training on dedicated GPUs
    by request. It runs only on Fireworks' cloud and serves trained adapters only from dedicated deployments,
    which puts it level with managed services such as Tinker and Together rather than with Megatron-LM and
    the large-scale training frameworks.
  last_verified: '2026-09-28'
  sources:
  - url: https://docs.fireworks.ai/fine-tuning/fine-tuning-models
    shows: The page documents supervised, DPO/ORPO and reinforcement fine-tuning jobs, continued training
      with "--warm-start-from" instead of a base model, and says training a model and deploying it to an
      on-demand (dedicated) deployment "is the only supported method for serving trained models".
    accessed: '2026-09-28'
    http_status: 200
    content_sha256: 8088b094cd7309ecad53d9bb94a6d0bdec7fed3391a144ffcac7010ec13b5036
