capability:
  score: 5
  basis: feature_matrix
  value: a catalogue of over a thousand providers and ten thousand prebuilt actions, with credential handling
    for API keys, OAuth2 and custom schemes - named connections, encryption and token refresh - behind a runtime
    the caller can self-host or consume hosted
  confidence: medium
  relative_to: composio
  relation: at
  note: 'Many systems, credentials the product holds and refreshes, and a runtime that can be hosted: band
    5, alongside ACI.dev as the open-source products that reach it here. One qualification the README states
    plainly and this record repeats rather than smooths: self-hosting means YOU register the OAuth applications
    with each provider, while the hosted tier supplies them. The gateway performs the flow and stores the grant
    in both cases, which is what the band reads; who owns the OAuth client is a deployment question. Banded
    at composio, the closed-source product with the same shape.'
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/oomol-lab/open-connector/main/README.md
    shows: 'The README: "an open-source connector gateway for AI agents and an alternative to Pipedream/Composio.
      Connect user app accounts once, then expose a shared catalog of 1,000+ providers and 10,000+ prebuilt
      Actions", with "Credential handling for API keys, OAuth2, custom credentials, and no-auth providers",
      "Provider secrets stay behind the runtime boundary" and "named connections, credential encryption, token
      refresh, and action policies". The deployment table: hosted gives "Managed OAuth and hosted runtime...
      No deployment or OAuth app setup"; self-hosted means "You manage storage and OAuth apps".'
    accessed: '2026-09-17'
