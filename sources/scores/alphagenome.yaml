  note: A separate Google DeepMind repository publishes the model's JAX implementation with a loader for its
    training files, and those files sit in a public Google Cloud Storage bucket that anyone can list and
    download without signing in. The downloadable checkpoint is still covered by the AlphaGenome Model Terms,
    which forbid commercial use.
