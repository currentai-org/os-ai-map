product: alphagenome
openness:
  score: 2
  class: restricted
  components:
    weights:
      value: open
      detail: gated downloadable checkpoint files
    data:
      value: open
      detail: training TFRecords for all 12 predicted modalities published in a public, unauthenticated
        Google Cloud Storage bucket (alphagenome-datasets) that the alphagenome_research data loader reads
        from
    code:
      value: partial
      detail: Apache-2.0 API client, examples, and notebook; no training pipeline
    license:
    - name: AlphaGenome-Model-Terms
      detail: non-commercial use only
  raw: weights:open(gated downloadable checkpoint files);data:open(training TFRecords for all 12 predicted
    modalities published in a public, unauthenticated Google Cloud Storage bucket (alphagenome-datasets)
    that the alphagenome_research data loader reads from);code:partial(Apache-2.0 API client, examples,
    and notebook; no training pipeline);license:AlphaGenome-Model-Terms(non-commercial use only)
