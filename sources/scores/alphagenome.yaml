capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: DNA sequence plus the user's own single-cell RNA-seq data as conditioning input, and one-million-base
    input resolved to single-base outputs; no adaptation pathway and no generative-design pathway.
  relative_to: prithvi-eo
  relation: one_below
  confidence: high
  note: AlphaGenome 2 takes a DNA sequence together with expression conditioning from the user's own single-cell
    RNA-seq data, so it accepts more than one kind of input, and it resolves sequences up to one million
    bases to single-base outputs. Conditioning shapes predictions without updating any weights, so it is
    not an adaptation pathway, and no fine-tuning or generative pathway is documented.
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/google-deepmind/alphagenome/main/README.md
    shows: Describes AlphaGenome 2 as "Our latest multimodal DNA sequence model" with "generalization to
      your own human scRNA-seq data", and a quick start that sends a 1 Mb interval.
    accessed: '2026-11-16'
