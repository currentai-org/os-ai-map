capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: 'Inputs: DNA sequence plus expression conditioning from the user''s own single-cell RNA-seq data
    (up to 256 cells). Outputs at several sampling resolutions: RNA-seq and accessibility tracks at 1 bp,
    histone and transcription-factor ChIP-seq at 128 bp, and chromatin contact maps at 2,048 bp. Conditioning
    updates no weights; no fine-tuning or generative pathway is documented.'
  confidence: high
  note: 'AlphaGenome 2 takes a DNA sequence together with expression conditioning from the user''s own single-cell
    RNA-seq data, so it accepts more than one kind of measurement. Its outputs come at different sampling
    resolutions: single-base RNA-seq tracks, ChIP-seq signal in 128-base bins and chromatin contact maps
    in 2-kilobase bins. Conditioning shapes predictions without updating weights, so it is not a fine-tuning
    pathway, and no generative pathway is documented.'
  last_verified: '2026-11-16'
  sources:
  - url: https://raw.githubusercontent.com/google-deepmind/alphagenome/main/README.md
    shows: Describes AlphaGenome 2 as "Our latest multimodal DNA sequence model" with "generalization to
      your own human scRNA-seq data", and a quick start that sends a 1 Mb interval.
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: 9a2c79cd5bb946cba758d79d614ae7f02270bf4b7b7a25eac01770ca97dc9b10
  - url: https://www.alphagenomedocs.com/getting_started.html
    shows: 'Each AlphaGenome 2 call predicts for one condition: a reference condition, or "expression conditioning
      given up to 256 cells" "from your own scRNA-seq data".'
    accessed: '2026-11-16'
