  value: 'On-device multimodal assistant for Android, iPhone and Mac: GGUF language models run locally,
    vision input, Whisper speech recognition, image generation, retrieval over local files, MCP tool access,
    and a documented on-device performance story. Breadth of modality on a single device rather than a server-side
    platform surface.'
  confidence: medium
  note: 'Off Grid AI matches Jan''s on-device assistant class: local language models with vision, speech
    and image generation, more modality range than most peers offer on a single device. It targets one person''s
    phone and laptop rather than the multi-backend, document and agent platform surface that puts Open WebUI
    and AnythingLLM a step ahead.'
  relative_to: jan
  relation: at
