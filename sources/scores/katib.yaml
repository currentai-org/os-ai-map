capability:
  score: 3
  basis: feature_matrix
  value: Experiment and Trial as first-class resources; parallel trial execution against
    a declared limit; objective-metric collection per trial; early stopping and a
    trial budget; pluggable search algorithms
  confidence: medium
  relative_to: kubeflow-trainer
  relation: at
  note: 'Katib treats a tuning trial as a first-class job: it decides how many trials run in parallel and
    when they stop, but leaves where each trial''s pods land to the cluster scheduler. That keeps it level
    with Kubeflow Trainer rather than higher.'
  last_verified: '2026-09-15'
