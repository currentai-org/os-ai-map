      detail: C4 is public and its TensorFlow Datasets builder recreates it from Common Crawl, and the supervised
        tasks mixed into the original checkpoints are public benchmarks defined in the t5 library. C4 is
        filtered from Common Crawl's April 2019 web extracted text, and Ai2's copy is released under ODC-BY
        with the reuser bound by Common Crawl's terms of use for the page content, which leave the pages
        under their owners' terms. CCBot documents a robots.txt check before fetching. No removal route
