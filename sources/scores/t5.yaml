capability:
  score: 1
  basis: benchmark
  basis_detail: summarization, question-answering and classification results in the 2019 paper
  value: State of the art on many benchmarks covering summarization, question answering and text classification
    at release in 2019 (arXiv:1910.10683); the largest checkpoint has 11B parameters.
  relative_to: comma
  relation: one_below
  confidence: medium
  note: T5 set the state of the art on many language benchmarks in 2019 and, unlike an encoder, it generates
    text, but it has no results on the benchmarks used for today's language models and is mostly run in
    its smaller sizes. It sits a step below Comma, a 7B model that only matches 2023-era peers.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/common-pile/comma-v0.1-2t/raw/main/README.md
      shows: Comma v0.1-2T card still reports an 11-task average of 57.4 and says "It performs comparably
        to budget-matched models (7 billion parameters, 2 trillion tokens) trained on unlicensed data",
        the placement the comparison relies on.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 0cd34d6d1211c0d603e98ba2812945376584b615b08089a92d39b987f8e2ec9c
