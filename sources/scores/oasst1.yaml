  note: OASST1 still appears in later post-training mixtures such as Guanaco, Tulu 3 and OLMo 3's Dolci,
    but only as a small fraction of a larger blend, with no benchmark isolating its own contribution. The
    QLoRA paper fine-tuned Guanaco 65B on a 9,209-example variant of OASST1 and called the result the best-performing
    open-source chatbot model of its time.
  last_verified: '2026-09-29'
