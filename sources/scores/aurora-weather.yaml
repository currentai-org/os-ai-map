capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: An executable fine-tuning pathway and a medium/high-resolution span; a deterministic forecast target, and inputs that vary by dataset rather than one documented multi-instrument interface.
  relative_to: terramind
  relation: two_below
  confidence: high
  note: >-
    Two attributes. Adaptation is executable rather than merely described - docs/finetuning.md
    ships a Docker image and a fine-tuning loop built on AuroraPretrained - which is the bar
    ruling (b) sets. Generative is declined under ruling (d): Aurora predicts a deterministic
    future state, which is prediction rather than generation, and it is declined for the same
    reason aifs, pangu-weather and climax are. A list of specialized task names is not a
    further attribute.
  last_verified: '2026-09-10'
  sources:
  - url: https://raw.githubusercontent.com/microsoft/aurora/main/docs/finetuning.md
    shows: 'A dedicated Fine-Tuning page - "if you wish to fine-tune Aurora for a specific application, you should build on the pretrained version", with AuroraPretrained().load_checkpoint(), a Docker image and a fine-tuning loop. This is the executable pathway ruling (b) requires, which the README alone only describes.'
