capability:
  score: 3
  basis: feature_matrix
  basis_detail: README-documented feature set, compared with Text Generation Inference
  value: Embedding, reranking, sequence-classification and SPLADE pooling for encoder and decoder embedding models
    (BERT, XLM-RoBERTa, GTE, NomicBERT, ModernBERT, Qwen2/Qwen3, Gemma3, Mistral); token-based dynamic batching;
    Flash Attention, Candle and cuBLASLt kernels; Safetensors and ONNX weights; HTTP and gRPC APIs; OpenTelemetry
    tracing and Prometheus metrics; CPU, NVIDIA Turing to Blackwell, AMD Instinct and Apple Metal backends.
  relative_to: text-generation-inference
  relation: at
  confidence: medium
  note: Text Embeddings Inference covers what search and retrieval need from a server, with dynamic batching, optimized
    kernels and production tracing across CPU, NVIDIA, AMD and Apple hardware, and it is still actively released.
    It sits level with its sibling Text Generation Inference as a focused server rather than a general-purpose engine.
