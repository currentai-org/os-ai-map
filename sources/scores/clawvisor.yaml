capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: a bearer token per registered agent; every gateway request checked against the approved task scope, with
    hard restrictions blocking actions outright; task scopes and out-of-scope requests held for the user's approval
    in the dashboard, Telegram or a phone; a per-request audit log without signatures or hash links; no delegation
    of narrowed authority between agents
  confidence: medium
  note: Clawvisor registers each agent with its own token, checks every request against the task a person approved,
    and holds anything outside that task for approval. Its audit trail is an ordinary database log rather than a
    signed or chained record, and it has no way for one agent to hand narrower authority to another.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/clawvisor/clawvisor/main/README.md
    shows: The README says agents "declare tasks", "the user approves the scope", "Any request that isn't covered
      by a task scope goes to the approval queue", "agent create" prints a bearer token, and "Every gateway request
      is logged with a unique request_id".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: e946a31209825c041ffdf0933097185a4f40eabd88f01ee24e93e2033ceccba6
