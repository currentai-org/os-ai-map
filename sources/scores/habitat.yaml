capability:
  score: 3
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: Rendered RGB-D and semantic camera sensors over scanned indoor scenes, several thousand FPS single-threaded and over
    10,000 FPS multi-process on one GPU, Bullet rigid and articulated dynamics, URDF robots (Fetch, Franka, AlienGo), navigation
    and rearrangement tasks in Habitat-Lab. Physics runs on the CPU; no GPU-batched parallel simulation is documented.
  confidence: medium
  note: Habitat renders camera views of real scanned homes fast enough to train navigation agents on billions of frames, which
    is its strength. Its physics is Bullet on the CPU, one environment per process, so it has neither the GPU-parallel simulation
    nor the task library for common robot arms that set Isaac Lab well above it.
  relative_to: isaac-lab
  relation: two_below
  last_verified: '2026-09-27'
  sources:
  - url: https://ungh.cc/repos/facebookresearch/habitat-sim/files/main/README.md
    shows: 'README: "Configurable sensors (RGB-D cameras, egomotion sensing)"; "Rigid-body mechanics (via Bullet)"; "achieves
      several thousand frames per second (FPS) running single-threaded and reaches over 10,000 FPS multi-process on a single
      GPU"; "simulates a Fetch robot interacting in ReplicaCAD scenes at over 8,000 steps per second (SPS)".'
    accessed: '2026-09-27'
