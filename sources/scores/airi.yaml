  score: 3
  basis: feature_matrix
  value: 'Character-driven companion front end with a multimodal surface: speech synthesis and recognition, vision
    input, persistent memory, MCP tool access, and browser, desktop and mobile builds, over many providers through
    the xsAI client library. A persona-centred chat surface rather than a retrieval or agent platform.'
  confidence: medium
  note: Airi is in the same companion front-end class as SillyTavern. Its modality breadth - voice in and
    out, vision, three form factors - is unusually wide for that class, but it organizes a character conversation
    rather than providing the retrieval, tool and document surface that places AnythingLLM and Open WebUI
    a step ahead.
  relative_to: sillytavern
  relation: at
  comparison:
    last_attested: '2026-08-31'
    sources:
