capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indian-language speech
  value: About 23,700 hours of read, extempore and conversational speech from 51,000 speakers in all 22 scheduled
    Indian languages, 11,200 hours transcribed by people, documented in a paper, and used to build the IndicASR
    model.
  confidence: medium
  note: IndicVoices has more human-transcribed spontaneous speech in all 22 scheduled Indian languages than
    any other open corpus. AI4Bharat built IndicASR, the first recognizer to cover all of them, on it, and
    a paper documents its collection and transcription.
  last_verified: '2026-09-24'
