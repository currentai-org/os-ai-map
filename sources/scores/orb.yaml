  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: A documented finetuning script and guide for adapting any released checkpoint to a custom dataset; one atomistic modality, no generation, one scale.
  confidence: high
  note: One attribute. Periodic and non-periodic support is coverage rather than a second scale, the direct and conservative variants are separate checkpoints, and the models predict energies, forces and stresses rather than generating structures.
  last_verified: '2026-09-10'
  sources:
  - url: https://raw.githubusercontent.com/orbital-materials/orb-models/main/README.md
    shows: Documents finetune.py against any model in ORB_PRETRAINED_MODELS with a dedicated finetuning guide, and describes the models as calculating energies, forces and stresses of atomic systems.
