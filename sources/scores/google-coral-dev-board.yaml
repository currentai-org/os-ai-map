  confidence: high
  note: 'Google publishes a public datasheet and the baseboard design files, and there is an open runtime
    with a TensorFlow Lite path, but the Edge TPU silicon and the model compiler are proprietary closed
    binaries. The datasheet page links design files throughout: a baseboard schematic PDF, the Altium schematic
    source, an Allegro .brd layout and a STEP model of baseboard and SoM together, all served from github.com/google-coral/electricals,
    which carries an Apache-2.0 LICENSE. That is more than radxa-rock-5b releases, and it stops short of
    fully open because only half the product is covered - the SoM that carries the i.MX 8M and the Edge
    TPU has no design files. Published board files reach the next tier up only alongside a stack that builds
    from source, and the Edge TPU Compiler is a closed binary, so the board lands at 3, documented, either
    way; what the published files change is that the 3 is derived from what Google actually publishes. The
    public documentation is that same v1.7 datasheet. The toolchain is partly open: libedgetpu ships its
    runtime source under Apache-2.0 against an Edge TPU Compiler distributed only as an apt binary from
    packages.cloud.google.com with no source anywhere, and a repository being archived does not make it
    closed. Firmware blobs are required because that same closed compiler stands between any model and the
    proprietary Edge TPU. Retail is the awkward component: the board reads as withdrawn rather than on open
    sale. Seeed, its named reseller, marks both the 1GB at $129.99 and the 4GB at $169.99 discontinued and
    out of stock; coral.ai/products/dev-board now redirects to developers.google.com/coral, a page that
    names no hardware and links no purchase route; and no reachable distributor confirms stock, with Mouser
    serving a bot-denial page and Farnell and Digi-Key refusing automated requests. Open market, distributor-only
    and restricted all describe a part somebody can still buy under some terms, so a withdrawn part is recorded
    instead as discontinued. The wording is score-neutral either way, since no rung on the hardware ladder
    reads the retail component.'
  raw: schematics:published (baseboard schematic + Altium source + Allegro layout, Apache-2.0; SoM
