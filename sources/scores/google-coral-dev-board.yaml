  note: 'Google publishes the baseboard''s schematic, Altium and Allegro design files under Apache-2.0,
    plus a public datasheet, and the runtime driver (libedgetpu) is open source. But the system-on-module
    that carries the i.MX 8M and the Edge TPU chip itself has no published design files, and the Edge TPU
    Compiler every model must go through ships only as a closed binary with no source anywhere. That leaves
    the board only partly open: the baseboard is documented, but the module that does the work is not.'
