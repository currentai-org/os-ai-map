adoption:
  level: 3
  reach: niche
  signal_type: reported_traction
  confidence: medium
  note: 'The entire Edge TPU software stack is archived. libedgetpu is read-only, archived on 2025-10-14,
    and the Coral GitHub org shows 34 of its 40 repositories archived - libedgetpu, libcoral, pycoral, tflite,
    examples-camera and tutorials among them, all last pushed 2024-08-11. The six live repositories are
    a different product line: coralnpu, coralnpu-compiler, coralnpu-mpact, coralmicro and two project demos.
    Combined with retail, this is a wound-down platform rather than a niche one - Seeed marks both variants
    discontinued and out of stock, and coral.ai/products/dev-board now redirects to a page that names no
    hardware and links no purchase route. The category already places nvidia-jetson-agx-orin and memryx-mx3
    at level 3, niche, on stronger evidence than this board can now show. It is held at 3 rather than lower
    because the hardware remains in use and the archived stack still functions.'
  last_verified: '2026-08-14'
  sources:
