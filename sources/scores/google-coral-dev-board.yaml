adoption:
  level: 3
  reach: niche
  signal_type: reported_traction
  confidence: medium
  note: 'The Edge TPU software stack is archived: libedgetpu was archived on 2025-10-14, and 33 other Coral
    repositories are also read-only after being last pushed in 2024. Both board variants are marked discontinued
    at retail, with the coral.ai product page no longer naming any hardware. Boards already sold remain
    in use and the archived stack still runs on them, which is why adoption has not fallen further even
    as the platform winds down.'
  last_verified: '2026-08-14'
  sources:
  - url: https://api.github.com/orgs/google-coral/repos?per_page=100
    shows: '34 of 40 repositories archived, including the whole Edge TPU stack (libedgetpu archived
      2025-10-14, libcoral, pycoral, tflite, examples-camera, tutorials), all last pushed 2024-08-11;
      the six live repos are coralnpu/coralnpu-compiler/coralnpu-mpact/coralmicro plus two demos,
      a different product line'
    accessed: '2026-08-14'
    http_status: 200
    content_sha256: 09fb2a86689a959896da1555f6b94f82dde6bf56c1dd8b9532c9cf8adf9b087b

capability:
  score: 2
  basis: feature_matrix
  value: 4 TOPS (2 TOPS/W); int8-quantized models; TensorFlow Lite only
  confidence: high
  note: Modest 4 TOPS limited to int8 TFLite models; suited to small CNN inference rather than large or
    generative models. The datasheet (version 1.7) reads "4 trillion operations per second (TOPS)", "2 TOPS
    per watt" and an Edge TPU that "performs 4 trillion operations per second" with TensorFlow Lite models.
    That is the lowest AI throughput in this category apart from sipeed-maixcam, and the TFLite-only path
    is what keeps it below the 6 TOPS RK3588 boards.
  last_verified: '2026-08-13'
  sources:
  - url: https://coral.ai/docs/dev-board/datasheet/
    shows: '"High-speed and low-power ML inferencing (4 TOPS @ 2 W)", "4 trillion operations per second
      (TOPS)", "2 TOPS per watt", and an Edge TPU coprocessor used "with TensorFlow Lite models"'
    accessed: '2026-08-13'
    http_status: 200
