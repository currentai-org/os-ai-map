capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indian-language understanding evaluation
  value: Nine understanding tasks across 20 Indian languages in 105 evaluation sets, 52 of them new and mostly
    translated or annotated by people, documented in an ACL paper, and used to evaluate IndicBERT v2 and in
    the Airavata evaluation suite.
  confidence: medium
  note: IndicXTREME gathers nine understanding tasks across 20 Indian languages, and IndicBERT v2 and the Airavata
    evaluation suite report against it. It is narrower than AfroBench, which spans 15 tasks and 64 languages
    behind a public leaderboard, and some of its sets are machine-translated.
  relative_to: afrobench
  relation: one_below
  last_verified: '2026-09-24'
  sources:
