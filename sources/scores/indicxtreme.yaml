capability:
  score: 4
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 4 of 5, provisional and count-based: the median corroborated band over its target
    languages, 19 of 21 measured, across 3 tasks. Face value 4; best original band 4.'
  confidence: medium
  note: In the typical language IndicXTREME targets, its deepest test has sixteen hundred to sixty-four
    hundred items that count toward depth. Of its 21 target languages, 19 have a countable test. An item count
    says how much a set can test, not how precisely it ranks models.
