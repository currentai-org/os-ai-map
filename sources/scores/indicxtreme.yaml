  - url: https://arxiv.org/pdf/2212.05409
    shows: 'Table 2: "|Test| is the size of the test sets in each language. |Dev| is the size of in-language
      development sets, if available": IndicSentiment 156 dev and 1000 test, IndicXNLI 2490 and 5010 (MT),
      IndicCOPA 500, IndicXPara 2002, M-Intent and M-SlotFill 2033 and 2974, Naamapadam 607-1080 test, IndicQA
      1517-2017, FLORES 1012; Table 7, IndicQA questions per language: as 1789, bn 1763, gu 2017, hi 1547, kn
      1517, ml 1589, mr 1604, or 1680, pa 1542, ta 1804, te 1734; Table 9, "Of the 5010 test instances in each
      language, the number of instances verified and corrected so far is presented in the Ver. and Corr. columns
      respectively": verified as 3000, bn 1510, hi 4000, kn 1370, ml 3200, mr 1648, or 2107, te 872, and corrected
      as 1918, bn 835, hi 1142, kn 264, ml 2427, mr 944, or 1820, te 527, none for gu, pa and ta;
      "We manually translate the COPA (Roemmele et al., 2011) test set into 18 Indic languages";
      "All the reviews are first written in English and then manually translated to 13 Indic languages"; "released
      an automatically translated version of XNLI"; "we manually verify the translations of some parts of the
      test set and make changes where necessary"; "we machine-translate these sentences into the required languages
      using the IndicTrans model"; "verify and correct the translations, if required, and (ii) create one paraphrase
      and a non-paraphrase for each sentence"; "The annotators are asked to create questions (in an Indic language)";
      "1012 sentences manually translated into 18 Indic languages"; "we only create test sets"; the per-task
      results tables (15 to 23) name each task''s languages, IndicSentiment''s including "bd", which the paper
      uses for Bodo ("low-resource languages like bd and dg"; Table 14 "brx Bodo")'
    accessed: '2026-11-02'
