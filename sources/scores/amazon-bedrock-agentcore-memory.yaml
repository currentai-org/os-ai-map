capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: semantic retrieval of long-term records within actor and session namespaces; LLM extraction of facts, preferences,
    summaries and episodes from raw events; consolidation into new or existing records, with reflections across
    episodes; events that expire after a configured number of days; separate semantic, user-preference, summary
    and episodic stores
  confidence: medium
  note: 'AgentCore Memory runs the whole cycle itself: built-in strategies extract records from raw events with
    a managed model, consolidate them against what is already stored, and add reflections across past episodes,
    while stored events expire after a retention period set on the memory. Facts, preferences, summaries and episodes
    are kept as separate kinds of record, each in its own namespace.'
  last_verified: '2026-11-20'
  sources:
  - url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory-types.html
    shows: Long-term memory generation "automatically extracts insights" and performs "Extraction" and "Consolidation";
      records are read with RetrieveMemoryRecords, which "performs a semantic search to find memory records that
      are most relevant to the query".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: b56e2f156d60ff2d56945860820290d2450477601a7a1020750c5f6e2db43f71
  - url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/built-in-strategies.html
    shows: Built-in strategies run "Extraction", "Consolidation – Determines whether to write useful information
      to a new record or an existing record" and "Reflection – Insights are generated across episodes"; the strategies
      are semantic, user preference, summary and episodic.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: a104ea80853dd9083e2b8f9c742eba8ed79585087e8b137289b5b43b1094c4a3
  - url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/episodic-memory-strategy.html
    shows: The episodic strategy "automatically detects episode completion" and stores episodes and reflections
      under namespaces such as /strategy/{memoryStrategyId}/actor/{actorId}/session/{sessionId}/.
