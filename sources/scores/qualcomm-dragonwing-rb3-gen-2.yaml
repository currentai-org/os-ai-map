  confidence: high
  note: Proprietary Qualcomm silicon with public documentation and a Linux SDK, sold through distributors,
    but the board itself is not fully open hardware. The public documentation is a product brief, document
    87-74789-1 Rev. A, served by docs.qualcomm.com. The design files count as partial on "The hardware development
    kit is also compliant with the 96Boards open hardware specification to support a range of mezzanine-board
    expansions" - an open interface standard published with a block diagram but no board files. The toolchain
    counts as open on "Support for Linux, Android" plus the Intelligent Multimedia, Robotics, Neural Processing
    and Hexagon SDKs, and on Qualcomm AI Hub Models being a BSD-3-Clause repository at 1,183 stars. Firmware
    blobs are required because the whole stack sits on the proprietary QCS6490 with vendor SDKs. Retail
    comes from Edge Impulse, which names Advantech, Tria, Thundercomm and Quectel as manufacturers of QCS6490
    kits. www.qualcomm.com serves a client-rendered 9KB shell to an automated fetch and no header set changes
    that, which is why the brief is taken from docs.qualcomm.com instead.
