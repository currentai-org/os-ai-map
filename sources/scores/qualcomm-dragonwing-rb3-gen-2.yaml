  note: Sold via Thundercomm and other distributors, with first-class support in Edge Impulse, indicating
    an established but specialist developer base. Edge Impulse lists the kit as a supported board alongside
    the Dragonwing IQ-8275 and IQ-9075 EVKs, says it is "fully supported by Edge Impulse", and documents
    a Qualcomm IM SDK GStreamer pipeline for it. The Qualcomm developer page is unfetchable - it serves
    an empty client-rendered shell to a fetcher - so the distributor half of the claim is not confirmable
    from any source cited here.
