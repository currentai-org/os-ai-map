capability:
  score: 3
  basis: feature_matrix
  value: Dask-parallel linear, logistic and Poisson regression, naive Bayes, k-means and spectral clustering, PCA and
    SVD, preprocessing and imputation, grid, randomized, incremental and Hyperband search, blockwise voting ensembles,
    and wrappers that scale scikit-learn and XGBoost estimators
  relative_to: scikit-learn
  relation: at
  confidence: medium
  note: Dask-ML spreads scikit-learn-style training, preprocessing and hyperparameter search across a cluster or data
    larger than memory. It leaves the choice of model to the user, as scikit-learn does, and implements fewer learners
    of its own.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://scikit-learn.org/stable/user_guide.html
      shows: scikit-learn user guide still lists supervised learners (linear models, SVMs, nearest neighbors, Gaussian
        processes, decision trees, ensembles, neural networks) and unsupervised ones (mixtures, manifold learning, clustering)
        - the toolkit scope compared at.
