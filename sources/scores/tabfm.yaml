capability:
  score: 4
  basis: feature_matrix
  value: classification (up to 10 classes) and regression on a new table in one forward pass with no training or tuning,
    through scikit-learn-style estimators and an ensemble preset; evaluated on TabArena's 51 datasets
  relative_to: tabpfn
  relation: at
  confidence: medium
  note: TabFM reads the user's training rows as context and predicts on new rows without fitting or tuning, which is
    what TabPFN does. It is one model, limited to ten classes, and does not search over or ensemble other learners.
  comparison:
    last_attested: '2026-11-12'
    sources:
