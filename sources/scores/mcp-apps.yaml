  note: 'ABSTAINS. This ladder measures coverage of the MCP client-server contract over role, primitives and
    transports, and MCP Apps implements none of those: it EXTENDS the protocol with a UI resource convention,
    publishing its own dated specification - stable at 2026-01-26 - and an SDK for three audiences that are
    not MCP roles (app developers, host developers and server authors registering UI metadata). Banding it
    would mean reading a second quantity inside a category built to hold one. It belongs here because it is
    a specification the protocol''s own project publishes and governs.'
