capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: a separate identity for every agent run under one credential; default-deny policy decision on every request
    before it reaches a resource; mandates that can only narrow when delegated to sub-agents, through OAuth 2.0
    token exchange; approval gates that hold high-risk operations for an authenticated approver; an append-only,
    hash-chained audit trail with signed event ingestion
  confidence: medium
  note: 'Caracal implements every part of agent authorization itself: each agent run gets its own identity, every
    request is decided against policy before it runs, delegation can only narrow, risky actions wait for an approver,
    and decisions are kept in a tamper-evident chain.'
  relative_to: agent-governance-toolkit
  relation: at
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/Garudex-Labs/caracal/main/README.md
    shows: The README lists "Delegation that only narrows", "Decisions before actions" under a default-deny policy,
      "Human approval for risky actions" and "An append-only, tamper-evident trail of every decision", and names
      OAuth 2.0 token exchange (RFC 8693).
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 55d0795093b07b88643cc0d2314b71c7aba4584ef5cecede987a9bdd1a4a19b2
  - url: https://caracal.run
    shows: The site says "Every agent run gets its own identity", "Sensitive actions pause for approval", and that
      the audit service provides "Signed event ingestion" and a "Tamper-evident hash chain".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: bb87e1fb727fde09c0e50a2b63cfcd4025696edd0253057f9b80a68ef7eea620
