adoption:
  level: 1
  reach: <1K stars
  signal_type: stars_fallback
  confidence: medium
  note: >-
    The checkpoints sit under tungnd, the personal Hub namespace of Tung Nguyen, ClimaX's first
    author, and microsoft/ClimaX's own fine-tuning commands point --model.pretrained_path at
    those exact URLs - so it is the official release rather than a mirror, and it is declared as
    the weights artifact. It reports zero downloads against 2.6 GB of stored files, so the
    counter measures the API path rather than the reach, and 709 GitHub stars are the
    last-resort signal on the aurora-weather precedent.
  last_verified: '2026-09-10'
