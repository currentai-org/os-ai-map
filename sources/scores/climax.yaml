capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Per-task fine-tuning configs, and checkpoints at two grid resolutions spanning forecasting and climate projection; deterministic targets and one variable interface.
  relative_to: aurora-weather
  relation: one_below
  confidence: high
  note: >-
    Two attributes. The named downstream tasks are not counted as an attribute of their own.
    Multi-instrument is declined on what the inputs are rather than on whether a product source
    restates the paper - three do, in configs/pretrain_climax.yaml's per-dataset dicts, in
    arch.py's per-variable tokenization, and in the docs' "pretrained using all 5 CMIP6
    datasets". The five are CMIP6 simulation archives, which is one simulation data system
    under the category's rule that several variables from one data system are not several
    instruments, and ERA5 enters at fine-tuning rather than pretraining.
  last_verified: '2026-09-10'
  sources:
  - url: https://microsoft.github.io/ClimaX/usage/
    shows: Gives fine-tuning commands and configs for global forecasting, regional forecasting, and climate projection, each loading a pretrained checkpoint, and publishes checkpoints at 5.625deg and 1.40625deg resolution.
    accessed: '2026-09-10'
    http_status: 200
    content_sha256: 010040552f48292ecba679c156d0d51f8557fd355b453958a9691e44b7f30694
