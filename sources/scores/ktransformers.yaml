  score: 4
  basis: feature_matrix
  basis_detail: category feature matrix, banded against the vllm anchor
  value: 'CPU-GPU heterogeneous inference for MoE models far larger than GPU memory: AMX/AVX expert kernels
    in DRAM, FP8/BF16 native precision, 3-layer GPU-CPU-disk prefix cache, multi-concurrency serving,
    backends for NVIDIA, AMD ROCm, Intel Arc and Ascend NPU; day-0 support cadence for frontier MoE releases
    (GLM-5.x, Kimi-K2.5, MiniMax-M3, DeepSeek-V4).'
  relative_to: vllm
  relation: one_below
  confidence: medium
  note: KTransformers sits one tier below vLLM, level with LMDeploy and mistral.rs. It can do something
    vLLM cannot, serve 671B-class MoE models on a single consumer GPU by scheduling experts onto the CPU,
    and spans four accelerator vendors, but it is not built for datacenter throughput and increasingly delivers
    its serving path through an SGLang integration rather than standing alone.
