  value: classification and regression on a new table without tuning; TabICLv2 reported above RealTabPFN-2.5 on
    TabArena and TALENT
  relative_to: tabpfn
  relation: at
  confidence: medium
  note: TabICL answers the same question TabPFN does - a prediction on an unseen table with no training step - and
    its authors report it ahead of a tuned, ensembled RealTabPFN-2.5 on two public benchmarks. Like TabPFN it is
    one model, with no search or ensembling over others.
