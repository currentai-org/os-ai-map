  basis_detail: 'coverage: recognition in 1,100+ languages, identification in about 4,000, TTS per language; absent from
    both ASR boards'
  value: One recognizer covering 1,162 languages through adapters, language identification models up to 4,017 languages,
    and a VITS voice per language; the cards publish no accuracy figures and no MMS checkpoint is on the Open ASR Leaderboard.
  confidence: low
  note: Unmatched breadth for low-resource languages, with recognition, identification and synthesis in one family. Its
    accuracy is not compared on any public board, so it sits a step below Whisper, which is.
