capability:
  score: 4
  basis: feature_matrix
  basis_detail: embodiment generality
  value: Cross-embodiment pretraining with per-source soft prompts; evaluated on six simulation platforms and three real robots;
    released fine-tunes for dual-arm AgileX manipulation (RoboTwin 2.0) and cloth folding (X-VLA-0.9B).
  relative_to: gr00t
  relation: at
  confidence: medium
  note: X-VLA is pretrained across robot bodies and ships two-armed policies, including one for folding cloth, level with
    GR00T. It has no separate reasoning model and no humanoid control.
