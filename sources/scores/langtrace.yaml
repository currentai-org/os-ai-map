adoption:
  level: 1
  reach: <10K
  signal_type: usage_volume
  confidence: low
  banded_quantity: Docker Hub pulls of the scale3labs/langtrace-client server image averaged over the image's
    lifetime, a floor that leaves out the hosted Langtrace Cloud; langtrace-python-sdk downloads count the
    client and are not banded
  note: Langtrace is a self-hostable server with a hosted cloud beside it. Its Python SDK is left out because
    applications install it to send traces, so its downloads count instrumented applications rather than
    Langtrace deployments. The score comes from Docker Hub pulls of the server image that the repository's
    docker-compose file runs, averaged over the image's lifetime, so for a growing product it is a floor.
    The hosted cloud publishes no usage figure and is not counted.
  last_verified: '2026-09-24'
