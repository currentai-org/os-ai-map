  confidence: high
  note: 'An AGPL-3.0 application with Apache-2.0 SDKs, and nothing withheld from the published source, which
    is the top rung: an OSI license, public source, no gated core. The whole application is in the repository,
    with no enterprise directory, no second license and no license key; self-hosting is documented as a
    first-class path; and the vendor''s own FAQ says of the hosted tier "Currently, we are not charging
    anything for Langtrace cloud". Neither argument for holding it lower survives: AGPL copyleft sits on
    the OSI rung alongside Apache, and a hosted product sold beside an otherwise complete open core does
    not gate that core.'
