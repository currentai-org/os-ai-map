  note: Langtrace provides real-time OpenTelemetry-native tracing across LLMs, frameworks and vector databases,
    with evaluations, latency, cost and usage analytics and broad integrations spanning OpenAI, Anthropic
    and Cohere, LangChain and LlamaIndex, and Pinecone, Chroma and Weaviate. Prompt versioning and dataset
