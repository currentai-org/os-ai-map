capability:
  score: 3
  basis: feature_matrix
  value: 'Model breadth: FLUX.1, FLUX.2 dev and klein-base 4B/9B, Flex.1/Flex.2, Chroma, Lumina2 and Qwen-Image,
    plus instruction-edit, video (Wan) and audio families. Methods: LoRA and LyCORIS adapter training; web UI for
    run configuration and monitoring; RunPod and Modal recipes. Adapter-focused rather than full fine-tuning, and
    single-node in practice.'
  confidence: medium
  note: AI Toolkit is a diffusion-specialist trainer with wide, current model coverage, but its methods
    are limited to LoRA and LyCORIS adapters and it has no distributed-training support. That puts it closer
    to single-GPU tools such as OneTrainer than to frontier-scale trainers like Megatron-LM.
  last_verified: '2026-10-07'
  sources:
  - url: https://raw.githubusercontent.com/ostris/ai-toolkit/main/README.md
    shows: 'README: "AI Toolkit is an easy to use all in one training suite for diffusion models". The "Supported
      Models" section lists FLUX.2-dev, FLUX.2-klein-base-4B and -9B, "Flex.1-alpha", "Flex.2-preview",
      "Chroma1-Base", "Lumina-Image-2.0" and Qwen-Image under Image, with Instruction / Edit, Video (Wan
      2.1 and 2.2), Audio, LLM and Experimental groups; the README documents LoRA and LoKr training through
      LyCORIS and running as "a GUI or CLI".'
