product: neuralgcm
openness:
  score: 3
  class: open_weights
  components:
    weights: {value: open, detail: CC-BY-SA-4.0 checkpoints on an anonymously readable Google Cloud bucket}
    data: {value: documented-not-released, detail: 'ERA5 inputs, forcings and pressure levels specified with ARCO-ERA5 named as the source; the training corpus is not released'}
    code: {value: partial, detail: 'inference API, regridding utilities, and reference_code carrying per-checkpoint training configs and loss code, but its entry point imports google_proprietary_code, a package that is not published, so the training path cannot run'}
    license:
    - {name: CC-BY-SA-4.0, detail: permissive non-OSI}
  raw: weights:open(CC-BY-SA-4.0 checkpoints on an anonymously readable Google Cloud bucket);data:documented-not-released(ERA5 inputs, forcings and pressure levels specified with ARCO-ERA5 named as the source; the training corpus is not released);code:partial(inference API, regridding utilities, and reference_code carrying per-checkpoint training configs and loss code, but its entry point imports google_proprietary_code, a package that is not published, so the training path cannot run);license:CC-BY-SA-4.0(permissive non-OSI)
  confidence: high
  note: >-
    Apache-2.0 governs the code but the trained weights carry CC-BY-SA-4.0, which is the license
    that counts here - permissive, share-alike, and not OSI-approved. `code` is partial for a
    concrete reason rather than the docs' hedge: reference_code ships the per-checkpoint .gin
    training configs, train_utils.py and the loss code, but experiment.py imports
    google_proprietary_code, which is not published, so the training path cannot be executed. The
    docs say the maintainers "would love to support training, modifying and fine-tuning" and are
    refactoring to make it easier - not that it is unsupported.
  last_verified: '2026-09-10'
  sources:
