capability:
  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Stochastic atmospheric simulation, and checkpoints at three horizontal resolutions for both forecasts and long integrations; no supported adaptation path and one ERA5 input system.
  relative_to: weathernext
  relation: one_below
  confidence: high
  note: NeuralGCM ships checkpoints at three horizontal resolutions for both forecasts and long integrations,
    plus a stochastic model for simulation, all on ERA5 inputs. Its documentation says the team would like
    to support training, modifying and fine-tuning but that the current codebase makes this harder than
    it should be, and training is shipped only as pseudo-code. The checkpoint-modification recipe changes
    model outputs rather than learned parameters, so it is not an adaptation pathway.
  last_verified: '2026-11-16'
  sources:
  - url: https://neuralgcm.readthedocs.io/en/latest/checkpoint_modifications.html
    shows: Offers v1/deterministic_0_7_deg.pkl, v1/deterministic_1_4_deg.pkl, v1/deterministic_2_8_deg.pkl
      and v1/stochastic_1_4_deg.pkl, and says "the global mean surface pressure tends to drift in long integrations"
      so the recipe fixes it to increase stability in long integrations.
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: a6587962121a1f31e86e25d41c1ee39885867c112aaf515a955a11292e27256f
  - url: https://neuralgcm.readthedocs.io/en/latest/
    shows: Says "Pseudo-code for training NeuralGCM models" can be found in the reference_code subdirectory;
      "We would love to support training, modifying and fine-tuning NeuralGCM models" but with the Haiku
      and Gin codebase this is "much trickier than it needs" to be.
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: 725df0f422b0b8fc15ac1d50e8f53614af942a28e1dbfc3fdc55adb517dee080
