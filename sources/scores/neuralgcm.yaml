  confidence: high
  note: 'Apache-2.0 covers the code, but the trained weights carry CC-BY-SA-4.0, a share-alike, non-OSI
    license, and that is the license that applies to the released model. The training code is only partly
    public: the reference code ships per-checkpoint configs, training utilities and loss code, but the experiment
    script imports an unpublished Google-internal module, so the training path cannot be run.'
