product: neuralgcm
openness:
  score: 3
  class: open_weights
  components:
    weights:
      value: open
      detail: CC-BY-SA-4.0 checkpoints on an anonymously readable Google Cloud bucket
    data:
      value: documented-not-released
      detail: ERA5 inputs, forcings and pressure levels specified with ARCO-ERA5 named as the source; the
        training corpus is not released
    code:
      value: partial
      detail: inference API, regridding utilities, and reference_code carrying per-checkpoint training configs
        and loss code, but its entry point imports google_proprietary_code, a package that is not published,
        so the training path cannot run
    license:
    - name: CC-BY-SA-4.0
      detail: permissive non-OSI
  raw: weights:open(CC-BY-SA-4.0 checkpoints on an anonymously readable Google Cloud bucket);data:documented-not-released(ERA5
