  score: 3
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Stochastic atmospheric simulation, and checkpoints at three horizontal resolutions for both forecasts and long integrations; no supported adaptation path and one ERA5 input system.
  relative_to: terramind
  relation: two_below
  confidence: high
  note: Two attributes. Adaptation is explicitly uncounted because the documentation says training and fine-tuning are not supported and ship only as pseudo-code; the checkpoint-modification recipe changes outputs, not learned parameters.
  last_verified: '2026-09-10'
  sources:
  - url: https://neuralgcm.readthedocs.io/en/latest/checkpoint_modifications.html
    shows: Distributes deterministic checkpoints at 0.7, 1.4 and 2.8 degrees plus a stochastic 1.4-degree model, and discusses long integrations and the stability of the simulated global mean surface pressure.
