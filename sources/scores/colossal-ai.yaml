  basis: feature_matrix
  value: 'Parallelism: data, pipeline, 1D/2D/2.5D/3D tensor, sequence, ZeRO and auto-parallelism; heterogeneous memory management
    (PatrickStar); MoE parallelism; ColossalChat RLHF pipeline with LoRA; published benchmarks of 7B on 8 and 70B on 16 H200
    or B200 GPUs, and a DeepSeek 671B fine-tuning guide. No published run at the thousands-of-GPU scale of Megatron-LM.'
  confidence: medium
  note: Colossal-AI composes data, pipeline, tensor and sequence parallelism with ZeRO and offloading, and carries RLHF and
    large-model fine-tuning recipes on top. It sits a step below Megatron-LM, whose published scaling runs reach thousands
    of GPUs where Colossal-AI's reach tens.
