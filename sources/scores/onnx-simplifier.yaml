capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: one optimization family, applied broadly'
  value: ONNX graph simplification (shape inference, optimizer passes, constant folding, opset conversion,
    custom rewriters) with converters to MLIR, Core ML and TFLite and quantization-aware fine-tuning. Broad
    coverage around an ONNX graph, no code generator or hardware target of its own.
  relative_to: tensorrt
  relation: one_below
  confidence: medium
  note: ONNX Simplifier runs shape inference, optimizer passes and constant folding to a fixed point and
    bridges the result to MLIR, Core ML and TFLite, with quantization-aware fine-tuning beside them. That
    is real coverage across several passes and routes, but the final lowering to a device is left to other
    tools, so it sits one step below TensorRT, which compiles and runs the model on NVIDIA hardware.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/onnxsim/onnxsim/master/README.md
    shows: README features list says "At its core onnxsim runs a fixed point of shape inference, graph optimization
      and" constant folding, and adds a Core ML export "via a built-in ONNX-to-MIL translator and" a TensorFlow
      Lite export "via a built-in ONNX-to-TensorFlow translator and" tf.lite.TFLiteConverter.
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 301f8659bdbd5f033b607865b896f1c1ed3d59dea8649b4a18183ae8caddc15f
