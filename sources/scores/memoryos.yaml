capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: retrieval across short-term history, mid-term segments, the user profile and user and assistant knowledge,
    per user; language-model extraction of profile traits and facts from dialogue; consolidation of dialogue into
    topic segments and rewrites of the profile; segment heat with time decay and least-frequently-used eviction;
    short, mid and long-term tiers with separate profile and knowledge stores
  confidence: medium
  note: 'MemoryOS covers the whole cycle: it summarizes dialogue into segments, promotes the ones a user keeps returning
    to into a profile and knowledge base, and lets cold segments cool and drop out as capacity fills. Its forgetting
    is driven by access and recency rather than by any check that a fact is still true.'
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/BAI-LAB/MemoryOS/main/README.md
    shows: Short-term dialogue is consolidated "into meaningful segments" in mid-term memory; segments accumulate
      "heat" and, past a threshold, "User profile insights are extracted" and facts added to user and assistant
      knowledge; the retriever reads all layers.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 1580d664129c9804fa59b1327952ec11bd504ec85672b214b76dc2a8fe1df151
  - url: https://raw.githubusercontent.com/BAI-LAB/MemoryOS/main/memoryos-pypi/mid_term.py
    shows: Segment heat adds a recency term from compute_time_decay with a 24-hour tau, and evict_lfu removes the
      session with the lowest access frequency when capacity is reached.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 4f6968d6dffae0c9521076ad638222ad4510d6d17181bd046a38d7c9cf4de6e9
  - url: https://raw.githubusercontent.com/BAI-LAB/MemoryOS/main/memoryos-pypi/updater.py
    shows: process_short_term_to_mid_term takes the QA pairs evicted from short-term memory, asks the model whether
      each continues the previous page, and summarizes them into mid-term memory.
    accessed: '2026-11-20'
    http_status: 200
