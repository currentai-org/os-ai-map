capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Farsi pretraining text
  value: About 15 billion words (130 GB) of cleaned Farsi text compiled from existing corpora, web and Telegram
    sources, documented in a journal paper and card, with a Farsi T5 and a Persian ALBERT trained on it.
  confidence: medium
  note: naab is the largest cleaned public Farsi pretraining corpus, at about 15 billion words, documented
    in a paper with its raw version and preprocessing code, and a Farsi T5 and a Persian ALBERT are trained
    on it. Its text is compiled from web and messaging sources rather than newly collected.
  last_verified: '2026-09-24'
  sources:
