capability:
  score: 5
  basis: feature_matrix
  value: '`POST /search` with a required `outputType` of `searchResults` (ranked {name, url, content}), `sourcedAnswer`
    ("search results plus a natural-language answer with inline citations") or `structured`; `POST /fetch`
    for a named URL; `POST /research` for the same sourced-answer shape asynchronously'
  confidence: high
  relative_to: perplexity-sonar-api
  relation: at
  note: 'Answers, with citations, and it is the same endpoint rather than a separate product: `sourcedAnswer`
    is one of three values of the required `outputType` on `/search`, priced at $0.006 against $0.005 for raw
    results. That is the distinction this category''s scoring rule turns on - Brave, Parallel and Kagi all
    fence their answer endpoints behind separate plans and stay at 4, while Linkup sells it as a parameter.
    Banded at perplexity-sonar-api, the other product whose ordinary search call returns a cited answer.'
  last_verified: '2026-09-17'
  sources:
  - url: https://docs.linkup.so/pages/documentation/endpoints/search/overview
    shows: '"Given a natural-language query, the /search route returns ranked sources, optionally bundled with
      a cited natural-language answer or with structured output matching a JSON schema." The outputType table:
      searchResults "Array of {name, url, content}"; sourcedAnswer "Search results plus a natural-language
      answer with inline citations"; structured. Pricing on the same page: $0.005 for searchResults against
      $0.006 for sourcedAnswer.'
