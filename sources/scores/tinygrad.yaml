capability:
  score: 4
  basis: feature_matrix
  value: Tensor library with autograd; its own IR and kernel compiler with fusion, scheduling and BEAM search; TinyJit
    graph capture and replay; nn, optim and datasets for training; backends for CPU, OpenCL, Metal, CUDA, AMD, NV,
    QCOM and WebGPU, with about 25 low-level ops needed for a new one; fewer functional transforms than JAX (no
    full vmap or pmap).
  relative_to: pytorch
  relation: one_below
  confidence: medium
  note: tinygrad trains and runs models end to end on its own compiler across eight families of hardware, which
    puts it among the foundational frameworks. It sits a step below PyTorch, whose distributed training and ecosystem
    it does not match, and its own README says it has fewer functional transforms than JAX.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/pytorch/pytorch/main/README.md
      shows: The PyTorch README still describes "Tensor computation (like NumPy) with strong GPU acceleration" and
        "Deep neural networks built on a tape-based autograd system", and its build instructions carry a torch.distributed
        option. tinygrad matches the first two and has no distributed training layer, so it stays one step behind.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 3ad49faff26017c7f237596385e355b4aa1c3e3b23c4c2ebad01f92def1f35b1
  last_verified: '2026-11-12'
  sources:
  - url: https://raw.githubusercontent.com/tinygrad/tinygrad/master/README.md
    shows: The README lists "Tensor library with autograd", "IR and compiler that fuse and lower kernels", "JIT
      + graph execution" and "nn / optim / datasets for real training"; "BEAM search over kernels"; "Fewer functional
      transforms (no full vmap/pmap yet)"; accelerators OpenCL, CPU, METAL, CUDA, AMD, NV, QCOM and WEBGPU; and
      "only needs to support a total of ~25 low level ops".
    accessed: '2026-11-12'
    http_status: 200
