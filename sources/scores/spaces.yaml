capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: managed container per Space (Docker), not microVM-grade for untrusted multi-tenant
    code; cold-start: free-tier Spaces sleep when idle and restart on the next visit, paid hardware never
    sleeps by default; language/runtime breadth: Gradio/Streamlit/Docker/static (broad for app hosting);
    persistence: ephemeral disk by default, attachable Storage Buckets volumes, Dev Mode over SSH; scale:
    free CPU Basic, shared ZeroGPU pool and paid T4/L4/L40S/A100 GPU tiers on HF infra'
  confidence: medium
  note: Spaces hosts machine-learning apps with broad SDK and GPU support, from a free CPU tier through
    paid GPU hardware, and a Space can also serve as an MCP server, agent tool or API endpoint. But each
    app runs in a managed Docker container rather than a hardened microVM, and free-tier Spaces sleep when
    idle, making it built for hosting and demoing apps rather than isolating untrusted code.
  last_verified: '2026-09-29'
