  banded_quantity: Hugging Face's own count of hosted Spaces apps (1M+), an inventory rather than a usage
    figure; the 50,000+ organizations it also cites are Hugging Face-wide, not Spaces users
  confidence: medium
  note: Spaces has no count anyone outside Hugging Face can check. Hugging Face describes it on its own
    homepage as hosting more than a million apps, but publishes no visitor or usage numbers, and a Space
    is neither a package nor a registry entry, so no download feed covers it. The reading comes from that
    disclosure alone, which is why it is recorded as a claim about standing rather than a measured count.
