capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: retrieval of the most relevant memory and skill files before a task, scoped to the user; extraction jobs
    built from raw session transcripts and tool traces under memU's own instructions, run on the host agent's model;
    patching of existing memory and skill files in place instead of adding duplicates; separate chat memory, workspace
    index and skill stores; no time-based expiry or decay
  confidence: medium
  note: memU mines session logs and tool traces itself, has the host agent's model distill them under its own instructions,
    merges new knowledge into existing memory and skill files, and retrieves across three separate stores. It does
    not retire memories as they age.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/NevaMind-AI/memU/main/README.md
    shows: The README says a scheduled bridging task "slices new session logs into self-contained job files; the
      agent itself distills them into memory/skill Markdown", which memU commits, indexes and retrieves before answering,
      and that "MemoryService makes no LLM or chat calls".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: f17efd006ba8943aa7f3658f5b9571df59b418b8128cff53c3c818fa4df125a8
  - url: https://raw.githubusercontent.com/NevaMind-AI/memU/main/src/memu/hosts/bridging/instructions.py
    shows: The job templates tell the agent to read existing memory or skill files, then do nothing, patch an existing
      file with the merged content, or create a new one.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 9387ee9a8daa2ee9f43917487ad154d8bf013f840434ca94e64f894e16279673
  - url: https://raw.githubusercontent.com/NevaMind-AI/memU/main/docs/adr/0007-three-independent-memory-lines-wiki-graph.md
    shows: The design record splits memory into three lines, chat to MEMORY.md, workspace files to INDEX.md and
      execution traces to SKILL.md, each with its own store and hybrid embedding and BM25 retrieval.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 08abf916b00d503715d4b3651ff1f5dfa6771caadfc8ea3f895ba075f9c994ce
