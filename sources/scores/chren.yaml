capability:
  score: 1
  basis: feature_matrix
  basis_detail: coverage and downstream use for Cherokee-English parallel text
  value: ChrEn holds about 14,000 Cherokee-English sentence pairs aligned from published translations plus
    5,000 Cherokee sentences, documented in an EMNLP paper, with no use found beyond that paper and its authors'
    demo.
  confidence: medium
  note: ChrEn is the main open parallel corpus for Cherokee, aligning published translations with English and
    adding monolingual Cherokee sentences, and it is documented in an EMNLP paper, though no use beyond its
    authors' demo turned up. At about fourteen thousand sentence pairs it is minute beside the billions of
    pairs in the largest parallel collections, and about a hundredth the size of the IIT Bombay English-Hindi
    corpus, which serves a single language pair.
  relative_to: iitb-english-hindi
  relation: one_below
