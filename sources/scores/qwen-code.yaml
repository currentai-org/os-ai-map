capability:
  score: 5
  basis: feature_matrix
  value: terminal coding agent with sub-agents, agent teams, dynamic workflows, hooks, auto-memory and skills; MCP,
    plan mode, LSP integration, sandbox and git worktrees; computer use; OpenAI, Anthropic, Gemini and Qwen APIs
    plus third-party and local models, switchable at runtime; VS Code, Zed and JetBrains plugins, desktop app, web
    UI and Telegram, DingTalk, WeChat and Feishu channels; headless mode, ACP daemon and TypeScript, Python and Java
    SDKs; vendor-run SWE-bench Verified averages of 76.40% to 77.80% across seven versions on Qwen 3.7 Max
  confidence: medium
  note: Qwen Code covers the same ground as OpenHands and as Gemini CLI, the agent it was forked from, with sub-agents
    and agent teams, MCP, plan mode, a sandbox, computer use and many model providers, plus editor, desktop, web
    and chat front ends and SDKs in three languages. Its SWE-bench Verified results come from the Qwen Code team
    running its own model rather than from an independent board, the same limit that applies to the scores OpenHands
    publishes.
