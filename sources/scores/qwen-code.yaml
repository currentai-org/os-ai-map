adoption:
  level: 3
  reach: 100K-1M
  signal_type: usage_volume
  confidence: medium
  note: Adoption is the trailing month of npm downloads of @qwen-code/qwen-code, the package that is the CLI itself,
    and the Homebrew package installs the same npm tarball. The README leads with a standalone installer that fetches
    a prebuilt archive from Alibaba Cloud storage or GitHub releases and falls back to the npmmirror registry. None
    of those installs reach the npm count, so the band is a floor.
