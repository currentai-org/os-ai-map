  value: 'Methods: LoRA + full fine-tuning, preference (DPO), function-calling, reasoning, vision-language
    FT; demonstrated tuning of 100B+ open models (DeepSeek-V3, Qwen3-235B). Managed end-to-end (prep ->
    train -> dedicated-endpoint serve).'
  confidence: medium
  note: 'Broad managed method coverage over large open models: LoRA and full fine-tuning, DPO preference
    tuning, function-calling, reasoning and vision-language tuning, with demonstrated tuning of 100B+ models
    such as DeepSeek-V3 and Qwen3-235B, and an end-to-end path from data preparation through training to
    a dedicated serving endpoint. That is the widest open-model scale among the managed services here. It
    remains a black box with limited scale and precision control and no training benchmark behind it, so
    it is capped below the open-source libraries that define scale, and sits level with the OpenAI and Azure
    fine-tuning APIs.'
