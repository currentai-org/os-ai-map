capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: LoRA + full fine-tuning, preference (DPO), function-calling, reasoning, vision-language
    FT; demonstrated tuning of 100B+ open models (DeepSeek-V3, Qwen3-235B). Managed end-to-end (prep ->
    train -> dedicated-endpoint serve).'
  confidence: medium
  note: Together Fine-Tuning offers LoRA and full-parameter tuning with supervised, preference, function-calling,
    reasoning and vision-language methods on open-weight models, with full-parameter tuning up to 70B-class
    models and LoRA on much larger ones. It runs as a managed service rather than exposing a training framework,
    so it offers breadth of methods without the parallelism and precision controls of Megatron-LM.
  last_verified: '2026-09-28'
