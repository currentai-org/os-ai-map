  note: pgvectorscale installs as a Postgres extension via Docker or from source rather than through a PyPI
    or npm package, and no distribution channel publishes a comparable download count, so GitHub stars are
    the only adoption signal available. A star reflects interest rather than confirmed use, so it cannot
