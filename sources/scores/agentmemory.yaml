capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: hybrid BM25, vector and graph recall scoped by project and agent; LLM-written session summaries, compressed
    observations and knowledge-graph extraction; consolidation that supersedes old versions and resolves contradictions;
    Ebbinghaus-style decay, TTL expiry and importance eviction; working, episodic, semantic and procedural tiers
    beside a knowledge graph
  confidence: medium
  note: agentmemory captures coding-agent activity itself, condenses it with a language model into summaries, facts
    and procedures, supersedes outdated versions and lets unused memories decay and expire. Its extraction and consolidation
    run only once a model provider is configured; without one it stores observations and recalls them by keyword.
  relative_to: graphiti
  relation: at
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/rohitg00/agentmemory/main/README.md
    shows: The README's memory pipeline runs session summaries, knowledge-graph extraction and slot reflection at
      session end; its consolidation tiers are working, episodic, semantic and procedural, and "Memories decay over
      time (Ebbinghaus curve)... Stale memories auto-evict. Contradictions are detected and resolved."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: ce5f1ed3ddca1b79d29502fc0123fd7286ae71e5a41ab07ca7be4dc9f22e34a0
