    shows: The PyPI JSON for llamafirewall 1.0.3 carries the package README, which describes the harness
      as combining "PromptGuardScanner, AlignmentCheckScanner, CodeShieldScanner, and customizable regex
      filters", built "for low-latency environments with support for high-throughput pipelines", with PromptGuard
      2 a classifier that "detects direct prompt injection attempts", AlignmentCheck built to "detect goal
      hijacking, indirect prompt injections, and signs of agent misalignment", and CodeShield a static analysis
      engine that "examines LLM-generated code for security issues in real time". It notes that for the
      alignment check scanner "you will need to set up the Together API key in your environment".
