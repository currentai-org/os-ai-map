  basis: feature_matrix
  basis_detail: layered agent defenses
  value: 'Layered, agent-focused defenses: jailbreak/injection detection (Prompt Guard 2), agent-alignment/goal-hijack
    checks, and insecure-code filtering (CodeShield) in one real-time firewall.'
  confidence: medium
  note: LlamaFirewall is aimed at agent security rather than chat moderation alone. Beyond screening inputs
    for injection, it audits an agent's reasoning for goal hijacking and scans the code an agent writes
    before it runs.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/meta-llama/PurpleLlama
    shows: Root README describes Purple Llama as an umbrella project and tables its components - Cyber Security
      Eval under MIT, the Llama Guard family and Prompt Guard under Llama Community licenses, and Code Shield
      under MIT, which it describes as inference-time filtering of insecure generated code, code-interpreter
      abuse prevention and secure command execution. It does not mention LlamaFirewall.
