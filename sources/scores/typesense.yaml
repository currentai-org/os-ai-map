  value: Full-text, vector and hybrid retrieval with faceting, filtering, geosearch and merchandising rules, from
    an in-memory engine that clusters for high availability.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Typesense is a complete in-memory search engine with full-text, vector and hybrid retrieval, faceting,
    filtering, geosearch and merchandising rules, clustered for high availability with each node holding
    a full copy of the data. It sits one step below Vespa, which distributes data across a cluster and covers
    more of the retrieval path.
