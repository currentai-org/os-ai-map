capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Templated GEMM and convolution primitives spanning warp, block and device levels of CUDA, with
    CuTe layout algebra. Vendored as a git submodule by PyTorch (third_party/cutlass) and by FlashAttention
    (csrc/cutlass).
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: PyTorch and FlashAttention each vendor CUTLASS directly as a submodule and build against its headers.
    It covers one layer of the kernel stack rather than the full path from a framework graph to a target,
    which keeps it one step below Apache TVM.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/NVIDIA/cutlass/main/README.md
    shows: README describes CuTe as "a collection of C++ CUDA template abstractions for" tensors of threads
      and data, states "CUTLASS 3.0 and beyond adopts CuTe throughout the GEMM hierarchy in its templates."
      and "This release has been tested against the following packages:" listing FlashAttention, Pytorch
      and TensorRT-LLM.
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: ac863a852860b6b8ee56c9c3656093d0af311103e7c518412e7d01f64477dea5
