capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: an operator surface frameworks declare a dependency on'
  value: Templated GEMM and convolution primitives spanning warp, block and device levels of CUDA, with
    CuTe layout algebra. Vendored as a git submodule by PyTorch (third_party/cutlass) and by FlashAttention
    (csrc/cutlass).
  relative_to: apache-tvm
  relation: one_below
  confidence: medium
  note: CUTLASS supplies templated GEMM and convolution primitives across the warp, block and device levels
    of CUDA, with CuTe layout algebra - a wide operator surface. PyTorch and FlashAttention each vendor
    it directly as a submodule and build against its headers, the strongest evidence of a dependency; NVIDIA's
    own compatibility testing against TensorRT-LLM, FlashInfer and cuDNN-Frontend corroborates without deciding
    it. It covers one layer of the stack rather than the full path from a framework graph to a target, which
    keeps it below Apache TVM.
  last_verified: '2026-08-18'
  sources:
  - url: https://github.com/NVIDIA/cutlass/blob/main/README.md
    shows: README still documents C++ abstractions for high-performance GEMM and related computations at
      every level of the CUDA hierarchy, with hierarchical decomposition and data movement specialized through
      tiling sizes, data types and algorithmic policy.
    accessed: '2026-08-18'
    http_status: 200
    content_sha256: f9bf5185585cf851146c382bccd5a897f9b6ad264aad3ce28cacd8c2746f4f98
