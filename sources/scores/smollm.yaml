capability:
  score: 3
  basis: benchmark
  basis_detail: reasoning/multilingual
  value: 'Outperforms Llama-3.2-3B and Qwen2.5-3B; competitive with 4B Qwen3/Gemma3. Apertus report, one
    harness, post-trained averages (knowledge / coding and math / reasoning / held-out): SmolLM3-3B 54.4
    / 58.5 / 59.9 / 49.2, Apertus-70B-Instruct 63.4 / 54.4 / 61.8 / 51.4, EuroLLM-22B-Instruct-Preview 58.3
    / 53.0 / 58.8 / 50.2, Llama-3.1-8B-Instruct 59.2 / 60.0 / 63.9 / 50.3.'
  confidence: medium
  note: SmolLM3-3B outperforms Llama-3.2-3B and Qwen2.5-3B and stays competitive with the larger 4B Qwen3
    and Gemma 3, with a reasoning mode, tool calling and a 128K context. In the Apertus report's shared
    evaluation of instruction-tuned models it lands close to Apertus-70B, a preview of EuroLLM-22B and Llama
    3.1 8B, ahead of Apertus on coding and math and behind all three on knowledge recall. As a base model
    it trails those larger models on knowledge, as a 3B model would.
  last_verified: '2026-11-12'
  sources:
  - url: https://huggingface.co/blog/smollm3
    shows: The release post states "Our 3B model outperforms Llama-3.2-3B and Qwen2.5-3B while staying competitive
      with larger 4B alternatives (Qwen3 & Gemma3)".
