openness:
  score: 5
  class: open_source
  components:
    weights:
      value: open
      detail: Apache-2.0
    data:
      value: open
      detail: 'public data mixtures, ~11T tokens. The web share is FineWeb-Edu, DCLM, FineWeb-2 and FineWeb2-HQ,
        each built from named Common Crawl snapshots, released under ODC-By or CC-BY-4.0 and bound to Common
        Crawl''s terms, which leave page rights with their owners; opt-outs follow CCBot''s crawl-time robots.txt
        check, and FineWeb''s PII and opt-out form takes removals. DCLM''s research-use line is advisory.
        One constituent is non-commercial: the dataset facebook/natural_reasoning, licensed CC-BY-NC-4.0,
        enters at the third, decay stage at a weight of 0.001 of that stage''s mix in the published stage-3
        config, and the two long-context extension mixes carry it at about 0.0009. It is a separately published
        dataset that a reuser can drop from those mixes, so it is disclosed rather than disqualifying; this
        is not a claim that every training example is commercially reusable'
    code:
      value: open
      detail: training+post-training recipe published
    checkpoints:
      value: open
      detail: SmolLM3-3B-checkpoints, every 40k steps
    license:
    - name: Apache-2.0
      detail: OSI
  confidence: high
  note: 'SmolLM3 publishes Apache-2.0 weights alongside a complete engineering blueprint: architecture details,
    exact data mixtures and training methodology for its 11-trillion-token run, built from public datasets
    and training frameworks. Most of the data is filtered Common Crawl text released under open compilation
    licenses, while the crawled pages keep their owners'' rights; one small reasoning set in the final stage
    is non-commercial. The Hugging Face card is Apache-2.0 licensed and ungated.'
