  note: Bedrock Evaluations covers models and RAG systems with judge-model, programmatic and human grading,
    four families of metrics, and bring-your-own inference responses for models hosted elsewhere. It evaluates
    custom datasets rather than running a standardized public benchmark leaderboard.
  sources:
  - url: https://aws.amazon.com/bedrock/evaluations/
