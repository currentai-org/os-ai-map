      datasets" plus "BERT Score, F1, and other exact matching techniques", human evaluation with "your
      own workforce or have AWS manage your evaluations", and RAG retrieval-only and retrieve-and-generate
      evaluation. States "You can evaluate Bedrock models or any model anywhere by bringing your own inference
      responses in your input prompt dataset".
