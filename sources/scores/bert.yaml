capability:
  score: 1
  basis: benchmark
  basis_detail: GLUE and SQuAD results in the 2018 paper
  value: GLUE score 80.5, MultiNLI accuracy 86.7, SQuAD v1.1 test F1 93.2 and SQuAD v2.0 test F1 83.1
    at release (arXiv:1810.04805), the state of the art on eleven tasks in 2018. A 340M-parameter encoder
    that does not generate text.
  relative_to: comma
  relation: one_below
  confidence: high
  note: BERT set the state of the art on eleven language-understanding tasks in 2018, but it is an encoder
    of at most 340M parameters that cannot generate text, and the benchmarks used for today's language
    models do not apply to it. It sits a step below Comma, a 7B model that only matches 2023-era peers.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/common-pile/comma-v0.1-2t/raw/main/README.md
      shows: Comma v0.1-2T card still reports an 11-task average of 57.4 and says "It performs comparably
        to budget-matched models (7 billion parameters, 2 trillion tokens) trained on unlicensed data",
        the placement the comparison relies on.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 0cd34d6d1211c0d603e98ba2812945376584b615b08089a92d39b987f8e2ec9c
  last_verified: '2026-11-12'
  sources:
  - url: https://arxiv.org/abs/1810.04805
    shows: 'Abstract: BERT "obtains new state-of-the-art results on eleven natural language processing
      tasks, including pushing the GLUE score to 80.5% ..., MultiNLI accuracy to 86.7% ..., SQuAD v1.1
      question answering Test F1 to 93.2 ... and SQuAD v2.0 Test F1 to 83.1".'
    accessed: '2026-11-12'
