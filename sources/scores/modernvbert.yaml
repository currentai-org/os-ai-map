capability:
  score: 3
  basis: benchmark
  basis_detail: ViDoRe v1 and ViDoRe v2 (English) visual document retrieval, nDCG@5
  value: 81.2 on ViDoRe v1 and 56.0 on ViDoRe v2 English, a 68.6 average, at 250M parameters - level with
    the original 2.92B ColPali and far ahead of every other sub-1B entry, but roughly seven points of
    average below the ColQwen tier.
  relative_to: colpali
  relation: one_below
  confidence: high
  note: In its paper's table, ModernVBERT's published numbers lead the other sub-1B models. English-only
    coverage and 250M parameters keep it a notch under ColPali, which scores slightly higher on the same
    benchmark.
  last_verified: '2026-11-16'
  sources:
  - url: https://arxiv.org/html/2510.01149v1
    shows: 'Table 3 nDCG@5 (ViDoRe v1 / v2 / average): ColModernVBERT (ours) 0.25B 81.2 / 56.0 / 68.6; ColPali
      2.92B 81.6 / 56.8 / 69.2; ColQwen2.5 3.75B 89.5 / 61.5 / 75.5; ColFlor 0.17B 68.8 / 43.0 / 55.9. The
      caption says ColModernVBERT "offers the best performance-size tradeoff, significantly outperforming
      existing sub-1B models".'
    accessed: '2026-11-16'
