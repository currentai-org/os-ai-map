  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: Configuration-driven simulation locally or in Docker; a server deployable on a public cloud over HTTPS
    with remote clients; LoRA fine-tuning of Hugging Face causal language models; a homomorphic-encryption secure-aggregation
    example.
  confidence: medium
  relative_to: flower
  relation: one_below
  note: Plato can run a real federation, with a server behind HTTPS that remote clients reach over the network.
    Its deployment guide secures the server alone and has no way to identify the parties, which keeps it
    one step below Flower.
  last_verified: '2026-09-27'
  sources:
