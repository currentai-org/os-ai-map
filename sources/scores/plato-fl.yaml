    shows: 'Deployment: "The Plato federated learning server is designed to use Socket.IO over HTTP and HTTPS, and
      can be easily deployed in a production server environment in the public cloud"; the guide configures the server''s
      certificate behind nginx and Cloudflare, with no client identity step.'
