capability:
  score: 3
  basis: feature_matrix
  value: isolation:OS-level process sandbox (Linux bubblewrap namespaces+seccomp BPF, macOS Seatbelt)
    - weaker boundary than gVisor/microVM, no kernel isolation; cold-start:near-zero (no container/VM
    spin-up); runtime breadth:any local process (language-agnostic, host-defined); persistence:n/a (host
    fs, deny/allow rules); scale:per-host, no managed fleet
  confidence: medium
  note: Best-in-class for low-overhead, no-container process isolation with fine-grained fs+network allow/deny
    and pre-built seccomp filters; but a process-level sandbox is a weaker security boundary than the microVM/gVisor
    frontier and offers no managed scale, so 3. Seccomp filters are x64/arm64 only, with unix sockets going
    unrestricted where seccomp is unavailable, and the tool ships no managed or multi-host mode.
  last_verified: '2026-08-13'
  sources:
  - url: https://github.com/anthropic-experimental/sandbox-runtime
    shows: bubblewrap+seccomp / sandbox-exec isolation, filesystem+network restriction model, no container
    accessed: '2026-06-04'
  - url: https://raw.githubusercontent.com/anthropic-experimental/sandbox-runtime/main/README.md
    shows: Native OS primitives (sandbox-exec on macOS, bubblewrap on Linux) plus a filtering proxy;
      filesystem, network and unix-socket restrictions; seccomp filters limited to x64/arm64 with a
      warning when unavailable; single-host CLI and library, no fleet or managed tier.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 9ec3d585692e4bd6aff8dd807784d6d97595bc5fe48d6824ca2dd823c874776b
