capability:
  score: 3
  basis: feature_matrix
  value: forecasting and anomaly detection over baselines, statistical models (ARIMA, ETS, Theta, TBATS,
    Prophet and statsforecast's Auto models), regression models (scikit-learn, LightGBM, XGBoost, CatBoost),
    deep models (RNN, N-BEATS, N-HiTS, TCN, Transformer, TFT, TiDE, TSMixer) and pretrained foundation
    models (Chronos-2, TimesFM, TiRex), with backtesting, ensembling and conformal prediction
  relative_to: sktime
  relation: at
  confidence: high
  note: Darts puts dozens of forecasting models behind one interface and makes them easy to compare, as
    sktime does, and both run pretrained foundation models that forecast a new series with no training.
    Choosing among the models is still the user's work.
  comparison:
    last_attested: '2026-09-27'
    sources:
