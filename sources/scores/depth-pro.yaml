capability:
  score: 4
  basis: feature_matrix
  value: metric depth with absolute scale and a focal-length estimate from a single image of any scene, with no
    training and no camera intrinsics; a 2.25-megapixel depth map in 0.3 seconds on a standard GPU
  relative_to: depth-anything
  relation: at
  confidence: high
  note: Depth Pro returns a metric depth map for any image the user supplies, without training, as Depth Anything
    does. It works from one image at a time, where Depth Anything 3 also takes several views and estimates camera
    pose.
