capability:
  score: 4
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: GPU-parallel MuJoCo Warp simulation across thousands of environments and multiple GPUs, a CameraSensor that renders
    batched RGB and depth images on the GPU with MuJoCo Warp's ray tracer, raycast, contact and tactile sensors, and reference
    tasks for velocity tracking, motion imitation, cube lifting and cartpole. One physics engine.
  relative_to: isaac-lab
  relation: one_below
  confidence: medium
  note: mjlab runs thousands of MuJoCo Warp environments in parallel on the GPU and renders camera images for all of them
    in the same batch. It has one physics engine and a handful of reference tasks, where Isaac Lab offers several physics
    backends and more than thirty ready-to-train environments, so it sits a step below.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/isaac-sim/IsaacLab/main/README.md
      shows: Re-read of the peer. Isaac Lab's README still calls it "a multi-backend framework supporting physics and rendering
        through Newton, OVRTX, OVPhysX, and NVIDIA Isaac Sim" and lists "Ready-to-train implementations of more than 30 environments"
        and "RGB/depth/segmentation cameras", the backend choice and task library that separate it from single-engine frameworks.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: c5b92a73ef6a10e8c7f12786be84205d5e495b1ad05516e2d8d799e75f130eb4
