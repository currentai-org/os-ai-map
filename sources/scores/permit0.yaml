capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: every tool call normalized to a canonical action and allowed, denied or escalated by deterministic risk
    policy before it runs; medium- and high-risk actions and unknown actions held for human approval in the dashboard;
    an Ed25519-signed hash-chained audit trail; no identity issued to the agent; no delegation of authority between
    users and agents
  confidence: medium
  note: Permit0 decides each agent action against policy before it runs, routes risky or unrecognized actions to
    a person, and signs its audit trail. It gives agents no identity of their own and has no way to pass narrowed
    authority from one agent or user to another.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/permit0-ai/permit0/main/README.md
    shows: The README describes normalization, risk scoring and tier routing to "Allow", "Deny" or "Human review",
      says "unknown actions queue for human approval", and lists "Signed audit" as an "ed25519 hash chain".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 5260691b0f3a9f5e57b7fd4811fa46ab5153a12f4a25fe3be62a8d09e5551202
