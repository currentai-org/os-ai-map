capability:
  score: 3
  basis: feature_matrix
  value: COCO-pretrained detection (AP50:95 48.4 Nano to 60.1 2XL), instance segmentation and keypoint checkpoints
    with a fine-tuning pipeline for custom datasets
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: RF-DETR's 2XL size is described by its authors as the first real-time detector above 60 AP on COCO, and
    the line ships detection, segmentation and keypoint heads. Detecting anything beyond COCO's 80 classes still
    takes a fine-tuning run, which puts it beside Ultralytics YOLO rather than beside the models that work on a
    new task untrained.
  last_verified: '2026-09-26'
