capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for crowdsourced multilingual speech
  value: Crowdsourced read speech recorded and validated by volunteers, about 42,600 hours (29,300 validated)
    in 295 languages, documented in an LREC paper and per-language datasheets, with DeepSpeech experiments
    and the comparison models in Meta's MMS paper trained on it.
  confidence: medium
  note: Common Voice is the largest public-domain speech corpus by hours and languages, recorded and checked
    by volunteers and documented language by language. Mozilla's DeepSpeech experiments and the comparison
    recognizers in Meta's MMS work are trained on it, and the MMS paper found those models did better on FLEURS
    than ones trained on Bible readings.
  last_verified: '2026-09-24'
  sources:
  - url: https://raw.githubusercontent.com/common-voice/cv-dataset/main/README.md
    shows: 'Scripted Speech: 27 releases, latest v27.0, 295 languages; hours chart ends at 42,593 total and
      29,295 validated.'
