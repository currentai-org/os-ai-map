  value: 'Methods exposed: SFT, vision fine-tuning, DPO (preference), reinforcement fine-tuning (RFT)
    for reasoning models. Tunes frontier closed models (gpt-4.1 family, gpt-4o, o4-mini). Managed end-to-end
    (data validation, training, hosting, eval).'
  confidence: medium
  note: OpenAI's fine-tuning API runs supervised, vision, preference and reinforcement fine-tuning against
    its own gpt-4.1, gpt-4o and o4-mini models, handled end to end. It exposes no controls over parallelism,
    precision or training scale, so it offers managed breadth over strong base models rather than the deeper
    control a training framework gives.
