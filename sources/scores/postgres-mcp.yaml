  score: 3
  basis: feature_matrix
  value: a curated tool surface over a PostgreSQL database - schema and object inspection, SQL execution under
    access modes, EXPLAIN with hypothetical indexes, slow-query analysis, index advice and health checks -
    against a connection string the caller supplies
  confidence: medium
  note: The server covers one system, PostgreSQL, with the caller supplying credentials through a DATABASE_URI
    environment variable rather than the server authenticating on its own. Its tooling goes deep - index
    advising and health checks are DBA work, not simple CRUD - but depth of coverage is not what earns a
    higher score, so postgres-mcp lands at the same level as Playwright MCP.
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/crystaldba/postgres-mcp/main/README.md
    shows: The README's configuration passes `DATABASE_URI` as an environment variable to the container - "postgresql://..."
      supplied by the caller - with `--access-mode` controlling what the server may execute. The tools cover
      schema inspection, SQL execution, EXPLAIN with hypothetical indexes, slow-query analysis, index advice
      and health checks.
