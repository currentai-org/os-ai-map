capability:
  score: 5
  basis: benchmark
  basis_detail: SWE-bench Verified
  value: An autonomous coding agent that modifies code, runs commands, browses the web and calls APIs inside
    a sandboxed Docker runtime, model-agnostic with bring-your-own-key, driven from a GUI, a CLI or headless;
    its Agent Canvas control center also runs OpenHands, Claude Code, Codex, Gemini or any ACP-compatible
    agent across local, remote and cloud backends.
  confidence: high
  note: OpenHands is a sandboxed, model-agnostic coding agent that also runs other coding agents, including
    Claude Code, Codex and Gemini, through its Agent Canvas control center. Its maintainers publish the
    OpenHands Index, a public board scoring model configurations on SWE-bench and other tasks, but that
    board is run by the vendor rather than an independent party.
