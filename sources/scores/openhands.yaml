capability:
  score: 5
  basis: benchmark
  basis_detail: SWE-bench Verified
  value: An autonomous coding agent that modifies code, runs commands, browses the web and calls APIs inside a sandboxed
    Docker runtime, model-agnostic across 100+ providers with bring-your-own-key, driven from a GUI, a CLI or headless;
    and, added since this band was set, an Agent Canvas control centre that runs OpenHands, Claude Code, Codex,
    Gemini or any ACP-compatible agent across local, remote and cloud backends.
  confidence: high
  note: OpenHands leads the open coding-agent field, with an independent benchmark roundup crediting it
    72% on SWE-bench Verified and 67.9% on GAIA, ahead of Devin 2.0 and Cursor's Background Agent. Its own
    OpenHands Index leaderboard places its best non-outlier run at 83.8, the strongest among the seventeen
    open-weights models it tracks.
