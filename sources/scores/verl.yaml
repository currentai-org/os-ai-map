  value: 'Methods: PPO, GRPO, RLOO, ReMax, REINFORCE++, GSPO, PRIME, DAPO, DrGRPO, plus SFT/DPO; HybridFlow
    hybrid-controller; multiple FSDP/Megatron backends; SGLang/vLLM rollout; used to train frontier reasoning
    models at scale.'
  confidence: high
  note: verl supports a wide range of reinforcement-learning algorithms, including PPO, GRPO, RLOO, ReMax,
    REINFORCE++, GSPO, PRIME, DAPO and DrGRPO alongside supervised fine-tuning. It is built on the HybridFlow
    hybrid controller with FSDP and Megatron training backends and vLLM or SGLang rollout, scales to 671B-parameter
    models, and was used to train ByteDance's Seed-Thinking-v1.5, which puts it level with Megatron-LM.
  relative_to: megatron-lm
