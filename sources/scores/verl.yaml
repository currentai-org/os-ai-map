      training, vLLM and SGLang rollout, and "Reinforcement learning with [PPO](examples/ppo_trainer/)"
      alongside GRPO, GSPO, ReMax, REINFORCE++, RLOO, PRIME, DAPO and DrGRPO plus supervised fine-tuning;
