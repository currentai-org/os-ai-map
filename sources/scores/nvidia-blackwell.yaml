capability:
  score: 5
  basis: feature_matrix
  basis_detail: peak throughput and memory per unit from the vendor's own specification
  value: 'Blackwell Ultra (GB300): 15 PFLOPS dense FP4 and 5 PFLOPS dense FP8 per GPU, 279 GB HBM3E at 8 TB/s, up
    to 1,400 W. B200 (HGX): 4.5 PFLOPS dense FP8, 180 GB HBM3E'
  confidence: high
  note: Each Blackwell Ultra GPU delivers about 5 PFLOPS of dense FP8 and 15 of dense FP4, with 279 GB of HBM3E,
    and 72 of them share one NVLink domain in a GB300 rack. That per-package compute and memory is the frontier
    the rest of this category is measured against.
  last_verified: '2026-09-26'
