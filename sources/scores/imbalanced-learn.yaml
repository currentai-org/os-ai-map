  score: 2
  basis: feature_matrix
  value: resampling transformers (SMOTE variants, ADASYN, NearMiss, Tomek links, edited nearest neighbours,
    combined SMOTE-ENN and SMOTE-Tomek) and one family of imbalance-aware ensemble classifiers (balanced
    bagging, balanced random forest, EasyEnsemble, RUSBoost)
  relative_to: xgboost
  relation: at
  confidence: medium
  note: imbalanced-learn fixes the class balance of the training data and adds a handful of ensembles
    built for skewed classes. It is a specialist add-on to scikit-learn, whose other learners it relies
    on, rather than a toolkit for choosing among many kinds of model.
