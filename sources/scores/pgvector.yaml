adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: The pgvector PyPI package is pgvector-python, a client helper for talking to the extension from
    Python, so its download count belongs to that library rather than to the extension itself. The extension
    ships through operating-system distribution packages, PGXN and managed-Postgres vendors, none of which
    publish a comparable count, leaving GitHub stars as the only available adoption signal.
  last_verified: '2026-08-18'
  sources:
