capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Exact and approximate nearest neighbour search with IVFFlat and HNSW over four vector types and six distance
    metrics, inheriting persistence and transactions from Postgres rather than implementing them.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: pgvector adds exact and approximate nearest-neighbor search to Postgres, over four vector types
    and six distance metrics, using Postgres's own storage, transactions and durability rather than building
    them itself. It relies on Postgres for the rest of the retrieval system, which keeps it two steps below
    Vespa, a complete distributed retrieval system.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/pgvector/pgvector/master/README.md
    shows: README lists "exact and approximate nearest neighbor search" over "single-precision, half-precision,
      binary, and sparse vectors" with "L2 distance, inner product, cosine distance, L1 distance, Hamming
      distance, and Jaccard distance", plus "compliance, point-in-time recovery, JOINs, and all of the other"
      Postgres features.
    accessed: '2026-09-30'
    http_status: 200
    content_sha256: 54cb3a5f4344308476cb2378469ac77d10fbff415d1b5be66608bb386ce8f527
  - url: https://raw.githubusercontent.com/pgvector/pgvector/master/README.md
    shows: 'README describes indexing: "An HNSW index creates a multilayer graph." and "An IVFFlat index
      divides vectors into lists, and then searches a subset of those lists that are closest to the query
      vector."'
    accessed: '2026-09-30'
    http_status: 200
