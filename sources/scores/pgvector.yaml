    abstains. The recorded pair is the one the ladder would produce for a public, ungated, OSI-licensed product,
    and adding `PostgreSQL` to the shared tier is a rubric decision for a maintainer rather than a per-product fix.
    No other product on the map records this licence, so the ruling would move no existing score.
