capability:
  score: 5
  basis: feature_matrix
  value: Foundational, fast multi-algorithm tokenization with training, normalization, and pre/post-processing.
  confidence: high
  note: Tokenizers trains new vocabularies and runs BPE, WordPiece and Unigram tokenization in Rust, with
    alignment-tracking normalization and truncation, padding and special-token processing. The Transformers
    library depends on it directly.
