capability:
  score: 4
  basis: feature_matrix
  basis_detail: embodiment generality
  value: Cross-embodiment VLA pretrained for humanoid and bimanual manipulation, with post-training sets for bimanual
    Panda, the GR1 humanoid, single-arm Panda and Unitree G1; a documented path for fine-tuning to a new embodiment.
  confidence: medium
  note: GR00T is pretrained across robot bodies and aimed squarely at humanoids, with released data for bimanual
    arms, the GR1 humanoid and the Unitree G1, and a documented recipe for adapting it to a new robot. It has no
    separate reasoning and planning model of the kind Gemini Robotics pairs with its action model.
  relative_to: gemini-robotics
  relation: one_below
  last_verified: '2026-09-26'
