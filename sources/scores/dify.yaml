adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: high
  note: Dify ships as a self-hosted Docker Compose stack with a managed cloud beside it, publishes no install,
    download or user figure, and has no first-party registry package, leaving GitHub stars as the only comparable
    adoption signal. Because a star reflects interest rather than use, that signal alone cannot show more
    than modest, early-stage adoption.
