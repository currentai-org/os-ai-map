  note: 'The Dify Open Source License is Apache-2.0 with added conditions: a multi-tenant service restriction
    and branding requirements. That puts it outside OSI approval and charges for a class of use, so the
    published source does not make the product freely runnable - you can read it but not run it freely,
    which is what source-available scores here. Cloud and enterprise tiers sit alongside it. The vendor
    says as much in its own words, describing the product as source-available under an "Apache-2.0-derivative
    license", self-hostable with a single Docker command, next to its cloud tier; the repo publishes the
    whole runtime, and GitHub declines to place the license under a recognized SPDX badge.'
