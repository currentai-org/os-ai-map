  confidence: high
  note: 'The Dify Open Source License is Apache-2.0 with added conditions: a multi-tenant service restriction
    and branding requirements. That puts it outside OSI approval and charges for a class of use, so the
    public source does not make the product freely runnable. Cloud and enterprise tiers sit alongside it.
    The software ladder has rungs at 1, 2, 4 and 5 and none at 3, so 3/source_available is not a pair any
    rule could produce; the ladder scores "you can read it and not run it freely" at 2. The vendor says
    so in its own words, describing the product as source-available under an "Apache-2.0-derivative license",
    self-hostable with a single Docker command, alongside its cloud tier; the repo publishes the whole runtime
    and GitHub declines to place the license under an SPDX badge.'
