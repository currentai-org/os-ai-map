  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for a multilingual topic classification set
  value: SIB-200 labels 1,004 FLORES-200 sentences per language with seven topics across 205 languages, documented
    in a paper, with no named model or benchmark found beyond its own baselines.
  confidence: medium
