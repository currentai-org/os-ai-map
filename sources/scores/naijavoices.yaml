  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Nigerian-language speech
  value: About 1,800 hours of speech from more than 5,000 speakers with expert-curated text, about 600 hours
    each in Igbo, Hausa and Yoruba, documented in a paper, with w2v-BERT Hausa and other recognizers trained
    on it.
  confidence: medium
  note: NaijaVoices gives Igbo, Hausa and Yoruba about 600 hours each from more than 5,000 speakers, with a
    paper on its collection, and recognizers such as asr-africa's w2v-BERT Hausa model are trained on it. It
    covers three languages, where Afrivoice holds thousands of hours per release across 18.
  relative_to: afrivoice
