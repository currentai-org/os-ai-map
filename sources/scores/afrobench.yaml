capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for African-language model evaluation
  value: Evaluation suite of 22 mostly human-annotated datasets across 15 tasks and 64 African languages, documented
    in a paper and per-member cards, with lm-evaluation-harness tasks, a public leaderboard, and results reported
    by InkubaLM.
  confidence: medium
  note: AfroBench brings 22 datasets across 64 African languages into one evaluation with harness tasks and
    a public leaderboard, and models such as InkubaLM report on its members. No other open suite here covers
    as many African languages and tasks. Its breadth comes from bundling existing Masakhane and partner benchmarks.
  last_verified: '2026-09-24'
