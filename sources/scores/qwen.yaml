  value: 'Read on Qwen3.5 35B A3B, the post-trained sibling of Qwen3.5-35B-A3B-Base, the largest released
    base checkpoint; read 2026-11-15. Qwen has released no base checkpoint newer than Qwen3.5. Artificial
    Analysis Intelligence Index v5.0.1 scores no Qwen3.5 model (35B A3B, 397B A17B, 122B A10B, 27B, 9B,
    4B, 2B and 0.8B read Unknown) and lists Qwen3.5 35B A3B as deprecated in favor of Qwen3.6 35B A3B. Artificial
    Analysis evaluations outside the index, reasoning against reasoning: Qwen3.5 35B A3B (Reasoning) GPQA
    Diamond 84.5%, HLE 21.0%, IFBench 72.5%, MMMU Pro 72.7%, tau2-bench 89.2%, Terminal-Bench Hard 26.5%
    against Gemma 4 31B (Reasoning) (gemma, 4) 85.7%, 23.6%, 75.6%, 73.4%, 59.9%, 36.4%, and Olmo 3.1 32B
    Think (olmo, 4) 59.1%, 6.3%, 66.0% on the first three and 0.0% on tau2-bench and Terminal-Bench Hard;
    non-reasoning, Qwen3.5 35B A3B 81.9%, 13.4%, 44.5% against Phi-4 (phi, 3) 57.5%, 3.8%, 23.5%. Epoch
    AI runs: qwen3.5-35b-a3b GPQA Diamond 83.5%, OTIS Mock AIME 54.4% (qwen3.5-35b-a3b_none 81.2%, 70.0%)
    against Gemma 4 31B at minimal reasoning 75.8%, 73.3%, Mistral Large 4 (high) (mistral-large, 4) 88.1%,
    98.3% and Phi-4 56.1%, 13.8%. LMArena text, style control, 2026-11-11: Qwen3.5-35B-A3B 1394 against
    Gemma 4 31B 1452, Mistral Large 4 1420, Olmo 3.1 32B Think 1286 and Phi-4 1256; non-English prompts
    1374 against 1438, 1405, 1231 and 1233.'
  confidence: medium
  note: Artificial Analysis, Epoch AI and LMArena evaluate post-trained models, so this record is read on
    Qwen3.5 35B A3B, the chat model built on the largest Qwen3.5 Base checkpoint. Version 5 of Artificial
    Analysis's Intelligence Index scores no Qwen3.5 model. In Artificial Analysis's own science, reasoning
    and instruction-following tests it is level with Gemma 4 31B and far ahead of OLMo 3.1 32B Think and
    Phi-4. Epoch AI's runs put it behind Mistral Large 4, and LMArena's ratings place it between OLMo and
    Mistral Large 4.
