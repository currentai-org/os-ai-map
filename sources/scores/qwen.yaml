capability:
  score: 4
  basis: benchmark
  basis_detail: Artificial Analysis Intelligence Index
  value: 'Qwen3.5 35B A3B (Reasoning), the post-trained sibling of the largest Qwen3.5 Base checkpoint - AA
    Intelligence Index 19 (estimated, v4.3.2), well above the median of 8 for open-weight models of similar
    size. Qwen3.5 397B A17B scores 18. On the same index version Llama 4 Maverick (llama, 3) scores 10 and
    DeepSeek-V4.1-Flash (deepseek, 5) scores 39.'
  confidence: medium
  note: Artificial Analysis does not evaluate base checkpoints, so this record is read on its post-trained
    sibling, as llama is read on Llama 4 Maverick. Qwen3.5 35B A3B, the chat model built
    on the largest Qwen3.5 Base checkpoint, scores 19 on Artificial Analysis's Intelligence Index, well above
    the median of 8 for open-weight models of its size, and between the base records read at 10 and at 39.
  last_verified: '2026-10-10'
  sources:
  - url: https://artificialanalysis.ai/models/qwen3-5-35b-a3b
    shows: 'Artificial Analysis page on Intelligence Index v4.3.2: "Qwen3.5 35B A3B (Reasoning) scores 19
      (estimated) on the Artificial Analysis Intelligence Index, placing it well above average among other
      open weight models of similar size (median: 8)".'
