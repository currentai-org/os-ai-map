capability:
  score: 1
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: unique identifiers for agents and MCP servers, as W3C DIDs or IdP-issued IDs, with badges carrying signed
    verifiable credentials and badge verification; no per-action decision; no delegation; no human approval; no
    decision record
  confidence: medium
  note: AGNTCY Identity establishes who an agent or MCP server is and lets others verify it through signed badges.
    Deciding what that agent may then do is left to other systems.
  last_verified: '2026-11-20'
  sources:
