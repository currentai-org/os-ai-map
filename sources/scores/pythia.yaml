capability:
  score: 1
  basis: benchmark
  value: null
  confidence: high
  note: 'Pythia was never built to compete on capability: its sixteen models top out at 12B, trained on
    2023-era Pile data, and are research tools for studying how language models learn rather than production
    systems. No benchmark measures it against the 2026 frontier, which is why its capability reading trails
    every model built for competitive performance.'
  last_verified: '2026-08-13'
  sources:
  - url: https://arxiv.org/abs/2304.01373
    shows: '"we introduce Pythia, a suite of 16 LLMs all trained on public data seen in the exact same
      order and ranging in size from 70M to 12B parameters"; the presented results are case studies in
      memorization, term frequency and bias, not capability benchmarks.'
    accessed: '2026-08-13'
    http_status: 200
