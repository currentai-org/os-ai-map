capability:
  score: 1
  basis: benchmark
  value: null
  confidence: high
  note: Pythia was never built to compete on capability. Its sixteen models top out at 12B, were trained
    on the 2020 Pile corpus, and are research tools for studying how language models learn rather than production
    systems. No benchmark measures it against the 2026 frontier, and it trails every model built for competitive
    performance.
  last_verified: '2026-11-12'
  sources:
  - url: https://arxiv.org/abs/2304.01373
    shows: 'Abstract: "a suite of 16 LLMs all trained on public data seen in the exact same order and ranging
      in size from 70M to 12B parameters"; the case studies it presents are "memorization, term frequency
      effects on few-shot performance, and reducing gender bias", not capability benchmarks.'
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: d15932e6af3611f8c30500e4e2e6b6298f555545af1b3fdab2a68a7790e5bfbb
  - url: https://huggingface.co/EleutherAI/pythia-12b/raw/main/README.md
    shows: 'Model card: "The Pythia model suite was deliberately designed to promote scientific research
      on large language models, especially interpretability research" and "Despite not centering downstream
      performance as a design goal"; its evaluations compare against OPT and GPT-Neo.'
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: 4f126014a10e08fea03a8137cf96e16199b5a7d8b256ed5c297ab76b2403bdcd
