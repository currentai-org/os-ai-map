  note: Pythia releases Apache-2.0 weights, the Pile as its training corpus together with dataloader tools
    that reconstruct the exact token order, training and analysis code, and 154 intermediate checkpoints
    per model size. Every part of the release is downloadable and the training run itself is reproducible,
    not just the model, which is what separates full openness from open weights.
