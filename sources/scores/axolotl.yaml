capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: full FT, LoRA, QLoRA, GPTQ, QAT, DPO/IPO/KTO/ORPO, GRPO/GDPO, reward modeling; parallelism:
    FSDP1/FSDP2, DeepSpeed, multi-node Torchrun/Ray, Sequence Parallelism + ND Parallelism (CP+TP+FSDP);
    precision: BF16/4-8bit. Broadest single-tool method+parallelism matrix in this batch.'
  confidence: high
  note: Axolotl runs full fine-tuning, LoRA, QLoRA and quantization-aware training, preference methods such
    as DPO, KTO and ORPO, GRPO reinforcement learning and reward modeling from one configuration file, with
    FSDP2, DeepSpeed, sequence and expert parallelism and multi-node training through Torchrun or Ray. It
    trails Megatron-LM on demonstrated scale, publishing no training run near the size of Megatron-LM's
    multi-thousand-GPU benchmarks.
  last_verified: '2026-09-28'
  sources:
  - url: https://raw.githubusercontent.com/axolotl-ai-cloud/axolotl/main/README.md
    shows: The README lists the training methods "Full fine-tuning, LoRA, QLoRA, GPTQ, QAT (int8/int4/FP8/NVFP4/MXFP4)"
      and "Preference Tuning (DPO, IPO, KTO, ORPO), RL (GRPO, GDPO), and Reward Modelling (RM) / Process
      Reward Modelling (PRM)", plus "Multi-GPU training (FSDP2, DeepSpeed)" and "Multi-node training (Torchrun,
      Ray)", Sequence Parallelism, ND Parallelism and Expert Parallelism.
