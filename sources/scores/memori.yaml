capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: automatic and manual recall scoped to entity, process and session; background extraction of facts, preferences,
    skills, rules, events and agent traces; deduplication of repeated knowledge-graph triples; typed entity facts,
    process attributes and a triple graph; no time-based forgetting
  confidence: medium
  note: Memori extracts typed memories from conversations and agent traces, keeps a knowledge graph beside them
    and merges repeated facts, all without changes to the calling code. Nothing in it retires a memory over time,
    and the extraction itself runs on Memori's hosted service.
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/MemoriLabs/Memori/main/docs/memori-byodb/concepts/advanced-augmentation.mdx
    shows: The engine "Identifies facts, preferences, skills, attributes, and events" and "Extracts semantic triples";
      "Memori automatically deduplicates triples", incrementing the mention count and timestamp.
