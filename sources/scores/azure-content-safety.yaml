  score: 4
  basis: feature_matrix
  basis_detail: feature coverage
  value: Text and image moderation, Prompt Shields for direct and indirect prompt injection, groundedness
    detection, protected-material detection, an agent task-adherence check and custom categories in one
    managed service.
  confidence: low
  note: One service covers harm-category moderation for text and images, prompt-injection defense, groundedness
    checks, protected-material detection and a task-adherence check for AI agents. Groundedness, task adherence
    and custom categories are still in preview, and the protected-material, groundedness and custom-category
    models work in English only.
  last_verified: '2026-09-29'
  sources:
