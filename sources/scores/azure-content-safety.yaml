    shows: The service overview lists Prompt Shields, which "Scans text for the risk of a User input attack
      on a Large Language Model", groundedness detection marked preview, protected material text detection,
      a "Task adherence API" that "Detects when tool use by AI agents is misaligned, unintended, or premature
      in the context of a user interaction", analyze text and image APIs that scan "for sexual content,
      violence, hate, and self harm with multi-severity levels", and custom categories in preview. It adds
