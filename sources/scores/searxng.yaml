adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: 'Around 32,000 GitHub stars, roughly 70 maintained public instances and Docker pull volume well into
    the high band - concrete deployment volume rather than stars alone. SearXNG is the de facto open web-search
    backend for self-hosted AI. The band comes from the Docker Hub payload for searxng/searxng, which reports
    71,581,974 pulls since the repository was registered; across the 63.70 months since then that averages
    1,123,660 pulls a month, landing in 1M-10M at level 4. A cumulative total is not directly comparable with
    any other record on this scale, since the axis is monthly, so the figure is treated as a declared floor:
    a lifetime average understates a growing product, and SearXNG''s pull rate is not flat. Docker is not one
    of this product''s declared artifacts, so the figure lives in this note rather than in a recorded signal.'
  last_verified: '2026-08-13'
  sources:
  - url: https://hub.docker.com/r/searxng/searxng
    shows: Official image searxng/searxng. Repository payload gives pull_count 71,581,974, star_count 186,
      status active, date_registered 2021-04-22.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 7a9d29c4bf78123a855e7869aeeb8331951e5c88c7a2d08734a62ff14f60a387
capability:
  score: 3
  basis: feature_matrix
  value: '`GET|POST /search?format=json` returns the aggregated results of the engines the instance has enabled,
    as JSON, CSV or RSS'
  confidence: medium
  note: Finds, and returns references. SearXNG aggregates other engines and returns their results; it fetches
    no page for the caller, which is what keeps it at 3 rather than 4. Its Answer result type is an instant
    answer forwarded from an upstream engine, not a composed reply over retrieved sources. Banded at serper.
  last_verified: '2026-09-17'
  sources:
  - url: https://docs.searxng.org/dev/search_api.html
    shows: 'The search API: endpoints `GET /`, `GET /search`, `POST /`, `POST /search`, with `curl ''https://searx.example.org/search?q=searxng&format=json''`
      and the json, csv and rss formats. Result types are Main Results, Key-Value, Code, Paper, File, Image,
      Answer, Correction, Suggestion and Infobox - all shapes of a results page.'
