adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: high
  note: '~32k GitHub stars plus 50M+ total Docker pulls (~1.5M in a single recent week) and ~70 maintained
    public instances - concrete deployment volume well into the high band, not stars-only. The de facto open
    web-search backend for self-hosted AI. Re-banded 2026-08-13 under the lifetime-average rule in
    docs/guides/adoption.md. Docker Hub reports 71,524,926 cumulative pulls on searxng/searxng since
    2021-04-22, which averages ~1,122,856 a month over 63.7 months and bands at 1M-10M. The previous reach
    ''50M+ total Docker pulls'' was a CUMULATIVE total wearing a monthly band''s place - the axis is monthly,
    so a lifetime total is not comparable to any other record on the scale. Level unchanged at 4. Recorded AS
    A DECLARED FLOOR, per the rule: a lifetime average understates a growing product, and SearXNG''s pull rate
    is not flat. Docker is not declared as an artifact here, so the figure lives in this note rather than in a
    signal - the same gap issue #163 tracks. No last_verified claimed: only the figure was re-read.'
  sources:
  - url: https://hub.docker.com/r/searxng/searxng
    shows: official image, 50M+ total pulls, ~1.5M weekly
    accessed: '2026-06-17'
