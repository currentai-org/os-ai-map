    shows: 'The search API: endpoints `GET /`, `GET /search`, `POST /`, `POST /search`, with `curl ''https://searx.example.org/search?q=searxng&format=json''`
      and the json, csv and rss formats. Result types are Main Results, Key-Value, Code, Paper, File, Image,
      Answer, Correction, Suggestion and Infobox - all shapes of a results page.'
