capability:
  score: 3
  basis: feature_matrix
  value: '`GET|POST /search?format=json` returns the aggregated results of the engines the instance has enabled,
    as JSON, CSV or RSS'
  confidence: medium
  note: SearXNG aggregates other engines and returns their references without fetching the page content
    itself, which keeps it level with Serper rather than a step higher. Its Answer result type simply forwards
    an instant answer from an upstream engine rather than composing a reply from retrieved sources.
  last_verified: '2026-09-17'
  sources:
