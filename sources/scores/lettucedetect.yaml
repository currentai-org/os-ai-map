capability:
  score: 3
  basis: feature_matrix
  basis_detail: groundedness span detection
  value: 'Span-level groundedness checking for retrieval-augmented, coding-agent and tool-grounded answers: encoder
    token classifiers built on ModernBERT, EuroBERT and mmBERT, plus a 2B generative detector that tags each unsupported
    span with one of 3 categories and 13 subcategories. Covers seven languages in its multilingual models, with
    a Python API and a FastAPI web server. Its own reports give 79.22% example-level F1 on RAGTruth for the original
    model and 0.689 span-F1 on the unified v2 test set for the 2B model.'
  relative_to: granite-guardian
  relation: one_below
  confidence: medium
  note: 'LettuceDetect makes one of the checks Granite Guardian makes, deciding whether an answer is supported by
    its sources, and goes further on that one check: where Granite Guardian answers yes or no, LettuceDetect marks
    the exact unsupported passages, in code and tool output as well as prose. It does not screen for harmful content,
    jailbreaks or risky function calls, which Granite Guardian also covers, so it sits a step below it.'
  comparison:
    last_attested: '2026-10-13'
    sources:
    - url: https://huggingface.co/ibm-granite/granite-guardian-4.1-8b/raw/main/README.md
      shows: The peer's Granite Guardian 4.1 8B card still describes a model "designed to judge if the input prompts
        and the output responses of an LLM-based system meet specified criteria", with pre-baked harm, RAG (including
        groundedness) and function-calling criteria and user-supplied criteria, and says it is used "strictly for
        the prescribed scoring mode, which generates yes/no outputs". The digest matches the one granite-guardian
        records from 2026-09-29.
      accessed: '2026-10-13'
      http_status: 200
      content_sha256: b8d7ae89ebac9ce04dfb5389b04fb76a8659fe521b8ee5d4ec8126f7d871efa8
  last_verified: '2026-10-13'
  sources:
  - url: https://cdn.jsdelivr.net/gh/KRLabsOrg/LettuceDetect@main/README.md
    shows: The README calls LettuceDetect "an open span-level grounding verifier for AI outputs" that "localizes
      unsupported, contradictory, or fabricated parts of RAG answers, coding-agent responses, and tool-grounded
      outputs", returning "exact character spans instead of only an answer-level clean/flagged verdict". It lists
      7 languages for the multilingual models, a category and subcategory for each span in the v2 models, a web
      API with a Python client, and 0.689 span-F1 for Qwen-2B on "the unified 10,698-example v2 test set".
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: d1d7e9881e36a7fc450e4a401635ac7dd693de98a2a20dd4fbf1ad7743c7fc06
  - url: https://arxiv.org/abs/2502.17125
    shows: The arXiv abstract describes "a token-classification model that processes context-question-answer triples",
      built on ModernBERT and trained on RAGTruth, reporting "an F1 score of 79.22% for example-level detection"
      and "30 to 60 examples per second on a single GPU".
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: db9fa8ce1c63cb58202d530684b21433a9cfbbd8689459d5f1f443c5d6e8fdf0
  - url: https://arxiv.org/abs/2607.00895
    shows: The arXiv abstract, submitted 1 July 2026, introduces a span-level hallucination benchmark over code,
      tool output and documents, and reports that the fine-tuned Qwen3.5-2B detector "reaches 0.689 span-F1 on the
      unified test set and 0.60 on the code-agent source".
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: 4d5f0383bd97474b757b312c619e67d21db2cd5e1da5449c9965189aced48d52
  - url: https://huggingface.co/KRLabsOrg/lettucedect-v2-qwen-2b/raw/main/README.md
    shows: The lettucedect-v2-qwen-2b card describes a generative detector that emits the unsupported spans of an
      answer as JSON, each with a category and subcategory from a taxonomy of "3 categories (contradiction, fabricated_reference,
      unsupported_addition) × 13 subcategories". On code-agent answers it reports off-the-shelf detectors including
      Granite-Guardian as "all ≈ chance" on its own benchmark.
    accessed: '2026-10-13'
    http_status: 200
    content_sha256: 3f60e99e813b79875eafdeae1676381fbfb8e4b2485defd5e2f5311ffb288363
