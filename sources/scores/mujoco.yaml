capability:
  score: 4
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: Contact-rich articulated-body physics on the CPU with an OpenGL viewer; GPU-batched simulation through
    MJX (JAX) and MuJoCo Warp (NVIDIA GPUs, rigid bodies with contact, soft bodies, cloth, signed distance fields),
    and in MuJoCo Warp a ray-traced GPU batch renderer for cameras across many parallel worlds.
  confidence: medium
  note: MuJoCo is the reference contact physics engine, and its GPU build runs many worlds in parallel and renders
    their cameras in the same batch by ray tracing. What it does not carry is a second physics engine or a library
    of ready-to-train tasks for common robots; those come from projects built on it.
  relative_to: isaac-lab
  relation: one_below
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/google-deepmind/mujoco/main/README.md
    shows: 'README: "a general purpose physics engine ... fast and accurate simulation of articulated structures
      interacting with their environment"; the core''s own viewer is "rendered in OpenGL".'
    accessed: '2026-09-26'
    http_status: 200
    content_sha256: f50477192f4d3fbe21b436c83f78b0895c57e94f19ff5685e0742a259f5a8d88
