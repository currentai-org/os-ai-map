capability:
  score: 3
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: Contact-rich articulated-body physics on the CPU with an OpenGL viewer; GPU-batched simulation through
    MJX (JAX) and MuJoCo Warp (NVIDIA GPUs, rigid bodies with contact, soft bodies, cloth, signed distance fields).
    No photorealistic or ray-traced rendering.
  confidence: medium
  note: 'MuJoCo is the reference contact physics engine, and with MJX and MuJoCo Warp it runs large batches of environments
    in parallel on a GPU. It stops at physics: rendering is a plain OpenGL viewer, and there are no ready-made training
    tasks or camera sensors that look like the real world.'
  relative_to: isaac-lab
  relation: two_below
  last_verified: '2026-09-26'
  sources:
  - url: https://raw.githubusercontent.com/google-deepmind/mujoco/main/README.md
    shows: 'README: "a general purpose physics engine ... fast and accurate simulation of articulated structures
      interacting with their environment"; "interactive visualization with a native GUI, rendered in OpenGL"; no
      ray-tracing claim.'
    accessed: '2026-09-26'
    http_status: 200
    content_sha256: f50477192f4d3fbe21b436c83f78b0895c57e94f19ff5685e0742a259f5a8d88
