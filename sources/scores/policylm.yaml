capability:
  score: 4
  basis: feature_matrix
  basis_detail: steerable bring-your-own-policy, per-category scores
  value: Scores a user message against a policy of up to 16 user-written categories, or against a built-in 23-category
    Aegis 2.0 taxonomy, returning a 0-1 score per category in one pass with no generated text; evaluated in 19 languages.
    On Musubi's custom-policy benchmark it posts 0.842 accuracy against 0.909 for gpt-oss-safeguard-20B, 0.829 for
    CoPE-B-A4B and 0.643 for Shieldstral-1.0-3B, at 22 ms median per message on an H100.
  relative_to: gpt-oss-safeguard
  relation: at
  confidence: medium
  note: Like gpt-oss-safeguard, PolicyLM checks content against a policy the user writes, and it scores each category
    of that policy separately in one fast pass. It follows custom policies less accurately on Musubi's own benchmark,
    gives no written reason and does not check assistant responses, so it sits level with gpt-oss-safeguard rather
    than ahead.
  comparison:
    last_attested: '2026-10-19'
    sources:
    - url: https://huggingface.co/openai/gpt-oss-safeguard-20b/raw/main/README.md
      shows: The peer's card still describes "safety reasoning models built-upon gpt-oss" that "classify text content
        based on safety policies that you provide", with a bring-your-own-policy feature and reasoning effort set
        to low, medium or high. The digest matches the one gpt-oss-safeguard records from 2026-09-29.
      accessed: '2026-10-19'
      http_status: 200
      content_sha256: 1a3a493bbb99dd2935e6e61c902be60ba326d7627958f5f78279259bb77027e9
  last_verified: '2026-10-19'
  sources:
  - url: https://huggingface.co/musubilabs/policylm-1.7b/raw/main/README.md
    shows: The card says "You give it a message and a policy and it returns a score from 0 to 1 for each category
      of the policy", offers "A built-in taxonomy (`aegis` mode)** of 23 categories from NVIDIA's Aegis 2.0", scores
      "Every category in one pass,** up to 16 per policy", and was "Evaluated on messages in 19 languages". Its
      custom-policy table gives accuracy 0.842 for PolicyLM-1.7B, 0.909 for gpt-oss-safeguard-20B, 0.829 for CoPE-B-A4B
      and 0.643 for Shieldstral-1.0-3B, with a 22 ms median on an H100. It lists "moderating assistant responses"
      as out of scope and points to other models when "The decision needs a written reason".
    accessed: '2026-10-19'
    http_status: 200
    content_sha256: 3b9068afe949d5698968ec60fc702375ab01973c4a986b57285fff8701d685fe
