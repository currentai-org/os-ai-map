  value: 6 TOPS NPU; up to 16GB LPDDR4X (5B) / 32GB LPDDR5 (5B+); RK3588 8-core CPU
  confidence: high
  note: The RK3588's 6 TOPS NPU, paired with up to 32GB of LPDDR5 on the Plus variant, runs quantized small
    and mid-size LLMs and real-time vision through RKNN. That extra memory puts it a step above the other
    6 TOPS RK3588 boards, such as Orange Pi 5 and Khadas Edge2, though still below the Jetson Orin NX.
  last_verified: '2026-08-13'
