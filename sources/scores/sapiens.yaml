  score: 4
  basis: feature_matrix
  value: whole-body pose with 308 keypoints, 29-part body segmentation, surface normals, pointmaps and human matting
    on any image of people with no training, at 1K resolution, from 0.4B to 5B parameters
  relative_to: depth-anything
  relation: at
  confidence: medium
  note: Sapiens2 returns per-pixel geometry and a foreground matte for any photo of a person without training, as Depth
    Anything does for whole scenes. It covers human subjects only, and its pose and segmentation heads use fixed keypoint
    and body-part sets.
