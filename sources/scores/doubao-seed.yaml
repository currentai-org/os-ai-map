capability:
  score: 5
  basis: benchmark
  basis_detail: ICPC/IMO/CMO, SuperGPQA
  value: 'Seed 2.0 Pro: gold-medal results in ICPC, IMO and CMO; higher than GPT-5.2 on SuperGPQA;
    scientific-field performance on par with Gemini 3 Pro and GPT-5.2; leading results on video benchmarks
    (TVBench, TempCompass, MotionBench) and above human level on EgoTempo; positioned vs GPT-5.2 / Gemini
    3 Pro at roughly an order of magnitude lower token price'
  confidence: low
  note: 'ByteDance reports frontier-competitive math, coding and multimodal results that no independent
    evaluation has audited, so the band is 5 and the confidence low. Its launch post claims gold-medal results
    in ICPC, IMO and CMO, a higher SuperGPQA score than GPT-5.2, science-field performance on par with Gemini
    3 Pro and GPT-5.2, leading video-benchmark results and above-human EgoTempo. The widely circulated AIME
    2025 98.3, Codeforces 3020 and VideoMME 89.5 figures are not carried here: they appear on none of the
    reachable sources - not the TechNode piece, not ByteDance''s own Seed 2.0 launch post, not the Volcano
    Engine docs, not Caixin and not the Wikipedia article - and are traceable only to third-party review
    blogs that publish no working. What is left is a vendor claim with no independent audit and no leaderboard
    placement behind it.'
  last_verified: '2026-08-14'
  sources:
  - url: https://seed.bytedance.com/en/blog/seed2-0-%E6%AD%A3%E5%BC%8F%E5%8F%91%E5%B8%83
    shows: 'ByteDance''s own Seed 2.0 launch post. "Seed2.0 Pro achieved gold medal results in ICPC, IMO,
      and CMO tests"; "Seed2.0 Pro has scored higher than GPT-5.2 on SuperGPQA"; overall performance in
      the scientific field is "on par with Gemini 3 Pro and GPT-5.2"; on video it "ranks among the leading
      players on key benchmarks, including TVBench, TempCompass, and MotionBench, and surpasses
      human-level performance on EgoTempo". Availability - "The Seed2.0 Pro and Code models have been
      launched on the Doubao App and TRAE, and the model API for the Seed2.0 full series is available on
      Volcano Engine." The post carries no AIME, Codeforces or VideoMME figure.'
