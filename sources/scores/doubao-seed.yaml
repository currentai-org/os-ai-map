adoption:
  level: 5
  reach: '>10M users'
  signal_type: active_users
  confidence: medium
  note: 'Powers the Doubao app, China''s largest consumer AI chat product, with Seed 2.0 the model behind
    that surface plus the Volcano Engine enterprise API - far above the >10M threshold. The band is taken
    on the surface the model powers rather than on a standalone Seed 2.0 figure, and that is said here deliberately:
    banding on a surface is fair as long as the record names which surface. The figure comes from Caixin''s
    launch-day report, which attributes to Quest Mobile that Doubao led with 155 million weekly active users
    in December 2025; the TechNode launch piece carries no user count and is kept only for the availability
    fact. The sibling Doubao record independently bands the same app at 382M monthly active users on the
    QuestMobile 2026 H1 report, so the two reads agree on the order of magnitude and both sit far above
    >10M. Confidence stays medium because Quest Mobile is read through press coverage rather than through
    the report itself.'
  last_verified: '2026-08-14'
  sources:
  - url: https://www.caixinglobal.com/2026-02-15/bytedance-unveils-doubao-20-ai-model-to-tackle-complex-tasks-102414865.html
    shows: 'Caixin Global on the Seed 2.0 launch, carrying the user figure the record bands on - Doubao
      had 155 million weekly active users in December 2025 per Quest Mobile, ahead of DeepSeek and well
      ahead of Tencent Yuanbao at 20.8 million. It also notes Doubao slipped to third in the iOS free
      download chart over Lunar New Year 2026.'
