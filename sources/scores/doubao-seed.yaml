capability:
  score: 5
  basis: benchmark
  basis_detail: ICPC/IMO/CMO, SuperGPQA
  value: 'Seed 2.0 Pro: gold-medal results in ICPC, IMO and CMO; higher than GPT-5.2 on SuperGPQA;
    scientific-field performance on par with Gemini 3 Pro and GPT-5.2; leading results on video benchmarks
    (TVBench, TempCompass, MotionBench) and above human level on EgoTempo; positioned vs GPT-5.2 / Gemini
    3 Pro at roughly an order of magnitude lower token price'
  confidence: low
  note: 'Vendor-reported (ByteDance) frontier-competitive math/coding/multimodal results; figures are not
    independently audited. Held with low confidence as ByteDance-claimed.
    Closed 2026-08-14, and the three numbers the record carried are gone. AIME 2025 98.3, Codeforces 3020
    and VideoMME 89.5 appear on no source that could be reached - not on the cited TechNode piece, not on
    ByteDance''s own Seed 2.0 launch post, not on the Volcano Engine docs, not on Caixin and not on the
    Wikipedia article. They are traceable only to third-party review blogs that publish no working, so
    they were dropped rather than restated. What replaces them is ByteDance''s own launch post, which
    claims gold-medal results in ICPC, IMO and CMO, a higher SuperGPQA score than GPT-5.2, science-field
    performance on par with Gemini 3 Pro and GPT-5.2, leading video-benchmark results and above-human
    EgoTempo. That is still a frontier-competitive claim from the vendor, so the band is unchanged at 5
    and the confidence stays low for the same reason as before - these are vendor claims with no
    independent audit and no leaderboard placement behind them.'
  last_verified: '2026-08-14'
  sources:
  - url: https://seed.bytedance.com/en/blog/seed2-0-%E6%AD%A3%E5%BC%8F%E5%8F%91%E5%B8%83
