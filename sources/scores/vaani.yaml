capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indian-language speech
  value: About 31,000 hours of image-prompted speech in about 105 languages from 165 districts, about 2,000
    hours transcribed by people, documented in a paper, with SraVaani and Whisper-Vaani recognizers and a Hindi
    ASR leaderboard built on it.
  confidence: medium
  note: 'Vaani records more hours and far more languages than any other Indian speech corpus here, and ARTPARK''s
    SraVaani and Whisper-Vaani recognizers and a Hindi recognition leaderboard are built on it. It is a step
    below IndicVoices, which has far more transcribed speech: only about one hour in fifteen of Vaani is transcribed.'
  relative_to: indicvoices
  relation: one_below
  last_verified: '2026-09-24'
  sources:
