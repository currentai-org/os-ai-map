  confidence: high
  note: The repository is Apache-2.0 and carries the C++ runtime and most kernels as source, but the default
    build does not come from that source alone. Unless a builder supplies the internal kernels' source,
    CMake unpacks a prebuilt internal_cutlass_kernels static library from the tree and links it, and the
    Python package requires NVIDIA's proprietary nvidia-cutlass-dsl. A closed component that the default
    build requires makes this open core. NVIDIA sells NIM and enterprise support as separate products beside
    it.
