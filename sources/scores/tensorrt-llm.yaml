  banded_quantity: GitHub stars (14,730), not a download or user count
  note: 'Independent comparisons frame TensorRT-LLM as the specialist choice: the highest raw throughput
    on standardized NVIDIA fleets, but narrower reach than vLLM or SGLang because of its compilation overhead
    and single-vendor lock-in. No standalone user or download count exists, so the rating reflects that
    specialized, GPU-locked production use rather than a broad count.'
