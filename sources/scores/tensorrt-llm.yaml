  note: NVIDIA's MLPerf Inference v4.0 recap credits TensorRT-LLM with nearly 3x more throughput on the
    GPT-J test than the prior round. An independent H100 benchmark on Llama 3.3 70B puts it ahead of vLLM
    and SGLang on raw throughput, though with a cold start of about 28 minutes against roughly a minute
    for the others.
