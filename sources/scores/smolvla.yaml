capability:
  score: 2
  basis: feature_matrix
  basis_detail: embodiment generality
  value: 450M-parameter VLA pretrained on 481 public community datasets (22.9K episodes, 10.6M frames) filtered
    by embodiment type, evaluated in simulation (LIBERO, MetaWorld) and on SO-100 and SO-101 arms; performance comparable
    to VLAs 10x larger per the paper.
  confidence: low
  note: SmolVLA is built for the low-cost arms its community data comes from, and its real-world results are on
    SO-100 and SO-101 arms. It learns from far less data than OpenVLA and does not claim control of robots outside
    that family, though its paper reports results close to models ten times its size.
  relative_to: openvla
  relation: one_below
  last_verified: '2026-09-26'
  sources:
  - url: https://arxiv.org/html/2506.01844
    shows: 'Paper: "we selected a subset of 481 community datasets obtained from Hugging Face, filtered according
      to embodiment type, episode count, overall data quality, and frame coverage" (22.9K episodes, 10.6M frames);
      real-world datasets collected "using the SO-100 robot arm ... and 1 with SO-101 arm".'
    accessed: '2026-09-27'
