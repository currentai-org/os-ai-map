  value: 450M-parameter VLA pretrained on pooled community datasets from low-cost arms; evaluated on simulated and
    real-world benchmarks; performance comparable to VLAs 10x larger per the paper; no bimanual or humanoid release.
  confidence: low
  note: SmolVLA pools community-recorded data from many low-cost arm setups, and its paper reports results close
    to models ten times its size. It is a single-arm policy, with nothing released for two-armed or humanoid control.
