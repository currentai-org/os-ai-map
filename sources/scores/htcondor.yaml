    them; machine_count in the parallel universe names the number of machines dedicated to one job
  confidence: medium
  relative_to: nvidia-run-ai
  relation: at
  comparison:
    last_attested: '2026-09-16'
    sources:
    - url: https://www.nvidia.com/en-us/software/run-ai/
      shows: Re-read of the peer this comparison is placed against. NVIDIA Run:ai still presents as selecting
        the accelerators a workload runs on without an evidenced multi-machine reservation of its own, which
        is the property that places HTCondor level with it.
      accessed: '2026-09-16'
      http_status: 200
      content_sha256: f7e926f23072c3709cfd6fd678f62ea7f32c59e56aaf56bb7419978dbe865959
  note: HTCondor's own submit language lets a job request and qualify GPUs, and its scheduler matches such
    jobs to machines that have them. Its parallel universe also reserves a specific number of machines for
    one job, a multi-machine allocation that puts HTCondor level with NVIDIA Run:ai.
  last_verified: '2026-09-16'
  sources:
  - url: https://htcondor.readthedocs.io/en/latest/users-manual/submitting-a-job.html
    shows: 'HTCondor''s submit documentation on GPUs: ''matching jobs that need GPUs to machines that have
      them'', with request_GPUs = <n> to declare the count and require_gpus, gpus_minimum_capability and gpus_minimum_memory
      to qualify which GPU. Establishes that the accelerator request is expressed in HTCondor''s own schema
      and consumed by its matchmaking.'
    accessed: '2026-09-16'
    http_status: 200
    content_sha256: 94de435b71e8b51dddfa7b3a33f38b19793b7767379b4d83b33b27733483120e
  - url: https://htcondor.readthedocs.io/en/24.0/man-pages/condor_submit.html
    shows: 'HTCondor''s condor_submit manual page: ''machine_count = <max> For the parallel universe, a single
      value (max) is required. It is neither a maximum or minimum, but the number of machines to be dedicated
      toward running the job.'' Establishes a multi-machine allocation held for one job.'
    accessed: '2026-09-16'
    http_status: 200
