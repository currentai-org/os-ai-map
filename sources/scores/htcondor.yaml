  note: 328 GitHub stars. The htcondor PyPI package exists but is the Python bindings, not the scheduler, so
    banding on its downloads would measure Python API users rather than the clusters HTCondor runs; the band
    rests on stars instead. Both figures understate a scheduler distributed mainly as distribution packages,
    and neither says how widely it is deployed.
