capability:
  score: 4
  basis: feature_matrix
  value: request_GPUs, require_gpus, gpus_minimum_capability and gpus_minimum_memory in HTCondor's own submit
    language; the scheduler advertises machines with GPUs and matches jobs needing them to machines that have
    them
  confidence: medium
  relative_to: nvidia-run-ai
  relation: at
  comparison:
    last_attested: '2026-09-16'
    sources:
    - url: https://www.nvidia.com/en-us/software/run-ai/
      shows: Re-read of the peer this band is placed against. NVIDIA Run:ai still presents as selecting the
        accelerators a workload runs on without an evidenced multi-machine reservation of its own, which is
        the property HTCondor is banded level with.
      accessed: '2026-09-16'
      http_status: 200
      content_sha256: f7e926f23072c3709cfd6fd678f62ea7f32c59e56aaf56bb7419978dbe865959
  note: 'Admitted on the accelerator limb, and cleanly: the GPU request is HTCondor''s own submit language
    rather than a backend spec passed through, and HTCondor''s documentation describes it ''matching jobs that
    need GPUs to machines that have them''. Band 4 - it selects the machine, and the cited documentation does
    not establish a multi-machine set reserved as one allocation, which is band 5. Its general-purpose origins
    do not lower the band; the test is what the scheduler does.'
  last_verified: '2026-09-16'
  sources:
  - url: https://htcondor.readthedocs.io/en/latest/users-manual/submitting-a-job.html
    shows: 'HTCondor''s submit documentation on GPUs: ''matching jobs that need GPUs to machines that have
      them'', with request_GPUs = <n> to declare the count and require_gpus, gpus_minimum_capability and gpus_minimum_memory
      to qualify which GPU. Establishes that the accelerator request is expressed in HTCondor''s own schema
      and consumed by its matchmaking.'
    accessed: '2026-09-16'
    http_status: 200
