capability:
  score: 4
  basis: feature_matrix
  value: Hundreds of open models served out of the box through OpenAI-compatible endpoints, multi-vendor
    GPU support (NVIDIA/AMD/Apple) + CPU, custom-kernel authoring in Mojo, deployment on any cloud; designed
    as high-performance inference + hardware-abstraction layer
  confidence: medium
  note: MAX serves hundreds of open models, including DeepSeek, Gemma and Qwen, across NVIDIA, AMD and Apple
    GPUs and CPUs through an OpenAI-compatible API, with custom kernel authoring in Mojo. The speed comparison
    in its documentation is Modular's own, against vLLM, and no MLPerf or Artificial Analysis result is
    cited, so no independent benchmark supports its performance.
  last_verified: '2026-09-29'
  sources:
  - url: https://docs.modular.com/max/intro
    shows: 'The intro page says MAX serves open models through an OpenAI-compatible endpoint: "Deploy DeepSeek,
      Gemma, Qwen, and hundreds more with an OpenAI-compatible endpoint on NVIDIA or AMD and on any cloud."
      It also says "The same MAX package runs on NVIDIA, AMD, and Apple silicon". The earlier 500+ model
      count is no longer stated on the page.'
