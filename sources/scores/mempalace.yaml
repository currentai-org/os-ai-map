capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: semantic search scoped by wing and room, with a bounded wake-up context; wings, rooms and drawers beside
    a temporal entity-relationship graph and per-agent diaries; no extraction, since content is stored verbatim;
    no automatic consolidation; graph facts end only when the caller invalidates them
  confidence: medium
  note: MemPalace recalls verbatim conversation chunks through scoped search and keeps a temporal knowledge graph
    beside them, but by design it extracts nothing from what it stores. Updating or ending a fact is a call the
    agent makes, and contradiction detection is documented as planned rather than shipped.
  relative_to: lightmem
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/MemPalace/mempalace/develop/README.md
    shows: The README says MemPalace "stores your conversation history as verbatim text and retrieves it with semantic
      search. It does not summarize, extract, or paraphrase."
