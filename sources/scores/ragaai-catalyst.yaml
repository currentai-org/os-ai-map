product: ragaai-catalyst
openness:
  score: 1
  class: closed
  components:
    license:
    - name: Apache-2.0
      detail: covers only the ragaai-catalyst client library, not the platform it talks to
    source:
      value: closed
      detail: the observability/eval platform (project, dataset, trace and prompt storage, evaluation
        execution) runs at catalyst.raga.ai; nothing in the repository builds or serves it
    platform:
      value: proprietary-SaaS
      detail: every class in the README requires an access_key/secret_key issued by the hosted platform
    self-host:
      value: 'no'
      detail: no server, dashboard or docker-compose file anywhere in the repository
  confidence: high
  note: The repository is a well-featured client SDK - project, dataset, evaluation, trace, prompt, synthetic-data
    and guardrail management - but every one of those calls authenticates against catalyst.raga.ai and none
    of the platform it talks to is published. A full recursive tree search found no docker, compose, server,
    backend or dashboard path, so there is no self-host route - this is the LangSmith/PromptLayer shape, an
    open client over a closed hosted product, not the Helicone/Opik shape where the whole stack ships.
  raw: license:Apache-2.0(covers only the client library);source:closed(platform runs at catalyst.raga.ai);platform:proprietary-SaaS(access_key/secret_key
