capability:
  score: 3
  basis: feature_matrix
  value: Manual labeling of text, images, audio, video, HTML and time series in one instance; configurable labeling interfaces
    from a tag library; import from files or S3 and GCS; ML backends for pre-labeling; exports to common model formats. Reviewer
    workflows, task assignment and agreement metrics are Enterprise-only, and there is no programmatic labeling.
  confidence: medium
  note: Label Studio labels almost any data type, with configurable interfaces, model-assisted pre-labeling and broad export
    formats. Its free edition sits a step below Snorkel Flow, which adds programmatic labeling and weak supervision, and leaves
    review and quality workflows to the paid edition.
  relative_to: snorkel-flow
  relation: one_below
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://docs.snorkel.ai/
      shows: The Snorkel documentation home, now at version 26.7, still describes "programmatic data labeling and weak supervision",
        an evaluation workflow, an annotation studio for subject matter experts, and administration of "users, roles, and
        permissions", with a separate "Predictive ML 25.4" line.
