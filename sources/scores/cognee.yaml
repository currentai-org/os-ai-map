capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: remember with graph and entity extraction by an LLM or a local GLiNER model; recall scoped by dataset,
    user and session; an improve step that reviews conflicting facts by source date, distills sessions and
    updates user preferences; a permanent knowledge graph beside short-term session memory; no aging of
    stored facts beyond a configured session time-to-live
  confidence: medium
  note: 'Cognee extracts a knowledge graph from documents, code and conversations, recalls from it by dataset
    or session, and its improve step settles conflicting facts and distills sessions into lasting lessons.
    What it lacks is a sense of time over the permanent graph: session memory expires after a period the
    developer sets, but stored facts are never marked out of date or weakened with age.'
  relative_to: graphiti
  relation: one_below
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/topoteretes/cognee/main/README.md
    shows: remember, recall, improve and forget operations; "Text becomes entities, relationships, and searchable
      chunks" and "Session distillation curates accepted lessons into permanent memory."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 371945db13ce593ecb6298ad1188c57bfb1a6e89a8435f4bc421abfa427c09f2
  - url: https://docs.cognee.ai/core-concepts/main-operations/improve
    shows: improve moves session memory into the permanent graph, adjusts importance from feedback, and by default
      "reviews entity facts that disagree, using the documents and dates they came from".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 11ee22565f7aaecb31cd80dc8f5418cdd7e15e2189449ae17a0a2196649bfe57
  - url: https://docs.cognee.ai/core-concepts/main-operations/recall
    shows: 'recall is "Session-aware": with session_id it searches session entries first and falls through to the
      permanent graph; datasets scope results to a knowledge base.'
