  note: Jina Reader is Apache-2.0 throughout, and its paid tiers buy request throughput on the hosted endpoint
    rather than extra features -- the free tier, a free API key and Premium all get the same PDF, Office,
    image-captioning and search support, differing only up to 5,000 requests per minute. The published repository
    omits the MongoDB-backed storage layer the hosted service uses for accounting, but that supports the
    service rather than the reader itself, so nothing is withheld from the open build.
