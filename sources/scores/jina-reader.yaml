capability:
  score: 4
  basis: feature_matrix
  value: '`r.jina.ai/<url>` converts a named URL to LLM-friendly markdown and `s.jina.ai/<query>` searches
    the web for a query; both are documented as the two things Reader does'
  confidence: medium
  note: Jina Reader's core interface, `r.jina.ai/<url>`, only converts a named URL to markdown; on its own
    that covers content extraction, not discovery. But the vendor also documents `s.jina.ai/<query>`, which
    searches the web, and using the two together, search then read, puts Jina Reader level with Firecrawl,
    which sells the same find-plus-content combination in one product.
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/jina-ai/reader/main/README.md
    shows: '"Reader does two things: Read: It converts any URL to an LLM-friendly input with https://r.jina.ai/https://your.url
      ... Search: It searches the web for a given query with https://s.jina.ai/your+query."'
