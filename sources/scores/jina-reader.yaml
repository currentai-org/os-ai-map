  note: Jina Reader publishes no download, request or user count, and because it is consumed as a URL prefix
    rather than installed as a package, there is no registry to measure it either. GitHub stars are the
    only available signal, but a star is not a use, and the hosted endpoint's own traffic is not published
    anywhere.
