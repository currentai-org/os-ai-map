adoption:
  level: 3
  reach: '>10K stars'
  signal_type: stars_fallback
  confidence: low
  note: 'No verified download or API-call volume is published by any primary source: neither the repository
    nor jina.ai/reader gives a request count or a user count, and the reader is consumed as a URL prefix
    rather than as a package, so there is no registry artifact to band. That leaves stars - 11,865 stargazers
    on the one declared repository, which bands at >10K stars, level 3, and a stars-based signal caps the
    level there because a star is not a use. The hosted r.jina.ai endpoint is widely used but its traffic
    is not published anywhere. The page the star count comes from carries a live counter, so its content
    will differ on any later fetch; that is expected drift on this source rather than a signal about the
    claim.'
  last_verified: '2026-08-13'
  sources:
