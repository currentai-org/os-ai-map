capability:
  score: 4
  basis: feature_matrix
  value: an HTTP API over a managed browser - sessions, pages and processes, with cookie and local-storage
    state persisted across requests - self-hostable with Docker or consumed as Steel Cloud, with proxy credentials
    supplied by the caller
  confidence: medium
  relative_to: browserbase
  relation: at
  note: 'Band 4, and on the hosting leg rather than the credential one. Steel runs no authentication flow -
    the only secret in its documentation is a proxy string the caller passes in - but it hosts execution: Steel
    Cloud runs the browsers, and the same SDKs point at either deployment. Under this ladder band 4 is band
    3 plus managed credentials OR hosted execution, and the second is met. Banded at browserbase, which sells
    the same shape commercially.'
  last_verified: '2026-09-17'
  sources:
  - url: https://raw.githubusercontent.com/steel-dev/steel-browser/main/README.md
    shows: 'The README: "Steel.dev is an open-source browser API that makes it easy to build AI apps and agents
      that interact with the web... Under the hood, it manages sessions, pages, and browser processes", with
      "Session Management: Maintains browser state, cookies, and local storage across requests". Its only credential
      is `proxyUrl: "user:pass@host:port"`, supplied by the caller. Deployment is `docker run ... ghcr.io/steel-dev/steel-browser`
      or "The easiest way to get started with Steel is by creating a Steel Cloud account".'
