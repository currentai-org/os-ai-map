capability:
  score: 4
  basis: feature_matrix
  value: 'standardized 6-benchmark suite (v2: IFEval/BBH/MATH-L5/GPQA/MuSR/MMLU-Pro); shared-cluster reproducible
    runs; 13,000+ models'
  confidence: high
  last_verified: '2026-08-13'
  note: 'Historically the most visible open-model leaderboard: a standardized static benchmark suite rather
    than human-preference voting, and now archived. One caveat on the evidence: the archive page cited here
    documents the v1 leaderboard rather than v2, describing six benchmarks (ARC 25-shot, HellaSwag 10-shot,
    MMLU 5-shot, TruthfulQA, Winogrande 5-shot, GSM8k 5-shot) run on a single node of eight H100s through
    lm-evaluation-harness, with a reproduction command. It therefore establishes the shared-cluster reproducible
    runs and the 2M visitors, but not the v2 suite, which the Space''s own tags corroborate instead; the
    13,000+ model figure comes from the retirement post.'
  sources:
  - url: https://huggingface.co/docs/leaderboards/en/open_llm_leaderboard/archive
    shows: v2 benchmark suite, 2M visitors, archive
    accessed: '2026-06-17'
