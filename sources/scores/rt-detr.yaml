      detail: repository LICENSE for v1, v2 and v4; the v4 README states no separate weights license
  confidence: medium
  note: Every version is Apache-2.0, code and weights, with the full training code and configs published
    and the checkpoints trained on public COCO data. RT-DETRv4 uses a DINOv3 model as a teacher during
    training, which a user must obtain separately under Meta's DINOv3 License; the detectors it produces
    are released under Apache-2.0. Because v4's features are distilled from that teacher, trained on Meta's
    unreleased LVD-1689M images, the open-data reading rests on COCO being the only training set the detector
    itself sees.
