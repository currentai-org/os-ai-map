  score: 4
  basis: feature_matrix
  value: broad LLM-app eval metrics (G-Eval LLM-as-judge, answer relevancy, faithfulness, task completion,
    hallucination), RAG + agentic + conversational coverage, pytest-style harness, agentic-eval support
  confidence: high
  relative_to: lm-evaluation-harness
  relation: one_below
  last_verified: '2026-11-16'
  note: DeepEval covers application, RAG, agentic and conversational evaluation with judge-model metrics
    such as G-Eval, and runs them as pytest tests. It sits a step below lm-evaluation-harness, which offers
    a far larger set of standardized academic benchmarks.
  sources:
