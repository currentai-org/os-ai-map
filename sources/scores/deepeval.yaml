    shows: README describes the framework as "similar to Pytest but specialized for unit testing LLM apps"
      and lists G-Eval, "Task Completion", "Faithfulness", "Hallucination", "MCP Task Completion", multi-turn
      metrics such as "Knowledge Retention", and red-teaming.
