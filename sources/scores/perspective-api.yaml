adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: none published; Jigsaw has never published a usage figure
  note: 'The instrument is reported_traction with no numeric reach: usage_volume claims a download or install
    count, and Jigsaw has never published one for Perspective - a 1M-10M label would assert a measurement
    nobody made, which adoption.md forbids on a claim of this kind. The site also announces that the API
    is sunsetting, out of service after December 31, 2026, giving as the reason that ''AI capabilities have
    evolved, and there is now less demand for a standalone tool specific to this area''. Level 4 is deliberately
    unchanged, since nothing in the cited sources argues the standing is different - but a level 4 on a
    free API leaving service is a claim about the past, and that is flagged for the owner rather than settled
    here.'
  last_verified: '2026-08-13'
  sources:
  - url: https://perspectiveapi.com/
    shows: Sunset announcement and transition period. No usage figure of any kind - no request volume, no
      customer count, no developer count - appears on the page.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: c40c721ce2b0d461023e5f36699ce3be9a39da5493b51eff326dccd938ba1b8f
capability:
  score: 3
  basis: feature_matrix
  basis_detail: attribute coverage
  value: Scores toxicity and related attributes (insult, threat, profanity, identity attack) for text,
    multilingual; established but a fixed attribute set.
  confidence: low
  note: 'Mature toxicity scoring with broad real-world use; narrower than full safety taxonomies and policy-conditioned
    models. The cited page no longer carries the attribute list, having been replaced by the sunset notice,
    and the developer site that does carry the attributes is a client-rendered Salesforce Experience site
    serving an empty body that no header change fixes - so the fact is established elsewhere. The Comment
    Analyzer discovery document, the API''s own machine-readable definition and still served at 200, shows
    the service live and multilingual, taking "ISO and BCP-47 language codes" and detecting language per
    comment. The fixed attribute set is corroborated by Lasso''s write-up, which names it exactly as the
    value does - "The production attributes (TOXICITY, SEVERE_TOXICITY, IDENTITY_ATTACK, INSULT, PROFANITY,
    THREAT)" - plus experimental ones. Provenance caveat kept in view - Lasso sells a competing moderation
    product, so it is a document rather than a re-derivable dataset, and confidence stays low. The band
    is unchanged, but an escalation stands: the same page states Perspective "will sunset after December
    31, 2026, with no migration path provided", so whether a sunsetting product should carry a live capability
    band is a ruling for the orchestrator.'
  last_verified: '2026-08-14'
  sources:
  - url: https://perspectiveapi.com/
    shows: Sunset notice only. The toxicity and attribute scoring the value describes is no longer
      documented anywhere on this page.
