adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: none published; Jigsaw has never published a usage figure
  note: 'Jigsaw has never published a download, install or request count for Perspective, so the level rests
    on reported standing rather than on a measured figure, and no numeric reach is claimed: a 1M-10M label
    would assert a count nobody made. The site also announces that the API is sunsetting and goes out of
    service after December 31, 2026, giving as the reason that ''AI capabilities have evolved, and there
    is now less demand for a standalone tool specific to this area''. Level 4 describes the standing the
    cited sources show and none of them argues for a different one - though a level 4 on a free API that
    is leaving service describes the past more than the present.'
  last_verified: '2026-08-13'
  sources:
  - url: https://perspectiveapi.com/
