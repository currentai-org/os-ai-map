adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: none published; Jigsaw has never published a usage figure
  note: 'Jigsaw''s own site publishes no usage figure for Perspective, so its reach is read from years of
    broad, widely reported use in comment moderation by news publishers and platforms. That describes established
    use rather than where the product stands today: Google is sunsetting the API, which goes out of service
    after 2026, citing falling demand for a standalone tool in this area.'
  last_verified: '2026-09-29'
  sources:
  - url: https://perspectiveapi.com/
    shows: 'Perspective''s own site is now a sunset notice: "Over the years, Perspective has grown from
      an experimental tool into a helpful solution for publishers and platforms" and "AI capabilities have
      evolved, and there is now less demand for a standalone tool specific to this area". Searched the body
      for million, requests per, partners, customers and developers: no usage figure of any kind appears.'
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: c40c721ce2b0d461023e5f36699ce3be9a39da5493b51eff326dccd938ba1b8f
  - url: https://www.lassomoderation.com/blog/what-is-perspective-api/
    shows: 'A third-party moderation vendor''s overview describes long-standing broad use: "For nearly a
      decade, platforms like the New York Times and Reddit have relied on the Perspective API to keep toxic
      comments in check" and "the API has grown to serve over 1,000 partners across news publishers, social
      platforms, gaming communities, and educational tools", with the service "Sunsetting after December
      31, 2026".'
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: 177d5a304ab27e277afa4f1ebe32f891a338edaeaaab6b5a7967baf39759478e
  - url: https://en.wikipedia.org/wiki/Perspective_API
    shows: 'Wikipedia''s Jigsaw article (Perspective API redirects to its Perspective section) records the
      2017 launch and early deployment: "In February 2017, Jigsaw and Google launched the free Perspective"
      API as "a new tool for web publishers to identify toxic comments that can undermine a civil exchange
      of ideas", with The New York Times, The Guardian, The Economist and Wikipedia named as "launch partners
      included", and "Jigsaw stated that it was sunsetting the Perspective API (with the service ending
      after 2026)".'
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: 1d96328dfb6464a7dc69740d3facbb12e534706b02bfa1cb407878310a2caf46
capability:
  score: 3
  basis: feature_matrix
  basis_detail: attribute coverage
  value: Scores toxicity and related attributes (insult, threat, profanity, identity attack) for text,
    multilingual; established but a fixed attribute set.
  confidence: low
  note: Perspective scores toxicity, severe toxicity, insult, threat, profanity and identity attack across
    many languages, from a small and stable production attribute set. That set is narrower than a full safety
    taxonomy or a policy-conditioned model that reasons over an open set of categories a user defines.
  last_verified: '2026-09-29'
  sources:
  - url: https://commentanalyzer.googleapis.com/$discovery/rest?version=v1alpha1
    shows: 'The API''s own discovery document describes a hosted comment-scoring service: "The Perspective
      Comment Analyzer API provides information about the potential impact of a comment on a conversation",
      with requests carrying "The language(s) of the comment and context. If none are specified, we attempt
      to automatically detect the language" and "Specification of requested attributes".'
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: f228209540d7999cd6e48d2b9bd0ceb85094cb337f9775edf40f63a0675621b5
