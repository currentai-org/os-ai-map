adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: none published; Jigsaw has never published a usage figure
  note: 'NOT confirmed on 2026-08-13, and the record has two problems rather than one. First the instrument:
    usage_volume claims a download or install count, and Jigsaw has never published one for Perspective
    - the 1M-10M label asserts a measurement nobody made, which is what adoption.md forbids on a claim of
    this kind. Second the level: the site now announces the API is sunsetting, out of service after December
    31, 2026, and gives as the reason that ''AI capabilities have evolved, and there is now less demand
    for a standalone tool specific to this area''. A level 4 on a discontinued free API is a claim about
    the past. Recommend reported_traction with no reach and a level the owner sets; not taken here. The
    instrument now reads reported_traction, which is what a credible claim with no count behind it is for,
    and the illegal numeric reach is gone. The LEVEL is deliberately unchanged: correcting how a band was
    read is not a reason to move where it sits, and nothing in the cited sources argues the standing is
    different. What changes is that the record no longer claims a measurement nobody made.'
  last_verified: '2026-08-13'
  sources:
  - url: https://perspectiveapi.com/
    shows: Sunset announcement and transition period. No usage figure of any kind - no request volume, no
      customer count, no developer count - appears on the page.
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: c40c721ce2b0d461023e5f36699ce3be9a39da5493b51eff326dccd938ba1b8f
capability:
  score: 3
  basis: feature_matrix
  basis_detail: attribute coverage
  value: Scores toxicity and related attributes (insult, threat, profanity, identity attack) for text,
    multilingual; established but a fixed attribute set.
  confidence: low
  note: 'Mature toxicity scoring with broad real-world use; narrower than full safety taxonomies and policy-conditioned
    models. NOT confirmed on 2026-08-13 - the cited page no longer carries the attribute list at all, having
    been replaced by the sunset notice, so nothing on it supports the recorded value. The developer site
    that does carry the attributes renders client-side and returned no readable content, so the fact could
    not be re-derived from a fetch rather than being found absent. A source that still shows the attributes
    is needed, and the sunset raises the separate question of whether a product leaving service in 2026
    should carry a live capability band at all.
    Re-derived 2026-08-14 against substitutes. The developer site genuinely cannot be fetched - it is
    a client-rendered Salesforce Experience site that serves an empty body, which no header changes,
    so the fact was established elsewhere. The Comment Analyzer discovery document, the API''s own
    machine-readable definition and still served at 200, shows the service live and multilingual,
    taking "ISO and BCP-47 language codes" and detecting language per comment. The fixed attribute
    set is corroborated by Lasso''s write-up, which names it exactly as the value does - "The
    production attributes (TOXICITY, SEVERE_TOXICITY, IDENTITY_ATTACK, INSULT, PROFANITY, THREAT)" -
    plus experimental ones. Provenance caveat kept in view - Lasso sells a competing moderation
    product, so it is a document rather than a re-derivable dataset, and confidence stays low. The
    band is unchanged, but the ESCALATION STANDS - the same page states Perspective "will sunset
    after December 31, 2026, with no migration path provided", so whether a sunsetting product should
    carry a live capability band is still a ruling for the orchestrator, not a fetch problem.'
