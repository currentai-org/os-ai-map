capability:
  score: 3
  basis: feature_matrix
  basis_detail: attribute coverage
  value: Scores toxicity and related attributes (insult, threat, profanity, identity attack) for text,
    multilingual; established but a fixed attribute set.
  confidence: low
  note: Mature toxicity scoring with broad real-world use; narrower than full safety taxonomies and policy-conditioned
    models. The main product page no longer carries the attribute list, having been replaced by the sunset
    notice, and the developer site that does carry it is a client-rendered Salesforce Experience page serving
    an empty body that no change of headers fixes - so the facts come from elsewhere. The Comment Analyzer
    discovery document, which is the API's own machine-readable definition and is still served live, shows
    the service running and multilingual, taking "ISO and BCP-47 language codes" and detecting language
    per comment. The fixed attribute set is corroborated by Lasso's write-up, which names it exactly - "The
    production attributes (TOXICITY, SEVERE_TOXICITY, IDENTITY_ATTACK, INSULT, PROFANITY, THREAT)" - plus
    experimental ones. Lasso sells a competing moderation product, so that is a document rather than a re-derivable
    dataset, and confidence stays low. The same page also states that Perspective "will sunset after December
    31, 2026, with no migration path provided", which sits awkwardly beside a live capability band.
  last_verified: '2026-08-14'
  sources:
  - url: https://perspectiveapi.com/
    shows: Sunset notice only. The toxicity and attribute scoring the value describes is no longer
