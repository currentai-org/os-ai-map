capability:
  score: 4
  basis: feature_matrix
  value: About thirty metrics in groups for RAG (faithfulness, context precision), agents and tool use,
    natural-language comparison, SQL and general purpose (aspect critic through DiscreteMetric); automatic
    test-data generation; custom metrics supported. Scoped to LLM-application evaluation rather than academic-benchmark
    model evaluation.
  confidence: medium
  relative_to: helm
  relation: one_below
  last_verified: '2026-09-29'
  note: Ragas ships about thirty metrics grouped by use, including retrieval-augmented generation, agents
    and tool use, SQL and general-purpose metrics, plus automatic test-set generation and support for writing
    custom metrics. It is scoped to LLM applications and RAG pipelines, so it covers less benchmark ground
    than HELM.
  sources:
  - url: https://github.com/explodinggradients/ragas
    shows: objective metrics (LLM-based + traditional), Aspect Critique, automatic test-data generation,
      integrations
