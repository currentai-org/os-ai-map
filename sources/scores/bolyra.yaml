capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: agent credentials checked against a registry in the core tier and EdDSA-signed proofs in the zero-knowledge
    tier; per-tool policy checked on every call at the gateway; delegation that narrows permissions one way; ES256K-signed,
    hash-chained receipts for every allow and deny; no step that holds a call for a person
  confidence: medium
  note: Bolyra verifies the agent's own credential, applies per-tool policy to every call, narrows delegated permissions
    one way and signs a hash-chained receipt for each decision. Its gateway does not hold a call while a person
    reviews it.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/bolyra/bolyra/main/README.md
    shows: The README says every tool call gets "credential verification, per-tool policy, replay protection, and
      a signed audit receipt", and that "a delegation circuit narrows scope one-way (permissions can only drop,
      never widen)".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: cb219d0bd16b4c319dfb2856a41f2d491e24f6cbad842a0e847194694894f6bf
  - url: https://raw.githubusercontent.com/bolyra/bolyra/main/integrations/receipts/README.md
    shows: The receipts README documents "Hash-chained logs", where each signed payload carries a sequence number
      and the previous receipt hash.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 30c8c655de9cd2c89220573322bbdb8bf3d676ff90355e23d28b610f8e456637
