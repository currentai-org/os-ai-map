capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Nepali pretraining text
  value: The corpus holds about 6.4 million crawled Nepali articles (27.5 GB), documented in a paper and a
    short card, and its publisher's own BERT, RoBERTa and GPT-2 models are the only ones known to be trained
    on it.
  confidence: medium
  note: The corpus gives Nepali a crawled article collection larger than earlier Nepali corpora, described
    in a paper, and IRIIS Research trained its Nepali BERT, RoBERTa and GPT models on it, though no outside
    model is known to use it. At several billion tokens, estimated from its size on disk, it is far below the
    trillions of tokens in English pretraining corpora, but its band is measured against what Nepali has, an
    official language with more than a million speakers and a modest written web, the same yardstick as the
    Basque Latxa Corpus at this band. Sangraha, a corpus across twenty-two Indic languages, holds more text
    overall.
  relative_to: latxa-corpus
  relation: at
  last_verified: '2026-11-11'
