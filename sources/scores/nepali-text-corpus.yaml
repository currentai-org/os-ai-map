capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Nepali pretraining text
  value: The corpus holds about 6.4 million crawled Nepali articles (27.5 GB), documented in a paper and a
    short card, and its publisher's own BERT, RoBERTa and GPT-2 models are the only ones known to be trained
    on it.
  confidence: medium
  note: The corpus is described in a paper and is larger than earlier Nepali corpora, and IRIIS Research trained
    its Nepali BERT, RoBERTa and GPT-2 models on it. No model from outside its publisher is known to use it,
    and Sangraha, a documented corpus across 22 Indic languages, is far larger.
  relative_to: sangraha
  relation: two_below
  last_verified: '2026-09-24'
