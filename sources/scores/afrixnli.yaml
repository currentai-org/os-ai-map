adoption:
  level: 2
  reach: 1K-10K
  signal_type: usage_volume
  confidence: high
  note: Hugging Face downloads of AfriXNLI's own repository over the trailing month. AfroBench declares the same repository
    as a channel that does not measure runs of the suite, so these downloads count here and not on AfroBench. Evaluation
    harnesses can fetch a test set repeatedly, so the figure is a rough measure of use, not a count of users.
  sources:
  - url: https://huggingface.co/api/datasets/masakhane/afrixnli
    shows: '"downloads":1919 for masakhane/afrixnli.'
