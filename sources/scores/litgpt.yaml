capability:
  score: 3
  basis: feature_matrix
  value: 'Methods: full finetuning, LoRA, QLoRA, Adapter/Adapter v2, pretraining + continued pretraining;
    Flash Attention, FSDP, fp4/8/16/32 quantization; 1-1000+ GPU/TPU. No PPO/GRPO/DPO RL post-training.'
  confidence: medium
  note: LitGPT offers pretraining and fine-tuning recipes, including full fine-tuning, LoRA, QLoRA and Adapter
    methods, over readable from-scratch model implementations, with FSDP and Flash Attention for multi-GPU
    training. It documents no preference or reinforcement-learning methods such as DPO, PPO or GRPO, which
    leaves it behind post-training libraries such as TRL and Axolotl.
  last_verified: '2026-11-16'
