  value: About 1,250 hours of transcribed natural speech in 19 languages plus studio text-to-speech recordings
    in 17, recorded and transcribed by people, documented in a paper, with Ethio-ASR recognizers trained on
    it.
  confidence: medium
  note: WAXAL pairs about 1,250 hours of transcribed speech with single-speaker text-to-speech recordings across
    24 languages, is documented in a paper, and recognizers such as Ethio-ASR are trained on it. Afrivoice
    has far more hours for many of the same languages, and part of WAXAL's audio comes from it.
