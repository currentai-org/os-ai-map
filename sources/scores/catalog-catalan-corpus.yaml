capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Catalan pretraining text
  value: About 17.45 billion words of Catalan from 26 sources, mostly filtered Common Crawl plus media, library
    and government text, documented in a card with per-source licenses, and used to train Salamandra, ALIA-40b
    and FLOR-6.3B.
  confidence: medium
  note: CATalog is the Catalan pretraining corpus behind the Barcelona Supercomputing Center's Salamandra and
    ALIA models and the earlier FLOR model, its card documents every source with its license and word count,
    and each document carries a quality score so users can filter at their own threshold. At under twenty billion
    words it is large for Catalan yet far below the trillions of tokens in English web corpora such as FineWeb.
  last_verified: '2026-09-24'
  sources:
