capability:
  score: 4
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: GPU-parallel simulation across many worlds on Warp, eight solvers (XPBD, VBD, MuJoCo, Featherstone, SemiImplicit,
    Kamino, ImplicitMPM, Style3D), a Warp tiled camera sensor ray-tracing across multiple worlds, contact and IMU sensors,
    robot examples for Allegro hand, ANYmal, G1, H1 and UR10. No ready-to-train task library.
  confidence: medium
  note: Newton has GPU-parallel worlds, ray-traced cameras across them and more physics backends than any engine here, from
    MuJoCo to cloth and granular solvers. What it ships for robots are examples, not a library of ready-to-train tasks, which
    is what separates Isaac Lab.
  relative_to: isaac-lab
  relation: one_below
  last_verified: '2026-09-27'
  sources:
  - url: https://newton-physics.github.io/newton/latest/guide/overview.html
    shows: 'Overview: "GPU-accelerated, extensible, and differentiable physics simulation engine"; "Multiple solver implementations
      : XPBD, VBD, MuJoCo, Featherstone, SemiImplicit, Kamino, ImplicitMPM, and Style3D"; "Load models from URDF, MJCF, USD".'
    accessed: '2026-09-27'
