capability:
  score: 4
  basis: feature_matrix
  value: 100+ datasets (70+ with ~400k questions); 20+ HF models pre-supported + OpenAI/Gemini/Claude
    API backends; broad multi-task coverage and standardized reporting
  confidence: medium
  relative_to: lm-evaluation-harness
  relation: one_below
  note: OpenCompass documents over a hundred supported datasets and runs models through Hugging Face, LMDeploy,
    vLLM or hosted APIs, with rule-based and LLM-as-judge evaluation. It sits a step below lm-evaluation-harness,
    which has been used to report results in hundreds of papers and is the more established reference.
