adoption:
  level: 3
  signal_type: reported_traction
  confidence: medium
  banded_quantity: GitHub stars (7,299) and framework distribution breadth
  note: OpenCompass is widely used in the China and Hugging Face ecosystems, with broad dataset and backend
    coverage and a GitHub star footprint to match. A PyPI package named opencompass is genuinely this project's,
    but its documented install path is a git clone, so banding on its downloads would read a minority channel
    rather than the project, leaving reported framework use as the basis instead.
