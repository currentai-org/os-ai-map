capability:
  score: 3
  basis: feature_matrix
  value: Download, resize and package image URL lists (with captions) into webdataset, parquet, TFRecord or files; multiprocessing,
    PySpark and Ray distribution; X-Robots-Tag opt-out filtering by default; recipes for LAION-400M (400M pairs in 3.5 days)
    and LAION-5B (5B pairs in 7 days on 10 nodes). A single-purpose acquisition tool with no quality filtering or deduplication
    of its own.
  confidence: medium
  note: 'img2dataset does one job at very large scale: fetching and packaging billions of web images, as it did for the LAION
    datasets. Like CCNet, it is a single-approach pipeline, and quality filtering and deduplication are left to other tools.'
  relative_to: ccnet
  relation: at
