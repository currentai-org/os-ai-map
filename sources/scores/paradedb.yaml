capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: BM25 full-text search, vector search and aggregations behind a single custom Postgres index, inheriting
    persistence, transactions and durability from Postgres rather than implementing its own.
  relative_to: pgvector
  relation: at
  confidence: medium
  note: ParadeDB is a Postgres extension with the same shape as pgvector, inheriting persistence and transactions
    from Postgres rather than implementing its own. It covers more retrieval modes than pgvector — full-text,
    vector and aggregation rather than vector alone — but adds no distribution or clustering beyond what
    Postgres provides, so neither reaches the fully distributed tier.
  comparison:
    last_attested: '2026-09-02'
