adoption:
  level: 2
  reach: 10K-100K
  signal_type: usage_volume
  confidence: medium
  note: ~35k GitHub stars plus 100k+ Docker pulls on the current itzcrazykns1337/vane image by mid-2026
    - genuine install volume (usage_volume, not stars-only), but well below the 1M+ band, so mid-tier. Banded
    under the lifetime-average rule in docs/reference/adoption.md. Docker Hub reports 645,952 cumulative
    pulls on itzcrazykns1337/perplexica since 2025-03-20, which averages ~38,479 a month over 16.8 months
    and bands at 10K-100K. A reach of '100K+ Docker pulls' would read a cumulative six-figure total as though
    it were a monthly one, which is precisely the substitution the n8n rule names, and would put the record
    a band above what its own number supports. Recorded as a declared floor - a lifetime average understates
    a growing product. Docker is not declared as an artifact here, so the figure lives in this note rather
    than in a signal. The successor image itzcrazykns1337/vane, registered 2026-03-09, stands at 284,672
    cumulative pulls, roughly 55,000 a month over 5.2 months, which bands at 10K-100K by a different route
    - the same level the perplexica-image calculation reaches. The two images together stand at 931,112
    lifetime pulls, and the declared-floor caveat still applies.
