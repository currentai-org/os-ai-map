capability:
  score: 4
  basis: benchmark
  basis_detail: Cohere's own RCP-nDCG@10 runs on ViDoRe V3, BEIR, BRIGHT and nanoMTEB for Rerank 5; Cohere's
    18-language suite and BEIR claims for Rerank 3.5; Voyage's in-house 93-dataset run; Agentset's ELO leaderboard
    (FiQA, SciFact, PG)
  value: 'Rerank 5, in Pro and Fast tiers, is the current generation: Cohere reports that Rerank 5 Pro ranks
    first on 39 of 46 composite datasets across ViDoRe V3, BEIR, BRIGHT and nanoMTEB, scored with its own
    RCP-nDCG@10 method (vendor-reported). Earlier generations: Rerank 4 in fast and pro variants with a
    32K context and a vendor-claimed lead over Voyage and Jina rerankers; Rerank 3.5 with vendor-claimed
    SOTA on BEIR and multilingual retrieval at a 4096-token context and +26.4% on cross-lingual search over
    Rerank 3. Trained across 100+ languages.'
  confidence: medium
  note: Cohere reports that Rerank 5 Pro leads ViDoRe V3, BEIR, BRIGHT and nanoMTEB, but those are vendor-reported
    results, scored with Cohere's own method, and no independent evaluation of Rerank 5 has been published.
    The only independent comparison, Agentset's leaderboard, ranks the previous Rerank 4 Pro second, just
    behind Zerank 2 and ahead of Voyage rerank-2.5, on LLM-judged head-to-head wins over three datasets,
    which shows Cohere level with those rerankers rather than clearly ahead.
  last_verified: '2026-11-16'
