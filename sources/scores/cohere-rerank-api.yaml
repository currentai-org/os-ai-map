  score: 4
  basis: benchmark
  basis_detail: nDCG@10 over Cohere's in-house 18-language multilingual suite, plus Voyage's independent 93-dataset run
  value: vendor-claimed SOTA on BEIR and on multilingual retrieval, plus reasoning capability and a 4096-token
    context, on the 3.5 release; +26.4% on cross-lingual search against the previous Rerank 3, measured by
    nDCG@10 over an in-house 18-language suite; trained across 100+ languages, with 4.0 shipping fast and
    pro variants
  confidence: medium
  note: Cohere reports state-of-the-art BEIR and multilingual retrieval results for Rerank 3.5, including
    a 26.4% cross-lingual gain over its own previous Rerank 3, measured on an 18-language in-house suite.
    No independent reranker leaderboard covers this API, and the one external comparison available, Voyage's
    93-dataset benchmark, has rerank-2.5 ahead of Rerank v3.5 by 7.94%, which keeps the score a step below
    the frontier rather than at it.
