capability:
  score: 4
  basis: benchmark
  basis_detail: nDCG@10 over Cohere's in-house 18-language suite and BEIR; Voyage's in-house 93-dataset
    run; Agentset's ELO leaderboard (FiQA, SciFact, PG)
  value: vendor-claimed SOTA on BEIR and on multilingual retrieval, plus reasoning capability and a 4096-token
    context, on the 3.5 release; +26.4% on cross-lingual search against the previous Rerank 3, measured
    by nDCG@10 over an in-house 18-language suite; trained across 100+ languages, with Rerank 4 shipping
    fast and pro variants, a 32K context and a vendor-claimed lead over Voyage and Jina rerankers
  confidence: medium
  note: Cohere reports state-of-the-art BEIR and multilingual results for Rerank 3.5, and its Rerank 5 Pro
    is now claimed to lead public benchmarks in Cohere-run evaluations. The only independent evidence is
    Agentset's leaderboard, which still lists Rerank 4 Pro second, just behind Zerank 2 and ahead of Voyage
    rerank-2.5. It ranks by LLM-judged head-to-head wins on only three datasets, so it shows Rerank 4 level
    with those rerankers rather than clearly ahead.
