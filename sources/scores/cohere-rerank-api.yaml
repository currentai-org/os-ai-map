adoption:
  level: 3
  signal_type: reported_traction
  confidence: medium
  note: 'Cohere does not publish a call-volume or user count for Rerank, so adoption is read from how widely
    it is distributed: through Cohere''s own API and resold as a managed service on Azure AI Foundry, AWS
    SageMaker JumpStart and Oracle GenAI. The `cohere` PyPI package is not a proxy for this product; it
    is the vendor''s single SDK for chat, embedding, classification and reranking together, so its download
    count measures that whole surface rather than Rerank alone.'
