capability:
  score: 5
  basis: feature_matrix
  basis_detail: coverage and downstream use for Norwegian pretraining text
  value: About 4.6 billion words in 8.2 million documents of Norwegian text, largely OCR of National Library
    books and newspapers plus public-sector sources, documented in LREC and NoDaLiDa papers, and used to train
    NB-BERT, NB-GPT-J, NorMistral and NorBLOOM.
  confidence: medium
  note: The Norwegian Colossal Corpus is behind the National Library's NB-BERT and NB-GPT-J models and is a
    training source for NorMistral and NorBLOOM, with an LREC paper and a detailed card. Withdrawing the agreement-licensed
    newspapers cut it from over 7 billion words to about 4.6 billion.
  last_verified: '2026-09-24'
  sources:
