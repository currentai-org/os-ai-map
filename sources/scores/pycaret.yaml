    forecasting - one setup call, then compare_models trains and ranks every applicable model, with tuning,
    blending, stacking, evaluation and deployment of the chosen pipeline
  relative_to: autogluon
  relation: at
  confidence: medium
  note: PyCaret's compare_models call trains and ranks every applicable model on the user's data and returns
    the best, so choosing among learners is done for the user. It sits with AutoGluon on that automation,
    though the user still drives each step with a function call.
