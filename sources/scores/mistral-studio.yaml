capability:
  score: 4
  basis: feature_matrix
  basis_detail: API reference coverage, with Artificial Analysis's independent provider measurements; placed against
    fireworks-inference
  value: The API reference lists chat completion, FIM, embeddings, classifiers, files, models, batch, OCR, audio
    transcription, audio speech and realtime sessions, plus workflows, agents, conversations, libraries and observability
    endpoints. Artificial Analysis tracks 8 models on Mistral's API; the fastest are GLM-5.2 (max) at 223 output
    tokens/sec, Ministral 3 3B at 215 t/s and Mistral Medium 3.5 at 163 t/s.
  relative_to: fireworks-inference
  relation: at
  confidence: medium
  note: Mistral's API covers more kinds of work than most hosted inference services, from chat and code completion
    to OCR, speech and batch jobs, and it is the first-party source for Mistral's own models. Its fastest models
    run slower than the fastest Fireworks serves, so it sits alongside Fireworks rather than above it.
  comparison:
    last_attested: '2026-10-13'
    sources:
