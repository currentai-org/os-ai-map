capability:
  score: 4
  basis: feature_matrix
  value: 'eval modality: blind pairwise human-preference battles -> Elo/Bradley-Terry ranking (the reference
    human-eval methodology); coverage: 70+ LLMs, multimodal/vision/coding arenas; agentic-eval: limited
    (preference-based, not task-execution); reproducibility: Arena-Hard-Auto provides an automatic-judge
    approximation'
  confidence: medium
  last_verified: '2026-08-13'
  note: The hosted arena runs blind pairwise human-preference battles across many models, and Arena-Hard-Auto
    v2.0 adds an automatic-judge companion of 500 hard queries and 250 creative-writing prompts scored by
    GPT-4.1 and Gemini-2.5. The evaluation code is largely closed and hosted, and narrower on agentic and
    task-execution coverage than harnesses built around running tasks.
  sources:
