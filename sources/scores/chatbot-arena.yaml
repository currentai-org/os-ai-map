  value: 'eval modality: blind pairwise human-preference battles -> Elo/Bradley-Terry ranking; coverage:
    70+ LLMs, multimodal/vision/coding arenas; agentic-eval: limited (preference-based, not task-execution);
    reproducibility: Arena-Hard-Auto provides an automatic-judge approximation'
  confidence: medium
  last_verified: '2026-09-29'
  note: The hosted arena runs blind pairwise human-preference battles across many models, and Arena-Hard-Auto
    adds an automatic-judge companion built from hard real-world queries and creative-writing prompts. The
    evaluation code is largely closed and hosted, and it covers agentic and task-execution work less than
    harnesses built around running tasks.
