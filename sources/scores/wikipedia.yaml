capability:
  score: 4
  basis: training_value
  basis_detail: downstream
  value: null
  confidence: high
  note: Wikipedia text is a documented part of major open pretraining mixes. LLaMA sampled it at 4.5 percent,
    about 2.45 epochs over its 1.4-trillion-token run, and trained a classifier on pages that Wikipedia cites
    to select web text; OLMoE's mix carries it through Dolma. That evidence is about Wikipedia text, not this
    particular Hugging Face distribution of it. No ablation shows it beating a current web corpus, so it sits
    with the documented, reused components, as pes2o does.
  last_verified: '2026-09-26'
  sources:
  - url: https://arxiv.org/pdf/2302.13971
    shows: LLaMA paper full text. Table 1 lists Wikipedia at a 4.5 percent sampling proportion over 2.45
      epochs, and the CommonCrawl pipeline trains a classifier on pages used as references in Wikipedia
      versus randomly sampled pages
