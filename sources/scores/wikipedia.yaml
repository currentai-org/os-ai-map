capability:
  score: 4
  basis: training_value
  basis_detail: downstream
  value: null
  confidence: high
  note: Wikipedia text is a documented part of major pretraining mixes. LLaMA sampled it at 4.5 percent,
    about 2.45 epochs over its 1.4-trillion-token run, and OLMoE's mix carries it through Dolma. That evidence
    is about Wikipedia text, not this particular Hugging Face distribution of it. No ablation shows it
    beating a current web corpus, so the score comes from documented reuse rather than a measured gain.
  last_verified: '2026-09-26'
  sources:
  - url: https://arxiv.org/pdf/2302.13971
    shows: LLaMA paper full text. Table 1 lists Wikipedia at a 4.5 percent sampling proportion and 2.45
      epochs when training on 1.4T tokens
