capability:
  score: 4
  basis: training_value
  basis_detail: downstream
  value: null
  confidence: high
  note: Wikipedia is in the pretraining mix of most open model families, usually repeated more often than its
    size alone would earn. LLaMA sampled it at 4.5 percent for about two and a half epochs and used it as the
    quality reference for filtering web text, and OLMoE's mix carries it through Dolma. No ablation shows it
    beating a current web corpus, so it sits with the documented, heavily reused components.
  last_verified: '2026-09-26'
  sources:
  - url: https://arxiv.org/pdf/2302.13971
    shows: LLaMA paper full text. Table 1 lists Wikipedia at a 4.5 percent sampling proportion over 2.45
      epochs, and the CommonCrawl pipeline trains a classifier on pages used as references in Wikipedia
      versus randomly sampled pages
