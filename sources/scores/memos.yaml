capability:
  score: 5
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: search scoped to a user and readable memory cubes; LLM extraction of structured memories from conversations,
    documents and tool traces; scheduler-driven reorganization and merging, preference deduplication and conflict
    detection, and feedback-based correction; forgetting in the scheduler and temporal decay of preferences; working,
    long-term, user and preference memory in a graph with activated, merged and archived states
  confidence: medium
  note: 'MemOS performs every part of the cycle itself: it extracts memories from raw input, merges and corrects
    them in the background, forgets and decays them over time, and keeps several typed memories in a graph.'
  relative_to: graphiti
  relation: at
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/MemTensor/MemOS/main/docs/en/open_source/modules/memories/overview.md
    shows: The memory module overview describes automatic extraction, organizing and linking, and lists preference
      memory with "Preference deduplication and conflict detection" and "Temporal decay support".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 8b2ca8a5e1db86c25320ebc395785a06936905c57332453e042addf4334b4c2e
  - url: https://raw.githubusercontent.com/MemTensor/MemOS/main/docs/en/open_source/modules/mem_scheduler.md
    shows: The scheduler guide says it "Executes read/write, compression, forgetting, and type conversion operations
      on three-layer memory (Working/Long-term/User)" and runs reorganization and merge tasks.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: cf174a5e64c853861a247d129526a741a82e5eb5a393866f09fefa894c92425a
  - url: https://raw.githubusercontent.com/MemTensor/MemOS/main/docs/en/open_source/modules/memories/tree_textual_memory.md
    shows: The tree textual memory guide extracts structured memories with an LLM into graph nodes typed WorkingMemory,
      LongTermMemory or UserMemory, each activated, archived or deleted.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 7c55c3c217ead7d45a7e68c2225d585efd2ac92c83e46dd6ffb12ef00679cae1
