capability:
  score: 4
  basis: feature_matrix
  relative_to: firecracker
  relation: one_below
  value: isolation:VM (Firecracker microVM, strong); cold-start:fast (sub-second class); language/runtime
    breadth:Python+JS/TS code interpreter + custom templates; persistence:filesystem; scale:1B+ sandboxes
    started
  confidence: high
  note: 'VM-grade isolation (Firecracker) is the strongest tier in the feature matrix, with broad SDK and
    runtime support and proven scale: e2b.dev states "Each sandbox is powered by Firecracker, a microVM
    made to run untrusted workflows", offers sessions up to 24 hours with configurable CPU and RAM, and
    reports 1b+ started sandboxes. It sits one rung below Firecracker itself, the frontier-definer it builds
    on, so 4 rather than 5. Independent ComputeSDK TTI benchmarks put E2B at a 0.66s median time-to-interactive,
    12th by median of 24 providers, where an earlier run had it at ~370ms and 7th of 19: still sub-second,
    so the fast cold-start holds, but the corroboration is weaker than it was and the band now rests on
    isolation strength and scale rather than on speed.'
  last_verified: '2026-08-13'
  sources:
  - url: https://e2b.dev/
    shows: each sandbox powered by Firecracker microVM; 1B+ sandboxes started
    accessed: '2026-06-04'
  - url: https://www.computesdk.com/benchmarks/sandboxes/
    shows: 'ComputeSDK TTI leaderboard (independent, 100 iters/day, 2026-07-09 run): median time-to-interactive
      ~370ms sequential / ~470ms burst @100 concurrent; 7th-fastest of 19 providers'
    accessed: '2026-07-09'
  - url: https://e2b.dev/
