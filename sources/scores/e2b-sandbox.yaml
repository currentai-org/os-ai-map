product: e2b-sandbox
openness:
  score: 5
  class: open_source
  components:
    license:
    - name: Apache-2.0
      detail: OSI
    source:
      value: public
      detail: SDKs+infra, Terraform self-host
    managed-tier:
      value: e2b.dev hosted sandbox cloud
