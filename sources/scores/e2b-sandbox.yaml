capability:
  score: 4
  basis: feature_matrix
  relative_to: firecracker
  relation: one_below
  value: isolation:VM (Firecracker microVM, strong); cold-start:fast (sub-second class); language/runtime
    breadth:Python+JS/TS code interpreter + custom templates; persistence:filesystem; scale:1B+ sandboxes
    started
  confidence: high
  note: E2B runs each sandbox on a Firecracker microVM, the strongest isolation tier in the category, with
    sessions up to 24 hours and configurable CPU and RAM; ComputeSDK's independent benchmark puts its median
    time-to-interactive at 0.66 seconds, twelfth of 24 providers. That keeps E2B a step below Firecracker,
    the platform it builds on and the frontier of the category.
  last_verified: '2026-08-13'
  sources:
  - url: https://e2b.dev/
    shows: each sandbox powered by Firecracker microVM; 1B+ sandboxes started
