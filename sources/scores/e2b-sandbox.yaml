capability:
  score: 4
  basis: feature_matrix
  relative_to: firecracker
  relation: one_below
  value: isolation:VM (Firecracker-based microVM, strong); cold-start:fast (sub-second class); language/runtime
    breadth:Python+JS/TS SDKs + custom templates; persistence:filesystem+memory (pause/resume, snapshots);
    scale:1B+ sandboxes started
  confidence: high
  note: E2B runs each sandbox as its own Firecracker microVM, with sessions of up to 24 hours on the Pro
    plan, pause and resume that keeps memory as well as the filesystem, and configurable CPU and RAM. Its
    isolation comes from Firecracker, the runtime that sets the frontier of the category, and as a managed
    layer built on that runtime E2B sits a step below it.
  last_verified: '2026-09-29'
  sources:
  - url: https://e2b.dev/
    shows: Homepage says the microVM runtime is "built on Firecracker with dedicated kernels and a custom
      memory and snapshot layer" and is "Battle-tested across 1B+ sandboxes".
