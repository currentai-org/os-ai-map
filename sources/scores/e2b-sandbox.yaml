openness:
  score: 5
  class: open_source
  components:
    license:
    - name: Apache-2.0
      detail: OSI
    source:
      value: public
      detail: SDKs+infra, Terraform self-host
    managed-tier:
      value: e2b.dev hosted sandbox cloud
      detail: proprietary
      raw: e2b.dev hosted sandbox cloud (proprietary)
    core-gated:
      value: ungated
      detail: the infrastructure powering E2B Cloud is itself published Apache-2.0 as e2b-dev/infra with
        no carve-out, and the paid tiers are capacity and session-length limits on the hosted service rather
        than features held back from the source
  confidence: high
  note: 'Apache-2.0 SDKs and infrastructure with a managed cloud sold beside them. Nothing in the core is
    held back, and that reading rests on both repos and the pricing page. e2b-dev/E2B carries four Apache-2.0
    LICENSE files, all copies of the root, and no carve-out - but the decisive fact is the second repo:
    e2b-dev/infra, described by the org as "Infrastructure that is powering E2B Cloud", is public, Apache-2.0
    and equally free of an enterprise directory. The managed product runs the published code. The pricing
    tiers sell capacity and session length - CPU/RAM customization, 24-hour sessions, 100 concurrent sandboxes
    rising to 1,100 - and name no capability the source withholds.'
  raw: license:Apache-2.0(OSI);source:public(SDKs+infra, Terraform self-host);managed-tier:e2b.dev hosted
    sandbox cloud (proprietary);core-gated:ungated(the infrastructure powering E2B Cloud is itself published
