  score: 1
  basis: benchmark
  basis_detail: GLUE, BEIR, MLDR and code-retrieval results in the ModernBERT paper and model card
  value: GLUE 88.4 (Base) and 90.4 (Large); BEIR 41.6 and 44.0 single-vector and 51.3 and 52.4 multi-vector;
    CodeSearchNet 56.4 and 59.5 (arXiv:2412.13663). A 395M-parameter encoder at most, which does not generate
    text.
  relative_to: comma
  relation: one_below
  confidence: high
  note: ModernBERT leads the older encoders it was tested against on most retrieval and code tasks, and
    its Base model is the first to pass DeBERTaV3 Base on GLUE, but it is an encoder of at most 395M parameters
    that cannot generate text. It sits a step below Comma, a 7B model that only matches 2023-era peers.
  comparison:
    last_attested: '2026-11-12'
