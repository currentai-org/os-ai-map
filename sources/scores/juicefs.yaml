capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: POSIX, S3-gateway and CSI access over object storage with a pluggable metadata engine, caching,
    clones and quotas. Complete file system rather than an index.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: JuiceFS is a complete, distributed POSIX file system over object storage, with a pluggable metadata
    engine, caching, clones and quotas, and it is a storage system rather than a search index. That keeps
    it one step below Vespa, which covers retrieval as well as storage.
  last_verified: '2026-09-30'
