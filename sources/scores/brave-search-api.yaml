capability:
  score: 4
  basis: feature_matrix
  value: one Search plan covering Web Search (title, url, description and up to five extra snippets per result)
    and LLM Context ("extracted page chunks and source metadata"), plus news, video, image, place, autosuggest
    and spellcheck endpoints
  confidence: high
  relative_to: firecrawl
  relation: at
  note: Brave's Search plan bundles LLM Context, which returns extracted page chunks and source metadata,
    with Web Search under the same $5-per-1,000-request price, giving one product both discovery and page
    content. That puts it level with Firecrawl, which sells the same combination; composing a cited answer
    instead requires the separate Answers plan, priced on its own.
  last_verified: '2026-09-17'
  sources:
  - url: https://api-dashboard.search.brave.com/documentation/services/llm-context
    shows: '"Traditional Web Search returns titles and short snippets for a results page. LLM Context returns
      extracted page chunks and source metadata in a shape and length that satisfies the needs of an LLM without
      need for further scraping." Feature bullet: "Pre-Extracted Content - Get actual page content (text, tables,
      code) ready for LLM consumption - no scraping needed."'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: 774496eb19ec82ecd855659141f91355b673e2b7e0f151517ee753c433fe75a3
