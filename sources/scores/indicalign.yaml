capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indic instruction data
  value: IndicAlign holds about 74.7 million prompt-response pairs in 14 Indic languages, about 74.3 million
    of them IndoWordNet entries recast as instructions and most of the rest translated or model-generated,
    documented in a paper, with only small community fine-tunes listed as trained on it.
  confidence: medium
  note: IndicAlign is well documented in the IndicLLMSuite paper, but nearly all of its pairs are short IndoWordNet
    dictionary entries recast as instructions, and most of the rest are translated or model-generated. Only
    small community fine-tunes list it as training data, whereas WangchanThaiInstruct is written and checked
    by people.
  relative_to: wangchan-thai-instruct
  relation: two_below
  last_verified: '2026-09-24'
  sources:
  - url: https://huggingface.co/datasets/ai4bharat/indic-align
    shows: 'Statistics table: IndoWordNet 74,272.2k examples, Wiki-Chat 202k, Wiki-Conv 144k, Toxic Matrix
      90.3k, other components 15k to 37k each.'
