capability:
  score: 4
  basis: feature_matrix
  basis_detail: category feature matrix, banded against the vllm anchor
  value: On-device execution of exported PyTorch models on phones, wearables, laptops, browsers, embedded
    systems and microcontrollers, through a runtime trimmed to the operators a deployment needs, with backends
    spanning XNNPACK, Vulkan, Qualcomm, MediaTek, Arm, Samsung Exynos, Core ML, MLX, OpenVINO, CUDA, WebGPU,
    NXP and Cadence, each target exported separately, plus the export and lowering toolchain.
  relative_to: vllm
  relation: one_below
  confidence: medium
  note: ExecuTorch is a tier below vLLM, level with ONNX Runtime, judged by execution-provider breadth across
    CPU, GPU, mobile and edge hardware. Its backend table covers more silicon vendors than Apple Core ML
    Runtime's, from phones and desktops down to microcontrollers, but it executes models on device rather
    than serving them with batching, parallelism and a multi-tenant API surface.
  comparison:
    last_attested: '2026-10-07'
    sources:
    - url: https://raw.githubusercontent.com/vllm-project/vllm/main/README.md
      shows: 'vLLM README feature list: PagedAttention, continuous batching, chunked prefill and prefix
        caching, "Tensor, pipeline, data, expert, and context parallelism for distributed inference", hardware
        plugins across GPU and accelerator vendors, and "200+ model architectures".'
