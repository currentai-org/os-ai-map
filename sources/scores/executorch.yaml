capability:
  score: 4
  basis: feature_matrix
  basis_detail: category feature matrix, banded against the vllm anchor
  value: On-device execution of exported models through a ~50KB C++ runtime, with twelve or more hardware backends
    across eight vendors - XNNPACK, Vulkan, Qualcomm, MediaTek and Samsung Exynos on Android, CoreML on iOS, OpenVINO
    and CUDA on Linux and Windows, Metal and MLX on macOS - switchable by changing one partitioner line, plus the
    export and lowering toolchain.
  relative_to: vllm
  relation: one_below
  confidence: medium
  note: 'One band below the vllm anchor, level with onnx-runtime, which is banded there on the same instrument:
    execution-provider breadth across CPU, GPU, mobile and edge. An earlier reading put this two below on the view
    that an on-device runtime is narrow by nature, which had it backwards - the backend matrix here spans eight
    silicon vendors and four host platforms, which is wider than apple-core-ml-runtime''s single-vendor coverage
    at the same band. It stays below the anchor because it executes exported models on device rather than serving
    them with batching, parallelism and a multi-tenant API surface.'
  last_verified: '2026-08-31'
  sources:
  - url: https://raw.githubusercontent.com/pytorch/executorch/main/README.md
    shows: 'README, read for the engine''s feature set: On-device execution of exported models through a ~50KB C++
