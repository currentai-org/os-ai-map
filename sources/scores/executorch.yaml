adoption:
  level: 5
  reach: mass-market
  signal_type: reported_traction
  confidence: medium
  banded_quantity: deployment breadth - shipped in Meta's family of apps and across twelve or more hardware backends
    from eight vendors - which is a breadth claim rather than a measured user count
  note: 'Banded on reported deployment rather than on stars, because stars measure the wrong thing for a runtime
    that ships inside other companies'' applications. Meta''s own engineering blog and the PyTorch documentation
    both state that ExecuTorch powers on-device inference across Instagram, WhatsApp, Messenger, Quest and Ray-Ban
    Meta smart glasses, for billions of people. The LICENSE corroborates the hardware side independently: its BSD-3-Clause
    header carries eight copyright holders - Meta, Arm, Qualcomm, Apple, MediaTek, NXP, Samsung and Intel - which
    is vendor participation in the runtime itself rather than a vendor list in marketing copy. `reported_traction`
    records a word and never a number, so no user figure is asserted here; 4,969 GitHub stars would have banded
    this at 2 and understated it by three levels.'
