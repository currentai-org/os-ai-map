  score: 2
  basis: feature_matrix
  value: one model family - an additive trend, seasonality and holiday regression fit in Stan - with saturating
    growth, changepoints, extra regressors, multiplicative seasonality and uncertainty intervals
  relative_to: sktime
  relation: one_below
  confidence: high
  note: Prophet is one well-engineered forecasting model, automated enough that an analyst can get a usable forecast
    in a few lines. It offers no other model to compare it with, which is what a time-series toolkit such as sktime
    adds, and it is now in maintenance mode.
