capability:
  score: 2
  basis: feature_matrix
  value: Natural-language-to-SQL agent over SQLite via Datasette; tools for save_query / execute_write_sql, background
    exploration, and pluggable tools (charts, image gen). Domain-specific; not a general coding agent; no standardized
    benchmark.
  confidence: medium
  note: 'Datasette Agent is a narrow, early structured-data agent: it can explore and query a SQLite database
    in natural language within Datasette, but it remains an alpha release with a limited feature scope.
    General coding-agent benchmarks are not the right yardstick for a domain-specific plugin this early.'
  last_verified: '2026-09-29'
