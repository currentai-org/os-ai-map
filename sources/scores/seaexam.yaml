  basis_detail: coverage and how the content was made, for Southeast Asian exam evaluation
  value: 23,813 multiple-choice rows in five languages, combining human exam questions adapted from M3Exam
    with MMLU questions machine-translated by Google Translate, documented in a NAACL Findings paper, and backing
    the SeaExam leaderboard.
  confidence: medium
  note: SeaExam backs a public leaderboard for Indonesian, Thai, Vietnamese, Chinese and English, and its paper
    appeared at NAACL. Part of it is MMLU run through Google Translate and the rest adapts the earlier M3Exam,
    and it tests exam knowledge only, where SEA-HELM spans many task types in more languages.
