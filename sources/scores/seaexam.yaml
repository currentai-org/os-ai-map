  score: 3
  basis: evaluation_depth
  basis_detail: 'depth ladder: corroborated median of per-language task bands, count-based and provisional'
  value: 'Depth band 3 of 5, provisional and count-based: the median corroborated band over its target
    languages, 4 of 4 measured, across 1 task. Face value 3; best original band unresolved (3-4).'
  confidence: medium
  note: In the typical language SeaExam targets, its deepest test has four hundred to sixteen hundred items
    that count toward depth. In one of its 4 languages a test taken from another dataset counts for less,
    because nothing independent backs it there. An item count says how much a set can test, not how precisely
    it ranks models.
