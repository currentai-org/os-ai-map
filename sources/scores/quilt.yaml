capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: Versioned, metadata-rich data packages on S3 with a deployed catalog stack - web browsing, previews and
    an indexing/search cluster provisioned alongside the storage - rather than a bare client or a single-node tool.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Quilt provisions its own search cluster and indexing Lambdas as part of its deployed stack, so it
    versions data it also indexes and serves itself rather than only versioning storage it does not index.
    It hosts no ranking or embedding model inside the query path, which is why it sits one step behind Vespa
    at the top of the category.
  comparison:
    last_attested: '2026-09-02'
    sources:
    - url: https://github.com/vespa-engine/vespa/blob/master/README.md
      shows: README still documents search, inference and organization over vectors, tensors, text and structured
        data at serving time, with ML inference evaluated inside the core engine.
      accessed: '2026-09-02'
      http_status: 200
      content_sha256: a24aafe980fb6283e58724086206500c7078503ae8d4b3919047740867a91338
  last_verified: '2026-09-02'
  sources:
  - url: https://github.com/quiltdata/quilt/blob/master/docs/Installation.md
    shows: Enterprise Installation deploys the catalog and stack - including its own search cluster and indexing
      Lambdas - via CloudFormation from this repository's source.
    accessed: '2026-09-02'
