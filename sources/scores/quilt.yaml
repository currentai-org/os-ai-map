capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: Versioned, metadata-rich data packages on S3 with a deployed catalog stack - web browsing, previews and
    an indexing/search cluster provisioned alongside the storage - rather than a bare client or a single-node tool.
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: Banded on the category feature matrix as complete retrieval system, distributed or cluster-capable. Placed
    one band below the vespa anchor, alongside juicefs - Quilt provisions its own search cluster and indexing
    Lambdas as part of the deployed stack rather than versioning over storage it does not itself index, which is
    what keeps lakefs and dvc at the band below this one. It hosts no ranking or embedding model inside the query
    path, so it does not reach the top rung.
  comparison:
    last_attested: '2026-09-02'
    sources:
