adoption:
  level: 2
  reach: 10K-100K
  signal_type: usage_volume
  confidence: medium
  note: Quilt's adoption reading comes from PyPI downloads of `quilt3`, the SDK and CLI built from this
    repository that creates, versions and installs Quilt packages against S3 without needing a deployed
    catalog, so the count reflects Quilt users rather than clients of a separate server. It undercounts
    people who only browse a deployed catalog and never install the package, which is why confidence is
    medium, though GitHub stars independently point to the same range.
  last_verified: '2026-09-02'
  sources:
