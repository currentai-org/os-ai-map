capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: per-action admission against a signed exact-action contract before the handler runs; signed delegation
    that cannot broaden its parent; signed evidence for every allow and deny; no agent identity of its own; no human
    approval step
  confidence: medium
  note: Besa admits or refuses each consequential action before it runs, accepts only delegations that narrow authority,
    and signs evidence of every decision. It takes the agent's identity from an existing identity system rather
    than issuing one, and has no step that waits for a person.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/dorigjo/besa/main/README.md
    shows: The README says the wrapper "validates the action, verifies issuer trust and the exact capability, checks
      optional delegation" before the handler, that DelegationV1 is "Signed, narrowing authority ... A child cannot
      broaden its parent", that "Success and handler failure both generate signed evidence", and that Besa does
      not replace "agent identity".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 9ede48db9967664ce687b529440adce5be84abfe1c9bb206f923b3e6a9ccd1e7
