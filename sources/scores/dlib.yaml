    random-forest regression, structural SVMs, clustering (k-means, spectral, Chinese whispers) and a
    deep-learning API, plus trained face detection, 68-point landmark and face-recognition models, the
    last mapping any face to an embedding so enrolled people are recognized with no training
  relative_to: insightface
