capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: The data owner's node for federated retrieval, installed by each owner on their own machine or server,
    with per-endpoint access policies, rate limits and pricing; the registry and aggregator that send queries to
    it are SyftHub, a separate product.
  confidence: medium
  note: Syft Space runs the data owner's side of federated retrieval. Each owner installs it on their own machine
    or server, decides who may ask what and at what price, and returns answers rather than documents. Finding
    sources and routing a question to them is SyftHub's job, so Syft Space on its own covers one side of the
    federation, a step short of PySyft, which runs both.
  relative_to: pysyft
  relation: one_below
  comparison:
    last_attested: '2026-10-27'
    sources:
    - url: https://raw.githubusercontent.com/OpenMined/PySyft/dev/README.md
