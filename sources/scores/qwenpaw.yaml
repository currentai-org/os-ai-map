capability:
  score: 4
  basis: feature_matrix
  value: 'Self-hosted assistant with breadth on the integration axis: multiple chat channels, MCP tool support,
    a plugin system with a skill marketplace, persistent memory, a terminal UI and a desktop build, and seven documented
    install or deployment routes including Docker and three hosted options. Assistant-and-agent platform rather
    than a single chat window.'
  confidence: medium
  note: QwenPaw is an extensible platform with tools, plugins and memory rather than a front end over a
    model endpoint, the same class as AnythingLLM and Open WebUI, above the plain front-end shape of Jan
    and SillyTavern. It does not reach LibreChat, which adds multi-user authentication and a broader native
    provider matrix.
  relative_to: anythingllm
  relation: at
  comparison:
    last_attested: '2026-10-07'
    sources:
    - url: https://github.com/Mintplex-Labs/anything-llm
      shows: The feature list still records a no-code AI agent builder with in-workspace web browsing, custom
        AI agents, scheduled cron tasks, multi-modal support and multi-user instance support and permissioning,
        over a supported-provider section listing around forty LLM providers and eight vector databases. It
        remains an extensible platform with tools, memory and agents rather than a front end over a model
        endpoint, which is the class shared between the two.
      accessed: '2026-08-31'
      http_status: 200
      content_sha256: dc714d7518633ad9df0a862b110d093eca5ded72b37bef73ef97c537d168aeba
    - url: https://raw.githubusercontent.com/Mintplex-Labs/anything-llm/master/README.md
      shows: The AnythingLLM README still lists "Automatic & User Managed Memories", scheduled tasks that
        "Run recurring tasks or prompts on a cron schedule with full agent capabilities", "MCP-compatibility"
        and a "No-code AI Agent builder". QwenPaw covers the same platform ground with plugins, MCP tools
        and layered memory, and adds chat-channel reach without AnythingLLM's multi-user permissioning, which
        keeps the two level.
