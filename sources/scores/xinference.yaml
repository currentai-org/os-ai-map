capability:
  score: 4
  basis: feature_matrix
  basis_detail: category feature matrix, placed against vllm
  value: Serving platform over vLLM, SGLang, TensorRT-LLM, Transformers, llama.cpp and MLX engines with 300+ built-in models
    across language, vision, embeddings, reranking, image, audio and video; distributed workers and replicas, prefill/decode
    separation including across CUDA and Apple Metal, shared prefix caching and rolling reconfiguration; OpenAI- and Anthropic-compatible
    APIs, a web UI, CLI and Python SDK.
  relative_to: vllm
  relation: one_below
  confidence: medium
  note: 'Xinference adds what a single engine lacks: a model catalog, multi-machine deployment, prefill/decode separation
    and a management interface, across many model types. It hands the model''s forward pass to vLLM, SGLang or another engine
    rather than running it itself, so it sits a step below vLLM.'
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/vllm-project/vllm/main/README.md
      shows: The peer's README still lists PagedAttention, "Continuous batching of incoming requests, chunked prefill, prefix
        caching", speculative decoding, "Tensor, pipeline, data, expert, and context parallelism for distributed inference",
        hardware plugins across GPU and accelerator vendors, and "200+ model architectures".
