capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indic transliteration
  value: About 26 million romanized-to-native transliteration pairs in 21 Indic languages, mostly mined from
    corpora with a human-annotated portion and test set, documented in a paper, and used to train IndicXlit.
  confidence: medium
  note: Aksharantar is the largest public transliteration resource for Indian languages, about 21 times earlier
    sets, and the IndicXlit model is trained and evaluated on it. It serves one task, transliteration, where
    the Bharat Parallel Corpus Collection from the same team covers full translation across all 22 scheduled
    languages.
