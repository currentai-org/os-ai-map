  basis: feature_matrix
  basis_detail: coverage and downstream use for multilingual reading comprehension evaluation
  value: Human-written multiple-choice reading comprehension set of 900 questions in each of 122 language variants
    (109,800 questions), documented in its paper and included as a task in EleutherAI's lm-evaluation-harness.
  confidence: medium
  note: Belebele asks the same 900 questions in 122 language variants, so reading comprehension scores compare
    directly across languages, and no other open reading test here reaches that many. It is documented in its
    paper and ships as a task in EleutherAI's evaluation harness.
