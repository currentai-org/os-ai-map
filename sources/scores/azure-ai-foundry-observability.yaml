  note: 'Three pillars - evaluation, monitoring and tracing - with strong OpenTelemetry and framework coverage:
    distributed tracing of LLM calls, tool invocations, agent decisions and cross-agent handoffs, capturing
    inputs, outputs, latency and token usage through Azure Monitor Application Insights, with auto-instrumentation
    across Semantic Kernel, LangChain, LangGraph and the OpenAI Agents SDK. Prompt management, datasets
    and annotation are not evidenced as first-class native features, so the matrix is thinner than the dedicated
    open source platforms and this sits a rung below them at 3.'
  last_verified: '2026-08-13'
