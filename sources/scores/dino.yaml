capability:
  score: 4
  basis: feature_matrix
  value: self-supervised ViT (21M to 7B) and ConvNeXt backbones for web and satellite images, with released
    heads for classification, depth estimation, COCO detection and ADE20K segmentation, and dino.txt for
    zero-shot open-vocabulary classification and segmentation, plus the full pretraining recipe
  relative_to: ultralytics
  relation: at
  confidence: medium
  note: DINOv3 is best known as a backbone that other models are built on, but Meta also ships ready heads,
    and its dino.txt variant classifies and segments whatever labels the user types with no training,
    the same kind of open-vocabulary capability that places Ultralytics here. Its detector and segmentor
    heads cover fixed benchmark label sets.
  comparison:
    last_attested: '2026-09-27'
    sources:
