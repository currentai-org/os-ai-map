  note: DINOv3's code and weights come under Meta's own DINOv3 License, which permits commercial use but
    bars military, weapons and trade-controlled uses and lets Meta change the terms; downloads need an
    approved access request. The full pretraining code is published, but the 1.7-billion-image training
    set drawn from Instagram is not. The earlier DINOv2 was Apache-2.0, but the current release governs.
