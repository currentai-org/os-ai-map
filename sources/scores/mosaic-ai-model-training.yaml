  value: 'Methods: chat-completion FT, instruction FT, continued pre-training. No exposed LoRA/QLoRA/DPO/RLHF
    or preference methods; no parallelism/precision/scale knobs. Base models limited to the Meta Llama
    family.'
  confidence: medium
  note: Mosaic AI Model Training offered chat-completion and instruction fine-tuning and continued pre-training
    on Meta Llama models, with no preference or reinforcement-learning methods, no LoRA or QLoRA, and no
    parallelism, precision or scale controls. That left it behind the managed offerings from OpenAI, Vertex
    and Together, which combine supervised, preference and reinforcement tuning.
