capability:
  score: 5
  basis: feature_matrix
  basis_detail: simulation throughput and fidelity
  value: GPU-parallel robot learning on Isaac Sim PhysX with RTX-rendered cameras, LIDAR and contact sensors; 30+
    ready-to-train environments for RSL RL, SKRL, RL Games and Stable Baselines, multi-agent RL; an experimental
    Newton (MuJoCo Warp) physics backend with sim-to-sim transfer configs for ANYmal-D, G1, Go2 and H1.
  confidence: medium
  note: 'Isaac Lab combines everything the other simulators here offer in part: parallel environments on the GPU,
    rendered cameras, LIDAR and contact sensors, a large set of ready-to-train tasks for common robots, and a second
    physics engine for checking a policy before it goes to hardware.'
  last_verified: '2026-09-27'
  sources:
  - url: https://raw.githubusercontent.com/isaac-sim/IsaacLab/main/README.md
    shows: 'README: "a GPU-accelerated, open-source framework designed to unify and simplify robotics research workflows,
      such as reinforcement learning, imitation learning, and motion planning"; "more than 30 environments, which
      can be trained with popular reinforcement learning frameworks such as RSL RL, SKRL, RL Games, or Stable Baselines";
      sensors "cameras, LIDAR, or contact sensors".'
    accessed: '2026-09-27'
