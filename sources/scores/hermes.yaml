    establishes: [weights, license, post-training-data, code]
  - url: https://huggingface.co/NousResearch/Hermes-4-405B-FP8
    shows: the Llama-based build of the same recipe - `license:llama3`, base Meta-Llama/Llama-3.1-405B;
      the SKU whose terms do NOT govern, because a user wanting Apache takes the Seed-OSS or Qwen build
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: a81364e2616072fb9ef1adfb28a40d4b81396aa552b2f08eefb6415ac3fbf15a
