capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'engine rung: what the engine runs and trains'
  value: Trains and runs speech recognition (hybrid CTC/attention, transducer and streaming), text-to-speech, speech and speech-to-speech
    translation, enhancement and separation, speaker and language identification, diarization, spoken language understanding,
    singing synthesis and codecs from Kaldi-style recipes, and serves published models from one command line.
  confidence: medium
  note: ESPnet trains and runs models for nearly every speech task, level with SpeechBrain. Whether one of its own recognizers
    ranks near the top of the Open ASR Leaderboard could not be checked, because the board's results file no longer opens
    without a Hugging Face account.
  relative_to: speechbrain
  relation: at
