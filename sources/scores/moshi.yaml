capability:
  score: 5
  basis: feature_matrix
  basis_detail: real-time full-duplex speech-to-speech
  value: Listens and speaks simultaneously in one model; theoretical latency 160 ms and about 200 ms in practice
    on an L4 GPU, with streaming recognition and synthesis from the same Inner Monologue design.
  confidence: medium
  note: Moshi holds a live two-way spoken conversation, which no recognizer or synthesizer here does, and it was
    the first open model to do so in real time.
  last_verified: '2026-09-27'
