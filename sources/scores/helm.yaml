capability:
  score: 5
  basis: feature_matrix
  value: 'Broadest standardized benchmark/task coverage in the category: multiple holistic leaderboards
    across text (Capabilities, Safety, ToRR table-reasoning), vision-language (VHELM), text-to-image (HEIM),
    medical (MedHELM), audio, and enterprise; unified model access across OpenAI/Anthropic/Google/etc.;
    metrics beyond accuracy; standardized reproducible format + web UI.'
  confidence: high
  relative_to: inspect-ai
  relation: at
  last_verified: '2026-08-13'
  note: 'Frontier-defining on coverage and standardization: the holistic multi-modality leaderboard standard,
    running the same leaderboard family across text, vision-language, text-to-image, table reasoning, medical
    and audio, and one of the one or two category leaders. It is weaker than Inspect AI on agentic-eval
    support but broader on benchmark and modality coverage, which is why the two sit level with each other
    rather than one above the other. HELM is in maintenance mode, which caps future breadth without narrowing
    what is already there.'
  sources:
  - url: https://github.com/stanford-crfm/helm
    shows: standardized datasets, unified model access, metrics beyond accuracy, web UI, multi-modal leaderboards
      (MMLU-Pro/GPQA/IFEval/WildBench)
