capability:
  score: 5
  basis: feature_matrix
  value: 'One of the broadest standardized benchmark and task sets in the category: holistic leaderboards
    across text (Capabilities, Safety, ToRR table-reasoning), vision-language (VHELM), text-to-image (HEIM),
    medical (MedHELM) and audio, plus an enterprise benchmark; unified model access across OpenAI/Anthropic/Google/etc.;
    metrics beyond accuracy; standardized reproducible format + web UI.'
  confidence: high
  relative_to: inspect-ai
  relation: at
  last_verified: '2026-11-16'
  note: HELM runs the same holistic leaderboard family across text, vision-language, text-to-image, table
    reasoning, medical and audio, one of the broadest standardized benchmark sets in the category. It has
    less agentic-eval support than Inspect AI, but wider benchmark and modality coverage, which keeps the
    two level with each other rather than one ahead.
  sources:
  - url: https://raw.githubusercontent.com/stanford-crfm/helm/main/README.md
    shows: 'README lists "Models from various providers accessible through a unified interface" and "Metrics
      for measuring various aspects beyond accuracy", and its paper list covers "Holistic Evaluation of
      Vision-Language Models (VHELM)", "Holistic Evaluation of Text-To-Image Models (HEIM)", "The Mighty
      ToRR: A Benchmark for Table Reasoning and Robustness", "Holistic evaluation of large language models
      for medical tasks with MedHELM", "Holistic Evaluation of Audio-Language Models" and "Enterprise Benchmarks
      for Large Language Model Evaluation".'
    accessed: '2026-11-16'
    http_status: 200
    content_sha256: 465390a907127138096869b49fd79c817392f5404d23d98161d881f2e408a303
