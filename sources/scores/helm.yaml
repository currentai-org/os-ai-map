capability:
  score: 5
  basis: feature_matrix
  value: 'One of the broadest standardized benchmark and task sets in the category: holistic leaderboards
    across text (Capabilities, Safety, ToRR table-reasoning), vision-language (VHELM), text-to-image (HEIM),
    medical (MedHELM) and audio, plus an enterprise benchmark; unified model access across OpenAI/Anthropic/Google/etc.;
    metrics beyond accuracy; standardized reproducible format + web UI.'
  confidence: high
  relative_to: inspect-ai
  relation: at
  last_verified: '2026-09-29'
  note: HELM runs the same holistic leaderboard family across text, vision-language, text-to-image, table
    reasoning, medical and audio, one of the broadest standardized benchmark sets in the category. It has
    less agentic-eval support than Inspect AI, but wider benchmark and modality coverage, which keeps the
    two level with each other rather than one ahead.
  sources:
