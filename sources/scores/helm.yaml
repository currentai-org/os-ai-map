adoption:
  level: 3
  signal_type: reported_traction
  confidence: medium
  last_verified: '2026-08-13'
  banded_quantity: research citations and hosted-leaderboard use; crfm-helm on PyPI at ~3,142 a month understates
    reach rather than measuring it
  note: 'Influence and standard-setting, not install volume, is the signal here: HELM is a widely cited
    standardized public leaderboard from Stanford CRFM spanning multiple modalities - capabilities, safety,
    vision, medical - and referenced across the research community. Its PyPI package, crfm-helm, sees only
    5,097 downloads a month (about 3,142 at an earlier reading), a volume that would band far lower on its
    own; most usage runs through the hosted leaderboard and academic citation rather than pip, so downloads
    understate reach and serve as corroboration rather than as the measure. Level 3 reflects meaningful
    research and standard-setting adoption short of mass production deployment.'
  sources:
  - url: https://github.com/stanford-crfm/helm
