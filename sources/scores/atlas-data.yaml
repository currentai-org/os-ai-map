  note: ATLAS describes datasets that mostly stay where their publishers put them, such as Hugging Face, and its licensing
    policy says the site does not itself distribute dataset content unless a listing says otherwise. Its team can upload a
    new dataset for a contributor, but no interface serves datasets by identifier, so it sits with Masader rather than with
    UCI, which holds what it lists.
