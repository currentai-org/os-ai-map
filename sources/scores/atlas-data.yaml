  note: Contributors the ATLAS team approves bring datasets in from Hugging Face or through a team-assisted upload,
    and each one is reviewed before it is published. Agents can search the catalog and inspect a dataset's schema
    over a read-only MCP API, but files are downloaded through the website, while UCI serves each dataset by ID
    through a public API.
