capability:
  score: 1
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: contributors approved by the ATLAS team import datasets from Hugging Face or have the team upload them, and each
    passes human review before it is published with a dataset ID; search by language, modality, license or task, a chat search,
    and a read-only MCP API for search, facets, configs and schemas; signed-in users download datasets that allow it; the
    licensing policy says the site does not itself distribute dataset content unless a listing states otherwise
  confidence: medium
