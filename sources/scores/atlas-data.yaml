capability:
  score: 1
  basis: feature_matrix
  value: catalog of dataset records for underrepresented languages; anyone with an account submits by Hugging Face
    import or a file upload of up to 5 GB, and the ATLAS team reviews each before publishing it with an ID and version;
    most records point at data hosted by its provider; read-only MCP search over metadata, no API that pulls a dataset
    by name; lists datasets, not models
  confidence: medium
  relative_to: pytorch-hub
  relation: at
  note: Like PyTorch Hub, ATLAS takes reviewed submissions and mostly points at data its providers host, and no
    client can pull an entry from it by name. It does store the files contributors upload, but it lists datasets
    rather than models, so on this category's scale it is an index rather than a registry.
  comparison:
    last_attested: '2026-10-04'
    sources:
