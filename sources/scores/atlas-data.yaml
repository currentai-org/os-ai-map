  value: contributors approved by the ATLAS team submit datasets by Hugging Face import or a team-assisted upload;
    automated processing and human review before publication with a unique dataset ID; search by language, modality,
    license or task, a chat search, and a read-only MCP API for search, facets, configs and schemas; signed-in users
    download datasets that allow it from the site
  confidence: medium
  relative_to: uci-ml-repository
