capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: One table interface for structured and multimodal data with computed columns that run models
    and build embedding indexes, and HTTP routes declared beside the tables. Persisted in one embedded
    PostgreSQL with a single writing process, media on local disk or S3-style destinations; a hosted Pixeltable
    Cloud database is in limited beta.
  relative_to: pgvector
  relation: at
  confidence: medium
  note: 'Pixeltable stores, indexes and serves its own data and runs models inside computed columns, but
    self-hosted it is a single node: its operations guide allows one process to write the database and
    points to Pixeltable Cloud, still in limited beta, for more. Its documentation describes no cluster
    or distributed mode, and running models only lifts a product above that when it also scales across
    machines. That leaves it level with pgvector, another single-node store.'
  comparison:
    last_attested: '2026-10-08'
    sources:
    - url: https://raw.githubusercontent.com/pgvector/pgvector/master/README.md
      shows: 'README: "Open-source vector similarity search for Postgres"; "Store your vectors with the
        rest of your data", inheriting ACID compliance, "point-in-time recovery, JOINs" and the rest of
        Postgres, with no distribution or clustering of its own.'
      accessed: '2026-10-08'
      http_status: 200
      content_sha256: 19cebadeeb8d3181d01ef00399674ec41bd2f0363850cdccc7685d4260c5a1c6
