    source under that tier scores 2/source_available. This is deliberately not the model-context-protocol case,
    where a CC-BY-4.0 documentation license was moved out of the compound because it covered the project''s prose
    rather than the artifact you run: here the bounded license covers the weights, and the weights are the product.'
