capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: multi-format document understanding with layout, tables and equations'
  value: PDF, image, Office, HTML and EPUB conversion to Markdown, JSON and HTML with layout analysis, table
    and equation recognition, OCR and optional LLM-assisted refinement.
  relative_to: docling
  relation: one_below
  confidence: medium
  note: Marker's layout, tables, equations and reading order all come through into Markdown and JSON. It
    stops short of Docling, whose extractor also returns the fields a user defines in a template; Marker's
    converters rebuild the whole document or only its tables, with no step for returning user-defined fields.
  last_verified: '2026-09-29'
  sources:
  - url: https://raw.githubusercontent.com/datalab-to/marker/master/README.md
    shows: The raw README states "Marker converts documents to markdown, JSON, chunks, and HTML quickly
      and accurately", "Converts PDF, image, PPTX, DOCX, XLSX, HTML, EPUB files in all languages" and "Formats
      tables, forms, equations, inline math, links, references, and code blocks", and lists its converters
      as "One of `marker.converters.pdf.PdfConverter` (default) or `marker.converters.table.TableConverter`".
    accessed: '2026-09-29'
