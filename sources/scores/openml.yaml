capability:
  score: 5
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: upload and download through the website or the APIs; a dataset ID plus incremental versions per name and
    a free-form version label; uniform storage with ARFF and Parquet downloads; automatically computed data characteristics;
    clients load datasets by ID into dataframes; tasks, runs and benchmark suites defined on the datasets
  confidence: high
  note: Anyone can upload a dataset from a dataframe, and OpenML stores it in one uniform format, computes its characteristics
    and serves it back by ID to Python, R and Java. Tasks and benchmark suites are defined on top of the datasets,
    so the catalog also records how each one is used for evaluation.
  last_verified: '2026-10-07'
  sources:
  - url: https://docs.openml.org/concepts/data/
    shows: '"You can upload and download datasets through the website or though the APIs"; "OpenML assigns incremental
      version numbers per upload with the same name"; "OpenML will automatically analyze the data and compute a
      range of data quality characteristics".'
