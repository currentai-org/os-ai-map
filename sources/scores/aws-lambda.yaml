capability:
  score: 5
  basis: feature_matrix
  value: isolation:Firecracker microVM (per-invocation hardware-virtualized, KVM) - strongest isolation
    tier, ~125ms VM start, ~5MiB/VM; cold-start:ms-to-sub-second; runtime breadth:very high (managed runtimes
    Node/Python/Java/Go/Ruby/.NET + custom runtimes/container images, arbitrary code); persistence:stateless+attachable
    storage (EFS, /tmp); scale:trillions of executions/mo, effectively unbounded autoscale
  confidence: high
  note: AWS Lambda runs code in most major languages natively, and any other language through a Runtime
    API, isolating every invocation in its own Firecracker microVM. Lambda MicroVMs extend that isolation
    to AI- and agent-generated code with near-instant resume and persistent state, making it the broadest
    and most isolated platform in the category.
  last_verified: '2026-08-14'
  sources:
  - url: https://aws.amazon.com/blogs/aws/firecracker-lightweight-virtualization-for-serverless-computing/
