capability:
  score: 5
  basis: feature_matrix
  value: isolation:Firecracker microVM (per-invocation hardware-virtualized, KVM) - strongest isolation
    tier, ~125ms VM start, ~5MiB/VM; cold-start:ms-to-sub-second; runtime breadth:very high (managed runtimes
    Node/Python/Java/Go/Ruby/.NET/PowerShell + custom runtimes/container images, arbitrary code); persistence:stateless
    functions with attachable storage (EFS, /tmp), Lambda MicroVMs preserve state up to 8 hours; scale:15
    trillion+ invocations/mo, 1000 concurrent executions added every 10 seconds
  confidence: high
  note: AWS Lambda runs code in seven languages natively and any other through a Runtime API, isolating
    each function in its own Firecracker microVM. Lambda MicroVMs extend that isolation to user- and AI-generated
    code with near-instant resume and persistent state, on a service with a long production record at very
    large scale.
