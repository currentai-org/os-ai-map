  confidence: high
  note: 'Fully open editor core under GPL and Apache, with the paid tiers selling Zed-hosted AI and an org
    admin layer over it. A full untruncated recursive tree of zed-industries/zed at main is 5,130 entries
    in which every crate carries LICENSE-GPL or LICENSE-APACHE, including crates/collab, the collaboration
    server - so the server is published too - and there is no ee, enterprise, commercial or proprietary
    path anywhere. The collab server is GPL-3.0 rather than AGPL-3.0: an untruncated tree of 5,137 entries
    holds no path containing AGPL at all, against 215 LICENSE-GPL files and 47 LICENSE-APACHE, and a direct
    read of crates/collab lists LICENSE-GPL beside Cargo.toml, migrations, k8s, seed, src and tests. Both
    licenses are OSI-approved, so taking the most restrictive across parts still lands on open source. zed.dev/pricing
    runs Personal at $0 forever with unlimited use on your own API keys, while Pro and Business sell Zed-hosted
    model inference and a hosted admin dashboard at dashboard.zed.dev; Zed says of the Business controls
    that "Since Zed is open source, these controls govern Zed''s hosted services specifically", and the
    FAQ confirms you can bring your own keys or disable AI entirely. A hosted inference quota is not an
    editor feature withheld from the published source.'
