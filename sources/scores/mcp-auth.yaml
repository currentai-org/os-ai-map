capability:
  score: 1
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: per-request token verification and per-tool required-scope checks before an MCP handler runs; no agent
    identity (the verified token names the user); no delegation across hops; no human approval step; no signed decision
    record
  confidence: medium
  note: MCP Auth checks the token on every request and, where a server asks for it, the scopes a single tool requires
    before the tool runs. The identity it verifies is the user's rather than the agent's, and it has no delegation
    chain, approval step or signed record of its decisions.
  last_verified: '2026-11-20'
  sources:
  - url: https://mcp-auth.dev/docs
    shows: 'The token verifier checks "signature, issuer, audience, expiration, and the claims MCP servers need";
      tool callbacks take "{ requiredScopes: [...] }" "for per-tool authorization"; the subject is "the sub claim,
      typically the user ID".'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: e72173e686fe47c0561ec5b7f5077b633cd40e150db955ffd0f14ef6a3de2e45
  - url: https://raw.githubusercontent.com/mcp-auth/js/master/README.md
    shows: The Node.js SDK implements "RFC 9728 Protected Resource Metadata and RFC 8707 audience-bound token validation
      — for any OAuth 2.0 / OpenID Connect provider."
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 800e7645959bfd5f1308cd5dc46be5aaa0b884ab22915ee522ff591ad796dad4
