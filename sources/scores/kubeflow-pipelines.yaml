  value: typed ML artifacts - system.Model, system.Dataset, system.Metrics, system.ClassificationMetrics
    - as first-class component inputs and outputs; set_accelerator_type and set_accelerator_limit
    per step; ML Metadata lineage across runs; containerized steps placed by the Kubernetes
    scheduler
  confidence: medium
