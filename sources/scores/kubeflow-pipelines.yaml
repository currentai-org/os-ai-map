capability:
  score: 3
  basis: feature_matrix
  value: typed ML artifacts - system.Model, system.Dataset, system.Metrics, system.ClassificationMetrics
    - as first-class component inputs and outputs; set_accelerator_type and set_accelerator_limit
    per step; ML Metadata lineage across runs; containerized steps placed by the Kubernetes
    scheduler
  confidence: medium
  note: 'Admitted on the ML-job-model limb, and this is the record that shows why
    the limb is worth having: KFP runs on Argo Workflows, which this category excludes,
    and the difference is one file - sdk/python/kfp/dsl/types/artifact_types.py defines
    Model, Dataset, Metrics and ClassificationMetrics as typed artifacts, which Argo
    has no equivalent of. Band 3: KFP decides the order and the cluster, and the Kubernetes
    scheduler places the pod.'
  last_verified: '2026-09-15'
  sources:
  - url: https://raw.githubusercontent.com/kubeflow/pipelines/master/sdk/python/kfp/dsl/types/artifact_types.py
