  basis: feature_matrix
  value: 'of the Model Context Protocol, version not stated by the product: both roles, the full primitive
    set (tools, prompts, resources, plus logging and completions), and all three transports - stdio, Streamable
    HTTP and legacy SSE, the last disabled by default'
  confidence: medium
  relative_to: mcp-python-sdk
