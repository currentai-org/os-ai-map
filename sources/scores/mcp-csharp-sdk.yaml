  note: 'Both roles, the full primitive set and three transports, which is band 4. It does not reach 5 on the
    version leg: the documentation names no target revision, describing runtime negotiation instead - "During
    connection setup, the client and server negotiate a mutually supported MCP protocol version" - so there
    is no cited version to check currency against. All three optional features ARE documented, which is the
    other half of band 5, so this record is one documentation sentence away from it.'
