capability:
  score: 2
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: allow, ask or deny decision on every tool, bash, MCP, skill and special operation before it runs; ask prompts
    with Allow Once, Allow Always and Reject, forwarded from subagents to the main session; no agent identity beyond
    the agent name; no delegation narrowed across hops; plain JSONL debug log rather than a tamper-evident record
  confidence: medium
  note: The extension decides every tool call in a Pi session before it runs and pauses ask-rated calls for a person,
    including calls from subagents. It identifies agents only by name, passes no narrowed authority between them,
    and its debug log is plain JSONL rather than a tamper-evident record.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/MasuRii/pi-permission-system/main/README.md
    shows: '"Runtime Enforcement — Blocks/asks/allows at tool call time with UI confirmation dialogs"; "Subagent
      Permission Forwarding — Forwards ask confirmations from non-UI subagents back to the main interactive session";
      debug logging writes "permission request/denial review entries" to a JSONL file.'
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: c9d9789598e0ed4e75ba258fd09270c76b89c7a7b3416cb475ae8c339e98a0e1
