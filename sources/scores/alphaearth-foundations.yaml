  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: One model assimilates Landsat, Sentinel-1, and Sentinel-2 measurements into a shared embedding field; no published adaptation pathway, no generated scientific output, and one 10-meter annual scale.
  relative_to: prithvi-eo
  relation: two_below
  confidence: high
  note: 'Only the multi-instrument attribute is stated directly. The publisher''s own claim is that the embeddings are used without re-training, which is the opposite of a documented adaptation pathway, and an embedding is not a generated scientific output. Multi-scale is declined against the abstract''s phrase about production of maps "from local to global scales": that describes what downstream users build from the embeddings, not a model operating at more than one resolution, and the distributed collection fixes a single 10-metre annual grid.'
  last_verified: '2026-09-10'
  sources:
  - url: https://arxiv.org/abs/2507.22291
    shows: Describes an embedding field model that assimilates spatial, temporal, and measurement contexts across multiple sources, and reports that its embeddings outperform other featurization approaches without re-training.
