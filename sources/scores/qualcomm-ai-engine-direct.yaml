capability:
  score: 4
  basis: feature_matrix
  value: unified low-level API across Hexagon HTP/NPU, Adreno GPU, and Kryo CPU; AOT and on-device compilation;
    LiteRT, ExecuTorch, and ONNX Runtime all delegate to it as their Qualcomm NPU backend; quantized (INT8/INT16)
    on-device LLM/VLM inference (e.g. Gemma, FastVLM) with NPU speedups reported up to 100x over CPU and
    10x over GPU on Snapdragon 8 Elite Gen 5
  confidence: medium
  note: Qualcomm AI Engine Direct provides a unified API across the Hexagon NPU, Adreno GPU and Kryo CPU,
    with quantized on-device LLM and VLM inference, and LiteRT, ExecuTorch and ONNX Runtime all delegate
    to it as their Qualcomm NPU backend. It remains Snapdragon-locked and edge-scale, well short of the
    server-class engines that lead the field.
  basis_detail: 'Read from current vendor and integrator documentation rather than a benchmark row: unified
    low-level API surface, multi-accelerator coverage, AOT and on-device compilation, and measured NPU speedups
    reported by the LiteRT integration.'
  last_verified: '2026-09-29'
  sources:
  - url: https://docs.pytorch.org/executorch/stable/backends-qualcomm.html
    shows: The ExecuTorch Qualcomm backend page says "Qualcomm AI Engine Direct is designed to provide unified,
      low-level APIs for AI development" and that developers can interact with "Kryo CPU, Adreno GPU, and
      Hexagon processors".
