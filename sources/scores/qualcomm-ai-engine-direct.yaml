    shows: The Google Developers blog says LiteRT models deploy "either ahead-of-time (AOT) or on-device
      compilation" and reports "up to 100x speedup over CPU" on the Qualcomm NPU, with Gemma and FastVLM
      as example models.
    accessed: '2026-09-29'
