capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Thai instruction data
  value: WangchanX-FLAN holds about 3.6 million Thai-centered instruction examples reformatted from more than
    two dozen existing datasets, documented by a detailed card and build script, and the WangchanLION v2 instruct
    model is trained on it.
  confidence: medium
  note: WangchanX-FLAN lists every source and license, and the WangchanLION v2 instruct model is trained on
    it. All of it is reformatted from existing datasets, some of them machine-generated, which places it below
    WangchanThaiInstruct, whose Thai examples annotators and domain experts wrote from scratch.
  relative_to: wangchan-thai-instruct
  relation: one_below
