capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Hebrew pretraining text
  value: 910,000 documents (47.6 GB) of cleaned, deduplicated Hebrew Common Crawl text, described in a paper,
    with HeRo, LongHeRo and a community HebrewGPT model trained on it.
  confidence: medium
  note: The Hebrew Deduplicated and Cleaned Common Crawl Corpus was the largest Hebrew pretraining set when
    its paper introduced it, and HeRo, LongHeRo and a community HebrewGPT model are trained on it, but it draws
    on Common Crawl alone and its card is two sentences with no stated license. At roughly ten billion tokens,
    estimated from its size on disk, it is close in size to the Farsi corpus naab, which documents far more,
    and far below the trillions in English sets such as FineWeb.
  relative_to: naab
