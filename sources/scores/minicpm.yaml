capability:
  score: 3
  basis: benchmark
  basis_detail: small-model suites on the MiniCPM4.1-8B and MiniCPM5-2B cards
  value: 'MiniCPM4.1-8B is a hybrid reasoning model its card benchmarks against Qwen3-8B-class peers. The
    MiniCPM5-2B card (September 2026) compares it with 2B-class models and lists larger ones beside them:
    average 53.9 against 42.7 for granite-4.2-3B, GPQA Diamond 70.2 against 55.9. Artificial Analysis Intelligence
    Index v5.0.1 has no MiniCPM5-2B score, and no published table compares MiniCPM5-2B with MiniCPM4.1-8B.'
  confidence: medium
  note: MiniCPM's 8B hybrid-reasoning model and its newer 2B model each lead same-size open models on their
    own cards, and the 2B model stays competitive with 4B-class models, with its strongest results in coding,
    math and tool use. Neither card compares the two releases, and no independent index scores either, so
    which one sets the family's capability is not yet established. Neither release has demonstrated broad
    frontier parity on comparable evaluations.
  sources:
  - url: https://huggingface.co/openbmb/MiniCPM4.1-8B/raw/main/README.md
    shows: The 4.1-8B card presents the line as "a hybrid reasoning model with trainable sparse attention,"
      usable in deep-reasoning and non-reasoning modes, with benchmark comparisons against similar-size
      open models.
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: 9be2cdf7cdc40cddd0503972829c51c61c1532960d963e93dbc58aa3467539e5
  - url: https://huggingface.co/openbmb/MiniCPM5-2B/raw/main/README.md
    shows: 'Card: "MiniCPM5-2B, the second model in the MiniCPM5 series", "reaching 2B-class open-source
      SOTA" and "competitive with 4B-class models overall"; its comparison table lists granite-4.2-3B among
      the larger models, with MiniCPM5-2B averaging 53.9 against 42.7 and GPQA Diamond 70.2 against 55.9.
      It does not compare against MiniCPM4.1-8B.'
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: 59e93770502358d56b30b8e2ef7e744cf7fc91bfb923c7c787876defac35cdbe
