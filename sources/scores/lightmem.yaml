capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: filtered retrieval over Qdrant, FAISS or BM25; language-model extraction of memory entries from compressed,
    topic-segmented dialogue; an offline pass in which a model updates or deletes conflicting entries; no time-based
    forgetting; a single entry store beside optional topic summaries
  confidence: medium
  note: LightMem extracts memories from dialogue itself and later lets a model update or delete entries that newer
    ones contradict. It keeps one store of entries with no profile or graph, and nothing in it ages memories out
    on its own.
  last_verified: '2026-11-20'
  sources:
  - url: https://raw.githubusercontent.com/zjunlp/LightMem/main/README.md
    shows: The examples call add_memory with extraction forced, then "Offline Update" through construct_update_queue_all_entries
      and offline_update_all_entries, then retrieve(question, limit=5); RetrieverConfig supports qdrant, FAISS and
      BM25.
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 15baa878856a0a612663005171c89a21a787ccccf2c513127f094895500224b3
  - url: https://raw.githubusercontent.com/zjunlp/LightMem/main/src/lightmem/memory/lightmem.py
    shows: offline_update_all_entries calls the update model for each entry with high-scoring candidates and, by
      its returned action, deletes the entry or rewrites its memory text.
