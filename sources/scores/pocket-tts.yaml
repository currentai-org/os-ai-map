  score: 3
  basis: benchmark
  basis_detail: self-reported zero-shot WER and speaker similarity on LibriSpeech test-clean
  value: 'Pocket TTS is not on the Artificial Analysis TTS leaderboard. Its training guide reports zero-shot cloning on the
    full LibriSpeech test-clean cross-sentence list: 0.82% WER and 0.929 speaker similarity for a 24-layer model trained from
    scratch on HiFiTTS-2 with the published recipe.'
  confidence: low
  note: Pocket TTS has no listener rating, and the only shared-test-set results Kyutai publishes are for models trained with
    its own recipe, which it says match the released model. On that basis it sits level with F5-TTS, which reports on the
    same LibriSpeech test set.
