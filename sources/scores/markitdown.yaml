capability:
  score: 4
  basis: feature_matrix
  value: converts PDF/DOCX/PPTX/XLSX/Outlook/images(OCR)/audio/HTML/CSV/JSON/XML/ZIP/EPub/YouTube -> Markdown
    keeping headings, lists, tables and links; CLI + Python API + Docker; plugins incl. LLM-vision OCR;
    optional Azure Document Intelligence and Azure Content Understanding
  confidence: medium
  note: MarkItDown converts Office files, PDFs, HTML, images, audio and other formats into Markdown that
    keeps headings, lists, tables and links for language models to read. Its built-in converters do format-specific
    extraction, leaving layout analysis of scanned or complex PDFs to the optional Azure services, and typed
    fields come only from Azure Content Understanding.
  last_verified: '2026-09-28'
  sources:
  - url: https://raw.githubusercontent.com/microsoft/markitdown/main/README.md
    shows: 'The raw README describes "a focus on preserving important document structure and content as
      Markdown (including: headings, lists, tables, links, etc.)", lists "ZIP files (iterates over contents)",
      "Images (EXIF metadata and OCR)" and "Audio (EXIF metadata and speech transcription)", documents plugins
      including "The `markitdown-ocr` plugin adds OCR support to PDF, DOCX, PPTX, and XLSX converters",
      and its comparison table gives built-in converters "Offline, format-specific extraction" with structured
      fields "Not available".'
