capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Graph traversal, vector search and BM25 full-text search in one transactional engine on object
    storage, run as a local server or embedded in a process. Multi-node scaling is documented only for the
    managed cloud, and the project is younger and narrower in operational features than platforms such as
    Vespa.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: HelixDB combines graph traversal, vector search and BM25 full-text search in one transactional engine
    built on object storage, and runs as a local server or embedded. Its writer-and-reader-node scaling
    is described only for the managed Helix Cloud, and it is younger and narrower in operational features
    than platforms such as Vespa, so it covers less of the same persist-index-retrieve path.
  last_verified: '2026-09-30'
  sources:
  - url: https://raw.githubusercontent.com/HelixDB/helix-db/main/README.md
    shows: README describes the product as "Store entities, relationships, embeddings," and shows "Approximate
      nearest-neighbor search, prefiltered by graph traversal." beside BM25 keyword search, plus "Local
      data lives in memory by default".
