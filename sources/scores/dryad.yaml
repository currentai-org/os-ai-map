capability:
  score: 3
  basis: feature_matrix
  basis_detail: publish, describe, discover and fetch coverage read from the operator's own documentation
  value: researchers submit datasets that Dryad's curators review before publication; DataCite metadata and a DOI
    per dataset; versions listed per dataset; REST API lists datasets, versions and files and downloads the latest
    version by DOI; anonymous search API
  confidence: medium
  relative_to: zenodo
  relation: one_below
  note: Every submission passes through Dryad's curators before it is published, and published datasets get a DOI,
    versions and a REST API that downloads them by DOI. On Zenodo an account publishes without that review, and
    neither service parses the files it holds.
