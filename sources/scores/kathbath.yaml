capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indian-language read speech
  value: 1,684 hours of read speech in 12 Indian languages from 1,218 contributors, crowdsourced through Karya,
    documented in the IndicSUPERB paper, with NVIDIA's Magpie multilingual TTS model listing it as training
    data.
  confidence: medium
  note: Kathbath is documented in the IndicSUPERB paper, which builds six speech benchmarks on it, and NVIDIA's
    Magpie multilingual TTS model lists it as training data. It is read speech in 12 languages, where IndicVoices
    from the same team has spontaneous speech in all 22.
  relative_to: indicvoices
  relation: one_below
  last_verified: '2026-09-24'
