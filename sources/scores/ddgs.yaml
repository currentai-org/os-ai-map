      detail: OSI; the LICENSE.md body is the unmodified MIT text
    source:
      value: partial
      detail: 'the whole library is published, but it holds no index: each search backend sends the query to
        a hosted engine''s own search page and parses the HTML it returns'
  confidence: high
  note: DDGS's own code is MIT licensed and published in full, but it holds no search index. Each of its ten
    web search backends sends the query to a hosted engine such as Google, Bing or DuckDuckGo and reads back
    the results page, so the search itself runs on closed services the library only calls. The open part is
    a client of those engines, not an open search product.
