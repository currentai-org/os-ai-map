  value: Input/output scanners for prompt injection, PII/data leakage, toxicity, and harmful content,
    with sanitization.
  confidence: medium
  note: LLM Guard offers a broad set of input and output scanners that are easy to drop into an existing
    pipeline, but it has no policy language or dialog control of its own. That places it a step below NeMo
    Guardrails, which adds both on top of a similar scanner set.
  relative_to: nemo-guardrails
