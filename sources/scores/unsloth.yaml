capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: full FT, LoRA/QLoRA, RL (GRPO, FP8 RL), pretraining, embedding FT; custom Triton kernels
    delivering ~2x faster / up to 70% less VRAM, MoE training ~12x faster / 35% less VRAM; 500+ supported
    models; multiple quant formats. Single-node memory/speed optimization is its frontier edge; less focused
    on multi-node frontier-scale parallelism than Megatron-LM.'
  confidence: high
  note: Unsloth's custom Triton kernels make training faster and cut VRAM use, with the largest gains the
    project reports coming on mixture-of-experts models. Method coverage is broad, spanning full fine-tuning,
    LoRA, QLoRA, pretraining, GRPO reinforcement learning, DPO preference tuning and embedding fine-tuning,
    though its edge is memory and speed on one machine rather than the multi-node parallelism Megatron-LM
    offers.
  last_verified: '2026-09-28'
  sources:
  - url: https://raw.githubusercontent.com/unslothai/unsloth/main/README.md
    shows: README states "Train LLMs, diffusion, TTS, and embedding models 2× faster with 70% less VRAM"
      and "Supports [reinforcement learning](https://unsloth.ai/docs/get-started/reinforcement-learning-rl-guide),
      LoRA, QLoRA, full fine tuning, pretraining, RL, GRPO, DPO, and FP8." and "Train **MoE LLMs 12x faster**
      with 35% less VRAM", plus "Multi GPU setups" support.
    accessed: '2026-09-28'
    http_status: 200
    content_sha256: e763fe1699169d57ba2f1516399824e807a52d51f6872d52157de6b3318f01f6
