product: unsloth
openness:
  score: 4
  class: open_core
  components:
    license:
    - name: Apache-2.0
      detail: OSI, core unsloth pkg
    - name: AGPL-3.0
      detail: OSI, optional Unsloth Studio UI
    source:
      value: public
      detail: unslothai/unsloth
    core-gated:
      value: gated
      detail: 'unsloth.ai/pricing sells Unsloth Pro and Enterprise on capabilities the free open-source
        tier does not have: the free column lists MultiGPU as coming soon while Pro lists Enhanced MultiGPU
        support and up to 8 GPUs, and Enterprise adds multi-node, full training and 5x faster inference;
        Pro is advertised as 20% less memory than OSS, an explicit comparison against the published package'
  confidence: high
  note: Unsloth's core package is Apache-2.0 and the optional Studio UI is AGPL-3.0, both OSI licenses,
    with the full source public. But Pro and Enterprise tiers add capabilities the free package lacks --
    multi-GPU support beyond one card, multi-node training and full rather than LoRA-only training -- which
    withholds part of the product itself rather than just hosted convenience. That keeps an otherwise open
    project at open core rather than open source.
