capability:
  score: 3
  basis: benchmark
  basis_detail: MTEB English average of 62.28 for nomic-embed-text-v1.5 at 8,192 tokens, in the MTEB-leaderboard table reproduced
    on the gte-modernbert-base card
  value: 'nomic-embed-text-v1.5: MTEB English average 62.28 at 8,192 tokens; v2-moe adds ~100 languages but caps input at
    512 tokens.'
  relative_to: harrier-oss
  relation: two_below
  confidence: high
  note: Nomic Embed is behind current frontier encoders such as Harrier-OSS, though the two report different
    benchmarks, English MTEB for Nomic and multilingual MTEB v2 for Harrier, so there is no head-to-head
    reading. The v2 mixture of experts claims parity only within its parameter class and gives up the long-context
    window the v1 line was known for.
  last_verified: '2026-11-16'
