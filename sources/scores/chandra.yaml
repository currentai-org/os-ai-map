capability:
  score: 4
  basis: feature_matrix
  value: 'PDF and image to Markdown, HTML and JSON with layout preserved: reading order, tables, forms, handwriting
    and mathematical notation; served as open weights and as a hosted API'
  confidence: medium
  relative_to: docling
  relation: at
  comparison:
    last_attested: '2026-09-16'
    sources:
    - url: https://github.com/docling-project/docling
      shows: Re-read of the peer these bands are placed against. Docling still emits Markdown, HTML and lossless
        JSON with layout and reading order preserved, which is the amount of a document surviving that the
        spacing rests on. Its input list - PDF, DOCX, PPTX, XLSX, HTML, EPUB, audio and images - is on the
        same page and is recorded here for completeness; it is NOT the property these bands are placed on,
        because the recipe excludes input breadth by name.
      accessed: '2026-09-16'
      http_status: 200
      content_sha256: 69950eb12c50e7599aa655c6329b0a0f3f9ebcb56d74fbcba0d3aa726c0785e5
  note: Chandra recovers reading order, tables, forms, handwriting and mathematical notation into Markdown
    and JSON - the same amount of a document's structure that Docling recovers, which is why the two score
    the same here. Docling accepts a wider range of input file types, but that is a separate measure from
    how much structure survives conversion. Chandra currently leads the olmOCR-Bench leaderboard, ahead
    of olmOCR itself, which supports this reading without deciding it.
  last_verified: '2026-09-16'
  sources:
