  confidence: high
  note: Chandra's code is Apache-2.0 and the source is fully public, but the model weights ship under a
    modified OpenRAIL-M license that is free for research, personal use, and startups under $2M in funding
    or revenue, and bars commercial use that competes with Datalab's own API. That revenue threshold and
    anti-compete clause on the weights, not the code, are what keep this at source-available rather than
    fully open.
