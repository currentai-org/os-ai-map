  class: open_source
  components:
    license:
    - name: Apache-2.0
      detail: declared in Cargo.toml+README
    source:
      value: public
    core-gated:
      value: ungated
      detail: the whole runtime is in src/ - router zipper serverless host tool invoker LLM and model providers
        auth and TLS - with no second license and no license key. Vivgrid sells a separate hosted serverless
        platform that the repo neither references nor requires
    free_text:
    - full-runtime-in-repo(Rust core+QUIC+multi-language SDKs)
    - managed-hosting-by-Vivgrid-optional
  confidence: medium
  note: 'Cargo.toml declares license = "Apache-2.0" at v2.0.6 and the README''s License section points at
    the Apache License 2.0, but no LICENSE file is committed at the repository root, so the GitHub API reports
    the license as null. That is the weakest part of this record. Nothing is gated, though: what YoMo publishes
    is the whole runtime rather than a client to a hosted one. src/ carries router.rs, zipper.rs, serverless.rs,
    agent_loop.rs, tool_invoker.rs, tool_mgr.rs, llm_provider/, model_api_provider/, auth.rs, http_auth.rs,
    tls.rs and connector.rs - routing, the serverless host, tool invocation, the OpenAI-compatible surface,
    auth and transport - with no ee/ directory, no second license and no license-key path. Vivgrid sells
    "serverless LLM function calling that lets enterprise AI agents run their tools in the cloud - with
    observability, evaluation, and globally distributed inference built in", on a free tier plus credits,
    but its landing page does not mention YoMo and the current YoMo README does not mention Vivgrid. A hosted
    platform sold beside a complete open core is not a gate.'
