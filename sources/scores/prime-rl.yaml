capability:
  score: 4
  basis: feature_matrix
  value: 'Methods: GRPO and variants (MaxRL, RAE, hierarchical GRPO, ECHO), on-policy distillation, self-distillation
    and SFT, with an IPO loss, custom losses and configurable sample filters; fully asynchronous off-policy RL; FSDP2
    training with expert and context parallelism; vLLM inference with FP8 and prefill/decode disaggregation; multi-node
    Slurm deployment from one GPU to a 1000-GPU cluster; verifiers environments; Qwen3.5 VLMs. Built for 1T+ MoE training,
    with one training backend and no critic-based PPO, so a narrower method catalog than verl''s.'
  confidence: medium
  note: prime-rl is built for asynchronous RL at frontier scale, training mixture-of-experts models on FSDP2 with expert
    and context parallelism and vLLM inference, with SFT, distillation and evaluation in the same stack. It sits a step
    below verl, which documents a wider algorithm catalog, including PPO with a critic, and more than one training backend.
  relative_to: verl
  relation: one_below
  comparison:
    last_attested: '2026-10-19'
    sources:
