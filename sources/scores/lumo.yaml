openness:
  score: 2
  class: source_available
  components:
    source:
      value: partial
      detail: GPLv3 clients only; backend, routing and model-serving are not published
    clients:
      value: open
      detail: GPLv3 - web in ProtonMail/WebClients, iOS/Android in ProtonLumo
    service:
      value: closed
      detail: backend, routing, model-serving not public
    license:
    - name: GPLv3
      detail: clients
  confidence: high
  note: 'Open clients (GPLv3) over a proprietary hosted service: the backend, routing and model-serving
    layer are not published. It is marketed as "fully open source", but support pages and third-party reviews
    note that only the clients are open. A published client standing in for an unpublished engine makes
    the source partial rather than public, which scores as source-available; open core would mean an OSI-licensed
    core with a paid tier withheld, which this is not. The published iOS client is a SwiftUI shell around
    a web view pointed at lumo.proton.me, with native payment and speech handling - exactly that split,
    a client published and the service behind it not. The European Open Source AI Index reaches the same
    conclusion independently.'
