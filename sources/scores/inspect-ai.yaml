capability:
  score: 5
  basis: feature_matrix
  value: 200+ pre-built evals; first-class agentic-eval support (tool use, multi-turn dialog, agent tasks);
    model-graded scoring; wide model-backend abstraction (OpenAI/Anthropic/Google/Groq/Mistral/xAI/Bedrock/Azure/Together/Cloudflare
    + local vLLM/Ollama/llama-cpp); reproducibility tooling for large-scale frontier evals.
  confidence: high
  last_verified: '2026-09-29'
  note: Inspect runs evaluations through one interface over lab APIs, cloud APIs and local servers, and
    its models page also lists DeepSeek, Moonshot, Perplexity, SageMaker, Fireworks, SambaNova, SGLang and
    TransformerLens. First-class support for agent and tool-use evaluation and more than 200 built-in evaluations
    put it among the leaders of the category.
