adoption:
  level: 4
  signal_type: reported_traction
  confidence: high
  last_verified: '2026-08-13'
  banded_quantity: frontier-lab adoption; the ~9.9M PyPI downloads are treated as CI-inflated corroboration
    rather than the basis
  note: Adoption by frontier labs is the strongest signal a harness can carry, and UK AISI open-sourced
    Inspect as its evaluations platform and reports that it 'is used by other governments and some of the
    leading AI developers'. The AISI post does not name the individual labs; what it does report is evaluations
    on 16 models in AISI's first year, so the basis is what that post asserts rather than any specific roster.
    PyPI volume corroborates - 9,278,867 inspect-ai downloads in the trailing 30 days on pypistats, against
    ~9.86M on pepy - but that traffic is inflated by CI and dependency installs, which is why lab adoption
    rather than download count is the basis. Level 4 rather than 5, because the human-operator base of eval
    engineers at labs and at AISI is far smaller than mass-market scale.
  sources:
  - url: https://www.aisi.gov.uk/blog/our-first-year
    shows: '''we open sourced our evaluations platform, Inspect ... now it is used by other governments
      and some of the leading AI developers''. The post reports evaluations on 16 models in AISI''s first
      year, and carries no ''thousands of evaluations'' figure.'
    accessed: '2026-08-13'
    http_status: 200
    content_sha256: 607848ae11534d6e9699c8073624bfef2c07f2be9899531adde35ef981639f65
  - url: https://inspect.aisi.org.uk/
    shows: framework for frontier AI evaluations by UK AISI + Meridian Labs; adopted by major labs
    accessed: '2026-06-04'
  - url: https://pepy.tech/projects/inspect-ai
    shows: 87.89M total / 9,856,617 last-30-day PyPI downloads (corroboration)
    accessed: '2026-06-04'
  - url: https://pypistats.org/api/packages/inspect-ai/recent
    shows: last_month = 9,278,867 downloads of the inspect-ai package (last_week 1,494,033, last_day 262,149)
