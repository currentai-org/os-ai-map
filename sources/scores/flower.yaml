capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'federated_learning feature matrix: federation reach (rungs in the category''s scoring_recipe.note)'
  value: A deployment runtime of SuperLink and per-organization SuperNodes over TLS with SuperNode authentication,
    Docker images, SecAgg and SecAgg+ secure aggregation, and central and local differential privacy (in preview).
    Its Android SDK is marked incompatible with current releases, and its Slurm guide connects SuperNodes to the
    hosted SuperGrid.
  confidence: high
  relative_to: nvidia-flare
  relation: one_below
  note: Flower runs real cross-organization federations, with authenticated SuperNodes, encrypted connections
    and secure aggregation in the open framework. It stops short of NVIDIA FLARE because its Android SDK
    does not work with current releases, its Slurm path runs through the hosted SuperGrid, and it publishes
    no multi-billion-parameter training figures.
  last_verified: '2026-09-27'
  sources:
  - url: https://flower.ai/docs/framework/explanation-ref-secure-aggregation-protocols.html
    shows: '"Flower now provides the SecAgg and SecAgg+ protocols" to aggregate model updates without the server
      inspecting individual ones.'
