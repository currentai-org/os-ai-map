  note: 'A tier bands on its strongest release. xAI''s model reference headlines "Meet grok-4.6 ... Our
    flagship model for code and everything else" and lists grok-4.3, grok-4.5 and grok-4.6 above the grok-4.20
    the record is named for, so the tier''s current release is grok-4.6, and it is the default across the
    X and grok.com surfaces. What is banded here is those surfaces, not a per-model count: xAI publishes
    no standalone per-model user or usage figure, so this is a reported-traction judgment, no reach band
    is recorded, and confidence stays low. Claude Sonnet and Gemini Pro are treated the same way, and Command
    R has the same shape. The consumer app itself is a separate product, grok-app; the bare grok slug is
    the model line.'
