capability:
  score: 5
  basis: benchmark
  basis_detail: Artificial Analysis Intelligence Index
  value: 'Grok 4.6 (high) scores 61 on the Artificial Analysis Intelligence Index against a median of 34;
    the only distinct models above it are Claude Opus 5 at 63 and Claude Fable 5 at 62, and it is level
    with GPT-5.6 Sol at 61'
  confidence: high
  note: 'Artificial Analysis publishes "Grok 4.6 (high) scores 61 on the Artificial Analysis Intelligence
    Index, placing it well above average among comparable models (median - 34)", and its model record there
    is not marked deprecated, unlike the grok-4.20 page, which banners a replacement. Ranking the 456 model
    records the page embeds by their index score, the only distinct models above Grok 4.6 (high) at 60.92
    are Claude Opus 5 at 63.05 and Claude Fable 5 at 62.07, with GPT-5.6 Sol level at 60.93 and Kimi K3
    next at 59.70. The rank badge itself is drawn in the browser rather than served in the page body, so
    this is derived from the embedded data rather than read off the badge; it agrees with the "# 6 / 188"
    the page reports. grok-4.6 is the release the band is taken on, since a tier''s adoption and capability
    are read on its strongest release, and xAI''s own model reference headlines grok-4.6 above grok-4.3,
    grok-4.5 and the older grok-4.20. A model inside the top three of the index it is scored on is not a
    4. Two things the band does not rest on: the older grok-4.20 page, which reads 38 and rank 62 of 184
    on the same recalibrated scale and banners a replacement, and the roughly 1505-1535 LMArena figure on
    NextBigFuture, which is an explicit estimate rather than a measurement.'
  last_verified: '2026-08-14'
  sources:
