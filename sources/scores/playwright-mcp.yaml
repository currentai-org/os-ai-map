    which clears the >10M level-5 floor in sources/rubrics/software.yaml. Confidence is high because the
    band rests on a count rather than on integration breadth plus stars. The declared npm artifact is @playwright/mcp
    rather than @anthropic-ai/mcp-playwright, which api.npmjs.org answers 404 for, so the artifact a fetcher
    would read is the one this band was measured on.'
