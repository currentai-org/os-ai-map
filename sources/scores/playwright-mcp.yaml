  score: 3
  basis: feature_matrix
  value: a curated tool surface over a browser - accessibility-snapshot navigation, clicking, typing, form
    filling, screenshots, network and console inspection, tabs and file upload - driving a browser the caller
    runs, with any signed-in state supplied as a storage-state file
  confidence: medium
  note: 'Playwright MCP offers a curated tool surface over one browser, with the caller supplying whatever
    credentials are needed: `--storage-state` points to a file the caller already produced, and the server
    does not authenticate anything itself. That is the reference feature set the other browser- and filesystem-style
    local servers in this category are measured against.'
