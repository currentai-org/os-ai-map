    then banded a full order of magnitude below them because some share of an OTel auto-instrumentation
    library''s installs are CI or transitive. That discount was never quantified, and a band is supposed to
    follow the figure. The pypistats API answers last_month = 414,172 downloads for openlit (last_week
    97,995, last_day 20,112), which lands in 100K-1M on the software scale in sources/rubrics/software.yaml.
