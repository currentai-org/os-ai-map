capability:
  score: 3
  basis: feature_matrix
  value: 'isolation: managed sandbox virtual machine, isolation technology undisclosed; cold-start: per-container
    (expires after 20 minutes unused); language/runtime breadth: Python only; persistence: per-container
    file workspace, ephemeral, memory tiers 1-64 GB; scale: OpenAI infra'
  confidence: low
  note: Code Interpreter is a Python-only sandbox that lets a model retry failing code, with containers
    of up to 64 GB of memory, but each container is ephemeral and OpenAI documents neither its isolation
    technology nor its scaling internals. That narrower, less transparent design keeps it behind general-purpose
    sandboxes that isolate a wider range of runtimes.
  last_verified: '2026-09-29'
  sources:
