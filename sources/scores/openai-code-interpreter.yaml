    scale: OpenAI infra'
  confidence: low
  note: Code Interpreter is a reliable Python-only sandbox with iterative retry on failing code, but it
    is single-language, session-scoped, and OpenAI documents no isolation mechanism or scaling internals.
    That narrower, less transparent design keeps it behind general-purpose deployment sandboxes that isolate
    a wider range of runtimes.
