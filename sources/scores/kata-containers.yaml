capability:
  score: 4
  basis: feature_matrix
  relative_to: firecracker
  relation: one_below
  value: isolation:hardware VM (pluggable VMM, QEMU/Firecracker/Cloud Hypervisor), strong VM-class isolation;
    cold-start:VM boot (slower than pure userspace); language/runtime breadth:any OCI container (language-agnostic,
    K8s-native); persistence:container lifecycle; scale:K8s clusters
  confidence: high
  note: Kata Containers gives every workload VM-grade isolation through a pluggable hypervisor layer - QEMU,
    Cloud Hypervisor, Firecracker, Dragonball or StratoVirt - integrated with Kubernetes via a containerd
    shimv2 shim across x86_64, aarch64, ppc64le and s390x. Its cold start runs higher than the microVM and
    userspace frontier, putting it a step below Firecracker, which defines that frontier here.
  last_verified: '2026-09-29'
  sources:
  - url: https://github.com/kata-containers/kata-containers
    shows: lightweight VMs performing like containers with VM workload-isolation/security; integrated with
      Firecracker
    accessed: '2026-06-04'
  - url: https://raw.githubusercontent.com/kata-containers/kata-containers/main/README.md
    shows: The README lists a runtime "providing a containerd shimv2 runtime implementation" and supported
      architectures including "| `s390x` | [IBM](https://www.ibm.com) Z & LinuxONE SIE |" and ppc64le.
    accessed: '2026-09-29'
    http_status: 200
    content_sha256: 326a9123397a42cd6b56acfce60884c119f5b70250f2ec62ae3bde877ff03895
