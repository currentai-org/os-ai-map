capability:
  score: 5
  basis: benchmark
  basis_detail: vendor-reported production and load-test figures (no independent harness submission),
    placed on the matrix by Pinecone's documentation of hosted models in the query path
  value: P50 latency ~26-60ms at 1.4B-vector scale, 5,700 QPS; serverless indexes with dedicated read
    nodes; hosted embedding models applied at index and query time and hosted reranking models run as
    an integrated part of a query.
  relative_to: milvus
  relation: one_above
  confidence: medium
  note: 'Pinecone is a distributed, durable vector database run at production scale, and its own documentation
    describes hosted embedding and reranking models inside the query path: integrated embedding at index
    time and integrated reranking as part of a search. Hosting the model in the serving path is what sets
    Vespa and Elasticsearch apart, which puts Pinecone beside them and one above Milvus, whose model utilities
    run in the client. Its production figures are vendor-reported, not independently benchmarked.'
  comparison:
    last_attested: '2026-10-08'
