capability:
  score: 4
  basis: benchmark
  basis_detail: vendor-reported production and load-test figures (no independent harness submission)
  relative_to: milvus
  relation: at
  value: P50 latency ~26-60ms at 1.4B-vector scale, 5,700 QPS; serverless auto-indexing, dedicated read
    nodes
  confidence: medium
  note: 'Pinecone is on par with Milvus: a complete, durable vector database operated at production scale,
    with serverless auto-indexing, dedicated read nodes and integrated sparse-dense hybrid search. Reported
    production figures include a P50 latency near 26 milliseconds at 1.4 billion vectors, but as a closed
    system these are vendor-reported, not independently benchmarked. It stops short of the top level, reserved
    for a platform that hosts and evaluates ranking or embedding models inside its own serving path, which
    nothing in the record shows Pinecone doing.'
  last_verified: '2026-08-18'
  sources:
