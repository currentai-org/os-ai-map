adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: medium
  note: 'Pinecone publishes no aggregate customer or user count; the level instead reads from production-deployment
    case studies naming specific companies running large vector workloads through its serverless offering
    and AWS Marketplace. That evidence shows deployment depth at a handful of named accounts rather than
    breadth across a customer base, and it is not without churn: Notion moved off Pinecone over cost.'
  last_verified: '2026-08-13'
  sources:
  - url: https://siliconangle.com/2025/12/01/pinecone-scales-vector-database-support-demanding-workloads/
    shows: 'Two named-shape customer deployments: 600 QPS at 45ms over 135 million vectors, load-tested to
      "2,200 queries per second with a P50 latency of just 60 milliseconds"; and "5,700 queries per second
      with a P50 latency of just 26 milliseconds across a database of 1.4 billion vectors". No user or customer
      count.'
