adoption:
  level: 4
  reach: 1M-10M
  signal_type: usage_volume
  confidence: medium
  note: The leading managed vector database. Production deployments are cited at 1.4 billion vectors and
    5,700 queries per second for a single e-commerce customer, and 135 million vectors at 2,200 queries
    per second load-tested for another, with a broad enterprise and developer base reached through serverless
    and AWS Marketplace pay-as-you-go. No single hard user count is published, so the level is a judgment
    across aggregate production usage. Some churn is visible too - Notion moved off it over cost.
  last_verified: '2026-08-13'
  sources:
  - url: https://siliconangle.com/2025/12/01/pinecone-scales-vector-database-support-demanding-workloads/
    shows: 'Two named-shape customer deployments: 600 QPS at 45ms over 135 million vectors, load-tested to
      "2,200 queries per second with a P50 latency of just 60 milliseconds"; and "5,700 queries per second
      with a P50 latency of just 26 milliseconds across a database of 1.4 billion vectors". No user or customer
      count.'
    accessed: '2026-08-13'
