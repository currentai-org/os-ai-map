capability:
  score: 4
  basis: benchmark
  basis_detail: ANN-Benchmarks
  relative_to: milvus
  relation: at
  value: P50 latency ~26-60ms at 1.4B-vector scale, 5,700 QPS; serverless auto-indexing, dedicated read
    nodes
  confidence: medium
  note: 'Level with Milvus, which is the 4 rung on the storage feature matrix, which bands on how much of
    the persist-index-retrieve path a product provides itself, at what scale and over how many retrieval
    modes: a complete durable system operated at scale, with integrated sparse-dense hybrid search, serverless
    auto-indexing and dedicated read nodes. It does not reach the 5 rung, which is for a platform that hosts
    and evaluates ranking or embedding models inside the serving path, because nothing in the recorded evidence
    shows that. Being a closed system its figures are vendor-reported and no independent submission exists:
    ann-benchmarks.com lists 38 algorithms and Pinecone is not among them, so the absence is a confirmed
    finding rather than an assumption, which is what holds confidence at medium. Rebanded on this matrix
    when the product moved out of agent_tools_protocols; the band did not move. Capability is independent
    of openness here - this product scores 1/closed and still reaches the same rung as two open engines.'
  last_verified: '2026-08-18'
  sources:
  - url: https://www.infoq.com/news/2025/12/pinecone-drn-vector-workloads/
    shows: Dedicated read nodes for predictable vector workloads; serverless scaling.
