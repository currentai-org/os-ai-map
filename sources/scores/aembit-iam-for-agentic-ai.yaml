capability:
  score: 3
  basis: feature_matrix
  basis_detail: parts of agent authorization the product implements itself
  value: blended identity binding a verified agent identity to the user it acts for, gateway policy check on every
    MCP request including per-tool filtering, per-user token exchange to short-lived scoped credentials; no human
    approval of an action, no tamper-evident decision record
  confidence: medium
  note: Aembit gives each agent a verified identity tied to the user it acts for, checks every MCP request and tool
    against policy at its gateway, and swaps in short-lived credentials scoped to that user. It logs each decision
    for a SIEM but does not sign or chain those logs, and it has no step that holds an action for a person to approve.
  relative_to: agent-governance-toolkit
  relation: two_below
  last_verified: '2026-11-20'
  sources:
  - url: https://aembit.io/iam-for-agentic-ai/
    shows: Blended Identity combines "an AI agent's identity with the identity of the person it acts for"; policies
      define "which tools they can use"; the gateway issues "short-lived, scoped credentials that expire when the
      task is done".
    accessed: '2026-11-20'
    http_status: 200
    content_sha256: 29f0ae63a7d86a23b93ada257a55dd5de0ba6cc9f5c295852bd07768fc42c1ab
