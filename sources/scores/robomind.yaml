capability:
  score: 4
  basis: feature_matrix
  basis_detail: episodes and embodiments
  value: 'RoboMIND 2.0: 310K real teleoperated trajectories, over 1,000 hours, 739 tasks, six embodiments (Tien Kung and Tianyi
    humanoids, AgileX, Franka, UR, Ark), with 12K tactile sequences and 20K mobile-manipulation trajectories. Version 1: about
    107k trajectories on four embodiments.'
  confidence: medium
  note: 'RoboMIND 2.0 is a third the size of AgiBot World but spread across six robot bodies from several makers, humanoids
    included, all of it real teleoperation. That puts it at the same rung: far beyond a single-platform set like DROID, and
    well short of the million-trajectory, twenty-plus-embodiment pool of Open X-Embodiment.'
  relative_to: agibot-world
  relation: at
