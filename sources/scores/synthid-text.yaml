  score: 2
  basis: feature_matrix
  basis_detail: 'category matrix: how independently a third party can check the evidence'
  value: Generation-time text watermarking by tournament sampling, with a weighted-mean detector or a trained
    Bayesian detector; detection uses the generator's watermarking keys.
  relative_to: compliance-trestle
  relation: one_below
  confidence: medium
  note: Only the holder of the watermarking keys can run the detector, so an outside party has to take the
    operator's word for a result. Compliance Trestle writes to a published standard that anyone can validate
    without the operator.
  last_verified: '2026-09-26'
