capability:
  score: null
  basis: n/a
  value: null
  confidence: high
  note: A2UI is a specification for how an agent describes an interface, shipped with renderers and SDKs that implement
    it, so like AG-UI and the Agent2Agent Protocol it has nothing to be measured against. Neither the repository README
    nor the project site publishes a benchmark, leaderboard or performance figure for the protocol.
  last_verified: '2026-10-19'
  sources:
  - url: https://raw.githubusercontent.com/a2ui-project/a2ui/main/README.md
    shows: 'The README says A2UI "is an open standard and set of libraries that allows agents to" speak UI: "Agents send
      a declarative JSON format describing the" intent of the UI, and "The client application then renders this using
      its own native component library". It names A2A and AG-UI as transports. Searched the body for benchmark, leaderboard,
      latency, throughput and performance, and found none of them.'
    accessed: '2026-10-19'
    http_status: 200
    content_sha256: 32fce5253f4e6f02f0c3ac184536e5e316d182ab2081a09013874c9e98d7b711
  - url: https://a2ui.org
    shows: The project site calls A2UI "A Protocol for Agent-Driven Interfaces" and lists its specification versions
      as v1.0 candidate, v0.9.1 current, v0.9 stable and v0.8 legacy. Searched the body for benchmark, leaderboard and
      performance, and found none of them.
    accessed: '2026-10-19'
    http_status: 200
