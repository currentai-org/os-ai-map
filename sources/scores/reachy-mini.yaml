capability:
  score: 1
  basis: feature_matrix
  basis_detail: morphology
  value: Desktop robot with a head on a six-degree-of-freedom Stewart platform (three rotations and three
    translations), one rotating body joint and two antenna joints, driven by Dynamixel XL330 and XC330
    servos, with a 120-degree camera, a four-microphone array and a speaker. No arm or gripper.
  confidence: medium
  note: Reachy Mini turns its head, body and antennas to look and gesture, but it has no arm or gripper,
    so it cannot reach for or carry anything. That puts it a step below the SO-101, a single arm that
    can.
  relative_to: so-101
  relation: one_below
  comparison:
    last_attested: '2026-09-28'
