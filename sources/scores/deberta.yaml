capability:
  score: 1
  basis: benchmark
  basis_detail: GLUE and XNLI results in the DeBERTaV3 paper
  value: GLUE average 91.37 for DeBERTaV3 Large and 79.8 zero-shot cross-lingual XNLI accuracy for mDeBERTaV3
    Base, the state of the art among models of similar structure at release (arXiv:2111.09543). A 304M-backbone
    encoder at most, which does not generate text.
  relative_to: comma
  relation: one_below
  confidence: high
  note: DeBERTaV3 Large posted the best GLUE result of any encoder its size when it was released, and
    the multilingual Base model led XNLI, but these are encoders that cannot generate text. It sits a
    step below Comma, a 7B model that only matches 2023-era peers.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://huggingface.co/common-pile/comma-v0.1-2t/raw/main/README.md
      shows: Comma v0.1-2T card still reports an 11-task average of 57.4 and says "It performs comparably
        to budget-matched models (7 billion parameters, 2 trillion tokens) trained on unlicensed data",
        the placement the comparison relies on.
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: 0cd34d6d1211c0d603e98ba2812945376584b615b08089a92d39b987f8e2ec9c
  last_verified: '2026-11-12'
  sources:
  - url: https://arxiv.org/abs/2111.09543
    shows: 'Abstract: "the DeBERTaV3 Large model achieves a 91.37% average score" on GLUE, "setting a
      new state-of-the-art (SOTA) among the models with a similar structure", and "the mDeBERTa Base achieves
      a 79.8% zero-shot cross-lingual accuracy on XNLI".'
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: 87bd1ba4dcf0869ee82c75bbc51b3a217093ebf91343ab08a5453bdfc864aad6
  - url: https://raw.githubusercontent.com/microsoft/DeBERTa/master/README.md
    shows: README model table gives DeBERTa-V3-Large 304M backbone parameters, Base 86M, Small 44M and
      XSmall 22M.
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: b6ecfe8197a4423087e0b1f2fe059dbc428e02c284075f7504a061aaad6d0f04
