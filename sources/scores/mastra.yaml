      detail: RBAC, SSO, FGA and the agent builder live in ee/-scoped directories under the Mastra Enterprise
        License, and the auth features are switched on at runtime by MASTRA_LICENSE_KEY, validated against
        the Mastra license server
    free_text:
    - ee/-auth-directories-under-Mastra-Enterprise-License
    - Mastra-Platform-hosted-tier-commercial
  confidence: high
  note: Mastra's framework is Apache-2.0 outside a set of ee/ directories that carry RBAC, SSO, fine-grained
    authorization and the agent builder under the separate Mastra Enterprise License, with the auth features
    activated only once MASTRA_LICENSE_KEY validates against Mastra's license server. Because those are
    real features withheld from the open license, not merely a hosted platform sold beside it, Mastra is
    open core rather than fully open source.
