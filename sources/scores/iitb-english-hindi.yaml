capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for English-Hindi parallel text
  value: About 1.49 million English-Hindi sentence pairs compiled from existing corpora and newly collected
    web text, documented in an LREC paper, and used as the English-Hindi data for the Workshop on Asian Translation
    shared tasks.
  confidence: medium
  note: The IIT Bombay corpus was the largest public English-Hindi parallel corpus when published, is documented
    source by source, and has been the English-Hindi data for the Workshop on Asian Translation shared tasks.
    Its roughly one and a half million sentence pairs cover a single language pair, far from the billions of
    pairs in the largest parallel collections, and the Bharat Parallel Corpus Collection spans twenty-two Indian
    languages with far more pairs.
  relative_to: bpcc
  relation: two_below
  last_verified: '2026-09-24'
