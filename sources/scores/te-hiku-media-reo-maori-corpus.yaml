capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for te reo Māori speech data
  value: By its owner's account the corpus holds more than 500 hours of labeled te reo Māori speech from archived
    radio interviews and publicly read sentences, described only in blog posts, and it trains Te Hiku Media's
    own recognizers, including a fine-tuned Whisper.
  confidence: medium
  note: The corpus holds archival speech from native speakers and trains Te Hiku Media's own speech recognizers,
    including a fine-tuned Whisper model. It is described only in the owner's blog posts, with no paper or
    card, which places it below BibleTTS, whose recordings and alignment are set out in a paper.
  relative_to: bibletts
  relation: at
  last_verified: '2026-09-24'
  sources:
