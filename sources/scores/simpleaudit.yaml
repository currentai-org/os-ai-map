  value: Multilingual adversarial probing with local/open-model support; scenario packs (safety, RAG,
    healthcare) plus a broken-premise evaluator.
  confidence: high
  last_verified: '2026-08-13'
  note: A focused but functional red-teaming toolkit with a distinctive broken-premise mode. The README
    carries a validation section reporting AUROC of 0.89-1.00 for separating safe from unsafe responses,
    and a direct comparison against Petri, but this is still a single-purpose adversarial-probing tool rather
    than a general harness, which is what holds the score where it is.
