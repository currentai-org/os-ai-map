capability:
  score: 4
  basis: feature_matrix
  basis_detail: 'category feature matrix: complete retrieval system, distributed or cluster-capable'
  value: 'Distributed storage for GPU workloads: GPU nodes join one OpenLake cluster serving a KV-cache
    offload pool and a petabyte-scale S3-compatible object store, durable through Reed-Solomon erasure
    coding across drives, with Kubernetes Helm deployment and a vLLM connector, on an io_uring engine.'
  relative_to: vespa
  relation: one_below
  confidence: medium
  note: 'OpenLake is a durable, cluster-capable store: GPU nodes contribute to one cluster, and data and
    parity are erasure-coded across drives, the same kind of scale-out store as AIStore and JuiceFS. It
    stores and returns objects and cached KV blocks rather than retrieving across modes, and hosts no
    model in its serving path, so it sits one step below Vespa.'
  comparison:
    last_attested: '2026-10-08'
    sources:
