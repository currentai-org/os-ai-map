capability:
  score: 4
  basis: feature_matrix
  basis_detail: coverage and downstream use for Kazakh speech recognition data
  value: KSC2 holds about 1,200 hours of transcribed Kazakh speech in over 600,000 utterances from earlier
    corpora plus broadcast, Senate and podcast audio, documented in an Interspeech paper, with community Whisper
    fine-tunes whose cards name it as training data.
  confidence: medium
  note: KSC gathers earlier Kazakh corpora with broadcast, Senate and podcast audio into what its publisher
    calls the first large open Kazakh speech corpus, documented in an Interspeech paper, and community Whisper
    recognizers name it as their training data. Its twelve hundred hours are small beside English speech corpora,
    but judged against what Kazakh has, an official language with over a million speakers and a small written
    web, it is the largest open Kazakh speech set.
  last_verified: '2026-11-11'
  sources:
