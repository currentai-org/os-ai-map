capability:
  score: 3
  basis: feature_matrix
  basis_detail: coverage and downstream use for Kazakh speech recognition data
  value: KSC2 holds about 1,200 hours of transcribed Kazakh speech in over 600,000 utterances from earlier
    corpora plus broadcast, Senate and podcast audio, documented in an Interspeech paper, with community Whisper
    fine-tunes listed as trained on it.
  confidence: medium
  note: KSC gathers earlier Kazakh corpora with broadcast, Senate and podcast audio into what its publisher
    calls the first large open Kazakh speech corpus, documented in an Interspeech paper, and several community
    Whisper fine-tunes for Kazakh are trained on it. At about twelve hundred hours it is small beside English
    speech corpora of hundreds of thousands of hours, and it serves only recognition in one language, where
    IndicVoices spans twenty-two.
  relative_to: indicvoices
  relation: one_below
  last_verified: '2026-09-24'
