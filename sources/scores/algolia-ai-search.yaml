capability:
  score: 4
  basis: feature_matrix
  value: 'a hosted, distributed search platform over a corpus the customer loads: hybrid vector-and-keyword
    retrieval (NeuralSearch), typo tolerance, autocomplete, AI ranking and personalization, served at sub-20ms
    across multiple content types'
  confidence: medium
  note: Algolia AI Search is a complete, hosted, distributed search platform. What separates the most capable
    systems in this category is letting the operator host and evaluate their own ranking or embedding models
    inside the serving path, the way Vespa evaluates ONNX and tensor models; Algolia's NeuralSearch is built
    into the service rather than exposed as a facility of that kind.
  last_verified: '2026-09-17'
