  note: Algolia reports more than 18,000 customers across 150+ countries and more than 1 billion queries every
    5 seconds at an average response time under 20 milliseconds, with named users including Stripe, Decathlon
    and Ubisoft. Query volume is enormous, and end-user reach - consumers hitting Algolia-powered search -
