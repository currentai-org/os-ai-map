capability:
  score: 4
  basis: feature_matrix
  value: 'a hosted, distributed search platform over a corpus the customer loads: hybrid vector-and-keyword
    retrieval (NeuralSearch), typo tolerance, autocomplete, AI ranking and personalization, served at sub-20ms
    across multiple content types'
  confidence: medium
  note: 'A complete durable system that is distributed is band 4 on this category''s ladder. Band 5 asks for
    a platform that hosts and evaluates ranking or embedding models inside the serving path, and the rung''s
    own examples are Elasticsearch''s in-tree `inference`, `ml` and `ml-package-loader` plugins and Vespa''s
    evaluation of tensor and ONNX models - facilities an operator puts a model into. Algolia''s NeuralSearch
    is described as a property of the service, and the page cited does not establish a model-hosting facility
    of that kind. The band rests on that gap in the evidence rather than on a rule about whose model it is:
    read NeuralSearch as satisfying the rung and this is a 5, which would make it the third product at this
    category''s top band, and that is a maintainer''s ruling.'
  last_verified: '2026-09-17'
  sources:
  - url: https://www.algolia.com/products/ai-search
    shows: 'Algolia''s AI Search product page: NeuralSearch combining vector and keyword retrieval, AI ranking
      and personalization over the customer''s own indexed content, delivered as a hosted API. No facility
      for deploying a customer''s own ranking or embedding model into the serving path appears on it.'
    accessed: '2026-09-17'
    http_status: 200
    content_sha256: 5d140ba0c22212cd8da8d0abc91edb2add3478dab2e806a3bc1aa6033bc64744
  relative_to: vespa
  relation: one_below
  comparison:
