capability:
  score: 4
  basis: feature_matrix
  basis_detail: parts of the remember, consolidate, recall and forget cycle the product performs itself
  value: similarity-search retrieval scoped to a user or other identity; LLM extraction of facts on configured
    topics from conversations and multimodal input; consolidation that creates, updates or deletes memories
    when new information duplicates or contradicts them; natural-language fact memories alongside schema-defined
    structured profiles; no aging of memories beyond a configurable time to live
  confidence: medium
  note: Memory Bank has a model extract facts from conversations and consolidates them, updating or deleting
    stored memories that new facts duplicate or contradict, and it keeps structured user profiles beside
    free-text facts. Memories leave on a time to live the developer sets; the service does not itself mark
    a memory out of date or weaken it with age, as Graphiti and Zep do.
  relative_to: graphiti
  relation: one_below
