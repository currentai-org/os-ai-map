capability:
  score: 3
  basis: feature_matrix
  value: tokenization, multi-word tokens, lemmatization, POS and morphological tagging, dependency and
    constituency parsing, NER, sentiment, language identification and coreference, with pretrained pipelines
    for about 80 languages and training code for every module
  relative_to: spacy
  relation: at
  confidence: high
  note: Stanza ships trained pipelines that analyze text in many languages straight away, as spaCy does,
    and like spaCy it needs a training run to recognize entity types or labels beyond the ones its models
    were trained on. Its breadth of languages is the main difference.
