capability:
  score: 4
  basis: feature_matrix
  value: classification and regression on a new table in one forward pass with no training or tuning; reported state
    of the art on TabArena for TabPFN-3 and 3.5
  relative_to: autogluon
  relation: one_below
  confidence: medium
  note: 'TabPFN does the work of model selection and tuning for you on each new table, and on the TabArena benchmark
    it outperforms tuned and ensembled gradient-boosting baselines. It stops at one model: it does not search over
    or ensemble other learners, prepare features, or cover time series and multimodal data the way AutoGluon does.'
  last_verified: '2026-09-26'
  sources:
  - url: https://arxiv.org/abs/2605.13986
    shows: 'TabPFN-3 abstract: "On the standard tabular benchmark TabArena, a forward pass of TabPFN-3 outperforms
      all other models, including tuned and ensembled baselines, by a significant margin".'
