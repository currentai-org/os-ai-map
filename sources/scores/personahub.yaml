  note: PersonaHub's headline result is a Qwen2-7B model fine-tuned on roughly 1.07 million persona-generated
    math problems, reaching about 65% on MATH and matching GPT-4-turbo-preview. Its impact runs mostly through
    datasets built on its method, such as Tulu 3's persona-math mixture, rather than through direct large-scale
    use of the personas themselves, unlike SmolTalk, FineWeb-Edu and DCLM-Baseline.
