  confidence: medium
  note: 'The paper''s headline training result is the basis: Qwen2-7B fine-tuned on ~1.07M persona-generated
    math problems reaches 64.9% on MATH, rivaling GPT-4-turbo-preview at the time. Persona Hub is 1 billion
    personas curated from web data and used to synthesize mathematical and logical reasoning problems at
    scale, and the lineage carries downstream: Tulu 3''s SFT persona-math set conditions on ~250K of these
    personas and credits the persona methodology for its 149,960 examples, so the corpus is an ingredient
    in a mixture already scored 4 here. It sits at 4 rather than 5 because the 5s in this category - SmolTalk,
    FineWeb-Edu, DCLM-Baseline - both lead head-to-head ablations and are the default others adopt wholesale,
    whereas PersonaHub is a generation method plus seed samples whose adoption runs through derivative sets.
    That is the same shape as tulu-3-sft-mixture and fineweb, both also 4.'
  last_verified: '2026-08-13'
