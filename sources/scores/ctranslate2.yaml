capability:
  score: 3
  basis: feature_matrix
  basis_detail: category feature matrix, placed against vllm
  value: Optimized runtime for converted Transformer models with FP16, BF16, INT16, INT8 and AWQ INT4 weights, layer fusion,
    padding removal and batch reordering; x86-64 and ARM64 CPU backends (Intel MKL, oneDNN, OpenBLAS, Ruy, Apple Accelerate)
    chosen at runtime, GPU support including ROCm wheels and an experimental Apple Metal backend; tensor parallelism across
    GPUs; encoder-decoder, decoder-only and encoder-only architectures.
  relative_to: vllm
  relation: two_below
  confidence: medium
  note: CTranslate2 is a fast, light engine for running Transformer models on CPUs and GPUs, used above all for translation
    and speech models. It is a library rather than a serving system and documents none of the request-level techniques vLLM
    is built on, such as paged attention and continuous batching, so it sits two steps below vLLM.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/vllm-project/vllm/main/README.md
      shows: The peer's README still lists PagedAttention, "Continuous batching of incoming requests, chunked prefill, prefix
        caching", speculative decoding, "Tensor, pipeline, data, expert, and context parallelism for distributed inference",
        hardware plugins across GPU and accelerator vendors, and "200+ model architectures".
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: ba4998a8520051250ec81c60187203745e6bc0b9c197af6e1b6a73143f5e575e
  last_verified: '2026-11-12'
  sources:
  - url: https://raw.githubusercontent.com/OpenNMT/CTranslate2/HEAD/README.md
    shows: The README lists "weights quantization, layers fusion, batch reordering", FP16, BF16, INT16, INT8 and AWQ (INT4)
      weights, Intel MKL, oneDNN, OpenBLAS, Ruy and Apple Accelerate CPU backends with automatic dispatch, "Support tensor
      parallelism for distributed inference", and supported encoder-decoder, decoder-only and encoder-only model types.
    accessed: '2026-11-12'
    http_status: 200
    content_sha256: 4bcbf9ba92196edd907c118b626f9106a7d311dc054cab06ec9134925917b78b
