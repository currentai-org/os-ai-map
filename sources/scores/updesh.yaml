capability:
  score: 2
  basis: feature_matrix
  basis_detail: coverage and downstream use for Indic instruction data
  value: 'Updesh holds about 9.5 million instruction examples in 13 Indian languages and English: 7.32 million
    translated from synthetic English reasoning data and 2.15 million generated by large models, none written
    by people. Documented in a paper, with no use found beyond that paper''s fine-tuning experiments.'
  confidence: medium
  note: Updesh is carefully documented and checked with human quality ratings, but every example is machine-translated
    or generated by large models, and the only models trained on it are the ones in its own paper. WangchanThaiInstruct,
    by contrast, is written by annotators and domain experts.
  relative_to: wangchan-thai-instruct
  relation: two_below
  last_verified: '2026-11-11'
