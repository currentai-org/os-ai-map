capability:
  score: 3
  basis: feature_matrix
  basis_detail: category feature matrix, banded against the vllm anchor
  value: Local model serving over OpenAI- and Ollama-compatible APIs; llama.cpp (GGUF) as the default engine on
    CPU, CUDA, ROCm, Vulkan, Apple Silicon and Adreno, with vLLM and Diffusers engines on Linux NVIDIA; pull and
    push models through Docker Hub, OCI registries and Hugging Face; GGUF and Safetensors packaged as OCI artifacts;
    Compose and Testcontainers integration; single-node rather than distributed serving.
  relative_to: vllm
  relation: two_below
  confidence: medium
  note: Docker Model Runner sits two tiers below vLLM, level with Lemonade and llamafile among the local runners.
    It can hand a model to vLLM, but it adds no parallelism or multi-node serving of its own; what it adds is distributing
    models as OCI artifacts through the Docker toolchain.
  comparison:
    last_attested: '2026-11-12'
    sources:
    - url: https://raw.githubusercontent.com/vllm-project/vllm/main/README.md
      shows: 'vLLM README: datacenter serving with "Tensor, pipeline, data, expert, and context parallelism for
        distributed inference". Docker Model Runner serves one machine and uses vLLM only as an optional engine
        on Linux NVIDIA, so it stays two steps behind.'
      accessed: '2026-11-12'
      http_status: 200
      content_sha256: ba4998a8520051250ec81c60187203745e6bc0b9c197af6e1b6a73143f5e575e
  last_verified: '2026-11-12'
