    shows: The docs list "Serve models on OpenAI and Ollama-compatible APIs", "Support for llama.cpp, vLLM, and
      Diffusers inference engines (vLLM and Diffusers on Linux with NVIDIA GPUs)", "Package GGUF and Safetensors
      files as OCI Artifacts", and say Docker Engine "Supports CPU, NVIDIA (CUDA), AMD (ROCm), and Vulkan backends".
