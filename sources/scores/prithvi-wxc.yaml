capability:
  score: 2
  basis: feature_matrix
  basis_detail: scientific adaptation surface
  value: Task-specific downstream adaptation; global and regional runs and a flexible lead time on one MERRA-2
    grid, which are extent rather than a second resolution; a deterministic future-state target, and one
    MERRA-2 input system.
  relative_to: weathernext
  relation: two_below
  confidence: high
  note: Prithvi WxC documents task-specific downstream adaptation. Its global and regional runs and flexible
    lead time change how much area it covers and how far ahead it forecasts on one MERRA-2 grid rather than
    the resolution it works at, and its downscaling model is a separately released fine-tune. Producing
    a future timestamp from two input timestamps is a deterministic forecast rather than a generated output,
    and the 160 MERRA-2 variables it ingests count as one input system.
  last_verified: '2026-11-16'
