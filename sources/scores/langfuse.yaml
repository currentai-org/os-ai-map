adoption:
  level: 4
  signal_type: reported_traction
  confidence: medium
  banded_quantity: none. The figures behind the level are the vendor's own, and the map measures neither
    Docker pulls nor Fortune 500 penetration.
  note: 'The langfuse PyPI package is a client: applications install it to send traces, so its downloads
    count instrumented applications rather than Langfuse deployments. ClickHouse''s acquisition announcement
    is the evidence that speaks to the product, reporting 6M+ pulls of the server image, with no period
    stated, and use by 19 of the Fortune 50. Those are the vendor''s claims rather than counts made here,
    and a pull is not a deployment.'
  last_verified: '2026-09-21'
