adoption:
  level: 5
  reach: '>10M'
  signal_type: usage_volume
  confidence: high
  note: 'The band rests on the PyPI package langfuse, the product''s own client SDK: where a hosted platform has
    no other countable channel, its client SDK''s downloads band the platform, the same way qdrant is banded on
    qdrant-client. pypistats answers 26,611,793 downloads in the last month for langfuse (6,315,194 in the last
    week, 1,118,108 in the last day), which clears the >10M floor for level 5. This is instrumentation traffic rather
    than a seat count, which is exactly what an observability platform''s reach looks like. Langfuse is described
    as the most widely adopted open source LLM engineering platform, and was acquired by ClickHouse in March 2026.'
  last_verified: '2026-08-14'
  sources:
  - url: https://pypistats.org/api/packages/langfuse/recent
