  class: open_core
  components:
    license:
    - name: MIT
      detail: core:tracing/integrations/API/data-model/exports/evals/playground/SSO
    commercial:
      value: enterprise-security
      detail: SCIM,audit-logs,data-retention
    source:
      value: public
    core-gated:
      value: gated
      detail: the root LICENSE carves ee/, web/src/ee/ and worker/src/ee/ out of MIT and under ee/LICENSE, the Langfuse
        Enterprise License; ee/src ships an ee-license-check module and web/src/ee/features holds multi-tenant SSO,
        SSO settings, the audit-log viewer, the admin API, billing, verified domains and UI customization
  confidence: high
  note: 'An MIT core with a commercially licensed enterprise directory in the same repository. The gating is read
    directly from the repository and does not rest on Langfuse Cloud or on the ClickHouse acquisition. The root
    LICENSE splits the repo itself: "All content that resides under the ''ee/'', ''web/src/ee/'', and/or ''worker/src/ee/''
    directories of this repository, if these directories exist, is licensed under the license defined in ''ee/LICENSE''",
    and everything outside them is MIT Expat. ee/LICENSE opens by calling Langfuse "an open core project" and requires
    "a valid Langfuse Enterprise License". The carve-out is not a stub: ee/src holds a license-check module, and
    web/src/ee/features holds admin-api, audit-log-viewer, billing, multi-tenant-sso, sfdc-sync, sso-settings, ui-customization
    and verified-domains. That is genuine open core rather than fully open source. One correction the read forces:
    single sign-on is not in the MIT core, despite what the license detail recorded beside this note says - multi-tenant-sso
    and sso-settings both sit under web/src/ee/.'
