product: logfire
openness:
  score: 2
  class: source_available
  components:
    license:
    - name: MIT
      detail: covers the Python/TypeScript/Rust SDKs and documentation in this repository only
    source:
      value: partial
      detail: the SDK is published; the server application that records and displays the data (the
        actual Logfire platform) is not in this repository or any public one
    backend:
      value: commercial
      detail: hosted Logfire Cloud platform, with self-host offered only under a purchased enterprise
        license
  confidence: high
  note: The repository is a genuine, standalone MIT SDK that exports OpenTelemetry data to any compatible
    backend, but the running platform - the UI and the server that records and displays it - is closed
    source by the vendor's own statement, with self-hosting sold as a paid enterprise product rather than
    published. That is the `partial` rung regardless of the SDK's license, the same reading `weave` gets
    for the same shape, though Logfire publishes less of the server side than weave does - no trace-server
    library ships here at all.
  raw: license:MIT(SDK/docs only);source:partial(server application not published);backend:commercial(hosted
    platform, self-host requires a purchased enterprise license)
