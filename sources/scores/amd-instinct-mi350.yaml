  confidence: high
  relative_to: nvidia-blackwell
  relation: at
  note: The MI355X matches Blackwell Ultra's dense FP8 throughput at about 5 PFLOPS and carries slightly more memory,
    288 GB of HBM3E at 8 TB/s. Its FP4 figure is lower than NVIDIA's, which is the one place the two generations
    differ materially.
