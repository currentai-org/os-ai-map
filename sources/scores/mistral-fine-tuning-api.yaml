  score: 3
  basis: feature_matrix
  value: 'Methods: LoRA-adapter supervised fine-tuning (text & vision) + Classifier Factory for classification
    models. Tunable base models limited to Mistral''s own (Small/Medium tier). No exposed full-FT/DPO/RFT
    or scale/precision knobs in the managed API.'
  confidence: medium
  note: Mistral's fine-tuning API offers LoRA-based supervised fine-tuning for text and vision, plus a Classifier
    Factory for classification, on its own Small and Medium models, with no full fine-tuning, DPO, reinforcement
    fine-tuning, or scale and precision controls exposed. That is narrower than the preference- and RL-capable
    services from OpenAI, Azure, Together and Fireworks, and further behind the open-source libraries that
    train far larger models.
  last_verified: '2026-08-09'
