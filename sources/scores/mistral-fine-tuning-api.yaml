  value: 'Methods: LoRA-adapter supervised fine-tuning (text & vision) + Classifier Factory for classification
    models. Tunable base models limited to Mistral''s own (Small/Medium tier). No exposed full-FT/DPO/RFT
    or scale/precision knobs in the managed API.'
  confidence: medium
  note: Mistral's fine-tuning API offers supervised fine-tuning for text and vision, plus a Classifier Factory,
    on Mistral's own models, with only training steps and learning rate exposed as hyperparameters and no
    full fine-tuning, DPO, or reinforcement fine-tuning documented. That is narrower than the preference-
    and RL-capable services from OpenAI, Azure, Together and Fireworks.
