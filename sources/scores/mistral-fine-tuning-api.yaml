  note: Mistral's fine-tuning API offers LoRA-based supervised fine-tuning for text and vision, plus a Classifier
    Factory, on its own Small and Medium models, with no full fine-tuning, DPO, or reinforcement fine-tuning
    exposed. That is narrower than the preference- and RL-capable services from OpenAI, Azure, Together
    and Fireworks.
