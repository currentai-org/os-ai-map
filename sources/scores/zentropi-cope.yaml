capability:
  score: 4
  basis: feature_matrix
  basis_detail: steerable bring-your-own-policy
  relative_to: gpt-oss-safeguard
  relation: at
  value: Policy-adaptive binary labeling that evaluates content against an arbitrary natural-language policy
    rather than a fixed taxonomy, with F1 results reported for hate speech, toxicity, sexual content, self-harm
    and harassment.
  confidence: low
  note: Like gpt-oss-safeguard, CoPE evaluates content against an arbitrary policy the user writes rather
    than a fixed taxonomy, and its card reports F1 results for hate speech, toxicity, sexual content, self-harm
    and harassment. It returns only a binary label, which puts it level with gpt-oss-safeguard rather than
    ahead.
  last_verified: '2026-09-29'
  sources:
  - url: https://huggingface.co/zentropi-ai/cope-a-9b
    shows: 'The model card lists "Policy-adaptive content evaluation" and "Steerable (no fixed taxonomy/definitions)",
      says the model "can accept any arbitrary content policy", describes output as "Binary classification
      only (i.e., presence/absence of matching labels)", and gives F1 tables headed "Hate Speech Classification",
      "Toxic Speech Classification", "Sexual Content Classification", "Self-Harm Content Classification"
      and "Harassment Classification". Searched the card for violence and violent: none.'
