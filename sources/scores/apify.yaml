  confidence: high
  note: The product proper - the Apify platform and its Actor store - is proprietary SaaS. Apify also maintains
    Crawlee, an Apache-2.0 scraping library, but Crawlee is an adjacent SDK rather than the platform core,
    so most of the value stays behind the managed cloud. Open core would mean an OSI-licensed core with functionality
    withheld for a paid tier; there is no open core here, only an open periphery. Publishing a repository while
    the runtime itself does not ship counts as partial source, which scores 2, source-available.
