capability:
  score: 4
  basis: feature_matrix
  value: a platform API that runs actors and returns their dataset items synchronously or asynchronously, with
    Apify's own first-party search and crawl actors on top of it
  confidence: high
  note: Apify's own first-party actors, such as Google Search Results Scraper, run through the platform
    API and return organic search results and structured dataset items directly, which puts search and retrieval
    on the platform itself rather than only in its marketplace. Third-party actors that the store merely
    hosts do not count toward this, since they are built and maintained by other developers rather than
    Apify. That puts Apify at the same level as Firecrawl.
  last_verified: '2026-09-17'
  sources:
  - url: https://docs.apify.com/api/v2
    shows: 'The Apify API v2 reference: Run Actor, "Run Actor synchronously and get dataset items", Get list
