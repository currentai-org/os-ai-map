adoption:
  level: 4
  signal_type: reported_traction
  confidence: low
  banded_quantity: none. The vendor's homepage names customers but publishes no count, and the monthly PyPI
    downloads of the braintrust SDK are the platform's client channel and are not banded.
  note: Braintrust is a hosted platform, and the braintrust package on PyPI is its client, installed by every
    application that sends it logs or evaluations, so its downloads count client installs rather than use of
    the platform. The vendor publishes no user or account figure, and its homepage names Notion and Coursera
    as customers. The level is left as it was set; raising or lowering it would need standing evidence about
    the platform itself.
  last_verified: '2026-08-13'
