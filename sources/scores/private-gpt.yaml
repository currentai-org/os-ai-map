capability:
  score: 4
  basis: feature_matrix
  value: 'API-layer breadth rather than a chat surface: streaming messages API with token counting, file and artifact
    ingestion, retrieval with citations and agentic RAG, built-in tools mirroring the Claude API (web search, web
    fetch, code execution), custom tools and MCP connectors, structured access to databases and CSVs, embeddings
    and orchestration. Works against any OpenAI-compatible server. Ships no UI of its own.'
  confidence: medium
  note: 'Scored 4 on the gateway side of this category rather than the chat side. Its retrieval, tool and connector
    surface is the same order as anythingllm and open-webui, both 4 here, and broader than a front end like jan
    at 3. It stops short of 5 because it deliberately ships no interface: librechat at 5 covers multi-provider chat,
    multi-user authentication and agents together, where this covers the API layer alone.'
  relative_to: anythingllm
  relation: at
  comparison:
    last_attested: '2026-08-31'
    sources:
