capability:
  score: 3
  basis: feature_matrix
  basis_detail: 'category feature matrix: single-purpose store or index'
  value: Cell-level versioned SQL storage with branch, merge and diff semantics behind a MySQL interface. Versioning
    depth is the category's best; it carries no vector or full-text retrieval.
  relative_to: vespa
  relation: two_below
  confidence: medium
  note: Dolt provides cell-level versioned SQL storage behind a MySQL interface, with branch, merge and
    diff semantics that go deeper on versioning than anything else in the category. It carries no vector
    or full-text retrieval, so it covers much less of the same persist-index-retrieve path that Vespa spans
    in full.
  last_verified: '2026-08-18'
