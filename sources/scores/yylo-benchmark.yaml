  value: Evaluation harness for coding agents - isolated v2 attempts in dedicated fresh repositories with
    private home/temp/cache/config roots and a selective filesystem sandbox, an explicitly authorized
    governed-workflow lane behind a hash-pinned reviewed boundary with typed exclusive locks and blinded
    per-step judging, deterministic command and configurable LLM-judge evaluator profiles, and one hash-verified
    retained evidence chain linking plan, attempt, workspace receipt, post-execution repository manifest,
    terminal, and evaluation IDs.
