capability:
  score: 2
  basis: feature_matrix
  value: Evaluation harness for coding agents - isolated v2 attempts in dedicated fresh repositories with
    private home/temp/cache/config roots and a selective filesystem sandbox, an explicitly authorized
    governed-workflow lane behind a hash-pinned reviewed boundary with typed exclusive locks and blinded
    per-step judging, deterministic command and configurable LLM-judge evaluator profiles, and one hash-verified
    retained evidence chain linking plan, attempt, workspace receipt, post-execution repository manifest,
    terminal, and evaluation IDs.
  confidence: medium
  note: 'yylo-benchmark is a thin runner for comparing coding agents: reviewed cases, independent attempts
    in fresh repositories, later check, judge or human evaluations of retained output, and checklist-based
    loss reporting. It offers workspace hygiene rather than filesystem, account or network isolation, and
    there is not yet enough evidence to place it against the category''s leading harnesses.'
  sources:
  - url: https://raw.githubusercontent.com/yylo-dev/yylo-benchmark/main/README.md
    shows: README describing two evaluation lanes, isolated fresh-repository attempt workspaces with selective
      filesystem sandboxing, deterministic and LLM-judge evaluator profiles, and fail-closed recovery,
      doctor, and report over one retained hash-verified evidence chain
    accessed: '2026-09-14'
    http_status: 200
