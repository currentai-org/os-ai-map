# Shared openness ladder for SOFTWARE categories.
#
# Inherited via `scoring_recipe: {extends: software}`. See build/rubrics.py for the merge
# rules and why the ladder is shared rather than copied per category.
#
# Software openness does not turn on a model's questions. There are no weights and no
# training corpus; what matters is whether the thing you run is the thing that was
# published. Eleven categories ask that same question of the same four license tiers, so
# the ladder lives here and the license-to-tier mapping has one home: whether AGPL is `osi`
# is a fact about AGPL, not about telemetry versus deployment.
#
# Verified against deployment first, 27/27. Each inheriting category records its own
# `derived_from` counts.
openness:
  # Software openness does not turn on the same questions as a model's. There are no
  # weights and no training corpus; what matters is whether the thing you actually run
  # is the thing that was published. Two dimensions carry that, and both were already
  # being recorded in prose before this recipe existed - in about forty phrasings, which
  # is precisely why a rubric could not read them. The controlled keys restate the prose;
  # they do not replace it.
  dimensions:
    source:
      question: Is the source of the product you actually run published?
      values: [public, partial, closed]
      evidence:
      - '`public`: the running product builds from the published repo, self-host included'
      - '`partial`: a repo exists but the runtime does not ship - a client, an SDK, or an
        issue tracker standing in for the engine'
      - '`closed`: a managed service with no self-hostable implementation'
      machine_signal: partial — repo presence from signal_github.repo_state, which
        establishes that a repo exists but never that it is the whole product
    core_gated:
      question: Is functionality withheld from the published source for a paid tier?
      values: [gated, ungated]
      reads: [core-gated, self-host]
      # `self-host` is the same question in the vocabulary the corpus actually used.
      # Whether the vendor lets you run the published thing yourself IS whether the core is
      # withheld, and 54 records say so under that name while 164 say it under
      # `core-gated`. Where both are recorded - 23 records - they never disagree: 11
      # `yes`/`ungated`, 10 `primary`/`ungated`, 2 `only`/`ungated`, and no contradictions.
      # Until this list read it, `self-host` was an undeclared key and was dropped before
      # the formula ran, which is why check_recipe's docstring names it as the single most
      # common piece of vocabulary drift on the map.
      #
      # `reads:` selects a key and takes its value, so a synonym key still needs its values
      # translated - the problem dataset.yaml's `availability` notes it cannot solve by
      # widening `reads:` alone. `value_aliases` is that translation, and it is the same
      # idea `license_tier` already uses: a canonical rung with the literal spellings that
      # land on it declared beside it, because whether `enterprise-only` means gated is a
      # fact worth writing down rather than a regex worth getting wrong. A recorded
      # spelling with no entry here is not guessed at - it falls outside the enum, the
      # dimension reads as unanswered, and the formula abstains.
      #
      # `'yes'` and `'no'` are quoted for the reason the note below gives about `values`:
      # YAML 1.1 parses both bare as booleans, and a boolean key never matches the string
      # the parser hands it.
      value_aliases:
        'yes': ungated
        primary: ungated
        only: ungated
        'no': gated
        none: gated
        enterprise-only: gated
        enterprise-tier: gated
        none for core AX features: gated
      evidence:
      - '`gated`: features live behind an enterprise license directory, a Premium tier, or
        a commercial edition the published source cannot build'
      - '`ungated`: a managed or hosted offering may exist ALONGSIDE an ungated core; hosting
        convenience is not gating. `openpcc` is the case - its commercial CONFSEC service
        is explicitly separate from the Apache-2.0 reference implementation'
      note: >-
        Values are `gated`/`ungated` rather than yes/no on purpose: YAML 1.1 parses bare
        yes and no as booleans, so a `values: [yes, no]` list becomes [True, False] and
        stops matching the quoted strings in the formula. serialize_rubric catches it,
        but the words avoid it. Only meaningful where `source` is public. Where the source is not published
        there is nothing to gate, and the formula settles those on `source` alone.
      machine_signal: none — requires reading the repo and the pricing page

  # Same shape as the model ladder, different rungs. Declaration order IS restrictiveness
  # order, least restrictive first, and `tier_rank` is emitted from it.
  license_tier:
    # Most products record the license under `license`. A few record it under
    # `license-terms` instead, where the terms are a paragraph rather than a name -
    # `webcontainers` is the case, its runtime being proprietary while a shell repo is
    # MIT. Either key answers the same question, so both are read, first match winning.
    reads: [license, license-terms]
    ordered_by: restrictiveness_ascending
    values:
      osi:
        definition: >-
          OSI-approved, copyleft included. A copyleft obligation binds whoever
          redistributes; it does not cap who may use the software or at what scale, which
          is the line this ladder draws. AGPL sits beside Apache here, not below it.
          Settled in issue #125, which was opened because two products had been scored a
          level down for AGPL on a rationale the other 22 copyleft products did not apply.
        # Spelling variants and dual forms are listed literally rather than normalized:
        # whether `GPLv3` is OSI is a fact, and a fact is cheaper to look up than a regex
        # is to get right. `LGPL-3.0/GPL-3.0` is openfn dual-licensing under two OSI
        # licenses, so either branch lands on this rung. `Apache-2.0/MIT` is the same shape
        # on `megatron-lm`'s vendored components, and is already declared verbatim in
        # `dataset.yaml` for `livebench` - one spelling, one tier, in both ladders.
        examples: [Apache-2.0, MIT, BSD-3-Clause, GPL-3.0, AGPL-3.0, LGPL-3.0, MPL-2.0,
          GPL-3.0-or-later, GPLv3, LGPL-3.0/GPL-3.0, Apache-2.0/MIT]
      permissive_non_osi:
        definition: >-
          Not OSI-approved, but imposes no restriction on WHO may use the software or AT
          WHAT SCALE. Attribution and naming requirements belong here.
        examples: []
      competition_restricted:
        definition: >-
          Source is published and readable, but the license forbids or charges for a class
          of use - competing hosted services, for-profit production above a threshold, or
          use before a delayed conversion date. The reader can audit the code and still
          not be free to run it, which is why this sits below the OSI tiers rather than
          beside them. Delayed-conversion licenses are scored on their terms TODAY.
        # `n8n-Enterprise-License` covers the `ee/` directories n8n ships in the same public
        # repo as its Sustainable-Use-License core: the source is published and readable,
        # and running it needs a paid license key. That is this tier's definition almost
        # word for word, and it is why the tier is NOT `proprietary` - proprietary here
        # means the source is not published, and n8n's is.
        examples: [BSL-1.1, SSPL-1.0, FCL-1.0-ALv2, Elastic-License-2.0,
          Elastic License 2.0, Sustainable-Use-License, n8n-Enterprise-License]
      proprietary:
        definition: No license to the source, because the source is not published.
        # `commercial` is how the closed observability vendors record it.
        examples: [Proprietary, commercial, proprietary]

  # Ordered, first match wins. There is deliberately NO `otherwise`: a product whose
  # recorded evidence does not reach a rule is abstained on by check_rubric and reported,
  # rather than being scored at whatever the last rung happened to be. Roughly a third of
  # software products across the map do not yet record `core-gated`, and an `otherwise`
  # would publish a score for every one of them.
  formula:
  - when: {source: closed}
    then: {score: 1, class: closed}
    because: No self-hostable implementation, so nothing about the license can help.
  - when: {source: partial}
    then: {score: 2, class: source_available}
    because: >-
      A repo without the runtime. Readable, not runnable - `webcontainers` publishes
      webcontainer-core but not the proprietary StackBlitz engine.
  - when: {license_tier: competition_restricted, source: public}
    then: {score: 2, class: source_available}
    because: >-
      Full source, but a license that forbids a class of use. Scored beside partial
      source because the practical outcome matches: you can read it and not run it freely.
  - when: {license_tier: osi, source: public, core_gated: gated}
    then: {score: 4, class: open_core}
    because: >-
      An OSI core with functionality withheld for a paid tier. Not 5, because the
      published source is not the whole product; not 3, because what ships is genuinely
      open and self-hostable.
  - when: {license_tier: osi, source: public, core_gated: ungated}
    then: {score: 5, class: open_source}
    because: >-
      The published source is the whole product. A managed offering alongside it does not
      change that.
  # `permissive_non_osi` deliberately has NO rung, so a product landing there abstains and
  # is deferred for a human. Two rungs used to sit here, emitting 4/open_core and
  # 5/open_source. Both were unreachable, because this tier's `examples` list is empty and
  # no software product resolves into it - and both were wrong in the same way: they handed
  # a non-OSI license an open_source or open_core class, and openness-class-map.json puts
  # both of those in the `open` bucket. render.py calls that bucket boundary a "strict
  # OSI/MOF cut", and it was neither. The Model Openness Framework classes a release under
  # OpenRAIL or a Llama community license as source-available rather than open, and OSAID
  # requires the freedom to use a system "for any purpose", so a non-OSI license cannot
  # reach the open bucket by either standard.
  #
  # Dead rules were the reason it went unnoticed. model.yaml already records the principle:
  # a dead rule in a first-match-wins formula is a place for a later edit to hide. Assigning
  # any license to this tier would have silently activated a 5/open_source rung.
  #
  # Restoring a rung here needs evidence from a real product, not a guess about a
  # hypothetical one. tests/test_openness_buckets.py enforces the boundary either way.

# Adoption bands: which monthly figure maps to which level, for this product type.
#
# Declared here rather than in the warehouse because they were hardcoded in
# currentai.signal_pypi.package_downloads and nowhere else - the same repo/warehouse
# split that check_parity exists to catch, one axis over. The scoring SQL now reads
# registry.adoption_bands, which build/serialize_registry.py emits from this block.
#
# The scale is a property of the product TYPE, which is what the rubrics are already
# keyed on, so this is four declarations rather than sixteen.
#
# `above` is the exclusive lower bound, so the bands read the way the SQL does: the
# highest level whose `above` the figure exceeds wins. `reach` is the label a score
# records, and it carries the UNIT the band was read in - stars and downloads are not
# the same reach at the same magnitude.
#
# The floor band is -1 rather than 0 so that a figure of exactly ZERO still bands at 1.
# With 0 it did not: `0 > 0` is false, the product matched no band, and it came back
# unbanded - which asserts "no scale exists for this type" when the truth is "nobody
# downloaded it". zentropi-cope surfaced it on the first real run.
#
# Derived 2026-08-09 from the 279 software products recording both a level and a reach.
# The mapping is unambiguous at every level: <10K->1 (11 of 12), 10K-100K->2 (26 of 44),
# 100K-1M->3 (56 of 72), 1M-10M->4 (63 of 67), >10M->5 (32 of 35).
adoption:
  reach_is_monthly: true
  unit: package downloads in the trailing 30 days, summed across declared artifacts
  bands:
  - {level: 5, above: 10000000, reach: '>10M'}
  - {level: 4, above: 1000000, reach: 1M-10M}
  - {level: 3, above: 100000, reach: 100K-1M}
  - {level: 2, above: 10000, reach: 10K-100K}
  - {level: 1, above: -1, reach: <10K}
