# Shared openness ladder for SOFTWARE categories, inherited via
# `scoring_recipe: {extends: software}`. See build/rubrics.py for the merge rules and
# docs/reference/openness.md for the rulings behind the license tiers and gating rules
# below.
openness:
  dimensions:
    source:
      question: Is the source of the product you actually run published?
      values: [public, partial, closed]
      evidence:
      - '`public`: the running product builds from the published repo, self-host included'
      - '`partial`: a repo exists but the runtime does not ship - a client, an SDK, or an
        issue tracker standing in for the engine'
      - '`closed`: a managed service with no self-hostable implementation'
      machine_signal: partial — repo presence from signal_github.repo_state, which
        establishes that a repo exists but never that it is the whole product
    core_gated:
      question: Is functionality withheld from the published source for a paid tier?
      values: [gated, ungated]
      reads: [core-gated, self-host]
      # Ruling: docs/reference/openness.md, "Selling something is not gating a core" (what
      # counts as gating, and the langgraph/langchain/litellm precedent).
      # Ruling: docs/reference/openness.md, "`self-host` and `core-gated` are one question"
      # (the reads:/value_aliases merge and why it's conservative).
      #
      # `'yes'` and `'no'` are quoted because YAML 1.1 parses both bare as booleans, which
      # never match the quoted strings the formula reads.
      value_aliases:
        'yes': ungated
        primary: ungated
        only: ungated
        'no': gated
        none: gated
        enterprise-only: gated
        enterprise-tier: gated
        none for core AX features: gated
      evidence:
      - '`gated`: part of the product is withheld from the published source - an enterprise
        license directory (`litellm`, `openhands`), a Premium tier or commercial edition the
        published source cannot build, or a closed package behind a license key (`langgraph`,
        whose Agent Server is an Elastic-2.0 wheel needing LANGGRAPH_CLOUD_LICENSE_KEY)'
      - '`ungated`: a managed or hosted offering may exist ALONGSIDE an ungated core; selling
        a separate product is not gating. `openpcc` is the case - its commercial CONFSEC
        service is explicitly separate from the Apache-2.0 reference implementation - as are
        `langchain` (LangSmith), `llama-index` (LlamaParse), `pydantic-ai` (Logfire), `zed`
        (Zed-hosted inference) and `otari` (the hosted Otari.ai platform)'
      - 'ACCEPTANCE STANDARD for `ungated`, applying to records written from 2026-09-16: a
        recursive tree showing no `ee/`, `enterprise/`, `commercial/` or `proprietary/` path
        establishes PATH ABSENCE and nothing more, and is never sufficient alone. Pair it with a
        statement from the party that would do the withholding - a vendor naming its commercial
        offering as a separate product, or foundation or academic governance meaning no
        commercial party is positioned to withhold anything. This is a HUMAN-REVIEWED POLICY:
        no gate enforces it, and none can, because whether a page names a separate offering is
        not mechanically decidable from its URL.'
      - 'What DISPLACES the standard above and makes a product `gated` is direct evidence of the
        mechanism, which is always citable: a closed package the open one pulls (`zenml`, whose
        Pro images are privately hosted and granted on request), a license key in the published
        source (`determined-ai`, `polyaxon`), or an `ee/` tree under different terms (`litellm`,
        `n8n`). Gating is provable and ungated is a negative no document asserts, which is why
        the burden sits where it does.'
      note: >-
        Values are `gated`/`ungated` rather than yes/no on purpose: YAML 1.1 parses bare
        yes and no as booleans, so a `values: [yes, no]` list becomes [True, False] and
        stops matching the quoted strings in the formula. serialize_rubric catches it,
        but the words avoid it. Only meaningful where `source` is public. Where the source is not published
        there is nothing to gate, and the formula settles those on `source` alone.
      machine_signal: none — requires reading the repo and the pricing page

      # Ruling: docs/reference/openness.md, "The `ungated` acceptance standard, and why it is
      # prospective" (what the acceptance standard requires, and why it does not apply
      # retroactively).

  # Declaration order is restrictiveness order (least restrictive first); `tier_rank` is
  # emitted from it.
  license_tier:
    # `license-terms` holds a paragraph rather than a name (e.g. `webcontainers`); either key
    # is read, first match winning.
    reads: [license, license-terms]
    ordered_by: restrictiveness_ascending
    values:
      osi:
        definition: >-
          OSI-approved, copyleft included. A copyleft obligation binds whoever
          redistributes; it does not cap who may use the software or at what scale, which
          is the line this ladder draws. AGPL sits beside Apache here, not below it.
          Settled in issue #125, which was opened because two products had been scored a
          level down for AGPL on a rationale the other 22 copyleft products did not apply.
        # Ruling: docs/reference/openness.md, "The `osi` tier's `examples`: literal spellings,
        # and what's been added to it" (why dual licenses and the added GPL-2.0 /
        # Apache-2.0-WITH-LLVM-exception names land here).
        examples: [Apache-2.0, MIT, BSD-3-Clause, BSD-2-Clause, GPL-2.0, GPL-3.0, AGPL-3.0,
          LGPL-3.0, MPL-2.0, GPL-3.0-or-later, GPLv3, LGPL-3.0/GPL-3.0, Apache-2.0/MIT,
          PostgreSQL, Apache-2.0-WITH-LLVM-exception]
      permissive_non_osi:
        definition: >-
          Not OSI-approved, but imposes no restriction on WHO may use the software or AT
          WHAT SCALE. Attribution and naming requirements belong here.
        # Ruling: docs/reference/openness.md, "`permissive_non_osi`: attribution-only
        # licenses, and the artifact they have to attach to" (CC-BY-4.0 on
        # model-context-protocol, the docs-license-vs-product-license rule, and
        # Crawl4AI-Attribution-License).
        examples: [CC-BY-4.0, Crawl4AI-Attribution-License]
      competition_restricted:
        definition: >-
          Source is published and readable, but the license forbids or charges for a class
          of use - competing hosted services, for-profit production above a threshold, or
          use before a delayed conversion date. The reader can audit the code and still
          not be free to run it, which is why this sits below the OSI tiers rather than
          beside them. Delayed-conversion licenses are scored on their terms TODAY.
        # Ruling: docs/reference/openness.md, "`competition_restricted`: the vendor licenses
        # that land here, and why" (n8n, Modular, Dify, Open WebUI, LobeHub, PolyForm,
        # MinerU, AI-Pubs-Open-RAIL-M, and NXAI).
        # FSL-1.1-ALv2 (Functional Source License): FCL's sibling, converting to Apache later.
        examples: [BSL-1.1, SSPL-1.0, FCL-1.0-ALv2, FSL-1.1-ALv2, Elastic-License-2.0, Elastic License 2.0,
          Sustainable-Use-License, n8n-Enterprise-License, Modular-Community-License, Dify-Open-Source-License,
          Open-WebUI-License, LobeHub-Community-License, PolyForm-Shield, MinerU-Open-Source-License,
          AI-Pubs-Open-RAIL-M-Modified, NXAI-Community-License]
      proprietary:
        definition: No license to the source, because the source is not published.
        # `commercial` is how the closed observability vendors record it.
        examples: [Proprietary, commercial, proprietary]

  # Ordered, first match wins. There is deliberately NO `otherwise`: a product whose
  # recorded evidence does not reach a rule is abstained on by check_rubric and reported,
  # rather than being scored at whatever the last rung happened to be.
  formula:
  - when: {source: closed}
    then: {score: 1, class: closed}
    because: No self-hostable implementation, so nothing about the license can help.
  - when: {source: partial}
    then: {score: 2, class: source_available}
    because: >-
      A repo without the runtime. Readable, not runnable - `webcontainers` publishes
      webcontainer-core but not the proprietary StackBlitz engine.
  - when: {license_tier: competition_restricted, source: public}
    then: {score: 2, class: source_available}
    because: >-
      Full source, but a license that forbids a class of use. Scored beside partial
      source because the practical outcome matches: you can read it and not run it freely.
  - when: {license_tier: osi, source: public, core_gated: gated}
    then: {score: 4, class: open_core}
    because: >-
      An OSI core with functionality withheld for a paid tier. Not 5, because the
      published source is not the whole product; not 3, because what ships is genuinely
      open and self-hostable.
  - when: {license_tier: osi, source: public, core_gated: ungated}
    then: {score: 5, class: open_source}
    because: >-
      The published source is the whole product. A managed offering alongside it does not
      change that.
  - when: {license_tier: permissive_non_osi, source: public, core_gated: ungated}
    then: {score: 3, class: source_available}
    because: >-
      Attribution is all the license asks, so the published source is the whole product and
      is freely runnable - but it is not OSI-approved, and no non-OSI license reaches the
      open bucket under either the Model Openness Framework or OSAID. Above
      competition_restricted because nothing here caps who may use the software or at what
      scale, which is the line between those two tiers stated directly.
  # Ruling: docs/reference/openness.md, "How the buckets relate to MOF and OSAID" (why
  # `permissive_non_osi` has exactly one rung, emitting 3/source_available, and the dead-rule
  # history of the two rungs this tier used to wrongly emit).

# Adoption bands: which monthly figure maps to which level, for this product type. See
# docs/reference/adoption.md, "The bands", for the mapping's rationale.
adoption:
  reach_is_monthly: true
  unit: package downloads in the trailing 30 days, summed across declared artifacts
  bands:
  - {level: 5, above: 10000000, reach: '>10M'}
  - {level: 4, above: 1000000, reach: 1M-10M}
  - {level: 3, above: 100000, reach: 100K-1M}
  - {level: 2, above: 10000, reach: 10K-100K}
  - {level: 1, above: -1, reach: <10K}
