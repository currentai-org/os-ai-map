# Shared openness ladder for FINE-TUNED / GUARDRAIL model categories.
#
# Inherited via `scoring_recipe: {extends: model}`. See build/rubrics.py for the merge
# rules and why the ladder is shared rather than copied per category.
#
# Three dimensions carry a tune's openness question: weights, post-training data, code.
# That is deliberately not base_pretrained's questionnaire — a base model asks about the
# pretraining corpus and (optionally) checkpoints, which is a different set of facts about
# a different artifact. base_pretrained does not extend this ladder for exactly that
# reason: the merge rule replaces a whole key rather than merging into it, so sharing only
# the license tiers and not the dimensions would buy nothing — the category would still
# have to restate its own `dimensions` and `formula` in full.
#
# As of this extraction, `finetuned_chat` and `safeguards` (its guardrail-model half)
# extend this ladder.
openness:
  dimensions:
    weights:
      question: Are the tuned model weights downloadable and runnable locally?
      values: [open, closed, pending]
      evidence:
      - Hugging Face model repo with downloadable weight files (safetensors/GGUF)
      - vendor download page for weights outside the Hub
      machine_signal: signal_huggingface.hub_state (gated, private, files)
    data:
      question: Is the POST-TRAINING data released - the SFT, DPO or RL sets this
        tune was built from?
      # For a base model the data question is the pretraining corpus. For a tune,
      # that corpus belongs to somebody else's model, and asking about it scores
      # the base rather than the product. The honest question here is what the
      # tuner released, which is why `post-training-data` is read first.
      reads: [post-training-data, data]
      values: [open, described_not_released, described, partial, closed]
      evidence:
      - a released SFT/DPO/RL mixture, or scripts that reconstruct it
      - '`described` where the mixture is named in the card but not published'
      - naming the datasets used is NOT sufficient for `open`
      machine_signal: none - requires research
      vocabulary_note: >
        `described_not_released` here is `documented-not-released` in
        base_pretrained. Same concept, two spellings, and neither category should
        be the one that unilaterally renames it. Unifying the shared data
        vocabulary is issue #106.
    code:
      question: Is the fine-tuning pipeline released, not just inference code?
      # `recipe` is how two products spell this, and it is the more natural word for a
      # post-training pipeline. `code` stays first: `tulu` records both, and where a product
      # answers under either key the more widely used one wins. Found by check_recipe --
      # `ornith` recorded only `recipe:closed`, so the ladder read `code` as unrecorded and
      # reproduced its 3/open_weights through the `otherwise` rather than through the
      # evidence. Same score, and now for the right reason.
      reads: [code, recipe]
      values: [open, partial, closed]
      evidence:
      - '`open`: the post-training recipe - SFT/DPO/RL configs and scripts'
      - '`partial`: inference, serving or chat-template code only'
      - '`closed`: no code'
      machine_signal: partial - repo presence from signal_github.repo_state

  license_tier:
    # base_pretrained's ladder, unchanged, including the declaration order that
    # `tier_rank` and the multi-SKU rule depend on. Eight licenses added because
    # this category ships them and the pilot did not.
    ordered_by: restrictiveness_ascending
    # A tune records its license under `license`, except where the card
    # distinguishes a code license from the one attached to the weights, and then
    # it lands in `model-license`. The weights license governs either way.
    reads: [license, model-license]
    values:
      osi:
        definition: OSI-approved license
        examples: [Apache-2.0, MIT, BSD-3-Clause]
      permissive_non_osi:
        definition: >
          Not OSI-approved, but imposes no restriction on WHO may use the artifact or
          AT WHAT SCALE. Attribution, naming and CONDUCT requirements belong here: an
          acceptable-use policy forbidding military, illegal or discriminatory use caps
          neither commerce nor reach, so it sits beside attribution rather than beside a
          monthly-active-user ceiling. Non-OSI by construction, since the OSD forbids
          discriminating against a field of endeavor. Settled in issue #117, which was
          opened because the same OpenRAIL family had been scored 3 in one category and
          4 in another.
        # `zentropi-openrail-m` is a vendor-prefixed OpenRAIL-M, so #117 governs it exactly
        # as it governs BigCode-OpenRAIL-M. Note the product's own components string calls
        # it "use-restricted", which is looser language than the tier names use: an
        # acceptable-use policy is not a use CAP, and #117 was opened precisely because that
        # conflation had scored one OpenRAIL family two different ways.
        # `Cohere-Acceptable-Use-Policy` is an acceptable-use policy and nothing else, which
        # is the case #117 settled: it forbids classes of conduct without capping who may
        # use the weights or at what scale. It rides alongside CC-BY-NC on `command-r`, and
        # the compound resolves on the more restrictive half regardless, so its tier decides
        # nothing there - it is declared so the compound resolves at all.
        examples: [Modified-MIT, minimax-community, NVIDIA-Open-Model-License, BigCode-OpenRAIL-M,
          zentropi-openrail-m, DeepSeek-Model-License, TII-Falcon-License-2.0,
          Cohere-Acceptable-Use-Policy]
      use_bounded:
        definition: >
          Commercial use is permitted, but bounded - a monthly-active-user ceiling, an annual
          revenue ceiling, or an acceptable-use policy. The overwhelming majority of users
          are inside the bound and may use the artifact commercially without asking.

          This tier was `use_restricted` and capped at 2 until the universal license scale
          landed. It sits at 3 because the test at this boundary is whether commercial use is
          available AT ALL: Meta's 700M-MAU clause and AI21's $50M-revenue clause bind almost
          nobody, and lumping them with a licence that forbids commerce outright discarded
          the distinction the map exists to draw. Renamed with the cap change so that a stale
          reference to `use_restricted` fails loudly rather than resolving to a tier whose
          meaning moved underneath it.
        # `InternLM-Free-Commercial-License` is the bound written as a process rather than a
        # number: commercial use costs nothing and is granted on an application form. Still
        # a bound, because permission is asked for rather than given, and still well inside
        # this tier's test - commerce is available, to practically everyone who asks.
        examples: [Llama-2-Community-License, Llama-3-Community-License, Llama-3.1-Community-License,
          Llama-3.2-Community-License, Llama-4-Community, Gemma-License, GLM-4-License,
          Qwen-License-Agreement, Jamba-Open-Model-License, InternLM-Free-Commercial-License]
      commercial_forbidden:
        definition: >
          Weights are published and commercial use is prohibited, or reserved to the vendor.
          Non-commercial, research-only and non-production terms live here.

          The split from `use_bounded` is the one question this scale asks at the 3/2
          boundary: does the licence permit commercial use at all? CC-BY-NC and Mistral's
          Non-Production Licence say no, so they sit below a MAU ceiling rather than beside
          it. It is also the same line the Model Openness Framework draws at the bottom of
          its qualifying range - MOF Class III requires components usable "including for
          commercial and educational purposes".
        examples: [CC-BY-NC, Mistral-AI-Non-Production-License, Mistral-Research-License]
      proprietary:
        definition: No public license; weights not distributed.
    multi_sku_rule: >
      As base_pretrained: where a family ships SKUs under different licenses, the
      most restrictive license among the SKUs WHOSE WEIGHTS ARE ACTUALLY
      DISTRIBUTED governs, and API-only tiers are excluded.
    inherits_from_base: >
      A tune of a restrictively licensed base carries that restriction, because
      the license travels with the weights. hermes-4-llama-3-1-405b is
      use_bounded on account of Meta's terms, not anything Nous did. This needs
      no rule of its own - the tune records the license it actually ships under,
      and the ladder does the rest.

      What the ladder deliberately does NOT do is credit the tuner's open method
      here. A fine-tuning approach generalizes across bases - AI2's Tulu recipe
      runs on Llama and on OLMo - so scoring the checkpoint would either bury the
      open method or overstate the artifact. The map already resolves this by
      scoring the method's artifacts as their own products:
      tulu-3-sft-mixture is 5/open in training_synthetic_datasets while the
      Llama-based tulu-3 checkpoint is 2/restricted. That pair is the signal.
      Recording the checkpoint -> base link so the two can be joined is not yet
      done; `lineage` exists but is dataset-only and free-text.
    normalization:
    - 'compound `code X + model Y`: the MODEL license governs'
    - 'prefix `assumed-`: same tier, confidence drops to medium'
    never_use:
      mixed: Apply multi_sku_rule and store the resolved tier instead.
      unknown: Research it or defer the product with a reason.

  # Ordered rules, first match wins. base_pretrained's ladder less one rule: it
  # carries a `data: documented-not-released, code: open -> 4`, and no product here
  # pairs a described-but-unreleased mixture with an open pipeline. Declaring it
  # anyway would add a rule that cannot fire, and a dead rule in a first-match-wins
  # formula is a place for a later edit to hide.
  formula:
  - when: {weights: closed}
    then: {score: 1, class: closed}
    because: >-
      No downloadable weights, so there is no artifact for the license or the recipe to be
      open about. Checked first, ahead of every license rung, because an OSI license on a
      model nobody can run is not worth a point.
  - when: {license_tier: proprietary}
    then: {score: 1, class: closed}
    because: >-
      No public license means no permission to rely on, whatever else was published. Scored
      beside closed weights rather than above them.
  - when: {license_tier: commercial_forbidden}
    then: {score: 2, class: restricted}
    because: >-
      Open weights you may not use commercially. Downloadable is not the same as usable, and
      this rung sits ahead of the data and code rungs on purpose: a full open recipe does not
      buy back the right to use the result.
  - when: {license_tier: use_bounded}
    then: {score: 3, class: open_weights}
    because: >-
      A commercial cap almost nobody meets. Level with the open-weights centre of gravity
      rather than below it, because for practically every user the artifact behaves like open
      weights with a closed recipe - which is what 3 means. Still short of 4, because the
      bound is real and the licence is not OSI.
  - when: {data: open, code: open, license_tier: osi}
    then: {score: 5, class: open_source}
    because: >-
      The whole tune is reproducible and the license permits it - post-training mixture, the
      pipeline that consumed it, and an OSI license over the weights.
  - when: {data: open, code: open}
    then: {score: 4, class: open_weights}
    because: >-
      Full recipe but a non-OSI license caps the score at 4. The Model Openness Framework
      would call this source-available rather than open, so it must not reach the `open`
      bucket; see docs/guides/openness-spectrum.md.
  - otherwise: {score: 3, class: open_weights}
    because: >-
      The category's center of gravity - open weights, closed recipe. A fallthrough rather
      than a rule because it is what remains once the cases above are spent, and it lands in
      the open-ish bucket so unrecorded evidence never counts as open.

# Adoption bands: which monthly figure maps to which level, for this product type.
#
# Declared here rather than in the warehouse because they were hardcoded in
# currentai.signal_pypi.package_downloads and nowhere else - the same repo/warehouse
# split that check_parity exists to catch, one axis over. The scoring SQL now reads
# registry.adoption_bands, which build/serialize_registry.py emits from this block.
#
# The scale is a property of the product TYPE, which is what the rubrics are already
# keyed on, so this is four declarations rather than sixteen.
#
# `above` is the exclusive lower bound, so the bands read the way the SQL does: the
# highest level whose `above` the figure exceeds wins. `reach` is the label a score
# records, and it carries the UNIT the band was read in - stars and downloads are not
# the same reach at the same magnitude.
#
# The floor band is -1 rather than 0 so that a figure of exactly ZERO still bands at 1.
# With 0 it did not: `0 > 0` is false, the product matched no band, and it came back
# unbanded - which asserts "no scale exists for this type" when the truth is "nobody
# downloaded it". zentropi-cope surfaced it on the first real run.
#
# Derived 2026-08-09 from the 75 model products recording both a level and a reach, and
# identical to software's. That is the finding rather than an assumption: Hugging Face
# model downloads and PyPI package downloads sit at the same order of magnitude across
# this corpus (model median 41,344 over 101 artifacts), so one scale serves both.
#
# base_pretrained declared exactly these bands inline before this file existed. Its
# category-level block is the only other place they appeared, and it is now the
# exception rather than the convention.
adoption:
  reach_is_monthly: true
  unit: Hugging Face downloads in the trailing 30 days, summed across the family's SKUs
  bands:
  - {level: 5, above: 10000000, reach: '>10M'}
  - {level: 4, above: 1000000, reach: 1M-10M}
  - {level: 3, above: 100000, reach: 100K-1M}
  - {level: 2, above: 10000, reach: 10K-100K}
  - {level: 1, above: -1, reach: <10K}
