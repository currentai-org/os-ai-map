# Shared openness ladder for FROM-SCRATCH PRETRAINED MODEL categories, inherited via
# `scoring_recipe: {extends: pretrained}`. `model.yaml` is the tune's counterpart; the two
# ask different questions because a base model's own corpus is the product, a tune's is not.
# See build/rubrics.py for the merge rules and docs/reference/openness.md for the dimensions.
#
# `adoption`, `capability` and `confidence_rule` do NOT come along with `extends`: each is
# instrument-specific per category (e.g. summed HF downloads, the Artificial Analysis index).
openness:
  dimensions:
    weights:
      question: Are the trained model weights downloadable and runnable locally?
      values: [open, closed, pending]
      evidence:
      - Hugging Face model repo with downloadable weight files (safetensors/GGUF)
      - vendor download page or torrent for weights outside the Hub
      - '`pending` only where a release is announced with a date but not yet shipped'
      machine_signal: signal_huggingface.artifact_state (gated, private, files)
    data:
      question: >-
        Is the pretraining corpus released, or reconstructible from released scripts, under
        terms that permit open reuse?
      # Ruling: docs/reference/openness.md, "`components-listed`: naming every component is
      # not releasing the corpus" (issue #106). RWKV is the case it was written for.
      # `released-restricted` (R-2026-11-13-b): docs/reference/openness.md, "A released corpus
      # is open only if its own terms permit open reuse".
      values: [open, released-restricted, components-listed, documented-not-released, closed]
      evidence:
      - '`open`: a released dataset, or scripts that reconstruct the corpus end to end, AND
        the corpus''s own terms permit open reuse, commercial use included. Download
        availability alone is not enough; `license_tier` is the weights license and does not
        answer this'
      - '`released-restricted` where the corpus is released or reconstructible but its own
        terms bar open reuse, e.g. a corpus licensed non-commercial as a whole (CC-BY-NC-SA-4.0)'
      - 'a declared openly licensed compilation whose constituents keep mixed terms stays
        `open` only after the record discloses the restricted constituents and assesses
        whether they materially affect lawful reuse of the corpus, weighing the legal
        restriction itself, whether the affected data can be identified and excluded, and how
        much of the corpus it covers, not the share alone. An uncertain or minor constituent
        does not downgrade it automatically; see docs/reference/openness.md'
      - 'a corpus that is wholly or mostly web crawl is `open` when its release, or the named
        crawl whose documented terms it binds the reuser to, documents four things: terms that
        allow redistribution and commercial use with no binding commercial or field-of-use bar;
        the crawl it came from and its processing; that the pages keep their own rights; and how
        publisher opt-outs were honored during the collection that produced the scored corpus.
        Opt-out handling is a documentation element, not proof of lawful reuse. A removal route is
        recorded and affects confidence only. Crawl terms of use can document page rights but are
        not by themselves an open license over the crawled documents. A binding bar makes it
        `released-restricted`; a missing element holds the dimension, and a corpus that cannot in
        practice be reconstructed is assessed as `components-listed` or
        `documented-not-released` (R-2026-11-13-d; docs/reference/openness.md)'
      - '`components-listed` where the release publishes a LISTING of the corpus, one
        entry per component and each entry individually resolvable, while the mixture or
        the sampling is not published, so the corpus cannot be rebuilt. Prose naming the
        archives a model trained on is `documented-not-released` however accurate, and
        however few or many it names; see docs/reference/openness.md'
      - '`documented-not-released` where composition is fully described but no
        data or scripts ship'
      - a data card describing sources is NOT sufficient for `open`
      machine_signal: none — requires research
    code:
      question: Is the training pipeline released, not just inference code?
      values: [open, partial, closed]
      evidence:
      - '`open`: full pretraining pipeline (data prep, training recipe, configs)'
      - '`partial`: inference or fine-tuning code only, which is the common case'
      - '`closed`: no code, or evaluation harness only'
      machine_signal: partial — repo presence from signal_github.artifact_state
    checkpoints:
      question: Are intermediate training checkpoints published?
      values: [open, not-released]
      optional: true
      note: Scored for only 6 of 47. Absence is not evidence of `not-released`.
      evidence:
      - intermediate checkpoints on HF branches or a public mirror
      machine_signal: none — requires research

  # The discriminator between restricted and open_weights: whether the license restricts
  # USE, not whether OSI approved it. See docs/reference/openness.md, "The license scale".
  # Non-software license families added to the tiers below (Creative Commons, vendor AUPs,
  # OpenMDW, etc.) are argued in docs/reference/openness.md, "Creative Commons, vendor terms
  # and other tier extensions".
  license_tier:
    # Declaration order IS restrictiveness order (least restrictive first), emitted as
    # `tier_rank` by build/serialize_rubric.py rather than inferred from the YAML.
    ordered_by: restrictiveness_ascending
    values:
      osi:
        definition: OSI-approved license
        examples: [Apache-2.0, MIT, BSD-3-Clause]
      permissive_non_osi:
        definition: >
          Not OSI-approved, but imposes no restriction on WHO may use the artifact or
          AT WHAT SCALE. Attribution, naming and CONDUCT requirements belong here: an
          acceptable-use policy forbidding military, illegal or discriminatory use caps
          neither commerce nor reach, so it sits beside attribution rather than beside a
          monthly-active-user ceiling. Non-OSI by construction, since the OSD forbids
          discriminating against a field of endeavor. Settled in issue #117, which was
          opened because the same OpenRAIL family had been scored 3 in one category and
          4 in another.
        # CC-BY-4.0, CC-BY-SA-4.0, FAIR-Chemistry-License-v1 and OpenMDW-1.1 all land here on
        # the same test — no cap on who may use the artifact or at what scale. Ruling and
        # per-license reasoning: docs/reference/openness.md, "Creative Commons, vendor terms
        # and other tier extensions".
        # DINOv3-License and SAM-License (dino, segment-anything), ruled on #753: one Meta text,
        # conduct limits only.
        # Thinking-Machines-Model-AUP (inkling, OSO-6218): the Model AUP binds anyone who downloads
        # the Apache-2.0 weights and restricts conduct only, with no user, revenue or commercial
        # ceiling; the #117 rule and the compound-license rule put the pair here.
        # R-2026-11-12-f (#1018): Sapiens2-License (sapiens) bars surveillance, biometric processing
        # and re-identification, with no commercial, user or revenue cap: conduct, per #117.
        # Stable-AI-License-1.0 (limix's code) is Apache-2.0 with added attribution and
        # model-naming terms: attribution, per #117.
        examples: [DeepSeek-Model-License, TII-Falcon-License-2.0, minimax-community, NVIDIA-Open-Model-License, CDLA-Permissive-2.0,
          CC-BY-4.0, CC-BY-SA-4.0, FAIR-Chemistry-License-v1, OpenMDW-1.1,
          CreativeML-OpenRAIL++-M, Open-RAIL-M, NVIDIA-Open-Model-Agreement, Prior-Labs-License-1.1,
          DINOv3-License, SAM-License, Thinking-Machines-Model-AUP, Sapiens2-License,
          Stable-AI-License-1.0]
      use_bounded:
        definition: >
          Commercial use is permitted, but bounded — a monthly-active-user ceiling, an
          annual revenue ceiling, or a requirement to ask before using the model
          commercially. Almost every user is inside the bound and may use the model
          commercially without asking. Was `use_restricted` and capped at 2 before the
          universal license scale; see sources/rubrics/model.yaml for why the cap moved and
          why the tier was renamed alongside it. A revenue- or usage-bound community license
          sits here whatever the threshold, and a territorial exclusion caps a license here:
          it still permits commercial use inside the territories it grants.
        # An acceptable-use policy alone belongs in `permissive_non_osi`, not here — the #117
        # ruling in docs/reference/openness.md, "Two places the map deliberately departs from
        # MOF".
        # InternLM-Free-Commercial-License: the bound written as a process (free, granted on
        # application) rather than a number.
        # Llama-3.2-Community-License is spelled in full because sources/signal_routing.yaml's
        # alias resolves the short form to this name, and a tier example is matched after
        # normalization.
        # The #739 names match sources/rubrics/model.yaml, where each is explained.
        # Qwen-Community-License-1.0 and Qwen3.8-Max-License (Qwen 3.8, 2026-10-03): the same
        # shape as the Moondream ruling on #739; see sources/rubrics/model.yaml.
        # GLM-5.3-License (glm, R-2026-10-08-z): a revenue bound on model-as-a-service
        # operators; docs/reference/openness.md, "Creative Commons, vendor terms and other tier
        # extensions".
        # Kimi-K3-License (kimi, OSO-6218): the same shape as GLM-5.3-License, a separate
        # agreement for model-as-a-service operators above USD 20M revenue in any 12 months; its
        # display-"Kimi K3" clause above 100M MAU is attribution and does not set the tier.
        # Mistral-Modified-MIT (R-2026-10-12-c): a USD 20M monthly-revenue ceiling; see
        # sources/rubrics/model.yaml.
        # R-2026-11-12-f (#1018): CogVideoX-License (cogvideo; commercial use free after
        # registration up to one million visits a month), bilibili-Model-Use-License (indextts; a
        # separate license above 100M MAU or RMB 1B revenue) and Fish-Audio-Community-License-1.0
        # (fish-speech; commercial use below USD 500K annual revenue, and a hosted text-to-speech or
        # voice-cloning service always needs a separate license). Each permits commercial use under
        # a size or revenue bound. Fish Audio's hosted-service exclusion is recorded on the product,
        # not hidden in the tier.
        # ERNIE-5.5-Flash-Base-Model-License-1.0 (ernie-flash, R-2026-11-12-m): commercial use free
        # up to USD 50M related annual revenue after a one-time notice, written authorization above
        # it, and the EU, the UK and South Korea excluded, the Tencent Hunyuan shape.
        examples: [Llama-3.1-Community-License, Llama-3.2-Community-License, Llama-4-Community, Gemma-License, GLM-4-License, Qwen-License-Agreement,
          InternLM-Free-Commercial-License, Stability-AI-Community-License, LTX-2.x-Community-License,
          LTX-2-Community-License, LTXV-Open-Weights-License-0.X, MiniMax-H3-Community-License,
          LFM-Open-License-1.0, Tencent-Hunyuan-Community-License,
          Tencent-Hunyuan-3D-Community-License, Moondream-Model-License-1.0,
          Qwen-Community-License-1.0, Qwen3.8-Max-License, GLM-5.3-License, Kimi-K3-License, Mistral-Modified-MIT,
          CogVideoX-License, bilibili-Model-Use-License, Fish-Audio-Community-License-1.0,
          ERNIE-5.5-Flash-Base-Model-License-1.0]
      commercial_forbidden:
        definition: >
          Weights are published and commercial use is prohibited, or reserved to the vendor.
          The 3/2 boundary asks one question: does the licence permit commercial use at all?
        # ASL: the restrictive half of a compound (docs/reference/openness.md, "A compound
        # license resolves on all of its parts").
        # CC-BY-NC-4.0 is the versioned spelling of CC-BY-NC already listed here; same test.
        # R-2026-11-12-f (#1018): NVIDIA-Source-Code-License (segformer; research or evaluation use
        # only), NVIDIA-License (eagle; Eagle 2.5's nsclv1 text, non-commercial research previews),
        # Apple-AMLR (depth-pro, fastvlm; excludes commercial products, services and product
        # development), TabFM-Non-Commercial-License-v1.0 (tabfm; non-commercial, non-production)
        # and StableAI-LimiX-Non-Commercial-License-1.0 (limix; commercial use needs separate
        # permission). Each prohibits commercial use outright.
        examples: [Mistral-Research-License, Mistral-AI-Non-Production-License, CC-BY-NC, CC-BY-NC-SA-4.0, AlphaGenome-Model-Terms,
          ASL, AlphaFold-3-Model-Parameters-Terms-of-Use, CC-BY-NC-4.0, NVIDIA-OneWay-Noncommercial,
          TABPFN-3-License-v1.0, TABPFN-3.5-License-v1.0, TABPFN-2.6-License-v1.0,
          TABPFN-2.5-License-v1.1, FLUX-Non-Commercial-License-2.1,
          FLUX-dev-Non-Commercial-License-2.0, FLUX.1-dev-Non-Commercial-License,
          Qwen-Research-License, PML-1.0, InsightFace-Non-Commercial-Research,
          NVIDIA-Source-Code-License, NVIDIA-License, Apple-AMLR, TabFM-Non-Commercial-License-v1.0,
          StableAI-LimiX-Non-Commercial-License-1.0]
      unstated:
        definition: >
          Weights are published with no license declared anywhere the publisher could declare
          one. Not open, since there is no grant to rely on, and not closed, since the weights
          are out. Capped at 2; see sources/rubrics/model.yaml.
        examples: [none-declared]
      proprietary:
        definition: No public license; weights not distributed.
    multi_sku_rule: >
      Within the governing release, where a family ships SKUs under different
      licenses, the most restrictive license among the SKUs WHOSE WEIGHTS ARE
      ACTUALLY DISTRIBUTED governs. A superseded release's checkpoints never
      lower the score (docs/reference/identity.md).
      API-only and hosted-only tiers are excluded: they are a different product
      surface, and this axis scores the artifact you can download. That
      distinction is what separates the two families previously both recorded
      as `mixed` — Qwen 2.5 distributes 3B/72B under the Qwen License, which
      caps the family at use_bounded, while Qwen 3's restrictive Plus/Max
      tiers are never distributed at all, leaving the distributed set Apache.
      Per-SKU licenses come from signal_huggingface.artifact_state, so this is
      derivable rather than judged.
    normalization:
    - 'compound `code X + model Y`: the MODEL license governs, since it is the
      one attached to the weights'
    - 'prefix `assumed-`: same tier as the license named, but confidence drops
      to medium until the release confirms it'
    never_use:
      mixed: >
        Records that SKUs differ without recording the outcome, so the score
        cannot be reproduced from the evidence. Apply multi_sku_rule and store
        the resolved tier instead.
      unknown: Research it or leave the product unscored.

  # Ordered rules, first match wins.
  formula:
  - when: {weights: closed}
    then: {score: 1, class: closed}
    because: >-
      No downloadable weights, so there is no artifact for the license or the corpus to be
      open about. Checked ahead of every license rung: an OSI license on a model nobody can
      run is not worth a point.
  - when: {license_tier: proprietary}
    then: {score: 1, class: closed}
    because: >-
      No public license means no permission to rely on, whatever else was published.
  - when: {license_tier: commercial_forbidden}
    then: {score: 2, class: restricted}
    because: >-
      Open weights you may not use commercially. Downloadable is not the same as usable, and
      this rung sits ahead of the data and code rungs deliberately: publishing the
      pretraining corpus does not buy back the right to use the model.
  - when: {license_tier: unstated}
    then: {score: 2, class: restricted}
    because: >-
      Weights published with no license declared. Nothing permits using them, so they score
      with the weights you may not use commercially, above the 1 that closed weights get.
  - when: {license_tier: use_bounded}
    then: {score: 3, class: open_weights}
    because: >-
      A commercial cap almost nobody meets. Level with the open-weights centre of gravity
      rather than below it: for practically every user the model behaves like open weights
      with a closed corpus. Short of 4, because the bound is real and the licence is not OSI.
  - when: {data: open, code: open, license_tier: osi}
    then: {score: 5, class: open_source}
    because: >-
      The pretraining corpus, the code that consumed it, and an OSI license over the
      weights. Pythia and the OLMo family are what this rung was written for.
  - when: {data: open, code: open}
    then: {score: 4, class: open_weights}
    because: >-
      Full pipeline but a non-OSI license caps the score at 4. MOF would call this
      source-available rather than open, so it must not reach the `open` bucket; see
      docs/reference/openness.md.
  - when: {data: released-restricted, code: open}
    then: {score: 4, class: open_weights}
    because: >-
      The corpus and the code that consumed it are both published, but the corpus's own terms
      bar open reuse, so a reader can inspect and rebuild the run without being free to reuse
      the data. Level with a full release under a non-OSI weights license: either way the
      pipeline is all there and one part's terms keep it out of the `open` bucket.
      R-2026-11-13-b; Lucie-7B is the case it was written for.
  - when: {data: components-listed, code: open}
    then: {score: 4, class: open_weights}
    because: >-
      Every component named and publicly resolvable, and the code to rebuild against them,
      but no assembled corpus and no sampling. Level with the rung below on purpose: the two
      differ in how the corpus is disclosed, not in what a reader can do with it, and paying
      for a list would reward publishing one and shipping nothing. Declared as its own rung
      rather than folded into the next so the difference stays visible to `check_rubric`.
  - when: {data: documented-not-released, code: open}
    then: {score: 4, class: open_weights}
    because: >-
      A corpus described in enough detail to audit the mixture, and the code to rebuild
      against it, but the corpus itself withheld. Level with a non-OSI full release rather
      than below it, because a reader can check the claims either way. `finetuned_chat`
      deliberately omits this rung - no tune there pairs a described mixture with an open
      pipeline, and a rule that cannot fire is a place for a later edit to hide.
  - otherwise: {score: 3, class: open_weights}
    because: >-
      The category's center of gravity - open weights, closed data. A fallthrough rather
      than a rule because it is what remains once the cases above are spent, and it lands
      in the open-ish bucket so unrecorded evidence never counts as open.
