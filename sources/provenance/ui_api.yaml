# Provenance decisions for the ui_api category, and how each was resolved.
#
# `build/prose_provenance.py` classifies every product's dated verification line. This file is
# the record of what a reader decided about each unresolved one. 40 of the 42 are `canonical`;
# `character-ai` and `doubao` are not, and are not counted as compliant.
#
# ## Three passes, and what each got wrong
#
# **First pass: 35 `derive`.** Reviewed against truncated fields. `product-copy.md` makes the
# verification line provenance for BOTH prose fields, so a document establishing what a product
# IS does not settle a description that also carries an adoption figure or a funding round.
# Every `reason` below is from that reversal, kept because it names the blocker in that record.
#
# **Second pass: rewrite the prose instead of hunting for evidence to match it.** That is the
# right order and it holds. But it removed only counts, versions, funding and rationale, and
# left the openness VERDICTS in - `closed counterpart`, `no source release`, `proprietary`,
# `source-available`, `not self-hostable`. Those are axis content under the guide's own rules.
# They are out now; what replaces them is architecture, which is description content.
#
# **Third pass: seven holds that were all wrong.** Every one was written from a product's own
# stale `comments` rather than from its score note. The score files already carried the
# re-derivation:
#
#   le-chat        openness + capability re-read 2026-08-14 against Mistral primaries
#   openrouter     adoption RE-BANDED 4 -> 5 on 2026-08-14 against the current tiles
#   poe            adoption "RESOLVED 2026-08-14", re-banded 5 -> 4 on the sourceable figure
#   surfsense      openness fully re-derived 5/open_source -> 2/source_available
#   character-ai   note: 45M "is still an active count ... the level is unchanged at 5"
#   microsoft-copilot  note: 218M, "the level is unchanged at 5"
#   perplexity     note: 45M, "the level is unchanged at 5"
#
# All seven holds are withdrawn and every `last_verified` restored. THE RULE, WRITTEN DOWN
# BECAUSE IT WAS BROKEN SEVEN TIMES IN ONE PASS: a product's prose saying an axis is unsettled
# is not evidence that it is. Read `note` and every source date in the score file before
# holding an axis. The three aggregator pages that restated their figures had their
# `sources[].shows` updated to what was actually read, which is what the stale prose was
# reporting.
#
# ## What is left unresolved, and why it is not called compliant
#
# `character-ai` and `doubao` rest on tertiary sources; `perplexity` describes a consumer
# product whose only reachable documentation covers the API. Global rule 3 requires a PRIMARY
# source for a factual claim, and the guide carries no exception for a vendor that publishes
# nothing readable. All three were fetched: character.ai answers 403, doubao.com and
# perplexity.ai serve client-rendered shells whose only text is the product name.
#
# Each carries a dated line naming no document, so the census reports them
# `ambiguous_noncanonical` rather than reading as finished. Adding a named-tertiary-source
# exception to `product-copy.md` is a separate decision this pass does not take.
#
# So: 40 of 43 compliant and canonical, 3 held for a primary read. All 43 are prose-clean.
#
# `perplexity` and `chatgpt` are both in this file's scope only through the prose pass;
# `perplexity` was already canonical before it and is now deliberately not.
#
- product: anythingllm
