# Swept 2026-08-30 from the warehouse discovery pool (currentai.scores.repos_summary, snapshot
# 2026-08-24), over the six subcategories that carry agent-facing tooling: AI Engineering / Give
# agent tools, Give agent knowledge and Protocols, and Infrastructure / Protocols, Make world
# agent-ready and Index & Search. Predeclared retrieval cutoff: the top 300 repositories by
# all-time stars across those six, which bottoms out at 4,621 stars. Every row below was verified
# against the GitHub API on 2026-08-30, and every declared package against its registry API on the
# same date. Counts, parked candidates and their reasons are in the sweep summary on the PR.
# Nothing here is scored, and a row here is a candidate, not a commitment to publish.
# Added 2026-09-16: the commercial connector layer. The roster before this was almost entirely
# reference servers and SDKs, which made the category look like an open-source-only space. It is
# not - the specifications and SDKs are open, and the products sold around them (hosted catalogues,
# managed OAuth, SLAs) are mostly closed or open-core. That was a coverage gap in this map rather
# than a fact about the market, and these rows close it.
#
# `smithery` and `arcade` share an org deliberately: Smithery is now part of Arcade, and the
# Smithery CLI repository redirects to arcadeai-labs. Whether they are one product or two is a
# promotion-time identity question, flagged rather than resolved here.
category: agent_tools_connectors
# 2026-09-17: ten rows promoted under the agent_tools_protocols split - the browser layer
# (puppeteer, selenium, steel-browser), the connector platforms (open-connector, klavis,
# aci-dev, zapier-mcp, pipedream) and two first-party server sets (aws-mcp-servers,
# desktop-commander-mcp). What remains is mostly single-target MCP servers, which the
# category can take in a later pass without changing its shape.
