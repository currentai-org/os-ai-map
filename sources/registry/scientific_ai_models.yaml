# Seeded 2026-09-10 from issue #533 after re-resolving every candidate to a live primary
# artifact. The original 35-row sweep double-counted GraphCast and WeatherNext; the canonical
# google-deepmind/weathernext repository now presents GraphCast and GenCast as models in the
# WeatherNext product line, so the registry carries one row. Repository license labels are not
# treated as weights licenses. Openness, adoption, capability, and boundary decisions belong to
# promotion, not this seed.
