# Weekly candidate batch swept 2026-09-06 over the six thinnest categories in the taxonomy by
# head-roster size. Sources: GitHub repository search (68 predeclared queries) plus, for
# edge_hardware, vendor product pages. Predeclared retrieval cutoff: GitHub repository search,
# sort=stars desc, star floor 150, pushed:>=2025-09-06, top 30 per query. That returned 591 unique
# candidates, more than a reviewer can take, so a tightened cutoff of 1,000 stars was declared before
# triage; everything below it is parked with that reason recorded, not dropped. Every row below carries
# identifiers only. The source URL and fetch date behind each accepted and parked candidate, and the five
# reconciled counts, are in docs/sweeps/2026-09-06-tail-batch.md. Nothing here is scored - a row is a
# candidate, not a commitment to publish.
