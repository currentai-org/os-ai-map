# Seeded 2026-09-16 from a targeted discovery pass run for #430's split, not a ranked sweep.
#
# Retrieval basis, disclosed rather than implied: an external model was asked for products meeting
# this category's boundary, explicitly including closed and commercial ones, and its return was then
# verified here. The bound is "named by that pass, dedups clean against head/registry/alias slugs,
# and resolves to a reachable artifact on 2026-09-16" - there is no star floor, because a star floor
# would have excluded the closed half of this category on principle rather than on merit.
#
# Every row was verified on 2026-09-16: GitHub repositories through the API (two redirects were
# followed and the canonical full_name recorded - smithery-ai/cli -> arcadeai-labs/smithery-cli and
# stripe/agent-toolkit -> stripe/ai), PyPI and npm through their registry APIs, and vendor homepages
# by HTTP status. One proposed candidate was dropped outright: `rednote-hilab/dots.ocr` does not
# exist, the project lives at `studio-dots-ai/dots.ocr`, and the row records the repository that is
# actually there.
#
# These rows carry NO scores. Promotion via add-product is where openness, adoption and capability
# are researched, and where the licence body of each is read rather than its repository label - the
# discovery pass flagged two products whose label misleads in opposite directions, and both are noted
# on their rows.
# Licence trap in this roster: `serpapi` and `linkup` both publish MIT-licensed client SDKs in
# front of a closed index. The SDK is not the product, and scoring either as MIT would repeat the
# measurement-population error that `langfuse` was corrected for. The rows declare the package
# because it is the addressable artifact; promotion must score the service.
category: search_retrieval
