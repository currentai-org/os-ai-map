# Swept 2026-09-07 (weekly tail batch). Category selected because the map reads it at maturity
# stage 3 with `adoption` and `openness` gaps.
#
# Sources: Hugging Face model API, seven ranked queries (text-generation by downloads, by likes and
# by trending score; all models by downloads and by trending score; `base` and `instruct` searches),
# top 100 each. Predeclared retrieval cutoff: 1,000,000 trailing-30-day downloads, executed
# 2026-09-07. Sub-floor rows were returned but not triaged individually; gpt-j and lfm2 are accepted
# below despite sitting under the floor, because the cutoff bounds retrieval and never rejects a
# product the sweep recognized.
#
# What this pass found is that the map's model rosters are organized as families, and the ranked
# Hugging Face queries are dominated by releases of families already on the map - 411 of the raw
# signals fold onto an existing family or head product under sources/model_families.yaml and the
# release-suffix rule in docs/reference/identity.md. What is genuinely missing is the encoder and
# early-decoder generation the map never recorded: BERT, RoBERTa, XLM-RoBERTa, T5, ELECTRA, DeBERTa,
# ModernBERT, DistilBERT, GPT-2, GPT-J and OPT, all of them still drawing tens of millions of
# downloads a month, plus three recent lines (OpenELM, PowerMoE, Liquid LFM2).
#
# Escalated rather than emitted: the ranked queries also surfaced large, heavily used populations the
# taxonomy has no category for - text embedding and reranking models (18 candidates), speech and
# audio models (13), vision and vision-language backbones (9), generative image/video models (5) and
# time-series forecasters (5). Every one is parked in the batch summary against a category-proposal
# issue. This is the largest coverage gap the sweep found and it is a governance question, not a
# data one.
#
# Counts, parked candidates with reasons, source URLs and fetch dates: docs/sweeps/2026-09-07-tail-batch.md.
