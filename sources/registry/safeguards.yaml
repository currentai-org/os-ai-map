# Swept 2026-09-07 (weekly tail batch). Category selected because the map reads it at maturity
# stage 3 with an `adoption` gap.
#
# Sources: GitHub repository search, eight queries (six topic-scoped: guardrails, llm-security,
# prompt-injection, red-teaming, ai-safety, content-moderation; two free-text) and three Hugging
# Face model searches (guard, safety, moderation), each sorted by downloads. Predeclared retrieval
# cutoff: GitHub top 30 per query, floor 1,000 stars and a push no older than 2025-09-07; Hugging
# Face top 100 per query, floor 5,000 trailing-30-day downloads. Executed 2026-09-07.
#
# Boundary applied: the category is tools that detect, filter or constrain unsafe model inputs,
# outputs or actions, plus AI red-teaming. Twelve general offensive-security and penetration-testing
# projects (sliver, dirsearch, afrog, BlackArch and the rest) were parked, as were LLM gateways
# (bifrost, llmgateway, semantic-router) and evaluation/observability platforms. Guard models that
# fold onto an existing head product (Llama Guard releases, Granite Guardian releases, NVIDIA's
# Nemotron content-safety line) are duplicates, not candidates.
#
# Counts, parked candidates with reasons, source URLs and fetch dates: docs/sweeps/2026-09-07-tail-batch.md.
