# Swept 2026-09-07 (weekly tail batch). Category selected because the map's own gap arithmetic puts
# it at maturity stage 2 with an `adoption` gap - the lowest stage in the taxonomy - so the roster is
# where new candidates are most likely to change the reading.
#
# Sources: GitHub repository search, 14 queries (six free-text, eight topic-scoped: synthetic-data,
# data-curation, deduplication, web-crawler+llm, data-quality+machine-learning). Predeclared
# retrieval cutoff: sort by stars, top 30 per query, floor 1,000 all-time stars and a push no older
# than 2025-09-07, executed 2026-09-07. Rows below that floor were returned but not triaged
# individually; the cutoff bounds retrieval only, and six sub-floor rows the sweep did recognize
# (data-prep-kit, semhash, deepfabric, magpie, datadreamer, bonito) are accepted below and flagged as
# such in the batch summary.
#
# Boundary applied: this category is tooling that builds training corpora. General-purpose file
# backup and block deduplication (restic, borg, kopia and eleven more), tabular and privacy
# synthetic-data generators (SDV, CTGAN, Synthea, mimesis), and label-quality tooling (cleanlab,
# splink, zingg) were parked with reasons rather than stretched to fit. Three image-side candidates
# (BlenderProc, fastdup, fiftyone) are parked on an unresolved text-versus-vision boundary that
# needs a ruling, not a sweep.
#
# Counts, every parked candidate with its reason, and the source URL and fetch date behind every
# candidate are in docs/sweeps/2026-09-07-tail-batch.md. Nothing here is scored.
