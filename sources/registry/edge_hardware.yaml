# Swept 2026-09-07 (weekly tail batch). Category selected because the map reads it at maturity
# stage 3 with `capability` and `openness` gaps, on the smallest roster in the taxonomy (20).
#
# Source note worth reading before the rows: GitHub search is the wrong instrument here. Six
# board-and-chip queries (topic:single-board-computer, topic:edge-ai, topic:npu,
# topic:risc-v+accelerator, topic:open-source-hardware+ai, and one free-text) returned 106 rows and
# not one board among them - every in-cutoff result was edge *software* (runtimes, NPU drivers,
# MLOps platforms), which belongs to other categories and is parked as such. The rows below come
# instead from a second source: 35 vendor product pages, each fetched and confirmed to return 200
# with the product's own title on 2026-09-07. Predeclared retrieval cutoff: the SBC and merchant
# edge-NPU vendors already represented on the roster plus the adjacent field (Radxa, Banana Pi,
# FriendlyElec, Milk-V, Pine64, Seeed, Sipeed, Luxonis, BeagleBoard, Khadas, BrainChip, SiMa.ai,
# Kinara, Blaize, DeepX, SOPHGO, Espressif, Renesas, Tenstorrent, NVIDIA, Hailo, Coral).
#
# Every row here carries `homepage` and nothing else. Per docs/workflows/discover-candidates.md that
# satisfies the schema but is the weakest evidence kind on offer: a homepage carries no adoption
# signal and no code to inspect, so treat these as lower-confidence candidates than any repo- or
# package-backed row. Five vendors (SiMa.ai, Kinara, Blaize, Orange Pi, Rockchip) resolved no
# product-level page on the paths tried; those fetches did not complete and are parked as such, not
# recorded as absences. hailo-8l is parked as a SKU of head product hailo-8, and Tenstorrent's
# Blackhole cards are parked because they are workstation and server accelerators and the taxonomy
# has no category for those.
#
# Counts, parked candidates with reasons, source URLs and fetch dates: docs/sweeps/2026-09-07-tail-batch.md.
