category: agent_authorization
# Seeded 2026-10-09 when the category was created (R-2026-10-09-a). The rows come from the
# agent-authorization sweep, docs/sweeps/2026-10-09-agent-authorization/ (#878), where every artifact
# identifier was read against its package registry, raw README or LICENSE, or standards page on
# 2026-10-09: the nineteen agent-built tools (group A), the two MCP authorization libraries (group B)
# and the three working-group standards (group D, R-2026-10-09-c). The eleven general-purpose
# identity and authorization systems in group C are adjacent and not seeded (R-2026-10-09-b); the
# category's comments name them. agent-governance-toolkit moved here from the safeguards registry
# under R-2026-10-09-e.
