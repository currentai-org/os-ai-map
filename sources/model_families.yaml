    note: "Ai2's fully-open Olmo line; releases append a generation number (olmo-3)."
  - pattern: "phi-*"
    product: phi
    decided_in: "#474"
    note: "Microsoft's Phi line; releases append a generation number (phi-4)."
  - pattern: "qwen-*"
    product: qwen
    decided_in: "#474"
    note: "Alibaba Cloud's Qwen line; releases append a generation-and-point number, sometimes a size suffix (qwen-2-5, qwen-3-7-max)."
  - pattern: "tulu-*"
    product: tulu
    decided_in: "#474"
    note: "Ai2's Tulu post-training recipe; releases append a generation number (tulu-3)."
  - pattern: "yi-*"
