version: 1
families:
  - pattern: "claude-fable-*"
    product: claude-fable
    decided_in: "#474"
    note: "Anthropic's Fable line; releases append a single version number (claude-fable-5)."
  - pattern: "claude-opus-*"
    product: claude-opus
    decided_in: "#474"
    note: "Anthropic's Opus tier; releases append a major-and-point pair, sometimes an -x suffix (claude-opus-4-7, claude-opus-4-x)."
  - pattern: "deepseek-*"
    product: deepseek
    decided_in: "#474"
    note: "DeepSeek's flagship line; releases append a vN-N or vN-base/-pro suffix (deepseek-v3-2, deepseek-v4-pro-base)."
  - pattern: "deepseek-coder-*"
    product: deepseek-coder
    decided_in: "#474"
    note: "DeepSeek's code-specialized line, a separate tier from deepseek; releases append a vN-variant suffix (deepseek-coder-v2-instruct)."
  - pattern: "doubao-seed-*"
    product: doubao-seed
    decided_in: "#474"
    note: "ByteDance Seed/Volcano Engine's Doubao Seed line; releases append a major-point number (doubao-seed-2-0)."
  - pattern: "ernie-*"
    product: ernie
    decided_in: "#474"
    note: "Baidu's Ernie line; releases append a major-point number (ernie-5-1)."
  - pattern: "falcon-*"
    product: falcon
    decided_in: "#474"
    note: "Technology Innovation Institute's Falcon line; releases append a generation number (falcon-3)."
  - pattern: "gemma-*"
    product: gemma
    decided_in: "#474"
    note: "Google's Gemma line; releases append a generation number (gemma-2, gemma-3, gemma-4)."
  - pattern: "glm-*"
    product: glm
    decided_in: "#474"
    note: "Z.ai's GLM line; releases append a generation-and-point number, sometimes a size suffix (glm-4-6, glm-4-9b, glm-5-1)."
  - pattern: "grok-*"
    product: grok
    decided_in: "#474"
    note: "xAI's Grok line; releases append a generation number, sometimes a two-part point release (grok-3, grok-4-20)."
  - pattern: "hermes-*"
    product: hermes
    decided_in: "#474"
    note: "Nous Research's Hermes line; releases append a generation number and the base model's size or name (hermes-4-14b, hermes-4-llama-3-1-405b)."
  - pattern: "inflection-*"
    product: inflection
    decided_in: "#474"
    note: "Inflection AI's line; releases append a major-point number (inflection-3-0)."
  - pattern: "internlm-*"
    product: internlm
    decided_in: "#474"
    note: "Shanghai AI Laboratory's InternLM line; releases append a major-point number (internlm-2-5)."
  - pattern: "k2-*"
    product: k2
    decided_in: "#474"
    note: "LLM360's K2 line; releases append a version letter and number (k2-v2)."
  - pattern: "kimi-*"
    product: kimi
    decided_in: "#474"
    note: "Moonshot AI's Kimi line; releases append a generation-and-point number (kimi-k2-6, kimi-k3)."
  - pattern: "llama-*"
    product: llama
    decided_in: "#474"
    note: "Meta's Llama line; releases append a generation-and-point number or a variant name (llama-3-1, llama-4-scout-maverick)."
  - pattern: "llama-guard-*"
    product: llama-guard
    decided_in: "#474"
    note: "Meta's Llama Guard safety classifiers; releases append a generation number (llama-guard-3, llama-guard-4). Longer than llama-*, so it wins the overlap and keeps Guard releases out of the base Llama family."
  - pattern: "minimax-*"
    product: minimax
    decided_in: "#474"
    note: "MiniMax's flagship line; releases append a generation-and-point number (minimax-m2-5, minimax-m3)."
  - pattern: "mistral-7b-instruct-*"
