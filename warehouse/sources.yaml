# Registry of external data sources the pipeline ingests.
# Each entry links a source to its fetcher in warehouse/ingest/.
#
# `refresh` is what actually runs, not an intention. Every fetcher below is driven by
# .github/workflows/refresh-data.yml on one weekly cron (Mondays 05:17 UTC); the per-source
# monthly and quarterly cadences this file used to declare were never implemented anywhere.
# A source with no fetcher is read by a UDM on the platform, and a cron set on a UDM is a
# DECLARATION — see warehouse/models/README.md on why that does not prove it fires.
sources:
  - id: goodailist
    name: Good AI List
    homepage: https://goodailist.com/
    provides: Curated AI repos with categories and activity metrics
    # No fetcher and no committed CSV. This source is read directly by the
    # currentai.signal_goodailist.repo_catalog UDM on its own cron, so there is
    # nothing to mirror into warehouse/catalog/. A mirror could only be staler
    # than the live table, and it was: the frozen CSV still listed 300 repos
    # goodailist.com had delisted.
    ingested_by: currentai.signal_goodailist.repo_catalog
    refresh: declared daily on the UDM; verify in run history

  - id: huggingface
    name: Hugging Face models
    homepage: https://huggingface.co/
    provides: >-
      Model catalog from the Hugging Face Hub. Not uploaded — it is the input list
      fetch_model_benchmarks scans, and only that fetcher's output reaches the warehouse.
    fetcher: warehouse/ingest/fetch_huggingface.py
    refresh: weekly (refresh-data.yml)

  - id: huggingface_benchmarks
    name: Hugging Face / Open LLM Leaderboard
    homepage: https://huggingface.co/
    provides: Model and dataset catalogs, benchmark scores
    fetcher: warehouse/ingest/fetch_model_benchmarks.py
    refresh: weekly (refresh-data.yml)

  - id: ai_incidents
    name: AI Incident Database
    homepage: https://incidentdatabase.ai/
    provides: Safety / safeguards incidents
    # No fetcher and no committed CSV, for the same reason as goodailist above: the
    # currentai.aiid REST ingestion reads incidentdatabase.ai on its own weekly cron,
    # and the ai-safety-incidents notebook reads that rather than a mirror. The
    # committed CSV was removed on 2026-08-16 with nothing pointed at it.
    ingested_by: currentai.aiid.incidents
    refresh: declared weekly on the ingestion; verify in run history

  - id: stack_map
    name: Stack-map taxonomy bridge (internal)
    homepage: https://github.com/currentai-org/os-ai-map
    provides: Scored-product repos mapped to stack-map category/layer/openness (derived from sources/, not an external API)
    fetcher: warehouse/ingest/build_stack_map.py
    refresh: on-curation-change
