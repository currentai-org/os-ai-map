# Provenance for the platform mirror in this folder.
#
# Each entry says which deployed platform model revision a mirrored file reflects.
#  - hash:         the platform revision's content hash (an id for the deployed revision,
#                  compared by a future drift check).
#  - local_sha256: sha256 of the checked-in bytes, so this manifest binds the actual file.
#  - synced_at:    when THAT entry was last refetched from the platform.
# The platform is the source of truth. To re-sync: refetch each model's latest revision,
# overwrite the file, and update revision/hash/local_sha256/synced_at on that entry.
#
# synced_at is PER ENTRY, not per file. It was one global date until 2026-08-16, which meant
# refetching two models advanced the date on all twelve and implied the other ten had been
# checked. A provenance record whose date moves for a reason unrelated to the thing it dates
# is worse than no date. Staged entries carry none: nothing has been deployed to refetch.
org: currentai            # ad7f4c1c-dd2f-430e-a831-e7f1f16e6d9e

