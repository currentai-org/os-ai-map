    overwrites the state these bytes record — nothing may rewrite, refresh or relabel this file,
    and the refresh path must not write to its path.'
  notes: 'Captured 2026-08-24 from the deployed product_adoption_current, closing the Phase 2
    baseline requirement. A staged status records that no table of this name exists on the
    platform — the bytes live in the repository — and not that the capture is unfinished; the
    bytes are complete and final. NOT a deletion target. Nothing in the repo, no platform notebook
    and no deployed platform model reads it, and that is by construction: a baseline is read when
    there is history to compare against it, and the append-only history table
    (observations.product_adoption, Phase 2B) is blocked on #352. It is a PRE-POSITIONED immutable
    anchor, like observations.product_adoption_current (whose own no-reviewed-consumer finding is
    tracked in #348) — the only surviving copy of the first observations state, unrecoverable once
    product_adoption_current next refreshes. It carries no retirement_reason because the derived
    predicate excludes staged assets: labelling one would put an authored retirement claim on an
    asset the predicate does not select, which is the drift the ledger gate exists to catch.'
