# Architecture asset inventory for the datasets this repository maintains or reads from.
# One entry per logical platform table. Generated 2026-08-20 from the live org, the
# repository tree and every notebook in the organization; schema and gates are in
# docs/architecture/data-architecture.md section 11.
#
# `kind` is what an asset IS, in the namespace vocabulary of section 4. `current_namespace`
# is where its table lives today and `target_namespace` where the architecture puts it.
# Where they disagree the asset carries migration_status: pending.
#
# `reads`, `read_by` and the counts in any prose are DERIVED by build/assets.py from the
# tree, and tests/test_assets_inventory.py compares them against these values. Do not
# hand-edit them, and do not write a count here that is not generated.
#
# `consumer_checks` records what was actually audited, per check:
#   repository        every tracked model, build module, notebook and workflow
#   platform_notebooks  all 20 notebooks in the org, including the 16 untracked here
#   platform_models   CHECKED (Phase 0b). All 41 deployed model definitions in the org
#                     were read. platform_model_consumers lists the deployed models with NO
#                     repository source that read an asset; repo-sourced deployed readers
#                     already appear in read_by, so they are not repeated there.
#   external          NOT audited. Nothing outside this org.
# platform_models is now checked for every asset, so retirement_candidates() can be
# non-empty; retirement itself still requires maintainer authorization (section 17).
#
# This inventory absorbed warehouse/sources.yaml, retired in the mirror-layout restructure.
# That file's explanation of why two sources carry no fetcher is preserved verbatim here.
# goodailist's reasoning lives on the signal_goodailist.repo_catalog entry (source_note);
# aiid is not a tracked asset, so its reasoning is carried here:
#
#   ai_incidents (AI Incident Database, https://incidentdatabase.ai/):
#   No fetcher and no committed CSV, for the same reason as goodailist above: the
#   currentai.aiid REST ingestion reads incidentdatabase.ai on its own weekly cron,
#   and the ai-safety-incidents notebook reads that rather than a mirror. The
#   committed CSV was removed on 2026-08-16 with nothing pointed at it.
