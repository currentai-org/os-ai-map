# Governed asset inventory for the Open Source AI Gap Map's data system (ADR-003).
# NOT an org-wide mirror: an entry belongs here only if it is a GOVERNED asset -- a governed
# output, repo-owned map computation, repo-owned data/control artifact, or a compatibility shim
# -- and it carries a `role` saying which. Inputs the map depends on but does not own -- oso.*
# upstreams AND platform-authored currentai.* models the repo mirrors read-only -- live in
# warehouse/dependencies.yaml as contracts, never here (a mirror is provenance, not ownership).
# Tables that merely exist on OSO, or are read only by a standalone notebook or another platform
# product, are out of scope in both files and stay discoverable through OSO's own UI.
#
# The ADR-003 externalization is COMPLETE: the long-tail pipelines and the questionable gap_map
# tables were removed here (steps 5-6) and FROZEN under platform ownership -- the deployed OSO
# tables stay live at their last publish with no repository producer (disposition
# `frozen-without-producer`), which satisfies the no-orphan rule but is NOT an ownership transfer
# to a named destination repo. The per-table handoff evidence is the reproducible receipt at
# warehouse/audits/externalization.json (build/assets.py re-derives it from the base commit).
# Every entry here now carries a `role`; there is no externalization backlog and no roleless
# state, and the gates keep it that way (`population: long_tail` is retired, `gap_map` is the only
# value). The externalized tables were removed from this repo's inventory and publisher, never
# from OSO.
#
# There is no `owner` field: every governed asset is owned by this repository, so a uniform owner
# carried no signal (a dependency contract instead records `owner: oso` in dependencies.yaml).
#
# `kind` is what an asset IS, in the namespace vocabulary of section 4.
#
# `reads`, `read_by` and the counts in any prose are DERIVED by build/assets.py from the tree,
# and tests/test_assets_inventory.py compares them against these values. Do not hand-edit them.
#
# `consumer_checks` records what was actually audited, per check:
#   repository        every tracked model, build module, notebook and workflow
#   platform_notebooks  all notebooks in the org, including the untracked ones
#   platform_models   CHECKED (Phase 0b). platform_model_consumers lists the deployed models with
#                     NO repository source that read an asset; repo-sourced deployed readers
#                     already appear in read_by, so they are not repeated there.
#   external          NOT audited. Nothing outside this org.
# Schema and gates are in docs/architecture/data-architecture.md section 11.
