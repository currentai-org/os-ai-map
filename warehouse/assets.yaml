# reads from. One entry per platform table. Generated 2026-08-20 from the live org, the
# repository tree and every notebook in the organization; see
# docs/architecture/data-architecture.md section 11 for the schema and the gates.
#
# `kind` is what an asset IS, in the namespace vocabulary of section 4.
# `current_namespace` is where its table lives today and `target_namespace` where the
# architecture puts it; they disagree for 28 assets, which is what the migration is for.
#
# `reads` and `read_by` are DERIVED by build/assets.py from the tree, and CI compares them
# against these values. Do not hand-edit them.
#
# `consumer_scope: platform_checked` means every notebook in the org was read on the
# verified_at date. It does NOT cover consumers outside this org or the platform.
