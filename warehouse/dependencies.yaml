# External dependency contracts (ADR-003 category 3) for the Open Source AI Gap Map's
# data system. These are inputs a GOVERNED asset reads but the repository does NOT own -- OSO
# platform tables (oso.*) and platform-authored currentai.* models the repo mirrors read-only.
# A `mirror:` block proves provenance, NOT operational ownership: the platform is authoritative,
# so these are contracts, never governed assets. See docs/architecture/adr-003-repository-scope-boundary.md.
#
# This file is NOT an org-wide inventory and cannot become one. The gates (build/assets.py
# dependency_violations + dependency_mirror_provenance_violations, tests/test_scope_gates.py) fail
# CLOSED:
#   * disjoint from assets.yaml (gate 3);
#   * every entry is REACHABLE from a CLOSED root set -- governed producer files + named audit
#     roots only, never "any build/*.py" -- re-derived from the tree, not trusted from required_by;
#   * required_by is mechanically re-derived and must match; owner: oso; purpose, expected_grain and
#     freshness_requirement are required;
#   * exactly one provenance anchor, internally self-consistent:
#       - currentai.* mirror -> verified_revision (== mirror.revision) + a mirror block that hashes
#         EVERY claimed file (model via local_sha256, schema via schema_sha256) against the bytes on
#         disk; cross-commit coherence (bytes move with revision/hash/synced_at, model_id stable) is
#         gated across BOTH manifests, including the one-time asset->dependency move;
#       - oso.* upstream -> content_contract_sha256 over table + grain + TYPED expected_columns
#         (name + type + nullable), recomputed by the gate + a verified_at date.
#         Reproduce: sha256(table + "\n" + expected_grain + "\n" +
#         "\n".join(sorted(f"{c['name']}:{c['type']}:{'null' if c['nullable'] else 'notnull'}")))
#
# `platform_schedule` is INFORMATIONAL (the platform's cron + last observed trigger, retained from
# the prior inventory) -- it records the freshness expectation's basis, not an ownership obligation.
# The three openness models carry retirement_context: the repo drives their Phase-7 retirement (#384).
