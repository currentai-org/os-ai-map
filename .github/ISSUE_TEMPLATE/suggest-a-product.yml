name: Suggest a product
description: Propose a product for the AI Stack Map (no YAML required)
title: "[product] <name>"
labels: ["product-suggestion"]
body:
  - type: input
    id: product_name
    attributes:
      label: Product name
      placeholder: e.g. OLMo 2
    validations:
      required: true
  - type: input
    id: org
    attributes:
      label: Organization / maintainer
      placeholder: e.g. Allen Institute for AI
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested category
      options:
        - Base / pretrained models (base_pretrained)
        - Embeddings & retrieval models (embeddings_retrieval)
        - Scientific AI models (scientific_ai_models)
        - Fine-tuned / chat models (finetuned_chat)
        - Inference code (inference_code)
        - Fine-tuning code (finetuning_code)
        - Evaluation code (evaluation_code)
        - Benchmark / eval datasets (benchmark_eval_data)
        - Training & synthetic datasets (training_synthetic_datasets)
        - Dataset Processing Tools (dataset_processing_tools)
        - Document conversion & OCR (document_conversion)
        - Orchestration & agents (orchestration_agents)
        - UI & API (ui_api)
        - Telemetry & observability (telemetry_observability)
        - Safety & Guardrails (safeguards)
        - Agent tools & connectors (agent_tools_connectors)
        - Agent protocols & SDKs (agent_protocols)
        - Search & retrieval (search_retrieval)
        - Core ML frameworks & libraries (ml_frameworks)
        - Compilers & Model Optimization (compilers)
        - Storage & Retrieval (storage)
        - Deployment (deployment)
        - ML orchestration (ml_orchestration)
        - Edge AI hardware (edge_hardware)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Open artifact URLs
      description: GitHub repo, Hugging Face model/dataset, PyPI/npm/crates/Go package links — one per line.
      placeholder: |
        https://github.com/allenai/OLMo
        https://huggingface.co/allenai/OLMo-2-1124-13B
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs on the map
      description: Adoption signals, license, what makes it notable.
    validations:
      required: true
