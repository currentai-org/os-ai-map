name: identity-eval

# Replay eval: score the identity graph's edges against prior human decisions, and fail if
# a relation with automation planned and enough truth to check falls under its precision/
# recall floor. The two rules that must never be broken (name-match never auto-emits, a
# scoring-bearing membership edge never auto-emits) are pinned as tests in
# tests/test_identity_eval.py, run on every PR through validate.yml. See build/identity_eval.py
# for the full contract, including the fix-round history of what this schema had to match.
#
# Scheduled Monday 07:30 UTC, after the identity dataset's Sunday run has had a day to land,
# and offset from `artifacts` (also Monday 07:00) to keep the two gates' logs apart.
#
# The live step passes no --allow-unprovisioned: all seven currentai.identity.* models are
# deployed and carry mirror-bound dependency contracts in warehouse/dependencies.yaml, so a
# missing table is a real failure again and is reported as one (exit 2). The flag would be
# refused anyway -- build.identity_eval.main rejects it once a contract with a mirror block
# exists, the platform-owned equivalent of an asset marked materialized: true.
#
# push/pull_request runs the FIXTURE eval, never --from-warehouse: a PR cannot reach the
# warehouse tables (they may not exist, and a fork PR has no OSO_API_KEY regardless). The
# fixture (tests/fixtures/identity_edges_pass.json) carries all four edge tables in the real
# WAREHOUSE_COLUMNS shape, so this run exercises the scoring math, the tier split and the
# schema end to end -- it is not a substitute for the two never-auto-emit governance rules,
# which are pinned as pytest tests (test_name_match_never_auto_emits*,
# test_scoring_bearing_*) and run on every PR through validate.yml regardless of this
# workflow. Only schedule and workflow_dispatch touch the warehouse.
#
# sources/products/**, sources/organizations/**, sources/registry/** and sources/org_handles.yaml
# are in the path triggers because that is where TRUTH is built from
# (build.identity_eval.load_truth) -- a roster edit, a tail row or a handle changes truth without
# touching build/identity*.py or the ledger. Tail rows are declarations too, so sources/registry/**
# moves membership, org and artifact-identity truth; org_handles.yaml decides which org truth pairs
# are recoverable at all, and so moves org recall's denominator.
# sources/model_families.yaml does not exist in this repo yet (Task 4 adds the table it backs);
# the path is kept as a forward reference so this workflow does not need a second edit when it
# lands.

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/identity*.py"
      - "sources/resolution_ledger.yaml"
      - "sources/model_families.yaml"
      - "sources/products/**"
      - "sources/organizations/**"
      - "sources/registry/**"
      - "sources/org_handles.yaml"
  pull_request:
    paths:
      - "build/identity*.py"
      - "sources/resolution_ledger.yaml"
      - "sources/model_families.yaml"
      - "sources/products/**"
      - "sources/organizations/**"
      - "sources/registry/**"
      - "sources/org_handles.yaml"

jobs:
  identity-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      - name: Replay against a fixture (push / pull_request)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: uv run python -m build.identity_eval --edges tests/fixtures/identity_edges_pass.json --floors

      - name: Replay the live identity graph (schedule / workflow_dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
        run: uv run python -m build.identity_eval --from-warehouse --floors
