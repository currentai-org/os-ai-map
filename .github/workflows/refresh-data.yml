name: refresh-data

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The HF link scan spends ~2h of wall time in 60s sleeps on 429s (the
    # pacing that keeps it alive); a full paced run takes ~3.5h. 180m killed
    # run 27345470020 at 79% of the link scan. Trim pacing or split fetchers
    # into parallel jobs before tightening this again.
    timeout-minutes: 330
    env:
      OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # GITHUB_TOKEN is read by fetch_github_ai_repos; GH_TOKEN by the gh CLI
      # inside fetch_github_orgs. Both map to the GH_FETCH_TOKEN repo secret
      # (a PAT, not the Actions token: PRs opened with the Actions token would
      # not trigger the validate workflow, and the orgs scan needs a 5K/hr limit).
      GITHUB_TOKEN: ${{ secrets.GH_FETCH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_FETCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Two checks, and the second is the one that was missing. Presence proves a secret is
      # SET; it does not prove it still WORKS, and a PAT expires. This workflow failed on
      # every scheduled run from 2026-06-22 to 2026-08-10 with `401 - Bad credentials`,
      # roughly 3.5 hours into each attempt — about 28 hours of runner time spent fetching
      # data that was then discarded when the job failed, and eight weeks in which
      # `warehouse/catalog/` silently stopped being refreshed while the workflow still
      # appeared scheduled and live.
      #
      # Both probes are single authenticated GETs and answer in well under a second, so a
      # dead credential now costs seconds instead of an afternoon.
      - name: Require secrets (fetchers degrade silently without them)
        run: |
          missing=""
          [ -n "$OSO_API_KEY" ] || missing="$missing OSO_API_KEY"
          [ -n "$HF_TOKEN" ] || missing="$missing HF_TOKEN"
          [ -n "$GITHUB_TOKEN" ] || missing="$missing GH_FETCH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing. Without tokens the HF link scan silently drops from ~742 links to ~7; refusing to run."
            exit 1
          fi

      - name: Verify the credentials actually authenticate
        run: |
          fail=0

          gh_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)
          if [ "$gh_code" != "200" ]; then
            echo "::error::GH_FETCH_TOKEN did not authenticate (HTTP $gh_code from api.github.com/user). It is a PAT and PATs expire — mint a new one and update the repo secret. This is what failed every run from 2026-06-22."
            fail=1
          fi

          hf_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/whoami-v2)
          if [ "$hf_code" != "200" ]; then
            echo "::error::HF_TOKEN did not authenticate (HTTP $hf_code from huggingface.co/api/whoami-v2)."
            fail=1
          fi

          # OSO_API_KEY stays presence-only: every probe for it is a warehouse round trip
          # against a live model, which is a heavier and less predictable precondition than
          # this step should carry. The fetchers surface an OSO failure themselves.
          exit $fail
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run fetchers
        run: |
          # The GoodAI List fetcher is gone: currentai.signal_goodailist.repo_catalog
          # reads goodailist.com directly on its own cron, so a committed CSV mirror
          # was a second copy of the same data that could only be staler.
          uv run python warehouse/ingest/fetch_incidents.py
          uv run python warehouse/ingest/fetch_huggingface.py
          uv run python warehouse/ingest/fetch_model_benchmarks.py
          uv run python warehouse/ingest/fetch_github_ai_repos.py
          # Resumes from the committed orgs.csv, so steady-state runs only
          # fetch new owners and stay well under the 5K/hr rate limit.
          uv run python warehouse/ingest/fetch_github_orgs.py
      - name: Open refresh PR
        run: |
          if [ -z "$(git status --porcelain warehouse/catalog/)" ]; then
            echo "Catalog unchanged; no PR needed."
            exit 0
          fi
          BRANCH="data-refresh/$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add warehouse/catalog/
          git commit -m "chore(catalog): weekly data refresh $(date -u +%F)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(catalog): weekly data refresh $(date -u +%F)" \
            --body "Automated weekly fetcher run. Review row-count deltas before merging. After merge, reload static models per \`docs/operations/refresh-data.md\`."
