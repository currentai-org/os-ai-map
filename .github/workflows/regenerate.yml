name: regenerate

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "docs/methodology.md"
      - "build/**"
      - "!build/notebook_data.json"
      - "tests/test_serialize_rubric.py"
  # Manual re-run. The path filter above is right for the normal case — regenerate when the
  # inputs change — but it leaves no way to re-run after a fix to something the filter does not
  # watch. On 2026-08-07 a bug in build/check_retirement.py aborted this workflow before its
  # commit step, so the payload on main went stale; the fix touched only that gate and its tests,
  # neither of which is a trigger path, so nothing re-ran and the staleness persisted with no way
  # to clear it. A gate that can block regeneration needs a way to unblock it.
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs. This workflow commits and pushes to main, so two overlapping runs race:
# the second one's push is non-fast-forward and fails, leaving the payload on main stale in
# exactly the way the 2026-08-07 incident above describes. cancel-in-progress stays false
# because the later run's inputs are the ones we want, and a cancelled run mid-push is worse
# than a queued one.
concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build.freshness_payload dates each score file from its last
          # commit, and a shallow clone collapses all 470 onto the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Validate
        run: uv run python -m build.validate
      - name: Serialize (generated = run date)
        run: uv run python -m build.serialize --date "$(date -u +%F)"

      # Same identity gate validate.yml runs on every PR, plus the retirement check that
      # only a two-payload diff can do: fail the bot commit rather than let a slug 404
      # silently. See build/check_payload.py and build/check_retirement.py.
      - name: Gate the serialized payload
        run: uv run python -m build.check_payload
      - name: Fail on an unrouted retirement
        run: uv run python -m build.check_retirement
      - name: Render notebook
        run: uv run python -m build.render
      - name: Sync README stat badges
        run: uv run python -m build.update_readme
      - name: Regenerate corpus goldens
        run: uv run python -m build.goldens --write
      - name: Self-check the golden
        run: uv run python -m build.goldens --check --strict
      - name: Notebook structure check
        run: |
          uv run marimo check notebooks/ai-stack-map.py

      # The tests whose INPUT is the file this workflow just rewrote. validate.yml runs the
      # whole suite on every PR, but it runs it on the PR's commit - and the payload is not
      # regenerated until after merge, by this workflow, which until 2026-09-18 ran no tests at
      # all. So a payload that fails its own tests could land on main with every check green,
      # and on 2026-09-18 one did: #620 shrank the corpus, the bot committed the smaller
      # payload, and no `validate` run ever existed for that SHA.
      #
      # Marker rather than a list of files, so a new payload-reading test is gated by declaring
      # itself rather than by somebody remembering to edit this step.
      - name: Gate the regenerated payload against its own tests
        run: uv run pytest -q -m payload

      - name: Commit regenerated artifacts
        run: |
          ARTIFACTS="build/notebook_data.json notebooks/ai-stack-map.py README.md tests/goldens/corpus.json"
          if git diff --quiet $ARTIFACTS; then
            echo "No changes to generated artifacts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $ARTIFACTS
          git commit -m "chore(build): regenerate notebook data, notebooks, README badges [bot]"
          # The concurrency group serializes this workflow's own runs, but not merges: a PR
          # that lands on main while this run is building makes the push non-fast-forward.
          # Rebasing onto it is safe. If that merge touched a trigger path, its own run is queued
          # behind this one and regenerates from its inputs; if it did not, the artifacts built
          # here are already current for it. A conflict means the merge edited a generated file,
          # which is the one case left to fail loudly.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "Push still rejected after three rebases." >&2
          exit 1
