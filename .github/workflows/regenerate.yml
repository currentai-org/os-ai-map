name: regenerate

on:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "docs/methodology.md"
      - "build/serialize.py"
      - "build/render.py"
  # Manual re-run. The path filter above is right for the normal case — regenerate when the
  # inputs change — but it leaves no way to re-run after a fix to something the filter does not
  # watch. On 2026-08-07 a bug in build/check_retirement.py aborted this workflow before its
  # commit step, so the payload on main went stale; the fix touched only that gate and its tests,
  # neither of which is a trigger path, so nothing re-ran and the staleness persisted with no way
  # to clear it. A gate that can block regeneration needs a way to unblock it.
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs. This workflow commits and pushes to main, so two overlapping runs race:
# the second one's push is non-fast-forward and fails, leaving the payload on main stale in
# exactly the way the 2026-08-07 incident above describes. cancel-in-progress stays false
# because the later run's inputs are the ones we want, and a cancelled run mid-push is worse
# than a queued one.
concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build.freshness_payload dates each score file from its last
          # commit, and a shallow clone collapses all 470 onto the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Validate
        run: uv run python -m build.validate
      - name: Serialize (generated = run date)
        run: uv run python -m build.serialize --date "$(date -u +%F)"

      # Same identity gate validate.yml runs on every PR, plus the retirement check that
      # only a two-payload diff can do: fail the bot commit rather than let a slug 404
      # silently. See build/check_payload.py and build/check_retirement.py.
      - name: Gate the serialized payload
        run: uv run python -m build.check_payload
      - name: Fail on an unrouted retirement
        run: uv run python -m build.check_retirement
      - name: Render notebook
        run: uv run python -m build.render
      - name: Sync README stat badges
        run: uv run python -m build.update_readme
      - name: Notebook structure check
        run: |
          uv run marimo check notebooks/ai-stack-map.py
      - name: Commit regenerated artifacts
        id: commit
        run: |
          ARTIFACTS="build/notebook_data.json notebooks/ai-stack-map.py README.md"
          if git diff --quiet $ARTIFACTS; then
            echo "No changes to generated artifacts."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $ARTIFACTS
          git commit -m "chore(build): regenerate notebook data, notebooks, README badges [bot]"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
          # The published bytes live in THIS commit, not the trigger commit ($GITHUB_SHA).
          # The consumer must record the payload commit for honest provenance.
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Tell the consumer, instead of making it guess.
      #
      # aipotluck.org pulls this payload on a daily cron, and that cron has never once fired on
      # time: across 26 scheduled runs the delay ranged from 45 minutes to ten hours, because
      # GitHub queues scheduled workflows under load. The consequence is not just lateness — on
      # 2026-08-27 a rename merged here at 21:43 and the sync's slot had passed, so the change
      # waited a further day. Polling cannot fix that; only the publisher knows when it published.
      #
      # The cron stays as a backstop. This makes the normal case immediate rather than eventual.
      #
      # Reuses GH_FETCH_TOKEN rather than minting a second secret. Note what that token actually
      # carries: refresh-data.yml's preflight accepts `repo` OR `public_repo`, and every other
      # use of it is against this repository, which is public — so public_repo has always been
      # sufficient and nothing ever asserted more. aipotluck.org is private, a public_repo token
      # cannot see it, and GitHub masks that as 404 rather than 403 so a token cannot probe for
      # private repositories it lacks. Until the secret carries `repo`, this step cannot succeed.
      #
      # continue-on-error is deliberate. Notification runs after the commit that publishes, so a
      # failure here fails a run whose publish already succeeded: on 2026-08-30 both publish runs
      # went red (06:45, 21:23) with the payload sitting correctly on main.
      # The step still shows a red X and its annotation still reaches the run summary; the job
      # goes green, because a notification is not the publish. The cron backstop covers the gap.
      - name: Notify aipotluck.org that new data is published
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.GH_FETCH_TOKEN }}
        run: |
          # exit 1, not exit 0. The previous version exited 0 here, which reported success for a
          # notification it had not sent — the 2026-08-29 10:19 run looked green on an unset
          # secret. That is the silent no-op CUR-570 exists to remove.
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::GH_FETCH_TOKEN is not set, so no publish notification was sent." \
                 "aipotluck.org will pick this up on its cron backstop instead."
            exit 1
          fi
          GENERATED=$(python3 -c "import json;print(json.load(open('build/notebook_data.json'))['generated'])")
          CONTRACT=$(python3 -c "import json;print(json.load(open('build/notebook_data.json')).get('contract',1))")
          # source_sha must identify the commit that CONTAINS the published payload — the bot
          # commit made just above (steps.commit.outputs.published_sha) — not $GITHUB_SHA, which
          # is the trigger commit and still holds the OLD generated bytes. trigger_sha carries the
          # trigger commit separately for anyone who wants it.
          PUBLISHED_SHA="${{ steps.commit.outputs.published_sha }}"
          echo "Notifying aipotluck.org: generated=$GENERATED contract=$CONTRACT source_sha=$PUBLISHED_SHA trigger_sha=$GITHUB_SHA"
          # Capture the status instead of --fail-with-body, so a delivery failure can say which
          # failure it is: `curl: (22) 404` alone does not say whether the token, the URL or
          # the event type is at fault.
          STATUS=$(curl --silent --show-error --output /tmp/dispatch-response \
            --write-out '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/currentai-org/aipotluck.org/dispatches \
            -d "{\"event_type\":\"gap-map-data-published\",\"client_payload\":{\"generated\":\"$GENERATED\",\"contract\":$CONTRACT,\"source_sha\":\"$PUBLISHED_SHA\",\"trigger_sha\":\"$GITHUB_SHA\"}}")
          case "$STATUS" in
            204)
              echo "Dispatched gap-map-data-published to aipotluck.org."
              ;;
            401|403|404)
              echo "::error::aipotluck.org/dispatches returned $STATUS. That repository is" \
                   "private, so this almost always means GH_FETCH_TOKEN cannot see it: a classic" \
                   "PAT with public_repo returns 404 here and needs the full repo scope. The" \
                   "publish itself succeeded and aipotluck.org will sync on its cron backstop."
              cat /tmp/dispatch-response
              exit 1
              ;;
            *)
              echo "::error::aipotluck.org/dispatches returned an unexpected $STATUS. The" \
                   "publish itself succeeded; aipotluck.org will sync on its cron backstop."
              cat /tmp/dispatch-response
              exit 1
              ;;
          esac
