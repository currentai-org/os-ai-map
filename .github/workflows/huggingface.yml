name: huggingface

# Publish the map as a Hugging Face dataset when a release is tagged. The tag is cut by the
# publish-release skill on a reviewed, merged commit; this exports that commit and tags the
# dataset with the same vX.Y.Z, so a dataset revision and a repo release always name the same
# data. build/export_hf.py refuses to push from anything but the release tag.
#
# Needs the HF_TOKEN repository secret: a write token for the dataset's Hugging Face org.

on:
  push:
    tags: ["v*.*.*"]
  # Re-publish a release, e.g. after the token was missing when the tag landed. Run it from
  # the tag (the "Use workflow from" picker), not from a branch: the export checks HEAD.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the history tables read build/notebook_data.json at every
          # release tag, and build.freshness_payload dates score files from their commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Validate sources
        run: uv run python -m build.validate
      - name: Export and push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m build.export_hf --push
      - name: Summary
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/hf/manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
