name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build.freshness_payload dates each score file from its last
          # commit, and a shallow clone collapses all 470 onto the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Validate sources (schema + cross-file invariants)
        run: uv run python -m build.validate
      - name: Run tests
        run: uv run pytest -q

      # G1, G2 and G3. Free, no network, and scoped so they cover exactly what has been
      # done: G1 and G2 apply only to axes claiming a last_verified, G3 to every scored
      # product in a category with a recipe. See docs/guides/verification.md.
      - name: Verification gates (G1 invariant, G2 digests, G3 producible pairs)
        run: uv run python -m build.check_verification --verbose

      # Structure of every scoring recipe: a rationale on each rung, a machine_signal on
      # each dimension, no rule that cannot fire, no product abstained on without a
      # declared reason, and no evidence the components parser silently discards. Note
      # check_rubric is not in CI at all; this is what puts the class of check on every PR.
      # See skills/build-rubric/SKILL.md.
      - name: Recipe gate (structure, deferral completeness, discarded evidence)
        run: uv run python -m build.check_recipe --verbose
      - name: Serialize dry-run
        run: uv run python -m build.serialize --date ci-dry-run

      # Render the notebook and parse the result. The generated file is bot-owned and is
      # not committed from a PR, but rendering is the only thing that catches a
      # contributor string breaking the generated Python: a quote in a strapline produces
      # a notebook that will not parse, and that surfaced after merge because CI
      # serialized without ever rendering.
      - name: Render notebook and check it parses
        run: |
          uv run python build/render.py
          uv run python -c "import ast, pathlib; ast.parse(pathlib.Path('notebooks/ai-stack-map.py').read_text()); print('generated notebook parses')"
          uv run marimo check notebooks/ai-stack-map.py
          git checkout -- notebooks/ai-stack-map.py

  generated-files-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if PR hand-edits bot-owned generated files
        run: |
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(build/notebook_data\.json|notebooks/ai-stack-map\.py)$' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::build/notebook_data.json and notebooks/ai-stack-map.py are regenerated by a bot on merge. Remove them from this PR (edit sources/ only)."
            exit 1
          fi
