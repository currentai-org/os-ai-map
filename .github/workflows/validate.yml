name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build.freshness_payload dates each score file from its last
          # commit, and a shallow clone collapses all 470 onto the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Validate sources (schema + cross-file invariants)
        run: uv run python -m build.validate
      - name: Run tests
        run: uv run pytest -q

      # The invariant, the digest requirement and the producible-pair check. Free, no
      # network, and scoped so they cover exactly what has been done: invariant and digests
      # apply only to axes claiming a last_verified, producible-pairs to every scored product
      # in a category with a recipe. See docs/guides/verification.md.
      - name: Verification gates (invariant, digests, producible-pairs)
        run: uv run python -m build.check_verification --verbose

      # Capability's own gate. Most bands on this map were placed against a named peer, and
      # until `relative_to` existed that comparison lived in a note where nothing could check
      # it. This requires the recorded relation to agree with the two recorded scores, and a
      # dated band's peer to be confirmed at least as recently. It ratchets the same way the
      # verification gates do: it covers the products that record a comparison, which grows
      # as the axis is curated. See docs/guides/verification.md.
      - name: Capability gate (recorded comparisons hold)
        run: uv run python -m build.check_capability

      # Structure of every scoring recipe: a rationale on each rung, a machine_signal on
      # each dimension, no rule that cannot fire, no product abstained on without a
      # declared reason, and no evidence the components parser silently discards.
      # check_rubric runs in the step below; this one gates recipe structure rather than
      # per-product reproduction. See skills/build-rubric/SKILL.md.
      - name: Recipe gate (structure, deferral completeness, discarded evidence)
        run: uv run python -m build.check_recipe --verbose

      # Does a structured `components` mapping say what the string it replaced said? This is
      # the only gate that compares the shape migration's output against its input, and it
      # has to run BEFORE the rubric gate, because the rubric gate reads the mapping and
      # would simply believe a mangled one. Vacuously green until the first batch migrates.
      - name: Components gate (a structured mapping matches its raw string)
        run: uv run python -m build.check_components

      # Does the recorded score match what the category's own rubric produces? This is the
      # only gate that compares a published number against the rule meant to generate it,
      # and it ran in no workflow until now. Safe to gate on: products a category has
      # explicitly deferred are excluded from the comparison, so the escape hatch is the
      # `deferred` block with a written reason rather than editing a score to make CI pass.
      # check_recipe above gates the STRUCTURE of a recipe and deliberately refuses to gate
      # on a reproduction rate; this gates per-product mismatches, which is a different
      # claim. See build/check_rubric.py's module docstring.
      - name: Rubric gate (recorded scores reproduce)
        run: uv run python -m build.check_rubric

      # Does every recorded (level, reach) pair exist on the scale its own instrument
      # declares? `check_adoption` shipped non-strict on 2026-08-11 against a backlog of 217
      # off-scale records, because a gate that fails on day one teaches people to skip it. The
      # backlog is now zero, so --strict goes on: 217 -> 71 across #224-#230, then 71 -> 0 on
      # 2026-08-13 by declaring the two instruments that had no vocabulary (`active_users`,
      # `reported_traction`) and re-reading every remaining figure live rather than inferring
      # it from the stale text of the label being replaced.
      #
      # The escape hatch is to declare a band, not to edit a level until CI passes. If a record
      # needs a label no scale offers, that is the finding — `character-ai` invented `10M-100M`
      # and sat a level below what its own figure supported for exactly as long as nothing
      # could check it.
      - name: Adoption gate (every band exists on its instrument's scale)
        run: uv run python -m build.check_adoption --strict

      # check_adoption above gates the LABEL. This gates the CLAIM underneath it: a record has
      # to be re-checkable by somebody other than its author, either by recomputation (an
      # artifact some signal model reads) or by re-fetch (a source with a date and a digest).
      # Failing BOTH is the finding. 40 records do, and every one passes check_adoption green
      # because its label is perfectly valid.
      #
      # Non-strict on purpose, exactly as check_adoption shipped: the backlog predates the
      # rule being written down, and a gate that fails on day one teaches people to skip it.
      # `adoption.md` had recorded this class as 48 products on 2026-08-10 and it grew while
      # sitting in prose, which is the argument for counting it here instead.
      - name: Instrument gate (every signal_type claim has what it needs to be falsifiable)
        run: uv run python -m build.check_instrument
      # How stale is every axis, per category. Informational on purpose: no --max-age-days, so
      # it prints and cannot fail. The gate at 30 days is `.github/workflows/freshness.yml`,
      # weekly, and it is the one gate here that must not run per PR — it fails on the passage
      # of time, so it would block work unrelated to the stale category and nobody could clear
      # it from inside their own PR. What this step is for is the other half: a re-read PR
      # seeing, in its own log, whether the category it just refreshed came back inside the
      # window. See docs/guides/freshness.md.
      - name: Freshness report (informational, does not gate)
        run: uv run python -m build.check_freshness

      - name: Serialize dry-run
        run: uv run python -m build.serialize --date ci-dry-run

      # The payload's own identity invariants: slugs, org_slug resolution, aliases, and
      # the freshness canary that catches a shallow-clone checkout from the inside. See
      # build/check_payload.py.
      - name: Gate the serialized payload
        run: uv run python -m build.check_payload

      # Render the notebook and parse the result. The generated file is bot-owned and is
      # not committed from a PR, but rendering is the only thing that catches a
      # contributor string breaking the generated Python: a quote in a strapline produces
      # a notebook that will not parse, and that surfaced after merge because CI
      # serialized without ever rendering.
      - name: Render notebook and check it parses
        run: |
          uv run python build/render.py
          uv run python -c "import ast, pathlib; ast.parse(pathlib.Path('notebooks/ai-stack-map.py').read_text()); print('generated notebook parses')"
          uv run marimo check notebooks/ai-stack-map.py
          git checkout -- notebooks/ai-stack-map.py

  generated-files-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if PR hand-edits bot-owned generated files
        run: |
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(build/notebook_data\.json|notebooks/ai-stack-map\.py)$' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::build/notebook_data.json and notebooks/ai-stack-map.py are regenerated by a bot on merge. Remove them from this PR (edit sources/ only)."
            exit 1
          fi
