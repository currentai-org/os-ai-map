name: registry

# The "config in" bridge: the repo declares what exists, and CI pushes that
# declaration to OSO. Nothing flows back in here. Openness is COMPUTED downstream, in the
# warehouse, and check_parity grades it against the repo; the recorded scores for all three
# axes go out from here as registry.product_scores, which is a mirror rather than a
# computation.

# One publish at a time. Tables upload individually and are then materialized, so two
# overlapping runs can commit a snapshot that is half registry and half rubric. Not
# cancel-in-progress: a half-finished upload is exactly what must not be abandoned.
concurrency:
  group: registry-publish
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "sources/**"
      # Every module the three serializers reach, transitively — not just the serializers
      # themselves. A change to build/serialize.py alters the derived scores in
      # product_scores, and a change to build/freshness_payload.py alters its freshness
      # columns, so either can change what gets published. Neither used to trigger this
      # workflow. tests/test_registry_triggers.py recomputes the import closure and fails
      # if this list falls behind it, so a new import is caught rather than remembered.
      - "build/check_freshness.py"
      - "build/check_rubric.py"
      - "build/freshness_payload.py"
      - "build/rubrics.py"
      - "build/serialize.py"
      - "build/serialize_registry.py"
      - "build/serialize_routing.py"
      - "build/serialize_rubric.py"
      - "build/serialize_scores.py"
      - "build/identity.py"
      - "build/taxonomy.py"
      - "build/validate.py"
      - "build/resolution.py"
      - "build/vocabulary.py"
      - "build/publish_registry.py"
      - "build/publish_neon.py"
      - "build/neon_schema.py"
      - "build/neon_status.py"
      - "build/notebook_data.json"
      - ".github/workflows/registry.yml"
  push:
    branches: [main]
    paths:
      - "sources/**"
      # Every module the three serializers reach, transitively — not just the serializers
      # themselves. A change to build/serialize.py alters the derived scores in
      # product_scores, and a change to build/freshness_payload.py alters its freshness
      # columns, so either can change what gets published. Neither used to trigger this
      # workflow. tests/test_registry_triggers.py recomputes the import closure and fails
      # if this list falls behind it, so a new import is caught rather than remembered.
      - "build/check_freshness.py"
      - "build/check_rubric.py"
      - "build/freshness_payload.py"
      - "build/rubrics.py"
      - "build/serialize.py"
      - "build/serialize_registry.py"
      - "build/serialize_routing.py"
      - "build/serialize_rubric.py"
      - "build/serialize_scores.py"
      - "build/identity.py"
      - "build/taxonomy.py"
      - "build/validate.py"
      - "build/resolution.py"
      - "build/vocabulary.py"
      - "build/publish_registry.py"
      - "build/publish_neon.py"
      - "build/neon_schema.py"
      - "build/neon_status.py"
      # The site tables in Neon are built from the payload, so a regeneration of it is a
      # change to what the serving layer holds.
      - "build/notebook_data.json"
  workflow_dispatch:
    inputs:
      neon_only:
        description: >-
          Load Neon from the dispatched ref and skip the OSO publish. For verifying the
          Postgres serving layer from a branch: the OSO static models are org-wide and a
          branch must not overwrite them, so a branch run publishes to Neon alone.
        type: boolean
        default: false

jobs:
  # On a PR, prove the registry is internally consistent. Structural problems
  # (a category listing a product that doesn't exist, a product in no category)
  # fail here rather than reaching OSO.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: serialize_scores builds the payload, and build.freshness_payload
          # dates each score file from its last commit. A shallow clone collapses all 522
          # onto the tip commit, and resolve_freshness refuses rather than publishing a
          # freshness field that is uniformly wrong. Same reason regenerate.yml and
          # freshness.yml pin it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check registry consistency
        run: uv run python -m build.serialize_registry --check
      # A formula rule that can never match — one testing an undeclared dimension
      # or a value outside its own enum — does not raise. It silently pushes
      # products into `otherwise`, so it has to fail here.
      - name: Check rubric consistency
        run: uv run python -m build.serialize_rubric --check
      # The adoption routing compiler: a route it cannot express is a compiler bug, and a
      # route with no instrument fails here rather than reaching OSO.
      - name: Check routing consistency
        run: uv run python -m build.serialize_routing --check
      # The fat table transcribes the payload, so this also fails if the payload itself
      # cannot be built — which is the same failure `regenerate` would hit later, caught
      # here on the PR instead.
      - name: Check the scores table builds
        run: uv run python -m build.serialize_scores --check
      # The Neon plan: which tables would be created and what type each column would get.
      # Connects to nothing and needs no secret, so it runs on a fork PR too.
      - name: Check the Neon publish plan
        run: uv run python -m build.publish_neon --check

  # On main, serialize and push. Static models are created on first run and
  # reused after, so this is safe to run on every change to sources/.
  #
  # A `workflow_dispatch` with `neon_only=true` runs the same job on the dispatched ref with
  # the OSO publish skipped. That is how the Postgres serving layer gets verified from a
  # branch: the Neon schema is swapped atomically and re-loadable, so a branch run costs
  # nothing beyond a reload, whereas the OSO static models are org-wide and a branch must not
  # overwrite them.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: serialize_scores builds the payload, and build.freshness_payload
          # dates each score file from its last commit. A shallow clone collapses all 522
          # onto the tip commit, and resolve_freshness refuses rather than publishing a
          # freshness field that is uniformly wrong. Same reason regenerate.yml and
          # freshness.yml pin it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Serialize registry
        run: uv run python -m build.serialize_registry
      - name: Serialize rubric and evidence
        run: uv run python -m build.serialize_rubric
      - name: Serialize adoption routing
        run: uv run python -m build.serialize_routing
      - name: Serialize the recorded scores
        run: uv run python -m build.serialize_scores
      # Skipped on a `neon_only` dispatch. `inputs.neon_only` is empty on a push, so the
      # negation is true there and the normal path is untouched.
      - name: Publish to OSO
        if: ${{ !inputs.neon_only }}
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
          # Org id is not sensitive, so it lives as a repo variable rather than a secret.
          OSO_ORG_ID: ${{ vars.OSO_ORG_ID }}
        run: uv run python -m build.publish_registry
      # The site's serving layer, after OSO rather than instead of it. The load goes into
      # gapmap_staging and is swapped into gapmap in one transaction, so a reader mid-request
      # sees the old schema or the new one. No `if:` guard on the secret: an absent
      # NEON_DATABASE_URL must fail this step loudly, because a publish that quietly skips
      # leaves the site serving whatever the last successful run left behind.
      - name: Publish to Neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: uv run python -m build.publish_neon
      # Read the schema back independently and put the counts in the run summary. A publish
      # returning 0 says the swap committed; this says what a reader now sees.
      - name: Report what Neon is serving
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: uv run python -m build.neon_status >> "$GITHUB_STEP_SUMMARY"
