name: registry

# The "config in" bridge: the repo declares what exists, and CI pushes that
# declaration to OSO. Nothing flows back in here. Openness is COMPUTED downstream, in the
# warehouse, and check_parity grades it against the repo; the recorded scores for all three
# axes go out from here as registry.product_scores, which is a mirror rather than a
# computation.

# Each target publishes from its own kind of run, in its own queue. A push to main publishes
# the OSO static models, serialized fresh from sources/, and nothing else. A dispatch from main
# reloads Neon from the committed payload, and nothing else; regenerate.yml sends that dispatch
# once its bot commit has landed, so Neon always loads the regenerated payload rather than the
# one committed with the merge. One OSO publish and one Neon publish per merge.
#
# One publish of a target at a time. Tables upload individually and are then materialized, so
# two overlapping OSO runs can commit a snapshot that is half registry and half rubric, and two
# Neon loads share one staging schema. Not cancel-in-progress: a half-finished upload is exactly
# what must not be abandoned.
#
# The queues are separate because GitHub keeps one pending run per group and cancels the older
# pending one when another queues. On 2026-10-03, with both targets in one group, a Neon-only
# dispatch replaced #820's waiting push run and its OSO publish never happened. Pull request
# runs and dispatches from other branches publish nothing, so each gets a group of its own and
# can never displace a production run either.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('registry-check-{0}', github.ref)
    || (github.event_name == 'push' && 'registry-oso-publish'
    || (github.ref == 'refs/heads/main' && 'registry-neon-publish'
    || format('registry-check-dispatch-{0}', github.ref))) }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "sources/**"
      # Every module the three serializers reach, transitively — not just the serializers
      # themselves. A change to build/serialize.py alters the derived scores in
      # product_scores, and a change to build/freshness_payload.py alters its freshness
      # columns, so either can change what gets published. Neither used to trigger this
      # workflow. tests/test_registry_triggers.py recomputes the import closure and fails
      # if this list falls behind it, so a new import is caught rather than remembered.
      - "build/check_freshness.py"
      - "build/check_rubric.py"
      - "build/freshness_payload.py"
      - "build/rubrics.py"
      - "build/serialize.py"
      - "build/serialize_registry.py"
      - "build/serialize_routing.py"
      - "build/serialize_rubric.py"
      - "build/serialize_scores.py"
      - "build/identity.py"
      - "build/taxonomy.py"
      - "build/validate.py"
      - "build/resolution.py"
      - "build/vocabulary.py"
      - "build/publish_registry.py"
      - "build/publish_neon.py"
      - "build/neon_schema.py"
      - "build/neon_status.py"
      - "build/notebook_data.json"
      - ".github/workflows/registry.yml"
  push:
    branches: [main]
    paths:
      - "sources/**"
      # Every module the three serializers reach, transitively — not just the serializers
      # themselves. A change to build/serialize.py alters the derived scores in
      # product_scores, and a change to build/freshness_payload.py alters its freshness
      # columns, so either can change what gets published. Neither used to trigger this
      # workflow. tests/test_registry_triggers.py recomputes the import closure and fails
      # if this list falls behind it, so a new import is caught rather than remembered.
      - "build/check_freshness.py"
      - "build/check_rubric.py"
      - "build/freshness_payload.py"
      - "build/rubrics.py"
      - "build/serialize.py"
      - "build/serialize_registry.py"
      - "build/serialize_routing.py"
      - "build/serialize_rubric.py"
      - "build/serialize_scores.py"
      - "build/identity.py"
      - "build/taxonomy.py"
      - "build/validate.py"
      - "build/resolution.py"
      - "build/vocabulary.py"
      - "build/publish_registry.py"
      - "build/publish_neon.py"
      - "build/neon_schema.py"
      - "build/neon_status.py"
      # Kept although a push no longer loads Neon: the payload transcribes into
      # registry.product_scores too. The bot's regeneration commit cannot fire this (a push
      # made with GITHUB_TOKEN starts no run); the Neon reload comes from regenerate.yml's
      # dispatch instead.
      - "build/notebook_data.json"
  # A dispatch from main reloads Neon and leaves OSO alone; from any other ref it only
  # serializes. No input decides it: a flag defaulting to false meant that forgetting
  # `-f neon_only=true` published a branch's declarations over the org-wide static models.
  # The guards are the event and the ref, which nobody can forget.
  # tests/test_registry_triggers.py pins them.
  workflow_dispatch:

jobs:
  # On a PR, prove the registry is internally consistent. Structural problems
  # (a category listing a product that doesn't exist, a product in no category)
  # fail here rather than reaching OSO.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: serialize_scores builds the payload, and build.freshness_payload
          # dates each score file from its last commit. A shallow clone collapses all 522
          # onto the tip commit, and resolve_freshness refuses rather than publishing a
          # freshness field that is uniformly wrong. Same reason regenerate.yml and
          # freshness.yml pin it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check registry consistency
        run: uv run python -m build.serialize_registry --check
      # A formula rule that can never match — one testing an undeclared dimension
      # or a value outside its own enum — does not raise. It silently pushes
      # products into `otherwise`, so it has to fail here.
      - name: Check rubric consistency
        run: uv run python -m build.serialize_rubric --check
      # The adoption routing compiler: a route it cannot express is a compiler bug, and a
      # route with no instrument fails here rather than reaching OSO.
      - name: Check routing consistency
        run: uv run python -m build.serialize_routing --check
      # The fat table transcribes the payload, so this also fails if the payload itself
      # cannot be built — which is the same failure `regenerate` would hit later, caught
      # here on the PR instead.
      - name: Check the scores table builds
        run: uv run python -m build.serialize_scores --check
      # The Neon plan: which tables would be created and what type each column would get.
      # Connects to nothing and needs no secret, so it runs on a fork PR too.
      - name: Check the Neon publish plan
        run: uv run python -m build.publish_neon --check

  # On main, serialize and push. Static models are created on first run and
  # reused after, so this is safe to run on every change to sources/.
  #
  # A push to main publishes OSO and leaves Neon alone, because the payload a push commits is
  # the one from before the bot regenerates it. A `workflow_dispatch` from main reloads Neon and
  # leaves OSO alone. From any other ref a run serializes but touches neither: the OSO static models are org-wide, and the Neon
  # schema is what aipotluck.org serves live (aipotluck.org#1350), so a branch load would reach
  # visitors within a minute. Both Neon steps are guarded, not just the publish, because the
  # secret is the owner credential and a branch's code must never be handed it. To try a
  # branch against Postgres, run `build.publish_neon --schema` into a schema of its own from a
  # terminal.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: serialize_scores builds the payload, and build.freshness_payload
          # dates each score file from its last commit. A shallow clone collapses all 522
          # onto the tip commit, and resolve_freshness refuses rather than publishing a
          # freshness field that is uniformly wrong. Same reason regenerate.yml and
          # freshness.yml pin it.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Serialize registry
        run: uv run python -m build.serialize_registry
      - name: Serialize rubric and evidence
        run: uv run python -m build.serialize_rubric
      - name: Serialize adoption routing
        run: uv run python -m build.serialize_routing
      - name: Serialize the recorded scores
        run: uv run python -m build.serialize_scores
      # Push to main only. The static models are org-wide, so a dispatch from any ref —
      # including main — leaves them alone; there is no flag to forget.
      - name: Publish to OSO
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          OSO_API_KEY: ${{ secrets.OSO_API_KEY }}
          # Org id is not sensitive, so it lives as a repo variable rather than a secret.
          OSO_ORG_ID: ${{ vars.OSO_ORG_ID }}
        run: uv run python -m build.publish_registry
      # The site's serving layer, from a dispatch on main only: regenerate.yml sends one after
      # every successful regeneration, and `gh workflow run registry.yml --ref main` is the
      # manual reload. Never from a push, whose committed payload predates the bot's
      # regeneration of it, and never from a branch. The site reads this schema live, so
      # whatever lands here is what visitors see. The load goes into os-ai-map_staging and is
      # swapped into os-ai-map in one transaction, so a reader mid-request sees the old schema or
      # the new one. No `if:` guard on the secret: an absent
      # NEON_DATABASE_URL must fail this step loudly, because a publish that quietly skips
      # leaves the site serving whatever the last successful run left behind.
      - name: Publish to Neon
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: uv run python -m build.publish_neon
      # Read the schema back independently and put the counts in the run summary. A publish
      # returning 0 says the swap committed; this says what a reader now sees. Also teed to
      # the step log, because the run summary is only readable in the web UI and this is the
      # record you want when comparing two runs from a terminal. The report carries no part
      # of the DSN, by construction — see build/neon_status.py.
      - name: Report what Neon is serving
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        # pipefail explicitly: the runner's shell is `bash -e` without it, so `tee` would
        # succeed and the step would pass over a read-back that failed.
        run: |
          set -o pipefail
          uv run python -m build.neon_status | tee -a "$GITHUB_STEP_SUMMARY"
