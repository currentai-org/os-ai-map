[project]
name = "os-ai-map"
version = "0.2.0"
description = "Open Source AI Map: curated data + modeling behind the AI Stack Map"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pyoso",
    "marimo",
    "pandas",
    "plotly",
    "jsonschema>=4.0",
    "requests>=2.34.2",
    "huggingface-hub>=1.18.0",
    "datasets>=5.0.0",
    "markdown>=3.10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "sqlglot>=30.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: hits a real external network endpoint; excluded from the fast local loop",
    "serial: mutates the real working tree in a way that collides with concurrent tests; run with -n 0",
]
