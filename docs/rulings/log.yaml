  - id: R-2026-11-03-c
    date: 2026-11-03
    by: ccerv1
    venue: pr-review
    refs: ["#975", "#953", sea-helm, indicxtreme, indicgenbench, R-2026-11-02-k]
    question: >-
      How does the record say that a suite's own items sit under a second slug, so they count in
      full rather than as imports, and how far does that ownership reach?
    ruling: >-
      A schema change in its own PR, before the depth-ladder PR: capability.own_components, a list
      of cited claims, each naming a component and optionally the languages, tasks or splits it
      covers, with omitted selectors covering every matching coverage entry. Each claim cites a
      capability.sources entry whose shows text establishes authorship or commissioned
      translation, not hosting. Validation rejects claims that overlap, selectors that match no
      coverage entry, empty selectors and citations that resolve to no source. The product's own
      slug stays its own by default. Ownership applies only after an entry's evidence is
      established, so it cannot rescue unknown provenance, an uncountable unit or a split that is
      not the official evaluation, and it never changes lineage: an owned component can still share
      ancestry with an import. The claims are scoped to what each suite made: SEA-HELM's two
      judged sets, IndicXTREME's IndicCOPA, IndicQA, IndicXParaphrase and IndicSentiment, and
      IndicGenBench's XQuAD-In in full, FLORES-In for its seven new languages only, CrossSum-In
      except the ten languages that may reuse CrossSum, and XorQA-In except Bengali and Telugu.
    reasoning: >-
      The maintainer asked for a Codex review of the representation and adopted its design.
    status: in-force
    executor: agent
