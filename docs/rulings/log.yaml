  - id: R-2026-10-08-zh
    date: 2026-10-08
    by: ccerv1
    venue: pr-review
    refs: ["#862", "#871", data_hubs]
    question: >-
      Publishing a preliminary category makes rows appear for products already researched under it,
      without their files changing. Is that a silent rewrite the corpus diff gate should fail?
    ruling: >-
      No. Rows may appear without touching their product files only when the category moves from
      preliminary to published, the product was already in that category, the rows are appearances
      rather than changes or disappearances, and they equal the rows the published category would
      produce. All stage, tier and gap checks stay active. The fix lands in its own PR, never inside
      the PR that benefits from it.
    reasoning: >-
      A preliminary category becoming published legitimately causes already-researched rows to
      appear; that is not the silent rewrite the gate is intended to catch.
    status: in-force
    executor: agent
    lands_in: [build/check_corpus_diff.py]
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/871']

