  - id: R-2026-10-08-zl
    date: 2026-10-08
    by: ccerv1
    venue: session
    refs: [gpt-4o, o-series, gpt-5, R-2026-10-08-v]
    question: >-
      R-2026-10-08-v re-governed GPT-4o and the o-series on the GPT-5 and GPT-6 series and kept their
      old adoption levels as placeholders. Is that right, given both are still live API products?
    ruling: >-
      GPT-4o and o-series remain distinct product identities while their API products remain
      available. Do not transfer adoption from successor model families onto them: GPT-4o adoption
      describes GPT-4o, o-series adoption describes o3 and o4-mini, and where no current
      model-specific measurement exists the axis abstains or is held rather than carrying an old
      level as a placeholder. Add GPT-6 as its own product, with its own adoption. When the o-series
      endpoints are withdrawn, retire o-series into the GPT-5 line; decide GPT-4o's retirement only
      when its API product actually ends.
    reasoning: >-
      GPT-4o is still an active API model with its own endpoint and snapshots, and repurposing its
      slug would break the rule that marketed product lines are distinct. o3 and o4-mini are
      deprecated with named successors but still exposed. GPT-6 is marketed as its own flagship
      family. The ChatGPT usage figure predates GPT-6, so it cannot give GPT-6 a level.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/875']

  - id: R-2026-10-09-a
    date: 2026-10-09
    by: ccerv1
    venue: pr-review
    refs: ["#878", "#723", agent_authorization]
    question: >-
      The agent-authorization sweep found 35 accepted candidates, 21 of them built for agents.
      Should agent authorization get its own category?
    ruling: >-
      Yes. Create agent_authorization as a preliminary category: software and standards that
      determine who an agent may act as, what authority it may exercise, and what resources and
      actions it may access or delegate.
    reasoning: >-
      The 21 agent-specific products alone show a coherent product cluster, not a hypothetical
      category. That they are mostly young and lightly adopted is a reason to create the
      category, not against it: there is open supply with almost no demonstrated consolidation
      or adoption, exactly the emerging infrastructure gap the map should make visible.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

  - id: R-2026-10-09-b
    date: 2026-10-09
    by: ccerv1
    venue: pr-review
    refs: ["#878", agent_authorization]
    question: >-
      Do general-purpose authorization and identity systems with agent or MCP features (OPA,
      OpenFGA, SpiceDB, Cedar, Cerbos, Keycloak, Pomerium, Casdoor, Logto, Better Auth,
      ThunderID) belong in agent_authorization?
    ruling: >-
      No. Keep agent_authorization strictly agent-specific. Name these as adjacent general-
      purpose systems in the category's boundary notes, and admit one only if its product
      identity itself becomes agent-first.
    reasoning: >-
      Otherwise the category becomes authorization software that happens to support agents, and
      the agent-native ecosystem disappears inside mature IAM infrastructure.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

  - id: R-2026-10-09-c
    date: 2026-10-09
    by: ccerv1
    venue: pr-review
    refs: ["#878", agent_authorization, agent_protocols]
    question: >-
      Do authorization standards such as OpenID AuthZEN 1.0, the IETF ID-JAG draft and WIMSE
      AIMS belong in agent_authorization or agent_protocols?
    ruling: >-
      agent_authorization. The boundary is functional: agent_protocols governs how agents
      communicate and interoperate; agent_authorization governs authority, delegation, identity
      and policy.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

  - id: R-2026-10-09-d
    date: 2026-10-09
    by: ccerv1
    venue: pr-review
    refs: ["#878", agent_authorization]
    question: >-
      Where do MCP and agent gateways (agentgateway, IBM ContextForge and others) go?
    ruling: >-
      Keep them parked. A gateway that enforces authorization is not thereby an authorization
      product, just as a connector using OAuth is not. A gateway-specific pass comes later.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

