  - id: R-2026-11-03-i
    date: 2026-11-03
    by: ccerv1
    venue: pr-review
    refs: ["#975", include-benchmark, belebele, sib-200, R-2026-11-03-c]
    question: >-
      R-2026-11-03-c lets a set claim components beyond its own slug as its own items. Can a cited
      source also withdraw a set's own slug in some languages? INCLUDE's Arabic and Turkish pools
      are ArabicMMLU's and TurkishMMLU's questions, while Belebele and SIB-200, whose lineage also
      names FLORES+ as a parent, add new questions and labels over its text.
    ruling: >-
      Cited reuse of complete evaluation items overrides own-slug ownership within the documented
      scope; newly authored questions, labels or commissioned translations remain owned despite
      shared ancestry. A parent edge alone does not decide ownership. INCLUDE's Arabic and Turkish
      count as imported; Belebele and SIB-200 stay their own.
    reasoning: >-
      Ownership follows who made the items being scored. A set that republishes another
      benchmark's questions adds no evidence of its own in that language, whatever its slug; a set
      that writes new questions over shared text does, and lineage records the ancestry either way.
