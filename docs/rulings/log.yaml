# The maintainer's rulings, in the order they were made. Append only; see README.md in this
# directory for the entry format and the rules tests/test_rulings.py enforces.
version: 1

rulings:
  - id: R-2026-09-30-a
    date: 2026-09-30
    by: ccerv1
    venue: session
    refs: [OSO-5769]
    question: >-
      How is routine gap map work split between OSO agents, Claude routines and the maintainer,
      now that the re-verification sweep is finished and the work is maintenance plus rulings?
    ruling: >-
      The repository is the source of truth, and rulings end up recorded in git. OSO is the
      inbox and the multiplayer review surface: the queue, the questions and the answers live
      there. Claude routines are the only automation that edits the repository, and they do it
      by opening draft PRs under the ADR-004 labels. Every merge, every methodology and
      category call, and every warehouse write stays with the maintainer.
    reasoning: >-
      Editorial review time is the scarce resource. Agents should bring a small batch of
      questions with a recommendation attached, not a stream of work to supervise.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

  - id: R-2026-09-30-b
    date: 2026-09-30
    by: ccerv1
    venue: session
    refs: [OSO-5769]
    question: >-
      May an OSO background agent edit the corpus directly once it technically can?
    ruling: >-
      No. Every change to sources/ goes through a PR and the gates, whoever proposes it.
    status: in-force
    executor: none
    lands_in: []
    applied_in: []

  - id: R-2026-10-08-a
    date: 2026-10-08
    by: ccerv1
    venue: issue
    refs: [OSO-6207, "#808"]
    question: >-
      check_declarations reports closed hosted services that cite their own client SDK or docs
      repository as establishing `source`, to show the service's code is not there. Should those
      repositories be declared as artifacts, or should the citations stop establishing `source`?
    ruling: >-
      Neither is declared. A closed service's client SDK or docs repository does not establish the
      service's source, so those citations drop `source` from `establishes` and stay as provenance.
      Homebrew declarations stay held.
    status: in-force
    executor: agent
    lands_in: [tests/test_check_declarations.py]
    applied_in: []
