  - id: R-2026-11-01-h
    date: 2026-11-01
    by: ccerv1
    venue: session
    refs: ["#953", R-2026-10-30-g, R-2026-10-30-m]
    question: >-
      How does provenance enter evaluation depth? Do machine-translated and generated items count, at
      full or reduced weight?
    ruling: >-
      native, human_translated and post_edited items count toward depth. machine_translated and generated
      items do not, and no reduced weights are introduced: they establish a measured zero qualifying depth.
      For mixed, only the separately documented qualifying portion counts; a mixed entry with no documented
      qualifying portion leaves depth unknown. unknown provenance leaves depth unknown; it does not
      establish a measured zero. Only machine_translated and generated establish zero qualifying depth. All
      evidence is preserved, including excluded items: zero qualifying depth does not mean a dataset has no
      evaluation value, only that its items do not satisfy this measure of credible evaluation depth. Human-reviewed
      model-generated items are not reclassified as native or post_edited: provenance describes how items
      were produced, and human validation is a separate quality attribute. If the calibration sets reveal
      well-validated synthetic evaluations that deserve credit, an explicit exception backed by evidence
      can be introduced, not an arbitrary multiplier.
    reasoning: >-
      A conservative, reproducible initial rule that leaves room to improve it.
    status: in-force
    executor: agent
    lands_in: [docs/reference/capability.md, docs/schemas/score.schema.json]
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/956']

