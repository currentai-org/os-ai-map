    ruling: >-
      Split anchors (option B). A set's cap is the higher of two: the general-scale track counts every eligible
      example against NVIDIA's Nemotron-Post-Training-Dataset-v1 (25,659,642 examples; 5 needs 10M, 4 1M, 3
      100k, 2 10k), and the human-authored track counts only verified human-authored pairs against
      databricks-dolly-15k (15,011 examples written by people on both sides, a directly comparable reference
      rather than the largest human-written set; 5 needs 10,000, 4 1,000, 3 100, 2 10). Cendol's 187 safety and
      125 identity prompts are not counted as human-authored pairs; CIDAR's roughly 891 teacher answers stay
      outside the verified count; Typhoon-S keeps its boundary exemption; WangchanThaiInstruct counts its 35,014
      paper-verified pairs and its remaining card rows are unknown; WangchanX-FLAN's 12.2k pairs stay
      human-authored but are marked as imported from WangchanThaiInstruct. The tracks are named for what they
      count, and a set's human-authored content is distinguished from content original to it. Provenance counts
      must reconcile with each total. Every existing score and peer relation is kept. No cap (option D) remains
      a baseline, not policy; R-2026-10-30-c's face-value counting is replaced for instruction data.
    reasoning: >-
      B preserves the distinction between originally human-authored instruction data and generated,
      translated or recast data without penalizing the one verified human-authored collection, and it sets
      reproducible size ceilings for future datasets while keeping the substantive rubric.
    status: in-force
    executor: agent
    lands_in: [docs/sweeps/2026-11-11-instruction-cap-dry-run.md, sources/categories/language_specific_datasets.yaml]
