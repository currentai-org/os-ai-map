rulings:
  - id: R-2026-09-30-a
    date: 2026-09-30
    by: ccerv1
    venue: session
    refs: [OSO-5769]
    question: >-
      How is routine gap map work split between OSO agents, Claude routines and the maintainer,
      now that the re-verification sweep is finished and the work is maintenance plus rulings?
    ruling: >-
      The repository is the source of truth, and rulings end up recorded in git. OSO is the
      inbox and the multiplayer review surface: the queue, the questions and the answers live
      there. Claude routines are the only automation that edits the repository, and they do it
      by opening draft PRs under the ADR-004 labels. Every merge, every methodology and
      category call, and every warehouse write stays with the maintainer.
    reasoning: >-
      Editorial review time is the scarce resource. Agents should bring a small batch of
      questions with a recommendation attached, not a stream of work to supervise.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

