    refs: ["#975", "#953", darijammlu, indicxtreme, R-2026-11-01-h]
    question: >-
      Do machine-translated items that a cited source says people reviewed count toward depth, as
      DarijaMMLU's "machine translation and manual review" and IndicXNLI's verified test items are
      described?
    ruling: >-
      Yes. This replaces R-2026-11-01-h and restates it with that one change. native,
      human_translated and post_edited items count toward depth, and so do machine_translated items
      whose cited source states that people reviewed them (human_validated true).
      machine_translated items with no such statement, and generated items whether reviewed or not,
      do not count and establish a measured zero qualifying depth, with no reduced weights. For
      mixed, only the separately documented qualifying portion counts, now including reviewed
      machine-translated items; a mixed entry with no documented qualifying portion leaves depth
      unknown. unknown provenance leaves depth unknown and does not establish a measured zero. All
      evidence is preserved, including excluded items. Provenance still describes how items were
      produced: reviewed machine translation stays machine_translated with human_validated true,
      and is not reclassified as post_edited.
