# The maintainer's rulings, in the order they were made. Append only; see README.md in this
# directory for the entry format and the rules tests/test_rulings.py enforces.
version: 1

rulings:
  - id: R-2026-09-23-a
    date: 2026-09-23
    by: ccerv1
    venue: issue
    refs: ["#384", "#412", "#671"]
    question: >-
      Historical decision, back-filled on 2026-11-08 from the issue thread, with its original
      conditions. Phase 7 retires the duplicate warehouse openness computation once the repo-owned
      trace agrees "across multiple releases", but evaluation.axis_results holds one generation,
      replaced in place on each publish. Is the condition kept and made observable through #412's
      release-scoped tables, restated as "agrees whenever checked", or met through an interim
      per-publish record?
    ruling: >-
      Phase 7 waits for release-scoped tables. The condition stays as written, agreement across
      multiple releases, and becomes observable when #412 binds release_id into the evaluation
      tables. It is not restated as "agrees whenever checked", and no interim per-publish record is
      added. #384 (Phase 7) is blocked on #412 (Phase 8). The weekly scoring-trace cadence stays,
      to keep the trace current and re-check the agreement every week.
    status: replaced
    executor: none
    lands_in: []
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/671']
    replaced_by: R-2026-11-08-t

  - id: R-2026-09-25-a
    date: 2026-09-25
    by: ccerv1
    venue: issue
    refs: ["#410", "#355", "#637", "#706", "#584"]
    question: >-
      Historical decision, back-filled on 2026-11-08 from the issue thread, with its original
      conditions. The read-time run binding from #637 lives repo-side, so the warehouse table still
      reports source_unavailable for 309 rows. Does the blocking adoption gate carry the binding into
      the warehouse (route 1, a platform change) or move repo-side to where the binding already
      exists (route 2)?
    ruling: >-
      Route 2. The gate moves repo-side, next to the read-time binding from #637; #355 closes as not
      planned and the platform ask is dropped. The blocking gate reads a repo-side reconciliation,
      not evaluation.adoption_reconciliation. An observation counts as current only when the read is
      bound to a scheduled, successful materialization of product_adoption_current within the 14-day
      binding bound; the latest scheduled fetch of its source dataset that finished before that
      materialization's run started succeeded, within the same bound, and an older success behind a
      newer failure does not count; and source_runs was captured after the bound read completed.
      Otherwise it stays source_unavailable. The evidence is per dataset, not per row, and the blind
      spot of an artifact dropped by a partial run that still reported success is accepted. The
      warehouse table keeps its source_unavailable rows as its settled state. This no longer depends
      on #584's adoption-pair publish. The gate reports first and blocks second.
    status: in-force
    executor: agent
    lands_in: [docs/architecture/data-architecture.md]
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/706']

  - id: R-2026-09-25-b
    date: 2026-09-25
    by: ccerv1
    venue: issue
    refs: ["#411", "#412", "#384"]
    question: >-
      Historical decision, back-filled on 2026-11-08 from the issue thread, with its original
      conditions. The evaluator_version cutover from the v0 sentinel re-keys the whole corpus. Does
      it run now or stay parked?
    ruling: >-
      It stays parked: nothing depends on the cutover, and it re-keys the whole corpus, so it runs
      only once something needs it. When it is unparked, it runs before release manifests (#412),
      because release_id is built from declaration_version_id, which the cutover re-keys; if #412
      landed first, release history would start on the v0 sentinel and cross-release agreement for
      #384 would span the version change. The weekly scoring-trace publish stays without
      --deploy-artifact for now, and moves to the release-backed path at the same time the cutover is
      unparked. Back-filling this decision on 2026-11-08 does not authorize the evaluator cutover.
    status: in-force
    executor: none
    lands_in: []
    applied_in: []

  - id: R-2026-09-30-a
    date: 2026-09-30
    by: ccerv1
    venue: session
    refs: [OSO-5769]
    question: >-
      How is routine gap map work split between OSO agents, Claude routines and the maintainer,
      now that the re-verification sweep is finished and the work is maintenance plus rulings?
    ruling: >-
      The repository is the source of truth, and rulings end up recorded in git. OSO is the
      inbox and the multiplayer review surface: the queue, the questions and the answers live
      there. Claude routines are the only automation that edits the repository, and they do it
      by opening draft PRs under the ADR-004 labels. Every merge, every methodology and
      category call, and every warehouse write stays with the maintainer.
    reasoning: >-
      Editorial review time is the scarce resource. Agents should bring a small batch of
      questions with a recommendation attached, not a stream of work to supervise.
    status: in-force
    executor: agent
    lands_in: []
    applied_in: []

