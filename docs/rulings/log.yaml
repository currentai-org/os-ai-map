      a bound. A macrolanguage takes what its sources measure at that level, or else its members' range, and
      never one member's value. A member that a source reports only through its macrolanguage (arb, swh, zsm,
      cmn) gets a bound, not a borrowed point value. Filipino and Tagalog stay separate codes with an
