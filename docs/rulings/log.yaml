    question: >-
      Does the depth brief's claim that a cluster count bounds a band from below still stand?
    ruling: >-
      No. The claim in docs/briefs/2026-11-02-language-depth-methodology.md that the band of the
      cluster count bounds the band from below, whatever the within-cluster correlation, is
      withdrawn. Unequal cluster sizes and within-cluster correlation can make the effective sample
      size smaller than the cluster count, so the floors the brief derived from it (FLORES+ from its
      281 articles, Belebele from its 488 passages) are not established; those count bands are
      provisional, with their uncertainty reported, as R-2026-11-02-c sets out. The brief stays as
      published, as a dated record, and this entry carries the correction.
