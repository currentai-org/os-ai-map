  - id: R-2026-11-02-t
    date: 2026-11-02
    by: ccerv1
    venue: walk-and-talk
    refs: ["#953", "#962", R-2026-11-02-e, R-2026-11-02-f]
    question: >-
      What must the schema carry so a published depth band shows its evidence status?
    ruling: >-
      A schema change in its own PR, not implemented here: every task, language and dataset depth
      band carries its evidence status, provisional, estimated or unresolved, and the status is
      published with the band at every level of aggregation, including the dataset level. An
      estimated band records the evidence R-2026-11-02-f requires (benchmark version, official
      split, evaluated models, metric, resampling unit, interval method, evidence date and each
      model's interval).
