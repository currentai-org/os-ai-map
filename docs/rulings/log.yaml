  - id: R-2026-11-01-a
    date: 2026-11-01
    by: ccerv1
    venue: session
    refs: ["#953", language_specific_eval_sets, R-2026-10-30-i, R-2026-10-30-l]
    question: >-
      Under the per-language depth ladder, how is a language with no source-stated count treated, and
      when is a set best in class?
    ruling: >-
      A missing count is unknown: never zero, and never evidence that a set is the strongest available.
      Two sets are comparable only where both have documented counts for the same language and task;
      where no comparable peer has documented evidence, the record says "no comparable evidence", not
      "best in class". A band stands only when the lowest and highest possible median bands, filling the
      unknowns either way, agree; where they span different bands the result is unresolved until more
      evidence is collected. No arbitrary completeness threshold.
    reasoning: >-
      Observed bands of 4, 4 and unknown give a median of 4 whatever the missing value is, but 5, unknown
      and unknown cannot establish a 5. A robustness test is preferable to an arbitrary completeness
      threshold.
    status: in-force
    executor: agent
    lands_in: [docs/reference/capability.md]
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/956']

