  - id: R-2026-11-10-r
    date: 2026-11-10
    by: ccerv1
    venue: pr-review
    refs: ["#1000", R-2026-11-10-n, R-2026-11-10-q]
    question: >-
      The built measurements model queried Open Library's /search.json once per MARC language code each
      quarter, at up to three requests per second. Open Library documents that endpoint and that rate for
      identified clients, but its robots.txt disallows /search. Is the scheduled API integration approved?
    ruling: >-
      Keep Open Library in the method; do not approve the scheduled API integration. Open Library's usage
      policy describes the API as intended for human-facing discovery, not as a bulk data backend, so its
      rate limit is not permission for quarterly automated harvesting. Read Open Library from a reproducible
      extract of its monthly data dumps, or obtain explicit permission for scheduled queries. Until then the
      scheduled computation omits Open Library corroboration, and Latin's Open Library-dependent verdict is
      flagged as provisional rather than treated as approved. Any future direct use must also identify the
      project with the contact address Open Library requires for its higher rate limit.
    status: in-force
    executor: agent
