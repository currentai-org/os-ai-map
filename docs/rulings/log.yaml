  - id: R-2026-10-09-h
    date: 2026-10-09
    by: ccerv1
    venue: pr-review
    refs: ["#877", base_pretrained, finetuned_chat]
    question: >-
      How should AA-LCR, Artificial Analysis's long-context benchmark, be used in the capability
      anchor?
    ruling: >-
      As secondary evidence within the Artificial Analysis anchor, not an independent tie-break.
      When long-context capability is material to a comparison, cite AA-LCR alongside the
      overall Artificial Analysis index; it does not override or move the composite band on its
      own.
    reasoning: >-
      It is current, independently run, and has open-weight models at the top, but it is already
      a component of the composite index, and treating it as a separate tie-break would double-
      count one submetric.
    status: in-force
    executor: agent
    lands_in: [sources/categories/base_pretrained.yaml, sources/categories/finetuned_chat.yaml]
    applied_in: []

  - id: R-2026-10-09-i
    date: 2026-10-09
    by: ccerv1
    venue: pr-review
    refs: ["#877", finetuned_chat]
    question: >-
      finetuned_chat's capability anchor exists only in signal_routing.yaml, not in its category
      recipe. Should the recipe state it?
    ruling: >-
      Yes. Add a capability block to finetuned_chat's scoring_recipe that makes the anchor
      explicit, mirroring the relevant base_pretrained structure without copying unrelated
      fields.
    reasoning: >-
      This is methodology drift: the category uses Artificial Analysis and LMArena logic in
      practice and in routing, but its normative recipe says nothing about capability.
    status: in-force
    executor: agent
    lands_in: [sources/categories/finetuned_chat.yaml]
    applied_in: []

