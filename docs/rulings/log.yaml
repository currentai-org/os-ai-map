  - id: R-2026-11-01-c
    date: 2026-11-01
    by: ccerv1
    venue: session
    refs: ["#953", language_specific_eval_sets, sea-helm, afrobench, indicxtreme]
    question: >-
      How is depth recorded and aggregated for a multi-task suite whose tasks use different units,
      sample sizes and sources?
    ruling: >-
      The unit of evidence is one language x task x dataset component x split. Depth is banded per task
      in comparable units against calibrated standards, then aggregated to a language-level band, and
      the median of R-2026-10-30-i stays the final aggregation across languages. Translation sentences,
      speech hours and exam questions are never added into one total, and a suite gets no extra credit
      for importing several datasets that measure the same task. Breadth of evaluated tasks is tracked
      separately and is at most a limited tiebreaker.
    reasoning: >-
      Breadth of evaluation is valuable, but it is not the same thing as depth.
