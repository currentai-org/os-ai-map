    question: >-
      What schema does the component lineage registry need?
    ruling: >-
      A schema change in its own PR, before the depth-ladder PR and not implemented here: the
      component-level lineage registry of R-2026-11-02-j, with one canonical cited record per
      component (its origin, the source collections its items come from, its parent datasets and
      the creation effort that produced its text in each language), language- and split-specific
      overrides, explicit cited pairwise relationships with a rationale, and a curation state that
      tells a genuinely unverified origin from an entry not yet curated. build.validate checks the
      registry's structure, references, identifiers and citations, and warns on a qualifying
      component with no entry.
    status: in-force
