  - id: R-2026-11-10-o
    date: 2026-11-10
    by: ccerv1
    venue: pr-review
    refs: ["#995", R-2026-11-10-c, R-2026-11-10-f]
    question: >-
      No language can read no on the official axis, because only CLDR's national list is complete by
      construction. Should CLDR's regional entries and Wikidata's subdivision statements be read together as
      a complete register, so that a language neither lists is not official?
    ruling: >-
      No. Absence from CLDR and Wikidata does not establish that a language lacks subnational official
      status, and combining two incomplete registers does not make them complete. Record not_listed when
      neither source identifies national or subnational status, and treat subnational status as unknown, not
      none, unless a complete authoritative jurisdictional source or a cited, ruled determination establishes
      otherwise. not_listed stays an evidence state, and an unresolved official axis propagates through the
      resource profile. Fewer fully resolved profiles is preferable to resolving them from unsupported
      negative evidence; explicitly labeled policy assumptions, with sensitivity analysis, can be considered
      later if coverage becomes an operational bottleneck.
    status: in-force
    executor: agent
    lands_in: [docs/reference/language-classification.md]
    applied_in: ['https://github.com/currentai-org/os-ai-map/pull/995']

